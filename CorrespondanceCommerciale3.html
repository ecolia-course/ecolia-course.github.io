{
    title: "Leçon 1 — Qu'est-ce que la correspondance commerciale ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une entreprise écrit-elle à ses clients et fournisseurs plutôt que de simplement téléphoner ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la correspondance commerciale. Comprendre son importance économique et juridique. Distinguer les grands types de lettres.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>La <strong>correspondance commerciale</strong> est l'ensemble des écrits professionnels échangés entre une entreprise et ses partenaires (clients, fournisseurs, banques, administrations). Elle sert à informer, demander, confirmer, réclamer ou régler.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Importance économique et juridique</div>
<ul>
<li><strong>Économique :</strong> elle organise les échanges, accélère les transactions, permet de négocier.</li>
<li><strong>Juridique :</strong> elle constitue une preuve écrite en cas de litige (commande, prix, conditions).</li>
</ul>
<p>Un écrit professionnel bien rédigé protège les deux parties.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Types de lettres commerciales</div>
<ul>
<li><strong>Demande de prix / de documentation.</strong></li>
<li><strong>Offre de prix / réponse à une demande.</strong></li>
<li><strong>Commande.</strong></li>
<li><strong>Accusé de réception.</strong></li>
<li><strong>Réclamation.</strong></li>
<li><strong>Relance / rappel de paiement.</strong></li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois raisons d'écrire une lettre commerciale.</p>
<p><strong>Ex. 2 :</strong> Distingue lettre de demande et lettre d'offre.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Demander un prix, passer commande, réclamer. <strong>2)</strong> Demande : le client sollicite ; offre : le fournisseur propose.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La correspondance commerciale organise et sécurise les échanges entre l'entreprise et ses partenaires.</p></div>
<div class="sources"><strong>Sources :</strong> Curriculum CG ; manuel 3e SA.</div>
    `
},
{
    title: "Leçon 2 — La présentation matérielle d'une lettre",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi la présentation d'une lettre compte-t-elle autant que son contenu ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les règles de présentation. Identifier les zones de la lettre. Corriger une lettre mal présentée.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les normes de présentation</div>
<ul>
<li><strong>Marges :</strong> régulières (généralement à gauche et à droite).</li>
<li><strong>Interlignes :</strong> suffisants pour la lisibilité.</li>
<li><strong>Police :</strong> lisible, taille standard, pas de fantaisie.</li>
<li><strong>Papier :</strong> propre, format courant (A4), sans surcharge.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les zones de la lettre</div>
<ul>
<li><strong>En-tête :</strong> nom, adresse, coordonnées de l'expéditeur.</li>
<li><strong>Coordonnées du destinataire :</strong> nom, fonction, adresse.</li>
<li><strong>Lieu et date.</strong></li>
<li><strong>Référence :</strong> numéro interne ou référence d'un dossier.</li>
<li><strong>Objet :</strong> résumé en une ligne.</li>
<li><strong>Corps de la lettre.</strong></li>
<li><strong>Signature.</strong></li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois règles de présentation matérielle.</p>
<p><strong>Ex. 2 :</strong> Repère les erreurs de présentation d'une lettre fournie (marges irrégulières, objet absent, signature déplacée).</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Marges régulières, police lisible, interlignes suffisants. <strong>2)</strong> Les erreurs sont celles qui rendent la lettre peu lisible ou incomplète.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La présentation d'une lettre est déjà un message : elle reflète le sérieux et la rigueur de l'entreprise.</p></div>
<div class="sources"><strong>Sources :</strong> Curriculum CG ; manuel 3e SA.</div>
    `
},
{
    title: "Leçon 3 — Les éléments internes de la lettre",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qu'est-ce qui rend une lettre commerciale claire et professionnelle ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier tous les éléments internes. Comprendre leur rôle. Rédiger une lettre cohérente.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Éléments indispensables</div>
<ul>
<li><strong>Formule d'appel :</strong> « Monsieur, », « Madame, », « Monsieur le Directeur, ».</li>
<li><strong>Introduction :</strong> rappel du contexte et objet de la lettre.</li>
<li><strong>Développement :</strong> informations précises, organisées en paragraphes.</li>
<li><strong>Conclusion :</strong> demande, proposition ou décision.</li>
<li><strong>Formule de politesse :</strong> « Je vous prie d'agréer, Monsieur, l'expression de… ».</li>
<li><strong>Signature :</strong> prénom, nom, fonction.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Style professionnel</div>
<ul>
<li>Phrases courtes et claires.</li>
<li>Ton courtois, jamais agressif.</li>
<li>Vouvoiement systématique.</li>
<li>Pas de familiarité, pas de jargon inutile.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Remets dans l'ordre les éléments internes d'une lettre (formule d'appel, introduction, développement, conclusion, formule de politesse, signature).</p>
<p><strong>Ex. 2 :</strong> Propose une formule d'appel et une formule de politesse pour une lettre adressée à un directeur d'école.</p>
<details><summary>Corrigé</summary>

</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une lettre professionnelle comporte tous les éléments codifiés, dans un style clair et courtois.</p></div>
<div class="sources"><strong>Sources :</strong> Curriculum CG ; manuel 3e SA.</div>
    `
},
{
    title: "Leçon 4 — La demande de prix et la réponse",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un client veut acheter des marchandises en gros. Comment demande-t-il un prix ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Rédiger une demande de prix. Rédiger une réponse (offre). Identifier les informations nécessaires.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Demande de prix</div>
<p>La <strong>demande de prix</strong> sollicite d'un fournisseur :</p>
<ul>
<li>la désignation exacte du produit ;</li>
<li>la quantité souhaitée ;</li>
<li>le prix unitaire et les conditions ;</li>
<li>le délai de livraison ;</li>
<li>les conditions de paiement.</li>
</ul>
<p>Elle comporte un objet clair (ex. : « Demande de prix — riz »), une formule d'appel, un corps précis et une formule de politesse.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Offre (réponse)</div>
<p>L'<strong>offre</strong> répond point par point à la demande :</p>
<ul>
<li>rappel de la demande ;</li>
<li>prix proposés ;</li>
<li>conditions de livraison et de paiement ;</li>
<li>durée de validité de l'offre ;</li>
<li>remerciements et formule de politesse.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite quatre informations à demander dans une demande de prix.</p>
<p><strong>Ex. 2 :</strong> Rédige une courte demande de prix pour l'achat de 20 sacs de riz.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Produit, quantité, prix, délai de livraison. <strong>2)</strong> La lettre doit préciser l'objet (« Demande de prix — 20 sacs de riz »), la quantité, le prix souhaité et le délai.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La demande de prix est précise, l'offre est structurée : le couple demande/réponse est le socle de toute négociation écrite.</p></div>
<div class="sources"><strong>Sources :</strong> Curriculum CG ; manuel 3e SA.</div>
    `
},
{
    title: "Leçon 5 — La commande et l'accusé de réception",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Après avoir accepté une offre, comment un client passe-t-il officiellement commande ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Rédiger une lettre de commande. Rédiger un accusé de réception. Éviter les erreurs qui provoquent des litiges.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La lettre de commande</div>
<p>La <strong>commande</strong> précise :</p>
<ul>
<li>référence à l'offre acceptée (numéro, date) ;</li>
<li>désignation exacte des produits ;</li>
<li>quantités ;</li>
<li>prix acceptés ;</li>
<li>délai et lieu de livraison ;</li>
<li>conditions de paiement.</li>
</ul>
<p>Un bon de commande est souvent joint.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — L'accusé de réception</div>
<p>L'<strong>accusé de réception</strong> confirme au client :</p>
<ul>
<li>que la commande a été reçue et enregistrée ;</li>
<li>le rappel des conditions acceptées ;</li>
<li>le délai de livraison prévu ;</li>
<li>les remerciements.</li>
</ul>
<p>Il protège le fournisseur et rassure le client.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois éléments indispensables d'une lettre de commande.</p>
<p><strong>Ex. 2 :</strong> Rédige un court accusé de réception confirmant une commande de 20 sacs de riz à 25 000 FC le sac.</p>
<details><summary>Corrigé</summary>

</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Commande précise et accusé de réception rapide évitent les malentendus entre client et fournisseur.</p></div>
<div class="sources"><strong>Sources :</strong> Curriculum CG ; manuel 3e SA.</div>
    `

    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« La marchandise livrée ne correspond pas à la commande. Comment réagir par écrit ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Rédiger une réclamation efficace. Répondre à une réclamation. Conclure un règlement amiable.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La réclamation</div>
