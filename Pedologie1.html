ligne à ligne. L'adaptation au niveau 1re est une simplification volontaire. Plan d'images du cours. Identifiant. Leçon. Contenu visuel. Utilité. Emplacement. Pedologie1_L1_01. L1. Schéma des horizons du sol. Formation. Slide 1, bloc théorie. Pedologie1_L2_01. L2. Carte simplifiée des grands types de sols en R D C. Diversité. Slide 2, bloc théorie. Pedologie1_L3_01. L3. Test du boudin et échelle de pH. Propriétés. Slide 3, bloc exercice. Pedologie1_L4_01. L4. Érosion ravinante à Kananga. Dégradation. Slide 4, bloc cas. Pedologie1_L5_01. L5. Cycle du compost et agroforesterie. Conservation. Slide 5, bloc exercice. Identifiants stables et cohérents avec le HTML."]],"2":[["fr","Leçon 1, Qu'est-ce que le sol? Composition et formation. Situation de départ. Un élève creuse un trou dans la cour de l'école. Il voit des couches de couleur différente. Pourquoi le sol n'est-il pas uniforme? Comment s'est-il formé? Objectifs spécifiques. Définir le sol. Identifier ses composants. Comprendre les grandes étapes de sa formation. Explication. Le sol est une couche superficielle vivante, issue de l'altération de la roche mère sous l'action du climat, des êtres vivants et du temps. Il est composé de: minéraux (sable, argile, limon); matière organique (humus); eau et air; organismes vivants. Il se forme lentement et il est fragile. [ Image Pedologie1_L1_01: schéma des horizons du sol ]. Le sol est organisé en couches appelées horizons. Notions et définitions. Sol: couche superficielle de la terre, vivante et fertile. Horizons: couches du sol. Humus: matière organique décomposée. Altération: transformation de la roche. Roche mère: roche à l'origine du sol. Exemples concrets. Couches de sol visibles dans une fosse. Humus noir en surface. Sols sableux des Bateke. Sols volcaniques du Kivu. Exercice d'application. Observe un échantillon de sol (couleur, texture, présence de racines). Dessine les couches visibles dans une petite fosse (si possible). Cite les composants du sol. Corrigé. On vérifie que: l'observation est précise; les couches sont dessinées; les composants sont cités (minéraux, humus, eau, air, organismes). À retenir. Le sol est un milieu vivant et lent à se former. Il est composé de minéraux, d'humus, d'eau, d'air et d'organismes. Sa connaissance est la base de l'agriculture. Sources utiles. Fiches de Pédologie, 2e année (composition, formation). Guide des sols en R D C (classification). Limite: l'adaptation en 1re est une simplification."]],"3":[["fr","Leçon 2, Les grands types de sols en R D C. Situation de départ. Un cultivateur du Kivu dit que son sol est noir et fertile, tandis qu'un cultivateur du plateau des Bateke dit que son sol est sableux et pauvre. Pourquoi cette différence? Objectifs spécifiques. Identifier les grands types de sols congolais. Associer un type de sol à une région et à un usage. Comprendre la diversité des sols. Explication. La R D C possède une grande diversité de sols: Ferralsols: sols rouges de la Cuvette Centrale, profonds mais pauvres en éléments nutritifs; Andosols: sols volcaniques du Kivu, fertiles mais sensibles à l'érosion; Fluvisols: sols alluviaux des vallées, riches en alluvions; sables des Bateke: sols pauvres. Chaque sol a un potentiel et des limites. [ Image Pedologie1_L2_01: carte simplifiée des grands types de sols en R D C ]. La diversité des sols impose des choix adaptés. Notions et définitions. Ferralsols: sols rouges de la Cuvette. Andosols: sols volcaniques du Kivu. Fluvisols: sols alluviaux des vallées. Sol sableux: sol pauvre des Bateke. Fertilité: capacité à nourrir les plantes. Potentiel agronomique: capacité à produire. Exemples concrets. Ferralsols de la Cuvette. Andosols des Virunga. Fluvisols du bassin du Congo. Sables des Bateke. Exercice d'application. Sur une carte simplifiée de la R D C, localise trois grands types de sols. Propose une culture adaptée à chacun. Indique un avantage et une limite de chacun. Corrigé. On vérifie que: les types sont localisés; les cultures sont adaptées (ex. manioc sur Ferralsols, maraîchage sur Andosols, riz sur Fluvisols); les avantages et limites sont cités. À retenir. La diversité des sols impose des choix adaptés. Les Andosols sont fertiles mais fragiles. Les Ferralsols sont profonds mais pauvres. Sources utiles. Fiches de Pédologie, 2e année (types de sols congolais). Guide des sols en R D C (classification INEAC ou WRB). Limite: l'adaptation en 1re est une simplification."]],"4":[["fr","Leçon 3, Les propriétés du sol: texture, structure et pH. Situation de départ. Deux sols ont le même aspect, mais l'un retient l'eau et l'autre la laisse filer. Comment expliquer cette différence? Comment le mesurer simplement? Objectifs spécifiques. Distinguer texture et structure. Réaliser un test simple de texture (test du boudin). Comprendre la notion de pH et son effet sur les cultures. Explication. La texture dépend de la proportion de sable, limon et argile: sol argileux: retient l'eau; sol sableux: laisse passer l'eau. La structure concerne l'organisation des particules. Le pH indique l'acidité: la plupart des cultures préfèrent un pH proche de la neutralité. Des tests simples permettent d'évaluer ces propriétés. [ Image Pedologie1_L3_01: test du boudin et échelle de pH ]. Des tests simples aident à connaître le sol. Notions et définitions. Texture: proportion de sable, limon et argile. Structure: organisation des particules. Test du boudin: test de la texture. pH: mesure de l'acidité. Bandelette pH: outil simple de mesure. Fertilité: capacité à nourrir les plantes. Exemples concrets. Test du boudin sur un sol argileux. Mesure du pH avec des bandelettes. Sols acides de la Cuvette. Sols volcaniques du Kivu. Exercice d'application. Réalise un test du boudin sur deux échantillons de sol. Mesure le pH avec une bandelette (démonstration encadrée). Interprète le résultat. Corrigé. On vérifie que: le test du boudin est réalisé; le pH est mesuré et interprété; l'élève identifie le type de sol et l'effet du pH sur les cultures. À retenir. Les propriétés du sol déterminent les cultures possibles. Des tests simples aident à les connaître. Le pH influence la disponibilité des nutriments. Sources utiles. Fiches de Pédologie, 2e année (propriétés, test du boudin, pH). Limite: l'adaptation en 1re est une simplification."]],"5":[["fr","Leçon 4, La dégradation des sols: érosion et perte de fertilité. Situation de départ. Sur une pente, le sol est nu et des rigoles apparaissent après chaque pluie. La terre fertile disparaît. Que se passe-t-il? Peut-on arrêter ce phénomène? Objectifs spécifiques. Identifier les causes de la dégradation des sols. Comprendre le processus de l'érosion. Reconnaître les signes de dégradation. Explication. L'érosion emporte la couche fertile du sol, surtout quand le sol est nu et en pente. La déforestation et la surexploitation aggravent le phénomène. Les signes sont visibles: rigoles; ravines; sols appauvris. L'érosion ravinante est un problème majeur à Kananga et Kikwit. [ Image Pedologie1_L4_01: érosion ravinante à Kananga ]. L'érosion ravinante détruit les sols. Notions et définitions. Érosion: emportement de la couche fertile. Érosion hydrique: par l'eau. Érosion éolienne: par le vent. Érosion ravinante: formation de ravines. Déforestation: disparition de la forêt. Surexploitation: culture excessive. Exemples concrets. Érosion ravinante à Kananga et Kikwit. Pentes du Kivu. Déforestation autour de Kinshasa. Sols de savane appauvris au Kwango. Exercice d'application. Observe les signes d'érosion autour de l'école (si possible) ou sur des photos. Identifie deux causes. Identifie deux conséquences. Corrigé. On vérifie que: les signes sont identifiés; les causes sont citées (pente, sol nu, déforestation); les conséquences sont citées (perte de fertilité, ravines). À retenir. La dégradation des sols est un processus. L'érosion est favorisée par la pente et l'absence de couverture. Il faut agir à temps. Sources utiles. Fiches de Pédologie, 2e année (dégradation, érosion). Fiches d'Agriculture générale (durabilité). Limite: l'adaptation en 1re est une simplification."]],"6":[["fr","Leçon 5, Conserver et améliorer le sol: compost, couverture et agroforesterie. Situation de départ. Une parcelle épuisée ne produit presque plus. Le cultivateur n'a pas d'argent pour acheter des engrais. Que peut-il faire avec les ressources locales? Objectifs spécifiques. Comprendre les principes de la conservation des sols. Connaître des pratiques accessibles. Proposer un plan simple pour améliorer un sol dégradé. Explication. La conservation repose sur des pratiques simples: compost: apporter de la matière organique; couverture du sol: protéger de l'érosion; agroforesterie: associer arbres et cultures; rotation: alterner les cultures. Ces pratiques restaurent la fertilité sans engrais chimiques. Elles sont accessibles et durables. [ Image Pedologie1_L5_01: cycle du compost et agroforesterie ]. Conserver le sol est un investissement pour l'avenir. Notions et définitions. Conservation des sols: ensemble des pratiques pour préserver le sol. Compost: engrais organique issu de déchets décomposés. Couverture végétale (mulch): protection par des résidus. Agroforesterie: association arbres-cultures. Rotation: alternance des cultures. Agriculture de conservation: pratiques durables. Exemples concrets. Compost à base de déchets organiques. Couverture du sol par des résidus de maïs. Agroforesterie sur les pentes du Kivu. Rotation des cultures. Exercice d'application. Conçois un plan simple de conservation pour une parcelle (3 pratiques, matériel local, calendrier). Explique l'effet attendu. Indique un avantage pour la sécurité alimentaire. Corrigé. On vérifie que: le plan est réaliste; les pratiques sont adaptées; l'effet est expliqué; l'avantage pour la sécurité alimentaire est cité. À retenir. Conserver le sol est un investissement pour l'avenir. Les solutions locales existent. La fertilité peut être restaurée. Sources utiles. Fiches de Pédologie, 2e année (conservation, agroforesterie). Fiches d'Agriculture générale (durabilité). Limite: l'adaptation en 1re est une simplification."]],"7":[["fr","Évaluation finale, Pédologie. Évaluation finale. 36 questions à choix multiple. Une seule réponse est correcte par question. Choisis la réponse qui te semble juste, puis valide."]]}};

      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; }
      else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }

    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }

    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial"
        ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet."
        : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
