utaire. Limites documentaires. Les fiches de 4e année ont été consultées. Aucun programme de 1re spécifique au tourisme n'a été identifié. L'adaptation au niveau 12-14 ans est une simplification. Plan d'images du cours. Identifiant. Leçon. Contenu visuel. Utilité. Emplacement. Tourisme1_L1_01. L1. Définition illustrée du tourisme. Notions de base. Slide 1, bloc théorie. Tourisme1_L2_01. L2. Carte de la R D C avec parcs, fleuve et lacs. Localisation. Slide 2, bloc exercice. Tourisme1_L3_01. L3. Tissus Kuba et sculptures Luba. Patrimoine culturel. Slide 3, bloc théorie. Tourisme1_L4_01. L4. Modèle de fiche technique de circuit. Planification. Slide 4, bloc exercice. Tourisme1_L5_01. L5. Schéma des impacts du tourisme. Tourisme durable. Slide 5, bloc théorie. Identifiants stables et cohérents avec le HTML."]],"2":[["fr","Leçon 1, Qu'est-ce que le tourisme? Définition et formes. Situation de départ. Un visiteur étranger arrive à Kinshasa et demande: « Que puis-je visiter en R D C? » Un élève ne sait pas quoi répondre. Que devrait-il savoir? Objectifs spécifiques. Définir le tourisme. Distinguer tourisme, écotourisme et tourisme culturel. Comprendre pourquoi le tourisme est important pour un pays. Explication. Le tourisme est l'ensemble des activités liées aux voyages et aux séjours. Il peut être: de loisir; culturel (arts, traditions); écologique (nature, protection de l'environnement). En R D C, le tourisme est un levier de développement: il crée des emplois, valorise le patrimoine et attire des devises. Mais il doit être respectueux des communautés et de l'environnement. [ Image Tourisme1_L1_01: définition illustrée du tourisme ]. Le tourisme repose sur la découverte et le respect du territoire. Notions et définitions. Tourisme: activités liées aux voyages et séjours. Touriste: personne qui voyage pour le plaisir. Écotourisme: tourisme respectueux de la nature. Tourisme culturel: tourisme lié aux arts et traditions. Tourisme communautaire: tourisme géré par les communautés. Impact économique: effet sur l'économie. Exemples concrets. Tourisme dans les parcs nationaux (Virunga). Tourisme culturel (art Kuba, festivals). Écotourisme communautaire. Exercice d'application. Liste trois raisons de visiter la R D C. Distingue, dans une liste, ce qui relève du tourisme, de l'écotourisme et du tourisme culturel. Explique en deux phrases pourquoi le tourisme est important. Corrigé. 1. Exemples: parcs naturels, culture, artisanat. 2. Tourisme: voyage en général. Écotourisme: visite d'un parc avec respect de la nature. Tourisme culturel: visite d'un atelier d'artisanat. 3. Le tourisme crée des emplois et valorise le patrimoine. À retenir. Le tourisme est une activité économique et culturelle. Il repose sur la connaissance et le respect du territoire. Il existe plusieurs formes de tourisme. Sources utiles. Fiches de Géographie Touristique, 4e année (définition, formes). Limite: l'adaptation en 1re est une simplification."]],"3":[["fr","Leçon 2, Les grands sites naturels: parcs, fleuves et lacs. Situation de départ. Un touriste veut voir des gorilles et des volcans. Où doit-il aller en R D C? Quels parcs visiter? Objectifs spécifiques. Localiser les principaux parcs nationaux. Situer le fleuve Congo et les grands lacs. Comprendre leur importance écologique et touristique. Explication. La R D C possède une richesse naturelle exceptionnelle: parc des Virunga: volcans, gorilles; parc de Salonga: forêt équatoriale; parc de Garamba: faune sauvage; fleuve Congo: transport et biodiversité; lacs Kivu et Tanganyika: sites majeurs. Ces espaces sont protégés et attirent des visiteurs du monde entier. [ Image Tourisme1_L2_01: carte de la R D C avec parcs, fleuve et lacs ]. Les sites naturels de la R D C sont un patrimoine à protéger. Notions et définitions. Parc national: espace protégé pour la nature. Réserve naturelle: zone protégée. Biodiversité: variété des espèces vivantes. Fleuve: cours d'eau important. Lac: étendue d'eau douce. Volcan: montagne qui peut entrer en éruption. Exemples concrets. Parc des Virunga (volcans, gorilles). Parc de Salonga. Fleuve Congo. Lac Kivu. Exercice d'application. Sur une carte muette de la R D C, localise trois parcs. Situe le fleuve Congo et deux lacs. Associe chaque site à un attrait touristique. Corrigé. On vérifie que: les parcs (Virunga, Salonga, Garamba) sont localisés; le fleuve Congo et les lacs Kivu et Tanganyika sont placés; chaque site est associé à un attrait (gorilles, forêt, transport, baignade). À retenir. Les sites naturels sont un patrimoine à protéger et à valoriser. Les parcs nationaux attirent les touristes. Le fleuve et les lacs sont des sites majeurs. Sources utiles. Fiches de Géographie Touristique, 4e année (parcs, cours d'eau, lacs). Limite: l'adaptation en 1re est une simplification."]],"4":[["fr","Leçon 3, Le patrimoine culturel: arts, artisanat et traditions. Situation de départ. Un touriste s'intéresse à l'artisanat local. Où peut-il en trouver? Quelles sont les traditions artistiques de la R D C? Objectifs spécifiques. Identifier des formes de patrimoine culturel congolais. Comprendre leur valeur touristique. Proposer une expérience culturelle simple. Explication. Le patrimoine culturel congolais est riche: tissus Kuba; sculptures Luba; masques Pende; artisanat local; festivals. Ces éléments attirent les touristes et font vivre les communautés. Le tourisme culturel permet de partager et de valoriser ces traditions. [ Image Tourisme1_L3_01: tissus Kuba et sculptures Luba ]. La culture est une ressource touristique et une fierté nationale. Notions et définitions. Patrimoine culturel: héritage artistique et culturel. Art traditionnel: formes artistiques héritées. Artisanat: objets fabriqués à la main. Festival: événement culturel. Tradition: pratique transmise. Tourisme culturel: tourisme lié à la culture. Exemples concrets. Tissus Kuba. Sculptures Luba. Artisanat de Kinshasa. Festivals de Gungu. Exercice d'application. Associe trois formes d'art traditionnel à une région. Propose une mini-expérience culturelle pour un touriste. Explique pourquoi le tourisme culturel est important. Corrigé. 1. Exemples: tissus Kuba (Kasaï), sculptures Luba (Kasaï), masques Pende (Kwilu). 2. Exemple: visite d'un atelier d'artisanat, participation à un festival. 3. Il valorise les traditions et fait vivre les communautés. À retenir. La culture est une ressource touristique. Elle est aussi une fierté nationale. Le tourisme culturel doit respecter les communautés. Sources utiles. Fiches de Géographie Touristique, 4e année (géographie humaine et culturelle). Limite: l'adaptation en 1re est une simplification."]],"5":[["fr","Leçon 4, Lire une carte touristique et proposer un mini-circuit. Situation de départ. Un groupe d'élèves veut organiser une sortie scolaire dans la région. Comment choisir les étapes et les moyens de transport? Où trouver les informations? Objectifs spécifiques. Lire une carte touristique simple. Identifier les étapes d'un circuit. Proposer un mini-circuit dans sa région. Explication. Un circuit touristique se construit à partir d'une carte: on repère les sites; on estime les distances; on choisit les étapes et les moyens de transport. La fiche technique décrit le programme, les horaires et les coûts. Même simple, un circuit doit être réaliste et adapté au public. [ Image Tourisme1_L4_01: modèle de fiche technique de circuit ]. La carte est un outil de planification. Notions et définitions. Carte touristique: carte qui indique les sites. Circuit: itinéraire avec des étapes. Itinéraire: chemin à suivre. Étape: lieu ou moment du circuit. Moyen de transport: véhicule utilisé. Fiche technique de circuit: document qui décrit le circuit. Exemples concrets. Circuit dans les Virunga. Visite des chutes de Zongo. Circuit culturel à Kinshasa. Exercice d'application. À partir d'une carte simplifiée de ta région, propose un mini-circuit de deux jours. Indique les sites, le transport et l'hébergement. Présente la fiche technique. Corrigé. On vérifie que: le circuit est cohérent; les sites sont identifiés; le transport et l'hébergement sont précisés; la fiche est lisible. À retenir. La carte est un outil de planification. Un circuit réussi repose sur la connaissance du terrain. La fiche technique est essentielle. Sources utiles. Fiches de Géographie Touristique, 4e année (conception de circuits). Limite: l'adaptation en 1re est une simplification."]],"6":[["fr","Leçon 5, Tourisme durable et bénéfices pour les communautés. Situation de départ. Un projet touristique s'installe près d'un village. Les habitants se demandent s'ils en bénéficieront ou s'ils seront déplacés. Comment concilier tourisme et bien-être des communautés? Objectifs spécifiques. Comprendre les principes du tourisme durable. Identifier les bénéfices et les risques pour les communautés. Proposer des actions pour un tourisme respectueux. Explication. Le tourisme peut être une chance pour les communautés s'il est bien planifié: création d'emplois, valorisation de l'artisanat, amélioration des infrastructures. Mais il peut aussi causer des nuisances (déplacements, pollution, acculturation). Le tourisme durable implique la participation des habitants et le respect de l'environnement. [ Image Tourisme1_L5_01: schéma des impacts du tourisme ]. Le tourisme durable est un équilibre. Notions et définitions. Tourisme durable: tourisme respectueux de l'environnement et des communautés. Écotourisme: tourisme orienté vers la nature. Tourisme communautaire: tourisme géré par la communauté. Impact social: effet sur la société. Impact environnemental: effet sur l'environnement. Participation locale: implication des habitants. Exemples concrets. Écotourisme dans les Virunga avec implication des communautés. Tourisme communautaire dans les villages. Risques de conflits autour des parcs. Exercice d'application. Liste deux bénéfices et deux risques du tourisme pour une communauté. Propose trois règles pour un tourisme respectueux. Explique pourquoi les communautés doivent participer. Corrigé. 1. Bénéfices: emplois, valorisation de l'artisanat. Risques: déplacement, pollution. 2. Règles: respecter la nature, impliquer les habitants, partager les revenus. 3. Parce qu'elles sont les premières concernées et que leur participation garantit la durabilité. À retenir. Le tourisme durable est un équilibre. La participation des communautés est essentielle. Le respect de l'environnement est une condition. Sources utiles. Fiches de Géographie Touristique, 4e année (écotourisme, tourisme culturel). Limite: l'adaptation en 1re est une simplification."]],"7":[["fr","Évaluation finale, Tourisme et Géographie touristique. Évaluation finale. 36 questions à choix multiple. Une seule réponse est correcte par question. Choisis la réponse qui te semble juste, puis valide."]]}};

      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; }
      else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }

    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }

    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial"
        ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet."
        : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
