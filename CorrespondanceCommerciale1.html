{
    title: "Leçon 1 — Qu'est-ce que la correspondance commerciale ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une entreprise écrit-elle à ses clients, fournisseurs, partenaires ? Quels sont les documents écrits qu'elle utilise ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la correspondance commerciale. Distinguer ses formes. Comprendre son rôle. Prérequis : maîtrise du français écrit (grammaire, orthographe, syntaxe).</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>correspondance commerciale</strong> est l'ensemble des écrits échangés entre une entreprise et ses partenaires (clients, fournisseurs, banques, administrations, personnel).</p>
<p><strong>Formes :</strong> lettres, courriels, notes de service, comptes rendus, procès-verbaux, rapports, devis, bons de commande, factures, lettres de relance, communiqués.</p>
<p><strong>Fonctions :</strong> informer, demander, répondre, négocier, réclamer, relancer, confirmer, remercier.</p>
<p><strong>Rôle :</strong> elle engage l'entreprise (image, réputation, preuve juridique), facilite la communication, garde trace des échanges, structure la relation commerciale.</p>
<p><strong>Qualités :</strong> clarté, concision, courtoisie, exactitude, pertinence, présentation soignée.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Correspondance commerciale :</strong> ensemble des écrits commerciaux. <strong>Clarté :</strong> compréhension facile. <strong>Concision :</strong> brièveté. <strong>Courtoisie :</strong> politesse. <strong>Exactitude :</strong> informations vérifiées.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier l'objectif de l'écrit (informer, demander, réclamer). Adapter le ton, le registre, la longueur au destinataire. Structurer le message (introduction, corps, conclusion). Vérifier l'orthographe, la ponctuation, la présentation.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une entreprise écrit à un fournisseur pour commander des marchandises à l'aide d'un bon de commande précis. Elle envoie une lettre de réclamation si la livraison est incorrecte. Elle adresse une facture au client. Un client écrit une lettre de réclamation pour un produit défectueux ; l'entreprise répond par une lettre d'excuses et une solution.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis la correspondance commerciale.</p>
<p><strong>Ex. 2 :</strong> Cite trois qualités d'une bonne correspondance.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> L'ensemble des écrits échangés entre une entreprise et ses partenaires.</p>
<p><strong>2)</strong> Clarté, concision, courtoisie (3 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La correspondance commerciale est la voix écrite de l'entreprise ; elle exige rigueur et courtoisie.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques 2025 ; Cours-de-Gestion.fr.</div>
    `
},
{
    title: "Leçon 2 — La structure de la lettre commerciale",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Quelles sont les parties d'une lettre commerciale ? Dans quel ordre les disposer ? Que doit contenir l'en-tête ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les parties de la lettre. Les disposer correctement. Rédiger une lettre simple. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une lettre commerciale comporte plusieurs parties :</p>
<ol>
<li><strong>En-tête</strong> (coordonnées de l'expéditeur) : nom, adresse, téléphone, courriel, numéro RCCM (pour les sociétés).</li>
<li><strong>Lieu et date</strong> : lieu d'émission et date complète.</li>
<li><strong>Coordonnées du destinataire</strong> : nom, fonction, adresse.</li>
<li><strong>Références</strong> (facultatif) : numéro de dossier, objet, pièces jointes.</li>
<li><strong>Objet</strong> : résumé du contenu en une ligne.</li>
<li><strong>Formule d'appel</strong> : « Monsieur le Directeur, », « Madame, », « Monsieur, ».</li>
<li><strong>Corps</strong> : introduction (raison de l'écrit), développement (informations, demande), conclusion (demande d'action, remerciements).</li>
<li><strong>Formule de politesse</strong> : « Je vous prie d'agréer, Monsieur le Directeur, l'expression de mes salutations distinguées. »</li>
<li><strong>Signature</strong> : nom, prénom, fonction, signature manuscrite.</li>
<li><strong>Pièces jointes</strong> (facultatif) : liste des documents joints.</li>
</ol>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>En-tête :</strong> coordonnées de l'expéditeur. <strong>Objet :</strong> résumé du contenu. <strong>Formule d'appel :</strong> début de la lettre. <strong>Formule de politesse :</strong> fin de la lettre. <strong>Pièces jointes :</strong> documents joints.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Présenter proprement : marges, alignement, lisibilité. Rédiger l'objet clairement. Respecter l'ordre des parties. Signer la lettre (manuscrit ou signature électronique). Joindre les documents nécessaires.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une lettre de commande comporte : en-tête de l'acheteur, date, coordonnées du fournisseur, objet (« Commande de 100 sacs de ciment »), formule d'appel (« Monsieur, »), corps (« Nous vous prions de bien vouloir nous livrer… »), formule de politesse, signature. Une lettre de réclamation comporte les mêmes parties ; le corps exprime le problème et la demande de solution.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois parties de la lettre commerciale.</p>
<p><strong>Ex. 2 :</strong> Pourquoi faut-il rédiger un objet clair ?</p>

<p><strong>1)</strong> En-tête, objet, formule de politesse (3 au choix).</p>
<p><strong>2)</strong> Pour permettre au destinataire de comprendre immédiatement le sujet de la lettre.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La structure de la lettre commerciale obéit à des règles précises ; sa maîtrise facilite la communication.</p></div>

{
    title: "Leçon 3 — Les formules de politesse et le registre",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment terminer une lettre ? Que dire à un directeur, à un client, à un fournisseur ? Quel registre utiliser ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les principales formules de politesse. Choisir la formule adaptée. Respecter le registre. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les <strong>formules de politesse</strong> sont des formules codifiées qui terminent la lettre. Elles doivent être adaptées au destinataire et à la situation.</p>
<p><strong>Formules d'appel :</strong> « Monsieur, » / « Madame, » (usage courant) ; « Monsieur le Directeur, » / « Madame la Directrice, » (hiérarchie) ; « Maître, » (avocat, notaire) ; « Monsieur le Ministre, » / « Excellence, » (hautes autorités).</p>
<p><strong>Formules de politesse finales :</strong> « Je vous prie d'agréer, Monsieur, l'expression de mes salutations distinguées. » ; « Veuillez agréer, Madame, l'expression de mes sentiments respectueux. » ; « Cordialement, » (courriel) ; « Bien à vous, » (relation amicale).</p>
<p><strong>Registre :</strong> courant ou soutenu pour les lettres officielles, courant pour les courriels, jamais familier dans un contexte commercial.</p>
<p><strong>Erreurs à éviter :</strong> formules incomplètes (sans mention du destinataire), formules trop longues, familiarité, anglicismes.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Formule de politesse :</strong> formule codifiée. <strong>Registre :</strong> niveau de langue. <strong>Destinataire :</strong> personne à qui on écrit. <strong>Courtoisie :</strong> politesse.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier le destinataire (supérieur, client, fournisseur). Choisir la formule adaptée. Respecter le registre. Ne pas mélanger les registres.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>À un directeur : « Je vous prie d'agréer, Monsieur le Directeur, l'expression de ma haute considération. » À un client : « Je vous prie d'agréer, Madame, l'expression de mes salutations distinguées. » Dans un courriel : « Cordialement, » suffit souvent.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle formule utiliser pour un directeur ?</p>
<p><strong>Ex. 2 :</strong> Quelles erreurs éviter ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> « Je vous prie d'agréer, Monsieur le Directeur, l'expression de ma haute considération. »</p>
<p><strong>2)</strong> Formules incomplètes, familiarité, mélange de registres.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les formules de politesse et le registre adapté sont essentiels au professionnalisme.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques 2025 ; Cours-de-Gestion.fr.</div>
    `

    title: "Leçon 4 — La note de service",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment informer le personnel d'une décision ? Comment transmettre une consigne interne ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la note de service. Connaître sa structure. Rédiger une note simple. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>note de service</strong> est un écrit interne par lequel la direction ou un responsable transmet une information, une instruction ou une décision au personnel.</p>
<p><strong>Caractères :</strong> interne, hiérarchique (sens descendant), brève, opérationnelle.</p>
<p><strong>Structure :</strong></p>
<ol>
<li>En-tête : nom de l'entreprise, service émetteur.</li>
<li>Numéro et date.</li>
<li>Destinataires : « À tout le personnel », « Au service comptabilité ».</li>
<li>Objet : résumé clair.</li>
<li>Corps : information ou instruction, en style direct et concis.</li>
<li>Signature : nom, fonction du responsable.</li>
</ol>
<p><strong>Style :</strong> impersonnel, direct, sans formule de politesse longue.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Note de service :</strong> écrit interne d'information. <strong>Hiérarchie :</strong> sens descendant. <strong>Opérationnel :</strong> pratique.</p>

<p>Le <strong>courriel professionnel</strong> est un écrit électronique utilisé dans un contexte professionnel. Il doit respecter les règles de la correspondance écrite : clarté, concision, courtoisie, exactitude.</p>
<p><strong>Structure :</strong></p>
<ol>
<li>Objet clair et précis (obligatoire).</li>

<li>Formule de clôture : « Cordialement, », « Bien à vous, ».</li>
<li>Signature : nom, fonction, coordonnées.</li>
<li>Pièces jointes : nommées, vérifiées, mentionnées dans le corps.</li>
</ol>
<p><strong>Règles :</strong> pas de majuscules criardes, pas d'émojis dans un cadre formel, relecture avant envoi, réponse dans un délai raisonnable.</p>
<p><strong>WhatsApp professionnel :</strong> messages courts, clairs, sans abréviations incompréhensibles, sans emojis excessifs, sans messages tardifs, dans un groupe dédié.</p>

  var HAS_CACHE = !!(window.caches && window.caches.open);
  var NATIVE = false;
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  var LATER = "ecolia_audio_later_" + CFG.code;
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function init() {
    if (document.getElementById("ecolia-audio-btn")) return;
    var btn = document.createElement("button");
    btn.id = "ecolia-audio-btn"; btn.type = "button"; btn.className = "ecolia-off";
    btn.setAttribute("aria-label", "Écouter la leçon"); btn.innerHTML = PLAY;
    var dlBtn = document.createElement("button");
    dlBtn.id = "ecolia-dl-btn"; dlBtn.type = "button"; dlBtn.className = "ecolia-off";
    dlBtn.innerHTML = DL;
    var host = document.querySelector(".header-right");
    if (host) { host.insertBefore(dlBtn, host.firstChild); host.insertBefore(btn, dlBtn); }
    else { btn.className += " ecolia-fixed"; document.body.appendChild(btn); }
    var banner = document.createElement("div");
    banner.id = "ecolia-audio-banner";
    banner.innerHTML = '<span class="eab-txt"></span><span class="eab-act"></span><div class="eab-bar"><i></i></div>';
    var content = document.getElementById("content");
    if (content && content.parentNode) content.parentNode.insertBefore(banner, content);
    else document.body.insertBefore(banner, document.body.firstChild);
    var txtEl = banner.querySelector(".eab-txt"), actEl = banner.querySelector(".eab-act");
    var barEl = banner.querySelector(".eab-bar"), barI = barEl.firstChild;
    var audio = new Audio();
    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }
    function cur() { try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {} return 0; }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
