ne et s'use. Métrologie et RDM: deux fonctions complémentaires. Métrologie: science de la mesure. Elle vérifie que la pièce fabriquée respecte les dimensions et tolérances prévues. Résistance des Matériaux (RDM): science qui étudie l'équilibre des corps solides déformables. Elle vérifie qu'une pièce résiste aux efforts qu'elle subit. Démarche qualité. Concevoir (RDM), donc fabriquer (usinage), donc contrôler (métrologie). Un sous-dimensionnement conduit à la rupture; un défaut de mesure conduit au rebut d'une pièce correcte. À retenir. La métrologie contrôle la conformité; la RDM garantit la tenue mécanique. Les deux forment le socle du contrôle qualité en mécanique."]],"3":[["fr","Leçon 2, Instruments de métrologie (1 sur 2). Le réglet et le mètre ruban. Précision de l'ordre du millimètre. Utilisés pour des mesures rapides, sans grande exigence. Le pied à coulisse. Il permet de mesurer des dimensions extérieures, intérieures et des profondeurs. Sa précision dépend du vernier: 1 sur 10 millimètres: vernier de 10 divisions; 1 sur 20 millimètres: vernier de 20 divisions; 1 sur 50 millimètres: vernier de 50 divisions (le plus précis des pieds à coulisse manuels). Lecture: on lit d'abord la graduation principale avant le zéro du vernier, puis la division du vernier qui coïncide avec une graduation principale. La cote égale (lecture principale) plus (n multiplié par précision). Image de référence: MR3_IMG01, schéma de lecture du pied à coulisse et du micromètre."]],"4":[["fr","Leçon 2, Le micromètre (2 sur 2). Le micromètre (palmer). Instrument de haute précision (généralement 1 sur 100 millimètres). Il comprend un corps, une vis micrométrique, un tambour gradué (50 divisions) et un bouton de friction pour contrôler l'effort de mesure. Lecture. Manchon fixe: graduations en mm et demi-mm. Tambour tournant: 50 divisions; chaque division égale 0,01 millimètres. Exemple: manchon indique 12,5 millimètres; tambour indique 27, donc mesure égale 12,5 plus 0,27 égale 12,77 millimètres. Exercice de lecture. Un micromètre affiche: manchon égale 8 millimètres; tambour égale 32. Quelle est la mesure? Corrigé. Mesure égale 8 plus (32 multiplié par 0,01) égale 8,32 millimètres. À retenir. Pied à coulisse: 1 sur 10, 1 sur 20 ou 1 sur 50 millimètres. Micromètre: 1 sur 100 millimètres. La lecture se fait en deux temps: partie principale plus vernier ou tambour."]],"5":[["fr","Leçon 3, Le comparateur et le contrôle. Le comparateur. Instrument à cadran à aiguille, utilisé pour des mesures par comparaison: on étalonne l'instrument sur une cote de référence, puis on mesure l'écart de la pièce. Précision courante: 0,01 millimètres ou 0,001 millimètres. Applications. Contrôle de la rectitude (planéité, cylindricité). Mesure du battement d'un arbre en rotation. Vérification de cotes après rectification. Mesures de contrôle. Calibre à mâchoires: passe ou ne passe pas, contrôle rapide en série. Jauges et gabarits: vérification de formes. Colonnes de mesure: hauteur et perpendicularité. À retenir. Le comparateur mesure un écart à une référence. Les calibres \"passe ou ne passe pas\" permettent un contrôle rapide en production."]],"6":[["fr","Leçon 4, Tolérances et ajustements. Notion de tolérance. Aucune fabrication n'est parfaite: une cote réelle s'écarte toujours de la cote nominale. La tolérance encadre ces écarts: cote maximale (CM) et cote minimale (Cm). La tolérance IT égale CM moins Cm. Écarts et alésage ou arbre. Alésage: dimension intérieure (trou). Arbre: dimension extérieure (axe). Écart supérieur (ES) égale CM moins cote nominale. Écart inférieur (EI) égale Cm moins cote nominale. Ajustements. Ajustement avec jeu: l'alésage est toujours plus grand que l'arbre. Ajustement avec serrage: l'arbre est toujours plus grand que l'alésage. Ajustement incertain: jeu ou serrage selon les pièces effectivement réalisées. Application. Un ajustement H7/g6 désigne un alésage H7 (écart inférieur 0) et un arbre g6 (écart supérieur négatif): ajustement avec jeu. À retenir. Tolérance égale CM moins Cm. Les ajustements H ou g, H ou h, H ou p désignent respectivement jeu, incertain, serrage."]],"7":[["fr","Leçon 5, Introduction à la RDM (1 sur 2). Objet de la RDM. La RDM étudie l'équilibre des corps solides déformables: elle permet de choisir les dimensions d'une pièce pour qu'elle résiste aux efforts sans se déformer excessivement. Contrainte. La contrainte σ (sigma) mesure l'effort par unité de surface: σ égale F ou S. σ: contrainte (Pa, ou MPa égale 10⁶ Pa). F: effort normal (N). S: section de la pièce (m au carré, ou mm au carré ). 1 MPa égale 1 N ou mm au carré (raccourci très utilisé). Image de référence: MR3_IMG02, diagramme contrainte-déformation simplifié."]],"8":[["fr","Leçon 5, Déformation élastique et loi de Hooke (2 sur 2). Déformation. Sous l'effet de la contrainte, la pièce se déforme: elle s'allonge (traction) ou se raccourcit (compression). La déformation relative est: ε égale ΔL ou L0 (sans unité). Loi de Hooke. Dans le domaine élastique (la pièce reprend sa forme après suppression de l'effort): σ égale E multiplié par ε. E: module d'Young (Pa). Exemples indicatifs: acier environ égal à 210 000 MPa; aluminium environ égal à 70 000 MPa. Allongement: ΔL égale F multiplié par L0 ou (E multiplié par S). Diagramme contrainte-déformation. Zone élastique (droite de Hooke), puis zone plastique (déformation permanente), puis rupture. La limite d'élasticité Re sépare les deux domaines. À retenir. σ égale F ou S; ε égale ΔL ou L0; loi de Hooke σ égale E multiplié par ε dans le domaine élastique. Au-delà de la limite d'élasticité, la déformation devient permanente."]],"9":[["fr","Leçon 6, Traction et compression. Traction. La pièce est étirée par deux efforts opposés qui tendent à l'allonger (câble de levage, tirant, vis). La contrainte est: σ égale F ou S (positive, en traction). Compression. La pièce est comprimée par deux efforts opposés qui tendent à la raccourcir (pied de bielle, montant de charpente). Même formule, contrainte négative. Condition de résistance. La pièce reste dans le domaine élastique si: σ inférieur ou égal à σ_adm (contrainte admissible). Exercice. Un câble d'acier de section S égale 50 millimètres carrés supporte un effort F égale 5 000 N. Calculer la contrainte σ. Corrigé. σ égale F ou S égale 5 000 sur 50 égale 100 N ou mm au carré égale 100 MPa. Si la contrainte admissible de l'acier du câble est Re égale 250 MPa avec coefficient de sécurité k égale 2,5, alors σ_adm égale 100 MPa: le câble travaille à la limite. Pour plus de sécurité, on augmenterait la section. À retenir. Traction et compression se calculent avec σ égale F ou S. La condition de résistance σ inférieur ou égal à σ_adm garantit la tenue de la pièce."]],"10":[["fr","Leçon 7, Le cisaillement. Définition. Le cisaillement apparaît lorsque deux efforts opposés agissent parallèlement à une section, tendant à faire glisser deux parties de la pièce l'une sur l'autre (rivet, goupille, boulon sollicité transversalement, poinçonnage). Contrainte de cisaillement. τ égale F ou S. τ: contrainte tangentielle (MPa ou N ou mm au carré ). F: effort tranchant. S: section cisaillée. Pour un rivet ou une goupille soumise à un effort F, la section cisaillée est la section transversale S égale pi multiplié par d au carré /4 (d égale diamètre). Exercice. Une goupille de diamètre 8 millimètres reprend un effort tranchant F égale 4 000 N. Calculer τ. Corrigé. S égale pi multiplié par d au carré /4 égale 3,14 multiplié par 64 sur 4 environ égal à 50,3 millimètres carrés. τ égale F ou S égale 4 000 sur 50,3 environ égal à 79,5 MPa. Si τ_adm de la goupille est 100 MPa, la goupille tient avec une marge acceptable. À retenir. Cisaillement: efforts parallèles à la section. τ égale F ou S. Pour un rivet ou une goupille, S égale pi multiplié par d au carré /4."]],"11":[["fr","Leçon 8, Coefficient de sécurité et dimensionnement. Pourquoi un coefficient de sécurité? En pratique, plusieurs incertitudes existent: incertitude sur les efforts réels; fatigue du matériau après cycles répétés; surcharges accidentelles; hétérogénéité du matériau. On introduit un coefficient de sécurité k: σ_adm égale Re ou k (ou σ_adm égale Rm ou k pour la résistance à la rupture). Valeurs indicatives (à ajuster selon les règles applicables): k environ égal à 2 à 3 en mécanique générale; k plus élevé pour le levage (sécurité des personnes). Démarche de dimensionnement. Identifier l'effort F subi par la pièce. Choisir le matériau (limite élastique Re). Fixer k et calculer σ_adm. Calculer la section minimale S_min égale F ou σ_adm. Choisir une section normalisée supérieur ou égal à S_min. Image de référence: MR3_IMG03, exemple de dimensionnement en traction. Étude de cas, câble de levage. Un câble doit lever une charge de 1 500 kilogrammes (F environ égal à 1 500 multiplié par 9,81 environ égal à 14 700 N). Matériau: acier Re égale 300 MPa. On prend k égale 5 (levage de personnes), donc σ_adm égale 60 MPa. Section minimale S égale 14 700 sur 60 égale 245 millimètres carrés, donc diamètre mini environ égal à racine carrée de (4 multiplié par 245/ pi ) environ égal à 17,7 millimètres. On choisit un câble de 18 millimètres. À retenir. σ_adm égale Re ou k. Dimensionner égale s'assurer que σ égale F ou S inférieur ou égal à σ_adm. Le coefficient de sécurité dépend de l'usage (plus élevé pour le levage)."]],"12":[["fr","Leçon 9, Atelier: mesure et vérification de pièces. Activités pratiques encadrées. Mesurer des pièces avec un pied à coulisse (1 sur 20) et comparer avec la cote nominale. Mesurer le diamètre d'un axe avec un micromètre (1 sur 100). Contrôler la rectitude d'une pièce au comparateur. Vérifier un ajustement (arbre ou alésage) et en déduire le type (jeu, serrage, incertain). Calculer la contrainte d'un tirant soumis à une charge connue. Consignes de sécurité et de qualité. Instruments manipulés avec précaution (pas de choc, pas de serrage excessif). Utiliser les cales de référence. Les EPI restent nécessaires (pièces pouvant être coupantes). En cas d'absence de matériel, utiliser des schémas à lire, des exercices de lecture sur images et des simulations."]],"13":[["fr","Sources et références documentaires."]],"14":[["fr","Évaluation finale, Métrologie et RDM. Répondez aux questions ci-dessous. Une seule réponse est correcte par question."]]}};

        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
