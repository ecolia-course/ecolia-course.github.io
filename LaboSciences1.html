<script>
const COURSE_TITLE = "Laboratoire de sciences";
const slides = [
{
    title: "Sommaire — Laboratoire de sciences 1re secondaire",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Le laboratoire de sciences t'apprend à faire de la science pour de vrai : observer, expérimenter, mesurer, noter, conclure. Tu n'as pas besoin d'un grand laboratoire pour commencer : de l'eau, du sel, une pile, un aimant et un crayon suffisent. Ce cours t'apprendra surtout à travailler avec méthode et en toute sécurité.</p>
<ul>
<li>Leçon 1 — À quoi sert un laboratoire de sciences ?</li>
<li>Leçon 2 — Le matériel de laboratoire</li>
<li>Leçon 3 — La sécurité au laboratoire</li>
<li>Leçon 4 — Observer, questionner, formuler une hypothèse</li>
<li>Leçon 5 — Le protocole expérimental</li>
<li>Leçon 6 — Mesurer et consigner les observations</li>
<li>Leçon 7 — Expériences de physique : électricité et aimants</li>
<li>Leçon 8 — Expériences de chimie : mélanges et réactions simples</li>
<li>Leçon 9 — Expériences de biologie : observer le vivant</li>
<li>Leçon 10 — Le compte rendu d'expérience</li>
<li>Leçon 11 — Présenter et discuter des résultats</li>
<li>Leçon 12 — L'attitude scientifique au quotidien</li>
</ul>
<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme national de Sciences (DIPROMAD/MEPSP), fiches de sécurité de laboratoire. Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 1 — À quoi sert un laboratoire de sciences ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi les scientifiques travaillent-ils dans des laboratoires ? Ne peuvent-ils pas simplement réfléchir ou lire des livres ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir le laboratoire et son rôle. Distinguer observation, expérience et démonstration. Comprendre que la science repose sur la vérification. Prérequis : aucun.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un <strong>laboratoire</strong> est un lieu aménagé pour réaliser des observations et des expériences scientifiques avec du matériel adapté.</p>
<p>La science repose sur trois piliers : la théorie (les idées), l'expérience (la vérification) et la mesure (les données chiffrées).</p>
<p>On distingue :</p>
<ul>
<li><strong>Observation :</strong> regarder et décrire sans intervenir.</li>
<li><strong>Expérience :</strong> modifier un facteur pour comprendre son effet.</li>
<li><strong>Démonstration :</strong> reproduire un phénomène pour l'expliquer.</li>
</ul>
</div>
<img src="images/LaboSciences1_1.jpg" alt="Jeune chercheur dans un laboratoire" data-image-id="LaboSciences1_1" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Toute expérience commence par une question. Toute expérience doit être <strong>reproductible</strong> (une autre personne doit pouvoir obtenir le même résultat). Toute observation doit être notée immédiatement.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Dans une école sans laboratoire équipé, un élève peut vérifier : « L'eau dissout plus de sel quand elle est chaude. » Avec deux verres (eau froide, eau chaude) et du sel, il fait de la science véritable.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Pourquoi une expérience doit-elle être reproductible ?</p>
<details><summary>Corrigé</summary>
<p>Pour être validée par d'autres scientifiques et garantir la fiabilité du résultat.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le laboratoire est un lieu de vérification et de mesure ; la science repose sur l'observation, l'expérience et la reproductibilité.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Sciences (DIPROMAD).</div>
    `
},
{
    title: "Leçon 2 — Le matériel de laboratoire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« À quoi servent un bécher, une éprouvette, un microscope, une balance ? Chaque instrument a une fonction précise. »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Reconnaître les principaux instruments. Associer chaque instrument à sa fonction. Prendre soin du matériel.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Verrerie :</strong> bécher (mélanger), éprouvette graduée (mesurer un volume), entonnoir (filtrer).</p>
<p><strong>Mesure :</strong> règle (longueur), balance (masse), thermomètre (température), chronomètre (temps).</p>
<p><strong>Observation :</strong> loupe, microscope optique.</p>
<p>Le matériel simple peut souvent remplacer le matériel de laboratoire (verre à boire, cuillère, filtre à café).</p>
</div>
<img src="images/LaboSciences1_2.jpg" alt="Verrerie de laboratoire" data-image-id="LaboSciences1_2" onerror="this.style.display='none'">
<img src="images/LaboSciences1_3.jpg" alt="Balance de laboratoire" data-image-id="LaboSciences1_3" onerror="this.style.display='none'">
<img src="images/LaboSciences1_4.jpg" alt="Microscope optique" data-image-id="LaboSciences1_4" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Utiliser chaque instrument pour ce pour quoi il est fait. Nettoyer et ranger après usage. Signaler tout instrument cassé.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Dans un laboratoire d'école, on utilise un bécher pour mélanger et une éprouvette pour mesurer 50 mL d'eau. Si la balance manque, on peut utiliser une balance de cuisine.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Que fait-on avec un microscope ?</p>
<details><summary>Corrigé</summary>
<p>Observer de très petits objets (cellules, micro-organismes).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Chaque instrument a une fonction ; le matériel simple peut souvent remplacer le matériel de laboratoire.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Sciences (DIPROMAD).</div>
    `
},
{
    title: "Leçon 3 — La sécurité au laboratoire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi doit-on porter des lunettes et des gants au laboratoire ? Que faire si on renverse un produit sur sa peau ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Identifier les dangers. Appliquer les règles de sécurité. Réagir correctement en cas d'accident.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Dangers :</strong> produits chimiques corrosifs, verrerie cassante, flammes, électricité.</p>
<p><strong>Règles fondamentales :</strong></p>
<ol>
<li>Ne jamais travailler seul.</li>
<li>Ne jamais goûter un produit inconnu.</li>
<li>Porter des lunettes et une blouse.</li>
<li>Ne pas manger ni boire au laboratoire.</li>
<li>Connaître l'emplacement de la douche de sécurité et de la trousse de secours.</li>
</ol>
</div>
<img src="images/LaboSciences1_5.jpg" alt="Pictogrammes de sécurité GHS" data-image-id="LaboSciences1_5" onerror="this.style.display='none'">
<img src="images/LaboSciences1_6.jpg" alt="Lunettes et gants de laboratoire" data-image-id="LaboSciences1_6" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Avant l'expérience : lire la fiche de sécurité. Pendant : suivre le protocole. Après : ranger et se laver les mains.</p>
<p><strong>En cas d'accident :</strong> rincer immédiatement à grande eau en cas de contact, prévenir l'adulte.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève renverse du vinaigre sur sa main. Il rince immédiatement à grande eau et prévient l'enseignant. Ce réflexe est vital pour des produits plus corrosifs.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Que faut-il faire en cas de contact avec un produit chimique sur la peau ?</p>
<details><summary>Corrigé</summary>
<p>Rincer immédiatement à grande eau et prévenir l'adulte.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La sécurité est la première règle du laboratoire ; quelques gestes simples évitent les accidents.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches de sécurité de laboratoire.</div>
    `
},
{
    title: "Leçon 4 — Observer, questionner, formuler une hypothèse",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi les plantes du bord du fleuve sont-elles plus vertes que celles de la colline ? Comment le vérifier ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Formuler une question scientifique. Proposer une hypothèse. Distinguer hypothèse et conclusion.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Observation :</strong> constater un fait.</p>
<p><strong>Question :</strong> transformer l'observation en une question précise.</p>
<p><strong>Hypothèse :</strong> proposer une réponse provisoire, vérifiable par l'expérience (formule « Si… alors… »).</p>
<p>Si les résultats contredisent l'hypothèse, on la rejette et on en propose une autre.</p>
</div>
<img src="images/LaboSciences1_7.jpg" alt="Observation d'une plante" data-image-id="LaboSciences1_7" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Une bonne hypothèse est claire, testable et formulée sous forme de proposition à vérifier. On ne « croit » pas une hypothèse : on la vérifie.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Observation : « Le linge sèche plus vite au soleil. » Hypothèse : « Si la température augmente, alors l'évaporation sera plus rapide. »</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Une hypothèse peut-elle être fausse ? Explique.</p>
<details><summary>Corrigé</summary>
<p>Oui : l'expérience peut la contredire ; dans ce cas, on la rejette et on en propose une autre.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La démarche scientifique commence par l'observation, se poursuit par la question et l'hypothèse, et se vérifie par l'expérience.</p></div>

<div class="sources"><strong>Sources :</strong> Didactique des sciences (démarche OHERIC).</div>
    `
},
{
    title: "Leçon 5 — Le protocole expérimental",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment être sûr que l'expérience mesure bien ce qu'on veut tester ? Pourquoi faut-il parfois un "témoin" ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre ce qu'est un protocole. Rédiger un protocole simple. Identifier les variables et le témoin.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un <strong>protocole</strong> est la description précise et ordonnée des étapes d'une expérience.</p>
<p><strong>Variables :</strong> facteur modifié (indépendante), facteur mesuré (dépendante), facteurs constants.</p>
<p><strong>Témoin :</strong> situation de référence sans modification, pour comparer.</p>
</div>
<img src="images/LaboSciences1_8.jpg" alt="Deux verres pour une expérience" data-image-id="LaboSciences1_8" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Rédiger un protocole : (1) objectif ; (2) matériel ; (3) montage ; (4) étapes numérotées ; (5) mesures ; (6) précautions.</p>
<p>Ne faire varier qu'une seule variable à la fois. Prévoir un témoin si possible.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Pour tester l'effet de la température sur la dissolution du sucre, on prépare deux verres : eau froide (témoin) et eau chaude (test), avec la même quantité de sucre.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Pourquoi ne faut-il faire varier qu'une seule variable à la fois ?</p>
<details><summary>Corrigé</summary>
<p>Pour pouvoir attribuer l'effet observé à la variable étudiée et non à un autre facteur.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un protocole bien rédigé garantit la reproductibilité ; le témoin et la maîtrise des variables permettent d'interpréter les résultats.</p></div>

        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
