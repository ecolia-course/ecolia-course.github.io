{
    title: "Leçon 1 — Éléments de base de la cinématique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Papy raconte : il a quitté Boma avant-hier à 18 h et est arrivé hier à 9 h 30. En route, les arbres défilaient, on roulait vite, puis moins vite, on s'arrêtait au péage. Chaque détail correspond à un concept de cinématique.</p></div>
<h3>1. Concepts de base</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Cinématique</strong> : étude du mouvement sans s'occuper de ses causes.</li><li><strong>Mobile</strong> : corps en mouvement ; <strong>mobile ponctuel</strong> : mobile assimilé à un point.</li><li><strong>Référentiel</strong> : corps de référence (la Terre, le sol) ; <strong>repère</strong> : axes liés au référentiel.</li><li><strong>Repos et mouvement</strong> sont <strong>relatifs</strong> au référentiel.</li><li><strong>Trajectoire</strong> : ensemble des positions occupées (rectiligne, circulaire, curviligne).</li><li><strong>Durée</strong> Δt = t<sub>2</sub> − t<sub>1</sub> (≠ <strong>instant</strong> t).</li></ul></div>
<h3>2. Grandeurs vectorielles</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Position</strong> : x (abscisse) ou vecteur position r = OM. <strong>Déplacement</strong> : Δr = r<sub>2</sub> − r<sub>1</sub> (≠ <strong>distance parcourue</strong>).</li><li><strong>Vitesse moyenne</strong> : v<sub>m</sub> = Δx / Δt ; <strong>au sens commun</strong> : distance totale / durée.</li><li><strong>Vitesse instantanée</strong> : v = dx/dt (limite de Δx/Δt quand Δt → 0).</li><li><strong>Accélération moyenne</strong> : a<sub>m</sub> = Δv/Δt ; <strong>instantanée</strong> : a = dv/dt = d<sup>2</sup>x/dt<sup>2</sup>.</li><li><strong>Équation horaire</strong> : x = f(t).</li></ul></div>
<h3>3. Unités et sigles</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>SI</strong> : Système international d'unités ; longueur m, durée s, vitesse m/s, accélération m/s<sup>2</sup>. 1 km/h = 1/3,6 m/s.</li><li><strong>MRU</strong> : mouvement rectiligne uniforme ; <strong>MRUV</strong> : mouvement rectiligne uniformément varié ; <strong>MCU, MCUV</strong> : mouvement circulaire uniforme, uniformément varié.</li><li><strong>EXETAT</strong> : Examen d'État ; <strong>SPTIC</strong> : Sciences physiques et technologies de l'information et de la communication ; <strong>MSP</strong> : matrice de sciences physiques/physique ; <strong>HSC</strong> : humanités scientifiques.</li></ul><p><a href="https://www.youtube.com/results?search_query=Éléments+de+base+de+la+cinématique+physique+terminale" target="_blank" rel="noopener">🎥 Recherche : Éléments de base de la cinématique (chaînes de cours de physique)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Mobile, référentiel, trajectoire, déplacement, vitesse (v = dx/dt) et accélération (a = dv/dt) sont les concepts de base. Repos et mouvement sont relatifs.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif SPTIC, 4e année des Humanités scientifiques (MEPST/DIPROMAD, 2021), matrice MSP 6.1.</div>
    `
},
{
    title: "Leçon 2 — Mouvement rectiligne uniforme (MRU)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À Kananga, Kalala note les positions d'un véhicule : 5 m de plus à chaque minute. Les distances sont égales en des durées égales : quel est le nom de ce mouvement, et quelles sont ses lois ?</p></div>
<h3>1. Définition et lois</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>MRU</strong> : trajectoire rectiligne, <strong>vitesse constante</strong>, accélération a = 0.</li><li><strong>Loi des vitesses</strong> : v = constante.</li><li><strong>Équation horaire</strong> : x = x<sub>0</sub> + v t (v = Δx/Δt).</li><li>Exemple de Kalala : 5 m par minute ⇒ v = 5 m/min ≈ 0,083 m/s.</li></ul></div>
<h3>2. Graphiques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>x(t)</strong> : droite de pente v (croissante si v > 0).</li><li><strong>v(t)</strong> : droite horizontale ; l'<strong>aire</strong> sous la courbe donne le déplacement.</li><li><strong>a(t)</strong> : confondue avec l'axe des temps.</li></ul></div>
<h3>3. Exemple résolu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li>Arrêts de bus distants de 300 m ; un cycliste met 10 min d'un arrêt à l'autre : v = 300 m / 600 s = <strong>0,5 m/s</strong> (1,8 km/h) ; mouvement <strong>uniforme</strong>.</li></ul><p><a href="https://www.youtube.com/results?search_query=Mouvement+rectiligne+uniforme+(MRU)+physique+terminale" target="_blank" rel="noopener">🎥 Recherche : Mouvement rectiligne uniforme (MRU) (chaînes de cours de physique)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>MRU : v constante, a = 0, x = x<sub>0</sub> + vt. Le graphique x(t) est une droite ; v(t) est une horizontale.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif SPTIC, 4e année des Humanités scientifiques (MEPST/DIPROMAD, 2021), matrice MSP 6.2.</div>
    `

    title: "Leçon 3 — Mouvement rectiligne uniformément varié (MRUV)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un poste de police note la vitesse d'une voiture : 0, 6, 12, 18, 24, 30 m/s toutes les 5 s. La vitesse augmente de 6 m/s à chaque intervalle égal : ce mouvement est uniformément varié.</p></div>
<h3>1. Définition et lois</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>MRUV</strong> : trajectoire rectiligne, <strong>accélération constante</strong> (a > 0 accéléré ; a < 0 retardé).</li><li><strong>v = v<sub>0</sub> + a t</strong> ; <strong>x = x<sub>0</sub> + v<sub>0</sub> t + ½ a t<sup>2</sup></strong> ; <strong>v<sup>2</sup> − v<sub>0</sub><sup>2</sup> = 2a(x − x<sub>0</sub>)</strong> (relation de Galilée).</li><li><strong>Vitesse moyenne</strong> : v<sub>m</sub> = (v<sub>0</sub> + v)/2.</li></ul></div>
<h3>2. Particularités</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li>Départ sans vitesse initiale : distances parcourues pendant des intervalles égaux successifs dans le rapport <strong>1 : 3 : 5 : 7 …</strong>.</li><li><strong>Graphiques</strong> : x(t) parabole ; v(t) droite de pente a ; a(t) droite horizontale.</li></ul></div>
<h3>3. Exemples résolus</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li>Tableau de la police : a = 6/5 = <strong>1,2 m/s<sup>2</sup></strong> ; en 25 s, x = ½ × 1,2 × 25<sup>2</sup> = <strong>375 m</strong>.</li><li>Une voiture passe de 0 à 90 km/h (25 m/s) en 10 s : a = 2,5 m/s<sup>2</sup> ; distance = ½ × 2,5 × 10<sup>2</sup> = <strong>125 m</strong>.</li></ul><p><a href="https://www.youtube.com/results?search_query=Mouvement+rectiligne+uniformément+varié+(MRUV)+physique+terminale" target="_blank" rel="noopener">🎥 Recherche : Mouvement rectiligne uniformément varié (MRUV) (chaînes de cours de physique)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>MRUV : a constante ; v = v<sub>0</sub> + at ; x = x<sub>0</sub> + v<sub>0</sub>t + ½at<sup>2</sup> ; v<sup>2</sup> − v<sub>0</sub><sup>2</sup> = 2a Δx.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif SPTIC, 4e année des Humanités scientifiques (MEPST/DIPROMAD, 2021), matrice MSP 6.3.</div>
    `
},
{
    title: "Leçon 4 — Chute libre des corps",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un enseignant demande de lâcher en même temps un caillou et une feuille de papier : le caillou tombe plus vite à cause de l'air. Dans le vide, tous les corps tombent pareil : c'est la chute libre.</p></div>
<h3>1. Définition et lois</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><img alt="Galilée" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Phys6_1"><p style="font-size:0.75rem;color:#666;margin-top:-8px;">Galilée — Wikimedia Commons : Justus Sustermans - Portrait of Galileo Galilei, 1636.jpg</p><ul><li><strong>Chute libre</strong> : mouvement d'un corps soumis <strong>uniquement à son poids</strong> (sans frottement), sans vitesse initiale ou avec.</li><li>C'est un <strong>MRUV</strong> d'accélération g ≈ <strong>9,8 m/s<sup>2</sup></strong>.</li><li><strong>v = g t</strong> ; <strong>h = ½ g t<sup>2</sup></strong> ; <strong>v<sup>2</sup> = 2 g h</strong>.</li><li>Tous les corps tombent avec la <strong>même accélération</strong>, quelle que soit leur masse (Galilée).</li></ul></div>
<h3>2. Caractères de la pesanteur</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Direction</strong> : verticale ; <strong>sens</strong> : vers le centre de la Terre ; <strong>intensité</strong> : g ≈ 9,8 N/kg ; <strong>point d'application</strong> : centre de gravité.</li><li>g varie avec la <strong>latitude</strong> (≈ 9,78 à l'équateur, 9,83 aux pôles) et l'<strong>altitude</strong>.</li></ul></div>
<h3>3. Exemples résolus</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li>Chute de 20 m : t = √(2h/g) = √(40/9,8) ≈ <strong>2,0 s</strong> ; v = √(2gh) ≈ <strong>19,8 m/s</strong>.</li><li><strong>Lancer vertical vers le haut</strong> (v<sub>0</sub>) : hauteur max h = v<sub>0</sub><sup>2</sup>/(2g) ; durée de montée t = v<sub>0</sub>/g.</li></ul><p><a href="https://www.youtube.com/results?search_query=Chute+libre+des+corps+physique+terminale" target="_blank" rel="noopener">🎥 Recherche : Chute libre des corps (chaînes de cours de physique)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Chute libre : seul le poids agit ; a = g ≈ 9,8 m/s<sup>2</sup> ; v = gt ; h = ½gt<sup>2</sup> ; indépendant de la masse.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif SPTIC, 4e année des Humanités scientifiques (MEPST/DIPROMAD, 2021), matrice MSP 6.4.</div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>PV = nRT</strong> (R = 8,31 J/(mol·K)).</li><li><strong>Isotherme</strong> : ΔU = 0 ; <strong>isochore</strong> : W = 0 ; <strong>isobare</strong> : W = −PΔV ; <strong>adiabatique</strong> : Q = 0.</li></ul></div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une pierre au bout d'un fil, que l'on écarte un peu de la verticale puis qu'on lâche : elle oscille. De quoi dépend la durée d'un va-et-vient ?</p></div>

    title: "Leçon 24 — Pendule pesant",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un solide quelconque suspendu à un axe horizontal ne passant pas par son centre de gravité oscille : c'est un pendule pesant. Un balancier de tige en est un exemple.</p></div>
<h3>1. Période</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>T = 2π√(I/(m g d))</strong> (d = distance entre l'axe O et le centre de gravité G) ; <strong>ω<sub>0</sub> = √(m g d/I)</strong>.</li><li><strong>Longueur du pendule simple synchrone</strong> : l = I/(m d).</li></ul></div>
<h3>2. Tige homogène</h3>

<h3>2. Cas particuliers</h3>

function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });

function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}

function renderSlide(index, keepHighlight) {

    slideCounterSpan.textContent = (index+1) + '/' + slides.length;

    prevBtn.disabled = (index === 0);

    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>

<script>
(function () {
  var SITE = "https://ecolia-course.github.io/";
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface", page servie par https://app.local
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function abs(u) { return /^(https?:|data:|blob:)/i.test(u) ? u : (NATIVE ? SITE + u.replace(/^(\.\/|\/)+/, "") : u); }
  function ext(u) { var m = String(u).split("?")[0].match(/\.(jpe?g|png|gif|webp|svg)$/i); return m ? m[1].toLowerCase() : "jpg"; }
  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {
    if (queued[fn]) return;
    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
    if (!queue.length) { running = false; return; }
    if (!navigator.onLine) { running = false; return; }
    var q = queue.shift(), t0 = Date.now();
    try { CoursInterface.download(q[0], q[1]); } catch (e) { return setTimeout(next, 500); }
    (function wait() {
      var ok = false;
      try { ok = !!CoursInterface.exists(q[1]); } catch (e) {}
      if (ok) setTimeout(next, 1500);
      else if (Date.now() - t0 > 40000) next();
      else setTimeout(wait, 700);
    })();
  }
  function exists(fn) { try { return !!CoursInterface.exists(fn); } catch (e) { return false; } }

  function show(img) {                                    // affiche UNE image (appelé à chaque slide affichée)
    if (!table || img.getAttribute("data-ecolia-done")) return;
    var id = img.getAttribute("data-image-id");
    var url = table[id];
    if (typeof url !== "string" || !url.length) { console.warn("ECOLIA : image absente du JSON :", id); return; }
    img.setAttribute("data-ecolia-done", "1");
    if (!NATIVE) { img.onerror = function () { hide(img); }; img.setAttribute("src", url); return; }
    var full = abs(url), fn = "img_" + id + "." + ext(url);
    if (exists(fn)) {                                     // déjà sur l'appareil : lecture locale, sans internet
      img.onerror = function () {                         // fichier incomplet : on le supprime et on utilise le site
        try { CoursInterface["delete"](fn); } catch (e) {}
        queued[fn] = 0;
        img.onerror = function () { hide(img); };
        img.setAttribute("src", full);
      };
      img.setAttribute("src", "https://app.local/cours/" + fn);
    } else {
      img.onerror = function () { hide(img); };
      img.setAttribute("src", full);
      enqueue(full, fn);
    }
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches("img[data-image-id]")) show(root);
    root.querySelectorAll("img[data-image-id]").forEach(show);
  }
  function prefetchAll() {                                // APK : prépare TOUTES les images du cours pour le hors-ligne
    var ids = {};
    try { JSON.stringify(slides).replace(/data-image-id=\\?"([^"\\]+)/g, function (m, id) { ids[id] = 1; }); } catch (e) {}
    Object.keys(ids).forEach(function (id) {
      var url = table[id];
      if (typeof url !== "string" || !url.length) return;
      var fn = "img_" + id + "." + ext(url);
      if (!exists(fn)) enqueue(abs(url), fn);
    });
  }
  function start(tbl) {
    table = tbl;
    scan(document.body);
    new MutationObserver(function (muts) {                // les slides sont écrites à la volée : on traite chaque nouvelle image
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
    if (NATIVE) prefetchAll();
  }

  var JSON_URL = NATIVE ? SITE + "images_ecolia.json" : "images_ecolia.json";
  var KEY = "ecolia_images_json";
  fetch(JSON_URL, NATIVE ? { cache: "no-cache" } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (table) { if (NATIVE) lsSet(KEY, JSON.stringify(table)); start(table); })
    .catch(function (e) {
      var saved = null;
      if (NATIVE) { try { saved = JSON.parse(lsGet(KEY) || "null"); } catch (x) {} }
      if (saved) start(saved);                              // hors ligne dans l'APK : JSON gardé la dernière fois
      else console.warn("ECOLIA : JSON des images indisponible.", e);
    });
})();
</script>
