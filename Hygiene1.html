<p>L'hygiène hospitalière, c'est l'ensemble des mesures qui protègent les patients et les soignants contre les infections. Dans ce cours, tu vas apprendre les gestes qui sauvent : l'hygiène des mains, les précautions standard, les équipements de protection, la désinfection, la stérilisation, la gestion des déchets. Ces règles sont la base de la sécurité des soins, surtout dans le contexte congolais où les épidémies sont fréquentes.</p>

{
    title: "Leçon 1 — Qu'est-ce que l'hygiène hospitalière ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi les hôpitaux doivent-ils être propres ? Que risque un patient qui entre dans un hôpital sale ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir l'hygiène hospitalière. Comprendre ses objectifs. Situer son importance en RDC. Prérequis : notions de microbiologie (cours n°55) et de soins infirmiers (cours n°51).</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'<strong>hygiène hospitalière</strong> est l'ensemble des mesures et des pratiques qui visent à prévenir et à contrôler les infections dans les établissements de santé.</p>
<p>Elle concerne : les mains du personnel, les locaux, les surfaces, le matériel, les déchets, l'eau, l'alimentation, le linge, et le personnel lui-même (tenue, hygiène corporelle, santé).</p>
<p><strong>Objectifs :</strong> protéger le patient (éviter les infections), protéger le soignant, protéger l'environnement, garantir la qualité et la sécurité des soins.</p>
<p>En RDC, l'hygiène hospitalière est un enjeu majeur : les établissements de soins ont joué un grand rôle dans l'amplification de différentes épidémies (choléra, Ebola, rougeole). L'hygiène des mains est souvent peu pratiquée, les EPI manquent, et les infrastructures sont insuffisantes. Le Manuel national de PCI (2022) est la référence pour tous les soignants congolais.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Hygiène hospitalière :</strong> mesures de prévention des infections à l'hôpital. <strong>Infection associée aux soins (IAS) :</strong> infection contractée à l'hôpital. <strong>PCI :</strong> prévention et contrôle de l'infection. <strong>Sécurité des soins :</strong> absence de risque évitable.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Appliquer les règles d'hygiène à tous les niveaux. Former le personnel. Contrôler régulièrement. Impliquer tous les acteurs (soignants, patients, familles, direction).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un hôpital qui ne nettoie pas ses sols, ne lave pas les mains de ses soignants et ne gère pas ses déchets est un lieu à haut risque d'infection. À l'inverse, un hôpital qui applique les règles d'hygiène protège ses patients et son personnel.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis l'hygiène hospitalière.</p>
<p><strong>Ex. 2 :</strong> Cite trois objectifs de l'hygiène hospitalière.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> L'ensemble des mesures qui visent à prévenir et à contrôler les infections dans les établissements de santé.</p>
<p><strong>2)</strong> Protéger le patient, protéger le soignant, garantir la qualité des soins (3 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'hygiène hospitalière est la première barrière contre les infections ; elle protège les patients et les soignants.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel national de PCI (RDC, 2022) ; OMS.</div>
    `
},
{
    title: "Leçon 2 — Les infections associées aux soins (IAS)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un patient entre à l'hôpital pour une fracture et ressort avec une infection. Que s'est-il passé ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir les IAS. Connaître les principaux types. Comprendre leurs causes. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une <strong>infection associée aux soins (IAS)</strong>, autrefois appelée « infection nosocomiale », est une infection contractée par un patient lors de son séjour dans un établissement de santé, et qui n'était ni présente ni en incubation au moment de son admission.</p>
<p><strong>Principaux types :</strong> infections urinaires (liées aux sondes), infections pulmonaires (liées à la ventilation), infections de plaies (post-opératoires), infections sanguines (liées aux cathéters), infections digestives.</p>
<p><strong>Causes :</strong> hygiène des mains insuffisante, matériel contaminé, locaux sales, déchets mal gérés, surpopulation, manque de formation, usage excessif d'antibiotiques (résistance).</p>
<p><strong>Conséquences :</strong> prolongation de l'hospitalisation, souffrance, surcoût, décès évitables, résistance aux antimicrobiens. En RDC, la surveillance des IAS est sous-développée.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>IAS :</strong> infection contractée à l'hôpital. <strong>Infection nosocomiale :</strong> ancien terme pour IAS. <strong>Résistance antimicrobienne :</strong> capacité des microbes à résister aux antibiotiques. <strong>Sonde urinaire :</strong> tube dans la vessie.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Prévenir par l'hygiène des mains et les précautions standard. Surveiller les infections. Déclarer les cas. Former le personnel.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une sonde urinaire laissée en place trop longtemps, sans hygiène rigoureuse, peut provoquer une infection urinaire. Une plaie opératoire mal surveillée peut s'infecter.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qu'est-ce qu'une IAS ?</p>
<p><strong>Ex. 2 :</strong> Cite trois causes d'IAS.</p>
<details><summary>Corrigé</summary>

<p><strong>2)</strong> Hygiène des mains insuffisante, matériel contaminé, locaux sales (3 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les IAS sont des infections évitables qui menacent la sécurité des patients et la qualité des soins.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel national de PCI (RDC, 2022) ; OMS.</div>

    title: "Leçon 3 — La chaîne de transmission des infections",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment un microbe passe-t-il d'un patient à un autre ? Pourquoi les soignants sont-ils parfois des vecteurs d'infection ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les 6 maillons de la chaîne. Comprendre comment la rompre. Appliquer les mesures. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>chaîne de transmission</strong> est la suite d'étapes par lesquelles un micro-organisme passe d'une source à un hôte réceptif. Elle comprend 6 maillons :</p>
<ol>
<li><strong>Agent infectieux :</strong> bactérie, virus, champignon, parasite.</li>
<li><strong>Réservoir :</strong> lieu où le microbe vit et se multiplie (être humain, eau, matériel, sol).</li>
<li><strong>Porte de sortie :</strong> par où le microbe quitte le réservoir (sang, salive, urines, selles, plaies, voies respiratoires).</li>
<li><strong>Mode de transmission :</strong> contact (direct ou indirect, mains, objets), gouttelettes (toux, éternuement), air (particules fines), vecteur (moustique, mouche).</li>
<li><strong>Porte d'entrée :</strong> par où le microbe entre chez le nouvel hôte (plaie, bouche, nez, cathéter, sonde).</li>
<li><strong>Hôte réceptif :</strong> personne dont les défenses sont affaiblies (malade, âgé, immunodéprimé, nourrisson).</li>
</ol>
<p><strong>Rompre la chaîne :</strong> c'est l'objectif de l'hygiène hospitalière. Chaque maillon peut être brisé par une mesure (hygiène des mains, stérilisation, déchets, EPI, aération).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Chaîne de transmission :</strong> 6 étapes de l'infection. <strong>Réservoir :</strong> source du microbe. <strong>Porte d'entrée :</strong> voie de pénétration. <strong>Hôte réceptif :</strong> personne vulnérable. <strong>Vecteur :</strong> organisme qui transporte le microbe.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier le maillon à rompre. Appliquer la mesure adaptée (hygiène des mains, stérilisation, EPI, gestion des déchets). Rompre la chaîne le plus tôt possible.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un soignant touche un patient infecté (réservoir), ne se lave pas les mains (transmission par contact), puis touche un autre patient (hôte réceptif). L'hygiène des mains aurait rompu la chaîne.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les 6 maillons de la chaîne.</p>
<p><strong>Ex. 2 :</strong> Quel est le mode de transmission le plus fréquent à l'hôpital ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Agent, réservoir, porte de sortie, mode de transmission, porte d'entrée, hôte réceptif.</p>
<p><strong>2)</strong> Le contact (mains, matériel).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Comprendre la chaîne de transmission permet de choisir la mesure de prévention la plus efficace.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel national de PCI (RDC, 2022).</div>

{
    title: "Leçon 4 — L'hygiène des mains : les 5 indications",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Quand faut-il se laver les mains à l'hôpital ? Pourquoi est-ce si important ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les 5 indications de l'OMS. Distinguer les techniques. Appliquer les gestes. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'<strong>hygiène des mains</strong> est le geste le plus efficace pour prévenir les infections associées aux soins. Elle doit être pratiquée par tout professionnel de santé, quel que soit le patient.</p>
<p><strong>Les 5 indications de l'OMS :</strong></p>
<ol>
<li>Avant tout contact avec un patient (protéger le patient des germes du soignant).</li>
<li>Avant une procédure aseptique (protéger le patient d'une infection).</li>
<li>Après un risque d'exposition à un liquide biologique (protéger le soignant).</li>
<li>Après avoir touché un patient (protéger le soignant et l'environnement).</li>
<li>Après avoir touché l'environnement du patient (protéger le soignant et les autres patients).</li>
</ol>
<p><strong>Deux techniques :</strong> lavage au savon et à l'eau (mains visiblement sales ou souillées) ; friction hydro-alcoolique (FHA) pour les mains non souillées, plus rapide, plus efficace. <strong>Prérequis :</strong> ongles courts, sans vernis, sans bijoux, avant-bras dégagés.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>

<li>Linge et vaisselle traités selon les procédures.</li>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>

    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Quels vêtements et accessoires protègent le soignant ? Comment les utiliser sans se contaminer ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les EPI. Savoir quand les utiliser. Les retirer correctement. Prérequis : leçons 1 à 5.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les <strong>EPI</strong> sont les équipements qui protègent le soignant et le patient des contacts avec des liquides biologiques et des micro-organismes.</p>
<p><strong>Principaux EPI :</strong></p>
<ul>
<li><strong>Gants :</strong> pour tout contact avec du sang, des liquides biologiques, des muqueuses, des plaies.</li>
<li><strong>Masque :</strong> pour se protéger des gouttelettes et des projections (soins respiratoires, pandémies).</li>
<li><strong>Blouse / tablier :</strong> pour protéger les vêtements et la peau des projections.</li>
<li><strong>Lunettes / écran facial :</strong> pour protéger les yeux des projections.</li>
<li><strong>Bonnet, surchaussures :</strong> pour les zones stériles ou à haut risque.</li>
</ul>
<p><strong>Règles d'utilisation :</strong> mettre les EPI avant le soin, les retirer après ; retirer les gants en les retournant, sans toucher l'extérieur ; jeter les EPI dans les poubelles adaptées ; se laver les mains après le retrait. En RDC, les EPI manquent souvent ; il faut les utiliser avec discernement et les rendre disponibles.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>EPI :</strong> équipement de protection. <strong>Gants :</strong> protection des mains. <strong>Masque :</strong> protection respiratoire. <strong>Blouse :</strong> protection du corps. <strong>AES :</strong> accident d'exposition au sang.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Pour une prise de sang, le soignant porte des gants et un masque. Il retire les gants en les retournant, les jette, se lave les mains. Il ne touche pas l'extérieur des gants avec ses mains nues.</p>
</div>

    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment nettoyer une chambre d'hôpital ? Quelles surfaces sont les plus à risque ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre l'hygiène des locaux. Connaître les techniques de nettoyage. Organiser le nettoyage. Prérequis : leçons 1 à 6.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'<strong>hygiène des locaux</strong> vise à éliminer les salissures et les micro-organismes des surfaces, des sols, des murs, des sanitaires.</p>
<p><strong>Trois niveaux :</strong> nettoyage (élimination des salissures visibles, détergent) ; désinfection (élimination des micro-organismes, désinfectant) ; stérilisation (élimination de tous les micro-organismes, y compris les spores, autoclave).</p>
<p><strong>Zones :</strong> zones à risque élevé (bloc opératoire, réanimation), risque moyen (chambres), risque faible (couloirs, administration). <strong>Techniques :</strong> balayage humide, lavage, désinfection, essuyage. On nettoie du propre vers le sale, du haut vers le bas. <strong>Fréquence :</strong> au moins une fois par jour, plus si nécessaire.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Nettoyage :</strong> élimination des salissures. <strong>Désinfection :</strong> élimination des microbes. <strong>Stérilisation :</strong> élimination de tous les microbes. <strong>Zone à risque :</strong> zone où le risque d'infection est élevé.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Planifier le nettoyage. Utiliser les produits adaptés. Respecter l'ordre (propre → sale). Former le personnel.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une chambre d'hôpital est nettoyée chaque jour : sols, tables, poignées de porte, sanitaires. Les surfaces les plus touchées (poignées, interrupteurs) sont désinfectées plus souvent.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la différence entre nettoyage et désinfection ?</p>
<p><strong>Ex. 2 :</strong> Dans quel ordre nettoie-t-on une pièce ?</p>

<p><strong>1)</strong> Le nettoyage élimine les salissures, la désinfection élimine les microbes.</p>

</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'hygiène des locaux est une barrière essentielle contre les infections.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>désinfection</strong> est l'opération qui élimine ou inactive la plupart des micro-organismes sur des objets inertes, à l'exception des spores.</p>
<p><strong>Niveaux :</strong> désinfection de bas niveau (bactéries végétatives, certains virus et champignons) ; de niveau intermédiaire (aussi le bacille tuberculeux) ; de haut niveau (tous les micro-organismes sauf les spores).</p>
<p><strong>Produits :</strong> eau de Javel (hypochlorite), alcool, glutaraldéhyde, peroxyde d'hydrogène. <strong>Précautions :</strong> porter des gants, respecter les dilutions, laisser agir le temps nécessaire, rincer.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Désinfection :</strong> élimination des microbes. <strong>Spore :</strong> forme résistante de certaines bactéries. <strong>Javel :</strong> désinfectant. <strong>Dilution :</strong> mélange avec de l'eau.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Nettoyer avant de désinfecter. Respecter la dilution. Laisser agir. Rincer si nécessaire.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>

</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La désinfection est une étape clé de la prévention ; elle exige des produits adaptés et des gestes rigoureux.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel national de PCI (RDC, 2022).</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qui est responsable de l'hygiène à l'hôpital ? Le directeur ? Les soignants ? Les patients ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le rôle du comité d'hygiène. Connaître l'importance de la formation. Situer la responsabilité de chacun. Prérequis : leçons 1 à 11.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>comité d'hygiène</strong> est un organe qui coordonne les actions d'hygiène dans l'établissement : il élabore les protocoles, organise la formation, évalue les pratiques, gère les épidémies.</p>
<p>En RDC, le comité d'hygiène est souvent non fonctionnel ou absent. Sa mise en place est une priorité.</p>
<p>La <strong>formation du personnel</strong> est essentielle : les soignants, mais aussi le personnel de nettoyage, les cuisiniers, les agents de sécurité, doivent être formés aux gestes de base.</p>
<p>La <strong>responsabilité est partagée :</strong> la direction (moyens, organisation), les soignants (application des gestes), les patients et les familles (respect des règles), l'État (normes, contrôle). <strong>Cadre légal :</strong> loi n° 18/035 du 13 décembre 2018 relative à l'organisation de la santé publique.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Comité d'hygiène :</strong> organe de coordination. <strong>Protocole :</strong> procédure écrite. <strong>Formation :</strong> apprentissage des gestes. <strong>Responsabilité partagée :</strong> implication de tous.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Mettre en place un comité d'hygiène. Élaborer des protocoles. Former le personnel. Évaluer les pratiques. Impliquer patients et familles.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un hôpital fonctionnel a un comité d'hygiène qui se réunit régulièrement, évalue les pratiques, organise des formations et réagit rapidement en cas d'épidémie.</p>

<p><strong>Ex. 2 :</strong> Pourquoi la formation est-elle importante ?</p>

<p><strong>1)</strong> Un organe qui coordonne les actions d'hygiène dans l'établissement.</p>

  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function init() {
    if (document.getElementById("ecolia-audio-btn")) return;
    var btn = document.createElement("button");
    btn.id = "ecolia-audio-btn"; btn.type = "button"; btn.className = "ecolia-off";
    btn.setAttribute("aria-label", "Écouter la leçon"); btn.innerHTML = PLAY;
    var dlBtn = document.createElement("button");
    dlBtn.id = "ecolia-dl-btn"; dlBtn.type = "button"; dlBtn.className = "ecolia-off";
    dlBtn.innerHTML = DL;
    var host = document.querySelector(".header-right");
    if (host) { host.insertBefore(dlBtn, host.firstChild); host.insertBefore(btn, dlBtn); }
    else { btn.className += " ecolia-fixed"; document.body.appendChild(btn); }
    var banner = document.createElement("div");
    banner.id = "ecolia-audio-banner";
    banner.innerHTML = '<span class="eab-txt"></span><span class="eab-act"></span><div class="eab-bar"><i></i></div>';
    var content = document.getElementById("content");
    if (content && content.parentNode) content.parentNode.insertBefore(banner, content);
    else document.body.insertBefore(banner, document.body.firstChild);
    var txtEl = banner.querySelector(".eab-txt"), actEl = banner.querySelector(".eab-act");
    var barEl = banner.querySelector(".eab-bar"), barI = barEl.firstChild;
    var audio = new Audio();
    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }
    function cur() { try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {} return 0; }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
