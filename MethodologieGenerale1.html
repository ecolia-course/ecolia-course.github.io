<script>
const COURSE_TITLE = "Méthodologie générale";
const slides = [
{
    title: "Sommaire — Méthodologie générale 1re secondaire",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>La méthodologie générale t'apprend à travailler avec efficacité. Organiser son temps, prendre des notes, mémoriser, rechercher, présenter un exposé, préparer un examen : ces techniques te serviront à l'école, à l'université et dans ta vie professionnelle. Ce cours est pratique : tu vas apprendre en faisant.</p>
<ul>
<li>Leçon 1 — Pourquoi une méthode de travail ?</li>
<li>Leçon 2 — Organiser son temps</li>
<li>Leçon 3 — Aménager son espace et son environnement de travail</li>
<li>Leçon 4 — La prise de notes</li>
<li>Leçon 5 — L'écoute active</li>
<li>Leçon 6 — Les techniques de mémorisation</li>
<li>Leçon 7 — La recherche documentaire</li>
<li>Leçon 8 — L'analyse d'un document</li>
<li>Leçon 9 — Préparer et présenter un exposé</li>
<li>Leçon 10 — La résolution de problèmes</li>
<li>Leçon 11 — Préparer et passer un examen</li>
<li>Leçon 12 — Devenir autonome dans son travail</li>
</ul>
<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques de Méthodologie générale (2025), Programme national (EDIDEPS, 2007), CECRL, UNESCO. Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 1 — Pourquoi une méthode de travail ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certains élèves travaillent-ils beaucoup et réussissent-ils peu, tandis que d'autres travaillent peu et réussissent ? La méthode fait la différence. »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre l'utilité d'une méthode. Distinguer travail efficace et travail inefficace. Identifier ses propres habitudes. Prérequis : aucun.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une <strong>méthode de travail</strong> est un ensemble organisé de techniques et d'habitudes qui permettent d'apprendre efficacement. Elle repose sur trois piliers : l'<strong>organisation</strong> (temps, espace, matériel), la <strong>régularité</strong> (travail quotidien), et la <strong>technique</strong> (prise de notes, mémorisation, recherche).</p>
<p>Sans méthode : dispersion, oubli, stress, échec. Avec méthode : efficacité, confiance, réussite. La méthode n'est pas innée : elle s'apprend et s'améliore.</p>
</div>
<img src="images/MethodologieGenerale1_1.jpg" alt="Élève en train de travailler" data-image-id="MethodologieGenerale1_1" onerror="this.style.display='none'">
<img src="images/MethodologieGenerale1_16.jpg" alt="Deux élèves travaillant" data-image-id="MethodologieGenerale1_16" onerror="this.style.display='none'">

<h3>3. Méthodes et techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour améliorer sa méthode : identifier ses forces et ses faiblesses, se fixer des objectifs, adopter des habitudes progressivement. Les techniques de base : organisation du temps, prise de notes, mémorisation, recherche documentaire, analyse, communication.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Deux élèves préparent un examen. Le premier relit son cahier la veille au soir, en désordre. Le second relit ses notes chaque soir, fait des fiches, s'interroge, dort bien. Le second réussit mieux, avec moins de stress.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les trois piliers d'une méthode de travail.</p>
<details><summary>Corrigé</summary>
<p>Organisation, régularité, technique.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La méthode de travail est une compétence qui s'apprend et qui fait la différence.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques de Méthodologie générale (2025).</div>
    `
},
{
    title: "Leçon 2 — Organiser son temps",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certains élèves n'ont-ils jamais le temps de faire leurs devoirs, alors que d'autres y arrivent ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre l'importance de la gestion du temps. Utiliser un emploi du temps et un plan de travail. Éviter la procrastination. Prérequis : leçon 1.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>gestion du temps</strong> est la capacité à planifier et à utiliser son temps de manière efficace. Outils : emploi du temps hebdomadaire, agenda, liste de tâches, plan de travail.</p>
<p><strong>Principes :</strong> fixer des priorités, découper les tâches, prévoir des pauses, éviter la <strong>procrastination</strong> (remettre à plus tard).</p>
<p><strong>Régularité :</strong> travailler un peu chaque jour est plus efficace que tout faire la veille.</p>
</div>
<img src="images/MethodologieGenerale1_2.jpg" alt="Emploi du temps" data-image-id="MethodologieGenerale1_2" onerror="this.style.display='none'">
<img src="images/MethodologieGenerale1_3.jpg" alt="Horloge" data-image-id="MethodologieGenerale1_3" onerror="this.style.display='none'">

<h3>3. Méthodes et techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p><strong>Méthode des 3 listes :</strong> à faire aujourd'hui, cette semaine, ce mois. <strong>Technique Pomodoro :</strong> travailler 25 min, se reposer 5 min. <strong>Loi de Pareto :</strong> 20 % de l'effort produit 80 % du résultat.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève a 4 h de devoirs à faire dans la semaine. Il décide de travailler 45 min chaque soir après le dîner, plutôt que 4 h le dimanche. Il note ses tâches dans un carnet et respecte ses pauses.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois outils de gestion du temps.</p>
<details><summary>Corrigé</summary>
<p>Emploi du temps, agenda, liste de tâches.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Organiser son temps, c'est se donner les moyens de réussir sans stress.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques de Méthodologie générale (2025).</div>
    `
},
{
    title: "Leçon 3 — Aménager son espace et son environnement de travail",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi est-il difficile de travailler dans un lieu bruyant ou encombré ? Comment aménager un espace favorable ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre l'importance de l'espace de travail. Aménager un espace propice. Limiter les distractions. Prérequis : leçons 1 et 2.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Espace de travail :</strong> lieu calme, bien éclairé, aéré, ordonné, avec le matériel nécessaire à portée de main.</p>
<p><strong>Environnement :</strong> limiter le bruit, les interruptions, les écrans, les tentations.</p>
<p><strong>Ergonomie :</strong> chaise adaptée, table dégagée, posture droite, lumière naturelle.</p>
<p><strong>Rangement :</strong> classer les documents, préparer la veille.</p>
</div>
<img src="images/MethodologieGenerale1_4.jpg" alt="Bureau de travail rangé" data-image-id="MethodologieGenerale1_4" onerror="this.style.display='none'">

<h3>3. Méthodes et techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Choisir un lieu calme, préparer le matériel avant de commencer, éteindre ou éloigner le téléphone, aérer régulièrement, utiliser un casque si nécessaire.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève travaille dans une pièce partagée. Il négocie des moments calmes, utilise un casque, range son matériel dans une boîte. Il crée un espace fonctionnel malgré les contraintes.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois caractéristiques d'un bon espace de travail.</p>
<details><summary>Corrigé</summary>
<p>Calme, bien éclairé, ordonné.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un espace de travail adapté favorise la concentration et l'efficacité.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques de Méthodologie générale (2025).</div>
    `
},
{
    title: "Leçon 4 — La prise de notes",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment noter l'essentiel d'un cours sans écrire tout ? Comment relire efficacement ses notes ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre l'utilité de la prise de notes. Utiliser des abréviations et des symboles. Organiser ses notes. Prérequis : leçons 1 à 3.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>prise de notes</strong> consiste à noter l'essentiel d'un cours pour le conserver et le réutiliser. Principes : écouter d'abord, noter ensuite ; repérer les idées principales ; abréger ; organiser.</p>
<p><strong>Techniques :</strong> abréviations (ex., c-à-d, pb, tjs), symboles (+, →, =, ≠), titres, puces, numéros.</p>
<p><strong>Relecture :</strong> compléter et organiser les notes après le cours.</p>
</div>
<img src="images/MethodologieGenerale1_5.jpg" alt="Cahier de notes" data-image-id="MethodologieGenerale1_5" onerror="this.style.display='none'">
<img src="images/MethodologieGenerale1_15.jpg" alt="Méthode Cornell" data-image-id="MethodologieGenerale1_15" onerror="this.style.display='none'">

<h3>3. Méthodes et techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p><strong>Méthode Cornell :</strong> diviser la page en 3 zones (notes, questions, résumé). <strong>Méthode en arborescence :</strong> organiser en branches. <strong>Fiches :</strong> une fiche par thème. <strong>Relecture active :</strong> relire, compléter, résumer, s'interroger.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Pendant un cours d'histoire, un élève note : « 1884-85 : Berlin. 1885 : EIC. 1908 : Congo belge. 1960 : Indépendance. » Il utilise des abréviations et des flèches, puis complète après le cours.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois techniques de prise de notes.</p>
<details><summary>Corrigé</summary>
<p>Abréviations, symboles, plan.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La prise de notes est une compétence clé pour l'étude et la réussite.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques de Méthodologie générale (2025).</div>
    `
},
{
    title: "Leçon 5 — L'écoute active",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi entend-on parfois sans comprendre ? Comment écouter vraiment ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre l'écoute active. Utiliser les techniques d'écoute. Améliorer sa compréhension. Prérequis : leçons 1 à 4.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'<strong>écoute active</strong> est une attitude qui consiste à se concentrer sur le message de l'autre, à le comprendre et à le reformuler pour vérifier.</p>
<p><strong>Techniques :</strong> regarder l'interlocuteur, éviter les distractions, reformuler, poser des questions, noter l'essentiel.</p>
<p><strong>Obstacles :</strong> bruit, fatigue, préjugés, envie de répondre, téléphone.</p>
<p><strong>Bienfaits :</strong> meilleure compréhension, mémorisation, relations.</p>
</div>
<img src="images/MethodologieGenerale1_6.jpg" alt="Écoute active" data-image-id="MethodologieGenerale1_6" onerror="this.style.display='none'">

<h3>3. Méthodes et techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Reformuler : « Si je comprends bien, tu veux dire que… ». Poser des questions : « Peux-tu préciser ? ». Prendre des notes. Éviter téléphone, interruptions, jugements hâtifs.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>En cours, un élève écoute activement : il regarde l'enseignant, note les idées principales, reformule après le cours. Il comprend mieux que celui qui rêvasse.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois techniques d'écoute active.</p>
<details><summary>Corrigé</summary>
<p>Reformuler, poser des questions, prendre des notes.</p>
</details>

          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
