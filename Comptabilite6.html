const slides = [
{

    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours prépare l'EXETAT (4e secondaire). Il comprend 9 leçons, suivies d'un quiz de révision.</p>
<ul>

`

{
    title: "Leçon 1 — Les pièces justificatives et la note d'imputation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Au service comptabilité de la société LESUEUR à Kinshasa, un stagiaire reçoit une facture d'achat, un reçu de caisse et un bordereau de banque. Avant de les enregistrer, il doit vérifier leur authenticité et préparer une note d'imputation. Sans pièces valides, aucune écriture n'est possible.</p></div>
<h3>1. Définition et importance des pièces justificatives</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Pièce justificative</strong> : document original qui prouve l'existence d'une opération comptable (facture, reçu, chèque, bordereau).</li><li><strong>Importance</strong> : elle garantit la réalité, la date et le montant de l'opération ; elle sert de preuve en cas de contrôle fiscal ou de litige.</li><li><strong>Obligation légale</strong> : l'article 15 de l'Acte uniforme OHADA impose la conservation des pièces justificatives.</li><li><strong>Catégories</strong> : pièces de base (factures, reçus) et pièces auxiliaires (bons de commande, bordereaux).</li></ul></div>
<h3>2. Le traitement des pièces</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Contrôle</strong> : vérifier l'originalité, l'exactitude des montants, la conformité de la TVA et la signature des responsables.</li><li><strong>Classement</strong> : trier par nature (achat, vente, banque, caisse) et par date.</li><li><strong>Pré-comptabilisation</strong> : inscrire sur la pièce les codes des comptes à débiter et à créditer.</li><li><strong>Note d'imputation</strong> : document interne qui indique les comptes débités et crédités pour chaque opération.</li></ul></div>
<h3>3. Application au cas LESUEUR</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Facture n°013 du 5 mars 2018 : achat de 5 cartons de piles à 15 130 FC, remise 2 % (1 513 FC), net commercial 74 137 FC, TVA 16 % (11 862 FC), net à payer 85 999 FC.</p><ul><li><strong>Comptes débités</strong> : 601 (Achats de marchandises) 74 137 ; 445 (TVA récupérable) 11 862.</li><li><strong>Compte crédité</strong> : 401 (Fournisseurs) 85 999.</li><li><strong>Note d'imputation</strong> : D 601 et 445 / C 401.</li></ul><p><a href="https://www.youtube.com/results?search_query=pièces+justificatives+note+d'imputation+comptabilité+OHADA" target="_blank" rel="noopener">🎥 Recherche : pièces justificatives et note d'imputation (chaînes de cours de comptabilité)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les pièces justificatives prouvent les opérations. On les contrôle, on les classe et on prépare une note d'imputation qui indique les comptes à débiter et à créditer.</p></div>
<div class="sources"><strong>Sources :</strong> Curriculum de Commerciale et Gestion, 6e année (MEPST/DIPROMAD, 2023), Fonction 1, compétence 1.1.2.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, OHADA, TVA.</div>
    `
},
{
    title: "Leçon 2 — Les livres comptables : journaux, grand-livre, balance",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Le comptable de la société LESUEUR a enregistré toutes les factures du mois. Il doit maintenant reporter les écritures dans le grand-livre et établir la balance. Sans cette étape, impossible de produire les états financiers.</p></div>
<h3>1. Les livres comptables obligatoires</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Livre-journal</strong> : enregistrement chronologique de toutes les opérations, écriture par écriture.</li><li><strong>Grand-livre</strong> : regroupement des écritures par compte (601, 401, 521, etc.).</li><li><strong>Balance générale</strong> : tableau récapitulatif des soldes de tous les comptes (à 4 ou 6 colonnes).</li><li><strong>Journaux auxiliaires</strong> : journaux spécialisés (achats, ventes, banque, caisse, paie).</li><li><strong>Grands livres auxiliaires</strong> : détail des comptes de tiers (fournisseurs, clients).</li></ul></div>
<h3>2. Le principe de la partie double</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li>Toute opération affecte <strong>au moins deux comptes</strong> : un débit et un crédit d'égal montant.</li><li><strong>Débit</strong> : emplois (actif qui augmente, charges).</li><li><strong>Crédit</strong> : ressources (passif qui augmente, produits).</li><li><strong>Vérification</strong> : total débit = total crédit à chaque écriture.</li></ul></div>
<h3>3. Application au cas LESUEUR</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Écriture d'achat du 5 mars 2018 :</p><ul><li>Débit 601 Achats de marchandises : 74 137</li><li>Débit 445 TVA récupérable : 11 862</li><li>Crédit 401 Fournisseurs : 85 999</li></ul><p>Dans le grand-livre, le compte 401 est crédité de 85 999. Dans la balance, le solde créditeur du 401 est 85 999, équilibré par les soldes débiteurs de 601 et 445.</p><p><a href="https://www.youtube.com/results?search_query=livres+comptables+journal+grand+livre+balance+partie+double" target="_blank" rel="noopener">🎥 Recherche : les livres comptables (chaînes de cours de comptabilité)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le journal enregistre chronologiquement, le grand-livre regroupe par compte, la balance récapitule les soldes. La partie double exige que débit = crédit à chaque écriture.</p></div>
<div class="sources"><strong>Sources :</strong> Curriculum de Commerciale et Gestion, 6e année (MEPST/DIPROMAD, 2023), Fonction 1, compétence 1.1.9.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, OHADA.</div>
    `
},
{
    title: "Leçon 3 — L'inventaire physique et les fiches de stock",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À la fin de l'exercice, le magasinier de LESUEUR compte les cartons de piles et de savon restants. Le comptable doit vérifier que les fiches de stock correspondent aux quantités physiques. C'est l'inventaire.</p></div>
<h3>1. L'inventaire physique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Inventaire</strong> : comptage physique des biens en stock à une date donnée.</li><li><strong>Fiche d'inventaire</strong> : document qui liste les articles, quantités et valeurs.</li><li><strong>Objectif</strong> : vérifier la concordance entre stock comptable et stock réel.</li><li><strong>Écarts</strong> : manquants (vol, perte) ou excédents (erreur d'enregistrement).</li></ul></div>
<h3>2. La gestion des stocks</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Fiche de stock</strong> : enregistre les entrées, sorties et le solde en quantité et en valeur.</li><li><strong>Méthodes de valorisation</strong> : CUMP (coût unitaire moyen pondéré), FIFO (premier entré, premier sorti), LIFO (dernier entré, premier sorti).</li><li><strong>Inventaire permanent</strong> : stock mis à jour à chaque mouvement.</li><li><strong>Inventaire intermittent</strong> : comptage périodique (fin de mois, fin d'année).</li></ul></div>
<h3>3. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Stock initial de piles : 10 cartons à 15 000 FC. Achat de 5 cartons à 15 130 FC. Sortie de 8 cartons. Le CUMP = (10 × 15 000 + 5 × 15 130) / 15 = 15 043 FC. Le stock final de 7 cartons est valorisé à 7 × 15 043 = 105 301 FC.</p><p><a href="https://www.youtube.com/results?search_query=inventaire+physique+fiche+de+stock+CUMP+comptabilité" target="_blank" rel="noopener">🎥 Recherche : inventaire et gestion des stocks (chaînes de cours de comptabilité)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'inventaire physique vérifie le stock réel. La fiche de stock suit les entrées/sorties. La valorisation utilise le CUMP, FIFO ou LIFO.</p></div>
<div class="sources"><strong>Sources :</strong> Curriculum de Commerciale et Gestion, 6e année (MEPST/DIPROMAD, 2023), Fonction 1, compétence 1.2.1.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, CUMP.</div>
    `
},
{
    title: "Leçon 4 — Les amortissements et les dépréciations",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>La camionnette de livraison de LESUEUR a coûté 20 000 000 FC. Elle perd de la valeur chaque année. Le comptable doit enregistrer cette perte : c'est l'amortissement. De même, certaines créances clients ne seront jamais payées : c'est la dépréciation.</p></div>
<h3>1. Les amortissements</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Amortissement</strong> : constatation comptable de la perte de valeur d'une immobilisation due à l'usure ou au temps.</li><li><strong>Immobilisation amortissable</strong> : bâtiment, matériel, véhicule, mobilier.</li><li><strong>Immobilisation non amortissable</strong> : terrain, fonds commercial.</li><li><strong>Modes</strong> : linéaire (annuité constante), dégressif (annuité décroissante).</li><li><strong>Formule linéaire</strong> : annuité = (valeur d'acquisition − valeur résiduelle) / durée d'utilisation.</li></ul></div>
<h3>2. Les dépréciations et provisions</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Dépréciation</strong> : perte de valeur probable d'un actif (créance, stock, titre).</li><li><strong>Provision</strong> : constatation comptable de cette perte probable.</li><li><strong>Créances douteuses</strong> : clients qui ne paient pas.</li><li><strong>Écriture</strong> : D 681 (Dotations aux provisions) / C 491 (Provisions pour dépréciation des clients).</li></ul></div>
<h3>3. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Camionnette : 20 000 000 FC, durée 5 ans, valeur résiduelle 0. Annuité linéaire = 20 000 000 / 5 = 4 000 000 FC par an. Écriture : D 681 Amortissements 4 000 000 / C 2815 Amortissements du matériel de transport 4 000 000.</p><p><a href="https://www.youtube.com/results?search_query=amortissement+linéaire+dégressif+dépréciation+comptabilité" target="_blank" rel="noopener">🎥 Recherche : amortissements et dépréciations (chaînes de cours de comptabilité)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'amortissement constate la perte de valeur des immobilisations (linéaire ou dégressif). La dépréciation constate la perte probable de valeur des créances ou stocks. Les deux se traduisent par des provisions.</p></div>
<div class="sources"><strong>Sources :</strong> Curriculum de Commerciale et Gestion, 6e année (MEPST/DIPROMAD, 2023), Fonction 1, compétence 1.2.1.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, OHADA.</div>
    `
},
{
    title: "Leçon 5 — Les états financiers : bilan, compte de résultat et TAFIRE",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À la fin de l'exercice, le comptable de LESUEUR doit présenter les états financiers au directeur. Il prépare le bilan, le compte de résultat et le TAFIRE. Ces documents résument la situation financière de l'entreprise.</p></div>
<h3>1. Le bilan</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Bilan</strong> : photographie du patrimoine de l'entreprise à une date donnée.</li><li><strong>Actif</strong> : ce que possède l'entreprise (immobilisations, stocks, créances, trésorerie).</li><li><strong>Passif</strong> : ce que doit l'entreprise (capitaux propres, dettes).</li><li><strong>Équilibre</strong> : Total Actif = Total Passif.</li><li>Le bilan est structuré par <strong>grandes masses</strong> : actif immobilisé, actif circulant, trésorerie-actif.</li></ul></div>
<h3>2. Le compte de résultat</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Compte de résultat</strong> : document qui retrace les charges et les produits de l'exercice.</li><li><strong>Produits</strong> : ventes, prestations, produits financiers.</li><li><strong>Charges</strong> : achats, salaires, loyers, impôts.</li><li><strong>Résultat</strong> : Produits − Charges = Bénéfice (si positif) ou Perte (si négatif).</li><li>Il permet de calculer le <strong>chiffre d'affaires</strong> et la <strong>rentabilité</strong>.</li></ul></div>
<h3>3. Le TAFIRE</h3>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>La société LESUEUR produit du savon et veut connaître le coût de fabrication de chaque carton. Pour fixer son prix de vente et calculer sa marge, elle a besoin de la comptabilité analytique.</p></div>
<h3>1. Objet de la comptabilité analytique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Comptabilité analytique</strong> : branche de la comptabilité qui calcule les coûts et détermine le prix de revient.</li><li><strong>Objectif</strong> : connaître le coût de chaque produit, service ou commande.</li><li><strong>Différence avec la comptabilité générale</strong> : la générale enregistre les opérations globales, l'analytique détaille par produit.</li><li><strong>CAE</strong> : Comptabilité Analytique d'Exploitation.</li></ul></div>
<h3>2. Les différents coûts</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Coût d'achat</strong> : prix d'achat + frais accessoires (transport, douane).</li><li><strong>Coût de production</strong> : coût d'achat des matières + main-d'œuvre + frais de fabrication.</li><li><strong>Coût de distribution</strong> : frais de vente (publicité, livraison).</li><li><strong>Prix de revient</strong> : coût de production + coût de distribution.</li><li><strong>Marge</strong> : Prix de vente − Prix de revient.</li></ul></div>
<h3>3. Les charges directes et indirectes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Charges directes</strong> : affectables immédiatement à un produit (matières premières, main-d'œuvre directe).</li><li><strong>Charges indirectes</strong> : concernent plusieurs produits ; nécessitent une répartition (loyer, électricité, entretien).</li><li><strong>Répartition</strong> : méthode des sections homogènes (centres d'analyse).</li><li><strong>Unité d'œuvre</strong> : unité qui mesure l'activité d'un centre (heure-machine, kg de matière).</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Production de 1 000 cartons de savon : matières premières 2 000 000 FC (charges directes), main-d'œuvre 800 000 FC (directes), frais généraux 400 000 FC (indirects à répartir). Coût de production = 3 200 000 FC, soit 3 200 FC par carton. Si le prix de vente est de 4 000 FC, la marge est de 800 FC par carton.</p><p><a href="https://www.youtube.com/results?search_query=comptabilité+analytique+coûts+prix+de+revient+charges+indirectes" target="_blank" rel="noopener">🎥 Recherche : comptabilité analytique (chaînes de cours de comptabilité)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La comptabilité analytique calcule les coûts (achat, production, distribution) et le prix de revient. Les charges directes s'affectent, les indirectes se répartissent. La marge = prix de vente − prix de revient.</p></div>
<div class="sources"><strong>Sources :</strong> Curriculum de Commerciale et Gestion, 6e année (MEPST/DIPROMAD, 2023), Fonction 1, comptabilité analytique.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, CAE.</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>Le directeur de LESUEUR demande au comptable si l'entreprise est financièrement équilibrée. Le comptable calcule le fonds de roulement, le besoin en fonds de roulement et la trésorerie.</p></div>
<h3>1. Le fonds de roulement (FR)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Fonds de roulement</strong> : ressources stables − emplois stables.</li><li><strong>Ressources stables</strong> : capitaux propres + dettes à long terme.</li><li><strong>Emplois stables</strong> : actif immobilisé.</li><li><strong>FR positif</strong> : l'entreprise dispose de ressources à long terme pour financer son cycle d'exploitation.</li><li><strong>FR négatif</strong> : situation dangereuse (financement des immobilisations par des dettes à court terme).</li></ul></div>
<h3>2. Le besoin en fonds de roulement (BFR)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>BFR</strong> : actif circulant (hors trésorerie) − passif circulant (hors trésorerie).</li><li><strong>Actif circulant</strong> : stocks + créances clients.</li><li><strong>Passif circulant</strong> : dettes fournisseurs + dettes fiscales.</li><li><strong>BFR positif</strong> : besoin de financement du cycle d'exploitation.</li></ul></div>
<h3>3. La trésorerie nette</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Trésorerie nette (TN) = FR − BFR</strong>.</li><li><strong>TN positive</strong> : l'entreprise a de la trésorerie disponible.</li><li><strong>TN négative</strong> : l'entreprise est en tension de trésorerie (risque de cessation de paiement).</li><li><strong>Ratios d'analyse</strong> : autonomie financière, liquidité, rentabilité.</li></ul></div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>FR = ressources stables − emplois stables. BFR = actif circulant − passif circulant. TN = FR − BFR. Ces trois indicateurs mesurent l'équilibre financier de l'entreprise.</p></div>

    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>La société LESUEUR veut placer 5 000 000 FC à la banque pendant 5 ans à un taux de 8 %. Le comptable doit calculer la valeur acquise et la valeur actuelle. C'est l'objet des mathématiques financières.</p></div>
<h3>1. Les intérêts composés</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Intérêts composés</strong> : les intérêts de chaque période s'ajoutent au capital et produisent eux-mêmes des intérêts.</li><li><strong>Valeur acquise (Vn)</strong> : Vn = V0 × (1 + i)<sup>n</sup>.</li><li><strong>Valeur actuelle (V0)</strong> : V0 = Vn / (1 + i)<sup>n</sup>.</li><li><strong>V0</strong> : capital initial ; <strong>i</strong> : taux d'intérêt par période ; <strong>n</strong> : nombre de périodes.</li></ul></div>
<h3>2. Les annuités</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Annuité</strong> : suite de versements égaux effectués à intervalles réguliers.</li><li><strong>Valeur acquise d'une suite de versements</strong> : Vn = a × [(1 + i)<sup>n</sup> − 1] / i.</li><li><strong>Valeur actuelle d'une suite de versements</strong> : V0 = a × [1 − (1 + i)<sup>−n</sup>] / i.</li><li><strong>a</strong> : montant de l'annuité.</li><li><strong>Applications</strong> : remboursement d'emprunt, épargne, retraite.</li></ul></div>
<h3>3. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Placement de 5 000 000 FC à 8 % pendant 5 ans : V5 = 5 000 000 × (1,08)<sup>5</sup> = 5 000 000 × 1,4693 = 7 346 500 FC.</p><p>Versement annuel de 1 000 000 FC à 8 % pendant 5 ans : V5 = 1 000 000 × [(1,08)<sup>5</sup> − 1] / 0,08 = 1 000 000 × 5,8666 = 5 866 600 FC.</p><p><a href="https://www.youtube.com/results?search_query=intérêts+composés+annuités+mathématiques+financières" target="_blank" rel="noopener">🎥 Recherche : mathématiques financières (chaînes de cours de comptabilité)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Valeur acquise : Vn = V0 × (1 + i)<sup>n</sup>. Valeur actuelle : V0 = Vn / (1 + i)<sup>n</sup>. Annuités : Vn = a × [(1 + i)<sup>n</sup> − 1] / i.</p></div>
<div class="sources"><strong>Sources :</strong> Curriculum de Commerciale et Gestion, 6e année (MEPST/DIPROMAD, 2023), Fonction 4, compétence 4.2.2.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT.</div>

function highlightInCurrentSlide(term) {

    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}

function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>

<script>
(function () {
  var SITE = "https://ecolia-course.github.io/";
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface", page servie par https://app.local
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function abs(u) { return /^(https?:|data:|blob:)/i.test(u) ? u : (NATIVE ? SITE + u.replace(/^(\.\/|\/)+/, "") : u); }
  function ext(u) { var m = String(u).split("?")[0].match(/\.(jpe?g|png|gif|webp|svg)$/i); return m ? m[1].toLowerCase() : "jpg"; }
  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {
    if (queued[fn]) return;
    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
    if (!queue.length) { running = false; return; }
    if (!navigator.onLine) { running = false; return; }
    var q = queue.shift(), t0 = Date.now();
    try { CoursInterface.download(q[0], q[1]); } catch (e) { return setTimeout(next, 500); }
    (function wait() {
      var ok = false;
      try { ok = !!CoursInterface.exists(q[1]); } catch (e) {}
      if (ok) setTimeout(next, 1500);
      else if (Date.now() - t0 > 40000) next();
      else setTimeout(wait, 700);
    })();
  }
  function exists(fn) { try { return !!CoursInterface.exists(fn); } catch (e) { return false; } }

  function show(img) {                                    // affiche UNE image (appelé à chaque slide affichée)
    if (!table || img.getAttribute("data-ecolia-done")) return;
    var id = img.getAttribute("data-image-id");
    var url = table[id];
    if (typeof url !== "string" || !url.length) { console.warn("ECOLIA : image absente du JSON :", id); return; }
    img.setAttribute("data-ecolia-done", "1");
    if (!NATIVE) { img.onerror = function () { hide(img); }; img.setAttribute("src", url); return; }
    var full = abs(url), fn = "img_" + id + "." + ext(url);
    if (exists(fn)) {                                     // déjà sur l'appareil : lecture locale, sans internet
      img.onerror = function () {                         // fichier incomplet : on le supprime et on utilise le site
        try { CoursInterface["delete"](fn); } catch (e) {}
        queued[fn] = 0;
        img.onerror = function () { hide(img); };
        img.setAttribute("src", full);
      };
      img.setAttribute("src", "https://app.local/cours/" + fn);
    } else {
      img.onerror = function () { hide(img); };
      img.setAttribute("src", full);
      enqueue(full, fn);
    }
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches("img[data-image-id]")) show(root);
    root.querySelectorAll("img[data-image-id]").forEach(show);
  }
  function prefetchAll() {                                // APK : prépare TOUTES les images du cours pour le hors-ligne
    var ids = {};
    try { JSON.stringify(slides).replace(/data-image-id=\\?"([^"\\]+)/g, function (m, id) { ids[id] = 1; }); } catch (e) {}
    Object.keys(ids).forEach(function (id) {
      var url = table[id];
      if (typeof url !== "string" || !url.length) return;
      var fn = "img_" + id + "." + ext(url);
      if (!exists(fn)) enqueue(abs(url), fn);
    });
  }
  function start(tbl) {
    table = tbl;
    scan(document.body);
    new MutationObserver(function (muts) {                // les slides sont écrites à la volée : on traite chaque nouvelle image
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
    if (NATIVE) prefetchAll();
  }

  var JSON_URL = NATIVE ? SITE + "images_ecolia.json" : "images_ecolia.json";
  var KEY = "ecolia_images_json";
  fetch(JSON_URL, NATIVE ? { cache: "no-cache" } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (table) { if (NATIVE) lsSet(KEY, JSON.stringify(table)); start(table); })
    .catch(function (e) {
      var saved = null;
      if (NATIVE) { try { saved = JSON.parse(lsGet(KEY) || "null"); } catch (x) {} }
      if (saved) start(saved);                              // hors ligne dans l'APK : JSON gardé la dernière fois
      else console.warn("ECOLIA : JSON des images indisponible.", e);
    });
})();
</script>
