<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours de chimie de 2e année scientifique couvre cinq leçons essentielles : la stœchiométrie et les gaz parfaits, la structure de la matière (liaisons et solides cristallins), l'oxydoréduction, les acides et bases (pH et titrages), et une initiation à la chimie organique (hydrocarbures et pétrochimie).</p>
<p><strong>Note :</strong> le programme éducatif du DAS (DIPROMAD/MEPST, 2021) sert de cadre ; la progression s'appuie sur les fiches pédagogiques et le manuel de Chimie 2e année (Édition 2025) qui l'opérationnalisent. Certaines valeurs numériques (constantes d'acidité, potentiels redox) doivent être vérifiées dans des tables de référence avant usage officiel.</p>
<ul>
<li>Leçon 1 — Stœchiométrie, moles et gaz parfaits</li>
<li>Leçon 2 — Structure de la matière : liaisons et solides cristallins</li>

</ul>
<p>Une évaluation finale de 20 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Chimie 2e année des Humanités (Édition 2025, RDC) ; Manuel de Chimie 2e année des Humanités (Édition 2025) ; Programme Éducatif du DAS – Humanités Scientifiques (DIPROMAD/MEPST, 2021).</div>

{
    title: "Leçon 1 — Stœchiométrie, moles et gaz parfaits",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Combien de moles d'eau y a-t-il dans un verre de 180 g ? Quel volume de CO₂ produit la combustion d'1 kg de charbon ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Maîtriser la notion de mole et de masse molaire. Équilibrer une équation-bilan. Identifier le réactif limitant. Appliquer la loi des gaz parfaits. Prérequis : notions de stœchiométrie de 1re année.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Mole :</strong> quantité de matière contenant 6,022 × 10²³ entités (nombre d'Avogadro).</p>
<p><strong>Masse molaire M :</strong> masse d'une mole d'une substance, en g/mol. Exemple : M(H₂O) = 18 g/mol ; M(CO₂) = 44 g/mol.</p>
<p><strong>Relations fondamentales :</strong></p>
<ul>
<li>n = m / M (moles = masse / masse molaire).</li>
<li>n = N / N_A (moles = nombre d'entités / nombre d'Avogadro).</li>
</ul>
<p><strong>Équation-bilan :</strong> écriture symbolique d'une réaction chimique, avec coefficients stœchiométriques équilibrés. Exemple : CH₄ + 2 O₂ → CO₂ + 2 H₂O.</p>
<p><strong>Réactif limitant :</strong> réactif entièrement consommé en premier ; il détermine la quantité de produit formée.</p>
<p><strong>Loi des gaz parfaits :</strong> PV = nRT, avec P en pascals, V en m³, n en moles, T en kelvins, R = 8,314 J/(mol·K).</p>
<p><strong>Volume molaire :</strong> dans les conditions normales (0 °C, 1 atm), V_m ≈ 22,4 L/mol.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Mole :</strong> quantité de matière contenant N_A entités. <strong>Masse molaire :</strong> masse d'une mole. <strong>Réactif limitant :</strong> réactif totalement consommé. <strong>Gaz parfait :</strong> modèle de gaz obéissant à PV = nRT.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Équilibrer l'équation-bilan AVANT tout calcul. Convertir les masses en moles. Identifier le réactif limitant. Utiliser les proportions stœchiométriques. Vérifier les unités (P en Pa, V en m³, T en K).</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>36 g d'eau : n = 36 / 18 = 2 mol. Combustion de 1 kg de charbon (approximé en C pur) : C + O₂ → CO₂. n(C) = 1000 / 12 ≈ 83,3 mol ; donc n(CO₂) ≈ 83,3 mol ; V ≈ 83,3 × 22,4 ≈ 1 866 L dans les CNTP.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Combien de moles dans 36 g d'eau (M = 18 g/mol) ? <strong>Ex. 2 :</strong> Équilibrer : C₃H₈ + O₂ → CO₂ + H₂O.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> n = 36 / 18 = 2 mol. <strong>2)</strong> C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une équation-bilan équilibrée est la clé de tout calcul stœchiométrique.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Chimie 2e année (Édition 2025) ; Manuel de Chimie 2e année (Édition 2025).</div>
    `
},
{
    title: "Leçon 2 — Structure de la matière : liaisons et solides cristallins",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi le diamant raye-t-il le verre alors que le graphite écrit ? Pourquoi le sel se dissout-il dans l'eau ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer les types de liaisons. Comprendre le lien entre structure microscopique et propriétés macroscopiques. Connaître les solides cristallins. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Trois grands types de liaisons :</strong></p>
<ul>
<li><strong>Liaison ionique :</strong> transfert d'électrons entre un métal et un non-métal (ex. NaCl). Forte, cassante, soluble dans l'eau, conductrice à l'état fondu.</li>
<li><strong>Liaison covalente :</strong> mise en commun d'électrons entre non-métaux (ex. H₂O, diamant). Forte et orientée ; les solides covalents sont souvent très durs et isolants.</li>
<li><strong>Liaison métallique :</strong> réseau d'ions positifs baignant dans un « nuage » d'électrons libres (ex. cuivre, fer). Conducteurs, ductiles, malléables.</li>
</ul>
<p><strong>Électronégativité :</strong> capacité d'un atome à attirer les électrons dans une liaison. Une différence d'électronégativité importante donne une liaison ionique ; faible, une liaison covalente.</p>
<p><strong>Solides cristallins :</strong> organisation périodique des atomes, décrite par une <strong>maille élémentaire</strong> (plus petite unité répétée). Exemples : cubique à faces centrées (diamant), cubique centrée, hexagonal.</p>
<p><strong>Solides amorphes :</strong> sans ordre périodique (verre).</p>
<p><strong>Cas du carbone :</strong> diamant (réseau covalent, très dur, isolant) et graphite (feuillets de carbone, tendre, conducteur) sont deux formes du même élément.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Liaison ionique :</strong> attraction entre ions de charges opposées. <strong>Liaison covalente :</strong> mise en commun d'électrons. <strong>Maille élémentaire :</strong> unité de base du cristal. <strong>Électronégativité :</strong> aptitude à attirer les électrons.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier les atomes en présence. Comparer leurs électronégativités. En déduire le type de liaison dominant. Relier le type de liaison aux propriétés observables (dureté, conductivité, solubilité).</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Le diamant du Kasaï-Oriental illustre la structure cubique à face centrée (réseau covalent tridimensionnel), d'où sa dureté exceptionnelle. Le sel (NaCl) est un réseau ionique : il se dissout dans l'eau (solvant polaire) mais pas dans l'huile (apolaire).</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quel type de liaison prédomine dans NaCl ? <strong>Ex. 2 :</strong> Pourquoi le graphite et le diamant ont-ils des propriétés différentes ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Liaison ionique. <strong>2)</strong> Même élément (carbone), mais structures cristallines différentes (feuillets vs réseau covalent 3D).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La structure microscopique explique les propriétés macroscopiques.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel de Chimie 2e année (Édition 2025) ; Programme DAS (DIPROMAD/MEPST, 2021).</div>
    `
},
{
    title: "Leçon 3 — Oxydoréduction : équilibrage et applications",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi le fer rouille-t-il ? Comment fonctionne une pile ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir oxydant et réducteur. Équilibrer une équation redox en milieu acide et basique. Identifier les applications. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Oxydation :</strong> perte d'électrons (ex. Fe²⁺ → Fe³⁺ + e⁻).</p>
<p><strong>Réduction :</strong> gain d'électrons (ex. Cu²⁺ + 2 e⁻ → Cu).</p>
<p><strong>Oxydant :</strong> espèce qui capte des électrons (elle est réduite). <strong>Réducteur :</strong> espèce qui cède des électrons (elle est oxydée).</p>
<p><strong>Nombre d'oxydation :</strong> charge fictive attribuée à un atome. Ex. S dans H₂SO₄ : +VI.</p>
<p><strong>Équilibrage en milieu acide :</strong></p>
<ol>
<li>Écrire les demi-équations.</li>
<li>Équilibrer les atomes autres que O et H.</li>
<li>Équilibrer O avec H₂O.</li>
<li>Équilibrer H avec H⁺.</li>
<li>Équilibrer les charges avec des électrons.</li>
<li>Égaliser le nombre d'électrons et additionner.</li>
</ol>
<p>En milieu basique : ajouter des OH⁻ pour neutraliser les H⁺.</p>
<p><strong>Applications :</strong> piles, accumulateurs, corrosion des métaux, métallurgie extractive (extraction du cuivre à partir de la chalcopyrite CuFeS₂), traitement des eaux.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Oxydation :</strong> perte d'électrons. <strong>Réduction :</strong> gain d'électrons. <strong>Anode :</strong> électrode où a lieu l'oxydation. <strong>Cathode :</strong> électrode où a lieu la réduction.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Écrire les demi-équations séparément. Équilibrer les charges. Additionner en éliminant les électrons. Vérifier que les charges et les atomes sont équilibrés dans l'équation finale.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Équilibrer en milieu acide : MnO₄⁻ + Fe²⁺ → Mn²⁺ + Fe³⁺. Demi-équations : MnO₄⁻ + 8 H⁺ + 5 e⁻ → Mn²⁺ + 4 H₂O ; Fe²⁺ → Fe³⁺ + e⁻. Multiplier la seconde par 5 et additionner : MnO₄⁻ + 5 Fe²⁺ + 8 H⁺ → Mn²⁺ + 5 Fe³⁺ + 4 H₂O.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Que subit un atome qui perd des électrons ? <strong>Ex. 2 :</strong> Dans une pile, où a lieu l'oxydation ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Une oxydation. <strong>2)</strong> À l'anode.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Dans une réaction redox, les électrons perdus par le réducteur sont gagnés par l'oxydant.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Chimie 2e année (Édition 2025) ; Manuel de Chimie 2e année (Édition 2025).</div>
    `
},
{
    title: "Leçon 4 — Acides et bases : pH et titrages",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi le jus de citron est-il acide et l'eau de chaux basique ? Comment déterminer la concentration d'un acide ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir les acides et bases selon Brønsted-Lowry. Calculer un pH. Comprendre le principe du titrage. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Définition de Brønsted-Lowry :</strong> un acide est un donneur de proton H⁺ ; une base est un accepteur de proton H⁺.</p>
<p><strong>pH :</strong> pH = −log[H₃O⁺]. Échelle de 0 à 14 à 25 °C.</p>
<ul>
<li>pH < 7 : solution acide.</li>
<li>pH = 7 : solution neutre.</li>
<li>pH > 7 : solution basique.</li>
</ul>
<p><strong>Acide fort / faible :</strong> un acide fort se dissocie totalement dans l'eau (ex. HCl) ; un acide faible partiellement (ex. CH₃COOH).</p>
<p><strong>Exemples de pH :</strong> jus de citron ≈ 2 ; vinaigre ≈ 3 ; eau pure = 7 ; eau de chaux ≈ 12 ; soude concentrée ≈ 14.</p>
<p><strong>Titrage acido-basique :</strong> méthode pour déterminer la concentration d'une solution inconnue en la faisant réagir avec une solution de concentration connue.</p>
<p><strong>Équivalence :</strong> les quantités de matière d'acide et de base sont dans les proportions stœchiométriques. Pour un monoacide/monobase : C_a × V_a = C_b × V_b.</p>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Hydrocarbures :</strong> composés formés uniquement de carbone et d'hydrogène.</p>
<p><strong>Familles principales :</strong></p>
<ul>
<li><strong>Alcanes :</strong> liaisons simples uniquement (saturés). Formule générale : CₙH₂ₙ₊₂. Exemples : méthane CH₄, éthane C₂H₆, propane C₃H₈, butane C₄H₁₀.</li>
<li><strong>Alcènes :</strong> une double liaison C=C. Formule : CₙH₂ₙ. Exemple : éthylène C₂H₄.</li>
<li><strong>Alcynes :</strong> une triple liaison C≡C. Formule : CₙH₂ₙ₋₂. Exemple : acétylène C₂H₂.</li>
<li><strong>Aromatiques :</strong> cycle benzénique. Exemple : benzène C₆H₆.</li>
</ul>
<p><strong>Nomenclature simple :</strong> préfixe (méth-, éth-, prop-, but-, pent-…) + suffixe (-ane, -ène, -yne).</p>
<p><strong>Combustion :</strong> complète → CO₂ + H₂O ; incomplète → CO (toxique) + suie.</p>
<p><strong>Pétrochimie :</strong> raffinage du pétrole brut pour produire carburants (essence, gazole), gaz (butane, propane), matières premières pour plastiques, engrais, médicaments. Impact environnemental : pollution de l'air, marées noires, gaz à effet de serre.</p>

  var CFG = {"code":"Chimie2","base":"https://ecolia-course.github.io/ecolia-media/audio_files/","available":[1,2,3,4,5,6,7],"count":7,"sizeMo":9,"sizes":{"1":656832,"2":1749120,"3":1555584,"4":1362432,"5":1662528,"6":1433664,"7":85632},"fallback":{"1":[["fr","Sommaire, Chimie. Sommaire. Ce cours de chimie de 2e année scientifique couvre cinq leçons essentielles: la stœchiométrie et les gaz parfaits, la structure de la matière (liaisons et solides cristallins), l'oxydoréduction, les acides et bases (pH et titrages), et une initiation à la chimie organique (hydrocarbures et pétrochimie). Note: le programme éducatif du DAS (DIPROMAD ou MEPST, 2021) sert de cadre; la progression s'appuie sur les fiches pédagogiques et le manuel de Chimie 2e année (Édition 2025) qui l'opérationnalisent. Certaines valeurs numériques (constantes d'acidité, potentiels redox) doivent être vérifiées dans des tables de référence avant usage officiel. Leçon 1, Stœchiométrie, moles et gaz parfaits. Leçon 2, Structure de la matière: liaisons et solides cristallins. Leçon 3, Oxydoréduction: équilibrage et applications. Leçon 4, Acides et bases: pH et titrages. Leçon 5, Chimie organique: hydrocarbures et pétrochimie. Une évaluation finale de 20 questions couvre l'ensemble des leçons."]],"2":[["fr","Leçon 1, Stœchiométrie, moles et gaz parfaits. Situation. « Combien de moles d'eau y a-t-il dans un verre de 180 grammes? Quel volume de C O2 produit la combustion d'1 kilogrammes de charbon? ». Objectifs. Maîtriser la notion de mole et de masse molaire. Équilibrer une équation-bilan. Identifier le réactif limitant. Appliquer la loi des gaz parfaits. Prérequis: notions de stœchiométrie de 1re année. Théorie. Mole: quantité de matière contenant 6,022 multiplié par 10 au carré au cube entités (nombre d'Avogadro). Masse molaire M: masse d'une mole d'une substance, en g ou mol. Exemple: M(H2 O) égale 18 grammes ou mol; M(C O2) égale 44 grammes ou mol. Relations fondamentales: n égale m ou M (moles égale masse ou masse molaire). n égale N ou N_A (moles égale nombre d'entités ou nombre d'Avogadro). Équation-bilan: écriture symbolique d'une réaction chimique, avec coefficients stœchiométriques équilibrés. Exemple: C H4 plus 2 O2, donc C O2 plus 2 H2 O. Réactif limitant: réactif entièrement consommé en premier; il détermine la quantité de produit formée. Loi des gaz parfaits: PV égale nRT, avec P en pascals, V en m au cube, n en moles, T en kelvins, R égale 8,314 J/(mol multiplié par K). Volume molaire: dans les conditions normales (0 degrés Celsius, 1 atm), V_m environ égal à 22,4 litres ou mol. Définitions. Mole: quantité de matière contenant N_A entités. Masse molaire: masse d'une mole. Réactif limitant: réactif totalement consommé. Gaz parfait: modèle de gaz obéissant à PV égale nRT. Méthodes et règles. Équilibrer l'équation-bilan AVANT tout calcul. Convertir les masses en moles. Identifier le réactif limitant. Utiliser les proportions stœchiométriques. Vérifier les unités (P en Pa, V en m au cube, T en K). Exemple. 36 grammes d'eau: n égale 36 sur 18 égale 2 mol. Combustion de 1 kilogrammes de charbon (approximé en C pur): C plus O2, donc C O2. n(C) égale 1000 sur 12 environ égal à 83,3 mol; donc n(C O2) environ égal à 83,3 mol; V environ égal à 83,3 multiplié par 22,4 environ égal à 1 866 litres dans les CNTP. Exercices. Ex. 1: Combien de moles dans 36 grammes d'eau (M égale 18 grammes ou mol)? Ex. 2: Équilibrer: C3 H8 plus O2, donc C O2 plus H2 O. Corrigé. 1) n égale 36 sur 18 égale 2 mol. 2) C3 H8 plus 5 O2, donc 3 C O2 plus 4 H2 O. À retenir. Une équation-bilan équilibrée est la clé de tout calcul stœchiométrique."]],"3":[["fr","Leçon 2, Structure de la matière: liaisons et solides cristallins. Situation. « Pourquoi le diamant raye-t-il le verre alors que le graphite écrit? Pourquoi le sel se dissout-il dans l'eau? ». Objectifs. Distinguer les types de liaisons. Comprendre le lien entre structure microscopique et propriétés macroscopiques. Connaître les solides cristallins. Prérequis: leçon 1. Théorie. Trois grands types de liaisons: Liaison ionique: transfert d'électrons entre un métal et un non-métal (ex. NaCl). Forte, cassante, soluble dans l'eau, conductrice à l'état fondu. Liaison covalente: mise en commun d'électrons entre non-métaux (ex. H2 O, diamant). Forte et orientée; les solides covalents sont souvent très durs et isolants. Liaison métallique: réseau d'ions positifs baignant dans un « nuage » d'électrons libres (ex. cuivre, fer). Conducteurs, ductiles, malléables. Électronégativité: capacité d'un atome à attirer les électrons dans une liaison. Une différence d'électronégativité importante donne une liaison ionique; faible, une liaison covalente. Solides cristallins: organisation périodique des atomes, décrite par une maille élémentaire (plus petite unité répétée). Exemples: cubique à faces centrées (diamant), cubique centrée, hexagonal. Solides amorphes: sans ordre périodique (verre). Cas du carbone: diamant (réseau covalent, très dur, isolant) et graphite (feuillets de carbone, tendre, conducteur) sont deux formes du même élément. Définitions. Liaison ionique: attraction entre ions de charges opposées. Liaison covalente: mise en commun d'électrons. Maille élémentaire: unité de base du cristal. Électronégativité: aptitude à attirer les électrons. Méthodes et règles. Identifier les atomes en présence. Comparer leurs électronégativités. En déduire le type de liaison dominant. Relier le type de liaison aux propriétés observables (dureté, conductivité, solubilité). Exemple. Le diamant du Kasaï-Oriental illustre la structure cubique à face centrée (réseau covalent tridimensionnel), d'où sa dureté exceptionnelle. Le sel (NaCl) est un réseau ionique: il se dissout dans l'eau (solvant polaire) mais pas dans l'huile (apolaire). Exercices. Ex. 1: Quel type de liaison prédomine dans NaCl? Ex. 2: Pourquoi le graphite et le diamant ont-ils des propriétés différentes? Corrigé. 1) Liaison ionique. 2) Même élément (carbone), mais structures cristallines différentes (feuillets vs réseau covalent 3D). À retenir. La structure microscopique explique les propriétés macroscopiques."]],"4":[["fr","Leçon 3, Oxydoréduction: équilibrage et applications. Situation. « Pourquoi le fer rouille-t-il? Comment fonctionne une pile? ». Objectifs. Définir oxydant et réducteur. Équilibrer une équation redox en milieu acide et basique. Identifier les applications. Prérequis: leçons 1 et 2. Théorie. Oxydation: perte d'électrons (ex. Fe au carré ⁺, donc Fe au cube ⁺ plus e⁻). Réduction: gain d'électrons (ex. Cu au carré ⁺ plus 2 e⁻, donc Cu). Oxydant: espèce qui capte des électrons (elle est réduite). Réducteur: espèce qui cède des électrons (elle est oxydée). Nombre d'oxydation: charge fictive attribuée à un atome. Ex. S dans H2 S O4: plus VI. Équilibrage en milieu acide: Écrire les demi-équations. Équilibrer les atomes autres que O et H. Équilibrer O avec H2 O. Équilibrer H avec H⁺. Équilibrer les charges avec des électrons. Égaliser le nombre d'électrons et additionner. En milieu basique: ajouter des OH⁻ pour neutraliser les H⁺. Applications: piles, accumulateurs, corrosion des métaux, métallurgie extractive (extraction du cuivre à partir de la chalcopyrite Cu Fe S2), traitement des eaux. Définitions. Oxydation: perte d'électrons. Réduction: gain d'électrons. Anode: électrode où a lieu l'oxydation. Cathode: électrode où a lieu la réduction. Méthodes et règles. Écrire les demi-équations séparément. Équilibrer les charges. Additionner en éliminant les électrons. Vérifier que les charges et les atomes sont équilibrés dans l'équation finale. Exemple. Équilibrer en milieu acide: Mn O4⁻ plus Fe au carré ⁺, donc Mn au carré ⁺ plus Fe au cube ⁺. Demi-équations: Mn O4⁻ plus 8 H⁺ plus 5 e⁻, donc Mn au carré ⁺ plus 4 H2 O; Fe au carré ⁺, donc Fe au cube ⁺ plus e⁻. Multiplier la seconde par 5 et additionner: Mn O4⁻ plus 5 Fe au carré ⁺ plus 8 H⁺, donc Mn au carré ⁺ plus 5 Fe au cube ⁺ plus 4 H2 O. Exercices. Ex. 1: Que subit un atome qui perd des électrons? Ex. 2: Dans une pile, où a lieu l'oxydation? Corrigé. 1) Une oxydation. 2) À l'anode. À retenir. Dans une réaction redox, les électrons perdus par le réducteur sont gagnés par l'oxydant."]],"5":[["fr","Leçon 4, Acides et bases: pH et titrages. Situation. « Pourquoi le jus de citron est-il acide et l'eau de chaux basique? Comment déterminer la concentration d'un acide? ». Objectifs. Définir les acides et bases selon Brønsted-Lowry. Calculer un pH. Comprendre le principe du titrage. Prérequis: leçons 1 à 3. Théorie. Définition de Brønsted-Lowry: un acide est un donneur de proton H⁺; une base est un accepteur de proton H⁺. pH: pH égale moins log[H3 O⁺]. Échelle de 0 à 14 à 25 degrés Celsius. pH inférieur à 7: solution acide. pH égale 7: solution neutre. pH supérieur à 7: solution basique. Acide fort ou faible: un acide fort se dissocie totalement dans l'eau (ex. HCl); un acide faible partiellement (ex. C H3 C O O H). Exemples de pH: jus de citron environ égal à 2; vinaigre environ égal à 3; eau pure égale 7; eau de chaux environ égal à 12; soude concentrée environ égal à 14. Titrage acido-basique: méthode pour déterminer la concentration d'une solution inconnue en la faisant réagir avec une solution de concentration connue. Équivalence: les quantités de matière d'acide et de base sont dans les proportions stœchiométriques. Pour un monoacide ou monobase: C_a multiplié par V_a égale C_b multiplié par V_b. Définitions. Acide: donneur de H⁺. Base: accepteur de H⁺. pH: moins log[H3 O⁺]. Équivalence: proportions stœchiométriques atteintes. Méthodes et règles. Utiliser pH égale moins log[H3 O⁺] pour les acides forts. Utiliser un indicateur coloré adapté pour repérer l'équivalence. Noter le volume versé à l'équivalence pour calculer la concentration. Attention: le pH est logarithmique (une unité de pH égale facteur 10 sur [H3 O⁺]). Exemple. Solution de HCl à 10⁻ au cube mol ou L (acide fort, totalement dissocié): [H3 O⁺] égale 10⁻ au cube mol ou L, donc pH égale 3. Titrage: 20 mL de HCl inconnu neutralisés par 15 mL de NaOH à 0,1 mol ou L. C_a multiplié par 20 égale 0,1 multiplié par 15, donc C_a égale 0,075 mol ou L. Exercices. Ex. 1: pH d'une solution de HCl à 10⁻ au cube mol ou L? Ex. 2: Que se passe-t-il à l'équivalence d'un titrage? Corrigé. 1) pH égale 3. 2) Acide et base sont dans les proportions stœchiométriques. À retenir. pH égale moins log[H3 O⁺]; à l'équivalence acido-basique, les quantités d'acide et de base sont dans les proportions stœchiométriques."]],"6":[["fr","Leçon 5, Chimie organique: hydrocarbures et pétrochimie. Situation. « D'où viennent l'essence, le gaz de cuisine, le plastique? Que signifie \"hydrocarbure\"? ». Objectifs. Reconnaître les grandes familles d'hydrocarbures. Nommer quelques alcanes. Comprendre le rôle de la pétrochimie. Prérequis: leçons 1 à 4. Théorie. Hydrocarbures: composés formés uniquement de carbone et d'hydrogène. Familles principales: Alcanes: liaisons simples uniquement (saturés). Formule générale: CₙH2ₙ₊2. Exemples: méthane C H4, éthane C2 H6, propane C3 H8, butane C4 H10. Alcènes: une double liaison C égale C. Formule: CₙH2ₙ. Exemple: éthylène C2 H4. Alcynes: une triple liaison C≡C. Formule: CₙH2ₙ₋2. Exemple: acétylène C2 H2. Aromatiques: cycle benzénique. Exemple: benzène C6 H6. Nomenclature simple: préfixe (méth-, éth-, prop-, but-, pent-…) plus suffixe (-ane, -ène, -yne). Combustion: complète, donc C O2 plus H2 O; incomplète, donc CO (toxique) plus suie. Pétrochimie: raffinage du pétrole brut pour produire carburants (essence, gazole), gaz (butane, propane), matières premières pour plastiques, engrais, médicaments. Impact environnemental: pollution de l'air, marées noires, gaz à effet de serre. Définitions. Alcane: hydrocarbure saturé (liaisons simples). Alcène: hydrocarbure à double liaison. Alcyne: à triple liaison. Pétrochimie: industrie de transformation du pétrole. Méthodes et règles. Compter les atomes de carbone pour nommer. Identifier le type de liaison (simple ou double ou triple). Distinguer combustion complète et incomplète. Ne pas confondre formule brute et formule développée. Exemple. L'alcane à 4 atomes de carbone est le butane (C4 H10), utilisé comme gaz de cuisine. La combustion complète du méthane: C H4 plus 2 O2, donc C O2 plus 2 H2 O. Exercices. Ex. 1: Formule générale d'un alcane? Ex. 2: Nom de l'alcane à 4 carbones? Corrigé. 1) CₙH2ₙ₊2. 2) Butane. À retenir. La structure des hydrocarbures détermine leurs propriétés et leurs usages."]],"7":[["fr","Évaluation finale, Chimie. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 12 sur 20, tu as réussi."]]}};

  var synth = window.speechSynthesis || null;

  function init() {
    if (document.getElementById("ecolia-audio-btn")) return;

    // ---------- éléments de l'interface ----------
    var btn = document.createElement("button");

    function urlN(n) {   // dans l'APK la page est sur https://app.local : une adresse relative doit pointer vers le site

    // ====================================================================
    //  Stockage hors ligne : 2 moteurs, même interface

    // ====================================================================
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {                                   // fichier complet ? (taille exacte connue à la génération)
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () {
          var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok);
        },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) {
          try { CoursInterface.delete(nameN(n)); } catch (e) {}
          writeOk(readOk().filter(function (x) { return x !== n; }));
          return Promise.resolve();
        }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }   // ancien contenu invalide
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) {
          return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); })
            .then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; });
        },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);

    function refreshUI() {

        : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
