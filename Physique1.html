<script>
const COURSE_TITLE = "Physique";
const slides = [
{
    title: "Sommaire — Physique 1re secondaire",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>La physique t'apprend à observer le monde, à mesurer et à comprendre les phénomènes qui t'entourent : la matière, l'électricité, les forces, le mouvement. Ce cours utilise des exemples de la vie quotidienne en RDC et ne demande pas de matériel coûteux : un stylo, une règle, une balance suffisent pour commencer.</p>
<ul>
<li>Leçon 1 — Les états de la matière</li>
<li>Leçon 2 — Les phénomènes électriques élémentaires</li>
<li>Leçon 3 — Longueur, masse et temps</li>
<li>Leçon 4 — La mesure et sa précision</li>
<li>Leçon 5 — La notion de force</li>
<li>Leçon 6 — Le poids et la masse</li>
<li>Leçon 7 — L'équilibre des forces et le moment</li>
<li>Leçon 8 — Les machines simples</li>
<li>Leçon 9 — La vitesse et le mouvement rectiligne uniforme</li>
<li>Leçon 10 — L'accélération et le mouvement varié</li>
<li>Leçon 11 — La loi de Newton et la chute libre</li>
<li>Leçon 12 — Travail, puissance et pression des fluides</li>
</ul>
<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme national de Physique (MEPST/DIPROMAD, 2007), Manuel de Physique 1re année (2025). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 1 — Les états de la matière",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un bloc de malachite du Katanga, l'eau du fleuve Kasaï dans une bouteille, l'air d'une salle de classe : tous sont de la matière, mais ils n'ont pas la même forme. Pourquoi ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Distinguer solide, liquide et gaz. Interpréter les états par la structure des particules. Expliquer les changements d'état. Prérequis : aucun.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La matière existe sous trois états principaux :</p>
<ul>
<li><strong>Solide :</strong> forme propre et volume propre (un bloc de malachite).</li>
<li><strong>Liquide :</strong> volume propre, mais pas de forme propre (l'eau prend la forme du récipient).</li>
<li><strong>Gaz :</strong> ni forme ni volume propres ; il occupe tout l'espace disponible (l'air).</li>
</ul>
<p><strong>Interprétation microscopique :</strong> La matière est faite de particules. Dans un solide, elles sont très proches et liées ; dans un liquide, proches mais mobiles ; dans un gaz, très espacées et désordonnées.</p>
</div>
<img src="images/Physique1_1.jpg" alt="Glace, eau liquide et vapeur" data-image-id="Physique1_1" onerror="this.style.display='none'">
<img src="images/Physique1_2.jpg" alt="Bloc de malachite" data-image-id="Physique1_2" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour identifier un état : observer la forme et le volume. Pour interpréter : relier les propriétés aux particules. Les changements d'état (fusion, solidification, vaporisation) s'expliquent par une variation d'agitation des particules.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>L'eau liquide bout et devient vapeur (vaporisation), puis redevient liquide sur un couvercle froid (condensation).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Pourquoi un gaz n'a-t-il pas de forme propre ?</p>
<details><summary>Corrigé</summary>
<p>Parce que ses particules sont très espacées et se déplacent librement, occupant tout l'espace disponible.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les trois états de la matière se distinguent par leurs propriétés macroscopiques, expliquées par l'arrangement des particules.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Physique (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 2 — Les phénomènes électriques élémentaires",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un stylo frotté sur un tissu attire des petits papiers. Pourquoi ? Et pourquoi une pile peut-elle allumer une ampoule ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Expliquer l'électrisation par frottement. Distinguer charges positives et négatives. Identifier les effets du courant électrique continu.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Électrisation par frottement :</strong> en frottant certains matériaux, ils acquièrent une charge et attirent de petits objets.</p>
<p><strong>Charges :</strong> deux types (+ et −). Même signe = répulsion, signes contraires = attraction. L'électrisation résulte d'un transfert d'électrons (négatifs).</p>
<p><strong>Courant continu :</strong> produit par une pile, c'est un déplacement ordonné d'électrons. Il produit des effets thermiques (chauffage), magnétiques et chimiques.</p>
</div>
<img src="images/Physique1_3.jpg" alt="Stylo frotté attirant des papiers" data-image-id="Physique1_3" onerror="this.style.display='none'">
<img src="images/Physique1_4.jpg" alt="Pile connectée à une ampoule" data-image-id="Physique1_4" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Frotter deux matériaux différents puis approcher de petits papiers. <strong>Sécurité :</strong> ne jamais expérimenter avec le secteur (220 V) ; utiliser uniquement des piles.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une règle en plastique frottée sur les cheveux attire des papiers. Une pile plate de 4,5 V allume une petite ampoule.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite deux effets du courant électrique.</p>
<details><summary>Corrigé</summary>
<p>Effet thermique (chauffage) et effet magnétique (électroaimant).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'électricité est présente dans la matière ; l'électrisation et le courant continu s'expliquent par le mouvement des électrons.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Physique (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 3 — Longueur, masse et temps",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment mesurer la longueur d'une parcelle, la masse d'un sac de riz, la durée d'un trajet ? Quelles unités utiliser ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Identifier les trois grandeurs fondamentales. Utiliser les unités SI. Convertir des unités simples.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Longueur (L) :</strong> unité SI le mètre (m). Multiples : km, hm, dam ; sous-multiples : dm, cm, mm.</p>
<p><strong>Masse (m) :</strong> unité SI le kilogramme (kg). Sous-multiples : g, mg ; multiple : tonne (t).</p>
<p><strong>Temps (t) :</strong> unité SI la seconde (s). Unités pratiques : minute (min), heure (h).</p>
</div>
<img src="images/Physique1_5.jpg" alt="Règle graduée en centimètres" data-image-id="Physique1_5" onerror="this.style.display='none'">
<img src="images/Physique1_6.jpg" alt="Balance de cuisine avec poids" data-image-id="Physique1_6" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p><strong>Longueurs :</strong> 1 km = 1 000 m ; 1 m = 100 cm. <strong>Masses :</strong> 1 kg = 1 000 g ; 1 t = 1 000 kg. <strong>Temps :</strong> 1 h = 60 min = 3 600 s.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une parcelle mesure 25 m (2 500 cm). Un sac de riz pèse 25 kg (25 000 g).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Convertis 3,5 km en m ; 2,5 kg en g.</p>
<details><summary>Corrigé</summary>
<p>3 500 m ; 2 500 g.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Longueur, masse et temps sont les trois grandeurs fondamentales ; leurs unités SI sont le mètre, le kilogramme et la seconde.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Physique (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 4 — La mesure et sa précision",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Deux élèves mesurent la même table et trouvent 1,20 m et 1,22 m. Qui a raison ? La mesure est-elle exacte ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre qu'aucune mesure n'est parfaitement exacte. Utiliser les chiffres significatifs. Estimer une incertitude.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Toute mesure comporte une <strong>incertitude absolue</strong> (marge d'erreur de l'instrument) et une <strong>incertitude relative</strong> (qualité de la mesure).</p>
<p>Les <strong>chiffres significatifs</strong> sont les chiffres qui ont un sens. On ne donne pas plus de chiffres que la précision de l'instrument.</p>
</div>
<img src="images/Physique1_7.jpg" alt="Chronomètre" data-image-id="Physique1_7" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Exprimer une mesure : valeur ± incertitude (ex. : 1,20 m ± 0,01 m). Arrondir : si le chiffre suivant est ≥ 5, on arrondit au supérieur.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une règle graduée au mm mesure 12,3 cm. La mesure s'écrit 12,3 cm ± 0,1 cm (incertitude absolue de 1 mm).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Une balance affiche 2,50 kg avec une précision de 0,05 kg. Exprime la mesure.</p>
<details><summary>Corrigé</summary>
<p>2,50 kg ± 0,05 kg.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La mesure est toujours approximative ; les chiffres significatifs et l'incertitude permettent d'exprimer la précision d'un résultat.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Physique (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 5 — La notion de force",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un chariot de pousse-pousse avance-t-il quand on le pousse ? Pourquoi un ressort s'allonge-t-il quand on tire dessus ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir une force. Identifier ses quatre caractéristiques. Représenter une force par un vecteur.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une force est une action mécanique capable de déformer un corps ou de modifier son mouvement.</p>
<p><strong>Quatre caractéristiques :</strong></p>
<ol>
<li>Point d'application (où).</li>
<li>Droite d'action (direction).</li>
<li>Sens (vers où).</li>
<li>Intensité (valeur), en newtons (N).</li>
</ol>
<p>On la représente par une flèche (vecteur).</p>
</div>
<img src="images/Physique1_8.jpg" alt="Pousse-pousse à Kinshasa" data-image-id="Physique1_8" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Représenter une force : choisir une échelle (ex. 1 cm ↔ 10 N), tracer la flèche. Mesurer : utiliser un dynamomètre (en N).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève pousse un chariot avec 50 N vers l'avant. Flèche horizontale de 5 cm (échelle 1 cm ↔ 10 N).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les quatre caractéristiques d'une force.</p>
<details><summary>Corrigé</summary>
<p>Point d'application, droite d'action, sens, intensité.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une force est une action vectorielle à quatre caractéristiques, mesurable au dynamomètre et représentable par une flèche.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Physique (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 6 — Le poids et la masse",
    content: `

    function pickVoice(lang) {

      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
