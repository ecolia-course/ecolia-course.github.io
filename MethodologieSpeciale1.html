<script>
const COURSE_TITLE = "Méthodologie spéciale";
const slides = [
{
    title: "Sommaire — Méthodologie spéciale 1re secondaire",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>La méthodologie spéciale t'apprend à enseigner une discipline précise. Comment formuler des objectifs ? Comment préparer une leçon ? Comment choisir les méthodes et les supports ? Comment évaluer les élèves ? Ce cours te donne les outils concrets du métier d'enseignant. Tu vas apprendre par l'exemple, la simulation et la pratique.</p>
<ul>
<li>Leçon 1 — Qu'est-ce que la méthodologie spéciale ?</li>
<li>Leçon 2 — Formuler des objectifs pédagogiques</li>
<li>Leçon 3 — Concevoir une leçon : la fiche de préparation</li>
<li>Leçon 4 — Choisir les méthodes d'enseignement</li>
<li>Leçon 5 — Utiliser les supports pédagogiques</li>
<li>Leçon 6 — Gérer les activités de classe</li>
<li>Leçon 7 — La didactique du français</li>
<li>Leçon 8 — La didactique des mathématiques</li>
<li>Leçon 9 — La didactique des sciences</li>
<li>Leçon 10 — Concevoir l'évaluation</li>
<li>Leçon 11 — Différencier l'enseignement</li>
<li>Leçon 12 — Adapter au contexte congolais</li>
</ul>
<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques de Méthodologie spéciale (2025), Programme national (EDIDEPS, 2007), Taxonomie de Bloom. Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 1 — Qu'est-ce que la méthodologie spéciale ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Enseigner les mathématiques et enseigner l'histoire, est-ce la même chose ? Pourquoi faut-il des méthodes différentes selon la discipline ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir la méthodologie spéciale. La distinguer de la méthodologie générale. Comprendre son importance pour l'enseignement. Prérequis : leçons de méthodologie générale (n°31).</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>méthodologie spéciale</strong> est l'application des principes généraux de la pédagogie à l'enseignement d'une discipline particulière (français, mathématiques, sciences, histoire, etc.).</p>
<p>Elle se distingue de la <strong>méthodologie générale</strong> (techniques de travail valables pour toutes les disciplines) et de la <strong>pédagogie générale</strong> (principes de l'éducation).</p>
<p>Chaque discipline a sa logique propre, ses méthodes, ses outils, ses types d'activités.</p>
</div>
<img src="images/MethodologieSpeciale1_1.jpg" alt="Enseignant en classe" data-image-id="MethodologieSpeciale1_1" onerror="this.style.display='none'">

<h3>3. Méthodes et techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour enseigner une discipline, il faut : maîtriser le contenu, connaître les programmes, choisir les méthodes, préparer les supports, évaluer. La méthodologie spéciale articule théorie et pratique.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>En mathématiques, la résolution de problèmes exige des étapes précises ; en français, la production écrite exige une planification et une révision ; en sciences, l'observation et l'expérimentation sont centrales.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la différence entre méthodologie générale et méthodologie spéciale ?</p>
<details><summary>Corrigé</summary>
<p>La méthodologie générale concerne les techniques valables partout ; la méthodologie spéciale concerne l'enseignement d'une discipline précise.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La méthodologie spéciale adapte les principes pédagogiques à chaque discipline.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques de Méthodologie spéciale (2025).</div>
    `
},
{
    title: "Leçon 2 — Formuler des objectifs pédagogiques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Que veut-on que les élèves sachent faire à la fin de la leçon ? Comment le formuler clairement ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre l'utilité des objectifs. Distinguer objectif général et objectif spécifique. Formuler un objectif opérationnel. Prérequis : leçon 1.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un <strong>objectif pédagogique</strong> est l'énoncé de ce que l'élève doit être capable de faire à la fin d'une séquence d'apprentissage.</p>
<p><strong>Objectif général :</strong> énoncé large (ex. : « être capable de communiquer en français »).</p>
<p><strong>Objectif spécifique :</strong> énoncé précis (ex. : « être capable de rédiger une lettre formelle »).</p>
<p><strong>Objectif opérationnel :</strong> énoncé qui décrit un comportement observable et mesurable.</p>
<p><strong>Taxonomie de Bloom :</strong> classifie les objectifs en niveaux (connaissance, compréhension, application, analyse, synthèse, évaluation).</p>
</div>
<img src="images/MethodologieSpeciale1_2.jpg" alt="Objectifs pédagogiques" data-image-id="MethodologieSpeciale1_2" onerror="this.style.display='none'">
<img src="images/MethodologieSpeciale1_3.jpg" alt="Taxonomie de Bloom" data-image-id="MethodologieSpeciale1_3" onerror="this.style.display='none'">

<h3>3. Méthodes et techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Un objectif opérationnel comporte : un verbe d'action observable, une condition (contexte) et un critère de réussite. Exemple : « À la fin de la leçon, l'élève sera capable de résoudre trois équations du premier degré, sans erreur. » Éviter les verbes non observables (savoir, comprendre) ; préférer identifier, classer, résoudre, rédiger.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>« À la fin de la leçon, l'élève sera capable d'expliquer, avec ses propres mots, les trois étapes de la photosynthèse, en citant les éléments nécessaires. » L'objectif est observable et mesurable.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la différence entre objectif général et objectif opérationnel ?</p>
<details><summary>Corrigé</summary>
<p>L'objectif général est large ; l'objectif opérationnel est observable et mesurable.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Formuler des objectifs opérationnels est la première étape de la préparation d'une leçon.</p></div>

<div class="sources"><strong>Sources :</strong> Taxonomie de Bloom, Fiches pédagogiques de Méthodologie spéciale (2025).</div>
    `
},
{
    title: "Leçon 3 — Concevoir une leçon : la fiche de préparation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment préparer une leçon pour qu'elle soit claire, structurée et efficace ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Connaître la structure d'une fiche de préparation. Rédiger une fiche simple. Articuler objectifs, activités et évaluation. Prérequis : leçons 1 et 2.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>fiche de préparation</strong> est le document qui planifie une leçon. Elle comporte :</p>
<ol>
<li>Identification : discipline, classe, date, thème, durée.</li>
<li>Objectifs : général et opérationnels.</li>
<li>Matériel : supports nécessaires.</li>
<li>Déroulement : introduction (rappel, motivation), développement (activités), conclusion (synthèse, évaluation).</li>
<li>Évaluation : questions, exercices.</li>
<li>Observations : remarques après la leçon.</li>
</ol>
</div>
<img src="images/MethodologieSpeciale1_4.jpg" alt="Fiche de préparation de leçon" data-image-id="MethodologieSpeciale1_4" onerror="this.style.display='none'">

<h3>3. Méthodes et techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Préparer une fiche : identifier le thème, formuler les objectifs, prévoir les activités, anticiper les difficultés, préparer l'évaluation. La fiche doit être claire, réaliste et adaptée au niveau des élèves.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Fiche de leçon sur « La photosynthèse » : objectif (expliquer les trois étapes), matériel (schéma, feuilles, images), déroulement (question de départ, observation, explication, schéma, synthèse), évaluation (questions).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les parties d'une fiche de préparation.</p>
<details><summary>Corrigé</summary>
<p>Identification, objectifs, matériel, déroulement, évaluation, observations.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La fiche de préparation est l'outil central de l'enseignant.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques de Méthodologie spéciale (2025).</div>
    `
},
{
    title: "Leçon 4 — Choisir les méthodes d'enseignement",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Faut-il toujours faire un cours magistral ? Quand faut-il faire travailler les élèves en groupe ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Connaître les principales méthodes. Choisir la méthode adaptée. Combiner les méthodes. Prérequis : leçons 1 à 3.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<ul>
<li><strong>Méthode magistrale (expositive) :</strong> l'enseignant transmet le savoir.</li>
<li><strong>Méthode active :</strong> l'élève découvre, manipule, cherche.</li>
<li><strong>Méthode interrogative (maïeutique) :</strong> l'enseignant pose des questions pour faire découvrir.</li>
<li><strong>Méthode de résolution de problèmes :</strong> l'élève cherche la solution.</li>
<li><strong>Méthode de projet :</strong> l'élève réalise une production concrète.</li>
</ul>
<p>Choix : selon l'objectif, le contenu, les élèves, le matériel, le temps.</p>
</div>
<img src="images/MethodologieSpeciale1_5.jpg" alt="Méthodes d'enseignement" data-image-id="MethodologieSpeciale1_5" onerror="this.style.display='none'">

<h3>3. Méthodes et techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Combiner les méthodes : commencer par une question (interrogative), expliquer (magistrale), faire pratiquer (active), évaluer. Adapter aux classes pléthoriques : activités simples, travail en groupes, consignes claires.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>En mathématiques, l'enseignant pose un problème (résolution), laisse chercher en groupes (active), explique la solution (magistrale), propose des exercices (application). La combinaison est plus efficace qu'une seule méthode.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois méthodes d'enseignement.</p>
<details><summary>Corrigé</summary>
<p>Magistrale, active, interrogative.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le choix des méthodes dépend de la situation ; la combinaison est souvent la plus efficace.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques de Méthodologie spéciale (2025).</div>
    `
},
{
    title: "Leçon 5 — Utiliser les supports pédagogiques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Que peut-on utiliser pour rendre une leçon plus concrète ? Comment faire quand on n'a pas de matériel ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Identifier les types de supports. Choisir les supports adaptés. Créer des supports avec peu de moyens. Prérequis : leçons 1 à 4.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les <strong>supports pédagogiques</strong> sont les outils qui aident à l'enseignement : tableau, craie, manuel, images, objets, affiches, schémas, cartes, vidéos, matériel de récupération.</p>
<p><strong>Fonctions :</strong> illustrer, concrétiser, motiver, mémoriser, faciliter la compréhension.</p>
<p><strong>Choix :</strong> selon la discipline, l'objectif, les élèves, les ressources disponibles.</p>
</div>
<img src="images/MethodologieSpeciale1_6.jpg" alt="Matériel didactique" data-image-id="MethodologieSpeciale1_6" onerror="this.style.display='none'">
<img src="images/MethodologieSpeciale1_14.jpg" alt="Matériel de récupération" data-image-id="MethodologieSpeciale1_14" onerror="this.style.display='none'">

<h3>3. Méthodes et techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>

    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
