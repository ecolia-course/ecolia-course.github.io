<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours de français consolide les acquis du degré inférieur et prépare au degré supérieur. Il couvre la lecture, l'écriture, la maîtrise de la langue et l'expression orale. Il s'appuie sur les compétences attendues au degré moyen (3e et 4e années des humanités) du programme national de français.</p>
<p><strong>Note de transparence :</strong> le programme national de français organise le secondaire en trois degrés (inférieur, moyen, supérieur). Le découpage exact de la 3e année doit être vérifié sur le programme officiel en vigueur. Les douze leçons ci-dessous constituent une progression alignée sur les compétences du degré moyen, et non un découpage officiel page par page.</p>

{
    title: "Leçon 1 — Diagnostic et rappel des acquis",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Où en suis-je en français ? Quelles sont mes forces et mes difficultés avant de commencer l'année ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Faire le point sur ses acquis en lecture, écriture et langue. Identifier ses points forts et ses points faibles. Construire un contrat de travail personnel pour l'année.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Un diagnostic, pas une note</div>
<p>Le diagnostic de début d'année n'est pas une évaluation notée : c'est un outil pour l'élève et pour l'enseignant. Il permet de repérer les acquis solides et les notions à consolider. Il sert à adapter les exercices : remédiation pour les élèves en difficulté, approfondissement pour les autres.</p>
<p>Le mini-test porte sur cinq domaines :</p>
<ol>
<li><strong>Accord sujet-verbe :</strong> « Les élèves ___ (arriver) tôt. » — quelle est la terminaison correcte ?</li>
<li><strong>Temps du récit :</strong> identifier l'imparfait et le passé simple dans une phrase.</li>
<li><strong>Ponctuation :</strong> placer correctement virgules et points dans un court paragraphe.</li>
<li><strong>Vocabulaire :</strong> donner un synonyme et un antonyme de trois mots courants.</li>
<li><strong>Compréhension courte :</strong> lire cinq lignes et dégager l'idée principale.</li>
</ol>
</div>
<div class="bloc exemple"><div class="bloc-label">Auto-évaluation</div>
<p>Après la correction collective, l'élève remplit un tableau à trois colonnes : « ce que je maîtrise », « ce que je dois revoir », « ce que je veux améliorer en priorité ». Ce tableau sera réutilisé en fin de trimestre pour mesurer les progrès.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Contrat de travail</div>
<p>Le cours de français de l'année se concentre sur quatre compétences : lire (comprendre un texte), écrire (produire un texte structuré), maîtriser la langue (grammaire, conjugaison, orthographe, vocabulaire) et s'exprimer à l'oral. Chaque élève rédige trois phrases sur ce qu'il attend du cours de français et sur l'effort qu'il s'engage à fournir.</p>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le diagnostic n'est pas une note : c'est un point de départ. Il permet de personnaliser les apprentissages pour toute l'année.</p></div>
<div class="sources"><strong>Sources :</strong> Référentiels de compétences du degré moyen ; pratiques d'évaluation diagnostique.</div>

{
    title: "Leçon 2 — Le récit : structure et temps",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment un récit est-il construit ? Quelles étapes retrouve-t-on toujours dans une histoire bien racontée ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les cinq étapes du schéma narratif. Distinguer l'imparfait et le passé simple dans un récit. Rédiger une situation initiale cohérente.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le schéma narratif</div>
<p>Un récit bien construit suit cinq étapes :</p>
<ol>
<li><strong>Situation initiale :</strong> présentation des personnages, du lieu, du temps et de la situation de départ. Elle est souvent stable.</li>
<li><strong>Élément déclencheur :</strong> un événement vient bouleverser l'équilibre initial.</li>
<li><strong>Péripéties :</strong> les actions et les obstacles que les personnages rencontrent.</li>
<li><strong>Dénouement :</strong> la résolution du problème.</li>
<li><strong>Situation finale :</strong> nouvel équilibre, souvent différent de la situation initiale.</li>
</ol>
<img data-image-id="FR3_IMG01" alt="Schéma narratif" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les temps du récit</div>
<p>Dans un récit écrit au passé, deux temps se partagent le travail :</p>
<ul>
<li><strong>L'imparfait</strong> exprime l'arrière-plan : description, habitude, action en cours. Exemple : « Le soleil <em>brillait</em>, les oiseaux <em>chantaient</em>. »</li>
<li><strong>Le passé simple</strong> exprime les actions de premier plan, ponctuelles, qui font avancer l'histoire. Exemple : « Soudain, un cri <em>retentit</em>. »</li>
</ul>
<p>Point de vigilance : le passé simple est un temps <em>de l'écrit narratif</em>. À l'oral et dans les lettres familières, on utilise plutôt le passé composé. Ne pas les confondre.</p>
<img data-image-id="FR3_IMG02" alt="Temps du récit" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>« Ce matin-là, Kabila <em>se promenait</em> près du fleuve (imparfait, arrière-plan). Il <em>entendit</em> un bruit étrange (passé simple, premier plan). Il <em>s'approcha</em> et <em>découvrit</em> un enfant perdu (passé simple, péripétie). »</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Identifie les cinq étapes du schéma narratif dans un court récit fourni par le professeur.</p>
<p><strong>Ex. 2 :</strong> Rédige la situation initiale d'un récit à partir d'une image (5 à 6 phrases, à l'imparfait).</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>1)</strong> Repérer d'abord la stabilité (situation initiale), puis l'événement qui casse cette stabilité (élément déclencheur), puis les actions (péripéties), la résolution (dénouement) et la nouvelle situation (situation finale).</p>
<p><strong>2)</strong> La situation initiale doit présenter qui, où, quand, dans quelle situation stable, en utilisant l'imparfait pour les descriptions.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un récit s'organise en cinq étapes ; l'imparfait installe le décor, le passé simple fait avancer l'action.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels de français 3e année ; référentiels narratologiques scolaires.</div>
    `
},
{
    title: "Leçon 3 — La description dans le récit",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment décrire un lieu ou un personnage pour qu'il prenne vie dans l'esprit du lecteur ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les fonctions de la description. Maîtriser les outils descriptifs. Enrichir une phrase simple par des expansions. Produire une description courte et cohérente.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Trois fonctions de la description</div>
<ol>
<li><strong>Informer :</strong> donner au lecteur les éléments nécessaires pour comprendre la suite (lieu, époque, apparence).</li>
<li><strong>Créer une atmosphère :</strong> installer une ambiance (calme, tendue, joyeuse) par le choix des mots.</li>
<li><strong>Caractériser un personnage :</strong> faire deviner son âge, son milieu, son caractère, son état d'esprit.</li>
</ol>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les outils de la description</div>
<ul>
<li><strong>Les adjectifs qualificatifs :</strong> « un marché <em>bruyant</em>, <em>coloré</em>, <em>odorant</em> ».</li>
<li><strong>Les expansions du nom :</strong> relatives (« les femmes <em>qui vendent des légumes</em> »), compléments du nom (« les paniers <em>de tomates</em> »), appositions.</li>
<li><strong>Les verbes d'état :</strong> être, sembler, paraître, devenir, rester — utiles pour la description à l'imparfait.</li>
<li><strong>Les comparaisons et métaphores :</strong> « le marché bruissait <em>comme une ruche</em> », « les étals <em>étaient un arc-en-ciel</em> ».</li>
</ul>
</div>
<div class="bloc exemple"><div class="bloc-label">Exemple — Un marché de Kinshasa</div>
<p>« Le marché s'étendait sur plusieurs centaines de mètres. Les étals, couverts de bâches colorées, débordaient de mangues, de tomates et de poissons séchés. Des femmes en pagnes éclatants interpellaient les passants d'une voix forte et joyeuse. L'air sentait le gingembre, la terre humide et la friture. Sous le soleil de midi, les parasols semblaient une mer de taches vives. »</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Enrichis la phrase « La maison est grande » avec deux expansions (une relative et un adjectif).</p>
<p><strong>Ex. 2 :</strong> Décris en cinq phrases un lieu de ton quartier, en utilisant au moins un adjectif, une comparaison et un verbe d'état.</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>1)</strong> « La maison qui se dresse au bout de la rue est grande et accueillante. » (relative + adjectif)</p>
<p><strong>2)</strong> Toute description doit comporter les trois outils demandés et rester cohérente (temps, lieu, impressions).</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La description informe, installe une atmosphère ou caractérise un personnage ; elle s'appuie sur les adjectifs, les expansions et les figures.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels de français 3e année ; exercices classiques de description.</div>
    `
},

    title: "Leçon 4 — La phrase complexe : coordination et subordination",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certaines phrases sont-elles longues ? Comment relier deux idées dans une même phrase ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer phrase simple et phrase complexe. Reconnaître la coordination et la subordination. Analyser les propositions. Transformer deux phrases simples en une phrase complexe.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Simple ou complexe ?</div>
<p>Une <strong>phrase simple</strong> ne contient qu'<em>un seul verbe conjugué</em> (donc une seule proposition). Exemple : « Le garçon court vite. »</p>
<p>Une <strong>phrase complexe</strong> contient <em>plusieurs verbes conjugués</em> (donc plusieurs propositions). Exemple : « Le garçon court vite <em>parce qu'il</em> est en retard. »</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La coordination</div>
<p>La coordination relie deux propositions de même fonction à l'aide d'une conjonction de coordination ou d'un adverbe de liaison. On retient les sept conjonctions : <strong>mais, ou, et, donc, or, ni, car</strong>.</p>
<p>Exemple : « Il pleut <em>et</em> je reste à la maison. » — deux propositions indépendantes reliées par « et ».</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La subordination</div>
<p>La subordination relie une proposition <em>principale</em> et une proposition <em>subordonnée</em>, qui dépend de la principale. Deux cas essentiels à ce niveau :</p>
<ul>
<li><strong>La proposition subordonnée relative :</strong> introduite par un pronom relatif (<em>qui, que, dont, où</em>), elle complète un nom (l'antécédent). Exemple : « L'homme <em>qui</em> marche là-bas est mon voisin. »</li>
<li><strong>La proposition subordonnée complétive :</strong> introduite par « que », elle complète le verbe de la principale. Exemple : « Je pense <em>que</em> tu as raison. »</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Souligne les propositions et indique le lien (coordination ou subordination) dans : « Elle travaille beaucoup mais elle réussit. »</p>
<p><strong>Ex. 2 :</strong> Transforme en une seule phrase complexe : « Le professeur est arrivé. Les élèves se sont tus. »</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Deux propositions indépendantes reliées par « mais » : coordination.</p>
<p><strong>2)</strong> « Lorsque le professeur est arrivé, les élèves se sont tus. » (subordination) ou « Le professeur est arrivé et les élèves se sont tus. » (coordination).</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une phrase complexe combine plusieurs propositions ; la coordination relie par une conjonction, la subordination crée une dépendance.</p></div>
<div class="sources"><strong>Sources :</strong> Grammaires scolaires du français ; manuels de 3e année.</div>
    `
},
{
    title: "Leçon 5 — Les temps du passé",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment raconter un souvenir avec précision, en respectant la chronologie des actions ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comparer les trois temps du passé. Choisir le temps correct selon le sens. Raconter un souvenir cohérent en utilisant les trois temps.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Trois temps, trois emplois</div>
<ul>
<li><strong>Imparfait :</strong> action en cours, durée, habitude, description. « Chaque matin, il <em>se levait</em> à six heures. »</li>
<li><strong>Passé composé :</strong> action achevée, résultat présent, événement unique à l'oral et à l'écrit moderne. « Hier, il <em>est parti</em> très tôt. »</li>
<li><strong>Plus-que-parfait :</strong> action antérieure à une autre action passée. « Quand il est arrivé, elle <em>était déjà partie</em>. »</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Formation</div>
<ul>
<li><strong>Imparfait :</strong> radical du verbe au présent avec « nous » + terminaisons : -ais, -ais, -ait, -ions, -iez, -aient.</li>
<li><strong>Passé composé :</strong> auxiliaire être ou avoir au présent + participe passé du verbe.</li>
<li><strong>Plus-que-parfait :</strong> auxiliaire être ou avoir à l'imparfait + participe passé.</li>
</ul>
</div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>« Quand j'<em>étais</em> enfant (imparfait, description), je <em>passais</em> mes vacances chez ma grand-mère (imparfait, habitude). Un jour, elle m'<em>a offert</em> un livre (passé composé, événement). J'<em>avais</em> déjà <em>lu</em> une histoire semblable (plus-que-parfait, antériorité). »</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Complète au temps correct : « Quand je ___ (arriver), ils ___ (déjà / partir). »</p>
<p><strong>Ex. 2 :</strong> Rédige un souvenir de cinq à six phrases en utilisant les trois temps.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> « Quand je <em>suis arrivé</em> (passé composé), ils <em>étaient déjà partis</em> (plus-que-parfait). »</p>
<p><strong>2)</strong> Le récit doit enchaîner une description à l'imparfait, un événement au passé composé et une antériorité au plus-que-parfait.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'imparfait campe le décor, le passé composé raconte l'événement, le plus-que-parfait signale une action antérieure.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels de conjugaison 3e année.</div>
    `
},
{
    title: "Leçon 6 — Le texte argumentatif simple",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment convaincre un lecteur en défendant une opinion avec des arguments solides ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer thèse, arguments et exemples. Utiliser les connecteurs logiques. Rédiger une introduction et deux arguments sur un sujet scolaire.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le triangle de l'argumentation</div>
<ul>
<li><strong>La thèse :</strong> l'opinion défendue. Exemple : « Le téléphone portable devrait être interdit en classe. »</li>
<li><strong>Les arguments :</strong> les raisons qui soutiennent la thèse. « D'abord, il distrait les élèves. Ensuite, il nuit à la concentration. »</li>
<li><strong>Les exemples :</strong> cas concrets qui illustrent chaque argument. « Un élève qui reçoit un message pendant un cours de mathématiques décroche. »</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les connecteurs logiques</div>
<p>Ils marquent les relations entre les idées :</p>
<ul>
<li><strong>Ajout :</strong> d'abord, ensuite, enfin, de plus, par ailleurs.</li>
<li><strong>Opposition :</strong> cependant, pourtant, néanmoins, en revanche.</li>
<li><strong>Cause :</strong> car, parce que, en effet.</li>
<li><strong>Conséquence :</strong> donc, ainsi, par conséquent.</li>
</ul>
<img data-image-id="FR3_IMG04" alt="Carte mentale des connecteurs logiques" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc exemple"><div class="bloc-label">Exemple — Plan type sur « Faut-il interdire le téléphone à l'école ? »</div>
<p><strong>Introduction :</strong> phrase d'ouverture + thèse. « Le téléphone est partout. Faut-il l'interdire à l'école ? Pour ma part, je pense qu'il devrait être interdit en classe. »</p>
<p><strong>Argument 1 :</strong> « D'abord, il nuit à la concentration. » + exemple.</p>
<p><strong>Argument 2 :</strong> « Ensuite, il crée des inégalités entre élèves. » + exemple.</p>
<p><strong>Conclusion :</strong> rappel de la thèse.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Classe ces cinq phrases en arguments « pour » et arguments « contre » le sport obligatoire à l'école (phrases fournies par le professeur).</p>
<p><strong>Ex. 2 :</strong> Rédige une introduction et deux arguments sur le sujet : « Faut-il obliger les élèves à porter l'uniforme ? »</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>2)</strong> L'introduction énonce le sujet et la thèse ; chaque argument doit être relié à la thèse, illustré d'un exemple et introduit par un connecteur.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Argumenter, c'est défendre une thèse par des arguments illustrés d'exemples, reliés par des connecteurs logiques.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels de français 3e année ; exercices d'argumentation scolaire.</div>
    `
},
{
    title: "Leçon 7 — La lettre : personnelle et administrative",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment écrire une lettre pour demander un stage, remercier un proche ou réclamer un document ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer lettre personnelle et lettre administrative. Maîtriser la présentation formelle. Rédiger une lettre adaptée à son destinataire.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Deux types de lettres</div>
<ul>
<li><strong>Lettre personnelle :</strong> destinée à un proche. Ton familier ou amical, structure souple, formules affectueuses.</li>
<li><strong>Lettre administrative :</strong> destinée à une autorité (directeur, administration, entreprise). Ton neutre, structure rigoureuse, formules de politesse codifiées.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Structure de la lettre administrative</div>
<ol>
<li><strong>En-tête :</strong> coordonnées de l'expéditeur (nom, adresse, téléphone) en haut à gauche ; lieu et date.</li>
<li><strong>Coordonnées du destinataire :</strong> nom, fonction, adresse.</li>
<li><strong>Objet :</strong> résumé précis en une ligne (ex. « Demande de stage »).</li>
<li><strong>Formule d'appel :</strong> « Monsieur le Directeur, ».</li>
<li><strong>Corps :</strong> introduction (qui je suis, pourquoi j'écris) ; développement (arguments, demande) ; conclusion.</li>
<li><strong>Formule de politesse :</strong> « Je vous prie d'agréer, Monsieur le Directeur, l'expression de mes salutations respectueuses. »</li>
<li><strong>Signature :</strong> prénom et nom.</li>
</ol>
<img data-image-id="FR3_IMG03" alt="Exemple annoté de lettre administrative" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc exemple"><div class="bloc-label">Exemple — Demande de stage</div>
<p>« Objet : Demande de stage d'observation.<br>Monsieur le Directeur,<br>Actuellement élève en 3e année des humanités à l'école X, je souhaite effectuer un stage d'observation de deux semaines dans votre établissement. Ce stage me permettrait de découvrir concrètement le métier qui m'intéresse et de préciser mon projet d'orientation.<br>Je me tiens à votre disposition pour tout complément d'information et vous remercie de l'attention portée à ma demande.<br>Je vous prie d'agréer, Monsieur le Directeur, l'expression de mes salutations respectueuses.<br>[Signature] »</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Remets dans l'ordre les éléments d'une lettre administrative (éléments fournis en désordre par le professeur).</p>
<p><strong>Ex. 2 :</strong> Rédige une lettre personnelle de dix lignes à un ami pour raconter un événement de la semaine dernière.</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>1)</strong> Ordre attendu : en-tête / date / coordonnées destinataire / objet / formule d'appel / corps / formule de politesse / signature.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La lettre administrative obéit à un code strict ; la lettre personnelle libère le ton mais respecte une logique.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels de français 3e année ; modèles de correspondance officielle.</div>
    `
},
{
    title: "Leçon 8 — Le résumé de texte",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment résumer un texte long sans trahir sa pensée ni perdre l'essentiel ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre l'objectif du résumé. Appliquer la méthode en quatre étapes. Réduire un paragraphe sans déformer le sens.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — L'objectif du résumé</div>
<p>Résumer, c'est <strong>réduire un texte</strong> (souvent au quart ou au tiers de sa longueur) en gardant les idées essentielles, avec ses propres mots, sans ajouter d'opinion personnelle et sans trahir la pensée de l'auteur.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Méthode en quatre étapes</div>
<ol>
<li><strong>Lire attentivement</strong> le texte au moins deux fois pour comprendre le sens général.</li>
<li><strong>Repérer l'idée directrice</strong> : de quoi parle l'auteur ? Quelle est sa thèse ? Quels arguments soutiennent cette thèse ?</li>
<li><strong>Éliminer</strong> les exemples, les répétitions, les détails et les images.</li>
<li><strong>Reformuler</strong> les idées conservées avec ses propres mots, en respectant l'ordre du texte et en gardant le même système d'énonciation.</li>
</ol>
</div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Texte d'origine (10 lignes) :</strong> un paragraphe décrivant les bienfaits du sport sur la santé et citant plusieurs sports (football, natation, course) ainsi que plusieurs études.</p>
<p><strong>Résumé (2 phrases) :</strong> « La pratique régulière d'une activité sportive améliore la santé physique et mentale. Elle est recommandée à tous, quel que soit l'âge. »</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Résume en deux phrases un paragraphe de dix lignes fourni par le professeur.</p>
<p><strong>Ex. 2 :</strong> Compare ton résumé avec le résumé modèle : qu'as-tu conservé ? Qu'as-tu ajouté à tort ?</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>1)</strong> Un bon résumé garde les idées, élimine les exemples, reformule avec ses propres mots et respecte la longueur imposée.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Résumer, c'est réduire sans trahir : garder les idées, écarter les exemples, reformuler avec rigueur.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels de français 3e année ; exercices de contraction de texte.</div>
    `
},
{
    title: "Leçon 9 — Orthographe : accords et homophones",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi écrit-on « les élèves sont arrivés » et non « les élève sont arrivé » ? Comment éviter les confusions a/à, ou/où ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Maîtriser l'accord sujet-verbe. Accorder correctement l'adjectif qualificatif. Distinguer les homophones grammaticaux courants.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Accord sujet-verbe</div>
<p>Le verbe s'accorde en <strong>personne</strong> et en <strong>nombre</strong> avec son sujet. Cas à surveiller :</p>
<ul>
<li>Sujet éloigné : « Les enfants du quartier <em>jouent</em> au ballon. » (sujet = enfants)</li>
<li>Sujet inversé : « <em>Sont arrivés</em> les invités. »</li>
<li>Sujet collectif : « La foule <em>scandait</em> des slogans. » (singulier)</li>
<li>Plusieurs sujets : « Paul et Marie <em>étudient</em>. » (pluriel)</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Accord de l'adjectif qualificatif</div>
<p>L'adjectif s'accorde en <strong>genre</strong> et en <strong>nombre</strong> avec le nom qu'il qualifie. « Une élève <em>studieuse</em> ; des élèves <em>studieux</em> ; des filles <em>studieuses</em>. »</p>
<p>Cas particuliers : adjectifs de couleur (accord variable selon l'origine), adjectifs composés, adjectifs numéraux.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Homophones grammaticaux</div>
<ul>
<li><strong>a / à :</strong> « a » = verbe avoir (« il a un livre ») ; « à » = préposition (« il va à l'école »).</li>
<li><strong>ou / où :</strong> « ou » = choix (« fromage ou dessert ») ; « où » = lieu (« le pays où je vis »).</li>
<li><strong>ce / se :</strong> « ce » = démonstratif (« ce livre ») ; « se » = pronom réfléchi (« il se lave »).</li>
<li><strong>leur / leurs :</strong> « leur » = pronom (« je leur parle ») ; « leurs » = adjectif possessif pluriel (« leurs amis »).</li>
</ul>
<img data-image-id="FR3_IMG05" alt="Grille de relecture" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Corrige les dix erreurs d'un texte fourni (accords et homophones).</p>
<p><strong>Ex. 2 :</strong> Dictée préparée courte (5 lignes).</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>1)</strong> Repérer d'abord chaque verbe pour identifier son sujet, puis vérifier chaque homophone en remplaçant mentalement par le verbe avoir, ou en testant le sens.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'accord se construit autour du sujet et du nom ; les homophones se distinguent par le test.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels d'orthographe 3e année ; exercices classiques de dictée.</div>
    `
},
{
    title: "Leçon 10 — Expression orale : exposé et débat",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment présenter un sujet à la classe sans lire ses notes et en captant l'attention ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Structurer un exposé court. Maîtriser la voix et le regard. Participer à un débat avec respect.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Structure d'un exposé court</div>
<ol>
<li><strong>Introduction :</strong> annoncer le sujet, pourquoi il est intéressant, puis le plan (2 à 3 points).</li>
<li><strong>Développement :</strong> chaque point est développé avec une idée et un exemple.</li>
<li><strong>Conclusion :</strong> résumer l'essentiel en une phrase, remercier l'auditoire.</li>
</ol>
<p>Un exposé de 2 à 3 minutes suffit à ce niveau.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Voix et regard</div>
<ul>
<li><strong>Volume :</strong> adapté à la salle, suffisamment fort pour la dernière rangée.</li>
<li><strong>Débit :</strong> modéré ; marquer des pauses après chaque idée.</li>
<li><strong>Regard :</strong> balayer l'auditoire, éviter de lire ses notes mot à mot.</li>
<li><strong>Posture :</strong> stable, mains visibles, respiration calme.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le débat</div>
<p>Dans un débat, on écoute l'autre, on attend son tour, on répond par des arguments et non par des attaques personnelles. On utilise des formules comme « je comprends ton point de vue, mais… », « permets-moi d'ajouter que… », « je ne suis pas d'accord parce que… ».</p>
</div>
<div class="bloc exemple"><div class="bloc-label">Sujet d'exposé</div>
<p>« Un métier qui m'intéresse » : présenter le métier, expliquer pourquoi il attire, décrire les études nécessaires, les qualités requises. Grille d'évaluation : clarté de la structure, richesse du contenu, maîtrise de la langue, expression orale.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Prépare un exposé de deux minutes sur « un métier qui m'intéresse » et présente-le à la classe.</p>
<p><strong>Ex. 2 :</strong> Participe à un débat de cinq minutes sur « faut-il limiter l'usage du téléphone à l'école ? ».</p>
<details><summary>Corrigé indicatif</summary>
<p>L'évaluation porte sur la structure (introduction, développement, conclusion), la clarté de la langue, le volume et le regard, et la capacité à écouter et répondre dans le débat.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>S'exprimer à l'oral, c'est structurer sa pensée, maîtriser sa voix et respecter l'autre dans l'échange.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels d'expression orale 3e année ; pratiques de classe.</div>
    `
},
{
    title: "Leçon 11 — Lecture d'une œuvre africaine",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Que nous raconte une œuvre littéraire africaine ? Comment en comprendre le sens et la portée ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Lire une œuvre courte. Identifier les personnages, les thèmes, le contexte. Construire une fiche de lecture. Participer à un débat interprétatif.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Lire une œuvre africaine</div>
<p>La lecture d'une œuvre africaine permet de découvrir une culture, une histoire et des voix propres au continent. Le professeur choisit l'œuvre parmi les classiques africains disponibles et adaptés au degré moyen. L'élève apprend à :</p>
<ul>
<li>situer l'auteur et l'œuvre dans leur contexte historique et culturel (sans inventer de données) ;</li>
<li>repérer les personnages principaux et leurs relations ;</li>
<li>identifier les thèmes (famille, tradition, modernité, justice, exil, éducation…) ;</li>
<li>comprendre le message de l'auteur et les valeurs portées par le texte.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La fiche de lecture</div>
<p>Une fiche de lecture comporte :</p>
<ol>
<li><strong>Références :</strong> titre, auteur, année, genre.</li>
<li><strong>Résumé :</strong> en cinq à huit lignes.</li>
<li><strong>Personnages principaux :</strong> noms, rôles, traits saillants.</li>
<li><strong>Thèmes :</strong> deux ou trois thèmes, illustrés par des exemples.</li>
<li><strong>Extrait préféré :</strong> une phrase courte et la raison du choix.</li>
<li><strong>Avis personnel :</strong> appréciation argumentée en deux ou trois phrases.</li>
</ol>
</div>
<div class="bloc exemple"><div class="bloc-label">Exemple — Débat interprétatif</div>
<p>« Que veut dire l'auteur ? » n'a pas de réponse unique. On peut appuyer une interprétation sur des indices du texte (mots, situations, dialogues), en écoutant les autres interprétations. Il ne s'agit pas de deviner une « bonne » réponse mais de construire une lecture argumentée.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Complète une fiche de lecture pour l'œuvre étudiée.</p>
<p><strong>Ex. 2 :</strong> Participe à un débat interprétatif : appuie ton interprétation sur un passage précis de l'œuvre.</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>1)</strong> La fiche est complète lorsque les six rubriques sont remplies avec des éléments précis du texte.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Lire une œuvre africaine, c'est rencontrer une voix, une culture et une histoire ; la fiche de lecture organise cette rencontre.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels de lecture 3e année ; classiques africains disponibles ; notes de méthode sur la fiche de lecture.</div>
    `
},
{
    title: "Leçon 12 — Atelier d'écriture et évaluation finale",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment rédiger un récit court en intégrant description, dialogue et temps corrects ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Mobiliser les acquis de l'année dans une production écrite. Relire et corriger son texte. Évaluer la production d'un camarade.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Consignes de l'atelier</div>
<p>Rédiger un récit court de 15 à 20 lignes qui :</p>
<ul>
<li>suit le schéma narratif (situation initiale, élément déclencheur, péripéties, dénouement, situation finale) ;</li>
<li>comprend une description d'au moins trois phrases (lieu ou personnage) ;</li>
<li>comprend un dialogue de deux à quatre répliques ;</li>
<li>utilise correctement l'imparfait et le passé simple (ou le passé composé selon la situation d'énonciation choisie) ;</li>
<li>respecte l'orthographe, la ponctuation et les accords.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Grille de relecture</div>

      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
