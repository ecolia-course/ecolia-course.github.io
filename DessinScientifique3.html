    title: "Sommaire — Dessin Scientifique 3e année HS",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Le Dessin Scientifique est le langage graphique des sciences et des techniques. Il apprend à représenter avec précision des pièces, des solides et des ouvrages, à coter selon les normes et à lire un plan. Ce cours est orienté vers les applications industrielles et architecturales, en lien avec la géométrie descriptive (épure de Monge).</p>
<p><strong>Note de transparence :</strong> le Dessin Scientifique est attesté dans le régime pédagogique de la 3e année HS (DIPROMAD/MEPST, 2021) avec un horaire dédié, et documenté par des fiches pédagogiques officielles (Édition 2025). Le programme-matrice détaillé n'a pas été consulté page par page ; le plan ci-dessous en propose une progression alignée.</p>
<ul>
<li>Leçon 1 — Rappels : instruments, traits, cotation</li>
<li>Leçon 2 — Épure de Monge : point, droite, plan</li>
<li>Leçon 3 — Représentation de solides (élévation, profil, plan, coupe)</li>
<li>Leçon 4 — Perspective cavalière</li>
<li>Leçon 5 — Développement de surfaces</li>
<li>Leçon 6 — Dessin mécanique : cotation fonctionnelle</li>
<li>Leçon 7 — Dessin architectural : plans simples</li>
<li>Leçon 8 — Projet et évaluation</li>
</ul>
<p>Une évaluation finale de 12 questions couvre les notions clés et la sécurité graphique.</p>
</div>
<div class="sources"><strong>Sources :</strong> Régime pédagogique 3e HS (DIPROMAD/MEPST, 2021) ; fiches pédagogiques Dessin Scientifique 3e HS (Édition 2025) ; normes de dessin technique.</div>
    `
},
{
    title: "Leçon 1 — Rappels : instruments, traits, cotation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un dessin technique mal tracé peut-il provoquer un accident en atelier ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les instruments de dessin. Utiliser les différents types de traits. Comprendre le rôle de la cotation.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les instruments</div>
<ul>
<li><strong>Équerre :</strong> tracer des angles droits et des parallèles.</li>
<li><strong>Règle graduée :</strong> mesurer et reporter des longueurs.</li>
<li><strong>Compas :</strong> tracer des cercles et arcs, reporter des distances.</li>
<li><strong>Rapporteur :</strong> mesurer et tracer les angles.</li>
<li><strong>Crayons :</strong> mine dure (2H) pour la construction, mine tendre (HB) pour le tracé final.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les types de traits</div>
<ul>
<li><strong>Trait fort continu :</strong> contours visibles.</li>
<li><strong>Trait fin continu :</strong> lignes de cote, hachures, lignes de repère.</li>
<li><strong>Trait interrompu (mixte fin) :</strong> contours cachés.</li>
<li><strong>Trait d'axe (mixte long-point) :</strong> axes de symétrie et centres de cercles.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La cotation</div>
<p>La <strong>cotation</strong> indique les dimensions réelles de la pièce. Elle comporte : une ligne de cote, des lignes d'attache, des flèches et un chiffre. Une cote ne doit jamais être répétée inutilement : chaque dimension est indiquée une seule fois.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite quatre instruments de dessin technique et leur rôle.</p>
<p><strong>Ex. 2 :</strong> Reproduis un rectangle de 60 × 40 mm et coté correctement.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Équerre (angles droits), compas (cercles), règle (mesures), rapporteur (angles). <strong>2)</strong> Rectangle coté : deux cotes 60 mm et 40 mm, lignes de cote parallèles aux côtés.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le dessin technique repose sur des instruments précis, des traits normalisés et des cotes justes.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Dessin Scientifique 3e HS ; normes de dessin.</div>
    `
},
{
    title: "Leçon 2 — Épure de Monge : point, droite, plan",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment représenter en deux dimensions un objet qui en a trois ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le principe des deux plans de projection. Projeter un point, une droite. Réaliser une épure simple.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Deux plans de projection</div>
<p>La méthode de <strong>Monge</strong> repose sur deux plans perpendiculaires :</p>
<ul>
<li><strong>Plan horizontal (H) :</strong> projection vue de dessus.</li>
<li><strong>Plan frontal (F) :</strong> projection vue de face.</li>
</ul>
<p>Un objet est projeté orthogonalement sur chacun des plans. La ligne d'intersection des deux plans s'appelle la <strong>ligne de terre</strong>.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Projection d'un point</div>
<p>Un point A de l'espace a deux projections :</p>
<ul>
<li><strong>a</strong> sur le plan horizontal (projection horizontale).</li>
<li><strong>a'</strong> sur le plan frontal (projection frontale).</li>
</ul>
<p>Sur le papier, on <strong>rabat</strong> le plan horizontal sur le plan frontal pour obtenir une seule figure plane : c'est l'<strong>épure</strong>.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Projection d'une droite</div>
<p>Une droite se projette en général en droite sur les deux plans. Les positions particulières (droite parallèle à un plan, perpendiculaire à un plan) demandent des constructions spécifiques (points de percée, projections remarquables).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Trace l'épure d'un point A projeté à 3 cm au-dessus du plan horizontal et 4 cm devant le plan frontal.</p>
<p><strong>Ex. 2 :</strong> Pourquoi rabat-on un plan sur l'autre pour dessiner l'épure ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> a se place sur la ligne de terre de l'épure à 4 cm ; a' perpendiculairement à la ligne de terre à 3 cm. <strong>2)</strong> Pour représenter en une seule figure plane les deux vues, tout en gardant la correspondance entre elles.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'épure de Monge projette un objet sur deux plans perpendiculaires et fournit deux vues (dessus, face) sur une seule figure.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Dessin Scientifique 3e HS ; manuels de géométrie descriptive.</div>
    `
},
{
    title: "Leçon 3 — Représentation de solides (élévation, profil, plan, coupe)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment lire un plan qui montre le même objet sous plusieurs angles ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les trois vues principales. Représenter un solide simple. Réaliser une coupe.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les trois vues principales</div>
<ul>
<li><strong>Élévation (vue de face) :</strong> vue depuis l'avant.</li>
<li><strong>Plan (vue de dessus) :</strong> vue depuis le dessus.</li>
<li><strong>Profil (vue de côté) :</strong> vue depuis la gauche ou la droite.</li>
</ul>
<p>Ces vues sont disposées selon un code : le plan est placé sous l'élévation, le profil à côté.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Coupes et sections</div>
<p>Une <strong>coupe</strong> représente l'intérieur d'un objet : on imagine le trancher par un plan puis retirer la partie la plus proche de l'observateur. Les parties pleines coupées sont hachurées. On utilise la coupe pour les pièces creuses (tubes, cylindres évidés) qui seraient illisibles en vue extérieure.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Exemple</div>
<p>Un cylindre couché sur un plan horizontal :</p>
<ul>
<li>Élévation : rectangle.</li>
<li>Plan : rectangle.</li>
<li>Profil : cercle.</li>
</ul>
<p>Un cylindre creux (tube) en coupe montre deux bandes hachurées et un espace intérieur.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Dessine les trois vues d'un pavé droit de 5 × 3 × 2 cm.</p>
<p><strong>Ex. 2 :</strong> Pourquoi représente-t-on une coupe pour certaines pièces ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Élévation 5×3, plan 5×2, profil 3×2. <strong>2)</strong> Pour montrer les formes intérieures qui ne se voient pas en vue extérieure.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un objet se représente par trois vues (élévation, plan, profil) ; la coupe révèle l'intérieur.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Dessin Scientifique 3e HS.</div>
    `
},
{
    title: "Leçon 4 — Perspective cavalière",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment donner en un seul dessin une idée du volume d'un objet ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le principe de la perspective cavalière. Tracer un solide simple. Respecter les règles de réduction.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Principe</div>
<p>La <strong>perspective cavalière</strong> est une représentation rapide du volume. La face avant est dessinée en vraie grandeur (parallèle au plan de projection) ; les arêtes qui partent vers l'arrière sont tracées en oblique, souvent à 45°, avec une réduction conventionnelle (souvent 1/2).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Règles</div>
<ul>
<li>Face avant : conservée en vraie grandeur.</li>
<li>Fuyantes : parallèles entre elles (angle conventionnel 30°, 45° ou 60°).</li>
<li>Réduction sur les fuyantes : souvent 1/2, quelquefois 2/3 ou 3/4 selon la norme choisie.</li>
<li>Contours visibles en trait fort ; contours cachés en trait interrompu.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Dessine en perspective cavalière un cube de 4 cm d'arête (réduction 1/2).</p>
<p><strong>Ex. 2 :</strong> Pourquoi la face avant est-elle conservée en vraie grandeur ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Carré 4 × 4 pour la face avant ; fuyantes à 45° avec 2 cm sur les arêtes qui partent vers l'arrière. <strong>2)</strong> Pour faciliter la lecture des dimensions et des proportions de la pièce.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La perspective cavalière montre le volume sans déformer la face avant.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Dessin Scientifique 3e HS.</div>
    `
},
{
    title: "Leçon 5 — Développement de surfaces",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment obtenir le patron d'un cône ou d'un cylindre en tôle pour le fabriquer ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le développement d'une surface. Réaliser le développement d'un cylindre et d'un cône. Lire un patron de chaudronnerie.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Développer une surface</div>
<p><strong>Développer</strong> une surface, c'est la déplier à plat sur un plan. Le résultat est un patron. Le développement sert à découper des tôles (chaudronnerie, ventilation) et à fabriquer des emballages.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Cylindre</div>
<p>Un cylindre droit de rayon r et de hauteur h se développe en un rectangle :</p>
<ul>
<li>Longueur = 2πr (périmètre du cercle).</li>
<li>Hauteur = h.</li>
</ul>
<p>On ajoute deux disques de rayon r pour les bases.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Cône</div>
<p>Un cône de rayon r et de génératrice g se développe en un secteur circulaire :</p>
<ul>
<li>Rayon du secteur = g (génératrice).</li>
<li>Arc = 2πr.</li>
<li>Angle du secteur α = 360° × r/g.</li>
</ul>
<p>On ajoute un disque de rayon r pour la base.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Développe un cylindre de rayon 3 cm et de hauteur 10 cm.</p>
<p><strong>Ex. 2 :</strong> Développe un cône de rayon 4 cm et de génératrice 8 cm.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Rectangle de 2π × 3 ≈ 18,85 cm × 10 cm, plus deux disques de 3 cm de rayon. <strong>2)</strong> Secteur de rayon 8 cm, angle α = 360° × 4/8 = 180°, plus un disque de 4 cm de rayon.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Développer une surface, c'est la mettre à plat : rectangle pour le cylindre, secteur pour le cône.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Dessin Scientifique 3e HS ; manuels de chaudronnerie.</div>
    `
},
{
    title: "Leçon 6 — Dessin mécanique : cotation fonctionnelle",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment indiquer sur un plan quelles dimensions sont essentielles pour qu'une pièce s'assemble ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer cotation fonctionnelle et cotation de fabrication. Coter une pièce simple. Comprendre la notion de tolérance.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Cotation fonctionnelle</div>
<p>La <strong>cotation fonctionnelle</strong> indique les dimensions qui garantissent le fonctionnement de la pièce dans son ensemble mécanique (jeu, ajustement). Elle est directement liée à la fonction de la pièce.</p>
<p>La <strong>cotation de fabrication</strong> indique les dimensions nécessaires à la fabrication en atelier (usinage). Elle peut différer de la cotation fonctionnelle.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Règles de cotation</div>
<ul>
<li>Chaque dimension est indiquée une seule fois.</li>
<li>Les cotes sont placées à l'extérieur du contour, ou à l'intérieur s'il y a de la place.</li>
<li>Les lignes de cote ne doivent pas se croiser.</li>
<li>Les cotes sont en vraie grandeur (la valeur indiquée est la dimension réelle, indépendamment de l'échelle du dessin).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Tolérances</div>
<p>Une <strong>tolérance</strong> est la variation admissible d'une dimension. Exemple : 20 ± 0,1 mm signifie que la dimension réelle doit être comprise entre 19,9 et 20,1 mm. Sans tolérance, la fabrication serait impossible à garantir.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cote une pièce simple (plaque percée) : longueur, largeur, diamètre du trou, distances aux bords.</p>
<p><strong>Ex. 2 :</strong> Un plan indique une cote de 15 ± 0,2 mm. Quelles dimensions réelles sont acceptables ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Les cotes doivent être regroupées et non répétées. <strong>2)</strong> Entre 14,8 mm et 15,2 mm.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La cotation fonctionnelle garantit le fonctionnement ; les tolérances définissent la plage acceptable en fabrication.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Dessin Scientifique 3e HS ; normes ISO de dessin.</div>
    `
},

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment lire le plan d'une maison pour savoir où sont les pièces et les portes ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Lire un plan architectural simple. Distinguer les types de plans. Comprendre échelle et légende.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Types de plans</div>
<ul>
<li><strong>Plan de masse :</strong> vue d'ensemble du bâtiment sur son terrain.</li>
<li><strong>Plan d'étage (plan de niveau) :</strong> coupe horizontale montrant les pièces.</li>
<li><strong>Élévation (façade) :</strong> vue extérieure du bâtiment.</li>
<li><strong>Coupe :</strong> coupe verticale montrant hauteurs et niveaux.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Échelle et légende</div>
<p>L'<strong>échelle</strong> indique le rapport entre dimensions dessinées et dimensions réelles : 1/100 signifie 1 cm sur le plan = 100 cm = 1 m réel.</p>
<p>La <strong>légende</strong> précise les symboles : murs (hachurés), portes (arc), fenêtres (double trait), escaliers, sanitaires.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Lecture d'un plan</div>
<ol>
<li>Lire le titre et l'échelle.</li>
<li>Repérer les murs (porteurs et cloisons).</li>
<li>Identifier les ouvertures (portes, fenêtres).</li>
<li>Nommer les pièces (chambre, cuisine, salon, sanitaires).</li>
<li>Vérifier la circulation entre les pièces.</li>
</ol>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Sur un plan au 1/100, un mur mesure 5 cm. Quelle est sa longueur réelle ?</p>
<p><strong>Ex. 2 :</strong> Dessine le plan simplifié d'une petite maison de deux pièces (échelle 1/100).</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> 5 cm × 100 = 500 cm = 5 m. <strong>2)</strong> Le plan doit indiquer murs, portes, fenêtres, et respecter l'échelle.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un plan architectural se lit avec l'échelle, la légende et les conventions de représentation (murs, ouvertures, pièces).</p></div>

  var OK = '<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';
  try {
    if (typeof questions !== "undefined" && questions && questions.forEach) {
      questions.forEach(function (q) {
        if (!q.options) q.options = q.opts || q.choices || q.choix || q.reponses || q.propositions || [];
        if (q.text === undefined) q.text = q.question || q.q || q.enonce || q.titre || "";
        if (typeof q.correct === "undefined") {
          if (typeof q.answer !== "undefined") q.correct = q.answer;
          else if (typeof q.reponse !== "undefined") q.correct = q.reponse;
        }
      });
    }
  } catch (e) {}
  var synth = window.speechSynthesis || null;
  var HAS_CACHE = !!(window.caches && window.caches.open);
  var NATIVE = false;
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  var LATER = "ecolia_audio_later_" + CFG.code;
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function init() {
    if (document.getElementById("ecolia-audio-btn")) return;
    var btn = document.createElement("button");
    btn.id = "ecolia-audio-btn"; btn.type = "button"; btn.className = "ecolia-off";
    btn.setAttribute("aria-label", "Écouter la leçon"); btn.innerHTML = PLAY;
    var dlBtn = document.createElement("button");
    dlBtn.id = "ecolia-dl-btn"; dlBtn.type = "button"; dlBtn.className = "ecolia-off";
    dlBtn.innerHTML = DL;
    var host = document.querySelector(".header-right");
    if (host) { host.insertBefore(dlBtn, host.firstChild); host.insertBefore(btn, dlBtn); }
    else { btn.className += " ecolia-fixed"; document.body.appendChild(btn); }
    var banner = document.createElement("div");
    banner.id = "ecolia-audio-banner";
    banner.innerHTML = '<span class="eab-txt"></span><span class="eab-act"></span><div class="eab-bar"><i></i></div>';
    var content = document.getElementById("content");
    if (content && content.parentNode) content.parentNode.insertBefore(banner, content);
    else document.body.insertBefore(banner, document.body.firstChild);
    var txtEl = banner.querySelector(".eab-txt"), actEl = banner.querySelector(".eab-act");
    var barEl = banner.querySelector(".eab-bar"), barI = barEl.firstChild;
    var audio = new Audio();
    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }
    function cur() { try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {} return 0; }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];

      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();

              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();

            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);

    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
