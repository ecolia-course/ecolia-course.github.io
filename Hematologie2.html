    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours d'hématologie couvre cinq leçons essentielles : le sang et sa composition, l'hématopoïèse et les lignées cellulaires, l'hémostase (coagulation), les anémies, et les syndromes hémorragiques.</p>
<p><strong>Note :</strong> la progression s'appuie sur le référentiel OMS « Concentrations en hémoglobine pour diagnostiquer l'anémie » (2011), sur le programme commun des élèves-infirmiers de 2e année (RDC, 1966) et sur le programme de l'ISTM Goma. Le programme officiel actuel et intégral de l'Hématologie pour la 2e année des humanités techniques n'a pas été consulté. Les protocoles de laboratoire (numération, formule) doivent être validés par un technicien de laboratoire qualifié avant toute pratique.</p>
<ul>
<li>Leçon 1 — Le sang : composition et fonctions</li>
<li>Leçon 2 — L'hématopoïèse et les lignées cellulaires</li>
<li>Leçon 3 — L'hémostase : la coagulation</li>
<li>Leçon 4 — Les anémies : reconnaître et orienter</li>
<li>Leçon 5 — Syndromes hémorragiques et examens de base</li>
</ul>
<p>Une évaluation finale de 20 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> OMS — Concentrations en hémoglobine pour diagnostiquer l'anémie (2011) ; programme commun des élèves-infirmiers 2e année (RDC, 1966) ; programme de l'ISTM Goma.</div>
    `
},
{
    title: "Leçon 1 — Le sang : composition et fonctions",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une femme enceinte anémiée est-elle plus fragile face aux infections ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître la composition du sang. Identifier la fonction de chaque constituant. Comprendre l'hématocrite et l'hémoglobine. Prérequis : anatomie-physiologie du système circulatoire.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Sang :</strong> tissu liquide composé de plasma et d'éléments figurés.</p>
<p><strong>Plasma :</strong> partie liquide (eau, protéines, nutriments, déchets).</p>
<p><strong>Éléments figurés :</strong></p>
<ul>
<li><strong>Globules rouges (érythrocytes) :</strong> transport de l'oxygène via l'hémoglobine.</li>
<li><strong>Globules blancs (leucocytes) :</strong> défense immunitaire.</li>
<li><strong>Plaquettes (thrombocytes) :</strong> coagulation.</li>
</ul>
<p><strong>Hémoglobine :</strong> protéine qui fixe l'oxygène ; sa concentration définit l'anémie.</p>
<p><strong>Hématocrite :</strong> proportion du volume occupé par les globules rouges.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Plasma :</strong> partie liquide du sang. <strong>Sérum :</strong> plasma sans facteurs de coagulation. <strong>Hémoglobine :</strong> protéine de transport de l'O₂.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier chaque constituant. Associer chaque constituant à sa fonction. Ne pas confondre plasma et sérum.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une femme enceinte à Kinshasa dont le taux d'hémoglobine est bas souffre probablement d'anémie, fréquente en RDC en raison des carences nutritionnelles et du paludisme.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quels sont les trois types d'éléments figurés du sang ? <strong>Ex. 2 :</strong> Que mesure l'hématocrite ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Globules rouges, globules blancs, plaquettes. <strong>2)</strong> La proportion du volume occupé par les globules rouges.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Chaque constituant du sang a une fonction vitale.</p></div>

<div class="sources"><strong>Sources :</strong> Programme commun des élèves-infirmiers (RDC, 1966) ; OMS.</div>
    `
},
{
    title: "Leçon 2 — L'hématopoïèse et les lignées cellulaires",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un patient insuffisant rénal développe-t-il souvent une anémie ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre l'hématopoïèse. Connaître le rôle de l'EPO. Distinguer les lignées. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Hématopoïèse :</strong> formation des cellules sanguines à partir de cellules souches de la moelle osseuse.</p>
<p><strong>Lignées :</strong></p>
<ul>
<li><strong>Érythroïde :</strong> globules rouges.</li>
<li><strong>Myéloïde :</strong> granulocytes, monocytes, plaquettes.</li>
<li><strong>Lymphoïde :</strong> lymphocytes.</li>
</ul>
<p><strong>Érythropoïétine (EPO) :</strong> hormone produite par le rein ; stimule la production des globules rouges.</p>
<p><strong>Durée de vie des globules rouges :</strong> environ 120 jours.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Hématopoïèse :</strong> formation des cellules sanguines. <strong>EPO :</strong> érythropoïétine. <strong>Lignée :</strong> ensemble de cellules issues d'un même précurseur.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Comprendre le rôle central de la moelle osseuse. Identifier le rôle du rein dans l'érythropoïèse. Distinguer les lignées.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un patient atteint d'insuffisance rénale chronique produit moins d'EPO et développe une anémie : c'est une anémie d'origine rénale.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Où se déroule l'hématopoïèse chez l'adulte ? <strong>Ex. 2 :</strong> Expliquer pourquoi l'insuffisance rénale peut provoquer une anémie.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Dans la moelle osseuse. <strong>2)</strong> Parce que le rein produit moins d'EPO, qui stimule la production de globules rouges.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La moelle osseuse est l'usine du sang ; le rein régule sa production.</p></div>

<div class="sources"><strong>Sources :</strong> OMS ; programmes de référence.</div>
    `
},
{
    title: "Leçon 3 — L'hémostase : la coagulation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certains patients saignent-ils longtemps après une petite coupure ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les étapes de l'hémostase. Connaître les examens de base. Identifier le rôle de la vitamine K. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Hémostase :</strong> ensemble des processus qui arrêtent le saignement.</p>
<p><strong>Étapes :</strong></p>
<ul>
<li><strong>Hémostase primaire :</strong> vasoconstriction + plaque plaquettaire.</li>
<li><strong>Coagulation :</strong> cascade de facteurs aboutissant à la fibrine.</li>
<li><strong>Fibrinolyse :</strong> destruction du caillot après réparation.</li>
</ul>
<p><strong>Vitamine K :</strong> nécessaire à plusieurs facteurs de coagulation.</p>
<p><strong>Examens :</strong> temps de saignement (hémostase primaire) ; TP et TCA (coagulation).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Hémostase :</strong> arrêt du saignement. <strong>TP :</strong> taux de prothrombine. <strong>TCA :</strong> temps de céphaline activé.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier les étapes. Distinguer hémostase primaire et coagulation. Associer chaque examen à l'étape qu'il explore.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un patient qui saigne longtemps après une petite coupure peut avoir un trouble de l'hémostase (déficit en facteurs, thrombopénie). L'infirmier doit orienter pour des examens (TP, TCA).</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelles sont les étapes de l'hémostase ? <strong>Ex. 2 :</strong> Quel examen explore l'hémostase primaire ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Hémostase primaire, coagulation, fibrinolyse. <strong>2)</strong> Le temps de saignement.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'hémostase est un processus en plusieurs étapes : chaque étape peut être défaillante.</p></div>

<div class="sources"><strong>Sources :</strong> Programmes de référence ; OMS.</div>
    `
},
{
    title: "Leçon 4 — Les anémies : reconnaître et orienter",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi la carence en fer est-elle la cause la plus fréquente d'anémie en RDC ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir l'anémie. Connaître ses causes. Reconnaître les signes. Orienter. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Anémie :</strong> taux d'hémoglobine bas. Seuils OMS : femme enceinte < 11 g/dl ; enfant < 11 g/dl ; homme < 13 g/dl.</p>
<p><strong>Causes fréquentes en RDC :</strong></p>
<ul>
<li>Carence en fer.</li>
<li>Carence en folates et vitamine B12.</li>
<li>Paludisme.</li>
<li>Inflammation chronique.</li>
<li>Hémorragies.</li>
</ul>
<p><strong>Signes :</strong> pâleur, fatigue, essoufflement, palpitations.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Anémie :</strong> hémoglobine basse. <strong>Microcytaire :</strong> globules rouges petits (carence en fer). <strong>Macrocytaire :</strong> globules rouges grands (carence en B12).</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Interpréter l'hémoglobine. Rechercher la cause. Orienter en cas d'anémie sévère.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une femme enceinte à Lubumbashi qui présente une pâleur marquée et une fatigue intense doit être orientée pour un dosage d'hémoglobine et une supplémentation en fer.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelles sont les causes fréquentes d'anémie en RDC ? <strong>Ex. 2 :</strong> Citer deux signes cliniques de l'anémie.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Carence en fer, paludisme, inflammation (autres réponses possibles). <strong>2)</strong> Pâleur et fatigue (autres réponses possibles).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'anémie est un symptôme, pas une maladie : il faut en chercher la cause.</p></div>

<div class="sources"><strong>Sources :</strong> OMS — Concentrations en hémoglobine (2011).</div>
    `
},
{
    title: "Leçon 5 — Syndromes hémorragiques et examens de base",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Que révèlent des pétéchies chez un enfant ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Reconnaître un syndrome hémorragique. Connaître les examens. Situer le rôle infirmier. Prérequis : leçons 1 à 4.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Signes hémorragiques :</strong> pétéchies (petites taches rouges), ecchymoses, saignements des gencives, épistaxis.</p>
<p><strong>Causes :</strong> thrombopénie, déficit en facteurs, atteinte vasculaire.</p>
<p><strong>Examens :</strong></p>
<ul>
<li>Numération formule sanguine (NFS).</li>
<li>Temps de saignement.</li>
<li>TP et TCA.</li>
</ul>
<p><strong>Rôle infirmier :</strong> surveiller, prélever, orienter, rassurer.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Pétéchie :</strong> petite tache rouge cutanée. <strong>Thrombopénie :</strong> baisse des plaquettes. <strong>NFS :</strong> numération formule sanguine.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Reconnaître les signes. Orienter sans délai. Participer au prélèvement.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un enfant qui présente des pétéchies et des saignements des gencives peut avoir une thrombopénie : l'infirmier doit orienter pour une numération formule sanguine.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quels sont les signes d'un syndrome hémorragique ? <strong>Ex. 2 :</strong> Citer deux examens de base.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Pétéchies, ecchymoses, saignements (autres réponses possibles). <strong>2)</strong> NFS et TP (autres réponses possibles).</p>

on définit l'anémie. Hématocrite: proportion du volume occupé par les globules rouges. Définitions. Plasma: partie liquide du sang. Sérum: plasma sans facteurs de coagulation. Hémoglobine: protéine de transport de l'O2. Méthodes et règles. Identifier chaque constituant. Associer chaque constituant à sa fonction. Ne pas confondre plasma et sérum. Exemple. Une femme enceinte à Kinshasa dont le taux d'hémoglobine est bas souffre probablement d'anémie, fréquente en R D C en raison des carences nutritionnelles et du paludisme. Exercices. Ex. 1: Quels sont les trois types d'éléments figurés du sang? Ex. 2: Que mesure l'hématocrite? Corrigé. 1) Globules rouges, globules blancs, plaquettes. 2) La proportion du volume occupé par les globules rouges. À retenir. Chaque constituant du sang a une fonction vitale."]],"3":[["fr","Leçon 2, L'hématopoïèse et les lignées cellulaires. Situation. « Pourquoi un patient insuffisant rénal développe-t-il souvent une anémie? ». Objectifs. Comprendre l'hématopoïèse. Connaître le rôle de l'EPO. Distinguer les lignées. Prérequis: leçon 1. Théorie. Hématopoïèse: formation des cellules sanguines à partir de cellules souches de la moelle osseuse. Lignées: Érythroïde: globules rouges. Myéloïde: granulocytes, monocytes, plaquettes. Lymphoïde: lymphocytes. Érythropoïétine (EPO): hormone produite par le rein; stimule la production des globules rouges. Durée de vie des globules rouges: environ 120 jours. Définitions. Hématopoïèse: formation des cellules sanguines. EPO: érythropoïétine. Lignée: ensemble de cellules issues d'un même précurseur. Méthodes et règles. Comprendre le rôle central de la moelle osseuse. Identifier le rôle du rein dans l'érythropoïèse. Distinguer les lignées. Exemple. Un patient atteint d'insuffisance rénale chronique produit moins d'EPO et développe une anémie: c'est une anémie d'origine rénale. Exercices. Ex. 1: Où se déroule l'hématopoïèse chez l'adulte? Ex. 2: Expliquer pourquoi l'insuffisance rénale peut provoquer une anémie. Corrigé. 1) Dans la moelle osseuse. 2) Parce que le rein produit moins d'EPO, qui stimule la production de globules rouges. À retenir. La moelle osseuse est l'usine du sang; le rein régule sa production."]],"4":[["fr","Leçon 3, L'hémostase: la coagulation. Situation. « Pourquoi certains patients saignent-ils longtemps après une petite coupure? ». Objectifs. Comprendre les étapes de l'hémostase. Connaître les examens de base. Identifier le rôle de la vitamine K. Prérequis: leçons 1 et 2. Théorie. Hémostase: ensemble des processus qui arrêtent le saignement. Étapes: Hémostase primaire: vasoconstriction plus plaque plaquettaire. Coagulation: cascade de facteurs aboutissant à la fibrine. Fibrinolyse: destruction du caillot après réparation. Vitamine K: nécessaire à plusieurs facteurs de coagulation. Examens: temps de saignement (hémostase primaire); TP et TCA (coagulation). Définitions. Hémostase: arrêt du saignement. TP: taux de prothrombine. TCA: temps de céphaline activé. Méthodes et règles. Identifier les étapes. Distinguer hémostase primaire et coagulation. Associer chaque examen à l'étape qu'il explore. Exemple. Un patient qui saigne longtemps après une petite coupure peut avoir un trouble de l'hémostase (déficit en facteurs, thrombopénie). L'infirmier doit orienter pour des examens (TP, TCA). Exercices. Ex. 1: Quelles sont les étapes de l'hémostase? Ex. 2: Quel examen explore l'hémostase primaire? Corrigé. 1) Hémostase primaire, coagulation, fibrinolyse. 2) Le temps de saignement. À retenir. L'hémostase est un processus en plusieurs étapes: chaque étape peut être défaillante."]],"5":[["fr","Leçon 4, Les anémies: reconnaître et orienter. Situation. « Pourquoi la carence en fer est-elle la cause la plus fréquente d'anémie en R D C? ». Objectifs. Définir l'anémie. Connaître ses causes. Reconnaître les signes. Orienter. Prérequis: leçons 1 à 3. Théorie. Anémie: taux d'hémoglobine bas. Seuils OMS: femme enceinte inférieur à 11 grammes ou dl; enfant inférieur à 11 grammes ou dl; homme inférieur à 13 grammes ou dl. Causes fréquentes en R D C: Carence en fer. Carence en folates et vitamine B12. Paludisme. Inflammation chronique. Hémorragies. Signes: pâleur, fatigue, essoufflement, palpitations. Définitions. Anémie: hémoglobine basse. Microcytaire: globules rouges petits (carence en fer). Macrocytaire: globules rouges grands (carence en B12). Méthodes et règles. Interpréter l'hémoglobine. Rechercher la cause. Orienter en cas d'anémie sévère. Exemple. Une femme enceinte à Lubumbashi qui présente une pâleur marquée et une fatigue intense doit être orientée pour un dosage d'hémoglobine et une supplémentation en fer. Exercices. Ex. 1: Quelles sont les causes fréquentes d'anémie en R D C? Ex. 2: Citer deux signes cliniques de l'anémie. Corrigé. 1) Carence en fer, paludisme, inflammation (autres réponses possibles). 2) Pâleur et fatigue (autres réponses possibles). À retenir. L'anémie est un symptôme, pas une maladie: il faut en chercher la cause."]],"6":[["fr","Leçon 5, Syndromes hémorragiques et examens de base. Situation. « Que révèlent des pétéchies chez un enfant? ». Objectifs. Reconnaître un syndrome hémorragique. Connaître les examens. Situer le rôle infirmier. Prérequis: leçons 1 à 4. Théorie. Signes hémorragiques: pétéchies (petites taches rouges), ecchymoses, saignements des gencives, épistaxis. Causes: thrombopénie, déficit en facteurs, atteinte vasculaire. Examens: Numération formule sanguine (NFS). Temps de saignement. TP et TCA. Rôle infirmier: surveiller, prélever, orienter, rassurer. Définitions. Pétéchie: petite tache rouge cutanée. Thrombopénie: baisse des plaquettes. NFS: numération formule sanguine. Méthodes et règles. Reconnaître les signes. Orienter sans délai. Participer au prélèvement. Exemple. Un enfant qui présente des pétéchies et des saignements des gencives peut avoir une thrombopénie: l'infirmier doit orienter pour une numération formule sanguine. Exercices. Ex. 1: Quels sont les signes d'un syndrome hémorragique? Ex. 2: Citer deux examens de base. Corrigé. 1) Pétéchies, ecchymoses, saignements (autres réponses possibles). 2) NFS et TP (autres réponses possibles). À retenir. Un syndrome hémorragique est une urgence diagnostique: l'infirmier oriente et participe au prélèvement."]],"7":[["fr","Évaluation finale, Hématologie. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 12 sur 20, tu as réussi."]]}};

    // ====================================================================

    function nativeStore() {

      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {                                   // fichier complet ? (taille exacte connue à la génération)
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {

      return {

        },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();

    function startDownload() {

    // ====================================================================

    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {

        return;

      var c = st.chunks[st.ci];

      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {

    }

      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));

      return true;

    // ====================================================================

    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;

      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}

      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
