<div class="bloc theorie"><div class="bloc-label">Sommaire</div>

{
    title: "Leçon 1 — Introduction à l'hygiène hospitalière",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un hôpital de Kinshasa, plusieurs patients opérés développent une infection de la plaie opératoire. Le comité d'hygiène se réunit : d'où viennent ces infections ? Une infirmière n'a pas respecté l'asepsie, un chirurgien a utilisé un instrument mal stérilisé. L'hygiène hospitalière prévient ces drames.</p></div>
<h3>1. Définition et importance</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Hygiène hospitalière</strong> : ensemble des mesures pour prévenir les infections dans les établissements de soins.</li><li><strong>Infection nosocomiale</strong> : infection contractée à l'hôpital, absente à l'admission et apparaissant 48 heures après.</li><li><strong>Importance</strong> : protéger les patients, le personnel et les visiteurs. Réduire la mortalité, la morbidité et les coûts.</li><li><strong>Prévalence</strong> : 5 à 10 % des hospitalisations dans les pays développés ; plus élevée dans les pays en développement.</li></ul></div>
<h3>2. Les agents infectieux</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Bactéries</strong> : staphylocoques, streptocoques, E. coli, klebsielles.</li><li><strong>Virus</strong> : VIH, hépatites B et C, grippe, COVID-19.</li><li><strong>Champignons</strong> : Candida, Aspergillus.</li><li><strong>Parasites</strong> : gale, poux.</li><li><strong>Prions</strong> : agents des maladies de Creutzfeldt-Jakob.</li></ul></div>
<h3>3. La chaîne de l'infection</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Agent infectieux</strong> : le microbe.</li><li><strong>Réservoir</strong> : lieu où il vit (patient, personnel, environnement, matériel).</li><li><strong>Porte de sortie</strong> : voie par laquelle il quitte le réservoir (respiratoire, digestif, urinaire, plaie, sang).</li><li><strong>Mode de transmission</strong> : contact, gouttelettes, air, vecteur, sang.</li><li><strong>Porte d'entrée</strong> : voie par laquelle il entre dans l'hôte.</li><li><strong>Hôte réceptif</strong> : personne sensible (immunodéprimée, âgée, nouveau-né).</li></ul></div>
<h3>4. Les mesures de prévention</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Hygiène des mains</strong> : mesure la plus efficace.</li><li><strong>Port des gants, masque, blouse</strong> : selon les situations.</li><li><strong>Stérilisation du matériel</strong> : autoclave.</li><li><strong>Désinfection des surfaces</strong> : quotidienne.</li><li><strong>Gestion des déchets</strong> : tri et élimination correcte.</li><li><strong>Isolement</strong> : pour les patients contagieux.</li><li><strong>Formation du personnel</strong> : continue.</li><li><strong>Vaccination</strong> : hépatite B pour le personnel soignant.</li></ul><p><a href="https://www.youtube.com/results?search_query=introduction+hygiène+hospitalière+infection+nosocomiale" target="_blank" rel="noopener">🎥 Recherche : introduction à l'hygiène hospitalière (chaînes de cours)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'hygiène hospitalière prévient les infections nosocomiales. La chaîne de l'infection comprend 6 maillons. Les mesures de prévention sont : hygiène des mains, port des protections, stérilisation, désinfection, gestion des déchets, isolement, vaccination.</p></div>
<div class="sources"><strong>Sources :</strong> Programme réformé d'Hygiène Hospitalière, Ministère de la Santé (RDC) ; OMS — Hygiène des mains.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, MSP, OMS.</div>
    `
},
{
    title: "Leçon 2 — L'hygiène des mains",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une infirmière entre dans la chambre d'un patient. Avant de le toucher, elle doit se laver les mains ou frictionner avec une solution hydro-alcoolique. Ce simple geste sauve plus de vies que n'importe quel médicament. L'OMS l'a érigé en priorité mondiale.</p></div>
<h3>1. Pourquoi l'hygiène des mains ?</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li>Les mains sont le principal vecteur de transmission des microbes.</li><li>Le lavage des mains réduit de 30 à 50 % les infections nosocomiales.</li><li>Il protège le patient, le soignant et son entourage.</li></ul></div>
<h3>2. Les techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Lavage simple</strong> : eau + savon, 30 secondes, friction paume contre paume, entre les doigts, pouces, ongles, poignets, rinçage, séchage.</li><li><strong>Friction hydro-alcoolique</strong> : solution hydro-alcoolique (SHA), 20-30 secondes, mains sèches. Ne pas rincer.</li><li><strong>Lavage chirurgical</strong> : 5 minutes, avant toute intervention chirurgicale, avec un savon antiseptique.</li><li><strong>Port des bijoux interdit</strong> : montre, bagues, bracelets.</li><li><strong>Ongles courts</strong> : sans vernis.</li></ul></div>
<h3>3. Les 5 indications de l'OMS</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>1.</strong> Avant de toucher un patient.</li><li><strong>2.</strong> Avant un geste aseptique (soin, pansement, injection).</li><li><strong>3.</strong> Après un risque d'exposition à un liquide biologique.</li><li><strong>4.</strong> Après avoir touché un patient.</li><li><strong>5.</strong> Après avoir touché l'environnement du patient (lit, table, appareil).</li></ul></div>
<h3>4. Applications</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Avant chaque soin</strong> : se frictionner avec SHA.</li><li><strong>Après contact avec un patient infecté</strong> : lavage simple + friction.</li><li><strong>Après retrait des gants</strong> : hygiène des mains systématique (les gants ne sont pas une protection absolue).</li><li><strong>Campagne dans les hôpitaux de Kinshasa</strong> : installation de distributeurs de SHA dans les couloirs et chambres.</li><li><strong>Formation continue</strong> : le personnel soignant doit être recyclé tous les ans.</li></ul><p><a href="https://www.youtube.com/results?search_query=hygiène+mains+OMS+5+indications+lavage" target="_blank" rel="noopener">🎥 Recherche : l'hygiène des mains (chaînes de cours)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'hygiène des mains est la première mesure de prévention des infections. Trois techniques : lavage simple, friction hydro-alcoolique, lavage chirurgical. Les 5 indications de l'OMS doivent être respectées. Les bijoux et le vernis sont interdits.</p></div>
<div class="sources"><strong>Sources :</strong> OMS — Hygiène des mains ; Programme réformé d'Hygiène Hospitalière (RDC).</div>
    `
},
{
    title: "Leçon 3 — La stérilisation et la désinfection",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un bloc opératoire de Kinshasa, l'infirmière instrumentiste prépare les instruments chirurgicaux. Ils doivent être stérilisés à l'autoclave avant chaque intervention. Un instrument mal stérilisé peut transmettre le VIH, l'hépatite, une infection grave. La stérilisation est une exigence absolue.</p></div>
<h3>1. Définitions</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Nettoyage</strong> : élimination des salissures visibles (eau + détergent).</li><li><strong>Désinfection</strong> : élimination ou inactivation des micro-organismes pathogènes (produits chimiques).</li><li><strong>Antisepsie</strong> : désinfection de la peau et des muqueuses.</li><li><strong>Stérilisation</strong> : élimination de tous les micro-organismes (y compris spores).</li></ul></div>
<h3>2. Les méthodes de stérilisation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Autoclave (vapeur humide)</strong> : 121 °C pendant 15-20 min ou 134 °C pendant 3-5 min.</li><li><strong>Chaleur sèche (Poupinel)</strong> : 160 °C pendant 2 heures, ou 170 °C pendant 1 heure.</li><li><strong>Chimique (glutaraldéhyde, peroxyde d'hydrogène)</strong> : pour les instruments thermosensibles.</li><li><strong>Rayonnements ionisants</strong> : pour les dispositifs médicaux à usage unique (industriel).</li><li><strong>Contrôle de stérilisation</strong> : indicateurs chimiques, biologiques.</li></ul></div>
<h3>3. Les niveaux de désinfection</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Désinfection de haut niveau</strong> : pour les instruments en contact avec les muqueuses (endoscopes).</li><li><strong>Désinfection de niveau intermédiaire</strong> : pour les surfaces et instruments en contact avec la peau.</li><li><strong>Désinfection de bas niveau</strong> : pour les surfaces (sols, murs, mobilier).</li><li><strong>Produits</strong> : eau de Javel (dilution 1/10), alcool 70°, glutaraldéhyde, acide peracétique.</li></ul></div>
<h3>4. Applications</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Instruments chirurgicaux</strong> : nettoyage → désinfection → stérilisation à l'autoclave.</li><li><strong>Endoscopes</strong> : nettoyage → désinfection de haut niveau.</li><li><strong>Sols et surfaces</strong> : nettoyage + désinfection de bas niveau (eau de Javel).</li><li><strong>Peau avant injection</strong> : antisepsie (alcool 70° ou Bétadine).</li><li><strong>Matériel à usage unique</strong> : ne jamais réutiliser (seringues, aiguilles).</li><li><strong>Traçabilité</strong> : chaque stérilisation est notée (date, lot, responsable).</li></ul><p><a href="https://www.youtube.com/results?search_query=stérilisation+désinfection+autoclave+antisepsie" target="_blank" rel="noopener">🎥 Recherche : la stérilisation et la désinfection (chaînes de cours)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le nettoyage précède toujours la désinfection. La stérilisation élimine tous les micro-organismes (autoclave, Poupinel, chimique). La désinfection a 3 niveaux (haut, intermédiaire, bas). L'antisepsie désinfecte la peau. La traçabilité est obligatoire.</p></div>
<div class="sources"><strong>Sources :</strong> Programme réformé d'Hygiène Hospitalière (RDC) ; OMS — Prévention des infections.</div>
    `
},
{
    title: "Leçon 4 — Le port des équipements de protection individuelle (EPI)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une salle d'isolement de l'hôpital de Goma, un patient est atteint d'une maladie très contagieuse. L'infirmière doit revêtir un équipement complet : charlotte, masque FFP2, lunettes, blouse, gants, surchaussures. Chaque élément protège contre un risque spécifique.</p></div>
<h3>1. Les équipements de protection individuelle</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Gants</strong> : protection contre les liquides biologiques.</li><li><strong>Blouse</strong> : protection contre les projections et contacts.</li><li><strong>Masque chirurgical</strong> : protection contre les gouttelettes.</li><li><strong>Masque FFP2</strong> : protection contre les aérosols et la tuberculose.</li><li><strong>Lunettes de protection</strong> : contre les projections oculaires.</li><li><strong>Charlotte</strong> : retient les cheveux.</li><li><strong>Surchaussures</strong> : protection des chaussures.</li><li><strong>Tablier imperméable</strong> : pour les soins mouillants.</li></ul></div>
<h3>2. Ordre de mise et de retrait</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Mise (dans l'ordre)</strong> : blouse → masque → lunettes → charlotte → gants → surchaussures.</li><li><strong>Retrait (dans l'ordre inverse)</strong> : gants → surchaussures → charlotte → lunettes → blouse → masque.</li><li><strong>Hygiène des mains</strong> : avant la mise et après le retrait.</li><li><strong>Erreurs fréquentes</strong> : toucher le masque avec les gants, réutiliser les gants, retirer les gants sans les retourner.</li></ul></div>
<h3>3. Les précautions standard et complémentaires</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Précautions standard</strong> : s'appliquent à tous les patients (hygiène des mains, gants si contact avec liquides biologiques, masque si risque de projection).</li><li><strong>Précautions complémentaires</strong> : selon le mode de transmission.</li><li><strong>Contact</strong> : gants + blouse pour les infections à bactéries multirésistantes.</li><li><strong>Gouttelettes</strong> : masque chirurgical (grippe, coqueluche, oreillons).</li><li><strong>Air</strong> : masque FFP2 + chambre à pression négative (tuberculose, rougeole, varicelle).</li></ul></div>
<h3>4. Applications</h3>

<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>DASRI</strong> (déchets d'activités de soins à risques infectieux) : pansements, gants, compresses souillées.</li><li><strong>Objets piquants, coupants, tranchants (OPCT)</strong> : aiguilles, lames, ampoules cassées.</li><li><strong>Déchets anatomiques</strong> : tissus humains, organes, placentas.</li><li><strong>Déchets chimiques et pharmaceutiques</strong> : médicaments périmés, produits chimiques.</li><li><strong>Déchets radioactifs</strong> : utilisés en imagerie, radiothérapie.</li><li><strong>Déchets ménagers</strong> : papier, carton, emballages non souillés.</li></ul></div>

        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';
    slideCounterSpan.textContent = '0/0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>

<script>
(function () {
  var SITE = "https://ecolia-course.github.io/";
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface", page servie par https://app.local
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function abs(u) { return /^(https?:|data:|blob:)/i.test(u) ? u : (NATIVE ? SITE + u.replace(/^(\.\/|\/)+/, "") : u); }
  function ext(u) { var m = String(u).split("?")[0].match(/\.(jpe?g|png|gif|webp|svg)$/i); return m ? m[1].toLowerCase() : "jpg"; }
  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {
    if (queued[fn]) return;
    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
    if (!queue.length) { running = false; return; }
    if (!navigator.onLine) { running = false; return; }
    var q = queue.shift(), t0 = Date.now();
    try { CoursInterface.download(q[0], q[1]); } catch (e) { return setTimeout(next, 500); }
    (function wait() {
      var ok = false;
      try { ok = !!CoursInterface.exists(q[1]); } catch (e) {}
      if (ok) setTimeout(next, 1500);
      else if (Date.now() - t0 > 40000) next();
      else setTimeout(wait, 700);
    })();
  }
  function exists(fn) { try { return !!CoursInterface.exists(fn); } catch (e) { return false; } }

  function show(img) {                                    // affiche UNE image (appelé à chaque slide affichée)
    if (!table || img.getAttribute("data-ecolia-done")) return;
    var id = img.getAttribute("data-image-id");
    var url = table[id];
    if (typeof url !== "string" || !url.length) { console.warn("ECOLIA : image absente du JSON :", id); return; }
    img.setAttribute("data-ecolia-done", "1");
    if (!NATIVE) { img.onerror = function () { hide(img); }; img.setAttribute("src", url); return; }
    var full = abs(url), fn = "img_" + id + "." + ext(url);
    if (exists(fn)) {                                     // déjà sur l'appareil : lecture locale, sans internet
      img.onerror = function () {                         // fichier incomplet : on le supprime et on utilise le site
        try { CoursInterface["delete"](fn); } catch (e) {}
        queued[fn] = 0;
        img.onerror = function () { hide(img); };
        img.setAttribute("src", full);
      };
      img.setAttribute("src", "https://app.local/cours/" + fn);
    } else {
      img.onerror = function () { hide(img); };
      img.setAttribute("src", full);
      enqueue(full, fn);
    }
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches("img[data-image-id]")) show(root);
    root.querySelectorAll("img[data-image-id]").forEach(show);
  }
  function prefetchAll() {                                // APK : prépare TOUTES les images du cours pour le hors-ligne
    var ids = {};
    try { JSON.stringify(slides).replace(/data-image-id=\\?"([^"\\]+)/g, function (m, id) { ids[id] = 1; }); } catch (e) {}
    Object.keys(ids).forEach(function (id) {
      var url = table[id];
      if (typeof url !== "string" || !url.length) return;
      var fn = "img_" + id + "." + ext(url);
      if (!exists(fn)) enqueue(abs(url), fn);
    });
  }
  function start(tbl) {
    table = tbl;
    scan(document.body);
    new MutationObserver(function (muts) {                // les slides sont écrites à la volée : on traite chaque nouvelle image
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
    if (NATIVE) prefetchAll();
  }

  var JSON_URL = NATIVE ? SITE + "images_ecolia.json" : "images_ecolia.json";
  var KEY = "ecolia_images_json";
  fetch(JSON_URL, NATIVE ? { cache: "no-cache" } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (table) { if (NATIVE) lsSet(KEY, JSON.stringify(table)); start(table); })
    .catch(function (e) {
      var saved = null;
      if (NATIVE) { try { saved = JSON.parse(lsGet(KEY) || "null"); } catch (x) {} }
      if (saved) start(saved);                              // hors ligne dans l'APK : JSON gardé la dernière fois
      else console.warn("ECOLIA : JSON des images indisponible.", e);
    });
})();
</script>
