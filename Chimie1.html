const slides = [
{
    title: "Sommaire — Chimie 1re secondaire",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>La chimie t'apprend à comprendre la matière qui t'entoure : l'eau, l'air, les aliments, les médicaments. Dans ce cours, tu vas observer, décrire et expliquer des phénomènes simples, en toute sécurité. Tu n'as pas besoin d'un grand laboratoire : de l'eau, du sel, du vinaigre et du bicarbonate suffisent pour commencer.</p>
<ul>
<li>Leçon 1 — Qu'est-ce que la chimie ?</li>
<li>Leçon 2 — Les états de la matière</li>
<li>Leçon 3 — Mélanges et corps purs</li>
<li>Leçon 4 — Les techniques de séparation</li>
<li>Leçon 5 — Transformations physiques et chimiques</li>
<li>Leçon 6 — L'atome</li>
<li>Leçon 7 — La molécule et les formules chimiques</li>
<li>Leçon 8 — Les symboles et le tableau périodique</li>
<li>Leçon 9 — Les réactions chimiques : combustion et oxydation</li>
<li>Leçon 10 — Acides et bases</li>
<li>Leçon 11 — Les solutions aqueuses</li>
<li>Leçon 12 — L'eau, l'air et la sécurité au laboratoire</li>
</ul>
<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme national de Chimie (MEPST/DIPROMAD, 2007), Manuel de Chimie 1re année (2025). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 1 — Qu'est-ce que la chimie ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi le fer rouille-t-il ? Pourquoi le sucre se dissout-il dans l'eau ? Pourquoi le bois brûle-t-il ? Toutes ces questions relèvent de la chimie. »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir la chimie et son objet. Distinguer chimie et physique. Identifier des domaines d'application. Prérequis : aucun.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>chimie</strong> est la science qui étudie la matière, sa composition, ses propriétés et les transformations qu'elle subit.</p>
<p>Elle se distingue de la <strong>physique</strong>, qui étudie les phénomènes sans changer la nature de la matière (mouvement, électricité, chaleur). La chimie étudie les transformations qui changent la nature des substances (combustion, rouille, cuisson).</p>
<p>La chimie est présente partout : dans l'alimentation, la santé (médicaments), l'agriculture (engrais), l'industrie (savon, ciment, plastique), l'environnement.</p>
</div>
<img src="images/Chimie1_1.jpg" alt="Verrerie de laboratoire en chimie" data-image-id="Chimie1_1" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>La démarche chimique suit la méthode scientifique : observation ➔ question ➔ hypothèse ➔ expérience ➔ conclusion.</p>
<p>La chimie s'apprend en observant et en expérimentant, mais toujours en respectant les règles de sécurité. Ne jamais goûter une substance inconnue.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>La cuisson du manioc transforme l'amidon : la chaleur modifie sa structure chimique. C'est une transformation chimique. À l'inverse, faire fondre un morceau de glace est une transformation physique : l'eau reste de l'eau.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis la chimie en une phrase.</p>
<p><strong>Ex. 2 :</strong> La fonte de la glace est-elle une transformation chimique ? Justifie.</p>
<details><summary>Corrigé</summary>
<p>1) La chimie est la science qui étudie la matière et ses transformations.</p>
<p>2) Non, c'est une transformation physique : l'eau reste de l'eau.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La chimie étudie la matière et ses transformations ; elle est présente dans tous les domaines de la vie.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Chimie (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 2 — Les états de la matière",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« La glace fond, l'eau bout, la vapeur se condense : que se passe-t-il au niveau des particules ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Distinguer les trois états de la matière. Expliquer les changements d'état. Interpréter par l'agitation des particules.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La matière existe sous trois états principaux :</p>
<ul>
<li><strong>Solide :</strong> forme propre, volume propre. Particules très proches et ordonnées.</li>
<li><strong>Liquide :</strong> volume propre, pas de forme propre. Particules proches mais mobiles.</li>
<li><strong>Gaz :</strong> ni forme ni volume propres. Particules très éloignées et très mobiles.</li>
</ul>
<p><strong>Changements d'état :</strong> fusion (solide ➔ liquide), solidification (liquide ➔ solide), vaporisation (liquide ➔ gaz), condensation (gaz ➔ liquide). Ce sont des transformations physiques.</p>
</div>
<img src="images/Chimie1_2.jpg" alt="Glace, eau liquide et vapeur d'eau" data-image-id="Chimie1_2" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour identifier un état : observer la forme et le volume. Les changements d'état sont réversibles et dépendent de la température et de la pression.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>L'eau du robinet bout à 100 °C et se transforme en vapeur. Sur le couvercle froid, la vapeur redevient liquide. Au réfrigérateur, l'eau liquide devient glace.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Comment appelle-t-on le passage du liquide au gaz ?</p>
<details><summary>Corrigé</summary>
<p>La vaporisation (ou évaporation).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les trois états de la matière et leurs changements s'expliquent par l'agitation des particules ; ce sont des transformations physiques.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Chimie (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 3 — Mélanges et corps purs",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« L'eau du robinet, l'eau salée, l'air, l'eau distillée : sont-ils tous des corps purs ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Distinguer mélange et corps pur. Distinguer mélange homogène et hétérogène. Identifier des exemples concrets.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un <strong>corps pur</strong> est constitué d'une seule espèce chimique (ex. : eau distillée, sel pur).</p>
<p>Un <strong>mélange</strong> contient plusieurs espèces chimiques :</p>
<ul>
<li><strong>Mélange homogène :</strong> on ne distingue pas les constituants à l'œil nu (eau salée, air).</li>
<li><strong>Mélange hétérogène :</strong> on distingue au moins deux constituants (eau + huile, eau + sable).</li>
</ul>
</div>
<img src="images/Chimie1_3.jpg" alt="Eau et huile dans un verre" data-image-id="Chimie1_3" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour reconnaître un mélange homogène : absence de dépôt, de particules visibles. Pour un mélange hétérogène : présence de phases distinctes.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>L'eau du fleuve Congo est un mélange hétérogène. L'eau salée est un mélange homogène. L'eau distillée est un corps pur.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Classe : eau salée, eau + sable, air, eau distillée.</p>
<details><summary>Corrigé</summary>
<p>Eau salée : mélange homogène ; eau + sable : mélange hétérogène ; air : mélange homogène ; eau distillée : corps pur.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Corps purs et mélanges se distinguent par leur composition ; les mélanges peuvent être homogènes ou hétérogènes.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Chimie (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 4 — Les techniques de séparation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment séparer le sable de l'eau ? Comment obtenir du sel à partir de l'eau de mer ? Comment séparer l'huile de l'eau ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Connaître les principales techniques de séparation. Choisir la technique adaptée à un mélange. Décrire le matériel utilisé.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<ul>
<li><strong>Filtration :</strong> sépare un solide insoluble d'un liquide (eau + sable) par un filtre.</li>
<li><strong>Décantation :</strong> laisse reposer un mélange hétérogène pour que le solide se dépose au fond.</li>
<li><strong>Distillation :</strong> sépare un liquide d'un solide dissous en chauffant puis en condensant.</li>
<li><strong>Évaporation :</strong> chauffe un mélange pour faire partir le liquide et récupérer le solide dissous.</li>
<li><strong>Chromatographie :</strong> sépare les constituants d'un mélange en les faisant migrer sur un support.</li>
</ul>
</div>
<img src="images/Chimie1_4.jpg" alt="Filtration sur papier filtre" data-image-id="Chimie1_4" onerror="this.style.display='none'">
<img src="images/Chimie1_5.jpg" alt="Montage de distillation simple" data-image-id="Chimie1_5" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Choisir la technique selon la nature du mélange. Sécurité : ne jamais chauffer un récipient fermé ; ne jamais goûter un produit séparé.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Filtrer de l'eau boueuse avec un filtre à café donne une eau claire (mais pas potable). La distillation de l'eau salée donne de l'eau pure.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle technique utiliser pour séparer le sable de l'eau ?</p>
<details><summary>Corrigé</summary>
<p>La filtration (ou la décantation).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les techniques de séparation dépendent de la nature du mélange ; on choisit selon les propriétés des constituants.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Chimie (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 5 — Transformations physiques et chimiques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Le fer qui rouille, le bois qui brûle, l'eau qui gèle : toutes ces transformations sont-elles de même nature ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Distinguer transformation physique et chimique. Identifier des transformations dans la vie quotidienne. Comprendre la conservation de la matière.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Transformation physique :</strong> ne change pas la nature des substances (changements d'état, mélange).</p>
<p><strong>Transformation chimique :</strong> change la nature des substances ; de nouvelles substances apparaissent (combustion, rouille, cuisson).</p>
<p><strong>Conservation :</strong> la masse totale se conserve ; les atomes se réorganisent.</p>
</div>
<img src="images/Chimie1_6.jpg" alt="Clou rouillé" data-image-id="Chimie1_6" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Se demander si de nouvelles substances apparaissent. Signes : changement de couleur, dégagement de gaz, chaleur, lumière, précipité.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Fondre de la glace est une transformation physique. Brûler du charbon de bois est une transformation chimique.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Classe : dissolution du sel, combustion du bois, rouille du fer.</p>
<details><summary>Corrigé</summary>
<p>Physique : dissolution. Chimique : combustion, rouille.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les transformations physiques et chimiques se distinguent par l'apparition de nouvelles substances ; la matière se conserve.</p></div>

    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
