{
    title: "Coupe et couture — 4e secondaire — Sommaire général",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours prépare l'EXETAT (4e secondaire). Il comprend 9 leçons, suivies d'un quiz de révision.</p>

</ul>
</div>

{
    title: "Leçon 1 — Le matériel de coupe et de couture",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un atelier de couture à Kinshasa, une apprentie découvre les outils : mètre ruban, ciseaux, craie tailleur, épingles, machine à coudre. Chaque outil a sa fonction. Sans eux, impossible de couper et coudre correctement.</p></div>
<h3>1. Le matériel de mesure</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Mètre ruban</strong> : souple, gradué en cm, pour prendre les mesures.</li><li><strong>Règle graduée</strong> : pour tracer les lignes droites.</li><li><strong>Équerre</strong> : pour les angles droits.</li><li><strong>Pistolet de couturière</strong> : pour mesurer les ourlets.</li></ul></div>
<h3>2. Le matériel de coupe</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Ciseaux de tailleur</strong> : grands, pour couper le tissu.</li><li><strong>Ciseaux de broderie</strong> : petits, pour les finitions.</li><li><strong>Craie tailleur</strong> : pour marquer le tissu.</li><li><strong>Épingles</strong> : pour maintenir le patron.</li><li><strong>Patron</strong> : gabarit en papier ou carton.</li></ul></div>
<h3>3. Le matériel de couture</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Machine à coudre</strong> : mécanique ou électrique.</li><li><strong>Fil</strong> : assorti au tissu.</li><li><strong>Aiguilles</strong> : main ou machine.</li><li><strong>Dé à coudre</strong> : pour pousser l'aiguille.</li><li><strong>Fer à repasser</strong> : pour les coutures.</li><li><strong>Boutons, fermetures, dentelles</strong> : accessoires.</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Prendre les mesures</strong> : tour de poitrine, tour de taille, tour de hanches, longueur.</li><li><strong>Marquer le tissu</strong> : à la craie tailleur, sur l'envers.</li><li><strong>Maintenir le patron</strong> : avec des épingles.</li><li><strong>Couper</strong> : avec les grands ciseaux, sans lever le tissu.</li></ul><p><a href="https://www.youtube.com/results?search_query=matériel+coupe+couture+ciseaux+mètre" target="_blank" rel="noopener">🎥 Recherche : le matériel de couture</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le matériel se classe en 3 catégories : mesure (mètre, règle, équerre), coupe (ciseaux, craie, épingles) et couture (machine, fil, aiguilles). Chaque outil a une fonction précise.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Coupe-Couture 4e Technique (manuels-scolaires-rdc.com, 2025).<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT.</div>
`
},
{
    title: "Leçon 2 — La prise des mesures",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un atelier de Lubumbashi, une cliente veut une robe sur mesure. La couturière prend ses mesures : tour de poitrine, tour de taille, tour de hanches, longueur. Une erreur de mesure = une robe ratée.</p></div>
<h3>1. Les mesures principales</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Tour de poitrine</strong> : au niveau le plus fort.</li><li><strong>Tour de taille</strong> : au creux de la taille.</li><li><strong>Tour de hanches</strong> : au niveau le plus fort.</li><li><strong>Longueur dos</strong> : de la nuque à la taille.</li><li><strong>Longueur devant</strong> : de l'épaule à la taille.</li><li><strong>Longueur jupe/robe</strong> : de la taille au genou/cheville.</li></ul></div>
<h3>2. Les mesures complémentaires</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Tour de cou</strong>, <strong>tour de bras</strong>, <strong>tour de poignet</strong>.</li><li><strong>Longueur de manche</strong> : de l'épaule au poignet.</li><li><strong>Largeur d'épaule</strong> : d'une épaule à l'autre.</li><li><strong>Hauteur poitrine</strong> : de l'épaule au mamelon.</li><li><strong>Écart poitrine</strong> : entre les deux mamelons.</li></ul></div>
<h3>3. Règles à respecter</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li>Prendre les mesures sur un vêtement léger.</li><li>Le client debout, droit, détendu.</li><li>Mètre ruban bien ajusté, ni trop serré ni trop lâche.</li><li>Noter les mesures sur une fiche.</li><li>Ajouter les aises (marges) selon le vêtement.</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><strong>Fiche de mesures — Robe</strong></p><ul><li>Tour de poitrine : 92 cm.</li><li>Tour de taille : 74 cm.</li><li>Tour de hanches : 98 cm.</li><li>Longueur dos : 40 cm.</li><li>Longueur robe : 100 cm.</li><li>Longueur manche : 58 cm.</li></ul><p><a href="https://www.youtube.com/results?search_query=prise+mesures+coupe+couture+robe" target="_blank" rel="noopener">🎥 Recherche : la prise des mesures</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La prise des mesures est essentielle en couture. On mesure tours (poitrine, taille, hanches), longueurs (dos, devant, robe) et largeurs (épaule). Bien noter sur une fiche et ajouter les aises.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Coupe-Couture 4e Technique (2025).</div>
`
},
{
    title: "Leçon 3 — Le patron : tracé et adaptation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une couturière de Kinshasa prépare une jupe droite. Elle trace le patron sur papier, en suivant les mesures de la cliente. Le patron est le plan du vêtement : sans lui, pas de coupe précise.</p></div>
<h3>1. Le patron</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Patron</strong> : gabarit en papier ou carton représentant les pièces du vêtement.</li><li><strong>Patron industriel</strong> : standardisé, tailles normalisées.</li><li><strong>Patron sur mesure</strong> : adapté aux mesures individuelles.</li><li><strong>Pièces principales</strong> : devant, dos, manche, col, ceinture.</li></ul></div>
<h3>2. Le tracé du patron</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>1.</strong> Tracer un rectangle de base (largeur = 1/4 ou 1/2 tour, hauteur = longueur).</li><li><strong>2.</strong> Placer les lignes de poitrine, taille, hanches.</li><li><strong>3.</strong> Tracer l'encolure, l'emmanchure, les pinces.</li><li><strong>4.</strong> Ajouter les valeurs de couture (1-1,5 cm).</li><li><strong>5.</strong> Vérifier les mesures.</li></ul></div>
<h3>3. L'adaptation du patron</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Modifier la longueur</strong> : couper et allonger/raccourcir.</li><li><strong>Modifier la largeur</strong> : élargir/rétrécir au niveau des pinces.</li><li><strong>Adapter aux morphologies</strong> : forte poitrine, hanches larges, dos voûté.</li><li><strong>Vérifier</strong> sur le corps ou sur mannequin.</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><strong>Patron d'une jupe droite</strong></p><ul><li>Mesures : tour de taille 74, tour de hanches 98, longueur 60.</li><li>Rectangle de base : 1/4 tour de hanches = 24,5 cm + aises.</li><li>Longueur : 60 cm + ourlet.</li><li>Pince de taille : 3 cm de chaque côté.</li><li>Valeur de couture : 1,5 cm tout autour.</li></ul><p><a href="https://www.youtube.com/results?search_query=patron+coupe+couture+tracé+adaptation" target="_blank" rel="noopener">🎥 Recherche : le patron de couture</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le patron est le gabarit du vêtement. Le tracé suit 5 étapes : rectangle de base, lignes de repère, encolure/emmanchure, valeurs de couture, vérification. L'adaptation permet d'ajuster aux morphologies.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Coupe-Couture 4e Technique (2025).</div>
`
},
{
    title: "Leçon 4 — La coupe du tissu",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Avant de couper un tissu wax de 2 mètres, une couturière de Kinshasa vérifie le sens du droit fil, dispose les pièces du patron, épingle et coupe. Une coupe ratée = du tissu perdu.</p></div>
<h3>1. La préparation du tissu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Vérification</strong> : défauts, taches, largeur, longueur.</li><li><strong>Repassage</strong> : pour enlever les plis.</li><li><strong>Droit fil</strong> : sens des fils du tissu, à respecter.</li><li><strong>Endroit/envers</strong> : repérer pour bien placer le patron.</li><li><strong>Lisière</strong> : bord du tissu, ne pas couper.</li></ul></div>
<h3>2. La disposition du patron</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Sens du droit fil</strong> : flèches du patron parallèles à la lisière.</li><li><strong>Économie de tissu</strong> : disposition optimale des pièces.</li><li><strong>Épinglage</strong> : épingles perpendiculaires au bord.</li><li><strong>Vérification</strong> : toutes les pièces sont présentes.</li></ul></div>
<h3>3. La coupe</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Ciseaux de tailleur</strong> : grands, bien affûtés.</li><li><strong>Coupe franche</strong> : sans lever le tissu.</li><li><strong>Valeurs de couture</strong> : respecter les marges tracées.</li><li><strong>Crans</strong> : petites entailles aux repères (taille, poitrine).</li><li><strong>Marquage</strong> : pinces, repères, à la craie.</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Tissu uni</strong> : pas de contrainte de sens, disposition optimale.</li><li><strong>Tissu à motifs</strong> : respecter le sens du motif.</li><li><strong>Tissu à carreaux</strong> : faire coïncider les carreaux aux coutures.</li><li><strong>Tissu rayé</strong> : aligner les rayures.</li><li><strong>Velours</strong> : respecter le sens du poil.</li></ul><p><a href="https://www.youtube.com/results?search_query=coupe+tissu+droit+fil+patron" target="_blank" rel="noopener">🎥 Recherche : la coupe du tissu</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La coupe du tissu suit 3 phases : préparation (vérification, repassage), disposition du patron (droit fil, épinglage) et coupe (ciseaux, valeurs, crans). Respecter le sens du droit fil et des motifs.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Coupe-Couture 4e Technique (2025).</div>
`
},
{
    title: "Leçon 5 — Les points de couture à la main",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un atelier de Kisangani, une apprentie apprend les points de base : point devant, point arrière, point de bâti. Avant de maîtriser la machine, il faut savoir coudre à la main.</p></div>
<h3>1. Les points de bâti</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Point devant</strong> : petits points réguliers, pour maintenir temporairement.</li><li><strong>Point de bâti</strong> : plus longs, pour assembler avant la couture définitive.</li><li><strong>Point arrière</strong> : solide, pour arrêter un fil ou coudre un bouton.</li><li><strong>Faufil</strong> : point long, temporaire.</li></ul></div>
<h3>2. Les points définitifs</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Point de côté</strong> : solide, pour assembler deux tissus.</li><li><strong>Point de surjet</strong> : pour empêcher l'effilochage.</li><li><strong>Point de bourdon</strong> : décoratif et solide.</li><li><strong>Point de chausson</strong> : pour les ourlets invisibles.</li><li><strong>Point de croix</strong> : décoratif.</li></ul></div>
<h3>3. Les finitions</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Ourlet</strong> : replier le bord et coudre.</li><li><strong>Boutonnière</strong> : fente pour passer le bouton.</li><li><strong>Bouton</strong> : fixation solide.</li><li><strong>Crochet/agrafe</strong> : fermeture.</li><li><strong>Passepoil</strong> : garniture décorative.</li></ul></div>

    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }

    if (NATIVE) prefetchAll();
  }

  var JSON_URL = NATIVE ? SITE + "images_ecolia.json" : "images_ecolia.json";
  var KEY = "ecolia_images_json";
  fetch(JSON_URL, NATIVE ? { cache: "no-cache" } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (table) { if (NATIVE) lsSet(KEY, JSON.stringify(table)); start(table); })
    .catch(function (e) {
      var saved = null;
      if (NATIVE) { try { saved = JSON.parse(lsGet(KEY) || "null"); } catch (x) {} }
      if (saved) start(saved);                              // hors ligne dans l'APK : JSON gardé la dernière fois
      else console.warn("ECOLIA : JSON des images indisponible.", e);
    });
})();
</script>
