{
    title: "Leçon 1 — Le texte narratif et le schéma narratif",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une classe de 4e à Kinshasa, ton professeur te donne un extrait du roman <em>Ville cruelle</em> d'Eza Boto. Il te demande : « Identifiez le schéma narratif de ce passage. » Pour répondre, tu dois maîtriser les cinq étapes du récit.</p></div>
<h3>1. Définition et caractéristiques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Texte narratif</strong> : récit d'événements réels ou fictifs qui se déroulent dans le temps.</li><li><strong>Ingrédients</strong> : personnages, actions, lieu, époque, narrateur.</li><li><strong>Temps verbaux</strong> : imparfait (description, arrière-plan), passé simple (actions), présent de narration (récit vivant).</li><li><strong>Indicateurs de temps</strong> : d'abord, ensuite, alors, le lendemain, quelques années plus tard.</li></ul></div>
<h3>2. Le schéma narratif</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Situation initiale</strong> : équilibre de départ (présentation des personnages, du lieu, du temps).</li><li><strong>Élément perturbateur</strong> : événement qui rompt l'équilibre.</li><li><strong>Péripéties</strong> : actions et obstacles qui s'enchaînent.</li><li><strong>Élément de résolution</strong> : événement qui met fin aux péripéties.</li><li><strong>Situation finale</strong> : nouvel équilibre (heureux ou malheureux).</li></ul></div>
<h3>3. Narrateur et focalisation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Narrateur interne</strong> : raconte à la 1re personne (« je »), il est personnage du récit.</li><li><strong>Narrateur externe</strong> : raconte à la 3e personne, il est témoin sans être acteur.</li><li><strong>Narrateur omniscient</strong> : connaît tout (pensées, sentiments de tous les personnages).</li><li><strong>Focalisation</strong> : zéro (omniscient), interne (point de vue d'un personnage), externe (point de vue du témoin).</li></ul></div>
<h3>4. Exemple analysé</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Extrait : « Ce matin-là, Kola se leva avant l'aube. Il devait rejoindre la ville. Mais sur le chemin, un homme armé lui barra la route. »</p><ul><li>Situation initiale : Kola se lève.</li><li>Élément perturbateur : un homme armé l'arrête.</li><li>Narrateur externe, focalisation externe.</li><li>Temps : passé simple pour les actions.</li></ul><p><a href="https://www.youtube.com/results?search_query=texte+narratif+schéma+narratif+narrateur+focalisation" target="_blank" rel="noopener">🎥 Recherche : le texte narratif (chaînes de cours de français)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un récit suit un schéma narratif en 5 étapes. Le narrateur peut être interne, externe ou omniscient. La focalisation indique le point de vue adopté. Les temps du récit sont l'imparfait et le passé simple.</p></div>
<div class="sources"><strong>Sources :</strong> Programme de français, 6e année des humanités (4e actuelle), RDC — domaines grammaire, littérature, analyse de texte, expression écrite et orale.</div>
    `
},
{
    title: "Leçon 2 — Le texte descriptif",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À Lubumbashi, dans une rédaction, tu dois décrire le marché central un samedi matin. Ton professeur te dit : « Ne raconte pas, décris. » Comment procède-t-on ?</p></div>
<h3>1. Définition et fonctions</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Texte descriptif</strong> : représente un être, un lieu, un objet, une scène par des mots.</li><li><strong>Fonctions</strong> : informer (description documentaire), émouvoir (description poétique), orienter (description argumentative).</li><li><strong>Repères</strong> : présentation d'ensemble, puis détails selon un ordre (haut/bas, gauche/droite, gros plan/panorama).</li><li><strong>Temps</strong> : présent ou imparfait de description.</li></ul></div>
<h3>2. Les procédés descriptifs</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Expansion</strong> : enrichir le nom avec adjectifs, compléments du nom, propositions relatives.</li><li><strong>Caractérisation</strong> : qualités physiques, morales, fonctionnelles.</li><li><strong>Localisation</strong> : situer les éléments dans l'espace.</li><li><strong>Comparaison, métaphore, personnification</strong> : rendre le portrait vivant.</li><li><strong>Champs lexicaux</strong> : regrouper les mots d'un même thème (couleurs, sons, odeurs).</li></ul></div>
<h3>3. Types de description</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Portrait</strong> : description d'une personne (physique et moral).</li><li><strong>Paysage</strong> : description d'un lieu.</li><li><strong>Tableau</strong> : description d'une scène animée.</li><li><strong>Description d'objet</strong> : usage, forme, matière.</li></ul></div>
<h3>4. Exemple</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>« Le marché s'étendait sur des hectares. Des étals multicolores débordaient de tomates rouge sang, de mangues dorées, de poissons argentés. Une odeur épaisse d'épices et de fumée enveloppait la foule. Les vendeuses, drapées dans des pagnes éclatants, interpellaient les passants d'une voix rauque. »</p><ul><li>Champs lexicaux : couleurs, odeurs, sons.</li><li>Ordre : panorama puis gros plan.</li><li>Procédés : métaphores (rouge sang, mangues dorées), personnification (la foule).</li></ul><p><a href="https://www.youtube.com/results?search_query=texte+descriptif+portrait+paysage+procédés" target="_blank" rel="noopener">🎥 Recherche : le texte descriptif (chaînes de cours de français)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Décrire, c'est représenter par des mots. On utilise l'expansion, la caractérisation, les champs lexicaux et les figures de style. On organise la description selon un ordre choisi (panorama ou gros plan).</p></div>
<div class="sources"><strong>Sources :</strong> Programme de français, 6e année des humanités (4e actuelle), RDC — domaines grammaire, littérature, analyse de texte, expression écrite et orale.</div>
    `
},
{
    title: "Leçon 3 — Le texte explicatif et injonctif",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un manuel de SVT, tu lis un texte qui explique le cycle de l'eau. Dans une notice de médicament, tu lis des instructions. Deux types de textes différents : explicatif et injonctif.</p></div>
<h3>1. Le texte explicatif</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Objectif</strong> : faire comprendre un phénomène, un mécanisme, une notion.</li><li><strong>Structure</strong> : question de départ, explication (causes, conséquences, étapes), conclusion.</li><li><strong>Procédés</strong> : définitions, exemples, comparaisons, schémas, reformulations.</li><li><strong>Connecteurs</strong> : parce que, c'est pourquoi, en effet, d'une part, d'autre part.</li><li><strong>Temps</strong> : présent de vérité générale.</li></ul></div>
<h3>2. Le texte injonctif</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Objectif</strong> : faire agir le lecteur (ordre, conseil, mode d'emploi, recette).</li><li><strong>Structure</strong> : étapes numérotées, verbes à l'infinitif ou à l'impératif.</li><li><strong>Procédés</strong> : verbes d'action, listes, puces, schémas.</li><li>Exemples : notice de médicament, recette de cuisine, règlement intérieur, consignes de sécurité.</li></ul></div>
<h3>3. Comparaison</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Explicatif</strong> : « Pourquoi ? » — le texte répond, il informe.</li><li><strong>Injonctif</strong> : « Comment faire ? » — le texte commande, il prescrit.</li><li>Les deux types de textes sont courants à l'EXETAT.</li></ul></div>
<h3>4. Exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><strong>Explicatif</strong> : « L'effet de serre est un phénomène naturel. Les gaz présents dans l'atmosphère retiennent une partie de la chaleur du soleil. Sans cet effet, la température moyenne de la Terre serait de −18 °C au lieu de 15 °C. Mais l'activité humaine augmente ces gaz et provoque un réchauffement excessif. »</p><p><strong>Injonctif</strong> : « Pour préserver l'eau : 1) Fermez le robinet pendant le brossage. 2) Réparez les fuites. 3) Arrosez le soir. 4) Ne jetez pas de déchets dans les rivières. »</p><p><a href="https://www.youtube.com/results?search_query=texte+explicatif+injonctif+caractéristiques" target="_blank" rel="noopener">🎥 Recherche : textes explicatif et injonctif (chaînes de cours de français)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le texte explicatif fait comprendre (structure : question, explication, conclusion). Le texte injonctif fait agir (impératif, infinitif, étapes). Les deux utilisent des connecteurs logiques et un vocabulaire précis.</p></div>
<div class="sources"><strong>Sources :</strong> Programme de français, 6e année des humanités (4e actuelle), RDC.</div>
    `
},
{
    title: "Leçon 4 — Le texte argumentatif",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Au cours d'un débat à l'école de Kisangani, on te demande : « L'usage du téléphone portable à l'école doit-il être interdit ? » Tu dois défendre une opinion avec des arguments solides.</p></div>
<h3>1. Définition et structure</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Texte argumentatif</strong> : défend une opinion (thèse) en s'appuyant sur des arguments et des exemples.</li><li><strong>Thèse</strong> : opinion défendue.</li><li><strong>Antithèse</strong> : opinion adverse.</li><li><strong>Arguments</strong> : raisons logiques qui soutiennent la thèse.</li><li><strong>Exemples</strong> : faits, chiffres, citations, témoignages.</li><li><strong>Conclusion</strong> : synthèse ou prise de position.</li></ul></div>
<h3>2. Types de raisonnement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Déductif</strong> : de la règle générale au cas particulier.</li><li><strong>Inductif</strong> : du cas particulier à la règle générale.</li><li><strong>Par analogie</strong> : comparer deux situations similaires.</li><li><strong>Par concession</strong> : reconnaître un point adverse puis le réfuter.</li><li><strong>Par l'absurde</strong> : montrer que la thèse adverse mène à une contradiction.</li></ul></div>
<h3>3. Les connecteurs logiques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Addition</strong> : et, de plus, en outre, par ailleurs.</li><li><strong>Cause</strong> : car, parce que, puisque, en effet.</li><li><strong>Conséquence</strong> : donc, ainsi, par conséquent, c'est pourquoi.</li><li><strong>Opposition</strong> : mais, cependant, néanmoins, en revanche.</li><li><strong>Illustration</strong> : par exemple, notamment, ainsi.</li><li><strong>Conclusion</strong> : en somme, en définitive, pour conclure.</li></ul></div>
<h3>4. Exemple de paragraphe argumentatif</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>« Le téléphone portable à l'école nuit aux apprentissages. D'abord, il détourne l'attention des élèves : notifications, jeux, réseaux sociaux. Ensuite, il favorise la tricherie pendant les évaluations. Enfin, il peut être un outil de cyberharcèlement. Par conséquent, son usage devrait être strictement encadré. »</p><p><a href="https://www.youtube.com/results?search_query=texte+argumentatif+thèse+arguments+connecteurs+logiques" target="_blank" rel="noopener">🎥 Recherche : le texte argumentatif (chaînes de cours de français)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Argumenter, c'est défendre une thèse avec des arguments et des exemples, en utilisant des connecteurs logiques. Les raisonnements peuvent être déductifs, inductifs, par analogie, par concession ou par l'absurde.</p></div>
<div class="sources"><strong>Sources :</strong> Programme de français, 6e année des humanités (4e actuelle), RDC.</div>
    `
},

    title: "Leçon 5 — Le commentaire composé",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Ton professeur te donne un poème de Senghor et te demande : « Faites le commentaire composé de ce texte. » Tu ne dois pas paraphraser : tu dois organiser ton analyse en axes de lecture.</p></div>
<h3>1. Définition et différence avec l'explication linéaire</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Commentaire composé</strong> : analyse organisée en axes thématiques (et non dans l'ordre du texte).</li><li><strong>Explication linéaire</strong> : suit le texte ligne après ligne.</li><li><strong>Objectif</strong> : dégager les idées et les procédés d'écriture qui les portent.</li><li>On ne raconte pas le texte, on l'analyse.</li></ul></div>
<h3>2. Méthode en 6 étapes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ol><li><strong>Lecture attentive</strong> du texte (2 ou 3 fois).</li><li><strong>Repérage</strong> : idées principales, champs lexicaux, figures de style, rythme.</li><li><strong>Définition des axes</strong> (2 ou 3), avec un titre clair pour chacun.</li><li><strong>Classement des citations</strong> dans les axes correspondants.</li><li><strong>Rédaction</strong> : introduction, développement (axes), conclusion.</li><li><strong>Relecture</strong> : vérifier la cohérence et l'orthographe.</li></ol></div>
<h3>3. Structure du devoir</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Introduction</strong> : présentation du texte (auteur, œuvre, date), situation du passage, problématique, annonce des axes.</li><li><strong>Développement</strong> : un paragraphe par sous-axe. Chaque sous-axe commence par une idée, suivie d'une citation et d'une analyse.</li><li><strong>Conclusion</strong> : bilan des axes et ouverture (rapprochement avec un autre texte, un courant, une actualité).</li></ul></div>
<h3>4. Exemple d'axes</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Poème de Senghor : « Femme nue, femme noire / Vêtue de ta couleur qui est vie… »</p><ul><li><strong>Axe 1</strong> : l'éloge de la femme africaine (champ lexical de la beauté, hyperboles).</li><li><strong>Axe 2</strong> : la célébration de l'Afrique (références culturelles, images cosmiques).</li><li><strong>Axe 3</strong> : la musicalité du poème (anaphores, rythme, sonorités).</li></ul><p><a href="https://www.youtube.com/results?search_query=commentaire+composé+méthode+axes+de+lecture" target="_blank" rel="noopener">🎥 Recherche : le commentaire composé (chaînes de cours de français)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le commentaire composé analyse un texte en 2 ou 3 axes thématiques. Chaque axe regroupe des idées, des citations et des procédés. La rédaction suit : introduction (présentation + problématique + annonce), développement, conclusion.</p></div>
<div class="sources"><strong>Sources :</strong> Programme de français, 6e année des humanités (4e actuelle), RDC.</div>
    `
},
{
    title: "Leçon 6 — Les procédés stylistiques et figures de style",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un poème de Léopold Sédar Senghor, tu lis : « Femme nue, femme noire / Vêtue de ta couleur qui est vie ». Ton professeur te demande d'identifier la figure de style.</p></div>
<h3>1. Figures d'analogie</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Comparaison</strong> : rapproche deux éléments avec un outil (comme, tel que). Ex. : « Il est fort comme un lion. »</li><li><strong>Métaphore</strong> : comparaison sans outil. Ex. : « Cet homme est un lion. »</li><li><strong>Personnification</strong> : attribuer des traits humains à une chose. Ex. : « La forêt pleure. »</li><li><strong>Allégorie</strong> : représentation concrète d'une idée abstraite.</li></ul></div>
<h3>2. Figures d'insistance</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Hyperbole</strong> : exagération. Ex. : « Je meurs de faim. »</li><li><strong>Anaphore</strong> : répétition d'un mot en début de phrase. Ex. : « Femme nue, femme noire. »</li><li><strong>Gradation</strong> : suite d'éléments d'intensité croissante. Ex. : « Je le vois, je le sens, je le touche. »</li><li><strong>Répétition</strong> : reprise d'un mot.</li></ul></div>
<h3>3. Figures d'opposition</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Antithèse</strong> : opposition de deux idées. Ex. : « Je vis, je meurs. »</li><li><strong>Oxymore</strong> : deux mots opposés dans une même expression. Ex. : « Un silence éloquent. »</li><li><strong>Chiasme</strong> : croisement de termes. Ex. : « Il faut manger pour vivre, et non vivre pour manger. »</li></ul></div>
<h3>4. Figures d'atténuation et de substitution</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Euphémisme</strong> : adoucir une réalité brutale. Ex. : « Il nous a quittés » (= il est mort).</li><li><strong>Litote</strong> : dire moins pour suggérer plus. Ex. : « Va, je ne te hais point » (= je t'aime).</li><li><strong>Métonymie</strong> : remplacer un mot par un autre lié logiquement. Ex. : « Boire un verre » (= son contenu).</li><li><strong>Périphrase</strong> : dire en plusieurs mots. Ex. : « L'astre des nuits » (= la lune).</li></ul><p><a href="https://www.youtube.com/results?search_query=figures+de+style+liste+métaphore+hyperbole+personnification" target="_blank" rel="noopener">🎥 Recherche : les figures de style (chaînes de cours de français)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les figures de style se classent en : analogie (comparaison, métaphore, personnification), insistance (hyperbole, anaphore, gradation), opposition (antithèse, oxymore, chiasme), atténuation (euphémisme, litote, métonymie, périphrase).</p></div>
<div class="sources"><strong>Sources :</strong> Programme de français, 6e année des humanités (4e actuelle), RDC.</div>
    `
},
{
    title: "Leçon 7 — La dissertation littéraire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À l'EXETAT, on te propose le sujet : « La littérature africaine doit-elle être engagée ? » Tu dois rédiger une dissertation. Sans méthode, on se perd.</p></div>
<h3>1. Qu'est-ce qu'une dissertation ?</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Dissertation</strong> : développement argumenté et organisé autour d'une question ou d'une citation.</li><li><strong>Objectif</strong> : démontrer une position ou discuter un sujet en mobilisant connaissances, exemples et raisonnements.</li><li>Elle comprend une introduction, un développement, une conclusion.</li></ul></div>
<h3>2. Les trois types de plan</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Plan dialectique</strong> : thèse / antithèse / synthèse. Utile pour un sujet à discuter.</li><li><strong>Plan thématique</strong> : plusieurs aspects d'une même notion.</li><li><strong>Plan analytique</strong> : constat / causes / solutions.</li></ul></div>
<h3>3. Structure du devoir</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Introduction</strong> : accroche, définition des termes du sujet, problématique, annonce du plan.</li><li><strong>Développement</strong> : 2 ou 3 parties, chacune composée de 2 ou 3 paragraphes argumentés avec exemples (œuvres, auteurs).</li><li><strong>Transition</strong> entre les parties.</li><li><strong>Conclusion</strong> : synthèse, réponse à la problématique, ouverture.</li></ul></div>
<h3>4. Exemple de sujet et plan</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Sujet : « La littérature africaine doit-elle être engagée ? »</p><ul><li><strong>Thèse</strong> : oui, l'écrivain africain a un devoir social (Sembène Ousmane, Mongo Beti).</li><li><strong>Antithèse</strong> : non, l'art doit rester libre et se consacrer au beau.</li><li><strong>Synthèse</strong> : l'engagement peut être esthétique sans être militant.</li></ul><p><a href="https://www.youtube.com/results?search_query=dissertation+littéraire+méthode+plan+dialectique" target="_blank" rel="noopener">🎥 Recherche : la dissertation littéraire (chaînes de cours de français)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La dissertation est un devoir argumenté et organisé. Trois plans : dialectique, thématique, analytique. Structure : introduction, développement en parties (avec exemples littéraires), conclusion.</p></div>
<div class="sources"><strong>Sources :</strong> Programme de français, 6e année des humanités (4e actuelle), RDC.</div>
    `
},
{
    title: "Leçon 8 — Le résumé et la contraction de texte",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À l'EXETAT, on te donne un texte de 40 lignes sur la déforestation. On te demande de le résumer en 10 lignes. Comment faire pour ne rien perdre d'essentiel sans rien inventer ?</p></div>
<h3>1. Règles d'or du résumé</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Fidélité</strong> : respecter strictement la pensée de l'auteur.</li><li><strong>Objectivité</strong> : aucune opinion personnelle.</li><li><strong>Neutralité de l'énonciation</strong> : reformuler à la 3e personne.</li><li><strong>Concision</strong> : règle du quart — le résumé fait environ 1/4 du texte source.</li><li><strong>Reformulation</strong> : pas de copier-coller, mais on garde les termes-clés techniques.</li><li><strong>Cohérence</strong> : un résumé est un texte suivi, jamais une liste.</li></ul></div>
<h3>2. Méthode en 5 étapes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ol><li><strong>Lecture active</strong> : lire 2 fois, crayon en main.</li><li><strong>Repérage de la thèse</strong>.</li><li><strong>Découpage en unités de sens</strong>.</li><li><strong>Extraction des idées essentielles</strong>.</li><li><strong>Rédaction au quart</strong>.</li></ol></div>
<h3>3. Ce qu'on supprime et ce qu'on garde</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>On supprime</strong> : exemples illustratifs, citations, répétitions, digressions, anecdotes.</li><li><strong>On garde</strong> : thèse, idées-clés, articulations logiques, termes techniques essentiels.</li><li><strong>On reformule</strong> : phrases longues remplacées par des équivalents plus brefs.</li></ul></div>
<h3>4. Exemple</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Texte source (extrait) : « La forêt du bassin du Congo constitue le deuxième poumon vert de la planète après l'Amazonie. Elle abrite une biodiversité exceptionnelle : bonobos, okapis, gorilles. Or, chaque année, des milliers d'hectares sont détruits par l'agriculture itinérante, l'exploitation du bois et le charbon de bois. »</p><p><strong>Résumé (quart)</strong> : « Selon l'auteur, la forêt du bassin du Congo, deuxième poumon vert mondial, abrite une biodiversité exceptionnelle. Mais elle est menacée par l'agriculture, l'exploitation du bois et le charbon de bois. »</p><p><a href="https://www.youtube.com/results?search_query=résumé+de+texte+méthode+règle+du+quart" target="_blank" rel="noopener">🎥 Recherche : le résumé de texte (chaînes de cours de français)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le résumé respecte la pensée de l'auteur, sans commentaire, à la 3e personne, en un quart du texte source. Méthode : lecture active, thèse, unités de sens, idées essentielles, rédaction concise.</p></div>
<div class="sources"><strong>Sources :</strong> Programme de français, 6e année des humanités (4e actuelle), RDC.</div>
    `
},

<div class="bloc cas"><div class="bloc-label">Situation</div><p>Au bureau du directeur de ton école à Mbandaka, tu dois rédiger une lettre pour demander une attestation. Puis, à la fin d'une sortie pédagogique, tu dois rédiger un compte rendu.</p></div>
<h3>1. La lettre administrative</h3>

<h3>2. La lettre personnelle</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li>Ton familier, affectif.</li><li>Lieu et date en haut à droite.</li><li>Formule d'appel : « Cher frère, ».</li><li>Corps : nouvelles, sentiments, demandes.</li><li>Formule finale : « Ton frère qui t'aime… ».</li></ul></div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La lettre administrative est formelle (objet, formules de politesse). La lettre personnelle est familière. Le compte rendu rapporte objectivement un événement selon un ordre précis.</p></div>

    title: "Leçon 10 — Analyse logique : propositions et subordination",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À l'EXETAT, une question te demande d'analyser logiquement une phrase complexe. Tu dois identifier les propositions et leurs relations. C'est l'analyse logique.</p></div>
<h3>1. La phrase simple et la phrase complexe</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Phrase simple</strong> : un seul verbe conjugué, une seule proposition.</li><li><strong>Phrase complexe</strong> : plusieurs verbes conjugués, plusieurs propositions.</li><li><strong>Proposition indépendante</strong> : ne dépend d'aucune autre.</li><li><strong>Proposition principale</strong> : commande une subordonnée.</li><li><strong>Proposition subordonnée</strong> : dépend d'une principale.</li></ul></div>
<h3>2. Les types de subordonnées</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Relative</strong> : introduite par qui, que, dont, où ; complète un nom (antécédent).</li><li><strong>Conjonctive</strong> : introduite par que ; COD ou sujet.</li><li><strong>Circonstancielle</strong> : temps, cause, but, conséquence, condition, concession.</li><li><strong>Infinitive</strong> : verbe à l'infinitif.</li><li><strong>Interrogative indirecte</strong> : introduite par si, ce que, pourquoi.</li></ul></div>
<h3>3. Les connecteurs de subordination</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Temps</strong> : quand, lorsque, pendant que, avant que.</li><li><strong>Cause</strong> : parce que, puisque, comme, étant donné que.</li><li><strong>But</strong> : pour que, afin que.</li><li><strong>Conséquence</strong> : si bien que, de sorte que.</li><li><strong>Condition</strong> : si, à condition que.</li><li><strong>Concession</strong> : bien que, quoique, même si.</li></ul></div>
<h3>4. Exemple d'analyse</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Phrase : « Je pense que tu réussiras parce que tu travailles. »</p><ul><li>« Je pense » : proposition principale.</li><li>« que tu réussiras » : subordonnée conjonctive, COD de « pense ».</li><li>« parce que tu travailles » : subordonnée circonstancielle de cause.</li></ul><p><a href="https://www.youtube.com/results?search_query=analyse+logique+propositions+subordonnées" target="_blank" rel="noopener">🎥 Recherche : analyse logique (chaînes de cours de français)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La phrase complexe contient plusieurs propositions. Les subordonnées peuvent être relatives, conjonctives, circonstancielles, infinitives ou interrogatives indirectes. L'analyse logique identifie la nature et la fonction de chaque proposition.</p></div>
<div class="sources"><strong>Sources :</strong> Programme de français, 6e année des humanités (4e actuelle), RDC.</div>
    `
},
{
    title: "Leçon 11 — Concordance des temps et modes",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un devoir, tu écris : « Si je serais riche, j'achèterais une maison. » Ton professeur corrige : « Si je <strong>étais</strong> riche… ». Pour éviter ce type d'erreur à l'EXETAT, il faut maîtriser la concordance des temps.</p></div>
<h3>1. Les modes personnels</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Indicatif</strong> : exprime un fait réel (je marche).</li><li><strong>Conditionnel</strong> : exprime une hypothèse ou une politesse (je marcherais).</li><li><strong>Subjonctif</strong> : exprime un souhait, une obligation, un doute (que je marche).</li><li><strong>Impératif</strong> : exprime un ordre, un conseil (marche !).</li></ul></div>
<h3>2. Les modes impersonnels</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Infinitif</strong> : forme nominale du verbe (marcher).</li><li><strong>Participe</strong> : présent (marchant) ou passé (marché).</li><li><strong>Gérondif</strong> : en + participe présent (en marchant).</li></ul></div>
<h3>3. Les temps principaux</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Présent</strong> : action en cours (je lis).</li><li><strong>Imparfait</strong> : action passée non achevée, description (je lisais).</li><li><strong>Passé simple</strong> : action passée ponctuelle, récit écrit (je lus).</li><li><strong>Passé composé</strong> : action passée achevée (j'ai lu).</li><li><strong>Plus-que-parfait</strong> : action antérieure (j'avais lu).</li><li><strong>Futur simple</strong> : action à venir (je lirai).</li><li><strong>Futur antérieur</strong> : action future antérieure (j'aurai lu).</li><li><strong>Conditionnel présent</strong> : je lirais.</li><li><strong>Subjonctif présent</strong> : que je lise.</li></ul></div>
<h3>4. Concordance des temps</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Si + présent → futur</strong> : Si tu travailles, tu réussiras.</li><li><strong>Si + imparfait → conditionnel présent</strong> : Si tu travaillais, tu réussirais.</li><li><strong>Si + plus-que-parfait → conditionnel passé</strong> : Si tu avais travaillé, tu aurais réussi.</li><li>Ne jamais écrire : <em>Si je serais…</em> — c'est incorrect.</li></ul><p><a href="https://www.youtube.com/results?search_query=modes+et+temps+conjugaison+concordance+des+temps" target="_blank" rel="noopener">🎥 Recherche : modes et temps de la conjugaison (chaînes de cours de français)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>4 modes personnels : indicatif, conditionnel, subjonctif, impératif. 3 modes impersonnels : infinitif, participe, gérondif. Respecter la concordance des temps, surtout après « si ».</p></div>
<div class="sources"><strong>Sources :</strong> Programme de français, 6e année des humanités (4e actuelle), RDC.</div>
    `
},
{
    title: "Leçon 12 — Voix active et voix passive",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un article de journal, tu lis : « Le gouvernement a signé l'accord. » Puis un autre titre : « L'accord a été signé par le gouvernement. » Même information, mais voix différente.</p></div>
<h3>1. La voix active</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Sujet</strong> : fait l'action.</li><li><strong>Verbe</strong> : actif.</li><li><strong>COD</strong> : subit l'action.</li><li>Exemple : « Le gouvernement a signé l'accord. »</li></ul></div>
<h3>2. La voix passive</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Sujet</strong> : subit l'action.</li><li><strong>Verbe</strong> : être + participe passé.</li><li><strong>Complément d'agent</strong> : introduit par « par » (celui qui fait l'action).</li><li>Exemple : « L'accord a été signé par le gouvernement. »</li></ul></div>
<h3>3. Transformation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li>Le COD de la voix active devient sujet de la voix passive.</li><li>Le sujet de la voix active devient complément d'agent.</li><li>Le verbe actif devient être + participe passé, au même temps.</li></ul></div>
<h3>4. Quand utiliser la voix passive ?</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li>Quand on veut mettre en relief l'objet de l'action.</li><li>Quand l'auteur de l'action est inconnu ou peu important.</li><li>Dans le style journalistique, scientifique, administratif.</li></ul><p><a href="https://www.youtube.com/results?search_query=voix+active+voix+passive+transformation" target="_blank" rel="noopener">🎥 Recherche : voix active et passive (chaînes de cours de français)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>À la voix active, le sujet fait l'action. À la voix passive, le sujet subit l'action ; le complément d'agent indique qui agit. La transformation suit une règle simple.</p></div>
<div class="sources"><strong>Sources :</strong> Programme de français, 6e année des humanités (4e actuelle), RDC.</div>
    `
},
{
    title: "Leçon 13 — Accords et homophones grammaticaux",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans ta copie d'EXETAT, tu écris : « Les élèves sont arrivés et ils ont mangés. » Le correcteur barre : « mangé », sans « s ». Maîtriser les accords fait la différence.</p></div>
<h3>1. Accord sujet-verbe</h3>

<h3>3. Le théâtre</h3>

<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Exposé</strong> : présentation orale structurée d'un sujet devant un public.</li><li><strong>Structure</strong> : introduction, développement (2-3 parties), conclusion.</li><li><strong>Préparation</strong> : recherche d'informations, plan, notes, supports visuels.</li><li><strong>Présentation</strong> : voix claire, regard vers le public, gestion du temps.</li></ul></div>
<h3>2. Le débat</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Débat</strong> : discussion organisée autour d'une question controversée.</li><li><strong>Règles</strong> : respecter l'autre, écouter, argumenter, ne pas couper la parole.</li><li><strong>Rôles</strong> : modérateur, orateurs pour/contre, public.</li><li><strong>Procédés</strong> : arguments, exemples, reformulation, concession, réfutation.</li></ul></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Lecture expressive</strong> : lire un texte à voix haute en respectant le rythme, l'intonation, les pauses.</li><li><strong>Respecter la ponctuation</strong> : virgule (courte pause), point (pause longue), point d'interrogation (intonation montante).</li><li><strong>Adapter le ton</strong> au texte : joyeux, triste, solennel, ironique.</li><li><strong>Articuler</strong> : bien prononcer chaque mot.</li></ul></div>

    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>

<script>
(function () {
  var SITE = "https://ecolia-course.github.io/";
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface", page servie par https://app.local
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function abs(u) { return /^(https?:|data:|blob:)/i.test(u) ? u : (NATIVE ? SITE + u.replace(/^(\.\/|\/)+/, "") : u); }
  function ext(u) { var m = String(u).split("?")[0].match(/\.(jpe?g|png|gif|webp|svg)$/i); return m ? m[1].toLowerCase() : "jpg"; }
  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {
    if (queued[fn]) return;
    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
    if (!queue.length) { running = false; return; }
    if (!navigator.onLine) { running = false; return; }
    var q = queue.shift(), t0 = Date.now();
    try { CoursInterface.download(q[0], q[1]); } catch (e) { return setTimeout(next, 500); }
    (function wait() {
      var ok = false;
      try { ok = !!CoursInterface.exists(q[1]); } catch (e) {}
      if (ok) setTimeout(next, 1500);
      else if (Date.now() - t0 > 40000) next();
      else setTimeout(wait, 700);
    })();
  }
  function exists(fn) { try { return !!CoursInterface.exists(fn); } catch (e) { return false; } }

  function show(img) {                                    // affiche UNE image (appelé à chaque slide affichée)
    if (!table || img.getAttribute("data-ecolia-done")) return;
    var id = img.getAttribute("data-image-id");
    var url = table[id];
    if (typeof url !== "string" || !url.length) { console.warn("ECOLIA : image absente du JSON :", id); return; }
    img.setAttribute("data-ecolia-done", "1");
    if (!NATIVE) { img.onerror = function () { hide(img); }; img.setAttribute("src", url); return; }
    var full = abs(url), fn = "img_" + id + "." + ext(url);
    if (exists(fn)) {                                     // déjà sur l'appareil : lecture locale, sans internet
      img.onerror = function () {                         // fichier incomplet : on le supprime et on utilise le site
        try { CoursInterface["delete"](fn); } catch (e) {}
        queued[fn] = 0;
        img.onerror = function () { hide(img); };
        img.setAttribute("src", full);
      };
      img.setAttribute("src", "https://app.local/cours/" + fn);
    } else {
      img.onerror = function () { hide(img); };
      img.setAttribute("src", full);
      enqueue(full, fn);
    }
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches("img[data-image-id]")) show(root);
    root.querySelectorAll("img[data-image-id]").forEach(show);
  }
  function prefetchAll() {                                // APK : prépare TOUTES les images du cours pour le hors-ligne
    var ids = {};
    try { JSON.stringify(slides).replace(/data-image-id=\\?"([^"\\]+)/g, function (m, id) { ids[id] = 1; }); } catch (e) {}
    Object.keys(ids).forEach(function (id) {
      var url = table[id];
      if (typeof url !== "string" || !url.length) return;
      var fn = "img_" + id + "." + ext(url);
      if (!exists(fn)) enqueue(abs(url), fn);
    });
  }
  function start(tbl) {
    table = tbl;
    scan(document.body);
    new MutationObserver(function (muts) {                // les slides sont écrites à la volée : on traite chaque nouvelle image
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
    if (NATIVE) prefetchAll();
  }

  var JSON_URL = NATIVE ? SITE + "images_ecolia.json" : "images_ecolia.json";
  var KEY = "ecolia_images_json";
  fetch(JSON_URL, NATIVE ? { cache: "no-cache" } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (table) { if (NATIVE) lsSet(KEY, JSON.stringify(table)); start(table); })
    .catch(function (e) {
      var saved = null;
      if (NATIVE) { try { saved = JSON.parse(lsGet(KEY) || "null"); } catch (x) {} }
      if (saved) start(saved);                              // hors ligne dans l'APK : JSON gardé la dernière fois
      else console.warn("ECOLIA : JSON des images indisponible.", e);
    });
})();
</script>
