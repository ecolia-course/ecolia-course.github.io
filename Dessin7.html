de couleur: pour colorer, mélanger, nuancer. Papier: support de travail, posé bien à plat. La posture compte: le dos droit, la feuille bien orientée, la main détendue. Le crayon se tient à environ 3 à 4 centimètres de la mine pour permettre un tracé souple. Vocabulaire: outil, croquis, esquisse, contour, posture. 3. Exemples et contre-exemples. Exemple. Exemple: un élève esquisse d'abord légèrement un gobelet avec un trait fin, puis appuie pour préciser le contour. Il peut ainsi corriger sans gommer. Contre-exemple: un élève appuie fortement dès le début, se trompe, gomme, déchire la feuille et abandonne. 4. Exercices d'application. Exercices. Exercice 1: Trace une série de lignes horizontales, verticales et obliques sur une feuille, sans règle, en essayant de garder la même épaisseur. Corrigé: Vérifier la régularité des traits et la pression modérée du crayon. Exercice 2: Dessine au crayon trois objets familiers posés devant toi (par exemple un gobelet, une gomme, un cahier) en gardant un trait léger. Corrigé: Les objets doivent être reconnaissables, le trait léger, les proportions respectées autant que possible. 5. Erreurs fréquentes à éviter. Erreurs. Appuyer excessivement sur le crayon dès le début. Laisser la feuille de travers. Tenir le crayon trop serré. Effacer sans arrêt au lieu d'esquisser léger. Activité pratique. Prépare ton matériel et dessine trois objets de ton choix posés sur la table. Garde un trait léger et net. À retenir. Le dessinateur dispose d'outils simples: crayon, gomme, règle, papier. La posture et la tenue du crayon comptent. On commence toujours par un trait léger avant d'appuyer."]],"3":[["fr","Leçon 2: Les différents types de lignes. Situation. Devant une colline de Kinshasa, un élève remarque que son contour est une ligne courbe. Les fils électriques tendus sont des lignes droites. Les branches d'un arbre se divisent en lignes brisées. Comment utiliser ces différents tracés dans un dessin? 1. Objectifs. Objectifs. Identifier et nommer les principaux types de lignes. Utiliser les lignes pour représenter des formes et des contours. Comprendre la différence entre ligne de construction et ligne définitive. 2. Contenu: les types de lignes. Théorie. Ligne horizontale: parallèle au sol, calme. Ligne verticale: debout, donne une impression de stabilité. Ligne oblique: inclinée, suggère le mouvement. Ligne courbe: souple, arrondie, évoque la nature. Ligne brisée: formée de segments, suggère la rupture. Ligne continue: d'un seul trait, sans lever le crayon. Ligne pointillée: succession de points, souvent utilisée pour suggérer un contour discret. Vocabulaire: ligne, contour, tracé, construction. 3. Exemples et contre-exemples. Exemple. Exemple: pour dessiner un arbre, on utilise d'abord une ligne verticale légère (le tronc), puis des lignes courbes pour les branches, et enfin une ligne brisée pour suggérer l'écorce. Contre-exemple: l'élève confond la ligne de construction (trait léger pour se repérer) et la ligne définitive (trait plus marqué). Le dessin devient confus. 4. Exercices d'application. Exercices. Exercice 1: Compose un dessin en utilisant au moins cinq types de lignes. Corrigé: Vérifier la présence effective de cinq types différents (horizontale, verticale, oblique, courbe, pointillée, etc.). Exercice 2: Observe les fils électriques d'une rue. Quel type de ligne formes-tu en les représentant? Corrigé: Ligne courbe (légèrement fléchie) ou droite selon la tension. 5. Erreurs fréquentes à éviter. Erreurs. Confondre la ligne de construction légère avec le contour définitif. Tracer tous les traits avec la même pression. Ignorer les courbes naturelles. Activité pratique. Dessine une colline, un arbre et une maison en utilisant des types de lignes différents pour chaque élément. À retenir. Les lignes sont l'outil de base du dessin. Chaque type de ligne a un effet différent: horizontale pour le calme, verticale pour la stabilité, courbe pour la nature, brisée pour la rupture. On distingue la ligne de construction de la ligne définitive."]],"4":[["fr","Leçon 3: Les formes géométriques de base. Situation. Un élève veut dessiner une maison. Il ne sait pas comment commencer. Son enseignant lui montre que la maison se décompose en formes simples: un rectangle pour le mur, un triangle pour le toit, un carré pour la porte. 1. Objectifs. Objectifs. Reconnaître les principales formes géométriques. Utiliser ces formes comme base pour construire un dessin. Assembler plusieurs formes pour représenter un objet. 2. Contenu: les formes de base. Théorie. Le cercle: parfaitement rond, base de nombreux objets (ballon, assiette, roue). Le carré: quatre côtés égaux, quatre angles droits. Le rectangle: quatre angles droits, côtés opposés égaux. Le triangle: trois côtés, base des toits, des montagnes stylisées. L'ovale: forme allongée, utile pour dessiner un visage, un oeuf, un fruit. Vocabulaire: forme, silhouette, assemblage, construction. 3. Exemples et contre-exemples. Exemple. Exemple: dessiner une maison simple: 1) Un rectangle pour le mur. 2) Un triangle posé sur le rectangle pour le toit. 3) Un petit rectangle pour la porte. 4) Un carré pour la fenêtre. 5) Quelques lignes pour les détails (tuiles, encadrement). Contre-exemple: commencer directement par les détails (tuiles, volets) sans avoir posé la structure géométrique. Le dessin devient bancal. 4. Exercices d'application. Exercices. Exercice 1: Transforme cinq formes géométriques en objets reconnaissables (par exemple: un cercle devient un ballon, un ovale devient un visage). Corrigé: Vérifier que chaque forme est bien transformée en un objet identifiable. Exercice 2: Décompose un vélo ou un seau en formes géométriques. Corrigé: Par exemple, le vélo égale cercles (roues) plus triangles (cadre) plus rectangle (selle). 5. Erreurs fréquentes à éviter. Erreurs. Oublier que les formes de construction servent à organiser le dessin avant les détails. Passer trop vite aux détails. Négliger les proportions des formes entre elles. Activité pratique. Dessine une maison, un arbre ou une voiture en commençant par poser les formes géométriques de base. À retenir. Les formes géométriques (cercle, carré, rectangle, triangle, ovale) servent de structure pour construire un dessin. On pose d'abord ces formes, puis on ajoute les détails."]],"5":[["fr","Leçon 4: Le dessin d'observation. Situation. Un élève doit dessiner une mangue posée sur la table. Il commence à dessiner de mémoire, puis compare son dessin au fruit. La forme n'est pas fidèle. Comment mieux observer? 1. Objectifs. Objectifs. Observer un objet avant de le dessiner. Identifier sa forme générale et ses détails distinctifs. Comparer régulièrement son dessin au modèle. 2. Contenu: méthode d'observation. Théorie. Le dessin d'observation suit plusieurs étapes: Observer l'objet sous plusieurs angles, en silence. Repérer sa forme générale (cercle, ovale, rectangle). Mesurer mentalement les proportions (hauteur, largeur, position). Esquisser légèrement au crayon. Comparer régulièrement le dessin et l'objet. Préciser le contour, puis ajouter les détails. Vocabulaire: observation, modèle, contour, proportion, croquis. 3. Exemples et contre-exemples. Exemple. Exemple: pour dessiner une tasse, l'élève repère d'abord son ovale supérieur (l'ouverture), puis la partie basse, puis l'anse sur le côté. Il vérifie les proportions avant d'ajouter les ombres. Contre-exemple: dessiner la tasse de mémoire sans l'observer. Le résultat est approximatif, souvent trop haut ou trop large. 4. Exercices d'application. Exercices. Exercice: Choisis un objet réel (une mangue, une chaussure, une cuillère) et dessine-le sans regarder aucun modèle imprimé. Compare ensuite ton dessin avec l'objet. Corrigé: Critères d'évaluation: forme générale reconnaissable, proportions proches du modèle, soin du trait. 5. Erreurs fréquentes à éviter. Erreurs. Dessiner de mémoire avant d'avoir observé. Ne pas comparer le dessin au modèle. Se décourager à la première erreur. Activité pratique. Place trois objets différents sur la table et dessine-les en les observant attentivement. Prends le temps de vérifier les proportions. À retenir. Le dessin d'observation commence toujours par l'observation attentive de l'objet. On repère la forme générale, on mesure les proportions, on esquisse légèrement, on compare, puis on précise."]],"6":[["fr","Leçon 5: Les proportions et la composition. Situation. Une élève a dessiné un gobelet aussi grand qu'une bouteille et a placé tous les objets au centre de la feuille. Son professeur lui explique que les proportions et la composition doivent être soignées. 1. Objectifs. Objectifs. Comparer les dimensions des objets entre eux. Organiser les éléments dans la feuille. Comprendre l'importance de l'équilibre visuel. 2. Contenu: proportions et composition. Théorie. Les proportions sont les rapports de taille entre les éléments. Par exemple: le gobelet est plus petit que la bouteille; la hauteur du corps d'un personnage est environ 7 fois la hauteur de sa tête. La composition est la manière d'organiser les éléments dans la feuille. Une bonne composition: Laisse des marges autour du sujet. Évite de tout placer au centre. Équilibre les masses (éléments grands et petits). Tient compte du format de la feuille (portrait ou paysage). Vocabulaire: proportion, composition, équilibre, marges, format. 3. Exemples et contre-exemples. Exemple. Exemple: dessiner une bouteille (grande) et un gobelet (petit) côte à côte. Le gobelet doit mesurer environ la moitié de la hauteur de la bouteille. Le dessin est équilibré avec une petite marge autour. Contre-exemple: un dessin où le gobelet est plus grand que la bouteille, ou où tous les objets sont collés au bord de la feuille. 4. Exercices d'application. Exercices. Exercice: Corrige un dessin dans lequel les objets sont trop grands, trop petits ou mal placés. Explique les corrections. Corrigé: Vérifier que les proportions sont respectées et que la composition laisse des marges. 5. Erreurs fréquentes à éviter. Erreurs. Placer systématiquement tous les éléments au centre. Négliger les marges. Ignorer les rapports de taille entre les objets. Remplir toute la feuille sans respiration visuelle. Activité pratique. Compose une nature morte avec trois objets de tailles différentes. Place-les en respectant les proportions et laisse des marges autour. À retenir. Les proportions sont les rapports de taille entre les objets. La composition organise les éléments dans la feuille. Une bonne composition respecte les proportions, laisse des marges et équilibre les masses."]],"7":[["fr","Leçon 6: Ombres, lumière et volume. Situation. Un élève dessine une orange posée près d'une fenêtre. Sans ombre, son dessin semble plat. Comment donner l'impression du volume avec un simple crayon? 1. Objectifs. Objectifs. Comprendre l'effet de la lumière sur les objets. Distinguer l'ombre propre de l'ombre portée. Utiliser des hachures et des dégradés pour créer du volume. 2. Contenu: lumière et ombres. Théorie. Source de lumière: endroit d'où vient la lumière (fenêtre, lampe, soleil). Zone éclairée: partie de l'objet directement frappée par la lumière. Ombre propre: zone sombre sur l'objet, du côté opposé à la lumière. Ombre portée: ombre que l'objet projette sur le sol ou sur un autre objet. Hachures: traits parallèles serrés ou espacés pour créer des valeurs. Dégradés: passage progressif du clair au foncé, ou l'inverse. Vocabulaire: lumière, ombre, valeur, hachures, dégradé. 3. Exemples et contre-exemples. Exemple. Exemple: dessiner une sphère avec une lumière venant de la gauche: 1) Zone éclairée à gauche. 2) Dégradé vers la droite. 3) Ombre propre sur la partie droite. 4) Ombre portée au sol, du côté droit de la sphère. Contre-exemple: ombrer au hasard sans respecter la direction de la lumière. L'objet paraît plat. 4. Exercices d'application. Exercices. Exercice: Dessine une sphère et un cube avec un côté clair, un côté sombre et une ombre portée. Corrigé: Vérifier que la lumière vient d'un seul côté, que l'ombre propre est du côté opposé et que l'ombre portée prolonge l'objet au sol. 5. Erreurs fréquentes à éviter. Erreurs. Ombrer au hasard. Multiplier les sources de lumière dans un même dessin sans raison. Confondre l'ombre propre et l'ombre portée. Utiliser un noir uniforme au lieu de valeurs variées. Activité pratique. Place un objet simple près d'une fenêtre. Dessine-le en respectant la direction de la lumière et en créant un dégradé de valeurs. À retenir. Le volume se crée par le contraste entre zones éclairées et zones sombres. L'ombre propre est sur l'objet; l'ombre portée est projetée au sol. On utilise des hachures ou des dégradés pour nuancer."]],"8":[["fr","Leçon 7: Les couleurs et leurs mélanges. Situation. Au marché, un élève observe les couleurs vives des fruits, des tissus et des légumes. Il se demande comment obtenir ces teintes avec des crayons de couleur limités. 1. Objectifs. Objectifs. Reconnaître les couleurs primaires et secondaires. Expérimenter les mélanges. Utiliser les couleurs pour exprimer une ambiance. 2. Contenu: couleurs et mélanges. Théorie. Dans le système classique des pigments (peinture, crayons de couleur): Couleurs primaires: rouge, jaune, bleu. Couleurs secondaires: obtenues en mélangeant deux primaires: orange (rouge plus jaune), vert (jaune plus bleu), violet (rouge plus bleu). Tons clairs: ajout de blanc. Tons foncés: ajout de noir ou de la couleur complémentaire. Les mélanges peuvent varier selon la qualité du matériel. Un même mélange ne produit pas exactement la même teinte avec tous les crayons. Vocabulaire: couleur, primaire, secondaire, complémentaire, nuance. 3. Exemples et contre-exemples. Exemple. Exemple: réaliser une roue chromatique en coloriant les couleurs primaires aux trois pointes d'un triangle et les secondaires entre elles. Contre-exemple: croire que mélanger les trois primaires donne toujours un beau marron: le résultat dépend de la proportion de chaque couleur. 4. Exercices d'application. Exercices. Exercice: Réalise une petite roue chromatique et note à côté les mélanges testés. Corrigé: Vérifier que les primaires sont bien identifiées et que les secondaires sont correctement obtenues. 5. Erreurs fréquentes à éviter. Erreurs. Penser qu'un mélange donne toujours exactement la même couleur, quel que soit le matériel. Utiliser trop de noir pour foncer, ce qui salit la teinte. Négliger le contraste entre les couleurs. Activité pratique. Dessine une petite composition (fruits, fleurs) en utilisant uniquement des couleurs primaires, puis une seconde version avec des couleurs secondaires. À retenir. Les couleurs primaires (rouge, jaune, bleu) permettent d'obtenir les couleurs secondaires (orange, vert, violet). Les tons clairs s'obtiennent avec du blanc, les tons foncés avec du noir ou une couleur complémentaire. Le résultat varie selon le matériel."]],"9":[["fr","Leçon 8: Le dessin de paysage. Situation. Un élève veut dessiner la vue depuis la fenêtre de sa maison: une colline au loin, des arbres au milieu, un jardin au premier plan. Il ne sait pas comment organiser ces différents plans. 1. Objectifs. Objectifs. Représenter un paysage. Distinguer les plans. Situer la ligne d'horizon. Organiser les éléments naturels et construits. 2. Contenu: plans et horizon. Théorie. Ligne d'horizon: ligne imaginaire où le ciel semble rejoindre la terre. Premier plan: éléments proches, dessinés plus grands et plus détaillés. Plan moyen: éléments à moyenne distance, taille intermédiaire. Arrière-plan: éléments lointains, plus petits, moins détaillés. Un paysage peut être naturel (collines, rivières, forêts) ou construit (routes, maisons, ponts). Souvent les deux se mêlent. Vocabulaire: paysage, horizon, plan, profondeur, perspective. 3. Exemples et contre-exemples. Exemple. Exemple: dessiner un paysage de quartier: 1) Tracer la ligne d'horizon au tiers supérieur de la feuille. 2) Placer une maison moyenne au plan moyen. 3) Ajouter un arbre proche au premier plan, plus grand. 4) Esquisser une colline au loin, plus petite. Contre-exemple: dessiner tous les éléments à la même hauteur et à la même taille. Le paysage paraît plat. 4. Exercices d'application. Exercices. Exercice: Compose un paysage avec au moins trois plans distincts: premier plan, plan moyen, arrière-plan. Corrigé: Vérifier la présence effective des trois plans, la ligne d'horizon visible et la diminution progressive des tailles. 5. Erreurs fréquentes à éviter. Erreurs. Dessiner tous les éléments à la même hauteur et à la même taille. Oublier la ligne d'horizon. Négliger le premier plan. Confondre le ciel et l'arrière-plan. Activité pratique. Depuis la fenêtre ou la cour de l'école, dessine le paysage que tu observes en respectant les trois plans. À retenir. Un paysage se construit autour d'une ligne d'horizon. On distingue le premier plan (grand, détaillé), le plan moyen et l'arrière-plan (petit, moins détaillé). Cette organisation crée l'impression de profondeur."]],"10":[["fr","Leçon 9: Initiation à la perspective. Situation. Un élève dessine une route qui s'éloigne. Ses deux bords semblent se rapprocher au loin. Comment reproduire cet effet de profondeur sur une feuille plate? 1. Objectifs. Objectifs. Comprendre pourquoi les objets éloignés paraissent plus petits. Repérer la ligne d'horizon et le point de fuite. Représenter une profondeur simple. 2. Contenu: la perspective. Théorie. La perspective est une technique qui permet de représenter la profondeur sur une surface plane. Elle repose sur: La ligne d'horizon: ligne horizontale qui marque la hauteur de l'oeil de l'observateur. Le point de fuite: point sur la ligne d'horizon vers lequel convergent les lignes de profondeur. Les lignes convergentes: lignes qui vont vers le point de fuite (par exemple les bords d'une route). Les objets éloignés sont dessinés plus petits et plus proches du point de fuite. Vocabulaire: perspective, horizon, point de fuite, convergence. 3. Exemples et contre-exemples. Exemple. Exemple: pour dessiner une route: 1) Tracer la ligne d'horizon au milieu de la feuille. 2) Placer le point de fuite sur cette ligne. 3) Tracer deux lignes obliques depuis les bords inférieurs de la feuille jusqu'au point de fuite: ce sont les bords de la route. 4) Ajouter des arbres plus petits à mesure qu'ils s'approchent du point de fuite. Contre-exemple: faire converger toutes les lignes, même celles qui ne suivent pas la direction de la profondeur. Le dessin devient incohérent. 4. Exercices d'application. Exercices. Exercice: Représente une route dont les bords semblent se rapprocher au loin. Ajoute quelques arbres à différentes distances. Corrigé: Vérifier la présence d'une ligne d'horizon, d'un point de fuite et de lignes convergeant vers lui. 5. Erreurs fréquentes à éviter. Erreurs. Faire converger toutes les lignes. Placer plusieurs points de fuite sans raison. Dessiner les objets éloignés à la même taille que les objets proches. Activité pratique. Dessine une rangée de maisons le long d'une route qui s'éloigne. Utilise un point de fuite unique. À retenir. La perspective repose sur la ligne d'horizon, le point de fuite et les lignes convergentes. Les objets éloignés paraissent plus petits. Seules les lignes de profondeur convergent vers le point de fuite."]],"11":[["fr","Leçon 10: Motifs, décoration et répétition. Situation. Un élève observe un pagne traditionnel, un panier tressé et un tapis. Tous présentent des motifs répétés. Comment créer une décoration à partir de formes simples? 1. Objectifs. Objectifs. Créer une composition décorative fondée sur la répétition. Utiliser la symétrie et l'alternance. Remplir une surface avec harmonie. 2. Contenu: motif et répétition. Théorie. Motif: petite forme répétée pour décorer. Rythme visuel: répétition régulière ou alternée des motifs. Symétrie: correspondance entre deux parties d'une composition. Alternance: succession de motifs différents (par exemple carré, triangle, carré, triangle). Frise: bande décorative composée de motifs répétés. Les motifs traditionnels africains sont souvent porteurs de sens culturel. On peut s'en inspirer, mais en respectant leur origine et sans les détourner. Vocabulaire: motif, frise, symétrie, alternance, rythme. 3. Exemples et contre-exemples. Exemple. Exemple: créer une frise en alternant deux motifs: un triangle, un cercle, un triangle, un cercle. La frise se répète sur toute la longueur de la feuille. Contre-exemple: copier un motif traditionnel sans comprendre sa répétition ou son organisation. Le résultat est désordonné ou irrespectueux. 4. Exercices d'application. Exercices. Exercice: Crée une frise répétitive en alternant deux ou trois formes. Corrigé: Vérifier la régularité de la répétition, la symétrie et la propreté du tracé. 5. Erreurs fréquentes à éviter. Erreurs. Copier un motif sans comprendre son organisation. Négliger la régularité de la répétition. Déformer un motif traditionnel en le sortant de son contexte. Activité pratique. Crée un motif personnel et répète-le pour former une frise. Utilise deux ou trois formes simples. À retenir. Un motif décoratif repose sur la répétition et l'alternance. La frise est une bande formée de motifs répétés. Les motifs traditionnels portent une signification culturelle qu'il faut respecter."]],"12":[["fr","Leçon 11: Représenter la nature et les objets du quotidien. Situation. Une élève veut dessiner une feuille, un fruit et un bol posés sur la table. Elle veut montrer les textures, mais ne sait pas par où commencer. 1. Objectifs. Objectifs. Combiner observation, formes et proportions. Représenter des textures simples. Organiser plusieurs objets dans une composition. 2. Contenu: textures et organisation. Théorie. Pour représenter différents éléments: Feuille: commencer par la forme générale (ovale, allongée), puis tracer la nervure centrale, puis les nervures latérales. Fruit: observer la forme, la peau, les zones éclairées et sombres. Certains fruits ont une peau lisse (mangue), d'autres rugueuse (orange). Récipient: repérer la forme (cylindre, cône, bol), la symétrie et l'ouverture. La composition réunit plusieurs objets en respectant leurs proportions et un équilibre visuel. Vocabulaire: texture, nervure, surface, nature morte, composition. 3. Exemples et contre-exemples. Exemple. Exemple: dessiner une feuille de manguier: 1) Poser la forme générale en ovale allongé. 2) Tracer la nervure centrale. 3) Ajouter les nervures latérales légères. 4) Préciser le contour avec un trait un peu plus marqué. Contre-exemple: ajouter tous les détails sans respecter la forme générale. Le dessin perd sa cohérence. 4. Exercices d'application. Exercices. Exercice: Produis un dessin d'observation comprenant trois éléments différents: une feuille, un fruit et un récipient. Corrigé: Vérifier la présence des trois éléments, le respect des proportions et la texture visible de chaque objet. 5. Erreurs fréquentes à éviter. Erreurs. Accumuler les détails sans respecter la forme générale. Négliger les textures. Oublier les proportions entre les objets. Activité pratique. Compose une nature morte avec trois objets différents et dessine-la en respectant les formes, les textures et les proportions. À retenir. Représenter la nature demande d'observer la forme générale avant les détails. Les textures se suggèrent par des hachures adaptées. Une composition équilibre plusieurs objets en respectant leurs proportions."]],"13":[["fr","Leçon 12: Projet artistique et présentation. Situation. À la fin de l'année, une classe organise une exposition. Chaque élève présente un dessin personnel réalisé à partir des techniques apprises. Comment préparer une oeuvre complète? 1. Objectifs. Objectifs. Réaliser une oeuvre personnelle en réutilisant les techniques apprises. Présenter son travail. Formuler et recevoir une appréciation respectueuse. 2. Contenu: méthode du projet. Théorie. Un projet artistique suit plusieurs étapes: Choix du sujet: ce que je veux représenter. Esquisse légère: poser les formes générales au crayon. Correction des proportions: comparer avec le sujet ou le modèle. Détails et valeurs: préciser le contour, ajouter les ombres ou les couleurs. Soin final: effacer les traits inutiles, préciser les points importants. Présentation: expliquer le sujet, la technique et les choix graphiques. Vocabulaire: projet, esquisse, présentation, appréciation. 3. Exemples et contre-exemples. Exemple. Exemple: créer une affiche illustrant la protection de l'environnement: 1) Esquisser un arbre au centre. 2) Ajouter une main qui protège. 3) Colorer avec des teintes vertes et bleues. 4) Écrire un message court et lisible. Contre-exemple: juger un dessin uniquement sur son réalisme. La clarté de l'idée et le soin comptent aussi. 4. Exercices d'application. Exercices. Exercice: Réalise une oeuvre complète sur un sujet libre ou imposé, puis explique tes choix graphiques en quelques phrases. Corrigé: Critères: respect de la consigne, observation, organisation, soin, créativité. 5. Erreurs fréquentes à éviter. Erreurs. Juger un dessin uniquement sur son réalisme. Négliger le soin. Ne pas expliquer ses choix. Se décourager face à la critique. Activité pratique. Prépare une oeuvre pour l'exposition de la classe. Présente-la oralement en expliquant le sujet, la technique et ce que tu as voulu exprimer. À retenir. Un projet artistique combine observation, esquisse, correction et finition. La présentation orale fait partie du travail. Toute appréciation doit être respectueuse et fondée sur des éléments précis."]],"14":[["fr","Évaluation finale, Dessin 7e année. Évaluation. Cette évaluation comprend 35 questions à choix multiples couvrant les douze leçons: outils, lignes et formes géométriques (6), observation et proportions (5), ombres, lumière et volume (5), couleurs et mélanges (5), paysage et perspective (5), motifs décoratifs et traditions artistiques (4), projet artistique et appréciation (5). Pour chaque question, une seule réponse est correcte. Lis attentivement chaque énoncé avant de choisir."]]}};

      for (var k = 0; k < vs.length; k++) {
