    title: "Dessin 7e année — Sommaire général",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce fichier couvre le programme de dessin de la 7e année de l'éducation de base. Il comprend 12 leçons progressives organisées autour de l'observation, des lignes, des formes, des proportions, de la lumière, des couleurs, du paysage, de la perspective, des motifs décoratifs et de la création personnelle.</p>
<ul>
<li>Leçon 1 — Découvrir le dessin et les outils</li>
<li>Leçon 2 — Les différents types de lignes</li>
<li>Leçon 3 — Les formes géométriques de base</li>
<li>Leçon 4 — Le dessin d'observation</li>
<li>Leçon 5 — Les proportions et la composition</li>
<li>Leçon 6 — Ombres, lumière et volume</li>
<li>Leçon 7 — Les couleurs et leurs mélanges</li>
<li>Leçon 8 — Le dessin de paysage</li>
<li>Leçon 9 — Initiation à la perspective</li>
<li>Leçon 10 — Motifs, décoration et répétition</li>
<li>Leçon 11 — Représenter la nature et les objets du quotidien</li>
<li>Leçon 12 — Projet artistique et présentation</li>
</ul>
<p>Une évaluation finale de 35 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programmes nationaux du ministère de l'Éducation nationale et Nouvelle Citoyenneté (RDC). Nouveau programme national de l'enseignement primaire (document IFADEM, référence complémentaire). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 1 : Découvrir le dessin et les outils",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une classe de Kinshasa, un élève reçoit une feuille blanche et un crayon. Il ne sait pas par où commencer. Avant de dessiner, il faut connaître le matériel et la bonne manière de s'en servir.</p></div>
<img alt="Crayons de dessin de différentes duretés" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Pencils.jpg?width=700" data-image-id="Dessin7_1">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Crayons de dessin — Wikimedia Commons : Pencils.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Reconnaître les outils de dessin et leur usage. Tenir correctement le crayon. Préparer sa feuille et adopter une bonne posture. Distinguer le dessin d'observation et le dessin d'imagination.</p>
</div>

<h3>2. Contenu : outils et usages</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les outils principaux du dessinateur :</p>
<ul>
<li><strong>Crayon graphite</strong> : outil de base pour tracer et ombrer.</li>
<li><strong>Gomme</strong> : pour corriger les traits inutiles, pas pour effacer en permanence.</li>
<li><strong>Règle</strong> : pour tracer des droites et mesurer les proportions.</li>
<li><strong>Crayons de couleur</strong> : pour colorer, mélanger, nuancer.</li>
<li><strong>Papier</strong> : support de travail, posé bien à plat.</li>
</ul>
<p>La posture compte : le dos droit, la feuille bien orientée, la main détendue. Le crayon se tient à environ 3 à 4 cm de la mine pour permettre un tracé souple.</p>
<p>Vocabulaire : outil, croquis, esquisse, contour, posture.</p>
</div>
<img alt="Main tenant un crayon, position correcte" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Hand%20holding%20a%20pencil.jpg?width=700" data-image-id="Dessin7_2">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Main tenant un crayon — Wikimedia Commons : Hand holding a pencil.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> un élève esquisse d'abord légèrement un gobelet avec un trait fin, puis appuie pour préciser le contour. Il peut ainsi corriger sans gommer.</p>
<p><strong>Contre-exemple :</strong> un élève appuie fortement dès le début, se trompe, gomme, déchire la feuille et abandonne.</p>
</div>
<img alt="Croquis d'objets simples au crayon" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Still%20life%20sketch.jpg?width=700" data-image-id="Dessin7_3">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Croquis d'objets simples — Wikimedia Commons : Still life sketch.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice 1 :</strong> Trace une série de lignes horizontales, verticales et obliques sur une feuille, sans règle, en essayant de garder la même épaisseur.</p>
<p><strong>Corrigé :</strong> Vérifier la régularité des traits et la pression modérée du crayon.</p>
<p><strong>Exercice 2 :</strong> Dessine au crayon trois objets familiers posés devant toi (par exemple un gobelet, une gomme, un cahier) en gardant un trait léger.</p>
<p><strong>Corrigé :</strong> Les objets doivent être reconnaissables, le trait léger, les proportions respectées autant que possible.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Appuyer excessivement sur le crayon dès le début. Laisser la feuille de travers. Tenir le crayon trop serré. Effacer sans arrêt au lieu d'esquisser léger.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Prépare ton matériel et dessine trois objets de ton choix posés sur la table. Garde un trait léger et net.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le dessinateur dispose d'outils simples : crayon, gomme, règle, papier. La posture et la tenue du crayon comptent. On commence toujours par un trait léger avant d'appuyer.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de dessin (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 2 : Les différents types de lignes",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Devant une colline de Kinshasa, un élève remarque que son contour est une ligne courbe. Les fils électriques tendus sont des lignes droites. Les branches d'un arbre se divisent en lignes brisées. Comment utiliser ces différents tracés dans un dessin ?</p></div>
<img alt="Planche des différents types de lignes" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Types%20of%20lines.svg?width=700" data-image-id="Dessin7_4">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Planche des types de lignes — Wikimedia Commons : Types of lines.svg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Identifier et nommer les principaux types de lignes. Utiliser les lignes pour représenter des formes et des contours. Comprendre la différence entre ligne de construction et ligne définitive.</p>
</div>

<h3>2. Contenu : les types de lignes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<ul>
<li><strong>Ligne horizontale</strong> : parallèle au sol, calme.</li>
<li><strong>Ligne verticale</strong> : debout, donne une impression de stabilité.</li>
<li><strong>Ligne oblique</strong> : inclinée, suggère le mouvement.</li>
<li><strong>Ligne courbe</strong> : souple, arrondie, évoque la nature.</li>
<li><strong>Ligne brisée</strong> : formée de segments, suggère la rupture.</li>
<li><strong>Ligne continue</strong> : d'un seul trait, sans lever le crayon.</li>
<li><strong>Ligne pointillée</strong> : succession de points, souvent utilisée pour suggérer un contour discret.</li>
</ul>
<p>Vocabulaire : ligne, contour, tracé, construction.</p>
</div>
<img alt="Composition linéaire simple à traits" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Drawing%20with%20lines.jpg?width=700" data-image-id="Dessin7_5">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Composition linéaire — Wikimedia Commons : Drawing with lines.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> pour dessiner un arbre, on utilise d'abord une ligne verticale légère (le tronc), puis des lignes courbes pour les branches, et enfin une ligne brisée pour suggérer l'écorce.</p>
<p><strong>Contre-exemple :</strong> l'élève confond la ligne de construction (trait léger pour se repérer) et la ligne définitive (trait plus marqué). Le dessin devient confus.</p>
</div>
<img alt="Dessin au trait d'un arbre" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Tree%20sketch.jpg?width=700" data-image-id="Dessin7_6">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Dessin au trait d'un arbre — Wikimedia Commons : Tree sketch.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice 1 :</strong> Compose un dessin en utilisant au moins cinq types de lignes.</p>
<p><strong>Corrigé :</strong> Vérifier la présence effective de cinq types différents (horizontale, verticale, oblique, courbe, pointillée, etc.).</p>
<p><strong>Exercice 2 :</strong> Observe les fils électriques d'une rue. Quel type de ligne formes-tu en les représentant ?</p>
<p><strong>Corrigé :</strong> Ligne courbe (légèrement fléchie) ou droite selon la tension.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Confondre la ligne de construction légère avec le contour définitif. Tracer tous les traits avec la même pression. Ignorer les courbes naturelles.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Dessine une colline, un arbre et une maison en utilisant des types de lignes différents pour chaque élément.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les lignes sont l'outil de base du dessin. Chaque type de ligne a un effet différent : horizontale pour le calme, verticale pour la stabilité, courbe pour la nature, brisée pour la rupture. On distingue la ligne de construction de la ligne définitive.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de dessin (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 3 : Les formes géométriques de base",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève veut dessiner une maison. Il ne sait pas comment commencer. Son enseignant lui montre que la maison se décompose en formes simples : un rectangle pour le mur, un triangle pour le toit, un carré pour la porte.</p></div>
<img alt="Formes géométriques de base (cercle, carré, triangle)" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Shapes%20for%20kids.svg?width=700" data-image-id="Dessin7_7">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Formes géométriques de base — Wikimedia Commons : Shapes for kids.svg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Reconnaître les principales formes géométriques. Utiliser ces formes comme base pour construire un dessin. Assembler plusieurs formes pour représenter un objet.</p>
</div>

<h3>2. Contenu : les formes de base</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<ul>
<li><strong>Le cercle</strong> : parfaitement rond, base de nombreux objets (ballon, assiette, roue).</li>
<li><strong>Le carré</strong> : quatre côtés égaux, quatre angles droits.</li>
<li><strong>Le rectangle</strong> : quatre angles droits, côtés opposés égaux.</li>
<li><strong>Le triangle</strong> : trois côtés, base des toits, des montagnes stylisées.</li>
<li><strong>L'ovale</strong> : forme allongée, utile pour dessiner un visage, un oeuf, un fruit.</li>
</ul>
<p>Vocabulaire : forme, silhouette, assemblage, construction.</p>
</div>
<img alt="Objets construits à partir de formes géométriques" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Objects%20from%20shapes.jpg?width=700" data-image-id="Dessin7_8">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Objets construits à partir de formes — Wikimedia Commons : Objects from shapes.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> dessiner une maison simple :</p>
<p>1) Un rectangle pour le mur.</p>
<p>2) Un triangle posé sur le rectangle pour le toit.</p>
<p>3) Un petit rectangle pour la porte.</p>
<p>4) Un carré pour la fenêtre.</p>
<p>5) Quelques lignes pour les détails (tuiles, encadrement).</p>
<p><strong>Contre-exemple :</strong> commencer directement par les détails (tuiles, volets) sans avoir posé la structure géométrique. Le dessin devient bancal.</p>
</div>
<img alt="Maison dessinée à partir de formes géométriques" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/House%20drawing%20from%20shapes.jpg?width=700" data-image-id="Dessin7_9">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Maison dessinée à partir de formes — Wikimedia Commons : House drawing from shapes.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice 1 :</strong> Transforme cinq formes géométriques en objets reconnaissables (par exemple : un cercle devient un ballon, un ovale devient un visage).</p>
<p><strong>Corrigé :</strong> Vérifier que chaque forme est bien transformée en un objet identifiable.</p>
<p><strong>Exercice 2 :</strong> Décompose un vélo ou un seau en formes géométriques.</p>
<p><strong>Corrigé :</strong> Par exemple, le vélo = cercles (roues) + triangles (cadre) + rectangle (selle).</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Oublier que les formes de construction servent à organiser le dessin avant les détails. Passer trop vite aux détails. Négliger les proportions des formes entre elles.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Dessine une maison, un arbre ou une voiture en commençant par poser les formes géométriques de base.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les formes géométriques (cercle, carré, rectangle, triangle, ovale) servent de structure pour construire un dessin. On pose d'abord ces formes, puis on ajoute les détails.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de dessin (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 4 : Le dessin d'observation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève doit dessiner une mangue posée sur la table. Il commence à dessiner de mémoire, puis compare son dessin au fruit. La forme n'est pas fidèle. Comment mieux observer ?</p></div>
<img alt="Nature morte simple avec fruits et récipient" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Still%20life%20with%20fruit.jpg?width=700" data-image-id="Dessin7_10">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Nature morte avec fruits — Wikimedia Commons : Still life with fruit.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Observer un objet avant de le dessiner. Identifier sa forme générale et ses détails distinctifs. Comparer régulièrement son dessin au modèle.</p>
</div>

<h3>2. Contenu : méthode d'observation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le dessin d'observation suit plusieurs étapes :</p>
<ul>
<li><strong>Observer</strong> l'objet sous plusieurs angles, en silence.</li>
<li><strong>Repérer</strong> sa forme générale (cercle, ovale, rectangle).</li>
<li><strong>Mesurer</strong> mentalement les proportions (hauteur, largeur, position).</li>
<li><strong>Esquisser</strong> légèrement au crayon.</li>
<li><strong>Comparer</strong> régulièrement le dessin et l'objet.</li>
<li><strong>Préciser</strong> le contour, puis ajouter les détails.</li>
</ul>
<p>Vocabulaire : observation, modèle, contour, proportion, croquis.</p>
</div>
<img alt="Étapes d'un dessin d'observation au crayon" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Pencil%20sketch%20of%20objects.jpg?width=700" data-image-id="Dessin7_11">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Étapes d'un dessin d'observation — Wikimedia Commons : Pencil sketch of objects.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> pour dessiner une tasse, l'élève repère d'abord son ovale supérieur (l'ouverture), puis la partie basse, puis l'anse sur le côté. Il vérifie les proportions avant d'ajouter les ombres.</p>
<p><strong>Contre-exemple :</strong> dessiner la tasse de mémoire sans l'observer. Le résultat est approximatif, souvent trop haut ou trop large.</p>
</div>
<img alt="Dessin au crayon d'une tasse" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Drawing%20of%20a%20cup.jpg?width=700" data-image-id="Dessin7_12">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Dessin au crayon d'une tasse — Wikimedia Commons : Drawing of a cup.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Choisis un objet réel (une mangue, une chaussure, une cuillère) et dessine-le sans regarder aucun modèle imprimé. Compare ensuite ton dessin avec l'objet.</p>
<p><strong>Corrigé :</strong> Critères d'évaluation : forme générale reconnaissable, proportions proches du modèle, soin du trait.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Dessiner de mémoire avant d'avoir observé. Ne pas comparer le dessin au modèle. Se décourager à la première erreur.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Place trois objets différents sur la table et dessine-les en les observant attentivement. Prends le temps de vérifier les proportions.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le dessin d'observation commence toujours par l'observation attentive de l'objet. On repère la forme générale, on mesure les proportions, on esquisse légèrement, on compare, puis on précise.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de dessin (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 5 : Les proportions et la composition",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une élève a dessiné un gobelet aussi grand qu'une bouteille et a placé tous les objets au centre de la feuille. Son professeur lui explique que les proportions et la composition doivent être soignées.</p></div>
<img alt="Schéma des proportions d'un objet" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Proportions%20of%20the%20head.jpg?width=700" data-image-id="Dessin7_13">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Schéma de proportions — Wikimedia Commons : Proportions of the head.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comparer les dimensions des objets entre eux. Organiser les éléments dans la feuille. Comprendre l'importance de l'équilibre visuel.</p>
</div>

<h3>2. Contenu : proportions et composition</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les <strong>proportions</strong> sont les rapports de taille entre les éléments. Par exemple : le gobelet est plus petit que la bouteille ; la hauteur du corps d'un personnage est environ 7 fois la hauteur de sa tête.</p>
<p>La <strong>composition</strong> est la manière d'organiser les éléments dans la feuille. Une bonne composition :</p>
<ul>
<li>Laisse des marges autour du sujet.</li>
<li>Évite de tout placer au centre.</li>
<li>Équilibre les masses (éléments grands et petits).</li>
<li>Tient compte du format de la feuille (portrait ou paysage).</li>
</ul>
<p>Vocabulaire : proportion, composition, équilibre, marges, format.</p>
</div>
<img alt="Composition équilibrée de plusieurs objets" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Still%20life%20composition.jpg?width=700" data-image-id="Dessin7_14">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Composition équilibrée — Wikimedia Commons : Still life composition.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> dessiner une bouteille (grande) et un gobelet (petit) côte à côte. Le gobelet doit mesurer environ la moitié de la hauteur de la bouteille. Le dessin est équilibré avec une petite marge autour.</p>
<p><strong>Contre-exemple :</strong> un dessin où le gobelet est plus grand que la bouteille, ou où tous les objets sont collés au bord de la feuille.</p>
</div>
<img alt="Dessin avant et après correction des proportions" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Drawing%20correction%20example.jpg?width=700" data-image-id="Dessin7_15">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Dessin avant et après correction — Wikimedia Commons : Drawing correction example.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Corrige un dessin dans lequel les objets sont trop grands, trop petits ou mal placés. Explique les corrections.</p>
<p><strong>Corrigé :</strong> Vérifier que les proportions sont respectées et que la composition laisse des marges.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Placer systématiquement tous les éléments au centre. Négliger les marges. Ignorer les rapports de taille entre les objets. Remplir toute la feuille sans respiration visuelle.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Compose une nature morte avec trois objets de tailles différentes. Place-les en respectant les proportions et laisse des marges autour.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les proportions sont les rapports de taille entre les objets. La composition organise les éléments dans la feuille. Une bonne composition respecte les proportions, laisse des marges et équilibre les masses.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de dessin (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 6 : Ombres, lumière et volume",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève dessine une orange posée près d'une fenêtre. Sans ombre, son dessin semble plat. Comment donner l'impression du volume avec un simple crayon ?</p></div>
<img alt="Sphère ombrée au crayon" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Shaded%20sphere.jpg?width=700" data-image-id="Dessin7_16">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Sphère ombrée au crayon — Wikimedia Commons : Shaded sphere.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre l'effet de la lumière sur les objets. Distinguer l'ombre propre de l'ombre portée. Utiliser des hachures et des dégradés pour créer du volume.</p>
</div>

<h3>2. Contenu : lumière et ombres</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<ul>
<li><strong>Source de lumière</strong> : endroit d'où vient la lumière (fenêtre, lampe, soleil).</li>
<li><strong>Zone éclairée</strong> : partie de l'objet directement frappée par la lumière.</li>
<li><strong>Ombre propre</strong> : zone sombre sur l'objet, du côté opposé à la lumière.</li>
<li><strong>Ombre portée</strong> : ombre que l'objet projette sur le sol ou sur un autre objet.</li>
<li><strong>Hachures</strong> : traits parallèles serrés ou espacés pour créer des valeurs.</li>
<li><strong>Dégradés</strong> : passage progressif du clair au foncé, ou l'inverse.</li>
</ul>
<p>Vocabulaire : lumière, ombre, valeur, hachures, dégradé.</p>
</div>
<img alt="Cube avec ombre propre et ombre portée" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Cube%20with%20shadow.jpg?width=700" data-image-id="Dessin7_17">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Cube avec ombre propre et ombre portée — Wikimedia Commons : Cube with shadow.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> dessiner une sphère avec une lumière venant de la gauche :</p>
<p>1) Zone éclairée à gauche.</p>
<p>2) Dégradé vers la droite.</p>
<p>3) Ombre propre sur la partie droite.</p>
<p>4) Ombre portée au sol, du côté droit de la sphère.</p>
<p><strong>Contre-exemple :</strong> ombrer au hasard sans respecter la direction de la lumière. L'objet paraît plat.</p>
</div>
<img alt="Hachures au crayon sur une surface" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Pencil%20hatching.jpg?width=700" data-image-id="Dessin7_18">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Hachures au crayon — Wikimedia Commons : Pencil hatching.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Dessine une sphère et un cube avec un côté clair, un côté sombre et une ombre portée.</p>
<p><strong>Corrigé :</strong> Vérifier que la lumière vient d'un seul côté, que l'ombre propre est du côté opposé et que l'ombre portée prolonge l'objet au sol.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Ombrer au hasard. Multiplier les sources de lumière dans un même dessin sans raison. Confondre l'ombre propre et l'ombre portée. Utiliser un noir uniforme au lieu de valeurs variées.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Place un objet simple près d'une fenêtre. Dessine-le en respectant la direction de la lumière et en créant un dégradé de valeurs.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le volume se crée par le contraste entre zones éclairées et zones sombres. L'ombre propre est sur l'objet ; l'ombre portée est projetée au sol. On utilise des hachures ou des dégradés pour nuancer.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de dessin (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 7 : Les couleurs et leurs mélanges",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Au marché, un élève observe les couleurs vives des fruits, des tissus et des légumes. Il se demande comment obtenir ces teintes avec des crayons de couleur limités.</p></div>
<img alt="Cercle chromatique avec couleurs primaires et secondaires" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Color%20wheel%20RGB.svg?width=700" data-image-id="Dessin7_19">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Cercle chromatique — Wikimedia Commons : Color wheel RGB.svg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Reconnaître les couleurs primaires et secondaires. Expérimenter les mélanges. Utiliser les couleurs pour exprimer une ambiance.</p>
</div>

<h3>2. Contenu : couleurs et mélanges</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Dans le système classique des pigments (peinture, crayons de couleur) :</p>
<ul>
<li><strong>Couleurs primaires</strong> : rouge, jaune, bleu.</li>
<li><strong>Couleurs secondaires</strong> : obtenues en mélangeant deux primaires : orange (rouge + jaune), vert (jaune + bleu), violet (rouge + bleu).</li>
<li><strong>Tons clairs</strong> : ajout de blanc.</li>
<li><strong>Tons foncés</strong> : ajout de noir ou de la couleur complémentaire.</li>
</ul>
<p>Les mélanges peuvent varier selon la qualité du matériel. Un même mélange ne produit pas exactement la même teinte avec tous les crayons.</p>
<p>Vocabulaire : couleur, primaire, secondaire, complémentaire, nuance.</p>
</div>
<img alt="Nuancier ou roue chromatique imprimée" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Color%20mixing%20chart.jpg?width=700" data-image-id="Dessin7_20">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Nuancier — Wikimedia Commons : Color mixing chart.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> réaliser une roue chromatique en coloriant les couleurs primaires aux trois pointes d'un triangle et les secondaires entre elles.</p>
<p><strong>Contre-exemple :</strong> croire que mélanger les trois primaires donne toujours un beau marron : le résultat dépend de la proportion de chaque couleur.</p>
</div>
<img alt="Exercice de mélange de couleurs" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Color%20mixing%20exercise.jpg?width=700" data-image-id="Dessin7_21">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Exercice de mélange de couleurs — Wikimedia Commons : Color mixing exercise.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Réalise une petite roue chromatique et note à côté les mélanges testés.</p>
<p><strong>Corrigé :</strong> Vérifier que les primaires sont bien identifiées et que les secondaires sont correctement obtenues.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Penser qu'un mélange donne toujours exactement la même couleur, quel que soit le matériel. Utiliser trop de noir pour foncer, ce qui salit la teinte. Négliger le contraste entre les couleurs.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Dessine une petite composition (fruits, fleurs) en utilisant uniquement des couleurs primaires, puis une seconde version avec des couleurs secondaires.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les couleurs primaires (rouge, jaune, bleu) permettent d'obtenir les couleurs secondaires (orange, vert, violet). Les tons clairs s'obtiennent avec du blanc, les tons foncés avec du noir ou une couleur complémentaire. Le résultat varie selon le matériel.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de dessin (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 8 : Le dessin de paysage",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève veut dessiner la vue depuis la fenêtre de sa maison : une colline au loin, des arbres au milieu, un jardin au premier plan. Il ne sait pas comment organiser ces différents plans.</p></div>
<img alt="Paysage avec trois plans distincts" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Landscape%20with%20three%20planes.jpg?width=700" data-image-id="Dessin7_22">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Paysage avec trois plans — Wikimedia Commons : Landscape with three planes.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Représenter un paysage. Distinguer les plans. Situer la ligne d'horizon. Organiser les éléments naturels et construits.</p>
</div>

<h3>2. Contenu : plans et horizon</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<ul>
<li><strong>Ligne d'horizon</strong> : ligne imaginaire où le ciel semble rejoindre la terre.</li>
<li><strong>Premier plan</strong> : éléments proches, dessinés plus grands et plus détaillés.</li>
<li><strong>Plan moyen</strong> : éléments à moyenne distance, taille intermédiaire.</li>
<li><strong>Arrière-plan</strong> : éléments lointains, plus petits, moins détaillés.</li>
</ul>
<p>Un paysage peut être naturel (collines, rivières, forêts) ou construit (routes, maisons, ponts). Souvent les deux se mêlent.</p>
<p>Vocabulaire : paysage, horizon, plan, profondeur, perspective.</p>
</div>
<img alt="Paysage africain, colline, rivière, végétation" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/African%20landscape.jpg?width=700" data-image-id="Dessin7_23">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Paysage africain — Wikimedia Commons : African landscape.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> dessiner un paysage de quartier :</p>
<p>1) Tracer la ligne d'horizon au tiers supérieur de la feuille.</p>
<p>2) Placer une maison moyenne au plan moyen.</p>
<p>3) Ajouter un arbre proche au premier plan, plus grand.</p>
<p>4) Esquisser une colline au loin, plus petite.</p>
<p><strong>Contre-exemple :</strong> dessiner tous les éléments à la même hauteur et à la même taille. Le paysage paraît plat.</p>
</div>
<img alt="Croquis de rivière ou de colline" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Sketch%20of%20a%20landscape.jpg?width=700" data-image-id="Dessin7_24">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Croquis de paysage — Wikimedia Commons : Sketch of a landscape.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Compose un paysage avec au moins trois plans distincts : premier plan, plan moyen, arrière-plan.</p>
<p><strong>Corrigé :</strong> Vérifier la présence effective des trois plans, la ligne d'horizon visible et la diminution progressive des tailles.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Dessiner tous les éléments à la même hauteur et à la même taille. Oublier la ligne d'horizon. Négliger le premier plan. Confondre le ciel et l'arrière-plan.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Depuis la fenêtre ou la cour de l'école, dessine le paysage que tu observes en respectant les trois plans.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un paysage se construit autour d'une ligne d'horizon. On distingue le premier plan (grand, détaillé), le plan moyen et l'arrière-plan (petit, moins détaillé). Cette organisation crée l'impression de profondeur.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de dessin (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 9 : Initiation à la perspective",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève dessine une route qui s'éloigne. Ses deux bords semblent se rapprocher au loin. Comment reproduire cet effet de profondeur sur une feuille plate ?</p></div>
<img alt="Perspective à un point de fuite" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/1%20point%20perspective.jpg?width=700" data-image-id="Dessin7_25">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Perspective à un point de fuite — Wikimedia Commons : 1 point perspective.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre pourquoi les objets éloignés paraissent plus petits. Repérer la ligne d'horizon et le point de fuite. Représenter une profondeur simple.</p>
</div>

<h3>2. Contenu : la perspective</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La perspective est une technique qui permet de représenter la profondeur sur une surface plane. Elle repose sur :</p>
<ul>
<li><strong>La ligne d'horizon</strong> : ligne horizontale qui marque la hauteur de l'oeil de l'observateur.</li>
<li><strong>Le point de fuite</strong> : point sur la ligne d'horizon vers lequel convergent les lignes de profondeur.</li>
<li><strong>Les lignes convergentes</strong> : lignes qui vont vers le point de fuite (par exemple les bords d'une route).</li>
</ul>
<p>Les objets éloignés sont dessinés plus petits et plus proches du point de fuite.</p>
<p>Vocabulaire : perspective, horizon, point de fuite, convergence.</p>
</div>
<img alt="Route en perspective avec point de fuite" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Road%20in%20perspective.jpg?width=700" data-image-id="Dessin7_26">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Route en perspective — Wikimedia Commons : Road in perspective.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> pour dessiner une route :</p>
<p>1) Tracer la ligne d'horizon au milieu de la feuille.</p>
<p>2) Placer le point de fuite sur cette ligne.</p>
<p>3) Tracer deux lignes obliques depuis les bords inférieurs de la feuille jusqu'au point de fuite : ce sont les bords de la route.</p>
<p>4) Ajouter des arbres plus petits à mesure qu'ils s'approchent du point de fuite.</p>
<p><strong>Contre-exemple :</strong> faire converger toutes les lignes, même celles qui ne suivent pas la direction de la profondeur. Le dessin devient incohérent.</p>
</div>
<img alt="Couloir dessiné en perspective" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Corridor%20perspective.jpg?width=700" data-image-id="Dessin7_27">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Couloir en perspective — Wikimedia Commons : Corridor perspective.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Représente une route dont les bords semblent se rapprocher au loin. Ajoute quelques arbres à différentes distances.</p>
<p><strong>Corrigé :</strong> Vérifier la présence d'une ligne d'horizon, d'un point de fuite et de lignes convergeant vers lui.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Faire converger toutes les lignes. Placer plusieurs points de fuite sans raison. Dessiner les objets éloignés à la même taille que les objets proches.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Dessine une rangée de maisons le long d'une route qui s'éloigne. Utilise un point de fuite unique.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La perspective repose sur la ligne d'horizon, le point de fuite et les lignes convergentes. Les objets éloignés paraissent plus petits. Seules les lignes de profondeur convergent vers le point de fuite.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de dessin (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 10 : Motifs, décoration et répétition",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève observe un pagne traditionnel, un panier tressé et un tapis. Tous présentent des motifs répétés. Comment créer une décoration à partir de formes simples ?</p></div>
<img alt="Tissage Kuba avec motifs traditionnels" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Kuba%20textile.jpg?width=700" data-image-id="Dessin7_28">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Tissage Kuba traditionnel — Wikimedia Commons : Kuba textile.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Créer une composition décorative fondée sur la répétition. Utiliser la symétrie et l'alternance. Remplir une surface avec harmonie.</p>
</div>

<h3>2. Contenu : motif et répétition</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<ul>
<li><strong>Motif</strong> : petite forme répétée pour décorer.</li>
<li><strong>Rythme visuel</strong> : répétition régulière ou alternée des motifs.</li>
<li><strong>Symétrie</strong> : correspondance entre deux parties d'une composition.</li>
<li><strong>Alternance</strong> : succession de motifs différents (par exemple carré, triangle, carré, triangle).</li>
<li><strong>Frise</strong> : bande décorative composée de motifs répétés.</li>
</ul>
<p>Les motifs traditionnels africains sont souvent porteurs de sens culturel. On peut s'en inspirer, mais en respectant leur origine et sans les détourner.</p>
<p>Vocabulaire : motif, frise, symétrie, alternance, rythme.</p>
</div>
<img alt="Frise décorative géométrique" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Geometric%20pattern.jpg?width=700" data-image-id="Dessin7_29">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Frise géométrique — Wikimedia Commons : Geometric pattern.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> créer une frise en alternant deux motifs : un triangle, un cercle, un triangle, un cercle. La frise se répète sur toute la longueur de la feuille.</p>
<p><strong>Contre-exemple :</strong> copier un motif traditionnel sans comprendre sa répétition ou son organisation. Le résultat est désordonné ou irrespectueux.</p>
</div>
<img alt="Motifs géométriques traditionnels africains" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Traditional%20African%20patterns.jpg?width=700" data-image-id="Dessin7_30">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Motifs traditionnels africains — Wikimedia Commons : Traditional African patterns.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Crée une frise répétitive en alternant deux ou trois formes.</p>
<p><strong>Corrigé :</strong> Vérifier la régularité de la répétition, la symétrie et la propreté du tracé.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Copier un motif sans comprendre son organisation. Négliger la régularité de la répétition. Déformer un motif traditionnel en le sortant de son contexte.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Crée un motif personnel et répète-le pour former une frise. Utilise deux ou trois formes simples.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un motif décoratif repose sur la répétition et l'alternance. La frise est une bande formée de motifs répétés. Les motifs traditionnels portent une signification culturelle qu'il faut respecter.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de dessin (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 11 : Représenter la nature et les objets du quotidien",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une élève veut dessiner une feuille, un fruit et un bol posés sur la table. Elle veut montrer les textures, mais ne sait pas par où commencer.</p></div>
<img alt="Feuille dessinée au crayon avec nervures" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Leaf%20drawing.jpg?width=700" data-image-id="Dessin7_31">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Feuille dessinée au crayon — Wikimedia Commons : Leaf drawing.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Combiner observation, formes et proportions. Représenter des textures simples. Organiser plusieurs objets dans une composition.</p>
</div>

<h3>2. Contenu : textures et organisation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Pour représenter différents éléments :</p>
<ul>
<li><strong>Feuille</strong> : commencer par la forme générale (ovale, allongée), puis tracer la nervure centrale, puis les nervures latérales.</li>
<li><strong>Fruit</strong> : observer la forme, la peau, les zones éclairées et sombres. Certains fruits ont une peau lisse (mangue), d'autres rugueuse (orange).</li>
<li><strong>Récipient</strong> : repérer la forme (cylindre, cône, bol), la symétrie et l'ouverture.</li>
</ul>
<p>La composition réunit plusieurs objets en respectant leurs proportions et un équilibre visuel.</p>
<p>Vocabulaire : texture, nervure, surface, nature morte, composition.</p>
</div>
<img alt="Nature morte avec fruits et récipient" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Still%20life%20with%20fruit%20and%20pot.jpg?width=700" data-image-id="Dessin7_32">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Nature morte avec fruits et récipient — Wikimedia Commons : Still life with fruit and pot.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> dessiner une feuille de manguier :</p>
<p>1) Poser la forme générale en ovale allongé.</p>
<p>2) Tracer la nervure centrale.</p>
<p>3) Ajouter les nervures latérales légères.</p>
<p>4) Préciser le contour avec un trait un peu plus marqué.</p>
<p><strong>Contre-exemple :</strong> ajouter tous les détails sans respecter la forme générale. Le dessin perd sa cohérence.</p>
</div>
<img alt="Composition de trois objets simples dessinés" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Composition%20of%20three%20objects.jpg?width=700" data-image-id="Dessin7_33">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Composition de trois objets — Wikimedia Commons : Composition of three objects.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Produis un dessin d'observation comprenant trois éléments différents : une feuille, un fruit et un récipient.</p>
<p><strong>Corrigé :</strong> Vérifier la présence des trois éléments, le respect des proportions et la texture visible de chaque objet.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Accumuler les détails sans respecter la forme générale. Négliger les textures. Oublier les proportions entre les objets.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Compose une nature morte avec trois objets différents et dessine-la en respectant les formes, les textures et les proportions.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Représenter la nature demande d'observer la forme générale avant les détails. Les textures se suggèrent par des hachures adaptées. Une composition équilibre plusieurs objets en respectant leurs proportions.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de dessin (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 12 : Projet artistique et présentation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À la fin de l'année, une classe organise une exposition. Chaque élève présente un dessin personnel réalisé à partir des techniques apprises. Comment préparer une oeuvre complète ?</p></div>
<img alt="Affiche dessinée par un élève" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Student%20artwork.jpg?width=700" data-image-id="Dessin7_34">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Affiche dessinée par un élève — Wikimedia Commons : Student artwork.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Réaliser une oeuvre personnelle en réutilisant les techniques apprises. Présenter son travail. Formuler et recevoir une appréciation respectueuse.</p>
</div>

<h3>2. Contenu : méthode du projet</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un projet artistique suit plusieurs étapes :</p>
<ul>
<li><strong>Choix du sujet</strong> : ce que je veux représenter.</li>
<li><strong>Esquisse légère</strong> : poser les formes générales au crayon.</li>
<li><strong>Correction des proportions</strong> : comparer avec le sujet ou le modèle.</li>
<li><strong>Détails et valeurs</strong> : préciser le contour, ajouter les ombres ou les couleurs.</li>
<li><strong>Soin final</strong> : effacer les traits inutiles, préciser les points importants.</li>
<li><strong>Présentation</strong> : expliquer le sujet, la technique et les choix graphiques.</li>
</ul>
<p>Vocabulaire : projet, esquisse, présentation, appréciation.</p>
</div>
<img alt="Étapes d'un projet artistique" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Art%20project%20steps.jpg?width=700" data-image-id="Dessin7_35">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Étapes d'un projet artistique — Wikimedia Commons : Art project steps.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> créer une affiche illustrant la protection de l'environnement :</p>
<p>1) Esquisser un arbre au centre.</p>
<p>2) Ajouter une main qui protège.</p>
<p>3) Colorer avec des teintes vertes et bleues.</p>
<p>4) Écrire un message court et lisible.</p>
<p><strong>Contre-exemple :</strong> juger un dessin uniquement sur son réalisme. La clarté de l'idée et le soin comptent aussi.</p>
</div>
<img alt="Présentation de travaux d'arts plastiques en classe" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Art%20exhibition%20in%20school.jpg?width=700" data-image-id="Dessin7_36">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Présentation de travaux d'élèves — Wikimedia Commons : Art exhibition in school.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Réalise une oeuvre complète sur un sujet libre ou imposé, puis explique tes choix graphiques en quelques phrases.</p>
<p><strong>Corrigé :</strong> Critères : respect de la consigne, observation, organisation, soin, créativité.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Juger un dessin uniquement sur son réalisme. Négliger le soin. Ne pas expliquer ses choix. Se décourager face à la critique.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Prépare une oeuvre pour l'exposition de la classe. Présente-la oralement en expliquant le sujet, la technique et ce que tu as voulu exprimer.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un projet artistique combine observation, esquisse, correction et finition. La présentation orale fait partie du travail. Toute appréciation doit être respectueuse et fondée sur des éléments précis.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de dessin (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
