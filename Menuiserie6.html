{
    title: "Leçon 1 — Le bois : essences et propriétés",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un atelier de menuiserie à Kinshasa, un apprenti doit choisir le bois pour fabriquer une table. Le menuisier lui explique : le bois dur pour le plateau, le bois tendre pour les pieds. Chaque essence a ses propriétés.</p></div>
<h3>1. Les essences de bois</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Bois dur (feuillus)</strong> : chêne, iroko, acajou, teck, ébène. Résistant, durable.</li><li><strong>Bois tendre (résineux)</strong> : sapin, pin, épicéa, cèdre. Facile à travailler.</li><li><strong>Bois locaux congolais</strong> : iroko, tola, sapelli, bossé, wengé.</li><li><strong>Contreplaqué</strong> : panneaux collés, stable.</li><li><strong>Panneaux de particules</strong> : copeaux agglomérés, économique.</li></ul></div>
<h3>2. Les propriétés du bois</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Dureté</strong> : résistance à la rayure.</li><li><strong>Densité</strong> : masse volumique (kg/m³).</li><li><strong>Humidité</strong> : pourcentage d'eau. Doit être séché (10-15 %).</li><li><strong>Retrait/gonflement</strong> : variation avec l'humidité.</li><li><strong>Fil</strong> : direction des fibres (droit, ondulé, contre-fil).</li><li><strong>Durabilité</strong> : résistance aux insectes, champignons.</li></ul></div>
<h3>3. Les défauts du bois</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Nœuds</strong> : points d'attache des branches.</li><li><strong>Fentes</strong> : fissures dues au séchage.</li><li><strong>Gélivures</strong> : fentes du gel.</li><li><strong>Piqûres d'insectes</strong> : galeries.</li><li><strong>Malformations</strong> : courbures, loupes.</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Table</strong> : plateau en iroko, pieds en sapin.</li><li><strong>Porte</strong> : cadre en iroko, panneau en contreplaqué.</li><li><strong>Meuble</strong> : acajou pour l'aspect, sapin pour la structure.</li><li><strong>Séchage</strong> : à l'air libre (naturel) ou au four (artificiel).</li></ul><p><a href="https://www.youtube.com/results?search_query=essences+bois+menuiserie+propriétés" target="_blank" rel="noopener">🎥 Recherche : les essences de bois</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les bois durs (chêne, iroko, acajou) sont résistants ; les bois tendres (sapin, pin) sont faciles à travailler. Les propriétés : dureté, densité, humidité, retrait. Les défauts : nœuds, fentes, piqûres.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels Menuiserie 4e Technique (manuels-scolaires-rdc.com, 2026).<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT.</div>
`
},
{
    title: "Leçon 2 — Les outils de menuiserie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un atelier de Lubumbashi, le menuisier dispose d'une panoplie d'outils : scie, rabot, ciseau à bois, maillet, perceuse. Chaque outil a sa fonction. Leur maîtrise fait la qualité du travail.</p></div>
<h3>1. Les outils de traçage</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Mètre ruban</strong>, <strong>règle</strong>, <strong>équerre</strong>.</li><li><strong>Fausse équerre</strong> : pour les angles variables.</li><li><strong>Trusquin</strong> : traçage parallèle.</li><li><strong>Compas</strong> : traçage des cercles.</li><li><strong>Crayon de menuisier</strong> : mine plate.</li></ul></div>
<h3>2. Les outils de coupe</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Scie égoïne</strong> : coupes droites.</li><li><strong>Scie à dos</strong> : coupes précises.</li><li><strong>Scie sauteuse</strong> : coupes courbes.</li><li><strong>Rabot</strong> : dressage, aplanissement.</li><li><strong>Ciseau à bois</strong> : mortaises, assemblages.</li><li><strong>Gouge</strong> : creusage.</li><li><strong>Perceuse</strong> : trous.</li></ul></div>
<h3>3. Les outils d'assemblage et de finition</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Maillet</strong> : frapper sans abîmer.</li><li><strong>Marteau</strong> : clouer.</li><li><strong>Tournevis</strong> : visser.</li><li><strong>Serre-joints</strong> : maintenir pendant le collage.</li><li><strong>Râpe et lime</strong> : finition.</li><li><strong>Papier de verre</strong> : ponçage.</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Couper une planche</strong> : scie égoïne, tracé à l'équerre.</li><li><strong>Aplanir</strong> : rabot, dans le sens du fil.</li><li><strong>Assembler</strong> : mortaise + tenon, ciseau + maillet.</li><li><strong>Poncer</strong> : papier de verre grain 80 puis 120.</li></ul><p><a href="https://www.youtube.com/results?search_query=outils+menuiserie+scie+rabot+ciseau" target="_blank" rel="noopener">🎥 Recherche : les outils de menuiserie</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les outils de menuiserie se classent en : traçage (mètre, équerre, trusquin), coupe (scie, rabot, ciseau), assemblage et finition (maillet, marteau, serre-joints, papier de verre).</p></div>
<div class="sources"><strong>Sources :</strong> Manuels Menuiserie 4e Technique (2026).</div>
`
},
{
    title: "Leçon 3 — Les assemblages en bois",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Pour fabriquer une table solide, le menuisier assemble les planches. Il utilise des assemblages : tenon-mortaise, queue d'aronde, mi-bois. Un bon assemblage résiste au temps.</p></div>
<h3>1. Les assemblages traditionnels</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Tenon-mortaise</strong> : solide, pour les cadres.</li><li><strong>Queue d'aronde</strong> : très solide, pour les tiroirs.</li><li><strong>Mi-bois</strong> : deux pièces entaillées à mi-épaisseur.</li><li><strong>Enture</strong> : assemblage en longueur.</li><li><strong>Tourillon</strong> : cheville cylindrique.</li><li><strong>Lamelle</strong> : pour les panneaux.</li></ul></div>
<h3>2. Les assemblages modernes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Vis</strong> : rapide, moins solide.</li><li><strong>Clous</strong> : pour les caisses.</li><li><strong>Écrous et boulons</strong> : pour les meubles démontables.</li><li><strong>Excentriques</strong> : pour les panneaux (meubles en kit).</li><li><strong>Colle à bois</strong> : renforce l'assemblage.</li></ul></div>
<h3>3. Le collage</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Colle vinylique (blanche)</strong> : usage intérieur.</li><li><strong>Colle polyuréthane</strong> : usage extérieur, résistante à l'eau.</li><li><strong>Application</strong> : encoller les deux faces, serrer, laisser sécher 24 h.</li><li><strong>Serre-joints</strong> : maintenir la pression.</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><strong>Assemblage d'un cadre de porte</strong></p><ul><li>Tenon-mortaise aux angles.</li><li>Colle vinylique + chevilles.</li><li>Serrage au serre-joint.</li><li>Séchage 24 h.</li><li>Ponçage et finition.</li></ul><p><a href="https://www.youtube.com/results?search_query=assemblages+bois+tenon+mortaise+queue+aronde" target="_blank" rel="noopener">🎥 Recherche : les assemblages en bois</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les assemblages traditionnels sont : tenon-mortaise, queue d'aronde, mi-bois, enture, tourillon. Les assemblages modernes : vis, clous, boulons, excentriques. Le collage utilise la colle vinylique ou polyuréthane, avec serrage.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels Menuiserie 4e Technique (2026).</div>
`
},
{
    title: "Leçon 4 — La fabrication d'un meuble simple",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un menuisier de Kinshasa reçoit la commande d'une table basse. Il suit les étapes : plan, débit, usinage, assemblage, finition. Chaque étape compte pour un résultat de qualité.</p></div>
<h3>1. Le plan et le débit</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Plan</strong> : dessin coté du meuble.</li><li><strong>Liste de débit</strong> : pièces, dimensions, nombre.</li><li><strong>Choix du bois</strong> : selon l'usage.</li><li><strong>Traçage</strong> : sur les planches.</li><li><strong>Débit</strong> : coupe à la scie.</li></ul></div>
<h3>2. L'usinage</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Dressage</strong> : mise à l'équerre.</li><li><strong>Rabotage</strong> : aplanissement.</li><li><strong>Perçage</strong> : trous pour vis/chevilles.</li><li><strong>Mortaisage</strong> : pour les assemblages.</li><li><strong>Ponçage</strong> : papier de verre.</li></ul></div>
<h3>3. L'assemblage et la finition</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Assemblage</strong> : tenon-mortaise, vis, colle.</li><li><strong>Vérification</strong> : équerrage, stabilité.</li><li><strong>Finition</strong> : ponçage fin, vernis, peinture, cire.</li><li><strong>Séchage</strong> : entre les couches.</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><strong>Table basse 100 × 50 × 45 cm</strong></p><ul><li>Plateau : 100 × 50 × 3 cm.</li><li>Pieds : 4 × (6 × 6 × 45 cm).</li><li>Traverses : 4 × (40 × 6 × 3 cm).</li><li>Assemblage : tenon-mortaise + vis.</li><li>Finition : ponçage + vernis.</li></ul><p><a href="https://www.youtube.com/results?search_query=fabrication+meuble+menuiserie+table" target="_blank" rel="noopener">🎥 Recherche : la fabrication d'un meuble</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La fabrication d'un meuble comprend : plan, débit, usinage (dressage, rabotage, perçage, mortaisage), assemblage, finition (ponçage, vernis). Chaque étape doit être soignée.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels Menuiserie 4e Technique (2026).</div>
`

{
    title: "Leçon 5 — Les machines-outils de menuiserie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un atelier moderne de Kinshasa, le menuisier utilise des machines : scie circulaire, raboteuse, toupie, perceuse à colonne. Ces machines augmentent la productivité mais exigent la prudence.</p></div>
<h3>1. Les machines de sciage</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Scie circulaire</strong> : coupes droites.</li><li><strong>Scie à ruban</strong> : coupes courbes.</li><li><strong>Scie radiale</strong> : coupes d'onglet.</li><li><strong>Scie à format</strong> : panneaux.</li></ul></div>
<h3>2. Les machines de façonnage</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Dégauchisseuse</strong> : dressage des faces.</li><li><strong>Raboteuse</strong> : mise à l'épaisseur.</li><li><strong>Toupie</strong> : moulures, profils.</li><li><strong>Mortaisage</strong> : mortaises.</li><li><strong>Perceuse à colonne</strong> : trous précis.</li></ul></div>
<h3>3. Les machines de finition</h3>

function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;

function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;

                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;

function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;

    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;

}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }

function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
