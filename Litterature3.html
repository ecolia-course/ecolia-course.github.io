<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours de littérature propose une initiation aux genres littéraires, aux méthodes d'analyse et à la littérature congolaise et africaine. Il articule lecture, analyse, écriture et plaisir de lire.</p>

    `
},
{
    title: "Leçon 1 — Qu'est-ce que la littérature ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qu'est-ce qui distingue un texte littéraire d'un article de presse ou d'un rapport ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la littérature et son objet. Comprendre les critères du littéraire. Distinguer fiction et document.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>La <strong>littérature</strong> est l'ensemble des œuvres écrites (ou orales transcrites) qui utilisent le langage de manière travaillée, pour produire du sens, de l'émotion et de la beauté. Elle se distingue d'un texte utilitaire par sa <em>forme</em> (travail du style) et par sa <em>visée</em> (émouvoir, interroger, raconter).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Critères du littéraire</div>
<ul>
<li><strong>Travail formel :</strong> choix des mots, rythme, figures, structures.</li>
<li><strong>Fiction :</strong> l'auteur crée un monde (même inspiré du réel).</li>
<li><strong>Polyvalence :</strong> un texte littéraire admet plusieurs interprétations.</li>
<li><strong>Valeur esthétique :</strong> il vise à produire une expérience sensible.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Fiction et document</div>
<p>Un texte <strong>documentaire</strong> transmet une information sur le réel (rapport, article, manuel). Un texte <strong>fictionnel</strong> raconte des événements inventés (roman, conte, poème). Un même événement peut donner lieu aux deux : un rapport sur la guerre et un roman sur la guerre.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Classe ces textes : un roman, une notice technique, un poème, un article de presse.</p>
<p><strong>Ex. 2 :</strong> Cite deux critères du littéraire et illustre-les.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Roman et poème : littérature. Notice et article de presse : documents. <strong>2)</strong> Travail formel : un poème joue sur les sons ; fiction : un roman crée des personnages.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La littérature se reconnaît au travail du langage, à la fiction et à la pluralité des interprétations.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel <em>Au fil du temps</em> ; références générales de théorie littéraire.</div>
    `
},
{
    title: "Leçon 2 — Les genres littéraires : panorama",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi classe-t-on les textes en genres ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les grands genres littéraires. Comprendre leurs règles et leurs effets. Situer un texte dans son genre.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les grands genres</div>
<ul>
<li><strong>Roman :</strong> récit long en prose, personnages, intrigue, monde.</li>
<li><strong>Nouvelle :</strong> récit court, souvent centré sur un événement ou un effet.</li>
<li><strong>Poésie :</strong> texte en vers (ou en prose poétique), travail du rythme et des images.</li>
<li><strong>Théâtre :</strong> texte destiné à la scène, écrit en dialogues et didascalies.</li>
<li><strong>Conte :</strong> récit bref, souvent oral, avec personnages types et morale.</li>
<li><strong>Essai :</strong> texte argumentatif, réflexion personnelle sur un sujet.</li>
<li><strong>Autobiographie :</strong> récit de sa propre vie.</li>
</ul>
<img data-image-id="LI3_IMG02" alt="Tableau des genres littéraires" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Genres et effets</div>
<p>Chaque genre produit un effet dominant : le roman fait vivre une histoire, la poésie fait éprouver une émotion par le rythme, le théâtre fait jouer une action, l'essai fait réfléchir. Mais les frontières sont poreuses : il existe des romans poétiques, des essais narratifs.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Associe chaque extrait à son genre (roman, poésie, théâtre, conte).</p>
<p><strong>Ex. 2 :</strong> Cite deux caractéristiques qui distinguent le roman du conte.</p>
<details><summary>Corrigé</summary>
<p><strong>2)</strong> Le roman est long, avec des personnages individualisés ; le conte est bref, avec des personnages types et souvent une morale.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les genres littéraires offrent des cadres de lecture : ils orientent les attentes du lecteur et les choix de l'auteur.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel <em>Au fil du temps</em> ; références générales.</div>
    `
},
{
    title: "Leçon 3 — Le récit : narration, personnages, point de vue",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment un auteur nous fait-il entrer dans une histoire ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier le schéma narratif. Distinguer les types de narrateur. Reconnaître la focalisation. Analyser les personnages.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Schéma narratif</div>
<ol>
<li><strong>Situation initiale :</strong> équilibre de départ.</li>
<li><strong>Élément déclencheur :</strong> événement qui rompt l'équilibre.</li>
<li><strong>Péripéties :</strong> actions, obstacles.</li>
<li><strong>Dénouement :</strong> résolution.</li>
<li><strong>Situation finale :</strong> nouvel équilibre.</li>
</ol>
<img data-image-id="LI3_IMG01" alt="Schéma narratif" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Narrateur et focalisation</div>
<ul>
<li><strong>Narrateur interne :</strong> raconte à la 1<sup>re</sup> personne, ne sait que ce qu'il vit (focalisation interne).</li>
<li><strong>Narrateur externe :</strong> raconte à la 3<sup>e</sup> personne, ne sait que ce qu'il voit (focalisation externe).</li>
<li><strong>Narrateur omniscient :</strong> sait tout, y compris les pensées des personnages (focalisation zéro).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Personnages</div>
<ul>
<li><strong>Protagoniste :</strong> personnage principal.</li>
<li><strong>Antagoniste :</strong> personnage qui s'oppose au protagoniste.</li>
<li><strong>Personnages secondaires :</strong> entourent l'action, la nourrissent.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Identifie le schéma narratif dans un extrait de roman fourni.</p>
<p><strong>Ex. 2 :</strong> Détermine le type de focalisation dans un court extrait.</p>
<details><summary>Corrigé indicatif</summary>
<p>La focalisation se détermine en repérant qui sait quoi : si le narrateur connaît les pensées de tous, c'est la focalisation zéro.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le récit s'organise en cinq étapes ; le narrateur et la focalisation déterminent ce que le lecteur sait.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel <em>Au fil du temps</em> ; références narratologiques scolaires.</div>
    `
},
{
    title: "Leçon 4 — La poésie : vers, rythme, images",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un poème se lit-il autrement qu'un roman ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Reconnaître les caractéristiques du vers. Comprendre le rythme et la musicalité. Identifier les images poétiques.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le vers</div>
<ul>
<li><strong>Vers :</strong> ligne de poésie, avec un mètre (nombre de syllabes).</li>
<li><strong>Alexandrin :</strong> vers de 12 syllabes.</li>
<li><strong>Décasyllabe :</strong> vers de 10 syllabes.</li>
<li><strong>Vers libre :</strong> sans mètre régulier.</li>
<li><strong>Strophe :</strong> groupe de vers.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Rythme et musicalité</div>
<ul>
<li><strong>Rimes :</strong> plates (AABB), croisées (ABAB), embrassées (ABBA).</li>
<li><strong>Allitérations :</strong> répétition de consonnes.</li>
<li><strong>Assonances :</strong> répétition de voyelles.</li>
<li><strong>Cadence :</strong> rythme du vers, souvent marqué par la césure.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les images</div>
<ul>
<li><strong>Comparaison :</strong> rapprochement explicite avec « comme ».</li>
<li><strong>Métaphore :</strong> rapprochement sans outil de comparaison.</li>
<li><strong>Personnification :</strong> attribuer des traits humains à un objet ou un animal.</li>
<li><strong>Symboles :</strong> une image qui renvoie à une idée générale.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Compte les syllabes d'un vers et nomme le mètre.</p>
<p><strong>Ex. 2 :</strong> Repère une métaphore et une comparaison dans un poème court.</p>
<details><summary>Corrigé indicatif</summary>
<p>L'analyse s'appuie sur le repérage des outils et des images dans le texte.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La poésie travaille la forme du langage (rythme, sonorités, images) pour produire une émotion singulière.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel <em>Au fil du temps</em> ; références de versification.</div>
    `
},
{
    title: "Leçon 5 — Le théâtre : dialogue, action, représentation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qu'est-ce qui distingue un texte de théâtre d'un roman ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Reconnaître les composantes d'un texte dramatique. Comprendre les notions de scène, d'acte, de didascalies. Analyser un extrait.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Composantes</div>
<ul>
<li><strong>Dialogue :</strong> échange entre les personnages.</li>
<li><strong>Didascalies :</strong> indications scéniques (décor, gestes, tons), souvent en italique ou entre parenthèses.</li>
<li><strong>Monologue :</strong> discours d'un personnage seul sur scène.</li>
<li><strong>Aparté :</strong> réplique que seul le public est censé entendre.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Structure</div>
<ul>
<li><strong>Acte :</strong> grande division de la pièce.</li>
<li><strong>Scène :</strong> subdivision de l'acte, marquée par l'entrée ou la sortie d'un personnage.</li>
<li><strong>Comédie / tragédie :</strong> deux grands genres dramatiques, avec des registres et des fins différents.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le théâtre comme représentation</div>
<p>Un texte de théâtre est écrit pour être joué : il suppose une mise en scène, des acteurs, un public. Analyser un texte théâtral, c'est aussi imaginer sa représentation : ce que voit, ce qu'entend le spectateur.</p>

<li><strong>Ironie :</strong> dire le contraire de ce qu'on pense pour critiquer.</li>

          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
