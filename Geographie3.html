<div class="bloc theorie"><div class="bloc-label">Sommaire</div>

{
    title: "Leçon 1 — Introduction à la géographie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qu'étudie la géographie ? À quoi sert-elle dans la vie d'un citoyen congolais ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la géographie et son objet. Distinguer ses branches. Utiliser les outils du géographe (carte, graphique, image, SIG).</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition et objet</div>
<p>La <strong>géographie</strong> est la science qui étudie la surface de la Terre, les phénomènes naturels qui s'y produisent et la manière dont les sociétés humaines occupent et transforment l'espace. Elle relie trois dimensions :</p>
<ul>
<li><strong>L'espace :</strong> où se situe un phénomène, comment il se répartit.</li>
<li><strong>Le milieu naturel :</strong> relief, climat, sols, eau, végétation.</li>
<li><strong>Les sociétés humaines :</strong> population, habitats, activités économiques.</li>
</ul>
<p>La géographie ne se contente pas de décrire : elle <em>explique</em> les localisations et les relations entre milieux et sociétés.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les branches</div>
<ul>
<li><strong>Géographie physique :</strong> relief, climatologie, hydrographie, biogéographie, étude des sols.</li>
<li><strong>Géographie humaine :</strong> population, habitat, urbanisation, migrations.</li>
<li><strong>Géographie économique :</strong> activités (agriculture, mines, industrie, services), échanges.</li>
<li><strong>Géographie régionale :</strong> étude d'un espace donné (RDC, Afrique centrale, Afrique du Nord…).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les outils du géographe</div>
<ul>
<li><strong>La carte :</strong> représentation d'un espace, avec titre, légende, échelle, orientation (Nord en haut par convention).</li>
<li><strong>Le graphique :</strong> courbe, diagramme, histogramme pour visualiser des données.</li>
<li><strong>L'image (photographie, image satellitaire) :</strong> observation d'un paysage.</li>
<li><strong>Les SIG (systèmes d'information géographique) :</strong> outil informatique qui superpose des couches de données pour analyser un territoire (initiation).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Sur une carte simple, repère le titre, la légende, l'échelle et l'orientation.</p>
<p><strong>Ex. 2 :</strong> Cite deux branches de la géographie et un exemple concret d'objet d'étude pour chacune.</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>2)</strong> Géographie physique : étude du relief de la RDC. Géographie humaine : étude de la croissance urbaine de Kinshasa.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La géographie étudie l'espace, le milieu et les sociétés ; la carte est son outil de base.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de géographie ; manuels scolaires 3e année.</div>
    `
},
{
    title: "Leçon 2 — Structure de la Terre et grands types de relief",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi la surface de la Terre n'est-elle pas plate ? Comment les montagnes se forment-elles ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Décrire la structure interne de la Terre. Identifier les grands types de relief. Expliquer les mouvements de l'écorce terrestre.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Structure interne</div>
<p>La Terre est constituée de couches concentriques :</p>
<ul>
<li><strong>La croûte</strong> (ou écorce) : couche superficielle, solide, de faible épaisseur (quelques dizaines de kilomètres).</li>
<li><strong>Le manteau :</strong> couche intermédiaire, épaisse, où la roche est en partie fondue.</li>
<li><strong>Le noyau :</strong> partie centrale, très chaude, composée surtout de fer et de nickel.</li>
</ul>
<img data-image-id="GE3_IMG03" alt="Coupe schématique de l'écorce terrestre" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les grands types de relief</div>
<ul>
<li><strong>La montagne :</strong> relief élevé, aux pentes fortes, souvent en chaîne. Ex. : Ruwenzori, Virunga.</li>
<li><strong>Le plateau :</strong> surface plane ou légèrement ondulée, élevée par rapport aux régions voisines. Ex. : plateaux du Kasaï et du Katanga.</li>
<li><strong>La plaine :</strong> surface basse et plane. Ex. : plaine de la cuvette centrale.</li>
<li><strong>La cuvette :</strong> vaste dépression entourée de reliefs plus élevés. Ex. : cuvette centrale congolaise.</li>
</ul>
<img data-image-id="GE3_IMG01" alt="Carte du relief de la RDC" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Mouvements de l'écorce terrestre</div>
<p>L'écorce est divisée en <strong>plaques</strong> qui se déplacent lentement. Leurs mouvements expliquent :</p>
<ul>
<li><strong>Les plissements :</strong> compression des roches qui se plient (formation des chaînes de montagnes).</li>
<li><strong>Les failles :</strong> cassures avec déplacement des blocs (fossé d'effondrement).</li>
<li><strong>Les séismes :</strong> secousses dues aux ruptures brutales de roches en profondeur.</li>
<li><strong>Le volcanisme :</strong> remontée de magma ; le rift de l'Est congolais (Virunga, Nyiragongo, Nyamulagira) est un exemple actif.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Identifie sur la carte du relief de la RDC : la cuvette centrale, les plateaux du Kasaï, la chaîne du Ruwenzori, les volcans des Virunga.</p>
<p><strong>Ex. 2 :</strong> Explique la différence entre un plissement et une faille.</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>2)</strong> Le plissement résulte d'une compression des roches qui se plient ; la faille est une cassure avec déplacement des blocs.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La Terre est structurée en couches ; la croûte bouge et façonne les formes du relief.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de géographie ; manuels 3e année ; cartes topographiques.</div>
    `
},
{
    title: "Leçon 3 — Roches, sols et modelé",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certains sols sont-ils fertiles et d'autres non ? Comment la nature des roches change-t-elle le paysage ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer les grands types de roches. Comprendre la formation des sols. Relier nature des roches et modelé.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les trois grands types de roches</div>
<ul>
<li><strong>Roches magmatiques (ou ignées) :</strong> issues du refroidissement du magma. Ex. : granite, basalte.</li>
<li><strong>Roches sédimentaires :</strong> issues du dépôt et de la compaction de sédiments (sable, calcaire, argile, grès).</li>
<li><strong>Roches métamorphiques :</strong> issues de la transformation de roches existantes sous l'effet de la chaleur et de la pression. Ex. : gneiss, marbre.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Formation des sols</div>
<p>Le sol est la couche superficielle meuble où poussent les végétaux. Il provient de la <strong>décomposition des roches</strong> (par l'eau, le gel, le vent, les êtres vivants) et de la <strong>décomposition de la matière organique</strong> (humus). Un sol comprend : matière minérale, matière organique, eau, air, êtres vivants. Sa fertilité dépend de sa composition, de sa profondeur et de son humidité.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Influence des roches sur le modelé</div>
<ul>
<li><strong>Roches dures</strong> (granite, quartzite) : résistent à l'érosion, formant des reliefs escarpés.</li>
<li><strong>Roches tendres</strong> (argile, craie) : s'érodent facilement, formant des dépressions.</li>
<li><strong>Roches perméables</strong> (calcaire) : laissent passer l'eau, formant un <strong>modelé karstique</strong> (grottes, gouffres, dolines).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Classe chaque roche dans sa catégorie : granite, calcaire, grès, basalte, marbre, gneiss.</p>
<p><strong>Ex. 2 :</strong> Explique pourquoi le modelé karstique se développe dans le calcaire.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Magmatiques : granite, basalte. Sédimentaires : calcaire, grès. Métamorphiques : marbre, gneiss.</p>
<p><strong>2)</strong> Le calcaire est soluble dans l'eau chargée de gaz carbonique ; l'eau creuse la roche et forme grottes et gouffres.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les roches (magmatiques, sédimentaires, métamorphiques) donnent naissance aux sols et orientent les formes du paysage.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de géographie ; manuels scolaires.</div>
    `
},
{
    title: "Leçon 4 — Climat, végétation et paysages",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi pleut-il beaucoup à Mbandaka et très peu dans le sud du pays ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les éléments du climat. Distinguer les grands types de climats. Relier climat, végétation et paysages.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les éléments du climat</div>
<p>Le climat est l'ensemble des conditions atmosphériques moyennes d'une région sur plusieurs décennies. Il repose sur :</p>
<ul>
<li><strong>La température :</strong> mesurée en degrés Celsius (°C).</li>
<li><strong>Les précipitations :</strong> pluie, neige, grêle, mesurées en millimètres (mm).</li>
<li><strong>La pression atmosphérique :</strong> en hectopascals (hPa).</li>
<li><strong>Les vents :</strong> direction et force.</li>
</ul>
<p>À ne pas confondre avec la <strong>météo</strong>, qui décrit l'état de l'atmosphère sur un jour ou une semaine.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Grands types de climats en Afrique et en RDC</div>
<ul>
<li><strong>Climat équatorial :</strong> chaud et très humide, pluies abondantes toute l'année. Ex. : cuvette centrale congolaise.</li>
<li><strong>Climat tropical humide :</strong> alternance de saisons humides et sèches marquées. Ex. : plateaux du Kasaï.</li>
<li><strong>Climat tropical sec / sahélien :</strong> saison sèche longue.</li>
<li><strong>Climat désertique :</strong> précipitations très faibles. Ex. : Sahara.</li>
<li><strong>Climat méditerranéen :</strong> été sec et chaud, hiver doux et humide. Ex. : Afrique du Nord.</li>
<li><strong>Climat de montagne :</strong> températures fraîches, étagées selon l'altitude. Ex. : Ruwenzori, Virunga.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Végétation correspondante</div>
<ul>
<li><strong>Forêt équatoriale dense :</strong> à climat équatorial, très riche en espèces.</li>
<li><strong>Savane :</strong> à climat tropical humide, herbes hautes et arbres dispersés.</li>
<li><strong>Steppe :</strong> à climat tropical sec, herbes basses.</li>
<li><strong>Désert :</strong> végétation rare et adaptée (plantes grasses, buissons épineux).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Atouts et contraintes</div>
<p>Un climat peut être un <strong>atout</strong> (deux saisons culturales en zone équatoriale et tropicale humide, forêt, eau) et une <strong>contrainte</strong> (saison sèche, érosion, inondations, difficultés de transport en saison des pluies, chaleur humide favorisant certaines maladies).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Associe à chaque climat sa végétation principale : équatorial, tropical humide, désertique.</p>
<p><strong>Ex. 2 :</strong> Cite deux atouts et deux contraintes du climat équatorial de la cuvette centrale.</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>1)</strong> Équatorial → forêt dense ; tropical humide → savane ; désertique → végétation rare.</p>
<p><strong>2)</strong> Atouts : pluies régulières, deux saisons culturales possibles. Contraintes : humidité favorisant les maladies, pistes impraticables.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les climats africains vont de l'équatorial au désertique ; chaque climat correspond à une végétation et à des paysages propres.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de géographie ; manuels 3e année ; cartes climatiques.</div>
    `
},
{
    title: "Leçon 5 — Hydrographie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi le fleuve Congo déborde-t-il à certaines périodes ? Quels usages fait-on de l'eau en RDC ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les grands bassins fluviaux. Comprendre le régime fluvial. Comparer deux fleuves majeurs africains.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Bassin et réseau hydrographique</div>
<p>Un <strong>bassin fluvial</strong> est l'ensemble du territoire dont les eaux s'écoulent vers un même fleuve et ses affluents. Le <strong>réseau hydrographique</strong> est l'ensemble des cours d'eau d'un bassin. La RDC occupe l'essentiel du <strong>bassin du Congo</strong>, l'un des plus vastes du monde. Elle compte aussi des lacs (Tanganyika, Kivu, Albert, Édouard, Moero, Mai-Ndombe, Tumba).</p>
<img data-image-id="GE3_IMG02" alt="Carte hydrographique du bassin du Congo" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le régime fluvial</div>
<p>Le <strong>régime fluvial</strong> est la variation du débit d'un cours d'eau au fil de l'année. Il dépend du climat du bassin.</p>
<ul>
<li><strong>Le débit :</strong> volume d'eau écoulé par seconde (m³/s).</li>
<li><strong>La crue :</strong> augmentation du débit après des pluies.</li>
<li><strong>L'étiage :</strong> période de basses eaux.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Deux exemples comparés</div>
<p><strong>Le fleuve Congo :</strong> son bassin est situé de part et d'autre de l'équateur. Les pluies tombent sur des parties du bassin à des saisons différentes (hémisphères Nord et Sud), ce qui donne au fleuve un <strong>régime relativement régulier</strong> (toujours alimenté en amont).</p>
<p><strong>Le Nil :</strong> son bassin traverse plusieurs zones climatiques (équatoriale, tropicale humide, désertique). Son régime est <strong>complexe</strong> : crues liées aux pluies éthiopiennes, basses eaux ensuite, forte dépendance à l'irrigation.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Enjeux de l'eau</div>
<p>L'eau des fleuves sert à : la navigation (fleuve Congo et affluents), la production d'électricité (barrages hydroélectriques), l'irrigation, la pêche, l'alimentation. Le potentiel hydroélectrique de la RDC, notamment à Inga, est considérable mais faiblement exploité.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Sur la carte hydrographique de la RDC, repère le fleuve Congo, ses principaux affluents (Kasaï, Ubangi, Lomami, Aruwimi) et trois lacs.</p>
<p><strong>Ex. 2 :</strong> Explique pourquoi le régime du fleuve Congo est plus régulier que celui du Nil.</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>2)</strong> Le bassin du Congo s'étend sur les deux hémisphères : il pleut toujours dans une partie du bassin, ce qui garantit un débit relativement stable toute l'année.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le fleuve Congo est un axe majeur par son bassin et la régularité de son régime ; l'eau est un enjeu économique vital pour la RDC.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de géographie ; cartes hydrographiques ; manuels scolaires.</div>
    `
},
{
    title: "Leçon 6 — L'érosion et la protection des sols",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi les sols du Kasaï s'érodent-ils ? Que peut-on faire pour les protéger ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir l'érosion et ses agents. Comprendre le mécanisme de l'érosion hydrique. Proposer des techniques de lutte.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition et agents</div>
<p>L'<strong>érosion</strong> est l'usure et l'enlèvement de la couche superficielle du sol par des agents naturels (ou liés à l'activité humaine). Les principaux agents :</p>
<ul>
<li><strong>L'eau courante :</strong> érosion hydrique, la plus active en zone tropicale humide.</li>
<li><strong>Le vent :</strong> érosion éolienne, en zone sèche.</li>
<li><strong>Le gel et le dégel :</strong> en montagne.</li>
<li><strong>Les activités humaines :</strong> déforestation, surpâturage, culture sur brûlis, construction sans protection.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Mécanisme de l'érosion par l'eau</div>
<ol>
<li>Les gouttes de pluie frappent le sol et détachent les particules.</li>
<li>L'eau ruisselle et transporte les particules.</li>
<li>L'accumulation de ruissellement creuse des rigoles, puis des ravines.</li>
<li>La ravine s'élargit et progresse : c'est l'érosion torrentielle.</li>
</ol>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Conséquences</div>
<ul>
<li>Perte de la couche fertile : baisse des rendements agricoles.</li>
<li>Destruction des terres arables, apparition de ravines.</li>
<li>Envasement des cours d'eau, des barrages, des lacs.</li>
<li>Risque accru d'inondations en aval.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Techniques de lutte</div>
<ul>
<li><strong>Reboisement :</strong> les arbres fixent le sol par leurs racines et freinent le ruissellement.</li>
<li><strong>Terrassement (culture en courbes de niveau) :</strong> les billons épousent la pente et retiennent l'eau.</li>
<li><strong>Cordons pierreux :</strong> murets de pierres qui freinent l'écoulement.</li>
<li><strong>Couverture végétale :</strong> paillage, cultures de couverture.</li>
<li><strong>Gestion des pâturages :</strong> rotation des troupeaux pour éviter le surpâturage.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois agents de l'érosion et une conséquence pour chacun.</p>
<p><strong>Ex. 2 :</strong> Propose deux techniques de lutte adaptées à un champ en pente du Kasaï.</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>1)</strong> Eau (ravines), vent (perte de sol fertile), déforestation (glissement et ruissellement).</p>
<p><strong>2)</strong> Cultures en courbes de niveau, cordons pierreux, reboisement.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'érosion détruit les sols agricoles ; reboisement, terrassement et cordons pierreux sont les principales protections.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de géographie ; manuels scolaires ; documents de conservation des sols.</div>
    `
},
{
    title: "Leçon 7 — Population de la RDC",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Où vivent les Congolais ? Pourquoi certaines régions sont-elles beaucoup plus peuplées que d'autres ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Analyser la structure et la répartition de la population. Lire une pyramide des âges et une carte de densité.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Structure de la population</div>
<p>La population se décrit par :</p>
<ul>
<li><strong>La structure par âge et par sexe :</strong> représentée par la <strong>pyramide des âges</strong>. La RDC a une population très jeune : la base de la pyramide est large.</li>
<li><strong>La densité de population :</strong> nombre d'habitants par km².</li>
<li><strong>Les langues :</strong> français (langue officielle), quatre langues nationales (lingala, swahili, kikongo, tshiluba) et de nombreuses langues locales.</li>
<li><strong>Les religions :</strong> christianisme, islam, religions traditionnelles.</li>
</ul>
<img data-image-id="GE3_IMG04" alt="Pyramide des âges de la RDC (données à actualiser selon sources disponibles)" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Répartition spatiale</div>
<p>La population congolaise est inégalement répartie :</p>
<ul>
<li><strong>Fortes densités :</strong> à l'ouest (Kinshasa et sa périphérie, Bas-Congo/Kongo-Central), à l'est (Kivu), sur les plateaux du Kasaï et du Katanga.</li>
<li><strong>Faibles densités :</strong> dans la cuvette centrale, en raison de la forêt dense et des difficultés de communication.</li>
</ul>
<p>Les causes de cette répartition : relief, climat, ressources, histoire, voies de communication, sécurité.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Analyse la pyramide des âges de la RDC : quelles classes d'âge dominent ?</p>
<p><strong>Ex. 2 :</strong> Explique pourquoi la cuvette centrale est faiblement peuplée.</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>1)</strong> Les jeunes (0–15 ans) dominent, ce qui traduit une population jeune.</p>
<p><strong>2)</strong> Forêt dense, difficultés de transport, faible mise en valeur agricole.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La population congolaise est jeune et inégalement répartie ; les facteurs naturels et humains expliquent cette répartition.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de géographie ; manuels scolaires ; cartes de densité.</div>
    `
},
{
    title: "Leçon 8 — Développement urbain en RDC",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi Kinshasa grandit-elle si vite ? Quels problèmes cela pose-t-il ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le phénomène urbain en RDC. Distinguer les types et fonctions des villes. Identifier les problèmes urbains.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le phénomène urbain</div>
<p>La population urbaine de la RDC augmente rapidement. Les causes :</p>
<ul>
<li>Exode rural (recherche d'emploi, d'éducation, de sécurité).</li>
<li>Croissance naturelle élevée des villes.</li>
<li>Conflits dans certaines régions poussant les populations vers les centres urbains.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Types et fonctions des villes</div>
<ul>
<li><strong>Villes capitales / politiques :</strong> Kinshasa (capitale nationale).</li>
<li><strong>Villes minières :</strong> Lubumbashi, Kolwezi, Mbuji-Mayi.</li>
<li><strong>Villes portuaires et commerciales :</strong> Matadi, Boma, Banana.</li>
<li><strong>Villes carrefours et administratives :</strong> Kisangani, Goma, Bukavu, Kananga.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Problèmes urbains</div>
<ul>
<li><strong>Logement :</strong> pénurie, habitat précaire, bidonvilles.</li>
<li><strong>Transport :</strong> embouteillages, routes dégradées.</li>
<li><strong>Assainissement :</strong> déchets, eaux usées, insalubrité.</li>
<li><strong>Chômage et sous-emploi :</strong> développement du secteur informel.</li>
<li><strong>Sécurité et services de base :</strong> eau, électricité, santé, éducation.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Étude de cas : Kinshasa</div>
<p>Kinshasa concentre une part très importante de la population urbaine du pays et joue un rôle <strong>macrocéphale</strong> : elle concentre les fonctions politiques, économiques, culturelles et universitaires. Cette macrocéphalie pose des défis : pression démographique, extension non planifiée, difficultés de services publics, tensions sociales.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois causes de l'urbanisation en RDC.</p>
<p><strong>Ex. 2 :</strong> Propose deux solutions à un problème urbain de ton choix.</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>1)</strong> Exode rural, croissance naturelle, conflits.</p>
<p><strong>2)</strong> Par exemple, pour le logement : programmes de logements sociaux, planification des lotissements.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les villes congolaises grandissent vite ; Kinshasa concentre la population et les fonctions au point d'être macrocéphale.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de géographie ; manuels 3e année ; documents de développement urbain.</div>
    `
},
{
    title: "Leçon 9 — Caractères généraux de l'économie congolaise",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi dit-on que l'économie congolaise est 'extravertie' et 'dualiste' ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Caractériser l'économie de la RDC. Comprendre sa dépendance extérieure. Identifier la coexistence de deux secteurs.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Une économie dualiste</div>
<p>L'économie congolaise est <strong>dualiste</strong> : deux secteurs coexistent.</p>
<ul>
<li><strong>Secteur moderne :</strong> grandes entreprises (mines, agro-industrie, télécoms), productions destinées principalement à l'exportation.</li>
<li><strong>Secteur informel (ou traditionnel) :</strong> petite agriculture, petit commerce, artisanat, transport. Il occupe une part très importante de la population active.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Une économie extravertie</div>
<p>L'économie est <strong>extravertie</strong> : elle dépend fortement du commerce extérieur. Elle exporte des matières premières (cuivre, cobalt, diamant, or, coltan, bois, pétrole) et importe des produits manufacturés (machines, produits alimentaires transformés, médicaments, véhicules). Cette dépendance rend l'économie vulnérable aux variations des prix mondiaux.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Une économie à dominante agricole</div>
<p>Une grande partie de la population vit de l'agriculture, souvent vivrière (production pour l'alimentation familiale) et de faible productivité. L'industrialisation reste limitée.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Explique la différence entre secteur moderne et secteur informel.</p>
<p><strong>Ex. 2 :</strong> Cite deux conséquences de l'extraversion de l'économie congolaise.</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>2)</strong> Vulnérabilité aux prix mondiaux ; faible transformation locale des matières premières.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'économie congolaise est dualiste (moderne / informel), extravertie (dépendante de l'exportation) et à dominante agricole.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de géographie (CB2) ; manuels 3e année ; rapports économiques RDC.</div>
    `
},
{
    title: "Leçon 10 — Agriculture, pêche et élevage",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« La RDC dispose de terres fertiles et d'eau, mais pourquoi peine-t-elle à nourrir sa population ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer les systèmes de culture. Identifier les principales cultures. Analyser pêche, élevage et exploitation forestière.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Systèmes de culture</div>
<ul>
<li><strong>Culture itinérante sur brûlis :</strong> on défriche, cultive deux à trois ans, puis on déplace le champ. Pratiquée en zone forestière ; peu productive mais adaptée aux sols pauvres.</li>
<li><strong>Culture intensive :</strong> utilisation d'engrais, de semences améliorées, mécanisation. Peu développée en RDC.</li>
<li><strong>Culture de rente :</strong> destinée à la vente (café, cacao, hévéa, palmier à huile, coton).</li>
<li><strong>Culture vivrière :</strong> destinée à l'alimentation familiale (manioc, maïs, riz, banane plantain, haricot, patate douce).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Principales cultures</div>
<p><strong>Vivrières :</strong> manioc (base de l'alimentation), maïs, riz, banane plantain, haricot, arachide, patate douce, igname.</p>
<p><strong>De rente :</strong> café (Kivu), cacao, hévéa, palmier à huile (huile de palme), coton, thé, quinquina.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Pêche et élevage</div>
<p><strong>Pêche :</strong> pêche continentale (fleuves, lacs) très importante ; pêche maritime sur la côte atlantique (limitée par le littoral étroit). Potentialités : nombreux plans d'eau. Limites : matériel traditionnel, faible encadrement.</p>
<p><strong>Élevage :</strong> bovins, ovins, caprins, porcins, volaille. Limites : maladies (trypanosomiase), faible technicité, pâturages non aménagés.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Exploitation forestière</div>
<p>La RDC possède une vaste forêt, deuxième massif tropical du monde. Le bois (grumes, sciages) est exporté en partie brute, ce qui limite la valeur ajoutée. Une transformation locale est un enjeu économique important.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Classe ces productions : manioc, café, maïs, cacao, riz, hévéa (vivrier / rente).</p>
<p><strong>Ex. 2 :</strong> Cite deux limites de l'élevage congolais.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Vivrier : manioc, maïs, riz. Rente : café, cacao, hévéa.</p>
<p><strong>2)</strong> Maladies du bétail, faible technicité.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'agriculture congolaise est diversifiée mais faiblement productive ; pêche et élevage ont un fort potentiel insuffisamment valorisé.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de géographie (CB2) ; manuels scolaires.</div>
    `
},
{
    title: "Leçon 11 — Mines, industrie et énergie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« La RDC est riche en minerais, mais pourquoi sa population reste-t-elle pauvre ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les ressources minières. Comprendre la faiblesse industrielle. Analyser le potentiel énergétique.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Ressources minières</div>
<p>La RDC est l'un des pays les plus riches du monde en ressources minières :</p>
<ul>
<li><strong>Cuivre :</strong> Katanga (Lualaba, Haut-Katanga).</li>
<li><strong>Cobalt :</strong> souvent associé au cuivre, essentiel pour les batteries.</li>
<li><strong>Diamant :</strong> Kasaï.</li>
<li><strong>Or :</strong> Ituri, Kivu, Maniema.</li>
<li><strong>Coltan :</strong> Kivu, utilisé dans l'électronique.</li>
<li>Autres : cassitérite, zinc, manganèse, uranium, pétrole (côte atlantique).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Industrie manufacturière</div>
<p>L'industrie de transformation est faible : quelques unités agro-alimentaires, textiles, cimenteries, brasseries. Les causes : manque d'énergie, d'infrastructures, de capitaux, de main-d'œuvre qualifiée, instabilité. La RDC exporte les matières premières et importe les produits finis.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Énergie</div>
<ul>
<li><strong>Hydroélectricité :</strong> potentiel immense, notamment le site d'Inga sur le fleuve Congo. La production reste très inférieure au potentiel.</li>
<li><strong>Bois-énergie (charbon de bois) :</strong> principale source d'énergie domestique, cause de déforestation.</li>
<li><strong>Pétrole :</strong> production côtière limitée.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Impacts de l'exploitation minière</div>
<ul>
<li><strong>Environnementaux :</strong> pollution des sols et des eaux, destruction de sites.</li>
<li><strong>Sociaux :</strong> travail des enfants, déplacements de populations, conditions de travail difficiles.</li>
<li><strong>Économiques :</strong> dépendance aux cours mondiaux, faible transformation locale, évasion fiscale.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Associe chaque minerai à sa principale région d'exploitation : cuivre, diamant, coltan, or.</p>
