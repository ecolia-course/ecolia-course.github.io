const slides = [
{
    title: "Sommaire — Traumatologie du Sport 3e année",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours initie à la traumatologie sportive de base : blessures fréquentes, mécanismes lésionnels, premiers gestes, prévention et reprise de l'activité. Il est orienté vers la sécurité en milieu scolaire et ne se substitue pas à une formation médicale.</p>
<p><strong>Note de transparence :</strong> aucun programme officiel RDC spécifique de traumatologie du sport pour la 3e année HP n'a été localisé dans les sources consultées. L'option Éducation Physique des HPR existe ; ce cours est présenté comme une <strong>proposition pédagogique</strong> cohérente avec la formation d'un enseignant d'EPS, à valider par l'enseignant. Les gestes présentés restent élémentaires et ne constituent pas un traitement médical.</p>
<ul>
<li>Leçon 1 — Introduction : sport et traumatologie</li>
<li>Leçon 2 — Les mécanismes lésionnels</li>
<li>Leçon 3 — Les blessures des membres</li>
<li>Leçon 4 — Les blessures du tronc et de la tête</li>
<li>Leçon 5 — Les premiers gestes</li>
<li>Leçon 6 — La prévention en milieu scolaire</li>
<li>Leçon 7 — Reprise de l'activité et réadaptation</li>
<li>Leçon 8 — Synthèse et évaluation</li>
</ul>
<p>Une évaluation finale de 12 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme HPR (cadre général EPS) ; références générales en traumatologie sportive. Statut du programme RDC spécifique à valider.</div>
    `
},
{
    title: "Leçon 1 — Introduction : sport et traumatologie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certains sports provoquent-ils plus de blessures que d'autres ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la traumatologie du sport. Comprendre son utilité en milieu scolaire. Identifier les facteurs de risque généraux.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>La <strong>traumatologie du sport</strong> étudie les blessures liées à la pratique sportive : causes, mécanismes, conséquences, prévention et accompagnement de la reprise. En milieu scolaire, elle s'inscrit dans une démarche de sécurité et de protection des élèves.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Utilité en milieu scolaire</div>
<ul>
<li>Comprendre les risques liés à chaque activité.</li>
<li>Prévenir les accidents.</li>
<li>Réagir correctement en cas de blessure.</li>
<li>Accompagner la reprise de l'activité.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Facteurs de risque généraux</div>
<ul>
<li><strong>Liés à l'élève :</strong> fatigue, préparation insuffisante, antécédents.</li>
<li><strong>Liés à l'activité :</strong> contact, intensité, technique.</li>
<li><strong>Liés au milieu :</strong> terrain irrégulier, matériel défectueux, chaleur.</li>
<li><strong>Liés à l'encadrement :</strong> échauffement absent, consignes floues.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois facteurs de risque de blessure en milieu scolaire.</p>
<p><strong>Ex. 2 :</strong> Explique pourquoi un enseignant d'EPS doit connaître la traumatologie du sport.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Terrain irrégulier, absence d'échauffement, fatigue. <strong>2)</strong> Pour prévenir, réagir correctement et protéger la santé des élèves.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La traumatologie du sport en milieu scolaire sert à prévenir, réagir et accompagner les élèves blessés.</p></div>
<div class="sources"><strong>Sources :</strong> Programme HPR ; références générales.</div>
    `
},
{
    title: "Leçon 2 — Les mécanismes lésionnels",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment une cheville peut-elle se tordre ou un muscle se déchirer ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les principaux mécanismes lésionnels. Relier mécanisme et type de blessure. Adapter la prévention.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les mécanismes</div>
<ul>
<li><strong>Choc direct :</strong> impact sur une zone (chute, coup).</li>
<li><strong>Torsion :</strong> rotation forcée d'une articulation (cheville, genou).</li>
<li><strong>Étirement excessif :</strong> muscle ou ligament étiré au-delà de ses limites.</li>
<li><strong>Surcharge :</strong> répétition excessive d'un geste (tendinite).</li>
<li><strong>Hyperflexion / hyperextension :</strong> mouvement au-delà de l'amplitude normale.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Mise en relation</div>
<ul>
<li>Torsion → entorse, parfois fracture.</li>
<li>Étirement excessif → élongation, claquage.</li>
<li>Choc direct → contusion, fracture, commotion.</li>
<li>Surcharge → tendinite, contracture.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Associe chaque mécanisme à une blessure typique.</p>
<p><strong>Ex. 2 :</strong> Cite deux gestes sportifs qui exposent à la torsion du genou.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Torsion → entorse ; étirement → élongation ; choc → contusion. <strong>2)</strong> Changements de direction rapides, réceptions de saut.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Comprendre le mécanisme lésionnel aide à prévenir et à agir de façon adaptée.</p></div>
<div class="sources"><strong>Sources :</strong> Références générales en traumatologie sportive.</div>
    `
},
{
    title: "Leçon 3 — Les blessures des membres",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Quelles blessures touchent le plus souvent les genoux et les chevilles des jeunes sportifs ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les blessures les plus fréquentes des membres. Reconnaître leurs signes. Comprendre les principes de prise en charge élémentaire.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Blessures fréquentes</div>
<ul>
<li><strong>Entorse :</strong> étirement ou déchirure d'un ligament. Gonflement, douleur, difficulté à bouger.</li>
<li><strong>Élongation / claquage :</strong> atteinte du muscle. Douleur à l'effort, parfois sensation de déchirure.</li>
<li><strong>Contusion :</strong> choc direct sur une zone (bleu, gonflement).</li>
<li><strong>Fracture :</strong> rupture d'un os (douleur vive, déformation, impossibilité de bouger).</li>
<li><strong>Luxation :</strong> déplacement d'une articulation (épaule, doigts).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Signes d'alerte</div>
<ul>
<li>Douleur vive et persistante.</li>
<li>Gonflement rapide.</li>
<li>Impossibilité de bouger ou de s'appuyer.</li>
<li>Déformation visible.</li>
<li>Craquement perçu au moment du choc.</li>
</ul>
<p>Ces signes imposent l'arrêt de l'effort et l'orientation vers un professionnel de santé.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois blessures fréquentes des membres inférieurs.</p>
<p><strong>Ex. 2 :</strong> Décris les signes d'alerte d'une entorse de la cheville.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Entorse de la cheville, élongation des ischio-jambiers, fracture du tibia. <strong>2)</strong> Douleur, gonflement rapide, difficulté à s'appuyer sur le pied.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La douleur, le gonflement rapide et l'impossibilité de bouger sont des signaux à prendre au sérieux.</p></div>
<div class="sources"><strong>Sources :</strong> Références générales en traumatologie sportive.</div>
    `
},
{
    title: "Leçon 4 — Les blessures du tronc et de la tête",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Quels signes doivent faire craindre une commotion cérébrale après un choc à la tête ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Reconnaître les signes d'une commotion. Comprendre la prudence nécessaire face à un traumatisme du rachis. Adopter les bons réflexes.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Commotion cérébrale</div>
<p>La <strong>commotion cérébrale</strong> est un trouble temporaire du fonctionnement du cerveau après un choc à la tête. Signes possibles :</p>
<ul>
<li>maux de tête, vertiges, nausées ;</li>
<li>confusion, ralentissement, difficulté à se concentrer ;</li>
<li>troubles de la vision ou de l'équilibre ;</li>
<li>perte de mémoire immédiate ;</li>
<li>somnolence anormale.</li>
</ul>
<p>Tout choc à la tête avec signes suspects impose l'arrêt de l'activité et l'orientation vers un professionnel de santé.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Traumatismes du rachis</div>
<p>En cas de suspicion de traumatisme du rachis (chute sur la tête, choc violent), il ne faut <strong>pas déplacer</strong> l'élève sauf danger immédiat. Il faut alerter les secours et maintenir la tête en position stable.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Traumatismes thoraciques et abdominaux</div>
<p>Un choc au thorax ou à l'abdomen peut provoquer une douleur intense, un essoufflement anormal, une pâleur. L'élève doit arrêter l'effort et être orienté vers un professionnel de santé.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Conduite à tenir</div>
<ul>
<li>Arrêter l'activité.</li>
<li>Installer l'élève en sécurité, sans le déplacer inutilement.</li>
<li>Alerter un adulte responsable et les secours.</li>
<li>Rassurer l'élève.</li>
<li>Surveiller jusqu'à l'arrivée des secours.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois signes possibles d'une commotion cérébrale.</p>
<p><strong>Ex. 2 :</strong> Explique pourquoi il ne faut pas déplacer un élève suspect de traumatisme du rachis.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Maux de tête, confusion, vertiges. <strong>2)</strong> Pour éviter d'aggraver une éventuelle lésion de la moelle épinière.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un choc à la tête ou au rachis impose l'arrêt de l'activité, l'alerte et la prudence dans les gestes.</p></div>
<div class="sources"><strong>Sources :</strong> Références générales en traumatologie sportive.</div>
    `
},
{
    title: "Leçon 5 — Les premiers gestes",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Que faire dans les premières minutes qui suivent une blessure sportive ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les principes des premiers gestes. Adopter les bons réflexes. Éviter les gestes dangereux.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Principes généraux</div>
<ul>
<li><strong>Protéger :</strong> mettre l'élève en sécurité, écarter les autres.</li>
<li><strong>Alerter :</strong> prévenir un adulte responsable, la famille, les secours si besoin.</li>
<li><strong>Ne pas aggraver :</strong> ne pas mobiliser une zone suspecte, ne pas donner à boire à un élève inconscient.</li>
<li><strong>Rassurer :</strong> parler calmement, rester auprès de l'élève.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Gestes élémentaires pour une blessure des membres</div>
<p>Face à une blessure légère d'un membre (entorse, contusion), les gestes élémentaires associent :</p>
<ul>
<li><strong>Repos</strong> de la zone blessée.</li>
<li><strong>Glace</strong> (enveloppée dans un tissu) pour limiter le gonflement.</li>
<li><strong>Compression</strong> douce (bandage) sans serrer excessivement.</li>
<li><strong>Élévation</strong> du membre si possible.</li>
</ul>
<p>Ces gestes ne remplacent pas l'avis d'un professionnel de santé.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Gestes à éviter</div>
<ul>
<li>Forcer un élève à reprendre l'activité.</li>
<li>Masser fortement une zone blessée.</li>
<li>Appliquer de la chaleur immédiatement.</li>
<li>Percer une cloque ou une ampoule.</li>
<li>Donner un médicament sans autorisation.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les quatre principes généraux des premiers gestes.</p>
<p><strong>Ex. 2 :</strong> Décris les gestes élémentaires face à une entorse de la cheville.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Protéger, alerter, ne pas aggraver, rassurer. <strong>2)</strong> Repos, glace, compression douce, élévation, puis orientation vers un centre de santé.</p>
</details>

milieu scolaire. Comprendre les risques liés à chaque activité. Prévenir les accidents. Réagir correctement en cas de blessure. Accompagner la reprise de l'activité. Théorie, Facteurs de risque généraux. Liés à l'élève: fatigue, préparation insuffisante, antécédents. Liés à l'activité: contact, intensité, technique. Liés au milieu: terrain irrégulier, matériel défectueux, chaleur. Liés à l'encadrement: échauffement absent, consignes floues. Exercices. Ex. 1: Cite trois facteurs de risque de blessure en milieu scolaire. Ex. 2: Explique pourquoi un enseignant d'EPS doit connaître la traumatologie du sport. Corrigé. 1) Terrain irrégulier, absence d'échauffement, fatigue. 2) Pour prévenir, réagir correctement et protéger la santé des élèves. À retenir. La traumatologie du sport en milieu scolaire sert à prévenir, réagir et accompagner les élèves blessés."]],"3":[["fr","Leçon 2, Les mécanismes lésionnels. Situation. « Comment une cheville peut-elle se tordre ou un muscle se déchirer? ». Objectifs. Comprendre les principaux mécanismes lésionnels. Relier mécanisme et type de blessure. Adapter la prévention. Théorie, Les mécanismes. Choc direct: impact sur une zone (chute, coup). Torsion: rotation forcée d'une articulation (cheville, genou). Étirement excessif: muscle ou ligament étiré au-delà de ses limites. Surcharge: répétition excessive d'un geste (tendinite). Hyperflexion ou hyperextension: mouvement au-delà de l'amplitude normale. Théorie, Mise en relation. Torsion, donc entorse, parfois fracture. Étirement excessif, donc élongation, claquage. Choc direct, donc contusion, fracture, commotion. Surcharge, donc tendinite, contracture. Exercices. Ex. 1: Associe chaque mécanisme à une blessure typique. Ex. 2: Cite deux gestes sportifs qui exposent à la torsion du genou. Corrigé. 1) Torsion, donc entorse; étirement, donc élongation; choc, donc contusion. 2) Changements de direction rapides, réceptions de saut. À retenir. Comprendre le mécanisme lésionnel aide à prévenir et à agir de façon adaptée."]],"4":[["fr","Leçon 3, Les blessures des membres. Situation. « Quelles blessures touchent le plus souvent les genoux et les chevilles des jeunes sportifs? ». Objectifs. Identifier les blessures les plus fréquentes des membres. Reconnaître leurs signes. Comprendre les principes de prise en charge élémentaire. Théorie, Blessures fréquentes. Entorse: étirement ou déchirure d'un ligament. Gonflement, douleur, difficulté à bouger. Élongation ou claquage: atteinte du muscle. Douleur à l'effort, parfois sensation de déchirure. Contusion: choc direct sur une zone (bleu, gonflement). Fracture: rupture d'un os (douleur vive, déformation, impossibilité de bouger). Luxation: déplacement d'une articulation (épaule, doigts). Théorie, Signes d'alerte. Douleur vive et persistante. Gonflement rapide. Impossibilité de bouger ou de s'appuyer. Déformation visible. Craquement perçu au moment du choc. Ces signes imposent l'arrêt de l'effort et l'orientation vers un professionnel de santé. Exercices. Ex. 1: Cite trois blessures fréquentes des membres inférieurs. Ex. 2: Décris les signes d'alerte d'une entorse de la cheville. Corrigé. 1) Entorse de la cheville, élongation des ischio-jambiers, fracture du tibia. 2) Douleur, gonflement rapide, difficulté à s'appuyer sur le pied. À retenir. La douleur, le gonflement rapide et l'impossibilité de bouger sont des signaux à prendre au sérieux."]],"5":[["fr","Leçon 4, Les blessures du tronc et de la tête. Situation. « Quels signes doivent faire craindre une commotion cérébrale après un choc à la tête? ». Objectifs. Reconnaître les signes d'une commotion. Comprendre la prudence nécessaire face à un traumatisme du rachis. Adopter les bons réflexes. Théorie, Commotion cérébrale. La commotion cérébrale est un trouble temporaire du fonctionnement du cerveau après un choc à la tête. Signes possibles: maux de tête, vertiges, nausées; confusion, ralentissement, difficulté à se concentrer; troubles de la vision ou de l'équilibre; perte de mémoire immédiate; somnolence anormale. Tout choc à la tête avec signes suspects impose l'arrêt de l'activité et l'orientation vers un professionnel de santé. Théorie, Traumatismes du rachis. En cas de suspicion de traumatisme du rachis (chute sur la tête, choc violent), il ne faut pas déplacer l'élève sauf danger immédiat. Il faut alerter les secours et maintenir la tête en position stable. Théorie, Traumatismes thoraciques et abdominaux. Un choc au thorax ou à l'abdomen peut provoquer une douleur intense, un essoufflement anormal, une pâleur. L'élève doit arrêter l'effort et être orienté vers un professionnel de santé. Théorie, Conduite à tenir. Arrêter l'activité. Installer l'élève en sécurité, sans le déplacer inutilement. Alerter un adulte responsable et les secours. Rassurer l'élève. Surveiller jusqu'à l'arrivée des secours. Exercices. Ex. 1: Cite trois signes possibles d'une commotion cérébrale. Ex. 2: Explique pourquoi il ne faut pas déplacer un élève suspect de traumatisme du rachis. Corrigé. 1) Maux de tête, confusion, vertiges. 2) Pour éviter d'aggraver une éventuelle lésion de la moelle épinière. À retenir. Un choc à la tête ou au rachis impose l'arrêt de l'activité, l'alerte et la prudence dans les gestes."]],"6":[["fr","Leçon 5, Les premiers gestes. Situation. « Que faire dans les premières minutes qui suivent une blessure sportive? ». Objectifs. Connaître les principes des premiers gestes. Adopter les bons réflexes. Éviter les gestes dangereux. Théorie, Principes généraux. Protéger: mettre l'élève en sécurité, écarter les autres. Alerter: prévenir un adulte responsable, la famille, les secours si besoin. Ne pas aggraver: ne pas mobiliser une zone suspecte, ne pas donner à boire à un élève inconscient. Rassurer: parler calmement, rester auprès de l'élève. Théorie, Gestes élémentaires pour une blessure des membres. Face à une blessure légère d'un membre (entorse, contusion), les gestes élémentaires associent: Repos de la zone blessée. Glace (enveloppée dans un tissu) pour limiter le gonflement. Compression douce (bandage) sans serrer excessivement. Élévation du membre si possible. Ces gestes ne remplacent pas l'avis d'un professionnel de santé. Théorie, Gestes à éviter. Forcer un élève à reprendre l'activité. Masser fortement une zone blessée. Appliquer de la chaleur immédiatement. Percer une cloque ou une ampoule. Donner un médicament sans autorisation. Exercices. Ex. 1: Cite les quatre principes généraux des premiers gestes. Ex. 2: Décris les gestes élémentaires face à une entorse de la cheville. Corrigé. 1) Protéger, alerter, ne pas aggraver, rassurer. 2) Repos, glace, compression douce, élévation, puis orientation vers un centre de santé. À retenir. Les premiers gestes protègent l'élève en attendant les secours: ils ne remplacent jamais un avis médical."]],"7":[["fr","Leçon 6, La prévention en milieu scolaire. Situation. « Comment organiser une séance d'EPS pour éviter au maximum les blessures? ». Objectifs. Identifier les mesures de prévention. Concevoir une fiche de sécurité. Sensibiliser les élèves au fair-play. Théorie, Mesures de prévention. Échauffement adapté à l'activité et à l'âge. Terrain vérifié (pas de trous, de cailloux, de débris). Matériel en bon état (ballons, plots, tapis). Consignes claires et comprises. Surveillance active pendant l'activité. Adaptation au niveau de chaque élève. Théorie, Fair-play et sécurité. Les règles du jeu et le fair-play sont des mesures de sécurité: respect de l'adversaire, refus de la violence, respect de l'arbitre, contrôle de ses émotions. Théorie, Fiche de sécurité. Une fiche de sécurité pour une séance d'EPS comporte: lieu et horaire; effectif et niveau; activité prévue; matériel vérifié; risques identifiés et mesures prévues; numéros d'urgence et contacts. Exercices. Ex. 1: Cite trois mesures de prévention avant une séance d'EPS. Ex. 2: Rédige une fiche de sécurité pour une séance de football dans la cour. Corrigé. 1) Vérifier le terrain, préparer l'échauffement, vérifier le matériel. 2) La fiche doit préciser le lieu, l'effectif, le matériel, les risques et les contacts d'urgence. À retenir. La prévention repose sur la préparation, la surveillance et le respect des règles."]],"8":[["fr","Leçon 7, Reprise de l'activité et réadaptation. Situation. « Quand et comment un élève blessé peut-il reprendre le sport? ». Objectifs. Comprendre les principes de la reprise. Identifier les étapes progressives. Adapter l'activité aux capacités de l'élève. Théorie, Principes de reprise. Attendre l'accord du professionnel de santé. Reprendre progressivement, par étapes. Commencer par des activités douces (natation, marche). Éviter les gestes qui ont causé la blessure au début. Surveiller les signes de douleur. Théorie, Étapes de reprise. Reprise en cours d'EPS adapté (sans compétition ni contact). Réintégration progressive dans les activités normales. Retour complet après consolidation. Théorie, Rôle de l'enseignant. L'enseignant d'EPS adapte les activités pour ne pas exclure l'élève blessé: il peut lui confier des rôles d'arbitre, de chronométreur, d'observateur, ou lui proposer des exercices adaptés. Il ne décide pas de la reprise: celle-ci relève du professionnel de santé. Exercices. Ex. 1: Cite trois principes de la reprise après blessure. Ex. 2: Propose deux rôles qu'un élève blessé peut tenir pendant une séance d'EPS. Corrigé. 1) Accord médical, progressivité, surveillance. 2) Arbitre, chronométreur, observateur. À retenir. La reprise se fait progressivement, après accord médical, avec adaptation de l'activité."]],"9":[["fr","Leçon 8, Synthèse et évaluation. Objectifs. Réviser les acquis. Préparer l'évaluation finale. Révision, Notions clés. Traumatologie sportive: étude des blessures liées au sport. Mécanismes: choc, torsion, étirement, surcharge. Blessures des membres: entorse, élongation, fracture. Blessures du tronc et de la tête: commotion, prudence rachis. Premiers gestes: protéger, alerter, ne pas aggraver, rassurer. Prévention: échauffement, terrain, matériel, fair-play. Reprise: progressive, après accord médical. Exercices de synthèse. Ex. 1: Analyse un cas de blessure en milieu scolaire: identifie le mécanisme, la blessure probable et les gestes à faire. Ex. 2: Propose une fiche de prévention pour une activité à risque (football, saut). Corrigé indicatif. L'analyse doit relier mécanisme, blessure et conduite à tenir, en renvoyant vers le professionnel de santé. À retenir. La traumatologie du sport en milieu scolaire combine prévention, premiers gestes et accompagnement de la reprise."]],"10":[["fr","Évaluation finale, Traumatologie du Sport 3e année. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 7 points sur 12, tu as réussi. En dessous, revois les leçons indiquées."]]}};

          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
