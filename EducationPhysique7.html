<div class="sources"><strong>Sources :</strong> Programmes nationaux du ministère de l'Éducation nationale et Nouvelle Citoyenneté (RDC). Direction des sports et des activités parascolaires. Wikimedia Commons (fiches des images).</div>

{
    title: "Leçon 1 : Découverte de l'éducation physique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une école de Kinshasa, un élève pense que l'éducation physique sert seulement à gagner des compétitions. Son professeur lui explique que l'activité physique aide à la santé, à la concentration et à la vie en groupe.</p></div>
<img alt="Séance scolaire d'éducation physique" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_1">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Séance d'éducation physique — Wikimedia Commons : Physical education class.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Expliquer l'importance de l'activité physique. Distinguer activité physique, sport et jeu. Respecter les règles de sécurité. Adopter un comportement responsable en groupe.</p>
</div>

<h3>2. Contenu : pourquoi l'éducation physique ?</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'éducation physique développe le corps et l'esprit. Elle améliore la santé, l'endurance, la coordination et la confiance en soi. Elle apprend aussi à coopérer, à respecter les règles et à accepter les résultats d'un jeu.</p>
<p>Vocabulaire : activité physique, sport, jeu, coopération, fair-play, sécurité.</p>
<p>Trois bienfaits principaux : le corps devient plus fort et plus souple ; la concentration en classe s'améliore ; l'esprit d'équipe se développe.</p>
</div>
<img alt="Terrain d'école avec élèves en activité" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_2">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Terrain d'école — Wikimedia Commons : School yard in Africa.jpg.</p>

<h3>3. Règles de sécurité</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Avant toute activité : vérifier que le terrain est dégagé (pas de cailloux, de trous ou d'objets coupants) ; porter des vêtements adaptés ; retirer bijoux et objets dangereux. Pendant l'activité : respecter les consignes, ne pas bousculer, boire régulièrement de l'eau. S'arrêter immédiatement en cas de douleur, de vertige ou de malaise.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Jeu collectif dans la cour :</p>
<p><strong>Consigne :</strong> former deux équipes équilibrées, délimiter un espace avec des plots ou des lignes tracées, rappeler les règles de sécurité.</p>
<p><strong>Déroulement :</strong> un jeu de passes simples, sans contact physique.</p>
<p><strong>Bilan :</strong> chaque équipe indique ce qui a bien fonctionné et ce qui doit être amélioré.</p>
<img alt="Élèves en activité collective dans une cour d'école" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_3">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Élèves en activité collective — Wikimedia Commons : Students playing in school yard.jpg.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Cite trois bienfaits de l'activité physique et trois règles de sécurité.</p>
<p><strong>Corrigé :</strong> Bienfaits : santé, concentration, esprit d'équipe. Règles : vérifier le terrain, porter des vêtements adaptés, s'arrêter en cas de douleur.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Croire que l'éducation physique sert uniquement à gagner des compétitions. Négliger la sécurité. Utiliser l'exercice comme punition. Comparer les performances sans tenir compte des différences individuelles.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>

</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'éducation physique développe le corps et l'esprit. Elle apprend à coopérer, à respecter les règles et à prendre soin de sa santé. La sécurité est la première priorité.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'éducation physique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>

    title: "Leçon 2 : Échauffement et retour au calme",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une classe commence directement un jeu de ballon, sans préparation. Un élève ressent une douleur au mollet. Le professeur rappelle que l'échauffement est indispensable avant tout effort.</p></div>
<img alt="Échauffement scolaire en groupe" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_4">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Échauffement scolaire — Wikimedia Commons : Students warming up.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Préparer progressivement le corps à l'effort. Réaliser un échauffement complet et adapté. Retrouver le calme après l'activité.</p>
</div>

<h3>2. Contenu : les trois temps d'une séance</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une séance d'éducation physique comporte trois temps :</p>
<ul>
<li><strong>L'échauffement</strong> : marche active, mouvements articulaires doux, mobilisation progressive.</li>
<li><strong>L'activité principale</strong> : jeu, parcours, exercice ciblé.</li>
<li><strong>Le retour au calme</strong> : respiration lente, étirements doux, récupération.</li>
</ul>
<p>Vocabulaire : échauffement, articulation, mobilisation, retour au calme, récupération.</p>
</div>
<img alt="Marche active en groupe scolaire" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_5">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Marche active en groupe — Wikimedia Commons : Group walking exercise.jpg.</p>

<h3>3. L'échauffement en pratique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'échauffement dure environ 5 à 10 minutes. Il commence par la marche, puis la course légère, puis des mouvements de rotation (chevilles, genoux, hanches, épaules, cou). Il se termine par quelques accélérations progressives.</p>
<p>Le retour au calme dure 3 à 5 minutes : on ralentit progressivement, on respire profondément, on étire doucement les jambes et les bras.</p>
</div>
<img alt="Exercices doux de mobilité pour élèves" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_6">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Exercices doux de mobilité — Wikimedia Commons : Stretching exercise.jpg.</p>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Séance type de 30 minutes :</p>
<p><strong>0-8 min :</strong> échauffement (marche, rotations, course légère).</p>
<p><strong>8-25 min :</strong> activité principale (jeu de ballon adapté).</p>
<p><strong>25-30 min :</strong> retour au calme (respiration, étirements doux).</p>
<img alt="Enfants s'étirant calmement à la fin d'une séance" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_7">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Étirements après l'effort — Wikimedia Commons : Children stretching after exercise.jpg.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Remets dans l'ordre les étapes d'une séance : activité principale, échauffement, retour au calme.</p>
<p><strong>Corrigé :</strong> 1) Échauffement. 2) Activité principale. 3) Retour au calme.</p>
</div>

<h3>4. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Commencer directement par un effort intense. Sauter l'échauffement. Terminer sans retour au calme. Ignorer les signaux du corps (douleur, essoufflement excessif).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Avec ta classe, réalise un échauffement complet, puis une activité modérée, puis un retour au calme. Observe tes sensations à chaque étape.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une séance d'éducation physique suit trois temps : échauffement, activité principale, retour au calme. L'échauffement prépare le corps et réduit le risque de blessure. Le retour au calme favorise la récupération.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'éducation physique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `

<div class="bloc cas"><div class="bloc-label">Situation</div><p>Sur un terrain dégagé, un élève doit suivre un parcours balisé : marcher, courir, s'arrêter, changer de direction. Il trébuche parce qu'il va trop vite. Comment améliorer sa coordination ?</p></div>
<img alt="Parcours moteur scolaire simple" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_8">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Parcours moteur scolaire — Wikimedia Commons : Obstacle course for children.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Améliorer l'équilibre et l'orientation. Coordonner les mouvements des bras et des jambes. Contrôler ses déplacements.</p>
</div>

<h3>2. Contenu : les déplacements de base</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les principaux déplacements :</p>
<ul>
<li><strong>Marcher</strong> : déplacement calme, pieds alternés.</li>
<li><strong>Courir à allure modérée</strong> : déplacement rapide mais contrôlé.</li>
<li><strong>S'arrêter</strong> : freiner progressivement, garder l'équilibre.</li>
<li><strong>Changer de direction</strong> : pivoter sans perdre l'équilibre.</li>
<li><strong>Coordonner</strong> : balancer les bras en opposition avec les jambes.</li>
</ul>
<p>La coordination se travaille par des exercices progressifs et répétés.</p>
</div>
<img alt="Exercice d'équilibre pour enfants" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_9">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Exercice d'équilibre — Wikimedia Commons : Balance exercise for children.jpg.</p>

<h3>3. Le parcours moteur</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un parcours moteur simple peut comporter : une ligne droite à suivre, un slalom entre des plots, un saut léger, un arrêt net, un changement de direction. Le parcours se réalise sans bousculer les autres et à allure contrôlée.</p>

<p>1) Marcher 5 mètres sur une ligne.</p>
<p>2) Courir doucement entre trois plots espacés.</p>
<p>3) S'arrêter net et rester en équilibre sur un pied pendant 3 secondes.</p>
<p>4) Changer de direction et revenir au point de départ.</p>
<img alt="Enfant en équilibre sur un pied" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_11">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Équilibre sur un pied — Wikimedia Commons : Child balancing on one foot.jpg.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Suis un parcours balisé sans bousculer les autres et à allure contrôlée.</p>
<p><strong>Critère de réussite :</strong> ne pas trébucher, garder l'équilibre, respecter le parcours.</p>
</div>

<h3>4. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Privilégier la vitesse au détriment du contrôle. Regarder ses pieds plutôt que devant. Bousculer les autres. Abandonner dès la première difficulté.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Trace un parcours simple avec ta classe et réalise-le en variant les vitesses (marche, course modérée).</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La coordination s'améliore par la répétition d'exercices progressifs. On contrôle sa vitesse, on garde l'équilibre et on respecte les autres. La qualité du mouvement compte plus que la vitesse.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'éducation physique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 4 : Courses et endurance adaptée",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève veut courir le plus vite possible dès le départ et s'arrête essoufflé après 30 secondes. Comment apprendre à gérer son effort sur une distance plus longue ?</p></div>
<img alt="Course scolaire en groupe" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_12">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Course scolaire — Wikimedia Commons : Children running race.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Contrôler son allure. Maintenir un effort modéré selon ses capacités. Adapter sa respiration. Gérer la récupération après l'effort.</p>
</div>

<h3>2. Contenu : courir longtemps sans s'épuiser</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'endurance est la capacité à maintenir un effort modéré pendant une durée prolongée. Pour améliorer son endurance :</p>
<ul>
<li>Choisir une allure régulière, ni trop rapide ni trop lente.</li>
<li>Respirer profondément et régulièrement.</li>
<li>Ne pas sprinter au départ.</li>
<li>Augmenter progressivement la durée, pas la vitesse.</li>
</ul>
<p>Vocabulaire : endurance, allure, respiration, récupération.</p>
</div>
<img alt="Marche rapide ou course modérée d'élèves" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_13">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Marche rapide ou course modérée — Wikimedia Commons : Jogging for children.jpg.</p>

<h3>3. Adapter l'exercice à chacun</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Chaque élève progresse à son rythme. Certains courent 5 minutes, d'autres 10. L'essentiel est de maintenir une allure confortable, de respirer et de s'arrêter si nécessaire. Comparer les performances entre élèves sans tenir compte des différences individuelles est injuste et dangereux.</p>
</div>
<img alt="Relais en équipe d'élèves" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_14">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Relais en équipe — Wikimedia Commons : Relay race children.jpg.</p>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Exercice progressif sur 10 minutes :</p>
<p><strong>Min 1-2 :</strong> marche rapide.</p>
<p><strong>Min 3-6 :</strong> course à allure modérée (on peut encore parler).</p>
<p><strong>Min 7-8 :</strong> marche rapide.</p>
<p><strong>Min 9-10 :</strong> marche calme puis étirements.</p>
<p><strong>Observation :</strong> si l'élève est essoufflé au point de ne plus parler, il doit ralentir.</p>
<img alt="Circuit balisé pour course scolaire" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_15">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Circuit balisé — Wikimedia Commons : Circuit training students.jpg.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Parcours un circuit à allure régulière pendant 5 minutes, puis décris tes sensations.</p>
<p><strong>Critère de réussite :</strong> allure constante, respiration régulière, capacité à parler pendant l'effort.</p>
</div>

<h3>4. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Partir trop vite. Comparer sa performance à celle des autres. Forcer malgré une douleur ou un essoufflement excessif. Négliger la récupération après l'effort.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Organise avec ta classe un circuit d'endurance adapté à tous. Chacun choisit son allure et note sa durée.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'endurance s'améliore par un effort modéré et régulier. On adapte son allure à ses capacités, on respire profondément et on s'arrête si nécessaire. Chaque élève progresse à son rythme.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'éducation physique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 5 : Sauts, bonds et impulsion",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Sur un terrain plat, un élève veut sauter le plus loin possible. Il retombe mal sur ses pieds et perd l'équilibre. Comment réussir un saut maîtrisé ?</p></div>
<img alt="Saut scolaire sur sol adapté" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_16">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Saut scolaire — Wikimedia Commons : Children jumping.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Coordonner l'impulsion, le mouvement et la réception. Améliorer l'équilibre et la coordination. Contrôler la réception.</p>
</div>

<h3>2. Contenu : les phases du saut</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un saut comporte trois phases :</p>
<ul>
<li><strong>L'impulsion</strong> : poussée avec les jambes, balancement des bras vers le haut.</li>
<li><strong>Le vol</strong> : phase aérienne, courte, avec le corps groupé ou tendu.</li>
<li><strong>La réception</strong> : atterrissage sur les deux pieds, genoux fléchis, équilibre conservé.</li>
</ul>
<p>Vocabulaire : impulsion, élan, réception, équilibre.</p>
</div>
<img alt="Démonstration de réception après saut" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_17">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Réception après saut — Wikimedia Commons : Long jump landing.jpg.</p>

<h3>3. Sécurité du saut</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>On saute sur un sol plat, dégagé, sans cailloux ni objets dangereux. La réception se fait sur les deux pieds, genoux légèrement fléchis pour amortir. On ne saute jamais sur un sol dur ou glissant. On ne cherche pas la distance maximale avant de maîtriser la réception.</p>
</div>
<img alt="Exercice de coordination avec saut" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_18">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Exercice de coordination avec saut — Wikimedia Commons : Coordination exercise jumping.jpg.</p>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Saut en longueur progressive :</p>
<p>1) Sauter sur place, pieds joints, plusieurs fois.</p>
<p>2) Sauter d'un plot bas vers l'avant, réception sur deux pieds.</p>
<p>3) Sauter d'un peu plus loin, en fléchissant bien les genoux à la réception.</p>
<p><strong>Observation :</strong> l'élève garde l'équilibre et ne retombe pas en arrière.</p>
<img alt="Saut depuis un plot bas" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_19">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Saut depuis un plot bas — Wikimedia Commons : Jump from a low platform.jpg.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Observe une démonstration de saut et décris les trois phases.</p>
<p><strong>Corrigé :</strong> impulsion, vol, réception.</p>
</div>

<h3>4. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Chercher la distance maximale avant de maîtriser la réception. Sauter sur un sol dur. Retomber sur un seul pied. Tendre les jambes à la réception.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>En binôme, observez-vous mutuellement sauter. Chacun indique à l'autre si les trois phases sont respectées.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un saut comporte trois phases : impulsion, vol, réception. La réception se fait sur les deux pieds, genoux fléchis, pour amortir. On ne cherche pas la distance maximale avant de maîtriser la réception.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'éducation physique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 6 : Lancer, recevoir et manipuler un ballon",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Deux élèves se font des passes avec un ballon souple. L'un d'eux lance trop fort et le ballon frappe son camarade au visage. Comment lancer et recevoir en sécurité ?</p></div>
<img alt="Élèves faisant des passes avec un ballon souple" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_20">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Élèves faisant des passes — Wikimedia Commons : Children playing with ball.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Développer la précision et la coordination oeil-main. Lancer et recevoir correctement. Respecter les distances de sécurité.</p>
</div>

<h3>2. Contenu : lancer et réception</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Pour lancer correctement : regarder vers la cible, placer les pieds écartés, balancer les bras, lancer avec un mouvement fluide. Pour recevoir : se placer face au ballon, tendre les mains en coupe, accompagner le ballon vers soi pour amortir.</p>
<p>Règles de sécurité : on ne lance jamais vers le visage ; on ne lance pas à une personne qui ne regarde pas ; on respecte une distance suffisante.</p>
<p>Vocabulaire : lancer, réception, coordination oeil-main, distance de sécurité.</p>
</div>
<img alt="Réception à deux mains d'un ballon" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_21">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Réception à deux mains — Wikimedia Commons : Catching a ball with both hands.jpg.</p>

<h3>3. Les passes en binôme</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>En binôme, les élèves se placent à 3 mètres l'un de l'autre. L'un lance, l'autre reçoit en coupe, puis relance. On peut varier : lancer à une main, à deux mains, par rebond. L'essentiel est de contrôler la force et la direction.</p>
</div>
<img alt="Exercice de passes en binôme" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_22">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Passes en binôme — Wikimedia Commons : Passing a ball in pair.jpg.</p>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Série de 10 passes :</p>
<p><strong>Consigne :</strong> chaque binôme réussit 10 passes sans faire tomber le ballon.</p>
<p><strong>Variante :</strong> après chaque passe, faire un petit pas de côté.</p>
<p><strong>Observation :</strong> si le ballon tombe souvent, réduire la distance ou ralentir le rythme.</p>
<img alt="Exercice de lancer en binôme scolaire" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_23">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Exercice de lancer en binôme — Wikimedia Commons : Ball throwing exercise.jpg.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Réussis 10 passes consécutives avec ton binôme, à 3 mètres de distance.</p>
<p><strong>Critère de réussite :</strong> le ballon ne tombe pas, les lancers sont contrôlés, la distance est respectée.</p>
</div>

<h3>4. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Lancer vers le visage. Lancer à une personne qui ne regarde pas. Lancer trop fort sans contrôle. Recevoir avec les doigts tendus au lieu de les plier légèrement.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>En binôme, faites une série de passes en variant les distances. Notez le nombre de passes réussies sans chute.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Lancer et recevoir demandent précision et contrôle. On regarde vers la cible, on lance avec un mouvement fluide, on reçoit en coupe. On ne lance jamais vers le visage ni à une personne qui ne regarde pas.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'éducation physique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 7 : Initiation au football",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un petit match, un élève garde le ballon trop longtemps sans passer à ses camarades. L'équipe perd le ballon. Comment apprendre à jouer collectivement ?</p></div>
<img alt="Exercice de passes de football scolaire" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_24">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Football scolaire — Wikimedia Commons : Children playing football.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Maîtriser les gestes fondamentaux du football. Jouer collectivement. Respecter les règles et le fair-play.</p>
</div>

<h3>2. Contenu : les gestes fondamentaux</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<ul>
<li><strong>Conduite de balle</strong> : avancer avec le ballon en le gardant proche du pied.</li>
<li><strong>Passe</strong> : transmettre le ballon à un partenaire, du pied intérieur ou extérieur.</li>
<li><strong>Contrôle</strong> : arrêter le ballon avec le pied, la cuisse ou la poitrine.</li>
<li><strong>Tir</strong> : envoyer le ballon vers le but.</li>
<li><strong>Déplacement</strong> : se rendre disponible pour recevoir une passe.</li>
</ul>
<p>Vocabulaire : conduite, passe, contrôle, tir, démarquage, fair-play.</p>
</div>
<img alt="Conduite de balle par un élève" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_25">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Conduite de balle — Wikimedia Commons : Football dribbling drill.jpg.</p>

<h3>3. Règles simples et fair-play</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Règles de base à respecter : ne pas toucher le ballon avec les mains (sauf le gardien) ; ne pas bousculer un adversaire ; ne pas tacler dangereusement. Le fair-play signifie respecter l'adversaire, accepter les décisions de l'arbitre et féliciter les autres à la fin du match.</p>
</div>
<img alt="Match scolaire de football adapté" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_26">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Match scolaire de football — Wikimedia Commons : School football match.jpg.</p>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Exercice : passe puis déplacement.</p>
<p><strong>Consigne :</strong> en groupe de quatre, chaque élève passe le ballon à un camarade, puis se déplace pour proposer une nouvelle solution.</p>
<p><strong>Durée :</strong> 5 minutes.</p>
<p><strong>Variante :</strong> après 3 passes, l'équipe essaie de marquer dans un but délimité.</p>
<img alt="Exercice de passes avec déplacement" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_27">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Exercice de passes avec déplacement — Wikimedia Commons : Football passing exercise.jpg.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Effectue une passe puis déplace-toi pour recevoir à nouveau.</p>
<p><strong>Critère de réussite :</strong> la passe atteint le partenaire, le déplacement est utile, le jeu reste collectif.</p>
</div>

<h3>4. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Garder le ballon sans chercher à coopérer. Bousculer les autres. Négliger la sécurité. Se fâcher après une erreur d'un camarade.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Organise un petit match avec des équipes équilibrées. Chaque élève doit passer le ballon au moins une fois avant de pouvoir tirer.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le football repose sur des gestes simples : conduite, passe, contrôle, tir. Le jeu collectif est essentiel : on passe, on se déplace, on coopère. Le fair-play impose le respect de l'adversaire et des règles.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'éducation physique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 8 : Initiation aux jeux de ballon collectifs",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un jeu de ballon, certains élèves restent immobiles et attendent le ballon. D'autres courent partout sans se placer. Comment organiser un jeu collectif efficace ?</p></div>
<img alt="Jeu de passes scolaire en équipe" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_28">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Jeu de passes en équipe — Wikimedia Commons : Children playing team game.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Apprendre les principes de coopération et de placement. Respecter les règles. Adapter le jeu aux possibilités de la classe.</p>
</div>

<h3>2. Contenu : coopération et placement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Dans un jeu de ballon collectif :</p>
<ul>
<li><strong>Se placer</strong> : être disponible pour recevoir une passe, ni trop près ni trop loin.</li>
<li><strong>Communiquer</strong> : appeler le porteur du ballon, indiquer sa position.</li>
<li><strong>Passer</strong> : transmettre rapidement le ballon pour progresser.</li>
<li><strong>Défendre</strong> : gêner l'adversaire sans contact dangereux.</li>
</ul>
<p>Vocabulaire : coopération, placement, démarquage, communication.</p>
</div>
<img alt="Élèves coopérant dans un jeu collectif" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_29">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Élèves coopérant dans un jeu — Wikimedia Commons : Students cooperating in game.jpg.</p>

<h3>3. Adapter les règles</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Pour que tous les élèves participent, on peut adapter les règles : réduire la taille du terrain, interdire le contact physique, imposer un nombre minimum de passes avant de marquer, varier les ballons (plus souples, plus légers).</p>
</div>
<img alt="Jeu de ballon adapté aux élèves" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_30">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Jeu de ballon adapté — Wikimedia Commons : Adapted ball game.jpg.</p>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Jeu de conservation du ballon :</p>
<p><strong>But :</strong> conserver le ballon en équipe pendant 1 minute sans le perdre.</p>
<p><strong>Règles :</strong> pas de contact physique ; le ballon ne doit pas toucher le sol ; chaque joueur doit toucher le ballon au moins une fois.</p>
<p><strong>Observation :</strong> si l'équipe perd souvent le ballon, réduire la taille du terrain ou augmenter le nombre de joueurs.</p>
<img alt="Jeu de conservation du ballon en classe" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_31">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Jeu de conservation du ballon — Wikimedia Commons : Ball conservation game.jpg.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>

    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Pendant une fête scolaire, un groupe d'élèves présente une séquence de mouvements sur un rythme. Certains suivent mal le tempo. Comment synchroniser les mouvements en groupe ?</p></div>
<img alt="Expression corporelle en groupe scolaire" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_32">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Expression corporelle en groupe — Wikimedia Commons : Children dancing in school.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Coordonner les mouvements avec un rythme. Synchroniser les gestes en groupe. Respecter les différences culturelles et les rythmes d'apprentissage.</p>
</div>

<h3>2. Contenu : rythme et mouvements</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le rythme organise les mouvements dans le temps. On peut le marquer par des frappes de mains, de pieds, ou par un instrument. Une séquence corporelle comporte plusieurs mouvements répétés sur une pulsation régulière.</p>
<p>Vocabulaire : rythme, pulsation, coordination, synchronisation, expression corporelle.</p>
</div>
<img alt="Danse rythmée d'élèves" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_33">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Danse rythmée d'élèves — Wikimedia Commons : Dance performance by children.jpg.</p>

<h3>3. Créer une séquence</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Pour créer une séquence simple :</p>
<ul>
<li>Choisir une pulsation régulière (par exemple 4 temps).</li>
<li>Associer un mouvement à chaque temps : saut, frappe, pas de côté, mouvement de bras.</li>
<li>Répéter la séquence plusieurs fois.</li>
<li>Ajouter éventuellement un déplacement simple.</li>
</ul>
<p>Chacun apprend à son rythme. On ne se moque jamais d'un camarade.</p>
</div>
<img alt="Activité collective rythmée d'élèves" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_34">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Activité collective rythmée — Wikimedia Commons : Group dance activity.jpg.</p>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Séquence de 4 temps :</p>
<p>Temps 1 : frapper des mains.</p>
<p>Temps 2 : sauter sur place.</p>
<p>Temps 3 : frapper des mains.</p>
<p>Temps 4 : poser une main sur la hanche.</p>
<p>Répéter la séquence 8 fois, puis changer de mouvement.</p>
<img alt="Élèves exécutant une séquence rythmée" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_35">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Séquence rythmée d'élèves — Wikimedia Commons : Students performing dance.jpg.</p>

</div>

<h3>4. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>

</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le rythme organise les mouvements dans le temps. Une séquence corporelle associe des mouvements à une pulsation régulière. On respecte le rythme d'apprentissage de chacun.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'éducation physique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>

    title: "Leçon 10 : Jeux collectifs, coopération et fair-play",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un relais est organisé dans la cour. Une équipe gagne mais certains de ses membres ont triché. Une autre équipe a perdu mais tous ses membres ont participé. Quelle équipe a réellement réussi ?</p></div>
<img alt="Relais scolaire en équipe" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_36">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Relais scolaire en équipe — Wikimedia Commons : Relay race in school.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Coopérer avec ses camarades. Respecter les règles et les adversaires. Accepter calmement les résultats d'un jeu.</p>
</div>

<h3>2. Contenu : coopération et fair-play</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Dans un jeu collectif :</p>
<ul>
<li><strong>Coopération</strong> : chacun aide les autres à réussir.</li>
<li><strong>Respect des règles</strong> : on joue honnêtement.</li>
<li><strong>Respect des adversaires</strong> : on ne les insulte pas, on ne les blesse pas.</li>
<li><strong>Fair-play</strong> : on accepte la victoire comme la défaite avec calme.</li>
<li><strong>Arbitrage simple</strong> : on reconnaît l'autorité de l'arbitre.</li>
</ul>
<p>Vocabulaire : coopération, fair-play, arbitrage, respect, honnêteté.</p>
</div>
<img alt="Poignée de main entre élèves après un jeu" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_37">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Poignée de main après un jeu — Wikimedia Commons : Handshake after a game.jpg.</p>

<h3>3. Résoudre les désaccords</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>En cas de désaccord pendant un jeu : s'arrêter, écouter les deux versions, rappeler la règle, décider ensemble d'une solution, reprendre le jeu calmement. La violence et les insultes n'ont pas leur place dans un jeu.</p>
</div>
<img alt="Élèves discutant calmement sur un terrain" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_38">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Élèves discutant calmement — Wikimedia Commons : Students talking on field.jpg.</p>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Analyse d'un désaccord :</p>
<p><strong>Situation :</strong> deux élèves se disputent une faute commise pendant un match.</p>
<p><strong>Solution proposée :</strong> arrêter le jeu, interroger les deux joueurs et l'arbitre, rappeler la règle, décider ensemble, reprendre.</p>
<p><strong>Bilan :</strong> le jeu continue et les élèves gardent le respect mutuel.</p>
<img alt="Élèves se serrant la main après un match" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_39">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Poignée de main après un match — Wikimedia Commons : Children shaking hands after match.jpg.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Analyse un conflit de jeu et propose une résolution équitable.</p>
<p><strong>Corrigé :</strong> écouter les deux parties, rappeler la règle, décider ensemble, reprendre le jeu calmement.</p>
</div>

<h3>4. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Considérer la victoire comme plus importante que la sécurité et le respect. Tricher. Insulter l'adversaire. Se fâcher après une défaite.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Organise un relais par équipes. À la fin, chaque équipe félicite les autres et indique ce qui a bien fonctionné.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un jeu collectif repose sur la coopération et le respect. Le fair-play signifie accepter la victoire comme la défaite avec calme. Les désaccords se résolvent par le dialogue, jamais par la violence.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'éducation physique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>En pleine chaleur, un élève continue un exercice intense sans boire d'eau. Il ressent des vertiges et doit s'arrêter. Comment prévenir ce type d'incident ?</p></div>
<img alt="Pause d'hydratation lors d'une activité sportive" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_40">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Pause d'hydratation — Wikimedia Commons : Water break at school.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Adopter des habitudes favorables à la santé pendant l'activité physique. Reconnaître les signes de malaise. Préparer une séance sécurisée.</p>
</div>

<h3>2. Contenu : hygiène et hydratation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Pour pratiquer une activité physique en sécurité :</p>
<ul>
<li><strong>Boire de l'eau</strong> avant, pendant et après l'effort, en petites quantités régulières.</li>
<li><strong>Porter des vêtements adaptés</strong> : légers, confortables, propres.</li>
<li><strong>Se laver</strong> après l'activité pour prévenir les infections.</li>
<li><strong>Se reposer</strong> entre les efforts intenses.</li>
<li><strong>Prévoir l'ombre</strong> et un espace dégagé quand il fait très chaud.</li>
</ul>
<p>Vocabulaire : hydratation, hygiène, repos, sécurité.</p>
</div>
<img alt="Élèves buvant de l'eau pendant une pause" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_41">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Élèves buvant de l'eau — Wikimedia Commons : Children drinking water.jpg.</p>

<h3>3. Reconnaître les signes de malaise</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les signes qui imposent l'arrêt immédiat : douleur vive, vertige, nausée, essoufflement excessif, malaise, sueurs abondantes et froides. On s'arrête, on s'assoit à l'ombre, on boit de l'eau, on prévient l'enseignant.</p>
</div>
<img alt="Repos à l'ombre après un effort" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_42">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Repos à l'ombre — Wikimedia Commons : Rest in the shade.jpg.</p>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Préparation d'une séance en plein air :</p>
<p>1) Vérifier que le terrain est dégagé.</p>
<p>2) Prévoir un point d'eau à proximité.</p>
<p>3) Choisir un moment plus frais de la journée.</p>
<p>4) Prévoir des pauses régulières à l'ombre.</p>
<p>5) Rappeler les consignes de sécurité.</p>
<img alt="Vérification d'un terrain avant une activité" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="EP7_43">

questions.forEach(function(q) {
    if (!q.text) {
        q.text = q.question || q.q || q.enonce || q.titre || "";
    }
    if (typeof q.correct === 'undefined') {
        if (typeof q.answer !== 'undefined') q.correct = q.answer;
        else if (typeof q.reponse !== 'undefined') q.correct = q.reponse;
    }
});

let currentSlide = 0;
let lastSearchTerm = "", searchResults = [], currentResultIdx = -1;
const contentDiv = document.getElementById('content');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const slideCounterSpan = document.getElementById('slideCounter');
const progressFill = document.getElementById('progressFill');
const counterSpan = document.getElementById('counter');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchNav = document.getElementById('searchNav');
const prevResultBtn = document.getElementById('prevResultBtn');
const nextResultBtn = document.getElementById('nextResultBtn');
const resultCounterSpan = document.getElementById('resultCounter');
const pageTitle = document.getElementById('pageTitle');
pageTitle.textContent = "ECOLIA · " + COURSE_TITLE;
document.title = "ECOLIA — " + COURSE_TITLE;
function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';
    slideCounterSpan.textContent = '0/0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>

<script>
(function () {
  const jsonPath = "images_ecolia.json";
  fetch(jsonPath)
    .then(function (response) {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    })
    .then(function (images) {
      document.querySelectorAll("img[data-image-id]").forEach(function (img) {
        const id = img.getAttribute("data-image-id");
        const url = images[id];
        if (typeof url === "string" && url.length) {
          img.src = url;
        } else {
          console.warn("ECOLIA : lien absent pour", id);
        }
      });
    })
    .catch(function (error) {
      console.error("ECOLIA : impossible de charger images_ecolia.json", error);
    });
})();
</script>
