<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>La psychologie de la petite enfance t'apprend comment se développe l'enfant de 0 à 6 ans : son corps, son intelligence, ses émotions, son langage, ses relations. Tu découvriras ses besoins et le rôle de l'adulte qui l'accompagne. Ces connaissances sont la base du métier d'enseignant de maternelle.</p>

<li>Leçon 4 — L'attachement et la sécurité affective</li>
<li>Leçon 5 — La socialisation et le jeu</li>
<li>Leçon 6 — Le développement du langage</li>
<li>Leçon 7 — Les besoins fondamentaux</li>
<li>Leçon 8 — Les soins et l'hygiène du jeune enfant</li>
<li>Leçon 9 — Le rôle de l'adulte dans le développement</li>
<li>Leçon 10 — L'observation du jeune enfant</li>
<li>Leçon 11 — Les troubles du développement</li>
<li>Leçon 12 — Accueillir et accompagner le jeune enfant</li>
</ul>
<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme National des Humanités Pédagogiques Rénovées (RDC, MEPST) — UE PSY111 ; Piaget (stades du développement cognitif) ; Bowlby et Ainsworth (attachement) ; Vygotski (ZPD) ; UNICEF ; OMS/WASH (hygiène et santé en RDC).</div>
    `
},
{
    title: "Partie 1 — Le jeune enfant et son développement",
    content: `
<div class="bloc theorie"><div class="bloc-label">Partie 1</div>
<p><strong>Objectif de la partie :</strong> comprendre l'objet de la psychologie de la petite enfance, le développement physique et moteur, et le développement cognitif.</p>
<h3>Leçons de cette partie</h3>
<ul>
<li>Leçon 1 — Qu'est-ce que la psychologie de la petite enfance ?</li>
<li>Leçon 2 — Le développement physique et moteur</li>
<li>Leçon 3 — Le développement cognitif</li>
</ul>
</div>
    `
},
{
    title: "Leçon 1 — Qu'est-ce que la psychologie de la petite enfance ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un bébé pleure-t-il ? Pourquoi un enfant de 3 ans dit-il "non" ? Pourquoi un enfant de 5 ans pose-t-il mille questions ? La psychologie de la petite enfance cherche à comprendre. »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir la psychologie de la petite enfance. Distinguer ses objets. Comprendre son utilité pour l'enseignant. Prérequis : notions de psychologie générale.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>psychologie de la petite enfance</strong> est la branche de la psychologie qui étudie le développement de l'enfant de la naissance à environ 6 ans.</p>
<p>Elle étudie :</p>
<ul>
<li>le <strong>développement physique et moteur</strong> (croissance, motricité) ;</li>
<li>le <strong>développement cognitif</strong> (intelligence, perception, mémoire) ;</li>
<li>le <strong>développement affectif</strong> (émotions, attachement) ;</li>
<li>le <strong>développement social</strong> (relations, socialisation) ;</li>
<li>le <strong>développement langagier</strong> (communication).</li>
</ul>
<p>Son objectif : comprendre le développement pour mieux accompagner l'enfant. Pour l'enseignant, elle permet d'adapter les activités, les exigences et la relation à l'âge et aux besoins de l'enfant.</p>
</div>
<img src="images/PsychologieMaternelle1_1.jpg" alt="Jeune enfant qui joue" data-image-id="PsychologieMaternelle1_1" onerror="this.style.display='none'">

<h3>3. Définitions</h3>
<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Petite enfance :</strong> période de 0 à 6 ans.</p>
<p><strong>Développement :</strong> ensemble des transformations qui affectent l'enfant.</p>
<p><strong>Développement cognitif :</strong> intelligence, perception, mémoire.</p>
<p><strong>Développement affectif :</strong> émotions, attachement.</p>
<p><strong>Développement social :</strong> relations avec les autres.</p>
<p><strong>Développement langagier :</strong> acquisition du langage.</p>
</div>

<h3>4. Méthodes et applications</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>La psychologie de la petite enfance utilise : l'observation, les tests adaptés, les entretiens avec les parents, les études de cas. Elle s'appuie sur des théories (Piaget, Vygotski, Bowlby, Erikson) et sur la recherche. Elle est appliquée dans les crèches, les écoles maternelles, les familles, les centres de santé.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un enfant de 2 ans qui dit « non » à tout ne fait pas « exprès » : il traverse une étape normale de construction de son autonomie. Un enseignant qui connaît cette étape ne se fâche pas : il propose des choix limités (« Tu veux la balle rouge ou la bleue ? »). La psychologie de la petite enfance éclaire le comportement.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis la psychologie de la petite enfance en une phrase.</p>
<p><strong>Ex. 2 :</strong> Cite trois domaines du développement étudiés.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> La branche de la psychologie qui étudie le développement de l'enfant de 0 à 6 ans.</p>
<p><strong>2)</strong> Physique, cognitif, affectif, social, langagier (3 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La psychologie de la petite enfance étudie le développement global de l'enfant pour mieux l'accompagner.</p></div>

<div class="sources"><strong>Sources :</strong> Programme National HPR (UE PSY111) ; Piaget ; Vygotski ; UNICEF.</div>
    `
},
{
    title: "Leçon 2 — Le développement physique et moteur",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment un bébé passe-t-il de la position couchée à la marche ? Pourquoi un enfant de 3 ans ne peut-il pas encore écrire ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Connaître les grandes étapes de la croissance. Distinguer motricité globale et fine. Comprendre les besoins physiologiques. Prérequis : leçon 1.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Croissance :</strong> augmentation de la taille et du poids. Elle est rapide la première année, puis ralentit.</p>
<p><strong>Motricité globale :</strong> mouvements qui engagent tout le corps (s'asseoir, ramper, marcher, courir, sauter).</p>
<ul>
<li>Vers 3 mois : tient sa tête.</li>
<li>Vers 6 mois : s'assoit avec aide.</li>
<li>Vers 9-12 mois : se tient debout, commence à marcher.</li>
<li>Vers 2 ans : court, monte les escaliers.</li>
<li>Vers 4-5 ans : saute, lance, attrape.</li>
</ul>
<p><strong>Motricité fine :</strong> mouvements précis de la main et des doigts (saisir, pincer, dessiner, découper).</p>
<ul>
<li>Vers 6-9 mois : saisit avec la main entière.</li>
<li>Vers 12-18 mois : pince avec le pouce et l'index.</li>
<li>Vers 3-4 ans : dessine des bonshommes têtards.</li>
<li>Vers 5-6 ans : tient un crayon, découpe.</li>
</ul>
<p>Le développement moteur suit une séquence : <strong>céphalocaudale</strong> (de la tête vers les pieds) et <strong>proximo-distale</strong> (du centre vers les extrémités).</p>
</div>
<img src="images/PsychologieMaternelle1_2.jpg" alt="Motricité de l'enfant" data-image-id="PsychologieMaternelle1_2" onerror="this.style.display='none'">
<img src="images/PsychologieMaternelle1_13.jpg" alt="Pâte à modeler" data-image-id="PsychologieMaternelle1_13" onerror="this.style.display='none'">

<h3>3. Définitions</h3>
<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Motricité globale :</strong> mouvements du corps entier.</p>
<p><strong>Motricité fine :</strong> mouvements précis des doigts.</p>
<p><strong>Croissance :</strong> augmentation de la taille et du poids.</p>
<p><strong>Céphalocaudal :</strong> de la tête vers les pieds.</p>
<p><strong>Proximo-distal :</strong> du centre vers les extrémités.</p>
</div>

<h3>4. Méthodes et applications</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Favoriser la motricité globale : espace libre, jeux de mouvement, parcours, danse. Favoriser la motricité fine : jeux de construction, pâte à modeler, dessin, découpage, perles. Respecter le rythme : chaque enfant se développe à son rythme ; ne pas forcer.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Dans une école maternelle de Kinshasa, les enfants font des parcours de motricité (sauter, ramper, lancer), jouent avec de la pâte à modeler et découpent du papier. Ces activités développent la motricité globale et fine, préparent à l'écriture. L'enseignant observe les progrès de chaque enfant.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la différence entre motricité globale et motricité fine ?</p>
<p><strong>Ex. 2 :</strong> Cite deux étapes du développement moteur.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> La globale engage tout le corps ; la fine concerne les mouvements précis des doigts.</p>
<p><strong>2)</strong> Tenir sa tête (3 mois), marcher (12 mois) (2 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le développement moteur suit une séquence ; l'enseignant peut le favoriser par des activités adaptées.</p></div>

<div class="sources"><strong>Sources :</strong> Programme National HPR ; manuels de psychologie du développement.</div>
    `
},
{
    title: "Leçon 3 — Le développement cognitif",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un enfant de 3 ans croit-il que la lune le suit ? Pourquoi un enfant de 5 ans pense-t-il que l'eau change de quantité quand on change de verre ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Connaître les stades de Piaget. Comprendre la pensée du jeune enfant. Adapter les activités. Prérequis : leçons 1 et 2.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Jean Piaget a décrit les <strong>stades du développement cognitif</strong> :</p>
<ul>
<li><strong>Stade sensori-moteur (0-2 ans) :</strong> l'enfant explore le monde par les sens et les mouvements. Il développe la permanence de l'objet (l'objet existe même quand il ne le voit plus).</li>
<li><strong>Stade préopératoire (2-6/7 ans) :</strong> l'enfant développe la fonction symbolique (langage, jeu symbolique, dessin). Sa pensée est égocentrique (il a du mal à voir le point de vue des autres), animiste (il attribue une vie aux objets), irréversible (il ne comprend pas que l'on puisse revenir en arrière).</li>
</ul>
<p>L'enfant apprend par <strong>assimilation</strong> (intégrer une nouvelle information à ses schémas) et <strong>accommodation</strong> (modifier ses schémas). Vygotski insiste sur le rôle de l'interaction sociale et de la <strong>zone proximale de développement</strong> (ce que l'enfant peut faire avec de l'aide).</p>
</div>
<img src="images/PsychologieMaternelle1_3.jpg" alt="Stades de Piaget" data-image-id="PsychologieMaternelle1_3" onerror="this.style.display='none'">
<img src="images/PsychologieMaternelle1_14.jpg" alt="Jeu symbolique" data-image-id="PsychologieMaternelle1_14" onerror="this.style.display='none'">

<h3>3. Définitions</h3>
<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Stade :</strong> étape du développement.</p>
<p><strong>Permanence de l'objet :</strong> l'objet existe même hors de la vue.</p>
<p><strong>Fonction symbolique :</strong> capacité à représenter par des symboles.</p>
<p><strong>Égocentrisme :</strong> difficulté à prendre le point de vue d'autrui.</p>
<p><strong>Assimilation / accommodation :</strong> processus d'apprentissage.</p>
<p><strong>Zone proximale de développement :</strong> ce que l'enfant peut faire avec de l'aide.</p>
</div>

<h3>4. Méthodes et applications</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Adapter les activités au stade de l'enfant : concret, manipulable, court, ludique. Favoriser l'exploration : laisser l'enfant toucher, essayer, se tromper. Verbaliser : nommer ce que l'enfant fait, l'aider à comprendre. Jeu symbolique : favoriser le jeu de faire semblant.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un enfant de 4 ans joue à « la marchande » avec des feuilles et des cailloux. Il utilise la fonction symbolique. Il pense que la « marchandise » est réelle. L'enseignant l'accompagne, sans corriger brutalement. Le jeu est essentiel au développement cognitif.</p>
</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un bébé pleure-t-il quand sa mère s'en va ? Pourquoi certains enfants sont-ils plus rassurés que d'autres ? »</p></div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'<strong>attachement</strong> est le lien affectif privilégié qui unit l'enfant à une figure de soin (souvent la mère, mais aussi le père, la nourrice, un proche).</p>
<p>John Bowlby a montré que l'attachement est un <strong>besoin fondamental</strong> : le bébé a besoin d'une figure stable et réactive pour se sentir en sécurité.</p>
<p>Types d'attachement (Mary Ainsworth) : <strong>sécurisant</strong> (l'enfant explore quand la figure est présente, est consolé au retour), <strong>insécurisant-évitant</strong>, <strong>insécurisant-ambivalent</strong>, <strong>désorganisé</strong>.</p>
<p>Un attachement sécurisant favorise l'exploration, la confiance, la socialisation. Un attachement insécurisant peut entraîner de l'anxiété, des difficultés relationnelles.</p>
</div>
<img src="images/PsychologieMaternelle1_4.jpg" alt="Attachement mère-enfant" data-image-id="PsychologieMaternelle1_4" onerror="this.style.display='none'">

<h3>3. Définitions</h3>
<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Attachement :</strong> lien affectif privilégié.</p>
<p><strong>Figure d'attachement :</strong> personne de référence.</p>
<p><strong>Attachement sécurisant :</strong> l'enfant se sent en sécurité.</p>
<p><strong>Attachement insécurisant :</strong> l'enfant est anxieux.</p>
<p><strong>Sécurité affective :</strong> sentiment d'être aimé et protégé.</p>
</div>

<h3>4. Méthodes et applications</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Créer un climat sécurisant : accueil chaleureux, stabilité des adultes, routines, réponses aux besoins. Éviter les ruptures brutales : préparer les séparations, rassurer. Observer les signes d'insécurité : pleurs excessifs, retrait, agressivité.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>À la rentrée, un enfant de 3 ans pleure quand sa mère le laisse à l'école maternelle. L'enseignante l'accueille avec douceur, lui montre un coin jeu, reste proche. Petit à petit, l'enfant se rassure et explore. La sécurité affective est la base de l'apprentissage.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qu'est-ce que l'attachement ?</p>

<p><strong>1)</strong> Le lien affectif privilégié qui unit l'enfant à une figure de soin.</p>
<p><strong>2)</strong> Parce qu'elle permet à l'enfant d'explorer, d'apprendre et de socialiser en confiance.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'attachement sécurisant est la base du développement affectif et social.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>socialisation</strong> est le processus par lequel l'enfant apprend à vivre avec les autres : partager, attendre son tour, coopérer, respecter les règles.</p>
<p><strong>Étapes de la socialisation :</strong></p>
<ul>
<li>Jeu solitaire (0-2 ans) : l'enfant joue seul.</li>
<li>Jeu parallèle (2-3 ans) : à côté des autres sans interagir.</li>
<li>Jeu associatif (3-4 ans) : échanges.</li>
<li>Jeu coopératif (4-6 ans) : but commun.</li>
</ul>
<p>Le jeu est essentiel : il développe la motricité, l'intelligence, le langage, les émotions, les relations. L'UNICEF rappelle que les enfants apprennent en jouant, en essayant et en observant.</p>

<p><strong>Jeu solitaire :</strong> l'enfant joue seul.</p>
<p><strong>Jeu parallèle :</strong> à côté des autres.</p>
<p><strong>Jeu coopératif :</strong> avec un but commun.</p>
<p><strong>Règles :</strong> conventions du jeu.</p>
</div>

<h3>4. Méthodes et applications</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>

</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Dans une classe maternelle, les enfants jouent d'abord seuls, puis à côté des autres, puis ensemble. L'enseignante organise des jeux de groupe (rondes, jeux de construction). Les enfants apprennent à partager, à attendre, à coopérer. Le jeu est un apprentissage social.</p>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Étapes du langage :</strong></p>
<ul>
<li>0-2 mois : cris, gazouillis.</li>
<li>2-6 mois : babillage.</li>
<li>6-12 mois : compréhension de mots simples, premiers mots.</li>
<li>12-18 mois : mots-phrases (« encore », « parti »).</li>
<li>18-24 mois : combinaison de deux mots (« maman parti »).</li>
<li>2-3 ans : phrases courtes, vocabulaire en expansion.</li>
<li>3-6 ans : phrases complexes, récits, questions.</li>
</ul>
<p><strong>Rôle de l'adulte :</strong> parler à l'enfant, nommer les objets, lire des histoires, chanter, écouter, reformuler.</p>
<p><strong>Facteurs :</strong> environnement langagier riche, interactions, santé, audition.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Langage :</strong> système de communication.</p>
<p><strong>Babillage :</strong> production de sons répétés.</p>
<p><strong>Mot-phrase :</strong> un mot qui exprime une phrase.</p>
<p><strong>Vocabulaire :</strong> ensemble des mots.</p>
<p><strong>Environnement langagier :</strong> contexte de parole.</p>

</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une mère parle à son bébé, nomme les objets, chante des berceuses. À 2 ans, l'enfant dit « maman parti ». À 4 ans, il raconte sa journée. Le langage se développe par l'interaction. En RDC, les langues nationales jouent un rôle important dans les premiers échanges.</p>

<li><strong>Besoin d'amour et de relations chaleureuses et stables :</strong> affection, attention, présence.</li>
<li><strong>Besoin d'exploration et d'expériences adaptées :</strong> jeu, découverte, stimulation.</li>
<li><strong>Besoin de limites et de structure :</strong> règles claires, cadre rassurant.</li>
<li><strong>Besoin d'estime et d'identité :</strong> reconnaissance, valorisation.</li>

<p><strong>Exploration :</strong> découverte.</p>

      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
