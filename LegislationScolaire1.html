    title: "Leçon 1 — Qu'est-ce que la législation scolaire ?",

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une école ne peut-elle pas s'ouvrir n'importe comment ? Qui décide des programmes, des horaires, des examens ? La législation scolaire répond à ces questions. »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir la législation scolaire. Distinguer loi, décret et arrêté. Comprendre son utilité pour l'enseignant. Prérequis : aucun.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>législation scolaire</strong> est l'ensemble des lois, décrets, arrêtés et règlements qui organisent l'enseignement dans un pays.</p>
<p>Elle définit : les structures de l'enseignement (niveaux, types), les conditions de création et de fonctionnement des écoles, les droits et devoirs des acteurs (État, parents, enseignants, élèves), le régime disciplinaire, les programmes et les examens.</p>
<p>La législation scolaire est <strong>hiérarchisée</strong> : la Constitution, les lois (dont la Loi-Cadre), les décrets, les arrêtés ministériels, les circulaires.</p>
<p>Elle est indispensable à l'enseignant : elle fixe le cadre de son travail, ses obligations, ses droits, et protège les élèves.</p>
</div>
<img src="images/LegislationScolaire1_1.jpg" alt="Texte de loi — document officiel" data-image-id="LegislationScolaire1_1" onerror="this.style.display='none'">

<h3>3. Définitions</h3>
<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Législation scolaire :</strong> ensemble des textes qui organisent l'enseignement.</p>
<p><strong>Loi :</strong> texte voté par le Parlement.</p>
<p><strong>Loi-Cadre :</strong> loi qui fixe les principes généraux et renvoie à des textes d'application.</p>
<p><strong>Décret :</strong> texte pris par le pouvoir exécutif.</p>
<p><strong>Arrêté :</strong> texte pris par un ministre.</p>
<p><strong>Circulaire :</strong> instruction administrative.</p>
</div>

<h3>4. Méthodes et applications</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour connaître une règle scolaire : identifier le texte qui la fixe (loi, décret, arrêté), vérifier sa date, son champ d'application. Pour appliquer la législation : se référer aux textes officiels, aux circulaires, aux instructions du ministère. L'enseignant doit connaître les textes qui régissent son métier : statut du personnel, obligations, droits, discipline.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>La Loi-Cadre de 2014 fixe le principe de la gratuité de l'enseignement primaire dans les établissements publics. Un directeur d'école ne peut pas exiger des frais scolaires illégaux. La législation protège les familles et garantit l'accès à l'école.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>

<p><strong>Ex. 2 :</strong> Cite trois textes qui composent la législation scolaire.</p>

</details>

<div class="sources"><strong>Sources :</strong> Loi-Cadre n° 14/004 du 11 février 2014 ; Syllabus « Organisation et législation scolaire » (Prof. Mutamba).</div>

<div class="bloc theorie"><div class="bloc-label">Développement</div>
<h3>La législation scolaire : une organisation en pyramide</h3>
<p>La législation scolaire n'est pas un ensemble de textes juxtaposés. Elle est organisée en <strong>hiérarchie</strong> : chaque texte doit respecter ceux qui sont au-dessus de lui.</p>
<ul>
<li><strong>La Constitution :</strong> texte fondamental du pays ; elle garantit le droit à l'éducation.</li>
<li><strong>Les lois :</strong> textes votés par le Parlement ; la Loi-Cadre en fait partie.</li>
<li><strong>Les décrets :</strong> textes pris par le Président ou le Gouvernement.</li>
<li><strong>Les arrêtés ministériels :</strong> textes pris par le Ministre de l'Éducation.</li>
<li><strong>Les circulaires :</strong> instructions administratives qui précisent l'application des textes.</li>
</ul>
<h3>Ce que la législation scolaire organise</h3>
<ul>
<li>Les <strong>structures</strong> de l'enseignement (niveaux, types).</li>
<li>Les <strong>conditions de création</strong> et de fonctionnement des écoles.</li>

<li>Les <strong>programmes</strong> et les <strong>examens</strong>.</li>

<h3>Pourquoi c'est utile à l'enseignant</h3>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment l'école congolaise a-t-elle été organisée avant et après l'indépendance ? Qu'est-ce qui a changé avec la Loi-Cadre de 1986 ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Situer les grandes étapes de la législation scolaire. Comprendre la Loi-Cadre de 1986. Saisir ses apports et ses limites. Prérequis : leçon 1.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>École coloniale (1908-1960) :</strong> organisation par conventions entre l'État belge et les missions religieuses (1906). L'enseignement visait à former des auxiliaires de la colonisation. Il était différencié (écoles pour Congolais et pour Européens), avec un accès limité.</p>
<p><strong>Après l'indépendance (1960) :</strong> réformes de 1960-1962, africanisation, expansion de l'enseignement, étatisation de 1971.</p>
<p><strong>Loi-Cadre de 1986 (Loi n° 86-005 du 22 septembre 1986) :</strong> elle fixe les principes de l'enseignement national pour près de trois décennies. Elle affirme l'obligation scolaire au niveau primaire, confère au Ministère de l'Éducation une autorité centrale, et organise l'enseignement en niveaux (maternel, primaire, secondaire, supérieur, universitaire).</p>
<p><strong>Limites :</strong> centralisation excessive, inadaptation aux évolutions constitutionnelles et sociales, faible prise en compte des réalités locales.</p>
</div>
<img src="images/LegislationScolaire1_2.jpg" alt="École coloniale au Congo" data-image-id="LegislationScolaire1_2" onerror="this.style.display='none'">

<h3>3. Définitions</h3>
<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Convention scolaire :</strong> accord entre l'État et une confession religieuse.</p>
<p><strong>Étatisation :</strong> prise de contrôle par l'État.</p>
<p><strong>Loi-Cadre :</strong> loi qui fixe les principes généraux.</p>
<p><strong>Obligation scolaire :</strong> devoir pour l'État de scolariser les enfants.</p>
<p><strong>Centralisation :</strong> concentration du pouvoir au niveau national.</p>
</div>

<h3>4. Méthodes et applications</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour comprendre l'évolution : comparer les textes (colonial, 1986, 2014), identifier les continuités et les ruptures. La Loi-Cadre de 1986 reste une référence historique : elle a structuré l'école congolaise pendant 28 ans.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Les écoles conventionnées (catholiques, protestantes) sont un héritage de l'école coloniale, maintenu par la Loi-Cadre de 1986. Aujourd'hui encore, elles jouent un rôle majeur dans le système éducatif congolais. La Loi-Cadre de 2014 a cherché à corriger les limites de celle de 1986.</p>
</div>

<p><strong>2)</strong> La centralisation excessive, l'inadaptation aux évolutions.</p>

    title: "Leçon 2 — L'école coloniale : héritages et ruptures",

<div class="bloc theorie"><div class="bloc-label">Développement</div>
<h3>L'école avant l'indépendance : le régime des conventions</h3>
<p>En 1906, un accord est signé entre l'État belge et les missions religieuses : c'est le régime des <strong>conventions scolaires</strong>. Les missions gèrent la majorité des écoles, l'État finance et contrôle. Ce modèle structurera durablement l'école congolaise.</p>
<h3>Une école inégalitaire</h3>
<p>L'enseignement colonial était <strong>différencié</strong> : des écoles pour les enfants congolais (orientées vers des métiers d'auxiliaires, d'employés subalternes) et des écoles pour les enfants européens (accès aux études longues). L'accès à l'éducation était limité et sélectif.</p>
<h3>Après l'indépendance (1960)</h3>
<ul>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>

<p><strong>Principes majeurs :</strong></p>

<li><strong>Obligation scolaire</strong> au niveau primaire.</li>
<li><strong>Gratuité</strong> dans les établissements publics au niveau primaire et secondaire général.</li>
<li><strong>Lutte contre l'analphabétisme.</strong></li>
<li><strong>Égalité d'accès</strong> aux avantages de formation pour tous les apprenants, public et privé.</li>
</ul>
<p><strong>Innovations :</strong> éducation de base de huit ans (primaire + secondaire général) ; organisation de l'enseignement maternel en cycle unique de trois ans ; introduction du système LMD à l'université ; utilisation des langues nationales comme medium aux cycles élémentaire et moyen ; prise en compte des enfants en situation difficile et des personnes handicapées.</p>
