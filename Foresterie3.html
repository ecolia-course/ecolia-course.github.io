<script>
const COURSE_TITLE = "Foresterie";
const slides = [
{
    title: "Sommaire — Foresterie 3e année",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours introduit à l'aménagement forestier durable et au développement rural forestier : acteurs et foresterie communautaire en RDC, diagnostic multi-ressources, objectifs de gestion, possibilité de coupe, planification sylvicole et exploitation, rédaction d'un plan d'aménagement.</p>
<p><strong>Note de transparence :</strong> le plan s'appuie sur les manuels officiels d'Aménagement Forestier et de Développement Rural Forestier pour la 3e année Agri-Foresterie (Édition 2025). La progression ci-dessous articule les deux approches (aménagement et développement rural forestier), à valider par l'enseignant.</p>
<ul>
<li>Leçon 1 — Introduction : forêt et développement en RDC</li>
<li>Leçon 2 — Les acteurs et la foresterie communautaire</li>
<li>Leçon 3 — Diagnostic multi-ressources d'une unité forestière</li>
<li>Leçon 4 — Objectifs de gestion et concertation</li>
<li>Leçon 5 — La possibilité de coupe durable</li>
<li>Leçon 6 — Planification sylvicole et exploitation</li>
<li>Leçon 7 — Rédaction d'un plan d'aménagement</li>
<li>Leçon 8 — Atelier projet et évaluation</li>
</ul>
<p>Une évaluation finale de 14 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Manuel Aménagement Forestier 3e Agri-Foresterie (Édition 2025) ; manuel Développement Rural Forestier 3e Agri-Foresterie (Édition 2025).</div>
    `
},
{
    title: "Leçon 1 — Introduction : forêt et développement en RDC",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi la forêt est-elle à la fois une richesse et un enjeu pour la RDC ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le rôle de la forêt. Identifier ses fonctions. Situer les enjeux congolais.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les fonctions de la forêt</div>
<ul>
<li><strong>Écologique :</strong> régulation du climat, protection des sols et de l'eau, biodiversité.</li>
<li><strong>Économique :</strong> bois d'œuvre, bois-énergie, produits forestiers non ligneux.</li>
<li><strong>Sociale :</strong> moyens d'existence pour de nombreuses communautés.</li>
<li><strong>Culturelle :</strong> lieux de mémoire et de pratiques traditionnelles.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les enjeux congolais</div>
<ul>
<li>Le massif forestier congolais est l'un des plus vastes au monde.</li>
<li>La déforestation et la dégradation progressent (agriculture itinérante, bois-énergie, exploitation non contrôlée).</li>
<li>L'aménagement durable et la foresterie communautaire sont des réponses.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois fonctions de la forêt.</p>
<p><strong>Ex. 2 :</strong> Pourquoi la forêt est-elle un enjeu pour la RDC ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Écologique, économique, sociale. <strong>2)</strong> Richesse écologique et économique menacée par la déforestation.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La forêt est une richesse multiple : sa gestion durable est un enjeu majeur pour la RDC.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels 3e Agri-Foresterie.</div>
    `
},
{
    title: "Leçon 2 — Les acteurs et la foresterie communautaire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi associer les communautés locales à la gestion forestière ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les acteurs. Comprendre la foresterie communautaire. Situer son importance.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les acteurs</div>
<ul>
<li><strong>État et administrations :</strong> réglementation, concessions.</li>
<li><strong>Communautés locales :</strong> usage et gestion de proximité.</li>
<li><strong>Exploitants forestiers :</strong> production de bois.</li>
<li><strong>ONG et partenaires :</strong> appui technique et financier.</li>
<li><strong>Autorités coutumières :</strong> rôle de médiation et de régulation locale.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La foresterie communautaire</div>
<p>La <strong>foresterie communautaire</strong> reconnaît aux communautés locales le droit de gérer durablement une portion de forêt, dans un cadre légal. Elle favorise :</p>
<ul>
<li>l'appropriation locale ;</li>
<li>la gestion durable des ressources ;</li>
<li>le partage équitable des bénéfices ;</li>
<li>la résolution locale des conflits.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois acteurs de la gestion forestière.</p>
<p><strong>Ex. 2 :</strong> Qu'est-ce que la foresterie communautaire ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> État, communautés locales, exploitants. <strong>2)</strong> Gestion durable d'une portion de forêt par les communautés locales.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La gestion forestière durable associe plusieurs acteurs ; la foresterie communautaire est un levier majeur.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel Développement Rural Forestier 3e.</div>
    `
},
{
    title: "Leçon 3 — Diagnostic multi-ressources d'une unité forestière",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un diagnostic est-il indispensable avant de décider d'exploiter une forêt ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les composantes du diagnostic. Identifier les outils. Analyser les besoins des communautés.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les composantes</div>
<ul>
<li><strong>Bois :</strong> essences, volumes, diamètres.</li>
<li><strong>Produits forestiers non ligneux :</strong> fruits, miel, plantes médicinales, gibier.</li>
<li><strong>Biodiversité :</strong> espèces animales et végétales.</li>
<li><strong>Eau et sol :</strong> protection des bassins versants.</li>
<li><strong>Dimension socio-économique :</strong> usage et besoins des communautés.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Outils</div>
<ul>
<li><strong>Inventaires forestiers :</strong> mesurer les arbres sur des parcelles échantillons.</li>
<li><strong>Études socio-économiques :</strong> enquêtes auprès des communautés.</li>
<li><strong>Cartographie :</strong> délimiter les zones et leurs usages.</li>
<li><strong>Observations naturalistes :</strong> faune, flore, sites sensibles.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois composantes d'un diagnostic forestier.</p>
<p><strong>Ex. 2 :</strong> Pourquoi associer une étude socio-économique ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Bois, produits non ligneux, biodiversité. <strong>2)</strong> Pour connaître les usages et les besoins des communautés.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le diagnostic multi-ressources éclaire la décision : il croise dimensions écologique, économique et sociale.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel Aménagement Forestier 3e.</div>
    `
},
{
    title: "Leçon 4 — Objectifs de gestion et concertation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi les décisions sur la forêt doivent-elles être concertées avec les communautés ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la notion d'objectif de gestion. Distinguer production et conservation. Conduire une concertation simple.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les objectifs</div>
<p>Les objectifs de gestion peuvent viser :</p>
<ul>
<li><strong>la production</strong> de bois (sciage, bois-énergie) ;</li>
<li><strong>la production</strong> de produits forestiers non ligneux ;</li>
<li><strong>la conservation</strong> de la biodiversité et des sols ;</li>
<li><strong>la protection</strong> des bassins versants ;</li>
<li><strong>le développement local</strong> (revenus, emplois).</li>
</ul>
<p>Les objectifs peuvent être combinés, mais doivent rester compatibles.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La concertation</div>
<p>La <strong>concertation</strong> associe les parties prenantes pour définir ensemble les objectifs et les règles. Elle suppose :</p>
<ul>
<li>une information claire ;</li>
<li>un espace de parole pour tous ;</li>
<li>une prise en compte des usages coutumiers ;</li>
<li>une décision tracée et partagée.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois objectifs possibles de gestion forestière.</p>
<p><strong>Ex. 2 :</strong> Pourquoi associer les parties prenantes à la décision ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Production de bois, conservation, développement local. <strong>2)</strong> Pour assurer la légitimité et l'appropriation des décisions.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les objectifs de gestion sont divers ; leur légitimité dépend de la concertation avec les acteurs concernés.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel Aménagement Forestier 3e.</div>
    `
},
{
    title: "Leçon 5 — La possibilité de coupe durable",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi ne peut-on pas abattre tous les grands arbres d'un coup ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la possibilité de coupe. Identifier les facteurs. Calculer une possibilité simplifiée.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La possibilité de coupe</div>
<p>La <strong>possibilité de coupe</strong> est le volume de bois que l'on peut prélever annuellement (ou par période) sans compromettre le renouvellement de la forêt.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les facteurs</div>
<ul>
<li><strong>Croissance</strong> annuelle des arbres.</li>
<li><strong>Mortalité</strong> naturelle.</li>
<li><strong>Régénération</strong> (jeunes arbres disponibles).</li>
<li><strong>Diamètre minimum d'exploitation.</strong></li>
<li><strong>Essences protégées ou rares.</strong></li>
<li><strong>Zones de protection</strong> (pentes, rives, sites sensibles).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Calcul simplifié</div>
<p>Dans un exercice scolaire, on calcule une possibilité en combinant :</p>
<ol>
<li>le volume exploitable estimé par l'inventaire ;</li>
<li>la durée de rotation choisie ;</li>
<li>un abattement pour protection et régénération.</li>
</ol>
<p>Le principe est simple : ne pas prélever plus que ce que la forêt produit.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis la possibilité de coupe.</p>
<p><strong>Ex. 2 :</strong> Cite trois facteurs à prendre en compte.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Volume de bois prélevable sans compromettre la forêt. <strong>2)</strong> Croissance, mortalité, régénération.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La possibilité de coupe équilibre prélèvement et renouvellement : c'est la base de la durabilité.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel Aménagement Forestier 3e.</div>
    `
},
{
    title: "Leçon 6 — Planification sylvicole et exploitation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une exploitation forestière doit-elle être planifiée dans le temps et dans l'espace ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la planification sylvicole. Identifier les opérations. Prévoir l'exploitation sans dégrader la forêt.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les opérations sylvicoles</div>
<ul>
<li><strong>Délimitation</strong> des zones d'exploitation et de protection.</li>
<li><strong>Inventaire</strong> et marquage des arbres à abattre.</li>
<li><strong>Ouverture des pistes</strong> sans dégrader les sols.</li>
<li><strong>Récolte</strong> et gestion des rémanents.</li>
<li><strong>Suivi de la régénération.</strong></li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — L'exploitation durable</div>
<p>Elle suppose :</p>
<ul>
<li>le respect des diamètres minimums ;</li>
<li>l'évitement des zones sensibles ;</li>
<li>des techniques d'abattage dirigé pour limiter les dégâts ;</li>
<li>une remise en état des pistes après exploitation.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois opérations sylvicoles.</p>
<p><strong>Ex. 2 :</strong> Pourquoi faut-il protéger les zones sensibles ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Délimitation, marquage, récolte. <strong>2)</strong> Pour éviter l'érosion, protéger l'eau et la biodiversité.</p>

 massif forestier congolais est l'un des plus vastes au monde. La déforestation et la dégradation progressent (agriculture itinérante, bois-énergie, exploitation non contrôlée). L'aménagement durable et la foresterie communautaire sont des réponses. Exercices. Ex. 1: Cite trois fonctions de la forêt. Ex. 2: Pourquoi la forêt est-elle un enjeu pour la R D C? Corrigé. 1) Écologique, économique, sociale. 2) Richesse écologique et économique menacée par la déforestation. À retenir. La forêt est une richesse multiple: sa gestion durable est un enjeu majeur pour la R D C."]],"3":[["fr","Leçon 2, Les acteurs et la foresterie communautaire. Situation. « Pourquoi associer les communautés locales à la gestion forestière? ». Objectifs. Identifier les acteurs. Comprendre la foresterie communautaire. Situer son importance. Théorie, Les acteurs. État et administrations: réglementation, concessions. Communautés locales: usage et gestion de proximité. Exploitants forestiers: production de bois. ONG et partenaires: appui technique et financier. Autorités coutumières: rôle de médiation et de régulation locale. Théorie, La foresterie communautaire. La foresterie communautaire reconnaît aux communautés locales le droit de gérer durablement une portion de forêt, dans un cadre légal. Elle favorise: l'appropriation locale; la gestion durable des ressources; le partage équitable des bénéfices; la résolution locale des conflits. Exercices. Ex. 1: Cite trois acteurs de la gestion forestière. Ex. 2: Qu'est-ce que la foresterie communautaire? Corrigé. 1) État, communautés locales, exploitants. 2) Gestion durable d'une portion de forêt par les communautés locales. À retenir. La gestion forestière durable associe plusieurs acteurs; la foresterie communautaire est un levier majeur."]],"4":[["fr","Leçon 3, Diagnostic multi-ressources d'une unité forestière. Situation. « Pourquoi un diagnostic est-il indispensable avant de décider d'exploiter une forêt? ». Objectifs. Comprendre les composantes du diagnostic. Identifier les outils. Analyser les besoins des communautés. Théorie, Les composantes. Bois: essences, volumes, diamètres. Produits forestiers non ligneux: fruits, miel, plantes médicinales, gibier. Biodiversité: espèces animales et végétales. Eau et sol: protection des bassins versants. Dimension socio-économique: usage et besoins des communautés. Théorie, Outils. Inventaires forestiers: mesurer les arbres sur des parcelles échantillons. Études socio-économiques: enquêtes auprès des communautés. Cartographie: délimiter les zones et leurs usages. Observations naturalistes: faune, flore, sites sensibles. Exercices. Ex. 1: Cite trois composantes d'un diagnostic forestier. Ex. 2: Pourquoi associer une étude socio-économique? Corrigé. 1) Bois, produits non ligneux, biodiversité. 2) Pour connaître les usages et les besoins des communautés. À retenir. Le diagnostic multi-ressources éclaire la décision: il croise dimensions écologique, économique et sociale."]],"5":[["fr","Leçon 4, Objectifs de gestion et concertation. Situation. « Pourquoi les décisions sur la forêt doivent-elles être concertées avec les communautés? ». Objectifs. Comprendre la notion d'objectif de gestion. Distinguer production et conservation. Conduire une concertation simple. Théorie, Les objectifs. Les objectifs de gestion peuvent viser: la production de bois (sciage, bois-énergie); la production de produits forestiers non ligneux; la conservation de la biodiversité et des sols; la protection des bassins versants; le développement local (revenus, emplois). Les objectifs peuvent être combinés, mais doivent rester compatibles. Théorie, La concertation. La concertation associe les parties prenantes pour définir ensemble les objectifs et les règles. Elle suppose: une information claire; un espace de parole pour tous; une prise en compte des usages coutumiers; une décision tracée et partagée. Exercices. Ex. 1: Cite trois objectifs possibles de gestion forestière. Ex. 2: Pourquoi associer les parties prenantes à la décision? Corrigé. 1) Production de bois, conservation, développement local. 2) Pour assurer la légitimité et l'appropriation des décisions. À retenir. Les objectifs de gestion sont divers; leur légitimité dépend de la concertation avec les acteurs concernés."]],"6":[["fr","Leçon 5, La possibilité de coupe durable. Situation. « Pourquoi ne peut-on pas abattre tous les grands arbres d'un coup? ». Objectifs. Comprendre la possibilité de coupe. Identifier les facteurs. Calculer une possibilité simplifiée. Théorie, La possibilité de coupe. La possibilité de coupe est le volume de bois que l'on peut prélever annuellement (ou par période) sans compromettre le renouvellement de la forêt. Théorie, Les facteurs. Croissance annuelle des arbres. Mortalité naturelle. Régénération (jeunes arbres disponibles). Diamètre minimum d'exploitation. Essences protégées ou rares. Zones de protection (pentes, rives, sites sensibles). Théorie, Calcul simplifié. Dans un exercice scolaire, on calcule une possibilité en combinant: le volume exploitable estimé par l'inventaire; la durée de rotation choisie; un abattement pour protection et régénération. Le principe est simple: ne pas prélever plus que ce que la forêt produit. Exercices. Ex. 1: Définis la possibilité de coupe. Ex. 2: Cite trois facteurs à prendre en compte. Corrigé. 1) Volume de bois prélevable sans compromettre la forêt. 2) Croissance, mortalité, régénération. À retenir. La possibilité de coupe équilibre prélèvement et renouvellement: c'est la base de la durabilité."]],"7":[["fr","Leçon 6, Planification sylvicole et exploitation. Situation. « Pourquoi une exploitation forestière doit-elle être planifiée dans le temps et dans l'espace? ». Objectifs. Comprendre la planification sylvicole. Identifier les opérations. Prévoir l'exploitation sans dégrader la forêt. Théorie, Les opérations sylvicoles. Délimitation des zones d'exploitation et de protection. Inventaire et marquage des arbres à abattre. Ouverture des pistes sans dégrader les sols. Récolte et gestion des rémanents. Suivi de la régénération. Théorie, L'exploitation durable. Elle suppose: le respect des diamètres minimums; l'évitement des zones sensibles; des techniques d'abattage dirigé pour limiter les dégâts; une remise en état des pistes après exploitation. Exercices. Ex. 1: Cite trois opérations sylvicoles. Ex. 2: Pourquoi faut-il protéger les zones sensibles? Corrigé. 1) Délimitation, marquage, récolte. 2) Pour éviter l'érosion, protéger l'eau et la biodiversité. À retenir. L'exploitation durable organise les prélèvements dans le temps et l'espace, pour préserver le renouvellement."]],"8":[["fr","Leçon 7, Rédaction d'un plan d'aménagement. Situation. « Pourquoi un plan d'aménagement écrit est-il nécessaire pour gérer une forêt sur plusieurs années? ». Objectifs. Comprendre la structure d'un plan. Rédiger un plan simple. Respecter les normes nationales. Théorie, Structure d'un plan. Présentation de l'unité forestière (localisation, superficie, usages). Diagnostic multi-ressources. Objectifs de gestion (production, conservation, développement). Zonage (zones d'exploitation, de protection, communautaires). Possibilité de coupe et règles d'exploitation. Planification des opérations sylvicoles. Suivi et évaluation. Théorie, Respect des normes. Le plan doit respecter le cadre national (réglementation forestière, droits des communautés). Il est un document d'engagement pour les parties prenantes. Exercices. Ex. 1: Cite trois rubriques d'un plan d'aménagement. Ex. 2: Pourquoi le plan doit-il être un document écrit? Corrigé. 1) Diagnostic, objectifs, possibilité de coupe. 2) Pour la traçabilité et l'engagement des parties prenantes. À retenir. Le plan d'aménagement est le document qui organise la gestion forestière dans le temps et dans l'espace."]],"9":[["fr","Leçon 8, Atelier projet et évaluation. Objectifs. Mobiliser les acquis dans un projet complet. Rédiger un plan d'aménagement simplifié. S'auto-évaluer. Projet. Choisir une unité forestière fictive. Réaliser un diagnostic simplifié. Définir des objectifs de gestion. Calculer une possibilité de coupe simple. Rédiger un plan d'aménagement de quelques pages. Grille d'évaluation. Diagnostic: complétude. Objectifs: pertinence et cohérence. Possibilité de coupe: justesse du raisonnement. Plan: clarté et structure. Exercices. Ex. 1: Réalise ton plan d'aménagement. Ex. 2: Présente-le et écoute les retours. Corrigé indicatif. La réussite combine diagnostic complet, objectifs clairs et plan structuré. À retenir. Le plan d'aménagement est le produit final qui traduit la gestion durable en actions concrètes."]],"10":[["fr","Évaluation finale, Foresterie 3e année. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 8 points sur 14, tu as réussi. En dessous, revois les leçons indiquées."]]}};

        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
