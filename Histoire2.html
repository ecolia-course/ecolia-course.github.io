    title: "Sommaire — Histoire",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours d'histoire couvre cinq thèmes fondamentaux de la 2e année des humanités : la méthode historique, l'Afrique précoloniale, la traite atlantique, l'exploration européenne et la Conférence de Berlin, et enfin l'État indépendant du Congo. Il s'appuie sur l'orientation du programme national : l'Afrique et le Congo au centre, l'esprit critique comme boussole.</p>
<p><strong>Note :</strong> le programme national d'histoire (Kinshasa, 2005) a été partiellement consulté via des versions numérisées. La répartition officielle exacte par année reste à vérifier sur le document intégral ; les manuels LAHA n'ont pas été dépouillés intégralement.</p>
<ul>
<li>Leçon 1 — L'histoire et ses méthodes : sources et critique historique</li>
<li>Leçon 2 — L'Afrique précoloniale : aires culturelles et formations politiques</li>
<li>Leçon 3 — La traite atlantique et ses conséquences en Afrique centrale</li>
<li>Leçon 4 — L'exploration européenne et la Conférence de Berlin (1884–1885)</li>
<li>Leçon 5 — L'État indépendant du Congo (1885–1908) : exploitation et résistances</li>
</ul>
<p>Une évaluation finale de 20 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme National d'Histoire, Enseignement Secondaire (Kinshasa, 2005) ; manuels « Histoire – 2ème Année Hum » et « Histoire – 4ème Année Hum » (R. Lupamanyi &amp; J.-P. Lisongo, LAHA Éditions).</div>
    `
},
{
    title: "Leçon 1 — L'histoire et ses méthodes : sources et critique historique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment un historien sait-il ce qui s'est vraiment passé ? Peut-il croire toutes les sources ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir l'histoire et ses méthodes. Identifier les types de sources. Appliquer une critique simple. Situer les sciences auxiliaires. Prérequis : notions de chronologie (siècle, millénaire, av. J.-C./ap. J.-C.).</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'<strong>histoire</strong> est la science qui étudie le passé des sociétés humaines à partir de sources analysées de manière critique. Elle n'est pas une simple mémoire du passé : elle exige de douter, de comparer, de contextualiser.</p>
<p><strong>Types de sources :</strong></p>
<ul>
<li><strong>Sources écrites :</strong> archives, récits, correspondances.</li>
<li><strong>Sources orales :</strong> traditions recueillies auprès des anciens, récits, généalogies.</li>
<li><strong>Sources archéologiques :</strong> objets, vestiges, sites.</li>
<li><strong>Sources iconographiques :</strong> photographies, peintures, cartes.</li>
</ul>
<p>Distinguer <strong>source primaire</strong> (document produit à l'époque étudiée) et <strong>source secondaire</strong> (travail postérieur, comme un manuel ou un article).</p>
<p><strong>Critique historique :</strong></p>
<ul>
<li><strong>Critique externe :</strong> où, quand, par qui le document a-t-il été produit ?</li>
<li><strong>Critique interne :</strong> le contenu est-il cohérent ? Que veut dire l'auteur ? Quelles sont ses intentions et ses limites ?</li>
</ul>
<p><strong>Sciences auxiliaires :</strong> archéologie, paléographie (étude des écritures anciennes), dendrochronologie (datation par les cernes du bois), diplomatique (étude des documents officiels).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Source primaire :</strong> document d'époque. <strong>Source secondaire :</strong> travail postérieur. <strong>Critique historique :</strong> analyse rigoureuse des sources. <strong>Science auxiliaire :</strong> discipline qui aide à dater, déchiffrer, identifier.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Pour chaque document, se demander : qui parle ? quand ? dans quel but ? à qui ? que dit-il explicitement et implicitement ? Comparer plusieurs sources. Ne jamais prendre une source unique pour une vérité absolue.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Les traditions orales recueillies auprès des anciens d'un village du Kasaï sur la fondation d'une chefferie constituent une source. Mais comme toute source, elles doivent être recoupées avec d'autres (archives coloniales, archéologie) pour être validées.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Une photographie de masque datant de 1900 est-elle une source primaire ou secondaire ? <strong>Ex. 2 :</strong> Cite deux sciences auxiliaires de l'histoire.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Source primaire (document d'époque). <strong>2)</strong> Archéologie et paléographie (autres réponses possibles).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'historien doute, compare et contextualise : c'est la critique qui distingue l'histoire du simple témoignage.</p></div>

<div class="sources"><strong>Sources :</strong> Programme National d'Histoire (Kinshasa, 2005) ; manuel « Histoire – 2ème Année Hum » (LAHA Éditions).</div>
    `
},
{
    title: "Leçon 2 — L'Afrique précoloniale : aires culturelles et formations politiques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment vivaient les sociétés africaines avant la colonisation ? Avaient-elles des États organisés ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les grandes aires culturelles d'Afrique centrale. Situer les principaux royaumes et empires. Comprendre leur organisation politique, économique et sociale. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'Afrique précoloniale n'était ni vide ni homogène : elle connaissait des <strong>formations étatiques complexes</strong> et des <strong>réseaux d'échange</strong> à longue distance.</p>
<p><strong>Grandes aires culturelles d'Afrique centrale :</strong> savane, forêt équatoriale, zone interlacustre.</p>
<p><strong>Principaux royaumes et empires :</strong></p>
<ul>
<li><strong>Royaume Kongo :</strong> Bas-Congo, centralisé, en relation diplomatique avec le Portugal dès la fin du XVe siècle.</li>
<li><strong>Royaume Luba :</strong> Kasaï, organisation politique autour d'un souverain sacré (mulopwe).</li>
<li><strong>Royaume Lunda :</strong> aire orientale, réseaux commerciaux étendus.</li>
<li><strong>Empire du Monomotapa :</strong> Afrique australe, lié au commerce de l'or.</li>
</ul>
<p><strong>Organisation :</strong> pouvoir politique autour d'un souverain, d'une cour, de chefs locaux ; économie fondée sur l'agriculture, l'élevage, la métallurgie, le commerce (sel, fer, cuivre, ivoire) ; sociétés structurées par lignages et classes d'âge.</p>
<p><strong>Échanges :</strong> routes transsahariennes (or, sel, esclaves) et, plus tard, routes atlantiques.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Formation politique :</strong> organisation d'un pouvoir structuré sur un territoire. <strong>Réseau d'échange :</strong> circuit commercial. <strong>Lignage :</strong> groupe de parenté.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Localiser sur une carte. Comparer les royaumes (centralisation, commerce, religion). Éviter les généralisations : l'Afrique précoloniale est diverse.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Le royaume Kongo, situé dans le Bas-Congo actuel, entretenait dès 1483 des relations diplomatiques avec le Portugal. Il avait un souverain (le <em>manikongo</em>), une capitale (Mbanza Kongo), une administration et un système monétaire (cauris, tissus).</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois royaumes précoloniaux d'Afrique centrale. <strong>Ex. 2 :</strong> Réduire l'Afrique précoloniale à des « tribus sans organisation » est-il correct ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Kongo, Luba, Lunda (autres réponses possibles). <strong>2)</strong> Non : ces sociétés connaissaient des formations étatiques et des échanges complexes.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les sociétés africaines précoloniales étaient diverses et dynamiques, avec des États organisés et des réseaux d'échange.</p></div>

<div class="sources"><strong>Sources :</strong> Programme National d'Histoire (Kinshasa, 2005) ; manuel « Histoire – 2ème Année Hum » (LAHA Éditions).</div>
    `
},
{
    title: "Leçon 3 — La traite atlantique et ses conséquences en Afrique centrale",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« La traite atlantique a-t-elle concerné l'Afrique centrale ? Qui en portait la responsabilité ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Situer la traite atlantique dans le temps. Identifier ses acteurs. Comprendre ses conséquences démographiques et politiques. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>traite atlantique</strong> désigne la déportation massive d'Africains vers les Amériques entre le XVIe et le XIXe siècle (environ 1500–1860). Elle s'inscrit dans le système de la plantation esclavagiste et du commerce triangulaire.</p>
<p><strong>Zones de départ en Afrique centrale :</strong> embouchure du fleuve Congo, côte de Loango, côte angolaise, arrière-pays congolais.</p>
<p><strong>Acteurs :</strong> négriers européens (Portugais, Britanniques, Français, Hollandais, etc.) <strong>et</strong> élites africaines locales (rois, marchands) qui servaient d'intermédiaires, souvent intéressées par les armes, l'alcool et les tissus.</p>
<p><strong>Conséquences :</strong></p>
<ul>
<li><strong>Démographiques :</strong> dépopulation massive de certaines régions.</li>
<li><strong>Politiques :</strong> militarisation des États, déstructuration des sociétés, apparition de nouveaux pouvoirs liés à la traite.</li>
<li><strong>Économiques :</strong> réorientation des circuits vers le littoral atlantique.</li>
<li><strong>Humaines et culturelles :</strong> exil forcé, déracinement, blessures durables.</li>
</ul>
<p><strong>Abolition :</strong> mouvements abolitionnistes, décisions politiques (Grande-Bretagne 1807, France 1848, etc.) et effets sur les sociétés africaines.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Traite atlantique :</strong> déportation d'Africains vers les Amériques (XVIe–XIXe s.). <strong>Commerce triangulaire :</strong> circuit Europe–Afrique–Amériques. <strong>Abolitionnisme :</strong> mouvement contre la traite et l'esclavage.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Utiliser une carte des routes. Distinguer les responsabilités. Ne pas présenter la traite comme uniquement le fait des Européens ni comme uniquement le fait des Africains : c'est un phénomène mondial aux responsabilités partagées.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>L'embouchure du fleuve Congo fut une zone active de traite. Les razzias dans l'arrière-pays (Manikongo, marchands locaux) alimentaient les circuits en direction des côtes. Le roi Afonso Ier du Kongo écrivit dès 1526 au Portugal pour dénoncer les abus de la traite : c'est un témoignage historique important.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Situe la traite atlantique dans le temps. <strong>Ex. 2 :</strong> Cite deux conséquences de la traite en Afrique centrale.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> XVIe–XIXe siècle. <strong>2)</strong> Dépopulation, militarisation et déstructuration politique (autres réponses possibles).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La traite atlantique est un phénomène mondial aux responsabilités partagées, avec des conséquences profondes sur les sociétés d'Afrique centrale.</p></div>

<div class="sources"><strong>Sources :</strong> Programme National d'Histoire (Kinshasa, 2005) ; manuel « Histoire – 4ème Année Hum » (LAHA Éditions).</div>
    `
},
{
    title: "Leçon 4 — L'exploration européenne et la Conférence de Berlin (1884–1885)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment l'Afrique a-t-elle été partagée entre puissances européennes ? Quel a été le rôle de la Conférence de Berlin ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Situer les explorations européennes en Afrique centrale. Comprendre les rivalités coloniales. Analyser le rôle et les règles de la Conférence de Berlin. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Explorations européennes (XIXe siècle) :</strong></p>
<ul>
<li><strong>David Livingstone :</strong> exploration du bassin du Zambèze et de l'Afrique australe.</li>
<li><strong>Henry Morton Stanley :</strong> exploration du fleuve Congo pour le compte de Léopold II de Belgique.</li>
<li><strong>Pierre Savorgnan de Brazza :</strong> exploration du Congo pour la France ; traité avec le roi Makoko (1880).</li>
</ul>
<p><strong>Rivalités coloniales :</strong> la France, la Belgique, le Portugal, la Grande-Bretagne et l'Allemagne se disputent l'Afrique centrale.</p>
<p><strong>Conférence de Berlin (novembre 1884 – février 1885) :</strong> réunion des puissances européennes et des États-Unis, convoquée par Bismarck.</p>
<p><strong>Ce que Berlin décide :</strong></p>
<ul>
<li>Liberté de commerce dans le bassin du Congo.</li>
<li>Liberté de navigation sur le Congo et le Niger.</li>
<li><strong>Règle de l'occupation effective :</strong> une puissance doit occuper effectivement un territoire pour le revendiquer.</li>
<li>Obligation de notifier les annexions.</li>
<li>Reconnaissance de l'<strong>État indépendant du Congo (EIC)</strong> comme propriété personnelle de Léopold II.</li>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment le Congo de Léopold II a-t-il été exploité ? Les Congolais se sont-ils résignés ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>L'État indépendant du Congo (EIC)</strong> est proclamé en 1885, propriété personnelle du roi Léopold II de Belgique. Il dure jusqu'en 1908, date de son annexion par la Belgique.</p>
<p><strong>Régime d'exploitation :</strong></p>
<ul>
<li>Exploitation du <strong>caoutchouc</strong> et de l'<strong>ivoire</strong>, principales ressources.</li>
<li><strong>Travail forcé</strong> des populations, quotas de récolte.</li>
<li>Système de prise d'otages, châtiments corporels, mutilations (mains coupées) pour punir les communautés qui ne remplissaient pas les quotas.</li>
<li>Régime de terreur, mortalité massive (estimations débattues : plusieurs millions de victimes).</li>
</ul>
<p><strong>Résistances congolaises :</strong> révoltes et mutineries nombreuses, notamment dans le Maniema, le Kasaï, le Kwango, l'Équateur. Certains chefs locaux organisent des rébellions ; des tirailleurs se mutinent.</p>
<p><strong>Campagne de réforme et opinion internationale :</strong></p>
<ul>
<li>Rapports de <strong>missionnaires</strong> et de consuls (par ex., <strong>Roger Casement</strong>, rapport de 1904).</li>
<li><strong>Edmund Dene Morel</strong>, journaliste britannique, mène une campagne de presse.</li>
<li>Mark Twain, Arthur Conan Doyle participent au mouvement de dénonciation.</li>
</ul>
<p>En <strong>1908</strong>, sous la pression internationale, Léopold II cède le Congo à la Belgique : c'est le début du <strong>Congo belge</strong>.</p>

  var CFG = {"code":"Histoire2","base":"https://ecolia-course.github.io/ecolia-media/audio_files/","available":[1,2,3,4,5,6,7],"count":7,"sizeMo":9,"sizes":{"1":679104,"2":1525440,"3":1476672,"4":1572672,"5":1679232,"6":1651392,"7":86592},"fallback":{"1":[["fr","Sommaire, Histoire. Sommaire. Ce cours d'histoire couvre cinq thèmes fondamentaux de la 2e année des humanités: la méthode historique, l'Afrique précoloniale, la traite atlantique, l'exploration européenne et la Conférence de Berlin, et enfin l'État indépendant du Congo. Il s'appuie sur l'orientation du programme national: l'Afrique et le Congo au centre, l'esprit critique comme boussole. Note: le programme national d'histoire (Kinshasa, 2005) a été partiellement consulté via des versions numérisées. La répartition officielle exacte par année reste à vérifier sur le document intégral; les manuels LAHA n'ont pas été dépouillés intégralement. Leçon 1, L'histoire et ses méthodes: sources et critique historique. Leçon 2, L'Afrique précoloniale: aires culturelles et formations politiques. Leçon 3, La traite atlantique et ses conséquences en Afrique centrale. Leçon 4, L'exploration européenne et la Conférence de Berlin (1884–1885). Leçon 5, L'État indépendant du Congo (1885–1908): exploitation et résistances. Une évaluation finale de 20 questions couvre l'ensemble des leçons."]],"2":[["fr","Leçon 1, L'histoire et ses méthodes: sources et critique historique. Situation. « Comment un historien sait-il ce qui s'est vraiment passé? Peut-il croire toutes les sources? ». Objectifs. Définir l'histoire et ses méthodes. Identifier les types de sources. Appliquer une critique simple. Situer les sciences auxiliaires. Prérequis: notions de chronologie (siècle, millénaire, av. J.-C./ap. J.-C.). Théorie. L'histoire est la science qui étudie le passé des sociétés humaines à partir de sources analysées de manière critique. Elle n'est pas une simple mémoire du passé: elle exige de douter, de comparer, de contextualiser. Types de sources: Sources écrites: archives, récits, correspondances. Sources orales: traditions recueillies auprès des anciens, récits, généalogies. Sources archéologiques: objets, vestiges, sites. Sources iconographiques: photographies, peintures, cartes. Distinguer source primaire (document produit à l'époque étudiée) et source secondaire (travail postérieur, comme un manuel ou un article). Critique historique: Critique externe: où, quand, par qui le document a-t-il été produit? Critique interne: le contenu est-il cohérent? Que veut dire l'auteur? Quelles sont ses intentions et ses limites? Sciences auxiliaires: archéologie, paléographie (étude des écritures anciennes), dendrochronologie (datation par les cernes du bois), diplomatique (étude des documents officiels). Définitions. Source primaire: document d'époque. Source secondaire: travail postérieur. Critique historique: analyse rigoureuse des sources. Science auxiliaire: discipline qui aide à dater, déchiffrer, identifier. Méthodes et règles. Pour chaque document, se demander: qui parle? quand? dans quel but? à qui? que dit-il explicitement et implicitement? Comparer plusieurs sources. Ne jamais prendre une source unique pour une vérité absolue. Exemple. Les traditions orales recueillies auprès des anciens d'un village du Kasaï sur la fondation d'une chefferie constituent une source. Mais comme toute source, elles doivent être recoupées avec d'autres (archives coloniales, archéologie) pour être validées. Exercices. Ex. 1: Une photographie de masque datant de 1900 est-elle une source primaire ou secondaire? Ex. 2: Cite deux sciences auxiliaires de l'histoire. Corrigé. 1) Source primaire (document d'époque). 2) Archéologie et paléographie (autres réponses possibles). À retenir. L'historien doute, compare et contextualise: c'est la critique qui distingue l'histoire du simple témoignage."]],"3":[["fr","Leçon 2, L'Afrique précoloniale: aires culturelles et formations politiques. Situation. « Comment vivaient les sociétés africaines avant la colonisation? Avaient-elles des États organisés? ». Objectifs. Identifier les grandes aires culturelles d'Afrique centrale. Situer les principaux royaumes et empires. Comprendre leur organisation politique, économique et sociale. Prérequis: leçon 1. Théorie. L'Afrique précoloniale n'était ni vide ni homogène: elle connaissait des formations étatiques complexes et des réseaux d'échange à longue distance. Grandes aires culturelles d'Afrique centrale: savane, forêt équatoriale, zone interlacustre. Principaux royaumes et empires: Royaume Kongo: Bas-Congo, centralisé, en relation diplomatique avec le Portugal dès la fin du XVe siècle. Royaume Luba: Kasaï, organisation politique autour d'un souverain sacré (mulopwe). Royaume Lunda: aire orientale, réseaux commerciaux étendus. Empire du Monomotapa: Afrique australe, lié au commerce de l'or. Organisation: pouvoir politique autour d'un souverain, d'une cour, de chefs locaux; économie fondée sur l'agriculture, l'élevage, la métallurgie, le commerce (sel, fer, cuivre, ivoire); sociétés structurées par lignages et classes d'âge. Échanges: routes transsahariennes (or, sel, esclaves) et, plus tard, routes atlantiques. Définitions. Formation politique: organisation d'un pouvoir structuré sur un territoire. Réseau d'échange: circuit commercial. Lignage: groupe de parenté. Méthodes et règles. Localiser sur une carte. Comparer les royaumes (centralisation, commerce, religion). Éviter les généralisations: l'Afrique précoloniale est diverse. Exemple. Le royaume Kongo, situé dans le Bas-Congo actuel, entretenait dès 1483 des relations diplomatiques avec le Portugal. Il avait un souverain (le manikongo), une capitale (Mbanza Kongo), une administration et un système monétaire (cauris, tissus). Exercices. Ex. 1: Cite trois royaumes précoloniaux d'Afrique centrale. Ex. 2: Réduire l'Afrique précoloniale à des « tribus sans organisation » est-il correct? Corrigé. 1) Kongo, Luba, Lunda (autres réponses possibles). 2) Non: ces sociétés connaissaient des formations étatiques et des échanges complexes. À retenir. Les sociétés africaines précoloniales étaient diverses et dynamiques, avec des États organisés et des réseaux d'échange."]],"4":[["fr","Leçon 3, La traite atlantique et ses conséquences en Afrique centrale. Situation. « La traite atlantique a-t-elle concerné l'Afrique centrale? Qui en portait la responsabilité? ». Objectifs. Situer la traite atlantique dans le temps. Identifier ses acteurs. Comprendre ses conséquences démographiques et politiques. Prérequis: leçons 1 et 2. Théorie. La traite atlantique désigne la déportation massive d'Africains vers les Amériques entre le XVIe et le XIXe siècle (environ 1500–1860). Elle s'inscrit dans le système de la plantation esclavagiste et du commerce triangulaire. Zones de départ en Afrique centrale: embouchure du fleuve Congo, côte de Loango, côte angolaise, arrière-pays congolais. Acteurs: négriers européens (Portugais, Britanniques, Français, Hollandais, etc.) et élites africaines locales (rois, marchands) qui servaient d'intermédiaires, souvent intéressées par les armes, l'alcool et les tissus. Conséquences: Démographiques: dépopulation massive de certaines régions. Politiques: militarisation des États, déstructuration des sociétés, apparition de nouveaux pouvoirs liés à la traite. Économiques: réorientation des circuits vers le littoral atlantique. Humaines et culturelles: exil forcé, déracinement, blessures durables. Abolition: mouvements abolitionnistes, décisions politiques (Grande-Bretagne 1807, France 1848, etc.) et effets sur les sociétés africaines. Définitions. Traite atlantique: déportation d'Africains vers les Amériques (XVIe–XIXe s.). Commerce triangulaire: circuit Europe–Afrique–Amériques. Abolitionnisme: mouvement contre la traite et l'esclavage. Méthodes et règles. Utiliser une carte des routes. Distinguer les responsabilités. Ne pas présenter la traite comme uniquement le fait des Européens ni comme uniquement le fait des Africains: c'est un phénomène mondial aux responsabilités partagées. Exemple. L'embouchure du fleuve Congo fut une zone active de traite. Les razzias dans l'arrière-pays (Manikongo, marchands locaux) alimentaient les circuits en direction des côtes. Le roi Afonso Ier du Kongo écrivit dès 1526 au Portugal pour dénoncer les abus de la traite: c'est un témoignage historique important. Exercices. Ex. 1: Situe la traite atlantique dans le temps. Ex. 2: Cite deux conséquences de la traite en Afrique centrale. Corrigé. 1) XVIe–XIXe siècle. 2) Dépopulation, militarisation et déstructuration politique (autres réponses possibles). À retenir. La traite atlantique est un phénomène mondial aux responsabilités partagées, avec des conséquences profondes sur les sociétés d'Afrique centrale."]],"5":[["fr","Leçon 4, L'exploration européenne et la Conférence de Berlin (1884–1885). Situation. « Comment l'Afrique a-t-elle été partagée entre puissances européennes? Quel a été le rôle de la Conférence de Berlin? ». Objectifs. Situer les explorations européennes en Afrique centrale. Comprendre les rivalités coloniales. Analyser le rôle et les règles de la Conférence de Berlin. Prérequis: leçons 1 à 3. Théorie. Explorations européennes (XIXe siècle): David Livingstone: exploration du bassin du Zambèze et de l'Afrique australe. Henry Morton Stanley: exploration du fleuve Congo pour le compte de Léopold II de Belgique. Pierre Savorgnan de Brazza: exploration du Congo pour la France; traité avec le roi Makoko (1880). Rivalités coloniales: la France, la Belgique, le Portugal, la Grande-Bretagne et l'Allemagne se disputent l'Afrique centrale. Conférence de Berlin (novembre 1884, février 1885): réunion des puissances européennes et des États-Unis, convoquée par Bismarck. Ce que Berlin décide: Liberté de commerce dans le bassin du Congo. Liberté de navigation sur le Congo et le Niger. Règle de l'occupation effective: une puissance doit occuper effectivement un territoire pour le revendiquer. Obligation de notifier les annexions. Reconnaissance de l'État indépendant du Congo (EIC) comme propriété personnelle de Léopold II. Attention: Berlin ne « partage » pas l'Afrique en un jour. Elle fixe des règles qui accélèrent la course aux colonies. Définitions. Conférence de Berlin: réunion de 1884–1885 fixant les règles du partage colonial. Occupation effective: présence réelle sur le terrain pour revendiquer un territoire. EIC: État indépendant du Congo (1885–1908). Méthodes et règles. Comparer une carte de l'Afrique en 1880 et une carte en 1914. Identifier les changements. Comprendre que la Conférence de Berlin fixe des règles, mais que l'occupation militaire fera le partage réel. Exemple. Stanley signe pour Léopold II une série de traités avec des chefs locaux le long du fleuve Congo (1880–1884). Brazza signe avec le roi Makoko un traité plaçant le Moyen-Congo sous protectorat français (1880). Ces traités, souvent inégaux ou instrumentalisés, seront utilisés pour justifier les revendications à Berlin. Exercices. Ex. 1: En quelle année s'est tenue la Conférence de Berlin? Ex. 2: Quelle règle principale Berlin impose-t-elle? Corrigé. 1) 1884–1885. 2) L'occupation effective et la notification des annexions. À retenir. Berlin fixe des règles; l'occupation effective fera le reste. Pour le Congo, elle marque le début de la souveraineté personnelle de Léopold II."]],"6":[["fr","Leçon 5, L'État indépendant du Congo (1885–1908): exploitation et résistances. Situation. « Comment le Congo de Léopold II a-t-il été exploité? Les Congolais se sont-ils résignés? ». Objectifs. Comprendre le régime léopoldien. Identifier les formes d'exploitation et de résistance. Situer les acteurs de la réforme. Prérequis: leçons 1 à 4. Théorie. L'État indépendant du Congo (EIC) est proclamé en 1885, propriété personnelle du roi Léopold II de Belgique. Il dure jusqu'en 1908, date de son annexion par la Belgique. Régime d'exploitation: Exploitation du caoutchouc et de l'ivoire, principales ressources. Travail forcé des populations, quotas de récolte. Système de prise d'otages, châtiments corporels, mutilations (mains coupées) pour punir les communautés qui ne remplissaient pas les quotas. Régime de terreur, mortalité massive (estimations débattues: plusieurs millions de victimes). Résistances congolaises: révoltes et mutineries nombreuses, notamment dans le Maniema, le Kasaï, le Kwango, l'Équateur. Certains chefs locaux organisent des rébellions; des tirailleurs se mutinent. Campagne de réforme et opinion internationale: Rapports de missionnaires et de consuls (par ex., Roger Casement, rapport de 1904). Edmund Dene Morel, journaliste britannique, mène une campagne de presse. Mark Twain, Arthur Conan Doyle participent au mouvement de dénonciation. En 1908, sous la pression internationale, Léopold II cède le Congo à la Belgique: c'est le début du Congo belge. Définitions. EIC: État indépendant du Congo (1885–1908). Travail forcé: travail imposé sans consentement. Rapport Casement: rapport officiel dénonçant les exactions. Annexion: transfert de souveraineté. Méthodes et règles. Analyser les sources (documents d'époque, rapports, témoignages, photographies). Distinguer les faits établis des exagérations de propagande. Situer les responsabilités (Léopold II, agents, chefs locaux). Exemple. Le rapport Casement (1904) décrit avec précision les exactions dans l'EIC. Il est utilisé par les réformateurs pour dénoncer le régime. En parallèle, des photographies (par ex., d'Alice Seeley Harris) circulent et choquent l'opinion internationale. Exercices. Ex. 1: Quelles ressources principales ont été exploitées dans l'EIC? Ex. 2: En quelle année la Belgique annexe-t-elle le Congo? Corrigé. 1) Le caoutchouc et l'ivoire. 2) 1908. À retenir. L'EIC est un régime d'exploitation, mais il a rencontré des résistances actives et une dénonciation internationale qui aboutit à l'annexion de 1908."]],"7":[["fr","Évaluation finale, Histoire. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 12 sur 20, tu as réussi."]]}};

    function nativeStore() {

      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {                                   // fichier complet ? (taille exacte connue à la génération)
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () {
          var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok);
        },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {

                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) {

          writeOk(readOk().filter(function (x) { return x !== n; }));

    function cacheStore() {

      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
