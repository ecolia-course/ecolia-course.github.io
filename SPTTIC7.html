<script>
const COURSE_TITLE = "Sciences Physiques, Technologie et TIC";
const slides = [
{
    title: "SPTTIC 7e année — Sommaire général",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce fichier couvre le programme de Sciences Physiques, Technologie et TIC de la 7e année de l'éducation de base. Il est organisé en trois parties distinctes, chacune correspondant à une discipline enseignée à raison d'une heure par semaine.</p>
<ul>
<li>Partie 1 — Sciences physiques : 7 leçons (1 h par semaine), leçons 1 à 7.</li>
<li>Partie 2 — Technologie : 3 leçons (1 h par semaine), leçons 8 à 10.</li>
<li>Partie 3 — TIC : 4 leçons (1 h par semaine), leçons 11 à 14.</li>
</ul>
<p>Une évaluation finale de 35 questions couvre les trois parties.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme éducatif officiel SPTTIC 7e année (MEPST, 2018). Guide officiel d'appui au programme SPTTIC 7e année.</div>
    `
},
{
    title: "Sciences physiques — Leçon 1 : La matière et ses états physiques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une cuisine de Kinshasa, un élève observe de la glace dans un verre, de l'eau liquide dans une casserole et de la vapeur qui s'échappe lorsque l'eau chauffe. Ces trois aspects concernent pourtant la même substance : l'eau.</p></div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Water%20And%20Ice.jpg?width=700" alt="Glace et eau liquide côte à côte" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Glace et eau liquide — Wikimedia Commons : Water And Ice.jpg.</p>

<h3>1. Qu'est-ce que la matière ?</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La matière est tout ce qui possède une masse et occupe un volume. Elle est constituée de particules très petites appelées molécules, elles-mêmes formées d'atomes. Un atome est représenté par un symbole : H pour l'hydrogène, O pour l'oxygène, C pour le carbone, Fe pour le fer.</p>
<p>La matière est divisible : un morceau de craie peut être réduit en poudre, la poudre en grains plus fins, et ainsi de suite jusqu'aux molécules.</p>
</div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/States%20of%20matter%20En.svg?width=700" alt="Schéma des trois états de la matière" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Schéma des trois états de la matière — Wikimedia Commons : States of matter En.svg.</p>

<h3>2. Les trois états physiques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>On distingue trois états physiques de la matière :</p>
<ul>
<li><strong>Solide</strong> : forme propre, volume propre, particules très rapprochées et ordonnées. Exemple : glace, pierre, bois.</li>
<li><strong>Liquide</strong> : pas de forme propre, volume propre, particules proches mais désordonnées. Exemple : eau, huile.</li>
<li><strong>Gaz</strong> : ni forme propre ni volume propre, particules éloignées et agitées. Exemple : air, vapeur d'eau, gaz de cuisine.</li>
</ul>
</div>

<h3>3. Les changements d'état</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le passage d'un état à un autre s'appelle un changement d'état :</p>
<ul>
<li>Fusion : solide vers liquide (glace qui fond).</li>
<li>Solidification : liquide vers solide (eau qui gèle).</li>
<li>Vaporisation : liquide vers gaz (eau qui bout).</li>
<li>Liquéfaction : gaz vers liquide (vapeur qui se condense sur une surface froide).</li>
</ul>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève place un glaçon de 20 g dans un verre. Après 10 minutes à la température de la classe, la masse d'eau recueillie mesure 20 g.</p>
<p><strong>Observation :</strong> la glace a fondu. La masse n'a pas changé : la matière ne disparaît pas, elle change seulement d'état.</p>
<p><strong>Conclusion :</strong> lors d'un changement d'état, la substance reste la même ; sa masse est conservée.</p>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Water%20cycle.png?width=700" alt="Schéma du cycle de l'eau et des changements d'état" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Schéma du cycle de l'eau — Wikimedia Commons : Water cycle.png.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La matière possède une masse et un volume. Elle existe sous trois états : solide, liquide et gaz. Les changements d'état ne modifient pas la substance elle-même, mais seulement l'arrangement de ses particules.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif officiel SPTTIC 7e année (MEPST, 2018). Guide officiel d'appui au programme SPTTIC 7e année. Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Sciences physiques — Leçon 2 : Corps purs et mélanges",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Au marché, une vendeuse propose de l'eau claire dans une bouteille, une autre vend de l'eau salée, et un enfant rapporte de l'eau boueuse du ruisseau. Ces trois liquides n'ont pas la même composition.</p></div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Muddy%20water.jpg?width=700" alt="Eau boueuse, exemple de mélange hétérogène" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Eau boueuse, exemple de mélange hétérogène — Wikimedia Commons : Muddy water.jpg.</p>

<h3>1. Substance et corps pur</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une substance est une espèce de matière bien définie. Un corps pur est constitué d'une seule substance. L'eau distillée, le sel de cuisine pur ou le fer sont des corps purs.</p>
<p>Un corps pur possède des propriétés constantes : sa température de fusion et sa température d'ébullition ne varient pas dans les conditions habituelles.</p>
</div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Salt%20and%20water.jpg?width=700" alt="Sel dissous dans l'eau, exemple de mélange homogène" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Sel dissous dans l'eau — Wikimedia Commons : Salt and water.jpg.</p>

<h3>2. Mélanges homogènes et hétérogènes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un mélange contient plusieurs substances. On distingue :</p>
<ul>
<li><strong>Mélange homogène</strong> : on ne distingue pas les constituants à l'oeil nu. Exemple : eau salée, eau sucrée, air.</li>
<li><strong>Mélange hétérogène</strong> : on distingue au moins deux parties. Exemple : eau boueuse, sable et graviers, eau et huile.</li>
</ul>
<p>Un mélange peut être séparé par des techniques simples : décantation, filtration, évaporation.</p>
</div>

<h3>3. Ne pas confondre</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une eau claire et transparente n'est pas nécessairement pure : elle peut contenir du sel, du sucre ou des micro-organismes dissous. Une substance qui se dissout ne disparaît pas ; elle change seulement d'aspect dans le mélange.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>On prépare trois échantillons :</p>
<p><strong>Échantillon A :</strong> eau distillée seule. C'est un corps pur.</p>
<p><strong>Échantillon B :</strong> eau avec 10 g de sel bien remués. Le sel est invisible mais présent. C'est un mélange homogène.</p>
<p><strong>Échantillon C :</strong> eau avec du sable. Le sable se dépose au fond. C'est un mélange hétérogène.</p>
<p><strong>Méthode de séparation :</strong> filtrer C pour retenir le sable ; évaporer B pour récupérer le sel.</p>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Filtration%20diagram.svg?width=700" alt="Schéma d'une filtration en laboratoire" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Schéma d'une filtration — Wikimedia Commons : Filtration diagram.svg.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un corps pur contient une seule substance ; un mélange en contient plusieurs. Un mélange homogène est uniforme à l'oeil nu, un mélange hétérogène ne l'est pas. Décantation, filtration et évaporation permettent de séparer les constituants.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif officiel SPTTIC 7e année (MEPST, 2018). Guide officiel d'appui au programme SPTTIC 7e année. Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Sciences physiques — Leçon 3 : L'eau, propriétés, cycle et purification",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un quartier de Kinshasa, l'eau du robinet est parfois interrompue. Les familles recueillent alors l'eau de pluie ou puissent l'eau d'une rivière proche. Ces eaux n'ont pas toutes la même qualité.</p></div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Congo%20river%20bank.jpg?width=700" alt="Berges d'un cours d'eau au Congo" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Berges d'un cours d'eau — Wikimedia Commons : Congo river bank.jpg.</p>

<h3>1. Propriétés physiques de l'eau</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'eau pure est un liquide incolore, inodore et sans saveur. Elle bout à 100 °C et gèle à 0 °C sous la pression atmosphérique normale. Sa masse volumique est proche de 1 g par centimètre cube à 4 °C.</p>
</div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Water%20cycle.png?width=700" alt="Cycle de l'eau dans la nature" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Cycle de l'eau dans la nature — Wikimedia Commons : Water cycle.png.</p>

<h3>2. Le cycle de l'eau</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Sous l'effet du soleil, l'eau des océans, des lacs et des sols s'évapore. La vapeur s'élève, se refroidit et se condense en fines gouttelettes qui forment les nuages. Les gouttelettes s'unissent et retombent sous forme de précipitations (pluie, neige, grêle). L'eau retourne alors aux océans, aux rivières et aux nappes souterraines. Ce mouvement permanent s'appelle le cycle de l'eau.</p>
</div>

<h3>3. La purification de l'eau</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Pour rendre une eau utilisable, on la purifie par étapes :</p>
<ul>
<li><strong>Décantation</strong> : laisser reposer pour que les grosses particules tombent au fond.</li>
<li><strong>Filtration</strong> : faire passer l'eau à travers un filtre (sable, gravier, tissu propre).</li>
<li><strong>Désinfection</strong> : éliminer les micro-organismes par ébullition, par javellisation ou par traitement adapté.</li>
</ul>
<p>Une eau filtrée en classe reste non potable tant qu'elle n'a pas été désinfectée correctement.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève recueille 1 litre d'eau boueuse du ruisseau.</p>
<p><strong>Étape 1 :</strong> décantation pendant 30 minutes ; le sable se dépose au fond.</p>
<p><strong>Étape 2 :</strong> filtration sur un tissu propre puis sur du sable fin ; l'eau devient limpide.</p>
<p><strong>Étape 3 :</strong> ébullition pendant 10 minutes pour tuer les micro-organismes.</p>
<p><strong>Conclusion :</strong> l'eau obtenue est claire et désinfectée par ébullition, mais ce procédé de laboratoire ne remplace pas un traitement professionnel.</p>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Boiling%20water.jpg?width=700" alt="Ébullition de l'eau pour la désinfection" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Ébullition de l'eau — Wikimedia Commons : Boiling water.jpg.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'eau pure bout à 100 °C et gèle à 0 °C. Elle circule en permanence dans la nature selon le cycle de l'eau. Sa purification comprend trois étapes : décantation, filtration et désinfection. Une eau claire n'est pas nécessairement potable.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif officiel SPTTIC 7e année (MEPST, 2018). Guide officiel d'appui au programme SPTTIC 7e année. Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Sciences physiques — Leçon 4 : L'air et ses propriétés",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève gonfle un ballon : le ballon devient plus lourd et plus gros. Un autre ballon, dégonflé, reste léger et plat. L'air est donc bien de la matière, même s'il est invisible.</p></div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Inflated%20and%20uninflated%20balloon.jpg?width=700" alt="Ballon gonflé et ballon dégonflé" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Ballon gonflé et ballon dégonflé — Wikimedia Commons : Inflated and uninflated balloon.jpg.</p>

<h3>1. L'air est un mélange de gaz</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'air est un mélange homogène de plusieurs gaz. Sa composition approximative est : environ 78 % de diazote, 21 % de dioxygène, et 1 % d'autres gaz (argon, dioxyde de carbone, vapeur d'eau). Ces valeurs sont des ordres de grandeur couramment admis.</p>
<p>L'air occupe un volume, possède une masse et exerce une pression sur les parois qui le contiennent.</p>
</div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Air%20composition-fr.svg?width=700" alt="Composition de l'air en français" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Composition de l'air — Wikimedia Commons : Air composition-fr.svg.</p>

<h3>2. Rôle du dioxygène dans la combustion et la respiration</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le dioxygène est indispensable à la combustion (une bougie s'éteint dans un bocal privé de dioxygène) et à la respiration des êtres vivants. Attention : l'air n'est pas du dioxygène pur. L'air contient aussi du diazote, qui n'entretient ni la combustion ni la respiration.</p>
</div>

<h3>3. Pollution de l'air et effet de serre</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La pollution de l'air provient des fumées d'usines, des véhicules, du brûlage des déchets et des feux de brousse. Certains gaz (dioxyde de carbone, méthane) retiennent la chaleur dans l'atmosphère : c'est l'effet de serre. L'effet de serre ne doit pas être confondu avec le trou dans la couche d'ozone, phénomène différent lié à d'autres gaz.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Deux bocaux identiques sont préparés : dans le premier, on enferme une bougie allumée ; dans le second, on place une plante verte à la lumière.</p>
<p><strong>Observation attendue :</strong> la bougie s'éteint après quelques instants car le dioxygène du bocal est consommé. La plante, au contraire, produit du dioxygène grâce à la photosynthèse lorsqu'elle est éclairée.</p>
<p><strong>Conclusion :</strong> la composition de l'air peut varier localement selon les activités ; le dioxygène est indispensable à la combustion.</p>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Candle%20flame%20extinguished.jpg?width=700" alt="Bougie éteinte dans un bocal privé d'oxygène" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Bougie éteinte dans un bocal — Wikimedia Commons : Candle flame extinguished.jpg.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'air est un mélange de gaz : environ 78 % de diazote et 21 % de dioxygène. Le dioxygène entretient la combustion et la respiration, mais l'air n'est pas du dioxygène pur. La pollution atmosphérique et l'effet de serre sont des phénomènes distincts.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif officiel SPTTIC 7e année (MEPST, 2018). Guide officiel d'appui au programme SPTTIC 7e année. Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Sciences physiques — Leçon 5 : Grandeurs physiques et mesures",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>En classe, un élève mesure la longueur du tableau avec un mètre ruban, la masse d'un sac avec une balance et la durée d'une activité avec un chronomètre. Chaque mesure utilise une grandeur et une unité différentes.</p></div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Ruler%20cm.jpg?width=700" alt="Règle graduée en centimètres" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Règle graduée en centimètres — Wikimedia Commons : Ruler cm.jpg.</p>

<h3>1. Grandeurs fondamentales et unités</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une grandeur physique se mesure et s'exprime avec une unité. Les principales grandeurs étudiées en 7e année sont :</p>
<ul>
<li>Longueur : mètre (m).</li>
<li>Masse : kilogramme (kg).</li>
<li>Temps : seconde (s).</li>
<li>Température : degré Celsius (°C).</li>
<li>Intensité du courant électrique : ampère (A).</li>
<li>Intensité lumineuse : candela (cd).</li>
<li>Quantité de matière : mole (mol).</li>
</ul>
</div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Simple%20balance.jpg?width=700" alt="Balance de laboratoire pour mesurer une masse" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Balance de laboratoire — Wikimedia Commons : Simple balance.jpg.</p>

<h3>2. Grandeurs dérivées</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Certaines grandeurs se calculent à partir des grandeurs fondamentales :</p>
<ul>
<li>Surface : longueur × largeur, en mètre carré (m<sup>2</sup>).</li>
<li>Volume : longueur × largeur × hauteur, en mètre cube (m<sup>3</sup>).</li>
<li>Vitesse moyenne : distance divisée par le temps, en mètre par seconde (m/s).</li>
</ul>
</div>

<h3>3. Lire un instrument et exprimer une mesure</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>On lit une mesure à la graduation la plus proche, sans arrondir à l'excès. Une mesure s'écrit toujours par un nombre suivi de son unité : 25 cm, 3,5 kg, 12 s. Écrire seulement « 25 » ou seulement « cm » ne suffit pas.</p>
<p>Attention : la masse et le poids sont deux grandeurs différentes. La masse se mesure en kilogrammes ; le poids est une force et se mesure en newtons (N).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un banc mesure 1,80 m de long et 0,40 m de large.</p>
<p><strong>Surface :</strong> 1,80 m × 0,40 m = 0,72 m<sup>2</sup>.</p>
<p>Un seau d'eau a une masse de 12 kg pour un volume de 12 L. Sa masse volumique est 12 kg divisé par 12 L = 1 kg/L.</p>
<p>Un élève parcourt 300 m en 60 s. Sa vitesse moyenne vaut 300 / 60 = 5 m/s.</p>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Thermometer%20Celsius%20scale.jpg?width=700" alt="Thermomètre gradué en degrés Celsius" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Thermomètre gradué en degrés Celsius — Wikimedia Commons : Thermometer Celsius scale.jpg.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Toute grandeur physique s'exprime par un nombre suivi d'une unité. Longueur, masse, temps et température sont des grandeurs fondamentales. Surface, volume et vitesse sont des grandeurs dérivées. Ne pas confondre masse et poids.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif officiel SPTTIC 7e année (MEPST, 2018). Guide officiel d'appui au programme SPTTIC 7e année. Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Sciences physiques — Leçon 6 : Le circuit électrique simple",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une salle de classe, l'enseignant veut installer une lampe qui s'allume et s'éteint à volonté. Quels composants faut-il relier, et comment ?</p></div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Simple%20electric%20circuit%20with%20lamp%20and%20battery.svg?width=700" alt="Circuit électrique simple avec pile, lampe et interrupteur" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Circuit électrique simple — Wikimedia Commons : Simple electric circuit with lamp and battery.svg.</p>

<h3>1. Les composants du circuit</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un circuit électrique simple comporte :</p>
<ul>
<li><strong>Un générateur</strong> : pile ou batterie, qui fournit l'énergie électrique.</li>
<li><strong>Des fils conducteurs</strong> : ils relient les composants.</li>
<li><strong>Une lampe</strong> : récepteur qui transforme l'énergie électrique en lumière.</li>
<li><strong>Un interrupteur</strong> : il ouvre ou ferme le circuit.</li>
</ul>
</div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Circuit%20ouvert%20et%20ferm%C3%A9.svg?width=700" alt="Circuit ouvert et circuit fermé avec une lampe" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Circuit ouvert et circuit fermé — Wikimedia Commons : Circuit ouvert et fermé.svg.</p>

<h3>2. Circuit ouvert et circuit fermé</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le circuit est fermé lorsque le courant peut circuler sans interruption : la lampe s'allume. Le circuit est ouvert lorsqu'il y a une coupure : la lampe reste éteinte. Un interrupteur ouvert crée une coupure volontaire ; un fil débranché ou une lampe grillée crée une coupure involontaire.</p>
</div>

<h3>3. Schéma normalisé</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un schéma électrique utilise des symboles normalisés : la pile est représentée par deux traits parallèles, la lampe par un cercle contenant une croix, l'interrupteur par un segment incliné entre deux points. Un bon schéma est tracé à la règle, avec des traits droits et sans croisement inutile.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>On dispose d'une pile de 4,5 V, d'une lampe de 3,5 V, de fils et d'un interrupteur.</p>
<p><strong>Montage en série :</strong> pile, interrupteur, lampe reliés l'un après l'autre en boucle.</p>
<p><strong>Observation :</strong> interrupteur ouvert, la lampe reste éteinte. Interrupteur fermé, la lampe s'allume.</p>
<p><strong>Conclusion :</strong> la lampe ne s'allume que si le circuit est fermé.</p>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Electric%20circuit%20symbols.svg?width=700" alt="Symboles normalisés des composants électriques" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Symboles normalisés des composants électriques — Wikimedia Commons : Electric circuit symbols.svg.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un circuit simple comprend un générateur, des fils, un récepteur et un interrupteur. La lampe s'allume uniquement si le circuit est fermé. Les schémas utilisent des symboles normalisés.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif officiel SPTTIC 7e année (MEPST, 2018). Guide officiel d'appui au programme SPTTIC 7e année. Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Sciences physiques — Leçon 7 : Effets et sécurité du courant électrique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un atelier de menuiserie de Kinshasa, un appareil branché sur une prise multiple chauffe et la gaine d'un fil commence à fondre. Un ouvrier coupe immédiatement l'alimentation. Pourquoi le courant peut-il être dangereux ?</p></div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Damaged%20electrical%20wire.jpg?width=700" alt="Câble électrique endommagé" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Câble électrique endommagé — Wikimedia Commons : Damaged electrical wire.jpg.</p>

<h3>1. Effets du courant électrique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le courant électrique produit plusieurs effets :</p>
<ul>
<li><strong>Effet lumineux</strong> : une lampe s'allume.</li>
<li><strong>Effet thermique</strong> : un fil chauffe, un fer à repasser devient chaud.</li>
<li><strong>Effet magnétique</strong> : une bobine parcourue par un courant attire de petits objets métalliques.</li>
</ul>
</div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Fuse%20electrical.jpg?width=700" alt="Fusible électrique, dispositif de protection" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Fusible électrique — Wikimedia Commons : Fuse electrical.jpg.</p>

<h3>2. Court-circuit et surcharge</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un <strong>court-circuit</strong> se produit lorsque deux points d'un circuit sont reliés par un conducteur de très faible résistance : le courant devient très intense, les fils chauffent, un incendie peut se déclencher.</p>
<p>Une <strong>surcharge</strong> se produit lorsque trop d'appareils consomment en même temps sur une même ligne : le courant dépasse la limite supportée.</p>
</div>

<h3>3. Protection et sécurité</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le fusible et le disjoncteur coupent le courant en cas de court-circuit ou de surcharge. Les fils sont entourés d'un matériau isolant (plastique) qui protège du contact direct. Règles de sécurité élémentaires : ne jamais toucher un fil dénudé, ne pas manipuler une prise avec les mains mouillées, ne pas surcharger une prise multiple, couper l'alimentation avant toute intervention.</p>
<p>Attention : un appareil éteint par son interrupteur n'est pas nécessairement isolé du secteur. Un fil dénudé reste dangereux même si l'appareil semble fonctionner.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Analyse de trois situations :</p>
<p><strong>Situation A :</strong> un fil dénudé touche un autre fil. Le courant augmente brutalement : court-circuit.</p>
<p><strong>Situation B :</strong> cinq appareils branchés sur la même prise multiple. La ligne chauffe : surcharge.</p>
<p><strong>Situation C :</strong> une lampe grillée dans un circuit en série. Aucun courant ne circule : circuit ouvert, sans danger mais l'appareil ne fonctionne plus.</p>
<p><strong>Correction :</strong> couper l'alimentation, réparer le fil, répartir les appareils, remplacer le fusible ou réenclencher le disjoncteur.</p>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/High%20voltage%20warning%20sign.svg?width=700" alt="Pictogramme de danger électrique" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Pictogramme de danger électrique — Wikimedia Commons : High voltage warning sign.svg.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le courant produit des effets lumineux, thermiques et magnétiques. Le court-circuit et la surcharge sont dangereux. Fusibles et disjoncteurs protègent l'installation. La prudence impose de ne jamais toucher un fil dénudé ni de surcharger une prise.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif officiel SPTTIC 7e année (MEPST, 2018). Guide officiel d'appui au programme SPTTIC 7e année. Wikimedia Commons (fiches des images).</div>
    `
},

    title: "Technologie — Leçon 8 : Les matériaux de construction",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une famille de Kinshasa possède un terrain et souhaite construire une maison adaptée à ses moyens. Le père se rend au dépôt pour choisir entre briques cuites, blocs de ciment et matériaux locaux.</p></div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Bricks%20in%20Kinshasa.jpg?width=700" alt="Briques empilées sur un chantier" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Briques empilées — Wikimedia Commons : Bricks in Kinshasa.jpg.</p>

<h3>1. Les principaux matériaux</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les matériaux de construction les plus utilisés sont :</p>
<ul>
<li><strong>Terre et argile</strong> : matériaux locaux utilisés pour les briques crues ou cuites.</li>
<li><strong>Briques cuites</strong> : argile moulée puis cuite au four, résistantes et durables.</li>
<li><strong>Blocs de ciment</strong> : mélange de ciment, sable et eau, coulé dans des moules.</li>
<li><strong>Sable et gravier</strong> : utilisés dans les mortiers et les bétons.</li>
<li><strong>Ciment</strong> : liant qui, mélangé à l'eau, durcit en formant une pâte solide.</li>
<li><strong>Fer à béton</strong> : armature métallique qui renforce le béton.</li>
<li><strong>Bois</strong> : utilisé pour la charpente, les portes et les fenêtres.</li>
</ul>
</div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Cement%20bags.jpg?width=700" alt="Sacs de ciment prêts à l'emploi" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Sacs de ciment — Wikimedia Commons : Cement bags.jpg.</p>

<h3>2. Ne pas confondre</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>ciment</strong> est une poudre. Le <strong>mortier</strong> est un mélange de ciment, de sable et d'eau, utilisé pour lier les briques ou les blocs. Le <strong>béton</strong> est un mélange de ciment, de sable, de gravier et d'eau, souvent renforcé par du fer, utilisé pour les dalles et les poteaux.</p>
</div>

<h3>3. Critères de choix</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le choix d'un matériau dépend de plusieurs critères : résistance attendue, coût, disponibilité locale, résistance à l'humidité, facilité de mise en oeuvre et durée de vie souhaitée. Tous les matériaux n'ont pas les mêmes propriétés.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Comparons brique cuite et bloc de ciment :</p>
<p><strong>Brique cuite :</strong> fabriquée avec de l'argile locale, résistante à l'humidité, coût variable selon la disponibilité.</p>
<p><strong>Bloc de ciment :</strong> fabriqué avec du ciment industriel, dimensions régulières, pose rapide, coût plus élevé mais qualité constante.</p>
<p><strong>Liste pour un petit projet :</strong> 500 blocs, 10 sacs de ciment, 1 m<sup>3</sup> de sable, 0,5 m<sup>3</sup> de gravier, fer à béton, planches pour coffrage.</p>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Sand%20and%20gravel.jpg?width=700" alt="Tas de sable et de gravier pour la construction" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Sable et gravier pour la construction — Wikimedia Commons : Sand and gravel.jpg.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les matériaux de construction se choisissent selon la résistance, le coût, la disponibilité et l'usage prévu. Ne pas confondre ciment (poudre), mortier (ciment + sable + eau) et béton (ciment + sable + gravier + eau).</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif officiel SPTTIC 7e année (MEPST, 2018). Guide officiel d'appui au programme SPTTIC 7e année. Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Technologie — Leçon 9 : Choix du terrain et élaboration du plan",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une famille hésite entre deux terrains : l'un est en pente et mal drainé, l'autre est plat et bien situé. Avant de construire, il faut aussi dessiner le plan de la maison.</p></div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Sloping%20land%20and%20flat%20land.jpg?width=700" alt="Comparaison entre terrain en pente et terrain plat" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Terrain en pente et terrain plat — Wikimedia Commons : Sloping land and flat land.jpg.</p>

<h3>1. Critères de choix d'un terrain</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un bon terrain doit réunir plusieurs qualités :</p>
<ul>
<li><strong>Stabilité du sol</strong> : éviter les sols marécageux ou instables.</li>
<li><strong>Drainage</strong> : l'eau ne doit pas stagner après la pluie.</li>
<li><strong>Accès</strong> : proximité d'une route ou d'un chemin praticable.</li>
<li><strong>Environnement</strong> : éviter les zones inondables, les abords d'usines polluantes.</li>
<li><strong>Orientation</strong> : favoriser la lumière naturelle et la ventilation.</li>
</ul>
<p>Le prix seul ne suffit pas à décider : un terrain bon marché mais inondable peut coûter plus cher à aménager.</p>
</div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/House%20plan%20simple.svg?width=700" alt="Plan simple d'une maison vu de dessus" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Plan simple d'une maison vu de dessus — Wikimedia Commons : House plan simple.svg.</p>

<h3>2. Rôle du plan</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un plan de maison est une représentation vue de dessus. Il indique la position des pièces, des portes, des fenêtres et des accès. Il aide à prévoir les dimensions, à estimer les matériaux et à organiser le chantier.</p>
<p>Un plan n'est pas un dessin décoratif : c'est un document technique qui doit respecter une échelle et une légende.</p>
</div>

<h3>3. Éléments d'un plan simple</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un plan simple comporte : le contour de la maison, les murs, les portes (représentées par un arc), les fenêtres (double trait dans le mur), les noms des pièces, une échelle (par exemple 1 cm = 1 m) et une légende.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Comparons deux terrains fictifs :</p>
<p><strong>Terrain A :</strong> pente forte, sol argileux, proche d'un ruisseau. Après une pluie, l'eau stagne. Coût modéré.</p>
<p><strong>Terrain B :</strong> plat, sol sablonneux, bordé d'une route praticable. Drainage naturel. Coût plus élevé.</p>
<p><strong>Choix :</strong> le terrain B est préférable malgré son prix, car il évite les frais d'assainissement futurs.</p>
<p><strong>Plan :</strong> sur une feuille, dessiner un rectangle de 12 cm sur 8 cm (échelle 1 cm = 1 m), placer deux pièces principales, une cuisine et une entrée, avec légende des portes et fenêtres.</p>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Architectural%20drawing%20symbols.svg?width=700" alt="Symboles utilisés dans un plan architectural" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Symboles d'un plan architectural — Wikimedia Commons : Architectural drawing symbols.svg.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le choix du terrain repose sur la stabilité, le drainage, l'accès, l'environnement et l'orientation, pas uniquement sur le prix. Le plan est une vue de dessus qui organise les pièces et guide le chantier. Ne pas confondre plan et façade.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif officiel SPTTIC 7e année (MEPST, 2018). Guide officiel d'appui au programme SPTTIC 7e année. Wikimedia Commons (fiches des images).</div>
    `

<div class="bloc cas"><div class="bloc-label">Situation</div><p>L'école reçoit un ordinateur. Les élèves se demandent à quoi il sert et de quelles parties il est composé. L'enseignant propose d'observer l'appareil avant de l'allumer.</p></div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Computer-aj%20aj%20ashton%2001.svg?width=700" alt="Illustration d'un ordinateur de bureau complet" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Ordinateur de bureau — Wikimedia Commons : Computer-aj aj ashton 01.svg.</p>

<h3>1. Qu'est-ce que l'informatique ?</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'informatique est la science du traitement automatique de l'information. Elle consiste à recueillir des données, à les traiter selon des règles précises et à produire un résultat utile : texte, image, calcul, communication.</p>
<p>Exemples de données : un nom, un nombre, une date, une photo, un son.</p>
</div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Laptop%20computer.png?width=700" alt="Ordinateur portable" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Ordinateur portable — Wikimedia Commons : Laptop computer.png.</p>

<h3>2. Les parties de l'ordinateur</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un ordinateur comprend :</p>
<ul>
<li><strong>L'unité centrale</strong> : c'est le boîtier qui contient les éléments qui traitent l'information.</li>
<li><strong>Le processeur</strong> : il exécute les instructions et effectue les calculs.</li>
<li><strong>La mémoire vive (RAM)</strong> : elle stocke temporairement les données en cours de traitement.</li>
<li><strong>Le disque de stockage</strong> : il conserve les données de façon permanente, même éteint.</li>
<li><strong>L'écran</strong> : il affiche les résultats.</li>
<li><strong>Le clavier et la souris</strong> : ils permettent d'entrer des informations.</li>
</ul>
<p>L'écran n'est pas l'ordinateur entier : c'est seulement un périphérique d'affichage. La mémoire vive n'est pas un stockage permanent : son contenu disparaît à l'extinction.</p>
</div>

<h3>3. Types d'ordinateurs</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>On distingue l'ordinateur de bureau, fixe et puissant, l'ordinateur portable, transportable, la tablette et le téléphone intelligent. Tous traitent des informations, mais avec des tailles et des usages différents.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève observe l'ordinateur de l'école et note :</p>
<p><strong>Unité centrale :</strong> boîtier placé sous la table, contient le processeur et le disque.</p>
<p><strong>Écran :</strong> affiche le bureau après allumage.</p>
<p><strong>Clavier :</strong> comporte des lettres, des chiffres et des touches spéciales.</p>
<p><strong>Souris :</strong> permet de déplacer un curseur sur l'écran.</p>
<p>Il en déduit que l'ordinateur est un ensemble de composants qui collaborent pour traiter l'information.</p>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Personal%20computer%20hardware%20-%20Motherboard.jpg?width=700" alt="Carte mère d'un ordinateur avec composants internes" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Carte mère avec composants internes — Wikimedia Commons : Personal computer hardware - Motherboard.jpg.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'informatique traite automatiquement l'information. L'ordinateur comprend une unité centrale, un processeur, de la mémoire, un stockage, un écran, un clavier et une souris. Ne pas confondre l'écran avec l'ordinateur ni la mémoire vive avec le stockage permanent.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif officiel SPTTIC 7e année (MEPST, 2018). Guide officiel d'appui au programme SPTTIC 7e année. Wikimedia Commons (fiches des images).</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans la salle informatique de l'école, les documents des élèves sont dispersés sur le bureau. Personne ne retrouve les fichiers. Il faut organiser les dossiers et comprendre le rôle des périphériques.</p></div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Computer%20keyboard%20and%20mouse.jpg?width=700" alt="Clavier et souris, périphériques d'entrée" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Clavier et souris — Wikimedia Commons : Computer keyboard and mouse.jpg.</p>

<h3>1. Les périphériques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un périphérique est un appareil relié à l'unité centrale pour échanger des informations. On distingue :</p>
<ul>
<li><strong>Périphériques d'entrée</strong> : clavier, souris, scanner, micro.</li>
<li><strong>Périphériques de sortie</strong> : écran, imprimante, haut-parleur.</li>
<li><strong>Périphériques de stockage</strong> : clé USB, disque dur externe, carte mémoire.</li>
</ul>
</div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Windows%2010%20Start%20Menu.png?width=700" alt="Interface du bureau Windows 10" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Interface du bureau Windows 10 — Wikimedia Commons : Windows 10 Start Menu.png.</p>

<h3>2. Le système d'exploitation Windows</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un système d'exploitation est le logiciel principal qui gère l'ordinateur. Windows est l'un des plus répandus. Il organise l'écran en bureau, fenêtres, icônes et barre des tâches. Il permet d'ouvrir des programmes, de gérer les fichiers et de connecter les périphériques.</p>
</div>

<h3>3. Fichiers, extensions et répertoires</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un fichier est un ensemble de données enregistrées sous un nom. Son extension indique son type : .docx pour un document, .jpg pour une image, .mp3 pour un son, .pdf pour un document à mettre en page.</p>
<p>Un répertoire, ou dossier, regroupe des fichiers. Un dossier peut contenir d'autres dossiers : c'est une arborescence. Pour retrouver un fichier, on organise les dossiers de façon logique (par matière, par année, par type).</p>
<p>Ne pas confondre un fichier avec le programme qui l'ouvre : un fichier .docx n'est pas un logiciel, il est ouvert par un logiciel de traitement de texte.</p>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>

<p>Clavier : périphérique d'entrée. Écran : périphérique de sortie. Clé USB : périphérique de stockage.</p>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Windows%20Explorer%20screenshot.png?width=700" alt="Arborescence de dossiers et fichiers dans Windows Explorer" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Arborescence de dossiers et fichiers — Wikimedia Commons : Windows Explorer screenshot.png.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les périphériques se répartissent en entrée, sortie et stockage. Windows est un système d'exploitation qui gère l'ordinateur. Un fichier a un nom et une extension ; les dossiers forment une arborescence qui permet de retrouver les documents.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif officiel SPTTIC 7e année (MEPST, 2018). Guide officiel d'appui au programme SPTTIC 7e année. Wikimedia Commons (fiches des images).</div>
    `

    title: "TIC — Leçon 13 : Internet, sites et moteurs de recherche",

<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève doit préparer un exposé sur le cycle de l'eau. Il utilise l'ordinateur de la salle informatique pour chercher des informations fiables. Comment faire une recherche utile et sûre ?</p></div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Mozilla%20Firefox%20screenshot.png?width=700" alt="Navigateur Web affiché à l'écran" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Navigateur Web — Wikimedia Commons : Mozilla Firefox screenshot.png.</p>

<h3>1. Distinguer les notions</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Il faut distinguer plusieurs termes :</p>
<ul>
<li><strong>Internet</strong> : le réseau mondial qui relie des millions d'ordinateurs.</li>
<li><strong>Navigateur</strong> : le logiciel qui permet de consulter des pages Web (Chrome, Firefox, Edge).</li>
<li><strong>Site Web</strong> : un ensemble de pages regroupées sous une même adresse.</li>
<li><strong>Page Web</strong> : un document unique consulté dans un site.</li>
<li><strong>Moteur de recherche</strong> : un service qui aide à trouver des pages (Google, Bing, DuckDuckGo).</li>
</ul>
</div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Google%20search%20result%20page.png?width=700" alt="Page de résultats d'un moteur de recherche" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Page de résultats de recherche — Wikimedia Commons : Google search result page.png.</p>

<h3>2. Lire une adresse Web</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une adresse Web (URL) comporte : un protocole (https), un nom de domaine (exemple.edu), et parfois un chemin vers la page. Le https indique une connexion sécurisée ; le http sans s est moins sûr.</p>
<p>Le nom de domaine donne une indication sur la nature du site : .gouv pour gouvernement, .edu pour éducation, .org pour organisation, .com pour commerce.</p>
</div>

<h3>3. Mots-clés et vérification</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une recherche efficace utilise des mots-clés précis. « cycle de l'eau 7e année RDC » donne de meilleurs résultats que « eau ». Il faut ensuite :</p>
<ul>
<li>Comparer plusieurs résultats.</li>
<li>Vérifier la source (qui publie l'information).</li>
<li>Vérifier la date de publication.</li>
<li>Croiser les informations avec un manuel ou un enseignant.</li>
</ul>
</div>

<h3>4. Sécurité numérique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Ne jamais communiquer son mot de passe ni ses informations personnelles à un inconnu. Demander conseil à un adulte en cas de contenu suspect ou choquant. Ne pas cliquer sur des liens promettant des récompenses.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève cherche des informations sur le cycle de l'eau.</p>
<p><strong>Recherche vague :</strong> « eau » — résultats trop nombreux.</p>
<p><strong>Recherche précise :</strong> « cycle de l'eau explication 7e année » — résultats plus pertinents.</p>
<p><strong>Comparaison :</strong> deux sites donnent des schémas. L'élève vérifie la date et l'auteur. Il retient le site dont les informations concordent avec son manuel.</p>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/URL%20structure.svg?width=700" alt="Structure d'une adresse Web (URL)" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Structure d'une URL — Wikimedia Commons : URL structure.svg.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Internet est le réseau mondial. Le navigateur consulte les pages Web ; le moteur de recherche aide à les trouver. Une recherche efficace utilise des mots-clés précis, compare les sources et vérifie les dates. La sécurité numérique impose de protéger ses informations personnelles.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif officiel SPTTIC 7e année (MEPST, 2018). Guide officiel d'appui au programme SPTTIC 7e année. Wikimedia Commons (fiches des images).</div>

    title: "TIC — Leçon 14 : Traitement de texte et communication numérique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>La classe doit produire un court rapport d'activité sur une sortie pédagogique, puis le transmettre à l'enseignant par courrier électronique. Comment rédiger, mettre en forme et envoyer ce document ?</p></div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/LibreOffice%20Writer%20screenshot.png?width=700" alt="Document de traitement de texte affiché à l'écran" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Document de traitement de texte — Wikimedia Commons : LibreOffice Writer screenshot.png.</p>

<h3>1. Saisir et corriger un texte</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un logiciel de traitement de texte permet de saisir du texte, de le modifier et de le mettre en forme. Il faut relire son texte pour corriger les fautes de frappe, d'orthographe et de ponctuation.</p>
<p>Raccourcis utiles : Ctrl+C pour copier, Ctrl+V pour coller, Ctrl+X pour couper, Ctrl+Z pour annuler, Ctrl+S pour enregistrer.</p>
</div>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/QWERTY%20keyboard.jpg?width=700" alt="Clavier QWERTY avec touches de raccourcis" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Clavier QWERTY — Wikimedia Commons : QWERTY keyboard.jpg.</p>

<h3>2. Mettre en forme</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Mettre en forme consiste à : choisir une police lisible, ajuster la taille (12 à 14 pour un document scolaire), aligner le texte (gauche, centré, justifié), utiliser le gras pour les titres, insérer des listes à puces. Une mise en forme sobre et cohérente facilite la lecture.</p>
</div>

<h3>3. Enregistrer un document</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Enregistrer, c'est écrire le document sur un support de stockage. Un document n'est pas conservé s'il n'a pas été enregistré, même s'il est visible à l'écran. On enregistre régulièrement, et on choisit un nom clair et un dossier logique.</p>
</div>

<h3>4. Courrier électronique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un courriel (courrier électronique) comporte : un destinataire (adresse du correspondant), un objet (résumé du message), un corps (le message), parfois une pièce jointe (un fichier joint). Bonnes pratiques : objet clair, message court, relecture avant envoi, prudence avec les pièces jointes inconnues.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Rapport d'activité :</p>
<p><strong>Fichier :</strong> rapport_sortie_7e.docx enregistré dans le dossier Ecole 2025-2026.</p>
<p><strong>Corps du courriel :</strong> « Monsieur l'enseignant, veuillez trouver en pièce jointe le rapport de la sortie pédagogique du 15 octobre 2025. Cordialement, Mwamba. »</p>
<p><strong>Destinataire :</strong> adresse de l'enseignant.</p>

<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Email%20attachment%20example.png?width=700" alt="Exemple de courriel avec pièce jointe" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'">

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un traitement de texte permet de saisir, corriger, mettre en forme et enregistrer un document. Un courriel comporte un destinataire, un objet, un corps et éventuellement une pièce jointe. Toujours relire avant d'envoyer.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif officiel SPTTIC 7e année (MEPST, 2018). Guide officiel d'appui au programme SPTTIC 7e année. Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Évaluation finale — SPTTIC 7e année",
    content: `
<div class="bloc theorie"><div class="bloc-label">Évaluation</div>
<p>Cette évaluation comprend 35 questions à choix multiples couvrant les trois parties : Sciences physiques (15 questions), Technologie (10 questions) et TIC (10 questions).</p>
<p>Pour chaque question, une seule réponse est correcte. Lis chaque énoncé avant de choisir.</p>
</div>
<div class="quiz-container">
    <div id="quizQuestions"></div>
    <button id="submitQuiz" class="quiz-btn-submit">Valider mes réponses</button>
    <div id="quizResult" class="quiz-result"></div>
</div>
    `
}
];

const questions = [
{ q: "Quels sont les trois états physiques de la matière ?", options: ["Chaud, froid, tiède", "Solide, liquide, gaz", "Lourd, léger, moyen"], answer: 1 },
{ q: "Comment appelle-t-on le passage de l'état liquide à l'état solide ?", options: ["La fusion", "La vaporisation", "La solidification"], answer: 2 },
{ q: "Lors de la fusion d'un glaçon, que devient sa masse ?", options: ["Elle reste la même", "Elle augmente", "Elle disparaît"], answer: 0 },
{ q: "Qu'est-ce qu'un corps pur ?", options: ["Un corps transparent", "Un corps constitué d'une seule substance", "Un corps solide"], answer: 1 },
{ q: "Comment appelle-t-on un mélange où l'on ne distingue pas les constituants à l'oeil nu ?", options: ["Hétérogène", "Saturé", "Homogène"], answer: 2 },
{ q: "Quelle technique permet de retenir le sable contenu dans l'eau ?", options: ["La filtration", "L'évaporation", "La distillation"], answer: 0 },
{ q: "À quelle température l'eau pure bout-elle sous pression atmosphérique normale ?", options: ["50 °C", "100 °C", "200 °C"], answer: 1 },
{ q: "Quelle étape du traitement de l'eau élimine les micro-organismes ?", options: ["La décantation", "La filtration", "La désinfection"], answer: 2 },
{ q: "Quelle est la proportion approximative de dioxygène dans l'air ?", options: ["21 %", "78 %", "50 %"], answer: 0 },
{ q: "Quel gaz est indispensable à la combustion ?", options: ["Le diazote", "Le dioxygène", "L'argon"], answer: 1 },
{ q: "Quelle unité utilise-t-on pour mesurer une longueur dans le système international ?", options: ["Le kilogramme", "La seconde", "Le mètre"], answer: 2 },
{ q: "Quelle est l'unité de la masse ?", options: ["Le kilogramme", "Le newton", "Le litre"], answer: 0 },
{ q: "Un élève parcourt 400 m en 80 s. Quelle est sa vitesse moyenne ?", options: ["4 m/s", "5 m/s", "8 m/s"], answer: 1 },
{ q: "Quel composant fournit l'énergie électrique dans un circuit ?", options: ["La lampe", "L'interrupteur", "Le générateur"], answer: 2 },
{ q: "Dans quel cas la lampe d'un circuit simple s'allume-t-elle ?", options: ["Quand le circuit est fermé", "Quand le circuit est ouvert", "Quand l'interrupteur est retiré"], answer: 0 },
{ q: "Quel matériau est obtenu en mélangeant du ciment, du sable, du gravier et de l'eau ?", options: ["Le mortier", "Le béton", "L'enduit"], answer: 1 },
{ q: "Quel critère ne doit pas guider à lui seul le choix d'un terrain ?", options: ["La stabilité du sol", "Le drainage", "Le prix uniquement"], answer: 2 },
{ q: "Que représente un plan de maison ?", options: ["Une vue de dessus", "Une vue de face", "Une vue de côté"], answer: 0 },
{ q: "Quel métier pose la charpente et la toiture ?", options: ["Le plombier", "Le charpentier ou le couvreur", "Le carreleur"], answer: 1 },
{ q: "Quand doit-on réaliser la peinture des murs ?", options: ["Avant les fondations", "Avant la toiture", "Après la maçonnerie et le crépissage"], answer: 2 },
{ q: "Que doit porter un ouvrier sur un chantier ?", options: ["Des équipements de protection individuelle", "Uniquement des gants", "Aucun équipement particulier"], answer: 0 },
{ q: "Quel est le rôle du ciment dans la construction ?", options: ["Servir de décoration", "Servir de liant qui durcit avec l'eau", "Remplacer le sable"], answer: 1 },
{ q: "Que signifie le sigle TIC ?", options: ["Traitement de l'information et du calcul", "Techniques de l'ingénierie civile", "Technologies de l'information et de la communication"], answer: 2 },
{ q: "Quelle partie de l'ordinateur exécute les instructions ?", options: ["Le processeur", "L'écran", "Le clavier"], answer: 0 },
{ q: "Quel périphérique est un périphérique d'entrée ?", options: ["L'imprimante", "Le clavier", "Le haut-parleur"], answer: 1 },
{ q: "Quelle extension correspond à un document de traitement de texte ?", options: ["jpg", "mp3", "docx"], answer: 2 },
{ q: "Quel est le rôle d'un système d'exploitation ?", options: ["Gérer les ressources de l'ordinateur", "Remplacer le processeur", "Fabriquer des images"], answer: 0 },
{ q: "Quelle est la différence entre Internet et un moteur de recherche ?", options: ["Aucune différence", "Internet est le réseau mondial, le moteur de recherche aide à trouver des pages", "Le moteur de recherche est un câble"], answer: 1 },
{ q: "Quel protocole indique une connexion sécurisée dans une adresse Web ?", options: ["http", "ftp", "https"], answer: 2 },
{ q: "Que faut-il faire avant d'envoyer un courriel ?", options: ["Relire le message et vérifier le destinataire", "Éteindre l'ordinateur", "Supprimer la pièce jointe"], answer: 0 },
{ q: "Quel raccourci clavier permet d'enregistrer un document ?", options: ["Ctrl+P", "Ctrl+S", "Ctrl+A"], answer: 1 },
{ q: "Que comporte un courriel ?", options: ["Uniquement un objet", "Un destinataire, un objet, un corps et parfois une pièce jointe", "Seulement une pièce jointe"], answer: 2 },
{ q: "Que faut-il faire face à une pièce jointe inconnue ?", options: ["L'ouvrir immédiatement", "Ne pas l'ouvrir et demander conseil", "La transférer à tous ses amis"], answer: 0 },
{ q: "Quel est le rôle du disque de stockage ?", options: ["Conserver les données même éteint", "Afficher l'image", "Refroidir le processeur"], answer: 1 },
{ q: "Pourquoi faut-il organiser ses fichiers dans des dossiers ?", options: ["Pour occuper le disque", "Pour ralentir l'ordinateur", "Pour retrouver plus facilement ses documents"], answer: 2 }
];

questions.forEach(function(q) {
    if (!q.text) {
        q.text = q.question || q.q || q.enonce || q.titre || "";
    }
    if (typeof q.correct === 'undefined') {
        if (typeof q.answer !== 'undefined') q.correct = q.answer;
        else if (typeof q.reponse !== 'undefined') q.correct = q.reponse;
    }
});

let currentSlide = 0;
let lastSearchTerm = "", searchResults = [], currentResultIdx = -1;
const contentDiv = document.getElementById('content');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const slideCounterSpan = document.getElementById('slideCounter');
const progressFill = document.getElementById('progressFill');
const counterSpan = document.getElementById('counter');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchNav = document.getElementById('searchNav');
const prevResultBtn = document.getElementById('prevResultBtn');
const nextResultBtn = document.getElementById('nextResultBtn');
const resultCounterSpan = document.getElementById('resultCounter');
const pageTitle = document.getElementById('pageTitle');
pageTitle.textContent = "ECOLIA · " + COURSE_TITLE;
document.title = "ECOLIA — " + COURSE_TITLE;
function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';
    slideCounterSpan.textContent = '0/0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>
</body>
</html>
