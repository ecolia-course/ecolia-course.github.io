{
    title: "Leçon 1 — Introduction à la correspondance commerciale et administrative",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une entreprise de Kinshasa, un stagiaire doit rédiger une lettre à un fournisseur de Lubumbashi. Il hésite : quel ton adopter ? Quelles formules de politesse ? Quel format ? Une correspondance mal rédigée nuit à l'image de l'entreprise. Maîtriser les règles de la correspondance est une compétence professionnelle fondamentale.</p></div>
<h3>1. Définition et importance</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Correspondance commerciale</strong> : ensemble des lettres et écrits échangés dans le cadre des relations d'affaires.</li><li><strong>Correspondance administrative</strong> : lettres échangées avec les administrations publiques (ministères, DGI, DGDA).</li><li><strong>Importance</strong> : preuve juridique, image de l'entreprise, efficacité de la communication.</li><li><strong>Qualités d'une bonne correspondance</strong> : clarté, concision, courtoisie, exactitude, présentation soignée.</li></ul></div>
<h3>2. Les types de correspondance</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Correspondance commerciale</strong> : lettres de commande, de livraison, de facturation, de réclamation.</li><li><strong>Correspondance administrative</strong> : demandes, notifications, recours.</li><li><strong>Correspondance interne</strong> : notes de service, circulaires, comptes rendus de réunion.</li><li><strong>Correspondance externe</strong> : lettres aux clients, fournisseurs, banques, administrations.</li></ul></div>
<h3>3. Les règles générales de présentation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>En-tête</strong> : coordonnées de l'entreprise (nom, adresse, téléphone, e-mail, NIF, RCCM).</li><li><strong>Date et lieu</strong> : toujours mentionnés (ex. « Kinshasa, le 15 mars 2025 »).</li><li><strong>Références</strong> : numéro de dossier, références de la correspondance précédente.</li><li><strong>Objet</strong> : résumé en une ligne du sujet (ex. « Objet : commande de 50 cartons de biscuits »).</li><li><strong>Formule d'appel</strong> : « Monsieur le Directeur, », « Madame, », « Cher client, ».</li><li><strong>Corps</strong> : développement structuré (introduction, développement, conclusion).</li><li><strong>Formule de courtoisie</strong> : « Veuillez agréer, Monsieur le Directeur, l'expression de mes salutations distinguées. »</li><li><strong>Signature</strong> : nom, fonction, cachet de l'entreprise.</li><li><strong>Pièces jointes</strong> : mention des documents joints.</li></ul></div>
<h3>4. Le style et le ton</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Style impersonnel</strong> : « Notre entreprise a le plaisir de… », « Nous vous informons que… ».</li><li><strong>Politesse et respect</strong> : toujours vouvoyer, éviter le tutoiement.</li><li><strong>Précision</strong> : chiffres, dates, références exacts.</li><li><strong>Formules d'ouverture</strong> : « Nous avons l'honneur de… », « Nous vous prions de bien vouloir… ».</li><li><strong>Formules de clôture</strong> : « En vous remerciant par avance… », « Dans l'attente de votre réponse… ».</li></ul><p><a href="https://www.youtube.com/results?search_query=correspondance+commerciale+administrative+règles+rédaction" target="_blank" rel="noopener">🎥 Recherche : introduction à la correspondance (chaînes de cours de français commercial)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La correspondance commerciale et administrative regroupe l'ensemble des écrits d'affaires. Elle doit être claire, concise, courtoise et exacte. Sa présentation suit des règles précises : en-tête, date, objet, formule d'appel, corps, formule de courtoisie, signature.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Correspondance Commerciale et Administrative Française, 4e CG (manuels-scolaires-rdc.com, 2025) ; Curriculum de Commerciale et Gestion (MEPST/DIPROMAD, 2023).<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, NIF, RCCM.</div>
    `
},
{
    title: "Leçon 2 — La demande de renseignements et la réponse",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une entreprise de Kinshasa cherche un fournisseur de pièces détachées à Lubumbashi. Avant de passer commande, elle envoie une demande de renseignements pour connaître les prix, les délais et les conditions. C'est la première étape de toute relation commerciale sérieuse.</p></div>
<h3>1. Objet et structure de la demande de renseignements</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Objectif</strong> : obtenir des informations avant de s'engager (prix, qualité, délais, conditions de paiement).</li><li><strong>Structure</strong> : formule d'appel, présentation de l'entreprise, objet de la demande, questions précises, formule de politesse.</li><li><strong>Précision</strong> : les questions doivent être numérotées et précises.</li><li><strong>Ton</strong> : courtois, professionnel, concis.</li></ul></div>
<h3>2. Mentions obligatoires</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Identification du demandeur</strong> : nom, coordonnées, activités.</li><li><strong>Objet précis</strong> : ce que l'on veut savoir.</li><li><strong>Questions numérotées</strong> : prix, remises, délais, conditions de paiement, références.</li><li><strong>Formule de clôture</strong> : remerciements, promesse de réponse.</li></ul></div>
<h3>3. La réponse à une demande de renseignements</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Structure</strong> : remerciement pour l'intérêt porté, réponse aux questions posées, proposition commerciale, formule de politesse.</li><li><strong>Ton</strong> : avenant, professionnel, convaincant.</li><li><strong>Objectif</strong> : transformer la demande en commande.</li><li><strong>Documents joints</strong> : catalogue, tarif, conditions générales de vente.</li></ul></div>
<h3>4. Exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><strong>Demande de renseignements</strong></p><p>Kinshasa, le 15 mars 2025</p><p>Objet : demande de renseignements sur vos pièces détachées</p><p>Messieurs,</p><p>Nous avons pris connaissance de votre annonce parue dans le journal « Le Potentiel » du 10 mars 2025 et nous vous prions de bien vouloir nous communiquer les renseignements suivants :</p><ol><li>Le prix unitaire de vos filtres à huile référence FH-2025 ;</li><li>Les remises accordées pour une commande de 100 unités ;</li><li>Les délais de livraison à Kinshasa ;</li><li>Les conditions de paiement.</li></ol><p>Dans l'attente de votre réponse, nous vous prions d'agréer, Messieurs, l'expression de nos salutations distinguées.</p><p><strong>Réponse</strong></p><p>Lubumbashi, le 20 mars 2025</p><p>Objet : réponse à votre demande de renseignements du 15 mars 2025</p><p>Monsieur,</p><p>Nous vous remercions de l'intérêt que vous portez à nos produits. Voici les renseignements demandés :</p><ol><li>Prix unitaire du filtre FH-2025 : 25 000 FC ;</li><li>Remise de 5 % pour toute commande de 100 unités ;</li><li>Délai de livraison : 7 jours ouvrables ;</li><li>Conditions de paiement : 30 % à la commande, solde à la livraison.</li></ol><p>Nous restons à votre disposition pour tout complément d'information.</p><p><a href="https://www.youtube.com/results?search_query=demande+renseignements+commerciaux+réponse+lettre" target="_blank" rel="noopener">🎥 Recherche : la demande de renseignements (chaînes de cours de français commercial)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La demande de renseignements précède toute relation commerciale. Elle doit être précise et courtoise. La réponse doit être complète, avenante et convaincante pour transformer la demande en commande. Les questions sont numérotées, les réponses structurées.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Correspondance Commerciale, 4e CG (manuels-scolaires-rdc.com, 2025).</div>
    `
},
{
    title: "Leçon 3 — L'offre, le devis et le bon de commande",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Après sa demande de renseignements, une entreprise de Kinshasa reçoit une offre détaillée de son fournisseur de Lubumbashi. Elle compare, négocie, puis passe commande. Offre, devis et bon de commande sont trois documents clés de la relation commerciale.</p></div>
<h3>1. L'offre de prix</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : proposition commerciale faite par un vendeur à un client potentiel.</li><li><strong>Mentions</strong> : désignation des produits, prix unitaires, remises, TVA, conditions de livraison, conditions de paiement, validité de l'offre.</li><li><strong>Validité</strong> : l'offre est valable pour une durée déterminée (15, 30 ou 60 jours).</li><li><strong>Distinction avec le devis</strong> : l'offre est standard, le devis est personnalisé.</li></ul></div>
<h3>2. Le devis</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : document écrit par lequel un fournisseur propose un prix et des conditions pour un travail ou des fournitures spécifiques.</li><li><strong>Mentions</strong> : identification du client, description détaillée du travail, quantités, prix unitaires et totaux, TVA, délais, conditions de paiement.</li><li><strong>Valeur</strong> : sans engagement tant qu'il n'est pas signé par le client.</li><li><strong>Durée de validité</strong> : généralement 30 jours.</li></ul></div>
<h3>3. Le bon de commande</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : document par lequel le client confirme sa commande.</li><li><strong>Mentions</strong> : référence du devis accepté, désignation des produits, quantités, prix, délais, conditions de paiement, lieu de livraison.</li><li><strong>Valeur juridique</strong> : contrat entre les parties, engage le client.</li><li><strong>Numérotation</strong> : chaque bon de commande porte un numéro unique.</li></ul></div>
<h3>4. Exemple concret</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><strong>Offre de prix</strong> : Sarl Pièces Auto, Lubumbashi, 20 mars 2025. Offre valable jusqu'au 20 avril 2025. Filtres FH-2025 : 25 000 FC l'unité, remise 5 % dès 100 unités, TVA 16 %, livraison 7 jours.</p><p><strong>Devis</strong> : Menuisier Moderne, Kinshasa, 25 mars 2025. Devis pour 10 bureaux en bois massif : 500 000 FC l'unité, total 5 000 000 FC HT, TVA 16 %, livraison 30 jours, acompte 40 %.</p><p><strong>Bon de commande n°2025-0125</strong> : Sarl Kanyinda, Kinshasa, 28 mars 2025. Commande de 100 filtres FH-2025 au prix de 25 000 FC l'unité, moins 5 % de remise. Montant total : 2 375 000 FC HT, TVA 16 % = 380 000 FC, TTC = 2 755 000 FC.</p><p><a href="https://www.youtube.com/results?search_query=offre+devis+bon+commande+lettre+commerciale" target="_blank" rel="noopener">🎥 Recherche : l'offre, le devis et le bon de commande (chaînes de cours de français commercial)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'offre de prix est une proposition commerciale standard avec durée de validité. Le devis est personnalisé et sans engagement tant qu'il n'est pas signé. Le bon de commande confirme la commande et engage juridiquement le client.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Correspondance Commerciale, 4e CG (manuels-scolaires-rdc.com, 2025).</div>
    `

{
    title: "Leçon 4 — La lettre de réclamation et la réponse",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un client de Kinshasa reçoit 50 cartons de biscuits, mais 5 sont avariés. Il écrit au fournisseur pour réclamer un avoir. Bien rédigée, la réclamation aboutit à une solution rapide. Mal rédigée, elle envenime le conflit.</p></div>
<h3>1. Objet et structure de la réclamation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : lettre par laquelle un client exprime son mécontentement sur une commande ou une prestation.</li><li><strong>Structure</strong> : rappel de la commande, description du problème, demande précise, formule de politesse.</li><li><strong>Ton</strong> : ferme mais courtois. Jamais d'insultes ni de menaces.</li><li><strong>Objectif</strong> : obtenir réparation (remplacement, avoir, remboursement).</li></ul></div>
<h3>2. Les motifs fréquents de réclamation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Retard de livraison</strong> : non-respect du délai annoncé.</li><li><strong>Marchandises avariées</strong> : produits endommagés ou périmés.</li><li><strong>Non-conformité</strong> : produits ne correspondant pas à la commande.</li><li><strong>Erreur de facturation</strong> : montant incorrect, TVA mal calculée.</li><li><strong>Défaut de qualité</strong> : produit non conforme aux spécifications.</li></ul></div>
<h3>3. La réponse à une réclamation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Accusé de réception</strong> : remercier le client pour sa confiance.</li><li><strong>Reconnaissance du problème</strong> : ne pas nier, ne pas fuir.</li><li><strong>Proposition de solution</strong> : remplacement, avoir, geste commercial.</li><li><strong>Excuses</strong> : sincères et proportionnées.</li><li><strong>Engagement</strong> : mesures prises pour éviter la répétition.</li></ul></div>
<h3>4. Exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><strong>Réclamation</strong></p><p>Kinshasa, le 30 mars 2025</p><p>Objet : réclamation — 5 cartons de biscuits avariés (commande n°2025-0125)</p><p>Messieurs,</p><p>Nous avons bien reçu le 28 mars 2025 les 50 cartons de biscuits commandés. Or, après vérification, nous constatons que 5 cartons présentent des traces d'humidité et sont partiellement avariés. Le manquant représente une perte de 125 000 FC.</p><p>Nous vous prions de bien vouloir nous faire parvenir un avoir correspondant ou de procéder au remplacement de ces 5 cartons à vos frais dans les meilleurs délais.</p><p><strong>Réponse</strong></p><p>Lubumbashi, le 2 avril 2025</p><p>Monsieur,</p><p>Nous vous remercions de votre confiance renouvelée et prenons bonne note du problème signalé. Nous vous présentons nos sincères excuses pour ce désagrément. Un avoir de 137 750 FC vous sera adressé sous 48 heures. Nous avons par ailleurs renforcé notre contrôle qualité pour éviter que cela ne se reproduise.</p><p><a href="https://www.youtube.com/results?search_query=lettre+réclamation+commerciale+réponse+client" target="_blank" rel="noopener">🎥 Recherche : la lettre de réclamation (chaînes de cours de français commercial)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La réclamation est une lettre par laquelle le client exprime son mécontentement. Elle doit être ferme mais courtoise et précise les faits. La réponse doit reconnaître le problème, proposer une solution et présenter des excuses. Un bon traitement des réclamations fidélise le client.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Correspondance Commerciale, 4e CG (manuels-scolaires-rdc.com, 2025).</div>
    `
},
{
    title: "Leçon 5 — La lettre de relance pour impayés",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une facture de 500 000 FC émise en janvier n'est toujours pas payée en mars. L'entreprise de Kinshasa doit envoyer une lettre de relance à son client de Matadi. Cette relance est la première étape avant une procédure contentieuse.</p></div>
<h3>1. Les étapes de la relance</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>1re relance (courtoise)</strong> : rappeler l'échéance avec tact, supposer un oubli.</li><li><strong>2e relance (ferme)</strong> : mentionner les pénalités de retard, fixer un délai impératif.</li><li><strong>3e relance (mise en demeure)</strong> : lettre recommandée avec AR, dernier avertissement avant poursuites.</li><li><strong>Action judiciaire</strong> : saisir le tribunal compétent.</li></ul></div>
<h3>2. Structure de la lettre de relance</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>En-tête</strong> : coordonnées de l'entreprise.</li><li><strong>Objet</strong> : « Relance pour facture impayée n° X ».</li><li><strong>Rappel</strong> : date et montant de la facture, échéance dépassée.</li><li><strong>Demande</strong> : paiement dans un délai précis (8 jours, 15 jours).</li><li><strong>Conséquence</strong> : mention des pénalités de retard ou des poursuites à venir.</li><li><strong>Formule de politesse</strong> : maintenir le ton courtois.</li></ul></div>
<h3>3. Les pénalités de retard</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Pénalités conventionnelles</strong> : fixées par le contrat (ex. 1 % par mois de retard).</li><li><strong>Intérêts légaux</strong> : taux fixé par la loi.</li><li><strong>Frais de recouvrement</strong> : à la charge du débiteur en cas de poursuites.</li><li><strong>Astuce</strong> : mentionner les pénalités dès la première relance pour dissuader le débiteur.</li></ul></div>
<h3>4. Exemples de relances progressives</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><strong>1re relance (courtoise)</strong></p><p>Kinshasa, le 15 mars 2025</p><p>Objet : relance pour facture n°2025-001 du 15 janvier 2025</p><p>Monsieur,</p><p>Sauf erreur de notre part, nous n'avons pas encore reçu le paiement de la facture n°2025-001 d'un montant de 500 000 FC, échue le 15 février 2025. Nous vous prions de bien vouloir procéder au règlement dans les meilleurs délais.</p><p><strong>2e relance (ferme)</strong></p><p>Kinshasa, le 30 mars 2025</p><p>Objet : 2e relance — facture n°2025-001 impayée</p><p>Monsieur,</p><p>Malgré notre première relance du 15 mars 2025, nous constatons que la facture n°2025-001, d'un montant de 500 000 FC, reste impayée. Nous vous prions de bien vouloir procéder au règlement dans les 8 jours, faute de quoi des pénalités de retard de 1 % par mois seront appliquées.</p><p><strong>3e relance (mise en demeure)</strong></p><p>Kinshasa, le 15 avril 2025</p><p>Objet : mise en demeure de payer la facture n°2025-001</p><p>Monsieur,</p><p>Par la présente, envoyée en recommandé avec accusé de réception, nous vous mettons en demeure de régler sous 8 jours la facture n°2025-001 de 500 000 FC, majorée des pénalités de retard s'élevant à 25 000 FC. À défaut, nous serons contraints d'engager une procédure judiciaire de recouvrement.</p><p><a href="https://www.youtube.com/results?search_query=lettre+relance+impayés+commercial+mise+en+demeure" target="_blank" rel="noopener">🎥 Recherche : la lettre de relance (chaînes de cours de français commercial)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La relance se fait en trois étapes : courtoise, ferme, mise en demeure. Chaque étape rappelle la facture, l'échéance et le montant, puis fixe un délai et mentionne les conséquences. La mise en demeure est envoyée en recommandé avec AR et précède l'action judiciaire.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Correspondance Commerciale, 4e CG (manuels-scolaires-rdc.com, 2025).</div>
    `
},
{
    title: "Leçon 6 — La lettre administrative et la correspondance avec les administrations",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une entreprise de Kinshasa doit écrire à la DGI pour contester un redressement fiscal. Elle doit adresser une réclamation en bonne et due forme. Le ton et la structure sont différents de la correspondance commerciale. C'est la correspondance administrative.</p></div>
<h3>1. Caractéristiques de la lettre administrative</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Formalisme</strong> : très codifiée, le ton est impersonnel et respectueux.</li><li><strong>Formule d'appel</strong> : « Monsieur le Directeur Général, », « Monsieur le Gouverneur, », « Excellence, ».</li><li><strong>Objet précis</strong> : indiquer clairement la nature de la demande.</li><li><strong>Références</strong> : numéro du dossier, de l'acte contesté.</li><li><strong>Pièces jointes</strong> : copies des documents justificatifs.</li><li><strong>Formule de courtoisie</strong> : « Veuillez agréer, Monsieur le Directeur, l'expression de ma haute considération. »</li></ul></div>
<h3>2. Les principaux types de lettres administratives</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Demande</strong> : solliciter une autorisation, un agrément, un document.</li><li><strong>Réclamation</strong> : contester une décision administrative.</li><li><strong>Recours gracieux</strong> : demander à l'administration de revenir sur sa décision.</li><li><strong>Recours contentieux</strong> : saisir le tribunal administratif.</li><li><strong>Notification</strong> : informer l'administration d'un changement (adresse, activité).</li></ul></div>
<h3>3. La réclamation fiscale auprès de la DGI</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Délai</strong> : 90 jours à compter de la notification du redressement.</li><li><strong>Destinataire</strong> : Directeur Général des Impôts.</li><li><strong>Contenu</strong> : identification, référence de l'acte contesté, motifs, demande de décharge.</li><li><strong>Pièces jointes</strong> : copie de l'acte contesté, justificatifs.</li><li><strong>Voie d'envoi</strong> : recommandé avec AR ou dépôt contre décharge.</li></ul></div>
<h3>4. Exemple de réclamation fiscale</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Kinshasa, le 15 mars 2025</p><p>À Monsieur le Directeur Général des Impôts<br>Direction Générale des Impôts<br>Kinshasa/Gombe</p><p>Objet : réclamation contre le redressement fiscal n° DGI/RD/2025-0125 notifié le 20 février 2025</p><p>Monsieur le Directeur Général,</p><p>Par la présente, notre société Sarl Kanyinda, NIF 123456789, RCCM CD/KIN/RCCM/20-B-0125, a l'honneur de contester le redressement fiscal n° DGI/RD/2025-0125 notifié le 20 février 2025 pour un montant de 15 000 000 FC.</p><p>En effet, ledit redressement porte sur un chiffre d'affaires de 45 000 000 FC que nous estimons erroné. Notre chiffre d'affaires réel pour l'exercice 2024 s'élève à 32 000 000 FC, comme l'attestent notre comptabilité et nos déclarations mensuelles de TVA jointes en annexe.</p><p>En conséquence, nous vous prions de bien vouloir procéder à la décharge de la taxation contestée, ou à défaut, à sa réduction.</p><p>Veuillez agréer, Monsieur le Directeur Général, l'expression de notre haute considération.</p><p><strong>Pièces jointes :</strong> copie de l'acte contesté, extraits de comptabilité, déclarations TVA 2024.</p><p><a href="https://www.youtube.com/results?search_query=lettre+administrative+réclamation+fiscale+DGI+recours" target="_blank" rel="noopener">🎥 Recherche : la lettre administrative (chaînes de cours de français commercial)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La lettre administrative est très codifiée et impersonnelle. Elle sert à demander, réclamer, contester ou notifier. La réclamation fiscale à la DGI se fait dans les 90 jours suivant la notification, par recommandé avec AR. Elle précise les motifs et joint les justificatifs.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Correspondance Commerciale, 4e CG (manuels-scolaires-rdc.com, 2025) ; DGI — Procédure de réclamation (dgi.gouv.cd).</div>
    `
},
{
    title: "Leçon 7 — La note de service, la circulaire et le compte rendu",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une entreprise de Lubumbashi, le directeur général émet une note de service pour annoncer une nouvelle politique interne. Il rédige également une circulaire sur les horaires et un compte rendu de la réunion mensuelle. Ces documents internes structurent la vie de l'entreprise.</p></div>
<h3>1. La note de service</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : document interne par lequel un responsable transmet une information ou un ordre à ses subordonnés.</li><li><strong>Structure</strong> : en-tête, émetteur, destinataires, date, objet, corps (information ou instruction), signature.</li><li><strong>Ton</strong> : direct, clair, impersonnel.</li><li><strong>Diffusion</strong> : affichage, intranet, courriel interne.</li><li><strong>Numérotation</strong> : chaque note porte un numéro pour archivage.</li></ul></div>
<h3>2. La circulaire</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : document adressé à un grand nombre de destinataires (personnel, clients, partenaires).</li><li><strong>Objectif</strong> : informer d'une décision, d'une procédure ou d'un changement.</li><li><strong>Structure</strong> : en-tête, objet, corps, formule de politesse.</li><li><strong>Diffusion</strong> : affichage, courrier, courriel.</li><li><strong>Exemples</strong> : circulaire sur les horaires, sur la politique de sécurité, sur la fermeture exceptionnelle.</li></ul></div>
<h3>3. Le compte rendu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : document qui rapporte objectivement les débats et les décisions d'une réunion.</li><li><strong>Structure</strong> : en-tête (date, lieu, participants), ordre du jour, résumé des interventions, décisions prises, actions à mener, signatures.</li><li><strong>Style</strong> : impersonnel, factuel, dépourvu d'opinions personnelles.</li><li><strong>Utilité</strong> : mémoire des décisions, base des actions futures.</li><li><strong>Diffusion</strong> : aux participants, à la hiérarchie, aux absents.</li></ul></div>
<h3>4. Exemple de compte rendu</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><strong>Compte rendu de la réunion du 15 mars 2025</strong></p><ul><li><strong>Lieu</strong> : salle de conférence de Sarl Kanyinda, Kinshasa.</li><li><strong>Participants</strong> : Directeur Général, Directeur Commercial, Directeur Financier, Responsable RH.</li><li><strong>Ordre du jour</strong> : 1) Bilan trimestriel ; 2) Préparation du salon commercial ; 3) Recrutement d'un commercial.</li><li><strong>Décisions</strong> : 1) Le bilan trimestriel est validé ; 2) La participation au salon est confirmée avec un budget de 5 000 000 FC ; 3) Le recrutement d'un commercial est approuvé, l'annonce sera publiée la semaine prochaine.</li><li><strong>Actions à mener</strong> : Directeur Commercial → prépare le stand ; RH → publie l'annonce ; Financier → débloque le budget.</li></ul><p><a href="https://www.youtube.com/results?search_query=note+service+circulaire+compte+rendu+réunion" target="_blank" rel="noopener">🎥 Recherche : la note de service, la circulaire et le compte rendu (chaînes de cours de français commercial)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La note de service transmet une information ou un ordre interne. La circulaire informe un grand nombre de destinataires d'une même décision. Le compte rendu rapporte objectivement les débats et décisions d'une réunion. Ces documents internes structurent la communication de l'entreprise.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Correspondance Commerciale, 4e CG (manuels-scolaires-rdc.com, 2025).</div>
    `
},
{
    title: "Leçon 8 — La lettre de candidature et le curriculum vitae",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À Kinshasa, une entreprise publie une offre d'emploi pour un poste d'assistant commercial. Des dizaines de candidats répondent. Seules quelques candidatures se distinguent par la qualité de la lettre et du CV. Bien rédiger ces documents est la clé pour décrocher un entretien.</p></div>
<h3>1. La lettre de candidature (lettre de motivation)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : lettre par laquelle un candidat postule à un emploi.</li><li><strong>Structure</strong> : en-tête (coordonnées du candidat et de l'entreprise), objet, formule d'appel, introduction (poste visé, source de l'annonce), développement (compétences, motivations), conclusion (demande d'entretien), formule de politesse, signature.</li><li><strong>Ton</strong> : professionnel, dynamique, sincère.</li><li><strong>Longueur</strong> : une page maximum.</li><li><strong>Personnalisation</strong> : adapter la lettre à chaque poste.</li></ul></div>
<h3>2. Le curriculum vitae (CV)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : document qui présente le parcours scolaire, professionnel et les compétences d'un candidat.</li><li><strong>Structure</strong> : état civil, formation, expériences professionnelles, langues, informatique, centres d'intérêt, références.</li><li><strong>Présentation</strong> : claire, aérée, sur une ou deux pages maximum.</li><li><strong>Ordre chronologique inversé</strong> : les expériences les plus récentes d'abord.</li><li><strong>Personnalisation</strong> : adapter le CV au poste visé.</li></ul></div>
<h3>3. L'entretien d'embauche</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Préparation</strong> : se renseigner sur l'entreprise, relire son CV et sa lettre.</li><li><strong>Présentation</strong> : tenue correcte, ponctualité, politesse.</li><li><strong>Communication</strong> : écoute active, réponses claires et précises.</li><li><strong>Questions fréquentes</strong> : « Parlez-moi de vous », « Pourquoi ce poste ? », « Quels sont vos défauts ? ».</li><li><strong>Conclusion</strong> : remercier, poser des questions pertinentes.</li></ul></div>
<h3>4. Exemple de lettre de candidature</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Kinshasa, le 15 mars 2025</p><p>À Monsieur le Directeur des Ressources Humaines<br>Sarl Kanyinda<br>Kinshasa</p><p>Objet : candidature au poste d'assistant commercial</p><p>Monsieur le Directeur,</p><p>Suite à votre annonce parue dans le journal « Le Potentiel » du 12 mars 2025, j'ai l'honneur de vous soumettre ma candidature au poste d'assistant commercial.</p><p>Titulaire d'un diplôme d'État en Commerciale et Gestion (2024), j'ai acquis des compétences solides en techniques de vente, en gestion des stocks et en utilisation des logiciels de gestion. Mon stage de trois mois à la Sucrière de Kwilu-Ngongo m'a permis de développer mon sens du contact client et mon esprit d'équipe.</p><p>Dynamique, rigoureux et disponible, je serais honoré de mettre mes compétences au service de votre entreprise. Je me tiens à votre disposition pour un entretien à votre convenance.</p><p>Veuillez agréer, Monsieur le Directeur, l'expression de ma considération distinguée.</p><p><strong>Pièce jointe :</strong> CV</p><p><a href="https://www.youtube.com/results?search_query=lettre+candidature+CV+entretien+embauche" target="_blank" rel="noopener">🎥 Recherche : la lettre de candidature et le CV (chaînes de cours de français commercial)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La lettre de candidature présente le candidat et sa motivation pour un poste précis. Le CV présente son parcours scolaire et professionnel. Les deux documents doivent être adaptés à chaque poste. L'entretien d'embauche est l'occasion de convaincre.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Correspondance Commerciale, 4e CG (manuels-scolaires-rdc.com, 2025).</div>
    `
},
{
    title: "Leçon 9 — La rédaction de la lettre commerciale anglaise (Business English)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une entreprise de Kinshasa veut exporter du café vers le Royaume-Uni. Elle doit rédiger sa correspondance en anglais. Les formules et structures diffèrent de celles du français. La maîtrise du Business English est indispensable pour le commerce international.</p></div>
<h3>1. Structure d'une lettre commerciale anglaise</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Sender's address</strong> (adresse de l'expéditeur) : en haut à droite.</li><li><strong>Date</strong> : 15th March 2025.</li><li><strong>Recipient's address</strong> (adresse du destinataire) : à gauche.</li><li><strong>Salutation</strong> : « Dear Sir », « Dear Madam », « Dear Mr. Kanyinda ».</li><li><strong>Subject line</strong> (objet) : « Subject : Order for 100 filters ».</li><li><strong>Body</strong> (corps) : introduction, développement, conclusion.</li><li><strong>Complimentary close</strong> : « Yours faithfully » (destinataire inconnu), « Yours sincerely » (destinataire connu).</li><li><strong>Signature</strong> : signature, nom, fonction.</li></ul></div>
<h3>2. Les formules clés en Business English</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Ouverture</strong> : « We are writing to enquire about… », « We refer to your letter of… ».</li><li><strong>Demande</strong> : « We would be grateful if you could… », « Please let us know… ».</li><li><strong>Réponse</strong> : « Thank you for your letter of… », « In reply to your enquiry, we… ».</li><li><strong>Réclamation</strong> : « We regret to inform you that… », « We must point out that… ».</li><li><strong>Clôture</strong> : « We look forward to hearing from you », « We remain at your disposal ».</li></ul></div>
<h3>3. Les documents commerciaux anglais</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Enquiry</strong> : demande de renseignements.</li><li><strong>Quotation</strong> : devis.</li><li><strong>Order</strong> : commande.</li><li><strong>Invoice</strong> : facture.</li><li><strong>Pro forma invoice</strong> : facture pro forma.</li><li><strong>Delivery note</strong> : bon de livraison.</li><li><strong>Statement of account</strong> : relevé de compte.</li><li><strong>Remittance advice</strong> : avis de paiement.</li></ul></div>
<h3>4. Exemple de lettre commerciale anglaise</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Kinshasa, 15th March 2025</p><p>Sarl Kanyinda<br>123 Avenue de la Paix<br>Kinshasa, DR Congo</p><p>The Manager<br>Auto Parts Ltd<br>London, United Kingdom</p><p>Dear Sir,</p><p>Subject : Enquiry about oil filters FH-2025</p><p>We are writing to enquire about your oil filters reference FH-2025.</p><p>We would be grateful if you could send us the following information :</p><ol><li>The unit price per item ;</li><li>The discounts available for orders of 100 units or more ;</li><li>The delivery time to Kinshasa, DR Congo ;</li><li>Your terms of payment.</li></ol><p>We look forward to hearing from you soon.</p><p>Yours faithfully,</p><p>[Signature]<br>Mr. Kanyinda<br>Managing Director</p><p><a href="https://www.youtube.com/results?search_query=business+english+letter+commercial+anglais" target="_blank" rel="noopener">🎥 Recherche : la lettre commerciale anglaise (chaînes de cours de Business English)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La lettre commerciale anglaise suit une structure précise : adresses, date, salutation, objet, corps, formule de clôture, signature. Les formules clés diffèrent selon l'objet (demande, réponse, réclamation). Les documents commerciaux anglais ont leurs équivalents français.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Correspondance Commerciale Anglaise, 4e CG (manuels-scolaires-rdc.com, 2025) ; London Chamber of Commerce and Industry (LCCI).</div>
    `
},
{
    title: "Leçon 10 — La gestion du courrier et l'expédition",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une entreprise de Kinshasa, le service du courrier reçoit chaque jour des dizaines de lettres. Il faut les enregistrer, les trier, les distribuer aux services concernés, puis archiver. Une bonne gestion du courrier accélère les réponses et améliore l'image de l'entreprise.</p></div>
<h3>1. L'organisation du courrier</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Courrier arrivé</strong> : enregistrement dans un registre, tri, distribution aux services.</li><li><strong>Courrier départ</strong> : rédaction, signature, enregistrement, expédition.</li><li><strong>Registre du courrier</strong> : date, numéro, expéditeur, objet, service destinataire.</li><li><strong>Cachet de réception</strong> : apposé sur chaque courrier reçu.</li><li><strong>Priorités</strong> : certains courriers nécessitent une réponse urgente.</li></ul></div>
<h3>2. Les modes d'expédition</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Courrier ordinaire</strong> : lettre simple, envoi standard.</li><li><strong>Lettre recommandée avec AR</strong> : preuve de l'envoi et de la réception. Obligatoire pour les mises en demeure.</li><li><strong>Chronopost / DHL</strong> : envoi express international.</li><li><strong>Colis postal</strong> : pour les objets.</li><li><strong>Courriel</strong> : envoi électronique rapide et gratuit.</li><li><strong>Fax</strong> : quasi obsolète, mais encore utilisé dans certaines entreprises.</li></ul></div>
<h3>3. Les règles d'archivage</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Durée de conservation</strong> : 10 ans pour les documents commerciaux (Code de commerce OHADA).</li><li><strong>Classement</strong> : alphabétique, numérique, chronologique, thématique.</li><li><strong>Support</strong> : papier, numérique (GED), cloud.</li><li><strong>Sécurité</strong> : accès restreint, protection contre le feu, l'humidité, les vols.</li><li><strong>Tri périodique</strong> : élimination contrôlée après expiration.</li></ul></div>
<h3>4. Exemple concret</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Réception</strong> : le facteur apporte une lettre recommandée. Le coursier appose le cachet, enregistre dans le registre, transmet au directeur financier.</li><li><strong>Expédition</strong> : la mise en demeure doit être envoyée en recommandé avec AR à Matadi. Le coursier prépare l'enveloppe, fait signer le directeur, dépose à la poste, conserve le récépissé.</li><li><strong>Archivage</strong> : le double de la lettre et le récépissé sont classés dans le dossier « recouvrement 2025 ».</li><li><strong>Courriel</strong> : une réponse urgente est envoyée par courriel avec accusé de lecture, tout en adressant une copie papier.</li></ul><p><a href="https://www.youtube.com/results?search_query=gestion+courrier+expédition+archivage+entreprise" target="_blank" rel="noopener">🎥 Recherche : la gestion du courrier (chaînes de cours de français commercial)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La gestion du courrier comprend l'enregistrement, le tri, la distribution, l'expédition et l'archivage. Les modes d'expédition varient : courrier ordinaire, recommandé avec AR, express, courriel. La durée légale de conservation des documents commerciaux est de 10 ans.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Correspondance Commerciale, 4e CG (manuels-scolaires-rdc.com, 2025) ; OHADA — Acte uniforme relatif au droit commercial général.</div>

function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';

    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>

<script>
(function () {

  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function abs(u) { return /^(https?:|data:|blob:)/i.test(u) ? u : (NATIVE ? SITE + u.replace(/^(\.\/|\/)+/, "") : u); }

  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {
    if (queued[fn]) return;
    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
    if (!queue.length) { running = false; return; }

      else setTimeout(wait, 700);
    })();
  }
  function exists(fn) { try { return !!CoursInterface.exists(fn); } catch (e) { return false; } }

  function show(img) {                                    // affiche UNE image (appelé à chaque slide affichée)

  function scan(root) {
