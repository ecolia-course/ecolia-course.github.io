    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi dit-on que la pédagogie est à la fois une science et un art ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la pédagogie. Distinguer éducation, enseignement, apprentissage, formation. Situer la pédagogie parmi les sciences de l'éducation. Prérequis : maîtrise fonctionnelle du français, culture générale sur l'éducation.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Pédagogie :</strong> science de l'éducation et art d'enseigner. Elle étudie la relation éducative, les conditions de l'apprentissage et les moyens de l'enseignement.</p>
<p><strong>Distinctions fondamentales :</strong></p>
<ul>
<li><strong>Éducation :</strong> développement global de la personne (savoirs, valeurs, comportements).</li>
<li><strong>Enseignement :</strong> acte de l'enseignant qui organise et transmet le savoir.</li>
<li><strong>Apprentissage :</strong> acte de l'élève qui construit des savoirs et des compétences.</li>
<li><strong>Formation :</strong> processus qui vise le développement professionnel ou personnel.</li>
<li><strong>Instruction :</strong> acquisition de savoirs et de savoir-faire.</li>
</ul>
<p><strong>Sciences auxiliaires :</strong> psychologie (compréhension de l'apprenant), sociologie (contexte social), philosophie (finalités et valeurs).</p>
<p><strong>Andragogie :</strong> pédagogie des adultes (apprentissage autonome, expérience préalable, motivation).</p>
<p><strong>Pédagogie = science et art :</strong> elle théorise (science) mais s'adapte à l'imprévu de la classe (art).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Éducation :</strong> développement global. <strong>Enseignement :</strong> acte de l'enseignant. <strong>Apprentissage :</strong> acte de l'élève. <strong>Andragogie :</strong> pédagogie de l'adulte.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Ne pas confondre enseignement et apprentissage. Identifier la dimension scientifique et la dimension artistique. Situer la pédagogie par rapport aux sciences voisines.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un enseignant de Kinshasa qui adapte sa méthode à une classe de 80 élèves fait de la pédagogie : il articule connaissance de l'enfant et contraintes du contexte — c'est la dimension « art ». Le même enseignant s'appuie sur la psychologie de l'apprentissage — c'est la dimension « science ».</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la différence entre éducation et enseignement ? <strong>Ex. 2 :</strong> Cite deux sciences auxiliaires de la pédagogie.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> L'éducation vise le développement global ; l'enseignement est l'acte de l'enseignant qui transmet un savoir. <strong>2)</strong> Psychologie et sociologie (autres réponses possibles : philosophie).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La pédagogie est à la fois une science (elle théorise) et un art (elle s'adapte à l'imprévu).</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Pédagogie Générale (Édition 2025) ; Manuel de Didactique et Pédagogie Générale 2e année (Édition 2025).</div>
    `
},
{
    title: "Leçon 2 — Les grands courants pédagogiques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi les méthodes d'enseignement ont-elles changé au cours du temps ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les grands courants historiques. Distinguer pédagogie traditionnelle et pédagogies actives. Proposer des adaptations réalistes au contexte congolais. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Grands courants historiques :</strong></p>
<ul>
<li><strong>Comenius</strong> (XVIIe s.) : père de la pédagogie moderne, intuition sensible, « tout à tous ».</li>
<li><strong>Rousseau</strong> (XVIIIe s.) : éducation naturelle, respect de l'enfant.</li>
<li><strong>Pestalozzi</strong> : éducation par le cœur, la tête et la main.</li>
<li><strong>Decroly</strong> : centres d'intérêt, méthode globale de lecture.</li>
<li><strong>Montessori</strong> : matériel sensoriel, autonomie de l'enfant.</li>
<li><strong>Freinet</strong> : imprimerie à l'école, texte libre, coopération, tâtonnement expérimental.</li>
</ul>
<p><strong>Pédagogie traditionnelle vs pédagogies actives :</strong></p>
<ul>
<li><strong>Traditionnelle :</strong> enseignant au centre, transmission magistrale, élève réceptacle passif.</li>
<li><strong>Active :</strong> élève acteur, apprentissage par l'expérience, coopération, différenciation.</li>
</ul>
<p><strong>Adaptations RDC :</strong> les pédagogies actives exigent des ressources. On peut adapter avec du matériel local (nattes, bâtons, cartons), des classes pléthoriques (travail en binômes) et des sorties d'observation simples.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Pédagogie active :</strong> approche où l'élève est acteur. <strong>Tâtonnement expérimental :</strong> essai-erreur guidé. <strong>Matériel sensoriel :</strong> objets concrets pour apprendre.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Ne pas opposer radicalement tradition et modernité. Adapter une pédagogie active aux contraintes de la classe (effectif, matériel, programme). Identifier l'apport de chaque pédagogue.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>La pédagogie Freinet avec des moyens simples : tenir un cahier de vie de classe, faire des exposés oraux, faire des sorties d'observation. La pédagogie Montessori avec du matériel local fabriqué (bâtonnets, perles, cartons) pour les apprentissages numériques.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qui est considéré comme le père de la pédagogie moderne ? <strong>Ex. 2 :</strong> Qu'est-ce qu'une pédagogie active ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Comenius. <strong>2)</strong> Une approche où l'élève est acteur de son apprentissage.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les courants pédagogiques sont des outils de réflexion, pas des recettes à appliquer aveuglément.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Pédagogie Générale (Édition 2025).</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un enseignant bienveillant peut-il être exigeant ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le triangle pédagogique. Identifier les postures de l'enseignant. Comprendre l'autorité pédagogique. Gérer les conflits en classe. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Triangle pédagogique :</strong> enseignant, élève, savoir. L'enseignant met en relation l'élève et le savoir.</p>
<p><strong>Postures de l'enseignant :</strong></p>
<ul>
<li><strong>Transmetteur :</strong> centré sur le savoir.</li>
<li><strong>Guide :</strong> centré sur l'élève et la construction du savoir.</li>
<li><strong>Médiateur :</strong> met en relation l'élève, le savoir et le groupe.</li>
</ul>
<p><strong>Autorité pédagogique :</strong> capacité à exercer une influence constructive, à faire grandir, sans recourir à la peur. Elle repose sur :</p>
<ul>
<li>La cohérence (dire et faire ce qu'on dit).</li>
<li>La bienveillance (reconnaissance de l'élève).</li>
<li>L'exigence (clarté des attentes).</li>
</ul>
<p><strong>Gestion de conflits :</strong> écoute, verbalisation, rappel à la règle, recherche de solutions. La sanction peut être nécessaire mais doit être éducative.</p>
<p><strong>Représentations :</strong> idées préconçues que l'enseignant et l'élève entretiennent les uns sur les autres.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Triangle pédagogique :</strong> relation enseignant-élève-savoir. <strong>Autorité pédagogique :</strong> influence constructive. <strong>Bienveillance :</strong> reconnaissance de l'élève comme personne.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Écouter avant de sanctionner. Séparer la personne de l'acte. Rappeler la règle et expliquer son sens. Maintenir l'exigence dans la bienveillance.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève perturbe la classe. Plutôt que de crier, l'enseignant l'interroge discrètement, puis l'entretient après le cours. Il écoute, rappelle l'attente (« en classe, on respecte le droit de chacun à apprendre ») et propose un engagement. La règle est maintenue, la personne est respectée.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quels sont les trois pôles du triangle pédagogique ? <strong>Ex. 2 :</strong> L'autorité pédagogique repose-t-elle sur la peur ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Enseignant, élève, savoir. <strong>2)</strong> Non, sur la cohérence, la bienveillance et l'exigence.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>On n'enseigne pas seulement un savoir : on enseigne à une personne.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel de Didactique et Pédagogie Générale 2e année (Édition 2025).</div>
    `

    title: "Leçon 4 — Méthodes et techniques pédagogiques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un enseignant doit-il varier ses méthodes ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les principales méthodes et techniques. Choisir une méthode adaptée. Gérer une classe à effectif pléthorique. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Méthodes pédagogiques :</strong></p>
<ul>
<li><strong>Expositive (magistrale) :</strong> l'enseignant transmet les informations. Utile pour introduire, synthétiser.</li>
<li><strong>Interrogative :</strong> questions-réponses guidées. Favorise la participation et la découverte.</li>
<li><strong>Active :</strong> l'élève construit son savoir par l'action. Favorise les compétences.</li>
<li><strong>Démonstrative :</strong> l'enseignant montre, puis l'élève reproduit.</li>
</ul>
<p><strong>Techniques :</strong> travail de groupe, exposé, étude de cas, simulation, jeu de rôle, brainstorming.</p>
<p><strong>Critères de choix :</strong> objectif visé, effectif, ressources, âge des élèves, contenu.</p>
<p><strong>Classes pléthoriques :</strong> combiner méthodes courtes, travail en binômes, alternance de moments collectifs et individuels.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Méthode :</strong> démarche d'enseignement. <strong>Technique :</strong> procédé concret. <strong>Brainstorming :</strong> production collective d'idées.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

  var CFG = {"code":"PedagogieGenerale2","base":"https://ecolia-course.github.io/ecolia-media/audio_files/","available":[1,2,3,4,5,6,7],"count":7,"sizeMo":7,"sizes":{"1":558912,"2":1399104,"3":1342848,"4":1238592,"5":1130112,"6":1144512,"7":93504},"fallback":{"1":[["fr","Sommaire, Pédagogie Générale. Sommaire. Ce cours de pédagogie générale couvre cinq leçons essentielles: la pédagogie comme science et art de l'éducation, les grands courants pédagogiques, la relation pédagogique, les méthodes et techniques pédagogiques, et l'évaluation pédagogique. Note: le programme national de pédagogie générale pour les humanités pédagogiques existe et est opérationnalisé par des fiches officielles (Édition 2025). Les fiches consultées couvrent la 1re année; la progression ci-dessous est une adaptation pour la 2e année, fondée sur la logique du cycle et sur les manuels disponibles. Le programme officiel intégral de 2e année reste à vérifier. Leçon 1, La pédagogie comme science et art de l'éducation. Leçon 2, Les grands courants pédagogiques. Leçon 3, La relation pédagogique. Leçon 4, Méthodes et techniques pédagogiques. Leçon 5, L'évaluation pédagogique. Une évaluation finale de 20 questions couvre l'ensemble des leçons."]],"2":[["fr","Leçon 1, La pédagogie comme science et art de l'éducation. Situation. « Pourquoi dit-on que la pédagogie est à la fois une science et un art? ». Objectifs. Définir la pédagogie. Distinguer éducation, enseignement, apprentissage, formation. Situer la pédagogie parmi les sciences de l'éducation. Prérequis: maîtrise fonctionnelle du français, culture générale sur l'éducation. Théorie. Pédagogie: science de l'éducation et art d'enseigner. Elle étudie la relation éducative, les conditions de l'apprentissage et les moyens de l'enseignement. Distinctions fondamentales: Éducation: développement global de la personne (savoirs, valeurs, comportements). Enseignement: acte de l'enseignant qui organise et transmet le savoir. Apprentissage: acte de l'élève qui construit des savoirs et des compétences. Formation: processus qui vise le développement professionnel ou personnel. Instruction: acquisition de savoirs et de savoir-faire. Sciences auxiliaires: psychologie (compréhension de l'apprenant), sociologie (contexte social), philosophie (finalités et valeurs). Andragogie: pédagogie des adultes (apprentissage autonome, expérience préalable, motivation). Pédagogie égale science et art: elle théorise (science) mais s'adapte à l'imprévu de la classe (art). Définitions. Éducation: développement global. Enseignement: acte de l'enseignant. Apprentissage: acte de l'élève. Andragogie: pédagogie de l'adulte. Méthodes et règles. Ne pas confondre enseignement et apprentissage. Identifier la dimension scientifique et la dimension artistique. Situer la pédagogie par rapport aux sciences voisines. Exemple. Un enseignant de Kinshasa qui adapte sa méthode à une classe de 80 élèves fait de la pédagogie: il articule connaissance de l'enfant et contraintes du contexte, c'est la dimension « art ». Le même enseignant s'appuie sur la psychologie de l'apprentissage, c'est la dimension « science ». Exercices. Ex. 1: Quelle est la différence entre éducation et enseignement? Ex. 2: Cite deux sciences auxiliaires de la pédagogie. Corrigé. 1) L'éducation vise le développement global; l'enseignement est l'acte de l'enseignant qui transmet un savoir. 2) Psychologie et sociologie (autres réponses possibles: philosophie). À retenir. La pédagogie est à la fois une science (elle théorise) et un art (elle s'adapte à l'imprévu)."]],"3":[["fr","Leçon 2, Les grands courants pédagogiques. Situation. « Pourquoi les méthodes d'enseignement ont-elles changé au cours du temps? ». Objectifs. Connaître les grands courants historiques. Distinguer pédagogie traditionnelle et pédagogies actives. Proposer des adaptations réalistes au contexte congolais. Prérequis: leçon 1. Théorie. Grands courants historiques: Comenius (XVIIe s.): père de la pédagogie moderne, intuition sensible, « tout à tous ». Rousseau (XVIIIe s.): éducation naturelle, respect de l'enfant. Pestalozzi: éducation par le cœur, la tête et la main. Decroly: centres d'intérêt, méthode globale de lecture. Montessori: matériel sensoriel, autonomie de l'enfant. Freinet: imprimerie à l'école, texte libre, coopération, tâtonnement expérimental. Pédagogie traditionnelle vs pédagogies actives: Traditionnelle: enseignant au centre, transmission magistrale, élève réceptacle passif. Active: élève acteur, apprentissage par l'expérience, coopération, différenciation. Adaptations R D C: les pédagogies actives exigent des ressources. On peut adapter avec du matériel local (nattes, bâtons, cartons), des classes pléthoriques (travail en binômes) et des sorties d'observation simples. Définitions. Pédagogie active: approche où l'élève est acteur. Tâtonnement expérimental: essai-erreur guidé. Matériel sensoriel: objets concrets pour apprendre. Méthodes et règles. Ne pas opposer radicalement tradition et modernité. Adapter une pédagogie active aux contraintes de la classe (effectif, matériel, programme). Identifier l'apport de chaque pédagogue. Exemple. La pédagogie Freinet avec des moyens simples: tenir un cahier de vie de classe, faire des exposés oraux, faire des sorties d'observation. La pédagogie Montessori avec du matériel local fabriqué (bâtonnets, perles, cartons) pour les apprentissages numériques. Exercices. Ex. 1: Qui est considéré comme le père de la pédagogie moderne? Ex. 2: Qu'est-ce qu'une pédagogie active? Corrigé. 1) Comenius. 2) Une approche où l'élève est acteur de son apprentissage. À retenir. Les courants pédagogiques sont des outils de réflexion, pas des recettes à appliquer aveuglément."]],"4":[["fr","Leçon 3, La relation pédagogique. Situation. « Un enseignant bienveillant peut-il être exigeant? ». Objectifs. Comprendre le triangle pédagogique. Identifier les postures de l'enseignant. Comprendre l'autorité pédagogique. Gérer les conflits en classe. Prérequis: leçons 1 et 2. Théorie. Triangle pédagogique: enseignant, élève, savoir. L'enseignant met en relation l'élève et le savoir. Postures de l'enseignant: Transmetteur: centré sur le savoir. Guide: centré sur l'élève et la construction du savoir. Médiateur: met en relation l'élève, le savoir et le groupe. Autorité pédagogique: capacité à exercer une influence constructive, à faire grandir, sans recourir à la peur. Elle repose sur: La cohérence (dire et faire ce qu'on dit). La bienveillance (reconnaissance de l'élève). L'exigence (clarté des attentes). Gestion de conflits: écoute, verbalisation, rappel à la règle, recherche de solutions. La sanction peut être nécessaire mais doit être éducative. Représentations: idées préconçues que l'enseignant et l'élève entretiennent les uns sur les autres. Définitions. Triangle pédagogique: relation enseignant-élève-savoir. Autorité pédagogique: influence constructive. Bienveillance: reconnaissance de l'élève comme personne. Méthodes et règles. Écouter avant de sanctionner. Séparer la personne de l'acte. Rappeler la règle et expliquer son sens. Maintenir l'exigence dans la bienveillance. Exemple. Un élève perturbe la classe. Plutôt que de crier, l'enseignant l'interroge discrètement, puis l'entretient après le cours. Il écoute, rappelle l'attente (« en classe, on respecte le droit de chacun à apprendre ») et propose un engagement. La règle est maintenue, la personne est respectée. Exercices. Ex. 1: Quels sont les trois pôles du triangle pédagogique? Ex. 2: L'autorité pédagogique repose-t-elle sur la peur? Corrigé. 1) Enseignant, élève, savoir. 2) Non, sur la cohérence, la bienveillance et l'exigence. À retenir. On n'enseigne pas seulement un savoir: on enseigne à une personne."]],"5":[["fr","Leçon 4, Méthodes et techniques pédagogiques. Situation. « Pourquoi un enseignant doit-il varier ses méthodes? ». Objectifs. Connaître les principales méthodes et techniques. Choisir une méthode adaptée. Gérer une classe à effectif pléthorique. Prérequis: leçons 1 à 3. Théorie. Méthodes pédagogiques: Expositive (magistrale): l'enseignant transmet les informations. Utile pour introduire, synthétiser. Interrogative: questions-réponses guidées. Favorise la participation et la découverte. Active: l'élève construit son savoir par l'action. Favorise les compétences. Démonstrative: l'enseignant montre, puis l'élève reproduit. Techniques: travail de groupe, exposé, étude de cas, simulation, jeu de rôle, brainstorming. Critères de choix: objectif visé, effectif, ressources, âge des élèves, contenu. Classes pléthoriques: combiner méthodes courtes, travail en binômes, alternance de moments collectifs et individuels. Définitions. Méthode: démarche d'enseignement. Technique: procédé concret. Brainstorming: production collective d'idées. Méthodes et règles. Adapter la méthode à l'objectif et au contexte. Préparer les consignes clairement. Alterner les moments pour maintenir l'attention. Ne pas utiliser une seule méthode systématiquement. Exemple. Dans une classe de 70 élèves à Lubumbashi: exposé court (10 minutes), travail en binômes (15 minutes), mise en commun (10 minutes). Cette alternance maintient l'attention et favorise la participation. Exercices. Ex. 1: Quelle méthode place l'élève en position d'acteur principal? Ex. 2: Cite deux critères de choix d'une méthode. Corrigé. 1) La méthode active. 2) L'objectif visé et l'effectif (autres réponses possibles: ressources, âge). À retenir. La méthode est un moyen au service de l'apprentissage, pas une fin en soi."]],"6":[["fr","Leçon 5, L'évaluation pédagogique. Situation. « À quoi sert une note: sanctionner ou aider à progresser? ». Objectifs. Comprendre les fonctions de l'évaluation. Distinguer les types. Construire une grille critériée. Comprendre la remédiation. Prérequis: leçons 1 à 4. Théorie. Fonctions de l'évaluation: Diagnostique: en début d'apprentissage, identifie les prérequis. Formative: pendant l'apprentissage, régule et aide à progresser. Sommative: en fin d'apprentissage, certifie les acquis. Types d'évaluation: Critériée: compare l'élève à des critères précis (grille). Normée: compare l'élève à la moyenne du groupe. Outils: tests, grilles d'observation, portfolio, entretiens. Remédiation: réponse pédagogique ciblée aux difficultés identifiées (différenciation, reprise ciblée). Éthique: équité, transparence des critères, respect de l'élève, confidentialité. Définitions. Évaluation formative: régule l'apprentissage. Sommative: certifie. Grille critériée: liste de critères d'évaluation. Remédiation: réponse ciblée. Méthodes et règles. Définir les critères à l'avance. Communiquer les critères aux élèves. Distinguer note et évaluation. Analyser les erreurs pour remédier. Respecter la confidentialité. Exemple. Grille critériée d'un exposé oral: clarté de la voix, structure (introduction, développement, conclusion), argumentation, respect du temps, prise en compte du public. Chaque critère est noté sur 4 points. L'élève sait à l'avance sur quoi il sera évalué. Exercices. Ex. 1: Quelle est la fonction de l'évaluation formative? Ex. 2: Citer deux caractéristiques d'une grille critériée. Corrigé. 1) Réguler l'apprentissage en cours. 2) Critères explicites et barème (autres réponses possibles). À retenir. Évaluer, c'est d'abord comprendre où en est l'élève pour l'aider à progresser."]],"7":[["fr","Évaluation finale, Pédagogie Générale. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 12 sur 20, tu as réussi."]]}};

    var banner = document.createElement("div");

    function urlN(n) {   // dans l'APK la page est sur https://app.local : une adresse relative doit pointer vers le site
      var b = CFG.base;

      return new URL(b + nameN(n), location.href).href;

    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }

    // ====================================================================

    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {                                   // fichier complet ? (taille exacte connue à la génération)
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () {
          var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok);
        },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) {
          try { CoursInterface.delete(nameN(n)); } catch (e) {}
          writeOk(readOk().filter(function (x) { return x !== n; }));
          return Promise.resolve();
        }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }   // ancien contenu invalide
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) {
          return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); })
            .then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; });
        },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);

      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
