<script>
const COURSE_TITLE = "Initiation à la logique";
const slides = [
{
    title: "Sommaire — Initiation à la logique 1re secondaire",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>La logique t'apprend à penser juste : à reconnaître un raisonnement valide, à repérer les pièges du langage et à argumenter sans se tromper. Dans ce cours, tu vas apprendre à analyser des phrases, à construire des raisonnements et à démasquer les sophismes. Ces compétences te serviront à l'école, dans tes discussions et dans la vie citoyenne.</p>
<ul>
<li>Leçon 1 — La logique : définition et utilité</li>
<li>Leçon 2 — Vérité et validité</li>
<li>Leçon 3 — Les opérations de l'esprit</li>
<li>Leçon 4 — Le concept et la définition</li>
<li>Leçon 5 — Le jugement et la proposition</li>
<li>Leçon 6 — Les connecteurs logiques et les quantificateurs</li>
<li>Leçon 7 — La déduction et l'induction</li>
<li>Leçon 8 — Le syllogisme : structure et règles</li>
<li>Leçon 9 — Figures et modes du syllogisme</li>
<li>Leçon 10 — Les sophismes</li>
<li>Leçon 11 — Analyser un discours</li>
<li>Leçon 12 — Logique et citoyenneté en RDC</li>
</ul>
<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Manuel de Philosophie 1re année (2025), Programme national EDIDEPS 2007. Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 1 — La logique : définition et utilité",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certaines discussions tournent-elles en rond ? Pourquoi certains arguments semblent-ils convaincants alors qu'ils sont faux ? La logique répond à ces questions. »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir la logique. Distinguer logique formelle et logique informelle. Comprendre son utilité dans la vie quotidienne. Prérequis : aucun.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>logique</strong> est la science des conditions de validité de la pensée. Elle étudie les règles qui permettent de raisonner correctement.</p>
<p>On distingue :</p>
<ul>
<li><strong>La logique formelle :</strong> elle s'intéresse à la forme des raisonnements, indépendamment de leur contenu.</li>
<li><strong>La logique informelle :</strong> elle s'intéresse aux arguments tels qu'ils sont utilisés dans la vie quotidienne (débats, discours).</li>
</ul>
<p>La logique est utile pour : argumenter correctement, détecter les erreurs de raisonnement, comprendre les mathématiques, analyser les discours politiques et médiatiques, et développer l'esprit critique.</p>
</div>
<img src="images/Logique1_1.jpg" alt="Buste d'Aristote" data-image-id="Logique1_1" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>La logique ne dit pas ce qu'il faut penser, mais comment penser correctement. Elle garantit la cohérence de l'enchaînement (validité), pas la vérité des prémisses.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Dans un débat de quartier à Kinshasa, un orateur affirme : « Si nous acceptons ce projet, nous perdrons notre terrain ; or nous ne voulons pas perdre notre terrain ; donc nous devons refuser le projet. » La logique permet d'analyser ce raisonnement.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis la logique en une phrase.</p>
<details><summary>Corrigé</summary>
<p>La logique est la science des conditions de validité de la pensée.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La logique est l'outil qui permet de raisonner correctement et de repérer les erreurs de raisonnement.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Philosophie (EDIDEPS).</div>
    `
},
{
    title: "Leçon 2 — Vérité et validité",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un raisonnement peut-il être logiquement correct et aboutir à une conclusion fausse ? Comment est-ce possible ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Distinguer vérité et validité. Comprendre qu'un raisonnement valide peut avoir une conclusion fausse. Identifier les conditions de la vérité.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>vérité</strong> concerne les propositions (une proposition est vraie ou fausse). La <strong>validité</strong> concerne les raisonnements (la conclusion découle nécessairement des prémisses).</p>
<p>Un raisonnement <strong>valide</strong> peut avoir une conclusion fausse si l'une de ses prémisses est fausse. Exemple : « Tous les oiseaux volent ; or la poule est un oiseau ; donc la poule vole. » (Valide, mais prémisse fausse).</p>
<p>Un raisonnement <strong>non valide</strong> peut avoir une conclusion vraie par hasard.</p>
</div>
<img src="images/Logique1_2.jpg" alt="Balance, symbole de l'équilibre logique" data-image-id="Logique1_2" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour évaluer un raisonnement : (1) vérifier la forme (est-il valide ?) ; (2) vérifier la vérité des prémisses.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>« Tous les Congolais sont des musiciens ; or Amani est Congolais ; donc Amani est musicien. » Raisonnement valide, mais prémisse fausse → conclusion fausse.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Un raisonnement valide garantit-il la vérité de la conclusion ?</p>
<details><summary>Corrigé</summary>
<p>Non : il garantit que la conclusion découle des prémisses, mais si une prémisse est fausse, la conclusion peut être fausse.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Vérité et validité sont deux propriétés distinctes ; un raisonnement valide n'est pas nécessairement vrai.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel de Philosophie (2025).</div>
    `
},
{
    title: "Leçon 3 — Les opérations de l'esprit",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment pensons-nous ? D'abord nous formons des idées, puis nous les relions, puis nous raisonnons. Ces trois étapes ont des noms en logique. »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Identifier les trois opérations fondamentales de l'esprit. Comprendre leur enchaînement. Les relier aux leçons suivantes.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La logique distingue trois opérations :</p>
<ol>
<li><strong>L'appréhension :</strong> former des concepts (ex. : le concept de « chien »).</li>
<li><strong>Le jugement :</strong> relier deux concepts pour affirmer ou nier (ex. : « Le chien est un mammifère »).</li>
<li><strong>Le raisonnement :</strong> passer de jugements à un nouveau jugement (ex. : « Tous les mammifères ont des poils ; or le chien est un mammifère ; donc le chien a des poils »).</li>
</ol>
</div>
<img src="images/Logique1_3.jpg" alt="Concept, jugement, raisonnement" data-image-id="Logique1_3" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour analyser un raisonnement : commencer par identifier les concepts, puis les jugements, puis l'enchaînement. Ne pas sauter d'étape.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Dans une discussion sur la justice : concept de « justice » ➔ jugement « Cette décision est juste » ➔ raisonnement « Toute décision juste respecte l'égalité ; or celle-ci respecte l'égalité ; donc elle est juste ».</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> À quelle opération correspond la phrase « Le ciel est bleu » ?</p>
<details><summary>Corrigé</summary>
<p>Un jugement.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La pensée se déploie en trois opérations complémentaires : concept, jugement, raisonnement.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel de Philosophie (2025).</div>
    `
},
{
    title: "Leçon 4 — Le concept et la définition",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qu'est-ce qu'un arbre ? Un fauteuil ? La justice ? Comment expliquer ce que ces mots veulent dire sans se perdre dans les exemples ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir le concept. Comprendre la formation des concepts. Construire une définition correcte.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>concept</strong> est une idée générale qui rassemble les caractères communs d'un ensemble d'objets.</p>
<p><strong>Compréhension :</strong> ensemble des caractères. <strong>Extension :</strong> ensemble des objets auxquels il s'applique.</p>
<p>Une <strong>définition correcte</strong> indique le genre prochain (la classe) et la différence spécifique (ce qui distingue l'objet). Ex. : « Le triangle est un polygone (genre) à trois côtés (différence). »</p>
</div>
<img src="images/Logique1_4.jpg" alt="Compréhension et extension d'un concept" data-image-id="Logique1_4" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour définir : (1) identifier le genre prochain ; (2) identifier la différence spécifique ; (3) vérifier que la définition n'est ni trop large ni trop étroite. Éviter les définitions circulaires ou par l'exemple.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>« Marché » : genre prochain = lieu public ; différence spécifique = où l'on vend et achète des marchandises.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis « école » en utilisant le genre prochain et la différence spécifique.</p>
<details><summary>Corrigé</summary>
<p>Exemple : « L'école est un établissement (genre) où l'on dispense un enseignement (différence spécifique). »</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le concept est la brique de base de la pensée ; une bonne définition repose sur le genre et la différence.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel de Philosophie (2025).</div>
    `
},
{
    title: "Leçon 5 — Le jugement et la proposition",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment une phrase peut-elle être vraie ou fausse ? Toutes les phrases ne sont pas des jugements : une question, un ordre, une exclamation ne sont pas vrais ou faux. »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir le jugement. Identifier la structure d'une proposition. Distinguer les types de propositions.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>jugement</strong> affirme ou nie quelque chose. Il s'exprime dans une <strong>proposition</strong> (énoncé vrai ou faux).</p>
<p><strong>Structure :</strong> sujet – copule (est / n'est pas) – prédicat.</p>
<p><strong>Types :</strong></p>
<ul>
<li>A : Universelle affirmative (« Tous les hommes sont mortels »).</li>
<li>E : Universelle négative (« Aucun homme n'est immortel »).</li>
<li>I : Particulière affirmative (« Quelques hommes sont grands »).</li>
<li>O : Particulière négative (« Quelques hommes ne sont pas grands »).</li>
</ul>
</div>
<img src="images/Logique1_5.jpg" alt="Sujet-copule-prédicat" data-image-id="Logique1_5" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour analyser une proposition : identifier le sujet, le prédicat, la copule, le quantificateur. Vérifier si l'énoncé est propositionnel (vrai ou faux).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>« Tous les élèves de cette classe ont un cahier » (A). « Quelques élèves ne sont pas venus » (O).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Classe : « Tous les hommes sont mortels » ; « Quelques élèves sont absents ».</p>
<details><summary>Corrigé</summary>
<p>A (universelle affirmative) ; I (particulière affirmative).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le jugement s'exprime dans des propositions dont la structure et le type conditionnent l'analyse logique.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel de Philosophie (2025).</div>
    `
},
{
    title: "Leçon 6 — Les connecteurs logiques et les quantificateurs",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment relier deux propositions pour en former une plus complexe ? Comment dire "tous" ou "quelques" de manière précise ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Utiliser les connecteurs « et », « ou », « non », « si… alors ». Comprendre les quantificateurs. Construire des propositions composées.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<ul>
<li><strong>Négation (non) :</strong> inverse la valeur de vérité. « Il pleut » → « Il ne pleut pas ».</li>
<li><strong>Conjonction (et) :</strong> vraie seulement si les deux propositions sont vraies.</li>
<li><strong>Disjonction (ou) :</strong> vraie si au moins une des deux propositions est vraie.</li>
<li><strong>Implication (si… alors…) :</strong> fausse seulement si la première est vraie et la seconde fausse.</li>
</ul>
<p><strong>Quantificateurs :</strong> « tous » (universel), « aucun » (universel négatif), « quelques » (particulier).</p>
</div>
<img src="images/Logique1_6.jpg" alt="Tables de vérité et, ou, non, si… alors" data-image-id="Logique1_6" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour évaluer une proposition composée : construire sa table de vérité ou raisonner sur les valeurs. Attention : « ou » est inclusif, et « si… alors » n'implique pas la réciproque.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>« Si la route est inondée, alors le bus ne passera pas. » Si la route est inondée et le bus passe, l'implication est fausse.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la valeur de « Il pleut et il fait froid » si « il pleut » est vrai et « il fait froid » est faux ?</p>
<details><summary>Corrigé</summary>
<p>Faux (la conjonction exige que les deux soient vraies).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les connecteurs et les quantificateurs permettent de construire des propositions complexes et d'en évaluer la valeur.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel de Philosophie (2025).</div>
    `
},

    title: "Leçon 7 — La déduction et l'induction",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment passe-t-on du général au particulier (déduction) et du particulier au général (induction) ? Ces deux raisonnements sont-ils également fiables ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Distinguer déduction et induction. Comprendre la force et les limites de chacune. Appliquer ces raisonnements à des exemples.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Déduction :</strong> du général au particulier. La conclusion est nécessaire si les prémisses sont vraies. Ex. : « Tous les hommes sont mortels ; Socrate est un homme ; donc Socrate est mortel. »</p>
<p><strong>Induction :</strong> du particulier au général. La conclusion est probable, pas certaine. Ex. : « Tous les cygnes que j'ai vus sont blancs ; donc tous les cygnes sont blancs. »</p>
</div>
<img src="images/Logique1_7.jpg" alt="Déduction et induction" data-image-id="Logique1_7" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour évaluer une déduction : vérifier la validité et la vérité des prémisses. Pour une induction : vérifier le nombre et la représentativité des cas observés.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Déduction : « Tous les élèves qui étudient réussissent ; Amani étudie ; donc Amani réussira. » Induction hâtive : « Il a plu trois jours ; donc il pleuvra toute la semaine. »</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la différence entre déduction et induction ?</p>
<details><summary>Corrigé</summary>
<p>La déduction va du général au particulier et produit une conclusion nécessaire ; l'induction va du particulier au général et produit une conclusion probable.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La déduction garantit la nécessité, l'induction ouvre sur la probabilité ; les deux sont utiles mais doivent être distinguées.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel de Philosophie (2025).</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>syllogisme</strong> est un raisonnement déductif à trois propositions (majeure, mineure, conclusion) et trois termes :</p>
<ul>
<li><strong>Terme majeur (P) :</strong> prédicat de la conclusion.</li>
<li><strong>Terme mineur (S) :</strong> sujet de la conclusion.</li>
<li><strong>Terme moyen (M) :</strong> commun aux deux prémisses.</li>
</ul>
<p><strong>Règles :</strong> (1) le moyen doit être distribué au moins une fois ; (2) deux prémisses négatives ne donnent pas de conclusion ; (3) si une prémisse est négative, la conclusion est négative ; (4) si une prémisse est particulière, la conclusion est particulière.</p>
</div>
<img src="images/Logique1_8.jpg" alt="Structure du syllogisme" data-image-id="Logique1_8" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>

</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>

</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quels sont les trois termes d'un syllogisme ?</p>
<details><summary>Corrigé</summary>
<p>Terme majeur, terme mineur, terme moyen.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le syllogisme est l'outil central de la déduction ; sa validité dépend du respect des règles.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel de Philosophie (2025).</div>

<li>Fig. 2 : P–M / S–M / S–P (ex. Cesare : EAE).</li>
<li>Fig. 3 : M–P / M–S / S–P (ex. Datisi : AII).</li>
<li>Fig. 4 : P–M / M–S / S–P (ex. Camenes : AEE).</li>

<p>Le <strong>carré d'opposition</strong> relie les propositions A, E, I, O (contraires, contradictoires, subalternes).</p>

          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
