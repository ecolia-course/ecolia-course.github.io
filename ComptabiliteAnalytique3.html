{
    title: "Sommaire — Initiation à la Comptabilité Analytique 3e année",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours propose une <strong>initiation</strong> à la comptabilité analytique d'exploitation (CAE) : comprendre pourquoi une entreprise analyse ses coûts, distinguer comptabilité générale et comptabilité analytique, identifier les charges directes et indirectes, s'initier à la notion de coût d'achat.</p>
<p><strong>Note de transparence — point d'attention :</strong> dans la progression officielle attestée (fiche pédagogique CAE de 4e année CG, Édition 2025), la comptabilité analytique est enseignée en <strong>4e année</strong>, la 3e année étant consacrée à la comptabilité générale. Ce cours de 3e année doit donc être considéré comme une <strong>sensibilisation très allégée</strong> ou comme une anticipation à reprogrammer en 4e année. La version proposée ici reste volontairement limitée : elle ne couvre pas les centres d'analyse, le coût de revient complet ni le résultat analytique, qui relèvent de la 4e année.</p>
<ul>
<li>Leçon 1 — Pourquoi analyser les coûts ?</li>
<li>Leçon 2 — Comptabilité générale et comptabilité analytique</li>
<li>Leçon 3 — Charges directes et charges indirectes</li>
<li>Leçon 4 — Notion de coût d'achat</li>
<li>Leçon 5 — Synthèse et évaluation</li>
</ul>
<p>Une évaluation finale de 12 questions couvre cette initiation.</p>
</div>
<div class="sources"><strong>Sources :</strong> Fiche pédagogique officielle Comptabilité Analytique d'Exploitation 4e CG (Édition 2025) ; curriculum des Humanités Techniques Commerciales, option Commerciale et Gestion (DIPROMAD, 2014). Cette initiation doit être validée par l'enseignant ; les contenus complets de CAE sont officiellement en 4e année.</div>
    `
},
{
    title: "Leçon 1 — Pourquoi analyser les coûts ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un commerçant vend beaucoup mais gagne peu. Comment savoir où passe son argent ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre l'utilité de l'analyse des coûts. Identifier les limites de la seule comptabilité générale pour la gestion. Découvrir les questions que l'analyse des coûts permet de poser.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le problème</div>
<p>Une entreprise peut connaître son chiffre d'affaires et son résultat global grâce à la comptabilité générale. Mais elle ne sait pas toujours :</p>
<ul>
<li>quel produit est rentable et lequel ne l'est pas ;</li>
<li>quel atelier coûte le plus cher ;</li>
<li>quel client génère le plus de marge ;</li>
<li>quel prix de vente minimum est acceptable.</li>
</ul>
<p>La <strong>comptabilité analytique</strong> répond à ces questions en calculant le coût de chaque produit, service ou activité.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Utilité pour la gestion</div>
<ul>
<li><strong>Fixer les prix de vente</strong> en connaissant les coûts réels.</li>
<li><strong>Choisir</strong> les produits à développer ou à abandonner.</li>
<li><strong>Contrôler</strong> les performances des ateliers, des services.</li>
<li><strong>Prévoir</strong> et budgétiser.</li>
<li><strong>Décider</strong> en connaissance de cause.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Dans le contexte congolais</div>
<p>Une PME de Kinshasa, une coopérative agricole du Kasaï ou une maison de commerce de Lubumbashi gagnent à connaître leurs coûts : cela évite de vendre à perte, de choisir les mauvais produits ou de mal répartir les charges entre les activités.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois questions auxquelles l'analyse des coûts permet de répondre.</p>
<p><strong>Ex. 2 :</strong> Explique pourquoi la seule comptabilité générale ne suffit pas pour bien gérer.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Quel produit est rentable ? Quel atelier coûte le plus cher ? Quel prix de vente minimum est acceptable ? <strong>2)</strong> La comptabilité générale donne un résultat global mais ne détaille pas les coûts par produit ou par activité.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Analyser les coûts, c'est comprendre où va l'argent et pouvoir décider en connaissance de cause.</p></div>
<div class="sources"><strong>Sources :</strong> Fiche officielle CAE 4e CG ; références générales en comptabilité analytique.</div>
    `
},
{
    title: "Leçon 2 — Comptabilité générale et comptabilité analytique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une entreprise tient-elle deux comptabilités différentes ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer les deux comptabilités. Comprendre leur complémentarité. Identifier à qui chacune s'adresse.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Deux finalités</div>
<ul>
<li><strong>Comptabilité générale :</strong> enregistre toutes les opérations de l'entreprise, produit des états financiers (bilan, compte de résultat). Elle est <strong>obligatoire</strong>, normalisée par le SYSCOHADA, et destinée aux <strong>partenaires externes</strong> (État, banques, associés).</li>
<li><strong>Comptabilité analytique :</strong> analyse les charges pour calculer les coûts des produits, services ou activités. Elle est <strong>facultative</strong>, interne, et destinée aux <strong>dirigeants</strong> pour la gestion.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Tableau comparatif simplifié</div>
<table style="width:100%;border-collapse:collapse;margin-top:10px;">
<tr style="background:var(--bg2);"><th style="border:1px solid var(--bd);padding:6px;text-align:left;">Critère</th><th style="border:1px solid var(--bd);padding:6px;text-align:left;">Comptabilité générale</th><th style="border:1px solid var(--bd);padding:6px;text-align:left;">Comptabilité analytique</th></tr>
<tr><td style="border:1px solid var(--bd);padding:6px;">Finalité</td><td style="border:1px solid var(--bd);padding:6px;">Information externe, preuve</td><td style="border:1px solid var(--bd);padding:6px;">Gestion interne, décision</td></tr>
<tr><td style="border:1px solid var(--bd);padding:6px;">Obligation</td><td style="border:1px solid var(--bd);padding:6px;">Obligatoire</td><td style="border:1px solid var(--bd);padding:6px;">Facultative</td></tr>
<tr><td style="border:1px solid var(--bd);padding:6px;">Destinataires</td><td style="border:1px solid var(--bd);padding:6px;">État, banques, associés</td><td style="border:1px solid var(--bd);padding:6px;">Dirigeants, responsables</td></tr>
<tr><td style="border:1px solid var(--bd);padding:6px;">Unité d'analyse</td><td style="border:1px solid var(--bd);padding:6px;">L'entreprise</td><td style="border:1px solid var(--bd);padding:6px;">Le produit, l'activité</td></tr>
</table>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Complémentarité</div>
<p>Les deux comptabilités ne s'opposent pas : elles s'appuient sur les mêmes opérations. La comptabilité générale fournit les charges globales ; la comptabilité analytique les répartit entre les produits. Pour être fiable, la somme des coûts analytiques doit correspondre aux charges de la comptabilité générale.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Distingue les deux comptabilités par leur destinataire.</p>
<p><strong>Ex. 2 :</strong> Classe ces questions dans la bonne comptabilité : « Quel est le résultat de l'année ? » / « Quel produit est le plus rentable ? ».</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Comptabilité générale : partenaires externes. Comptabilité analytique : dirigeants. <strong>2)</strong> Résultat de l'année → comptabilité générale ; produit le plus rentable → comptabilité analytique.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les deux comptabilités sont complémentaires : l'une informe l'extérieur, l'autre éclaire la gestion interne.</p></div>
<div class="sources"><strong>Sources :</strong> Fiche officielle CAE 4e CG ; références générales.</div>
    `
},
{
    title: "Leçon 3 — Charges directes et charges indirectes",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi ne peut-on pas attribuer facilement la facture d'électricité à un seul produit ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer charges directes et indirectes. Identifier des exemples dans une entreprise simple. Comprendre l'intérêt de la distinction.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Charges directes</div>
<p>Une <strong>charge directe</strong> peut être affectée sans ambiguïté à un produit ou à une activité, car on sait exactement pour quel produit elle a été engagée. Exemples :</p>
<ul>
<li>matières premières utilisées dans un produit ;</li>
<li>main-d'œuvre spécialisée travaillant sur un seul produit ;</li>
<li>emballage propre à un produit.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Charges indirectes</div>
<p>Une <strong>charge indirecte</strong> concerne plusieurs produits ou plusieurs activités à la fois : elle ne peut pas être affectée directement. Exemples :</p>
<ul>
<li>loyer de l'atelier commun ;</li>
<li>électricité de l'usine ;</li>
<li>salaire du gardien, du comptable ;</li>
<li>entretien général.</li>
</ul>
<p>Les charges indirectes doivent être <strong>réparties</strong> entre les produits selon une clé (par exemple, la surface occupée, le nombre d'heures de travail, le chiffre d'affaires).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Exemple</div>
<p>Un atelier fabrique deux types de meubles : tables et chaises.</p>
<ul>
<li>Le bois utilisé pour chaque table est une charge directe de la table.</li>
<li>Le loyer de l'atelier est une charge indirecte, à répartir entre tables et chaises.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Classe ces charges en directes / indirectes : bois d'une table, loyer de l'atelier, colle utilisée pour une chaise, salaire du gardien.</p>
<p><strong>Ex. 2 :</strong> Propose une clé de répartition simple pour le loyer de l'atelier entre tables et chaises.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Directes : bois d'une table, colle d'une chaise. Indirectes : loyer de l'atelier, salaire du gardien. <strong>2)</strong> Par exemple, la surface occupée par chaque production ou le temps de travail consacré à chaque produit.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Directe : affectée sans ambiguïté à un produit. Indirecte : concerne plusieurs produits et doit être répartie.</p></div>
<div class="sources"><strong>Sources :</strong> Fiche officielle CAE 4e CG ; références générales.</div>
    `
},
{
    title: "Leçon 4 — Notion de coût d'achat",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Le prix affiché par le fournisseur est-il le vrai coût pour l'entreprise ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir le coût d'achat. Identifier ses composantes. Calculer un coût d'achat simple.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>Le <strong>coût d'achat</strong> est le total de ce qu'une marchandise coûte réellement à l'entreprise jusqu'à son entrée en stock. Il ne se limite pas au prix d'achat facturé.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Composantes du coût d'achat</div>
<ul>
<li><strong>Prix d'achat</strong> (montant facturé par le fournisseur).</li>
<li><strong>Frais accessoires :</strong> transport, douane, assurance, manutention, frais de dossier.</li>
<li><strong>Réductions obtenues :</strong> remises, rabais, escomptes (à déduire).</li>
</ul>
<p>Formule simplifiée : coût d'achat = prix d'achat net + frais accessoires.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Exemple</div>
<p>Une commerçante de Kinshasa achète des marchandises pour 500 000 FC. Elle paie 30 000 FC de transport et 10 000 FC d'assurance. Coût d'achat = 500 000 + 30 000 + 10 000 = 540 000 FC.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Lien avec le prix de revient</div>
<p>Le coût d'achat ne suffit pas à fixer un prix de vente : il faut y ajouter les charges de fonctionnement (loyer, salaires, etc.) pour obtenir le <strong>prix de revient</strong> complet. Ce calcul est approfondi en 4e année dans le cadre complet de la comptabilité analytique.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois frais accessoires qui entrent dans le coût d'achat.</p>
<p><strong>Ex. 2 :</strong> Un commerçant achète pour 800 000 FC de marchandises, paie 50 000 FC de transport et obtient une remise de 20 000 FC. Calcule le coût d'achat.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Transport, douane, assurance. <strong>2)</strong> Coût d'achat = 800 000 − 20 000 + 50 000 = 830 000 FC.</p>
</details>

          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
