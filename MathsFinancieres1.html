<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un banquier calcule-t-il des intérêts ? Comment un commerçant peut-il savoir combien il remboursera après avoir emprunté ? Les mathématiques financières répondent à ces questions. »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir les mathématiques financières. Comprendre leur utilité. Identifier leurs domaines d'application. Prérequis : maîtrise du calcul arithmétique (pourcentages, proportions, puissances).</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les <strong>mathématiques financières</strong> sont la branche des mathématiques appliquées qui étudie les opérations financières : calcul des intérêts, des placements, des emprunts, des échéances, des valeurs acquises et actuelles.</p>
<p>Elles s'appuient sur des formules précises et sur la notion de temps : un franc aujourd'hui ne vaut pas un franc demain.</p>
<p><strong>Domaines d'application :</strong> banque, assurance, comptabilité, gestion, immobilier, crédit à la consommation, épargne, investissement. Pour l'élève de Commerciale et Gestion, ces notions sont indispensables : elles servent à calculer les intérêts d'un crédit, à évaluer un placement, à comprendre un contrat de prêt.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Mathématiques financières :</strong> étude des opérations financières dans le temps. <strong>Intérêt :</strong> prix du loyer de l'argent. <strong>Capital :</strong> somme prêtée ou placée. <strong>Taux :</strong> pourcentage appliqué au capital. <strong>Durée :</strong> temps du placement ou du prêt.</p>
</div>

    title: "Leçon 2 — Capital, intérêt, taux et durée",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qu'est-ce qu'un capital ? Qu'est-ce qu'un taux d'intérêt ? Pourquoi un prêt coûte-t-il plus cher sur une longue durée ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir les quatre grandeurs de base. Comprendre leurs relations. Connaître les unités utilisées. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>capital</strong> (C) est la somme d'argent prêtée ou placée. L'<strong>intérêt</strong> (I) est la rémunération versée pour l'utilisation de ce capital. Le <strong>taux d'intérêt</strong> (t) est le pourcentage appliqué au capital pour une période donnée (généralement annuel). La <strong>durée</strong> (n) est le temps pendant lequel le capital est prêté ou placé (années, mois ou jours).</p>
<p><strong>Relations :</strong> plus le capital est élevé, plus l'intérêt est élevé ; plus le taux est élevé, plus l'intérêt est élevé ; plus la durée est longue, plus l'intérêt est élevé.</p>
<p><strong>Conversion :</strong> le taux est généralement annuel. Il peut être converti en taux mensuel (t/12) ou journalier (t/360 ou t/365). <strong>Valeur acquise</strong> = Capital + Intérêts. <strong>Valeur actuelle</strong> = Capital de départ.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Capital (C) :</strong> somme prêtée ou placée. <strong>Intérêt (I) :</strong> rémunération du capital. <strong>Taux (t) :</strong> pourcentage. <strong>Durée (n) :</strong> temps. <strong>Valeur acquise :</strong> capital + intérêts. <strong>Valeur actuelle :</strong> capital de départ.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

</div>

<p>Un capital de 100 000 CDF placé à 5 % par an rapporte 5 000 CDF d'intérêts en 1 an. Sur 2 ans, il rapporte 10 000 CDF (intérêt simple). Un taux de 12 % par an correspond à un taux mensuel de 1 % (12/12), ou à un taux journalier de 0,033 % (12/360).</p>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>

    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment calculer les intérêts sur un an, sur un mois, sur un jour ? Comment calculer le capital à partir des intérêts ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre l'intérêt simple. Appliquer la formule. Calculer le capital, le taux ou la durée. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'<strong>intérêt simple</strong> est l'intérêt calculé sur le capital de départ, pour une durée donnée, sans capitalisation.</p>
<p><strong>Formule :</strong> I = C &times; t &times; n / 100 (taux en %). Si le taux est en décimal, I = C &times; t &times; n.</p>
<p><strong>Durées :</strong> si la durée est en mois, n = nombre de mois / 12 ; si elle est en jours, n = nombre de jours / 360 (année commerciale) ou / 365 (année civile).</p>
<p><strong>Calculs inversés :</strong> C = I &times; 100 / (t &times; n) ; t = I &times; 100 / (C &times; n) ; n = I &times; 100 / (C &times; t).</p>
<p><strong>Valeur acquise :</strong> Vn = C + I. <strong>Valeur actuelle :</strong> C = Vn &minus; I.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Intérêt simple :</strong> intérêt calculé sur le capital initial. <strong>Capitalisation :</strong> ajout des intérêts au capital. <strong>Année commerciale :</strong> 360 jours. <strong>Année civile :</strong> 365 jours.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Convertir la durée dans l'unité du taux. Utiliser 360 jours pour les calculs commerciaux. Vérifier les calculs inversés. Respecter les arrondis (2 décimales).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un capital de 200 000 CDF placé à 6 % pendant 2 ans rapporte I = 200 000 &times; 6 &times; 2 / 100 = 24 000 CDF ; valeur acquise 224 000 CDF.</p>
<p>Un capital de 100 000 CDF à 8 % pendant 6 mois rapporte I = 100 000 &times; 8 &times; 6 / (100 &times; 12) = 4 000 CDF.</p>
<p>Un capital de 150 000 CDF à 5 % pendant 90 jours rapporte I = 150 000 &times; 5 &times; 90 / (100 &times; 360) = 1 875 CDF.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Calcule l'intérêt d'un capital de 500 000 CDF à 5 % pendant 3 ans.</p>
<p><strong>Ex. 2 :</strong> Calcule la valeur acquise.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> I = 500 000 &times; 5 &times; 3 / 100 = 75 000 CDF.</p>
<p><strong>2)</strong> 500 000 + 75 000 = 575 000 CDF.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'intérêt simple se calcule sur le capital initial ; la formule est simple et s'applique aux opérations courtes.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel RDC ; fiches pédagogiques 2025.</div>

    title: "Leçon 4 — L'escompte simple",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qu'est-ce qu'un escompte ? Pourquoi un commerçant qui encaisse un effet avant l'échéance reçoit-il moins que le montant nominal ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir l'escompte. Comprendre son calcul. Appliquer la formule. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'<strong>escompte</strong> est l'opération par laquelle une banque avance à un client le montant d'un effet (lettre de change, billet à ordre) avant son échéance, en déduisant un intérêt appelé escompte.</p>
<p>L'escompte commercial se calcule comme un intérêt simple sur la valeur nominale, pour la durée qui sépare la date de remise de la date d'échéance :</p>
<p><strong>e = V &times; t &times; n / 100</strong> (V : valeur nominale ; t : taux d'escompte ; n : durée en années).</p>
<p><strong>Valeur actuelle commerciale :</strong> Va = V &minus; e. <strong>Agios :</strong> ensemble des frais retenus par la banque (escompte + commissions + frais). L'escompte rationnel, plus complexe, est peu utilisé dans les opérations courantes.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Escompte :</strong> avance d'un effet avant l'échéance. <strong>Valeur nominale :</strong> montant de l'effet. <strong>Valeur actuelle :</strong> V &minus; e. <strong>Agios :</strong> frais d'escompte. <strong>Échéance :</strong> date de paiement.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier la valeur nominale. Calculer la durée entre la remise et l'échéance. Appliquer la formule. Déduire les agios.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un commerçant présente à la banque un effet de 1 000 000 CDF à échéance 90 jours. Le taux d'escompte est de 8 %. Escompte : e = 1 000 000 &times; 8 &times; 90 / (100 &times; 360) = 20 000 CDF. Valeur actuelle : 1 000 000 &minus; 20 000 = 980 000 CDF. S'ajoutent des commissions.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Calcule l'escompte d'un effet de 500 000 CDF à 6 % pour 60 jours.</p>
<p><strong>Ex. 2 :</strong> Calcule la valeur actuelle.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> e = 500 000 &times; 6 &times; 60 / (100 &times; 360) = 5 000 CDF.</p>
<p><strong>2)</strong> 500 000 &minus; 5 000 = 495 000 CDF.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'escompte est une opération bancaire courante ; il permet de mobiliser les créances avant l'échéance.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel RDC ; OHADA ; fiches pédagogiques 2025.</div>
    `
},
{
    title: "Leçon 5 — L'équivalence des capitaux",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Peut-on remplacer deux paiements par un seul ? À quelle date ? Comment savoir si deux capitaux sont équivalents ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre l'équivalence. Appliquer la formule. Résoudre un problème d'échéance. Prérequis : leçons 3 et 4.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Deux capitaux sont <strong>équivalents</strong> à une date donnée si, actualisés au même taux et à la même date, ils ont la même valeur actuelle.</p>
<p><strong>Équation d'équivalence :</strong> somme des valeurs actuelles des capitaux de remplacement = somme des valeurs actuelles des capitaux d'origine.</p>
<p><strong>Application :</strong> remplacer plusieurs paiements par un seul ; calculer l'échéance moyenne. <strong>Formule utile :</strong> valeur actuelle = V &minus; V &times; t &times; n / 100.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Équivalence :</strong> même valeur actuelle à une date donnée. <strong>Échéance :</strong> date de paiement. <strong>Échéance moyenne :</strong> date moyenne pondérée. <strong>Capital de remplacement :</strong> nouveau montant.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Choisir une date de référence (souvent la date de remise ou la date d'échéance). Calculer les valeurs actuelles. Poser l'équation d'équivalence. Résoudre pour trouver le montant ou la durée.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un débiteur doit 100 000 CDF à 30 jours et 150 000 CDF à 90 jours (taux 6 %). Il veut payer 250 000 CDF à une date unique. Échéance moyenne pondérée : n = (100 000 &times; 30 + 150 000 &times; 90) / 250 000 = 66 jours. Le paiement unique se fait à 66 jours.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Un débiteur doit 200 000 CDF à 30 jours et 300 000 CDF à 60 jours. Calcule l'échéance moyenne.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> (200 000 &times; 30 + 300 000 &times; 60) / 500 000 = 48 jours.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'équivalence des capitaux permet de simplifier les paiements et de négocier les échéances.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel RDC ; fiches pédagogiques 2025.</div>
    `
},

    title: "Leçon 6 — La valeur acquise",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Si je place 100 000 CDF à 5 % pendant 3 ans, est-ce que j'obtiens la même chose qu'avec l'intérêt simple ? Pourquoi ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les intérêts composés. Appliquer la formule de la valeur acquise. Utiliser les tables financières. Prérequis : leçons 1 à 5.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les <strong>intérêts composés</strong> sont des intérêts qui s'ajoutent au capital à la fin de chaque période et produisent à leur tour des intérêts. C'est la capitalisation.</p>
<p><strong>Formule :</strong> Vn = C &times; (1 + i)<sup>n</sup></p>
<ul>
<li>C : capital initial.</li>
<li>i : taux d'intérêt par période (en décimal).</li>
<li>n : nombre de périodes.</li>
</ul>
<p><strong>Intérêts composés :</strong> I = Vn &minus; C. Les tables financières donnent (1 + i)<sup>n</sup> pour différents i et n. Avec l'intérêt simple, les intérêts ne produisent pas d'intérêts ; avec l'intérêt composé, les intérêts s'ajoutent au capital.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Intérêts composés :</strong> intérêts capitalisés. <strong>Capitalisation :</strong> ajout des intérêts au capital. <strong>Valeur acquise :</strong> capital + intérêts capitalisés. <strong>Taux par période :</strong> taux appliqué à chaque période.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier le taux par période. Appliquer la formule. Utiliser une calculatrice ou une table. Vérifier les arrondis.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>C = 100 000 CDF, i = 5 % = 0,05, n = 3 ans. Vn = 100 000 &times; (1,05)<sup>3</sup> = 115 762,5 CDF.</p>
<p>C = 500 000 CDF, i = 6 %, n = 5 ans. Vn = 500 000 &times; (1,06)<sup>5</sup> = 669 112,5 CDF.</p>
<p>C = 1 000 000 CDF, i = 8 %, n = 10 ans. Vn = 1 000 000 &times; (1,08)<sup>10</sup> = 2 158 925 CDF.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Calcule la valeur acquise d'un capital de 200 000 CDF à 5 % pendant 4 ans.</p>
<p><strong>Ex. 2 :</strong> Calcule les intérêts.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Vn = 200 000 &times; (1,05)<sup>4</sup> = 243 101 CDF.</p>
<p><strong>2)</strong> 243 101 &minus; 200 000 = 43 101 CDF.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les intérêts composés produisent un effet boule de neige ; la valeur acquise croît exponentiellement.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel RDC ; fiches pédagogiques 2025.</div>
    `
},

    title: "Leçon 7 — La valeur actuelle",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Combien faut-il placer aujourd'hui pour obtenir 1 000 000 CDF dans 5 ans ? Comment comparer deux capitaux disponibles à des dates différentes ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la valeur actuelle. Appliquer la formule. L'utiliser pour comparer des capitaux. Prérequis : leçon 6.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>valeur actuelle</strong> est le montant qu'il faut placer aujourd'hui, à un taux donné, pour obtenir une valeur future. C'est l'actualisation.</p>
<p><strong>Formule :</strong> V0 = Vn / (1 + i)<sup>n</sup> = Vn &times; (1 + i)<sup>&minus;n</sup></p>
<p><strong>Utilisations :</strong> comparer des capitaux à des dates différentes, évaluer un investissement, calculer la valeur d'un effet escompté. L'escompte composé utilise la valeur actuelle.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Valeur actuelle :</strong> capital placé aujourd'hui. <strong>Actualisation :</strong> calcul de la valeur actuelle. <strong>Facteur d'actualisation :</strong> (1 + i)<sup>&minus;n</sup>.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier la valeur future. Appliquer la formule. Utiliser la calculatrice ou la table. Comparer les valeurs actuelles pour décider.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Pour obtenir 1 000 000 CDF dans 3 ans à 5 %, il faut placer V0 = 1 000 000 / (1,05)<sup>3</sup> = 863 837,5 CDF. Un héritage de 500 000 CDF à recevoir dans 2 ans vaut aujourd'hui V0 = 500 000 / (1,05)<sup>2</sup> = 453 515 CDF (à 5 %).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la valeur actuelle de 800 000 CDF à recevoir dans 3 ans à 7 % ?</p>
<details><summary>Corrigé</summary>

</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La valeur actuelle permet de comparer des capitaux disponibles à des dates différentes.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel RDC ; fiches pédagogiques 2025.</div>
    `

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Si je place 100 000 CDF chaque année à 5 %, combien aurai-je dans 5 ans ? Comment calculer la valeur d'une série de versements ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir une annuité. Connaître les types d'annuités. Calculer la valeur acquise d'une suite d'annuités. Prérequis : leçons 6 et 7.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une <strong>annuité</strong> est un versement régulier (annuel, semestriel, trimestriel, mensuel) effectué pendant une durée déterminée.</p>
<p><strong>Types :</strong> annuités constantes (même montant chaque période) ; annuités variables (montant variable) ; annuités de début ou de fin de période.</p>
<p><strong>Valeur acquise</strong> d'une suite d'annuités de fin de période :</p>
<p>Vn = a &times; [(1 + i)<sup>n</sup> &minus; 1] / i</p>
<p>avec a : annuité ; i : taux par période ; n : nombre de versements. <strong>Valeur actuelle :</strong> V0 = a &times; [1 &minus; (1 + i)<sup>&minus;n</sup>] / i.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Annuité :</strong> versement régulier. <strong>Annuité constante :</strong> même montant. <strong>Valeur acquise :</strong> total à la fin. <strong>Valeur actuelle :</strong> valeur aujourd'hui. <strong>Taux par période :</strong> taux applicable.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier le type d'annuité. Convertir le taux et la période dans la même unité. Appliquer la formule. Utiliser les tables financières.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une personne place 100 000 CDF chaque fin d'année pendant 5 ans à 6 %. Valeur acquise : Vn = 100 000 &times; [(1,06)<sup>5</sup> &minus; 1] / 0,06 = 563 709 CDF.</p>
<p>Une entreprise place 500 000 CDF chaque trimestre à 2 % par trimestre pendant 3 ans (12 trimestres) : Vn = 500 000 &times; [(1,02)<sup>12</sup> &minus; 1] / 0,02 = 6 706 045 CDF.</p>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Calcule la valeur acquise de 50 000 CDF versés chaque année pendant 4 ans à 5 %.</p>

</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les annuités permettent de calculer la valeur d'une série de versements réguliers.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel RDC ; fiches pédagogiques 2025.</div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre l'annuité de remboursement. Calculer l'annuité constante. Calculer le capital restant dû. Prérequis : leçons 6 à 8.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'<strong>annuité de remboursement</strong> est le montant versé régulièrement pour rembourser un emprunt (capital + intérêts).</p>
<p><strong>Annuité constante :</strong> a = C &times; i / [1 &minus; (1 + i)<sup>&minus;n</sup>]</p>

<p><strong>Tableau d'amortissement :</strong> présente pour chaque période l'annuité, les intérêts, l'amortissement et le capital restant dû. Utilisations : crédit immobilier, crédit à la consommation, crédit d'investissement.</p>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les annuités de remboursement permettent de planifier le remboursement d'un crédit.</p></div>

<p><strong>Tableau d'amortissement :</strong> annuités, intérêts, amortissements, capital restant dû. <strong>Coût total :</strong> somme des annuités &minus; capital emprunté.</p>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Emprunt indivis :</strong> emprunt auprès d'un seul prêteur. <strong>Amortissement :</strong> remboursement du capital. <strong>Annuité :</strong> versement périodique. <strong>In fine :</strong> remboursement final. <strong>Capital restant dû :</strong> montant à rembourser.</p>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment présenter les échéances d'un emprunt ? Comment calculer les intérêts et le capital restant dû à chaque période ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la structure du tableau. Construire un tableau simple. Interpréter les résultats. Prérequis : leçon 10.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>tableau d'amortissement</strong> présente, pour chaque période :</p>

<li>Les intérêts de la période (capital restant dû &times; taux).</li>
<li>L'amortissement (remboursement du capital).</li>
<li>L'annuité (intérêts + amortissement).</li>
<li>Le capital restant dû en fin de période.</li>

<p><strong>Construction :</strong> calculer les intérêts sur le capital restant dû, déduire l'amortissement, calculer l'annuité, mettre à jour le capital restant dû.</p>
<p><strong>Vérification :</strong> la somme des amortissements = capital emprunté ; la dernière annuité solde le capital.</p>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Tableau d'amortissement :</strong> tableau des échéances. <strong>Capital restant dû :</strong> montant à rembourser. <strong>Intérêts :</strong> coût de la période. <strong>Amortissement :</strong> remboursement du capital. <strong>Annuité :</strong> intérêts + amortissement.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Calculer les intérêts sur le capital restant dû. Déduire l'amortissement de l'annuité. Mettre à jour le capital restant dû. Vérifier la cohérence.</p>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Emprunt de 1 000 000 CDF à 10 % sur 3 ans, amortissement constant (333 333 CDF par an) :</p>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>

  var OK = '<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';
  try {
    if (typeof questions !== "undefined" && questions && questions.forEach) {
      questions.forEach(function (q) {
        if (!q.options) q.options = q.opts || q.choices || q.choix || q.reponses || q.propositions || [];
        if (q.text === undefined) q.text = q.question || q.q || q.enonce || q.titre || "";
        if (typeof q.correct === "undefined") {
          if (typeof q.answer !== "undefined") q.correct = q.answer;
          else if (typeof q.reponse !== "undefined") q.correct = q.reponse;
        }
      });
    }
  } catch (e) {}
  var synth = window.speechSynthesis || null;
  var HAS_CACHE = !!(window.caches && window.caches.open);
  var NATIVE = false;
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  var LATER = "ecolia_audio_later_" + CFG.code;
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function init() {
    if (document.getElementById("ecolia-audio-btn")) return;
    var btn = document.createElement("button");
    btn.id = "ecolia-audio-btn"; btn.type = "button"; btn.className = "ecolia-off";
    btn.setAttribute("aria-label", "Écouter la leçon"); btn.innerHTML = PLAY;
    var dlBtn = document.createElement("button");
    dlBtn.id = "ecolia-dl-btn"; dlBtn.type = "button"; dlBtn.className = "ecolia-off";
    dlBtn.innerHTML = DL;
    var host = document.querySelector(".header-right");
    if (host) { host.insertBefore(dlBtn, host.firstChild); host.insertBefore(btn, dlBtn); }
    else { btn.className += " ecolia-fixed"; document.body.appendChild(btn); }
    var banner = document.createElement("div");
    banner.id = "ecolia-audio-banner";
    banner.innerHTML = '<span class="eab-txt"></span><span class="eab-act"></span><div class="eab-bar"><i></i></div>';
    var content = document.getElementById("content");
    if (content && content.parentNode) content.parentNode.insertBefore(banner, content);
    else document.body.insertBefore(banner, document.body.firstChild);
    var txtEl = banner.querySelector(".eab-txt"), actEl = banner.querySelector(".eab-act");
    var barEl = banner.querySelector(".eab-bar"), barI = barEl.firstChild;
    var audio = new Audio();
    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }
    function cur() { try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {} return 0; }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];

      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();

              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();

            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);

    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
