<div class="sources"><strong>Sources :</strong> « Guide Pédagogique 2e Année » (RDC) ; « L'Afrique des grands lacs : rondes, comptines et berceuses » (S. Bouboul Akwel) ; « Danse avec moi à Kinshasa (Comptines et danses congolaises) ».</div>

{

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi chante-t-on des comptines aux jeunes enfants depuis toujours ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le rôle de la comptine. Identifier ses bienfaits. Prérequis : goût pour le chant et le rythme.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Comptine :</strong> court texte rimé et rythmé, souvent accompagné de gestes, destiné aux jeunes enfants.</p>
<p><strong>Bienfaits :</strong></p>
<ul>
<li><strong>Langage :</strong> enrichit le vocabulaire, travaille les sons, prépare à la lecture.</li>
<li><strong>Mémoire :</strong> entraîne la mémorisation par la répétition.</li>
<li><strong>Rythme :</strong> développe la conscience des syllabes et des sons.</li>
<li><strong>Socialisation :</strong> favorise le jeu collectif, l'écoute, le tour de rôle.</li>
<li><strong>Affectif :</strong> rassure, crée du lien (berceuses).</li>
<li><strong>Culture :</strong> transmet le patrimoine (comptines congolaises).</li>
</ul>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Comptine :</strong> texte court, rimé et rythmé. <strong>Berceuse :</strong> comptine pour endormir. <strong>Formulette :</strong> courte comptine pour choisir, compter ou rythmer.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Associer parole, rythme et mouvement. Choisir une comptine adaptée à l'âge. Ne pas réduire la comptine à un simple divertissement.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>La comptine « Katoto lala » (Dors mon bébé) berce l'enfant tout en l'initiant à la musicalité de la langue et à la chaleur affective.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Citer trois bienfaits de la comptine. <strong>Ex. 2 :</strong> Pourquoi la comptine favorise-t-elle le développement du langage ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Langage, mémoire, socialisation (autres réponses possibles). <strong>2)</strong> Parce qu'elle enrichit le vocabulaire et travaille les sons par la répétition.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La comptine est le premier livre de l'enfant : elle éveille, rassure et structure.</p></div>

<div class="sources"><strong>Sources :</strong> Guide Pédagogique 2e Année ; recueils de comptines congolaises.</div>
    `
},
{
    title: "Leçon 2 — Le répertoire de comptines",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment un enseignant choisit-il les comptines qu'il chantera à ses élèves ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les types de comptines. Choisir selon l'âge et l'objectif. Constituer un répertoire. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Types de comptines :</strong></p>
<ul>
<li><strong>Berceuses :</strong> pour endormir, apaisantes (ex. « Katoto lala »).</li>
<li><strong>Comptines à gestes :</strong> accompagnées de mouvements (ex. « Ainsi font, font, font »).</li>
<li><strong>Comptines rythmées :</strong> pour marquer le rythme (ex. « Kuya mbio »).</li>
<li><strong>Formulettes :</strong> courtes, pour compter ou choisir.</li>
</ul>
<p><strong>Critères de choix :</strong></p>
<ul>
<li>Âge des enfants.</li>
<li>Objectif (apaiser, éveiller, apprendre à compter).</li>
<li>Longueur et musicalité.</li>
<li>Ancrage culturel.</li>
</ul>
<p><strong>Constitution d'un répertoire :</strong> collecter auprès des aînés, des recueils et créer ses propres comptines.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Répertoire :</strong> ensemble organisé de comptines. <strong>Formulette :</strong> comptine courte à usage spécifique.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Varier les types. Vérifier l'adaptation à l'âge. Noter les paroles et les gestes. Préférer les comptines ancrées dans la culture locale.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Classer des comptines comme « Kuya mbio » (Cours vite) dans la catégorie des comptines rythmées, et « Katoto lala » dans celle des berceuses.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>

<details><summary>Corrigé</summary>
<p><strong>1)</strong> Berceuses, comptines à gestes, comptines rythmées, formulettes. <strong>2)</strong> Âge et objectif (autres réponses possibles).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un bon répertoire est varié, adapté et enraciné dans la culture des enfants.</p></div>

<div class="sources"><strong>Sources :</strong> Guide Pédagogique 2e Année ; recueils de comptines congolaises.</div>
    `

{
    title: "Leçon 3 — Analyse d'une comptine",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi « jour » et « cour » se ressemblent-ils dans une comptine ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Décompter les syllabes. Identifier les rimes et les sons. Repérer le rythme. Comprendre le sens. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Décompte syllabique :</strong> découper un mot en syllabes (« pen-dant le jour » = 4 syllabes).</p>
<p><strong>Rimes :</strong> sons identiques en fin de vers (jour / tour / cour / savoure → son [ur]).</p>
<p><strong>Rythme :</strong> pulsation régulière, souvent marquée par des frappes de mains ou des gestes.</p>
<p><strong>Sens :</strong> comprendre le thème (la journée, les animaux, la famille).</p>
<p><strong>Procédés fréquents :</strong> répétition, accumulation.</p>
<p><strong>Objectif pédagogique :</strong> préparer l'enfant à la lecture en développant la conscience phonologique.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Syllabe :</strong> unité de prononciation. <strong>Rime :</strong> son identique en fin de vers. <strong>Pulsation :</strong> battement régulier.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Lire la comptine à voix haute. Frapper les syllabes. Repérer les rimes. Identifier le thème.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Analyser la comptine « Ma journée » : compter les syllabes (« Pen-dant le jour » = 4 syllabes), identifier les rimes (jour/tour/cour/savoure), repérer le son [ur].</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Comment identifier une rime ? <strong>Ex. 2 :</strong> Pourquoi l'analyse phonologique prépare-t-elle à la lecture ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> En repérant un son identique en fin de vers. <strong>2)</strong> Parce qu'elle développe la conscience des unités sonores.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Derrière chaque comptine se cache une structure phonologique et rythmique à découvrir.</p></div>

<div class="sources"><strong>Sources :</strong> Guide Pédagogique 2e Année.</div>
    `

    title: "Leçon 4 — Concevoir et animer une séance de comptine",

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment organiser une séance de comptine qui capte l'attention des enfants ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Structure d'une séance :</strong></p>

<li><strong>Répétition</strong> (avec le groupe).</li>
<li><strong>Jeu</strong> (frappes, gestes, mimes).</li>
<li><strong>Évaluation</strong> (les enfants récitent seuls).</li>
</ol>
<p><strong>Consignes :</strong> courtes, claires, une à la fois.</p>
<p><strong>Gestes et mimiques :</strong> renforcent la mémorisation et l'attention.</p>
<p><strong>Matériel :</strong> bouchons, cartons, images pour illustrer.</p>
<p><strong>Fiche de séance :</strong> objectif, déroulement, matériel, évaluation.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Fiche de séance :</strong> document de préparation. <strong>Animateur :</strong> celui qui conduit l'activité.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une séance de comptine se prépare comme une leçon : avec des objectifs et un déroulement.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Éléments de base :</strong></p>
<ul>
<li><strong>Rythme :</strong> pulsation régulière.</li>
<li><strong>Mélodie :</strong> suite de sons.</li>
<li><strong>Intensité :</strong> fort / doux.</li>
</ul>
<p><strong>Instruments simples (matériaux de récupération) :</strong></p>

<li>Maracas (boîtes + grains).</li>

<li>Flûte (tube creux).</li>
<li>Bâtons rythmiques.</li>
</ul>
<p><strong>Chant collectif :</strong> cohésion du groupe, écoute, plaisir partagé.</p>
<p><strong>Liens avec les apprentissages :</strong> mathématiques (compter les temps), langage (paroles), motricité (gestes).</p>

abes et des sons. Socialisation: favorise le jeu collectif, l'écoute, le tour de rôle. Affectif: rassure, crée du lien (berceuses). Culture: transmet le patrimoine (comptines congolaises). Définitions. Comptine: texte court, rimé et rythmé. Berceuse: comptine pour endormir. Formulette: courte comptine pour choisir, compter ou rythmer. Méthodes et règles. Associer parole, rythme et mouvement. Choisir une comptine adaptée à l'âge. Ne pas réduire la comptine à un simple divertissement. Exemple. La comptine « Katoto lala » (Dors mon bébé) berce l'enfant tout en l'initiant à la musicalité de la langue et à la chaleur affective. Exercices. Ex. 1: Citer trois bienfaits de la comptine. Ex. 2: Pourquoi la comptine favorise-t-elle le développement du langage? Corrigé. 1) Langage, mémoire, socialisation (autres réponses possibles). 2) Parce qu'elle enrichit le vocabulaire et travaille les sons par la répétition. À retenir. La comptine est le premier livre de l'enfant: elle éveille, rassure et structure."]],"3":[["fr","Leçon 2, Le répertoire de comptines. Situation. « Comment un enseignant choisit-il les comptines qu'il chantera à ses élèves? ». Objectifs. Connaître les types de comptines. Choisir selon l'âge et l'objectif. Constituer un répertoire. Prérequis: leçon 1. Théorie. Types de comptines: Berceuses: pour endormir, apaisantes (ex. « Katoto lala »). Comptines à gestes: accompagnées de mouvements (ex. « Ainsi font, font, font »). Comptines rythmées: pour marquer le rythme (ex. « Kuya mbio »). Formulettes: courtes, pour compter ou choisir. Critères de choix: Âge des enfants. Objectif (apaiser, éveiller, apprendre à compter). Longueur et musicalité. Ancrage culturel. Constitution d'un répertoire: collecter auprès des aînés, des recueils et créer ses propres comptines. Définitions. Répertoire: ensemble organisé de comptines. Formulette: comptine courte à usage spécifique. Méthodes et règles. Varier les types. Vérifier l'adaptation à l'âge. Noter les paroles et les gestes. Préférer les comptines ancrées dans la culture locale. Exemple. Classer des comptines comme « Kuya mbio » (Cours vite) dans la catégorie des comptines rythmées, et « Katoto lala » dans celle des berceuses. Exercices. Ex. 1: Citer les principaux types de comptines. Ex. 2: Citer deux critères de choix. Corrigé. 1) Berceuses, comptines à gestes, comptines rythmées, formulettes. 2) Âge et objectif (autres réponses possibles). À retenir. Un bon répertoire est varié, adapté et enraciné dans la culture des enfants."]],"4":[["fr","Leçon 3, Analyse d'une comptine. Situation. « Pourquoi « jour » et « cour » se ressemblent-ils dans une comptine? ». Objectifs. Décompter les syllabes. Identifier les rimes et les sons. Repérer le rythme. Comprendre le sens. Prérequis: leçons 1 et 2. Théorie. Décompte syllabique: découper un mot en syllabes (« pen-dant le jour » égale 4 syllabes). Rimes: sons identiques en fin de vers (jour ou tour ou cour ou savoure, donc son [ur]). Rythme: pulsation régulière, souvent marquée par des frappes de mains ou des gestes. Sens: comprendre le thème (la journée, les animaux, la famille). Procédés fréquents: répétition, accumulation. Objectif pédagogique: préparer l'enfant à la lecture en développant la conscience phonologique. Définitions. Syllabe: unité de prononciation. Rime: son identique en fin de vers. Pulsation: battement régulier. Méthodes et règles. Lire la comptine à voix haute. Frapper les syllabes. Repérer les rimes. Identifier le thème. Exemple. Analyser la comptine « Ma journée »: compter les syllabes (« Pen-dant le jour » égale 4 syllabes), identifier les rimes (jour ou tour ou cour ou savoure), repérer le son [ur]. Exercices. Ex. 1: Comment identifier une rime? Ex. 2: Pourquoi l'analyse phonologique prépare-t-elle à la lecture? Corrigé. 1) En repérant un son identique en fin de vers. 2) Parce qu'elle développe la conscience des unités sonores. À retenir. Derrière chaque comptine se cache une structure phonologique et rythmique à découvrir."]],"5":[["fr","Leçon 4, Concevoir et animer une séance de comptine. Situation. « Comment organiser une séance de comptine qui capte l'attention des enfants? ». Objectifs. Structurer une séance. Utiliser les gestes et le rythme. Gérer la participation. Prérequis: leçons 1 à 3. Théorie. Structure d'une séance: Écoute de la comptine. Découverte (paroles, gestes). Répétition (avec le groupe). Jeu (frappes, gestes, mimes). Évaluation (les enfants récitent seuls). Consignes: courtes, claires, une à la fois. Gestes et mimiques: renforcent la mémorisation et l'attention. Matériel: bouchons, cartons, images pour illustrer. Fiche de séance: objectif, déroulement, matériel, évaluation. Définitions. Fiche de séance: document de préparation. Animateur: celui qui conduit l'activité. Méthodes et règles. Préparer la séance. Varier les modalités (écoute, gestes, chant). Faire participer tous les enfants. Évaluer par observation. Exemple. Animer une séance sur « Ma journée »: écoute de la comptine, décompte des syllabes avec des bouchons, récitation avec gestes, jeu de rimes. Exercices. Ex. 1: Quelles sont les étapes d'une séance de comptine? Ex. 2: Pourquoi utiliser des gestes et des mimiques? Corrigé. 1) Écoute, découverte, répétition, jeu, évaluation. 2) Pour renforcer la mémorisation et maintenir l'attention. À retenir. Une séance de comptine se prépare comme une leçon: avec des objectifs et un déroulement."]],"6":[["fr","Leçon 5, Musique et chant. Situation. « Faut-il être musicien pour faire de la musique avec des enfants? ». Objectifs. Comprendre les éléments de base de la musique. Fabriquer des instruments simples. Animer un chant collectif. Prérequis: leçons 1 à 4. Théorie. Éléments de base: Rythme: pulsation régulière. Mélodie: suite de sons. Intensité: fort ou doux. Instruments simples (matériaux de récupération): Maracas (boîtes plus grains). Tambour (boîte plus peau tendue). Flûte (tube creux). Bâtons rythmiques. Chant collectif: cohésion du groupe, écoute, plaisir partagé. Liens avec les apprentissages: mathématiques (compter les temps), langage (paroles), motricité (gestes). Définitions. Rythme: pulsation régulière. Mélodie: suite de sons. Instrument simple: instrument fabriqué avec des matériaux de récupération. Méthodes et règles. Utiliser le corps (frappes, claquements). Fabriquer des instruments avec des matériaux locaux. Accompagner les comptines. Exemple. Fabriquer des maracas avec des boîtes de conserve et des grains, puis les utiliser pour marquer le rythme d'une comptine ou d'une chanson. Exercices. Ex. 1: Citer les éléments de base de la musique. Ex. 2: Proposer une activité musicale simple à réaliser avec des enfants. Corrigé. 1) Rythme, mélodie, intensité. 2) Fabriquer des maracas et accompagner une comptine (autres réponses possibles). À retenir. La musique est accessible à tous: elle se vit avant de se théoriser."]],"7":[["fr","Évaluation finale, Comptines et Musique. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 12 sur 20, tu as réussi."]]}};

          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
