        <p>Une minoterie de Kinshasa exploitait une ligne d'ensachage commandée par logique câblée. À chaque modification du format de sac, il fallait recâbler une partie de l'armoire : plusieurs heures d'arrêt, risque d'erreur de câblage. Aujourd'hui, la même ligne est pilotée par un <strong>automate programmable</strong>. Un simple changement de recette dans le logiciel suffit : le technicien modifie un paramètre et la ligne redémarre en quelques minutes.</p>
        <p>C'est le grand intérêt de l'API : <strong>la flexibilité</strong>. La logique de commande n'est plus figée dans des fils, elle est inscrite dans un programme que l'on peut lire, sauvegarder, modifier et recharger.</p>

        <h3>Quatre éléments à distinguer</h3>
        <p>Un système automatisé comporte quatre grandes parties :</p>
        <ul>
          <li><strong>La partie opérative (PO)</strong> : elle <em>agit</em> sur la matière d'œuvre. Ce sont les moteurs, vérins, pompes, électrovannes, résistances chauffantes, convoyeurs. La PO est l'ensemble des <strong>actionneurs</strong> qui font le travail physique.</li>
          <li><strong>La partie commande (PC)</strong> : elle <em>décide</em>. C'est l'automate programmable et son programme. La PC reçoit des informations, exécute la logique et envoie des ordres.</li>
          <li><strong>L'interface</strong> : les <strong>capteurs</strong> (informations vers la PC) et les <strong>préactionneurs</strong> (ordres de la PC vers la PO). Les préactionneurs sont les contacteurs, distributeurs hydrauliques/pneumatiques, variateurs de vitesse.</li>
          <li><strong>Le dialogue</strong> : le pupitre opérateur, l'écran de supervision, les boutons et voyants qui permettent à l'opérateur de dialoguer avec le système.</li>

        <div class="bloc-label">Fondements théoriques</div>
        <h3>Pourquoi automatiser ?</h3>
        <p>Automatiser un processus industriel, ce n'est pas « remplacer les humains » : c'est <strong>améliorer</strong> la production et les conditions de travail. Les intérêts sont multiples :</p>

        <h3>Un calculateur industriel robuste</h3>
        <p>L'<strong>automate programmable industriel (API)</strong> est un calculateur conçu pour fonctionner en milieu industriel : températures élevées, vibrations, poussière, perturbations électromagnétiques. Il exécute un programme en temps réel et commande un processus.</p>
        <p>Sa constitution comprend :</p>

        <p>Un API ne traite pas les entrées et les sorties en continu. Il fonctionne par <strong>cycles successifs</strong> appelés <strong>cycles de scrutation</strong>. Chaque cycle comporte quatre étapes dans l'ordre :</p>

          <li><strong>CTU</strong> (Count Up) : compte à chaque <strong>front montant</strong> de l'entrée de comptage. Quand la valeur courante atteint la consigne (PV = preset), le bit de sortie s'active. Une entrée de reset (R) remet le compteur à zéro.</li>
          <li><strong>CTD</strong> (Count Down) : compte à la descente (décompte) à partir d'une valeur initiale chargée.</li>
          <li><strong>CTUD</strong> (Count Up/Down) : compte et décompte selon deux entrées distinctes.</li>
        </ul>

        <p>Le <strong>Grafcet</strong> (Graphe fonctionnel de commande étape/transition) est un outil graphique normalisé pour décrire le comportement d'un automatisme séquentiel. Il permet de <strong>penser</strong> la séquence avant de <strong>programmer</strong> l'API. Ses éléments :</p>

          <li><strong>Étapes</strong> : cases rectangulaires numérotées (1, 2, 3…). L'étape initiale est un double rectangle. Une étape est <strong>active</strong> ou inactive.</li>
          <li><strong>Transitions</strong> : barres horizontales entre deux étapes. Chaque transition porte une <strong>condition</strong> (réceptivité) qui, lorsqu'elle est vraie, permet de passer de l'étape amont à l'étape aval.</li>
          <li><strong>Actions</strong> : associées à chaque étape, inscrites à droite. Elles indiquent ce qui doit être fait lorsque l'étape est active.</li>

      </div>

          <li>Le franchissement <strong>désactive</strong> l'étape amont et <strong>active</strong> l'étape aval.</li>
          <li>Une seule étape est active à la fois dans une séquence linéaire (sauf parallélisme explicite).</li>

          <li><strong>Activation d'une étape</strong> : M<sub>i</sub> = (M<sub>i−1</sub> ET condition de transition) OU (M<sub>i</sub> ET NON condition de sortie). En pratique, on utilise souvent un Set/Reset : Set M<sub>i</sub> si M<sub>i−1</sub> et transition vraie, Reset M<sub>i</sub> si M<sub>i+1</sub> devient active.</li>
          <li><strong>Actions</strong> : les sorties physiques sont conditionnées par les mémoires d'étape. Exemple : vanne = M<sub>2</sub> OU M<sub>3</sub> ; pompe = M<sub>3</sub>.</li>

        <p>La <strong>sécurité positive</strong> impose que tout défaut (coupure de fil, perte d'alimentation, capteur en panne) entraîne la <strong>mise en sécurité</strong> de la machine, c'est-à-dire son arrêt. Pour cela :</p>

          <li>Une coupure de fil ou une perte d'alimentation ouvre le circuit : la machine s'arrête.</li>
          <li>Si l'on utilisait des contacts NO, une coupure passerait inaperçue et la machine resterait en marche : <strong>danger mortel</strong>.</li>
        </ul>
      </div>

      <div class="bloc theorie">

          <li><strong>Capots et portes</strong> : interverrouillés ; l'ouverture coupe la commande.</li>
          <li><strong>Barrières immatérielles</strong> (rideaux lumineux) : arrêtent la machine si une personne franchit la zone dangereuse.</li>
          <li><strong>Relais de sécurité</strong> : modules redondants certifiés pour les fonctions de sécurité critiques (normes ISO 13849, IEC 62061).</li>
          <li><strong>Asservissements</strong> : la machine ne peut démarrer que si le capot est fermé, la pièce bien en place, etc.</li>

          <li><strong>Réparer</strong> : remplacer le capteur, resserrer une borne, corriger le programme, reconfigurer un module.</li>
          <li><strong>Vérifier</strong> : relancer la séquence, contrôler le comportement sur plusieurs cycles, sauvegarder.</li>

        <h3>Les huit idées maîtresses</h3>

itre III, Les capteurs et les actionneurs. Chapitre IV, Le langage ladder (1): logique combinatoire et auto-maintien. Chapitre V, Le langage ladder (2): temporisateurs et compteurs. Chapitre VI, Le langage ladder (3): Grafcet et séquenceurs. Chapitre VII, Mise en œuvre, câblage et sécurité. Chapitre VIII, Diagnostic et maintenance."]],"2":[["fr","Chapitre I, Pourquoi les automates programmables? Situation-problème. Une minoterie de Kinshasa veut moderniser sa ligne. Une minoterie de Kinshasa exploitait une ligne d'ensachage commandée par logique câblée. À chaque modification du format de sac, il fallait recâbler une partie de l'armoire: plusieurs heures d'arrêt, risque d'erreur de câblage. Aujourd'hui, la même ligne est pilotée par un automate programmable. Un simple changement de recette dans le logiciel suffit: le technicien modifie un paramètre et la ligne redémarre en quelques minutes. C'est le grand intérêt de l'API: la flexibilité. La logique de commande n'est plus figée dans des fils, elle est inscrite dans un programme que l'on peut lire, sauvegarder, modifier et recharger. Fondements théoriques. De la logique câblée à la logique programmée. Logique câblée (contacteurs, relais). Logique programmée (API). Modification égale recâblage complet. Modification égale correction du programme. Nombre de composants élevé pour des séquences complexes. Un seul automate pour des dizaines de fonctions. Usure mécanique des contacts. Pas d'usure (contacts virtuels). Diagnostic difficile (armoire volumineuse). Diagnostic assisté par logiciel (voyants, forçage, supervision). Coût faible pour une fonction simple. Coût plus élevé à l'achat, amorti pour des fonctions nombreuses. En R D C, les industries minières du Lualaba, les brasseries et minoteries de Kinshasa, les stations de pompage de la REGIDESO et les cimenteries du Kongo-Central utilisent massivement des API pour commander leurs processus. Points clés. L'API remplace la logique câblée par un programme. Flexibilité: modification du programme sans recâblage. Diagnostic plus rapide grâce aux voyants et au logiciel. Base de l'automatisation industrielle moderne."]],"3":[["fr","Chapitre I, Architecture d'un système automatisé. Fondements théoriques. Quatre éléments à distinguer. Un système automatisé comporte quatre grandes parties: La partie opérative (PO): elle agit sur la matière d'œuvre. Ce sont les moteurs, vérins, pompes, électrovannes, résistances chauffantes, convoyeurs. La PO est l'ensemble des actionneurs qui font le travail physique. La partie commande (PC): elle décide. C'est l'automate programmable et son programme. La PC reçoit des informations, exécute la logique et envoie des ordres. L'interface: les capteurs (informations vers la PC) et les préactionneurs (ordres de la PC vers la PO). Les préactionneurs sont les contacteurs, distributeurs hydrauliques ou pneumatiques, variateurs de vitesse. Le dialogue: le pupitre opérateur, l'écran de supervision, les boutons et voyants qui permettent à l'opérateur de dialoguer avec le système. L'architecture d'un système automatisé. Exemple concret. Dans une station de pompage REGIDESO: PO: la pompe et son moteur, la vanne motorisée. PC: l'API qui déclenche le démarrage à heure programmée et gère le niveau. Interface: capteur de niveau (analogique), capteur de pression, capteur de présence (TOR), contacteur du moteur (préactionneur). Dialogue: pupitre avec bouton marche, voyant « en service », écran d'alarme. Points clés. PO agit, PC décide. Interface égale capteurs (entrée) plus préactionneurs (sortie). Dialogue égale pupitre, écran, boutons, voyants."]],"4":[["fr","Chapitre I, Les intérêts de l'automatisation. Fondements théoriques. Pourquoi automatiser? Automatiser un processus industriel, ce n'est pas « remplacer les humains »: c'est améliorer la production et les conditions de travail. Les intérêts sont multiples: Productivité: le système travaille sans pause, à cadence constante. Régularité de la qualité: chaque pièce est produite selon les mêmes paramètres. Sécurité des opérateurs: les tâches dangereuses (soudage, découpe, pression) sont réalisées par la machine; l'opérateur surveille depuis le pupitre. Économie d'énergie et de matière: arrêt automatique quand la production est terminée, dosage précis. Flexibilité: changement de recette par programme, sans recâblage. Traçabilité: les API enregistrent les événements, ce qui facilite la maintenance et la qualité. Fondements théoriques. Les deux niveaux d'automatisation. Automatisation câblée: réalisée par contacteurs, relais, temporisateurs électromécaniques. Simple et robuste, mais peu flexible. Automatisation programmée: réalisée par API, microcontrôleurs ou calculateurs industriels. Flexible, évolutive, diagnosable. Le cours d'électricité industrielle a présenté la logique câblée; ce cours-ci présente la logique programmée. Application R D C. Dans une brasserie de Kinshasa, l'automatisation du conditionnement permet de traiter plusieurs formats de bouteilles sur la même ligne: la recette change dans l'API, les guides et cadences s'ajustent automatiquement. Sans API, il faudrait une ligne dédiée par format, ce qui serait économiquement impossible. Points clés. 6 intérêts majeurs: productivité, qualité, sécurité, économie, flexibilité, traçabilité. Deux niveaux: câblé (rigide) et programmé (flexible). En R D C, automatisation croissante dans les mines, l'agroalimentaire et le pompage."]],"5":[["fr","Chapitre II, Constitution d'un API. Fondements théoriques. Un calculateur industriel robuste. L'automate programmable industriel (API) est un calculateur conçu pour fonctionner en milieu industriel: températures élevées, vibrations, poussière, perturbations électromagnétiques. Il exécute un programme en temps réel et commande un processus. Sa constitution comprend: L'unité centrale (CPU): le « cerveau » qui exécute le programme, gère les entrées ou sorties et communique. Les mémoires: mémoire programme (où est stocké le programme), mémoire de données (variables, temporisateurs, compteurs), images des entrées et des sorties. Les modules d'entrées: TOR (tout ou rien, 24 V DC ou 230 V AC) ou analogiques (4-20 mA, 0-10 V). Les modules de sorties: à relais (pour charges AC ou DC), à transistor (DC seulement, plus rapide), à triac (AC seulement). L'alimentation: 24 V DC (fréquent), 230 V AC, parfois redondante. Les modules de communication: Ethernet, Profibus, Modbus, série R S232/R S485. La constitution d'un API. Exemples industriels. Sur le marché, on trouve des API de marques variées: Siemens (S7-1200, S7-1500), Schneider (M221, M241), Allen-Bradley (MicroLogix, CompactLogix), Omron, Mitsubishi. Les principes sont les mêmes, seules la syntaxe de programmation et l'adressage diffèrent (par exemple I0.0 chez Siemens et I:1 sur 0 chez Allen-Bradley désignent tous deux une entrée). Points clés. CPU plus mémoires plus modules E ou S plus alimentation plus communication. E ou S TOR et analogiques. Sorties à relais, transistor ou triac. API robustes et industriels, pas de simples ordinateurs."]],"6":[["fr","Chapitre II, Le cycle de scrutation. Fondements théoriques. Comment l'API exécute-t-il son programme? Un API ne traite pas les entrées et les sorties en continu. Il fonctionne par cycles successifs appelés cycles de scrutation. Chaque cycle comporte quatre étapes dans l'ordre: Lecture des entrées: l'API lit l'état réel de toutes les entrées et met à jour l'image des entrées en mémoire. Exécution du programme: l'API exécute le programme ligne par ligne, en utilisant l'image des entrées (et non les entrées physiques). Il met à jour l'image des sorties en mémoire. Écriture des sorties: l'API transfère l'image des sorties vers les modules physiques, qui actionnent les préactionneurs. Autotests et communication: vérification de la mémoire, dialogue avec le superviseur, gestion des alarmes. Puis le cycle recommence indéfiniment. La durée d'un cycle est le temps de scrutation ou temps de cycle, typiquement de 1 à 50 ms selon la taille du programme et la vitesse du processeur. Conséquences pratiques. Une impulsion plus courte que le temps de cycle peut ne pas être vue (rare en pratique). Le programme voit toujours des images cohérentes: une entrée ne change pas au milieu de l'exécution. Pour les processus rapides, on utilise des API rapides ou des modules spécialisés (comptage rapide, interruptions). Exemple corrigé. Un API a un temps de cycle de 10 ms. Un capteur de passage délivre une impulsion de 30 ms lors du passage d'une pièce. L'API verra-t-il le passage? Oui, car 30 ms supérieur à 10 ms: l'impulsion durera au moins 3 cycles. En revanche, une impulsion de 5 ms pourrait être manquée selon l'instant d'arrivée. Conclusion: vérifier que la durée des impulsions est supérieure au temps de cycle. Points clés. 4 étapes: lire les entrées, donc exécuter, donc écrire les sorties, donc autotests ou communication. Le programme utilise les images des E ou S, pas les grandeurs physiques. Temps de cycle typique: 1 à 50 ms. Impulsions plus courtes que le cycle: risque de non-détection."]],"7":[["fr","Chapitre II, Critères de choix d'un API. Fondements théoriques. Choisir un automate adapté. Le choix d'un API dépend de plusieurs critères: Critère. Question à se poser. Nombre d'E ou S. Combien de capteurs et préactionneurs? Prévoir une réserve de 20 à 30 pour cent pour évolutions. Type d'E ou S. TOR uniquement ou analogiques aussi? Tensions? Courants? Type de sorties. Relais, transistor ou triac selon les charges. Mémoire. Taille du programme et des données. Communication. Ethernet, Modbus, Profibus selon le réseau existant et la supervision. Logiciel. Disponibilité du logiciel de programmation, simplicité, coût de licence. Robustesse. Température, vibrations, indice de protection IP. Maintenance. Disponibilité locale, support du fournisseur, sauvegarde facile. Coût global. Achat plus formation plus maintenance plus évolution. En contexte R D C. Beaucoup d'écoles techniques congolaises utilisent d'anciens API Siemens S7-200 ou Allen-Bradley MicroLogix, ou se forment sur des simulateurs logiciels gratuits (TIA Portal, RSLogix, EcoStruxure). L'élève doit savoir s'adapter: les concepts (ladder, E ou S, cycle) sont les mêmes, seule la syntaxe change. Points clés. Compter les E ou S plus réserve 20-30 pour cent. Choisir le type de sorties selon les charges. Vérifier communication et logiciel. Coût global, pas seulement prix d'achat."]],"8":[["fr","Chapitre III, Les capteurs TOR. Fondements théoriques. Les capteurs Tout Ou Rien. Un capteur TOR (Tout Ou Rien) délivre un signal binaire: soit « 0 » (variable inactive), soit « 1 » (variable active). Il indique la présence ou l'absence d'un événement. Les principaux capteurs TOR industriels sont: Bouton-poussoir: commande manuelle de l'opérateur. Fin de course: détecte la position extrême d'un mobile (fin de course de sécurité, d'inversion, de référence). Détecteur de proximité inductif: détecte la présence d'un objet métallique sans contact, à quelques millimètres. Détecteur de proximité capacitif: détecte tout type d'objet (métal, plastique, liquide) sans contact. Capteur photoélectrique: détecte par interruption d'un faisceau lumineux. Fréquent sur les convoyeurs. Thermostat: contact qui s'ouvre ou se ferme selon la température. Pressostat: contact qui commute à une pression donnée. Application. Sur une chaîne d'ensachage: un capteur photoélectrique détecte le passage de chaque sac; un fin de course vérifie que le sac est bien positionné; un bouton-poussoir permet à l'opérateur de démarrer la séquence. Trois capteurs TOR, trois entrées sur l'API. Le choix d'un capteur TOR. Type de détection: métal, tout objet, distance, lumière. Portée: distance de détection. Type de sortie: PNP ou NPN (pour les capteurs 24 V DC). Indice de protection IP: étanchéité (I P65, I P67 selon l'ambiance). Température d'utilisation. Points clés. Capteur TOR égale signal binaire 0 sur 1. Inductif: métal; capacitif: tout objet. Photoélectrique: interruption de faisceau. Fin de course: position mécanique."]],"9":[["fr","Chapitre III, Les capteurs analogiques. Fondements théoriques. Mesurer une grandeur continue. Les capteurs analogiques délivrent un signal proportionnel à une grandeur physique (pression, température, niveau, débit, position, poids). Ils sont indispensables pour surveiller des grandeurs continues. Les signaux normalisés sont: 4-20 mA: le standard industriel le plus répandu (immunité au bruit, détection de rupture: 0 mA égale défaut). 0-10 V: plus simple, mais plus sensible aux perturbations sur de longues distances. 0-5 V, ±10 V, 0-20 mA: plus rares. L'API lit ces signaux sur des modules d'entrées analogiques, qui convertissent la valeur électrique en valeur numérique (par exemple 0-27648 pour un module Siemens 16 bits). Le programme peut alors comparer, afficher, réguler. Exemple corrigé. Donnée: un capteur de pression délivre 4-20 mA pour une plage de 0 à 10 bars. La mesure actuelle est de 12 mA. Calcul: proportion: (12 moins 4) ou (20 moins 4) égale 8 sur 16 égale 0,5; pression égale 0,5 multiplié par 10 égale 5 bars. Interprétation: le courant de 12 mA correspond au milieu de la plage, soit 5 bars. Le programme peut alors comparer à un seuil (par exemple 8 bars égale alarme). Précautions de câblage. Respecter la polarité (boucle 4-20 mA: alimentation plus capteur plus module en série). Utiliser du câble blindé pour les signaux analogiques (loin des câbles de puissance). Vérifier la configuration du module (type de signal: 4-20 mA ou 0-10 V) dans le logiciel. Points clés. Signal analogique égale proportionnel à la grandeur physique. Standards: 4-20 mA et 0-10 V. 4-20 mA: détection de rupture à 0 mA. Câble blindé, polarité respectée."]],"10":[["fr","Chapitre III, Préactionneurs et actionneurs. Fondements théoriques. Agir sur la matière d'œuvre. Pour transformer l'ordre de l'API en action physique, il faut deux étages: Le préactionneur: il reçoit un signal faible de la part de l'API (24 V) et commute l'énergie vers l'actionneur. C'est un « relais de puissance »: Préactionneur. Actionneur commandé. Contacteur. Moteur électrique. Distributeur pneumatique. Vérin pneumatique. Distributeur hydraulique. Vérin hydraulique. Variateur de vitesse. Moteur à vitesse variable. Relais statique. Résistance chauffante. L'actionneur: il produit l'effet physique. C'est le moteur, le vérin, l'électrovanne, la résistance chauffante, le convoyeur. Les sorties de l'API. Les sorties de l'API alimentent les bobines des préactionneurs. Trois technologies existent: Sorties à relais: universelles (AC ou DC), mais usure mécanique et vitesse limitée. Adaptées aux charges lentes. Sorties à transistor: uniquement DC, très rapides, pas d'usure. Adaptées au PNP ou NPN, aux impulsions rapides (commande de variateurs). Sorties à triac: uniquement AC, rapides, sans usure mécanique. Application. Dans une chaîne de conditionnement: l'API commande un contacteur (préactionneur) qui alimente le moteur du convoyeur (actionneur). Un distributeur pneumatique (préactionneur) commande un vérin (actionneur) qui pousse les cartons. Un relais statique (préactionneur) alimente une résistance chauffante (actionneur) pour le thermoscellage. Points clés. Préactionneur égale interface énergie faible, donc énergie forte. Actionneur égale effet physique final. Sorties relais ou transistor ou triac selon les charges."]],"11":[["fr","Chapitre IV, Le langage ladder: contacts et bobines. Fondements théoriques. Le langage à contacts (ladder). Le ladder (échelle en anglais) est le langage de programmation le plus utilisé pour les API. Il est né de la transposition des schémas électriques de logique câblée: les barres d'alimentation sont représentées à gauche (phase) et à droite (neutre), et le programme est dessiné comme une échelle dont chaque barreau (rung) contient une combinaison de contacts et de bobines. Les contacts. Contact NO (normalement ouvert): il est fermé (passant) quand la variable associée est à 1. Contact NC (normalement fermé): il est fermé (passant) quand la variable associée est à 0. Les bobines. Bobine directe ( ): la sortie prend la valeur de la ligne (1 si la ligne est passante, 0 sinon). Bobine inversée (/): la sortie prend la valeur inverse de la ligne. Bobine Set (S) ou Reset (R): active ou désactive une variable de façon mémorisée. Adressage des variables. Type. Préfixe Siemens. Préfixe Allen-Bradley. Entrée. I (I0.0). I (I:1 sur 0). Sortie. Q (Q0.0). O (O:2 sur 0). Mémoire interne. M (M0.0). B3 (B3:0 sur 0). Temporisateur. T (T1). T4 (T4:0). Compteur. C (C1). C5 (C5:0). Les principes sont identiques: seuls les préfixes et la syntaxe changent d'un constructeur à l'autre. Points clés. Ladder égale transposition graphique de la logique câblée. Contact NO: passant si variable égale 1. Contact NC: passant si variable égale 0. Bobine directe, inversée, Set ou Reset."]],"12":[["fr","Chapitre IV, L'auto-maintien en ladder. Fondements théoriques. Le circuit de base: démarrer et maintenir. Le premier programme que tout automaticien écrit est l'auto-maintien d'un moteur. Le principe: un appui bref sur le bouton marche doit démarrer le moteur, et le moteur doit continuer à tourner après relâchement du bouton, jusqu'à l'appui sur le bouton arrêt. Équation logique: Q0.0 égale (I0.0 plus Q0.0) multiplié par I0.1 multiplié par I0.2. I0.0 égale bouton marche (NO). Q0.0 égale sortie moteur (contact auxiliaire d'auto-maintien en parallèle sur I0.0). I0.1 égale bouton arrêt (câblé NC, donc contact fermé au repos). I0.2 égale contact du relais thermique (câblé NC). Le langage ladder: auto-maintien d'un moteur. Fonctionnement. Appui sur I0.0: la ligne est passante, Q0.0 secondes'active, le moteur démarre. Le contact auxiliaire Q0.0 se ferme: même après relâchement de I0.0, la ligne reste passante par Q0.0 (auto-maintien). Appui sur I0.1 (arrêt): le contact NC s'ouvre, la ligne se coupe, Q0.0 retombe, le moteur s'arrête. Si I0.2 (relais thermique) déclenche, même effet: arrêt automatique pour protéger le moteur. Erreur fréquente. Un élève oublie le contact d'auto-maintien. Résultat: le moteur ne tourne que pendant l'appui sur le bouton. Dès qu'il relâche, le moteur s'arrête. Règle absolue: dans un circuit de marche ou arrêt, l'auto-maintien est indispensable. Points clés. Auto-maintien égale contact de la sortie en parallèle sur le bouton marche. Arrêt et relais thermique en série, en NC. Une seule ligne de ladder suffit pour ce programme."]],"13":[["fr","Chapitre IV, Les fonctions logiques en ladder (ET, OU, NON). Fondements théoriques. Trois opérateurs à maîtriser. En ladder, les fonctions logiques se traduisent par la disposition des contacts: ET (AND): contacts en série. La sortie est active si tous les contacts sont passants. Exemple: Q0.0 égale I0.0 multiplié par I0.1 (deux conditions à réunir). OU (OR): contacts en parallèle. La sortie est active si au moins un contact est passant. Exemple: Q0.0 égale I0.0 plus I0.1. NON (NOT): contact NC au lieu de NO. La sortie est active si la variable est à 0. Exemple: Q0.0 égale I0.0. On peut combiner ces opérateurs: (I0.0 OU I0.1) ET NON I0.2 ET NON I0.3, etc. Exemple corrigé. Énoncé: un voyant Q0.0 doit s'allumer si le moteur Q0.1 tourne ET si le niveau est bas (I0.3), mais uniquement si le mode automatique est actif (I0.4) et si l'arrêt d'urgence n'est pas pressé (I0.5). Équation: Q0.0 égale Q0.1 multiplié par I0.3 multiplié par I0.4 multiplié par I0.5. Traduction ladder: tous ces contacts en série, avec I0.5 en NC. Une seule ligne de ladder. Comparaison avec l'algèbre de Boole. Logique. Schéma ladder. Écriture booléenne. ET. Contacts en série. Q égale I1 multiplié par I2. OU. Contacts en parallèle. Q égale I1 plus I2. NON. Contact NC. Q égale I1. Points clés. ET égale série; OU égale parallèle; NON égale contact NC. Combinaisons: série ou parallèle imbriqués. Écrire d'abord l'équation logique, puis la traduire en ladder."]],"14":[["fr","Chapitre V, Les temporisateurs (TON, TOF, TONR). Fondements théoriques. Retarder, allonger, cumuler. Les temporisateurs permettent de retarder l'action d'une sortie. Trois types principaux: TON (Timer On Delay): à la montée de l'entrée, le temporisateur commence à compter; quand le temps de consigne est atteint, sa sortie (bit de sortie du timer) s'active. Si l'entrée retombe, le timer se réinitialise immédiatement. Sert à retarder l'activation d'une sortie. TOF (Timer Off Delay): à la montée de l'entrée, la sortie du timer s'active immédiatement; à la retombée de l'entrée, le timer commence à compter et la sortie reste active pendant le temps réglé, puis retombe. Sert à prolonger une action après disparition du signal. TONR (Timer Retentive On Delay): cumule les durées d'activation, avec une remise à zéro explicite (par un bit de reset). Sert à totaliser un temps de fonctionnement. Paramètres. IN: entrée d'activation du timer. PT (Preset Time): consigne de temps (par exemple T#5 secondes ou 5000 ms). ET (Elapsed Time): temps écoulé. Q: sortie du timer (bit actif quand ET supérieur ou égal à PT pour TON). Application industrielle. Sur un convoyeur d'alimentation d'un broyeur: Au démarrage, le convoyeur doit attendre 3 secondes que le broyeur ait atteint sa vitesse nominale. On utilise un TON de 3 secondes qui retarde la sortie « convoyeur ». À l'arrêt, le convoyeur doit continuer 10 secondes pour évacuer les derniers matériaux. On utilise un TOF de 10 secondes sur la sortie « convoyeur ». Un compteur horaire de maintenance utilise un TONR pour totaliser les heures de fonctionnement. Erreur fréquente. Ne pas réinitialiser un TONR en début de cycle utile: le temps cumulé continue indéfiniment. Prévoir une remise à zéro explicite (bouton « RAZ compteur horaire ») et une sauvegarde périodique. Points clés. TON: retard à la montée, RAZ automatique. TOF: prolongation après retombée de l'entrée. TONR: cumul réinitialisable. Paramètres: IN, PT, ET, Q."]],"15":[["fr","Chapitre V, Les compteurs (CTU, CTD). Fondements théoriques. Compter des impulsions. Les compteurs permettent de compter des événements (pièces sur un convoyeur, appuis sur un bouton, tours de moteur). Trois types principaux: CTU (Count Up): compte à chaque front montant de l'entrée de comptage. Quand la valeur courante atteint la consigne (PV égale preset), le bit de sortie s'active. Une entrée de reset (R) remet le compteur à zéro. CTD (Count Down): compte à la descente (décompte) à partir d'une valeur initiale chargée. CTUD (Count Up ou Down): compte et décompte selon deux entrées distinctes. Paramètres. CU ou CD: entrée de comptage (up ou down). R: entrée de reset. PV: valeur de consigne (preset). CV: valeur courante (current value). Q: bit de sortie (actif quand CV supérieur ou égal à PV pour CTU). Application industrielle. Sur une chaîne d'ensachage: un capteur photoélectrique détecte chaque sac. Le compteur CTU est configuré avec PV égale 12. À chaque sac détecté, CV augmente. Quand CV égale 12, le bit de sortie Q active une alarme « lot complet » et le programme déclenche l'arrêt de la chaîne pour changer le lot. Un bouton « reset » remet le compteur à zéro pour le lot suivant. Erreur fréquente. Oublier de réinitialiser le compteur en début de cycle: au deuxième lot, le compteur est déjà à 12, l'alarme se déclenche immédiatement. Prévoir systématiquement une condition de reset (bouton, changement de recette, démarrage de cycle). Points clés. CTU: compte à la montée. CTD: décompte. CTUD: compte ou décompte. Paramètres: CU ou CD, R, PV, CV, Q. Reset obligatoire pour réutiliser le compteur."]],"16":[["fr","Chapitre VI, Le Grafcet: représenter une séquence. Fondements théoriques. Un outil de représentation séquentielle. Le Grafcet (Graphe fonctionnel de commande étape ou transition) est un outil graphique normalisé pour décrire le comportement d'un automatisme séquentiel. Il permet de penser la séquence avant de programmer l'API. Ses éléments: Étapes: cases rectangulaires numérotées (1, 2, 3…). L'étape initiale est un double rectangle. Une étape est active ou inactive. Transitions: barres horizontales entre deux étapes. Chaque transition porte une condition (réceptivité) qui, lorsqu'elle est vraie, permet de passer de l'étape amont à l'étape aval. Actions: associées à chaque étape, inscrites à droite. Elles indiquent ce qui doit être fait lorsque l'étape est active. Règles d'évolution. À l'initialisation, l'étape initiale est active. Une transition est franchie si elle est vraie ET si l'étape amont est active. Le franchissement désactive l'étape amont et active l'étape aval. Une seule étape est active à la fois dans une séquence linéaire (sauf parallélisme explicite). Le Grafcet: représenter une séquence. Exemple: remplissage d'un réservoir. Étape 1 (initiale): en attente. Action: —. Transition: bouton « départ » (I0.0). Étape 2: ouverture vanne. Action: vanne égale 1. Transition: niveau bas atteint (I0.1). Étape 3: remplissage. Action: pompe égale 1. Transition: niveau haut atteint (I0.2). Étape 4: fermeture vanne, arrêt pompe. Action: vanne égale 0, pompe égale 0. Transition: fin temporisation (T#2 secondes). Retour à l'étape 1 (boucle). Points clés. Grafcet égale représentation graphique étape ou transition. Une transition franchie désactive l'étape amont et active l'étape aval. Actions associées aux étapes. Outil de conception avant la programmation."]],"17":[["fr","Chapitre VI, Traduction du Grafcet en ladder. Fondements théoriques. Du graphe au programme. Un Grafcet se traduit en ladder selon une méthode systématique: Une mémoire par étape: à chaque étape Xi correspond une mémoire Mi. L'étape initiale est activée par le programme d'initialisation. Activation d'une étape: Mi égale (Mi moins 1 ET condition de transition) OU (Mi ET NON condition de sortie). En pratique, on utilise souvent un Set ou Reset: Set Mi si Mi moins 1 et transition vraie, Reset Mi si Mi plus 1 devient active. Actions: les sorties physiques sont conditionnées par les mémoires d'étape. Exemple: vanne égale M2 OU M3; pompe égale M3. Sécurité: ajouter des conditions de sécurité (arrêt d'urgence, défauts) sur les sorties, indépendamment des étapes. Exemple simplifié. Traduction du Grafcet de remplissage: Initialisation: Set M1. Transition 1, donc 2: M1 ET I0.0, donc Set M2, Reset M1. Transition 2, donc 3: M2 ET I0.1, donc Set M3, Reset M2. Transition 3, donc 4: M3 ET I0.2, donc Set M4, Reset M3. Transition 4, donc 1: M4 ET T1.Q, donc Set M1, Reset M4. Action vanne: Q0.0 égale M2 OU M4. Action pompe: Q0.1 égale M3. Erreur fréquente. Oublier le Reset de l'étape amont lors du franchissement d'une transition: plusieurs étapes restent actives simultanément, le programme devient incohérent. Chaque transition doit activer l'étape aval et désactiver l'étape amont. Points clés. Une mémoire par étape. Set de l'étape aval plus Reset de l'étape amont à chaque transition. Actions conditionnées par les mémoires d'étape. Ajouter les sécurités indépendamment."]],"18":[["fr","Chapitre VII, Câblage des E ou S et adressage. Fondements théoriques. Du capteur à l'entrée, de la sortie au préactionneur. Le câblage d'un API suit des règles strictes: Chaque capteur est relié à une entrée (I ou X). L'adressage dépend du constructeur: I0.0, I0.1, etc. (Siemens) ou I:1 sur 0, I:1 sur 1 (Allen-Bradley). Chaque préactionneur est relié à une sortie (Q ou Y). Adressage: Q0.0, Q0.1…. Respecter la polarité et le type: 24 V DC, 230 V AC, PNP ou NPN pour les capteurs, transistor ou relais pour les sorties. Séparer les câbles: les câbles de puissance (vers les moteurs) sont séparés des câbles de commande et des câbles analogiques, pour éviter les perturbations. Blinder les signaux analogiques: câble blindé relié à la terre d'un seul côté (généralement côté API). Utiliser des bornes numérotées: faciliter la lecture des schémas et le dépannage. Exemple de câblage. Sur une ligne d'ensachage: Entrée I0.0: bouton marche. Entrée I0.1: bouton arrêt. Entrée I0.2: capteur de présence sac (photoélectrique). Entrée I0.3: fin de course position haute. Sortie Q0.0: contacteur convoyeur. Sortie Q0.1: distributeur vérin. Sortie Q0.2: voyant « en service ». La mise en service. Vérifier le câblage à l'ohmmètre hors tension. Télécharger le programme dans l'API. Passer en mode RUN. Vérifier les E ou S avec le logiciel (forçage ou observation). Tester chaque séquence, pas à pas, en mode manuel puis automatique. Sauvegarder le programme validé. Points clés. Une entrée par capteur, une sortie par préactionneur. Respecter polarité et type. Séparer puissance et commande. Tester chaque E ou S avant la mise en service. Sauvegarder le programme validé."]],"19":[["fr","Chapitre VII, La sécurité des machines automatisées. Fondements théoriques. Sécurité positive: le principe à respecter. La sécurité positive impose que tout défaut (coupure de fil, perte d'alimentation, capteur en panne) entraîne la mise en sécurité de la machine, c'est-à-dire son arrêt. Pour cela: Les arrêts d'urgence et les protections (capots, barrières) sont câblés avec des contacts NC (normalement fermés). Une coupure de fil ou une perte d'alimentation ouvre le circuit: la machine s'arrête. Si l'on utilisait des contacts NO, une coupure passerait inaperçue et la machine resterait en marche: danger mortel. Dispositifs de sécurité. Arrêt d'urgence (AU): bouton à champignon avec verrouillage mécanique. Il doit être câblé en série sur le circuit de commande et couper l'énergie des actionneurs (catégorie d'arrêt 0 ou 1 selon la norme). Capots et portes: interverrouillés; l'ouverture coupe la commande. Barrières immatérielles (rideaux lumineux): arrêtent la machine si une personne franchit la zone dangereuse. Relais de sécurité: modules redondants certifiés pour les fonctions de sécurité critiques (normes ISO 13849, IEC 62061). Asservissements: la machine ne peut démarrer que si le capot est fermé, la pièce bien en place, etc. Cas concret. Une presse hydraulique est équipée d'un capot interverrouillé. Si le capot s'ouvre pendant le cycle, la machine s'arrête immédiatement. Sans cette sécurité, un opérateur pourrait avoir la main écrasée. La sécurité positive impose que l'ouverture du capot ouvre un contact NC et coupe le circuit de commande: c'est un défaut qui entraîne la mise en sécurité. Points clés. Sécurité positive: contact NC pour les sécurités. Arrêt d'urgence en série, obligatoire. Capots interverrouillés, barrières immatérielles. Relais de sécurité certifiés pour les fonctions critiques."]],"20":[["fr","Chapitre VIII, Diagnostic et maintenance. Fondements théoriques. Dépanner un système automatisé. Le dépannage d'un système automatisé suit la même rigueur que pour l'électricité industrielle: Observer les symptômes: que fait la machine? Quels voyants sont allumés? Y a-t-il un message d'alarme? L'API est-il en RUN ou en STOP? Identifier l'élément défaillant: capteur, actionneur, programme, câblage, alimentation, communication. Tester: multimètre pour la continuité et les tensions, forçage des E ou S depuis le logiciel, observation de la supervision. Réparer: remplacer le capteur, resserrer une borne, corriger le programme, reconfigurer un module. Vérifier: relancer la séquence, contrôler le comportement sur plusieurs cycles, sauvegarder. Les pannes courantes. Symptôme. Causes probables. La machine ne démarre pas. Capteur défaillant, bouton bloqué, arrêt d'urgence enfoncé, programme en STOP, sortie grillée. Une action ne se fait pas. Sortie API HS, préactionneur HS, câblage coupé, condition logique non remplie. Comportement erratique. Capteur instable, perturbation électromagnétique, programme mal conçu, temporisation trop courte. Communication perdue. Câble débranché, adresse IP incorrecte, module HS. La maintenance préventive. Sauvegarder régulièrement le programme (sur PC, sur clé USB, sur serveur). Nettoyer l'armoire (poussière égale échauffement). Vérifier le serrage des connexions (une fois par an). Contrôler le fonctionnement des capteurs et actionneurs. Mettre à jour la documentation (schémas, programme, notes d'intervention). Erreur fréquente. Modifier le programme directement sur l'API en production, sans sauvegarde préalable. En cas d'erreur, il n'y a plus de version de référence. Règle: toute modification doit être précédée d'une sauvegarde et suivie d'une nouvelle sauvegarde validée. Points clés. Méthode: observer, identifier, tester, réparer, vérifier. Forçage d'E ou S et supervision: outils puissants. Sauvegarde régulière du programme. Maintenance préventive: nettoyage, serrage, contrôle."]],"21":[["fr","Ancrage R D C, Automatisation industrielle congolaise. Contextualisation. Les API dans l'industrie congolaise. Mines du Lualaba (Kamoa-Kakula, Tenke Fungurume): concasseurs, convoyeurs, pompes, treuils, tous pilotés par API pour la fiabilité et la traçabilité. Agroalimentaire à Kinshasa: brasseries (Bralima, Brasimba), minoteries (Marsavco, Utexafrica), lignes de conditionnement. REGIDESO: stations de pompage automatisées, avec supervision à distance. Cimenteries du Kongo-Central (CINAT, Lukala): fours, broyeurs, ensachage. Hydroélectricité: Inga, centrales hydroélectriques, automatismes de surveillance et de protection. Défis et atouts. Défis: Manque de techniciens qualifiés en automatismes. Matériel parfois ancien dans les ateliers scolaires (S7-200, MicroLogix). Approvisionnement en pièces détachées parfois long. Réseaux électriques instables (parafoudre, onduleur indispensables). Atouts: Forte demande dans les mines et l'agroalimentaire. Formations disponibles (ITI, ITP, ISTM). Simulateurs gratuits pour l'apprentissage. Débouchés. Électricien automaticien. Technicien de maintenance industrielle. Programmateur d'API (junior). Technicien en instrumentation. Poursuite d'études en génie électrique, automatique, instrumentation."]],"22":[["fr","Synthèse générale du cours. Ce qu'il faut retenir. Les huit idées maîtresses. API égale calculateur industriel programmable qui remplace la logique câblée. Architecture système: PO (agit), PC (décide), interface (capteurs ou préactionneurs), dialogue (pupitre). Cycle de scrutation: lire entrées, donc exécuter, donc écrire sorties, donc autotests. Capteurs TOR (binaire) ou analogiques (4-20 mA, 0-10 V). Ladder: contacts (NO ou NC) plus bobines, ET égale série, OU égale parallèle. Auto-maintien: contact de la sortie en parallèle sur le bouton marche. Temporisateurs (TON, TOF, TONR) et compteurs (CTU, CTD) pour gérer le temps et les événements. Grafcet pour concevoir, ladder pour programmer, sécurité positive pour protéger. Les erreurs à ne plus commettre. Oublier l'auto-maintien, donc le moteur ne tourne que pendant l'appui sur le bouton. Utiliser des contacts NO pour les arrêts d'urgence, donc danger mortel. Ne pas réinitialiser un compteur ou un timer cumulatif, donc comportement erratique. Modifier un programme sans sauvegarde, donc perte de la référence. Confondre PO et PC, donc mauvaise compréhension du système. Sauter le Reset de l'étape amont en Grafcet, donc plusieurs étapes actives. Tableau récapitulatif des fonctions ladder de base. Fonction. Symbole. Rôle. Contact NO. —| |—. Passant si variable égale 1. Contact NC. —|/|—. Passant si variable égale 0. Bobine directe. —( )—. Copie l'état de la ligne. Bobine Set. —(S)—. Mémorise à 1. Bobine Reset. —(R)—. Mémorise à 0. TON. [TON]. Retard à la montée. TOF. [TOF]. Retard à la descente. CTU. [CTU]. Compteur à la montée."]],"23":[["fr","Évaluation finale, Automates Programmables. Consigne. Répondez aux 22 questions ci-dessous. Chaque question a une seule bonne réponse. Cliquez sur « Valider mes réponses » pour obtenir votre score. Bonne chance! Conseil. En cas d'erreur, relisez la diapositive correspondante. Les questions balaient l'ensemble des chapitres: architecture, API, capteurs, ladder, temporisation, Grafcet, sécurité et diagnostic."]]}};

    // ====================================================================
    //  Stockage hors ligne : 2 moteurs, même interface
    //    - APK : fichiers du dossier de l'application (CoursInterface), servis par https://app.local/cours/
    //    - Web : Cache Storage du navigateur (même cache que l'application web)
    // ====================================================================
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {                                   // fichier complet ? (taille exacte connue à la génération)
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () {
          var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok);
        },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) {
          try { CoursInterface.delete(nameN(n)); } catch (e) {}
          writeOk(readOk().filter(function (x) { return x !== n; }));
          return Promise.resolve();
        }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }   // ancien contenu invalide
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) {
          return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); })
            .then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; });
        },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);

    // ====================================================================
    //  Bannière : invitation, confirmations, progression
    // ====================================================================
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer);
      bnMode = mode;
      txtEl.textContent = text;
      actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; }
      else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }

    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }

    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial"
        ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet."
        : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
