<li>Évaluation finale — Items EXETAT</li>

`
},
{
    title: "Leçon 1 — La cellule : ultrastructure et fonctions",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Au laboratoire de l'Institut supérieur de Kisangani, un étudiant observe une feuille d'Elaeis au microscope. Il découvre des compartiments minuscules : noyau, chloroplastes, vacuoles. Tous les êtres vivants sont faits de cellules, mais leurs cellules ne se ressemblent pas. Comment s'organisent-elles ?</p></div>
<h3>1. La théorie cellulaire</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><img alt="Ultrastructure d'une cellule animale" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Bio6_1"><ul><li><strong>Cellule</strong> : plus petite unité vivante capable de se reproduire.</li><li><strong>Théorie cellulaire</strong> (Schleiden, Schwann, Virchow, XIXe s.) : tout être vivant est fait de cellules ; la cellule est l'unité de structure et de fonction ; toute cellule vient d'une autre cellule (<em>Omnis cellula e cellula</em>).</li><li><strong>Procaryote</strong> : sans noyau (bactéries) ; <strong>eucaryote</strong> : avec noyau (animal, végétal, champignon, protiste).</li></ul></div>
<h3>2. Ultrastructure de la cellule eucaryote</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Membrane plasmique</strong> : bicouche lipidique + protéines ; contrôle les échanges.</li><li><strong>Cytoplasme</strong> : hyaloplasme + organites.</li><li><strong>Noyau</strong> : enveloppe nucléaire, nucléoplasme, nucléole, chromatine (ADN).</li><li><strong>Mitochondries</strong> : respiration cellulaire, production d'ATP.</li><li><strong>Chloroplastes</strong> (végétaux) : photosynthèse, contiennent la chlorophylle.</li><li><strong>Ribosomes</strong> : synthèse des protéines.</li><li><strong>Réticulum endoplasmique</strong> (lisse et rugueux), <strong>appareil de Golgi</strong>, <strong>lysosomes</strong>, <strong>vacuoles</strong>, <strong>cytosquelette</strong>.</li><li><strong>Paroi cellulosique</strong> chez les végétaux uniquement.</li></ul></div>
<h3>3. Différences animal/végétal et applications</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Cellule animale</strong> : pas de paroi, pas de chloroplastes, petites vacuoles, centrosome.</li><li><strong>Cellule végétale</strong> : paroi cellulosique, chloroplastes, grande vacuole centrale, pas de centrosome.</li><li><strong>Applications en RDC</strong> : au laboratoire de Lubumbashi, on cultive des cellules pour tester des médicaments ; à Kinshasa, l'analyse cellulaire du sang détecte le paludisme.</li><li><strong>Cellules souches</strong> : espoir thérapeutique (recherche à l'UNIKIN).</li></ul><p><a href="https://www.youtube.com/results?search_query=cellule+ultrastructure+organites+biologie+terminale" target="_blank" rel="noopener">🎥 Recherche : la cellule et ses organites (chaînes de cours de biologie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La cellule est l'unité de base du vivant. Elle possède un noyau, un cytoplasme et de nombreux organites spécialisés. Cellule animale et cellule végétale diffèrent par la paroi, les chloroplastes et les vacuoles.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif de Biologie, 4e année des Humanités scientifiques (MEPST/DIPROMAD, 2021), matrice BIO6.1.<br><strong>Sigles :</strong> MEPST : Ministère de l'Enseignement primaire, secondaire et technique ; DIPROMAD : Direction des programmes scolaires et matériel didactique ; EXETAT : Examen d'État ; HSC : Humanités scientifiques.</div>
    `
},
{
    title: "Leçon 2 — Échanges membranaires et transport cellulaire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À l'hôpital de Goma, on perfuse un patient déshydraté avec du sérum physiologique. Pourquoi l'eau entre-t-elle dans les cellules sans que le sel ne les fasse éclater ? La réponse est dans les échanges membranaires.</p></div>
<h3>1. Structure de la membrane plasmique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><img alt="Structure de la membrane plasmique" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Bio6_2"><ul><li><strong>Modèle de la mosaïque fluide</strong> (Singer et Nicolson, 1972).</li><li><strong>Bicouche lipidique</strong> : phospholipides avec têtes hydrophiles et queues hydrophobes.</li><li><strong>Protéines</strong> : intégrées ou périphériques (transport, récepteurs, enzymes).</li><li><strong>Cholestérol</strong> : rigidité et fluidité.</li><li><strong>Glycocalyx</strong> : reconnaissance cellulaire.</li><li>La membrane est <strong>sélectivement perméable</strong>.</li></ul></div>
<h3>2. Transport à travers la membrane</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Transport passif</strong> (sans énergie) : <strong>diffusion simple</strong> (O<sub>2</sub>, CO<sub>2</sub>), <strong>diffusion facilitée</strong> (glucose via protéines), <strong>osmose</strong> (eau).</li><li><strong>Transport actif</strong> (avec ATP) : <strong>pompe Na<sup>+</sup>/K<sup>+</sup></strong>, endocytose, exocytose.</li><li><strong>Osmose</strong> : passage de l'eau du milieu hypotonique vers le milieu hypertonique.</li><li><strong>Hémolyse</strong> : éclatement des globules rouges en milieu hypotonique.</li><li><strong>Plasmolyse</strong> : décollement de la membrane végétale en milieu hypertonique.</li></ul></div>
<h3>3. Applications en RDC</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Sérum physiologique à 0,9 %</strong> : isotonique au plasma, utilisé à l'hôpital de Kinshasa.</li><li><strong>Conservation des aliments</strong> : le sel et le sucre créent un milieu hypertonique qui déshydrate les microbes.</li><li><strong>Dialyse rénale</strong> : à l'hôpital de Lubumbashi, elle utilise l'osmose et la diffusion pour filtrer le sang.</li><li><strong>Absorption intestinale</strong> : les villosités de l'intestin absorbent l'eau et les nutriments.</li><li><strong>Absorption racinaire</strong> : les poils absorbants des plantes de Kwilu puisent l'eau du sol.</li></ul><p><a href="https://www.youtube.com/results?search_query=membrane+plasmique+transport+cellulaire+biologie+terminale" target="_blank" rel="noopener">🎥 Recherche : transport membranaire (chaînes de cours de biologie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La membrane plasmique est une mosaïque fluide sélectivement perméable. Les échanges se font par transport passif (diffusion, osmose) ou actif (pompe Na<sup>+</sup>/K<sup>+</sup>). L'osmose est essentielle en médecine et en agroalimentaire.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif de Biologie, 4e année des Humanités scientifiques (MEPST/DIPROMAD, 2021), matrice BIO6.2.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, HSC.</div>
    `

{
    title: "Leçon 3 — Métabolisme cellulaire : respiration et photosynthèse",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans les rizières de Mbandaka, les plants de riz captent la lumière du soleil et fabriquent leur matière. La nuit, ils respirent comme nous. Ces deux processus opposés — photosynthèse et respiration — font tourner la biosphère.</p></div>
<h3>1. La photosynthèse</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><img alt="Schéma de la photosynthèse" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Bio6_3"><ul><li><strong>Équation globale</strong> : 6CO<sub>2</sub> + 6H<sub>2</sub>O + lumière → C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + 6O<sub>2</sub>.</li><li>Se déroule dans les <strong>chloroplastes</strong> (thylakoïdes et stroma).</li><li><strong>Phase photochimique</strong> (lumière) : photolyse de l'eau, production d'ATP et de NADPH, libération d'O<sub>2</sub>.</li><li><strong>Phase chimique</strong> (cycle de Calvin) : fixation du CO<sub>2</sub>, synthèse du glucose.</li><li>Pigments : <strong>chlorophylle a et b</strong>, caroténoïdes.</li></ul></div>
<h3>2. La respiration cellulaire</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Équation globale</strong> : C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + 6O<sub>2</sub> → 6CO<sub>2</sub> + 6H<sub>2</sub>O + énergie (ATP).</li><li><strong>Glycolyse</strong> (cytoplasme) : glucose → 2 pyruvates + 2 ATP.</li><li><strong>Cycle de Krebs</strong> (matrice mitochondriale) : production de NADH, FADH<sub>2</sub>.</li><li><strong>Chaîne respiratoire</strong> (crête mitochondriale) : production massive d'ATP (≈ 36 ATP au total).</li><li><strong>Fermentation</strong> (sans O<sub>2</sub>) : alcoolique (levures) ou lactique (muscles).</li></ul></div>
<h3>3. Comparaison et applications</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Photosynthèse</strong> : anabolisme, consomme CO<sub>2</sub>, libère O<sub>2</sub>, stocke l'énergie.</li><li><strong>Respiration</strong> : catabolisme, consomme O<sub>2</sub>, libère CO<sub>2</sub>, libère l'énergie.</li><li><strong>Applications RDC</strong> : fermentation du manioc à Kinshasa, brassage de la bière à Lubumbashi, production de bioéthanol à Kwilu.</li><li><strong>Forets du bassin du Congo</strong> : poumon vert de la planète, elles absorbent le CO<sub>2</sub> et produisent de l'O<sub>2</sub>.</li></ul><p><a href="https://www.youtube.com/results?search_query=photosynthèse+respiration+cellulaire+biologie+terminale" target="_blank" rel="noopener">🎥 Recherche : photosynthèse et respiration (chaînes de cours de biologie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La photosynthèse (chloroplastes) fabrique du glucose à partir de CO<sub>2</sub>, d'eau et de lumière. La respiration (mitochondries) libère l'énergie du glucose en ATP. Ces deux processus complémentaires font fonctionner la biosphère.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif de Biologie, 4e année des Humanités scientifiques (MEPST/DIPROMAD, 2021), matrice BIO6.3.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, HSC.</div>
    `

{
    title: "Leçon 4 — La division cellulaire : mitose",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Après une blessure à Kisangani, ta peau se répare en quelques jours. Des millions de cellules se sont divisées pour combler la plaie. Ce mécanisme s'appelle la mitose. Comment se déroule-t-il ?</p></div>
<h3>1. Le cycle cellulaire</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><img alt="Les étapes de la mitose" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Bio6_4"><ul><li><strong>Interphase</strong> : phase de croissance et de réplication de l'ADN (G<sub>1</sub>, S, G<sub>2</sub>).</li><li><strong>Mitose</strong> : division du noyau en 4 phases.</li><li><strong>Cytodiagnèse</strong> : division du cytoplasme.</li><li>La mitose produit <strong>2 cellules filles identiques</strong> à la cellule mère (même nombre de chromosomes : 2n).</li></ul></div>
<h3>2. Les phases de la mitose</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Prophase</strong> : condensation des chromosomes, disparition de l'enveloppe nucléaire, formation du fuseau.</li><li><strong>Métaphase</strong> : alignement des chromosomes sur la plaque équatoriale.</li><li><strong>Anaphase</strong> : séparation des chromatides sœurs vers les pôles opposés.</li><li><strong>Télophase</strong> : reconstitution des noyaux, décondensation des chromosomes.</li><li>Chez l'Homme : 46 chromosomes (23 paires).</li></ul></div>
<h3>3. Rôles et applications</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Croissance</strong> : multiplication des cellules d'un organisme.</li><li><strong>Réparation</strong> : cicatrisation des plaies, renouvellement de l'épiderme, des globules rouges.</li><li><strong>Reproduction asexuée</strong> chez certains organismes (bouturage, marcottage).</li><li><strong>Cancer</strong> : mitose non contrôlée, prolifération anarchique des cellules.</li><li><strong>Applications en RDC</strong> : culture cellulaire à Kinshasa, recherche sur le cancer du col de l'utérus, chimio-thérapie à Lubumbashi.</li></ul><p><a href="https://www.youtube.com/results?search_query=mitose+division+cellulaire+biologie+terminale" target="_blank" rel="noopener">🎥 Recherche : la mitose (chaînes de cours de biologie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La mitose est une division conforme qui produit 2 cellules filles identiques (2n). Elle comporte 4 phases : prophase, métaphase, anaphase, télophase. Elle assure la croissance, la réparation et le renouvellement cellulaire.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif de Biologie, 4e année des Humanités scientifiques (MEPST/DIPROMAD, 2021), matrice BIO6.4.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, HSC.</div>

    title: "Leçon 5 — La méiose et la reproduction sexuée",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une famille de Kinshasa, cinq enfants se ressemblent mais sont tous différents. Pourquoi ? Parce que la méiose, qui fabrique les gamètes, produit des cellules génétiquement uniques. Chaque enfant est un mélange unique de ses parents.</p></div>
<h3>1. Définition et rôles de la méiose</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Méiose</strong> : division cellulaire qui produit 4 cellules <strong>haploïdes</strong> (n) à partir d'une cellule diploïde (2n).</li><li>Elle se déroule dans les <strong>organes reproducteurs</strong> (testicules, ovaires).</li><li><strong>Rôles</strong> : réduire le nombre de chromosomes (n), produire des gamètes, créer la diversité génétique.</li><li>Deux divisions successives : <strong>méiose I</strong> (réductionnelle) et <strong>méiose II</strong> (équationnelle).</li></ul></div>
<h3>2. Les étapes de la méiose</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Prophase I</strong> : appariement des chromosomes homologues, <strong>crossing-over</strong> (échange de segments).</li><li><strong>Métaphase I</strong> : alignement des paires de chromosomes homologues.</li><li><strong>Anaphase I</strong> : séparation des chromosomes homologues.</li><li><strong>Télophase I</strong> : formation de 2 cellules haploïdes.</li><li><strong>Méiose II</strong> : séparation des chromatides sœurs, formation de 4 cellules haploïdes.</li></ul></div>
<h3>3. Sources de diversité et applications</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Crossing-over</strong> : échange de segments entre chromosomes homologues.</li><li><strong>Répartition indépendante</strong> des chromosomes homologues.</li><li><strong>Fécondation</strong> : rencontre aléatoire des gamètes.</li><li>Chez l'Homme : 2<sup>23</sup> combinaisons possibles par gamète.</li><li><strong>Applications</strong> : sélection des plantes à Kisangani, amélioration des races bovines à Mbandaka, diagnostic des anomalies chromosomiques à Kinshasa.</li></ul><p><a href="https://www.youtube.com/results?search_query=méiose+reproduction+sexuée+biologie+terminale" target="_blank" rel="noopener">🎥 Recherche : la méiose (chaînes de cours de biologie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La méiose produit 4 cellules haploïdes (n) à partir d'une cellule diploïde (2n). Elle comporte deux divisions et crée la diversité génétique par crossing-over et répartition indépendante. Elle est à la base de la reproduction sexuée.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif de Biologie, 4e année des Humanités scientifiques (MEPST/DIPROMAD, 2021), matrice BIO6.5.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, HSC.</div>
    `

    title: "Leçon 6 — La génétique mendélienne",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Au jardin de Kwilu, un agronome croise deux plants de pois : l'un à fleurs rouges, l'autre à fleurs blanches. À sa grande surprise, tous les plants de la première génération ont des fleurs rouges. Les travaux de Mendel expliquent ce résultat.</p></div>
<h3>1. Mendel et ses expériences</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><img alt="Échiquier de croisement (Punnett)" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Bio6_5"><ul><li><strong>Gregor Mendel</strong> (1822-1884), moine autrichien, père de la génétique.</li><li>Expériences sur le pois cultivé (<em>Pisum sativum</em>) : 7 caractères étudiés.</li><li>Méthode rigoureuse : lignées pures, croisements contrôlés, comptage statistique.</li><li><strong>Caractère</strong> : trait observable (couleur, taille). <strong>Allèle</strong> : version d'un gène.</li></ul></div>
<h3>2. Les lois de Mendel</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>1<sup>re</sup> loi</strong> (uniformité des hybrides F<sub>1</sub>) : le croisement de deux lignées pures donne une F<sub>1</sub> uniforme. L'allèle dominant masque l'allèle récessif.</li><li><strong>2<sup>e</sup> loi</strong> (ségrégation) : en F<sub>2</sub>, les caractères réapparaissent dans un rapport 3:1 (phénotypes) ou 1:2:1 (génotypes).</li><li><strong>3<sup>e</sup> loi</strong> (indépendance des caractères) : les caractères se transmettent indépendamment (si gènes sur chromosomes différents).</li><li><strong>Échiquier de Punnett</strong> : tableau pour prévoir les génotypes et phénotypes des descendants.</li></ul></div>
<h3>3. Applications</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Amélioration des plantes</strong> : sélection du maïs, du manioc et du riz à Mbandaka et Kisangani.</li><li><strong>Élevage</strong> : sélection des bovins et volailles à Kinshasa.</li><li><strong>Conseil génétique</strong> : prévision du risque de maladies héréditaires (drépanocytose à Lubumbashi).</li><li><strong>Groupes sanguins</strong> : transmission selon les lois de Mendel.</li></ul><p><a href="https://www.youtube.com/results?search_query=génétique+mendélienne+lois+Mendel+biologie+terminale" target="_blank" rel="noopener">🎥 Recherche : génétique mendélienne (chaînes de cours de biologie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Mendel a établi les lois de l'hérédité : uniformité F<sub>1</sub>, ségrégation 3:1 en F<sub>2</sub>, indépendance des caractères. Dominance, récessivité et échiquier de Punnett permettent de prévoir les croisements.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif de Biologie, 4e année des Humanités scientifiques (MEPST/DIPROMAD, 2021), matrice BIO6.6.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, HSC.</div>
    `
},
{
    title: "Leçon 7 — Bases chromosomiques de l'hérédité",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une maternité de Lubumbashi, un bébé naît avec des traits de sa mère et de son père. Comment les informations héréditaires sont-elles transmises ? Le support est le chromosome, qui porte les gènes.</p></div>
<h3>1. Les chromosomes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><img alt="Caryotype humain" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Bio6_6"><ul><li><strong>Chromosome</strong> : structure d'ADN et de protéines (histones), visible en mitose.</li><li><strong>Chromatide</strong> : moitié du chromosome après réplication ; reliée par un <strong>centromère</strong>.</li><li><strong>Gène</strong> : segment d'ADN codant une protéine ou un caractère.</li><li><strong>Locus</strong> : emplacement d'un gène sur le chromosome.</li><li><strong>Caryotype</strong> : ensemble des chromosomes d'une cellule, classés par taille.</li></ul></div>
<h3>2. Chromosomes sexuels et autosomes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li>L'Homme a <strong>46 chromosomes</strong> = 23 paires.</li><li><strong>22 paires d'autosomes</strong> + <strong>1 paire de chromosomes sexuels</strong>.</li><li><strong>Femme</strong> : XX ; <strong>Homme</strong> : XY.</li><li>Le sexe de l'enfant dépend du spermatozoïde (X ou Y).</li><li><strong>Gène lié au sexe</strong> : porté par X ou Y (hémophilie, daltonisme).</li></ul></div>
<h3>3. Anomalies chromosomiques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Trisomie 21</strong> (Down) : 3 chromosomes 21 au lieu de 2.</li><li><strong>Syndrome de Turner</strong> : XO (femme sans second X).</li><li><strong>Syndrome de Klinefelter</strong> : XXY.</li><li><strong>Diagnostic prénatal</strong> : échographie, amniocentèse, caryotype fœtal.</li><li><strong>Applications en RDC</strong> : conseil génétique à Kinshasa, dépistage à Lubumbashi.</li></ul><p><a href="https://www.youtube.com/results?search_query=chromosomes+caryotype+hérédité+biologie+terminale" target="_blank" rel="noopener">🎥 Recherche : chromosomes et hérédité (chaînes de cours de biologie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les chromosomes portent les gènes, unités de l'hérédité. L'Homme a 46 chromosomes dont 2 sexuels (XX ou XY). Les anomalies chromosomiques (trisomie 21, Turner, Klinefelter) sont détectables par caryotype.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif de Biologie, 4e année des Humanités scientifiques (MEPST/DIPROMAD, 2021), matrice BIO6.7.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, HSC.</div>

    title: "Leçon 8 — L'ADN : structure et réplication",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un laboratoire de police scientifique à Kinshasa, on analyse une trace de sang pour identifier un suspect. La technique utilise l'ADN, molécule qui contient toute l'information génétique d'un individu. Comment est-elle structurée ?</p></div>
<h3>1. Structure de l'ADN</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><img alt="Double hélice d'ADN" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Bio6_7"><ul><li><strong>ADN</strong> (acide désoxyribonucléique) : support de l'information génétique.</li><li><strong>Nucléotide</strong> = phosphate + désoxyribose + base azotée.</li><li><strong>4 bases</strong> : Adénine (A), Thymine (T), Guanine (G), Cytosine (C).</li><li><strong>Appariement</strong> : A-T et G-C (règle de Chargaff).</li><li><strong>Double hélice</strong> (Watson et Crick, 1953) : deux brins antiparallèles enroulés en spirale.</li><li>Liaisons : <strong>phosphodiester</strong> (squelette) et <strong>hydrogène</strong> (entre bases).</li></ul></div>
<h3>2. La réplication de l'ADN</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Semi-conservative</strong> (Meselson et Stahl, 1958) : chaque nouveau brin garde un brin parental.</li><li><strong>Ouverture</strong> de la double hélice par l'<strong>hélicase</strong>.</li><li><strong>Synthèse</strong> par l'<strong>ADN polymérase</strong>, dans le sens 5' → 3'.</li><li>Brin <strong>directeur</strong> (continu) et brin <strong>retardé</strong> (fragments d'Okazaki).</li><li><strong>Ligase</strong> : relie les fragments.</li><li>Résultat : 2 molécules d'ADN identiques.</li></ul></div>
<h3>3. Applications</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Tests de paternité</strong> : comparaison des profils ADN.</li><li><strong>Enquêtes policières</strong> : identification des criminels à Kinshasa.</li><li><strong>Diagnostic des maladies génétiques</strong> : drépanocytose, mucoviscidose.</li><li><strong>Biotechnologies</strong> : OGM, thérapie génique.</li><li><strong>Paléogénétique</strong> : étude de l'ADN ancien des populations congolaises.</li></ul><p><a href="https://www.youtube.com/results?search_query=ADN+structure+réplication+biologie+terminale" target="_blank" rel="noopener">🎥 Recherche : structure et réplication de l'ADN (chaînes de cours de biologie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'ADN est une double hélice de nucléotides (A-T, G-C). Sa réplication est semi-conservative et fait intervenir hélicase, ADN polymérase et ligase. C'est la base des tests de paternité et du diagnostic génétique.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif de Biologie, 4e année des Humanités scientifiques (MEPST/DIPROMAD, 2021), matrice BIO6.8.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, HSC.</div>
    `

    title: "Leçon 9 — Synthèse des protéines : transcription et traduction",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une usine de Kinshasa, on produit des enzymes pour l'industrie agroalimentaire. Ces enzymes sont des protéines. Comment une cellule fabrique-t-elle une protéine à partir de l'information contenue dans l'ADN ?</p></div>
<h3>1. Du gène à la protéine</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><img alt="Transcription et traduction" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Bio6_8"><ul><li><strong>Dogme central</strong> (Crick) : ADN → ARN → Protéine.</li><li><strong>Gène</strong> : séquence d'ADN codant une protéine.</li><li><strong>ARN messager</strong> (ARNm) : copie transitoire du gène.</li><li><strong>Code génétique</strong> : triplet de bases (codon) → 1 acide aminé ; 64 codons pour 20 acides aminés.</li></ul></div>
<h3>2. Transcription et traduction</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Transcription</strong> (noyau) : l'ARN polymérase copie le brin d'ADN en ARNm. Chez les eucaryotes, l'ARNm subit une <strong>maturation</strong> (épissage) avant de sortir.</li><li><strong>Traduction</strong> (ribosomes) : l'ARNm est lu codon par codon ; les ARNt apportent les acides aminés correspondants.</li><li><strong>Initiation</strong> : codon AUG (méthionine).</li><li><strong>Élongation</strong> : formation de la chaîne polypeptidique.</li><li><strong>Terminaison</strong> : codons stop (UAA, UAG, UGA).</li></ul></div>
<h3>3. Applications</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Drépanocytose</strong> : une seule base modifiée (GAG → GTG) change un acide aminé et déforme l'hémoglobine. Fréquente en RDC.</li><li><strong>Antibiotiques</strong> : ils bloquent la traduction des bactéries.</li><li><strong>Biotechnologies</strong> : production d'insuline humaine par des bactéries génétiquement modifiées.</li><li><strong>Vaccins</strong> : synthèse d'antigènes par génie génétique.</li></ul><p><a href="https://www.youtube.com/results?search_query=synthèse+protéines+transcription+traduction+biologie+terminale" target="_blank" rel="noopener">🎥 Recherche : synthèse des protéines (chaînes de cours de biologie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'information génétique circule de l'ADN à l'ARNm (transcription) puis à la protéine (traduction). Le code génétique est universel : 64 codons pour 20 acides aminés. Une mutation peut modifier la protéine produite.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif de Biologie, 4e année des Humanités scientifiques (MEPST/DIPROMAD, 2021), matrice BIO6.9.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, HSC.</div>

    title: "Leçon 10 — Mutations et anomalies génétiques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À l'hôpital de Lubumbashi, un enfant naît avec une drépanocytose sévère. Ses parents, pourtant en bonne santé, sont porteurs sains. Une seule lettre modifiée dans l'ADN suffit à changer la vie. C'est une mutation.</p></div>
<h3>1. Les mutations</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><img alt="Types de mutations ponctuelles" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Bio6_9"><ul><li><strong>Mutation</strong> : modification de la séquence de l'ADN.</li><li><strong>Ponctuelle</strong> : substitution, insertion, délétion d'une base.</li><li><strong>Chromosomique</strong> : modification du nombre ou de la structure des chromosomes.</li><li><strong>Spontanée</strong> (erreur de réplication) ou <strong>induite</strong> (UV, rayons X, produits chimiques, virus).</li><li><strong>Effets</strong> : neutre, bénéfique ou délétère.</li></ul></div>
<h3>2. Principales anomalies génétiques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Drépanocytose</strong> : mutation du gène de l'hémoglobine (HbS). Fréquente en Afrique centrale, y compris en RDC.</li><li><strong>Mucoviscidose</strong> : atteinte des poumons et du pancréas.</li><li><strong>Hémophilie</strong> : défaut de coagulation, liée au chromosome X.</li><li><strong>Daltonisme</strong> : difficulté à distinguer les couleurs, liée au chromosome X.</li><li><strong>Trisomie 21</strong> : anomalie chromosomique (3 chromosomes 21).</li></ul></div>
<h3>3. Prévention et conseil génétique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Dépistage</strong> : test de falciformation à Kinshasa.</li><li><strong>Conseil génétique</strong> : information des couples à risque.</li><li><strong>Éviter les facteurs mutagènes</strong> : rayons X, tabac, alcool, pesticides.</li><li><strong>Thérapie génique</strong> : remplacer le gène défectueux (recherche en cours).</li><li><strong>Prévention en RDC</strong> : campagnes de sensibilisation, centres de dépistage à Kinshasa, Lubumbashi, Kisangani.</li></ul><p><a href="https://www.youtube.com/results?search_query=mutations+anomalies+génétiques+biologie+terminale" target="_blank" rel="noopener">🎥 Recherche : mutations génétiques (chaînes de cours de biologie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une mutation est une modification de l'ADN, ponctuelle ou chromosomique. Elle peut être neutre, bénéfique ou délétère. La drépanocytose et l'hémophilie sont fréquentes. Le dépistage et le conseil génétique permettent de prévenir.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif de Biologie, 4e année des Humanités scientifiques (MEPST/DIPROMAD, 2021), matrice BIO6.10.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, HSC.</div>

    title: "Leçon 11 — Génétique humaine et groupes sanguins",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À la banque de sang de Kinshasa, une transfusion est urgente. Le donneur est O−, le receveur A+. Le médecin doit vérifier la compatibilité. Les groupes sanguins obéissent aux lois de la génétique.</p></div>

<h3>2. Le facteur rhésus</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Rh+</strong> (dominant) : antigène D présent.</li><li><strong>Rh−</strong> (récessif) : antigène D absent.</li><li><strong>Maladie hémolytique du nouveau-né</strong> : mère Rh− et fœtus Rh+ → anticorps maternels attaquent le fœtus.</li><li><strong>Prévention</strong> : injection d'anti-D à la mère.</li><li><strong>Applications en RDC</strong> : dépistage du rhésus à la maternité.</li></ul></div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le système ABO comporte 3 allèles (A, B, O) ; A et B sont codominants, O est récessif. Le facteur rhésus est déterminé par l'antigène D. La transfusion et la grossesse nécessitent une compatibilité. Les empreintes génétiques identifient les individus.</p></div>

    title: "Leçon 12 — Biotechnologie et génie génétique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À Kinshasa, un laboratoire produit de l'insuline humaine grâce à des bactéries génétiquement modifiées. Cette insuline soigne les diabétiques. Le génie génétique transforme la médecine et l'agriculture.</p></div>
<h3>1. Les outils du génie génétique</h3>

<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Lamarck</strong> (1809) : transformation par usage et non-usage, transmission des caractères acquis. Théorie abandonnée.</li><li><strong>Darwin</strong> (1859, <em>L'Origine des espèces</em>) : sélection naturelle, lutte pour la vie, survie des mieux adaptés.</li><li><strong>Néo-darwinisme</strong> : synthèse moderne (génétique + Darwin) ; mutations + sélection + dérive génétique.</li><li><strong>Mutations</strong> : source de variabilité ; <strong>sélection naturelle</strong> : filtre les variants.</li></ul></div>
<h3>2. Les preuves de l'évolution</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><img alt="Pinsons de Darwin" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Bio6_11"><ul><li><strong>Paléontologiques</strong> : fossiles montrant des formes intermédiaires (archéoptéryx).</li><li><strong>Anatomiques</strong> : organes homologues (même structure, fonctions différentes) et analogues (même fonction, structures différentes).</li><li><strong>Embryologiques</strong> : ressemblances des embryons de vertébrés.</li><li><strong>Biogéographiques</strong> : répartition des espèces (pinsons des Galápagos).</li><li><strong>Moléculaires</strong> : comparaison des séquences d'ADN et de protéines.</li></ul></div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Lamarck proposait la transformation par usage, Darwin la sélection naturelle. Les preuves de l'évolution sont paléontologiques, anatomiques, embryologiques, biogéographiques et moléculaires. La RDC abrite des espèces uniques (bonobo, okapi).</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Monères</strong> (bactéries) : procaryotes.</li><li><strong>Protistes</strong> (algues, protozoaires) : eucaryotes unicellulaires.</li><li><strong>Champignons</strong> (levures, moisissures, champignons) : hétérotrophes, paroi chitineuse.</li><li><strong>Végétaux</strong> : autotrophes, paroi cellulosique.</li><li><strong>Animaux</strong> : hétérotrophes, mobiles.</li><li><strong>Classification phylogénétique</strong> moderne basée sur l'ADN.</li></ul></div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La systématique classe les êtres vivants selon leur parenté. Linné a établi la nomenclature binominale. Les cinq règnes sont : monères, protistes, champignons, végétaux, animaux. La RDC abrite de nombreuses espèces endémiques.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Fécondation</strong> : rencontre d'un spermatozoïde (n) et d'un ovule (n) → zygote (2n).</li><li>Lieu : <strong>trompe de Fallope</strong> (tiers supérieur).</li><li><strong>Réaction acrosomique</strong> : le spermatozoïde traverse la zone pellucide.</li><li><strong>Fusion des noyaux</strong> : formation du zygote.</li><li>Détermination du sexe : XX (fille) ou XY (garçon).</li></ul></div>
<h3>2. Le développement embryonnaire</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Segmentation</strong> : divisions successives du zygote → morula → blastocyste.</li><li><strong>Nidation</strong> : implantation dans l'endomètre (6-7 jours).</li><li><strong>Gastrulation</strong> : formation des trois feuillets (ectoderme, mésoderme, endoderme).</li><li><strong>Organogenèse</strong> : formation des organes.</li><li><strong>Périodes</strong> : embryon (0-8 semaines), fœtus (9 semaines à la naissance).</li><li><strong>Annexes</strong> : placenta, cordon ombilical, amnios, allantoïde.</li></ul></div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La fécondation (spermatozoïde + ovule) donne un zygote (2n). Le développement passe par segmentation, nidation, gastrulation et organogenèse. La grossesse dure 9 mois. Le suivi prénatal est essentiel pour la santé de la mère et de l'enfant.</p></div>

<h3>2. Régulation hormonale</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Hypothalamus</strong> : sécrète GnRH.</li><li><strong>Hypophyse</strong> : sécrète FSH et LH.</li><li><strong>FSH</strong> : stimule la croissance folliculaire.</li><li><strong>LH</strong> : déclenche l'ovulation.</li><li><strong>Œstrogènes</strong> (ovaires) : développement de l'endomètre.</li><li><strong>Progestérone</strong> (corps jaune) : maintient l'endomètre.</li><li><strong>Rétrocontrôle</strong> : négatif ou positif selon la phase.</li></ul></div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le cycle menstruel dure 28 jours : phase folliculaire, ovulation, phase lutéale, menstruation. Il est régulé par GnRH, FSH, LH, œstrogènes et progestérone. La connaissance du cycle permet la contraception et le traitement de l'infertilité.</p></div>

const nextBtn = document.getElementById('nextBtn');
const slideCounterSpan = document.getElementById('slideCounter');
const progressFill = document.getElementById('progressFill');
const counterSpan = document.getElementById('counter');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchNav = document.getElementById('searchNav');
const prevResultBtn = document.getElementById('prevResultBtn');
const nextResultBtn = document.getElementById('nextResultBtn');
const resultCounterSpan = document.getElementById('resultCounter');
const pageTitle = document.getElementById('pageTitle');
pageTitle.textContent = "ECOLIA · " + COURSE_TITLE;
document.title = "ECOLIA — " + COURSE_TITLE;
function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';
    slideCounterSpan.textContent = '0/0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>

<script>
(function () {
  var SITE = "https://ecolia-course.github.io/";
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface", page servie par https://app.local
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function abs(u) { return /^(https?:|data:|blob:)/i.test(u) ? u : (NATIVE ? SITE + u.replace(/^(\.\/|\/)+/, "") : u); }
  function ext(u) { var m = String(u).split("?")[0].match(/\.(jpe?g|png|gif|webp|svg)$/i); return m ? m[1].toLowerCase() : "jpg"; }
  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {
    if (queued[fn]) return;
    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
    if (!queue.length) { running = false; return; }
    if (!navigator.onLine) { running = false; return; }
    var q = queue.shift(), t0 = Date.now();
    try { CoursInterface.download(q[0], q[1]); } catch (e) { return setTimeout(next, 500); }
    (function wait() {
      var ok = false;
      try { ok = !!CoursInterface.exists(q[1]); } catch (e) {}
      if (ok) setTimeout(next, 1500);
      else if (Date.now() - t0 > 40000) next();
      else setTimeout(wait, 700);
    })();
  }
  function exists(fn) { try { return !!CoursInterface.exists(fn); } catch (e) { return false; } }

  function show(img) {                                    // affiche UNE image (appelé à chaque slide affichée)
    if (!table || img.getAttribute("data-ecolia-done")) return;
    var id = img.getAttribute("data-image-id");
    var url = table[id];
    if (typeof url !== "string" || !url.length) { console.warn("ECOLIA : image absente du JSON :", id); return; }
    img.setAttribute("data-ecolia-done", "1");
    if (!NATIVE) { img.onerror = function () { hide(img); }; img.setAttribute("src", url); return; }
    var full = abs(url), fn = "img_" + id + "." + ext(url);
    if (exists(fn)) {                                     // déjà sur l'appareil : lecture locale, sans internet
      img.onerror = function () {                         // fichier incomplet : on le supprime et on utilise le site
        try { CoursInterface["delete"](fn); } catch (e) {}
        queued[fn] = 0;
        img.onerror = function () { hide(img); };
        img.setAttribute("src", full);
      };
      img.setAttribute("src", "https://app.local/cours/" + fn);
    } else {
      img.onerror = function () { hide(img); };
      img.setAttribute("src", full);
      enqueue(full, fn);
    }
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches("img[data-image-id]")) show(root);
    root.querySelectorAll("img[data-image-id]").forEach(show);
  }
  function prefetchAll() {                                // APK : prépare TOUTES les images du cours pour le hors-ligne
    var ids = {};
    try { JSON.stringify(slides).replace(/data-image-id=\\?"([^"\\]+)/g, function (m, id) { ids[id] = 1; }); } catch (e) {}
    Object.keys(ids).forEach(function (id) {
      var url = table[id];
      if (typeof url !== "string" || !url.length) return;
      var fn = "img_" + id + "." + ext(url);
      if (!exists(fn)) enqueue(abs(url), fn);
    });
  }
  function start(tbl) {
    table = tbl;
    scan(document.body);
    new MutationObserver(function (muts) {                // les slides sont écrites à la volée : on traite chaque nouvelle image
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
    if (NATIVE) prefetchAll();
  }

  var JSON_URL = NATIVE ? SITE + "images_ecolia.json" : "images_ecolia.json";
  var KEY = "ecolia_images_json";
  fetch(JSON_URL, NATIVE ? { cache: "no-cache" } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (table) { if (NATIVE) lsSet(KEY, JSON.stringify(table)); start(table); })
    .catch(function (e) {
      var saved = null;
      if (NATIVE) { try { saved = JSON.parse(lsGet(KEY) || "null"); } catch (x) {} }
      if (saved) start(saved);                              // hors ligne dans l'APK : JSON gardé la dernière fois
      else console.warn("ECOLIA : JSON des images indisponible.", e);
    });
})();
</script>
