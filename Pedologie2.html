<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un sol sableux du plateau des Bateke ne retient-il pas l'eau alors qu'un sol argileux de la Cuvette centrale la retient trop ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir le sol. Identifier ses constituants. Distinguer texture et structure. Comprendre porosité et perméabilité. Prérequis : notions de biologie végétale et de chimie.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Sol :</strong> milieu vivant et fragile, interface entre la roche, l'atmosphère et les êtres vivants.</p>
<p><strong>Constituants minéraux :</strong> argile (fines particules qui retiennent l'eau), sable (grosses particules qui laissent passer l'eau), limon (intermédiaire).</p>
<p><strong>Constituants organiques :</strong> humus (matière organique décomposée, améliore la fertilité).</p>
<p><strong>Texture :</strong> proportions des constituants minéraux. Se mesure au toucher ou par le test du boudin.</p>
<p><strong>Structure :</strong> organisation des particules en mottes. Conditionne l'aération et la pénétration des racines.</p>
<p><strong>Porosité et perméabilité :</strong> capacité du sol à contenir et à laisser circuler l'eau et l'air.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Texture :</strong> proportions argile/sable/limon. <strong>Structure :</strong> organisation en mottes. <strong>Humus :</strong> matière organique décomposée. <strong>Perméabilité :</strong> vitesse à laquelle l'eau traverse le sol.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Réaliser le test du boudin pour estimer la texture. Observer la structure à la loupe. Relier texture et comportement du sol vis-à-vis de l'eau.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un sol sableux du plateau des Bateke (Kinshasa) est perméable et pauvre en nutriments, tandis qu'un sol argileux de la Cuvette centrale retient mieux l'eau mais peut être asphyxiant.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quels sont les trois constituants minéraux du sol ? <strong>Ex. 2 :</strong> Pourquoi le test du boudin permet-il d'estimer la texture ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Argile, sable, limon. <strong>2)</strong> Parce que la façon dont le sol se tient en boudin révèle sa proportion d'argile.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La texture et la structure sont les deux propriétés physiques fondamentales du sol.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Pédologie 2e année (Édition 2025).</div>
    `

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Profil du sol :</strong> coupe verticale montrant la succession des horizons.</p>
<p><strong>Horizons :</strong></p>
<ul>
<li><strong>O :</strong> litière en surface.</li>
<li><strong>A :</strong> horizon humifère, le plus fertile.</li>
<li><strong>B :</strong> horizon d'accumulation (argile, fer).</li>
<li><strong>C :</strong> roche altérée.</li>
<li><strong>R :</strong> roche mère.</li>
</ul>
<p><strong>Couleur :</strong> révèle la composition et l'hydromorphie (gley gris, sols rouges ferralitiques).</p>
<p><strong>Fosse pédologique :</strong> trou creusé pour observer le profil.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Horizon :</strong> couche de sol aux propriétés distinctes. <strong>Fosse pédologique :</strong> excavation d'observation. <strong>Gley :</strong> horizon grisâtre dû à l'engorgement.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Lire un profil de sol, c'est lire l'histoire du milieu.</p></div>

particules qui laissent passer l'eau), limon (intermédiaire). Constituants organiques: humus (matière organique décomposée, améliore la fertilité). Texture: proportions des constituants minéraux. Se mesure au toucher ou par le test du boudin. Structure: organisation des particules en mottes. Conditionne l'aération et la pénétration des racines. Porosité et perméabilité: capacité du sol à contenir et à laisser circuler l'eau et l'air. Définitions. Texture: proportions argile ou sable ou limon. Structure: organisation en mottes. Humus: matière organique décomposée. Perméabilité: vitesse à laquelle l'eau traverse le sol. Méthodes et règles. Réaliser le test du boudin pour estimer la texture. Observer la structure à la loupe. Relier texture et comportement du sol vis-à-vis de l'eau. Exemple. Un sol sableux du plateau des Bateke (Kinshasa) est perméable et pauvre en nutriments, tandis qu'un sol argileux de la Cuvette centrale retient mieux l'eau mais peut être asphyxiant. Exercices. Ex. 1: Quels sont les trois constituants minéraux du sol? Ex. 2: Pourquoi le test du boudin permet-il d'estimer la texture? Corrigé. 1) Argile, sable, limon. 2) Parce que la façon dont le sol se tient en boudin révèle sa proportion d'argile. À retenir. La texture et la structure sont les deux propriétés physiques fondamentales du sol."]],"3":[["fr","Leçon 2, Les horizons et le profil du sol. Situation. « Pourquoi un sol forestier du Kivu est-il plus fertile en surface qu'en profondeur? ». Objectifs. Identifier les horizons. Lire la couleur. Utiliser la fosse pédologique. Prérequis: leçon 1. Théorie. Profil du sol: coupe verticale montrant la succession des horizons. Horizons: O: litière en surface. A: horizon humifère, le plus fertile. B: horizon d'accumulation (argile, fer). C: roche altérée. R: roche mère. Couleur: révèle la composition et l'hydromorphie (gley gris, sols rouges ferralitiques). Fosse pédologique: trou creusé pour observer le profil. Définitions. Horizon: couche de sol aux propriétés distinctes. Fosse pédologique: excavation d'observation. Gley: horizon grisâtre dû à l'engorgement. Méthodes et règles. Observer un profil sur une fosse ou une photo. Décrire couleur, texture, épaisseur de chaque horizon. Identifier les transitions. Exemple. L'examen d'un profil de sol dans une forêt du Kivu révèle un horizon A riche en humus, un horizon B argileux et un horizon C issu de l'altération volcanique. Exercices. Ex. 1: Quels sont les principaux horizons du sol? Ex. 2: Que révèle un horizon gley? Corrigé. 1) O, A, B, C, R. 2) Un engorgement en eau (hydromorphie). À retenir. Lire un profil de sol, c'est lire l'histoire du milieu."]],"4":[["fr","Leçon 3, Les grands types de sols congolais. Situation. « Pourquoi les sols des Virunga sont-ils si fertiles alors que ceux du plateau des Bateke sont pauvres? ». Objectifs. Identifier les grands types. Connaître leur potentiel et leurs contraintes. Localiser les principales zones. Prérequis: leçons 1 et 2. Théorie. Ferralsols: sols ferralitiques, dominants en R D C, très altérés, acides, faible fertilité naturelle. Andosols: sols volcaniques du Kivu, très fertiles mais fragiles. Fluvisols: sols alluviaux du bassin du Congo, riches mais menacés par les crues. Sols sableux des Bateke: perméables et pauvres. Arénosols: sols sableux. Définitions. Ferralsol: sol rouge très altéré. Andosol: sol volcanique. Fluvisol: sol alluvial. Méthodes et règles. Localiser les types sur une carte de la R D C. Associer chaque type à une culture adaptée et à une contrainte. Exemple. Les Andosols des Virunga (Nord-Kivu) sont parmi les sols les plus fertiles de la R D C, mais leur mise en culture intensive sans protection entraîne une érosion rapide. Exercices. Ex. 1: Quel est le type de sol le plus répandu en R D C? Ex. 2: Citer deux contraintes des Ferralsols. Corrigé. 1) Les Ferralsols. 2) Acidité et faible fertilité naturelle (autres réponses possibles). À retenir. Chaque sol a son potentiel et ses limites: cultiver, c'est d'abord connaître son sol."]],"5":[["fr","Leçon 4, La dégradation des sols en R D C. Situation. « Pourquoi les ravines menacent-elles des villes comme Kananga? ». Objectifs. Identifier les causes de dégradation. Comprendre les mécanismes. Reconnaître les villes menacées. Prérequis: leçons 1 à 3. Théorie. Érosion hydrique: ravinement, érosion en nappe. Érosion éolienne: en zones sèches. Appauvrissement en matière organique, acidification, salinisation. Causes anthropiques: déforestation, surpâturage, monoculture, mauvaises pratiques culturales, urbanisation non planifiée. Définitions. Érosion: perte de la couche superficielle. Ravine: sillon profond creusé par le ruissellement. Acidification: baisse du pH. Méthodes et règles. Observer les signes d'érosion. Identifier les causes. Relier dégradation et pratiques humaines. Exemple. Les ravines de Kananga (Kasaï) sont un exemple spectaculaire d'érosion hydrique liée à l'urbanisation non planifiée et à la déforestation. Exercices. Ex. 1: Quelles sont les principales causes de dégradation des sols en R D C? Ex. 2: Citer deux villes congolaises menacées par l'érosion. Corrigé. 1) Déforestation, mauvaises pratiques, urbanisation (autres réponses possibles). 2) Kananga et Kikwit (autres réponses possibles). À retenir. La dégradation des sols est rarement naturelle: elle est souvent accélérée par l'action humaine."]],"6":[["fr","Leçon 5, Conservation et amélioration de la fertilité des sols. Situation. « Comment une parcelle en pente peut-elle rester productive pendant des années? ». Objectifs. Connaître les techniques de conservation. Comprendre l'amendement organique et minéral. Concevoir un plan. Prérequis: leçons 1 à 4. Théorie. Techniques de conservation: paillage, cordons pierreux, terrasses, rotation, agroforesterie. Amendements organiques: compost, fumier. Amendements minéraux: chaulage pour corriger l'acidité. Fertilisation raisonnée et gestion de l'eau. Définitions. Paillage: couverture du sol avec des résidus végétaux. Chaulage: apport de chaux pour corriger l'acidité. Agroforesterie: association arbres ou cultures. Méthodes et règles. Choisir les techniques adaptées au terrain. Apporter du compost. Corriger l'acidité par le chaulage. Pratiquer la rotation. Exemple. L'association maïs-légumineuse (haricot ou niébé) enrichit le sol en azote tout en produisant une récolte supplémentaire, une pratique agroforestière promue dans le Kasaï. Exercices. Ex. 1: Quelles sont les techniques de conservation des sols? Ex. 2: Proposer un plan de conservation pour une parcelle en pente. Corrigé. 1) Paillage, cordons pierreux, terrasses, rotation (autres réponses possibles). 2) Cordons pierreux plus paillage plus rotation (autres réponses possibles). À retenir. Conserver le sol, c'est investir dans l'avenir de la production."]],"7":[["fr","Évaluation finale, Pédologie. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 12 sur 20, tu as réussi."]]}};
  var CACHE = "ecolia-cours-v1";                       // même cache que l'application

    function cur() {

    // ====================================================================
    //  Stockage hors ligne : 2 moteurs, même interface

    // ====================================================================
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {                                   // fichier complet ? (taille exacte connue à la génération)
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () {
          var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok);
        },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) {
          try { CoursInterface.delete(nameN(n)); } catch (e) {}
          writeOk(readOk().filter(function (x) { return x !== n; }));
          return Promise.resolve();
        }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }   // ancien contenu invalide
                return n;

        },
        get: function (n) {
          return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); })
            .then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; });
        },
        put: function (n) {

    function startDownload() {

    // ====================================================================

    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
