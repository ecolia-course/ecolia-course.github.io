    const slides = [
        {
            title: "Leçon 1 : Le respect de soi-même",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> Imagine-toi le matin avant d'aller à l'école. Tu te laves le visage, tu brosses tes dents, tu mets ton uniforme bien propre. Ta maman te regarde et sourit : « Comme tu es beau aujourd'hui ! » Ce que tu fais, c'est te respecter toi-même. Le respect commence par <strong>toi</strong>.
                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> Visualise-toi debout, fier, bien habillé, le sourire aux lèvres. Tu te sens bien dans ta peau. C'est cela, la <strong>dignité</strong> : se sentir important et précieux.
                </div>
                <h3>🔍 Observons</h3>
                <p>Prendre soin de son corps, c'est du respect. Dire non à ce qui est mauvais pour toi (la bagarre, les insultes, la paresse), c'est du respect. Quand tu fais tes devoirs au lieu de traîner dans la rue, tu te respectes.</p>
                <h3>❓ Questions pour réfléchir</h3>
                <ul>
                    <li>Pourquoi est-il important de prendre soin de ton corps ?</li>
                    <li>Est-ce que refuser de tricher à un examen, c'est se respecter ? Pourquoi ?</li>
                    <li>Que ressens-tu quand quelqu'un te parle mal ?</li>
                </ul>
                <h3>💡 Découverte</h3>
                <p>L'élève comprend que le respect de soi est la base de tout. Une personne qui se respecte prend soin de son corps, de son esprit, et fait des choix qui l'élèvent.</p>
                <div class="definition-box">
                    <strong>📚 Définition (Théorie) :</strong><br>
                    Le <strong>respect de soi</strong> est l'attitude qui consiste à prendre soin de son corps, de sa santé, de son éducation, et à défendre sa <strong>dignité</strong>. C'est reconnaître sa propre valeur en tant que personne humaine.<br>
                    <strong>La dignité</strong> est la valeur inestimable que possède chaque être humain, simplement parce qu'il est une personne.
                </div>
                <div class="example-box">
                    ✅ <strong>Actes de respect de soi :</strong><br>
                    • Se laver chaque jour.<br>
                    • Bien s'habiller.<br>
                    • Dire non à la drogue et à l'alcool.<br>
                    • Étudier avec sérieux.<br>
                    • Choisir de bons amis.<br>
                    ❌ <strong>Manques de respect de soi :</strong> se négliger, accepter les humiliations, paresser.
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé ultra-simple :</strong> Le respect de soi = prendre soin de toi, de ton corps et de ton avenir. Tu as de la valeur, ne l'oublie jamais.
                </div>
            `
        },
        {
            title: "Leçon 2 : Le respect des autres",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> Dans la cour de récréation, tu vois deux enfants qui se disputent un ballon. L'un insulte l'autre et le pousse. Un troisième enfant arrive et dit : « Arrêtez ! On peut jouer ensemble sans se battre. » Ce troisième enfant fait preuve de <strong>respect des autres</strong>.
                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> Imagine une ronde où tout le monde se tient la main. Chacun regarde l'autre avec bienveillance. Le respect, c'est cette ronde où personne n'est exclu.
                </div>
                <h3>🔍 Observons</h3>
                <p>Respecter les autres, c'est reconnaître qu'ils ont la même <strong>dignité</strong> que toi. Le maître, le camarade, le vendeur du marché, le petit enfant, la personne âgée : tous méritent le respect.</p>
                <div class="definition-box">
                    <strong>📚 Théorie :</strong><br>
                    Le <strong>respect des autres</strong> consiste à traiter chaque personne avec égard, politesse et justice, quels que soient son âge, son origine, sa religion ou son apparence.<br><br>
                    <strong>La règle d'or :</strong> « Ne fais pas aux autres ce que tu ne voudrais pas qu'on te fasse. »
                </div>
                <div class="example-box">
                    📝 <strong>Concrètement :</strong><br>
                    • Dire « bonjour », « merci », « pardon », « s'il te plaît ».<br>
                    • Écouter celui qui parle sans le couper.<br>
                    • Ne pas se moquer d'un camarade qui a mal répondu.<br>
                    • Aider un aveugle à traverser la rue.<br>
                    • Respecter les anciens et les parents.
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> Respecter les autres = les traiter comme tu aimerais être traité. Chaque personne est précieuse.
                </div>
            `
        },
        {
            title: "Leçon 3 : Le respect des biens publics et privés",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> Tu arrives à l'école et tu vois qu'un banc est cassé, les murs sont couverts de dessins au charbon, et le robinet de la cour coule sans que personne ne le ferme. Tout cela, ce sont des <strong>biens publics</strong> qui sont abîmés. Chez toi, ton petit frère a déchiré ton cahier sans permission : c'est un <strong>bien privé</strong> qui n'a pas été respecté.
                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> Imagine deux mains : l'une qui répare un banc cassé, l'autre qui ferme un robinet qui goutte. Ce sont les gestes d'un bon citoyen.
                </div>
                <h3>🔍 Observons</h3>
                <p>Un <strong>bien public</strong> appartient à tout le monde (l'école, la route, l'hôpital, le marché). Un <strong>bien privé</strong> appartient à une personne ou une famille (ton cahier, la voiture de ton oncle). Les deux doivent être respectés.</p>
                <div class="definition-box">
                    <strong>📚 Théorie :</strong><br>
                    • <strong>Bien public :</strong> bien qui appartient à la communauté, à l'État. Tout le monde peut l'utiliser, personne ne doit le détruire.<br>
                    • <strong>Bien privé :</strong> bien qui appartient à un individu ou une famille. On ne peut pas l'utiliser sans permission.<br>
                    • <strong>Vandalisme :</strong> destruction volontaire d'un bien public ou privé. C'est une faute grave.
                </div>
                <div class="example-box">
                    🏫 <strong>Dans ton école :</strong><br>
                    • Bien public : les tables-bancs, le tableau, les toilettes, la cour.<br>
                    • Bien privé : ton stylo, ton cahier, le sac de ton camarade.<br>
                    💡 <strong>Bon geste :</strong> ramasser un papier par terre, même si ce n'est pas toi qui l'as jeté.
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> Respecte ce qui appartient à tout le monde (biens publics) et ce qui appartient à chacun (biens privés). Ne détruis rien.
                </div>
            `
        },
        {
            title: "Leçon 4 : La famille – Première communauté de vie",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> Le soir, toute ta famille se réunit autour du repas. Papa demande à chacun comment s'est passée sa journée. Maman encourage le petit dernier qui a eu une bonne note. Ta grande sœur raconte une histoire drôle. Ce moment de partage, c'est la <strong>vie de famille</strong>.
                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> Visualise un grand arbre, le <strong>baobab</strong>. Le tronc, ce sont les parents. Les branches, ce sont les enfants. Les racines, ce sont les ancêtres. La famille, c'est cet arbre qui protège et nourrit.
                </div>
                <h3>🔍 Observons</h3>
                <p>La famille est le premier endroit où tu apprends à vivre avec les autres. Tu y apprends le respect, le partage, l'obéissance, la solidarité.</p>
                <div class="definition-box">
                    <strong>📚 Théorie :</strong><br>
                    La <strong>famille</strong> est une communauté de personnes unies par le sang (parents, enfants) ou par le mariage. C'est la <strong>cellule de base</strong> de la société.<br><br>
                    Types de familles :<br>
                    • <strong>Famille nucléaire :</strong> père, mère, enfants.<br>
                    • <strong>Famille élargie :</strong> oncles, tantes, cousins, grands-parents vivent ensemble.
                </div>
                <div class="example-box">
                    👨‍👩‍👧‍👦 <strong>Devoirs envers la famille :</strong><br>
                    • Respecter ses parents et les personnes âgées.<br>
                    • Obéir aux règles de la maison.<br>
                    • Aider aux tâches ménagères (balayer, chercher l'eau).<br>
                    • Partager avec ses frères et sœurs.<br>
                    • Bien étudier pour rendre la famille fière.
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> La famille = ton premier chez-toi. Tu y apprends à aimer, respecter et partager. C'est la base de toute la société.
                </div>
            `
        },
        {
            title: "Leçon 5 : L'école – Lieu d'instruction et d'éducation",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> Chaque matin, tu quittes ta maison pour venir à l'école. Tu salues le directeur à la porte, tu entres en classe, le maître écrit au tableau. Ici, tu apprends à lire, à compter, mais aussi à <strong>vivre ensemble</strong> avec des camarades venus de partout.

                <div class="image-box">

                </div>
                <h3>🔍 Observons</h3>
                <p>L'école n'est pas seulement un lieu où l'on remplit la tête. C'est aussi un lieu où l'on apprend à être un <strong>bon citoyen</strong>, à respecter les règles, à travailler en groupe, à écouter les autres.</p>
                <div class="definition-box">
                    <strong>📚 Théorie :</strong><br>
                    L'<strong>école</strong> est une institution qui assure l'<strong>instruction</strong> (transmission des connaissances) et l'<strong>éducation</strong> (formation du caractère et du citoyen).<br><br>
                    <strong>Droits de l'élève :</strong> être instruit, être protégé, être écouté.<br>
                    <strong>Devoirs de l'élève :</strong> être assidu, respecter le règlement, respecter les maîtres et les camarades, faire son travail.
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> L'école = le lieu où tu construis ton savoir et ton savoir-vivre. Élève sérieux aujourd'hui, citoyen utile demain.
                </div>
            `
        },
        {
            title: "Leçon 6 : Le quartier et le village – Vivre en communauté",
            content: `
                <div class="scene-box">

                <div class="image-box">

                <h3>🔍 Observons</h3>
                <p>Un quartier ou un village fonctionne bien quand tout le monde se respecte et s'entraide. Le <strong>chef de quartier</strong> ou le <strong>chef du village</strong> veille à l'ordre et à la sécurité.</p>
                <div class="definition-box">
                    <strong>📚 Théorie :</strong><br>
                    Le <strong>quartier</strong> (en ville) ou le <strong>village</strong> (en milieu rural) est une communauté de voisinage. On y pratique la <strong>solidarité</strong> (entraide) et le <strong>civisme</strong> (respect des règles communes).<br><br>
                    <strong>Bon citoyen du quartier :</strong><br>
                    • Saluer ses voisins.<br>
                    • Ne pas jeter d'ordures dans la rue.<br>
                    • Participer aux travaux communautaires (salongo).<br>
                    • Signaler un danger aux autorités.
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> Le quartier, c'est ta grande famille élargie. Sois propre, sois poli, sois solidaire.
                </div>
            `
        },

                    • une <strong>culture</strong> (langues, traditions, valeurs),<br>

        {
            title: "🏆 QUIZ FINAL – Teste tes connaissances en ECM !",
            content: `
                <div id="quizContainer" class="quiz-container">
                    <h3>📝 Questionnaire d'Éducation Civique et Morale (7ᵉ année)</h3>
                    <p style="margin-bottom:15px;">Choisis la bonne réponse pour chaque question.</p>
                    <div id="quizQuestions"></div>
                    <button id="submitQuiz" class="quiz-btn-submit">✅ Valider mes réponses</button>
                    <div id="quizResult" class="quiz-result"></div>

    ];

    let currentSlide = 0, isAutoPlaying = false, syncInterval;
    let lastSearchTerm = "", searchResults = [], currentResultIdx = -1;
    const audioPlayer = document.getElementById('audioPlayer');
    const contentDiv = document.getElementById('content');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playBtn = document.getElementById('playBtn');
    const statusDiv = document.getElementById('status');
    const slideCounterSpan = document.getElementById('slideCounter');
    const progressFill = document.getElementById('progressFill');
    const timeDisplay = document.getElementById('timeDisplay');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const searchNav = document.getElementById('searchNav');
    const prevResultBtn = document.getElementById('prevResultBtn');
    const nextResultBtn = document.getElementById('nextResultBtn');
    const resultCounterSpan = document.getElementById('resultCounter');
    const quizNavBtn = document.getElementById('quizNavBtn');

    const timeline = [0,86,157,212,278,332,390,445,506,564,614,663];
    const totalDuration = 730; // ~12 minutes

    function getTextFromHtml(html) {
        const div = document.createElement('div');
        div.innerHTML = html;
        return div.textContent || div.innerText || "";
    }

    function searchSlides(term) {
        if (!term.trim()) return [];
        const lowerTerm = term.toLowerCase();
        const results = [];
        slides.forEach((slide, idx) => {
            if (slide.title.toLowerCase().includes(lowerTerm) ||
                getTextFromHtml(slide.content).toLowerCase().includes(lowerTerm)) {
                results.push(idx);
            }
        });
        return results;
    }

    function highlightInCurrentSlide(term) {
        if (!term || term.trim() === "") return;
        const slideContentDiv = document.querySelector('.slide-content');
        if (!slideContentDiv) return;
        const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        const walker = document.createTreeWalker(slideContentDiv, NodeFilter.SHOW_TEXT, null, false);
        const textNodes = [];
        while (walker.nextNode()) textNodes.push(walker.currentNode);
        for (let node of textNodes) {
            if (node.nodeValue && regex.test(node.nodeValue)) {
                const span = document.createElement('span');
                span.innerHTML = node.nodeValue.replace(regex, '<span class="highlight">$1</span>');
                node.parentNode.replaceChild(span, node);
            }
        }
    }

    function renderQuiz() {
        const quizDiv = document.getElementById('quizQuestions');
        if (!quizDiv) return;
        const questions = [
            { text: "Qu'est-ce que le respect de soi ?", options: ["S'insulter", "Prendre soin de son corps et de son avenir", "Ne rien faire"], correct: 1 },
            { text: "Quelle est la règle d'or du respect ?", options: ["Fais aux autres ce qu'ils te font", "Ne fais pas aux autres ce que tu ne voudrais pas qu'on te fasse", "Ignore les autres"], correct: 1 },
            { text: "Un banc de l'école est un bien :", options: ["Privé", "Public", "Personnel"], correct: 1 },
            { text: "Comment s'appelle la cellule de base de la société ?", options: ["L'école", "La famille", "Le quartier"], correct: 1 },
            { text: "Quels sont les trois pouvoirs de l'État ?", options: ["Exécutif, militaire, religieux", "Exécutif, législatif, judiciaire", "Présidentiel, royal, coutumier"], correct: 1 },
            { text: "La loi suprême du pays s'appelle :", options: ["Le règlement", "La Constitution", "Le code de la route"], correct: 1 },
            { text: "Parmi ces droits, lequel est garanti par la Constitution ?", options: ["Droit de ne pas aller à l'école", "Droit à l'éducation", "Droit de détruire la nature"], correct: 1 },
            { text: "La démocratie signifie :", options: ["Le pouvoir du Président", "Le pouvoir du peuple", "Le pouvoir de l'armée"], correct: 1 },
            { text: "Planter un arbre est un geste pour :", options: ["Détruire l'environnement", "Protéger l'environnement", "Gaspiller l'eau"], correct: 1 },
            { text: "Le drapeau de la RDC a trois couleurs :", options: ["Rouge, jaune, vert", "Bleu, jaune, rouge", "Noir, jaune, rouge"], correct: 1 }
        ];
        let html = '';
        questions.forEach((q, idx) => {
            html += `<div class="quiz-question"><p>${idx+1}. ${q.text}</p>`;
            q.options.forEach((opt, optIdx) => {
                html += `<label><input type="radio" name="q${idx}" value="${optIdx}"> ${opt}</label>`;
            });
            html += `</div>`;
        });
        quizDiv.innerHTML = html;
        const submitBtn = document.getElementById('submitQuiz');
        if (submitBtn) {
            submitBtn.onclick = () => {
                let score = 0;
                questions.forEach((q, idx) => {
                    const selected = document.querySelector(`input[name="q${idx}"]:checked`);
                    if (selected && parseInt(selected.value) === q.correct) score++;
                });
                const resultDiv = document.getElementById('quizResult');
                const pct = Math.round(score/questions.length*100);
                resultDiv.innerHTML = `<div style="background:#c8e6c9; padding:18px; border-radius:12px;">
                    🎯 <strong>Ton score : ${score} / ${questions.length} (${pct}%)</strong><br>
                    ${score === questions.length ? '🌟 Excellent ! Tu es un vrai bon citoyen !' : score >=7 ? '👍 Bon travail, continue à apprendre !' : '📖 Relis les leçons, tu vas progresser.'}
                </div>`;
            };
        }
    }

    function renderSlide(index, keepHighlight = true) {
        const isQuiz = (index === slides.length - 1);
        contentDiv.innerHTML = `<div class="slide active">
            <h2 class="slide-title">${slides[index].title}</h2>
            <div class="slide-content">${slides[index].content}</div>
        </div>`;
        if (isQuiz) renderQuiz();
        slideCounterSpan.textContent = `${index+1}/${slides.length}`;
        progressFill.style.width = `${((index+1)/slides.length)*100}%`;
        if (!isAutoPlaying) {
            prevBtn.disabled = (index === 0);
            nextBtn.disabled = (index === slides.length-1);
        }
        contentDiv.scrollTop = 0;
        if (keepHighlight && lastSearchTerm && lastSearchTerm.trim() !== "" && !isQuiz) {
            highlightInCurrentSlide(lastSearchTerm);
        }
    }

    function updateResultDisplay() {
        if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
        searchNav.style.display = 'flex';
        resultCounterSpan.innerText = `${currentResultIdx+1}/${searchResults.length}`;
    }

    function goToResult(idx) {
        if (idx < 0 || idx >= searchResults.length) return;
        currentResultIdx = idx;
        currentSlide = searchResults[currentResultIdx];
        renderSlide(currentSlide, true);
        updateResultDisplay();
    }

    function performSearch() {
        const term = searchInput.value.trim();
        if (!term) { alert("Entre un mot à rechercher."); return; }
        if (isAutoPlaying) stopAutoPlay();
        lastSearchTerm = term;
        searchResults = searchSlides(term);
        if (searchResults.length === 0) { alert(`Aucun résultat pour "${term}".`); searchNav.style.display = 'none'; return; }
        currentResultIdx = 0;
        goToResult(0);
    }

    function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
    function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }

    function nextSlide() {
        if (currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); clearSearch(); }
    }
    function prevSlide() {
        if (currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); clearSearch(); }
    }
    function clearSearch() {
        if (lastSearchTerm) { lastSearchTerm = ""; searchResults = []; searchNav.style.display = 'none'; searchInput.value = ""; }
    }

    function updateTimeDisplay() {
        let t = audioPlayer.currentTime;
        let mins = Math.floor(t/60).toString().padStart(2,'0');
        let secs = Math.floor(t%60).toString().padStart(2,'0');
        let tMins = Math.floor(totalDuration/60).toString().padStart(2,'0');
        let tSecs = Math.floor(totalDuration%60).toString().padStart(2,'0');
        timeDisplay.innerText = `${mins}:${secs} / ${tMins}:${tSecs}`;
        if (!isAutoPlaying) progressFill.style.width = `${(t/totalDuration)*100}%`;
    }

    function syncSlideFromTime() {
        if (!isAutoPlaying) return;
        const t = audioPlayer.currentTime;
        for (let i = timeline.length-1; i >= 0; i--) {
            if (t >= timeline[i]) {
                if (i !== currentSlide) { currentSlide = i; renderSlide(currentSlide, false); }
                break;
            }
        }
        updateTimeDisplay();
        if (t >= totalDuration - 1) stopAutoPlay();
    }

    function startAutoPlay() {
        isAutoPlaying = true;
        playBtn.innerText = "⏸ Pause";
        playBtn.classList.add('stop-btn');
        statusDiv.innerText = "🔊 Lecture synchronisée en cours...";
        statusDiv.style.background = "rgba(93,64,55,0.9)";
        prevBtn.disabled = nextBtn.disabled = true;
        clearSearch();
        audioPlayer.play().catch(e => console.log("Lecture bloquée, cliquer sur play"));
        if (syncInterval) clearInterval(syncInterval);
        syncInterval = setInterval(syncSlideFromTime, 300);
    }

    function stopAutoPlay() {
        isAutoPlaying = false;
        playBtn.innerText = "▶ Lecture audio";
        playBtn.classList.remove('stop-btn');
        statusDiv.innerText = "📖 Mode navigation";
        statusDiv.style.background = "rgba(0,0,0,0.8)";
        audioPlayer.pause();
        if (syncInterval) { clearInterval(syncInterval); syncInterval = null; }
        prevBtn.disabled = (currentSlide===0);
        nextBtn.disabled = (currentSlide===slides.length-1);
    }

    function toggleAutoPlay() { isAutoPlaying ? stopAutoPlay() : startAutoPlay(); }
    function goToQuiz() { if (isAutoPlaying) stopAutoPlay(); currentSlide = slides.length-1; renderSlide(currentSlide, false); }

    document.addEventListener('keydown', (e) => {
        if (isAutoPlaying) return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === ' ' && document.activeElement !== searchInput) { e.preventDefault(); toggleAutoPlay(); }
    });

    prevBtn.onclick = prevSlide;
    nextBtn.onclick = nextSlide;
    playBtn.onclick = toggleAutoPlay;
    searchBtn.onclick = performSearch;
    prevResultBtn.onclick = prevResult;
    nextResultBtn.onclick = nextResult;
    quizNavBtn.onclick = goToQuiz;
    audioPlayer.addEventListener('ended', stopAutoPlay);
    audioPlayer.addEventListener('timeupdate', () => { if(!isAutoPlaying) updateTimeDisplay(); });

    renderSlide(0, false);
    updateTimeDisplay();
</script>
</body>
