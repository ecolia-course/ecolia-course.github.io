<div class="bloc cas"><div class="bloc-label">Situation</div><p>In a secondary school in Kinshasa, a student is preparing for the English section of the EXETAT. The teacher asks: "How do you describe your daily routine? What are you doing right now? Have you ever visited another country?" These questions use three different present tenses. Mastering them is essential for the exam.</p></div>
<h3>1. Present Simple</h3>
<div class="bloc theorie"><div class="bloc-label">Grammar</div><ul><li><strong>Form</strong>: Subject + base verb (+ s/es for he/she/it).</li><li><strong>Use</strong>: habits, routines, general truths, permanent states.</li><li><strong>Examples</strong>: I <strong>go</strong> to school every day. She <strong>works</strong> in a hospital. Water <strong>boils</strong> at 100 °C.</li><li><strong>Negative</strong>: do/does + not + base verb. He <strong>does not</strong> like coffee.</li><li><strong>Question</strong>: Do/Does + subject + base verb. <strong>Do</strong> you speak English?</li></ul></div>
<h3>2. Present Continuous</h3>
<div class="bloc theorie"><div class="bloc-label">Grammar</div><ul><li><strong>Form</strong>: Subject + am/is/are + verb-ing.</li><li><strong>Use</strong>: actions happening now, temporary situations, future arrangements.</li><li><strong>Examples</strong>: I <strong>am studying</strong> for the EXETAT. She <strong>is reading</strong> a book. They <strong>are playing</strong> football.</li><li><strong>Negative</strong>: am/is/are + not + verb-ing. He <strong>is not sleeping</strong>.</li><li><strong>Question</strong>: Am/Is/Are + subject + verb-ing. <strong>Are</strong> you listening?</li></ul></div>
<h3>3. Present Perfect</h3>
<div class="bloc theorie"><div class="bloc-label">Grammar</div><ul><li><strong>Form</strong>: Subject + have/has + past participle.</li><li><strong>Use</strong>: past actions with present relevance, experiences, actions that started in the past and continue.</li><li><strong>Examples</strong>: I <strong>have visited</strong> Lubumbashi. She <strong>has finished</strong> her homework. They <strong>have lived</strong> here since 2020.</li><li><strong>Time markers</strong>: already, yet, just, ever, never, since, for.</li><li><strong>Negative</strong>: have/has + not + past participle. He <strong>has not arrived</strong> yet.</li></ul></div>
<h3>4. Practice — EXETAT style</h3>
<div class="bloc exemple"><div class="bloc-label">Exercise</div><p><strong>Choose the correct answer:</strong></p><ol><li>She ___ to church every Sunday. (go / goes / is going / has gone) → <strong>goes</strong></li><li>Look! The children ___ in the yard. (play / plays / are playing / have played) → <strong>are playing</strong></li><li>I ___ this film three times. (see / saw / have seen / am seeing) → <strong>have seen</strong></li><li>He ___ in Kinshasa since 2015. (lives / lived / has lived / is living) → <strong>has lived</strong></li><li>Water ___ at 100 degrees Celsius. (boil / boils / is boiling / has boiled) → <strong>boils</strong></li></ol><p><a href="https://www.youtube.com/results?search_query=present+simple+continuous+perfect+english+grammar" target="_blank" rel="noopener">🎥 Search: Present tenses (English grammar channels)</a></p></div>
<div class="bloc resume"><div class="bloc-label">Key points</div><p>Present Simple = habits and general truths. Present Continuous = actions happening now. Present Perfect = past actions with present relevance. Pay attention to time markers: every day (simple), now (continuous), since/for/already/yet (perfect).</p></div>
<div class="sources"><strong>Sources:</strong> Programme National d'Anglais, Enseignement Secondaire Général (EDIDEPS, 2007) ; Enjoy English Book 3 (3ème/4ème Humanités) ; EXETAT items (2014-2020).<br><strong>Abbreviations:</strong> MEPST, DIPROMAD, EXETAT, HEC.</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>A student in Lubumbashi tells a story about his weekend: "Yesterday, I went to the market. While I was walking, I met an old friend. He told me he had just returned from South Africa." This story uses three past tenses. Let's learn how to use them correctly.</p></div>
<h3>1. Past Simple</h3>
<div class="bloc theorie"><div class="bloc-label">Grammar</div><ul><li><strong>Form</strong>: Subject + verb-ed (regular) or irregular past form.</li><li><strong>Use</strong>: completed actions in the past, past habits, sequences of events.</li><li><strong>Examples</strong>: I <strong>visited</strong> my grandmother yesterday. She <strong>went</strong> to school in 2010. They <strong>played</strong> football last Saturday.</li><li><strong>Time markers</strong>: yesterday, last week, in 1990, ago, then.</li><li><strong>Negative</strong>: did + not + base verb. He <strong>did not come</strong>.</li></ul></div>
<h3>2. Past Continuous</h3>
<div class="bloc theorie"><div class="bloc-label">Grammar</div><ul><li><strong>Form</strong>: Subject + was/were + verb-ing.</li><li><strong>Use</strong>: actions in progress at a specific past moment, interrupted actions, background description.</li><li><strong>Examples</strong>: I <strong>was reading</strong> when he called. They <strong>were playing</strong> while she was cooking.</li><li><strong>Time markers</strong>: while, when, at 8 o'clock yesterday.</li><li><strong>Negative</strong>: was/were + not + verb-ing.</li></ul></div>
<h3>3. Past Perfect</h3>
<div class="bloc theorie"><div class="bloc-label">Grammar</div><ul><li><strong>Form</strong>: Subject + had + past participle.</li><li><strong>Use</strong>: an action completed before another past action.</li><li><strong>Examples</strong>: When I arrived, she <strong>had already left</strong>. He told me he <strong>had finished</strong> the work.</li><li><strong>Time markers</strong>: already, before, after, by the time.</li><li><strong>Negative</strong>: had + not + past participle.</li></ul></div>
<h3>4. Practice — EXETAT style</h3>
<div class="bloc exemple"><div class="bloc-label">Exercise</div><p><strong>Choose the correct answer:</strong></p><ol><li>I ___ TV when the phone rang. (watch / watched / was watching / had watched) → <strong>was watching</strong></li><li>She ___ her homework before she went out. (finish / finished / was finishing / had finished) → <strong>had finished</strong></li><li>They ___ to Goma last year. (go / went / were going / had gone) → <strong>went</strong></li><li>While I ___ in the garden, it started to rain. (work / worked / was working / had worked) → <strong>was working</strong></li><li>He told me that he ___ the book. (read / reads / was reading / had read) → <strong>had read</strong></li></ol><p><a href="https://www.youtube.com/results?search_query=past+simple+continuous+perfect+english+grammar" target="_blank" rel="noopener">🎥 Search: Past tenses (English grammar channels)</a></p></div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>In a career guidance class in Kinshasa, students discuss their plans: "I will study medicine." "I am going to apply for a scholarship." "I am meeting the director tomorrow." Three ways to express the future. Which one should you use?</p></div>
<h3>1. Will + base verb</h3>
<div class="bloc theorie"><div class="bloc-label">Grammar</div><ul><li><strong>Form</strong>: Subject + will + base verb.</li><li><strong>Use</strong>: spontaneous decisions, predictions, promises, offers.</li><li><strong>Examples</strong>: I <strong>will help</strong> you. It <strong>will rain</strong> tomorrow. She <strong>will be</strong> 20 next year.</li><li><strong>Negative</strong>: will + not (won't). He <strong>won't come</strong>.</li><li><strong>Question</strong>: Will + subject + base verb. <strong>Will</strong> you come?</li></ul></div>
<h3>2. Going to</h3>
<div class="bloc theorie"><div class="bloc-label">Grammar</div><ul><li><strong>Form</strong>: Subject + am/is/are + going to + base verb.</li><li><strong>Use</strong>: plans, intentions, predictions based on evidence.</li><li><strong>Examples</strong>: I <strong>am going to study</strong> law. Look at those clouds! It <strong>is going to rain</strong>.</li><li><strong>Negative</strong>: am/is/are + not + going to + verb.</li><li><strong>Question</strong>: Am/Is/Are + subject + going to + verb.</li></ul></div>
<h3>3. Present Continuous for Future</h3>
<div class="bloc theorie"><div class="bloc-label">Grammar</div><ul><li><strong>Form</strong>: Subject + am/is/are + verb-ing.</li><li><strong>Use</strong>: fixed arrangements, appointments.</li><li><strong>Examples</strong>: I <strong>am meeting</strong> the doctor tomorrow at 10. They <strong>are flying</strong> to Lubumbashi next week.</li><li><strong>Time markers</strong>: tomorrow, next week, on Monday, at 5 PM.</li><li>Distinguish from Present Continuous for now: "I am meeting" (future arrangement) vs "I am meeting him now" (in progress).</li></ul></div>
<h3>4. Practice — EXETAT style</h3>
<div class="bloc exemple"><div class="bloc-label">Exercise</div><p><strong>Choose the correct answer:</strong></p><ol><li>I think it ___ tomorrow. (rains / will rain / is going to rain / is raining) → <strong>will rain</strong></li><li>She ___ her aunt next Sunday. (visits / will visit / is visiting / visited) → <strong>is visiting</strong></li><li>Look at the sky! It ___ . (rains / will rain / is going to rain / rained) → <strong>is going to rain</strong></li><li>I promise I ___ you with your homework. (help / will help / am going to help / helped) → <strong>will help</strong></li><li>We ___ a party next week. (have / will have / are having / had) → <strong>are having</strong></li></ol><p><a href="https://www.youtube.com/results?search_query=future+tenses+will+going+to+present+continuous" target="_blank" rel="noopener">🎥 Search: Future tenses (English grammar channels)</a></p></div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>In an EXETAT exercise, a student reads: "The boy ___ briefcase is on the table has gone home." The correct answer is "whose." Many students choose "who" or "whom" and lose marks. Let's master relative pronouns.</p></div>
<h3>1. Who and Whom</h3>
<div class="bloc theorie"><div class="bloc-label">Grammar</div><ul><li><strong>Who</strong>: subject pronoun for people. The man <strong>who</strong> called you is my uncle.</li><li><strong>Whom</strong>: object pronoun for people. The woman <strong>whom</strong> I met is a doctor.</li><li>In modern English, "who" is often used instead of "whom" in informal contexts.</li><li>Preposition + whom: To <strong>whom</strong> should I address the letter?</li></ul></div>
<h3>2. Whose</h3>
<div class="bloc theorie"><div class="bloc-label">Grammar</div><ul><li><strong>Whose</strong>: possessive relative pronoun for people and things.</li><li>Examples: The boy <strong>whose</strong> briefcase is on the table has gone home. The woman <strong>whose</strong> car was stolen called the police.</li><li>Strategy: [Person] + [possessed object] = <strong>whose</strong>. Always.</li><li>Compare: The man <strong>who</strong> came is my father. (subject) / The man <strong>whose</strong> son is sick is worried. (possessive)</li></ul></div>
<h3>3. Which and That</h3>
<div class="bloc theorie"><div class="bloc-label">Grammar</div><ul><li><strong>Which</strong>: for things and animals. The book <strong>which</strong> I bought is interesting.</li><li><strong>That</strong>: for people and things in defining clauses. The house <strong>that</strong> Jack built is old.</li><li>Defining vs Non-defining: Defining clauses give essential information (no commas). Non-defining clauses give extra information (between commas).</li><li>In non-defining clauses, use "who" or "which," never "that."</li></ul></div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>In a conversation at a market in Kinshasa, a seller asks: "You want to buy this cloth, don't you?" The customer replies: "Yes, I do." The seller used a question tag. EXETAT often tests this structure.</p></div>
<h3>1. Question Tags</h3>
<div class="bloc theorie"><div class="bloc-label">Grammar</div><ul><li><strong>Definition</strong>: A short question at the end of a statement to ask for confirmation.</li><li><strong>Rule 1</strong>: If the statement is affirmative, the tag is negative. You are a student, <strong>aren't you</strong>?</li><li><strong>Rule 2</strong>: If the statement is negative, the tag is affirmative. She isn't here, <strong>is she</strong>?</li><li><strong>Rule 3</strong>: Use the auxiliary of the statement. He has finished, <strong>hasn't he</strong>?</li><li><strong>Rule 4</strong>: No auxiliary? Use do/does/did. You speak English, <strong>don't you</strong>?</li></ul></div>
<h3>2. Special Cases</h3>
<div class="bloc theorie"><div class="bloc-label">Grammar</div><ul><li>I am → aren't I? (irregular). I am right, <strong>aren't I</strong>?</li><li>Let's → shall we? Let's go, <strong>shall we</strong>?</li><li>Imperatives → will you? Open the door, <strong>will you</strong>?</li><li>There is → isn't there? There is a problem, <strong>isn't there</strong>?</li><li>Nothing/nobody → affirmative tag. Nothing happened, <strong>did it</strong>?</li></ul></div>
<h3>3. Short Answers</h3>
<div class="bloc theorie"><div class="bloc-label">Grammar</div><ul><li>Short answers use the auxiliary, not just yes/no.</li><li>"Do you like coffee?" → <strong>Yes, I do.</strong> / <strong>No, I don't.</strong></li><li>"Have you seen him?" → <strong>Yes, I have.</strong> / <strong>No, I haven't.</strong></li><li>"Will she come?" → <strong>Yes, she will.</strong> / <strong>No, she won't.</strong></li><li>Never answer just "Yes" or "No" in EXETAT multiple-choice questions.</li></ul></div>
<h3>4. Practice — EXETAT style</h3>

<h3>2. Reported Speech</h3>
<div class="bloc theorie"><div class="bloc-label">Grammar</div><ul><li><strong>Direct</strong>: He said, "I am tired." → <strong>Reported</strong>: He said that he <strong>was</strong> tired.</li><li><strong>Backshift</strong>: Present → Past. Past → Past Perfect. Will → Would. Can → Could. May → Might.</li><li><strong>Time changes</strong>: now → then. today → that day. tomorrow → the next day. yesterday → the day before.</li><li><strong>Questions</strong>: He asked, "Where do you live?" → He asked where I <strong>lived</strong>.</li><li><strong>Commands</strong>: She said, "Close the door." → She told me <strong>to close</strong> the door.</li></ul></div>

        { text:"He is afraid ___ dogs.", options:["at","of","on"], correct:1 },
        { text:"Please look ___ my bag while I am away.", options:["for","after","at"], correct:1 },
        { text:"The bridge ___ in 2010.", options:["built","was built","has built"], correct:1 },
        { text:"He said that he ___ the book.", options:["read","reads","had read"], correct:2 },
        { text:"English ___ all over the world.", options:["speaks","is spoken","spoke"], correct:1 },
        { text:"She asked me where I ___ .", options:["live","lives","lived"], correct:2 },
        { text:"The teacher told us ___ quiet.", options:["be","to be","being"], correct:1 },
        { text:"How much ___ this cloth?", options:["is","are","cost"], correct:0 }
    ];
    let html = '';
    questions.forEach((q,i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o,k) => { html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>'; });
        html += '</div>';
    });
    document.getElementById('quizQuestions').innerHTML = html;
    document.getElementById('submitQuiz').onclick = () => {
        let score = 0;
        questions.forEach((q,i) => {
            const s = document.querySelector('input[name="q' + i + '"]:checked');
            if (s && parseInt(s.value) === q.correct) score++;
        });
        const pct = Math.round(score/questions.length*100);
        document.getElementById('quizResult').innerHTML = '<div style="background:#cfdff5;padding:16px;border-radius:10px;margin-top:14px;">' +
            '<strong>Score: ' + score + '/' + questions.length + ' (' + pct + '%)</strong><br>' +
            (score === questions.length ? 'Excellent. You master the programme.' :
             score >= 21 ? 'Good. Review the lessons where you failed.' :
             'Read the lessons carefully before the exam.') + '</div>';
    };
}
function renderSlide(index, keepHighlight = true) {
    const isQuiz = (index === slides.length - 1);
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    if (isQuiz) renderQuiz();
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Lesson ' + (index+1) + ' / ' + slides.length;
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm && !isQuiz) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>
</body>
</html>
