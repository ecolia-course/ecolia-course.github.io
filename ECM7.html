<script>
const COURSE_TITLE = "Éducation Civique et Morale";
const slides = [
{
    title: "ECM 7e année — Sommaire général",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce fichier couvre le programme d'Éducation civique et morale de la 7e année de l'éducation de base. Il comprend 12 leçons progressives organisées autour de la citoyenneté, des droits et devoirs, de la vie en communauté, de la paix, de l'environnement, de la santé, des symboles nationaux, de la sécurité routière et de l'engagement citoyen.</p>
<ul>
<li>Leçon 1 — Se connaître et connaître son milieu</li>
<li>Leçon 2 — L'école et la vie en communauté</li>
<li>Leçon 3 — Les droits de l'enfant</li>
<li>Leçon 4 — Les devoirs de l'enfant</li>
<li>Leçon 5 — Démocratie et participation à l'école</li>
<li>Leçon 6 — Les valeurs morales et le civisme</li>
<li>Leçon 7 — La paix et la résolution des conflits</li>
<li>Leçon 8 — Protection de l'environnement et bien commun</li>
<li>Leçon 9 — Santé, hygiène et responsabilité collective</li>
<li>Leçon 10 — La RDC, les symboles nationaux et l'unité</li>
<li>Leçon 11 — Sécurité routière et comportement du piéton</li>
<li>Leçon 12 — Service à la communauté et engagement citoyen</li>
</ul>
<p>Une évaluation finale de 40 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programmes nationaux du ministère de l'Éducation nationale et Nouvelle Citoyenneté (RDC). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 1 : Se connaître et connaître son milieu",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À la rentrée, un nouvel élève arrive dans une classe de Kinshasa. Il doit se présenter à ses camarades et expliquer où il habite. Comment peut-il parler de lui sans se surestimer ni se sous-estimer ?</p></div>
<img alt="Élèves se présentant en classe" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/DRC%20classroom.jpg?width=700" data-image-id="ECM7_1">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Élèves en classe — Wikimedia Commons : DRC classroom.jpg (domaine public).</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>À la fin de cette leçon, l'élève doit être capable de : se présenter oralement et par écrit ; reconnaître ses qualités et ses limites ; décrire son environnement proche (famille, quartier, école) ; respecter les autres dans leur identité.</p>
</div>

<h3>2. Contenu : identité et milieu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'identité personnelle comprend le nom, l'âge, le sexe, la nationalité, la famille, la langue et les valeurs. Elle ne se confond pas avec l'origine sociale ou la richesse. Chaque personne est unique et digne de respect.</p>
<p>Le milieu est l'espace où l'on vit : la famille, le quartier ou le village, l'école, la commune, le territoire. Connaître son milieu permet de s'y repérer, d'y participer et de le protéger.</p>
<p>Vocabulaire : identité, dignité, appartenance, communauté, environnement proche.</p>
</div>
<img alt="Quartier de Kinshasa vu d'ensemble" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Kinshasa%20-%20Congo.jpg?width=700" data-image-id="ECM7_2">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Quartier de Kinshasa — Wikimedia Commons : Kinshasa - Congo.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> Mwamba se présente : « Je m'appelle Mwamba, j'ai 13 ans, j'habite à Kinshasa dans la commune de Lemba. J'aime lire et aider mes parents. »</p>
<p><strong>Contre-exemple :</strong> un élève refuse de parler de son village parce qu'il a honte. Cela nuit à son estime de soi et au respect des autres.</p>
</div>
<img alt="Élève écrivant sa présentation" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Writing%20a%20letter.jpg?width=700" data-image-id="ECM7_3">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Élève écrivant sa présentation — Wikimedia Commons : Writing a letter.jpg (CC BY-SA 3.0).</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice 1 :</strong> Rédige en cinq phrases une présentation de toi-même (nom, âge, famille, quartier, goûts).</p>
<p><strong>Corrigé :</strong> Réponse personnelle. Vérifier que l'élève cite son nom, son âge, son lieu d'habitation et au moins un centre d'intérêt.</p>
<p><strong>Exercice 2 :</strong> Cite trois éléments qui composent ton milieu proche.</p>
<p><strong>Corrigé :</strong> Par exemple : ma famille, mon quartier, mon école.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Confondre identité personnelle et origine sociale. Croire qu'une personne vaut moins parce qu'elle vient d'un village ou d'un quartier pauvre. Se moquer de la langue ou de la culture d'un camarade.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Dessine un plan simple de ton quartier ou de ton village, en indiquant ta maison, l'école et trois lieux importants (marché, église, terrain de jeu). Présente-le à la classe.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Chaque personne a une identité unique et une dignité. Connaître son milieu aide à s'y intégrer et à le protéger. Le respect de soi et des autres est la base de la vie en communauté.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'ECM (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 2 : L'école et la vie en communauté",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une salle de classe, des papiers traînent par terre et le tableau n'est pas effacé. Le professeur demande aux élèves de proposer des règles pour garder la classe propre et ordonnée. Pourquoi ces règles sont-elles utiles ?</p></div>
<img alt="Salle de classe en RDC" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/DRC%20classroom.jpg?width=700" data-image-id="ECM7_4">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Salle de classe en RDC — Wikimedia Commons : DRC classroom.jpg (domaine public).</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Expliquer l'utilité des règles collectives. Participer à leur application. Respecter les personnes et le matériel. Assumer des responsabilités dans la classe.</p>
</div>

<h3>2. Contenu : le règlement et la vie collective</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une communauté fonctionne grâce à des règles communes. À l'école, le règlement précise les droits et les devoirs de chacun : ponctualité, respect des enseignants et des camarades, entretien du matériel, propreté des locaux.</p>
<p>Les règles ne sont pas seulement des interdictions : elles permettent de vivre ensemble, de travailler dans de bonnes conditions et de protéger les plus faibles.</p>
<p>Vocabulaire : règlement, discipline, responsabilité, bien commun, respect.</p>
</div>
<img alt="Élèves participant au nettoyage de leur école" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Students%20cleaning%20school%20yard.jpg?width=700" data-image-id="ECM7_5">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Élèves nettoyant la cour — Wikimedia Commons : Students cleaning school yard.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> une classe élit un responsable chargé de vérifier la propreté chaque soir. La classe reste propre.</p>
<p><strong>Contre-exemple :</strong> un élève dit : « Je ne ramasse pas les papiers, ce n'est pas mon travail. » Il perturbe la vie collective.</p>
</div>
<img alt="Élève participant à la vie de la classe" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Book-reading-learning-letters%20(24325683575).jpg?width=700" data-image-id="ECM7_6">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Élève participant à la vie de classe — Wikimedia Commons : Book-reading-learning-letters (24325683575).jpg (CC0).</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice 1 :</strong> Cite trois règles utiles pour garder la classe propre.</p>
<p><strong>Corrigé :</strong> Par exemple : jeter les papiers dans la poubelle, effacer le tableau après usage, ranger les chaises.</p>
<p><strong>Exercice 2 :</strong> Classe ces comportements en « favorise la vie collective » ou « perturbe la vie collective » : arriver à l'heure ; bavarder pendant la leçon ; aider un camarade ; salir le mur.</p>
<p><strong>Corrigé :</strong> Favorise : arriver à l'heure, aider un camarade. Perturbe : bavarder, salir le mur.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Penser qu'une règle n'est utile que lorsqu'un adulte surveille. Croire que le règlement ne concerne que les autres. Refuser de participer à l'entretien des locaux.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Avec ta classe, rédige trois règles pour améliorer la propreté et le respect dans la salle. Affiche-les au mur.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les règles collectives permettent de vivre ensemble et de protéger le bien commun. Chacun doit participer à leur application. Le respect des personnes et du matériel est une responsabilité partagée.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'ECM (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 3 : Les droits de l'enfant",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une école, une élève est exclue d'une activité sportive parce qu'elle vient d'un village. Ses camarades protestent. Quels droits sont bafoués dans cette situation ?</p></div>
<img alt="Enfants jouant ensemble à l'école" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Children%20playing%20together.jpg?width=700" data-image-id="ECM7_7">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Enfants jouant ensemble — Wikimedia Commons : Children playing together.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Reconnaître les principaux droits de l'enfant. Comprendre pourquoi ils doivent être protégés. Identifier les situations où un droit est violé.</p>
</div>

<h3>2. Contenu : les droits fondamentaux</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La Convention internationale des droits de l'enfant reconnaît plusieurs droits fondamentaux : le droit à l'identité, à l'éducation, à la santé, à la protection contre la violence et l'exploitation, à l'expression, à la non-discrimination et à l'intérêt supérieur de l'enfant.</p>
<p>Ces droits sont universels : ils s'appliquent à tous les enfants, filles et garçons, sans distinction de race, de religion, d'origine ou de condition sociale.</p>
<p>Vocabulaire : droit, convention, non-discrimination, intérêt supérieur, protection.</p>
</div>
<img alt="Enfants en classe apprenant leurs droits" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Children%20in%20classroom%20in%20Africa.jpg?width=700" data-image-id="ECM7_8">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Enfants en classe — Wikimedia Commons : Children in classroom in Africa.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> une école organise une campagne de vaccination gratuite pour tous les élèves. Le droit à la santé est respecté.</p>
<p><strong>Contre-exemple :</strong> un enfant est obligé de travailler au marché au lieu d'aller à l'école. Ses droits à l'éducation et à la protection sont violés.</p>
</div>
<img alt="Campagne de vaccination pour enfants" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Vaccination%20in%20Africa.jpg?width=700" data-image-id="ECM7_9">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Campagne de vaccination — Wikimedia Commons : Vaccination in Africa.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice 1 :</strong> Associe chaque situation au droit concerné : (a) Un enfant malade ne peut pas voir un médecin. (b) Une fille est empêchée d'aller à l'école. (c) Un enfant est battu par un adulte.</p>
<p><strong>Corrigé :</strong> (a) droit à la santé ; (b) droit à l'éducation ; (c) droit à la protection contre la violence.</p>
<p><strong>Exercice 2 :</strong> Pourquoi un droit ne permet-il pas de porter atteinte aux droits des autres ?</p>
<p><strong>Corrigé :</strong> Parce que les droits sont limités par le respect des droits d'autrui et par l'ordre public.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Croire qu'un droit autorise à faire n'importe quoi. Penser que les droits de l'enfant ne concernent que les adultes. Ignorer la non-discrimination.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>En groupe, choisissez trois droits de l'enfant et proposez une action concrète pour les faire respecter dans votre école.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les droits de l'enfant protègent son identité, son éducation, sa santé, sa sécurité et son expression. Ils sont universels et doivent être respectés par tous. Un droit s'exerce dans le respect des droits des autres.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'ECM (MEPST/DIPROMAD). Convention internationale des droits de l'enfant. Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 4 : Les devoirs de l'enfant",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un travail de groupe, certains élèves ne font rien et laissent les autres travailler. Le professeur rappelle que chaque droit s'accompagne de devoirs. Quels sont les devoirs d'un élève ?</p></div>
<img alt="Élèves travaillant en groupe" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Group%20work%20in%20class.jpg?width=700" data-image-id="ECM7_10">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Élèves travaillant en groupe — Wikimedia Commons : Group work in class.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Distinguer les droits des responsabilités. Accomplir ses devoirs à la maison et à l'école. Respecter les autres et le bien commun.</p>
</div>

<h3>2. Contenu : droits et devoirs</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>À chaque droit correspond un devoir. Par exemple : le droit à l'éducation implique le devoir d'étudier et de respecter l'école ; le droit à la santé implique le devoir d'hygiène ; le droit à l'expression implique le devoir d'écouter les autres.</p>
<p>Les devoirs de l'enfant comprennent : respecter ses parents et ses enseignants, participer aux tâches familiales adaptées à son âge, faire ses devoirs scolaires, protéger le bien commun, respecter les règles.</p>
<p>Vocabulaire : devoir, responsabilité, effort, respect, bien commun.</p>
</div>
<img alt="Enfant aidant aux tâches familiales" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Child%20helping%20at%20home.jpg?width=700" data-image-id="ECM7_11">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Enfant aidant aux tâches familiales — Wikimedia Commons : Child helping at home.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> une élève fait ses devoirs chaque soir et aide sa mère à ranger la maison. Elle assume ses responsabilités.</p>
<p><strong>Contre-exemple :</strong> un élève laisse ses déchets par terre en disant : « Ce n'est pas mon problème. » Il ne respecte pas le bien commun.</p>
</div>
<img alt="Élève faisant ses devoirs" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Student%20doing%20homework.jpg?width=700" data-image-id="ECM7_12">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Élève faisant ses devoirs — Wikimedia Commons : Student doing homework.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice 1 :</strong> Complète le tableau : droit à l'éducation -> devoir ... ; droit à la santé -> devoir ... ; droit à l'expression -> devoir ...</p>
<p><strong>Corrigé :</strong> droit à l'éducation -> devoir d'étudier ; droit à la santé -> devoir d'hygiène ; droit à l'expression -> devoir d'écouter.</p>
<p><strong>Exercice 2 :</strong> Cite deux devoirs d'un élève envers sa classe.</p>
<p><strong>Corrigé :</strong> Par exemple : respecter le matériel, participer au nettoyage.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Présenter les devoirs comme une justification des mauvais traitements. Croire que les devoirs concernent seulement les adultes. Utiliser les devoirs pour priver un enfant de ses droits.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Écris trois devoirs que tu accomplis chaque semaine à la maison ou à l'école. Explique pourquoi ils sont importants.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les droits et les devoirs sont liés. Accomplir ses devoirs permet de respecter les droits des autres et de protéger le bien commun. Les devoirs de l'enfant sont adaptés à son âge et à ses capacités.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'ECM (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 5 : Démocratie et participation à l'école",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>La classe doit élire un délégué. Certains élèves veulent voter pour leur ami, d'autres proposent un candidat sérieux. Comment organiser une élection juste ?</p></div>
<img alt="Urne de vote pour une élection" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Ballot%20box.jpg?width=700" data-image-id="ECM7_13">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Urne de vote — Wikimedia Commons : Ballot box.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre la participation, l'élection et la prise de décision collective. Organiser un vote transparent. Respecter la majorité et écouter les minorités.</p>
</div>

<h3>2. Contenu : la démocratie à l'école</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La démocratie est un mode d'organisation où les décisions sont prises par les membres concernés, souvent par vote. À l'école, on peut élire un délégué de classe, voter pour un projet, débattre d'une règle.</p>
<p>Une élection juste suppose : des candidats qui se présentent librement, un vote secret, une majorité qui décide, le respect des minorités, la reddition de comptes.</p>
<p>Vocabulaire : élection, vote, majorité, minorité, débat, transparence.</p>
</div>
<img alt="Débat en classe entre élèves" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Classroom%20discussion.jpg?width=700" data-image-id="ECM7_14">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Débat en classe — Wikimedia Commons : Classroom discussion.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> la classe organise un débat, puis un vote à bulletin secret. Le délégué élu remercie ses camarades et promet de travailler pour tous.</p>
<p><strong>Contre-exemple :</strong> un groupe impose son candidat par la force. Ce n'est pas une élection démocratique.</p>
</div>
<img alt="Élèves votant en classe" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Students%20voting.jpg?width=700" data-image-id="ECM7_15">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Élèves votant — Wikimedia Commons : Students voting.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice 1 :</strong> Cite trois étapes d'un vote transparent.</p>
<p><strong>Corrigé :</strong> Par exemple : présentation des candidats, vote à bulletin secret, dépouillement public.</p>
<p><strong>Exercice 2 :</strong> Pourquoi doit-on écouter la minorité après un vote ?</p>
<p><strong>Corrigé :</strong> Parce que la démocratie protège aussi les droits de ceux qui n'ont pas gagné.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Confondre majorité et droit d'imposer n'importe quelle décision. Croire que la minorité n'a aucun droit. Penser qu'un vote suffit à tout régler sans débat.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Organisez une élection fictive de délégué dans la classe. Préparez les bulletins, une urne et un dépouillement public.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La démocratie repose sur la participation, le vote et le respect des minorités. Une élection juste est libre, transparente et acceptée par tous. La majorité décide mais ne doit pas écraser la minorité.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'ECM (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 6 : Les valeurs morales et le civisme",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Au marché, un élève trouve un portefeuille contenant de l'argent. Il hésite : le garder ou le rendre ? Sa décision dépend de ses valeurs morales.</p></div>
<img alt="Marché africain animé" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Kisangani%20Market.jpg?width=700" data-image-id="ECM7_16">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Marché africain animé — Wikimedia Commons : Kisangani Market.jpg (domaine public).</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Reconnaître les principales valeurs morales. Les mettre en pratique dans la vie quotidienne. Distinguer le civisme de l'obéissance aveugle.</p>
</div>

<h3>2. Contenu : les valeurs essentielles</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les valeurs morales sont des principes qui guident nos actions : honnêteté, respect, responsabilité, courage, solidarité, justice, ponctualité, tolérance.</p>
<p>Le civisme est le comportement d'un bon citoyen : il respecte les lois, les personnes et le bien public, et participe à la vie de la communauté. Le civisme n'est pas une obéissance aveugle : il implique aussi le sens critique et la défense de la justice.</p>
<p>Vocabulaire : valeur, morale, civisme, honnêteté, solidarité, justice.</p>
</div>
<img alt="Poignée de main symbolisant la solidarité" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Handshake%20icon.svg?width=700" data-image-id="ECM7_17">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Poignée de main, symbole de solidarité — Wikimedia Commons : Handshake icon.svg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> un élève rend le portefeuille à son propriétaire. Il fait preuve d'honnêteté et de civisme.</p>
<p><strong>Contre-exemple :</strong> un passager refuse de céder sa place à une personne âgée dans un bus. Il manque de solidarité.</p>
</div>
<img alt="Transport en commun en Afrique" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Public%20transport%20in%20Africa.jpg?width=700" data-image-id="ECM7_18">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Transport en commun — Wikimedia Commons : Public transport in Africa.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice 1 :</strong> Associe chaque situation à une valeur : (a) aider un camarade en difficulté ; (b) dire la vérité même si c'est difficile ; (c) arriver à l'heure à l'école.</p>
<p><strong>Corrigé :</strong> (a) solidarité ; (b) honnêteté ; (c) ponctualité.</p>
<p><strong>Exercice 2 :</strong> Explique pourquoi le civisme n'est pas une obéissance aveugle.</p>
<p><strong>Corrigé :</strong> Parce qu'un bon citoyen peut refuser d'obéir à un ordre injuste ou contraire au bien commun.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Confondre civisme et obéissance aveugle. Croire que les valeurs morales ne concernent que les autres. Penser que la fin justifie les moyens.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Cite une valeur morale que tu admires chez une personne de ton entourage. Explique pourquoi.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les valeurs morales guident nos actions. Le civisme est le comportement d'un bon citoyen, respectueux des autres et du bien commun. Le civisme n'exclut pas le sens critique.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'ECM (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 7 : La paix et la résolution des conflits",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Deux groupes d'élèves se disputent l'utilisation du terrain de jeu. Les insultes fusent. Comment résoudre ce conflit sans violence ?</p></div>
<img alt="Cour d'école où un conflit peut survenir" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/School%20yard%20in%20Africa.jpg?width=700" data-image-id="ECM7_19">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Cour d'école — Wikimedia Commons : School yard in Africa.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Reconnaître les causes d'un conflit. Proposer une résolution pacifique. Écouter, dialoguer, tolérer et refuser la violence.</p>
</div>

<h3>2. Contenu : résolution pacifique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un conflit naît d'un désaccord, d'un intérêt opposé, d'un malentendu ou d'une injustice. Pour le résoudre pacifiquement, on peut : écouter l'autre, exprimer son point de vue sans insulter, chercher un compromis, demander la médiation d'un adulte ou d'un pair.</p>
<p>La paix ne signifie pas accepter l'injustice. Elle signifie trouver une solution qui respecte les droits de chacun.</p>
<p>Vocabulaire : conflit, médiation, compromis, tolérance, non-violence.</p>
</div>
<img alt="Symbole de la paix" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Peace%20symbol.svg?width=700" data-image-id="ECM7_20">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Symbole de la paix — Wikimedia Commons : Peace symbol.svg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> deux équipes décident de partager le terrain : une équipe joue le matin, l'autre l'après-midi.</p>
<p><strong>Contre-exemple :</strong> un élève frappe son camarade pour régler un différend. La violence aggrave le conflit.</p>
</div>
<img alt="Poignée de main entre élèves après un jeu" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Handshake%20between%20students.jpg?width=700" data-image-id="ECM7_21">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Poignée de main entre élèves — Wikimedia Commons : Handshake between students.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice 1 :</strong> Cite trois attitudes qui favorisent la paix.</p>
<p><strong>Corrigé :</strong> Par exemple : écouter, dialoguer, proposer un compromis.</p>
<p><strong>Exercice 2 :</strong> Pourquoi la paix ne signifie-t-elle pas toujours accepter l'injustice ?</p>
<p><strong>Corrigé :</strong> Parce qu'une paix juste exige le respect des droits de chacun ; accepter l'injustice ne fait que reporter le conflit.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Croire que faire la paix signifie toujours accepter une injustice. Penser que la violence règle les problèmes. Refuser le dialogue.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Imagine un conflit dans ta classe. Propose une solution pacifique qui respecte les besoins de chacun.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La paix se construit par le dialogue, l'écoute et le compromis. La non-violence est une valeur essentielle. Résoudre un conflit ne signifie pas accepter l'injustice.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'ECM (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 8 : Protection de l'environnement et bien commun",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une cour d'école, des déchets plastiques s'accumulent. Un élève propose d'organiser une journée de nettoyage. Pourquoi est-ce important pour tous ?</p></div>
<img alt="Déchets plastiques dans une cour d'école" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Plastic%20waste%20in%20Africa.jpg?width=700" data-image-id="ECM7_22">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Déchets plastiques — Wikimedia Commons : Plastic waste in Africa.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Protéger les biens collectifs. Adopter des gestes responsables. Comprendre que les biens publics appartiennent à tous.</p>
</div>

<h3>2. Contenu : le bien commun</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le bien commun désigne tout ce qui appartient à la collectivité et sert à tous : l'eau, l'air, les routes, les écoles, les hôpitaux, les marchés, les espaces verts. Chacun a le devoir de le protéger.</p>
<p>Les gestes responsables : jeter les déchets dans une poubelle, économiser l'eau, ne pas polluer les rivières, entretenir les équipements publics, planter des arbres.</p>
<p>Vocabulaire : bien commun, environnement, pollution, recyclage, propreté.</p>
</div>
<img alt="Élèves ramassant des déchets dans la cour" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Students%20cleaning%20school%20yard.jpg?width=700" data-image-id="ECM7_23">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Élèves ramassant des déchets — Wikimedia Commons : Students cleaning school yard.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> une classe organise une campagne de propreté et installe des poubelles dans la cour.</p>
<p><strong>Contre-exemple :</strong> un élève jette une bouteille en plastique dans la rivière. Il pollue l'eau utilisée par d'autres.</p>
</div>
<img alt="Poubelle installée dans un espace public" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Waste%20bin.jpg?width=700" data-image-id="ECM7_24">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Poubelle dans un espace public — Wikimedia Commons : Waste bin.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice 1 :</strong> Cite trois gestes qui protègent l'environnement.</p>
<p><strong>Corrigé :</strong> Par exemple : jeter les déchets dans une poubelle, planter un arbre, économiser l'eau.</p>
<p><strong>Exercice 2 :</strong> Pourquoi les biens publics appartiennent-ils à tout le monde ?</p>
<p><strong>Corrigé :</strong> Parce qu'ils sont financés par la collectivité et servent à tous les citoyens.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Croire que les biens publics n'appartiennent à personne. Penser que l'environnement est seulement l'affaire de l'État. Négliger la propreté des lieux communs.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Avec ta classe, organise une journée de nettoyage dans la cour de l'école. Répartissez les tâches et notez les résultats.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le bien commun appartient à tous et doit être protégé par chacun. Les gestes responsables (propreté, économie d'eau, reboisement) protègent l'environnement et la santé de tous.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'ECM (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>

    title: "Leçon 9 : Santé, hygiène et responsabilité collective",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une école, les latrines ne sont pas nettoyées et l'eau potable manque. Des élèves tombent malades. Que peut faire la communauté scolaire ?</p></div>
<img alt="Point d'eau dans une école en Afrique" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Water%20point%20in%20school.jpg?width=700" data-image-id="ECM7_25">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Point d'eau dans une école — Wikimedia Commons : Water point in school.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Appliquer les règles d'hygiène. Comprendre leur importance pour la santé collective. Participer à l'assainissement des lieux communs.</p>
</div>

<h3>2. Contenu : hygiène et santé</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'hygiène comprend : le lavage des mains à l'eau et au savon, l'usage d'une eau propre, l'entretien des latrines, la propreté des salles et des cours, la gestion des déchets.</p>
<p>La santé collective est la responsabilité de tous. Une communauté qui néglige l'hygiène favorise les maladies (diarrhées, choléra, typhoïde).</p>
<p>Vocabulaire : hygiène, assainissement, eau potable, maladie hydrique, prévention.</p>
</div>
<img alt="Dispositif de lavage des mains à l'école" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Handwashing%20station.jpg?width=700" data-image-id="ECM7_26">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Lavage des mains à l'école — Wikimedia Commons : Handwashing station.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> une école installe des dispositifs de lavage des mains et organise une rotation pour nettoyer les latrines.</p>
<p><strong>Contre-exemple :</strong> des élèves urinent près du point d'eau. Ils contaminent l'eau utilisée par tous.</p>
</div>
<img alt="Latrines scolaires entretenues" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/School%20latrines.jpg?width=700" data-image-id="ECM7_27">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Latrines scolaires — Wikimedia Commons : School latrines.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice 1 :</strong> Cite trois règles d'hygiène à respecter à l'école.</p>
<p><strong>Corrigé :</strong> Par exemple : se laver les mains avant de manger, jeter les déchets à la poubelle, nettoyer les latrines.</p>
<p><strong>Exercice 2 :</strong> Pourquoi la santé collective n'est-elle pas seulement l'affaire des agents de santé ?</p>
<p><strong>Corrigé :</strong> Parce que chacun, par ses gestes quotidiens, peut prévenir ou propager les maladies.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Considérer la santé collective comme la seule responsabilité des agents de santé. Négliger le lavage des mains. Utiliser une eau non potable sans la traiter.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Propose un plan pour améliorer l'hygiène dans ta classe : lavage des mains, propreté des latrines, gestion des déchets.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'hygiène est une responsabilité collective. Les gestes simples (lavage des mains, eau propre, propreté) protègent la santé de tous. Une communauté qui néglige l'hygiène favorise les maladies.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'ECM (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 10 : La RDC, les symboles nationaux et l'unité",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Lors d'une cérémonie scolaire, on hisse le drapeau et on chante l'hymne national. Un élève se demande pourquoi ces symboles sont importants pour tous les Congolais.</p></div>
<img alt="Drapeau de la République démocratique du Congo" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Flag%20of%20the%20Democratic%20Republic%20of%20the%20Congo.svg?width=700" data-image-id="ECM7_28">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Drapeau de la RDC — Wikimedia Commons : Flag of the Democratic Republic of the Congo.svg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Identifier les principaux symboles nationaux. Expliquer leur rôle. Comprendre l'unité nationale dans la diversité.</p>
</div>

<h3>2. Contenu : symboles et unité</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les symboles nationaux de la RDC comprennent : le drapeau (bleu ciel, étoile jaune, bande rouge), l'hymne national (« Debout Congolais »), la devise (« Justice, Paix, Travail »), les armoiries et le sceau.</p>
<p>Respecter ces symboles, c'est honorer la nation et son histoire. L'unité nationale ne signifie pas l'uniformité : la RDC est riche de plusieurs centaines de langues et de cultures. L'unité se construit dans le respect de cette diversité.</p>
<p>Vocabulaire : symbole, hymne, devise, unité, diversité, citoyenneté.</p>
</div>
<img alt="Armoiries de la RDC" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Coat%20of%20arms%20of%20the%20Democratic%20Republic%20of%20the%20Congo.svg?width=700" data-image-id="ECM7_29">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Armoiries de la RDC — Wikimedia Commons : Coat of arms of the Democratic Republic of the Congo.svg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> des élèves venus de provinces différentes travaillent ensemble sur un projet. Ils utilisent le français comme langue commune tout en respectant leurs langues d'origine.</p>
<p><strong>Contre-exemple :</strong> un élève se moque de la langue d'un camarade venu d'une autre région. Il menace l'unité nationale.</p>
</div>
<img alt="Élèves de différentes origines travaillant ensemble" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/School%20children%20in%20DRC.jpg?width=700" data-image-id="ECM7_30">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Élèves travaillant ensemble — Wikimedia Commons : School children in DRC.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice 1 :</strong> Cite trois symboles nationaux de la RDC.</p>
<p><strong>Corrigé :</strong> Le drapeau, l'hymne national, la devise.</p>
<p><strong>Exercice 2 :</strong> Pourquoi l'unité nationale ne signifie-t-elle pas l'uniformité ?</p>
<p><strong>Corrigé :</strong> Parce que la RDC est composée de nombreuses cultures et langues qui doivent être respectées.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Assimiler unité nationale et uniformité des langues ou des cultures. Manquer de respect aux symboles nationaux. Rejeter les personnes d'autres régions.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Dessine le drapeau de la RDC et explique la signification de ses couleurs. Propose une action qui favorise l'unité dans ta classe.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les symboles nationaux (drapeau, hymne, devise) représentent la nation et méritent le respect. L'unité nationale se construit dans le respect de la diversité culturelle et linguistique.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'ECM (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 11 : Sécurité routière et comportement du piéton",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Chaque matin, des élèves traversent une route très fréquentée pour aller à l'école. Un accident a failli se produire. Comment traverser en sécurité ?</p></div>
<img alt="Rue animée à Kinshasa" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Street%20in%20Kinshasa.jpg?width=700" data-image-id="ECM7_31">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Rue animée à Kinshasa — Wikimedia Commons : Street in Kinshasa.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Reconnaître les dangers de la circulation. Adopter des comportements prudents. Respecter les autres usagers de la route.</p>
</div>

<h3>2. Contenu : le code du piéton</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le piéton doit : marcher sur le trottoir ou à défaut sur le bord de la route ; traverser au passage piéton ; regarder à gauche, puis à droite, puis à nouveau à gauche avant de traverser ; respecter les feux de circulation ; ne pas jouer sur la chaussée.</p>
<p>Les panneaux courants : passage piéton, stop, sens interdit, limitation de vitesse, école.</p>
<p>Vocabulaire : trottoir, passage piéton, feu tricolore, panneau, usager, prudence.</p>
</div>
<img alt="Panneau signalant un passage piéton" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Pedestrian%20crossing%20sign.svg?width=700" data-image-id="ECM7_32">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Panneau de passage piéton — Wikimedia Commons : Pedestrian crossing sign.svg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> un élève attend que le feu piéton soit vert, regarde des deux côtés et traverse calmement.</p>
<p><strong>Contre-exemple :</strong> un élève traverse en courant entre deux voitures. Il met sa vie en danger.</p>
</div>
<img alt="Feu de circulation pour piétons" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Traffic%20light%20for%20pedestrians.jpg?width=700" data-image-id="ECM7_33">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Feu pour piétons — Wikimedia Commons : Traffic light for pedestrians.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice 1 :</strong> Cite trois règles de sécurité pour le piéton.</p>
<p><strong>Corrigé :</strong> Par exemple : traverser au passage piéton, regarder des deux côtés, respecter les feux.</p>
<p><strong>Exercice 2 :</strong> Pourquoi un passage piéton ne garantit-il pas à lui seul la sécurité ?</p>
<p><strong>Corrigé :</strong> Parce qu'il faut aussi vérifier que les véhicules se sont arrêtés et rester attentif.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Supposer qu'un passage piéton garantit à lui seul la sécurité. Traverser en courant ou en regardant son téléphone. Jouer sur la chaussée.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Observe la route près de ton école. Identifie les dangers et propose un itinéraire plus sûr pour les élèves.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le piéton doit être prudent : trottoir, passage piéton, respect des feux et des panneaux. Un passage piéton ne dispense pas de la vigilance. La sécurité routière est l'affaire de tous.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'ECM (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `

{
    title: "Leçon 12 : Service à la communauté et engagement citoyen",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une classe décide d'organiser une campagne de propreté et de solidarité dans son quartier. Comment planifier cette action pour qu'elle ait un résultat concret ?</p></div>
<img alt="Jeunes participant à une action communautaire de nettoyage" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Community%20cleanup.jpg?width=700" data-image-id="ECM7_34">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Action communautaire de nettoyage — Wikimedia Commons : Community cleanup.jpg.</p>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Concevoir une action collective simple. Évaluer son utilité. Assumer des responsabilités dans un projet.</p>
</div>

<h3>2. Contenu : l'engagement citoyen</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'engagement citoyen consiste à agir pour améliorer la vie de la communauté : entraide, bénévolat, participation à des projets scolaires, protection du bien commun, solidarité envers les plus vulnérables.</p>
<p>Un mini-projet doit préciser : l'objectif, les tâches, le matériel, les responsables, le calendrier et le résultat attendu.</p>
<p>Vocabulaire : engagement, bénévolat, solidarité, initiative, projet, responsabilité.</p>
</div>
<img alt="Projet communautaire de jardinage" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Community%20garden%20project.jpg?width=700" data-image-id="ECM7_35">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Projet communautaire — Wikimedia Commons : Community garden project.jpg.</p>

<h3>3. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> la classe organise une collecte de fournitures pour les élèves défavorisés. Un planning est établi et les résultats sont présentés à la fin du mois.</p>
<p><strong>Contre-exemple :</strong> un groupe annonce une action mais ne fait rien. L'engagement reste symbolique et sans effet.</p>
</div>
<img alt="Collecte de fournitures scolaires" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/School%20supply%20donation.jpg?width=700" data-image-id="ECM7_36">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Collecte de fournitures scolaires — Wikimedia Commons : School supply donation.jpg.</p>

<h3>4. Exercices d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice 1 :</strong> Cite trois éléments d'un mini-projet citoyen.</p>
<p><strong>Corrigé :</strong> Par exemple : objectif, tâches, responsables.</p>
<p><strong>Exercice 2 :</strong> Pourquoi un engagement citoyen doit-il avoir un résultat concret ?</p>
<p><strong>Corrigé :</strong> Parce que l'objectif est d'améliorer réellement la vie de la communauté, pas seulement de faire semblant.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Confondre engagement citoyen et action symbolique sans résultat. Ne pas respecter les engagements pris. Travailler seul sans associer les autres.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>En groupe, préparez un mini-projet citoyen pour votre école ou votre quartier. Présentez-le à la classe.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'engagement citoyen consiste à agir concrètement pour la communauté. Un mini-projet précise objectif, tâches, matériel, responsables et résultats attendus. L'action doit produire un résultat vérifiable.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'ECM (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},

let currentSlide = 0;
let lastSearchTerm = "", searchResults = [], currentResultIdx = -1;
const contentDiv = document.getElementById('content');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const slideCounterSpan = document.getElementById('slideCounter');
const progressFill = document.getElementById('progressFill');
const counterSpan = document.getElementById('counter');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchNav = document.getElementById('searchNav');
const prevResultBtn = document.getElementById('prevResultBtn');
const nextResultBtn = document.getElementById('nextResultBtn');
const resultCounterSpan = document.getElementById('resultCounter');
const pageTitle = document.getElementById('pageTitle');
pageTitle.textContent = "ECOLIA · " + COURSE_TITLE;
document.title = "ECOLIA — " + COURSE_TITLE;
function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';
    slideCounterSpan.textContent = '0/0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>
