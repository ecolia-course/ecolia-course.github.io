<h2>Qu'est-ce que la littérature ?</h2>
<p>Définir la littérature, distinguer les genres, comprendre la spécificité de la littérature orale.</p>

<li>Leçon 1 — Définition et fonctions de la littérature</li>

{
    title: "Leçon 1 — Définition et fonctions de la littérature",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi raconte-t-on des histoires ? Pourquoi chante-t-on ? Pourquoi lit-on des romans ? La littérature répond à ces besoins. »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir la littérature. Distinguer littérature et simple information. Identifier les fonctions de la littérature. Prérequis : aucun.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>littérature</strong> est l'ensemble des œuvres écrites ou orales qui utilisent le langage de manière esthétique pour exprimer des idées, des émotions, des expériences et des visions du monde. Elle se distingue du simple message informatif : elle travaille la forme, les images, le rythme, les sonorités.</p>
<p><strong>Fonctions :</strong> raconter (fiction), transmettre des valeurs (morale), dénoncer (engagement), divertir (plaisir), consoler, interroger le monde, construire une identité.</p>
<p>La littérature peut être <strong>orale</strong> (contes, épopées, chants, proverbes) ou <strong>écrite</strong> (romans, poèmes, pièces de théâtre, nouvelles).</p>
</div>
<img src="images/LitteratureModerne1_1.jpg" alt="Livres et plume d'écrivain" data-image-id="LitteratureModerne1_1" onerror="this.style.display='none'">

<h3>3. Méthodes et repères</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour reconnaître un texte littéraire : observer le travail de la langue (images, rythme, sonorités), la présence de personnages, d'une intrigue, d'émotions. La littérature n'est pas réservée aux « grands auteurs » : les contes, les chansons, les proverbes sont aussi de la littérature.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un conte congolais sur la tortue et le lièvre est un texte littéraire : il raconte une histoire, utilise des images, transmet une morale. Un article de journal qui rapporte le même événement est informatif. La littérature transforme le réel par l'imaginaire et le style.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis la littérature en une phrase.</p>
<p><strong>Ex. 2 :</strong> Cite trois fonctions de la littérature.</p>
<details><summary>Corrigé</summary>
<p>1) La littérature est l'ensemble des œuvres qui utilisent le langage de manière esthétique pour exprimer des idées et des émotions. 2) Raconter, dénoncer, divertir (3 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La littérature est un art du langage qui remplit des fonctions multiples ; elle existe sous forme orale et écrite.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Français (EDIDEPS).</div>
    `
},
{
    title: "Leçon 2 — Les grands genres littéraires",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un roman, un poème, une pièce de théâtre, une nouvelle : qu'est-ce qui les distingue ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Distinguer les grands genres. Associer chaque genre à ses caractéristiques. Reconnaître un genre à partir d'un extrait. Prérequis : leçon 1.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<ul>
<li><strong>Roman :</strong> récit long en prose, avec des personnages, une intrigue, un cadre.</li>
<li><strong>Nouvelle :</strong> récit court, avec peu de personnages et une chute.</li>
<li><strong>Poésie :</strong> texte en vers ou en prose poétique, qui travaille le rythme, les sonorités, les images.</li>
<li><strong>Théâtre :</strong> texte destiné à être joué, composé de dialogues et de didascalies.</li>
<li><strong>Essai :</strong> texte argumentatif qui défend une idée.</li>
<li><strong>Fable :</strong> court récit avec une morale, souvent avec des animaux.</li>
</ul>
</div>
<img src="images/LitteratureModerne1_2.jpg" alt="Les genres littéraires" data-image-id="LitteratureModerne1_2" onerror="this.style.display='none'">

<h3>3. Méthodes et repères</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour identifier un genre : observer la forme (prose/vers, dialogue/récit), la longueur, la destination (lecture/représentation), le contenu (fiction/argumentation).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><em>Ngando le crocodile</em> de Paul Lomami Tshibanda est un roman. <em>Esanzo : chant pour mon pays</em> d'Antoine-Roger Bolamba est un recueil de poèmes. Une pièce de théâtre congolaise se joue sur scène avec des acteurs.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite quatre genres littéraires.</p>
<p><strong>Ex. 2 :</strong> Quelle est la différence entre un roman et une nouvelle ?</p>
<details><summary>Corrigé</summary>
<p>1) Roman, poésie, théâtre, nouvelle (4 au choix). 2) Le roman est long, la nouvelle est courte.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les genres littéraires se distinguent par leur forme, leur longueur et leur destination ; les reconnaître aide à mieux lire.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Français (EDIDEPS).</div>
    `
},
{
    title: "Leçon 3 — La littérature orale et les traditions congolaises",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Avant l'écriture, comment transmettait-on les histoires, les valeurs, les savoirs ? Les contes, les proverbes, les chants sont-ils de la littérature ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir la littérature orale. Identifier les formes de la littérature orale congolaise. Comprendre son rôle social. Prérequis : leçons 1 et 2.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>littérature orale</strong> est l'ensemble des œuvres transmises par la parole, de génération en génération. Elle comprend :</p>
<ul>
<li><strong>Contes :</strong> récits imaginaires avec des personnages, une morale.</li>
<li><strong>Proverbes :</strong> courtes formules de sagesse.</li>
<li><strong>Devinettes :</strong> jeux de langage.</li>
<li><strong>Chants :</strong> poèmes chantés, souvent liés aux rites, aux travaux, aux fêtes.</li>
<li><strong>Épopées et mythes :</strong> récits fondateurs.</li>
</ul>
<p>Au Congo, la littérature orale est vivante : elle se pratique dans les familles, les villages, les écoles, les églises, les médias.</p>
</div>
<img src="images/LitteratureModerne1_3.jpg" alt="Conteur africain (griot)" data-image-id="LitteratureModerne1_3" onerror="this.style.display='none'">
<img src="images/LitteratureModerne1_15.jpg" alt="Proverbes africains" data-image-id="LitteratureModerne1_15" onerror="this.style.display='none'">

<h3>3. Méthodes et repères</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour analyser un conte : identifier les personnages, l'intrigue, le cadre, la morale, les procédés (répétitions, images). Pour un proverbe : identifier l'image, le sens littéral et le sens figuré, la leçon.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Le conte de la tortue et du lièvre apprend la patience et l'intelligence. Le proverbe « L'union fait la force » transmet une valeur de solidarité. Un chant de travail rythme l'effort collectif.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois formes de littérature orale.</p>
<p><strong>Ex. 2 :</strong> Quelle est la fonction d'un proverbe ?</p>
<details><summary>Corrigé</summary>
<p>1) Conte, proverbe, chant (3 au choix). 2) Transmettre une sagesse, une leçon de vie.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La littérature orale est une forme littéraire à part entière, vivante et porteuse de valeurs.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Français (EDIDEPS).</div>
    `
},

{
    title: "Leçon 4 — La naissance de la littérature écrite congolaise",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Quand les Congolais ont-ils commencé à écrire des œuvres littéraires en français ? Qu'est-ce qui a favorisé cette naissance ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Situer les débuts de la littérature écrite congolaise. Identifier les facteurs de son émergence. Citer les premiers auteurs. Prérequis : leçon 3.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La littérature écrite congolaise d'expression française naît au XXe siècle, dans un contexte colonial puis postcolonial.</p>
<p><strong>Facteurs d'émergence :</strong> la scolarisation en français, la création de revues (<em>La Voix du Congolais</em>, 1945), les concours littéraires, les maisons d'édition, l'influence de la littérature négro-africaine et de la négritude.</p>
<p><strong>Premiers auteurs :</strong> Antoine-Roger Bolamba (poésie, journalisme), Paul Lomami Tshibanda (<em>Ngando le crocodile</em>, 1948), Zamenga Batukezanga (récits, à partir des années 1970).</p>
</div>
<img src="images/LitteratureModerne1_4.jpg" alt="La Voix du Congolais, 1945" data-image-id="LitteratureModerne1_4" onerror="this.style.display='none'">
<img src="images/LitteratureModerne1_16.jpg" alt="Bibliothèque" data-image-id="LitteratureModerne1_16" onerror="this.style.display='none'">

<h3>3. Méthodes et repères</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Situer les auteurs dans leur contexte historique : colonisation (avant 1960), indépendance (1960), période contemporaine. Comprendre que la littérature congolaise est jeune mais dynamique.</p>

      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
