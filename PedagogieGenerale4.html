            <p>La pédagogie est la <strong>science et l'art de l'éducation</strong> : elle étudie les processus d'enseignement-apprentissage et les méthodes pour les optimiser.</p>

            <ul>
                <li><strong>Gaston Mialaret :</strong> art d'éduquer et d'orienter l'évolution d'un enfant vers des objectifs déterminés.</li>
                <li><strong>John Dewey :</strong> science de l'éducation.</li>
                <li><strong>Émile Durkheim :</strong> technique de l'éducation.</li>

            <h3>Rapports avec les autres sciences</h3>

":[["fr","Leçon 1, Qu'est-ce que la pédagogie? Situation de départ. Un instituteur explique, corrige, encourage, organise sa classe. Un autre se contente de faire réciter. Lequel fait œuvre de pédagogie? Pourquoi? Fondements théoriques. Étymologie. Le mot « pédagogie » vient du grec paidagogia: pais, paidos (enfant) et agein (conduire). Étymologiquement, c'est l'art de conduire l'enfant. Définition. La pédagogie est la science et l'art de l'éducation: elle étudie les processus d'enseignement-apprentissage et les méthodes pour les optimiser. Définitions d'auteurs. Gaston Mialaret: art d'éduquer et d'orienter l'évolution d'un enfant vers des objectifs déterminés. John Dewey: science de l'éducation. Émile Durkheim: technique de l'éducation. Emmanuel Kant: philosophie de l'éducation. Rapports avec les autres sciences. Psychologie (développement de l'enfant, apprentissage). Sociologie (milieu social, école). Philosophie (finalités de l'éducation). Histoire (évolution des systèmes éducatifs). Exemple concret. Un instituteur qui adapte sa leçon au niveau de ses élèves, observe leurs réactions, ajuste sa méthode fait œuvre de pédagogie. Il ne se contente pas de transmettre, il réfléchit à la manière de faire apprendre. À retenir. La pédagogie est une science et un art. Elle s'appuie sur plusieurs disciplines. Erreur fréquente: confondre pédagogie (réflexion sur l'éducation) et didactique (méthodes propres à une discipline)."]],"3":[["fr","Leçon 2, Pédagogie, éducation, enseignement, apprentissage. Fondements théoriques. Les concepts fondamentaux. Concept. Définition. Pédagogie. Réflexion sur les méthodes et les processus de l'éducation. Éducation. Processus global de transmission et d'acquisition de savoirs, savoir-faire et savoir-être. Enseignement. Acte de l'enseignant qui organise les conditions d'apprentissage. Apprentissage. Processus par lequel l'élève acquiert des connaissances et des compétences. Formation. Développement professionnel et personnel structuré. Instruction. Transmission de connaissances scolaires. Relations. L'éducation englobe l'enseignement et l'apprentissage. L'enseignant enseigne, l'élève apprend, dans un cadre éducatif. La pédagogie éclaire ce processus. Exemple concret. Un enseignant explique les fractions (enseignement). L'élève manipule, comprend, retient (apprentissage). L'ensemble contribue à son éducation mathématique, dans une perspective éducative globale. À retenir. Les concepts sont liés mais distincts. La pédagogie articule enseignement et apprentissage. Erreur fréquente: les employer comme synonymes."]],"4":[["fr","Leçon 3, L'éducation: finalités et limites. Fondements théoriques. Définition. L'éducation est l'ensemble des processus par lesquels une société transmet sa culture, ses valeurs et ses savoirs à ses membres. Elle est à la fois un droit et un devoir. Finalités de l'éducation en R D C. La Loi-Cadre de 1986 dispose que l'enseignement national a pour finalité la formation harmonieuse de l'homme congolais (intellectuelle, morale, physique, professionnelle). Les limites de l'action éducative. L'éducation ne peut pas tout. Elle se heurte à: Facteurs biologiques: héritage génétique, troubles sensoriels (myopie, surdité, bégaiement). Facteurs environnementaux: conditions socio-économiques précaires, milieu familial défavorisé, malnutrition, insécurité. L'enseignant doit en tenir compte et adapter sa pédagogie. Exemple concret. Un élève malnutri a du mal à se concentrer. L'enseignant ne peut pas résoudre la malnutrition, mais il peut adapter son rythme, prévoir des pauses, orienter vers les structures de santé. Il reconnaît les limites de son action tout en agissant. À retenir. L'éducation vise la formation harmonieuse de la personne. Elle a des limites biologiques et environnementales. Erreur fréquente: croire que l'école peut compenser toutes les inégalités."]],"5":[["fr","Leçon 4, Éducation traditionnelle et éducation moderne. Fondements théoriques. L'éducation traditionnelle africaine. Globale: forme la personne dans toutes ses dimensions. Orale: transmission par la parole, les contes, les proverbes. Communautaire: toute la communauté éduque. Fonctionnelle: liée aux activités de la vie (agriculture, artisanat, chasse). Rites de passage: marquent les étapes de la vie. L'éducation moderne. Institutionnalisée (école). Écrite et codifiée (programmes, manuels). Structurée en niveaux (primaire, secondaire, supérieur). Évaluée (notes, diplômes). Vers une complémentarité. L'approche par compétences (APC) vise à synthétiser le meilleur des deux mondes: le lien avec la vie et les valeurs de la tradition, la rigueur et l'ouverture de l'école moderne. Exemple concret. Une leçon sur les plantes médicinales peut combiner savoirs traditionnels (transmis par les anciens) et méthode scientifique (observation, classement). L'élève apprend à valoriser sa culture tout en développant un regard critique. À retenir. Chaque forme d'éducation a ses forces. L'APC articule tradition et modernité. Erreur fréquente: opposer les deux formes."]],"6":[["fr","Leçon 5, Histoire de l'enseignement au Congo (1): périodes coloniales. Fondements théoriques. État indépendant du Congo (1885-1908). Les premières écoles (souvent missionnaires) apparaissent dans les années 1890. Elles visent à former des auxiliaires de la colonisation: catéchistes, commis, ouvriers. Les contenus sont limités (religion, lecture, écriture, calcul). Congo belge (1908-1960). Convention scolaire de 1906: organise l'enseignement. Deux réseaux: enseignement officiel et enseignement libre (congrégations). Objectifs: former une main-d'œuvre subalterne; l'accès à l'enseignement secondaire et supérieur est très limité pour les Congolais. Missions: jouent un rôle majeur dans l'enseignement. L'école coloniale au Congo: un instrument de la colonisation, marqué par la sélection et la subordination. Permanences. Malgré l'indépendance, les structures et certaines mentalités de l'école coloniale persistent en partie. À retenir. L'école coloniale visait la subordination, pas l'émancipation. Les missions ont joué un rôle central. Erreur fréquente: réduire l'école coloniale à l'évangélisation; elle avait aussi une fonction économique et politique."]],"7":[["fr","Leçon 6, Histoire de l'enseignement au Congo (2): réformes post-indépendance. Fondements théoriques. Réformes de l'indépendance (1960-1965). Volonté d'africaniser l'enseignement. Réformes scolaires de 1960, 1961, 1962. Tentative de démocratisation, mais manque de cadres et de ressources. Zaïrianisation (1971-1990). L'école est intégrée à l'appareil du parti-État (MPR). Politique d'« authenticité ». L'enseignement est encadré, mais le déclin économique pèse sur la qualité. Loi-Cadre de 1986. Structure l'enseignement national, définit ses finalités. Reste en vigueur jusqu'en 2014, mais est jugée inadaptée après 23 ans. États généraux de l'éducation (1996). Assises nationales qui diagnostiquent les maux de l'école et formulent des recommandations (qualité, pertinence, gouvernance). Loi-Cadre de 2014 et gratuité (2019). La Loi-Cadre n° 14 sur 004 du 11 février 2014 abroge la loi de 1986 et intègre les instruments internationaux, la protection de l'enfant et la gratuité de l'enseignement primaire (mise en œuvre à partir de 2019). Exemple concret. La gratuité de l'enseignement primaire a permis à de nombreux enfants de retourner à l'école. Mais elle pose des défis de financement, de qualité et d'infrastructures, que l'enseignant doit connaître. À retenir. Les réformes éducatives congolaises sont nombreuses depuis 1960. La Loi-Cadre de 2014 est le cadre actuel. Erreur fréquente: croire que les réformes suffisent à transformer l'école; leur mise en œuvre dépend des moyens."]],"8":[["fr","Leçon 7, L'enseignant: rôle, qualités. Fondements théoriques. Rôles de l'enseignant. Agent de transmission culturelle: transmet les savoirs et les valeurs. Facilitateur d'apprentissage: organise les conditions pour que l'élève apprenne. Éducateur: forme la personne dans toutes ses dimensions. Modèle: par son comportement, il inspire. Professionnel: exerce une profession régie par des textes légaux. Qualités professionnelles. Compétence disciplinaire. Compétence pédagogique. Sens de l'organisation. Capacité d'adaptation. Patience et équité. Autorité bienveillante. Ponctualité et conscience professionnelle. Exemple concret. Un enseignant qui connaît sa matière, prépare ses leçons, respecte ses élèves et sait s'adapter aux difficultés incarne les qualités professionnelles attendues. À retenir. L'enseignant est à la fois transmetteur, facilitateur et éducateur. Ses qualités professionnelles sont multiples. Erreur fréquente: réduire l'enseignement à la seule maîtrise de la matière."]],"9":[["fr","Leçon 8, La déontologie de l'enseignant. Fondements théoriques. Définition. La déontologie est l'ensemble des devoirs et des règles éthiques qui régissent la profession enseignante. Les devoirs de l'enseignant. Respect des élèves (dignité, non-violence, non-discrimination). Confidentialité (informations personnelles des élèves et des familles). Honnêteté (pas de favoritisme, pas de corruption). Ponctualité et assiduité. Neutralité (pas de prosélytisme politique ou religieux en classe). Respect des collègues et de la hiérarchie. Formation continue. Conséquences. La déontologie protège l'élève, l'enseignant et l'institution. Elle est un pilier de la confiance sociale envers l'école. Exemple concret. Un enseignant qui refuse de divulguer les résultats d'un élève à d'autres parents, qui traite tous ses élèves de la même manière, qui ne cède pas à la tentation de favoritisme, respecte la déontologie. À retenir. La déontologie est l'éthique professionnelle de l'enseignant. Elle protège les élèves et l'institution. Erreur fréquente: confondre autorité et autoritarisme."]],"10":[["fr","Leçon 9, La Loi-Cadre de l'enseignement national. Fondements théoriques. La Loi-Cadre de 1986 (n° 86-005). Promulguée le 22 septembre 1986. Structure l'enseignement national pendant près de 30 ans. Définit les finalités (formation harmonieuse de l'homme zaïrois). Organise les structures: maternel, primaire, secondaire, supérieur. Fixe les droits et devoirs des acteurs. La Loi-Cadre de 2014 (n° 14 sur 004). Promulguée le 11 février 2014. Abroge la loi de 1986. Intègre les instruments internationaux (droits de l'enfant, éducation pour tous). Prend en compte la gratuité de l'enseignement primaire. Tient compte de la Constitution de 2006 et des états généraux de 1996. Exemple concret. Un enseignant congolais exerce aujourd'hui dans le cadre de la Loi-Cadre de 2014. Il doit connaître ses droits (salaire, formation, protection) et ses devoirs (respect des textes, conscience professionnelle). À retenir. La Loi-Cadre de 1986 a été abrogée par celle de 2014. La loi de 2014 intègre les droits de l'enfant et la gratuité. Erreur fréquente: se référer uniquement à la loi de 1986, qui n'est plus en vigueur."]],"11":[["fr","Leçon 10, Les documents administratifs et pédagogiques. Fondements théoriques. Les principaux documents. Journal de classe: enregistre les matières enseignées chaque jour, les présences, les observations. Fiche de préparation: planification détaillée de chaque leçon (objectifs, prérequis, matériel, déroulement, évaluation). Registre matricule: liste officielle des élèves inscrits. Registre des présences: suivi de l'assiduité. Prévisions des matières: planification annuelle et périodique. Bulletins et palmarès: communication des résultats. Livre de caisse: suivi financier de la classe ou de l'école. Les outils du professionnel: journal de classe, fiche de préparation, registre matricule. Exemple concret. Un inspecteur vérifie le journal de classe et les fiches de préparation d'un enseignant. La tenue rigoureuse de ces documents témoigne du professionnalisme et facilite le suivi pédagogique. À retenir. Les documents administratifs sont une obligation professionnelle. Ils assurent la traçabilité et le suivi. Erreur fréquente: les négliger, ce qui nuit à la gestion et à la crédibilité."]],"12":[["fr","Leçon 11, La Pédagogie Par Objectifs (PPO). Fondements théoriques. Définition. La PPO est une approche qui définit des objectifs opérationnels (spécifiques, mesurables, réalisables) et organise l'enseignement en séquences structurées. Caractéristiques d'un objectif opérationnel. Verbe d'action: décrire ce que l'élève fera (calculer, réciter, dessiner). Condition: dans quelles conditions (avec un document, sans aide). Critère de réussite: quel niveau est attendu (sans erreur, en 5 minutes). Exemple d'objectif opérationnel. « À la fin de la leçon, l'élève sera capable de calculer la moyenne de trois nombres donnés, sans erreur. ». Structure d'une leçon PPO. Rappel des prérequis. Présentation de l'objectif. Activités d'apprentissage. Institutionnalisation (formalisation du savoir). Exercices d'application. Évaluation. Exercice guidé. Rédiger un objectif opérationnel pour une leçon de français au primaire. Corrigé: « À la fin de la leçon, l'élève sera capable de lire à haute voix un texte de 5 lignes en respectant la ponctuation, sans erreur de prononciation. ». À retenir. La PPO clarifie ce que l'élève doit savoir faire. Les objectifs sont opérationnels (verbe plus condition plus critère). Erreur fréquente: formuler des objectifs vagues (« comprendre… »)."]],"13":[["fr","Leçon 12, L'Approche Par Compétences (APC). Fondements théoriques. Définition. L'APC place l'élève en situation de mobiliser un ensemble intégré de ressources (savoirs, savoir-faire, savoir-être) pour résoudre des situations-problèmes authentiques. Différences avec la PPO. Critère. PPO. APC. Centration. Objectifs. Compétences. Situation. Exercices scolaires. Situations-problèmes. Ressources. Connaissances isolées. Savoirs plus savoir-faire plus savoir-être. Évaluation. Restitution. Mobilisation en situation. La situation-problème. Une tâche complexe, contextualisée, qui oblige l'élève à mobiliser plusieurs ressources. Exemple: organiser une campagne de sensibilisation contre le paludisme dans son quartier. Implication pour l'enseignant. L'enseignant doit concevoir des situations d'apprentissage qui ont du sens pour l'élève. Exemple concret. Une leçon sur les fractions peut partir d'une situation-problème: « Comment partager équitablement 3 galettes entre 4 enfants? » L'élève découvre le concept de fraction en cherchant une solution. À retenir. L'APC mobilise plusieurs ressources en situation. Elle exige des savoirs solides. Erreur fréquente: croire que l'APC supprime les savoirs."]],"14":[["fr","Leçon 13, L'évaluation formative. Fondements théoriques. Définition. L'évaluation formative vise à aider l'élève à progresser, par un feedback immédiat et des ajustements. Elle s'oppose à l'évaluation sommative (note finale). Caractéristiques. Se déroule pendant l'apprentissage. Donne un feedback à l'élève et à l'enseignant. Identifie les réussites et les difficultés. Permet de réguler l'enseignement. Ne vise pas la note. Outils. Questions orales. Exercices rapides. Grilles d'observation. Auto-évaluation de l'élève. Types d'évaluation. Diagnostique: avant l'apprentissage, pour repérer les prérequis. Formative: pendant, pour aider. Sommative: en fin, pour certifier. Exemple concret. Pendant une leçon de mathématiques, l'enseignant pose des questions, corrige immédiatement, propose des exercices ciblés. C'est de l'évaluation formative: elle aide l'élève à progresser avant l'évaluation finale. À retenir. L'évaluation formative est au service de l'apprentissage. Elle ne se confond pas avec l'évaluation sommative. Erreur fréquente: utiliser l'évaluation formative comme une sanction."]],"15":[["fr","Leçon 14, Les méthodes actives. Fondements théoriques. Définition. Les méthodes actives rendent l'élève acteur de son apprentissage: il participe, manipule, explore, coopère, produit. Exemples. Travail de groupe: les élèves coopèrent sur une tâche commune. Étude de cas: analyse d'une situation concrète. Jeu de rôle: simulation d'une situation. Résolution de problèmes: recherche active de solutions. Pédagogie de projet: réalisation concrète (exposition, jardin, spectacle). Classe inversée: l'élève prépare la leçon à la maison, la classe sert à approfondir. Rôle de l'enseignant. Concevoir des situations d'apprentissage. Guider, observer, réguler. Encourager la coopération. Adapter les méthodes au contexte. Exemple concret. Une leçon sur les circuits électriques: les élèves manipulent des piles, des fils, des ampoules en petits groupes. Ils observent, testent, verbalisent. C'est plus efficace qu'un cours magistral sur le même sujet. À retenir. Les méthodes actives impliquent l'élève. Elles sont plus efficaces que le seul cours magistral. Erreur fréquente: les ignorer par manque de temps ou de matériel."]],"16":[["fr","Leçon 15, La gestion d'une classe pléthorique. Fondements théoriques. Définition. Une classe pléthorique est une classe dont l'effectif dépasse largement les normes pédagogiques (50, 80, voire plus de 100 élèves), typique des centres urbains comme Kinshasa ou Lubumbashi. Stratégies. Routines claires: règles affichées, procédures connues. Rôles tournants: responsables du matériel, chronométreur, médiateur. Travail en sous-groupes: groupes de 4-6 élèves. Gestion de l'espace: disposition favorisant la circulation. Consignes explicites: écrites, courtes, vérifiées. Mobilisation de tous: éviter que seuls les meilleurs participent. Évaluation formative rapide: questions ciblées, exercices courts. Gérer une classe pléthorique: un défi professionnel qui se relève par la méthode et la structuration. Exemple concret. Un enseignant de Matete a 80 élèves. Il met en place des rôles tournants, organise des ateliers en sous-groupes, affiche les règles. La classe devient plus calme et plus efficace. À retenir. Une classe pléthorique se gère par la structuration. Les routines et les rôles tournants sont efficaces. Erreur fréquente: recourir à la punition excessive."]],"17":[["fr","Leçon 16, La gestion d'une classe à degrés multiples. Fondements théoriques. Définition. Une classe à degrés multiples regroupe plusieurs niveaux dans une même salle (ex.: 1re, 2e et 3e primaire). Fréquente en milieu rural (Kwilu, Bandundu). Stratégies. Pédagogie différenciée: adapter les activités à chaque niveau. Tutorat entre élèves: les plus avancés aident les plus jeunes. Organisation par ateliers: pendant qu'un groupe travaille avec l'enseignant, les autres font des activités autonomes. Planification rigoureuse: emploi du temps alternant les temps avec l'enseignant et les temps autonomes. Matériel autoportant: fiches d'exercices, jeux éducatifs. Exemple concret. Un enseignant du Kwilu a des élèves de 1re, 2e et 3e primaire. Il organise un atelier de lecture pour la 1re, un atelier d'écriture pour la 2e, un atelier de mathématiques pour la 3e, avec rotation. Le tutorat entre élèves renforce la coopération. À retenir. Les classes à degrés multiples exigent une organisation rigoureuse. Différenciation, tutorat et ateliers sont essentiels. Erreur fréquente: enseigner comme dans une classe à niveau unique."]],"18":[["fr","Leçon 17, La préparation d'une leçon. Fondements théoriques. Les rubriques d'une fiche de préparation. Identification: classe, discipline, thème, date, durée. Objectifs: PPO ou APC. Prérequis: ce que l'élève doit déjà savoir. Matériel: nécessaire à la leçon. Déroulement: introduction, développement, conclusion. Évaluation: comment vérifier les acquis. Observations: remarques après la leçon. Déroulement type (APC). Mise en situation: situation-problème. Recherche: exploration, manipulation, échanges. Institutionnalisation: formalisation du savoir. Réinvestissement: exercices d'application. Évaluation: vérification des acquis. Exercice guidé. Préparer une leçon de sciences (4e primaire) sur les états de l'eau: Objectif: distinguer les états de l'eau et les nommer. Matériel: eau, glaçons, casserole (ou tout récipient chauffant), récipient froid. Déroulement: observation de la glace qui fond, de la vapeur, de la condensation. Évaluation: demander à l'élève de nommer les trois états. À retenir. La préparation est essentielle pour enseigner efficacement. Elle structure le déroulement et les évaluations. Erreur fréquente: improviser sans fiche de préparation."]],"19":[["fr","Leçon 18, Le stage pratique. Fondements théoriques. Objectifs du stage. Confronter la théorie à la pratique. Développer les compétences professionnelles. Observer des enseignants expérimentés. Analyser ses propres pratiques. Les étapes. Observation: observer une classe, noter les pratiques, analyser la gestion du groupe. Préparation: rédiger les fiches de préparation. Animation: animer des séquences sous supervision. Analyse réflexive: après la leçon, analyser forces et faiblesses, avec le superviseur. Bilan: synthèse des apprentissages. Exemple concret. Un élève-maître observe une leçon de français, note les techniques de l'enseignant, prépare ensuite sa propre leçon, l'anime, puis analyse avec son superviseur: « Qu'est-ce qui a bien fonctionné? Qu'est-ce que je referai différemment? ». À retenir. Le stage articule théorie et pratique. L'analyse réflexive est essentielle. Erreur fréquente: considérer le stage comme une simple formalité."]],"20":[["fr","Leçon 19, Synthèse: de la théorie à la pratique. Synthèse générale. Les grands enseignements. La pédagogie est une science et un art, fondée sur plusieurs disciplines. L'éducation a des finalités et des limites. L'école congolaise a une histoire marquée par la colonisation et les réformes post-indépendance. L'enseignant est à la fois transmetteur, facilitateur et éducateur. La déontologie et la législation encadrent la profession. PPO et APC structurent la préparation des leçons. La gestion de classe (pléthorique ou à degrés multiples) exige méthode et structuration. Le stage articule théorie et pratique. Le profil de sortie. L'élève-maître en Pédagogie Générale est un praticien réflexif compétent: il connaît les fondements de l'éducation, maîtrise le cadre légal et administratif, sait appliquer les méthodes pédagogiques adaptées aux réalités congolaises, et adopte une posture déontologique. Pour aller plus loin. Observer des enseignants expérimentés, se former en continu, échanger avec des collègues, réfléchir à ses propres pratiques. La pédagogie s'affine tout au long de la carrière."]],"21":[["fr","Évaluation finale, Pédagogie Générale. Évaluation finale. 22 questions à choix multiple. Une seule réponse est correcte par question. Choisis la réponse qui te semble juste, puis valide."]]}};

  var PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
  var DL = '<svg viewBox="0 0 24 24"><path d="M11 3h2v9.2l3.6-3.6L18 10l-6 6-6-6 1.4-1.4L11 12.2V3zM5 19h14v2H5z"/></svg>';
  var OK = '<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';
  // Réparation du quiz : certains cours stockent les choix sous "opts" (ou autre) au lieu de "options"
  try {
    if (typeof questions !== "undefined" && questions && questions.forEach) {
      questions.forEach(function (q) {
        if (!q.options) q.options = q.opts || q.choices || q.choix || q.reponses || q.propositions || [];
        if (q.text === undefined) q.text = q.question || q.q || q.enonce || q.titre || "";
        if (typeof q.correct === "undefined") {
          if (typeof q.answer !== "undefined") q.correct = q.answer;
          else if (typeof q.reponse !== "undefined") q.correct = q.reponse;
        }
      });
    }
  } catch (e) {}
  var synth = window.speechSynthesis || null;
  var HAS_CACHE = !!(window.caches && window.caches.open);
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface" (fichiers dans le dossier de l'application)
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  var LATER = "ecolia_audio_later_" + CFG.code;
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function init() {
    if (document.getElementById("ecolia-audio-btn")) return;

    // ---------- éléments de l'interface ----------
    var btn = document.createElement("button");
    btn.id = "ecolia-audio-btn"; btn.type = "button"; btn.className = "ecolia-off";
    btn.setAttribute("aria-label", "Écouter la leçon"); btn.innerHTML = PLAY;
    var dlBtn = document.createElement("button");
    dlBtn.id = "ecolia-dl-btn"; dlBtn.type = "button"; dlBtn.className = "ecolia-off";
    dlBtn.innerHTML = DL;
    var host = document.querySelector(".header-right");
    if (host) { host.insertBefore(dlBtn, host.firstChild); host.insertBefore(btn, dlBtn); }   // dans la barre du haut : ne scrolle jamais
    else { btn.className += " ecolia-fixed"; document.body.appendChild(btn); }

    var banner = document.createElement("div");
    banner.id = "ecolia-audio-banner";
    banner.innerHTML = '<span class="eab-txt"></span><span class="eab-act"></span><div class="eab-bar"><i></i></div>';
    var content = document.getElementById("content");
    if (content && content.parentNode) content.parentNode.insertBefore(banner, content);
    else document.body.insertBefore(banner, document.body.firstChild);
    var txtEl = banner.querySelector(".eab-txt"), actEl = banner.querySelector(".eab-act");
    var barEl = banner.querySelector(".eab-bar"), barI = barEl.firstChild;

    var audio = new Audio();            // un seul élément Audio, réutilisé (exigé par les navigateurs mobiles)
    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };   // none | partial | full
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }

    function cur() {
      try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {}
      return 0;
    }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {   // dans l'APK la page est sur https://app.local : une adresse relative doit pointer vers le site
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }

    // ====================================================================
    //  Stockage hors ligne : 2 moteurs, même interface
    //    - APK : fichiers du dossier de l'application (CoursInterface), servis par https://app.local/cours/
    //    - Web : Cache Storage du navigateur (même cache que l'application web)
    // ====================================================================
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {                                   // fichier complet ? (taille exacte connue à la génération)
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () {
          var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok);
        },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) {
          try { CoursInterface.delete(nameN(n)); } catch (e) {}
          writeOk(readOk().filter(function (x) { return x !== n; }));
          return Promise.resolve();
        }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }   // ancien contenu invalide
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) {
          return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); })
            .then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; });
        },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);

    // ====================================================================
    //  Bannière : invitation, confirmations, progression
    // ====================================================================
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer);
      bnMode = mode;
      txtEl.textContent = text;
      actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; }
      else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }

    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }

    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial"
        ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet."
        : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
</html>
