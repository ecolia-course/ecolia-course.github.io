      <div class="bloc cas">
        <h2>Qu'est-ce que l'histoire ?</h2>
        <p><strong>Objectifs :</strong> (1) définir l'histoire ; (2) distinguer l'histoire des autres récits du passé ; (3) expliquer l'objet, les domaines et l'utilité de l'histoire.</p>

        <p>L'histoire est la <strong>science qui étudie le passé des sociétés humaines</strong> à partir de traces laissées (sources). Elle ne raconte pas « tout » le passé : elle pose des questions, vérifie, critique et interprète.</p>
        <p>Elle se distingue de la <strong>mémoire</strong> (souvenir personnel), de la <strong>légende</strong> (récit souvent merveilleux) et de la <strong>propagande</strong> (récit au service d'un pouvoir).</p>
        <h3>Définitions</h3>
        <ul>
          <li><strong>Histoire :</strong> étude scientifique du passé des sociétés humaines.</li>
          <li><strong>Objet :</strong> les hommes et les femmes du passé, leurs sociétés, institutions, croyances, économies.</li>
          <li><strong>Domaines :</strong> politique, économique, sociale, culturelle, religieuse, environnementale, etc.</li>
          <li><strong>Utilité :</strong> comprendre le présent, former l'esprit critique, construire une identité sans mythifier le passé.</li>
        </ul>
        <h3>Méthode en 5 étapes</h3>
        <ol>
          <li>Choisir un sujet et poser une question.</li>
          <li>Rechercher les sources.</li>
          <li>Critiquer les sources (qui ? quand ? pourquoi ?).</li>
          <li>Confronter les sources.</li>
          <li>Rédiger un récit historique avec des preuves.</li>
        </ol>
        <p>L'historien distingue les <strong>faits</strong>, les <strong>hypothèses</strong> et les <strong>interprétations</strong>.</p>
      </div>

        <p><strong>Exemple :</strong> « Quand le royaume Kongo a-t-il été fondé ? » Les sources écrites portugaises (XVe s.) et les traditions orales kongo donnent des dates différentes. L'historien compare, critique et propose une fourchette (vers 1390).</p>

        <p><strong>Objectifs :</strong> (1) classer les sources ; (2) distinguer source écrite, orale, matérielle et iconographique ; (3) expliquer la critique des sources.</p>

        <h3>Développement</h3>
        <p>Une <strong>source</strong> est tout ce qui apporte une information sur le passé.</p>
        <ul>
          <li><strong>Sources écrites :</strong> manuscrits, archives, journaux, inscriptions, correspondances.</li>
          <li><strong>Sources orales :</strong> traditions, récits, chants, généalogies.</li>
          <li><strong>Sources matérielles (archéologiques) :</strong> outils, poteries, armes, restes de constructions, ossements.</li>
          <li><strong>Sources iconographiques :</strong> dessins, peintures, sculptures, photographies, cartes anciennes.</li>
        </ul>
        <h3>Définitions</h3>
        <ul>
          <li><strong>Source primaire :</strong> produite au moment ou peu après l'événement (ex. : traité signé en 1885).</li>
          <li><strong>Source secondaire :</strong> produite plus tard, à partir de sources primaires (ex. : manuel d'histoire).</li>
          <li><strong>Critique externe :</strong> vérifier l'authenticité (date, auteur, contexte).</li>
          <li><strong>Critique interne :</strong> vérifier la fiabilité du contenu (l'auteur dit-il vrai ? a-t-il un intérêt ?).</li>

        <h3>Développement</h3>
        <p>Le temps historique se mesure : jour, semaine, mois, année, <strong>lustre</strong> (5 ans), <strong>décennie</strong> (10 ans), <strong>siècle</strong> (100 ans), <strong>millénaire</strong> (1000 ans).</p>
        <p>On distingue le temps <strong>avant</strong> et <strong>après Jésus-Christ</strong> (av. J.-C. / apr. J.-C.). En RDC, on situe souvent les faits par rapport à <strong>1960</strong> (indépendance).</p>
        <p>Une <strong>génération</strong> correspond environ à 25-30 ans. L'espace historique : un fait se produit toujours dans un lieu précis (site, région, royaume, pays).</p>
        <h3>Définitions</h3>
        <ul>
          <li><strong>Chronologie :</strong> ordre des faits dans le temps.</li>
          <li><strong>Ligne du temps :</strong> représentation graphique du temps, avec des dates alignées.</li>
          <li><strong>Période :</strong> tranche de temps délimitée par des événements importants.</li>
          <li><strong>Localisation :</strong> situer un fait sur une carte ou dans un espace nommé.</li>
          <li><strong>Repère chronologique :</strong> date ou événement qui sert de point de référence.</li>
        </ul>
        <h3>Méthodes</h3>
        <ul>
          <li>Construire une ligne du temps : tracer une droite, placer les dates dans l'ordre, graduer régulièrement, écrire les événements.</li>
          <li>Pour comparer deux dates : soustraire la plus petite de la plus grande (1960 − 1950 = 10 ans).</li>
          <li>Pour localiser : carte, points cardinaux, repères géographiques (fleuve Congo, lac Tanganyika…).</li>
        </ul>

        <h2>L'Afrique, berceau de l'humanité</h2>
        <p><strong>Objectifs :</strong> (1) situer les origines de l'humanité en Afrique ; (2) citer des sites africains de premiers hommes ; (3) expliquer l'évolution de l'homme.</p>
        <p><strong>Prérequis :</strong> leçon 3 (temps long).</p>
        <p><strong>Situation de départ :</strong> « D'où viennent les premiers êtres humains ? Pourquoi dit-on souvent que l'Afrique est le berceau de l'humanité ? »</p>
      </div>
      <div class="bloc theorie">
        <h3>Développement</h3>
        <p>Les plus anciennes traces d'humanité connues se trouvent en <strong>Afrique</strong>, notamment dans la <strong>vallée du Rift</strong> (Éthiopie, Kenya, Tanzanie) et en Afrique du Sud.</p>
        <p>L'humanité actuelle (<em>Homo sapiens</em>) apparaît en Afrique il y a environ 200 000 à 300 000 ans, puis se diffuse sur les autres continents.</p>
        <p>Le programme officiel RDC demande de décrire la vie des premiers hommes et de situer les sites des premiers êtres humains.</p>
        <h3>Définitions</h3>
        <ul>
          <li><strong>Paléolithique :</strong> âge de la pierre taillée (très longue période).</li>
          <li><strong>Homo habilis, Homo erectus, Homo sapiens :</strong> grandes étapes de l'évolution humaine.</li>
          <li><strong>Site archéologique :</strong> lieu où l'on trouve des traces d'occupation humaine ancienne.</li>
          <li><strong>Fossile :</strong> reste ou empreinte d'un être vivant conservé dans le sol.</li>
        </ul>
        <h3>Méthodes</h3>
        <ul>
          <li>Dater un site : stratigraphie (couches du sol), carbone 14, étude des fossiles et des outils.</li>
          <li>Les premiers hommes vivaient de chasse, cueillette et pêche ; ils fabriquaient des outils de pierre et maîtrisaient progressivement le feu.</li>
          <li>Repères : sites de l'Afar (Éthiopie, Lucy), Olduvai (Tanzanie), Sterkfontein (Afrique du Sud).</li>
        </ul>
      </div>
      <div class="bloc exemple">
        <h3>Exemple et application RDC</h3>
        <p><img src="images/Histoire1_4.jpg" alt="Carte de l'Afrique avec les sites archéologiques" /></p>
        <p><strong>Exemple :</strong> « Lucy », squelette d'Australopithèque découvert en Éthiopie en 1974, daté d'environ 3,2 millions d'années, illustre l'ancienneté de la présence humaine en Afrique.</p>
        <p><strong>Application RDC :</strong> Le programme officiel demande de localiser les grands foyers de civilisation en Afrique ; on situe notamment les sites de la vallée du Rift et on relie cette histoire longue à l'espace congolais.</p>
      </div>
      <div class="bloc cas">
        <h3>Exercices</h3>
        <p><strong>Ex. 1 :</strong> Sur quel continent trouve-t-on les plus anciennes traces d'humanité ?</p>
        <p><strong>Ex. 2 :</strong> Cite deux sites africains de premiers hommes.</p>
        <p><strong>Ex. 3 :</strong> Qu'est-ce que le Paléolithique ?</p>
        <details><summary>Corrigé</summary>
          <p>1) L'Afrique.</p>
          <p>2) Olduvai (Tanzanie), Afar (Éthiopie), Sterkfontein (Afrique du Sud)…</p>
          <p>3) La période de la pierre taillée, avec des outils rudimentaires.</p>
        </details>
      </div>
      <div class="bloc resume">
        <h3>Synthèse</h3>
        <p>L'Afrique est le berceau de l'humanité ; les sites archéologiques et les fossiles permettent de reconstituer cette très longue histoire.</p>
      </div>
    
},

title: "Leçon 5 — La révolution néolithique",
content: 
      <div class="bloc cas">
        <h2>La révolution néolithique</h2>
        <p><strong>Objectifs :</strong> (1) définir le Néolithique ; (2) expliquer les changements de mode de vie ; (3) situer l'apparition de l'agriculture et de l'élevage en Afrique.</p>
        <p><strong>Prérequis :</strong> leçon 4.</p>
        <p><strong>Situation de départ :</strong> « Avant, les hommes chassaient et cueillaient. Puis ils ont commencé à cultiver et à élever des animaux. Qu'est-ce que cela a changé ? »</p>
      </div>
      <div class="bloc theorie">
        <h3>Développement</h3>
        <p>Le <strong>Néolithique</strong> est la période où les sociétés passent de la <strong>prédation</strong> (chasse, cueillette, pêche) à la <strong>production</strong> (agriculture, élevage).</p>
        <p>Ce passage s'accompagne de la <strong>sédentarisation</strong> : les groupes s'installent dans des villages.</p>
        <p>En Afrique, l'agriculture apparaît indépendamment dans plusieurs foyers : vallée du Nil, Afrique de l'Ouest (mil, sorgho, riz africain), Éthiopie (teff, café), etc.</p>
        <h3>Définitions</h3>
        <ul>
          <li><strong>Néolithique :</strong> « âge de la pierre polie », période de la révolution agricole.</li>
          <li><strong>Sédentarisation :</strong> fait de s'installer durablement dans un lieu.</li>
          <li><strong>Domestication :</strong> adaptation d'une plante ou d'un animal à l'usage humain.</li>
          <li><strong>Village :</strong> regroupement d'habitations permanentes.</li>
        </ul>
        <h3>Méthodes</h3>
        <ul>
          <li>Reconnaître un site néolithique : céramiques, meules, outils agricoles, restes d'animaux domestiques, villages.</li>
          <li>Conséquences : augmentation de la population, spécialisation du travail, inégalités sociales, premiers États.</li>
          <li>Repères : Néolithique vers 10000 av. J.-C. au Proche-Orient ; en Afrique, dates variées selon les régions.</li>
        </ul>
      </div>
      <div class="bloc exemple">
        <h3>Exemple et application RDC</h3>
        <p><img src="images/Histoire1_6.jpg" alt="Outils en pierre polie du Néolithique" /></p>
        <p><strong>Exemple :</strong> La culture du mil et du sorgho en Afrique de l'Ouest, et la domestication du bétail dans la vallée du Nil, transforment les sociétés et préparent l'apparition des grands royaumes.</p>
        <p><strong>Application RDC :</strong> Dans le bassin du Congo, les sociétés anciennes combinent agriculture, pêche et cueillette ; cette diversité explique la variété des modes de vie des groupes qui s'y installent.</p>
      </div>
      <div class="bloc cas">
        <h3>Exercices</h3>
        <p><strong>Ex. 1 :</strong> Qu'est-ce que la sédentarisation ?</p>
        <p><strong>Ex. 2 :</strong> Cite deux conséquences de la révolution néolithique.</p>
        <p><strong>Ex. 3 :</strong> Le Néolithique marque le passage de la prédation à la ___.</p>
        <details><summary>Corrigé</summary>
          <p>1) Le fait de s'installer durablement dans un village.</p>
          <p>2) Augmentation de la population ; apparition de villages et d'inégalités ; spécialisation du travail.</p>
          <p>3) production.</p>
        </details>
      </div>
      <div class="bloc resume">
        <h3>Synthèse</h3>
        <p>La révolution néolithique transforme durablement les sociétés humaines et ouvre la voie aux premières civilisations.</p>
      </div>
    
},

{
title: "Leçon 6 — La civilisation égyptienne",
content: 
      <div class="bloc cas">
        <h2>La civilisation égyptienne</h2>
        <p><strong>Objectifs :</strong> (1) situer l'Égypte dans le temps et l'espace ; (2) décrire son organisation politique, économique, sociale et culturelle ; (3) expliquer son rôle dans l'histoire africaine.</p>
        <p><strong>Prérequis :</strong> leçons 4 et 5 (Néolithique).</p>
        <p><strong>Situation de départ :</strong> « Les pyramides de Gizeh sont parmi les plus anciens monuments du monde. Qui les a construits, et pourquoi ? »</p>
      </div>
      <div class="bloc theorie">
        <h3>Développement</h3>
        <p>L'Égypte ancienne se développe dans la <strong>vallée du Nil</strong>, en Afrique du Nord-Est, à partir de la fin du IVe millénaire av. J.-C.</p>
        <p>Le Nil, avec ses crues annuelles, permet une agriculture riche et favorise l'unification politique.</p>
        <p>La civilisation dure plus de trois millénaires : Ancien Empire, Moyen Empire, Nouvel Empire, puis déclin progressif.</p>
        <h3>Définitions</h3>
        <ul>
          <li><strong>Pharaon :</strong> roi d'Égypte, considéré comme un dieu vivant.</li>
          <li><strong>Nil :</strong> fleuve qui traverse l'Égypte et rend la vie possible par ses crues.</li>
          <li><strong>Hiéroglyphes :</strong> écriture sacrée égyptienne.</li>
          <li><strong>Pyramide :</strong> tombeau monumental du pharaon (ex. : Gizeh, IVe dynastie, vers 2550 av. J.-C.).</li>
        </ul>
        <h3>Méthodes</h3>
        <p>Pour étudier une civilisation : cadre géographique, organisation politique, économie, société, culture.</p>
        <p><strong>Repères :</strong> unification vers 3100 av. J.-C. ; grandes pyramides vers 2550 av. J.-C. ; apogée du Nouvel Empire vers 1500-1100 av. J.-C. ; annexion par Rome en 30 av. J.-C.</p>
      </div>
      <div class="bloc exemple">
        <h3>Exemple et application RDC</h3>
        <p><img src="images/Histoire1_7.jpg" alt="Les pyramides de Gizeh" /></p>
        <p><strong>Exemple :</strong> L'organisation politique égyptienne est centralisée autour du pharaon, aidé de scribes et de prêtres. L'économie repose sur l'agriculture irriguée, l'artisanat et le commerce. La société est hiérarchisée (pharaon, nobles, scribes, paysans, esclaves).</p>
        <p><strong>Application RDC :</strong> Comparer la centralisation égyptienne avec les chefferies et royaumes du bassin du Congo (pouvoir du roi, rôle des notables, agriculture et commerce) pour montrer que l'Afrique a connu très tôt des organisations étatiques complexes.</p>
      </div>
      <div class="bloc cas">
        <h3>Exercices</h3>
        <p><strong>Ex. 1 :</strong> Sur quel fleuve repose la civilisation égyptienne ?</p>
        <p><strong>Ex. 2 :</strong> Qui est le pharaon ?</p>
        <p><strong>Ex. 3 :</strong> Cite deux réalisations culturelles de l'Égypte ancienne.</p>
        <details><summary>Corrigé</summary>
          <p>1) Le Nil.</p>
          <p>2) Le roi d'Égypte, considéré comme un dieu vivant.</p>
          <p>3) Les hiéroglyphes ; les pyramides ; les temples.</p>
        </details>
      </div>
      <div class="bloc resume">
        <h3>Synthèse</h3>
        <p>L'Égypte est une civilisation africaine majeure, née du Nil, avec un État centralisé, une agriculture irriguée et une culture écrite originale.</p>
      </div>
    
},
{
title: "Leçon 7 — Les royaumes du Haut-Nil et la Nubie",
content: 
      <div class="bloc cas">
        <h2>Les royaumes du Haut-Nil et la Nubie</h2>
        <p><strong>Objectifs :</strong> (1) situer la Nubie et les royaumes du Haut-Nil ; (2) décrire leurs relations avec l'Égypte ; (3) citer Kouch, Napata, Méroé, Axoum.</p>
        <p><strong>Prérequis :</strong> leçon 6.</p>
        <p><strong>Situation de départ :</strong> « Au sud de l'Égypte, d'autres royaumes africains ont existé. Les connais-tu ? »</p>
      </div>
      <div class="bloc theorie">
        <h3>Développement</h3>
        <p>La <strong>Nubie</strong> s'étend au sud de l'Égypte, dans l'actuel Soudan. Elle est riche en or, en ivoire et en pierres précieuses.</p>
        <p>Le royaume de <strong>Kouch</strong> (vers 2500 av. J.-C. – 350 apr. J.-C.) est un puissant voisin de l'Égypte ; il conquiert même l'Égypte au VIIIe siècle av. J.-C. (les « pharaons noirs » de la XXVe dynastie).</p>
        <p>Les capitales de Kouch sont <strong>Napata</strong> puis <strong>Méroé</strong>. Méroé développe une écriture propre (méroïtique) et une métallurgie du fer remarquable.</p>
        <p>Le royaume d'<strong>Axoum</strong> (Éthiopie, Ier-VIIe siècle apr. J.-C.) est un autre grand royaume africain, chrétien à partir du IVe siècle, qui contrôle le commerce de la mer Rouge.</p>
        <h3>Définitions</h3>
        <ul>
          <li><strong>Nubie :</strong> région du Haut-Nil, entre l'Égypte et le Soudan actuel.</li>
          <li><strong>Kouch :</strong> royaume nubien antique.</li>
          <li><strong>Méroé :</strong> capitale du royaume de Kouch, célèbre pour ses pyramides et son écriture.</li>
          <li><strong>Axoum :</strong> royaume antique du nord de l'Éthiopie, grand centre commercial.</li>
        </ul>
        <h3>Méthodes</h3>
        <ul>
          <li>Situer sur une carte : Nubie/Kouch le long du Nil, Axoum plus à l'est, vers la mer Rouge.</li>
          <li>Comparer avec l'Égypte : mêmes fleuves, mêmes échanges, mais cultures politiques et écritures différentes.</li>
          <li>Relations faites de guerres, de commerce et d'échanges culturels.</li>
        </ul>
      </div>
      <div class="bloc exemple">
        <h3>Exemple et application RDC</h3>
        <p><img src="images/Histoire1_9.jpg" alt="Carte de la Nubie antique" /></p>
        <p><strong>Exemple :</strong> Les rois kouchites de Napata conquièrent l'Égypte et y fondent la XXVe dynastie (vers 747-656 av. J.-C.). Ils adoptent les hiéroglyphes et les pyramides, mais conservent leurs propres traditions.</p>
        <p><strong>Application RDC :</strong> Montrer que l'Afrique a connu plusieurs foyers de civilisation étatique, pas seulement l'Égypte. Cette diversité prépare la compréhension des royaumes du bassin du Congo.</p>
      </div>
      <div class="bloc cas">
        <h3>Exercices</h3>
        <p><strong>Ex. 1 :</strong> Où se situe la Nubie ?</p>
        <p><strong>Ex. 2 :</strong> Cite deux capitales du royaume de Kouch.</p>
        <p><strong>Ex. 3 :</strong> Quel royaume africain antique contrôle la mer Rouge et devient chrétien ?</p>
        <details><summary>Corrigé</summary>
          <p>1) Au sud de l'Égypte, dans l'actuel Soudan.</p>
          <p>2) Napata et Méroé.</p>
          <p>3) Axoum.</p>
        </details>
      </div>
      <div class="bloc resume">
        <h3>Synthèse</h3>
        <p>Les royaumes du Haut-Nil (Kouch, Napata, Méroé, Axoum) sont des civilisations africaines majeures, en relation constante avec l'Égypte.</p>
      </div>
    
},
{
title: "Leçon 8 — Les autres foyers de civilisation africaine",
content: 
      <div class="bloc cas">
        <h2>Les autres foyers de civilisation africaine</h2>
        <p><strong>Objectifs :</strong> (1) citer d'autres foyers africains (Nok, Great Zimbabwe, etc.) ; (2) décrire leurs réalisations ; (3) comprendre la diversité des civilisations africaines.</p>
        <p><strong>Prérequis :</strong> leçons 6 et 7.</p>
        <p><strong>Situation de départ :</strong> « L'Afrique ne se résume pas à l'Égypte. Quelles autres grandes civilisations y a-t-il eues ? »</p>
      </div>
      <div class="bloc theorie">
        <h3>Développement</h3>
        <p>La culture <strong>Nok</strong> (Nigeria central, v. 900 av. J.-C. – 200 apr. J.-C.) est célèbre pour ses terres cuites et sa métallurgie du fer précoce.</p>
        <p><strong>Great Zimbabwe</strong> (XIe-XVe siècles, Zimbabwe actuel) est la plus grande structure de pierre médiévale d'Afrique subsaharienne, liée au commerce de l'or et de l'ivoire.</p>
        <p>D'autres foyers existent : la civilisation de Djenné-Djeno (Mali), les cités swahili de la côte est, les royaumes de l'Afrique des Grands Lacs, etc.</p>
        <h3>Définitions</h3>
        <ul>
          <li><strong>Nok :</strong> culture du Nigeria ancien, connue pour ses sculptures en terre cuite.</li>
          <li><strong>Great Zimbabwe :</strong> ensemble de ruines de pierre au Zimbabwe, témoignant d'un État puissant au Moyen Âge.</li>
          <li><strong>Foyer de civilisation :</strong> région où se développent des innovations majeures (agriculture, métallurgie, État, écriture…).</li>
        </ul>
        <h3>Méthodes</h3>
        <ul>
          <li>Localiser sur une carte d'Afrique : Égypte/Nubie (nord-est), Nok (Afrique de l'Ouest), Great Zimbabwe (Afrique australe), royaumes des Grands Lacs (Afrique de l'Est).</li>
          <li>Comparer leurs réalisations : arts, architecture, métallurgie, commerce.</li>
          <li>Éviter l'eurocentrisme : ces civilisations ont leurs propres logiques, elles ne sont pas de simples « copies » de l'Égypte.</li>
        </ul>
      </div>
      <div class="bloc exemple">
        <h3>Exemple et application RDC</h3>
        <p><img src="images/Histoire1_11.jpg" alt="Tête en terre cuite de la culture Nok" /></p>
        <p><strong>Exemple :</strong> Les terres cuites Nok représentent des visages humains avec une grande maîtrise technique ; elles montrent qu'une tradition artistique majeure existait en Afrique de l'Ouest bien avant l'arrivée des Européens.</p>
        <p><strong>Application RDC :</strong> Le royaume de Kongo et les royaumes Luba/Lunda s'inscrivent dans cette longue histoire de créations étatiques et artistiques africaines.</p>
      </div>
      <div class="bloc cas">
        <h3>Exercices</h3>
        <p><strong>Ex. 1 :</strong> Dans quel pays actuel se trouve la culture Nok ?</p>
        <p><strong>Ex. 2 :</strong> Qu'est-ce que Great Zimbabwe ?</p>
        <p><strong>Ex. 3 :</strong> Pourquoi parle-t-on de « foyers » de civilisation au pluriel ?</p>
        <details><summary>Corrigé</summary>
          <p>1) Le Nigeria.</p>
          <p>2) Un ensemble de ruines de pierre médiévales au Zimbabwe.</p>
          <p>3) Parce que plusieurs régions d'Afrique ont développé indépendamment des civilisations brillantes.</p>
        </details>
      </div>
      <div class="bloc resume">
        <h3>Synthèse</h3>
        <p>L'Afrique est un continent de civilisations diverses, pas une périphérie de l'Égypte.</p>
      </div>
    
},

{
title: "Leçon 9 — Les migrations africaines et bantoues",
content: 
      <div class="bloc cas">
        <h2>Les migrations africaines et bantoues</h2>
        <p><strong>Objectifs :</strong> (1) définir une migration ; (2) expliquer les causes et les itinéraires des migrations bantoues ; (3) décrire le peuplement du Congo.</p>
        <p><strong>Prérequis :</strong> leçons 4 et 8.</p>
        <p><strong>Situation de départ :</strong> « Pourquoi les peuples bantous ont-ils quitté leur région d'origine pour s'installer dans presque toute l'Afrique centrale et australe ? »</p>
      </div>
      <div class="bloc theorie">
        <h3>Développement</h3>
        <p>Une <strong>migration</strong> est un déplacement durable d'une population d'une région vers une autre.</p>
        <p>Les <strong>migrations bantoues</strong> commencent vers 3000-2000 av. J.-C. depuis la région du Nigeria-Cameroun actuel, puis se diffusent vers le sud et l'est de l'Afrique sur plusieurs millénaires.</p>
        <p><strong>Causes :</strong> croissance démographique, recherche de terres fertiles, maîtrise de l'agriculture et de la métallurgie, commerce, conflits.</p>
        <p><strong>Conséquences :</strong> diffusion des langues bantoues, brassage des populations, formation de nouvelles sociétés.</p>
        <h3>Définitions</h3>
        <ul>
          <li><strong>Migration :</strong> déplacement de population.</li>
          <li><strong>Bantou :</strong> famille de langues africaines et ensemble de peuples qui les parlent.</li>
          <li><strong>Berceau bantou :</strong> région du Nigeria-Cameroun actuel, d'où partent les migrations.</li>
          <li><strong>Brassage :</strong> mélange de populations et de cultures.</li>
        </ul>
        <h3>Méthodes</h3>
        <ul>
          <li>Lire une carte des migrations : point de départ, flèches, dates, zones atteintes.</li>
          <li>Croiser les sources : linguistique (comparaison des langues), archéologie (poteries, outils), génétique.</li>
          <li>Expliquer le peuplement du Congo, les itinéraires et les conséquences.</li>
        </ul>
      </div>
      <div class="bloc exemple">
        <h3>Exemple et application RDC</h3>
        <p><img src="images/Histoire1_13.jpg" alt="Carte des migrations bantoues en Afrique" /></p>
        <p><strong>Exemple :</strong> Les langues bantoues sont aujourd'hui parlées du Cameroun à l'Afrique du Sud ; leur diffusion témoigne de l'ampleur des migrations.</p>
        <p><strong>Application RDC :</strong> Le peuplement du bassin du Congo résulte de vagues successives de migrations (bantoues et non bantoues) ; les groupes actuels (Mongo, Luba, Kongo, etc.) sont les héritiers de ces mouvements.</p>
      </div>
      <div class="bloc cas">
        <h3>Exercices</h3>
        <p><strong>Ex. 1 :</strong> D'où partent les migrations bantoues ?</p>
        <p><strong>Ex. 2 :</strong> Cite deux causes de migration.</p>
        <p><strong>Ex. 3 :</strong> Qu'est-ce qu'une langue bantoue ? Donne un exemple parlé en RDC.</p>
        <details><summary>Corrigé</summary>
          <p>1) De la région du Nigeria-Cameroun actuel.</p>
          <p>2) Croissance démographique ; recherche de terres ; conflits ; commerce.</p>
          <p>3) Une langue de la famille bantoue (ex. : lingala, swahili, kikongo, tshiluba…).</p>
        </details>
      </div>
      <div class="bloc resume">
        <h3>Synthèse</h3>
        <p>Les migrations bantoues expliquent en grande partie le peuplement de l'Afrique centrale et australe et la diversité linguistique du Congo.</p>
      </div>
    
},
{
title: "Leçon 10 — La formation des grands groupes du bassin du Congo",
content: 
      <div class="bloc cas">
        <h2>La formation des grands groupes du bassin du Congo</h2>
        <p><strong>Objectifs :</strong> (1) distinguer sociétés étatiques et non étatiques ; (2) citer les grands groupes du bassin du Congo ; (3) expliquer leur organisation.</p>
        <p><strong>Prérequis :</strong> leçon 9.</p>

function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}

function renderSlide(index, keepHighlight) {

    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}

      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
