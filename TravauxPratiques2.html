<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours de Travaux Pratiques couvre cinq leçons : la sécurité, l'organisation et la préparation du poste de travail ; la lecture de la consigne et la planification de l'intervention ; l'exécution de l'intervention (gestes et procédures) ; le contrôle qualité et la correction des défauts ; enfin la fiche d'intervention et le compte rendu de travaux pratiques.</p>
<p><strong>Note importante :</strong> le programme officiel d'un cours générique de « Travaux Pratiques » pour la 2e année des humanités n'a pas été retrouvé dans un document unique. La progression proposée ici est transversale : elle s'appuie sur les fiches pédagogiques officielles des options Mécanique Automobile, Maçonnerie et Menuiserie (Édition 2025, RDC), sur le Manuel de Travaux Pratiques (Labo) 2e année et sur le référentiel de compétences du PEQPESU. Elle doit être validée par un enseignant de la filière technique. Les équipements et matériaux réellement disponibles dans les ateliers doivent être vérifiés avant toute activité.</p>
<ul>
<li>Leçon 1 — Sécurité, organisation et préparation du poste de travail</li>
<li>Leçon 2 — Lecture de la consigne et planification de l'intervention</li>
<li>Leçon 3 — Exécution de l'intervention : gestes et procédures</li>
<li>Leçon 4 — Contrôle qualité et correction des défauts</li>
<li>Leçon 5 — Fiche d'intervention et compte rendu de travaux pratiques</li>
</ul>
<p>L'évaluation finale porte sur l'ensemble des leçons. Sa pondération suit la logique du travail pratique : préparation et sécurité (20 %), lecture et planification (20 %), exécution et contrôle (40 %), fiche d'intervention (20 %).</p>
</div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Travaux Pratiques (Labo) 2e année, option Mécanique Automobile (Édition 2025, RDC) ; fiches pédagogiques Travaux Pratiques : Ouvrages en Terre, Adobe, Finitions, 2e année Maçonnerie (Édition 2025, RDC) ; fiches pédagogiques Travaux Pratiques 2e année, option Menuiserie (Édition 2025, RDC) ; Manuel de Travaux Pratiques (Labo) 2e année, option Mécanique Automobile (Édition 2025, RDC) ; référentiel de compétences PEQPESU (RDC).</div>

{
    title: "Leçon 1 — Sécurité, organisation et préparation du poste de travail",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Dans un atelier, deux élèves travaillent côte à côte. L'un a préparé ses outils et rangé ses chutes de bois ; l'autre cherche sa râpe, enjambe des planches et a oublié ses lunettes. Lequel terminera son ouvrage sans accident ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Appliquer les règles générales et spécifiques de sécurité. Choisir et porter les EPI adaptés. Organiser l'espace de travail et la circulation. Préparer les outils et les matériaux. Rédiger une fiche de préparation. Gérer les déchets. Prérequis : notions de base du métier de l'option et respect des consignes.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>1. Règles générales de sécurité.</strong> Elles valent dans tous les ateliers : ne pas courir, ne pas plaisanter pendant une opération dangereuse, ne jamais utiliser une machine sans autorisation, signaler immédiatement un outil défectueux, garder les mains sèches et propres, respecter les consignes affichées.</p>
<p><strong>2. Règles spécifiques au métier.</strong> Elles dépendent de l'option : en menuiserie, on surveille l'affûtage et le sens de coupe ; en maçonnerie, on contrôle la stabilité des échafaudages et le port du casque ; en mécanique automobile, on consigne le véhicule, on calle la charge et on évite tout contact avec les organes chauds. L'élève doit connaître les règles de son propre atelier.</p>
<p><strong>3. Équipements de protection individuelle (EPI).</strong> Lunettes de protection (projections), gants (coupures, produits), chaussures de sécurité (chutes d'objets), protection auditive (machines bruyantes), masque (poussières, vapeurs), bleu de travail ajusté. L'EPI se choisit selon le risque réel de l'opération, pas selon l'habitude.</p>
<p><strong>4. Organisation de l'espace.</strong> Trois zones se distinguent : la zone de travail (autour de l'établi ou de la machine), la zone de stockage des matériaux et la voie de circulation. Les outils en cours d'usage restent sur le plan de travail ; les outils inutilisés retournent au tableau ou à la caisse. Le sol reste dégagé.</p>
<p><strong>5. Préparation des outils et des matériaux.</strong> Vérifier la présence, l'état et l'affûtage des outils ; contrôler la quantité, les dimensions et la qualité des matériaux ; préparer les consommables (vis, colle, mortier, chiffons). Un outil manquant découvert en cours de travail provoque arrêt, improvisation et erreur.</p>
<p><strong>6. Fiche de préparation.</strong> C'est un document écrit, court et lisible, qui rassemble : l'objectif de l'intervention, la liste des outils, la liste des matériaux et consommables, les EPI nécessaires, les consignes de sécurité et l'ordre prévu des opérations. Elle est rédigée avant de commencer et reste visible pendant le travail.</p>
<p><strong>7. Gestion des déchets.</strong> Les chutes de bois, les gravats, les chiffons souillés, les emballages et les copeaux métalliques ne restent pas au sol. Ils sont triés puis évacués vers les zones ou bacs prévus. Un atelier propre limite les chutes, les coupures et les incendies.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>EPI :</strong> équipement de protection individuelle, porté par la personne qui travaille.</p>
<p><strong>Poste de travail :</strong> espace matériel où l'élève réalise son opération (établi, machine, chantier).</p>
<p><strong>Fiche de préparation :</strong> document listant outils, matériaux, EPI, consignes et étapes avant l'intervention.</p>
<p><strong>Déchet d'atelier :</strong> résidu produit par le travail (chutes, copeaux, gravats, emballages, chiffons).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p><strong>Méthode de préparation en cinq temps :</strong> 1) lire la consigne ; 2) rassembler outils et matériaux ; 3) vérifier leur état ; 4) choisir les EPI ; 5) rédiger la fiche de préparation. Ensuite seulement, commencer le travail.</p>
<p><strong>Règles d'or :</strong> on ne commence jamais sans préparation ; on ne travaille jamais sans EPI ; on ne laisse jamais traîner un outil ; on ne quitte jamais un poste sans l'avoir rangé et nettoyé.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple (RDC)</div>
<p>Dans un atelier de menuiserie de Kinshasa, un élève doit débiter une planche. Avant de commencer, il vérifie l'affûtage de sa scie, mesure et marque la planche, pose ses lunettes et ses gants, dégage le sol des chutes, installe sa fiche de préparation près de l'établi et prévoit un bac pour les chutes. Il peut alors commencer sa coupe dans de bonnes conditions.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Citer trois EPI et le risque que chacun réduit. <strong>Ex. 2 :</strong> Citer quatre éléments d'une fiche de préparation. <strong>Ex. 3 :</strong> Pourquoi ranger les outils après usage ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Lunettes → projections ; gants → coupures et produits ; chaussures de sécurité → chute d'objets (autres réponses possibles). <strong>2)</strong> Objectif, outils, matériaux, EPI, consignes, étapes (quatre au choix). <strong>3)</strong> Pour éviter les accidents, gagner du temps et retrouver rapidement l'outil lors de la prochaine intervention.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un poste préparé est un travail à moitié réussi : sécurité, ordre et préparation sont les fondations de tout travail pratique.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Travaux Pratiques 2e année, option Menuiserie (Édition 2025, RDC) ; Manuel de Travaux Pratiques (Labo) 2e année, option Mécanique Automobile (Édition 2025, RDC).</div>
    `
},
{
    title: "Leçon 2 — Lecture de la consigne et planification de l'intervention",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Deux élèves reçoivent la même fiche de fabrication pour un assemblage. Le premier coupe immédiatement ses pièces ; le second relit la fiche, repère les dimensions, note l'ordre des opérations et commence. Qui risque de devoir tout recommencer ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Lire une consigne, un plan, un schéma ou une fiche de fabrication. Identifier les étapes et les points critiques. Estimer le temps et les moyens nécessaires. Établir une planification réaliste. Prérequis : leçon 1 (préparation du poste) et lecture de base.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>1. Les documents de travail.</strong> La <em>consigne</em> dit ce qu'il faut faire et dans quelles conditions. Le <em>plan</em> donne les dimensions, les vues et les repères. Le <em>schéma</em> explique le principe de montage ou de raccordement. La <em>fiche de fabrication</em> réunit les matériaux, les dimensions, les tolérances et la suite des opérations.</p>
<p><strong>2. Lecture méthodique.</strong> On lit d'abord l'ensemble du document sans rien faire, puis on repère : la nature de l'ouvrage, les dimensions et unités, les matériaux, les tolérances, les symboles et le sens des vues. On souligne les informations décisives. Une lecture en diagonale fait perdre plus de temps qu'elle n'en fait gagner.</p>
<p><strong>3. Tolérances.</strong> Une tolérance est l'écart admissible autour d'une dimension nominale. Elle dit ce qui est acceptable et ce qui ne l'est pas. Négliger une tolérance, c'est produire une pièce qui n'entre pas, qui force ou qui laisse un jeu excessif.</p>
<p><strong>4. Étapes et points critiques.</strong> On découpe le travail en opérations successives : traçage, coupe, assemblage, montage, finition. Un <em>point critique</em> est une étape où une erreur devient difficile ou coûteuse à corriger : une mesure de départ fausse, un sens d'assemblage inversé, un dosage de mortier incorrect. Ces points sont repérés et surveillés en priorité.</p>
<p><strong>5. Estimation du temps et des moyens.</strong> On évalue la durée de chaque opération, le nombre d'outils nécessaires, la quantité de matériaux et la disponibilité de l'atelier. Une planification irréaliste conduit à la précipitation, donc à l'erreur.</p>
<p><strong>6. Planification.</strong> C'est l'ordonnancement écrit des opérations dans le temps, avec les moyens associés. Elle indique par quoi commencer, ce qui peut être fait en parallèle et ce qui doit attendre.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Fiche de fabrication :</strong> document décrivant un ouvrage à réaliser (matériaux, dimensions, tolérances, étapes).</p>
<p><strong>Tolérance :</strong> écart admissible autour d'une dimension nominale.</p>
<p><strong>Point critique :</strong> étape où une erreur compromet la suite ou le résultat.</p>
<p><strong>Planification :</strong> ordonnancement préalable des opérations dans le temps, avec leurs moyens.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p><strong>Méthode de lecture en quatre passes :</strong> 1) survoler le document entier ; 2) repérer dimensions, unités et matériaux ; 3) relever les tolérances et les symboles ; 4) lister les étapes dans l'ordre.</p>
<p><strong>Règles :</strong> ne jamais couper avant d'avoir compris ; vérifier l'unité de mesure utilisée ; noter les points critiques par écrit ; confronter la planification aux moyens réellement disponibles.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple (RDC)</div>
<p>Avant de réaliser un assemblage en menuiserie, l'élève lit le plan, relève les dimensions des montants et des traverses, note la tolérance admise, identifie l'ordre des opérations (traçage, coupe, mortaisage, assemblage, finition) et prévoit le temps nécessaire à chaque étape. Le point critique est le traçage : une erreur à ce stade fausse tout l'assemblage.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Que contient une fiche de fabrication ? <strong>Ex. 2 :</strong> Pourquoi les tolérances doivent-elles être respectées ? <strong>Ex. 3 :</strong> Lister les étapes d'un assemblage simple à partir d'un plan.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Matériaux, dimensions et unités, tolérances, étapes de fabrication. <strong>2)</strong> Parce qu'elles définissent ce qui est acceptable : au-delà, la pièce est non conforme (jeu excessif, montage forcé). <strong>3)</strong> Traçage, coupe, ajustage, assemblage, contrôle, finition (ordre logique).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Bien lire, c'est déjà exécuter : la planification évite les oublis, les reprises et les pertes de temps.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Travaux Pratiques 2e année, option Menuiserie (Édition 2025, RDC) ; référentiel de compétences PEQPESU (RDC).</div>
    `
},
{
    title: "Leçon 3 — Exécution de l'intervention : gestes et procédures",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un élève maçonne un mur en blocs. À la troisième rangée, il constate que le mur penche. Il continue quand même et décide de « redresser à la fin ». Que va-t-il se passer ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Exécuter les gestes techniques du métier (traçage, coupe, assemblage, montage, dosage, finition). Respecter la procédure prévue. Contrôler pendant l'exécution. Gérer les imprévus sans panique. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>1. Les gestes techniques selon le métier.</strong> En menuiserie : traçage, sciage, rabotage, mortaisage, assemblage. En maçonnerie : implantation, dosage du mortier, pose de blocs, contrôle de l'aplomb et de l'horizontalité, finition. En mécanique automobile : dépose, repose, serrage au couple, réglage. Le geste juste est celui qui est à la fois conforme au plan et adapté à la matière.</p>
<p><strong>2. Respect de la procédure.</strong> La procédure issue de la fiche de fabrication donne l'ordre des opérations. Changer cet ordre sans raison conduit presque toujours à une impasse : on assemble avant d'avoir ajusté, on finit avant d'avoir contrôlé.</p>
<p><strong>3. Contrôle pendant l'exécution.</strong> On vérifie au fur et à mesure, pas seulement à la fin : dimensions après la coupe, équerrage après l'assemblage, aplomb à chaque rangée, serrage après le montage. Un défaut détecté tôt se corrige en quelques minutes ; détecté à la fin, il impose une reprise complète.</p>
<p><strong>4. Gestion des imprévus.</strong> Un imprévu est un écart entre ce qui était prévu et ce qui se présente : outil qui casse, matériau non conforme, pièce qui ne s'ajuste pas. La réaction correcte est de s'arrêter, d'analyser la cause, de signaler si nécessaire, puis d'adapter la solution sans violer la sécurité ni la procédure.</p>
<p><strong>5. Ne jamais forcer.</strong> Une pièce qui résiste révèle une erreur de mesure, d'orientation ou d'ajustage. Forcer abîme la pièce, l'outil et peut provoquer un accident.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Procédure :</strong> suite ordonnée d'opérations à réaliser pour obtenir un résultat conforme.</p>
<p><strong>Aplomb :</strong> verticalité correcte d'un mur ou d'un montant.</p>
<p><strong>Dosage :</strong> proportion des constituants d'un mélange (par exemple mortier : ciment, sable, eau).</p>
<p><strong>Imprévu :</strong> événement non prévu qui perturbe le déroulement de l'intervention.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p><strong>Méthode d'exécution :</strong> préparer le geste → exécuter lentement la première fois → contrôler immédiatement → corriger si nécessaire → poursuivre.</p>
<p><strong>Règles :</strong> suivre la procédure ; contrôler à chaque étape ; ne jamais forcer une pièce ; respecter les tolérances ; en cas d'imprévu, s'arrêter, analyser, signaler, adapter.</p>
</div>

</details>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Appliquer les critères de qualité. Utiliser les instruments de contrôle. Identifier les défauts dimensionnels, visuels et fonctionnels. Proposer et réaliser une correction. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>1. Critères de qualité.</strong> Une réalisation est conforme lorsqu'elle respecte : les <em>dimensions</em> (longueur, largeur, épaisseur, angles), l'<em>aspect</em> (surface propre, pas de bavure, pas d'éclat), la <em>fonctionnalité</em> (la pièce remplit son rôle, s'emboîte, se monte) et, le cas échéant, l'<em>étanchéité</em> (eau, air).</p>
<p><strong>2. Instruments de contrôle.</strong> Le <em>mètre</em> mesure les longueurs. L'<em>équerre</em> vérifie l'angle droit. Le <em>niveau</em> vérifie l'horizontalité ; l'aplomb (fil à plomb) vérifie la verticalité. Le <em>pied à coulisse</em> mesure avec précision de petites dimensions et épaisseurs. Chaque instrument répond à une question précise : le choisir correctement fait partie du contrôle.</p>
<p><strong>3. Types de défauts.</strong> <em>Dimensionnel</em> : longueur hors tolérance, angle non droit. <em>Visuel</em> : rayure, éclat, bavure, tache. <em>Fonctionnel</em> : pièce qui force, jeu excessif, montage impossible. Un défaut visuel mineur peut devenir fonctionnel s'il n'est pas traité.</p>

<p><strong>5. Le contrôle visuel seul est insuffisant.</strong> L'œil ne mesure pas un angle ni une épaisseur. Tout contrôle sérieux associe l'examen visuel et la mesure instrumentée.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Contrôle qualité :</strong> ensemble des vérifications qui établissent la conformité d'une réalisation.</p>
<p><strong>Défaut :</strong> écart entre le résultat obtenu et le résultat attendu.</p>
<p><strong>Reprise :</strong> opération de correction d'un défaut identifié.</p>
<p><strong>Conformité :</strong> respect de toutes les exigences du plan et des tolérances.</p>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un élève a parfaitement réalisé son ouvrage, mais ne peut rien expliquer : ni les dimensions finales, ni les défauts corrigés, ni la procédure suivie. Peut-il prouver que le travail a été fait correctement ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Rédiger une fiche d'intervention complète. Structurer un compte rendu de travaux pratiques. Assurer la traçabilité du travail. Présenter oralement sa réalisation. Prérequis : leçons 1 à 4.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>1. La fiche d'intervention.</strong> C'est la trace écrite du travail réalisé. Elle comporte : l'<em>identification</em> (nom de l'élève, date, atelier, ouvrage), l'<em>objectif</em> de l'intervention, les <em>étapes</em> suivies, les <em>résultats</em> (dimensions finales, aspect), les <em>observations</em> (défauts constatés, corrections apportées, difficultés rencontrées).</p>
<p><strong>2. Le compte rendu de TP.</strong> Il est plus développé et suit une structure stable : <em>objectif</em> (ce que l'on voulait obtenir), <em>protocole</em> (procédure réellement suivie, avec outils et matériaux), <em>résultats</em> (mesures, observations, état final), <em>analyse</em> (écarts par rapport au plan, causes, corrections), <em>conclusion</em> (conformité, enseignements à retenir).</p>
<p><strong>3. La traçabilité.</strong> Écrire, c'est conserver la mémoire de l'intervention : on peut vérifier après coup ce qui a été fait, quand, comment et avec quels résultats. Cette mémoire sert à l'élève, à l'enseignant et, plus tard, à l'employeur.</p>
<p><strong>4. Qualités d'une bonne rédaction.</strong> Clair, précis, objectif, daté, sans bavardage. On écrit des faits et des mesures, pas des impressions vagues. Les observations sont le cœur de la fiche : c'est là que se voit la réflexion de l'élève.</p>
<p><strong>5. Présentation orale.</strong> Présenter son travail, c'est expliquer sa démarche : objectif, étapes, difficultés, corrections, résultat. La présentation vérifie la compréhension réelle et permet le partage d'expérience avec le groupe.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Fiche d'intervention :</strong> document synthétique qui enregistre une intervention réalisée.</p>
<p><strong>Compte rendu de TP :</strong> document structuré décrivant objectif, protocole, résultats, analyse et conclusion.</p>
<p><strong>Traçabilité :</strong> capacité à retrouver l'historique d'une intervention grâce à sa trace écrite.</p>
<p><strong>Observation :</strong> remarque factuelle notée pendant ou après le travail (écart, difficulté, correction).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p><strong>Méthode de rédaction :</strong> 1) identifier l'intervention ; 2) écrire l'objectif en une phrase ; 3) lister les étapes réellement suivies ; 4) noter les résultats mesurés ; 5) consigner les observations et les corrections ; 6) conclure sur la conformité.</p>
<p><strong>Règles :</strong> rédiger immédiatement après le travail ; ne jamais laisser la rubrique « observations » vide ; noter les dimensions réelles, pas les dimensions prévues ; rester factuel et lisible.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple (RDC)</div>

</div>

      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
