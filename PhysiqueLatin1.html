<script>
const COURSE_TITLE = "Physique approfondie (Latin-Math)";
const slides = [
{
    title: "Sommaire — Physique approfondie 1re secondaire",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>La physique approfondie t'apprend à décrire le monde avec rigueur : mesurer, calculer, représenter, démontrer. Dans cette option, tu utiliseras les mathématiques (vecteurs, fonctions, graphiques) pour comprendre les forces, les mouvements, l'énergie, l'électricité et la lumière. Tu découvriras aussi l'origine latine et grecque des mots de la physique.</p>
<ul>
<li>Leçon 1 — Grandeurs, unités et analyse dimensionnelle</li>
<li>Leçon 2 — Mesures et incertitudes</li>
<li>Leçon 3 — Vecteurs et forces</li>
<li>Leçon 4 — Équilibre des forces et moments</li>
<li>Leçon 5 — Cinématique : le mouvement rectiligne uniforme</li>
<li>Leçon 6 — Cinématique : le mouvement rectiligne uniformément varié</li>
<li>Leçon 7 — Les lois de Newton</li>
<li>Leçon 8 — Travail, énergie et puissance</li>
<li>Leçon 9 — Énergie cinétique et potentielle</li>
<li>Leçon 10 — Pression et statique des fluides</li>
<li>Leçon 11 — Électricité : circuits et loi d'Ohm</li>
<li>Leçon 12 — Optique géométrique : réflexion et réfraction</li>
</ul>
<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme national de Physique (EDIDEPS, 2007), Manuel de Physique 1re année (2025). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 1 — Grandeurs, unités et analyse dimensionnelle",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une vitesse s'exprime-t-elle en m/s ? Pourquoi ne peut-on pas additionner des mètres et des secondes ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Distinguer grandeur et unité. Utiliser les unités SI. Vérifier l'homogénéité d'une formule. Prérequis : leçons de mathématiques sur les grandeurs.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une <strong>grandeur physique</strong> est une propriété mesurable d'un objet ou d'un phénomène. Elle s'exprime par un nombre suivi d'une unité.</p>
<p><strong>Sept grandeurs de base du SI :</strong> longueur (m), masse (kg), temps (s), intensité du courant (A), température (K), quantité de matière (mol), intensité lumineuse (cd).</p>
<p><strong>Grandeurs dérivées :</strong> vitesse (m/s), accélération (m/s²), force (N = kg·m/s²), énergie (J = kg·m²/s²), puissance (W = J/s), pression (Pa = N/m²).</p>
<p><strong>Analyse dimensionnelle :</strong> toute formule physique doit être homogène. Exemple : v = d/t → [v] = L/T = m/s.</p>
</div>
<img src="images/PhysiqueLatin1_1.jpg" alt="Tableau des unités SI" data-image-id="PhysiqueLatin1_1" onerror="this.style.display='none'">
<img src="images/PhysiqueLatin1_16.jpg" alt="Pousse-pousse à Kinshasa" data-image-id="PhysiqueLatin1_16" onerror="this.style.display='none'">

<h3>3. Méthodes et exemples</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour vérifier une formule : remplacer chaque grandeur par sa dimension et vérifier l'égalité. Exemple : P = m × g → [P] = M·L/T² ; [m] = M ; [g] = L/T² → homogène.</p>
<p>Préfixes : kilo (10³), méga (10⁶), giga (10⁹), milli (10⁻³), micro (10⁻⁶), nano (10⁻⁹).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un camion transporte 5 t = 5 000 kg. Un réservoir contient 200 L = 0,2 m³. Un moteur développe 2 kW = 2 000 W.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Vérifie l'homogénéité de v = d/t.</p>
<p><strong>Ex. 2 :</strong> Convertis 3,5 km en m ; 250 g en kg.</p>
<details><summary>Corrigé</summary>
<p>1) [v] = L/T = m/s ; [d/t] = L/T = m/s. Homogène. 2) 3 500 m ; 0,25 kg.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les grandeurs et unités sont la base de la physique ; l'analyse dimensionnelle permet de vérifier les formules.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Physique (EDIDEPS).</div>
    `
},
{
    title: "Leçon 2 — Mesures et incertitudes",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Deux élèves mesurent la même longueur et trouvent 1,20 m et 1,22 m. Qui a raison ? La mesure est-elle exacte ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre qu'aucune mesure n'est exacte. Exprimer une incertitude. Utiliser les chiffres significatifs. Prérequis : leçon 1.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Toute mesure est entachée d'une <strong>incertitude</strong> liée à l'instrument, à l'opérateur et aux conditions.</p>
<p><strong>Incertitude absolue :</strong> ± la plus petite graduation. Une règle au mm a une incertitude de ± 1 mm.</p>
<p><strong>Incertitude relative :</strong> incertitude absolue / valeur mesurée (en %).</p>
<p><strong>Chiffres significatifs :</strong> nombre de chiffres qui ont un sens. On ne donne pas plus de chiffres que la précision.</p>
<p><strong>Écriture d'une mesure :</strong> valeur ± incertitude (ex. : 12,3 cm ± 0,1 cm).</p>
</div>
<img src="images/PhysiqueLatin1_2.jpg" alt="Règle graduée" data-image-id="PhysiqueLatin1_2" onerror="this.style.display='none'">

<h3>3. Méthodes et exemples</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour exprimer une mesure : valeur ± incertitude, avec l'unité. Pour arrondir : si le chiffre suivant est ≥ 5, on arrondit au supérieur. Règle des chiffres significatifs : le résultat ne doit pas avoir plus de chiffres significatifs que la donnée la moins précise.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une règle au mm mesure 12,3 cm. Incertitude absolue : 0,1 cm. Incertitude relative : 0,1/12,3 ≈ 0,8 %. Mesure : 12,3 cm ± 0,1 cm.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Une balance affiche 2,50 kg avec une précision de 0,05 kg. Exprime la mesure.</p>
<details><summary>Corrigé</summary>
<p>2,50 kg ± 0,05 kg.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La mesure est toujours approximative ; les chiffres significatifs et l'incertitude expriment la précision.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Physique.</div>
    `
},
{
    title: "Leçon 3 — Vecteurs et forces",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une force est-elle représentée par une flèche ? Comment additionner deux forces ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir un vecteur. Représenter une force par un vecteur. Additionner deux vecteurs graphiquement. Prérequis : leçons 1 et 2, notions de géométrie.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un <strong>vecteur</strong> est caractérisé par : un point d'application, une direction, un sens et une norme (intensité).</p>
<p>Une <strong>force</strong> est une grandeur vectorielle. Elle se représente par un vecteur.</p>
<p><strong>Addition vectorielle :</strong> méthode du parallélogramme ou mise bout à bout.</p>
<p><strong>Décomposition :</strong> un vecteur peut être décomposé selon deux axes perpendiculaires.</p>
<p><strong>Force résultante :</strong> somme vectorielle de toutes les forces appliquées.</p>
</div>
<img src="images/PhysiqueLatin1_3.jpg" alt="Vecteurs et forces" data-image-id="PhysiqueLatin1_3" onerror="this.style.display='none'">

<h3>3. Méthodes et exemples</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Représenter une force : choisir une échelle (1 cm ↔ 10 N), tracer une flèche au point d'application. Additionner deux vecteurs : les mettre bout à bout ou règle du parallélogramme.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève pousse un chariot avec 50 N vers l'avant, un autre tire avec 30 N dans le même sens : résultante 80 N. Sens opposé : 20 N.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Deux forces de 30 N et 40 N sont perpendiculaires. Quelle est la norme de leur résultante ?</p>
<details><summary>Corrigé</summary>
<p>√(30² + 40²) = √2500 = 50 N.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les vecteurs permettent de représenter et d'additionner les forces ; la résultante détermine le mouvement.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Physique.</div>
    `
},
{
    title: "Leçon 4 — Équilibre des forces et moments",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un tabouret reste-t-il stable ? Pourquoi une porte tourne-t-elle autour de ses gonds ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir l'équilibre. Appliquer la condition d'équilibre de translation. Calculer un moment de force. Prérequis : leçon 3.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un corps est en <strong>équilibre</strong> lorsque les forces qui s'exercent sur lui se compensent.</p>
<p><strong>Équilibre de translation :</strong> la somme vectorielle des forces est nulle (ΣF = 0).</p>
<p><strong>Moment d'une force :</strong> M = F × d, où d est le bras de levier (distance perpendiculaire entre l'axe et la droite d'action). Unité : N·m.</p>
<p><strong>Équilibre de rotation :</strong> la somme des moments dans un sens est égale à la somme des moments dans l'autre sens.</p>
</div>
<img src="images/PhysiqueLatin1_4.jpg" alt="Balançoire à bascule" data-image-id="PhysiqueLatin1_4" onerror="this.style.display='none'">

<h3>3. Méthodes et exemples</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour vérifier un équilibre de translation : faire la somme vectorielle des forces (elle doit être nulle). Pour un moment : M = F × d. Pour l'équilibre de rotation : ΣM (sens horaire) = ΣM (sens anti-horaire).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une vendeuse porte une charge sur la tête : son centre de gravité doit être au-dessus de ses pieds. Une brouette est un levier inter-résistant.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Calcule le moment d'une force de 20 N appliquée à 0,5 m de l'axe.</p>
<details><summary>Corrigé</summary>
<p>M = 20 × 0,5 = 10 N·m.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'équilibre d'un corps dépend de la compensation des forces et des moments.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Physique.</div>
    `
},
{
    title: "Leçon 5 — Cinématique : le mouvement rectiligne uniforme",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un élève met 20 minutes pour aller à l'école, située à 2 km. Comment calculer sa vitesse ? Comment représenter son mouvement ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir la vitesse. Utiliser l'équation horaire du MRU. Tracer et exploiter un graphique. Prérequis : leçons 1 à 4.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>vitesse</strong> est la distance parcourue par unité de temps : v = d / t.</p>
<p>Unités : m/s (SI) ; km/h. Conversion : 1 m/s = 3,6 km/h.</p>
<p><strong>MRU :</strong> trajectoire droite, vitesse constante. Équation horaire : x(t) = x₀ + v × t.</p>
<p><strong>Graphique :</strong> la courbe x(t) est une droite ; la pente représente la vitesse.</p>
</div>
<img src="images/PhysiqueLatin1_5.jpg" alt="Graphique position-temps" data-image-id="PhysiqueLatin1_5" onerror="this.style.display='none'">

<h3>3. Méthodes et exemples</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>v = d / t ; d = v × t ; t = d / v. Convertir : m/s → km/h (×3,6) ; km/h → m/s (÷3,6).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>2 km en 20 min (1/3 h) : v = 2 / (1/3) = 6 km/h ≈ 1,67 m/s. Un piroguier parcourt 12 km en 2 h : v = 6 km/h.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Accélération (a) :</strong> variation de vitesse par unité de temps : a = (v_f − v_i) / t. Unité : m/s².</p>
<p><strong>MRUV :</strong> accélération constante. Équations horaires : v(t) = v₀ + a × t ; x(t) = x₀ + v₀ × t + ½ a × t².</p>
<p><strong>Graphique :</strong> la courbe v(t) est une droite ; la pente représente l'accélération.</p>
<p><strong>Chute libre :</strong> cas particulier où a = g ≈ 9,8 m/s².</p>
</div>
<img src="images/PhysiqueLatin1_6.jpg" alt="Graphique vitesse-temps" data-image-id="PhysiqueLatin1_6" onerror="this.style.display='none'">

<h3>3. Méthodes et exemples</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>a = (v_f − v_i) / t ; v = v₀ + a × t ; d = v₀ × t + ½ a × t². Chute libre : v = g × t ; h = ½ g × t².</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>

</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Une voiture passe de 10 m/s à 30 m/s en 5 s. Calcule son accélération.</p>
<details><summary>Corrigé</summary>

</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'accélération mesure la variation de vitesse ; le MRUV est décrit par des équations horaires et un graphique v(t).</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Physique.</div>

    title: "Leçon 7 — Les lois de Newton",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un chariot continue-t-il à avancer quand on arrête de le pousser ? Pourquoi faut-il une force pour modifier un mouvement ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Énoncer les trois lois de Newton. Appliquer la deuxième loi. Comprendre l'inertie. Prérequis : leçons 3 à 6.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Première loi (inertie) :</strong> un corps conserve son état de repos ou de mouvement rectiligne uniforme si la somme des forces est nulle.</p>
<p><strong>Deuxième loi :</strong> F = m × a. Le newton est la force qui communique à 1 kg une accélération de 1 m/s².</p>
<p><strong>Troisième loi (action-réaction) :</strong> à toute action correspond une réaction égale et opposée.</p>
</div>
<img src="images/PhysiqueLatin1_7.jpg" alt="Chariot poussé par une force" data-image-id="PhysiqueLatin1_7" onerror="this.style.display='none'">

<h3>3. Méthodes et exemples</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Appliquer F = m × a : identifier la force résultante, la masse, calculer l'accélération. Chute libre : a = g ; F = m × g = P.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un pousse-pousse vide se déplace facilement ; chargé, il faut plus de force (F = m × a). Un piroguier rame : l'eau réagit (3e loi).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Une force de 30 N s'exerce sur une masse de 6 kg. Calcule l'accélération.</p>
<details><summary>Corrigé</summary>
<p>a = 30/6 = 5 m/s².</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les lois de Newton relient forces et mouvements ; la deuxième loi est l'outil central de la dynamique.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Physique.</div>
    `
},
{
    title: "Leçon 8 — Travail, énergie et puissance",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi est-il plus fatigant de monter un seau d'eau au 3e étage que de le porter sur 10 m ? Qu'est-ce que l'énergie ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Calculer un travail. Calculer une puissance. Comprendre la conservation de l'énergie. Prérequis : leçons 1 à 7.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Travail (W) :</strong> W = F × d × cos(θ). Si la force est dans le sens du déplacement, W = F × d. Unité : le joule (J).</p>
<p><strong>Puissance (P) :</strong> P = W / t. Unité : le watt (W).</p>
<p><strong>Énergie cinétique :</strong> Ec = ½ m v².</p>
<p><strong>Énergie potentielle de pesanteur :</strong> Ep = m g h.</p>
<p><strong>Conservation :</strong> l'énergie totale reste constante (en l'absence de frottements).</p>
</div>
<img src="images/PhysiqueLatin1_8.jpg" alt="Travail d'une force" data-image-id="PhysiqueLatin1_8" onerror="this.style.display='none'">

<h3>3. Méthodes et exemples</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>W = F × d ; P = W / t ; Ec = ½ m v² ; Ep = m g h. Conservation : Ec + Ep = constante.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Ouvrier soulève 200 N sur 2 m : W = 400 J. En 4 s : P = 100 W. Voiture de 1 000 kg à 20 m/s : Ec = 200 000 J.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Calcule le travail d'une force de 50 N sur 3 m.</p>
<details><summary>Corrigé</summary>
<p>W = 50 × 3 = 150 J.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Travail, énergie et puissance sont des grandeurs essentielles pour comprendre les machines et les phénomènes naturels.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Physique.</div>
    `
},

    title: "Leçon 9 — Énergie cinétique et potentielle",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment un barrage convertit-il l'énergie de l'eau en électricité ? Comment un objet qui tombe acquiert-il de la vitesse ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Distinguer les formes d'énergie. Appliquer la conservation de l'énergie. Résoudre des problèmes de conversion. Prérequis : leçon 8.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Énergie cinétique (Ec) :</strong> ½ m v².</p>
<p><strong>Énergie potentielle de pesanteur (Ep) :</strong> m g h.</p>
<p><strong>Énergie mécanique (Em) :</strong> Ec + Ep. En l'absence de frottements, Em reste constante.</p>
<p><strong>Conversion :</strong> l'énergie cinétique se convertit en énergie potentielle, et réciproquement.</p>
<p><strong>Autres formes :</strong> énergie thermique, chimique, électrique, nucléaire, lumineuse.</p>
</div>
<img src="images/PhysiqueLatin1_9.jpg" alt="Barrage hydroélectrique" data-image-id="PhysiqueLatin1_9" onerror="this.style.display='none'">

<h3>3. Méthodes et exemples</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Calculer Ec : ½ m v². Calculer Ep : m g h. Conservation : Ec₁ + Ep₁ = Ec₂ + Ep₂. Objet lâché : v = √(2gh).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>

</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Un objet de 1 kg est lâché de 10 m. Calcule sa vitesse au sol (g = 10 m/s²).</p>
<details><summary>Corrigé</summary>
<p>v = √(2 × 10 × 10) = √200 ≈ 14,1 m/s.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les formes d'énergie se convertissent ; la conservation de l'énergie permet de résoudre de nombreux problèmes.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Physique.</div>

    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi l'eau du robinet coule-t-elle plus fort au rez-de-chaussée qu'au dernier étage ? Pourquoi une pirogue flotte-t-elle ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir la pression. Calculer une pression hydrostatique. Comprendre la poussée d'Archimède. Prérequis : leçons 1, 8 et 9.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Pression (p) :</strong> force par unité de surface : p = F / S. Unité : le pascal (Pa) = N/m².</p>
<p><strong>Pression hydrostatique :</strong> p = ρ × g × h, où ρ est la masse volumique (kg/m³), h la profondeur (m).</p>
<p><strong>Poussée d'Archimède :</strong> tout corps plongé subit une poussée verticale vers le haut égale au poids du fluide déplacé.</p>
<p><strong>Loi de Pascal :</strong> la pression se transmet intégralement dans toutes les directions.</p>
</div>
<img src="images/PhysiqueLatin1_10.jpg" alt="Pirogue sur le lac Kivu" data-image-id="PhysiqueLatin1_10" onerror="this.style.display='none'">
<img src="images/PhysiqueLatin1_11.jpg" alt="Pression hydrostatique" data-image-id="PhysiqueLatin1_11" onerror="this.style.display='none'">

<h3>3. Méthodes et exemples</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>p = F / S ; p = ρ × g × h. Flottabilité : si la masse volumique du corps est inférieure à celle du fluide, il flotte.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Piscine de 2 m : p = 1 000 × 10 × 2 = 20 000 Pa. Une pirogue flotte car sa masse volumique moyenne est inférieure à celle de l'eau.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>

</div>

<div class="sources"><strong>Sources :</strong> Programme national de Physique.</div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Tension (U) :</strong> en volts (V). <strong>Intensité (I) :</strong> en ampères (A). <strong>Résistance (R) :</strong> en ohms (Ω).</p>
<p><strong>Loi d'Ohm :</strong> U = R × I.</p>
<p><strong>Circuit en série :</strong> même courant ; tensions s'additionnent. <strong>Circuit en dérivation :</strong> même tension ; intensités s'additionnent.</p>
<p><strong>Puissance électrique :</strong> P = U × I.</p>
</div>
<img src="images/PhysiqueLatin1_12.jpg" alt="Circuit électrique simple" data-image-id="PhysiqueLatin1_12" onerror="this.style.display='none'">
<img src="images/PhysiqueLatin1_13.jpg" alt="Multimètre" data-image-id="PhysiqueLatin1_13" onerror="this.style.display='none'">

<h3>3. Méthodes et exemples</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>U = R × I ; I = U / R ; R = U / I. P = U × I. Sécurité : utiliser des piles, jamais le secteur sans encadrement.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>

</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>

</details>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Propagation rectiligne :</strong> dans un milieu homogène, la lumière se propage en ligne droite.</p>
<p><strong>Réflexion :</strong> lois : le rayon incident, le rayon réfléchi et la normale sont dans le même plan ; i = r.</p>
<p><strong>Réfraction :</strong> changement de direction lors d'un changement de milieu. Lois de Snell-Descartes : n₁ × sin(i₁) = n₂ × sin(i₂).</p>
<p><strong>Applications :</strong> miroirs, lentilles, lunettes, prismes, arc-en-ciel.</p>
</div>
<img src="images/PhysiqueLatin1_14.jpg" alt="Réflexion de la lumière" data-image-id="PhysiqueLatin1_14" onerror="this.style.display='none'">

<div class="bloc theorie"><div class="bloc-label">Méthode</div>

</details>
</div>

    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
