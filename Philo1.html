    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>La philosophie n'est pas un savoir réservé aux savants : c'est l'art de questionner ce qui semble évident. Dans ce cours, tu vas apprendre à définir, à raisonner, à argumenter et à douter — des compétences utiles à l'école, dans la vie et dans la société. Tu vas aussi découvrir que l'Afrique a sa propre tradition de pensée.</p>
<ul>
<li>Leçon 1 — La philosophie : définition et étymologie</li>
<li>Leçon 2 — Opinion, opinion vraie et savoir</li>
<li>Leçon 3 — Les branches de la philosophie</li>
<li>Leçon 4 — Le concept et le jugement</li>
<li>Leçon 5 — Le raisonnement et le syllogisme</li>
<li>Leçon 6 — Les sophismes et l'esprit critique</li>
<li>Leçon 7 — Les présocratiques : la naissance de la philosophie</li>
<li>Leçon 8 — Socrate et Platon</li>
<li>Leçon 9 — Aristote</li>
<li>Leçon 10 — Tempels et la philosophie bantoue</li>
<li>Leçon 11 — Hountondji et la critique de l'ethnophilosophie</li>
<li>Leçon 12 — Philosopher en RDC aujourd'hui</li>
</ul>
<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme national de Philosophie (EDIDEPS, 2007), Manuel de Philosophie 1re année (2025). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 1 — La philosophie : définition et étymologie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi y a-t-il quelque chose plutôt que rien ? Qu'est-ce qui est juste ? Suis-je libre ? Ces questions n'ont pas de réponse toute faite : elles sont philosophiques. »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Décomposer le mot « philosophie ». Distinguer la philosophie de l'opinion. Comprendre l'étonnement comme point de départ. Prérequis : aucun.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le mot « philosophie » vient du grec <em>philein</em> (aimer) et <em>sophia</em> (sagesse) : <em>philosophia</em> signifie « amour de la sagesse ». Le philosophe n'est pas celui qui possède la sagesse, mais celui qui la cherche.</p>
<p>La philosophie commence par l'<strong>étonnement</strong> : s'arrêter devant ce qui semble ordinaire et se demander « pourquoi ? ».</p>
<p>Elle se distingue de l'<strong>opinion</strong> (croyance non vérifiée) et de la <strong>science</strong> (qui étudie des objets particuliers).</p>
</div>
<img src="images/Philo1_1.jpg" alt="Buste de Socrate" data-image-id="Philo1_1" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Philosopher, c'est : (1) s'étonner ; (2) questionner ; (3) examiner les réponses possibles ; (4) argumenter ; (5) accepter de ne pas avoir de réponse définitive.</p>
<p>Éviter deux excès : le dogmatisme (croire sans preuve) et le scepticisme (douter de tout sans jamais chercher).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Dans un quartier de Kinshasa, une rumeur affirme qu'une école est « mauvaise ». La philosophie invite à ne pas accepter cette opinion sans examen : qui le dit ? sur quels faits ? quelles preuves ?</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Que signifie étymologiquement « philosophie » ?</p>
<details><summary>Corrigé</summary>
<p>« Amour de la sagesse » (philein + sophia).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La philosophie est une recherche critique qui commence par l'étonnement et refuse l'opinion comme évidence.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Philosophie (EDIDEPS).</div>
    `
},
{
    title: "Leçon 2 — Opinion, opinion vraie et savoir",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Deux personnes disent qu'il va pleuvoir. L'une le dit parce qu'elle l'a rêvé, l'autre parce qu'elle a lu un bulletin météo. Ont-elles le même savoir ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Distinguer opinion, opinion vraie et savoir. Comprendre pourquoi la vérité exige une justification. Appliquer ces distinctions à des cas concrets.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'<strong>opinion</strong> (doxa) est une croyance qui peut être vraie ou fausse, mais qui n'est pas justifiée.</p>
<p>L'<strong>opinion vraie</strong> est une croyance qui se trouve être vraie, mais sans justification : on a « raison par hasard ».</p>
<p>Le <strong>savoir</strong> (epistémè) est une croyance vraie justifiée : on peut expliquer pourquoi elle est vraie, la vérifier, la prouver.</p>
</div>
<img src="images/Philo1_2.jpg" alt="Allégorie de la caverne de Platon" data-image-id="Philo1_2" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour distinguer opinion et savoir, poser trois questions : (1) est-ce vrai ? (2) comment le sais-je ? (3) puis-je le prouver ?</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève affirme que « l'eau bout à 100 °C ». S'il le dit parce qu'il l'a entendu dire, c'est une opinion. S'il l'a vérifié par une expérience avec un thermomètre, c'est un savoir.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la différence entre opinion vraie et savoir ?</p>
<details><summary>Corrigé</summary>
<p>L'opinion vraie est vraie mais non justifiée ; le savoir est vrai et justifié.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La philosophie et la science exigent des justifications ; l'opinion vraie ne suffit pas au savoir.</p></div>

<div class="sources"><strong>Sources :</strong> Platon, La République (allégorie de la caverne).</div>
    `
},
{
    title: "Leçon 3 — Les branches de la philosophie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« La philosophie pose des questions très diverses : sur la connaissance, sur le bien, sur l'être, sur la beauté, sur la société. Comment les classer ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Identifier les grandes branches. Associer chaque branche à ses questions. Comprendre leur complémentarité.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<ul>
<li><strong>Métaphysique :</strong> questions sur l'être, l'existence, Dieu, l'âme.</li>
<li><strong>Épistémologie :</strong> questions sur la nature du savoir.</li>
<li><strong>Logique :</strong> questions sur le raisonnement valide.</li>
<li><strong>Éthique (morale) :</strong> questions sur le bien, le mal, la justice.</li>
<li><strong>Esthétique :</strong> questions sur le beau, l'art.</li>
<li><strong>Philosophie politique :</strong> questions sur l'État, le pouvoir.</li>
</ul>
</div>
<img src="images/Philo1_3.jpg" alt="Branches de la philosophie" data-image-id="Philo1_3" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour identifier une branche : se demander « quelle est la question posée ? ». La logique est l'outil de toutes les branches.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>La question « Faut-il obéir à un pouvoir injuste ? » relève de la philosophie politique et de l'éthique. En RDC, ces questions sont concrètes (justice, corruption).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle branche étudie le raisonnement ?</p>
<details><summary>Corrigé</summary>
<p>La logique.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La philosophie se divise en branches complémentaires, unies par l'exigence de raisonnement rigoureux.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Philosophie (EDIDEPS).</div>
    `
},
{
    title: "Leçon 4 — Le concept et le jugement",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment pensons-nous ? D'abord par des idées générales (concepts), puis en reliant ces idées (jugements). Comment cela fonctionne-t-il ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Distinguer concept et jugement. Comprendre la formation des concepts. Identifier la structure d'un jugement.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>concept</strong> est une idée générale qui rassemble les caractères communs d'un ensemble d'objets (ex. : « mammifère »).</p>
<p>Le <strong>jugement</strong> est l'acte par lequel on relie deux concepts pour affirmer ou nier quelque chose (ex. : « Le chien est un mammifère »).</p>
<p><strong>Structure du jugement :</strong> sujet – copule (est / n'est pas) – prédicat.</p>
</div>
<img src="images/Philo1_4.jpg" alt="Structure d'un jugement" data-image-id="Philo1_4" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour former un concept : observer plusieurs cas, repérer les caractères communs, les abstraire, les nommer.</p>
<p>Pour analyser un jugement : identifier le sujet, le prédicat et la copule ; vérifier si l'affirmation est vraie ou fausse.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Le concept de « justice » rassemble des situations diverses. Le jugement « Cette décision est juste » relie le concept de justice à une situation concrète.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Identifie le sujet, la copule et le prédicat dans « La terre est ronde ».</p>
<details><summary>Corrigé</summary>
<p>Sujet : la terre ; copule : est ; prédicat : ronde.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La pensée se construit par concepts et jugements ; la logique analyse leur structure.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Philosophie (EDIDEPS).</div>
    `
},
{
    title: "Leçon 5 — Le raisonnement et le syllogisme",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment passer de deux affirmations à une conclusion ? Par exemple : tous les hommes sont mortels ; or Socrate est un homme ; donc Socrate est mortel. Pourquoi ce raisonnement est-il valide ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir le raisonnement. Comprendre la structure du syllogisme. Distinguer un raisonnement valide d'un raisonnement faux.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>raisonnement</strong> est une opération qui passe de prémisses à une conclusion.</p>
<p>Le <strong>syllogisme</strong> est un raisonnement déductif composé de trois propositions : la majeure (règle générale), la mineure (cas particulier) et la conclusion.</p>
<p>Exemple : « Tous les hommes sont mortels (majeure) ; Socrate est un homme (mineure) ; donc Socrate est mortel (conclusion). »</p>
</div>
<img src="images/Philo1_5.jpg" alt="Structure du syllogisme" data-image-id="Philo1_5" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour analyser un syllogisme : identifier la majeure, la mineure et la conclusion ; vérifier si la conclusion suit nécessairement.</p>
<p>Un raisonnement peut être valide mais aboutir à une conclusion fausse si une prémisse est fausse.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>« Tous les élèves qui travaillent réussissent ; or Amani travaille ; donc Amani réussit. » Le raisonnement est valide, mais la majeure est discutable.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qu'est-ce qu'un syllogisme ?</p>
<details><summary>Corrigé</summary>
<p>Un raisonnement déductif à trois propositions (majeure, mineure, conclusion).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le syllogisme est l'outil de base du raisonnement déductif ; sa validité ne dépend pas de la vérité des prémisses mais de leur enchaînement.</p></div>

<div class="sources"><strong>Sources :</strong> Aristote, Organon (analyse simplifiée).</div>
    `
},
{
    title: "Leçon 6 — Les sophismes et l'esprit critique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un discours peut sembler convaincant tout en étant faux. Comment repérer les pièges du raisonnement ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>

<li><strong>Homme de paille :</strong> déformer la position adverse.</li>

          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
