    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un son peut-il être grave ou aigu, fort ou faible ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir le son. Identifier ses quatre paramètres. Les distinguer à l'écoute.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le son</div>
<p>Le <strong>son</strong> est une vibration qui se propage dans l'air et que l'oreille perçoit. En musique, on organise ces vibrations pour créer des mélodies, des rythmes et des harmonies.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Quatre paramètres</div>
<ul>
<li><strong>Hauteur :</strong> grave ou aigu (liée à la fréquence).</li>
<li><strong>Intensité :</strong> fort ou faible (liée à l'amplitude).</li>
<li><strong>Timbre :</strong> couleur propre à chaque instrument ou voix.</li>
<li><strong>Durée :</strong> longue ou courte.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Exemples</div>
<ul>
<li>Un tambour produit un son plutôt grave et percussif.</li>
<li>Une flûte produit un son plutôt aigu et clair.</li>
<li>Un même la peut être joué fort au piano et doucement à la guitare : la hauteur est identique, mais l'intensité et le timbre diffèrent.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les quatre paramètres du son.</p>
<p><strong>Ex. 2 :</strong> Distingue hauteur et intensité.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Hauteur, intensité, timbre, durée. <strong>2)</strong> Hauteur : grave/aigu ; intensité : fort/faible.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le son se décrit par quatre paramètres : hauteur, intensité, timbre, durée.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel officiel 3e PG ; références en éducation musicale.</div>
    `

{
    title: "Leçon 2 — La portée, les clés, les notes",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment lit-on une partition musicale ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître la portée et les clés. Nommer les notes. Lire une mélodie simple.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La portée</div>
<p>La <strong>portée</strong> est un ensemble de cinq lignes horizontales sur lesquelles on écrit les notes. Les notes se placent sur les lignes ou dans les interlignes.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les clés</div>
<p>Au début de la portée, une <strong>clé</strong> indique la position des notes :</p>
<ul>
<li><strong>Clé de sol :</strong> placée sur la deuxième ligne, elle sert pour les voix aiguës et la plupart des instruments mélodiques (flûte, violon, piano main droite).</li>
<li><strong>Clé de fa :</strong> placée sur la quatrième ligne, elle sert pour les voix graves et les instruments graves (violoncelle, piano main gauche).</li>
<li>Il existe aussi la clé d'ut (alto, ténor), plus rare.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les notes</div>
<p>En musique occidentale, on nomme les notes : <em>do, ré, mi, fa, sol, la, si</em>. En notation internationale : <em>C, D, E, F, G, A, B</em>. Une octave sépare deux notes du même nom.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Combien la portée a-t-elle de lignes ?</p>
<p><strong>Ex. 2 :</strong> Nomme les notes de la gamme en notation française et en notation internationale.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Cinq lignes. <strong>2)</strong> do (C), ré (D), mi (E), fa (F), sol (G), la (A), si (B).</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La portée, les clés et les noms de notes permettent de lire une partition.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel officiel 3e PG ; références en solfège.</div>
    `

{
    title: "Leçon 3 — Le rythme : figures et mesures",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une chanson peut-elle avoir le même air mais un rythme différent ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les figures de note et de silence. Comprendre les mesures simples. Frapper un rythme.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Figures de note</div>
<ul>
<li><strong>Ronde</strong> (4 temps).</li>
<li><strong>Blanche</strong> (2 temps).</li>
<li><strong>Noire</strong> (1 temps).</li>
<li><strong>Croche</strong> (1/2 temps).</li>
</ul>
<p>Chaque figure a son silence équivalent : pause, demi-pause, soupir, demi-soupir.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Mesures simples</div>
<ul>
<li><strong>2/4 :</strong> deux temps par mesure, la noire vaut un temps.</li>
<li><strong>3/4 :</strong> trois temps par mesure (valse).</li>
<li><strong>4/4 :</strong> quatre temps par mesure.</li>
</ul>
<p>La <strong>barre de mesure</strong> sépare les mesures ; la mesure est délimitée par un nombre fixe de temps.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Frapper un rythme</div>
<ul>
<li>Compter les temps à voix haute (1, 2, 3, 4).</li>
<li>Frapper dans les mains sur les temps indiqués.</li>
<li>Marquer les silences en gardant le rythme intérieur.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Combien de temps vaut une blanche ? une noire ?</p>
<p><strong>Ex. 2 :</strong> Frappe un rythme de 4 mesures en 4/4.</p>

</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les figures de note et les mesures organisent le rythme ; le rythme se travaille par la frappe et le comptage.</p></div>

    title: "Leçon 4 — Les intervalles",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certaines combinaisons de deux notes « sonnent-elles » bien et d'autres pas ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir un intervalle. Mesurer un intervalle. Reconnaître les intervalles de base.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>Un <strong>intervalle</strong> est la distance entre deux notes. On le mesure en degrés (nombre de notes) et en tons/demi-tons (distance réelle).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Intervalles de base</div>
<ul>
<li><strong>Seconde :</strong> 1 degré (do-ré).</li>
<li><strong>Tierce :</strong> 3 degrés (do-mi).</li>
<li><strong>Quarte :</strong> 4 degrés (do-fa).</li>
<li><strong>Quinte :</strong> 5 degrés (do-sol).</li>
<li><strong>Sixte :</strong> 6 degrés (do-la).</li>
<li><strong>Septième :</strong> 7 degrés (do-si).</li>
<li><strong>Octave :</strong> 8 degrés (do-do).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Qualité</div>
<p>Un intervalle peut être :</p>
<ul>
<li><strong>majeur ou mineur</strong> (tierces, sixtes, septièmes) ;</li>
<li><strong>juste</strong> (quartes et quintes) ;</li>
<li><strong>augmenté ou diminué</strong> (selon la distance réelle).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis un intervalle.</p>
<p><strong>Ex. 2 :</strong> Identifie l'intervalle do-mi.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Distance entre deux notes. <strong>2)</strong> Do-mi est une tierce (majeure dans la gamme de do).</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les intervalles mesurent la distance entre deux notes ; ils se comptent en degrés et en tons.</p></div>
<div class="sources"><strong>Sources :</strong> Références en solfège.</div>
    `
},

    title: "Leçon 5 — Les tonalités et les gammes",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certaines mélodies semblent-elles « heureuses » et d'autres « tristes » ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la notion de tonalité. Construire une gamme majeure et mineure. Reconnaître les altérations.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La gamme</div>
<p>Une <strong>gamme</strong> est une suite de notes organisée selon un schéma de tons et de demi-tons.</p>
<ul>
<li><strong>Gamme majeure :</strong> schéma T-T-demi-T-T-T-demi (T = ton).</li>
<li><strong>Gamme mineure naturelle :</strong> schéma T-demi-T-T-demi-T-T.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La tonalité</div>
<p>La <strong>tonalité</strong> est le cadre dans lequel la musique se construit : elle organise les notes autour d'une note principale (la tonique). Exemple : do majeur, la mineur.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Altérations</div>
<ul>
<li><strong>Dièse (#) :</strong> hausse la note d'un demi-ton.</li>
<li><strong>Bémol (b) :</strong> baisse la note d'un demi-ton.</li>
<li><strong>Bécarre :</strong> annule l'altération.</li>
</ul>
<p>Les altérations apparaissent à la clé (armure) ou devant une note (altération accidentelle).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les altérations de base.</p>
<p><strong>Ex. 2 :</strong> Construis une gamme de do majeur.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Dièse, bémol, bécarre. <strong>2)</strong> Do, ré, mi, fa, sol, la, si, do (T-T-demi-T-T-T-demi).</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La tonalité organise les notes autour d'une tonique ; la gamme majeure et la gamme mineure ont des schémas distincts.</p></div>
<div class="sources"><strong>Sources :</strong> Références en solfège.</div>
    `
