{
    title: "Leçon 1 — Qu'est-ce que la philosophie ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève demande à son professeur : « À quoi sert la philosophie ? On ne cultive pas le manioc avec. » Le professeur répond par une autre question : « Pourquoi veux-tu cultiver le manioc, et pour qui ? » Sans le savoir, l'élève vient de commencer à philosopher.</p></div>
<h3>1. Origine et sens du mot</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><figure style="margin:14px 0;"><img alt="« L'École d'Athènes » de Raphaël (1509-1511), qui réunit les grands philosophes grecs" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Philo6_1"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">« L'École d'Athènes » de Raphaël (1509-1511), qui réunit les grands philosophes grecs (Wikimedia Commons)</figcaption></figure><ul><li><strong>Étymologie</strong> : du grec <em>philein</em> (aimer) et <em>sophia</em> (sagesse) : <strong>amour de la sagesse</strong>.</li><li><strong>Philosophe</strong> : celui qui cherche la vérité sans prétendre la posséder. Selon la tradition, Pythagore aurait employé le mot le premier (source à vérifier).</li><li><strong>Naissance</strong> : VIe siècle av. J.-C., en Grèce (Milet, en Ionie), avec <strong>Thalès</strong> : passage du <strong>mythe</strong> (récit sacré) au <strong>logos</strong> (discours rationnel).</li><li><strong>Autres berceaux</strong> : Égypte, Inde, Chine, Afrique ; la philosophie n'appartient pas à une seule civilisation.</li></ul></div>
<h3>2. Les sources de la philosophie</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><figure style="margin:14px 0;"><img alt="« Le Penseur » d'Auguste Rodin, symbole de la réflexion" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Philo6_2"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">« Le Penseur » d'Auguste Rodin, symbole de la réflexion (Wikimedia Commons)</figcaption></figure><ul><li><strong>L'étonnement</strong> (Platon, Aristote) : s'étonner devant le monde pousse à chercher des causes.</li><li><strong>Le doute</strong> (Descartes) : douter pour atteindre une certitude.</li><li><strong>Les situations limites</strong> (Jaspers) : la mort, la souffrance, la faute.</li><li><strong>Les questions de l'homme</strong> : d'où venons-nous ? que devons-nous faire ? que pouvons-nous espérer ?</li></ul></div>
<h3>3. Objet, méthode et branches</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Objet</strong> : le réel dans sa totalité : l'être, la connaissance, l'action, le beau, la société.</li><li><strong>Méthode</strong> : questionner, analyser, définir, argumenter, critiquer ; la <strong>dialectique</strong> (dialogue), la <strong>réflexion</strong> personnelle.</li><li><strong>Branches</strong> : <strong>logique</strong> (le raisonnement correct), <strong>métaphysique</strong> (l'être), <strong>épistémologie</strong> (la science), <strong>morale ou éthique</strong> (l'action), <strong>politique</strong> (le pouvoir), <strong>esthétique</strong> (le beau), <strong>anthropologie philosophique</strong> (l'homme).</li></ul><blockquote style="border-left:3px solid #999; padding-left:14px; margin:16px 0; font-style:italic; color:#555;">"Une vie sans examen ne vaut pas d'être vécue."<br><strong>— Socrate, d'après Platon, <em>Apologie de Socrate</em> (38a)</strong></blockquote></div>
<h3>4. Philosophie, mythe, science et religion</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:0.85rem;margin:10px 0;"><tr><th style="border:1px solid #bbb;padding:5px 8px;text-align:center;"></th><th style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Mythe</th><th style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Religion</th><th style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Science</th><th style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Philosophie</th></tr><tr><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Fondement</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Tradition</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Foi</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Preuve</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Raison</td></tr><tr><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Question</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Origine</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Salut, sens</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Comment ?</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Pourquoi ? Que signifie ?</td></tr><tr><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Réponse</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Récit</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Dogme</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Loi vérifiée</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Problématisation</td></tr></table></div><strong>Utilité</strong> : former l'<strong>esprit critique</strong>, apprendre à penser par soi-même (Kant : <em>Sapere aude</em>, « ose te servir de ton propre entendement », 1784), éclairer la morale et la politique.<p><a href="https://www.youtube.com/results?search_query=qu'est-ce+que+la+philosophie+introduction" target="_blank" rel="noopener">🎥 Recherche : introduction à la philosophie (TV5Monde / France 24)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La philosophie est l'amour de la sagesse. Née du passage du mythe au logos, elle questionne le réel par la raison. Elle a plusieurs branches et vise l'esprit critique.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de philosophie RDC (EPST) ; manuels de philosophie du secondaire, Platon, Kant.<br><strong>Sigles et abréviations :</strong> **EPST** : Enseignement primaire, secondaire et technique ; **EXETAT** : Examen d'État ; **av. J.-C.** : avant Jésus-Christ ; **RDC** : République démocratique du Congo.</div>
    `

{
    title: "Leçon 2 — Histoire de la philosophie : repères",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Au tableau, une frise chronologique relie Thalès à Sartre. Tu te rends compte que chaque philosophe répond aux précédents. La philosophie est une grande conversation qui dure depuis 2 600 ans.</p></div>
<h3>1. L'Antiquité grecque et romaine</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><figure style="margin:14px 0;"><img alt="Buste de Socrate (musée du Louvre)" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Philo6_3"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">Buste de Socrate (musée du Louvre) (Wikimedia Commons)</figcaption></figure><figure style="margin:14px 0;"><img alt="Buste de Platon (musées du Capitole)" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Philo6_4"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">Buste de Platon (musées du Capitole) (Wikimedia Commons)</figcaption></figure><figure style="margin:14px 0;"><img alt="Buste d'Aristote (palais Altemps)" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Philo6_5"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">Buste d'Aristote (palais Altemps) (Wikimedia Commons)</figcaption></figure><ul><li><strong>Présocratiques</strong> : Thalès (l'eau), Anaximandre (l'illimité), Héraclite (le devenir, le feu), Parménide (l'être), Pythagore (le nombre), Démocrite (les atomes), Empédocle (4 éléments).</li><li><strong>Sophistes</strong> : Protagoras (« l'homme est la mesure de toutes choses »), Gorgias.</li><li><strong>Socrate</strong> (470-399 av. J.-C.) : n'a rien écrit, méthode <strong>ironie</strong> et <strong>maïeutique</strong> ; condamné à boire la ciguë.</li><li><strong>Platon</strong> (428-348 av. J.-C.) : Académie, théorie des <strong>Idées</strong>, <em>La République</em>.</li><li><strong>Aristote</strong> (384-322 av. J.-C.) : Lycée, logique, <em>Métaphysique</em>, <em>Éthique à Nicomaque</em>.</li><li><strong>Hellénistiques</strong> : Épicure (plaisir), <strong>stoïciens</strong> (Zénon, Épictète, Sénèque, Marc Aurèle), sceptiques (Pyrrhon).</li></ul></div>
<h3>2. Le Moyen Âge</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><figure style="margin:14px 0;"><img alt="Thomas d'Aquin, vitrail" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Philo6_6"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">Thomas d'Aquin, vitrail (Wikimedia Commons)</figcaption></figure><ul><li><strong>Patristique</strong> : <strong>Augustin</strong> d'Hippone (354-430), <em>Confessions</em>, <em>La Cité de Dieu</em> ; Boèce.</li><li><strong>Scolastique</strong> : <strong>Anselme</strong> (1033-1109), <strong>Thomas d'Aquin</strong> (1225-1274, <em>Somme théologique</em>).</li><li><strong>Philosophie arabe</strong> : Avicenne (Ibn Sina, 980-1037), <strong>Averroès</strong> (Ibn Rushd, 1126-1198), qui a transmis Aristote à l'Europe.</li><li><strong>Thème central</strong> : accord entre <strong>foi et raison</strong>.</li></ul></div>
<h3>3. Les Temps modernes (XVIe-XVIIIe siècles)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><figure style="margin:14px 0;"><img alt="René Descartes, par Frans Hals" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Philo6_7"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">René Descartes, par Frans Hals (Wikimedia Commons)</figcaption></figure><figure style="margin:14px 0;"><img alt="Emmanuel Kant, portrait" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Philo6_8"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">Emmanuel Kant, portrait (Wikimedia Commons)</figcaption></figure><ul><li><strong>Renaissance</strong> : Machiavel (<em>Le Prince</em>), Montaigne (<em>Essais</em>), Bacon, Galilée.</li><li><strong>XVIIe siècle</strong> : <strong>Descartes</strong> (<em>Discours de la méthode</em>, 1637), Pascal (<em>Pensées</em>), Spinoza (<em>Éthique</em>), Leibniz, Hobbes (<em>Léviathan</em>, 1651), Locke.</li><li><strong>Lumières (XVIIIe)</strong> : Montesquieu (<em>De l'esprit des lois</em>, 1748), Voltaire, <strong>Rousseau</strong> (<em>Du contrat social</em>, 1762), Hume, <strong>Kant</strong> (<em>Critique de la raison pure</em>, 1781).</li></ul></div>
<h3>4. Le XIXe et le XXe siècle</h3>

<h3>2. Les sources et les théories</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><figure style="margin:14px 0;"><img alt="David Hume, représentant de l'empirisme" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Philo6_12"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">David Hume, représentant de l'empirisme (Wikimedia Commons)</figcaption></figure><ul><li><strong>Rationalisme</strong> (Descartes, Spinoza, Leibniz) : la <strong>raison</strong> est la source du savoir ; idées innées ; critère : l'<strong>évidence</strong>.</li><li><strong>Empirisme</strong> (Locke, Berkeley, <strong>Hume</strong>) : toute connaissance vient de l'<strong>expérience</strong> ; l'esprit est une « table rase » (Locke).</li><li><strong>Criticisme</strong> (Kant) : la connaissance naît de l'union de la <strong>sensibilité</strong> et de l'<strong>entendement</strong> ; on connaît les <strong>phénomènes</strong>, pas la chose en soi.</li><li><strong>Intuitionnisme</strong> (Bergson) : connaissance directe.</li></ul></div>

<h3>2. La démarche expérimentale</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><figure style="margin:14px 0;"><img alt="Francis Bacon" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Philo6_13"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">Francis Bacon (Wikimedia Commons)</figcaption></figure><figure style="margin:14px 0;"><img alt="Galilée, fondateur de la physique expérimentale" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Philo6_14"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">Galilée, fondateur de la physique expérimentale (Wikimedia Commons)</figcaption></figure><strong>Claude Bernard</strong> (1813-1878, <em>Introduction à l'étude de la médecine expérimentale</em>, 1865) :<ul><li><strong>OHERIC</strong> : <strong>O</strong>bservation, <strong>H</strong>ypothèse, <strong>E</strong>xpérimentation, <strong>R</strong>ésultat, <strong>I</strong>nterprétation, <strong>C</strong>onclusion.</li><li><strong>Hypothèse</strong> : explication provisoire à vérifier ; <strong>loi</strong> : relation constante entre phénomènes ; <strong>théorie</strong> : ensemble cohérent de lois.</li></ul><blockquote style="border-left:3px solid #999; padding-left:14px; margin:16px 0; font-style:italic; color:#555;">"On ne commande à la nature qu'en lui obéissant."<br><strong>— Francis Bacon, <em>Novum Organum</em> (1620)</strong></blockquote></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Société</strong>, <strong>État</strong> (territoire, population, pouvoir souverain), <strong>nation</strong>, <strong>gouvernement</strong>, <strong>pouvoir</strong>, <strong>autorité</strong>.</li><li><strong>Légitimité</strong> (<strong>Weber</strong>) : traditionnelle, charismatique, légale-rationnelle.</li><li><strong>Aristote</strong> : « l'homme est un animal politique ».</li></ul></div>
<h3>2. Les théories du contrat social</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><figure style="margin:14px 0;"><img alt="Frontispice du Léviathan de Hobbes (1651)" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Philo6_20"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">Frontispice du <em>Léviathan</em> de Hobbes (1651) (Wikimedia Commons)</figcaption></figure><figure style="margin:14px 0;"><img alt="Jean-Jacques Rousseau" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Philo6_21"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">Jean-Jacques Rousseau (Wikimedia Commons)</figcaption></figure><ul><li><strong>Hobbes</strong> (<em>Léviathan</em>, 1651) : l'état de nature est la « guerre de tous contre tous » ; il faut un souverain fort.</li><li><strong>Locke</strong> (<em>Traité du gouvernement civil</em>, 1690) : droits naturels (vie, liberté, propriété) ; gouvernement limité.</li><li><strong>Rousseau</strong> (<em>Du contrat social</em>, 1762) : <strong>volonté générale</strong> ; souveraineté du peuple.</li><li><strong>Montesquieu</strong> : séparation des pouvoirs (exécutif, législatif, judiciaire).</li><li><strong>Machiavel</strong> (<em>Le Prince</em>) : le pouvoir et l'efficacité.</li><li><strong>Marx</strong> : l'État comme instrument de domination d'une classe.</li></ul></div>
<h3>3. Formes de gouvernement et justice</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><figure style="margin:14px 0;"><img alt="Déclaration des droits de l'homme et du citoyen (1789)" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Philo6_22"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">Déclaration des droits de l'homme et du citoyen (1789) (Wikimedia Commons)</figcaption></figure><ul><li><strong>Monarchie</strong>, <strong>aristocratie</strong>, <strong>démocratie</strong>, <strong>tyrannie</strong>, <strong>totalitarisme</strong> (Arendt, 1951).</li><li><strong>Justice</strong> : distributive (selon les mérites) et commutative (échange) chez Aristote ; <strong>Rawls</strong> (<em>Théorie de la justice</em>, 1971).</li><li><strong>Droits de l'homme</strong> : DUDH (Déclaration universelle des droits de l'homme, 1948).</li><li><strong>Désobéissance civile</strong> : Thoreau, Gandhi, Mandela.</li></ul><p><a href="https://www.youtube.com/results?search_query=contrat+social+Hobbes+Locke+Rousseau" target="_blank" rel="noopener">🎥 Recherche : philosophie politique (TV5Monde / France 24)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'État organise la vie commune. Hobbes, Locke et Rousseau fondent l'État sur un contrat. Montesquieu défend la séparation des pouvoirs. La démocratie respecte les droits de l'homme.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de philosophie RDC (EPST) ; manuels de philosophie du secondaire, Hobbes, Locke, Rousseau, Montesquieu.<br><strong>Sigles et abréviations :</strong> **EPST** : Enseignement primaire, secondaire et technique ; **EXETAT** : Examen d'État ; **av. J.-C.** : avant Jésus-Christ ; **RDC** : République démocratique du Congo. **DUDH** : Déclaration universelle des droits de l'homme.</div>
    `
},

    title: "Leçon 9 — Le travail, la technique et le développement",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un paysan de Kisangani utilise une houe, un autre un tracteur. Les deux travaillent, mais pas de la même manière. Qu'est-ce que le travail change à l'homme et au monde ?</p></div>
<h3>1. Le travail</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><figure style="margin:14px 0;"><img alt="Karl Marx, théoricien de l'aliénation" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Philo6_23"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">Karl Marx, théoricien de l'aliénation (Wikimedia Commons)</figcaption></figure><ul><li><strong>Définition</strong> : activité consciente, transformatrice de la nature pour satisfaire des besoins.</li><li><strong>Marx</strong> : l'homme se produit lui-même par le travail ; <strong>aliénation</strong> quand le travailleur est dépossédé du fruit de son travail.</li><li><strong>Hegel</strong> : dialectique du <strong>maître et de l'esclave</strong>.</li><li><strong>Arendt</strong> (<em>Condition de l'homme moderne</em>, 1958) : <strong>travail</strong>, <strong>œuvre</strong>, <strong>action</strong>.</li></ul></div>
<h3>2. La technique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Technique</strong> : ensemble de procédés pour agir sur le monde ; <strong>outil</strong>, <strong>machine</strong>, <strong>technologie</strong>.</li><li><strong>Révolutions industrielles</strong> : vapeur, électricité, numérique.</li><li><strong>Ambivalence</strong> : progrès (santé, communication) et danger (armes, pollution, chômage).</li><li><strong>Hans Jonas</strong> (1979) : principe de <strong>responsabilité</strong> envers les générations futures.</li></ul></div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le travail transforme la nature et l'homme. La technique est ambivalente. Le développement vise le bien-être durable.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de philosophie RDC (EPST) ; manuels de philosophie du secondaire, Marx, Hegel, Arendt, Jonas, Rodney, Nkrumah.<br><strong>Sigles et abréviations :</strong> **EPST** : Enseignement primaire, secondaire et technique ; **EXETAT** : Examen d'État ; **av. J.-C.** : avant Jésus-Christ ; **RDC** : République démocratique du Congo. **PIB** : produit intérieur brut.</div>

<h3>2. Les preuves de l'existence de Dieu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><figure style="margin:14px 0;"><img alt="Thomas d'Aquin, vitrail" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Philo6_25"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">Thomas d'Aquin, vitrail (Wikimedia Commons)</figcaption></figure><ul><li><strong>Ontologique</strong> (<strong>Anselme</strong>, Descartes) : Dieu est l'être parfait, donc il existe.</li><li><strong>Cosmologique</strong> (<strong>Thomas d'Aquin</strong>, « cinq voies ») : il faut une cause première.</li><li><strong>Téléologique</strong> : l'ordre du monde suppose un ordonnateur.</li><li><strong>Pascal</strong> : le <strong>pari</strong> ; Dieu est sensible au cœur.</li><li><strong>Kant</strong> : critique des preuves ; Dieu comme postulat de la raison pratique.</li></ul></div>
<h3>3. Athéisme, agnosticisme, mal</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Athéisme</strong> : Feuerbach, <strong>Marx</strong> (« la religion est l'opium du peuple », 1843-1844), <strong>Nietzsche</strong> (« Dieu est mort », <em>Le Gai Savoir</em>, 1882), Freud (illusion), Sartre.</li><li><strong>Agnosticisme</strong> : on ne peut rien savoir de Dieu.</li><li><strong>Problème du mal</strong> : pourquoi le mal si Dieu est bon ? <strong>Théodicée</strong> de Leibniz (1710).</li></ul></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Laïcité</strong> : séparation des Églises et de l'État ; la <strong>RDC est un État laïc</strong> (Constitution, art. 1) ; liberté de religion.</li><li><strong>Mort</strong> : Épicure : « la mort n'est rien pour nous » ; <strong>Heidegger</strong> : être-pour-la-mort ; <strong>Camus</strong> (<em>Le Mythe de Sisyphe</em>, 1942) : l'<strong>absurde</strong>.</li></ul><p><a href="https://www.youtube.com/results?search_query=religion+Dieu+athéisme+philosophie" target="_blank" rel="noopener">🎥 Recherche : philosophie de la religion (TV5Monde / France 24)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La religion relie l'homme au sacré. Les preuves de Dieu et leurs critiques nourrissent la réflexion. La laïcité garantit la liberté de croire ou de ne pas croire.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de philosophie RDC (EPST) ; manuels de philosophie du secondaire, Anselme, Thomas d'Aquin, Pascal, Kant, Nietzsche.<br><strong>Sigles et abréviations :</strong> **EPST** : Enseignement primaire, secondaire et technique ; **EXETAT** : Examen d'État ; **av. J.-C.** : avant Jésus-Christ ; **RDC** : République démocratique du Congo.</div>

    title: "Leçon 14 — Autrui, l'amitié et l'amour",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Tu pars en ville et tu te perds. Un inconnu t'aide. Il aurait pu passer son chemin. Qui est autrui pour moi ?</p></div>
<h3>1. Autrui</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Autrui</strong> : l'autre « moi », un sujet comme moi.</li><li><strong>Solipsisme</strong> : seul mon esprit existe.</li><li><strong>Hegel</strong> : désir de <strong>reconnaissance</strong> ; <strong>Sartre</strong> : le <strong>regard</strong> d'autrui (<em>L'Être et le Néant</em>, 1943 ; « l'enfer, c'est les autres », <em>Huis clos</em>, 1944) ; <strong>Lévinas</strong> : le <strong>visage</strong>.</li></ul></div>
<h3>2. L'amitié</h3>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>Le jour de l'EXETAT, tu lis le sujet : « Peut-on tout dire ? ». Tu as 4 heures. Sans méthode, tu pars dans tous les sens ; avec une méthode, ta pensée s'organise.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Analyser les termes</strong> : définir chaque mot.</li><li><strong>Repérer le type</strong> : « Peut-on... ? », « Est-il vrai que... ? », une citation, une comparaison.</li><li><strong>Dégager la problématique</strong> : la question philosophique cachée derrière le sujet.</li><li><strong>Éviter</strong> : le hors-sujet et la récitation du cours.</li></ul></div>
<h3>2. La dissertation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Introduction</strong> : accroche, définition, problématique, annonce du plan.</li><li><strong>Développement</strong> : 2 à 3 parties ; chaque partie contient arguments, exemples, références philosophiques, transition.</li><li><strong>Plans</strong> : <strong>dialectique</strong> (thèse, antithèse, synthèse), <strong>analytique</strong>, <strong>comparatif</strong>.</li><li><strong>Conclusion</strong> : bilan et ouverture, sans nouvel argument.</li></ul></div>
<h3>3. L'explication de texte</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>1) Lire plusieurs fois ; 2) dégager la <strong>thèse</strong> et la <strong>structure</strong> ; 3) expliquer chaque partie ; 4) discuter (intérêt, limites) ; 5) conclure.</p></div>
<h3>4. Conseils pour l'EXETAT</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li>Lire les consignes ; gérer le temps ; brouillon ; relecture.</li><li><strong>Écrire clairement</strong> : phrases courtes, paragraphes, vocabulaire précis.</li><li><strong>Exemples</strong> : histoire, littérature, vie quotidienne, actualité.</li><li><strong>Citations</strong> : exactes et commentées.</li></ul><p><a href="https://www.youtube.com/results?search_query=méthode+dissertation+philosophie" target="_blank" rel="noopener">🎥 Recherche : réussir sa dissertation (TV5Monde / France 24)</a></p></div>

function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';
    slideCounterSpan.textContent = '0/0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>

<script>
(function () {
  var SITE = "https://ecolia-course.github.io/";
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface", page servie par https://app.local
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function abs(u) { return /^(https?:|data:|blob:)/i.test(u) ? u : (NATIVE ? SITE + u.replace(/^(\.\/|\/)+/, "") : u); }
  function ext(u) { var m = String(u).split("?")[0].match(/\.(jpe?g|png|gif|webp|svg)$/i); return m ? m[1].toLowerCase() : "jpg"; }
  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {
    if (queued[fn]) return;
    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
    if (!queue.length) { running = false; return; }
    if (!navigator.onLine) { running = false; return; }
    var q = queue.shift(), t0 = Date.now();
    try { CoursInterface.download(q[0], q[1]); } catch (e) { return setTimeout(next, 500); }
    (function wait() {
      var ok = false;
      try { ok = !!CoursInterface.exists(q[1]); } catch (e) {}
      if (ok) setTimeout(next, 1500);
      else if (Date.now() - t0 > 40000) next();
      else setTimeout(wait, 700);
    })();
  }
  function exists(fn) { try { return !!CoursInterface.exists(fn); } catch (e) { return false; } }

  function show(img) {                                    // affiche UNE image (appelé à chaque slide affichée)
    if (!table || img.getAttribute("data-ecolia-done")) return;
    var id = img.getAttribute("data-image-id");
    var url = table[id];
    if (typeof url !== "string" || !url.length) { console.warn("ECOLIA : image absente du JSON :", id); return; }
    img.setAttribute("data-ecolia-done", "1");
    if (!NATIVE) { img.onerror = function () { hide(img); }; img.setAttribute("src", url); return; }
    var full = abs(url), fn = "img_" + id + "." + ext(url);
    if (exists(fn)) {                                     // déjà sur l'appareil : lecture locale, sans internet
      img.onerror = function () {                         // fichier incomplet : on le supprime et on utilise le site
        try { CoursInterface["delete"](fn); } catch (e) {}
        queued[fn] = 0;
        img.onerror = function () { hide(img); };
        img.setAttribute("src", full);
      };
      img.setAttribute("src", "https://app.local/cours/" + fn);
    } else {
      img.onerror = function () { hide(img); };
      img.setAttribute("src", full);
      enqueue(full, fn);
    }
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches("img[data-image-id]")) show(root);
    root.querySelectorAll("img[data-image-id]").forEach(show);
  }
  function prefetchAll() {                                // APK : prépare TOUTES les images du cours pour le hors-ligne
    var ids = {};
    try { JSON.stringify(slides).replace(/data-image-id=\\?"([^"\\]+)/g, function (m, id) { ids[id] = 1; }); } catch (e) {}
    Object.keys(ids).forEach(function (id) {
      var url = table[id];
      if (typeof url !== "string" || !url.length) return;
      var fn = "img_" + id + "." + ext(url);
      if (!exists(fn)) enqueue(abs(url), fn);
    });
  }
  function start(tbl) {
    table = tbl;
    scan(document.body);
    new MutationObserver(function (muts) {                // les slides sont écrites à la volée : on traite chaque nouvelle image
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
    if (NATIVE) prefetchAll();
  }

  var JSON_URL = NATIVE ? SITE + "images_ecolia.json" : "images_ecolia.json";
  var KEY = "ecolia_images_json";
  fetch(JSON_URL, NATIVE ? { cache: "no-cache" } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (table) { if (NATIVE) lsSet(KEY, JSON.stringify(table)); start(table); })
    .catch(function (e) {
      var saved = null;
      if (NATIVE) { try { saved = JSON.parse(lsGet(KEY) || "null"); } catch (x) {} }
      if (saved) start(saved);                              // hors ligne dans l'APK : JSON gardé la dernière fois
      else console.warn("ECOLIA : JSON des images indisponible.", e);
    });
})();
</script>
