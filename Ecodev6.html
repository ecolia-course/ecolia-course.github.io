<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours prépare l'EXETAT (4e secondaire). Il comprend 10 leçons, suivies d'un quiz de révision.</p>

{
    title: "Leçon 1 — Introduction à l'économie du développement",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>La RDC regorge de cuivre, de cobalt, de diamants, et pourtant une grande partie de sa population vit dans la pauvreté. Comment expliquer ce paradoxe ? L'économie du développement étudie précisément les mécanismes, les facteurs et les obstacles qui empêchent les pays riches en ressources de devenir des pays développés.</p></div>
<h3>1. Définition et objet</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Économie du développement</strong> : branche des sciences économiques qui étudie les processus de transformation structurelle des économies et des sociétés en vue d'améliorer le niveau de vie.</li><li><strong>Objectif terminal</strong> : analyser les mécanismes, les facteurs et les obstacles du développement économique, avec application au contexte congolais.</li><li><strong>Distinction</strong> : l'économie politique est plus large ; l'économie du développement est centrée sur les pays en développement.</li><li><strong>Enjeux</strong> : croissance, pauvreté, inégalités, relations économiques internationales.</li></ul></div>
<h3>2. Croissance économique vs développement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Croissance économique</strong> : augmentation quantitative et durable du Produit Intérieur Brut (PIB). Elle est mesurable.</li><li><strong>Développement économique</strong> : notion qualitative et multidimensionnelle. Elle intègre la santé, l'éducation, la réduction des inégalités et les libertés humaines.</li><li><strong>Indicateurs du développement</strong> : IDH (Indice de Développement Humain), PIB par habitant, taux d'alphabétisation, espérance de vie, indice de pauvreté.</li><li><strong>Thèse</strong> : la croissance est nécessaire mais non suffisante pour le développement. Un pays peut croître sans se développer.</li></ul></div>
<h3>3. Le sous-développement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Sous-développement</strong> : situation d'une économie caractérisée par la faiblesse des revenus, la pauvreté de masse, la dépendance extérieure et l'absence de transformation structurelle.</li><li><strong>Caractéristiques</strong> : économie dualiste (secteur moderne et secteur traditionnel), extraversion, désarticulation, faible productivité agricole.</li><li><strong>Indicateurs</strong> : PIB/habitant faible, forte mortalité infantile, faible scolarisation, endettement élevé.</li><li><strong>Causes</strong> : historiques (colonisation, traite), structurelles (dépendance, mauvaise gouvernance), conjoncturelles (guerres, crises).</li></ul></div>
<h3>4. Le cas de la RDC</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>La RDC est le premier producteur mondial de cobalt et le premier producteur africain de cuivre. Pourtant, son PIB par habitant reste parmi les plus faibles du monde. Cela s'explique par :</p><ul><li><strong>L'extraversion</strong> : exportation de matières premières non transformées, importation de produits finis.</li><li><strong>La désarticulation</strong> : les secteurs économiques (agriculture, mines, industrie) sont déconnectés les uns des autres.</li><li><strong>Le dualisme</strong> : un secteur moderne (mines) côtoie un secteur traditionnel (agriculture de subsistance).</li><li><strong>La mauvaise gouvernance</strong> et les conflits armés à l'Est.</li></ul><p><a href="https://www.youtube.com/results?search_query=économie+développement+croissance+sous-développement+RDC" target="_blank" rel="noopener">🎥 Recherche : introduction à l'économie du développement (chaînes de cours d'économie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'économie du développement étudie la transformation structurelle des économies. La croissance est quantitative, le développement est qualitatif et multidimensionnel. Le sous-développement se caractérise par le dualisme, l'extraversion et la dépendance. La RDC illustre le paradoxe de l'abondance.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel d'Économie et Développement (ECODEV), 4ème Commerciale et Gestion (manuels-scolaires-rdc.com, 2025) ; Curriculum de Commerciale et Gestion (MEPST/DIPROMAD, 2023).<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, ECODEV, PIB, IDH, RDC.</div>
    `
},
{
    title: "Leçon 2 — Les facteurs de production",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une usine de transformation de manioc à Kinshasa, on utilise de la terre, des travailleurs, des machines et un entrepreneur qui organise le tout. Ces éléments sont les facteurs de production. Sans eux, aucune richesse n'est créée.</p></div>
<h3>1. Le travail</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Travail</strong> : activité humaine, physique ou intellectuelle, qui produit des biens et services.</li><li><strong>Population active</strong> : ensemble des personnes en âge de travailler et exerçant une activité.</li><li><strong>Population active occupée</strong> : ceux qui ont un emploi.</li><li><strong>Chômage</strong> : situation des personnes sans emploi à la recherche d'un emploi.</li><li><strong>Sous-emploi</strong> : travail à temps partiel non souhaité ou emploi inadéquat.</li><li><strong>Productivité du travail</strong> : rapport entre la production et le nombre de travailleurs ou d'heures travaillées.</li></ul></div>
<h3>2. Le capital</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Capital</strong> : ensemble des biens de production (machines, bâtiments, outils, équipements).</li><li><strong>Capital fixe</strong> : biens durables utilisés plusieurs fois (machines, bâtiments).</li><li><strong>Capital circulant</strong> : biens consommés ou transformés en un cycle de production (matières premières).</li><li><strong>Investissement</strong> : acquisition de biens de production. Il augmente le stock de capital.</li><li><strong>Formation brute de capital fixe (FBCF)</strong> : mesure comptable de l'investissement.</li><li><strong>Amortissement</strong> : usure du capital fixe.</li></ul></div>
<h3>3. La terre et les ressources naturelles</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Terre</strong> : facteur de production agricole, support des activités.</li><li><strong>Ressources naturelles</strong> : minerais, forêts, eau, pétrole.</li><li><strong>Rente</strong> : revenu tiré de l'exploitation de la terre ou des ressources.</li><li><strong>En RDC</strong> : cuivre, cobalt, diamants, coltan, or, bois, eau (Inga), pétrole (Muanda).</li><li><strong>Problème</strong> : ces ressources sont souvent exportées brutes, ce qui limite la valeur ajoutée locale.</li></ul></div>
<h3>4. L'entrepreneur et l'organisation</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Entrepreneur</strong> : celui qui combine les facteurs de production, prend des risques et innove.</li><li><strong>Rôle</strong> : organiser, décider, anticiper.</li><li><strong>Profit</strong> : rémunération de l'entrepreneur.</li><li><strong>Application RDC</strong> : les PME congolaises (boulangeries, ateliers de couture, savonneries) sont créées par des entrepreneurs locaux.</li></ul><p><a href="https://www.youtube.com/results?search_query=facteurs+production+travail+capital+terre+entrepreneur" target="_blank" rel="noopener">🎥 Recherche : les facteurs de production (chaînes de cours d'économie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les quatre facteurs de production sont : le travail, le capital, la terre (ressources naturelles) et l'entrepreneur (organisation). Chacun a sa rémunération : salaire, intérêt, rente, profit. La RDC dispose de ressources abondantes mais peu transformées localement.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel ECODEV 4e CG (manuels-scolaires-rdc.com, 2025) ; Curriculum Commerciale et Gestion (MEPST/DIPROMAD, 2023).</div>
    `
},
{
    title: "Leçon 3 — Les obstacles au développement",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Pourquoi certains pays d'Asie du Sud-Est ont-ils réussi à se développer en quelques décennies, alors que la RDC, pourtant plus riche en ressources, reste en retard ? La réponse se trouve dans les obstacles au développement.</p></div>
<h3>1. Obstacles économiques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Faible accumulation du capital</strong> : épargne insuffisante, investissements limités.</li><li><strong>Dépendance extérieure</strong> : exportation de matières premières, importation de produits manufacturés.</li><li><strong>Endettement</strong> : poids de la dette extérieure, service de la dette.</li><li><strong>Inflation</strong> : hausse générale et durable des prix, perte du pouvoir d'achat.</li><li><strong>Économie informelle</strong> : activités non déclarées, non fiscalisées (marché, petit commerce, transport).</li></ul></div>
<h3>2. Obstacles démographiques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Croissance démographique rapide</strong> : la population augmente plus vite que la production.</li><li><strong>Pression sur les ressources</strong> : terre, eau, nourriture, emploi.</li><li><strong>Urbanisation anarchique</strong> : exode rural massif, bidonvilles.</li><li><strong>En RDC</strong> : plus de 100 millions d'habitants, croissance démographique de 3 % par an.</li></ul></div>
<h3>3. Obstacles socioculturels et politiques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Faible niveau d'instruction</strong> : analphabétisme, faible scolarisation.</li><li><strong>Problèmes de santé</strong> : paludisme, tuberculose, VIH, malnutrition.</li><li><strong>Instabilité politique</strong> : guerres, coups d'État, mauvaise gouvernance.</li><li><strong>Corruption</strong> : détournement des ressources publiques.</li><li><strong>Conflits armés</strong> : à l'Est de la RDC, ils détruisent l'économie locale.</li></ul></div>
<h3>4. Le cas de la RDC</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Guerres à répétition</strong> : 1ère et 2e guerres du Congo (1996-2003), plus de 5 millions de morts.</li><li><strong>Exploitation illégale des minerais</strong> : le coltan, l'or et le cobalt alimentent des groupes armés.</li><li><strong>Faible mobilisation fiscale</strong> : l'État collecte peu d'impôts, dépend des droits miniers.</li><li><strong>Infrastructures dégradées</strong> : routes, hôpitaux, écoles.</li><li><strong>Exode des cerveaux</strong> : les diplômés émigrent vers l'Europe, l'Afrique du Sud, le Canada.</li></ul><p><a href="https://www.youtube.com/results?search_query=obstacles+développement+économique+Afrique+RDC" target="_blank" rel="noopener">🎥 Recherche : les obstacles au développement (chaînes de cours d'économie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les obstacles au développement sont économiques (dépendance, endettement, informel), démographiques (croissance rapide, urbanisation), socioculturels (analphabétisme, santé) et politiques (guerres, corruption). La RDC cumule plusieurs de ces obstacles.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel ECODEV 4e CG (manuels-scolaires-rdc.com, 2025) ; Curriculum Commerciale et Gestion (MEPST/DIPROMAD, 2023).</div>
    `

{
    title: "Leçon 4 — Les stratégies de développement",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans les années 1960, la Corée du Sud était aussi pauvre que la RDC. Aujourd'hui, c'est une puissance industrielle. Quelles stratégies ont permis ce décollage ? L'économie du développement étudie les différentes voies vers le développement.</p></div>
<h3>1. Les stratégies d'industrialisation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Industrialisation par substitution aux importations (ISI)</strong> : produire localement ce qui était importé (textiles, alimentation, biens de consommation).</li><li><strong>Industrialisation par promotion des exportations (IPE)</strong> : produire pour exporter (Corée du Sud, Taïwan).</li><li><strong>Industries industrialisantes</strong> : industries lourdes qui tirent les autres secteurs (sidérurgie, pétrochimie).</li><li><strong>Pôles de développement</strong> : concentrer les investissements dans des zones géographiques stratégiques.</li></ul></div>
<h3>2. Les stratégies agricoles</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Révolution verte</strong> : amélioration des semences, engrais, irrigation.</li><li><strong>Développement rural intégré</strong> : agriculture + infrastructures + services (santé, éducation).</li><li><strong>Sécurité alimentaire</strong> : produire assez pour nourrir la population.</li><li><strong>En RDC</strong> : le Grand Kasaï, grenier agricole, souffre de la mauvaise organisation des filières.</li></ul></div>
<h3>3. Les stratégies globales</h3>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La mondialisation intègre les économies en un marché mondial. Elle présente des opportunités (marchés, technologies) mais aussi des risques (dépendance, inégalités). Les pays du tiers-monde, comme la RDC, restent souvent cantonnés au rôle de fournisseurs de matières premières.</p></div>

<h3>2. La balance commerciale</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Balance commerciale</strong> : différence entre la valeur des exportations et celle des importations.</li><li><strong>Excédent commercial</strong> : exportations > importations.</li><li><strong>Déficit commercial</strong> : importations > exportations.</li><li><strong>En RDC</strong> : la balance commerciale est généralement excédentaire grâce aux exportations minières, mais les importations de biens manufacturés restent élevées.</li></ul></div>
<h3>3. La balance des paiements</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Balance des paiements</strong> : document comptable qui enregistre toutes les transactions économiques entre les résidents d'un pays et le reste du monde.</li><li><strong>Composantes</strong> : balance commerciale, balance des services, balance des revenus, transferts courants, compte de capital, compte financier.</li><li><strong>Équilibre</strong> : en principe, la balance des paiements est toujours équilibrée (par ajustement des réserves de change).</li><li><strong>Indicateur</strong> : un déficit chronique de la balance courante signale une dépendance extérieure.</li></ul></div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le commerce joue un rôle central dans l'économie : distribution, emploi, revenus. La balance commerciale mesure l'écart entre exportations et importations. La balance des paiements enregistre toutes les transactions extérieures. En RDC, le commerce informel domine et les exportations restent dominées par les matières premières.</p></div>

questions.forEach(function(q) {
    if (!q.text) {
        q.text = q.question || q.q || q.enonce || q.titre || "";
    }
    if (typeof q.correct === 'undefined') {
        if (typeof q.answer !== 'undefined') q.correct = q.answer;
        else if (typeof q.reponse !== 'undefined') q.correct = q.reponse;
    }
});

let currentSlide = 0;
let lastSearchTerm = "", searchResults = [], currentResultIdx = -1;
const contentDiv = document.getElementById('content');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const slideCounterSpan = document.getElementById('slideCounter');
const progressFill = document.getElementById('progressFill');
const counterSpan = document.getElementById('counter');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchNav = document.getElementById('searchNav');
const prevResultBtn = document.getElementById('prevResultBtn');
const nextResultBtn = document.getElementById('nextResultBtn');
const resultCounterSpan = document.getElementById('resultCounter');
const pageTitle = document.getElementById('pageTitle');
pageTitle.textContent = "ECOLIA · " + COURSE_TITLE;
document.title = "ECOLIA — " + COURSE_TITLE;
function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';
    slideCounterSpan.textContent = '0/0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>

<script>
(function () {
  var SITE = "https://ecolia-course.github.io/";
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface", page servie par https://app.local
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function abs(u) { return /^(https?:|data:|blob:)/i.test(u) ? u : (NATIVE ? SITE + u.replace(/^(\.\/|\/)+/, "") : u); }
  function ext(u) { var m = String(u).split("?")[0].match(/\.(jpe?g|png|gif|webp|svg)$/i); return m ? m[1].toLowerCase() : "jpg"; }
  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {
    if (queued[fn]) return;
    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
    if (!queue.length) { running = false; return; }
    if (!navigator.onLine) { running = false; return; }
    var q = queue.shift(), t0 = Date.now();
    try { CoursInterface.download(q[0], q[1]); } catch (e) { return setTimeout(next, 500); }
    (function wait() {
      var ok = false;
      try { ok = !!CoursInterface.exists(q[1]); } catch (e) {}
      if (ok) setTimeout(next, 1500);
      else if (Date.now() - t0 > 40000) next();
      else setTimeout(wait, 700);
    })();
  }
  function exists(fn) { try { return !!CoursInterface.exists(fn); } catch (e) { return false; } }

  function show(img) {                                    // affiche UNE image (appelé à chaque slide affichée)
    if (!table || img.getAttribute("data-ecolia-done")) return;
    var id = img.getAttribute("data-image-id");
    var url = table[id];
    if (typeof url !== "string" || !url.length) { console.warn("ECOLIA : image absente du JSON :", id); return; }
    img.setAttribute("data-ecolia-done", "1");
    if (!NATIVE) { img.onerror = function () { hide(img); }; img.setAttribute("src", url); return; }
    var full = abs(url), fn = "img_" + id + "." + ext(url);
    if (exists(fn)) {                                     // déjà sur l'appareil : lecture locale, sans internet
      img.onerror = function () {                         // fichier incomplet : on le supprime et on utilise le site
        try { CoursInterface["delete"](fn); } catch (e) {}
        queued[fn] = 0;
        img.onerror = function () { hide(img); };
        img.setAttribute("src", full);
      };
      img.setAttribute("src", "https://app.local/cours/" + fn);
    } else {
      img.onerror = function () { hide(img); };
      img.setAttribute("src", full);
      enqueue(full, fn);
    }
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches("img[data-image-id]")) show(root);
    root.querySelectorAll("img[data-image-id]").forEach(show);
  }
  function prefetchAll() {                                // APK : prépare TOUTES les images du cours pour le hors-ligne
    var ids = {};
    try { JSON.stringify(slides).replace(/data-image-id=\\?"([^"\\]+)/g, function (m, id) { ids[id] = 1; }); } catch (e) {}
    Object.keys(ids).forEach(function (id) {
      var url = table[id];
      if (typeof url !== "string" || !url.length) return;
      var fn = "img_" + id + "." + ext(url);
      if (!exists(fn)) enqueue(abs(url), fn);
    });
  }
  function start(tbl) {
    table = tbl;
    scan(document.body);
    new MutationObserver(function (muts) {                // les slides sont écrites à la volée : on traite chaque nouvelle image
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
    if (NATIVE) prefetchAll();
  }

  var JSON_URL = NATIVE ? SITE + "images_ecolia.json" : "images_ecolia.json";
  var KEY = "ecolia_images_json";
  fetch(JSON_URL, NATIVE ? { cache: "no-cache" } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (table) { if (NATIVE) lsSet(KEY, JSON.stringify(table)); start(table); })
    .catch(function (e) {
      var saved = null;
      if (NATIVE) { try { saved = JSON.parse(lsGet(KEY) || "null"); } catch (x) {} }
      if (saved) start(saved);                              // hors ligne dans l'APK : JSON gardé la dernière fois
      else console.warn("ECOLIA : JSON des images indisponible.", e);
    });
})();
</script>
