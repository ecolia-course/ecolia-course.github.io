<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Où sont nées les premières grandes civilisations ? Qu'ont-elles inventé ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Situer l'Égypte et la Mésopotamie dans le temps et l'espace. Connaître leurs institutions, leurs écritures et leurs apports. Prérequis : notions de chronologie (millénaire, av. J.-C.).</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>

<p><strong>Égypte :</strong></p>
<ul>
<li><strong>Écriture :</strong> hiéroglyphes (puis hiératique et démotique).</li>
<li><strong>Pouvoir :</strong> pharaon considéré comme un dieu vivant ; administration centrale forte ; vizir à la tête de l'administration.</li>
<li><strong>Apports :</strong> pyramides, temples, calendrier de 365 jours, médecine, géométrie.</li>
</ul>
<p><strong>Mésopotamie :</strong></p>
<ul>
<li><strong>Écriture :</strong> cunéiforme sur tablettes d'argile (inventée par les Sumériens).</li>
<li><strong>Pouvoir :</strong> cités-États (Ur, Uruk, Babylone) puis empires (Akkad, Babyloniens, Assyriens).</li>
<li><strong>Apports :</strong> roue, ziggourats, code de Hammurabi (premier grand code de lois), astronomie, mathématiques (base 60).</li>
</ul>
<p><strong>Comparaison RDC :</strong> comme les royaumes Kongo ou Luba, ces civilisations ont connu une centralisation politique et des réalisations monumentales.</p>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Hiéroglyphes :</strong> écriture sacrée égyptienne. <strong>Cunéiforme :</strong> écriture en forme de clous de la Mésopotamie. <strong>Ziggourat :</strong> temple-tour mésopotamien. <strong>Pharaon :</strong> roi-dieu égyptien.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Situer sur une carte (Nil ; Tigre et Euphrate). Comparer les deux civilisations. Identifier les apports majeurs. Comprendre la diversité des peuples mésopotamiens.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la cité grecque. Connaître les institutions athéniennes. Situer les grands conflits. Identifier les apports culturels. Prérequis : leçon 1.</p></div>

<p><strong>Athènes :</strong></p>
<ul>
<li><strong>Ecclésia :</strong> assemblée des citoyens ; vote les lois, décide de la guerre et de la paix.</li>
<li><strong>Boulè :</strong> conseil de 500 citoyens ; prépare les lois.</li>
<li><strong>Héliée :</strong> tribunal populaire.</li>
<li><strong>Stratèges :</strong> magistrats militaires élus (Périclès).</li>

<p><strong>Sparte :</strong> oligarchie militaire ; éducation guerrière ; deux rois + gérousia (conseil des anciens) + apella (assemblée).</p>
<p><strong>Grands conflits :</strong> guerres médiques (490–479 av. J.-C.) contre les Perses ; guerre du Péloponnèse (431–404 av. J.-C.) entre Athènes et Sparte.</p>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les grandes étapes de l'histoire romaine. Comprendre les institutions. Identifier les héritages. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>

<p><strong>La Royauté (753–509 av. J.-C.) :</strong> sept rois légendaires.</p>
<p><strong>La République (509–27 av. J.-C.) :</strong></p>
<ul>
<li><strong>Consuls :</strong> deux magistrats, pouvoir exécutif (un an).</li>
<li><strong>Sénat :</strong> assemblée des anciens, conseille et vote les lois.</li>
<li><strong>Comices :</strong> assemblées du peuple.</li>
<li><strong>Cursus honorum :</strong> questeur, édile, préteur, consul.</li>
</ul>
<p><strong>Société romaine :</strong> patriciens (nobles), plébéiens (roturiers), esclaves (sans droits).</p>
<p><strong>L'Empire (27 av. J.-C. – 476 apr. J.-C.) :</strong> Auguste concentre les pouvoirs. L'Empire s'étend sur tout le bassin méditerranéen, puis est divisé et chute en 476 en Occident.</p>
<p><strong>Romanisation :</strong> diffusion du latin, du droit romain, des institutions et de l'urbanisme dans tout l'Empire.</p>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la démarche archéologique. Identifier les types de sources. Connaître les enjeux du patrimoine. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Archéologie :</strong> science qui étudie les traces matérielles du passé (fouilles, monuments, objets, inscriptions).</p>
<p><strong>Méthodes :</strong></p>
<ul>
<li><strong>Fouille stratigraphique :</strong> étude des couches de terrain ; les plus profondes sont en général les plus anciennes.</li>
<li><strong>Datation :</strong> carbone 14, dendrochronologie, thermoluminescence, comparaison typologique.</li>
<li><strong>Analyse :</strong> identification des objets, reconstitution des modes de vie, interprétation.</li>
</ul>
<p><strong>Types de sources :</strong> monuments, inscriptions, objets (céramiques, armes, bijoux), textes, images.</p>
<p><strong>Patrimoine :</strong> ensemble des biens hérités du passé et dignes d'être conservés (monuments, sites, objets de musée).</p>
<p><strong>Enjeux :</strong> conservation, restauration, protection contre les pillages et le trafic d'objets. Le patrimoine antique est fragile et souvent menacé.</p>
<p><strong>Exemples :</strong> Pompéi (Italie), Delphes (Grèce), mais aussi art rupestre en Afrique centrale (gravures et peintures préhistoriques).</p>

  var CFG = {"code":"Antiquites2","base":"https://ecolia-course.github.io/ecolia-media/audio_files/","available":[1,2,3,4,5,6,7],"count":7,"sizeMo":8,"sizes":{"1":566400,"2":1366080,"3":1532736,"4":1440768,"5":1291008,"6":1464960,"7":87168},"fallback":{"1":[["fr","Sommaire, Antiquités. Sommaire. Ce cours d'Antiquités couvre cinq leçons essentielles: les civilisations du Proche-Orient ancien (Égypte et Mésopotamie), la Grèce antique (cités, démocratie, culture), Rome (de la République à l'Empire), l'archéologie et le patrimoine, et l'héritage de l'Antiquité (langue, droit, art, politique). Note: le programme national d'Antiquités (R D C) pour la 2e année n'a pas été consulté dans son intégralité. La progression s'appuie sur la structure classique de l'enseignement des Antiquités en R D C et sur les manuels disponibles. Leçon 1, Les civilisations du Proche-Orient ancien (Égypte et Mésopotamie). Leçon 2, La Grèce antique: cités, démocratie et culture. Leçon 3, Rome: de la République à l'Empire. Leçon 4, Archéologie et patrimoine. Leçon 5, Héritage de l'Antiquité. Une évaluation finale de 20 questions couvre l'ensemble des leçons."]],"2":[["fr","Leçon 1, Les civilisations du Proche-Orient ancien. Situation. « Où sont nées les premières grandes civilisations? Qu'ont-elles inventé? ». Objectifs. Situer l'Égypte et la Mésopotamie dans le temps et l'espace. Connaître leurs institutions, leurs écritures et leurs apports. Prérequis: notions de chronologie (millénaire, av. J.-C.). Théorie. Cadre géographique: l'Égypte se développe le long du Nil; la Mésopotamie entre le Tigre et l'Euphrate (Irak actuel). Égypte: Écriture: hiéroglyphes (puis hiératique et démotique). Pouvoir: pharaon considéré comme un dieu vivant; administration centrale forte; vizir à la tête de l'administration. Apports: pyramides, temples, calendrier de 365 jours, médecine, géométrie. Mésopotamie: Écriture: cunéiforme sur tablettes d'argile (inventée par les Sumériens). Pouvoir: cités-États (Ur, Uruk, Babylone) puis empires (Akkad, Babyloniens, Assyriens). Apports: roue, ziggourats, code de Hammurabi (premier grand code de lois), astronomie, mathématiques (base 60). Comparaison R D C: comme les royaumes Kongo ou Luba, ces civilisations ont connu une centralisation politique et des réalisations monumentales. Définitions. Hiéroglyphes: écriture sacrée égyptienne. Cunéiforme: écriture en forme de clous de la Mésopotamie. Ziggourat: temple-tour mésopotamien. Pharaon: roi-dieu égyptien. Méthodes et règles. Situer sur une carte (Nil; Tigre et Euphrate). Comparer les deux civilisations. Identifier les apports majeurs. Comprendre la diversité des peuples mésopotamiens. Exemple. La pyramide de Khéops (Égypte, IIIe millénaire av. J.-C.) et la ziggourat d'Ur (Mésopotamie) illustrent la puissance des États et la maîtrise architecturale de ces civilisations. Le code de Hammurabi (XVIIIe siècle av. J.-C.) fixe des règles de justice écrite. Exercices. Ex. 1: Quel fleuve est au cœur de la civilisation égyptienne? Ex. 2: Cite deux inventions du Proche-Orient ancien. Corrigé. 1) Le Nil. 2) L'écriture et la roue (autres réponses possibles: code de lois, calendrier). À retenir. L'Égypte et la Mésopotamie sont les berceaux de l'écriture et de l'État."]],"3":[["fr","Leçon 2, La Grèce antique: cités, démocratie et culture. Situation. « Pourquoi parle-t-on de la Grèce comme d'un ensemble de cités plutôt que d'un État unifié? ». Objectifs. Comprendre la cité grecque. Connaître les institutions athéniennes. Situer les grands conflits. Identifier les apports culturels. Prérequis: leçon 1. Théorie. La cité (polis): communauté politique autonome, avec ses lois, sa monnaie, son armée, ses dieux. Les principales cités: Athènes, Sparte, Thèbes, Corinthe. Athènes: Ecclésia: assemblée des citoyens; vote les lois, décide de la guerre et de la paix. Boulè: conseil de 500 citoyens; prépare les lois. Héliée: tribunal populaire. Stratèges: magistrats militaires élus (Périclès). Sparte: oligarchie militaire; éducation guerrière; deux rois plus gérousia (conseil des anciens) plus apella (assemblée). Grands conflits: guerres médiques (490–479 av. J.-C.) contre les Perses; guerre du Péloponnèse (431–404 av. J.-C.) entre Athènes et Sparte. Culture: philosophie (Socrate, Platon, Aristote); théâtre (Eschyle, Sophocle, Euripide, Aristophane); histoire (Hérodote, Thucydide); sciences (Pythagore, Euclide, Hippocrate, Archimède); jeux olympiques à Olympie. Limites de la démocratie athénienne: exclusion des femmes, des esclaves et des métèques. Définitions. Cité (polis): communauté politique autonome. Démocratie: pouvoir du peuple. Métèque: étranger résident. Guerres médiques: guerres gréco-perses. Méthodes et règles. Comparer Athènes et Sparte dans un tableau. Situer les grands conflits sur une frise. Identifier les apports culturels. Ne pas idéaliser la démocratie athénienne. Exemple. Le discours de Périclès rapporté par Thucydide (texte public) célèbre la démocratie athénienne: « Notre constitution s'appelle démocratie parce que le pouvoir est entre les mains non d'une minorité, mais du plus grand nombre. » Mais cette démocratie exclut les femmes, les esclaves et les métèques. Exercices. Ex. 1: Qu'est-ce que l'ecclésia? Ex. 2: Cite deux limites de la démocratie athénienne. Corrigé. 1) L'assemblée des citoyens qui vote les lois. 2) Exclusion des femmes et des esclaves (autres réponses possibles: exclusion des métèques). À retenir. La Grèce a inventé la démocratie, mais une démocratie limitée; son héritage reste vivant."]],"4":[["fr","Leçon 3, Rome: de la République à l'Empire. Situation. « Comment Rome est-elle passée d'une République à un Empire? Quelles institutions a-t-elle laissées? ». Objectifs. Connaître les grandes étapes de l'histoire romaine. Comprendre les institutions. Identifier les héritages. Prérequis: leçons 1 et 2. Théorie. Fondation de Rome: selon la légende, 753 av. J.-C. par Romulus. Réalité historique: regroupement de villages sur le Palatin. La Royauté (753–509 av. J.-C.): sept rois légendaires. La République (509–27 av. J.-C.): Consuls: deux magistrats, pouvoir exécutif (un an). Sénat: assemblée des anciens, conseille et vote les lois. Comices: assemblées du peuple. Cursus honorum: questeur, édile, préteur, consul. Société romaine: patriciens (nobles), plébéiens (roturiers), esclaves (sans droits). L'Empire (27 av. J.-C., 476 apr. J.-C.): Auguste concentre les pouvoirs. L'Empire s'étend sur tout le bassin méditerranéen, puis est divisé et chute en 476 en Occident. Romanisation: diffusion du latin, du droit romain, des institutions et de l'urbanisme dans tout l'Empire. Héritage: latin (langue), droit romain (base des droits modernes), institutions (Sénat, séparation des pouvoirs), architecture (arcs, voûtes, aqueducs, amphithéâtres). Définitions. République: régime où le pouvoir est exercé par des magistrats élus. Consul: magistrat suprême de la République. Patricien ou Plébéien: noble ou roturier. Romanisation: diffusion de la culture romaine. Méthodes et règles. Situer les grandes étapes sur une frise. Comparer les institutions romaines aux institutions modernes. Identifier les héritages du latin dans le français. Exemple. Le Sénat romain est l'ancêtre du Sénat moderne. Le droit romain, transmis au Moyen Âge puis aux droits européens, inspire encore le droit congolais (hérité du droit belge). Des mots comme « sénat », « république », « constitution » viennent du latin. Exercices. Ex. 1: Qui détenait le pouvoir exécutif sous la République? Ex. 2: Cite deux héritages romains. Corrigé. 1) Les deux consuls. 2) Le droit romain et la langue latine (autres réponses possibles). À retenir. Rome a façonné durablement le droit, la langue et les institutions de l'Occident."]],"5":[["fr","Leçon 4, Archéologie et patrimoine. Situation. « Comment les archéologues savent-ils ce qui s'est passé il y a 3 000 ans? ». Objectifs. Comprendre la démarche archéologique. Identifier les types de sources. Connaître les enjeux du patrimoine. Prérequis: leçons 1 à 3. Théorie. Archéologie: science qui étudie les traces matérielles du passé (fouilles, monuments, objets, inscriptions). Méthodes: Fouille stratigraphique: étude des couches de terrain; les plus profondes sont en général les plus anciennes. Datation: carbone 14, dendrochronologie, thermoluminescence, comparaison typologique. Analyse: identification des objets, reconstitution des modes de vie, interprétation. Types de sources: monuments, inscriptions, objets (céramiques, armes, bijoux), textes, images. Patrimoine: ensemble des biens hérités du passé et dignes d'être conservés (monuments, sites, objets de musée). Enjeux: conservation, restauration, protection contre les pillages et le trafic d'objets. Le patrimoine antique est fragile et souvent menacé. Exemples: Pompéi (Italie), Delphes (Grèce), mais aussi art rupestre en Afrique centrale (gravures et peintures préhistoriques). Définitions. Stratigraphie: étude des couches de terrain. Datation au carbone 14: méthode de datation des matières organiques. Patrimoine: biens hérités du passé. Méthodes et règles. Analyser un objet en le décrivant, en le datant et en l'interprétant. Recouper les sources. Sensibiliser à la protection du patrimoine local. Exemple. La découverte de Pompéi (enfouie par le Vésuve en 79 apr. J.-C.) a permis de reconstituer la vie quotidienne des Romains (maisons, boutiques, fresques). C'est une source archéologique majeure qui complète les textes. Exercices. Ex. 1: Qu'étudie l'archéologie? Ex. 2: Cite deux menaces qui pèsent sur le patrimoine. Corrigé. 1) Les traces matérielles du passé. 2) Les pillages et le trafic d'objets (autres réponses possibles: guerres, urbanisation). À retenir. L'archéologie est une science du terrain; le patrimoine est une responsabilité collective."]],"6":[["fr","Leçon 5, Héritage de l'Antiquité. Situation. « Qu'est-ce que l'Antiquité a laissé au monde moderne et à l'Afrique? ». Objectifs. Identifier les héritages linguistiques, juridiques, artistiques et politiques de l'Antiquité. Situer l'Antiquité africaine. Prérequis: leçons 1 à 4. Théorie. Héritage linguistique: le latin est à l'origine du français, de l'espagnol, de l'italien, du portugais, du roumain. Le grec ancien a donné de nombreux mots savants (philosophie, politique, démocratie, théâtre, musée). Héritage juridique: le droit romain est à la base des droits modernes. Le droit congolais, hérité du droit belge, remonte en partie au droit romain. Héritage artistique et architectural: temples, théâtres, arcs, colonnes, voûtes. Ces formes inspirent encore les bâtiments officiels (palais, parlements, universités). Héritage politique: démocratie, république, citoyenneté, séparation des pouvoirs. Antiquités africaines: Égypte, Nubie (royaume de Koush), art rupestre d'Afrique centrale (Sahara, Afrique australe), Zimbabwe. Ces civilisations témoignent de la richesse de l'Antiquité africaine. En R D C: l'héritage antique est présent dans le vocabulaire politique et juridique, dans l'architecture coloniale influencée par des modèles gréco-romains, et dans l'enseignement du latin et du grec. Définitions. Héritage: ce qui est transmis du passé. Antiquités africaines: civilisations anciennes du continent (Égypte, Nubie, etc.). Réception: façon dont une époque se réapproprie le passé. Méthodes et règles. Identifier un mot d'origine grecque ou latine et expliquer son origine. Reconnaître les formes architecturales antiques. Situer les antiquités africaines sur une carte. Exemple. Le mot « musée » vient du grec μουσεῖον (temple des Muses). Le mot « politique » vient de τὰ pi ολιτικά (affaires de la cité). Les pyramides de Gizeh (Égypte) et les pyramides de Méroé (Nubie, Soudan actuel) témoignent de la grandeur des antiquités africaines. Exercices. Ex. 1: Cite deux mots français d'origine grecque et leur sens. Ex. 2: Quelle civilisation antique africaine est célèbre pour ses pyramides? Corrigé. 1) Démocratie (pouvoir du peuple) et musée (temple des Muses) (autres réponses possibles). 2) L'Égypte (et la Nubie ou royaume de Koush). À retenir. L'Antiquité est plurielle; son héritage est mondial et vivant."]],"7":[["fr","Évaluation finale, Antiquités. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 12 sur 20, tu as réussi."]]}};

    function nativeStore() {

          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () {
          var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok);
        },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();

                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();

        }

        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
