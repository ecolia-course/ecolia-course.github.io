{
    title: "Leçon 1 — Citoyenneté et nationalité congolaise",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À 18 ans, tu reçois ta carte d'électeur. Pour la première fois, ton nom compte dans le choix de ceux qui dirigent le pays. Être citoyen, ce n'est pas seulement habiter quelque part : c'est appartenir à une nation avec des droits et des devoirs.</p></div>
<h3>1. Définitions</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><img alt="Drapeau de la RDC" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="ECM6_1"><p style="font-size:0.75rem;color:#666;margin-top:-8px;">Image : Wikimedia Commons (visible avec connexion)</p><ul><li><strong>Citoyen</strong> : personne qui jouit de droits civils et politiques dans un État et en assume les devoirs.</li><li><strong>Nationalité</strong> : lien juridique d'appartenance à un État.</li><li><strong>Civisme</strong> : respect des lois, des institutions et des autres.</li><li><strong>Patriotisme</strong> : amour et service de la patrie.</li></ul></div>
<h3>2. La nationalité congolaise</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Une et exclusive</strong> : on ne peut pas avoir deux nationalités (Constitution, art. 10).</li><li><strong>Congolais d'origine</strong> : appartient à un groupe ethnique dont le territoire faisait partie de la RDC à l'indépendance, le <strong>30 juin 1960</strong>.</li><li><strong>Acquisition</strong> : par la naissance, par naturalisation, par adoption (loi du 12 novembre 2004).</li><li><strong>Perte</strong> : notamment par acquisition volontaire d'une autre nationalité (source à vérifier).</li></ul></div>
<h3>3. Droits et devoirs du citoyen</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Droits</strong> : vie, liberté, égalité, éducation, santé, travail, vote (dès <strong>18 ans</strong>).</li><li><strong>Devoirs</strong> : respecter la Constitution et les lois, payer l'impôt, défendre le pays, protéger les biens publics, respecter les autres (Constitution, titre II, devoirs du citoyen).</li></ul></div>
<h3>4. Les symboles nationaux</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Drapeau</strong> : bleu ciel avec une étoile jaune et une bande rouge bordée de jaune.</li><li><strong>Devise</strong> : Justice – Paix – Travail.</li><li><strong>Hymne</strong> : « Debout Congolais ».</li><li><strong>Armoiries</strong> : tête de léopard.</li><li><strong>Capitale</strong> : Kinshasa ; <strong>monnaie</strong> : franc congolais.</li></ul><p><a href="https://www.youtube.com/results?search_query=citoyenneté+nationalité+congolaise" target="_blank" rel="noopener">🎥 Recherche : citoyenneté en RDC (Radio Okapi / TV5Monde)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le citoyen congolais a des droits et des devoirs. La nationalité est une et exclusive. Les symboles nationaux sont le drapeau, la devise, l'hymne et les armoiries.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national d'ECM RDC (EPST), Constitution de la RDC (2006), loi sur la nationalité (2004).</div>
    `
},
{
    title: "Leçon 2 — La Constitution de la RDC",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une loi interdit ou autorise, mais qui limite le pouvoir lui-même ? C'est la Constitution, texte suprême de l'État, que tous doivent respecter, du Président au simple citoyen.</p></div>
<h3>1. Définition et rôle</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><img alt="Armoiries de la RDC" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="ECM6_2"><p style="font-size:0.75rem;color:#666;margin-top:-8px;">Image : Wikimedia Commons (visible avec connexion)</p><p>La <strong>Constitution</strong> est la loi fondamentale d'un État. Elle organise les pouvoirs, garantit les droits et fixe les règles du jeu politique. Toutes les autres lois doivent lui être conformes (<strong>hiérarchie des normes</strong>).</p></div>
<h3>2. Histoire constitutionnelle de la RDC</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>1960</strong> : Loi fondamentale.</li><li><strong>1964</strong> : Constitution de Luluabourg.</li><li><strong>1967</strong> : Constitution (révisée en 1974).</li><li><strong>1994</strong> : Acte constitutionnel de transition.</li><li><strong>2003</strong> : Constitution de transition, après l'accord de Sun City.</li><li><strong>2006</strong> : Constitution actuelle, adoptée par <strong>référendum</strong> (déc. 2005), promulguée le <strong>18 février 2006</strong>.</li><li><strong>2011</strong> : révision (loi du 20 janvier 2011).</li></ul></div>
<h3>3. Principes de la Constitution de 2006</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><blockquote style="border-left:3px solid #999; padding-left:14px; margin:16px 0; font-style:italic; color:#555;">"La République démocratique du Congo est, dans ses frontières du 30 juin 1960, un État de droit, indépendant, souverain, uni et indivisible, social, démocratique et laïc."<br><strong>— Constitution de la RDC, article 1</strong></blockquote><ul><li><strong>Souveraineté</strong> : appartient au peuple (art. 5).</li><li><strong>Séparation des pouvoirs</strong>, <strong>pluralisme politique</strong>, <strong>décentralisation</strong>.</li><li><strong>Structure</strong> : préambule, titres sur les droits, les institutions, les provinces, la révision.</li></ul></div>
<h3>4. La révision</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Certains points ne peuvent <strong>pas</strong> être révisés (art. 220) : forme républicaine de l'État, suffrage universel, nombre et durée des mandats du Président, indépendance de la justice, pluralisme politique et syndical.</p><p><a href="https://www.youtube.com/results?search_query=Constitution+RDC+2006+histoire" target="_blank" rel="noopener">🎥 Recherche : Constitution de la RDC (TV5Monde / Radio Okapi)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La Constitution du 18 février 2006 est la loi suprême. Elle fonde l'État de droit et protège les droits ; des clauses sont non révisables (art. 220).</p></div>
<div class="sources"><strong>Sources :</strong> Programme national d'ECM RDC (EPST), Constitution de la RDC (2006, révisée 2011).</div>
    `

{
    title: "Leçon 3 — L'État de droit et la démocratie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un policier arrête quelqu'un sans mandat. Un juge libère l'homme car la loi n'a pas été respectée. Dans un État de droit, même l'autorité doit obéir à la loi.</p></div>
<h3>1. L'État de droit</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><img alt="Balance de la justice" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="ECM6_3"><p style="font-size:0.75rem;color:#666;margin-top:-8px;">Image : Wikimedia Commons (visible avec connexion)</p><p>Un État où <strong>la loi s'impose à tous</strong>, y compris aux gouvernants. Il suppose : une Constitution, la <strong>séparation des pouvoirs</strong>, une <strong>justice indépendante</strong>, la garantie des <strong>droits de l'homme</strong>.</p></div>
<h3>2. La démocratie</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : gouvernement du peuple, par le peuple, pour le peuple.</li><li><strong>Directe</strong> (référendum), <strong>représentative</strong> (élus), <strong>semi-directe</strong>.</li><li><strong>Principes</strong> : souveraineté du peuple, élections libres, pluralisme, alternance, liberté d'expression, respect des minorités.</li></ul></div>
<h3>3. La séparation des pouvoirs</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Montesquieu (*De l'esprit des lois*, 1748) : trois pouvoirs distincts.</p><ul><li><strong>Exécutif</strong> : fait appliquer les lois.</li><li><strong>Législatif</strong> : vote les lois, contrôle le gouvernement.</li><li><strong>Judiciaire</strong> : juge les litiges.</li></ul><p>Une <strong>collaboration</strong> existe entre eux, ainsi que des <strong>contrôles réciproques</strong>.</p></div>
<h3>4. Régimes politiques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Présidentiel</strong>, <strong>parlementaire</strong>, <strong>semi-présidentiel</strong> (cas de la RDC : exécutif à deux têtes).</li><li><strong>Opposés</strong> : dictature, régime à parti unique.</li></ul><p><a href="https://www.youtube.com/results?search_query=État+de+droit+démocratie+séparation+des+pouvoirs" target="_blank" rel="noopener">🎥 Recherche : État de droit (TV5Monde / France 24)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'État de droit soumet tous à la loi. La démocratie repose sur le peuple souverain, les élections et la séparation des pouvoirs.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national d'ECM RDC (EPST), Montesquieu, Constitution de la RDC.</div>
    `
},
{
    title: "Leçon 4 — Le pouvoir exécutif en RDC",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Chaque matin, un décret ou un arrêté est signé. Qui gouverne, qui exécute, qui contrôle ? Comprendre l'exécutif, c'est comprendre qui décide au quotidien.</p></div>
<h3>1. Le Président de la République</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><img alt="RDC" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="ECM6_4"><p style="font-size:0.75rem;color:#666;margin-top:-8px;">Image : Wikimedia Commons (visible avec connexion)</p><ul><li><strong>Élu</strong> au suffrage universel direct, à la majorité simple.</li><li><strong>Mandat</strong> de <strong>5 ans</strong>, <strong>renouvelable une seule fois</strong> (art. 70).</li><li><strong>Chef de l'État</strong>, chef des forces armées, garant de l'indépendance et de l'intégrité du territoire.</li><li><strong>Pouvoirs</strong> : nomme le Premier ministre, promulgue les lois, signe des ordonnances.</li></ul></div>
<h3>2. Le gouvernement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Premier ministre</strong> : nommé par le Président parmi la majorité parlementaire ; dirige le gouvernement.</li><li><strong>Composition</strong> : Premier ministre, vice-Premiers ministres, ministres, vice-ministres.</li><li><strong>Rôle</strong> : définit et conduit la politique de la nation, <strong>responsable devant l'Assemblée nationale</strong>.</li></ul></div>

<div class="sources"><strong>Sources :</strong> Programme national d'ECM RDC (EPST), Constitution de la RDC.</div>
    `

    content: `

<h3>3. Les textes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>DUDH</strong> (1948), <strong>CEDEF</strong> (1979), <strong>Protocole de Maputo</strong> (2003).</li><li><strong>Résolution 1325</strong> du Conseil de sécurité (2000) : femmes, paix et sécurité.</li><li><strong>Dates</strong> : <strong>8 mars</strong> (Journée internationale des droits des femmes) ; <strong>17 mai</strong> : Journée de la femme congolaise (source à vérifier).</li></ul></div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le genre est une construction sociale ; l'égalité est un droit. Scolariser les filles et autonomiser les femmes profitent à toute la société.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national d'ECM RDC (EPST), ONU Femmes, CEDEF, Protocole de Maputo.</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les VBG sont des violations des droits. La victime doit consulter vite (dans les 72 heures), porter plainte et être soutenue ; elle n'est jamais coupable.</p></div>

    title: "Leçon 16 — Le VIH/sida et les infections sexuellement transmissibles",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un camarade apprend qu'il est séropositif. Certains s'éloignent de lui par peur. Pourtant, il peut vivre longtemps, étudier et travailler. La vraie arme : l'information.</p></div>
<h3>1. Qu'est-ce que le VIH et le sida ?</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><img alt="Ruban rouge de la lutte contre le sida" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="ECM6_16"><p style="font-size:0.75rem;color:#666;margin-top:-8px;">Image : Wikimedia Commons (visible avec connexion)</p><ul><li><strong>VIH</strong> : virus de l'immunodéficience humaine ; il attaque les <strong>défenses immunitaires</strong>.</li><li><strong>Sida</strong> : syndrome d'immunodéficience acquise, stade avancé de l'infection.</li><li><strong>Séropositif</strong> : porteur du virus ; une personne peut rester <strong>sans symptômes</strong> longtemps.</li></ul></div>
<h3>2. Modes de transmission</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Rapports sexuels non protégés</strong> (vaginal, anal, oral).</li><li><strong>Sang</strong> : transfusion non contrôlée, aiguilles et objets tranchants souillés.</li><li><strong>De la mère à l'enfant</strong> : grossesse, accouchement, allaitement.</li></ul><p><strong>Pas de transmission</strong> par : poignée de main, baiser, toilettes, vaisselle, moustiques, partage d'un repas.</p></div>
<h3>3. Prévention</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Abstinence</strong> (le plus sûr pour les jeunes), <strong>fidélité</strong> à un partenaire testé.</li><li><strong>Préservatif</strong> utilisé correctement à chaque rapport.</li><li><strong>Dépistage</strong> volontaire et confidentiel.</li><li><strong>Sang</strong> testé ; <strong>matériel stérile</strong>.</li><li><strong>PTME</strong> : prévention de la transmission mère-enfant.</li><li><strong>Traitement</strong> précoce.</li></ul></div>
<h3>4. Dépistage et traitement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Test</strong> : prise de sang ou test rapide ; la <strong>période fenêtre</strong> est d'environ 3 mois.</li><li><strong>ARV</strong> (antirétroviraux) : <strong>ne guérissent pas</strong> mais contrôlent le virus, permettent une vie normale ; une charge virale indétectable empêche la transmission.</li><li>Prise <strong>à vie</strong>, suivie médicale.</li></ul></div>

function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';

}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {

        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');

        submitBtn.onclick = () => {

            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;

function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();

}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }

function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }

<script>
(function () {
  var SITE = "https://ecolia-course.github.io/";
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface", page servie par https://app.local
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function abs(u) { return /^(https?:|data:|blob:)/i.test(u) ? u : (NATIVE ? SITE + u.replace(/^(\.\/|\/)+/, "") : u); }
  function ext(u) { var m = String(u).split("?")[0].match(/\.(jpe?g|png|gif|webp|svg)$/i); return m ? m[1].toLowerCase() : "jpg"; }
  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {
    if (queued[fn]) return;
    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
    if (!queue.length) { running = false; return; }
    if (!navigator.onLine) { running = false; return; }
    var q = queue.shift(), t0 = Date.now();
    try { CoursInterface.download(q[0], q[1]); } catch (e) { return setTimeout(next, 500); }
    (function wait() {
      var ok = false;
      try { ok = !!CoursInterface.exists(q[1]); } catch (e) {}
      if (ok) setTimeout(next, 1500);
      else if (Date.now() - t0 > 40000) next();
      else setTimeout(wait, 700);
    })();
  }
  function exists(fn) { try { return !!CoursInterface.exists(fn); } catch (e) { return false; } }

  function show(img) {                                    // affiche UNE image (appelé à chaque slide affichée)
    if (!table || img.getAttribute("data-ecolia-done")) return;
    var id = img.getAttribute("data-image-id");
    var url = table[id];
    if (typeof url !== "string" || !url.length) { console.warn("ECOLIA : image absente du JSON :", id); return; }
    img.setAttribute("data-ecolia-done", "1");
    if (!NATIVE) { img.onerror = function () { hide(img); }; img.setAttribute("src", url); return; }
    var full = abs(url), fn = "img_" + id + "." + ext(url);
    if (exists(fn)) {                                     // déjà sur l'appareil : lecture locale, sans internet
      img.onerror = function () {                         // fichier incomplet : on le supprime et on utilise le site
        try { CoursInterface["delete"](fn); } catch (e) {}
        queued[fn] = 0;
        img.onerror = function () { hide(img); };
        img.setAttribute("src", full);
      };
      img.setAttribute("src", "https://app.local/cours/" + fn);
    } else {
      img.onerror = function () { hide(img); };
      img.setAttribute("src", full);
      enqueue(full, fn);
    }
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches("img[data-image-id]")) show(root);
    root.querySelectorAll("img[data-image-id]").forEach(show);
  }
  function prefetchAll() {                                // APK : prépare TOUTES les images du cours pour le hors-ligne
    var ids = {};

    Object.keys(ids).forEach(function (id) {
      var url = table[id];
      if (typeof url !== "string" || !url.length) return;
      var fn = "img_" + id + "." + ext(url);
      if (!exists(fn)) enqueue(abs(url), fn);
    });
  }
  function start(tbl) {
    table = tbl;

    new MutationObserver(function (muts) {                // les slides sont écrites à la volée : on traite chaque nouvelle image
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
    if (NATIVE) prefetchAll();
  }

  var JSON_URL = NATIVE ? SITE + "images_ecolia.json" : "images_ecolia.json";
  var KEY = "ecolia_images_json";
  fetch(JSON_URL, NATIVE ? { cache: "no-cache" } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })

    .catch(function (e) {
      var saved = null;
      if (NATIVE) { try { saved = JSON.parse(lsGet(KEY) || "null"); } catch (x) {} }
      if (saved) start(saved);                              // hors ligne dans l'APK : JSON gardé la dernière fois
      else console.warn("ECOLIA : JSON des images indisponible.", e);
    });
})();
