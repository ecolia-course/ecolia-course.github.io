            </div>

                • <strong>Population :</strong> ensemble des habitants vivant sur ce territoire.<br>
                • <strong>Souveraineté :</strong> pouvoir suprême de l'État, sans ingérence extérieure.<br><br>

            </div>
            <div class="sources"><strong>Sources :</strong> Programme national d'ECM RDC, Constitution de la RDC (2006).</div>
        `

            </div>

                <strong>📚 Théorie : Les symboles de la RDC</strong><br>

                • <strong>Hymne national :</strong> « Debout Congolais » (Depuis 1960).<br>
                • <strong>Devise :</strong> « Justice — Paix — Travail ».<br>

            </div>

                • <strong>Participer au développement</strong> du pays.
            </div>

                <p style="margin-bottom:15px;">Choisis la bonne réponse.</p>
                <div id="quizQuestions"></div>
                <button id="submitQuiz" class="quiz-btn-submit">✅ Valider</button>
                <div id="quizResult" class="quiz-result"></div>
            </div>
        `
    }
];

let currentSlide = 0;
let lastSearchTerm = "", searchResults = [], currentResultIdx = -1;
const contentDiv = document.getElementById('content');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const slideCounterSpan = document.getElementById('slideCounter');
const progressFill = document.getElementById('progressFill');
const timeDisplay = document.getElementById('timeDisplay');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchNav = document.getElementById('searchNav');
const prevResultBtn = document.getElementById('prevResultBtn');
const nextResultBtn = document.getElementById('nextResultBtn');
const resultCounterSpan = document.getElementById('resultCounter');
const quizNavBtn = document.getElementById('quizNavBtn');

function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim()) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span class="highlight">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderQuiz() {
    const q = document.getElementById('quizQuestions');
    if (!q) return;
    const questions = [
        { text:"Quels sont les 3 éléments de l'État ?", options:["Territoire, population, souveraineté","Armée, police, justice","Drapeau, hymne, monnaie"], correct:0 },
        { text:"Quelle est la devise de la RDC ?", options:["Liberté-Égalité-Fraternité","Justice-Paix-Travail","Unité-Discipline-Travail"], correct:1 },
        { text:"Quand la Constitution actuelle de la RDC a-t-elle été adoptée ?", options:["1960","2006","2018"], correct:1 },
        { text:"Quand la Déclaration universelle des droits de l'homme a-t-elle été adoptée ?", options:["1945","1948","1960"], correct:1 },
        { text:"Quelle est la fête nationale de la RDC ?", options:["30 juin","1ᵉʳ mai","24 novembre"], correct:0 },
        { text:"Qui vote les lois en RDC ?", options:["Président","Parlement","Cour constitutionnelle"], correct:1 },
        { text:"Quand l'ONU a-t-elle été créée ?", options:["1919","1945","2002"], correct:1 },
        { text:"Quand l'Union africaine a-t-elle été créée ?", options:["1963","1999","2002"], correct:2 },
        { text:"Quel est le siège de l'ONU ?", options:["Genève","New York","Paris"], correct:1 },
        { text:"Combien de provinces compte la RDC ?", options:["11","26","45"], correct:1 }
    ];
    let html = '';
    questions.forEach((q,i) => { html += `<div class="quiz-question"><p>${i+1}. ${q.text}</p>`; q.options.forEach((o,k) => { html += `<label><input type="radio" name="q${i}" value="${k}"> ${o}</label>`; }); html += `</div>`; });
    document.getElementById('quizQuestions').innerHTML = html;
    document.getElementById('submitQuiz').onclick = () => {
        let score = 0;
        questions.forEach((q,i) => { const s = document.querySelector(`input[name="q${i}"]:checked`); if (s && parseInt(s.value) === q.correct) score++; });
        const pct = Math.round(score/questions.length*100);
        document.getElementById('quizResult').innerHTML = `<div style="background:#bbdefb; padding:18px; border-radius:12px;">🎯 <strong>Score : ${score}/${questions.length} (${pct}%)</strong><br>${score === questions.length ? '🌟 Excellent !' : score >= 7 ? '👍 Bon travail !' : '📖 Relis les leçons.'}</div>`;
    };
}
function renderSlide(index, keepHighlight = true) {
    const isQuiz = (index === slides.length - 1);
    contentDiv.innerHTML = `<div class="slide active"><h2 class="slide-title">${slides[index].title}</h2><div class="slide-content">${slides[index].content}</div></div>`;
    if (isQuiz) renderQuiz();
    slideCounterSpan.textContent = `${index+1}/${slides.length}`;
    progressFill.style.width = `${((index+1)/slides.length)*100}%`;
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    timeDisplay.textContent = `Leçon ${index+1} / ${slides.length}`;
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm && !isQuiz) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = `${currentResultIdx+1}/${searchResults.length}`;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
quizNavBtn.onclick = () => { currentSlide = slides.length-1; renderSlide(currentSlide, false); };
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>
</body>
</html>
