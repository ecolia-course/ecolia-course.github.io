<script>
    const slides = [
        {
            title: "Leçon 1 : Qu'est-ce qu'une phrase ?",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> Imagine-toi au marché avec ta maman. Elle te dit : « Va acheter trois tomates. » Tu comprends tout de suite ce qu'elle veut. Elle aurait pu dire : « J'ai besoin de tomates pour la sauce. » Ce sont deux <strong>phrases</strong> différentes, mais tu les comprends parfaitement.
                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> Une phrase, c'est comme une maison. Elle a un début (la porte d'entrée), un milieu (les pièces), et une fin (le toit). Au début, il y a une <strong>majuscule</strong>. À la fin, il y a un <strong>point</strong>.
                </div>
                <h3>🔍 Observons</h3>
                <p>Regarde ces groupes de mots :</p>
                <ul>
                    <li><strong>Groupe A :</strong> « Le chat dort sur la natte. » → C'est une phrase. Elle a un sens complet.</li>
                    <li><strong>Groupe B :</strong> « Le chat sur la » → Ce n'est pas une phrase. On ne comprend pas ce qui se passe.</li>
                </ul>
                <h3>❓ Questions pour réfléchir</h3>
                <ul>
                    <li>Qu'est-ce qui manque dans le groupe B pour que ce soit une phrase ?</li>
                    <li>Comment sais-tu qu'une phrase est terminée quand tu lis ?</li>
                    <li>Une phrase peut-elle être très courte ? (Exemple : « Viens ! »)</li>
                </ul>
                <h3>💡 Découverte</h3>
                <p>L'élève comprend qu'une phrase est un ensemble de mots qui a un <strong>sens complet</strong>. Elle commence par une <strong>majuscule</strong> et se termine par un <strong>point</strong> (ou un point d'interrogation, ou un point d'exclamation).</p>
                <div class="definition-box">
                    <strong>📚 Définition (Théorie) :</strong><br>
                    Une <strong>phrase</strong> est un énoncé qui a un sens complet. Elle commence par une <strong>lettre majuscule</strong> et se termine par une <strong>ponctuation forte</strong> :<br>
                    • le point (.) pour une affirmation<br>
                    • le point d'interrogation (?) pour une question<br>
                    • le point d'exclamation (!) pour une émotion, un ordre.
                </div>
                <div class="example-box">
                    ✅ <strong>Exemples :</strong><br>
                    • « Aujourd'hui, il fait beau. » (affirmation)<br>
                    • « Quel âge as-tu ? » (question)<br>
                    • « Comme tu es grand ! » (exclamation)
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé ultra-simple :</strong> Une phrase = des mots qui veulent dire quelque chose ensemble. Majuscule au début, point à la fin.
                </div>
            `
        },
        {
            title: "Leçon 2 : Les types de phrases (déclarative, interrogative, impérative, exclamative)",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> À la maison, tu entends plusieurs sortes de paroles. Ton père dit : « Il pleut dehors. » (il donne une information). Ta sœur demande : « Où est mon pagne ? » (elle pose une question). Ta mère ordonne : « Balaye la cour ! » (elle donne un ordre). Ton petit frère s'écrie : « Quel beau cadeau ! » (il exprime une émotion).
                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> Imagine quatre personnages : le <strong>journaliste</strong> qui annonce, le <strong>curieux</strong> qui demande, le <strong>chef</strong> qui commande, et l'<strong>émerveillé</strong> qui s'exclame. Chacun utilise un type de phrase différent.
                </div>
                <h3>🔍 Observons</h3>
                <p>On ne parle pas toujours de la même manière. Parfois on raconte, parfois on interroge, parfois on commande.</p>
                <div class="definition-box">
                    <strong>📚 Théorie : Les 4 types de phrases</strong><br>
                    • <strong>Phrase déclarative :</strong> elle donne une information, raconte un fait. Se termine par un point (.).<br>
                    • <strong>Phrase interrogative :</strong> elle pose une question. Se termine par un point d'interrogation (?).<br>
                    • <strong>Phrase impérative (ou injonctive) :</strong> elle donne un ordre, un conseil. Se termine par un point (.) ou un point d'exclamation (!).<br>
                    • <strong>Phrase exclamative :</strong> elle exprime une émotion forte (joie, colère, surprise). Se termine par un point d'exclamation (!).
                </div>
                <div class="example-box">
                    📝 <strong>Exemples concrets :</strong><br>
                    • Déclarative : « Kinshasa est la capitale de la RDC. »<br>
                    • Interrogative : « Veux-tu du fufu ? »<br>
                    • Impérative : « Ferme la porte, s'il te plaît. »<br>
                    • Exclamative : « Quelle belle journée ! »
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> 4 types : <em>déclarative</em> (raconter), <em>interrogative</em> (demander), <em>impérative</em> (commander), <em>exclamative</em> (exprimer un sentiment).
                </div>
            `
        },
        {
            title: "Leçon 3 : Le verbe – Le mot qui dit l'action",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> Pendant la récréation, que fais-tu ? Tu <strong>cours</strong>, tu <strong>joues</strong>, tu <strong>ris</strong>, tu <strong>manges</strong> ton pain. Tous ces mots qui disent ce que tu fais, ce sont des <strong>verbes</strong>.
                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> Le verbe, c'est le <strong>moteur</strong> de la phrase. Sans lui, la phrase ne bouge pas. « Le chien dans la rue » → on attend l'action. « Le chien <strong>court</strong> dans la rue » → ça y est, la phrase est vivante !
                </div>
                <h3>🔍 Observons</h3>
                <p>Dans chaque phrase, il y a un mot qui change si on change le temps (hier, aujourd'hui, demain). Ce mot, c'est le <strong>verbe</strong>.</p>
                <ul>
                    <li>Hier, je <strong>mangeais</strong> du manioc.</li>
                    <li>Aujourd'hui, je <strong>mange</strong> du riz.</li>
                    <li>Demain, je <strong>mangerai</strong> du poisson.</li>
                </ul>
                <div class="definition-box">
                    <strong>📚 Théorie :</strong><br>
                    Le <strong>verbe</strong> est un mot qui exprime :<br>
                    • une <strong>action</strong> (courir, chanter, écrire)<br>
                    • un <strong>état</strong> (être, sembler, paraître, rester)<br>
                    Le verbe se <strong>conjugue</strong> : il change de forme selon le temps (passé, présent, futur) et la personne (je, tu, il...).
                </div>
                <div class="example-box">
                    🧠 <strong>Astuce :</strong> Pour trouver le verbe, mets la phrase à un autre temps. Le mot qui change, c'est le verbe !<br>
                    « La fille danse bien. » → « Hier, la fille <strong>dansait</strong> bien. » Le verbe est « danse ».
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> Le verbe = le mot de l'action ou de l'état. Il se conjugue. C'est le cœur de la phrase.
                </div>
            `
        },
        {
            title: "Leçon 4 : Le sujet – Qui fait l'action ?",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> Ta sœur prépare le repas. Tu demandes : « Qui prépare le repas ? » Réponse : « C'est ma sœur. » Dans la phrase « Ma sœur prépare le repas », <strong>ma sœur</strong> est le sujet : c'est elle qui fait l'action.
                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> Dans une équipe de football, le <strong>capitaine</strong> dirige le jeu. Dans la phrase, le <strong>sujet</strong> commande le verbe. C'est lui qui fait l'action ou qui est dans l'état.
                </div>
                <h3>🔍 Observons</h3>
                <p>Pour trouver le sujet, on pose la question : <strong>« Qui est-ce qui ? »</strong> ou <strong>« Qu'est-ce qui ? »</strong> avant le verbe.</p>
                <div class="definition-box">
                    <strong>📚 Théorie :</strong><br>
                    Le <strong>sujet</strong> est le mot ou le groupe de mots qui <strong>fait l'action</strong> ou qui <strong>subit l'état</strong> exprimé par le verbe.<br>
                    Le sujet <strong>commande l'accord du verbe</strong> : si le sujet change de nombre (singulier/pluriel), le verbe change aussi.
                </div>
                <div class="example-box">
                    📝 <strong>Exemples :</strong><br>
                    • « <u>Les enfants</u> jouent dans la cour. » → Qui joue ? Les enfants (sujet au pluriel → verbe au pluriel).<br>
                    • « <u>La pluie</u> tombe fort. » → Qui tombe ? La pluie (sujet au singulier → verbe au singulier).
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> Le sujet = celui qui fait l'action. Question magique : <em>« Qui est-ce qui + verbe ? »</em>
                </div>
            `
        },
        {
            title: "Leçon 5 : Le groupe nominal (GN) – Nom, déterminant, adjectif",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> Tu montres à ton ami un objet et tu dis : « Regarde <strong>le beau ballon rouge</strong> ! » Tu viens d'utiliser un <strong>groupe nominal</strong>. Tu aurais pu dire simplement « ballon », mais tu as ajouté des mots pour le décrire.
                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> Le nom, c'est le <strong>roi</strong> du groupe. Le déterminant, c'est son <strong>garde du corps</strong> (toujours devant). L'adjectif, c'est son <strong>costume</strong> qui le décrit.
                </div>
                <h3>🔍 Observons</h3>
                <p>Un groupe nominal (GN) est un ensemble de mots organisés autour d'un <strong>nom</strong>.</p>
                <div class="definition-box">
                    <strong>📚 Théorie :</strong><br>
                    Le <strong>groupe nominal (GN)</strong> est composé au minimum d'un <strong>déterminant</strong> et d'un <strong>nom</strong>. Il peut contenir un ou plusieurs <strong>adjectifs qualificatifs</strong>.<br>
                    • <strong>Déterminant :</strong> le, la, les, un, une, des, mon, ton, son, ce, cette...<br>
                    • <strong>Nom :</strong> mot qui désigne une personne, un animal, une chose, une idée.<br>
                    • <strong>Adjectif qualificatif :</strong> mot qui décrit le nom (couleur, taille, qualité).
                </div>
                <div class="example-box">
                    🔍 <strong>Analyse :</strong> « <u>les grandes maisons blanches</u> »<br>
                    • Déterminant : <strong>les</strong><br>
                    • Nom : <strong>maisons</strong><br>
                    • Adjectifs : <strong>grandes</strong>, <strong>blanches</strong>
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> GN = Déterminant + Nom (+ Adjectif(s)). Tout s'accorde ensemble en genre et en nombre.
                </div>
            `
        },
        {
            title: "Leçon 6 : L'accord dans le groupe nominal",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> Imagine un tailleur qui coud un habit. Si le client est une dame, l'habit doit être ajusté pour une femme. Si le client est grand, l'habit doit être long. Dans la langue française, les mots s'ajustent aussi les uns aux autres : c'est <strong>l'accord</strong>.
                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> Les mots du groupe nominal sont comme une équipe de danseurs. Ils doivent tous porter le même costume : même genre (masculin/féminin) et même nombre (singulier/pluriel).
                </div>
                <h3>🔍 Observons</h3>
                <ul>
                    <li>« Un <u>petit garçon</u> » → masculin singulier.</li>
                    <li>« Une <u>petite fille</u> » → féminin singulier.</li>
                    <li>« Des <u>petits garçons</u> » → masculin pluriel.</li>
                </ul>
                <div class="definition-box">
                    <strong>📚 Théorie : Règles d'accord dans le GN</strong><br>
                    Dans un groupe nominal, le <strong>déterminant</strong> et l'<strong>adjectif qualificatif</strong> s'accordent en <strong>genre</strong> (masculin/féminin) et en <strong>nombre</strong> (singulier/pluriel) avec le <strong>nom</strong> qu'ils accompagnent.<br><br>
                    <strong>Règle générale du pluriel :</strong> on ajoute un <strong>-s</strong> au nom et à l'adjectif.<br>
                    <strong>Règle générale du féminin :</strong> on ajoute un <strong>-e</strong> à l'adjectif.
                </div>
                <div class="example-box">
                    📝 <strong>Exemples :</strong><br>
                    • « Le grand arbre » → « Les grands arbres » (pluriel : +s)<br>
                    • « Un chat noir » → « Une chatte noire » (féminin : +e)
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> Dans le GN, tout le monde s'accorde avec le nom. On ajoute <em>-e</em> pour le féminin, <em>-s</em> pour le pluriel.
                </div>
            `
        },
        {
            title: "Leçon 7 : Le présent de l'indicatif – Verbes du 1er groupe (-ER)",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> En ce moment même, tu <strong>étudies</strong> ta leçon de français. Tu <strong>parles</strong> avec ton voisin. Tu <strong>écoutes</strong> le maître. Toutes ces actions se passent <strong>maintenant</strong> : c'est le <strong>présent</strong>.
                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> Le présent, c'est comme une photo qu'on prend à l'instant. Tout ce qui est en train de se passer au moment où l'on parle est au présent.
                </div>
                <h3>🔍 Observons</h3>
                <p>Le verbe <strong>PARLER</strong> au présent :<br>
                Je parle, Tu parles, Il/Elle parle, Nous parlons, Vous parlez, Ils/Elles parlent.</p>
                <div class="definition-box">
                    <strong>📚 Théorie : Conjugaison des verbes du 1er groupe (-ER) au présent</strong><br>
                    Radical (parl-) + terminaisons : <strong>-e, -es, -e, -ons, -ez, -ent</strong><br><br>
                    <table class="table">
                        <tr><th>Personne</th><th>Terminaison</th><th>Exemple (CHANTER)</th></tr>
                        <tr><td>Je</td><td>-e</td><td>Je chante</td></tr>
                        <tr><td>Tu</td><td>-es</td><td>Tu chantes</td></tr>
                        <tr><td>Il/Elle/On</td><td>-e</td><td>Il chante</td></tr>
                        <tr><td>Nous</td><td>-ons</td><td>Nous chantons</td></tr>
                        <tr><td>Vous</td><td>-ez</td><td>Vous chantez</td></tr>
                        <tr><td>Ils/Elles</td><td>-ent</td><td>Ils chantent</td></tr>
                    </table>
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> Verbes en -ER au présent : radical + e, es, e, ons, ez, ent. Facile comme bonjour !
                </div>
            `
        },
        {
            title: "Leçon 8 : Le présent de l'indicatif – ÊTRE et AVOIR",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> Tu te présentes : « Je <strong>suis</strong> élève en 7e année. J'<strong>ai</strong> 12 ans. » Les verbes <strong>être</strong> et <strong>avoir</strong> sont les deux verbes les plus utilisés en français. On les appelle des <strong>auxiliaires</strong>.
                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> Être et avoir sont comme les deux <strong>piliers</strong> d'une maison. Sans eux, beaucoup de phrases s'écroulent. Ils servent aussi à fabriquer d'autres temps (passé composé).
                </div>
                <div class="definition-box">
                    <strong>📚 Théorie : Conjugaison au présent</strong><br>
                    <strong>ÊTRE :</strong> je suis, tu es, il/elle est, nous sommes, vous êtes, ils/elles sont.<br>

                <div class="example-box">

                    • « J'<strong>ai</strong> faim. »
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> Être et avoir sont irréguliers. Il faut les apprendre par cœur car on les utilise tout le temps.
                </div>
            `
        },
        {
            title: "Leçon 9 : L'imparfait de l'indicatif",
            content: `

                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> L'imparfait, c'est comme un film ancien qu'on regarde. On voit des actions qui duraient, qui se répétaient dans le passé.

                <h3>🔍 Observons</h3>
                <p>Le verbe <strong>PARLER</strong> à l'imparfait :<br>
                Je parlais, Tu parlais, Il parlait, Nous parlions, Vous parliez, Ils parlaient.</p>
                <div class="definition-box">
                    <strong>📚 Théorie :</strong><br>
                    L'imparfait exprime une action passée qui <strong>dure</strong> ou qui se <strong>répète</strong>.<br>
                    <strong>Formation :</strong> Radical du verbe à la 1ʳᵉ personne du pluriel du présent (nous parl-<strong>ons</strong>) + terminaisons : <strong>-ais, -ais, -ait, -ions, -iez, -aient</strong>.<br><br>
                    <strong>ÊTRE</strong> fait exception : j'étais, tu étais, il était, nous étions, vous étiez, ils étaient.
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> Imparfait = passé qui dure. Terminaisons : <em>-ais, -ais, -ait, -ions, -iez, -aient</em>.
                </div>
            `
        },
        {
            title: "Leçon 10 : Le futur simple de l'indicatif",
            content: `

                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> Le futur, c'est comme regarder devant soi sur un chemin. On ne voit pas encore les choses, mais on sait ce qui va arriver.

                <h3>🔍 Observons</h3>
                <p>Verbe <strong>CHANTER</strong> au futur :<br>

                <div class="definition-box">
                    <strong>📚 Théorie :</strong><br>
                    Le <strong>futur simple</strong> exprime une action qui se déroulera <strong>plus tard</strong>.<br>
                    <strong>Formation (verbes en -ER) :</strong> Infinitif entier + terminaisons : <strong>-ai, -as, -a, -ons, -ez, -ont</strong>.<br><br>
                    <strong>ÊTRE :</strong> je serai, tu seras, il sera, nous serons, vous serez, ils seront.<br>
                    <strong>AVOIR :</strong> j'aurai, tu auras, il aura, nous aurons, vous aurez, ils auront.
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> Futur simple = infinitif + <em>-ai, -as, -a, -ons, -ez, -ont</em>. Sert à parler de demain.
                </div>

        {
            title: "Leçon 11 : Le passé composé",
            content: `

                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> Le passé composé, c'est comme un selfie qu'on a pris hier. L'action est terminée, capturée. Elle ne dure plus.
                </div>
                <h3>🔍 Observons</h3>
                <p>Le passé composé est formé de <strong>deux mots</strong> : l'auxiliaire (être ou avoir) au présent + le participe passé du verbe.</p>
                <div class="definition-box">
                    <strong>📚 Théorie :</strong><br>
                    <strong>Formation :</strong> Auxiliaire ÊTRE ou AVOIR au présent + <strong>Participe passé</strong>.<br><br>

                    <strong>ÊTRE</strong> (verbes de mouvement : aller, venir, entrer, sortir, naître, mourir...) : Je suis allé(e), Tu es venu(e).<br><br>
                    <strong>Participe passé des verbes en -ER :</strong> radical + <strong>-é</strong> (manger → mangé).<br>
                    Avec ÊTRE, le participe passé s'accorde avec le sujet : <strong>Elle est allée</strong>.
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> Passé composé = auxiliaire (être/avoir) au présent + participe passé. Action terminée, précise.
                </div>
            `
        },
        {
            title: "Leçon 12 : Écrire un petit texte descriptif",
            content: `

                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> Décrire, c'est <strong>peindre avec des mots</strong>. Chaque phrase est un coup de pinceau. Tu utilises tes yeux, tes oreilles, ton nez pour donner des détails.

                <h3>🔍 Observons un exemple</h3>
                <p><em>« La cour de l'école est grande et sablonneuse. Au centre, un vieux manguier donne de l'ombre. Les élèves jouent au ballon près de la clôture. On entend leurs rires et le bruit des sandales sur le sol. L'air sent la poussière et la craie. »</em></p>

                    <strong>📚 Méthode pour écrire une description :</strong><br>

                    4. Utilise des <strong>adjectifs qualificatifs</strong> et des <strong>groupes nominaux</strong> précis.<br>
                    5. Écris des <strong>phrases déclaratives</strong> au <strong>présent</strong>.

                    ✏️ <strong>À toi d'essayer :</strong> Décris ta salle de classe en 5 phrases. Utilise au moins 3 adjectifs qualificatifs.

                <div class="summary-box">

        },
        {
            title: "🏆 QUIZ FINAL – Vérifie tes connaissances !",
            content: `
                <div id="quizContainer" class="quiz-container">
                    <h3>📝 Questionnaire de français (7ᵉ année)</h3>
                    <p style="margin-bottom:15px;">Choisis la bonne réponse pour chaque question.</p>
                    <div id="quizQuestions"></div>
                    <button id="submitQuiz" class="quiz-btn-submit">✅ Valider mes réponses</button>
                    <div id="quizResult" class="quiz-result"></div>
                </div>
            `
        }
    ];

    let currentSlide = 0, isAutoPlaying = false, syncInterval;
    let lastSearchTerm = "", searchResults = [], currentResultIdx = -1;
    const audioPlayer = document.getElementById('audioPlayer');
    const contentDiv = document.getElementById('content');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playBtn = document.getElementById('playBtn');
    const statusDiv = document.getElementById('status');
    const slideCounterSpan = document.getElementById('slideCounter');
    const progressFill = document.getElementById('progressFill');
    const timeDisplay = document.getElementById('timeDisplay');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const searchNav = document.getElementById('searchNav');
    const prevResultBtn = document.getElementById('prevResultBtn');
    const nextResultBtn = document.getElementById('nextResultBtn');
    const resultCounterSpan = document.getElementById('resultCounter');
    const quizNavBtn = document.getElementById('quizNavBtn');

    const timeline = [0,82,160,221,290,361,443,507,562,631,703,776,864];
    const totalDuration = 880; // ~20 minutes

    function getTextFromHtml(html) {
        const div = document.createElement('div');
        div.innerHTML = html;
        return div.textContent || div.innerText || "";
    }

    function searchSlides(term) {
        if (!term.trim()) return [];
        const lowerTerm = term.toLowerCase();
        const results = [];
        slides.forEach((slide, idx) => {
            if (slide.title.toLowerCase().includes(lowerTerm) ||
                getTextFromHtml(slide.content).toLowerCase().includes(lowerTerm)) {
                results.push(idx);
            }
        });
        return results;
    }

    function highlightInCurrentSlide(term) {
        if (!term || term.trim() === "") return;
        const slideContentDiv = document.querySelector('.slide-content');
        if (!slideContentDiv) return;
        const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        const walker = document.createTreeWalker(slideContentDiv, NodeFilter.SHOW_TEXT, null, false);
        const textNodes = [];
        while (walker.nextNode()) textNodes.push(walker.currentNode);
        for (let node of textNodes) {
            if (node.nodeValue && regex.test(node.nodeValue)) {
                const span = document.createElement('span');
                span.innerHTML = node.nodeValue.replace(regex, '<span class="highlight">$1</span>');
                node.parentNode.replaceChild(span, node);
            }
        }
    }

    function renderQuiz() {
        const quizDiv = document.getElementById('quizQuestions');
        if (!quizDiv) return;
        const questions = [
            { text: "Par quoi commence une phrase ?", options: ["Un point", "Une majuscule", "Un verbe"], correct: 1 },
            { text: "Quel type de phrase sert à poser une question ?", options: ["Déclarative", "Interrogative", "Impérative"], correct: 1 },
            { text: "Quel est le verbe dans : « Les oiseaux chantent dans l'arbre. » ?", options: ["oiseaux", "chantent", "arbre"], correct: 1 },
            { text: "Quel mot est le sujet dans : « La petite fille lit un livre. » ?", options: ["petite", "fille", "lit"], correct: 1 },
            { text: "Dans « les jolies fleurs rouges », quel est le nom ?", options: ["jolies", "fleurs", "rouges"], correct: 1 },
            { text: "Au présent, « nous » + « parler » donne :", options: ["Nous parlons", "Nous parlez", "Nous parlent"], correct: 0 },
            { text: "La terminaison de l'imparfait avec « je » est :", options: ["-ais", "-ait", "-ions"], correct: 0 },
            { text: "Le passé composé est formé de :", options: ["Un seul mot", "Deux mots", "Trois mots"], correct: 1 },
            { text: "« Nous serons » est au :", options: ["Présent", "Futur simple", "Imparfait"], correct: 1 },
            { text: "Pour décrire, on utilise surtout :", options: ["Des verbes d'action", "Des adjectifs qualificatifs", "Des points d'interrogation"], correct: 1 }
        ];
        let html = '';
        questions.forEach((q, idx) => {
            html += `<div class="quiz-question"><p>${idx+1}. ${q.text}</p>`;
            q.options.forEach((opt, optIdx) => {
                html += `<label><input type="radio" name="q${idx}" value="${optIdx}"> ${opt}</label>`;
            });
            html += `</div>`;
        });
        quizDiv.innerHTML = html;
        const submitBtn = document.getElementById('submitQuiz');
        if (submitBtn) {
            submitBtn.onclick = () => {
                let score = 0;
                questions.forEach((q, idx) => {
                    const selected = document.querySelector(`input[name="q${idx}"]:checked`);
                    if (selected && parseInt(selected.value) === q.correct) score++;
                });
                const resultDiv = document.getElementById('quizResult');
                const pct = Math.round(score/questions.length*100);
                resultDiv.innerHTML = `<div style="background:#d5f5e3; padding:18px; border-radius:12px;">
                    🎯 <strong>Ton score : ${score} / ${questions.length} (${pct}%)</strong><br>
                    ${score === questions.length ? '🌟 Excellent ! Tu maîtrises le français !' : score >=7 ? '👍 Bon travail, continue !' : '📖 Relis les leçons et progresse encore.'}
                </div>`;
            };
        }
    }

    function renderSlide(index, keepHighlight = true) {
        const isQuiz = (index === slides.length - 1);
        contentDiv.innerHTML = `<div class="slide active">
            <h2 class="slide-title">${slides[index].title}</h2>
            <div class="slide-content">${slides[index].content}</div>
        </div>`;
        if (isQuiz) renderQuiz();
        slideCounterSpan.textContent = `${index+1}/${slides.length}`;
        progressFill.style.width = `${((index+1)/slides.length)*100}%`;
        if (!isAutoPlaying) {
            prevBtn.disabled = (index === 0);
            nextBtn.disabled = (index === slides.length-1);
        }
        contentDiv.scrollTop = 0;
        if (keepHighlight && lastSearchTerm && lastSearchTerm.trim() !== "" && !isQuiz) {
            highlightInCurrentSlide(lastSearchTerm);
        }
    }

    function updateResultDisplay() {
        if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
        searchNav.style.display = 'flex';
        resultCounterSpan.innerText = `${currentResultIdx+1}/${searchResults.length}`;
    }

    function goToResult(idx) {
        if (idx < 0 || idx >= searchResults.length) return;
        currentResultIdx = idx;
        currentSlide = searchResults[currentResultIdx];
        renderSlide(currentSlide, true);
        updateResultDisplay();
    }

    function performSearch() {
        const term = searchInput.value.trim();
        if (!term) { alert("Entre un mot à rechercher."); return; }
        if (isAutoPlaying) stopAutoPlay();
        lastSearchTerm = term;
        searchResults = searchSlides(term);
        if (searchResults.length === 0) { alert(`Aucun résultat pour "${term}".`); searchNav.style.display = 'none'; return; }
        currentResultIdx = 0;
        goToResult(0);
    }

    function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
    function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }

    function nextSlide() {
        if (currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); clearSearch(); }
    }
    function prevSlide() {
        if (currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); clearSearch(); }
    }
    function clearSearch() {
        if (lastSearchTerm) { lastSearchTerm = ""; searchResults = []; searchNav.style.display = 'none'; searchInput.value = ""; }
    }

    function updateTimeDisplay() {
        let t = audioPlayer.currentTime;
        let mins = Math.floor(t/60).toString().padStart(2,'0');
        let secs = Math.floor(t%60).toString().padStart(2,'0');
        let tMins = Math.floor(totalDuration/60).toString().padStart(2,'0');
        let tSecs = Math.floor(totalDuration%60).toString().padStart(2,'0');
        timeDisplay.innerText = `${mins}:${secs} / ${tMins}:${tSecs}`;
        if (!isAutoPlaying) progressFill.style.width = `${(t/totalDuration)*100}%`;
    }

    function syncSlideFromTime() {
        if (!isAutoPlaying) return;
        const t = audioPlayer.currentTime;
        for (let i = timeline.length-1; i >= 0; i--) {
            if (t >= timeline[i]) {
                if (i !== currentSlide) { currentSlide = i; renderSlide(currentSlide, false); }
                break;
            }
        }
        updateTimeDisplay();
        if (t >= totalDuration - 1) stopAutoPlay();
    }

    function startAutoPlay() {
        isAutoPlaying = true;
        playBtn.innerText = "⏸ Pause";
        playBtn.classList.add('stop-btn');
        statusDiv.innerText = "🔊 Lecture synchronisée en cours...";
        statusDiv.style.background = "rgba(26,82,118,0.9)";
        prevBtn.disabled = nextBtn.disabled = true;
        clearSearch();
        audioPlayer.play().catch(e => console.log("Lecture bloquée, cliquer sur play"));
        if (syncInterval) clearInterval(syncInterval);
        syncInterval = setInterval(syncSlideFromTime, 300);
    }

    function stopAutoPlay() {
        isAutoPlaying = false;
        playBtn.innerText = "▶ Lecture audio";
        playBtn.classList.remove('stop-btn');
        statusDiv.innerText = "📖 Mode navigation";
        statusDiv.style.background = "rgba(0,0,0,0.8)";
        audioPlayer.pause();
        if (syncInterval) { clearInterval(syncInterval); syncInterval = null; }
        prevBtn.disabled = (currentSlide===0);
        nextBtn.disabled = (currentSlide===slides.length-1);
    }

    function toggleAutoPlay() { isAutoPlaying ? stopAutoPlay() : startAutoPlay(); }
    function goToQuiz() { if (isAutoPlaying) stopAutoPlay(); currentSlide = slides.length-1; renderSlide(currentSlide, false); }

    document.addEventListener('keydown', (e) => {
        if (isAutoPlaying) return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === ' ' && document.activeElement !== searchInput) { e.preventDefault(); toggleAutoPlay(); }
    });

    prevBtn.onclick = prevSlide;
    nextBtn.onclick = nextSlide;
    playBtn.onclick = toggleAutoPlay;
    searchBtn.onclick = performSearch;
    prevResultBtn.onclick = prevResult;
    nextResultBtn.onclick = nextResult;
    quizNavBtn.onclick = goToQuiz;
    audioPlayer.addEventListener('ended', stopAutoPlay);
    audioPlayer.addEventListener('timeupdate', () => { if(!isAutoPlaying) updateTimeDisplay(); });

    renderSlide(0, false);
    updateTimeDisplay();
</script>
</body>
