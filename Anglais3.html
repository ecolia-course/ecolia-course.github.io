const slides = [
{
    title: "Sommaire — Anglais 3e année",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours d'anglais vise un niveau intermédiaire (A2–B1 du Cadre européen) adapté au contexte congolais. Il privilégie la communication : comprendre, parler, lire, écrire. La grammaire est un outil au service de l'usage, non une fin en soi.</p>
<p><strong>Note de transparence :</strong> le programme national d'anglais de 2007 couvre les classes de 7e à 2e humanités. Le découpage propre à la 3e année doit être vérifié sur le programme officiel en vigueur. Les leçons ci-dessous sont une proposition alignée sur les niveaux A2–B1 du CECRL et adaptée au contexte congolais.</p>
<ul>
<li>Leçon 1 — Diagnostic et révision des bases</li>
<li>Leçon 2 — Present simple vs present continuous</li>
<li>Leçon 3 — Past simple et récits courts</li>
<li>Leçon 4 — Present perfect</li>
<li>Leçon 5 — Vocabulaire : école, famille, loisirs</li>
<li>Leçon 6 — Compréhension écrite</li>
<li>Leçon 7 — Expression écrite : paragraphe et message</li>
<li>Leçon 8 — Expression orale</li>
<li>Leçon 9 — Les modaux : can, must, should</li>
<li>Leçon 10 — Compréhension orale</li>
<li>Leçon 11 — Projet : mini-exposé ou dialogue</li>
<li>Leçon 12 — Révision et évaluation</li>
</ul>
<p>Une évaluation finale de 15 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme national d'anglais (RDC, 2007) ; cadres CECRL A2–B1 ; manuels scolaires d'anglais 3e année ; MEPST (orientation oral d'anglais Examen d'État 2026).</div>
    `
},
{
    title: "Leçon 1 — Diagnostic et révision des bases",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Where do I stand in English? What do I need to review before we start? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Faire le point sur les acquis. Réviser les bases : pronoms, verbe « to be », « to have », alphabet. Construire un contrat de travail personnel.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les bases à consolider</div>
<ul>
<li><strong>Pronoms personnels :</strong> I, you, he/she/it, we, you, they.</li>
<li><strong>Verbe « to be »</strong> (être) : I am, you are, he/she/it is, we are, you are, they are.</li>
<li><strong>Verbe « to have »</strong> (avoir) : I have, you have, he/she/it has, we have, you have, they have.</li>
<li><strong>Alphabet :</strong> prononciation des lettres ; épeler un nom.</li>
<li><strong>Nombres :</strong> de 1 à 100 et au-delà.</li>
</ul>
</div>
<div class="bloc exemple"><div class="bloc-label">Mini-test (10 items)</div>
<p>1. Spell your name.<br>2. Complete: She ___ (to be) a student.<br>3. Complete: They ___ (to have) a car.<br>4. Say your age.<br>5. Say the day and month of your birthday.<br>6. What is your favourite colour?<br>7. Say what your father does.<br>8. Complete: He ___ (to be) at home.<br>9. Say hello and goodbye in English.<br>10. Say the plural of: book, city, child.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Auto-évaluation et contrat</div>
<p>Après la correction collective, l'élève identifie ses points forts et ses faiblesses et fixe trois objectifs pour l'année : parler en classe, écrire un paragraphe, comprendre un court dialogue.</p>
</div>
<div class="bloc resume"><div class="bloc-label">Key point</div><p>Réviser les bases n'est pas perdre du temps : c'est poser les fondations de la communication.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels d'anglais 3e année ; cadres CECRL A2.</div>
    `
},
{
    title: "Leçon 2 — Present simple vs present continuous",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« How do I describe my routine? How do I say what is happening right now? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer les deux présents. Former correctement les phrases affirmatives, négatives, interrogatives. Décrire routine et action en cours.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Present simple</div>
<p><strong>Forme :</strong> base verbale + <em>-s</em> à la 3e personne du singulier.<br><strong>Emplois :</strong> habitude, vérité générale, goût, horaire fixe.<br><strong>Mots-clés :</strong> always, usually, often, sometimes, never, every day.</p>
<p><strong>Exemples :</strong> « I <em>go</em> to school every day. » « She <em>goes</em> to school every day. » « Do you like football? » « She doesn't like milk. »</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Present continuous</div>
<p><strong>Forme :</strong> be (am/is/are) + base verbale + <em>-ing</em>.<br><strong>Emplois :</strong> action en cours, action temporaire, projet déjà prévu.<br><strong>Mots-clés :</strong> now, at the moment, currently, look! listen!</p>
<p><strong>Exemples :</strong> « I <em>am writing</em> a letter now. » « They <em>are playing</em> outside. » « Is she listening to music? » « I'm <em>not</em> working today. »</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Comparaison</div>
<img data-image-id="AN3_IMG01" alt="Tableau present simple / present continuous" style="max-width:100%;border-radius:8px;margin:12px 0;">
<p>« I <em>study</em> English every day » (habitude, présent simple) vs « I <em>am studying</em> English right now » (action en cours, présent continu).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Choose the correct form: « She ___ (go / goes) to school every day. » / « They ___ (are reading / read) a book now. »</p>
<p><strong>Ex. 2 :</strong> Write three sentences about your routine (present simple) and three about what is happening in your classroom right now (present continuous).</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> goes ; are reading.</p>
<p><strong>2)</strong> Exemple : « I wake up at six every day. I go to school by bus. I study in the evening. / I am sitting in class. My teacher is writing on the blackboard. My classmates are listening. »</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">Key point</div><p>Present simple = routine ; present continuous = action happening now.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels d'anglais 3e année.</div>
    `
},
{
    title: "Leçon 3 — Past simple et récits courts",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« How do I tell a story about last week? What happened yesterday? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Former correctement le past simple (réguliers et irréguliers). Utiliser les connecteurs du récit. Raconter un événement passé.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Formation</div>
<ul>
<li><strong>Verbes réguliers :</strong> base + <em>-ed</em>. « work → worked », « play → played », « watch → watched ».</li>
<li><strong>Verbes irréguliers :</strong> forme propre à mémoriser. « go → went », « see → saw », « eat → ate ».</li>
<li><strong>Négatif :</strong> did not (didn't) + base verbale. « I didn't go. »</li>
<li><strong>Interrogatif :</strong> Did + sujet + base verbale ? « Did you see him? »</li>
</ul>
<img data-image-id="AN3_IMG02" alt="Verbes irréguliers courants" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Connecteurs du récit</div>
<p>Pour ordonner les événements : first, then, after that, later, finally, suddenly, at last.</p>
</div>
<div class="bloc exemple"><div class="bloc-label">Exemple — Un récit court</div>
<p>« Last Saturday, I <em>woke up</em> early. I <em>had</em> breakfast and <em>went</em> to the market with my mother. We <em>bought</em> vegetables and fish. After that, we <em>returned</em> home. We <em>cooked</em> a big meal. In the evening, I <em>visited</em> my cousin. We <em>watched</em> a football match. Finally, I <em>went</em> to bed at ten. »</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Complete with the past simple: « I ___ (see) my friend yesterday. She ___ (come) with her brother. They ___ (not / stay) long. »</p>
<p><strong>Ex. 2 :</strong> Write five to six sentences about what you did last weekend, using at least three connectors.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> saw ; came ; didn't stay.</p>
<p><strong>2)</strong> Exemple : « Last weekend, I stayed at home. First, I helped my mother in the kitchen. Then, I did my homework. After that, I played football with my friends. Finally, I watched television with my family. »</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">Key point</div><p>Past simple = action passée terminée. Verbes réguliers en -ed, irréguliers à mémoriser.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels d'anglais 3e année.</div>
    `
},
{
    title: "Leçon 4 — Present perfect : expériences et bilans",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« How do I talk about my experiences without giving a specific date? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Former le present perfect. Distinguer present perfect et past simple. Exprimer expériences et bilans.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Formation</div>
<p>have / has + participe passé du verbe.</p>
<ul>
<li>« I <em>have visited</em> Kinshasa twice. »</li>
<li>« She <em>has never eaten</em> sushi. »</li>
<li>« Have you <em>finished</em> your homework? »</li>
<li>« We <em>haven't seen</em> that film yet. »</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Emplois et mots-clés</div>
<p>Le present perfect relie passé et présent. Il exprime :</p>
<ul>
<li><strong>une expérience :</strong> ever, never.</li>
<li><strong>un bilan :</strong> already, yet, just.</li>
<li><strong>une durée qui continue :</strong> for, since.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Present perfect vs past simple</div>
<p><strong>Present perfect :</strong> pas de date précise. « I <em>have been</em> to Lubumbashi. » (quand ? peu importe, c'est une expérience)</p>
<p><strong>Past simple :</strong> date précise. « I <em>went</em> to Lubumbashi in 2022. » (quand ? en 2022, date connue)</p>
<p>Mots-clés de past simple : yesterday, last week, in 2020, two days ago.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Choose the correct tense: « I ___ (visit / have visited) my grandmother yesterday. » / « She ___ (never / eat) plantains. »</p>
<p><strong>Ex. 2 :</strong> Write three sentences about experiences you have had, using ever, never, already.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> visited ; has never eaten.</p>
<p><strong>2)</strong> Exemple : « I have already visited Goma. I have never travelled by plane. Have you ever eaten fufu? »</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">Key point</div><p>Present perfect = lien passé / présent. Past simple = événement daté.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels d'anglais 3e année.</div>
    `
},
{
    title: "Leçon 5 — Vocabulaire : école, famille, loisirs",
    content: `

<div class="bloc theorie"><div class="bloc-label">Théorie — Lexique de la famille</div>
<ul>

<div class="bloc theorie"><div class="bloc-label">Théorie — Lexique des loisirs</div>
<ul>
<li><strong>Sports :</strong> football, basketball, running, swimming.</li>
<li><strong>Activités :</strong> reading, watching TV, listening to music, playing games, drawing.</li>

</div>
<div class="bloc exemple"><div class="bloc-label">Exemple — Jeu de rôle</div>
<p>« A: Hi, what do you do in your free time? / B: I like playing football and listening to music. And you? / A: I enjoy reading books. Do you like sports? / B: Yes, I love basketball. »</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Match each word with its category: teacher, football, mother, library, reading, brother.</p>
<p><strong>Ex. 2 :</strong> In pairs, prepare a short role play using at least five new words.</p>

      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
