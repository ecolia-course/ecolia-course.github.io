{
    title: "Leçon 1 — Introduction à la psychologie : définition, objet et méthodes",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une salle de classe à Kinshasa, deux élèves se disputent : « Pourquoi Mbuyi est-il si agressif ? » L'un dit : « C'est son caractère. » L'autre répond : « Non, c'est parce qu'il a faim. » Pour trancher, il faut la science qui étudie le comportement humain : la psychologie.</p></div>
<h3>1. Définition et objet de la psychologie</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Psychologie</strong> : science qui étudie le comportement humain et animal.</li><li><strong>Objet</strong> : le comportement, les processus mentaux, les émotions, la personnalité.</li><li><strong>Étymologie</strong> : du grec <em>psyché</em> (âme) et <em>logos</em> (science, discours).</li><li><strong>Science</strong> : elle utilise des méthodes rigoureuses : observation, expérimentation, tests, entretiens.</li></ul></div>
<h3>2. Les sortes de psychologie</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Psychologie générale</strong> : étudie le comportement de l'adulte normal.</li><li><strong>Psychologie de l'enfant et de l'adolescent</strong> : étudie l'évolution du comportement de la conception à la maturité (4e H.P.).</li><li><strong>Psychologie différentielle</strong> : étudie les différences entre individus ou groupes (sexe, culture, milieu).</li><li><strong>Psychologie sociale</strong> : étudie le comportement de l'individu en groupe.</li><li><strong>Psychologie pédagogique</strong> : étudie l'application des lois psychologiques à l'éducation.</li><li><strong>Psychologie pathologique</strong> : étudie les troubles mentaux et du comportement.</li></ul></div>
<h3>3. Les méthodes de la psychologie</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Observation</strong> : méthode fondamentale, étudie le comportement dans son milieu naturel.</li><li><strong>Expérimentation</strong> : provoque un comportement dans des conditions contrôlées.</li><li><strong>Entretien</strong> : dialogue structuré pour recueillir des informations.</li><li><strong>Questionnaire</strong> : série de questions écrites.</li><li><strong>Tests psychologiques</strong> : épreuves standardisées (intelligence, personnalité, aptitudes).</li><li><strong>Étude de cas</strong> : analyse approfondie d'un individu ou d'un groupe.</li></ul></div>
<h3>4. Relation avec les autres sciences</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Psychologie et physiologie</strong> : interdépendance entre la vie mentale et la vie organique. Ex. : un accident cérébral peut entraîner des troubles psychiques.</li><li><strong>Psychologie et sociologie</strong> : l'individu est influencé par la société.</li><li><strong>Psychologie et pédagogie</strong> : la pédagogie applique les lois psychologiques à l'éducation.</li><li><strong>Psychologie et philosophie</strong> : la philosophie s'interroge sur la nature de l'homme, la psychologie l'étudie scientifiquement.</li></ul><p><a href="https://www.youtube.com/results?search_query=psychologie+définition+objet+méthodes" target="_blank" rel="noopener">🎥 Recherche : introduction à la psychologie (chaînes de cours de psychologie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La psychologie est la science du comportement humain et animal. Elle se divise en plusieurs branches (générale, de l'enfant, différentielle, sociale, pédagogique, pathologique). Ses méthodes sont l'observation, l'expérimentation, l'entretien, les tests et l'étude de cas.</p></div>
<div class="sources"><strong>Sources :</strong> Programme National de Psychopédagogie (2009), Manuel de Psychologie Générale 4ème année (manuels-scolaires-rdc.com, 2025), Synthèse Psycho-Pédagogique 2025 (Christian ANIGULE KANGOYANGALA & Christian MBOLIGIE UMBAWO).<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, HP.</div>
    `
},
{
    title: "Leçon 2 — La personnalité et les tempéraments",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une classe de 4e pédagogique à Mbandaka, trois élèves réagissent différemment à une mauvaise note : Kola se met en colère, Mado pleure, Tshibangu reste calme. Trois personnalités, trois tempéraments. Comment les comprendre ?</p></div>
<h3>1. Définition de la personnalité</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Personnalité</strong> : organisation dynamique des traits physiques, intellectuels, affectifs et sociaux qui caractérisent un individu.</li><li><strong>Caractère</strong> : ensemble des dispositions affectives et morales acquises.</li><li><strong>Tempérament</strong> : ensemble des dispositions innées, liées à la constitution biologique.</li><li><strong>Traits</strong> : caractéristiques stables qui distinguent les individus.</li></ul></div>
<h3>2. Les quatre tempéraments</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Nerveux (mélancolique)</strong> : sensible, émotif, introverti, vite fatigué.</li><li><strong>Sanguin</strong> : gai, optimiste, sociable, réactif.</li><li><strong>Bilieux (colérique)</strong> : impulsif, énergique, colérique, actif.</li><li><strong>Flegmatique</strong> : calme, lent, réfléchi, peu expressif.</li></ul></div>
<h3>3. Les facteurs de la personnalité</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Hérédité</strong> : prédispositions génétiques, tempérament de base.</li><li><strong>Milieu</strong> : famille, école, société, culture.</li><li><strong>Éducation</strong> : formation reçue, valeurs transmises.</li><li><strong>Expériences personnelles</strong> : succès, échecs, traumatismes.</li></ul></div>
<h3>4. Les troubles de la personnalité</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Instabilité émotionnelle</strong> : sautes d'humeur fréquentes.</li><li><strong>Personnalité paranoïaque</strong> : méfiance excessive.</li><li><strong>Personnalité schizoïde</strong> : retrait social, froideur affective.</li><li><strong>Rôle de l'enseignant</strong> : observer, dépister, orienter vers un psychologue.</li></ul><p><a href="https://www.youtube.com/results?search_query=personnalité+tempéraments+psychologie" target="_blank" rel="noopener">🎥 Recherche : la personnalité et les tempéraments (chaînes de cours de psychologie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La personnalité est l'organisation dynamique des traits d'un individu. Les quatre tempéraments sont : nerveux, sanguin, bilieux, flegmatique. Elle est influencée par l'hérédité, le milieu, l'éducation et les expériences.</p></div>
<div class="sources"><strong>Sources :</strong> Programme National de Psychopédagogie (2009), Manuel de Psychologie Générale 4ème année (manuels-scolaires-rdc.com, 2025).</div>
    `
},
{
    title: "Leçon 3 — La sensation et la perception",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans la cour de l'école, tu entends un bruit. Est-ce un moteur ou un tambour ? Tu tournes la tête et tu vois un camion. Ce que tu as d'abord ressenti (le son) et ce que tu as reconnu (un camion) sont deux processus différents : la sensation et la perception.</p></div>
<h3>1. La sensation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Sensation</strong> : processus par lequel un organe des sens reçoit un stimulus et le transmet au cerveau.</li><li><strong>Seuil absolu</strong> : intensité minimale d'un stimulus pour être perçu.</li><li><strong>Seuil différentiel</strong> : plus petite différence perceptible entre deux stimuli.</li><li><strong>Adaptation sensorielle</strong> : diminution de la sensibilité après une exposition prolongée.</li></ul></div>
<h3>2. Les organes des sens</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Vue</strong> : récepteurs dans la rétine (cônes et bâtonnets).</li><li><strong>Ouïe</strong> : récepteurs dans l'oreille interne (cellules ciliées).</li><li><strong>Odorat</strong> : récepteurs dans la muqueuse nasale.</li><li><strong>Goût</strong> : récepteurs dans les papilles gustatives.</li><li><strong>Toucher</strong> : récepteurs dans la peau (chaud, froid, pression, douleur).</li></ul></div>
<h3>3. La perception</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Perception</strong> : interprétation des sensations par le cerveau.</li><li><strong>Lois de la perception</strong> : proximité, similitude, continuité, fermeture, figure-fond.</li><li><strong>Illusions d'optique</strong> : erreurs de perception (Müller-Lyer, Ponzo).</li><li><strong>Perception et apprentissage</strong> : la perception est influencée par l'expérience, les attentes, la culture.</li></ul></div>
<h3>4. Applications pédagogiques</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Clarté du tableau</strong> : écrire gros et lisiblement.</li><li><strong>Attention aux élèves malvoyants ou malentendants</strong> : placement au premier rang.</li><li><strong>Utilisation de supports visuels</strong> : images, schémas, cartes.</li><li><strong>Éviter la surcharge sensorielle</strong> : trop de stimuli nuisent à la perception.</li></ul><p><a href="https://www.youtube.com/results?search_query=sensation+perception+psychologie+lois" target="_blank" rel="noopener">🎥 Recherche : la sensation et la perception (chaînes de cours de psychologie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La sensation est la réception d'un stimulus par un organe des sens. La perception est son interprétation par le cerveau. Les lois de la perception (proximité, similitude, etc.) et les illusions montrent que percevoir n'est pas simplement voir.</p></div>
<div class="sources"><strong>Sources :</strong> Programme National de Psychopédagogie (2009), Manuel de Psychologie Générale 4ème année (manuels-scolaires-rdc.com, 2025).</div>
    `
},
{
    title: "Leçon 4 — La mémoire et l'imagination",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Pour l'EXETAT, tu dois mémoriser une liste de dates. Tu utilises une technique : tu associes chaque date à une image. C'est la mémoire et l'imagination qui travaillent ensemble.</p></div>
<h3>1. La mémoire</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Mémoire</strong> : capacité à encoder, stocker et restituer des informations.</li><li><strong>Mémoire sensorielle</strong> : très brève (fraction de seconde).</li><li><strong>Mémoire à court terme</strong> : limitée (7 ± 2 éléments), durée de quelques secondes à minutes.</li><li><strong>Mémoire à long terme</strong> : illimitée, durée variable (jours, années).</li><li><strong>Types</strong> : mémoire procédurale (habiletés), épisodique (événements), sémantique (connaissances).</li></ul></div>
<h3>2. Les lois de la mémoire</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Loi de la répétition</strong> : plus on répète, mieux on retient.</li><li><strong>Loi de l'association</strong> : on retient mieux ce qui est lié à du connu.</li><li><strong>Loi de la primauté</strong> : on retient mieux le début.</li><li><strong>Loi de la récence</strong> : on retient mieux la fin.</li><li><strong>Courbe de l'oubli</strong> (Ebbinghaus) : l'oubli est rapide au début, puis ralentit.</li></ul></div>
<h3>3. L'imagination</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Imagination</strong> : capacité à se représenter des objets ou situations non présents.</li><li><strong>Imagination reproductive</strong> : se rappeler des images déjà vues.</li><li><strong>Imagination créatrice</strong> : produire des images nouvelles (invention, art).</li><li><strong>Rôle dans l'apprentissage</strong> : visualiser, anticiper, résoudre des problèmes.</li></ul></div>
<h3>4. Applications pédagogiques</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Techniques de mémorisation</strong> : répétition espacée, association, images mentales.</li><li><strong>Exercices d'imagination</strong> : rédaction de récits, résolution de problèmes.</li><li><strong>Respect des limites</strong> : ne pas surcharger la mémoire à court terme.</li><li><strong>Encouragement de la créativité</strong> : valoriser les productions originales.</li></ul><p><a href="https://www.youtube.com/results?search_query=mémoire+imagination+psychologie+lois" target="_blank" rel="noopener">🎥 Recherche : mémoire et imagination (chaînes de cours de psychologie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La mémoire encode, stocke et restitue les informations. Elle obéit à des lois (répétition, association, primauté, récence) et à la courbe de l'oubli. L'imagination permet de se représenter et de créer. Les deux sont essentielles à l'apprentissage.</p></div>
<div class="sources"><strong>Sources :</strong> Programme National de Psychopédagogie (2009), Manuel de Psychologie Générale 4ème année (manuels-scolaires-rdc.com, 2025).</div>
    `
},

    title: "Leçon 5 — La motivation et les besoins humains",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une école de Lubumbashi, certains élèves travaillent dur pour réussir, d'autres semblent indifférents. Pourquoi ? La réponse se trouve dans la motivation et les besoins humains.</p></div>
<h3>1. Définition de la motivation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Motivation</strong> : ensemble des facteurs qui poussent un individu à agir dans une direction donnée.</li><li><strong>Motivation intrinsèque</strong> : vient de l'intérêt personnel, du plaisir d'apprendre.</li><li><strong>Motivation extrinsèque</strong> : vient de récompenses ou de pressions extérieures (notes, félicitations, punitions).</li><li><strong>Besoin</strong> : état de manque qui pousse à l'action.</li></ul></div>
<h3>2. La pyramide de Maslow</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Besoins physiologiques</strong> : faim, soif, sommeil, respiration.</li><li><strong>Besoins de sécurité</strong> : protection, stabilité, absence de danger.</li><li><strong>Besoins d'appartenance</strong> : amour, amitié, appartenance à un groupe.</li><li><strong>Besoins d'estime</strong> : reconnaissance, respect, confiance en soi.</li><li><strong>Besoins d'accomplissement</strong> : réalisation de soi, dépassement.</li></ul></div>
<h3>3. Motivation et apprentissage</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Rôle de l'enseignant</strong> : susciter l'intérêt, donner du sens aux apprentissages.</li><li><strong>Feedback</strong> : les retours réguliers renforcent la motivation.</li><li><strong>Objectifs clairs</strong> : des buts atteignables augmentent la persévérance.</li><li><strong>Valorisation des réussites</strong> : célébrer les progrès.</li><li><strong>Différenciation</strong> : adapter les tâches au niveau de chaque élève.</li></ul></div>
<h3>4. Applications en classe</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li>Un élève démotivé à Kinshasa : l'enseignant découvre qu'il a faim (besoin physiologique non satisfait). Il le signale au service social.</li><li>Un élève doué mais paresseux : l'enseignant lui confie une responsabilité (besoin d'estime).</li><li>Une classe apathique : l'enseignant utilise des exemples concrets et des activités interactives.</li></ul><p><a href="https://www.youtube.com/results?search_query=motivation+besoins+Maslow+psychologie" target="_blank" rel="noopener">🎥 Recherche : la motivation et les besoins (chaînes de cours de psychologie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La motivation est l'ensemble des facteurs qui poussent à agir. Elle peut être intrinsèque ou extrinsèque. La pyramide de Maslow classe les besoins en cinq niveaux. L'enseignant doit créer les conditions de la motivation.</p></div>
<div class="sources"><strong>Sources :</strong> Programme National de Psychopédagogie (2009), Manuel de Psychologie Générale 4ème année (manuels-scolaires-rdc.com, 2025).</div>
    `
},

    title: "Leçon 6 — Les émotions et les sentiments",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Lors d'un match de football inter-classes, tu ressens une joie intense quand ton équipe gagne, et une grande tristesse quand elle perd. Ces réactions sont des émotions. Les sentiments, eux, sont plus durables : l'amour pour ta famille, l'amitié pour un camarade.</p></div>
<h3>1. Définition des émotions et des sentiments</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Émotion</strong> : réaction affective intense et brève, déclenchée par un stimulus.</li><li><strong>Sentiment</strong> : état affectif durable et moins intense.</li><li><strong>Passion</strong> : sentiment intense et envahissant.</li><li><strong>Humeur</strong> : état affectif général et prolongé.</li></ul></div>
<h3>2. Les émotions fondamentales</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Joie</strong> : satisfaction, plaisir.</li><li><strong>Tristesse</strong> : perte, déception.</li><li><strong>Colère</strong> : frustration, injustice.</li><li><strong>Peur</strong> : danger réel ou imaginaire.</li><li><strong>Surprise</strong> : événement inattendu.</li><li><strong>Dégoût</strong> : rejet, répulsion.</li></ul></div>
<h3>3. Les composantes de l'émotion</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Composante physiologique</strong> : accélération du cœur, transpiration.</li><li><strong>Composante cognitive</strong> : interprétation de la situation.</li><li><strong>Composante comportementale</strong> : expression faciale, gestes, fuite ou attaque.</li><li><strong>Composante subjective</strong> : ressenti personnel.</li></ul></div>
<h3>4. Gestion des émotions en classe</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Reconnaître ses émotions</strong> : nommer ce que l'on ressent.</li><li><strong>Accepter les émotions des élèves</strong> : ne pas minimiser ou punir les larmes.</li><li><strong>Apprendre à se calmer</strong> : respiration, retrait temporaire, parole.</li><li><strong>Développer l'empathie</strong> : se mettre à la place de l'autre.</li></ul><p><a href="https://www.youtube.com/results?search_query=émotions+sentiments+psychologie+gestion" target="_blank" rel="noopener">🎥 Recherche : les émotions et les sentiments (chaînes de cours de psychologie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les émotions sont des réactions affectives brèves et intenses (joie, tristesse, colère, peur). Les sentiments sont plus durables. L'enseignant doit aider les élèves à reconnaître et à gérer leurs émotions.</p></div>
<div class="sources"><strong>Sources :</strong> Programme National de Psychopédagogie (2009), Manuel de Psychologie Générale 4ème année (manuels-scolaires-rdc.com, 2025).</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une école primaire de Kisangani, un enfant de 7 ans ne comprend pas encore la notion de conservation (il pense qu'un verre large contient plus d'eau qu'un verre étroit). Une adolescente de 15 ans, elle, raisonne de manière abstraite. Pourquoi cette différence ? Piaget et Wallon l'expliquent.</p></div>
<h3>1. Les stades du développement selon Piaget</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Stade sensori-moteur</strong> (0-2 ans) : intelligence pratique, réflexes, coordination.</li><li><strong>Stade pré-opératoire</strong> (2-7 ans) : pensée symbolique, égocentrisme, pas de conservation.</li><li><strong>Stade des opérations concrètes</strong> (7-11 ans) : conservation, classification, sériation, opérations logiques sur le concret.</li><li><strong>Stade des opérations formelles</strong> (11-15 ans et plus) : pensée abstraite, hypothético-déductive, raisonnement scientifique.</li></ul></div>
<h3>2. Les stades selon Wallon</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Stade impulsif-émotionnel</strong> (0-1 an) : réactions impulsives, premières émotions.</li><li><strong>Stade sensori-moteur et projectif</strong> (1-3 ans) : exploration du monde, marche, langage.</li><li><strong>Stade du personnalisme</strong> (3-6 ans) : affirmation de soi, opposition, crise.</li><li><strong>Stade catégoriel</strong> (6-11 ans) : connaissance du monde, catégories.</li><li><strong>Stade de l'adolescence</strong> (11-18 ans) : puberté, crise d'identité, insertion sociale.</li></ul></div>
<h3>3. L'adolescence : caractéristiques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Développement physique</strong> : puberté, croissance rapide.</li><li><strong>Développement cognitif</strong> : pensée formelle, esprit critique.</li><li><strong>Développement affectif</strong> : recherche d'identité, instabilité émotionnelle.</li><li><strong>Développement social</strong> : importance du groupe de pairs, conflits avec les parents.</li></ul></div>
<h3>4. Applications pédagogiques</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Adapter l'enseignement au stade</strong> : concret pour les jeunes enfants, abstrait pour les adolescents.</li><li><strong>Comprendre les crises</strong> : opposition, repli, besoin d'autonomie.</li><li><strong>Accompagner sans juger</strong> : écoute active, respect des différences.</li><li><strong>Collaboration avec les parents</strong> : dialogue constructif.</li></ul><p><a href="https://www.youtube.com/results?search_query=psychologie+enfant+adolescent+Piaget+Wallon+stades" target="_blank" rel="noopener">🎥 Recherche : la psychologie de l'enfant et de l'adolescent (chaînes de cours de psychologie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Piaget distingue quatre stades : sensori-moteur, pré-opératoire, opérations concrètes, opérations formelles. Wallon insiste sur l'émotion et la socialisation. L'adolescence est marquée par la puberté, la crise d'identité et l'importance du groupe.</p></div>
<div class="sources"><strong>Sources :</strong> Programme National de Psychopédagogie (2009), Manuel de Psychologie du Développement 4ème année (manuels-scolaires-rdc.com, 2025).</div>

<h3>1. Définition et objet</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Psychologie sociale</strong> : étude du comportement de l'individu en groupe et des relations entre individus.</li><li><strong>Objet</strong> : influence sociale, relations interpersonnelles, attitudes, préjugés, conformisme.</li></ul></div>
<h3>2. Les phénomènes sociaux</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Conformisme</strong> : tendance à adopter les opinions du groupe.</li><li><strong>Influence sociale</strong> : les autres modifient nos comportements.</li><li><strong>Préjugés</strong> : opinions préconçues sur un groupe.</li><li><strong>Stéréotypes</strong> : images figées d'un groupe.</li><li><strong>Attitudes</strong> : dispositions à réagir de manière favorable ou défavorable.</li></ul></div>
<h3>3. La communication interpersonnelle</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Communication verbale</strong> : paroles, mots.</li><li><strong>Communication non verbale</strong> : gestes, mimiques, posture, regard.</li><li><strong>Écoute active</strong> : reformuler, questionner, manifester son attention.</li><li><strong>Obstacles</strong> : jugements, interruptions, préjugés.</li></ul></div>
<h3>4. Applications en milieu scolaire</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Gérer les conflits</strong> : médiation, dialogue, respect des différences.</li><li><strong>Favoriser la coopération</strong> : travaux de groupe, projets collectifs.</li><li><strong>Lutter contre les préjugés</strong> : éducation à la tolérance, ouverture à l'autre.</li><li><strong>Développer les compétences sociales</strong> : respect, écoute, empathie.</li></ul><p><a href="https://www.youtube.com/results?search_query=psychologie+sociale+relationnelle+communication" target="_blank" rel="noopener">🎥 Recherche : la psychologie sociale (chaînes de cours de psychologie)</a></p></div>

<div class="sources"><strong>Sources :</strong> Programme National de Psychopédagogie (2009), Manuel de Psychologie Générale 4ème année (manuels-scolaires-rdc.com, 2025).</div>

<h3>2. Les troubles de l'apprentissage</h3>

<h3>2. Méthode en 5 étapes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ol><li><strong>Analyse du sujet</strong> : identifier les mots-clés, la problématique.</li><li><strong>Recherche des idées</strong> : mobiliser les connaissances (auteurs, théories, exemples).</li><li><strong>Élaboration du plan</strong> : dialectique (thèse/antithèse/synthèse), thématique ou analytique.</li><li><strong>Rédaction</strong> : introduction, développement, conclusion.</li><li><strong>Relecture</strong> : vérifier la cohérence et l'orthographe.</li></ol></div>
<h3>3. Structure du devoir</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Introduction</strong> : accroche, définition des termes, problématique, annonce du plan.</li><li><strong>Développement</strong> : 2 ou 3 parties, chacune avec 2-3 paragraphes argumentés et des exemples.</li><li><strong>Transition</strong> entre les parties.</li><li><strong>Conclusion</strong> : synthèse, réponse à la problématique, ouverture.</li></ul></div>

{"text": "Qui a étudié le développement de l'intelligence ?", "options": ["Piaget", "Wallon", "Skinner"], "correct": 0},

];

questions.forEach(function(q) {
    if (!q.text) {
        q.text = q.question || q.q || q.enonce || q.titre || "";
    }
    if (typeof q.correct === 'undefined') {
        if (typeof q.answer !== 'undefined') q.correct = q.answer;
        else if (typeof q.reponse !== 'undefined') q.correct = q.reponse;
    }
});

let currentSlide = 0;
let lastSearchTerm = "", searchResults = [], currentResultIdx = -1;
const contentDiv = document.getElementById('content');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const slideCounterSpan = document.getElementById('slideCounter');
const progressFill = document.getElementById('progressFill');
const counterSpan = document.getElementById('counter');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchNav = document.getElementById('searchNav');
const prevResultBtn = document.getElementById('prevResultBtn');
const nextResultBtn = document.getElementById('nextResultBtn');
const resultCounterSpan = document.getElementById('resultCounter');
const pageTitle = document.getElementById('pageTitle');
pageTitle.textContent = "ECOLIA · " + COURSE_TITLE;
document.title = "ECOLIA — " + COURSE_TITLE;
function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';
    slideCounterSpan.textContent = '0/0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>

<script>
(function () {
  var SITE = "https://ecolia-course.github.io/";
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface", page servie par https://app.local
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function abs(u) { return /^(https?:|data:|blob:)/i.test(u) ? u : (NATIVE ? SITE + u.replace(/^(\.\/|\/)+/, "") : u); }
  function ext(u) { var m = String(u).split("?")[0].match(/\.(jpe?g|png|gif|webp|svg)$/i); return m ? m[1].toLowerCase() : "jpg"; }
  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {
    if (queued[fn]) return;
    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
    if (!queue.length) { running = false; return; }
    if (!navigator.onLine) { running = false; return; }
    var q = queue.shift(), t0 = Date.now();
    try { CoursInterface.download(q[0], q[1]); } catch (e) { return setTimeout(next, 500); }
    (function wait() {
      var ok = false;
      try { ok = !!CoursInterface.exists(q[1]); } catch (e) {}
      if (ok) setTimeout(next, 1500);
      else if (Date.now() - t0 > 40000) next();
      else setTimeout(wait, 700);
    })();
  }
  function exists(fn) { try { return !!CoursInterface.exists(fn); } catch (e) { return false; } }

  function show(img) {                                    // affiche UNE image (appelé à chaque slide affichée)
    if (!table || img.getAttribute("data-ecolia-done")) return;
    var id = img.getAttribute("data-image-id");
    var url = table[id];
    if (typeof url !== "string" || !url.length) { console.warn("ECOLIA : image absente du JSON :", id); return; }
    img.setAttribute("data-ecolia-done", "1");
    if (!NATIVE) { img.onerror = function () { hide(img); }; img.setAttribute("src", url); return; }
    var full = abs(url), fn = "img_" + id + "." + ext(url);
    if (exists(fn)) {                                     // déjà sur l'appareil : lecture locale, sans internet
      img.onerror = function () {                         // fichier incomplet : on le supprime et on utilise le site
        try { CoursInterface["delete"](fn); } catch (e) {}
        queued[fn] = 0;
        img.onerror = function () { hide(img); };
        img.setAttribute("src", full);
      };
      img.setAttribute("src", "https://app.local/cours/" + fn);
    } else {
      img.onerror = function () { hide(img); };
      img.setAttribute("src", full);
      enqueue(full, fn);
    }
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches("img[data-image-id]")) show(root);
    root.querySelectorAll("img[data-image-id]").forEach(show);
  }
  function prefetchAll() {                                // APK : prépare TOUTES les images du cours pour le hors-ligne
    var ids = {};
    try { JSON.stringify(slides).replace(/data-image-id=\\?"([^"\\]+)/g, function (m, id) { ids[id] = 1; }); } catch (e) {}
    Object.keys(ids).forEach(function (id) {
      var url = table[id];
      if (typeof url !== "string" || !url.length) return;
      var fn = "img_" + id + "." + ext(url);
      if (!exists(fn)) enqueue(abs(url), fn);
    });
  }
  function start(tbl) {
    table = tbl;
    scan(document.body);
    new MutationObserver(function (muts) {                // les slides sont écrites à la volée : on traite chaque nouvelle image
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
    if (NATIVE) prefetchAll();
  }

  var JSON_URL = NATIVE ? SITE + "images_ecolia.json" : "images_ecolia.json";
  var KEY = "ecolia_images_json";
  fetch(JSON_URL, NATIVE ? { cache: "no-cache" } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (table) { if (NATIVE) lsSet(KEY, JSON.stringify(table)); start(table); })
    .catch(function (e) {
      var saved = null;
      if (NATIVE) { try { saved = JSON.parse(lsGet(KEY) || "null"); } catch (x) {} }
      if (saved) start(saved);                              // hors ligne dans l'APK : JSON gardé la dernière fois
      else console.warn("ECOLIA : JSON des images indisponible.", e);
    });
})();
</script>
