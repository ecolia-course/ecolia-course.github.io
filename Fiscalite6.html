    title: "Leçon 1 — Introduction à la fiscalité et aux institutions fiscales de la RDC",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À Kinshasa, un jeune commerçant ouvre sa boutique. Très vite, des agents de la DGI, de la DGRAD et de la DGDA se présentent. Chacun réclame des impôts différents. Sans comprendre le rôle de chaque institution, le commerçant risque de payer des taxes indues ou d'être en infraction. La fiscalité est la clé de la conformité.</p></div>
<h3>1. Définition et rôle de la fiscalité</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Fiscalité</strong> : ensemble des règles et procédures relatives aux impôts, taxes et redevances.</li><li><strong>Impôt</strong> : prélèvement obligatoire, sans contrepartie directe, destiné à financer les dépenses publiques.</li><li><strong>Taxe</strong> : prélèvement lié à un service rendu (ex. taxe de stationnement).</li><li><strong>Redevance</strong> : somme payée pour l'utilisation d'un service ou d'un domaine public.</li><li><strong>Fonctions de l'impôt</strong> : financer le budget de l'État, redistribuer les revenus, réguler l'économie.</li></ul></div>
<h3>2. Les trois grandes régies financières de la RDC</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>DGI</strong> (Direction Générale des Impôts) : administre les impôts directs et indirects intérieurs (IBP, IPR, TVA, impôt mobilier, IRL).</li><li><strong>DGRAD</strong> (Direction Générale des Recettes Administratives, Domaniales et de Participation) : perçoit les recettes non fiscales (redevances administratives, domaniales, judiciaires, de participation).</li><li><strong>DGDA</strong> (Direction Générale des Douanes et Accises) : perçoit les droits de douane et les accises à l'importation et à l'exportation.</li></ul></div>
<h3>3. Classification des impôts</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Impôts directs</strong> : frappent directement le revenu ou le patrimoine (IBP, IPR, IRL).</li><li><strong>Impôts indirects</strong> : frappent la dépense ou la consommation (TVA, droits d'accises, droits de douane).</li><li><strong>Impôts réels</strong> : frappent un bien (impôt foncier).</li><li><strong>Impôts personnels</strong> : tiennent compte de la situation du contribuable (IPR).</li></ul></div>
<h3>4. Le système fiscal déclaratif congolais</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Auto-liquidation</strong> : le contribuable calcule lui-même l'impôt dû, le déclare et le paie spontanément.</li><li><strong>Déclarations principales</strong> : TVA (mensuelle), IPR (mensuelle), IBP (annuelle), IRL (annuelle).</li><li><strong>Obligations du contribuable</strong> : s'immatriculer auprès de la DGI, obtenir un Numéro d'Identification Fiscale (NIF), tenir une comptabilité régulière, déposer ses déclarations dans les délais.</li><li><strong>Exemple concret</strong> : un commerçant de Kinshasa qui vend des marchandises doit s'immatriculer à la DGI, facturer la TVA à ses clients, la reverser mensuellement et déclarer son bénéfice à l'IBP.</li></ul><p><a href="https://www.youtube.com/results?search_query=fiscalité+RDC+institutions+fiscales+DGI+DGRAD+DGDA" target="_blank" rel="noopener">🎥 Recherche : introduction à la fiscalité congolaise (chaînes de cours de fiscalité)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La fiscalité regroupe l'ensemble des règles relatives aux impôts. Trois régies se partagent la collecte en RDC : DGI (impôts intérieurs), DGRAD (recettes non fiscales), DGDA (douanes et accises). Le système fiscal congolais repose sur l'auto-liquidation et des déclarations périodiques.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel de Fiscalité pour la 4ème Année Commerciale et Gestion (manuels-scolaires-rdc.com, 2025) ; Fiches pédagogiques officielles — Cours de Fiscalité, 4e CG (manuels-scolaires-rdc.com, 2026).<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, DGI, DGRAD, DGDA, IBP, IPR, TVA, IRL, NIF.</div>
    `

{
    title: "Leçon 2 — La procédure déclarative et le contrôle fiscal (DGI)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À la DGI de Kinshasa, un agent vérifie la déclaration de TVA d'une PME. Le contribuable a omis de déclarer une partie de son chiffre d'affaires. La procédure de contrôle se déclenche. Comprendre les étapes du contrôle permet d'éviter les sanctions et de préparer sereinement un éventuel contrôle.</p></div>
<h3>1. La procédure déclarative</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Auto-liquidation</strong> : le contribuable calcule et déclare lui-même son impôt.</li><li><strong>Déclarations périodiques</strong> : TVA et IPR (mensuelles), IBP et IRL (annuelles).</li><li><strong>Supports de déclaration</strong> : formulaires officiels DGI, télédéclaration, dépôt physique.</li><li><strong>Délais légaux</strong> : TVA et IPR au plus tard le 15 du mois suivant ; IBP avant le 30 avril de l'année suivante.</li><li><strong>Sanctions de retard</strong> : amendes, pénalités, intérêts de retard.</li></ul></div>
<h3>2. Le contrôle fiscal</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Objet</strong> : vérifier la sincérité des déclarations et l'exactitude des impôts payés.</li><li><strong>Types de contrôle</strong> : contrôle sur pièces (bureau), vérification de comptabilité (sur place), contrôle ponctuel.</li><li><strong>Déroulement</strong> : notification de contrôle, présentation des documents, analyse, proposition de redressement, discussion, décision.</li><li><strong>Droits du contribuable</strong> : être informé, se faire assister, présenter des observations, contester.</li></ul></div>
<h3>3. Le recouvrement forcé</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Recouvrement forcé</strong> : mise en œuvre de moyens contraignants pour obtenir le paiement des impôts dus.</li><li><strong>Moyens</strong> : avis à tiers détenteur (ATD), saisie mobilière, saisie immobilière, fermeture provisoire de l'établissement, apposition de scellés.</li><li><strong>Conditions</strong> : après mise en demeure restée sans effet.</li><li><strong>Garanties</strong> : le contribuable peut contester, demander un sursis, saisir le juge.</li></ul></div>
<h3>4. Le contentieux fiscal</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Contentieux fiscal</strong> : litige entre le contribuable et l'administration fiscale.</li><li><strong>Voies de recours</strong> : réclamation préalable auprès du Directeur Général des Impôts, recours devant le tribunal de grande instance, appel.</li><li><strong>Délai</strong> : 30 jours pour contester un acte de poursuite devant le tribunal.</li><li><strong>Exemple concret</strong> : un commerçant de Lubumbashi conteste une taxation d'office pour un chiffre d'affaires qu'il estime erroné. Il peut introduire une réclamation auprès de la DGI, puis saisir le tribunal compétent si sa réclamation est rejetée.</li></ul><p><a href="https://www.youtube.com/results?search_query=contrôle+fiscal+RDC+procédure+contentieux" target="_blank" rel="noopener">🎥 Recherche : la procédure de contrôle fiscal (chaînes de cours de fiscalité)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La procédure déclarative repose sur l'auto-liquidation. Le contrôle fiscal vérifie la sincérité des déclarations. Le recouvrement forcé utilise des moyens contraignants (ATD, saisies). Le contentieux fiscal permet au contribuable de contester par voie de réclamation puis par voie judiciaire.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel de Fiscalité 4e CG (manuels-scolaires-rdc.com, 2025) ; Fiches pédagogiques officielles — Cours de Fiscalité, 4e CG (manuels-scolaires-rdc.com, 2026).</div>
    `
},
{
    title: "Leçon 3 — L'Impôt sur les Bénéfices et Profits (IBP)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une entreprise de Kinshasa a réalisé un bénéfice de 50 000 000 FC pour l'exercice 2025. Le comptable doit calculer l'IBP et déposer la déclaration avant le 30 avril 2026. Sans cette déclaration, l'entreprise risque des pénalités.</p></div>
<h3>1. Définition et champ d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>IBP</strong> : Impôt sur les Bénéfices et Profits. Il frappe les bénéfices de toutes les entreprises industrielles, commerciales, artisanales, agricoles ou immobilières.</li><li><strong>Champ d'application</strong> : bénéfices des entreprises, profits des professions libérales, rémunérations des associés non-actifs.</li><li><strong>Territorialité</strong> : imposable en RDC si l'entreprise y exerce son activité ou y réalise des bénéfices.</li><li><strong>Taux</strong> : 30 % pour la plupart des entreprises ; 40 % pour les entreprises minières ; 20 % pour les micro-entreprises.</li></ul></div>
<h3>2. Calcul de l'IBP</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Étapes</strong> : résultat comptable → retraitements fiscaux → résultat fiscal → application du taux.</li><li><strong>Retraitements</strong> : réintégration des charges non déductibles, déduction des produits non imposables.</li><li><strong>Acomptes provisionnels</strong> : versements trimestriels ou mensuels.</li><li><strong>Déclaration annuelle</strong> : avant le 30 avril de l'année suivant l'exercice.</li></ul></div>
<h3>3. Exemple de calcul</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Une entreprise commerciale de Kinshasa réalise un bénéfice net comptable de 50 000 000 FC. Retraitements : amendes fiscales non déductibles 2 000 000 FC ; produits exceptionnels non imposables 3 000 000 FC. Résultat fiscal = 50 000 000 + 2 000 000 − 3 000 000 = 49 000 000 FC. IBP dû = 49 000 000 × 30 % = <strong>14 700 000 FC</strong>.</p><p><a href="https://www.youtube.com/results?search_query=IBP+RDC+calcul+impôt+bénéfices+profits" target="_blank" rel="noopener">🎥 Recherche : l'Impôt sur les Bénéfices et Profits (chaînes de cours de fiscalité)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'IBP frappe les bénéfices des entreprises et les profits des professions libérales. Le taux est de 30 % (général), 40 % (mines) et 20 % (micro-entreprises). Le calcul part du résultat comptable, applique les retraitements fiscaux, puis applique le taux. La déclaration annuelle est due avant le 30 avril.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel de Fiscalité 4e CG (manuels-scolaires-rdc.com, 2025) ; DGI — Impôt sur les bénéfices et profits (dgi.gouv.cd).</div>
    `

    title: "Leçon 4 — L'Impôt Professionnel sur les Rémunérations (IPR)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Au service paie d'une entreprise télécom de Kinshasa, le gestionnaire doit calculer l'IPR de chaque salarié. Le barème est progressif par tranches. Une erreur de calcul expose l'entreprise à des redressements. La maîtrise de l'IPR est essentielle pour tout gestionnaire de paie.</p></div>
<h3>1. Définition et champ d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>IPR</strong> : Impôt Professionnel sur les Rémunérations. Il frappe les revenus professionnels des personnes physiques : salaires, traitements, indemnités, primes, avantages en nature, pensions.</li><li><strong>Retenue à la source</strong> : l'employeur retient l'IPR sur le salaire et le reverse à la DGI.</li><li><strong>Déclaration mensuelle</strong> : au plus tard le 15 du mois suivant.</li><li><strong>Champ d'application</strong> : secteur privé, secteur public, diplomates, expatriés (IERE).</li></ul></div>
<h3>2. Le barème progressif par tranches</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>0 %</strong> : de 0 à 524 160 FC (tranche exonérée).</li><li><strong>15 %</strong> : de 524 161 à 1 428 000 FC.</li><li><strong>20 %</strong> : de 1 428 001 à 2 700 000 FC.</li><li><strong>22,5 %</strong> : de 2 700 001 à 4 620 000 FC.</li><li><strong>25 %</strong> : de 4 620 001 à 7 200 000 FC.</li><li><strong>30 %</strong> : au-delà de 7 200 000 FC.</li><li><strong>Plafond</strong> : l'IPR total ne peut dépasser 30 % du salaire imposable.</li></ul></div>
<h3>3. Calcul de l'IPR</h3>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'IPR frappe les revenus professionnels des personnes physiques. Il est retenu à la source par l'employeur et reversé mensuellement à la DGI. Le barème est progressif par tranches, de 0 % à 30 %, avec un plafond de 30 % du salaire imposable.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel de Fiscalité 4e CG (manuels-scolaires-rdc.com, 2025) ; DGI — Barème IPR (dgi.gouv.cd).</div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>TVA</strong> : Taxe sur la Valeur Ajoutée. Impôt indirect qui frappe la consommation finale.</li><li><strong>Mécanisme</strong> : l'entreprise facture la TVA sur ses ventes (TVA collectée), déduit la TVA sur ses achats (TVA déductible), et reverse la différence à la DGI.</li><li><strong>Redevable final</strong> : le consommateur.</li><li><strong>Collecteur</strong> : l'entreprise assujettie.</li><li><strong>Taux</strong> : 16 % (taux normal), 8 % (taux réduit pour produits de première nécessité et billets d'avion nationaux), 0 % (exportations).</li></ul></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Immatriculation</strong> : obligatoire si le chiffre d'affaires annuel atteint 80 000 000 FC.</li><li><strong>Facturation</strong> : émettre une facture pour chaque vente.</li><li><strong>Déclaration mensuelle</strong> : au plus tard le 15 du mois suivant.</li><li><strong>Paiement</strong> : reversement de la TVA nette due.</li><li><strong>Comptabilité</strong> : tenir un registre des factures d'achat et de vente.</li></ul></div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La TVA est un impôt indirect sur la consommation, collecté par l'entreprise et supporté par le consommateur. Taux : 16 % (normal), 8 % (réduit), 0 % (exportations). L'entreprise facture la TVA, déduit celle sur ses achats et reverse la différence. Déclaration mensuelle avant le 15.</p></div>

<h3>2. L'Impôt Exceptionnel sur les Rémunérations des Expatriés (IERE)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>IERE</strong> : frappe les rémunérations versées au personnel expatrié.</li><li><strong>Taux</strong> : 25 % des rémunérations brutes.</li><li><strong>Redevable</strong> : l'employeur.</li><li><strong>Déclaration mensuelle</strong> : au plus tard le 15 du mois suivant.</li><li><strong>Contexte</strong> : les sociétés minières du Katanga emploient de nombreux expatriés.</li></ul></div>
<h3>3. L'impôt mobilier et la patente</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Impôt mobilier</strong> : frappe les revenus de capitaux mobiliers (dividendes, intérêts).</li><li><strong>Taux</strong> : 20 % généralement.</li><li><strong>Patente</strong> : taxe professionnelle annuelle due par toute personne exerçant une activité économique.</li><li><strong>Base</strong> : chiffre d'affaires ou catégorie d'activité.</li><li><strong>Perception</strong> : par les entités territoriales décentralisées (villes, communes).</li></ul></div>
<h3>4. Exemple de calcul de l'IRL</h3>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'IRL frappe les revenus locatifs (20 %). L'IERE frappe les rémunérations des expatriés (25 %). L'impôt mobilier frappe les revenus de capitaux mobiliers (20 %). La patente est une taxe professionnelle annuelle perçue par les entités locales.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel de Fiscalité 4e CG (manuels-scolaires-rdc.com, 2025) ; Fiches pédagogiques — Fiscalité, 4e CG.</div>

<h3>1. La DGDA et ses missions</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>DGDA</strong> : Direction Générale des Douanes et Accises.</li><li><strong>Missions</strong> : percevoir les droits de douane et les accises à l'importation et à l'exportation, contrôler les flux de marchandises, lutter contre la fraude.</li><li><strong>Territoire</strong> : les ports (Boma, Matadi), les postes frontaliers (Kasumbalesa, Goma), les aéroports (Ndjili).</li><li><strong>Code des douanes</strong> : cadre légal des procédures.</li></ul></div>

<h3>2. La réclamation préalable</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Délai</strong> : dans les 90 jours suivant la notification de l'impôt ou de l'acte contesté.</li><li><strong>Forme</strong> : lettre motivée adressée au Directeur Général des Impôts.</li><li><strong>Contenu</strong> : identification du contribuable, référence de l'acte contesté, motifs de la contestation, demande de décharge ou de réduction.</li><li><strong>Effet</strong> : suspend l'exécution de l'impôt contesté (sauf en cas de recouvrement forcé).</li></ul></div>

questions.forEach(function(q) {
    if (!q.text) {
        q.text = q.question || q.q || q.enonce || q.titre || "";
    }
    if (typeof q.correct === 'undefined') {
        if (typeof q.answer !== 'undefined') q.correct = q.answer;
        else if (typeof q.reponse !== 'undefined') q.correct = q.reponse;
    }
});

let currentSlide = 0;
let lastSearchTerm = "", searchResults = [], currentResultIdx = -1;
const contentDiv = document.getElementById('content');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const slideCounterSpan = document.getElementById('slideCounter');
const progressFill = document.getElementById('progressFill');
const counterSpan = document.getElementById('counter');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchNav = document.getElementById('searchNav');
const prevResultBtn = document.getElementById('prevResultBtn');
const nextResultBtn = document.getElementById('nextResultBtn');
const resultCounterSpan = document.getElementById('resultCounter');
const pageTitle = document.getElementById('pageTitle');
pageTitle.textContent = "ECOLIA · " + COURSE_TITLE;
document.title = "ECOLIA — " + COURSE_TITLE;
function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';
    slideCounterSpan.textContent = '0/0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>

<script>
(function () {
  var SITE = "https://ecolia-course.github.io/";
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface", page servie par https://app.local
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function abs(u) { return /^(https?:|data:|blob:)/i.test(u) ? u : (NATIVE ? SITE + u.replace(/^(\.\/|\/)+/, "") : u); }
  function ext(u) { var m = String(u).split("?")[0].match(/\.(jpe?g|png|gif|webp|svg)$/i); return m ? m[1].toLowerCase() : "jpg"; }
  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {
    if (queued[fn]) return;
    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
    if (!queue.length) { running = false; return; }
    if (!navigator.onLine) { running = false; return; }
    var q = queue.shift(), t0 = Date.now();
    try { CoursInterface.download(q[0], q[1]); } catch (e) { return setTimeout(next, 500); }
    (function wait() {
      var ok = false;
      try { ok = !!CoursInterface.exists(q[1]); } catch (e) {}
      if (ok) setTimeout(next, 1500);
      else if (Date.now() - t0 > 40000) next();
      else setTimeout(wait, 700);
    })();
  }
  function exists(fn) { try { return !!CoursInterface.exists(fn); } catch (e) { return false; } }

  function show(img) {                                    // affiche UNE image (appelé à chaque slide affichée)
    if (!table || img.getAttribute("data-ecolia-done")) return;
    var id = img.getAttribute("data-image-id");
    var url = table[id];
    if (typeof url !== "string" || !url.length) { console.warn("ECOLIA : image absente du JSON :", id); return; }
    img.setAttribute("data-ecolia-done", "1");
    if (!NATIVE) { img.onerror = function () { hide(img); }; img.setAttribute("src", url); return; }
    var full = abs(url), fn = "img_" + id + "." + ext(url);
    if (exists(fn)) {                                     // déjà sur l'appareil : lecture locale, sans internet
      img.onerror = function () {                         // fichier incomplet : on le supprime et on utilise le site
        try { CoursInterface["delete"](fn); } catch (e) {}
        queued[fn] = 0;
        img.onerror = function () { hide(img); };
        img.setAttribute("src", full);
      };
      img.setAttribute("src", "https://app.local/cours/" + fn);
    } else {
      img.onerror = function () { hide(img); };
      img.setAttribute("src", full);
      enqueue(full, fn);
    }
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches("img[data-image-id]")) show(root);
    root.querySelectorAll("img[data-image-id]").forEach(show);
  }
  function prefetchAll() {                                // APK : prépare TOUTES les images du cours pour le hors-ligne
    var ids = {};
    try { JSON.stringify(slides).replace(/data-image-id=\\?"([^"\\]+)/g, function (m, id) { ids[id] = 1; }); } catch (e) {}
    Object.keys(ids).forEach(function (id) {
      var url = table[id];
      if (typeof url !== "string" || !url.length) return;
      var fn = "img_" + id + "." + ext(url);
      if (!exists(fn)) enqueue(abs(url), fn);
    });
  }
  function start(tbl) {
    table = tbl;
    scan(document.body);
    new MutationObserver(function (muts) {                // les slides sont écrites à la volée : on traite chaque nouvelle image
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
    if (NATIVE) prefetchAll();
  }

  var JSON_URL = NATIVE ? SITE + "images_ecolia.json" : "images_ecolia.json";
  var KEY = "ecolia_images_json";
  fetch(JSON_URL, NATIVE ? { cache: "no-cache" } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (table) { if (NATIVE) lsSet(KEY, JSON.stringify(table)); start(table); })
    .catch(function (e) {
      var saved = null;
      if (NATIVE) { try { saved = JSON.parse(lsGet(KEY) || "null"); } catch (x) {} }
      if (saved) start(saved);                              // hors ligne dans l'APK : JSON gardé la dernière fois
      else console.warn("ECOLIA : JSON des images indisponible.", e);
    });
})();
</script>
