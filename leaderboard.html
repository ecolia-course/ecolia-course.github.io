<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Classement - ECOLIA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(160deg, #1a3a2a 0%, #0d1f14 100%);
            color: #e8f5e9;
            min-height: 100vh;
        }

        .app-container {
            max-width: 500px;
            min-height: 100vh;
            margin: 0 auto;
            background: rgba(13, 31, 20, 0.95);
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.3);
        }

        .header {
            position: sticky;
            top: 0;
            padding: 15px 20px;
            background: rgba(26, 58, 42, 0.98);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid #ffd54f;
        }

        .back-btn {
            background: rgba(76, 175, 80, 0.2);
            border: none;
            color: #a5d6a7;
            font-size: 1.2rem;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }

        .main-content {
            padding: 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .page-title h1 {
            color: #ffd54f;
            font-size: 1.6rem;
        }

        .page-title p {
            color: #a5d6a7;
            font-size: 0.85rem;
        }

        /* Podium */
        .podium {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
            margin-bottom: 30px;
            padding: 10px;
        }

        .podium-item {
            text-align: center;
            flex: 1;
        }

        .podium-medal {
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .podium-name {
            font-weight: bold;
            margin-top: 8px;
            font-size: 0.85rem;
        }

        .podium-chapitres {
            font-size: 0.75rem;
            color: #a5d6a7;
        }

        .podium-first {
            order: 2;
        }
        .podium-first .podium-bar {
            background: linear-gradient(180deg, #ffd700, #ffb347);
            height: 80px;
        }
        .podium-second {
            order: 1;
        }
        .podium-second .podium-bar {
            background: linear-gradient(180deg, #c0c0c0, #a0a0a0);
            height: 60px;
        }
        .podium-third {
            order: 3;
        }
        .podium-third .podium-bar {
            background: linear-gradient(180deg, #cd7f32, #b87333);
            height: 45px;
        }

        .podium-bar {
            width: 60px;
            margin: 0 auto;
            border-radius: 12px 12px 0 0;
            transition: height 0.3s;
        }

        /* Tableau du classement */
        .leaderboard-table {
            background: rgba(76, 175, 80, 0.05);
            border-radius: 16px;
            overflow: hidden;
        }

        .leaderboard-header {
            display: flex;
            background: rgba(76, 175, 80, 0.15);
            padding: 12px 15px;
            font-weight: bold;
            color: #ffd54f;
            font-size: 0.85rem;
        }

        .leaderboard-row {
            display: flex;
            padding: 12px 15px;
            border-bottom: 1px solid rgba(76, 175, 80, 0.1);
            transition: background 0.2s;
        }

        .leaderboard-row:hover {
            background: rgba(76, 175, 80, 0.08);
        }

        .leaderboard-row.current-user {
            background: rgba(76, 175, 80, 0.2);
            border-left: 3px solid #ffd54f;
        }

        .rank {
            width: 50px;
            font-weight: bold;
            color: #ffd54f;
        }

        .user-info {
            flex: 1;
        }

        .user-email {
            font-size: 0.85rem;
            word-break: break-all;
        }

        .chapitres-count {
            width: 80px;
            text-align: right;
            font-weight: bold;
            color: #c8e6c9;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #a5d6a7;
        }

        .loading {
            text-align: center;
            padding: 50px 20px;
        }

        .redirect-msg {
            text-align: center;
            padding: 50px 20px;
        }

        .redirect-msg a {
            color: #4caf50;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="index.html" class="back-btn">← Retour</a>
            <div>
                <h2 style="color:#c8e6c9;font-size:1.1rem;">🏆 Classement</h2>
            </div>
        </div>

        <div id="content">
            <div class="loading">⏳ Chargement du classement...</div>
        </div>
    </div>

    <script type="module">
        import { auth, db, onAuthStateChanged } from "./firebase-init.js";
        import { collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        async function chargerClassement() {
            const container = document.getElementById('content');
            
            try {
                // Récupérer les utilisateurs triés par nombre de chapitres (descendant)
                const q = query(collection(db, "utilisateurs"), orderBy("stats.totalChapitres", "desc"), limit(100));
                const querySnapshot = await getDocs(q);
                
                const utilisateurs = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    utilisateurs.push({
                        id: doc.id,
                        email: data.email || "Anonyme",
                        totalChapitres: data.stats?.totalChapitres || 0
                    });
                });
                
                if (utilisateurs.length === 0) {
                    container.innerHTML = '<div class="empty-state">📭 Aucun élève inscrit pour le moment.</div>';
                    return;
                }
                
                const currentUser = auth.currentUser;
                const currentUserEmail = currentUser?.email || "";
                
                // Extraire le top 3 pour le podium
                const top3 = utilisateurs.slice(0, 3);
                
                // Fonction pour obtenir l'emoji du rang
                function getRankEmoji(rank) {
                    if (rank === 1) return "🥇";
                    if (rank === 2) return "🥈";
                    if (rank === 3) return "🥉";
                    return "📌";
                }
                
                // Calculer les hauteurs relatives pour le podium (max 80px)
                const maxChapitres = top3[0]?.totalChapitres || 1;
                
                // Générer le podium
                let podiumHtml = '';
                if (top3.length >= 1) {
                    podiumHtml = `
                        <div class="podium">
                            ${top3[1] ? `
                            <div class="podium-item podium-second">
                                <div class="podium-medal">🥈</div>
                                <div class="podium-bar" style="height: ${Math.max(30, (top3[1].totalChapitres / maxChapitres) * 60)}px"></div>
                                <div class="podium-name">${top3[1].email.split('@')[0]}</div>
                                <div class="podium-chapitres">${top3[1].totalChapitres} chap.</div>
                            </div>
                            ` : ''}
                            ${top3[0] ? `
                            <div class="podium-item podium-first">
                                <div class="podium-medal">🥇</div>
                                <div class="podium-bar" style="height: ${Math.max(40, (top3[0].totalChapitres / maxChapitres) * 80)}px"></div>
                                <div class="podium-name">${top3[0].email.split('@')[0]}</div>
                                <div class="podium-chapitres">${top3[0].totalChapitres} chap.</div>
                            </div>
                            ` : ''}
                            ${top3[2] ? `
                            <div class="podium-item podium-third">
                                <div class="podium-medal">🥉</div>
                                <div class="podium-bar" style="height: ${Math.max(25, (top3[2].totalChapitres / maxChapitres) * 45)}px"></div>
                                <div class="podium-name">${top3[2].email.split('@')[0]}</div>
                                <div class="podium-chapitres">${top3[2].totalChapitres} chap.</div>
                            </div>
                            ` : ''}
                        </div>
                    `;
                }
                
                // Générer le tableau complet
                let tableRows = '';
                utilisateurs.forEach((user, index) => {
                    const rank = index + 1;
                    const isCurrentUser = user.email === currentUserEmail;
                    tableRows += `
                        <div class="leaderboard-row ${isCurrentUser ? 'current-user' : ''}">
                            <div class="rank">${getRankEmoji(rank)} ${rank}</div>
                            <div class="user-info">
                                <div class="user-email">${user.email.split('@')[0]}${isCurrentUser ? ' (vous)' : ''}</div>
                            </div>
                            <div class="chapitres-count">${user.totalChapitres} chap.</div>
                        </div>
                    `;
                });
                
                const html = `
                    <div class="main-content">
                        <div class="page-title">
                            <h1>🏆 Classement des élèves</h1>
                            <p>Basé sur le nombre de chapitres terminés</p>
                        </div>
                        ${podiumHtml}
                        <div class="leaderboard-table">
                            <div class="leaderboard-header">
                                <div class="rank">Rang</div>
                                <div class="user-info">Élève</div>
                                <div class="chapitres-count">Chapitres</div>
                            </div>
                            ${tableRows}
                        </div>
                    </div>
                `;
                
                container.innerHTML = html;
                
            } catch (error) {
                console.error("Erreur classement:", error);
                container.innerHTML = '<div class="empty-state">❌ Erreur lors du chargement du classement. Réessaie plus tard.</div>';
            }
        }
        
        // Vérifier la connexion
        onAuthStateChanged(auth, (user) => {
            const container = document.getElementById('content');
            if (!user) {
                container.innerHTML = `
                    <div class="redirect-msg">
                        🔐 Veuillez vous <a href="index.html" style="color:#4caf50">connecter</a> pour voir le classement.
                    </div>
                `;
                return;
            }
            chargerClassement();
        });
    </script>
</body>
</html>
