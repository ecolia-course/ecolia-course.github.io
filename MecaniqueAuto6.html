const COURSE_TITLE = "Mécanique automobile · 4e secondaire";
const slides = [
{
    title: "Mécanique automobile — 4e secondaire — Sommaire général",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours prépare l'EXETAT (4e secondaire). Il comprend 9 leçons, suivies d'un quiz de révision.</p>

</ul>
</div>

},
{
    title: "Leçon 1 — Les organes du moteur à explosion",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un garage de Kinshasa, un mécanicien démonte un moteur de voiture. Il identifie les pistons, la culasse, le vilebrequin, les soupapes. Comprendre le moteur est la base du métier.</p></div>
<h3>1. Les organes fixes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Bloc-moteur</strong> : partie centrale, contient les cylindres.</li><li><strong>Culasse</strong> : ferme le haut des cylindres.</li><li><strong>Carter</strong> : réserve d'huile, ferme le bas.</li><li><strong>Joint de culasse</strong> : assure l'étanchéité.</li></ul></div>
<h3>2. Les organes mobiles</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Piston</strong> : coulisse dans le cylindre.</li><li><strong>Bielle</strong> : relie le piston au vilebrequin.</li><li><strong>Vilebrequin</strong> : transforme le mouvement linéaire en rotation.</li><li><strong>Volant moteur</strong> : régularise la rotation.</li><li><strong>Arbre à cames</strong> : commande les soupapes.</li><li><strong>Soupapes</strong> : admission et échappement.</li></ul></div>
<h3>3. Les systèmes annexes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Lubrification</strong> : huile, pompe, filtre.</li><li><strong>Refroidissement</strong> : eau, radiateur, pompe, thermostat.</li><li><strong>Alimentation</strong> : carburant, pompe, filtre.</li><li><strong>Allumage</strong> : bougies, bobine (moteur essence).</li><li><strong>Distribution</strong> : courroie ou chaîne.</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><strong>Moteur 4 temps</strong></p><ul><li>Admission : le piston descend, soupape d'admission ouverte.</li><li>Compression : le piston monte, soupapes fermées.</li><li>Combustion : explosion, piston poussé vers le bas.</li><li>Échappement : le piston remonte, soupape d'échappement ouverte.</li></ul><p><a href="https://www.youtube.com/results?search_query=moteur+explosion+organes+4+temps" target="_blank" rel="noopener">🎥 Recherche : les organes du moteur</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le moteur comprend des organes fixes (bloc, culasse, carter), mobiles (piston, bielle, vilebrequin, arbre à cames) et des systèmes annexes (lubrification, refroidissement, alimentation, allumage).</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Technologie Automobile 4e Technique (manuels-scolaires-rdc.com, 2025).<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT.</div>
`
},
{
    title: "Leçon 2 — Le circuit de lubrification",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un moteur sans huile chauffe et se grippe. Le circuit de lubrification est vital. Il réduit les frottements, refroidit, nettoie et protège contre la corrosion.</p></div>
<h3>1. Rôle de la lubrification</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Réduire les frottements</strong> entre les pièces.</li><li><strong>Refroidir</strong> les zones chaudes.</li><li><strong>Nettoyer</strong> les impuretés.</li><li><strong>Protéger</strong> contre la corrosion.</li><li><strong>Étanchéifier</strong> les jeux.</li></ul></div>
<h3>2. Les organes du circuit</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Carter</strong> : réserve d'huile.</li><li><strong>Crépine</strong> : filtre grossier.</li><li><strong>Pompe à huile</strong> : met l'huile sous pression.</li><li><strong>Filtre à huile</strong> : retient les impuretés.</li><li><strong>Manocontact</strong> : témoin de pression au tableau de bord.</li><li><strong>Jauge</strong> : niveau d'huile.</li></ul></div>
<h3>3. Types d'huile</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Huile minérale</strong> : basique.</li><li><strong>Huile synthétique</strong> : performante.</li><li><strong>Huile semi-synthétique</strong> : intermédiaire.</li><li><strong>Viscosité</strong> : 5W40, 10W40, 15W40 (indice SAE).</li><li><strong>Changement</strong> : tous les 5 000 à 15 000 km selon l'huile.</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Vidange</strong> : chauffer le moteur, vidanger, remplacer le filtre, remplir d'huile neuve, vérifier le niveau.</li><li><strong>Contrôle du niveau</strong> : moteur froid, jauge entre min et max.</li><li><strong>Témoin d'huile allumé</strong> : manque de pression → arrêt immédiat du moteur.</li></ul><p><a href="https://www.youtube.com/results?search_query=lubrification+moteur+huile+vidange" target="_blank" rel="noopener">🎥 Recherche : le circuit de lubrification</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le circuit de lubrification comprend carter, pompe, filtre, manocontact, jauge. Il réduit les frottements, refroidit, nettoie, protège. Le changement d'huile se fait tous les 5 000 à 15 000 km.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Technologie Automobile 4e Technique (2025).</div>
`
},
{
    title: "Leçon 3 — Le circuit de refroidissement",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une voiture chauffe en pleine circulation à Kinshasa. Le voyant de température s'allume. Le moteur risque la surchauffe. Le circuit de refroidissement régule la température.</p></div>
<h3>1. Rôle du refroidissement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Maintenir</strong> la température optimale du moteur (85-95 °C).</li><li><strong>Évacuer</strong> la chaleur produite par la combustion.</li><li><strong>Éviter</strong> la surchauffe et la casse.</li><li><strong>Réchauffer</strong> rapidement le moteur au démarrage.</li></ul></div>
<h3>2. Les organes du circuit</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Radiateur</strong> : échangeur de chaleur.</li><li><strong>Pompe à eau</strong> : fait circuler le liquide.</li><li><strong>Thermostat</strong> : régule la circulation.</li><li><strong>Ventilateur</strong> : force l'air à travers le radiateur.</li><li><strong>Vase d'expansion</strong> : réserve de liquide.</li><li><strong>Durites</strong> : conduites.</li><li><strong>Liquide de refroidissement</strong> : eau + antigel.</li></ul></div>
<h3>3. Le liquide de refroidissement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Eau</strong> : insuffisante seule (gel, corrosion).</li><li><strong>Antigel</strong> : abaisse le point de congélation, élève le point d'ébullition.</li><li><strong>Mélange</strong> : 50 % eau + 50 % antigel.</li><li><strong>Contrôle</strong> : niveau entre min et max, moteur froid.</li><li><strong>Vidange</strong> : tous les 2 à 5 ans.</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><strong>Panne de refroidissement</strong></p><ul><li>Symptôme : température élevée, voyant allumé.</li><li>Cause possible : fuite, thermostat bloqué, ventilateur en panne.</li><li>Conduite à tenir : s'arrêter, laisser refroidir, ne pas ouvrir le bouchon à chaud, vérifier le niveau.</li></ul><p><a href="https://www.youtube.com/results?search_query=refroidissement+moteur+radiateur+thermostat" target="_blank" rel="noopener">🎥 Recherche : le circuit de refroidissement</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le circuit de refroidissement maintient la température du moteur. Il comprend radiateur, pompe, thermostat, ventilateur, vase d'expansion, durites. Le liquide est un mélange eau + antigel.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Technologie Automobile 4e Technique (2025).</div>
`
},
{
    title: "Leçon 4 — Le circuit d'alimentation en carburant",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une voiture cale en pleine route. Le mécanicien vérifie : pompe à essence, filtre, carburateur ou injection. Le circuit d'alimentation est en cause. Il faut le diagnostiquer.</p></div>
<h3>1. Les types d'alimentation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Carburateur</strong> : ancien système, mélange air-essence.</li><li><strong>Injection indirecte</strong> : injecteurs dans le collecteur d'admission.</li><li><strong>Injection directe</strong> : injecteurs dans la chambre de combustion.</li><li><strong>Diesel</strong> : injection haute pression.</li></ul></div>
<h3>2. Les organes du circuit</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Réservoir</strong> : stockage du carburant.</li><li><strong>Pompe à carburant</strong> : envoie le carburant.</li><li><strong>Filtre à carburant</strong> : retient les impuretés.</li><li><strong>Carburateur ou injecteurs</strong> : dosage du carburant.</li><li><strong>Pompe d'accélération</strong> : pour les reprises.</li><li><strong>Filtre à air</strong> : purifie l'air admis.</li></ul></div>
<h3>3. Le diagnostic des pannes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Le moteur ne démarre pas</strong> : pompe, filtre bouché, absence d'allumage.</li><li><strong>Le moteur cale</strong> : carburateur sale, injecteurs encrassés.</li><li><strong>Consommation excessive</strong> : richesse trop élevée, filtre à air bouché.</li><li><strong>Ratés d'allumage</strong> : bougies, injecteurs.</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Vidange du filtre</strong> : tous les 20 000 à 30 000 km.</li><li><strong>Nettoyage des injecteurs</strong> : tous les 30 000 km.</li><li><strong>Contrôle du filtre à air</strong> : tous les 10 000 km.</li><li><strong>Diagnostic électronique</strong> : avec une valise de diagnostic.</li></ul><p><a href="https://www.youtube.com/results?search_query=alimentation+carburant+injection+filtre" target="_blank" rel="noopener">🎥 Recherche : le circuit d'alimentation</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le circuit d'alimentation comprend réservoir, pompe, filtre, carburateur ou injecteurs, filtre à air. Les types : carburateur, injection indirecte, injection directe, diesel. Le diagnostic identifie les pannes.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Technologie Automobile 4e Technique (2025).</div>
`
},
{
    title: "Leçon 5 — Le circuit d'allumage",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une voiture essence ne démarre pas. Le mécanicien vérifie les bougies, la bobine, la batterie. Le circuit d'allumage produit l'étincelle qui enflamme le mélange.</p></div>
<h3>1. Rôle de l'allumage</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Produire</strong> l'étincelle électrique.</li><li><strong>Enflammer</strong> le mélange air-essence.</li><li><strong>Au bon moment</strong> : juste avant la fin de la compression.</li><li><strong>Au bon endroit</strong> : dans la chambre de combustion.</li></ul></div>
<h3>2. Les organes du circuit</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Batterie</strong> : fournit le courant.</li><li><strong>Bobine</strong> : transforme le 12 V en 20 000 V.</li><li><strong>Allumeur</strong> : distribue le courant (moteur ancien).</li><li><strong>Bougies</strong> : produisent l'étincelle.</li><li><strong>Faisceau d'allumage</strong> : câbles HT.</li><li><strong>Capteur PMH</strong> : repère la position du vilebrequin.</li><li><strong>Calculateur</strong> : gère l'allumage (moteur moderne).</li></ul></div>
<h3>3. Les bougies</h3>

function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });

function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {

        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';

    questions.forEach((q, i) => {

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }

    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;

function goToResult(idx) {

function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }

  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {

    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
