<div class="sources"><strong>Sources :</strong> Programme national de Latin (EDIDEPS, 2007), Manuel de Latin 1ère année (2025). Wikimedia Commons (fiches des images).</div>

{
    title: "Leçon 1 — Pourquoi apprendre le latin ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Le latin n'est plus parlé couramment. Pourquoi l'étudier encore aujourd'hui ? Que peut-il apporter à un élève congolais ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre l'intérêt du latin. Situer le latin parmi les langues. Distinguer latin classique et latin vulgaire. Prérequis : aucun.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le latin est la langue de la Rome antique. Il est à l'origine des langues romanes (français, espagnol, italien, portugais, roumain).</p>
<p><strong>Pourquoi l'apprendre ?</strong></p>
<ul>
<li>Comprendre le français : la grammaire latine éclaire la grammaire française.</li>
<li>Enrichir son vocabulaire : de nombreux mots français viennent du latin (mater → mère).</li>
<li>Comprendre le droit et les institutions (le droit romain est à la base de nombreux systèmes juridiques).</li>
<li>Former l'esprit logique : la rigueur du latin entraîne à l'analyse.</li>
</ul>
</div>
<img src="images/Latin1_1.jpg" alt="Carte de l'Empire romain" data-image-id="Latin1_1" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Le latin s'apprend par la pratique : lire, prononcer, décliner, conjuguer, traduire. La méthode est inductive : on observe d'abord des exemples, puis on formule la règle.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Le mot français « agriculture » vient du latin <em>ager</em> (champ) et <em>cultura</em> (culture). En RDC, le droit coutumier et le droit moderne utilisent des notions héritées du droit romain.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite deux raisons d'apprendre le latin.</p>
<details><summary>Corrigé</summary>
<p>Comprendre le français et enrichir son vocabulaire ; comprendre le droit et les institutions.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le latin est une langue ancienne mais vivante par son héritage ; il aide à comprendre le français, le droit et l'histoire.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Latin (EDIDEPS).</div>
    `
},
{
    title: "Leçon 2 — L'alphabet, la prononciation et l'accentuation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment prononce-t-on Caesar, Cicero, puella ? Le latin se prononce-t-il comme le français ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Connaître l'alphabet latin. Prononcer correctement les lettres et les groupes de lettres. Placer l'accent tonique.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'alphabet latin compte <strong>23 lettres</strong> (le J et le W n'existent pas en latin classique).</p>
<p><strong>Prononciation restituée :</strong></p>
<ul>
<li><strong>C</strong> se prononce toujours [k] : Cicero = [kikéro].</li>
<li><strong>G</strong> se prononce toujours [g] : gens = [gens].</li>
<li><strong>S</strong> se prononce toujours [s] : rosa = [rosa].</li>
<li><strong>V</strong> se prononce [w] : via = [wia].</li>
<li><strong>AE</strong> et <strong>OE</strong> se prononcent [é] : puellae = [pouellé].</li>
</ul>
<p><strong>Accentuation :</strong> L'accent ne tombe jamais sur la dernière syllabe. Il tombe sur l'avant-dernière si elle est longue, sinon sur l'antépénultième.</p>
</div>
<img src="images/Latin1_2.jpg" alt="Alphabet latin" data-image-id="Latin1_2" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Lire à voix haute, syllabe par syllabe, en appliquant les règles. L'accent ne remonte jamais au-delà de la troisième syllabe.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><em>Puella aquam portat</em> (la jeune fille porte de l'eau) se prononce [pouella akwam portat]. <em>Caesar</em> se prononce [kaésar].</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Comment prononce-t-on <em>Cicero</em> ?</p>
<details><summary>Corrigé</summary>
<p>[kikéro].</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La prononciation restituée repose sur des règles simples ; l'accent ne tombe jamais sur la dernière syllabe.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Latin (EDIDEPS).</div>
    `
},
{
    title: "Leçon 3 — Rome : repères géographiques et historiques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Où se trouve Rome ? Comment une petite ville est-elle devenue un empire immense ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Situer Rome en Italie et dans la Méditerranée. Connaître les trois grandes périodes de l'histoire romaine. Comprendre l'expansion de Rome.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Rome est une ville d'Italie, située sur le fleuve Tibre. Selon la légende, elle est fondée en <strong>753 av. J.-C.</strong> par Romulus.</p>
<p><strong>Trois périodes :</strong></p>
<ul>
<li><strong>Royauté</strong> (753 – 509 av. J.-C.) : gouvernée par des rois.</li>
<li><strong>République</strong> (509 – 27 av. J.-C.) : pouvoir exercé par le Sénat et des magistrats élus.</li>
<li><strong>Empire</strong> (27 av. J.-C. – 476 apr. J.-C.) : Auguste devient le premier empereur.</li>
</ul>
</div>
<img src="images/Latin1_3.jpg" alt="Carte de l'Italie antique" data-image-id="Latin1_3" onerror="this.style.display='none'">
<img src="images/Latin1_4.jpg" alt="Louve capitoline avec Romulus et Remus" data-image-id="Latin1_4" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Retenir les trois périodes et leurs dates : 753 av. J.-C. (fondation), 509 av. J.-C. (République), 27 av. J.-C. (Empire), 476 apr. J.-C. (chute de l'Empire d'Occident).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>La légende de Romulus et Remus comporte des éléments mythiques (la louve) mais aussi un noyau historique (fondation au VIIIe siècle av. J.-C.).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelles sont les trois grandes périodes de l'histoire romaine ?</p>
<details><summary>Corrigé</summary>
<p>Royauté, République, Empire.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Rome passe d'une petite cité à un empire méditerranéen en trois grandes périodes.</p></div>

<div class="sources"><strong>Sources :</strong> Histoire romaine.</div>
    `
},
{
    title: "Leçon 4 — Les cas et leurs fonctions",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« En français, on utilise l'ordre des mots pour indiquer qui fait quoi. En latin, les mots changent de terminaison selon leur fonction. Comment cela fonctionne-t-il ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre ce qu'est un cas. Identifier les six cas latins. Associer chaque cas à sa fonction.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>En latin, les noms changent de terminaison selon leur fonction dans la phrase : ce sont les <strong>cas</strong>.</p>
<ul>
<li><strong>Nominatif :</strong> sujet, attribut du sujet.</li>
<li><strong>Vocatif :</strong> adresse (apostrophe).</li>
<li><strong>Accusatif :</strong> complément d'objet direct, lieu (avec préposition).</li>
<li><strong>Génitif :</strong> complément du nom.</li>
<li><strong>Datif :</strong> complément d'objet indirect (à, pour).</li>
<li><strong>Ablatif :</strong> moyen, manière, lieu (avec préposition).</li>
</ul>
</div>
<img src="images/Latin1_5.jpg" alt="Les six cas latins" data-image-id="Latin1_5" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour analyser un nom latin : identifier sa terminaison (cas et nombre), puis sa fonction dans la phrase.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><em>Puella aquam portat</em>. <em>Puella</em> est au nominatif (sujet). <em>Aquam</em> est à l'accusatif (objet direct).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la fonction du nominatif ? de l'accusatif ?</p>
<details><summary>Corrigé</summary>
<p>Nominatif : sujet. Accusatif : objet direct.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les cas indiquent la fonction des mots ; leur maîtrise est la clé de la traduction latine.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Latin (EDIDEPS).</div>
    `
},
{
    title: "Leçon 5 — La 1re et la 2e déclinaison",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment dire la rose, de la rose, à la rose, la rose (objet), ô rose, par la rose en latin ? Et pour le maître ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Décliner un nom de la 1re déclinaison. Décliner un nom de la 2e déclinaison. Reconnaître le genre des noms.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>1re déclinaison :</strong> noms en -a au nominatif, génitif en -ae. Généralement féminins.</p>
<p>Modèle : <em>rosa, -ae, f.</em> (la rose).</p>
<ul>
<li>Singulier : rosa, rosa, rosam, rosae, rosae, rosa.</li>
<li>Pluriel : rosae, rosae, rosas, rosarum, rosis, rosis.</li>
</ul>
<p><strong>2e déclinaison :</strong> noms en -us/-er (masculins) ou -um (neutres), génitif en -i.</p>
<p>Modèle : <em>dominus, -i, m.</em> (le maître).</p>
<ul>
<li>Singulier : dominus, domine, dominum, domini, domino, domino.</li>
<li>Pluriel : domini, domini, dominos, dominorum, dominis, dominis.</li>
</ul>
</div>
<img src="images/Latin1_6.jpg" alt="Première déclinaison latine" data-image-id="Latin1_6" onerror="this.style.display='none'">
<img src="images/Latin1_7.jpg" alt="Deuxième déclinaison latine" data-image-id="Latin1_7" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour décliner un nom : trouver le radical (génitif sans la terminaison), puis ajouter les terminaisons du cas et du nombre.</p>

<ol>
<li>Repérer le verbe (terminaison personnelle).</li>
<li>Identifier le sujet (nominatif).</li>
<li>Identifier les compléments (accusatif, datif, ablatif).</li>
<li>Traduire en respectant l'ordre : sujet – verbe – objet.</li>

      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
