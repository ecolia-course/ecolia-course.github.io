{
    title: "Leçon 1 — Rappels et diagnostic",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Quels outils mathématiques dois-je déjà maîtriser avant d'aborder le programme de 3e année ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Faire le point sur les prérequis : calcul littéral, équations du 1er degré, fractions, puissances, proportionnalité. Identifier ses points forts et ses lacunes.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les prérequis indispensables</div>
<ul>
<li><strong>Calcul littéral :</strong> développement (a+b)² = a² + 2ab + b², factorisation, réduction.</li>
<li><strong>Fractions :</strong> addition, multiplication, division, simplification.</li>
<li><strong>Puissances :</strong> a<sup>m</sup>·a<sup>n</sup> = a<sup>m+n</sup> ; (a<sup>m</sup>)<sup>n</sup> = a<sup>mn</sup> ; a<sup>0</sup> = 1 (a ≠ 0).</li>

<li><strong>Équations du 1er degré :</strong> isoler l'inconnue par opérations équivalentes.</li>

{
    title: "Leçon 2 — Équations et inéquations du 1er et 2e degré",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un commerçant veut savoir combien d'articles vendre pour couvrir ses coûts. Comment poser et résoudre ce problème ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Résoudre une équation du 1er degré. Résoudre une équation du 2e degré par le discriminant. Résoudre une inéquation à l'aide d'un tableau de signes.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Équation du 1er degré</div>
<p>Une équation du 1er degré s'écrit ax + b = 0 (a ≠ 0). Sa solution est x = −b/a. Méthode :</p>
<ol>
<li>Développer et réduire chaque membre.</li>
<li>Regrouper les termes en x d'un côté, les constantes de l'autre.</li>
<li>Diviser par le coefficient de x.</li>
</ol>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Équation du 2e degré</div>
<p>Forme : ax² + bx + c = 0 (a ≠ 0). On calcule le <strong>discriminant</strong> Δ = b² − 4ac.</p>
<ul>
<li>Si Δ > 0 : deux solutions x₁ = (−b − √Δ)/(2a) et x₂ = (−b + √Δ)/(2a).</li>
<li>Si Δ = 0 : une solution double x = −b/(2a).</li>
<li>Si Δ < 0 : pas de solution réelle.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Inéquations et tableau de signes</div>
<p>Pour une inéquation du 2e degré, on étudie le signe du trinôme ax² + bx + c :</p>
<ul>
<li>Signe de a à l'extérieur des racines.</li>
<li>Signe opposé à a entre les racines.</li>
</ul>
<p>Un tableau de signes permet de lire directement l'ensemble solution.</p>
<img data-image-id="MA3_IMG02" alt="Tableau de signes d'un trinôme" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc exemple"><div class="bloc-label">Exemple — Problème contextualisé</div>
<p>Un vendeur achète des sacs à 2 000 FC l'unité et paie 15 000 FC de transport. Il revend chaque sac 3 500 FC. Combien doit-il vendre de sacs pour réaliser un bénéfice de 30 000 FC ?</p>
<p>Bénéfice = (3 500 − 2 000)x − 15 000 = 1 500x − 15 000. On résout 1 500x − 15 000 = 30 000 → x = 30. Il doit vendre 30 sacs.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Résoudre 3x − 5 = 2x + 7.</p>
<p><strong>Ex. 2 :</strong> Résoudre x² − 5x + 6 = 0.</p>
<p><strong>Ex. 3 :</strong> Résoudre x² − 4 ≥ 0 à l'aide d'un tableau de signes.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> x = 12. <strong>2)</strong> Δ = 1, x₁ = 2, x₂ = 3. <strong>3)</strong> x ≤ −2 ou x ≥ 2.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le discriminant décide du nombre de solutions ; le tableau de signes donne l'ensemble solution d'une inéquation.</p></div>
<div class="sources"><strong>Sources :</strong> Programme officiel 3e HS (algèbre) ; manuels scolaires.</div>
    `
},
{
    title: "Leçon 3 — Systèmes d'équations",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Au marché, deux achats différents coûtent des sommes différentes. Comment trouver le prix d'un seul article ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Résoudre un système de deux équations à deux inconnues. Choisir entre substitution et combinaison. Interpréter la solution.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Méthode de substitution</div>
<ol>
<li>Exprimer une inconnue en fonction de l'autre à partir d'une équation.</li>
<li>Remplacer dans la seconde équation.</li>
<li>Résoudre, puis trouver la seconde inconnue.</li>
</ol>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Méthode de combinaison (addition)</div>
<ol>
<li>Multiplier les équations pour que les coefficients d'une inconnue soient opposés.</li>
<li>Additionner membre à membre : l'inconnue disparaît.</li>
<li>Résoudre l'équation obtenue puis remonter à l'autre inconnue.</li>
</ol>
</div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Système : <em>x + y = 12</em> et <em>2x + 3y = 31</em>. Par substitution : x = 12 − y. Alors 2(12 − y) + 3y = 31 → 24 + y = 31 → y = 7, x = 5.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Résoudre x + y = 10 et 3x − y = 2.</p>
<p><strong>Ex. 2 :</strong> Trois cahiers et deux stylos coûtent 2 600 FC ; un cahier et trois stylos coûtent 1 900 FC. Quel est le prix d'un cahier ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> x = 3, y = 7. <strong>2)</strong> Système 3c + 2s = 2 600 ; c + 3s = 1 900 → c = 700 FC, s = 400 FC.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Substitution et combinaison conduisent au même résultat ; le choix dépend de la forme du système.</p></div>
<div class="sources"><strong>Sources :</strong> Programme officiel 3e HS ; manuels scolaires.</div>
    `
},
{
    title: "Leçon 4 — Suites numériques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un épargnant place 100 000 FC à intérêts simples chaque année. Comment calculer son capital après plusieurs années ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Reconnaître une suite arithmétique et une suite géométrique. Calculer un terme général et une somme. Appliquer aux intérêts simples et composés.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition et notation</div>
<p>Une <strong>suite numérique</strong> est une fonction de ℕ vers ℝ ; on note u<sub>n</sub> le terme d'indice n. Le terme u<sub>0</sub> est le premier terme.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Suites arithmétiques</div>
<p>Chaque terme s'obtient en ajoutant une constante r (la raison) au terme précédent : u<sub>n+1</sub> = u<sub>n</sub> + r.</p>
<p><strong>Terme général :</strong> u<sub>n</sub> = u<sub>0</sub> + n·r.</p>
<p><strong>Somme des n premiers termes :</strong> S = n × (u<sub>0</sub> + u<sub>n−1</sub>)/2.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Suites géométriques</div>
<p>Chaque terme s'obtient en multipliant par une constante q (la raison) : u<sub>n+1</sub> = q·u<sub>n</sub>.</p>
<p><strong>Terme général :</strong> u<sub>n</sub> = u<sub>0</sub> × q<sup>n</sup>.</p>
</div>
<div class="bloc exemple"><div class="bloc-label">Exemple — Intérêts simples et composés</div>
<p>Un capital C<sub>0</sub> = 100 000 FC placé à 5 % par an.</p>
<ul>
<li><strong>Intérêts simples :</strong> capital après n années = C<sub>0</sub> + n × C<sub>0</sub> × 0,05 = suite arithmétique de raison 5 000.</li>
<li><strong>Intérêts composés :</strong> capital après n années = C<sub>0</sub> × 1,05<sup>n</sup> = suite géométrique de raison 1,05.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> La suite u<sub>0</sub> = 3, r = 4. Calculer u<sub>5</sub> et la somme des 6 premiers termes.</p>
<p><strong>Ex. 2 :</strong> Une population augmente de 2 % par an. En quelle année aura-t-elle doublé ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> u<sub>5</sub> = 3 + 5×4 = 23 ; somme = 6 × (3 + 23)/2 = 78. <strong>2)</strong> Résoudre 1,02<sup>n</sup> ≥ 2 (n ≈ 35, méthode par logarithmes ou essais).</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Suite arithmétique : on additionne. Suite géométrique : on multiplie. Les intérêts simples et composés en sont les deux modèles.</p></div>
<div class="sources"><strong>Sources :</strong> Programme officiel 3e HS (analyse) ; manuels scolaires.</div>
    `
},
{
    title: "Leçon 5 — Généralités sur les fonctions",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Le prix d'un taxi dépend de la distance. Comment décrire cette relation par une fonction ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir une fonction, son domaine, son image. Lire un graphique. Reconnaître les fonctions usuelles.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>Une <strong>fonction</strong> f associe à chaque réel x d'un ensemble D (le <strong>domaine de définition</strong>) un unique réel f(x). On note f : D → ℝ ; x ↦ f(x). L'ensemble des valeurs prises est l'<strong>image</strong> de f.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Fonctions usuelles à connaître</div>
<ul>
<li><strong>Fonction affine :</strong> f(x) = ax + b (droite de coefficient directeur a, d'ordonnée à l'origine b).</li>
<li><strong>Fonction polynôme du 2e degré :</strong> f(x) = ax² + bx + c (parabole).</li>
<li><strong>Fonction inverse :</strong> f(x) = 1/x (hyperbole, définie sur ℝ*).</li>
<li><strong>Fonction racine carrée :</strong> f(x) = √x (définie sur [0 ; +∞[).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Lecture d'un graphique</div>
<ul>
<li>Les abscisses où la courbe coupe l'axe des x sont les <strong>racines</strong>.</li>
<li>Le point où la courbe coupe l'axe des ordonnées est l'image de 0.</li>
<li>La courbe monte ou descend selon le <strong>sens de variation</strong>.</li>
</ul>
</div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une course de taxi coûte 1 000 FC de prise en charge plus 500 FC par kilomètre. Le prix est f(x) = 500x + 1 000, une fonction affine croissante.</p>
</div>

<p><strong>Ex. 1 :</strong> Déterminer le domaine de définition de f(x) = 1/(x − 2) et de g(x) = √(x + 3).</p>
<p><strong>Ex. 2 :</strong> Calculer f(0) et f(4) pour f(x) = 500x + 1 000.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> D<sub>f</sub> = ℝ \\ {2} ; D<sub>g</sub> = [−3 ; +∞[. <strong>2)</strong> f(0) = 1 000 ; f(4) = 3 000.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une fonction est une machine qui transforme un nombre en un autre ; le domaine indique pour quels nombres elle fonctionne.</p></div>
<div class="sources"><strong>Sources :</strong> Programme officiel 3e HS (analyse) ; manuels scolaires.</div>

    title: "Leçon 6 — Limites et continuité (initiation)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Que devient une fonction quand x s'approche d'une valeur interdite ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la notion de limite. Distinguer limite finie et limite infinie. Reconnaître la continuité en un point.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Notion de limite</div>
<p>Étudier la <strong>limite</strong> d'une fonction en un point a, c'est observer son comportement lorsque x est très proche de a, sans nécessairement l'atteindre. On note <em>lim<sub>x→a</sub> f(x) = L</em> lorsque f(x) se rapproche de L.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Limites usuelles</div>
<ul>
<li>Polynômes en ±∞ : la limite est celle du terme de plus haut degré. Ex. : lim<sub>x→+∞</sub> (3x² − 2x + 1) = +∞.</li>
<li>Fonction inverse : lim<sub>x→0⁺</sub> 1/x = +∞ ; lim<sub>x→0⁻</sub> 1/x = −∞.</li>
<li>Fonction rationnelle P(x)/Q(x) : si degré P > degré Q, la limite est infinie ; si degrés égaux, la limite est le rapport des coefficients dominants.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Continuité</div>
<p>Une fonction est <strong>continue</strong> en a si lim<sub>x→a</sub> f(x) = f(a). Intuitivement : sa courbe peut être tracée sans lever le crayon. Les polynômes et les fonctions rationnelles sont continues sur leur domaine.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Calculer lim<sub>x→+∞</sub> (2x² + 5x − 1).</p>
<p><strong>Ex. 2 :</strong> Calculer lim<sub>x→+∞</sub> (3x + 1)/(x − 2).</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> +∞ (terme dominant 2x²). <strong>2)</strong> Rapport des coefficients dominants : 3.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La limite décrit le comportement d'une fonction près d'un point ou à l'infini ; la continuité assure qu'on peut tracer sans lever le crayon.</p></div>
<div class="sources"><strong>Sources :</strong> Programme officiel 3e HS (analyse) ; manuels scolaires.</div>
    `
},
{
    title: "Leçon 7 — Dérivation et applications",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment savoir si une fonction monte ou descend, et où elle atteint son maximum ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la notion de dérivée. Calculer les dérivées usuelles. Appliquer la dérivée au sens de variation et aux extremums.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Taux de variation et dérivée</div>
<p>Le <strong>taux de variation</strong> de f entre a et a + h est [f(a + h) − f(a)] / h. La <strong>dérivée</strong> f'(a) est la limite de ce taux quand h tend vers 0. Elle mesure la pente de la tangente à la courbe au point d'abscisse a.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Dérivées usuelles</div>
<ul>
<li>(k)' = 0 (k constante) ; (x)' = 1.</li>
<li>(x<sup>n</sup>)' = n·x<sup>n−1</sup>.</li>
<li>(1/x)' = −1/x².</li>
<li>(√x)' = 1/(2√x).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Règles de dérivation</div>
<ul>
<li><strong>Somme :</strong> (u + v)' = u' + v'.</li>
<li><strong>Produit :</strong> (u·v)' = u'·v + u·v'.</li>
<li><strong>Quotient :</strong> (u/v)' = (u'·v − u·v') / v².</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Applications</div>
<ul>
<li>Si f'(x) > 0 sur un intervalle, f est croissante.</li>
<li>Si f'(x) < 0 sur un intervalle, f est décroissante.</li>
<li>Si f' s'annule en changeant de signe en a, f admet un extremum en a (maximum ou minimum).</li>
</ul>
<img data-image-id="MA3_IMG03" alt="Représentation d'une fonction et de sa dérivée" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Calculer la dérivée de f(x) = x³ − 3x.</p>
<p><strong>Ex. 2 :</strong> Étudier le signe de f'(x) et en déduire le sens de variation de f.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> f'(x) = 3x² − 3. <strong>2)</strong> f'(x) = 3(x − 1)(x + 1) ; f' > 0 sur ]−∞ ; −1[ et ]1 ; +∞[, f' < 0 sur ]−1 ; 1[. f croît puis décroît puis croît ; maximum local en x = −1, minimum local en x = 1.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La dérivée mesure la pente ; son signe donne le sens de variation et ses zéros indiquent les extremums.</p></div>
<div class="sources"><strong>Sources :</strong> Programme officiel 3e HS (analyse) ; manuels scolaires.</div>
    `
},

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment mesurer la hauteur d'un arbre sans grimper ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie — Cercle trigonométrique et radian</div>
<p>Le <strong>cercle trigonométrique</strong> est le cercle de rayon 1 centré à l'origine. Le <strong>radian</strong> mesure les angles : 180° = π rad ; 90° = π/2 ; 360° = 2π.</p>
<img data-image-id="MA3_IMG01" alt="Cercle trigonométrique" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Sinus, cosinus, tangente</div>
<p>Pour un angle α :</p>
<ul>
<li>cos α = abscisse du point du cercle trigonométrique.</li>
<li>sin α = ordonnée du point du cercle trigonométrique.</li>
<li>tan α = sin α / cos α (α ≠ π/2 + kπ).</li>
</ul>
<p>Dans un triangle rectangle : cos α = côté adjacent / hypoténuse ; sin α = côté opposé / hypoténuse ; tan α = côté opposé / côté adjacent (SOH CAH TOA).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Relations fondamentales</div>
<ul>
<li>cos² α + sin² α = 1.</li>
<li>tan α = sin α / cos α.</li>
<li>Signes selon le quadrant : cos et sin changent de signe.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Angles remarquables</div>
<p>Valeurs à connaître :</p>

<li>π/4 : cos = √2/2, sin = √2/2.</li>
<li>π/3 : cos = 1/2, sin = √3/2.</li>
<li>π/2 : cos = 0, sin = 1.</li>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment décrire un déplacement ou une force dans un plan de manière précise ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir un vecteur dans un repère orthonormé. Calculer ses coordonnées, sa norme. Additionner deux vecteurs. Utiliser la colinéarité.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Coordonnées d'un vecteur</div>
<p>Dans un repère orthonormé (O ; i⃗ ; j⃗), si A(x<sub>A</sub> ; y<sub>A</sub>) et B(x<sub>B</sub> ; y<sub>B</sub>), alors :</p>
<p>vecteur AB = (x<sub>B</sub> − x<sub>A</sub> ; y<sub>B</sub> − y<sub>A</sub>).</p>
<img data-image-id="MA3_IMG04" alt="Vecteurs et repère orthonormé" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Norme d'un vecteur</div>
<p>La norme (longueur) du vecteur u⃗(x ; y) est ║u⃗║ = √(x² + y²). C'est la distance entre deux points.</p>

<div class="bloc theorie"><div class="bloc-label">Théorie — Opérations sur les vecteurs</div>
<ul>
<li><strong>Addition :</strong> (x₁ ; y₁) + (x₂ ; y₂) = (x₁ + x₂ ; y₁ + y₂).</li>
<li><strong>Multiplication par un réel k :</strong> k·(x ; y) = (kx ; ky).</li>
<li><strong>Colinéarité :</strong> deux vecteurs u⃗(x ; y) et v⃗(x' ; y') sont colinéaires si et seulement si xy' − x'y = 0 (déterminant nul).</li>
</ul>
</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment résumer les notes d'une classe en quelques nombres ? Quelle chance ai-je de tirer une boule rouge ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Calculer moyenne, médiane, mode. Lire une série statistique. Calculer une probabilité simple.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Statistiques descriptives</div>
<ul>
<li><strong>Moyenne :</strong> somme des valeurs divisée par l'effectif total.</li>
<li><strong>Médiane :</strong> valeur qui partage la série en deux groupes d'effectifs égaux (après tri).</li>
<li><strong>Mode :</strong> valeur la plus fréquente.</li>
<li><strong>Étendue :</strong> différence entre la valeur maximale et la valeur minimale.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Probabilités</div>
<p>Lors d'une expérience aléatoire, la probabilité d'un événement A est :</p>
<p>P(A) = nombre de cas favorables / nombre de cas possibles (quand les issues sont équiprobables).</p>
<p>Propriétés : 0 ≤ P(A) ≤ 1 ; P(événement certain) = 1 ; P(événement impossible) = 0 ; P(non A) = 1 − P(A).</p>
</div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Notes d'une classe : 8, 10, 12, 10, 14, 16, 10. Moyenne = (8 + 10 + 12 + 10 + 14 + 16 + 10)/7 = 80/7 ≈ 11,43. Médiane = 10. Mode = 10.</p>
<p>Un sac contient 3 boules rouges et 5 boules blanches. P(rouge) = 3/8.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Calculer la moyenne, la médiane et le mode d'une série donnée.</p>
<p><strong>Ex. 2 :</strong> Un dé équilibré. Quelle est la probabilité d'obtenir un nombre pair ?</p>
<details><summary>Corrigé</summary>
<p><strong>2)</strong> 3/6 = 1/2.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La moyenne décrit une tendance centrale, la médiane résiste aux valeurs extrêmes ; la probabilité quantifie le hasard.</p></div>
<div class="sources"><strong>Sources :</strong> Programme officiel 3e HS (analyse) ; manuels scolaires.</div>
    `

      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
