        <div class="bloc theorie">
            <div class="bloc-label">Theory</div>
            <h3>The present simple</h3>
            <p>Used for habits, routines, and general truths.</p>
            <table>

            <ul>
                <li>I <strong>do not (don't)</strong> watch TV in the morning.</li>

                    <tr><td>come</td><td>came</td></tr>

 am. You. are. He or She or It. is. We or You or They. are. Possessive adjectives. my, your, his, her, its, our, their. Dialogue example. A: Good morning! My name is Amina. I am from Goma. And you? B: Nice to meet you, Amina. I am Jean. I am from Kinshasa. A: How are you today? B: I am fine, thank you. And you? Key points. Use « I am » for yourself, « you are » for the other person. Erreur fréquente: « I am agree », donc I agree (pas de « to be »)."]],"3":[["en","Unit 1 (suite). Daily routines and the present simple. Theory. The present simple. Used for habits, routines, and general truths. Subject. Form (affirmative). I or You or We or They. verb (base form). He or She or It. verb plus s or es. Examples. I wake up at 6 a.m. every day. She goes to school by bus. They study English on Mondays. Negative and interrogative forms. I do not (don't) watch TV in the morning. She does not (doesn't) like coffee. Do you play football? Yes, I do. Does he study English? No, he doesn't. Exercise. Complete: « She ___ (go) to school every day. », donc goes. Complete: « They ___ (not or play) basketball. », donc do not play or don't play. Key points. Third person singular (he, she, it), donc verb plus s. Use « do or does » for questions and negatives."],["fr","Erreur fréquente: oublier le « s » à la 3e personne."]],"4":[["en","Unit 2. Talking about the past: simple past. Theory. The simple past. Used for a completed action in the past. Regular verbs: plus ed. work, donc worked, play, donc played, watch, donc watched. Irregular verbs (examples). Base. Past. go. went. see. saw. eat. ate. come. came. take. took. Time markers. yesterday, last week, last year, in 2020, two days ago. Negative and interrogative. I did not (didn't) go to the market yesterday. Did you see him? Yes, I did. Example. « Yesterday, I went to the market. I bought some mangoes and I met my teacher. ». Key points. Regular verbs: plus ed. Irregular verbs: memorize the forms. Use « did » plus base form for questions and negatives. Erreur fréquente: « I didn't went », donc I didn't go."]],"5":[["en","Unit 2 (suite). The past continuous. Theory. Form. was or were plus verb-ing. I or He or She or It, donc was. You or We or They, donc were. Use. For an action that was in progress at a moment in the past. Examples. At 8 p.m. yesterday, I was doing my homework. They were playing football when it started to rain. Past continuous plus simple past. Often used together: the past continuous describes the background action, the simple past interrupts it. « While I was walking to school, I met my friend. ». Exercise. « I ___ (read) when you ___ (call) me. », donc was reading; called. Key points. was or were plus -ing. Used for background actions in the past."],["fr","Erreur fréquente: utiliser le past continuous pour une action terminée (préférer le simple past)."]],"6":[["en","Unit 3. The future: will, going to, present continuous. Theory. Will. Spontaneous decision, prediction, promise. « I will help you with your homework. ». « It will rain tomorrow. ». Going to. Planned intention, premeditated decision. « I am going to study medicine next year. ». « She is going to visit her grandmother. ». Present continuous for future. Fixed arrangement. « I am meeting my friend tomorrow at 3 p.m. ». Exercise. « I have decided: I ___ study English every day. », donc am going to (intention planifiée). « The phone is ringing! I ___ answer it."],["fr","», donc will (décision spontanée)."],["en","Key points. Will égale spontaneous; going to égale planned. Present continuous égale fixed arrangement."],["fr","Erreur fréquente: utiliser « will » pour une intention déjà décidée."]],"7":[["en","Unit 4."],["fr","Describing: adjectives, comparatives, superlatives."],["en","Theory. Adjectives. In English, the adjective comes before the noun: a big city, a beautiful house. Order of adjectives. Opinion."],["fr","size."],["en","age."],["fr","colour."],["en","origin."],["fr","material:"],["en","a beautiful small old red Congolese wooden mask. Comparatives. Short adjectives: plus er. big, donc bigger; tall, donc taller. Long adjectives: more plus adjective. interesting, donc more interesting. Irregular: good, donc better; bad, donc worse. Superlatives. Short adjectives: the plus est. the biggest. Long adjectives: the most plus adjective. the most interesting. Example. « Kinshasa is bigger than Goma. It is one of the most populated cities in Africa. ». « This book is more interesting than that one. ». Key points. Adjective before the noun. Comparatives: -er or more. Superlatives: the -est or the most."],["fr","Erreur fréquente: « more bigger » (double comparatif)."]],"8":[["en","Unit 5. Writing simple messages and emails. Theory. Informal email structure. Greeting: Hi or Dear [name]. Body: purpose, details, request. Closing: Best regards or See you soon. Signature: your name. Formal letter structure. Greeting: Dear Sir or Madam. Opening: I am writing to…. Body: purpose, justification, request. Closing: Yours faithfully or Yours sincerely. Signature. Example email (50 words). « Hi Jean, I am writing to invite you to the English Club meeting on Saturday at 10 a.m. We will practise speaking and play games. Are you free? Please let me know. Best regards, Amina ». Key points. Greeting plus body plus closing égale clear message. Informal égale « Hi » and « Best regards »; formal égale « Dear Sir » and « Yours faithfully »."],["fr","Erreur fréquente: mélanger les registres (familier dans une lettre formelle)."]],"9":[["en","Unit 6. Listening and speaking: role-plays. Theory. Listening strategies. Identify the topic and key words. Listen for the tone and intention. Do not stop at unknown words. Speaking strategies. Prepare a few useful phrases. Speak slowly and clearly. Use gestures and intonation. Role-play situations. At the shop: buying, asking for a price. At the hospital: describing symptoms. At school: asking for information. Introducing yourself to a visitor. Example dialogue. Shopkeeper: Good morning. How can I help you? Customer: Good morning. How much is this shirt? Shopkeeper: It is 25 dollars. Customer: That's fine. I'll take it, please. Key points. Listening: catch the main idea, not every word. Speaking: clarity over speed."],["fr","Erreur fréquente: traduire mentalement mot à mot, ce qui bloque la fluidité."]],"10":[["fr","Préparation à l'épreuve orale d'anglais."],["en","Context."],["fr","À partir de la session 2025-2026, l'Examen d'État comporte une épreuve orale d'anglais pour tous les finalistes des humanités. Ce qui est évalué. La capacité à s'exprimer oralement en continu (1 à 2 minutes). La capacité à interagir (répondre à des questions simples). La clarté, la prononciation, la correction grammaticale de base. Se préparer. Préparer de courts monologues sur des sujets familiers (famille, école, projet professionnel). Répéter à voix haute, chronométrer. Enregistrer et écouter pour corriger. S'entraîner à répondre à des questions simples. Exemple de sujet."],["en","Topic: My plans after secondary school. Exemple de réponse (1 minutes): « After secondary school, I would like to study medicine at the University of Kinshasa because I want to help my community. I am also interested in learning English to communicate with international colleagues. ». Key points."],["fr","Structure simple: introduction, développement, conclusion. Utiliser des phrases courtes et claires. Erreur fréquente: réciter par cœur sans comprendre; le jury peut poser des questions."]],"11":[["fr","Évaluation finale."],["en","Anglais."],["fr","Évaluation finale. 20 questions à choix multiple. Une seule réponse est correcte par question. Choisis la réponse qui te semble juste, puis valide."]]}};

    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];

        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {

      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
</html>
