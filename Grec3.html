    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Le grec ancien est la langue de la Grèce classique, de sa philosophie, de son théâtre et de ses mythes. En 3e année des humanités classiques, l'élève apprend l'alphabet, les bases de la morphologie et de la syntaxe, lit des textes simples et découvre la civilisation grecque.</p>
<p><strong>Note de transparence :</strong> le grec est mentionné parmi les disciplines des humanités classiques en RDC (grec, latin, mathématique). Aucun programme officiel RDC propre au grec en 3e année n'a été localisé dans les sources consultées. La progression ci-dessous propose une <strong>initiation au grec ancien</strong> (alphabet, morphologie de base, textes simples, civilisation), alignée sur les compétences habituelles, à valider par le programme officiel en vigueur.</p>
<ul>
<li>Leçon 1 — L'alphabet grec et la prononciation</li>
<li>Leçon 2 — Les déclinaisons (initiation)</li>
<li>Leçon 3 — Les verbes (initiation)</li>
<li>Leçon 4 — Textes simples : mythes et fables</li>
<li>Leçon 5 — La civilisation grecque</li>
<li>Leçon 6 — Version grecque guidée</li>
<li>Leçon 7 — Synthèse et évaluation</li>
</ul>
<p>Une évaluation finale de 12 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Références sur les humanités classiques en RDC ; manuels d'initiation au grec ancien ; textes grecs classiques cités indirectement. Statut du programme de 3e année à confirmer.</div>

{
    title: "Leçon 1 — L'alphabet grec et la prononciation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi les Grecs écrivent-ils avec un alphabet différent du nôtre ? Et pourquoi le français en a-t-il hérité ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Nommer les 24 lettres grecques. Prononcer et translittérer un mot simple. Écrire en grec des mots courants.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les 24 lettres</div>
<p>L'alphabet grec comporte 24 lettres. Voici les lettres (majuscule, minuscule, nom, prononciation approximative en français) :</p>
<table style="width:100%;border-collapse:collapse;margin-top:10px;">
<tr style="background:var(--bg2);"><th style="border:1px solid var(--bd);padding:4px;">Maj.</th><th style="border:1px solid var(--bd);padding:4px;">Min.</th><th style="border:1px solid var(--bd);padding:4px;">Nom</th><th style="border:1px solid var(--bd);padding:4px;">Prononciation</th></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Α</td><td style="border:1px solid var(--bd);padding:4px;">α</td><td style="border:1px solid var(--bd);padding:4px;">alpha</td><td style="border:1px solid var(--bd);padding:4px;">a</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Β</td><td style="border:1px solid var(--bd);padding:4px;">β</td><td style="border:1px solid var(--bd);padding:4px;">bêta</td><td style="border:1px solid var(--bd);padding:4px;">b</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Γ</td><td style="border:1px solid var(--bd);padding:4px;">γ</td><td style="border:1px solid var(--bd);padding:4px;">gamma</td><td style="border:1px solid var(--bd);padding:4px;">g (dur)</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Δ</td><td style="border:1px solid var(--bd);padding:4px;">δ</td><td style="border:1px solid var(--bd);padding:4px;">delta</td><td style="border:1px solid var(--bd);padding:4px;">d</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Ε</td><td style="border:1px solid var(--bd);padding:4px;">ε</td><td style="border:1px solid var(--bd);padding:4px;">epsilon</td><td style="border:1px solid var(--bd);padding:4px;">é bref</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Ζ</td><td style="border:1px solid var(--bd);padding:4px;">ζ</td><td style="border:1px solid var(--bd);padding:4px;">zêta</td><td style="border:1px solid var(--bd);padding:4px;">dz</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Η</td><td style="border:1px solid var(--bd);padding:4px;">η</td><td style="border:1px solid var(--bd);padding:4px;">êta</td><td style="border:1px solid var(--bd);padding:4px;">è long</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Θ</td><td style="border:1px solid var(--bd);padding:4px;">θ</td><td style="border:1px solid var(--bd);padding:4px;">thêta</td><td style="border:1px solid var(--bd);padding:4px;">th</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Ι</td><td style="border:1px solid var(--bd);padding:4px;">ι</td><td style="border:1px solid var(--bd);padding:4px;">iota</td><td style="border:1px solid var(--bd);padding:4px;">i</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Κ</td><td style="border:1px solid var(--bd);padding:4px;">κ</td><td style="border:1px solid var(--bd);padding:4px;">kappa</td><td style="border:1px solid var(--bd);padding:4px;">k</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Λ</td><td style="border:1px solid var(--bd);padding:4px;">λ</td><td style="border:1px solid var(--bd);padding:4px;">lambda</td><td style="border:1px solid var(--bd);padding:4px;">l</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Μ</td><td style="border:1px solid var(--bd);padding:4px;">μ</td><td style="border:1px solid var(--bd);padding:4px;">mu</td><td style="border:1px solid var(--bd);padding:4px;">m</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Ν</td><td style="border:1px solid var(--bd);padding:4px;">ν</td><td style="border:1px solid var(--bd);padding:4px;">nu</td><td style="border:1px solid var(--bd);padding:4px;">n</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Ξ</td><td style="border:1px solid var(--bd);padding:4px;">ξ</td><td style="border:1px solid var(--bd);padding:4px;">xi</td><td style="border:1px solid var(--bd);padding:4px;">ks</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Ο</td><td style="border:1px solid var(--bd);padding:4px;">ο</td><td style="border:1px solid var(--bd);padding:4px;">omicron</td><td style="border:1px solid var(--bd);padding:4px;">o bref</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Π</td><td style="border:1px solid var(--bd);padding:4px;">π</td><td style="border:1px solid var(--bd);padding:4px;">pi</td><td style="border:1px solid var(--bd);padding:4px;">p</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Ρ</td><td style="border:1px solid var(--bd);padding:4px;">ρ</td><td style="border:1px solid var(--bd);padding:4px;">rhô</td><td style="border:1px solid var(--bd);padding:4px;">r</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Σ</td><td style="border:1px solid var(--bd);padding:4px;">σ / ς</td><td style="border:1px solid var(--bd);padding:4px;">sigma</td><td style="border:1px solid var(--bd);padding:4px;">s</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Τ</td><td style="border:1px solid var(--bd);padding:4px;">τ</td><td style="border:1px solid var(--bd);padding:4px;">tau</td><td style="border:1px solid var(--bd);padding:4px;">t</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Υ</td><td style="border:1px solid var(--bd);padding:4px;">υ</td><td style="border:1px solid var(--bd);padding:4px;">upsilon</td><td style="border:1px solid var(--bd);padding:4px;">u (ou français)</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Φ</td><td style="border:1px solid var(--bd);padding:4px;">φ</td><td style="border:1px solid var(--bd);padding:4px;">phi</td><td style="border:1px solid var(--bd);padding:4px;">ph (f)</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Χ</td><td style="border:1px solid var(--bd);padding:4px;">χ</td><td style="border:1px solid var(--bd);padding:4px;">khi</td><td style="border:1px solid var(--bd);padding:4px;">kh</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Ψ</td><td style="border:1px solid var(--bd);padding:4px;">ψ</td><td style="border:1px solid var(--bd);padding:4px;">psi</td><td style="border:1px solid var(--bd);padding:4px;">ps</td></tr>
<tr><td style="border:1px solid var(--bd);padding:4px;">Ω</td><td style="border:1px solid var(--bd);padding:4px;">ω</td><td style="border:1px solid var(--bd);padding:4px;">oméga</td><td style="border:1px solid var(--bd);padding:4px;">ô long</td></tr>

</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Translittération et héritage</div>
<p>Le français a hérité de l'alphabet grec : par exemple <em>philosophia</em> → philosophie ; <em>theatron</em> → théâtre ; <em>logos</em> → logique. Savoir translittérer (passer du grec aux lettres latines) aide à reconnaître les mots français d'origine grecque.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Écris en majuscules grecques les mots : <em>logos</em>, <em>theos</em>, <em>anthrôpos</em>.</p>
<p><strong>Ex. 2 :</strong> Translittère : <em>φιλοσοφία</em>, <em>θέατρον</em>.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> ΛΟΓΟΣ, ΘΕΟΣ, ΑΝΘΡΩΠΟΣ. <strong>2)</strong> <em>philosophia</em> ; <em>theatron</em>.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'alphabet grec compte 24 lettres ; il a fourni au français de nombreux mots, notamment savants.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels d'initiation au grec ancien ; grammaires grecques de référence.</div>
    `

{
    title: "Leçon 2 — Les déclinaisons (initiation)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi le mot grec <em>logos</em> devient-il <em>logou</em>, <em>logôi</em>, <em>logon</em> dans une phrase ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la fonction des cas en grec. Reconnaître les formes de l'article défini au nominatif. Reconnaître les deux premières déclinaisons à partir d'exemples simples.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le principe des cas</div>
<p>Comme le latin, le grec ancien est une langue à <strong>cas</strong> : la terminaison d'un mot indique sa fonction (sujet, complément, etc.). Les cas principaux sont les mêmes qu'en latin : nominatif, vocatif, accusatif, génitif, datif. En grec, l'article s'accorde en genre, en nombre et en cas avec le nom qu'il détermine.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — L'article défini au nominatif</div>
<ul>
<li><strong>Masculin singulier :</strong> ὁ (<em>ho</em>)</li>
<li><strong>Féminin singulier :</strong> ἡ (<em>hē</em>)</li>
<li><strong>Neutre singulier :</strong> τό (<em>to</em>)</li>
<li><strong>Masculin pluriel :</strong> οἱ (<em>hoi</em>)</li>
<li><strong>Féminin pluriel :</strong> αἱ (<em>hai</em>)</li>
<li><strong>Neutre pluriel :</strong> τά (<em>ta</em>)</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Deuxième déclinaison (masculins en -ος)</div>
<p>Modèle : <em>λόγος, λόγου</em> (le discours, la parole).</p>
<ul>
<li>Nominatif : <em>λόγος</em></li>
<li>Vocatif : <em>λόγε</em></li>
<li>Accusatif : <em>λόγον</em></li>
<li>Génitif : <em>λόγου</em></li>
<li>Datif : <em>λόγῳ</em></li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Première déclinaison (féminins)</div>
<p>Modèle : <em>τιμή, τιμῆς</em> (l'honneur). Les formes se déclinent de la même manière que les noms de la première déclinaison latine, avec des terminaisons propres au grec. Pour l'initiation, on retient surtout le nominatif en <em>-η</em> ou <em>-α</em> et le génitif en <em>-ης</em> ou <em>-ας</em>.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Reconnais le cas de <em>λόγον</em>, <em>λόγου</em>, <em>λόγῳ</em>.</p>
<p><strong>Ex. 2 :</strong> Traduis : « <em>ὁ λόγος</em> » (nom. sg.) et « <em>τὸν λόγον</em> » (acc. sg.).</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> <em>λόγον</em> : accusatif singulier. <em>λόγου</em> : génitif singulier. <em>λόγῳ</em> : datif singulier. <strong>2)</strong> « le discours » ; « le discours » (en fonction COD).</p>

        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
