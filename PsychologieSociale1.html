        <div class="bloc-cas">
            <h3>Situation de départ</h3>
            <p>Dans une classe, un élève timide devient bavard dès qu'il est en petit groupe. Un autre, calme seul, devient agressif dans la cour. Comment expliquer ces changements ? La psychologie sociale peut-elle aider ?</p>

            <h3>Explication</h3>
            <p>La <strong>psychologie sociale</strong> étudie l'interaction et les phénomènes propres à la vie en groupe. Elle se situe entre la <strong>psychologie générale</strong>, qui étudie l'individu seul (mémoire, attention, émotions), et la <strong>sociologie</strong>, qui étudie les structures sociales (institutions, classes sociales).</p>

            <p>Trois concepts clés :</p>
            <ul>
                <li><strong>interaction :</strong> échange entre deux ou plusieurs personnes qui s'influencent mutuellement ;</li>
                <li><strong>groupe :</strong> ensemble de personnes en relation ;</li>
                <li><strong>influence :</strong> effet d'autrui sur nos pensées et nos actes.</li>
            </ul>

        <div class="bloc-cas">
            <h3>Situation de départ</h3>

            <h3>Objectifs spécifiques</h3>

                <li>Expliquer les mécanismes de la perception sociale.</li>

            <h3>Explication</h3>
            <p>Nous percevons les autres à travers des filtres. La <strong>perception sociale</strong> est la façon dont nous nous formons une impression sur autrui. Elle est rapide mais faillible.</p>
            <ul>
                <li><strong>Première impression :</strong> elle se forme très vite (parfois en quelques secondes) et influence la suite.</li>
                <li><strong>Effet de primauté :</strong> les premières informations pèsent davantage que les suivantes.</li>
                <li><strong>Effet de halo :</strong> une qualité positive (ou négative) colore toute la perception d'une personne. Exemple : croire qu'une personne bien habillée est forcément compétente.</li>
                <li><strong>Biais d'attribution :</strong> attribuer le comportement d'autrui à sa personnalité plutôt qu'à la situation (ex. : « il est en retard parce qu'il est paresseux » sans penser au transport).</li>
            </ul>
            <p>Ces biais sont normaux : ils nous aident à décider vite. Mais ils peuvent mener à des erreurs de jugement qu'il faut apprendre à reconnaître.</p>

                <li><strong>Première impression :</strong> jugement rapide formé à la rencontre.</li>
                <li><strong>Effet de primauté :</strong> poids plus fort des premières informations.</li>
                <li><strong>Effet de halo :</strong> généralisation à partir d'un seul trait perçu.</li>
                <li><strong>Biais d'attribution :</strong> tendance à expliquer le comportement d'autrui par sa personnalité plutôt que par la situation.</li>

<script>
(function () {
  var CFG = {"code":"PsychologieSociale1","base":"audio_files/","available":[1,2,3,4,5,6,7],"count":7,"sizeMo":11,"sizes":{"1":1934784,"2":1753920,"3":1667328,"4":1685184,"5":1661184,"6":1643712,"7":115392},"fallback":{"1":[["fr","Sommaire, Psychologie sociale. Présentation générale du cours. Titre: Psychologie sociale, initiation à la compréhension des interactions humaines. Niveau ou domaine: 1re année, domaine social. Note de positionnement. La psychologie sociale est officiellement enseignée en 3e année (Techniques Sociales) et en 4e année (Hôtesse d'Accueil) dans le programme national de R D C. Ce cours constitue une initiation adaptée au niveau 1re année: il se concentre sur les concepts de base (perception, attitudes, préjugés, groupes) et exclut les applications professionnelles spécialisées (protocole, accueil VIP, analyse transactionnelle). Objectifs généraux. Comprendre ce qu'est la psychologie sociale. Expliquer comment nous percevons les autres. Identifier les attitudes, préjugés et stéréotypes. Comprendre l'influence du groupe sur l'individu. Découvrir les bases de la dynamique de groupe. Compétences visées. Définir la psychologie sociale et la distinguer de la psychologie générale et de la sociologie. Expliquer les mécanismes de perception sociale. Reconnaître un préjugé et un stéréotype. Décrire l'effet du groupe sur le comportement individuel. Utiliser un vocabulaire psychosocial de base. Organisation des leçons. Leçon 1: Qu'est-ce que la psychologie sociale? Leçon 2: La perception sociale: comment voyons-nous les autres? Leçon 3: Attitudes, préjugés et stéréotypes. Leçon 4: L'individu dans le groupe: conformisme et obéissance. Leçon 5: Dynamique de groupe et leadership. Évaluation finale: 36 questions à choix multiple. Prérequis: notions de base de psychologie générale (si disponible); capacité d'observation et de description factuelle. Contextualisation R D C. Les situations utilisées dans ce cours sont tirées de la vie quotidienne: interactions dans les transports en commun, les marchés, les écoles; préjugés liés à l'origine ethnique, au genre ou au statut social; dynamiques de groupe dans les associations et les classes. Limites documentaires. Les programmes officiels complets de 3e et 4e années n'ont pas été consultés dans leur intégralité. L'adaptation au niveau 1re année est une sélection pédagogique. Le manque de documentation pour l'enseignement des psychologies au secondaire en R D C a été signalé. Plan d'images du cours. Identifiant. Leçon. Contenu visuel. Utilité. Emplacement. PsychologieSociale1_L1_01. L1. Schéma psychologie générale ou sociale ou sociologie. Distinction. Slide 1, bloc théorie. PsychologieSociale1_L2_01. L2. Deux photos illustrant l'effet de halo. Perception. Slide 2, bloc exemple. PsychologieSociale1_L3_01. L3. Tableau stéréotype ou préjugé ou discrimination. Distinction. Slide 3, bloc théorie. PsychologieSociale1_L4_01. L4. Schéma influence du groupe sur l'individu. Conformisme. Slide 4, bloc théorie. PsychologieSociale1_L5_01. L5. Styles de leadership (autoritaire ou démocratique ou laisser-faire). Dynamique de groupe. Slide 5, bloc théorie. Identifiants stables; images_ecolia.json non consulté à ce stade."]],"2":[["fr","Leçon 1, Qu'est-ce que la psychologie sociale? Situation de départ. Dans une classe, un élève timide devient bavard dès qu'il est en petit groupe. Un autre, calme seul, devient agressif dans la cour. Comment expliquer ces changements? La psychologie sociale peut-elle aider? Objectifs spécifiques. Définir la psychologie sociale. La distinguer de la psychologie générale et de la sociologie. Expliquer son objet: l'interaction. Explication. La psychologie sociale étudie l'interaction et les phénomènes propres à la vie en groupe. Elle se situe entre la psychologie générale, qui étudie l'individu seul (mémoire, attention, émotions), et la sociologie, qui étudie les structures sociales (institutions, classes sociales). L'être humain n'est pas seulement un individu: il est aussi un être social. La psychologie sociale cherche à comprendre comment la présence des autres, réelle ou imaginaire, modifie nos pensées, nos émotions et nos comportements. Elle ne juge pas: elle observe et explique. Trois concepts clés: interaction: échange entre deux ou plusieurs personnes qui s'influencent mutuellement; groupe: ensemble de personnes en relation; influence: effet d'autrui sur nos pensées et nos actes. [ Image PsychologieSociale1_L1_01: schéma psychologie générale ou psychologie sociale ou sociologie ]. La psychologie sociale se situe entre l'individu et la société. Notions et définitions. Psychologie sociale: étude de l'interaction et des phénomènes propres à la vie en groupe. Psychologie générale: étude de l'individu seul. Sociologie: étude des structures sociales. Interaction: échange mutuel entre personnes. Influence: effet d'autrui sur nos pensées et nos actes. Exemples concrets. Un élève qui travaille mieux en groupe qu'en solo. Un comportement différent dans une file d'attente bondée. L'influence des amis sur les choix vestimentaires. Un élève discret qui participe beaucoup en petit groupe de travail. Exercice d'application. Liste trois situations où le comportement d'une personne change selon qu'elle est seule ou en groupe. Explique ce qui change dans chaque situation. Indique laquelle relève de la psychologie sociale et pourquoi. Corrigé. 1. Réponses libres. Exemples: parler en classe ou en famille; se comporter en file d'attente; réagir dans une foule. 2. On vérifie que l'élève identifie la présence des autres comme facteur de changement. 3. Toutes relèvent de la psychologie sociale, car elles concernent l'effet de la présence d'autrui sur le comportement. À retenir. La psychologie sociale étudie l'interaction. Elle se situe entre l'individu et la société. Elle observe et explique les comportements en situation sociale. Sources utiles. Éléments de psychologie sociale, 3e Humanités Techniques Sociales (R D C, 2023), interaction, groupes, attitudes. Fiches pédagogiques de Psychologie Sociale, 4e année Hôtesse d'Accueil (Édition 2025), perception, communication. Limite: ces programmes ciblent la 3e/4e; l'adaptation en 1re est une sélection."]],"3":[["fr","Leçon 2, La perception sociale: comment voyons-nous les autres? Situation de départ. Deux élèves arrivent en retard le premier jour. L'un est bien habillé, l'autre a une chemise déchirée. Le professeur suppose que le premier est sérieux et le second négligent. Est-ce juste? Comment appelle-t-on ce phénomène? Objectifs spécifiques. Expliquer les mécanismes de la perception sociale. Identifier l'effet de primauté et l'effet de halo. Comprendre que la perception peut être biaisée. Explication. Nous percevons les autres à travers des filtres. La perception sociale est la façon dont nous nous formons une impression sur autrui. Elle est rapide mais faillible. Première impression: elle se forme très vite (parfois en quelques secondes) et influence la suite. Effet de primauté: les premières informations pèsent davantage que les suivantes. Effet de halo: une qualité positive (ou négative) colore toute la perception d'une personne. Exemple: croire qu'une personne bien habillée est forcément compétente. Biais d'attribution: attribuer le comportement d'autrui à sa personnalité plutôt qu'à la situation (ex.: « il est en retard parce qu'il est paresseux » sans penser au transport). Ces biais sont normaux: ils nous aident à décider vite. Mais ils peuvent mener à des erreurs de jugement qu'il faut apprendre à reconnaître. [ Image PsychologieSociale1_L2_01: deux photos illustrant l'effet de halo ]. La première impression influence souvent la suite du jugement. Notions et définitions. Perception sociale: façon dont nous nous formons une impression sur autrui. Première impression: jugement rapide formé à la rencontre. Effet de primauté: poids plus fort des premières informations. Effet de halo: généralisation à partir d'un seul trait perçu. Biais d'attribution: tendance à expliquer le comportement d'autrui par sa personnalité plutôt que par la situation. Exemples concrets. Juger un élève sur son uniforme. Supposer qu'une personne âgée est forcément sage. Croire qu'un vendeur souriant est honnête. Penser qu'un élève en retard est paresseux, sans savoir qu'il habite loin. Exercice d'application. Décris une personne en trois mots. Explique quels indices t'ont conduit à ces mots. Identifie un biais possible dans ton jugement. Corrigé. 1. Réponse libre. 2. On vérifie que l'élève cite des indices concrets (vêtement, expression, geste). 3. Un biais possible: effet de halo (si un trait a orienté tout le jugement), première impression, biais d'attribution. À retenir. La perception sociale est rapide mais faillible. Effet de halo et biais d'attribution faussent parfois nos jugements. Reconnaître ses biais permet de mieux juger. Sources utiles. Manuel de Psychologie Sociale, 4e année Hôtesse d'Accueil (chapitre 3: perception sociale). Cours de 3e Humanités Techniques Sociales (interaction, attitudes). Limite: ces références ciblent 3e/4e; l'adaptation en 1re est une simplification."]],"4":[["fr","Leçon 3, Attitudes, préjugés et stéréotypes. Situation de départ. Dans une école, certains disent: « Les élèves de telle région sont paresseux. » Est-ce un stéréotype, un préjugé ou une attitude? Quelle est la différence? Quel impact cela peut-il avoir? Objectifs spécifiques. Distinguer attitude, préjugé et stéréotype. Expliquer leurs effets sur le comportement. Proposer des moyens de réduire les préjugés. Explication. Ces notions sont proches mais distinctes: Attitude: tendance à réagir d'une certaine façon envers une personne, un groupe ou une idée. Elle comporte trois dimensions: croyance, émotion, comportement. Stéréotype: croyance généralisée sur un groupe (« les filles sont moins douées en sciences »). Préjugé: jugement préalable, souvent négatif, chargé d'émotion, formé avant de connaître réellement la personne. Discrimination: comportement injuste qui découle du préjugé (refuser, exclure, moquer). Les stéréotypes sont des raccourcis mentaux: ils simplifient la réalité, ce qui les rend parfois faux. Les préjugés ajoutent une dimension affective (sympathie ou antipathie). La discrimination est l'acte qui en résulte. La psychologie sociale montre que ces phénomènes sont appris et peuvent être déconstruits par l'information et le contact. [ Image PsychologieSociale1_L3_01: tableau comparatif stéréotype ou préjugé ou discrimination ]. Trois notions liées mais distinctes. Notions et définitions. Attitude: tendance stable à réagir d'une certaine façon. Stéréotype: croyance généralisée sur un groupe. Préjugé: jugement préalable, souvent négatif. Discrimination: comportement injuste envers un groupe. Déconstruction: remise en cause d'un stéréotype par l'information et le contact. Exemples concrets. Stéréotypes sur les filles en sciences. Préjugés liés à l'origine ethnique dans les transports. Discrimination à l'embauche. Discrimination à l'école: refuser de s'asseoir à côté d'un élève d'une autre origine. Exercice d'application. Identifie un stéréotype répandu dans ton entourage. Explique pourquoi il est simplificateur. Propose une action pour le déconstruire. Corrigé. 1. Réponse libre, par exemple: « les élèves d'un quartier donné sont paresseux ». 2. Il est simplificateur parce qu'il applique une caractéristique à tous les membres d'un groupe, sans tenir compte des différences individuelles ni du contexte. 3. Exemples d'action: information exacte en classe; contact positif avec des élèves du groupe concerné; discussion guidée. À retenir. Stéréotype, préjugé et discrimination sont liés mais distincts. Ils sont appris et peuvent être combattus. Les reconnaître est le premier pas. Sources utiles. Manuel de 4e année Hôtesse d'Accueil (chapitre 3.2). Cours de 3e Humanités Techniques Sociales (phénomènes de groupe). Limite: l'adaptation en 1re est une simplification."]],"5":[["fr","Leçon 4, L'individu dans le groupe: conformisme et obéissance. Situation de départ. Dans une classe, un élève sait qu'une réponse est fausse, mais tous ses camarades disent le contraire. Il finit par se taire. Pourquoi? Que se passe-t-il dans sa tête? Objectifs spécifiques. Expliquer l'influence du groupe sur l'individu. Comprendre le conformisme et l'obéissance. Identifier des situations où le groupe peut pousser à des comportements problématiques. Explication. Le groupe exerce une influence puissante sur l'individu: Norme sociale: règle implicite ou explicite qui guide le comportement du groupe. Conformisme: adopter le comportement du groupe, parfois contre son propre jugement. Il n'est pas toujours négatif: il permet la vie sociale (respect du code de la route, de la file d'attente). Mais il peut mener à des erreurs ou à des silences coupables. Obéissance: suivre les instructions d'une autorité. Elle peut aussi produire des comportements contraires aux valeurs personnelles, quand l'autorité donne une consigne contestable. Pression du groupe: force qui pousse à se conformer. La psychologie sociale étudie ces mécanismes pour aider à les reconnaître et à faire des choix plus libres. [ Image PsychologieSociale1_L4_01: schéma individu ou groupe ou norme ]. Le groupe exerce une influence souvent invisible sur l'individu. Notions et définitions. Groupe: ensemble de personnes en interaction avec un but commun. Norme sociale: règle implicite ou explicite du groupe. Conformisme: adoption du comportement du groupe. Obéissance: fait de suivre une autorité. Influence sociale: effet d'autrui sur nos pensées et nos actes. Pression du groupe: force qui pousse à se conformer. Exemples concrets. Un élève qui fume pour être accepté dans un groupe. Un groupe qui rit d'un camarade sans que personne n'ose intervenir. Une foule qui suit une rumeur. Un élève qui se tait en classe alors qu'il connaît la bonne réponse, parce que tout le monde a répondu autrement. Exercice d'application. Décris une situation où le groupe a influencé un choix individuel. Propose une stratégie pour résister à une influence négative. Donne un exemple de conformisme utile. Corrigé. 1. Réponse libre. 2. Exemples: prendre le temps de réfléchir avant de suivre; vérifier l'information; s'appuyer sur un adulte de confiance; oser exprimer un avis différent. 3. Exemples: respecter la file d'attente, suivre une consigne de sécurité, se conformer à une règle utile au groupe. À retenir. Le groupe influence l'individu. Le conformisme peut être utile ou problématique. Prendre conscience de cette influence permet de faire des choix plus libres. Sources utiles. Manuel de 4e année (dynamiques de groupe). Cours de 3e Humanités Techniques Sociales (influence sociale). Limite: les expériences classiques (Asch, Milgram) sont citées de mémoire, sans reproduction; l'adaptation est une simplification."]],"6":[["fr","Leçon 5, Dynamique de groupe et leadership. Situation de départ. Dans un groupe de projet scolaire, certains veulent tout décider, d'autres ne parlent jamais. Le groupe n'avance pas. Comment un leader peut-il aider? Objectifs spécifiques. Décrire les étapes de la vie d'un groupe. Distinguer différents styles de leadership. Comprendre l'importance des rôles et des normes. Explication. Un groupe n'est pas une simple somme d'individus. Il a une vie propre: il se forme, se structure, peut entrer en conflit et évoluer. Dynamique de groupe: étude de la vie et de l'évolution des groupes. Rôles: fonctions attendues des membres. Normes: règles partagées. Cohésion: liens qui unissent les membres. Trois styles de leadership classiques: Autoritaire: le chef décide seul, les membres exécutent. Démocratique: le chef fait participer, écoute, décide avec le groupe. Souvent plus efficace et plus satisfaisant pour les membres. Laisser-faire: le chef laisse faire sans direction claire; le groupe peut se disperser. Le leadership démocratique (facilitateur) est particulièrement adapté aux groupes scolaires et associatifs. [ Image PsychologieSociale1_L5_01: tableau comparatif des trois styles de leadership ]. Chaque style a ses effets sur la participation du groupe. Notions et définitions. Dynamique de groupe: étude de la vie et de l'évolution des groupes. Rôle: fonction attendue d'un membre. Norme: règle partagée. Cohésion: liens qui unissent les membres. Leadership autoritaire: décision centralisée par le chef. Leadership démocratique: décision partagée avec les membres. Leadership laisser-faire: absence de direction claire. Exemples concrets. Groupe de travail scolaire qui fonctionne bien vs groupe qui se dispute. Association de quartier avec un président autoritaire ou facilitateur. Équipe de football avec un capitaine qui écoute. Club d'élèves où les rôles sont clairement répartis. Exercice d'application. Observe un groupe (classe, équipe, club) et identifie ses rôles. Note deux normes implicites de ce groupe. Propose une amélioration pour renforcer la participation. Corrigé. 1. Réponse libre: on vérifie que l'élève nomme au moins trois rôles (animateur, secrétaire, membre actif, etc.). 2. Exemples: arriver à l'heure, ne pas couper la parole, prévenir en cas d'absence. 3. Exemples: instaurer un tour de table, répartir les tâches, alterner les responsabilités. À retenir. La dynamique de groupe est un processus. Le leadership démocratique favorise la participation. Rôles et normes structurent le groupe. Sources utiles. Cours de 3e Humanités Techniques Sociales (sociogramme, rôles, statuts). Documents sur la dynamique de groupe en R D C. Limite: l'adaptation en 1re est une simplification."]],"7":[["fr","Évaluation finale, Psychologie sociale. Évaluation finale. 36 questions à choix multiple. Une seule réponse est correcte par question. Choisis la réponse qui te semble juste, puis valide."]]}};

            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
