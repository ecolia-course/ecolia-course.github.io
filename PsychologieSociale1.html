    title: "Leçon 1 — Qu'est-ce que la psychologie sociale ? L'individu et le groupe",
    content: `
        <div class="bloc-cas">
            <h3>Situation de départ</h3>
            <p>Amina a 13 ans. À la maison, elle parle fort, plaisante et donne son avis. Le matin, devant le directeur de l'école, elle devient silencieuse et répond à voix basse. Le samedi, au marché avec sa grande sœur, elle redevient bavarde et négocie les prix.</p>
            <p>Amina est la même personne. Pourquoi se comporte-t-elle différemment selon les personnes présentes et selon le lieu ?</p>
        </div>

        <div class="bloc-theorie">
            <h3>Objectifs spécifiques</h3>
            <ul>
                <li>Définir la psychologie sociale avec ses propres mots.</li>
                <li>Distinguer la psychologie sociale de la psychologie générale et de la sociologie.</li>
                <li>Identifier des situations de la vie quotidienne où la psychologie sociale s'applique.</li>
            </ul>

            <h3>Explication</h3>
            <p>La psychologie sociale étudie <strong>les pensées, les sentiments et les comportements des individus lorsqu'ils sont en présence d'autres personnes</strong> — réellement, imaginairement, ou simplement parce qu'ils pensent à elles.</p>
            <p>Trois idées à retenir :</p>
            <ul>
                <li><strong>L'individu</strong> : on étudie une personne, pas seulement une foule.</li>
                <li><strong>La situation sociale</strong> : le comportement change selon le lieu, les personnes présentes et les attentes du groupe.</li>
                <li><strong>L'interaction</strong> : ce qui se passe entre les personnes compte autant que ce qui se passe dans leur tête.</li>
            </ul>
            <p>La psychologie sociale est une <strong>science</strong> : elle observe, formule des hypothèses et vérifie ses résultats par des méthodes reproductibles. Elle ne se contente pas d'opinions personnelles.</p>

            <h3>Différences avec les matières voisines</h3>
            <ul>
                <li><strong>Psychologie générale :</strong> s'intéresse surtout à l'individu seul (mémoire, attention, émotions).</li>
                <li><strong>Sociologie :</strong> s'intéresse surtout aux grandes structures de la société (institutions, classes sociales).</li>
                <li><strong>Psychologie sociale :</strong> s'intéresse au point de rencontre entre l'individu et le groupe.</li>
            </ul>

            <figure class="bloc-image" data-image-id="PsychologieSociale1_L1_01">

            </figure>

            <h3>Notions et définitions</h3>
            <ul>
                <li><strong>Psychologie sociale :</strong> science qui étudie les pensées, sentiments et comportements des individus en situation sociale.</li>
                <li><strong>Situation sociale :</strong> ensemble des personnes présentes, des règles du lieu et des attentes du moment.</li>
                <li><strong>Interaction :</strong> échange entre deux ou plusieurs personnes qui s'influencent mutuellement.</li>
                <li><strong>Groupe :</strong> ensemble de personnes qui interagissent, partagent un but et se reconnaissent comme membres.</li>
                <li><strong>Influence :</strong> effet qu'une personne ou un groupe produit sur les pensées ou les actes d'autrui.</li>
            </ul>

                <li>Un commerçant utilise un ton différent selon qu'il parle à un client habituel ou à un agent de l'administration.</li>
                <li>Lors d'une campagne de sensibilisation, les gens écoutent plus volontiers quelqu'un qu'ils connaissent déjà que quelqu'un qu'ils ne connaissent pas.</li>

            </ol>

                <p><strong>2.</strong> La mémoire des chiffres chez un adulte seul relève de la psychologie générale ; la façon dont un groupe de classe prend une décision relève de la psychologie sociale ; la répartition des revenus dans un pays relève de la sociologie ou de l'économie.</p>
                <p><strong>3.</strong> Parce que les opinions communes peuvent être fausses. La psychologie sociale observe, mesure et vérifie ses résultats avant d'affirmer.</p>

    title: "Leçon 2 — La perception d'autrui : stéréotypes, préjugés, discrimination",
    content: `
        <div class="bloc-cas">
            <h3>Situation de départ</h3>
            <p>Un nouvel élève arrive dans la classe. Il vient d'une autre province. Avant même de lui avoir parlé, plusieurs élèves disent : « Ceux de là-bas sont tous comme ci, ils sont comme ça. »</p>
            <p>Deux semaines plus tard, on refuse de le prendre dans l'équipe de classe « parce que les gens de sa région ne sont pas sérieux ». Que s'est-il passé entre la première phrase et le refus ?</p>
        </div>

        <div class="bloc-theorie">
            <h3>Objectifs spécifiques</h3>
            <ul>
                <li>Définir un stéréotype, un préjugé et la discrimination.</li>
                <li>Distinguer ces trois notions dans des exemples concrets.</li>
                <li>Reconnaître les conséquences d'un préjugé sur une personne.</li>
            </ul>

            <h3>Explication</h3>
            <p>Pour comprendre les autres, notre esprit simplifie. Ce mécanisme est normal et souvent utile, mais il peut produire des erreurs.</p>
            <ul>
                <li><strong>La catégorisation sociale :</strong> classer les personnes par groupes (âge, sexe, métier, origine, langue).</li>
                <li><strong>Le stéréotype :</strong> une croyance simplifiée et générale appliquée à tous les membres d'un groupe. Exemple : « les élèves de cette école sont paresseux ».</li>
                <li><strong>Le préjugé :</strong> un jugement affectif, souvent négatif, formé à l'avance, avant même de connaître la personne. Il comporte une émotion (méfiance, peur, mépris).</li>
                <li><strong>La discrimination :</strong> un comportement concret qui traite défavorablement une personne à cause de son groupe. Exemple : refuser une place dans une équipe, une location, un service.</li>
            </ul>
            <p>Le lien entre les trois est souvent le suivant : <strong>stéréotype (croyance) → préjugé (jugement et émotion) → discrimination (acte)</strong>. Mais le passage à l'acte n'est pas automatique : une personne peut avoir un préjugé et ne pas discriminer.</p>
            <p>Un autre effet important est la <strong>prophétie autoréalisatrice</strong> : quand on répète à un élève qu'il est « nul » dans une matière, il peut finir par y croire et abandonner.</p>

            <figure class="bloc-image" data-image-id="PsychologieSociale1_L2_01">
                <div class="image-cadre">[ Image PsychologieSociale1_L2_01 : tableau à trois colonnes stéréotype / préjugé / discrimination avec un exemple par colonne ]</div>
                <figcaption>Trois notions différentes : croyance, jugement, acte.</figcaption>
            </figure>

            <h3>Notions et définitions</h3>
            <ul>
                <li><strong>Stéréotype :</strong> croyance générale et simplifiée sur un groupe.</li>
                <li><strong>Préjugé :</strong> jugement formé à l'avance, chargé d'émotion, sans connaissance réelle.</li>
                <li><strong>Discrimination :</strong> traitement inégal et défavorable appliqué à une personne du fait de son groupe.</li>
                <li><strong>Identité sociale :</strong> partie de notre identité qui vient de notre appartenance à des groupes.</li>
                <li><strong>Prophétie autoréalisatrice :</strong> attente répétée qui finit par produire le comportement attendu.</li>
            </ul>
        </div>

        <div class="bloc-exemple">
            <h3>Exemples concrets</h3>
            <ul>
                <li>Dire que les filles sont naturellement moins douées en électricité : c'est un <strong>stéréotype</strong>.</li>
                <li>Éprouver de la méfiance envers un nouvel élève venant d'une autre province : c'est un <strong>préjugé</strong>.</li>
                <li>Refuser une élève dans un atelier de mécanique à cause de son sexe : c'est une <strong>discrimination</strong>.</li>
                <li>Se moquer régulièrement d'un élève qui bégaie : c'est une discrimination qui se répète et blesse.</li>
                <li>Un élève à qui on répète qu'il ne réussira jamais en mathématiques peut effectivement arrêter d'essayer : c'est une prophétie autoréalisatrice.</li>
            </ul>
        </div>

        <div class="bloc-resume">

            <p>Classe chaque affirmation dans la bonne catégorie : stéréotype, préjugé ou discrimination.</p>

                <p><strong>3.</strong> Discrimination : c'est un acte, refus d'un droit ou d'un service.</p>
                <p><strong>4.</strong> Stéréotype (et préjugé, car il comporte une charge de peur et de méfiance). L'élève peut accepter les deux, à condition de justifier.</p>
            </details>
        </div>

        <div class="bloc-resume">
            <h3>À retenir</h3>

    title: "Leçon 3 — L'influence sociale : conformisme, obéissance, persuasion",
    content: `
        <div class="bloc-cas">
            <h3>Situation de départ</h3>
            <p>En classe, l'enseignant demande : « Cet exercice était difficile ? » Une majorité d'élèves répond aussitôt : « Non, c'était facile ! » Josué, qui n'a pas compris, hésite, puis dit comme les autres : « Facile. »</p>
            <p>Personne ne l'a obligé. Pourquoi a-t-il répondu ainsi ?</p>
        </div>

        <div class="bloc-theorie">
            <h3>Objectifs spécifiques</h3>
            <ul>
                <li>Définir l'influence sociale et en distinguer trois formes : conformisme, obéissance, persuasion.</li>
                <li>Identifier une situation d'influence dans la vie de l'école et du quartier.</li>
                <li>Comprendre que l'influence peut être positive ou négative.</li>
            </ul>

            <h3>Explication</h3>
            <p>L'<strong>influence sociale</strong> est l'effet qu'une personne ou un groupe produit sur les pensées, les émotions ou les comportements d'autrui. Elle fait partie de la vie normale : nous influençons et nous sommes influencés.</p>
            <ul>
                <li><strong>Le conformisme :</strong> adopter le comportement ou l'avis de la majorité du groupe, parfois contre son propre jugement. Les travaux classiques d'Asch (1951) ont montré que des personnes peuvent donner une réponse fausse simplement parce que le groupe la donne.</li>
                <li><strong>L'obéissance :</strong> suivre les instructions d'une figure d'autorité (enseignant, chef, adulte). Les travaux de Milgram (1963) ont montré que des personnes ordinaires peuvent obéir à des consignes contestables, parce qu'elles font confiance à l'autorité. Obéir n'est pas toujours mauvais : sans obéissance, aucune règle de sécurité ne serait respectée.</li>
                <li><strong>La persuasion :</strong> chercher à changer l'opinion ou le comportement d'une personne par un message. Elle dépend de la source (qui parle), du message (comment il est dit) et de celui qui reçoit.</li>
            </ul>
            <p>Il existe aussi une <strong>influence positive</strong> : un groupe qui encourage à étudier, qui refuse la tricherie, qui soutient un élève en difficulté.</p>

            <figure class="bloc-image" data-image-id="PsychologieSociale1_L3_01">
                <div class="image-cadre">[ Image PsychologieSociale1_L3_01 : dessin d'un groupe qui parle et d'un élève qui hésite à lever la main ]</div>
                <figcaption>Le silence ou l'accord apparent n'est pas toujours l'expression d'un avis personnel.</figcaption>
            </figure>

            <h3>Notions et définitions</h3>
            <ul>
                <li><strong>Influence sociale :</strong> effet d'autrui sur nos pensées et nos actes.</li>
                <li><strong>Conformisme :</strong> alignement sur la majorité du groupe.</li>
                <li><strong>Obéissance :</strong> exécution d'une consigne venue d'une autorité.</li>
                <li><strong>Persuasion :</strong> tentative de changement d'opinion par un message argumenté.</li>
                <li><strong>Influence minoritaire :</strong> capacité d'une personne ou d'un petit groupe à faire changer l'avis de la majorité, en restant cohérent.</li>
            </ul>
        </div>

        <div class="bloc-exemple">
            <h3>Exemples concrets</h3>
            <ul>
                <li>Un élève fume pour ne pas être rejeté par son groupe de quartier : conformisme.</li>
                <li>Des élèves respectent une consigne de propreté donnée par le préfet : obéissance.</li>
                <li>Une campagne de sensibilisation au lavage des mains utilise un message simple et un animateur connu du quartier : persuasion.</li>
                <li>Une seule élève affirme calmement qu'elle refusera de tricher, et plusieurs camarades changent d'avis : influence minoritaire.</li>
                <li>Un club d'élèves qui se félicite mutuellement pour les progrès scolaires : influence positive.</li>
            </ul>
        </div>

        <div class="bloc-resume">
            <h3>Exercice d'application</h3>
            <ol>
                <li>Dans la situation de départ, Josué est-il sous conformisme, obéissance ou persuasion ? Justifie.</li>
                <li>Cite une situation où il est utile d'obéir.</li>
                <li>Donne un exemple d'influence positive dans ton école.</li>

                <p><strong>3.</strong> Réponse personnelle : un groupe qui pousse à terminer les devoirs, une équipe qui refuse la moquerie envers un camarade.</p>
            </details>
        </div>

        <div class="bloc-resume">
            <h3>À retenir</h3>
            <ul>
                <li>L'influence sociale est normale : nous sommes toujours dans un contexte social.</li>
                <li>Conformisme et obéissance ne sont pas toujours négatifs : tout dépend de la situation et de la consigne.</li>
                <li>Un petit nombre peut faire changer un groupe s'il reste cohérent et argumente.</li>
            </ul>
        </div>

                <li>Limite : ces expériences classiques ont été réalisées dans d'autres contextes ; elles sont ici présentées de façon simplifiée et illustrative, sans les reproduire.</li>

        <div class="bloc-cas">
            <h3>Situation de départ</h3>
            <p>Le club environnemental de l'école compte douze élèves. Chacun veut organiser la journée de propreté à sa manière. Certains veulent balayer le matin, d'autres l'après-midi. Personne ne sait qui doit apporter les outils. Résultat : le jour prévu, presque rien n'a été fait et deux élèves se sont disputés.</p>
            <p>Qu'est-ce qui a manqué à ce groupe ?</p>
        </div>

        <div class="bloc-theorie">
            <h3>Objectifs spécifiques</h3>
            <ul>
                <li>Reconnaître les éléments qui font d'un ensemble de personnes un groupe.</li>
                <li>Identifier les normes et les rôles dans un groupe.</li>
                <li>Distinguer coopération et compétition, et comprendre qu'un conflit peut être géré.</li>
            </ul>

            <h3>Explication</h3>
            <p>Un <strong>groupe</strong> n'est pas une simple addition de personnes. Pour parler de groupe, il faut en général :</p>
            <ul>
                <li>des <strong>interactions régulières</strong> entre les membres ;</li>
                <li>un <strong>but commun</strong> ;</li>
                <li>des <strong>normes</strong> partagées ;</li>
                <li>la conscience d'appartenir au même ensemble.</li>
            </ul>
            <p>Les <strong>normes</strong> sont des règles qui guident le comportement. Elles peuvent être écrites (règlement du club) ou implicites (arriver à l'heure, ne pas couper la parole).</p>
            <p>Les <strong>rôles</strong> sont les fonctions attendues de chacun : animateur, secrétaire, trésorier, rapporteur. Quand les rôles sont clairs, le groupe avance ; quand ils sont flous, les tâches se répètent ou personne ne les fait.</p>
            <p>La <strong>coopération</strong> consiste à travailler ensemble vers un but commun. La <strong>compétition</strong> oppose des personnes ou des groupes pour un même objectif ou une même ressource. Les deux peuvent exister, mais la coopération construit davantage la confiance.</p>
            <p>Le <strong>conflit</strong> n'est pas forcément un échec : c'est une opposition entre des intérêts ou des points de vue. Bien géré, par le dialogue et des règles claires, il permet de trouver de meilleures solutions. Mal géré, il divise le groupe.</p>

            <figure class="bloc-image" data-image-id="PsychologieSociale1_L4_01">

            <h3>Notions et définitions</h3>

                <li><strong>Groupe :</strong> ensemble de personnes en interaction, avec un but commun et des normes.</li>
                <li><strong>Norme sociale :</strong> règle partagée, écrite ou implicite, qui guide les comportements.</li>
                <li><strong>Rôle :</strong> fonction attendue d'un membre dans le groupe.</li>
                <li><strong>Cohésion :</strong> force qui unit les membres du groupe.</li>
                <li><strong>Coopération :</strong> travail commun vers un but partagé.</li>
                <li><strong>Conflit :</strong> opposition entre des personnes ou des groupes aux intérêts différents.</li>
            </ul>
        </div>

                <li><strong>comportementale :</strong> ce que je fais (éviter, refuser, se moquer).</li>
            </ul>

            <p>Le changement d'attitude peut venir de plusieurs facteurs :</p>

            <p>La <strong>dissonance cognitive</strong> (Festinger, 1957) désigne le malaise ressenti quand nos idées et nos actes ne sont pas cohérents. Ce malaise pousse souvent à modifier soit l'idée, soit le comportement. C'est une notion simplifiée ici, sans entrer dans les détails expérimentaux.</p>

    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
