const slides = [
{
    title: "Sommaire — Comptabilité Analytique",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours de comptabilité analytique couvre cinq leçons essentielles : l'objet et l'intérêt de la comptabilité analytique, la classification et le traitement des charges, le calcul des coûts (achat, production, revient), le résultat analytique, et la comptabilité analytique comme outil de gestion et de décision.</p>
<p><strong>Note :</strong> le programme officiel RDC spécifique à la Comptabilité Analytique pour la 2e année commerciale n'a pas été consulté dans son intégralité. La progression s'appuie sur le SYSCOHADA révisé (2017) et sur les manuels de la filière commerciale. Les exercices chiffrés devront être construits avec des données réalistes et vérifiées.</p>
<ul>
<li>Leçon 1 — Objet et intérêt de la comptabilité analytique</li>
<li>Leçon 2 — Classification et traitement des charges</li>
<li>Leçon 3 — Calcul des coûts : achat, production, revient</li>
<li>Leçon 4 — Le résultat analytique</li>
<li>Leçon 5 — La comptabilité analytique comme outil de décision</li>
</ul>
<p>Une évaluation finale de 20 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> SYSCOHADA révisé (Acte uniforme OHADA, 2017) ; manuels de comptabilité analytique (filière commerciale RDC) ; ressources pédagogiques RDC (Schoolap, EDUQUAM).</div>
    `
},
{
    title: "Leçon 1 — Objet et intérêt de la comptabilité analytique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« La comptabilité générale suffit-elle à savoir si un produit est rentable ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la comptabilité analytique. La distinguer de la comptabilité générale. Connaître ses finalités et ses limites. Prérequis : bases de comptabilité générale.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Comptabilité analytique :</strong> branche de la comptabilité qui organise les charges internes de l'entreprise pour calculer le coût des produits, des services ou des activités.</p>
<p><strong>Différences avec la comptabilité générale :</strong></p>
<ul>
<li><strong>Comptabilité générale :</strong> enregistre les flux avec l'extérieur ; obligatoire ; produit les états financiers.</li>
<li><strong>Comptabilité analytique :</strong> analyse les charges internes ; non obligatoire selon le SYSCOHADA révisé ; outil de gestion.</li>
</ul>
<p><strong>Finalités :</strong></p>
<ul>
<li>Calculer les coûts (achat, production, revient).</li>
<li>Contrôler les performances internes.</li>
<li>Aider à la décision (prix, choix de production, externalisation).</li>
<li>Évaluer les stocks et les en-cours.</li>
</ul>
<p><strong>Limites :</strong> subjectivité des clés de répartition ; lourdeur de mise en œuvre ; nécessité d'adaptation au contexte.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Comptabilité analytique :</strong> analyse interne des charges pour calculer les coûts. <strong>Coût :</strong> somme de charges affectées à un produit ou une activité. <strong>Outil de gestion :</strong> instrument d'aide à la décision.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Distinguer les deux comptabilités par leur objet et leur finalité. Situer la comptabilité analytique du côté de la gestion interne. Comprendre qu'elle n'est pas obligatoire mais utile.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une boulangerie de Kinshasa veut savoir si la production de pain est rentable. La comptabilité analytique lui permet de calculer le coût de revient d'une baguette (farine, levure, énergie, main-d'œuvre, amortissement du four).</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la principale différence entre comptabilité générale et analytique ? <strong>Ex. 2 :</strong> Citer deux finalités de la comptabilité analytique.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> La comptabilité générale enregistre les flux externes ; l'analytique analyse les charges internes pour calculer les coûts. <strong>2)</strong> Calculer les coûts et aider à la décision (autres réponses possibles).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La comptabilité analytique répond à la question : « Combien coûte ce que je produis ? »</p></div>

<div class="sources"><strong>Sources :</strong> SYSCOHADA révisé (2017) ; manuels de comptabilité analytique (filière commerciale RDC).</div>
    `
},
{
    title: "Leçon 2 — Classification et traitement des charges",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi le loyer de l'atelier ne peut-il pas être affecté directement à un seul produit ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer charges directes et indirectes, fixes et variables. Comprendre les centres d'analyse et les clés de répartition. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Charges directes :</strong> affectables sans calcul à un coût précis. Ex. : matières premières, main-d'œuvre directe.</p>
<p><strong>Charges indirectes :</strong> concernent plusieurs produits et doivent être réparties. Ex. : loyer, électricité de l'atelier, salaire du directeur.</p>
<p><strong>Charges fixes :</strong> indépendantes du volume produit (loyer).</p>
<p><strong>Charges variables :</strong> dépendent du volume produit (matières premières).</p>
<p><strong>Centres d'analyse (ou sections) :</strong> regroupent les charges indirectes par fonction ou par activité (approvisionnement, production, distribution).</p>
<p><strong>Clés de répartition :</strong> critères utilisés pour répartir les charges indirectes (nombre d'heures, surface, chiffre d'affaires, effectif).</p>
<p><strong>Unité d'œuvre :</strong> unité de mesure utilisée pour imputer les charges d'un centre aux coûts (heure de travail, kg de matière, unité produite).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Charge directe :</strong> affectable sans calcul. <strong>Charge indirecte :</strong> à répartir. <strong>Centre d'analyse :</strong> regroupement de charges indirectes. <strong>Unité d'œuvre :</strong> base d'imputation.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Classer chaque charge selon sa nature (directe/indirecte) et son comportement (fixe/variable). Choisir une clé de répartition pertinente. Vérifier que la somme des charges réparties égale le total.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Dans une menuiserie de Lubumbashi, le bois est une charge directe ; l'électricité de l'atelier est une charge indirecte répartie entre les commandes selon le nombre d'heures de travail.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qu'est-ce qu'une charge directe ? <strong>Ex. 2 :</strong> Proposer une clé de répartition pour le loyer d'un atelier produisant trois modèles de meubles.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Une charge affectable sans calcul à un produit. <strong>2)</strong> La surface occupée par chaque modèle (autres réponses possibles : nombre d'heures, chiffre d'affaires).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Directe = affectable sans calcul ; indirecte = à répartir selon une clé.</p></div>

<div class="sources"><strong>Sources :</strong> SYSCOHADA révisé (2017).</div>
    `
},
{
    title: "Leçon 3 — Calcul des coûts : achat, production, revient",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment savoir combien coûte réellement un produit jusqu'à sa vente ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Calculer les coûts d'achat, de production et de revient. Comprendre la construction des coûts par accumulation. Prérequis : leçon 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Coût d'achat :</strong> prix d'achat + frais accessoires (transport, douane, manutention).</p>
<p><strong>Coût de production :</strong> coût d'achat des matières consommées + charges de production (main-d'œuvre, énergie, amortissement).</p>
<p><strong>Coût de revient :</strong> coût de production des produits vendus + charges de distribution (transport, commercialisation).</p>
<p><strong>En-cours de production :</strong> produits non achevés à la fin de la période ; ils doivent être valorisés et retirés du coût de production de la période.</p>
<p><strong>Valorisation des stocks :</strong> coût moyen pondéré, FIFO (premier entré, premier sorti), etc.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Coût d'achat :</strong> prix + frais accessoires. <strong>Coût de production :</strong> coût d'achat + charges de production. <strong>Coût de revient :</strong> coût complet jusqu'à la vente.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Construire le coût par accumulation progressive. Inclure les frais accessoires. Tenir compte des en-cours. Vérifier la cohérence entre les étapes.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une entreprise de Kinshasa achète du tissu à 50 000 FC (coût d'achat), le transforme en chemises (20 000 FC de main-d'œuvre pour le coût de production), puis les vend (5 000 FC de transport pour le coût de revient). Coût de revient total = 75 000 FC pour un lot.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Que comprend le coût d'achat ? <strong>Ex. 2 :</strong> Pourquoi le coût de revient inclut-il les charges de distribution ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Prix d'achat et frais accessoires. <strong>2)</strong> Parce qu'il représente le coût complet du produit jusqu'à sa vente.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le coût de revient est le coût complet d'un produit jusqu'à sa vente.</p></div>

<div class="sources"><strong>Sources :</strong> SYSCOHADA révisé (2017) ; manuels de comptabilité analytique.</div>
    `
},
{
    title: "Leçon 4 — Le résultat analytique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment savoir si un produit est rentable alors que l'entreprise est globalement bénéficiaire ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Calculer un résultat analytique. Interpréter un résultat par produit. Comprendre la marge sur coût variable et le seuil de rentabilité. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Résultat analytique :</strong> chiffre d'affaires − coût de revient. Il peut être calculé par produit, par activité, par centre.</p>
<p><strong>Marge sur coût variable :</strong> chiffre d'affaires − charges variables. Elle sert à couvrir les charges fixes et à dégager le résultat.</p>
<p><strong>Seuil de rentabilité (initiation) :</strong> niveau de chiffre d'affaires à partir duquel l'entreprise couvre la totalité de ses charges (résultat = 0).</p>
<p><strong>Interprétation :</strong> un résultat analytique négatif n'implique pas nécessairement l'abandon du produit ; il peut s'agir d'un produit d'appel ou d'une répartition de charges à revoir.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Résultat analytique :</strong> CA − coût de revient. <strong>Marge sur coût variable :</strong> CA − charges variables. <strong>Seuil de rentabilité :</strong> CA minimum pour un résultat nul.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Calculer le résultat par produit, pas seulement globalement. Comparer les résultats pour identifier les produits rentables. Interpréter avec prudence : ne pas décider sur un seul chiffre.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une PME de Kinshasa vend trois produits. Le produit A dégage un bénéfice, le produit B est à l'équilibre, le produit C est déficitaire. L'analyse du coût de revient de C montre que ses charges de distribution sont trop élevées.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Comment se calcule le résultat analytique ? <strong>Ex. 2 :</strong> Pourquoi ne faut-il pas abandonner systématiquement un produit à résultat négatif ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> CA − coût de revient. <strong>2)</strong> Il peut être un produit d'appel ou révéler une répartition de charges à corriger.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le résultat analytique éclaire la décision : il ne se contente pas de constater, il explique.</p></div>

<div class="sources"><strong>Sources :</strong> SYSCOHADA révisé (2017) ; manuels de comptabilité analytique.</div>
    `
},
{
    title: "Leçon 5 — La comptabilité analytique comme outil de décision",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« À quoi sert de calculer des coûts si l'on ne prend pas de décision ensuite ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le rôle de la comptabilité analytique dans la décision. Comparer coût préétabli et coût réel. Connaître ses limites. Prérequis : leçons 1 à 4.</p></div>

<p><strong>Coût préétabli / coût réel :</strong> la comparaison entre les deux permet de dégager des écarts et d'analyser les causes (hausse des prix, gaspillage, mauvaise organisation).</p>
<p><strong>Décisions appuyées par l'analytique :</strong></p>
<ul>

<li>Décision d'externaliser ou de produire soi-même.</li>

    var txtEl = banner.querySelector(".eab-txt"), actEl = banner.querySelector(".eab-act");
    var barEl = banner.querySelector(".eab-bar"), barI = barEl.firstChild;
    var audio = new Audio();
    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }
    function cur() { try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {} return 0; }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
