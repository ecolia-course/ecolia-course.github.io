        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');

vente. Sécurité alimentaire: accès à une nourriture suffisante et saine. Défis: difficultés à surmonter. Exemples concrets. Maïs du Haut-Katanga. Manioc et vivrier du Kasaï. Cultures de rente (café, cacao). Agriculture familiale. Exercice d'application. Liste trois rôles de l'agriculture. Cite deux défis dans ta région. Propose une action simple pour améliorer la production locale. Corrigé. 1. Nourrir, créer des emplois, fournir des revenus. 2. Exemples: sols pauvres, manque d'eau, érosion. 3. Exemple: organiser un petit jardin scolaire avec du compost. À retenir. L'agriculture est un pilier économique et social. Elle doit relever des défis structurels. Distinguer vivrier et rente. Sources utiles. Fiches pédagogiques Agriculture, 1re année, option Agriculture générale (Édition 2025). Curriculum Agriculture générale (BSF, 2018). Limite: l'adaptation en 1re est une simplification."]],"3":[["fr","Leçon 2, Les facteurs du milieu: climat, sol et relief. Situation de départ. Deux élèves comparent la culture du maïs dans deux régions: l'une réussit bien, l'autre non. Pourquoi le même maïs ne pousse-t-il pas partout? Objectifs spécifiques. Identifier les facteurs naturels qui influencent l'agriculture. Comprendre leur impact sur le choix des cultures. Observer ces facteurs dans son environnement. Explication. Chaque culture a des exigences: le maïs a besoin de chaleur et d'eau; le manioc tolère des sols pauvres; le riz préfère les bas-fonds humides. Le relief influence l'érosion et la disponibilité en eau. Le sol fournit les nutriments. Le climat apporte la pluie et la chaleur. Observer ces facteurs permet de choisir la culture adaptée. [ Image AgricultureGenerale1_L2_01: schéma des facteurs du milieu ]. Climat, sol et relief déterminent les cultures possibles. Notions et définitions. Climat: pluie, température, saisons. Sol: support et source de nutriments. Relief: forme du terrain (pente, bas-fond). Facteur limitant: élément qui freine la production. Adaptation des cultures: choix selon le milieu. Exemples concrets. Érosion sur les pentes du Kivu. Cultures de bas-fonds dans la plaine de la Ruzizi. Sables des Bateke (sols pauvres). Exercice d'application. Décris les facteurs du milieu de ton école ou village (pluie, sol visible, relief). Propose deux cultures adaptées. Indique un facteur limitant. Corrigé. On vérifie que: les facteurs sont décrits; les cultures sont adaptées (ex. manioc sur sol pauvre, riz en bas-fond); le facteur limitant est identifié (ex. pente, sécheresse). À retenir. L'agriculture réussie repose sur l'adaptation au milieu. Chaque culture a ses exigences. Observer avant de cultiver. Sources utiles. Fiches 1re année (facteurs climatiques, types de sols). Limite: l'adaptation en 1re est une simplification."]],"4":[["fr","Leçon 3, Les outils et les travaux de base: du défrichage au semis. Situation de départ. Une parcelle-école est en friche. Par où commencer? Quels outils utiliser dans quel ordre? Objectifs spécifiques. Nommer les outils manuels de base. Décrire les étapes d'une culture. Exécuter un geste simple en sécurité. Explication. La mise en culture suit un ordre: défrichage: enlever la végétation; labour: aérer le sol; préparation du lit de semence; semis; entretien. Outils de base: houe, machette, râteau, arrosoir, cordeau. La sécurité évite les accidents (coupures, chutes). [ Image AgricultureGenerale1_L3_01: planche des outils manuels de base ]. Chaque outil a une fonction précise. Notions et définitions. Défrichage: enlèvement de la végétation avant culture. Labour: travail du sol pour l'aérer. Hersage: nivellement et préparation fine. Semis: mise en terre des graines. Entretien: sarclage, arrosage. Outils manuels: houe, machette, râteau, arrosoir. Exemples concrets. Travaux sur la parcelle-école avec houe et machette. Semis d'amarante ou de maïs à cycle court. Arrosage avec un arrosoir ou une calebasse. Exercice d'application. Sur une petite parcelle ou un bac, réalise un labour léger. Effectue un semis (sous surveillance). Note les étapes dans un carnet. Corrigé. On vérifie que: les étapes sont réalisées dans l'ordre; le semis est régulier; l'élève note les étapes. À retenir. Les gestes de base sont la fondation de la production. Chaque outil a une fonction. La sécurité protège l'élève. Sources utiles. Fiches 1re année (outils, parcelle-école). Limite: l'adaptation en 1re est une simplification."]],"5":[["fr","Leçon 4, Les systèmes de culture: monoculture, polyculture et rotation. Situation de départ. Un paysan cultive du maïs sur toute sa parcelle chaque année. Un autre alterne maïs et haricots. Lequel a le sol le plus sain à long terme? Pourquoi? Objectifs spécifiques. Distinguer monoculture et polyculture. Expliquer l'intérêt de la rotation et de l'association des cultures. Identifier le système dominant dans sa région. Explication. La monoculture répétée épuise le sol et favorise les maladies. La polyculture et la rotation diversifient les cultures, enrichissent le sol (légumineuses) et réduisent les risques. La jachère permet au sol de se reposer. [ Image AgricultureGenerale1_L4_01: comparaison monoculture ou polyculture ]. Diversifier les cultures est une stratégie de durabilité. Notions et définitions. Monoculture: une seule culture sur la parcelle. Polyculture: plusieurs cultures sur la parcelle. Association de cultures: cultures simultanées. Rotation: alternance des cultures dans le temps. Jachère: période de repos du sol. Fertilité du sol: capacité à nourrir les plantes. Exemples concrets. Monoculture du maïs au Haut-Katanga. Polyculture vivrière au Kasaï. Association maïs-haricot. Jachère en agriculture itinérante. Exercice d'application. Compare deux parcelles (monoculture vs polyculture) sur un schéma. Propose une rotation simple pour deux cultures. Indique un avantage de la rotation. Corrigé. On vérifie que: la comparaison est correcte; la rotation proposée est cohérente (ex. maïs, haricot); l'avantage est cité (fertilité, maladies). À retenir. Diversifier les cultures est une stratégie de durabilité. La monoculture épuise le sol. La rotation rompt le cycle des maladies. Sources utiles. Fiches 1re année (systèmes de culture). Phytotechnie spéciale (définitions). Limite: l'adaptation en 1re est une simplification."]],"6":[["fr","Leçon 5, Durabilité et sécurité alimentaire: conserver le sol et produire pour tous. Situation de départ. Après plusieurs années de culture, une parcelle produit de moins en moins. Le sol s'est-il fatigué? Que peut-on faire sans engrais chimiques coûteux? Objectifs spécifiques. Comprendre les causes de la dégradation des sols. Proposer des pratiques simples de conservation. Expliquer le lien entre agriculture durable et sécurité alimentaire. Explication. La dégradation des sols (érosion, perte de fertilité) menace la production. Des pratiques simples peuvent restaurer la fertilité: compost; couverture du sol par des résidus; agroforesterie; rotation. Ces pratiques sont accessibles et durables. La sécurité alimentaire dépend de la capacité à produire sans épuiser les ressources. [ Image AgricultureGenerale1_L5_01: cycle du compost et érosion ravinante ]. Produire durablement, c'est préserver le sol. Notions et définitions. Dégradation des sols: perte de fertilité. Érosion: emportement de la couche fertile. Compost: engrais organique issu de déchets décomposés. Couverture végétale: protection du sol par des résidus. Agroforesterie: association arbres-cultures. Sécurité alimentaire: accès à une nourriture suffisante. Exemples concrets. Érosion ravinante à Kananga et Kikwit. Compost à base de déchets organiques. Agroforesterie sur les pentes du Kivu. Exercice d'application. Propose trois pratiques de conservation adaptées à une parcelle de ton milieu. Explique leur effet sur le sol. Indique un avantage pour la sécurité alimentaire. Corrigé. On vérifie que: les pratiques sont adaptées; l'effet est expliqué (fertilité, protection contre l'érosion); l'avantage est cité (meilleure production, durabilité). À retenir. Produire durablement, c'est préserver le sol. Les solutions locales existent. La sécurité alimentaire dépend de la durabilité. Sources utiles. Fiches 1re année (durabilité, parcelle-école). Fiches de Pédologie (conservation des sols). Limite: l'adaptation en 1re est une simplification."]],"7":[["fr","Évaluation finale, Agriculture générale. Évaluation finale. 36 questions à choix multiple. Une seule réponse est correcte par question. Choisis la réponse qui te semble juste, puis valide."]]}};

      txtEl.textContent = text;
      actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; }
      else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }

    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }

    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial"
        ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet."
        : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
