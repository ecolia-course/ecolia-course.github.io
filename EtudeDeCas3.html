<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours présente la méthode de l'étude de cas : lire et analyser une situation sociale complexe, identifier les acteurs et les enjeux, formuler des hypothèses, proposer des solutions argumentées, rédiger un rapport. C'est un outil transversal, utile dans les autres cours de l'option Sociale.</p>
<p><strong>Note de transparence :</strong> l'étude de cas est une méthode pédagogique préconisée dans les manuels officiels de Techniques Sociales (notamment le manuel de Techniques d'Animation 1ère TS, qui recommande « des mises en situation pratiques, des études de cas et des projets de groupe »). Elle ne constitue pas une discipline autonome avec un programme séparé en 3e année ; ce cours propose donc un <strong>outil méthodologique transversal</strong>, à valider par l'enseignant.</p>
<ul>
<li>Leçon 1 — Qu'est-ce qu'une étude de cas ?</li>
<li>Leçon 2 — La collecte des faits</li>
<li>Leçon 3 — L'analyse des acteurs et des enjeux</li>
<li>Leçon 4 — La formulation d'hypothèses</li>
<li>Leçon 5 — La proposition de solutions</li>
<li>Leçon 6 — La rédaction du rapport d'étude de cas</li>
<li>Leçon 7 — Atelier intégré : étude de cas complète</li>
<li>Leçon 8 — Synthèse et évaluation</li>
</ul>
<p>Une évaluation finale de 12 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Manuel officiel de Techniques d'Animation 1ère année Techniques Sociales (Édition 2025) ; références générales en intervention sociale et en méthode de cas.</div>
    `
},
{
    title: "Leçon 1 — Qu'est-ce qu'une étude de cas ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un travailleur social arrive dans une famille en difficulté. Par où commencer ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir l'étude de cas. Comprendre sa place dans l'intervention sociale. Distinguer étude de cas et simple récit.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>L'<strong>étude de cas</strong> est une méthode d'analyse qui prend une situation concrète et singulière pour objet, en vue de comprendre ce qui s'y joue et de proposer des pistes d'action adaptées. Elle ne se contente pas de raconter : elle <em>analyse</em>.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Place dans l'intervention sociale</div>
<ul>
<li><strong>Comprendre</strong> avant d'agir.</li>
<li><strong>Adapter</strong> l'aide aux besoins réels.</li>
<li><strong>Coordonner</strong> les interventions des différents acteurs.</li>
<li><strong>Évaluer</strong> les effets des actions.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Étude de cas et récit</div>
<ul>
<li><strong>Récit :</strong> raconte les faits dans l'ordre.</li>
<li><strong>Étude de cas :</strong> organise les faits, identifie les causes, formule des hypothèses, propose des solutions.</li>
</ul>
<p>Une étude de cas réussie est structurée, argumentée, orientée vers l'action.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis l'étude de cas en une phrase.</p>
<p><strong>Ex. 2 :</strong> Distingue récit et étude de cas.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Analyse d'une situation singulière en vue de comprendre et d'agir. <strong>2)</strong> Récit : raconte ; étude de cas : analyse et propose.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'étude de cas est une démarche d'analyse : elle relie faits, acteurs, hypothèses et actions.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel Techniques d'Animation 1re TS ; références en méthode de cas.</div>
    `
},
{
    title: "Leçon 2 — La collecte des faits",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment recueillir des informations fiables sur une situation sociale sans envahir la vie des personnes ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les sources d'information. Utiliser les outils de collecte. Respecter l'éthique du recueil.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Sources d'information</div>
<ul>
<li><strong>Entretiens</strong> avec les personnes concernées.</li>
<li><strong>Observation</strong> du milieu et des comportements.</li>
<li><strong>Documents</strong> (dossiers, courriers, rapports).</li>
<li><strong>Témoignages</strong> de personnes-ressources (famille, voisins, enseignants).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Outils de collecte</div>
<ul>
<li>Grille d'entretien.</li>
<li>Fiche d'observation.</li>
<li>Carnet de notes.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Éthique du recueil</div>
<ul>
<li><strong>Consentement :</strong> informer les personnes et obtenir leur accord.</li>
<li><strong>Confidentialité :</strong> ne pas divulguer les informations personnelles.</li>
<li><strong>Non-jugement :</strong> recueillir les faits, pas les juger.</li>
<li><strong>Respect :</strong> ne pas forcer les confidences.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois sources d'information pour une étude de cas.</p>
<p><strong>Ex. 2 :</strong> Pourquoi l'éthique du recueil est-elle essentielle ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Entretiens, observation, documents. <strong>2)</strong> Pour protéger les personnes et obtenir des informations fiables dans un climat de confiance.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Collecter les faits demande des outils et une éthique : la confiance est la base du recueil.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel Techniques d'Animation 1re TS ; références en méthode de cas.</div>
    `
},
{
    title: "Leçon 3 — L'analyse des acteurs et des enjeux",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Plusieurs personnes sont concernées par un problème. Comment comprendre leurs positions respectives ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Cartographier les acteurs. Identifier leurs intérêts. Analyser les relations de pouvoir.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Cartographier les acteurs</div>
<p>On distingue :</p>
<ul>
<li><strong>acteurs directs :</strong> personnes directement concernées ;</li>
<li><strong>acteurs indirects :</strong> proches, institutions ;</li>
<li><strong>acteurs décideurs :</strong> qui peut changer la situation.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Intérêts, ressources, contraintes</div>
<p>Pour chaque acteur, on examine :</p>
<ul>
<li><strong>intérêts :</strong> ce qu'il veut ;</li>
<li><strong>ressources :</strong> ce qu'il peut mobiliser ;</li>
<li><strong>contraintes :</strong> ce qui le limite.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Relations de pouvoir</div>
<ul>
<li><strong>Acteurs dominants :</strong> ceux qui ont le plus de pouvoir.</li>
<li><strong>Acteurs dépendants :</strong> ceux qui dépendent d'autres.</li>
<li><strong>Alliances et conflits :</strong> qui soutient qui ? qui s'oppose à qui ?</li>
</ul>
<p>Comprendre ces relations éclaire les marges de manœuvre possibles.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Distingue acteurs directs, indirects, décideurs.</p>
<p><strong>Ex. 2 :</strong> Pourquoi analyser les relations de pouvoir ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Directs : concernés ; indirects : proches ou institutions ; décideurs : peuvent agir. <strong>2)</strong> Pour identifier les leviers d'action et les obstacles.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Analyser les acteurs, c'est comprendre qui fait quoi, avec quels intérêts et quelles ressources.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel Techniques d'Animation 1re TS ; références en analyse d'acteurs.</div>
    `
},
{
    title: "Leçon 4 — La formulation d'hypothèses",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une famille est-elle en difficulté ? Plusieurs explications sont possibles. Comment choisir ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Formuler des hypothèses. Les vérifier. Choisir l'hypothèse principale.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Qu'est-ce qu'une hypothèse ?</div>
<p>Une <strong>hypothèse</strong> est une explication provisoire que l'on propose pour rendre compte des faits observés. Elle n'est pas une vérité : elle est à vérifier.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Formuler plusieurs hypothèses</div>
<p>Sur une même situation, on peut formuler :</p>
<ul>
<li>une hypothèse économique (manque de ressources) ;</li>
<li>une hypothèse sociale (isolement, conflit) ;</li>
<li>une hypothèse psychologique (fatigue, dépression) ;</li>
<li>une hypothèse institutionnelle (défaut d'accès aux services).</li>
</ul>
<p>Confronter plusieurs hypothèses évite les conclusions hâtives.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Vérifier une hypothèse</div>
<ul>
<li>Chercher des faits qui la confirment.</li>
<li>Chercher des faits qui la contredisent.</li>
<li>Recueillir d'autres informations si nécessaire.</li>
<li>Retenir l'hypothèse la plus probable.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qu'est-ce qu'une hypothèse ?</p>
<p><strong>Ex. 2 :</strong> Propose trois hypothèses pour expliquer l'échec scolaire d'un élève.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Explication provisoire à vérifier. <strong>2)</strong> Difficultés familiales, problèmes de santé, mauvaise adaptation pédagogique.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une hypothèse est une explication provisoire : elle se vérifie par les faits, se confronte à d'autres hypothèses.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel Techniques d'Animation 1re TS.</div>
    `
},
{
    title: "Leçon 5 — La proposition de solutions",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Une fois le problème compris, comment proposer une action réaliste ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Proposer des solutions adaptées. Évaluer leur faisabilité. Choisir une piste d'action.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Critères d'une bonne solution</div>
<ul>
<li><strong>Adaptée</strong> au problème identifié.</li>
<li><strong>Réaliste</strong> au vu des ressources.</li>
<li><strong>Acceptable</strong> par les personnes concernées.</li>
<li><strong>Durable.</strong></li>
<li><strong>Respectueuse</strong> des droits et de la dignité.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Proposer plusieurs pistes</div>
<p>Une étude de cas solide propose souvent deux ou trois pistes, en explicitant :</p>
<ul>
<li>les avantages de chacune ;</li>
<li>ses limites ;</li>
<li>les conditions de sa mise en œuvre.</li>
</ul>
<p>On évite ainsi la solution unique, souvent insuffisante.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Impliquer la personne</div>
<p>Les solutions se construisent <em>avec</em> la personne concernée : elle doit pouvoir dire ce qui lui convient. Une solution imposée a peu de chances de réussir.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois critères d'une bonne solution.</p>
<p><strong>Ex. 2 :</strong> Pourquoi proposer plusieurs pistes plutôt qu'une seule ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Adaptée, réaliste, durable. <strong>2)</strong> Pour élargir le choix et éviter les solutions uniques souvent insuffisantes.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une solution se propose, se discute avec la personne, s'évalue selon des critères clairs.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel Techniques d'Animation 1re TS.</div>
    `
},
{
    title: "Leçon 6 — La rédaction du rapport d'étude de cas",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment présenter une étude de cas de façon claire et utilisable ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Structurer un rapport. Rédiger avec rigueur et respect. Utiliser un rapport pour l'action.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Structure type</div>
<ol>
<li><strong>Identification de la situation :</strong> éléments factuels, contexte.</li>
<li><strong>Recueil des faits :</strong> sources et informations.</li>
<li><strong>Analyse des acteurs :</strong> acteurs, intérêts, relations.</li>

    if (host) { host.insertBefore(dlBtn, host.firstChild); host.insertBefore(btn, dlBtn); }
    else { btn.className += " ecolia-fixed"; document.body.appendChild(btn); }
    var banner = document.createElement("div");
    banner.id = "ecolia-audio-banner";
    banner.innerHTML = '<span class="eab-txt"></span><span class="eab-act"></span><div class="eab-bar"><i></i></div>';
    var content = document.getElementById("content");
    if (content && content.parentNode) content.parentNode.insertBefore(banner, content);
    else document.body.insertBefore(banner, document.body.firstChild);
    var txtEl = banner.querySelector(".eab-txt"), actEl = banner.querySelector(".eab-act");
    var barEl = banner.querySelector(".eab-bar"), barI = barEl.firstChild;
    var audio = new Audio();
    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }
    function cur() { try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {} return 0; }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
