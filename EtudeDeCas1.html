    title: "Leçon 1 — Qu'est-ce qu'une étude de cas ? Pourquoi l'utiliser ?",
    content: `
        <div class="bloc-cas">
            <h3>Situation de départ</h3>
            <p>Deux élèves reçoivent le même texte à lire. Le premier doit répondre à des questions de mémoire : « Quelle est la date ? Qui est cité ? Quels chiffres apparaissent ? » Le second doit analyser une situation et proposer une solution : « Quel est le problème ? Quelles sont les causes possibles ? Que proposes-tu ? »</p>

        </div>

        <div class="bloc-theorie">
            <h3>Objectifs spécifiques</h3>
            <ul>
                <li>Définir une étude de cas.</li>
                <li>Expliquer son utilité.</li>
                <li>Distinguer un cas d'un simple exercice de mémoire.</li>
            </ul>

            <h3>Explication</h3>
            <p>Une <strong>étude de cas</strong> est l'analyse d'une situation concrète, réelle ou réaliste, pour apprendre à raisonner et à décider. Elle part d'un cas qui comporte un contexte, des acteurs, un problème et des données.</p>
            <p>Une étude de cas n'est pas un exercice à réponse unique. Elle développe :</p>
            <ul>
                <li>le <strong>raisonnement</strong> : relier les informations, peser les arguments ;</li>
                <li>l'<strong>argumentation</strong> : expliquer pourquoi on propose telle solution ;</li>
                <li>la <strong>capacité à transférer</strong> : réutiliser la méthode dans d'autres situations.</li>
            </ul>
            <p>L'élève doit identifier le problème, analyser les données, proposer des solutions et les justifier. Plusieurs réponses peuvent être défendables : ce qui compte, c'est la qualité du raisonnement.</p>

            <figure class="bloc-image" data-image-id="EtudeDeCas1_L1_01">

                <figcaption>L'étude de cas suit une démarche en plusieurs étapes.</figcaption>
            </figure>

            <h3>Notions et définitions</h3>
            <ul>
                <li><strong>Étude de cas :</strong> analyse d'une situation concrète pour apprendre à raisonner et à décider.</li>
                <li><strong>Cas :</strong> situation avec contexte, acteurs, problème et données.</li>
                <li><strong>Analyse :</strong> décomposition d'une situation pour comprendre ses éléments.</li>
                <li><strong>Justification :</strong> explication des raisons d'un choix.</li>
                <li><strong>Transfert :</strong> réutilisation d'une méthode dans une autre situation.</li>
            </ul>
        </div>

                <li>Un centre de santé connaît une rupture de stock de médicaments : il faut analyser les causes et proposer une solution.</li>

        <div class="bloc-cas">
            <h3>Situation de départ</h3>
            <p>Dans un cas, on lit deux affirmations : « Le directeur est incompétent » et « Les résultats ont baissé de 20 pour cent cette année ».</p>
            <p>Ces deux affirmations sont-elles de même nature ? Comment les traiter dans l'analyse ?</p>
        </div>

        <div class="bloc-theorie">
            <h3>Objectifs spécifiques</h3>
            <ul>
                <li>Identifier les éléments d'un cas : contexte, acteurs, faits, problème.</li>
                <li>Distinguer faits et opinions.</li>
                <li>Reformuler le problème central en une phrase.</li>
            </ul>

            <h3>Explication</h3>
            <p>Pour analyser un cas, on commence par repérer ses éléments :</p>
            <ul>
                <li>le <strong>contexte</strong> : lieu, moment, situation générale ;</li>
                <li>les <strong>acteurs</strong> : personnes ou groupes concernés ;</li>
                <li>les <strong>faits</strong> : informations vérifiables (chiffres, dates, événements observés) ;</li>
                <li>les <strong>opinions</strong> : jugements portés par les personnes (interprétations, impressions) ;</li>
                <li>le <strong>problème central</strong> : formulation claire de la situation à analyser.</li>
            </ul>
            <p>La rigueur de l'analyse dépend de la distinction entre faits et opinions. Un fait peut être vérifié ; une opinion doit être discutée. Confondre les deux conduit à des conclusions fragiles.</p>
            <p>Reformuler le problème central consiste à l'énoncer en <strong>une phrase claire</strong>, sans mélanger causes et conséquences. Exemple : « Les résultats des élèves ont baissé de 20 pour cent cette année » est un fait ; « le directeur est incompétent » est une opinion à examiner.</p>

                <li><strong>Acteur :</strong> personne ou groupe concerné par la situation.</li>
                <li><strong>Fait :</strong> information vérifiable.</li>
                <li><strong>Opinion :</strong> jugement personnel, non vérifiable directement.</li>
                <li><strong>Problème central :</strong> formulation claire de la situation à analyser.</li>
                <li><strong>Reformulation :</strong> redire une idée avec ses propres mots, sans la déformer.</li>

            <p>Lis ce cas : « À l'école Y, le taux de réussite est passé de 70 à 50 pour cent en deux ans. Les enseignants disent que les élèves ne travaillent pas. Une enquête montre que la moitié des élèves n'a pas de manuel et que plusieurs viennent de loin. Le directeur veut agir. »</p>

                <li><strong>coût :</strong> combien coûte-t-elle, et qui paie ?</li>
                <li><strong>impact :</strong> quel effet aura-t-elle sur le problème ?</li>
                <li><strong>durabilité :</strong> combien de temps durera son effet ?</li>
            </ul>
            <p><strong>Justifier</strong> signifie expliquer pourquoi on choisit cette solution plutôt qu'une autre, en s'appuyant sur des faits et sur des critères explicites. Ce n'est pas « je préfère » ou « tout le monde pense que » : c'est une argumentation.</p>

                <li><strong>Solution :</strong> proposition d'action pour répondre au problème.</li>

                <li><strong>Durabilité :</strong> capacité d'une solution à durer dans le temps.</li>
                <li><strong>Justification :</strong> explication des raisons d'un choix.</li>
                <li><strong>Argument :</strong> raison appuyée sur des faits ou des critères.</li>

<script>
(function () {

une association, d'un centre de santé; situations de ressources limitées. Ce sont des situations réalistes, reconstruites pour l'apprentissage. Limites documentaires. Aucun programme secondaire spécifique d'étude de cas n'existe. La méthode est documentée dans l'enseignement supérieur (UNILU) et dans des fiches pédagogiques d'autres disciplines. L'adaptation au niveau 1re année est une simplification volontaire. Plan d'images du cours. Identifiant. Leçon. Contenu visuel. Utilité. Emplacement. EtudeDeCas1_L1_01. L1. Schéma des étapes de l'analyse d'un cas. Donner une vue d'ensemble de la méthode. Slide 1, bloc théorie. EtudeDeCas1_L2_01. L2. Cas annoté: faits en bleu, opinions en rouge. Distinguer faits et opinions. Slide 2, bloc exemple. EtudeDeCas1_L3_01. L3. Tableau d'analyse: acteurs, causes, conséquences. Organiser l'analyse. Slide 3, bloc théorie. EtudeDeCas1_L4_01. L4. Grille d'évaluation de solutions. Aider à justifier un choix. Slide 4, bloc exercice. EtudeDeCas1_L5_01. L5. Fiche de répartition des rôles en groupe. Structurer le travail de groupe. Slide 5, bloc théorie. Les identifiants ci-dessus sont stables et doivent correspondre exactement à ceux utilisés dans les leçons."]],"2":[["fr","Leçon 1, Qu'est-ce qu'une étude de cas? Pourquoi l'utiliser? Situation de départ. Deux élèves reçoivent le même texte à lire. Le premier doit répondre à des questions de mémoire: « Quelle est la date? Qui est cité? Quels chiffres apparaissent? » Le second doit analyser une situation et proposer une solution: « Quel est le problème? Quelles sont les causes possibles? Que proposes-tu? ». Quelle est la différence entre ces deux exercices? Objectifs spécifiques. Définir une étude de cas. Expliquer son utilité. Distinguer un cas d'un simple exercice de mémoire. Explication. Une étude de cas est l'analyse d'une situation concrète, réelle ou réaliste, pour apprendre à raisonner et à décider. Elle part d'un cas qui comporte un contexte, des acteurs, un problème et des données. Une étude de cas n'est pas un exercice à réponse unique. Elle développe: le raisonnement: relier les informations, peser les arguments; l'argumentation: expliquer pourquoi on propose telle solution; la capacité à transférer: réutiliser la méthode dans d'autres situations. L'élève doit identifier le problème, analyser les données, proposer des solutions et les justifier. Plusieurs réponses peuvent être défendables: ce qui compte, c'est la qualité du raisonnement. [ Image EtudeDeCas1_L1_01: schéma des étapes, lire le cas, identifier le problème, analyser, proposer, justifier ]. L'étude de cas suit une démarche en plusieurs étapes. Notions et définitions. Étude de cas: analyse d'une situation concrète pour apprendre à raisonner et à décider. Cas: situation avec contexte, acteurs, problème et données. Analyse: décomposition d'une situation pour comprendre ses éléments. Justification: explication des raisons d'un choix. Transfert: réutilisation d'une méthode dans une autre situation. Exemples concrets. Une école manque de manuels: le directeur, les enseignants et les parents cherchent ensemble des solutions. Une association doit choisir entre deux projets avec un budget limité. Un atelier de couture perd de l'argent: le responsable doit comprendre pourquoi et décider quoi faire. Un centre de santé connaît une rupture de stock de médicaments: il faut analyser les causes et proposer une solution. Exercice d'application. Lis ce cas court: « À l'école X, seuls 40 pour cent des élèves de 1re année ont un manuel de mathématiques. Les enseignants se plaignent. Les parents disent que les livres sont trop chers. Le directeur ne sait pas comment faire. ». Qui sont les acteurs? Quel est le problème central? Propose deux solutions possibles, sans encore les juger. Corrigé. 1. Acteurs: élèves, enseignants, parents, directeur. 2. Problème central: la majorité des élèves de 1re année n'a pas de manuel de mathématiques. 3. Exemples de solutions: organiser une bibliothèque de prêt; chercher un partenaire; mutualiser les manuels par deux élèves; organiser une collecte. Toute solution argumentée est acceptée. À retenir. L'étude de cas n'est pas un exercice de restitution: c'est un apprentissage du raisonnement et de la décision. Elle part d'une situation concrète et contextualisée. Elle développe l'argumentation et le transfert à d'autres situations. Sources utiles. Article de l'UNILU sur l'étude de cas comme dispositif pédagogique (2026), définition et apports. Fiches pédagogiques de R D C utilisant l'étude de cas (organisation, opérations de banque et de crédit). Limite: ces références relèvent de l'enseignement supérieur ou d'autres disciplines; l'adaptation au niveau 1re année est une simplification volontaire."]],"3":[["fr","Leçon 2, Lire et comprendre un cas: contexte, acteurs, problème. Situation de départ. Dans un cas, on lit deux affirmations: « Le directeur est incompétent » et « Les résultats ont baissé de 20 pour cent cette année ». Ces deux affirmations sont-elles de même nature? Comment les traiter dans l'analyse? Objectifs spécifiques. Identifier les éléments d'un cas: contexte, acteurs, faits, problème. Distinguer faits et opinions. Reformuler le problème central en une phrase. Explication. Pour analyser un cas, on commence par repérer ses éléments: le contexte: lieu, moment, situation générale; les acteurs: personnes ou groupes concernés; les faits: informations vérifiables (chiffres, dates, événements observés); les opinions: jugements portés par les personnes (interprétations, impressions); le problème central: formulation claire de la situation à analyser. La rigueur de l'analyse dépend de la distinction entre faits et opinions. Un fait peut être vérifié; une opinion doit être discutée. Confondre les deux conduit à des conclusions fragiles. Reformuler le problème central consiste à l'énoncer en une phrase claire, sans mélanger causes et conséquences. Exemple: « Les résultats des élèves ont baissé de 20 pour cent cette année » est un fait; « le directeur est incompétent » est une opinion à examiner. [ Image EtudeDeCas1_L2_01: cas annoté avec faits en bleu et opinions en rouge ]. Distinguer faits et opinions permet une analyse rigoureuse. Notions et définitions. Contexte: ensemble des circonstances du cas. Acteur: personne ou groupe concerné par la situation. Fait: information vérifiable. Opinion: jugement personnel, non vérifiable directement. Problème central: formulation claire de la situation à analyser. Reformulation: redire une idée avec ses propres mots, sans la déformer. Exemples concrets. Centre de santé: faits égale rupture de stock de médicaments, nombre de patients en hausse; opinions égale « l'infirmier est paresseux ». École: faits égale taux de réussite en baisse de 20 pour cent; opinions égale « les élèves ne travaillent pas ». Atelier: faits égale dépenses supérieures aux recettes depuis trois mois; opinions égale « le gérant est malhonnête ». Association: faits égale réunions annulées deux fois; opinions égale « les membres ne s'intéressent plus au projet ». Exercice d'application. Lis ce cas: « À l'école Y, le taux de réussite est passé de 70 à 50 pour cent en deux ans. Les enseignants disent que les élèves ne travaillent pas. Une enquête montre que la moitié des élèves n'a pas de manuel et que plusieurs viennent de loin. Le directeur veut agir. ». Classe les éléments: contexte, acteurs, faits, opinions. Reformule le problème central en une phrase. Corrigé. 1. Contexte: école Y, sur deux ans. Acteurs: élèves, enseignants, directeur. Faits: baisse du taux de réussite (70 à 50 pour cent); la moitié des élèves sans manuel; plusieurs élèves viennent de loin. Opinions: « les élèves ne travaillent pas ». 2. Problème central possible: « Le taux de réussite a baissé fortement en deux ans dans cette école. » Toute reformulation claire, sans mélanger les causes, est acceptée. À retenir. Un cas contient des faits et des opinions. La rigueur exige de distinguer les deux. Un problème central se formule en une phrase claire. Sources utiles. Article UNILU sur l'étude de cas. Manuels de méthodologie du travail intellectuel. Limite: ces références ne sont pas spécifiques au niveau 1re année; l'adaptation est une simplification."]],"4":[["fr","Leçon 3, Analyser: causes, conséquences, acteurs. Situation de départ. Dans une association, un conflit oppose plusieurs membres. Certains disent que le problème vient du manque d'argent; d'autres affirment qu'il vient du manque de communication entre les responsables. Comment démêler les causes? Objectifs spécifiques. Distinguer causes et conséquences. Identifier les acteurs et leurs intérêts. Utiliser un tableau d'analyse simple. Explication. Analyser, c'est organiser les informations pour comprendre les liens de cause à effet et les positions des acteurs. Une cause explique pourquoi le problème existe. Une conséquence est ce qui résulte du problème. Un acteur est une personne ou un groupe concerné. Un intérêt est ce qu'un acteur a à gagner ou à perdre dans la situation. Un enjeu est ce qui est réellement en jeu dans le conflit. Le tableau d'analyse permet de ne rien oublier. Il comprend en général quatre colonnes: acteur, intérêt, causes défendues, conséquences subies. [ Image EtudeDeCas1_L3_01: tableau d'analyse à quatre colonnes, acteurs, intérêts, causes, conséquences ]. Le tableau d'analyse organise les informations sans les mélanger. Notions et définitions. Cause: ce qui produit le problème. Conséquence: ce qui résulte du problème. Acteur: personne ou groupe concerné. Intérêt: ce qu'un acteur a à gagner ou à perdre. Enjeu: ce qui est réellement en jeu. Tableau d'analyse: outil qui organise acteurs, intérêts, causes et conséquences. Exemples concrets. Coopérative: cause égale mauvaise gestion des cotisations; conséquence égale baisse des revenus; acteurs égale membres, bureau, fournisseurs. École: cause égale absentéisme des enseignants; conséquence égale échec des élèves; acteurs égale élèves, parents, direction. Association: cause égale absence de réunions régulières; conséquence égale perte de confiance; acteurs égale président, membres, partenaires. Atelier: cause égale achats trop coûteux; conséquence égale perte financière; acteurs égale gérant, ouvriers, clients. Exercice d'application. À partir de ce cas: « Le comité d'eau du quartier ne parvient plus à payer la facture. Certains habitants ne cotisent pas. Le robinet public fuit depuis deux mois. ». Identifie au moins trois acteurs. Note deux causes et deux conséquences. Remplis un tableau d'analyse simple. Corrigé. 1. Acteurs: comité d'eau, habitants cotisants, habitants non cotisants, réparateur ou technicien. 2. Causes: non-paiement des cotisations; fuite non réparée; absence de suivi. Conséquences: facture impayée; tension entre habitants. 3. Tableau: comité d'eau (intérêt: équilibre du budget; cause: cotisations manquantes; conséquence: impayé); habitants cotisants (intérêt: service continu; cause: fuite; conséquence: hausse des coûts); habitants non cotisants (intérêt: accès à l'eau; cause: difficultés financières; conséquence: tension). À retenir. Une cause explique pourquoi; une conséquence est ce qui en résulte. Chaque acteur a des intérêts, parfois contradictoires. Le tableau d'analyse aide à organiser les informations. Sources utiles. Article UNILU sur l'étude de cas. Fiches pédagogiques d'organisation (R D C) utilisant l'analyse de situations. Limite: ces références sont générales; les cas sont reconstruits pour l'apprentissage."]],"5":[["fr","Leçon 4, Proposer et justifier une solution. Situation de départ. Face à un manque de manuels scolaires, deux solutions sont proposées: acheter de nouveaux manuels, ou organiser une bibliothèque de prêt. Comment choisir entre les deux? Objectifs spécifiques. Formuler une ou plusieurs solutions. Évaluer leur faisabilité et leur pertinence. Justifier un choix à l'aide de critères. Explication. Il n'y a pas toujours une solution unique. La bonne solution dépend du contexte et des critères choisis. Pour évaluer une solution, on utilise des critères: faisabilité: la solution est-elle réalisable avec les moyens disponibles? coût: combien coûte-t-elle, et qui paie? impact: quel effet aura-t-elle sur le problème? durabilité: combien de temps durera son effet? Justifier signifie expliquer pourquoi on choisit cette solution plutôt qu'une autre, en s'appuyant sur des faits et sur des critères explicites. Ce n'est pas « je préfère » ou « tout le monde pense que »: c'est une argumentation. Une bonne justification suit trois étapes: rappeler le problème, présenter la solution, expliquer pourquoi elle répond le mieux aux critères retenus. [ Image EtudeDeCas1_L4_01: grille d'évaluation de solutions, critères, solutions, notes ]. Une grille permet de comparer plusieurs solutions avant de choisir. Notions et définitions. Solution: proposition d'action pour répondre au problème. Critère de choix: élément utilisé pour comparer les solutions. Faisabilité: caractère réalisable d'une solution. Durabilité: capacité d'une solution à durer dans le temps. Justification: explication des raisons d'un choix. Argument: raison appuyée sur des faits ou des critères. Exemples concrets. Une association doit choisir entre acheter des chaises ou réparer le toit. Les deux sont utiles, mais les critères de sécurité et d'urgence pèsent davantage. Une école doit choisir entre augmenter les frais scolaires ou chercher des partenaires. Le critère d'équité envers les familles est important. Un atelier doit choisir entre réduire les achats ou chercher de nouveaux clients. Le critère de durabilité oriente le choix. Exercice d'application. Cas: « Le comité d'eau du quartier doit choisir entre installer un compteur collectif ou nommer un responsable de la distribution. ». Propose deux solutions (elles peuvent être différentes de celles du cas). Évalue-les selon trois critères: faisabilité, coût, durabilité. Justifie ton choix en trois phrases. Corrigé. Un corrigé modèle est proposé; toute réponse argumentée est acceptée. 1. Solution A: compteur collectif avec répartition mensuelle des charges. Solution B: responsable de la distribution, avec carnet de suivi. 2. A: faisable si le quartier cotise; coût élevé au départ; durable car facturation mesurée. B: facile à mettre en place; coût faible; durable si le responsable tient correctement le carnet. 3. Exemple de justification: « Je choisis A car le coût de départ est compensé par une facturation plus juste; c'est plus durable si le comité tient les comptes; c'est plus faisable si une cotisation exceptionnelle est organisée. ». À retenir. Une solution justifiée s'appuie sur des critères explicites et des faits. Il n'y a pas toujours une solution unique. Comparer plusieurs solutions permet de choisir avec plus de rigueur. Sources utiles. Article UNILU sur l'étude de cas. Manuels de résolution de problèmes (références générales). Limite: ces références ne sont pas spécifiques au contexte scolaire congolais; les cas sont reconstruits."]],"6":[["fr","Leçon 5, Travailler en groupe et présenter une étude de cas. Situation de départ. Un groupe de quatre élèves doit présenter son analyse en cinq minutes. Chacun veut parler de tout, personne ne sait qui commence, et le temps passe sans que le groupe avance. Comment organiser le travail? Objectifs spécifiques. Organiser le travail de groupe: rôles, temps. Présenter une analyse de cas de manière claire. Écouter et discuter les propositions des autres groupes. Explication. Le travail de groupe est efficace quand les rôles sont clairs et le temps maîtrisé. On distingue en général quatre rôles: animateur: organise les échanges, veille à ce que chacun parle; secrétaire: note les idées et les décisions; rapporteur: présente les résultats au reste de la classe; gardien du temps: surveille la durée de chaque étape. La présentation d'une étude de cas suit une structure simple: contexte en une phrase; problème central; analyse (causes, conséquences, acteurs); solutions proposées et justifiées; conclusion brève. L'écoute active permet d'enrichir l'analyse: reformuler une question posée, noter une objection, comparer avec sa propre solution. Écouter les autres groupes n'est pas copier: c'est comparer et progresser. [ Image EtudeDeCas1_L5_01: fiche de répartition des rôles en groupe, animateur, secrétaire, rapporteur, gardien du temps ]. Des rôles clairs rendent le travail de groupe plus efficace. Notions et définitions. Travail de groupe: travail en équipe avec des objectifs communs. Rôle: fonction attendue dans le groupe. Rapporteur: membre qui présente les résultats. Présentation structurée: exposé organisé par étapes. Écoute active: écoute attentive, avec reformulation et questions. Conclusion: réponse brève au problème posé. Exemples concrets. Dans un atelier de formation professionnelle, un groupe présente un cas de gestion d'atelier à d'autres groupes qui posent des questions. Dans une classe, deux groupes défendent des solutions opposées à un même problème et comparent leurs arguments. Un groupe attribue les rôles dès le départ: animateur, secrétaire, rapporteur, gardien du temps. Exercice d'application. Par groupes de quatre, préparez en 15 minutes une présentation de 5 minutes sur un cas déjà étudié en classe. Répartissez les rôles. Préparez un plan en cinq points: contexte, problème, analyse, solutions, conclusion. Après la présentation, chaque autre groupe pose une question. Notez-la et discutez-la. Corrigé. On vérifie que: les quatre rôles sont attribués; le plan est respecté; la présentation tient dans le temps; la conclusion répond au problème; chaque groupe a écouté et reformulé au moins une question. À retenir. Des rôles clairs et un temps maîtrisé rendent le travail de groupe efficace. Une présentation structurée suit un ordre précis. L'écoute des autres groupes enrichit l'analyse. Sources utiles. Article UNILU sur l'étude de cas. Manuels de méthodologie du travail universitaire (références générales). Limite: l'adaptation au niveau 1re année est une simplification."]],"7":[["fr","Évaluation finale, Étude de cas. Évaluation finale. 36 questions à choix multiple. Une seule réponse est correcte par question. Choisis la réponse qui te semble juste, puis valide."]]}};

            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
</html>
