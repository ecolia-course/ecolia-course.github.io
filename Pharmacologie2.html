{
    title: "Sommaire — Pharmacologie",
    content: `
<div class="bloc cas"><div class="bloc-label">Avertissement pédagogique</div>
<p>Ce cours ne forme <strong>pas</strong> à la prescription. L'élève infirmier apprend à connaître les classes de médicaments, à comprendre leur mécanisme général, à respecter les règles de sécurité et à reconnaître les signes d'effets indésirables pour alerter. <strong>Aucune posologie pratique ne doit être mémorisée sans validation médicale.</strong></p>
</div>
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours de pharmacologie couvre cinq leçons essentielles : les notions fondamentales, les grandes classes pharmacologiques, les voies d'administration et règles de sécurité, les effets indésirables et l'automédication, et la conservation/réglementation/lutte contre les faux médicaments.</p>
<p><strong>Note :</strong> le programme officiel RDC de pharmacologie pour la 2e année des humanités techniques n'a pas été retrouvé dans son intégralité. La progression s'appuie sur les référentiels de l'OMS (Liste modèle des médicaments essentiels, Guide de bonne pratique pharmaceutique) et sur les directives du Programme National de Santé RDC. Toute posologie ou protocole doit être validé par le Ministère de la Santé RDC et par un pharmacien avant diffusion.</p>
<ul>
<li>Leçon 1 — Notions fondamentales : qu'est-ce qu'un médicament ?</li>
<li>Leçon 2 — Les grandes classes pharmacologiques</li>
<li>Leçon 3 — Voies d'administration et règles de sécurité</li>
<li>Leçon 4 — Effets indésirables, interactions et automédication</li>
<li>Leçon 5 — Conservation, réglementation et lutte contre les faux médicaments</li>
</ul>
<p>Une évaluation finale de 20 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Liste modèle des médicaments essentiels (OMS) ; Guide de bonne pratique pharmaceutique (OMS) ; Programme National de Santé RDC (référence partielle).</div>
    `
},
{
    title: "Leçon 1 — Notions fondamentales : qu'est-ce qu'un médicament ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un même médicament peut-il soigner ou nuire ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir les notions fondamentales. Distinguer principe actif et excipient. Connaître les formes galéniques. Comprendre dose et posologie. Prérequis : notions d'anatomie-physiologie et de chimie de base.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Médicament :</strong> substance ou composition présentant des propriétés curatives ou préventives à l'égard des maladies.</p>
<p><strong>Principe actif :</strong> molécule qui produit l'effet thérapeutique.</p>
<p><strong>Excipient :</strong> substance inactive qui sert de support (liant, colorant, conservateur).</p>
<p><strong>Forme galénique :</strong> forme sous laquelle le médicament est présenté (comprimé, sirop, injectable, pommade, suppositoire).</p>
<p><strong>Dose :</strong> quantité administrée par prise. <strong>Posologie :</strong> rythme et quantité d'administration sur une période.</p>
<p><strong>Marge thérapeutique :</strong> écart entre la dose efficace et la dose toxique.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Principe actif :</strong> molécule active. <strong>Excipient :</strong> support inactif. <strong>Forme galénique :</strong> présentation du médicament. <strong>Posologie :</strong> plan d'administration.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier sur la boîte : principe actif, dosage, forme, date de péremption. Ne jamais confondre dose et posologie. Un médicament est actif : son usage exige rigueur et contrôle.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Le paracétamol existe en comprimés (adulte) et en sirop (enfant) : même principe actif, formes galéniques différentes adaptées au patient.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qu'est-ce qu'un principe actif ? <strong>Ex. 2 :</strong> Que signifie « posologie » ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> La molécule qui produit l'effet thérapeutique. <strong>2)</strong> Le rythme et la quantité d'administration sur une période.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Tout médicament est un produit actif : sa sécurité dépend de son bon usage.</p></div>

<div class="sources"><strong>Sources :</strong> Guide de bonne pratique pharmaceutique (OMS).</div>
    `
},
{
    title: "Leçon 2 — Les grandes classes pharmacologiques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un antibiotique ne guérit-il pas la grippe ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les grandes familles. Distinguer symptomatique et curatif. Comprendre la notion de médicament essentiel. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Grandes classes :</strong> analgésiques, anti-inflammatoires, antibiotiques, antipaludéens, antihypertenseurs, antidiabétiques, etc.</p>
<p><strong>Médicament symptomatique :</strong> soulage un symptôme (ex. paracétamol contre la fièvre).</p>
<p><strong>Médicament curatif :</strong> traite la cause (ex. antibiotique contre une infection bactérienne).</p>
<p><strong>Médicament essentiel :</strong> médicament qui couvre les besoins prioritaires de santé publique (Liste OMS).</p>
<p><strong>Usage rationnel :</strong> prescription adaptée, posologie correcte, durée respectée.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Antibiotique :</strong> médicament actif contre les bactéries. <strong>Antipaludéen :</strong> médicament contre le paludisme. <strong>Analgésique :</strong> médicament contre la douleur.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Associer chaque médicament à une classe. Ne pas confondre les usages. Distinguer symptomatique et curatif. Respecter l'usage rationnel.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Le paludisme étant un problème majeur en RDC, les antipaludéens (artémisinine et dérivés) figurent parmi les médicaments essentiels. L'infirmier doit connaître leur place sans prescrire.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> À quelle classe appartient le paracétamol ? <strong>Ex. 2 :</strong> Les antibiotiques sont-ils efficaces contre les virus ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Analgésique et antipyrétique (symptomatique). <strong>2)</strong> Non, uniquement contre les bactéries.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Chaque classe pharmacologique a un usage précis : le rôle de l'infirmier est de connaître, observer et alerter.</p></div>

<div class="sources"><strong>Sources :</strong> Liste modèle des médicaments essentiels (OMS).</div>
    `
},
{
    title: "Leçon 3 — Voies d'administration et règles de sécurité",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une erreur de dose peut-elle être mortelle ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les voies d'administration. Appliquer la règle des 5 B. Réaliser un calcul de dose simple. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Voies :</strong> orale, injectable, cutanée, rectale, inhalée. Chaque voie a des avantages et des limites.</p>
<p><strong>Asepsie :</strong> indispensable pour la voie injectable.</p>
<p><strong>Règle des 5 B :</strong></p>
<ul>
<li>Bon médicament.</li>
<li>Bonne dose.</li>
<li>Bon patient.</li>
<li>Bonne voie.</li>
<li>Bon moment.</li>
</ul>
<p><strong>Calcul de dose :</strong> dose à administrer = (dose prescrite / dose disponible) × volume disponible, selon la présentation.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Voie d'administration :</strong> chemin par lequel le médicament entre dans l'organisme. <strong>Asepsie :</strong> absence de microbes. <strong>Règle des 5 B :</strong> règles de sécurité.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Toujours vérifier trois fois : avant préparation, avant administration, après administration. La règle des 5 B est un réflexe. Ne jamais préparer sans vérifier la prescription.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>L'infirmier qui prépare une injection vérifie trois fois : le bon médicament, la bonne dose, le bon patient — c'est la règle des 5 B.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelles sont les cinq règles de sécurité ? <strong>Ex. 2 :</strong> Combien de comprimés dosés à 250 mg faut-il pour administrer 500 mg ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Bon médicament, bonne dose, bon patient, bonne voie, bon moment. <strong>2)</strong> 2 comprimés.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La règle des 5 B est la base de la sécurité médicamenteuse.</p></div>

<div class="sources"><strong>Sources :</strong> Guide de bonne pratique pharmaceutique (OMS).</div>
    `
},
{
    title: "Leçon 4 — Effets indésirables, interactions et automédication",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi l'automédication est-elle dangereuse ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer effet thérapeutique et effet indésirable. Comprendre les interactions. Identifier les dangers de l'automédication. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Effet thérapeutique :</strong> effet attendu du médicament.</p>
<p><strong>Effet secondaire :</strong> effet non recherché mais prévisible.</p>
<p><strong>Effet indésirable :</strong> effet nocif et non voulu.</p>
<p><strong>Interactions :</strong> modification de l'effet d'un médicament par un autre ou par un aliment.</p>
<p><strong>Contre-indications :</strong> situations dans lesquelles le médicament ne doit pas être utilisé.</p>
<p><strong>Automédication :</strong> utilisation d'un médicament sans prescription médicale ; risque majeur (mauvais diagnostic, sous-dosage ou surdosage, résistance, interactions).</p>
<p><strong>Pharmacovigilance :</strong> système qui surveille les effets indésirables.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Effet indésirable :</strong> effet nocif. <strong>Interaction :</strong> modification réciproque. <strong>Automédication :</strong> prise de médicament sans avis médical.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Informer le patient sur les risques. Alerter le médecin en cas d'effet indésirable. Refuser l'automédication comme norme. Déclarer en pharmacovigilance.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>L'usage abusif d'antibiotiques sans prescription favorise l'antibiorésistance. L'automédication avec des antipaludéens mal dosés masque les symptômes et retarde la prise en charge.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qu'est-ce qu'un effet indésirable ? <strong>Ex. 2 :</strong> Citer deux dangers de l'automédication.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Un effet nocif et non voulu. <strong>2)</strong> Mauvais diagnostic et antibiorésistance (autres réponses possibles).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Tout médicament a des risques : le rôle de l'infirmier est d'informer et d'alerter.</p></div>

<div class="sources"><strong>Sources :</strong> Pharmacovigilance (OMS) ; Guide de bonne pratique pharmaceutique (OMS).</div>
    `
},
{
    title: "Leçon 5 — Conservation, réglementation et lutte contre les faux médicaments",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi les médicaments vendus dans la rue sont-ils dangereux ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les conditions de conservation. Comprendre le circuit pharmaceutique. Identifier les dangers des faux médicaments. Prérequis : leçons 1 à 4.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Conservation :</strong> température ambiante ou réfrigérée, à l'abri de l'humidité, de la lumière et de la chaleur ; respecter la date de péremption.</p>
<p><strong>Chaîne du froid :</strong> certains médicaments (vaccins, insulines) doivent être conservés entre 2 et 8 °C.</p>
<p><strong>Circuit pharmaceutique :</strong> fabrication → distribution → pharmacie → patient. Achat dans une pharmacie agréée.</p>
<p><strong>Faux médicaments :</strong> produits falsifiés sans principe actif, sous-dosés ou toxiques ; danger majeur en Afrique subsaharienne.</p>
<p><strong>Rôle de l'infirmier :</strong> sensibiliser le patient, l'orienter vers une pharmacie agréée, signaler les produits suspects.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>

          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
