D C. Réparation de radios et de téléphones à Kinshasa; ateliers d'électronique de quartier; alimentations stabilisées pour appareils domestiques; importance de la maîtrise des schémas pour le diagnostic. Limites documentaires. Le programme national d'électronique est référencé mais son contenu détaillé n'a pas été consulté. Les fiches de 1re année (Dessins et Schémas) fournissent un cadre officiel pour l'initiation. L'adaptation au niveau 12-14 ans privilégie la lecture de schémas et la compréhension fonctionnelle, sans calculs avancés. Plan d'images du cours. Identifiant. Leçon. Contenu visuel. Utilité. Emplacement. Electronique1_L1_01. L1. Distinction électricité ou électronique. Notions de base. Slide 1, bloc théorie. Electronique1_L2_01. L2. Code des couleurs et symboles des composants passifs. Composants. Slide 2, bloc exercice. Electronique1_L3_01. L3. Symbole de la diode et redressement. Diode. Slide 3, bloc théorie. Electronique1_L4_01. L4. Symbole du transistor et montage amplificateur. Transistor. Slide 4, bloc résumé. Electronique1_L5_01. L5. Schéma-bloc d'une alimentation stabilisée. Lecture de schéma. Slide 5, bloc exercice. Identifiants stables et cohérents avec le HTML."]],"2":[["fr","Leçon 1, Électricité et électronique: de l'énergie au signal. Situation de départ. Une lampe de maison et une radio fonctionnent toutes deux à l'électricité. Pourtant, l'une relève de l'électricité, l'autre de l'électronique. Pourquoi cette distinction? Objectifs spécifiques. Distinguer électricité et électronique. Identifier les domaines d'application. Comprendre que l'électronique traite des signaux faibles. Explication. L'électricité achemine de l'énergie pour éclairer, chauffer ou actionner des moteurs. L'électronique utilise des composants pour traiter des signaux (voix, image, données). Elle repose sur des courants et des tensions faibles, mais un savoir-faire précis. Les deux domaines sont complémentaires. [ Image Electronique1_L1_01: distinction électricité ou électronique ]. L'électronique prolonge l'électricité dans le domaine du signal. Notions et définitions. Électricité: transport d'énergie. Électronique: traitement du signal. Signal analogique: signal continu. Composant électronique: élément de circuit. Application: radio, téléphone, télévision, automatisme. Exemples concrets. Réparation d'une radio à Kinshasa. Téléphone portable. Télévision. Automatismes d'une usine. Exercice d'application. Classe cinq appareils en « électricité » ou « électronique ». Justifie chaque classement. Identifie trois applications de l'électronique dans la vie quotidienne. Corrigé. On vérifie que: les appareils sont classés correctement; la justification s'appuie sur la notion de signal ou d'énergie; les applications sont citées. À retenir. L'électronique est la science du signal. Elle traite des courants et tensions faibles. Elle prolonge l'électricité dans le domaine de l'information. Sources utiles. Programme National d'Électronique (Educ Book, 2024). Fiches de Dessins et Schémas Électroniques, 1re année (Édition 2025). Limite: l'adaptation en 1re est une simplification."]],"3":[["fr","Leçon 2, Les composants passifs: résistances et condensateurs. Situation de départ. Sur un circuit, une résistance porte des anneaux colorés. Que signifient-ils? Comment connaître sa valeur? Objectifs spécifiques. Identifier une résistance et un condensateur. Connaître leur rôle. Lire le code des couleurs d'une résistance. Reconnaître les symboles. Explication. La résistance limite le courant et divise les tensions. Le code des couleurs permet de lire sa valeur (ex. rouge égale 2, violet égale 7, etc.). Le condensateur stocke de l'énergie et la restitue; il sert au filtrage et au couplage. Ces composants sont passifs: ils ne produisent pas de signal. [ Image Electronique1_L2_01: code des couleurs et symboles des composants passifs ]. Les composants passifs sont les briques de base. Notions et définitions. Résistance (R): en ohms. Code des couleurs: lecture de la valeur. Condensateur (C): en farads. Charge ou décharge: stockage et restitution. Symbole: représentation normalisée. Composant passif: ne produit pas de signal. Exemples concrets. Résistances dans une radio. Condensateurs dans une alimentation. Code des couleurs sur les composants de récupération. Exercice d'application. Lis la valeur de trois résistances à partir de leur code. Identifie le symbole de la résistance et du condensateur. Indique le rôle du condensateur. Corrigé. On vérifie que: les valeurs sont correctement lues; les symboles sont reconnus; le rôle du condensateur est expliqué. À retenir. Les composants passifs sont les briques de base. La résistance limite le courant. Le condensateur stocke l'énergie. Sources utiles. Fiches de Dessins et Schémas Électroniques, 1re année (symboles CEI). Manuels d'électronique de base. Limite: l'adaptation en 1re est une simplification."]],"4":[["fr","Leçon 3, La diode: le composant à sens unique. Situation de départ. Une alimentation doit transformer le courant alternatif du secteur en courant continu pour un appareil. Quel composant réalise cette conversion? Objectifs spécifiques. Expliquer le fonctionnement d'une diode. Comprendre son rôle dans le redressement. Identifier ses symboles et ses broches. Distinguer diode de redressement et diode Zener. Explication. La diode ne laisse passer le courant que dans un sens: de l'anode vers la cathode. Elle est utilisée pour le redressement (conversion AC en DC). La diode Zener, utilisée en inverse, permet de stabiliser une tension. Ces composants sont essentiels dans les alimentations. [ Image Electronique1_L3_01: symbole de la diode et redressement ]. La diode est un composant unidirectionnel. Notions et définitions. Diode: composant à deux broches. Anode: entrée du courant. Cathode: sortie du courant. Sens passant: laisse passer. Sens bloquant: ne laisse pas passer. Redressement: AC vers DC. Diode Zener: stabilisation de tension. Exemples concrets. Redressement dans un chargeur de téléphone. Diode de protection dans un circuit. Alimentation d'un poste de radio. Exercice d'application. Identifie le sens passant d'une diode sur un schéma. Explique pourquoi une diode est utilisée dans une alimentation. Indique le rôle de la diode Zener. Corrigé. On vérifie que: le sens est correctement identifié (anode vers cathode); le rôle du redressement est expliqué; la fonction Zener est citée. À retenir. La diode est un composant unidirectionnel. Elle redresse le courant alternatif. La diode Zener stabilise la tension. Sources utiles. Fiches de Dessins et Schémas Électroniques, 1re année (schémas de principe). Manuels d'électronique. Limite: l'adaptation en 1re est une simplification."]],"5":[["fr","Leçon 4, Le transistor: amplification et commutation. Situation de départ. Un signal faible (voix d'un micro) doit être amplifié pour être audible dans un haut-parleur. Quel composant réalise cette amplification? Objectifs spécifiques. Identifier un transistor et ses broches. Comprendre ses deux fonctions. Reconnaître le symbole. Explication. Le transistor est un composant actif à trois broches: base, collecteur, émetteur. En amplification, un petit courant de base contrôle un courant plus important dans le collecteur. En commutation, il fonctionne comme un interrupteur commandé. Il est au cœur des amplificateurs et des circuits logiques. [ Image Electronique1_L4_01: symbole du transistor et montage amplificateur ]. Le transistor amplifie et commute. Notions et définitions. Transistor bipolaire: NPN ou PNP. Base: commande le transistor. Collecteur: reçoit le courant principal. Émetteur: évacue le courant. Amplification: petit courant contrôle grand courant. Commutation: fonction interrupteur. Gain: rapport des courants (notion). Exemples concrets. Amplificateur audio d'une radio. Commande d'un relais. Transistor dans un chargeur. Exercice d'application. Identifie les trois broches sur un symbole. Explique la différence entre amplification et commutation. Indique un exemple d'utilisation de chaque fonction. Corrigé. On vérifie que: les trois broches sont nommées; la différence est expliquée; les exemples sont pertinents (amplificateur audio, relais). À retenir. Le transistor est le composant clé de l'électronique moderne. Il amplifie et commute. Ses trois broches sont base, collecteur, émetteur. Sources utiles. Fiches de Dessins et Schémas Électroniques, 1re année (amplificateur simple). Manuels d'électronique. Limite: l'adaptation en 1re est une simplification."]],"6":[["fr","Leçon 5, Lire un schéma et comprendre une alimentation stabilisée. Situation de départ. Un appareil électronique a besoin d'une tension continue stable. Comment passer du secteur (alternatif) à une tension continue stabilisée? Objectifs spécifiques. Lire un schéma de principe simple. Identifier les blocs d'une alimentation stabilisée. Comprendre la fonction de chaque bloc. Explication. Une alimentation stabilisée comprend: un transformateur qui abaisse la tension; un redresseur qui convertit l'alternatif en continu; un filtre (condensateur) qui lisse la tension; un régulateur qui stabilise la sortie. Lire le schéma permet de comprendre le rôle de chaque composant et de diagnostiquer une panne. [ Image Electronique1_L5_01: schéma-bloc d'une alimentation stabilisée ]. Le schéma est le langage de l'électronicien. Notions et définitions. Schéma de principe: représentation fonctionnelle. Bloc: fonction du circuit. Transformateur: modifie la tension. Redresseur: convertit AC en DC. Filtre: lisse la tension. Régulateur: stabilise la tension. Tension stabilisée: tension constante. Exemples concrets. Alimentation d'un radio. Chargeur de téléphone. Bloc d'alimentation d'un ordinateur. Exercice d'application. Sur un schéma d'alimentation, identifie les quatre blocs. Explique la fonction de chaque bloc. Propose un diagnostic simple si la tension de sortie est instable. Corrigé. On vérifie que: les blocs sont identifiés; leur fonction est expliquée; le diagnostic mentionne un défaut possible de filtre ou de régulateur. À retenir. Le schéma est le langage de l'électronicien. L'alimentation stabilisée est un montage fondamental. Chaque bloc a une fonction précise. Sources utiles. Fiches de Dessins et Schémas Électroniques, 1re année (alimentation stabilisée). Programme National d'Électronique. Limite: l'adaptation en 1re est une simplification."]],"7":[["fr","Évaluation finale, Électronique analogique. Évaluation finale. 36 questions à choix multiple. Une seule réponse est correcte par question. Choisis la réponse qui te semble juste, puis valide."]]}};

        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }

    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial"
        ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet."
        : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
