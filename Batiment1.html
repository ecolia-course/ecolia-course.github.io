    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}

té consultée. La répartition annuelle complète n'a pas été lue ligne à ligne. L'adaptation au niveau 12-14 ans est une sélection de contenus accessibles. Plan d'images du cours. Identifiant. Leçon. Contenu visuel. Utilité. Emplacement. Batiment1_L1_01. L1. Parties d'un bâtiment. Structure. Slide 1, bloc théorie. Batiment1_L2_01. L2. Types de fondations. Fondations. Slide 2, bloc théorie. Batiment1_L3_01. L3. Murs porteurs vs cloisons. Murs. Slide 3, bloc exercice. Batiment1_L4_01. L4. Toiture à deux pans et ventilation. Toiture. Slide 4, bloc résumé. Batiment1_L5_01. L5. Plan simple et organisation de chantier. Lecture de plan. Slide 5, bloc exercice. Identifiants stables et cohérents avec le HTML."]],"2":[["fr","Leçon 1, La logique d'un bâtiment: du sol à la toiture. Situation de départ. Un élève observe un chantier: des ouvriers creusent des tranchées, d'autres montent des murs. Dans quel ordre construit-on un bâtiment? Pourquoi cet ordre? Objectifs spécifiques. Identifier les grandes parties d'un bâtiment. Comprendre leur fonction. Expliquer la logique de la descente des charges. Explication. Un bâtiment se construit du bas vers le haut: les fondations reprennent les charges et les transmettent au sol; les murs porteurs portent les planchers et la toiture; la toiture protège de la pluie et du soleil. Chaque élément a une fonction précise dans la stabilité de l'ouvrage. [ Image Batiment1_L1_01: parties d'un bâtiment ]. La construction suit une logique fonctionnelle. Notions et définitions. Gros œuvre: structure du bâtiment. Fondations: élément de liaison avec le sol. Murs porteurs: murs qui supportent les charges. Planchers: surfaces horizontales. Toiture: protection supérieure. Descente de charges: transmission des charges vers le sol. Structure: ensemble porteur. Exemples concrets. Pavillon simple à Kinshasa. Construction en briques de terre cuite à Lubumbashi. Toiture en tôles. Exercice d'application. Sur un schéma muet, nomme les parties d'un bâtiment. Indique leur fonction. Dessine un croquis simple d'un pavillon. Corrigé. On vérifie que: fondations, murs, planchers, toiture sont nommés; leur fonction est donnée; le croquis est reconnaissable. À retenir. La construction suit une logique fonctionnelle. Chaque élément dépend des autres. Le gros œuvre est la structure du bâtiment. Sources utiles. Fiches de Technologie de Métier, 1re année Construction (Édition 2025). Programme national Construction (cycle long). Limite: l'adaptation en 1re est une simplification."]],"3":[["fr","Leçon 2, Les fondations: le contact avec le sol. Situation de départ. Deux maisons sont construites: l'une sur un sol rocheux, l'autre sur un sol argileux mou. Doivent-elles avoir les mêmes fondations? Pourquoi? Objectifs spécifiques. Distinguer fondations superficielles et profondes. Identifier les types de fondations. Comprendre le choix selon le type de sol. Explication. Les fondations transmettent les charges du bâtiment au sol. fondations superficielles: semelles filantes, semelles isolées, radier; fondations profondes: pieux. Le choix dépend de la nature du sol et du type de bâtiment. [ Image Batiment1_L2_01: types de fondations ]. La fondation est l'interface entre le bâtiment et le sol. Notions et définitions. Fondation: élément de liaison avec le sol. Fondation superficielle: proche de la surface. Fondation profonde: atteint les couches profondes. Semelle filante: sous un mur. Semelle isolée: sous un poteau. Radier: dalle générale sous tout le bâtiment. Pieu: fondation profonde. Sol porteur: couche résistante. Tassement: affaissement du sol. Exemples concrets. Semelles filantes pour un pavillon. Radier pour un sol hétérogène. Pieux pour un bâtiment lourd. Exercice d'application. Associe trois types de sols à un type de fondation adapté. Explique pourquoi une semelle filante est courante pour les murs porteurs. Indique quand utiliser des fondations profondes. Corrigé. 1. Rocheux égale superficielle; argileux mou égale profonde ou radier; hétérogène égale radier. 2. Parce qu'elle reprend les charges du mur sur une longueur. 3. Quand le sol porteur est profond. À retenir. Le choix des fondations est déterminant. Il dépend de la nature du sol. La stabilité du bâtiment repose sur les fondations. Sources utiles. Fiches de Technologie de Métier, 1re année Construction (fondations). Fiches de Procédés de Réalisation (terrassement et fondations). Limite: l'adaptation en 1re est une simplification."]],"4":[["fr","Leçon 3, Les murs et les planchers. Situation de départ. Un maçon veut abattre un mur pour agrandir une pièce. Un autre lui dit que ce mur est porteur. Que signifie cette distinction? Quels risques? Objectifs spécifiques. Distinguer murs porteurs et cloisons. Connaître les matériaux de base. Comprendre le rôle des planchers. Explication. Les murs porteurs supportent les planchers et la toiture; on ne peut pas les abattre sans précaution. Les cloisons ne portent rien: elles séparent les espaces. Les planchers transmettent les charges aux murs ou aux poutres. Les matériaux locaux (briques, parpaings) sont courants en R D C. [ Image Batiment1_L3_01: murs porteurs vs cloisons ]. La distinction murs porteurs ou cloisons est essentielle. Notions et définitions. Mur porteur: mur qui supporte des charges. Cloison: mur non porteur. Brique: élément de maçonnerie. Parpaing: bloc de béton. Béton: mélange ciment-gravier-sable-eau. Plancher: surface horizontale. Dalle: plancher en béton. Hourdis: élément de plancher. Poutre: élément horizontal porteur. Exemples concrets. Murs en briques de terre cuite. Parpaings. Planchers en dalle ou en bois. Exercice d'application. Identifie sur un plan simple les murs porteurs et les cloisons. Propose un matériau adapté à un mur extérieur. Explique le risque d'abattre un mur porteur. Corrigé. 1. Repérer les murs qui supportent les planchers. 2. Brique ou parpaing. 3. Risque d'effondrement. À retenir. Les murs porteurs sont essentiels à la stabilité. Les cloisons séparent sans porter. Les matériaux locaux sont courants. Sources utiles. Fiches de Technologie de Métier, 1re année (murs, planchers). Fiches de Dessin d'Architecture. Limite: l'adaptation en 1re est une simplification."]],"5":[["fr","Leçon 4, La toiture et l'adaptation au climat. Situation de départ. À Kinshasa, les pluies sont intenses. Une toiture mal conçue provoque des infiltrations. Quels éléments faut-il prévoir pour une toiture adaptée au climat équatorial? Objectifs spécifiques. Identifier les types de toiture. Comprendre le rôle de la toiture. Connaître les matériaux courants. Explication. La toiture protège le bâtiment des intempéries. Elle comprend: une charpente (structure); une couverture (tôles, tuiles). La pente facilite l'écoulement de l'eau. La ventilation évite la condensation. En R D C, les toitures en tôles sont courantes. [ Image Batiment1_L4_01: toiture à deux pans et ventilation ]. La toiture doit être conçue pour le climat. Notions et définitions. Charpente: structure de la toiture. Couverture: partie extérieure. Pente: inclinaison. Tôle: plaque métallique. Tuile: élément de couverture. Gouttière: conduit d'évacuation. Ventilation: circulation d'air. Étanchéité: propriété d'imperméabilité. Exemples concrets. Toiture en tôles ondulées. Charpente en bois. Problèmes d'infiltration et de chaleur. Exercice d'application. Dessine le croquis d'une toiture à deux pans et indique la pente. Propose deux mesures pour améliorer la ventilation. Indique pourquoi la pente est importante. Corrigé. 1. Croquis avec pente visible. 2. Ouvrants, espace sous toiture. 3. Facilite l'écoulement de l'eau. À retenir. La toiture protège des intempéries. Elle doit être adaptée au climat. La pente et la ventilation sont essentielles. Sources utiles. Fiches de Technologie de Métier, 1re année (toiture). Fiches de Dessin d'Architecture. Limite: l'adaptation en 1re est une simplification."]],"6":[["fr","Leçon 5, Lire un plan simple et organiser un chantier. Situation de départ. Un chef de chantier reçoit un plan, mais il ne sait pas par où commencer. Comment lire le plan et organiser le travail? Objectifs spécifiques. Lire un plan de principe. Identifier les éléments d'un chantier. Comprendre l'organisation d'un chantier simple. Explication. Un plan montre les vues, les coupes et les cotes. Lire un plan permet de comprendre ce qu'il faut construire. L'organisation d'un chantier comprend: l'installation (baraquement, stockage); la sécurité (casques, échafaudages); l'approvisionnement en matériaux. [ Image Batiment1_L5_01: plan simple et organisation de chantier ]. Le plan et l'organisation sont les outils du chef de chantier. Notions et définitions. Plan: dessin technique. Vue en plan: vue de dessus. Coupe: vue en tranche. Façade: vue extérieure. Cote: dimension chiffrée. Échelle: rapport dessin ou réalité. Installation de chantier: organisation matérielle. Sécurité: mesures de prévention. Approvisionnement: fourniture des matériaux. Exemples concrets. Plan d'un pavillon simple. Organisation d'un chantier à Kinshasa. Sécurité sur les chantiers. Exercice d'application. Lis un plan simple et identifie les pièces et les dimensions. Propose un plan d'installation de chantier. Explique l'importance de la sécurité. Corrigé. 1. Identifier pièces et dimensions. 2. Zones de stockage et circulation. 3. La sécurité protège les ouvriers et le chantier. À retenir. Le plan est le langage du chantier. L'organisation assure l'efficacité. La sécurité est une priorité. Sources utiles. Fiches de Dessin d'Architecture. Fiches de Technologie de Métier. Limite: l'adaptation en 1re est une simplification."]],"7":[["fr","Évaluation finale, Construction ou Bâtiment. Évaluation finale. 36 questions à choix multiple. Une seule réponse est correcte par question. Choisis la réponse qui te semble juste, puis valide."]]}};

      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }

    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial"
        ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet."
        : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
