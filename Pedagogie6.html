    title: "Leçon 1 — La pédagogie : définition, objet et courants",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À l'Institut de Mbandaka, un élève-maître se demande : « Qu'est-ce que la pédagogie, au juste ? Est-ce un art ou une science ? » Son professeur lui répond que la pédagogie est à la fois art, science, philosophie et technique. Voici pourquoi.</p></div>
<h3>1. Définition et objet</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Pédagogie</strong> : art et science de l'éducation. Elle est aussi philosophie et technique.</li><li><strong>Science</strong> : elle a un objet (l'éducation) et des méthodes rigoureuses.</li><li><strong>Art</strong> : elle exige un don, un talent inné, une aisance dans la communication.</li><li><strong>Philosophie</strong> : elle détermine la finalité de l'éducation.</li><li><strong>Technique</strong> : elle cherche les moyens et méthodes pour réussir l'œuvre éducative.</li></ul></div>
<h3>2. Les courants pédagogiques traditionnels</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Pédagogie appliquée</strong> : étudie les disciplines particulières et l'application des résultats.</li><li><strong>Pédagogie expérimentale</strong> : étudie les faits pédagogiques par des procédés expérimentaux (Binet en France, Buyse en Belgique).</li><li><strong>Pédagogie comparée</strong> : compare les systèmes éducatifs (fondateur : Marc-Antoine Jullien de Paris).</li><li><strong>Pédagogie empirique</strong> : basée sur l'expérience vulgaire, non scientifique.</li><li><strong>Pédagogie directive</strong> : l'enseignant commande et contrôle (partisan : Rabelais).</li><li><strong>Pédagogie libertaire</strong> : centrée sur la liberté (fondateur : Jean-Jacques Rousseau).</li></ul></div>
<h3>3. Les courants modernes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Pédagogie rénovée</strong> : prend en compte l'équilibre entre l'enfant et son milieu (Claparède, Binet, Decroly, Montessori, Piaget).</li><li><strong>Pédagogie non directive</strong> : centrée sur la liberté de l'apprenant (Carl Rogers).</li><li><strong>Pédagogie par objectifs (PPO)</strong> : formulation d'objectifs opérationnels.</li><li><strong>Pédagogie par compétences (APC)</strong> : mobilisation des savoirs en situation.</li><li><strong>Pédagogie d'intégration</strong> : intégration des acquis dans des situations complexes.</li></ul></div>
<h3>4. Les grands pédagogues</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Socrate</strong> (470-399 av. J.-C.) : méthode interrogative (maïeutique).</li><li><strong>Montaigne</strong> (1533-1592) : « Mieux vaut une tête bien faite qu'une tête bien pleine. »</li><li><strong>Rabelais</strong> (1494-1553) : « Mieux vaut une tête bien pleine qu'une tête bien faite. »</li><li><strong>Comenius</strong> (1592-1670) : père de la didactique, érige la pédagogie en science autonome.</li><li><strong>Rousseau</strong> (1712-1778) : père du pédocentrisme (l'enfant au centre de l'éducation).</li><li><strong>Claparède</strong> : « Discat a puero magister » (que le maître apprenne de l'enfant).</li></ul><p><a href="https://www.youtube.com/results?search_query=pédagogie+définition+objet+courants+pédagogiques" target="_blank" rel="noopener">🎥 Recherche : introduction à la pédagogie (chaînes de cours de pédagogie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La pédagogie est à la fois art, science, philosophie et technique. Son objet est l'éducation. Les courants traditionnels (appliquée, expérimentale, comparée) et modernes (rénovée, non directive, PPO, APC) structurent la réflexion pédagogique.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de Pédagogie (2009), Cours de Pédagogie Générale 6ème PEDA (Prof. Fiston EKANGA MOTINGA), Manuel de Pédagogie Générale 4ème année (manuels-scolaires-rdc.com, 2025).<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, HPR, PPO, APC.</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un cours d'histoire de l'éducation, ton professeur te demande : « Comment l'école congolaise a-t-elle évolué de l'État indépendant du Congo à nos jours ? » Tu dois retracer les grandes étapes.</p></div>
<h3>1. L'éducation à l'époque de l'EIC (1885-1908)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Genèse</strong> : premières écoles fondées par les missions religieuses.</li><li><strong>Objectifs</strong> : formation d'une main-d'œuvre auxiliaire et évangélisation.</li><li><strong>Caractéristiques</strong> : écoles de colonies scolaires, centrées sur l'instruction religieuse et les travaux manuels.</li><li><strong>Limites</strong> : accès très limité, absence de politique éducative structurée.</li></ul></div>
<h3>2. L'enseignement sous la colonisation belge (1908-1960)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Partenariat État-Missions</strong> : l'État confie l'enseignement aux missions catholiques et protestantes.</li><li><strong>Distinction</strong> : écoles pour indigènes et écoles pour Européens.</li><li><strong>Réforme de 1948</strong> : structuration de l'enseignement, développement de l'enseignement technique et professionnel.</li><li><strong>Écoles de métiers</strong> : créées au Katanga et à Léopoldville pour soutenir l'économie industrielle.</li><li><strong>Limites</strong> : enseignement élitiste, peu adapté aux réalités congolaises.</li></ul></div>
<h3>3. L'école congolaise post-indépendance (1960-1990)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Réforme de 1961</strong> : unification du système éducatif, programme unique.</li><li><strong>Nationalisation des universités</strong> : création de l'UNAZA (Université nationale du Zaïre).</li><li><strong>Zaïrianisation</strong> (1974-1977) : adaptation des programmes aux réalités nationales.</li><li><strong>Explosion démographique scolaire</strong> : augmentation massive des effectifs.</li><li><strong>Création de l'IPN</strong> (Institut pédagogique national) en 1961.</li></ul></div>
<h3>4. Les réformes actuelles et la gratuité (1990-2025)</h3>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'enseignement au Congo a évolué de l'EIC (écoles missionnaires) à la colonisation belge (partenariat État-Missions), puis à l'école post-indépendance (unification, zaïrianisation) et enfin aux réformes actuelles (gratuité, HPR).</p></div>
<div class="sources"><strong>Sources :</strong> Manuel de Pédagogie Générale 4ème année (manuels-scolaires-rdc.com, 2025), Cours de Pédagogie Générale 6ème PEDA (Prof. Fiston EKANGA MOTINGA), Programme national de Pédagogie (2009).</div>

    title: "Leçon 3 — Limites et anomalies de l'éducation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À Kinshasa, un enseignant constate que certains élèves n'apprennent pas malgré ses efforts. Il se demande : « Quelles sont les limites de l'action éducative ? » La réponse se trouve dans l'étude des limites et anomalies de l'éducation.</p></div>
<h3>1. Les facteurs limitant l'action éducative</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Héritage biologique</strong> : prédisposition génétique, capacités intellectuelles.</li><li><strong>Influence du milieu</strong> : conditions socio-économiques précaires, environnement familial.</li><li><strong>Liberté de l'enfant</strong> : l'apprenant peut refuser ou accepter l'influence éducative.</li><li><strong>Autorité du maître</strong> : tension entre l'offre éducative et l'acceptation par l'élève.</li><li><strong>Attitude du maître</strong> : ne pas briser la volonté de l'enfant, mais guider sa liberté vers l'adhésion volontaire.</li></ul></div>
<h3>2. Les anomalies physiologiques et sensorielles</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Troubles de la vision</strong> : myopie, hypermétropie, astigmatisme.</li><li><strong>Troubles de l'audition</strong> : surdité partielle ou totale.</li><li><strong>Troubles de la parole</strong> : bégaiement, dyslexie.</li><li><strong>Stratégies pédagogiques</strong> : placement optimal de l'élève en classe, collaboration avec les services de santé scolaire.</li></ul></div>
<h3>3. Les anomalies psychologiques et caractérielles</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Instabilité émotionnelle</strong> : sautes d'humeur, impulsivité.</li><li><strong>Blocages affectifs</strong> : peur, anxiété, manque de confiance.</li><li><strong>Troubles du comportement</strong> : agressivité, inhibition, opposition.</li><li><strong>Rôle de l'enseignant</strong> : dépistage précoce, médiation, orientation vers des psychologues ou structures spécialisées.</li></ul></div>
<h3>4. Exemple d'application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Dans une école de Mbuji-Mayi, un élève myope est placé au premier rang. L'enseignant collabore avec l'infirmière scolaire pour lui faire porter des lunettes. Résultat : l'élève participe mieux et ses résultats s'améliorent.</p><p><a href="https://www.youtube.com/results?search_query=limites+anomalies+éducation+troubles+apprentissage" target="_blank" rel="noopener">🎥 Recherche : limites et anomalies de l'éducation (chaînes de cours de pédagogie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'éducation a des limites : héritage biologique, milieu, liberté de l'enfant. Les anomalies peuvent être physiologiques (vision, audition, parole) ou psychologiques (émotionnelles, comportementales). L'enseignant doit dépister et adapter sa pédagogie.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel de Pédagogie Générale 4ème année (manuels-scolaires-rdc.com, 2025), Cours de Pédagogie Générale 6ème PEDA (Prof. Fiston EKANGA MOTINGA).</div>
    `

<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un village de l'Équateur, un ancien enseigne aux jeunes les techniques de pêche et les rites du clan. À Kinshasa, une école moderne dispense des cours théoriques. Deux formes d'éducation : traditionnelle et nouvelle.</p></div>
<h3>1. Caractéristiques de l'éducation traditionnelle africaine</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Oralité</strong> : transmission par la parole, les contes, les proverbes.</li><li><strong>Collectivité</strong> : l'enfant appartient au clan, à la communauté.</li><li><strong>Pragmatisme</strong> : apprentissage des métiers et des mœurs par imitation.</li><li><strong>Rites d'initiation</strong> : passage à l'âge adulte, intégration sociale.</li><li><strong>Objectif</strong> : intégration immédiate dans la société.</li></ul></div>
<h3>2. Caractéristiques de l'éducation nouvelle et scolaire</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Écrit</strong> : transmission par l'écrit, les manuels, les programmes codifiés.</li><li><strong>Théorique</strong> : savoirs abstraits, scientifiques.</li><li><strong>Individualisante</strong> : l'élève est évalué individuellement.</li><li><strong>Certifications</strong> : diplômes, grades, examens.</li><li><strong>Vocation</strong> : ouvrir l'esprit sur l'universel et la science.</li><li><strong>Limite</strong> : parfois déconnectée du milieu de vie de l'enfant.</li></ul></div>
<h3>3. Comparaison critique</h3>

<h3>4. Synthèse pour une pédagogie adaptée</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>L'école congolaise moderne peut récupérer les valeurs de solidarité et de respect des aînés propres à la tradition, tout en maintenant les exigences académiques modernes. C'est la recherche d'une <strong>pédagogie inculturée</strong>, pertinente pour le développement national.</p><p><a href="https://www.youtube.com/results?search_query=éducation+traditionnelle+africaine+éducation+nouvelle+comparaison" target="_blank" rel="noopener">🎥 Recherche : formes traditionnelles et nouvelles de l'éducation (chaînes de cours de pédagogie)</a></p></div>

<div class="sources"><strong>Sources :</strong> Manuel de Pédagogie Générale 4ème année (manuels-scolaires-rdc.com, 2025), Cours de Pédagogie Générale 6ème PEDA (Prof. Fiston EKANGA MOTINGA).</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>À l'EXETAT, on te propose le sujet : « L'enseignant doit-il être un modèle pour ses élèves ? » Tu dois rédiger une dissertation pédagogique. Sans méthode, on se perd.</p></div>
<h3>1. Nature et objectifs</h3>

    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm && !isQuiz) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>
</body>
</html>
