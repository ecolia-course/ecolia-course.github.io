const slides = [
{
    title: "Sommaire — Pédagogie générale 1re secondaire",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>La pédagogie, c'est l'art d'éduquer et d'enseigner. Dans ce cours, tu vas découvrir l'école, ses acteurs, les grands concepts de l'éducation, les pédagogues congolais, et les premières techniques du métier d'enseignant. Tu apprendras par l'observation, l'analyse de cas et la pratique.</p>
<ul>
<li>Leçon 1 — Qu'est-ce que la pédagogie ?</li>
<li>Leçon 2 — L'école et ses acteurs</li>
<li>Leçon 3 — L'observation psychopédagogique</li>
<li>Leçon 4 — Éducation, instruction, enseignement, formation</li>
<li>Leçon 5 — Les grands courants pédagogiques</li>
<li>Leçon 6 — Les pédagogues congolais</li>
<li>Leçon 7 — La vocation et l'éthique de l'enseignant</li>
<li>Leçon 8 — L'autorité pédagogique</li>
<li>Leçon 9 — L'hygiène et la sécurité à l'école</li>
<li>Leçon 10 — Les méthodes actives</li>
<li>Leçon 11 — Gérer une classe à effectifs élevés</li>
<li>Leçon 12 — Les documents pédagogiques</li>
</ul>
<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques de Pédagogie Générale (2025), Loi-Cadre de l'enseignement national, Durkheim, Meirieu, Rogers. Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 1 — Qu'est-ce que la pédagogie ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certains enseignants réussissent-ils à faire apprendre leurs élèves, tandis que d'autres échouent ? Qu'est-ce que l'art d'enseigner ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir la pédagogie. Distinguer pédagogie et sciences de l'éducation. Comprendre l'utilité de la pédagogie. Prérequis : aucun.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>pédagogie</strong> est l'art et la science de l'éducation et de l'enseignement. Elle étudie les méthodes, les pratiques et les conditions qui favorisent l'apprentissage.</p>
<p>Elle se distingue des <strong>sciences de l'éducation</strong> (psychologie, sociologie, histoire, philosophie de l'éducation), qui l'éclairent mais ne se confondent pas avec elle. La pédagogie est tournée vers l'action : elle cherche <em>comment</em> faire apprendre.</p>
<p>La pédagogie comporte une dimension <strong>théorique</strong> (concepts, courants) et une dimension <strong>pratique</strong> (méthodes, gestes professionnels).</p>
</div>
<img src="images/Pedagogie1_1.jpg" alt="Enseignant et élèves en classe" data-image-id="Pedagogie1_1" onerror="this.style.display='none'">

<h3>3. Méthodes et techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>La pédagogie s'apprend par l'observation (regarder des enseignants, des classes), l'analyse (comprendre ce qui fonctionne) et la pratique (simulations, stages). Elle exige une réflexivité : réfléchir sur ses propres pratiques pour les améliorer.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Dans une école de Kinshasa, un enseignant utilise des chansons pour faire mémoriser les tables de multiplication. Un autre utilise des groupes de travail. Les deux font de la pédagogie : ils choisissent des méthodes pour faire apprendre.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis la pédagogie en une phrase.</p>
<p><strong>Ex. 2 :</strong> Quelle est la différence entre pédagogie et didactique ?</p>
<details><summary>Corrigé</summary>
<p>1) La pédagogie est l'art et la science de l'éducation et de l'enseignement. 2) La pédagogie concerne l'éducation en général ; la didactique concerne l'enseignement d'une discipline particulière.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La pédagogie est une discipline à la fois théorique et pratique, tournée vers l'action éducative.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques de Pédagogie Générale (2025).</div>
    `
},
{
    title: "Leçon 2 — L'école et ses acteurs",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qui fait fonctionner une école ? Quels sont les rôles du directeur, des enseignants, des élèves, des parents ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Identifier les acteurs de l'école. Décrire leurs rôles. Comprendre la typologie des écoles en RDC. Prérequis : leçon 1.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Acteurs internes :</strong> directeur (ou préfet), enseignants, élèves, personnel administratif et de soutien, conseil des enseignants, conseil des élèves.</p>
<p><strong>Acteurs externes :</strong> parents, ministère de l'Éducation (EPST), inspections, partenaires (ONG, églises), communauté locale.</p>
<p><strong>Typologie des écoles en RDC :</strong> écoles officielles (publiques), conventionnées (catholiques, protestantes, islamiques), privées agréées, privées non agréées.</p>
<p>Le directeur dirige et coordonne ; l'enseignant enseigne et éduque ; l'élève apprend ; les parents soutiennent ; l'État garantit le droit à l'éducation.</p>
</div>
<img src="images/Pedagogie1_2.jpg" alt="École en RDC" data-image-id="Pedagogie1_2" onerror="this.style.display='none'">

<h3>3. Méthodes et techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour analyser une école : identifier son type, ses acteurs, leurs rôles, ses ressources, ses contraintes. Utiliser une grille d'observation pour décrire l'école. Comprendre que chaque acteur a une responsabilité dans la réussite des élèves.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une école conventionnée catholique de Lubumbashi a un directeur nommé par la coordination diocésaine, des enseignants formés, des élèves majoritairement issus du quartier. Les parents participent aux réunions. L'État paie les salaires et contrôle la qualité. Chaque acteur a un rôle précis.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois acteurs de l'école et leur rôle.</p>
<p><strong>Ex. 2 :</strong> Quelle est la différence entre une école officielle et une école conventionnée ?</p>
<details><summary>Corrigé</summary>
<p>1) Directeur (dirige), enseignant (enseigne), élève (apprend). 2) L'école officielle est gérée directement par l'État ; l'école conventionnée est gérée par une confession religieuse en partenariat avec l'État.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'école est un système d'acteurs complémentaires ; comprendre leurs rôles est essentiel pour le futur enseignant.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques de Pédagogie Générale (2025), Loi-Cadre.</div>
    `
},
{
    title: "Leçon 3 — L'observation psychopédagogique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment un futur enseignant peut-il apprendre en observant une classe ? Que faut-il observer ? Comment noter ses observations ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre l'utilité de l'observation. Utiliser une grille d'observation. Rédiger un rapport d'observation. Prérequis : leçons 1 et 2.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'<strong>observation</strong> est une méthode d'apprentissage qui consiste à regarder attentivement une situation pour la comprendre, sans intervenir.</p>
<p><strong>Objets d'observation :</strong> l'organisation de la classe, les méthodes de l'enseignant, les réactions des élèves, les interactions, le climat de classe, la gestion du temps, le matériel.</p>
<p><strong>Grille d'observation :</strong> outil structuré qui permet de noter systématiquement des indicateurs.</p>
<p><strong>Rapport d'observation :</strong> document qui présente les faits observés, l'analyse et les conclusions.</p>
</div>
<img src="images/Pedagogie1_3.jpg" alt="Grille d'observation" data-image-id="Pedagogie1_3" onerror="this.style.display='none'">

<h3>3. Méthodes et techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Avant : préparer la grille, définir les objectifs, se présenter. Pendant : observer discrètement, noter les faits (pas les jugements), chronométrer. Après : classer les observations, analyser, rédiger le rapport, discuter avec l'enseignant.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève-maître observe une classe de 3e année à Kinshasa. Il note : l'enseignant commence par un rappel, utilise le tableau, interroge 15 élèves en 30 minutes, utilise un chant pour la motivation. Il rédige un rapport : « L'enseignant utilise une méthode active, mais interroge surtout les élèves du premier rang. »</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois objets d'observation.</p>
<p><strong>Ex. 2 :</strong> Pourquoi faut-il noter les faits et non les jugements ?</p>
<details><summary>Corrigé</summary>
<p>1) Organisation de la classe, méthodes de l'enseignant, réactions des élèves. 2) Parce que les jugements sont subjectifs et ne permettent pas une analyse objective.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'observation est un outil essentiel de la formation des enseignants ; elle exige une grille et une méthode rigoureuse.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques de Pédagogie Générale (2025).</div>
    `
},
{
    title: "Leçon 4 — Éducation, instruction, enseignement, formation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Éduquer, instruire, enseigner, former : est-ce la même chose ? Pourquoi quatre mots différents ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Distinguer ces quatre concepts. Comprendre leurs relations. Les appliquer à des situations concrètes. Prérequis : leçons 1 à 3.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Éducation :</strong> action globale de formation de la personne, qui vise le développement de toutes ses dimensions (intellectuelle, morale, physique, sociale, affective).</p>
<p><strong>Instruction :</strong> acquisition de connaissances et de savoir-faire dans une discipline.</p>
<p><strong>Enseignement :</strong> action méthodique par laquelle l'enseignant organise la transmission d'un savoir.</p>
<p><strong>Formation :</strong> processus de développement des compétences professionnelles ou personnelles.</p>
<p>L'enseignement transmet une instruction, qui contribue à l'éducation ; la formation est un processus plus large qui inclut l'éducation et l'instruction.</p>
</div>
<img src="images/Pedagogie1_4.jpg" alt="Éducation, instruction, enseignement, formation" data-image-id="Pedagogie1_4" onerror="this.style.display='none'">

<h3>3. Méthodes et techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour distinguer les concepts, se demander : « Quelle est la finalité ? » (éducation), « Quel est le contenu ? » (instruction), « Quelle est l'action ? » (enseignement), « Quel est le processus ? » (formation).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un enseignant de mathématiques explique une leçon sur les fractions (enseignement). Les élèves acquièrent des connaissances sur les fractions (instruction). Mais en même temps, ils apprennent la rigueur, la persévérance, le respect des règles (éducation).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la différence entre éducation et instruction ?</p>
<details><summary>Corrigé</summary>
<p>1) L'éducation est la formation globale de la personne ; l'instruction est l'acquisition de connaissances disciplinaires.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Éducation, instruction, enseignement et formation sont des concepts complémentaires qui structurent l'action éducative.</p></div>

<div class="sources"><strong>Sources :</strong> Durkheim, Éducation et sociologie.</div>
    `
},
{
    title: "Leçon 5 — Les grands courants pédagogiques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certains enseignants font-ils participer les élèves, tandis que d'autres font des cours magistraux ? Ces choix viennent de courants pédagogiques. »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Identifier les principaux courants. Associer chaque courant à ses représentants et à ses principes. Comprendre leur influence sur l'école congolaise. Prérequis : leçon 4.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<ul>
<li><strong>Pédagogie traditionnelle :</strong> centrée sur l'enseignant et le savoir (Comenius).</li>

<li><strong>Pédagogie différenciée :</strong> adaptation aux besoins (Meirieu).</li>
<li><strong>Approche centrée sur l'apprenant :</strong> climat de confiance (Carl Rogers).</li>

            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
