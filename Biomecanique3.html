<script>
const COURSE_TITLE = "Biomecanique";
const slides = [
{
    title: "Sommaire — Biomécanique 3e année",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours initie à l'analyse du mouvement humain : notions élémentaires de force, de vitesse et d'équilibre, leviers du corps humain, décomposition des gestes sportifs, application à l'enseignement de l'EPS.</p>
<p><strong>Note de transparence :</strong> aucun programme officiel spécifique de biomécanique pour la 3e année HP n'a été localisé dans les sources consultées. Le cadre HPR mentionne l'éducation physique et sportive, mais pas explicitement la biomécanique. La progression ci-dessous est une <strong>proposition pédagogique</strong> cohérente avec la formation des futurs enseignants d'EPS, à valider par l'enseignant.</p>
<ul>
<li>Leçon 1 — Introduction : qu'est-ce que la biomécanique ?</li>
<li>Leçon 2 — Notions de base : force, masse, vitesse, accélération</li>
<li>Leçon 3 — Les leviers du corps humain</li>
<li>Leçon 4 — Statique et équilibre</li>
<li>Leçon 5 — Analyse du mouvement : marche et course</li>
<li>Leçon 6 — Analyse du mouvement : saut et lancer</li>
<li>Leçon 7 — Application à l'EPS : correction technique et prévention</li>
<li>Leçon 8 — Synthèse et évaluation</li>
</ul>
<p>Une évaluation finale de 12 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme HPR (cadre général EPS) ; références générales en biomécanique appliquée au sport. Statut du programme spécifique de 3e HP à valider.</div>
    `
},
{
    title: "Leçon 1 — Introduction : qu'est-ce que la biomécanique ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi deux façons de sauter donnent-elles deux performances différentes ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la biomécanique. Comprendre son utilité pour l'EPS. Distinguer biomécanique et anatomie.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>La <strong>biomécanique</strong> est l'application des lois de la mécanique au corps humain en mouvement. Elle étudie les forces, les mouvements et les équilibres du corps pour comprendre et améliorer la performance, prévenir les blessures et corriger la technique.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Utilité pour l'EPS</div>
<ul>
<li>Analyser un geste sportif (saut, course, lancer).</li>
<li>Corriger la technique d'un élève.</li>
<li>Comprendre les causes d'une blessure.</li>
<li>Adapter le matériel et les exercices.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Biomécanique et anatomie</div>
<ul>
<li><strong>Anatomie :</strong> décrit les structures (os, muscles, articulations).</li>
<li><strong>Biomécanique :</strong> analyse les mouvements et les forces qui les produisent.</li>
</ul>
<p>Les deux disciplines se complètent : on ne peut pas analyser un mouvement sans connaître les structures qui le permettent.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis la biomécanique en une phrase.</p>
<p><strong>Ex. 2 :</strong> Cite deux situations sportives où la biomécanique est utile.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Application des lois de la mécanique au corps humain en mouvement. <strong>2)</strong> Correction d'un saut en longueur, prévention d'une entorse.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La biomécanique analyse le mouvement pour améliorer la performance et prévenir les blessures.</p></div>
<div class="sources"><strong>Sources :</strong> Références générales en biomécanique.</div>
    `
},
{
    title: "Leçon 2 — Notions de base : force, masse, vitesse, accélération",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi faut-il plus de force pour soulever une caisse lourde qu'une caisse légère ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les notions de force, masse, vitesse, accélération. Utiliser les unités. Distinguer masse et poids.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Force</div>
<p>La <strong>force</strong> est une action capable de modifier le mouvement ou la forme d'un corps. Elle s'exprime en newtons (N). Exemples : poussée, traction, poids, force musculaire.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Masse et poids</div>
<ul>
<li><strong>Masse :</strong> quantité de matière, exprimée en kilogrammes (kg). Elle ne change pas.</li>
<li><strong>Poids :</strong> force exercée par la gravité sur cette masse, exprimée en newtons (N). Il dépend du lieu (un peu différent sur la Lune).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Vitesse et accélération</div>
<ul>
<li><strong>Vitesse :</strong> distance parcourue par unité de temps (m/s ou km/h).</li>
<li><strong>Accélération :</strong> variation de la vitesse dans le temps (m/s²). Positive quand on accélère, négative quand on freine.</li>
</ul>
<p>Exemple : un coureur qui passe de 0 à 10 m/s en 2 secondes a une accélération moyenne de 5 m/s².</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Application sportive</div>
<p>Pour lancer un ballon loin, il faut :</p>
<ul>
<li>appliquer une <strong>force</strong> importante au bon moment ;</li>
<li>augmenter la <strong>vitesse</strong> du geste ;</li>
<li>utiliser la <strong>coordination</strong> du corps entier.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Distingue masse et poids.</p>
<p><strong>Ex. 2 :</strong> Un élève court 60 m en 10 secondes. Calcule sa vitesse moyenne.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Masse : quantité de matière (kg) ; poids : force gravitationnelle (N). <strong>2)</strong> v = 60/10 = 6 m/s.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Force, masse, vitesse et accélération sont les grandeurs de base de la biomécanique.</p></div>
<div class="sources"><strong>Sources :</strong> Références générales en mécanique appliquée au sport.</div>
    `
},
{
    title: "Leçon 3 — Les leviers du corps humain",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment le bras peut-il soulever une charge lourde avec un muscle relativement petit ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la notion de levier. Distinguer les trois types de leviers. Identifier des leviers dans le corps humain.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le levier</div>
<p>Un <strong>levier</strong> est une barre rigide qui pivote autour d'un point fixe (le pivot). Trois éléments le composent : la force motrice (F), la charge (C) et le pivot (P). La position de ces trois éléments définit le type de levier.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les trois types de leviers</div>
<ul>
<li><strong>Levier inter-appui :</strong> le pivot est entre la force et la charge. Ex. : bascule, tête qui se redresse.</li>
<li><strong>Levier inter-résistant :</strong> la charge est entre le pivot et la force. Ex. : le pied qui se met sur la pointe (mollet).</li>
<li><strong>Levier inter-moteur :</strong> la force est entre le pivot et la charge. Ex. : le bras qui fléchit (biceps).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Exemples dans le corps</div>
<ul>
<li><strong>Avant-bras (biceps) :</strong> levier inter-moteur ; le muscle est proche du pivot, ce qui privilégie la vitesse et l'amplitude.</li>
<li><strong>Pied (mollet) :</strong> levier inter-résistant ; le pied sert de levier pour soulever le corps.</li>
<li><strong>Tête :</strong> levier inter-appui, maintenue en équilibre sur la colonne.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les trois types de leviers et un exemple pour chacun.</p>
<p><strong>Ex. 2 :</strong> Le mouvement de flexion du coude par le biceps est un levier : de quel type ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Inter-appui (tête), inter-résistant (pied), inter-moteur (biceps). <strong>2)</strong> Inter-moteur.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le corps humain fonctionne par leviers : leur connaissance aide à comprendre la force et la vitesse des mouvements.</p></div>
<div class="sources"><strong>Sources :</strong> Références de biomécanique.</div>
    `
},
{
    title: "Leçon 4 — Statique et équilibre",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi est-il plus difficile de tenir en équilibre sur une jambe ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la notion d'équilibre. Identifier les facteurs d'équilibre. Relier équilibre et centre de gravité.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Centre de gravité</div>
<p>Le <strong>centre de gravité</strong> est le point d'application du poids du corps. Chez l'homme debout, il se situe approximativement au niveau du bassin. Pour être en équilibre, la verticale passant par le centre de gravité doit tomber à l'intérieur de la base d'appui.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Base d'appui</div>
<p>La <strong>base d'appui</strong> est la surface par laquelle le corps touche le sol (les deux pieds, un seul pied, les mains, etc.). Plus la base est large, plus l'équilibre est stable.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Facteurs d'équilibre</div>
<ul>
<li>Taille de la base d'appui.</li>
<li>Hauteur du centre de gravité (plus il est bas, plus l'équilibre est stable).</li>
<li>Position du centre de gravité par rapport à la base.</li>
<li>Contrôle musculaire et attention.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis le centre de gravité.</p>
<p><strong>Ex. 2 :</strong> Explique pourquoi il est plus difficile de tenir en équilibre sur une jambe que sur deux.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Point d'application du poids du corps. <strong>2)</strong> Sur une jambe, la base d'appui est plus petite ; l'équilibre est moins stable.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'équilibre dépend du centre de gravité, de la base d'appui et du contrôle musculaire.</p></div>
<div class="sources"><strong>Sources :</strong> Références de biomécanique.</div>
    `
},
{
    title: "Leçon 5 — Analyse du mouvement : marche et course",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qu'est-ce qui distingue la marche de la course ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Décrire les phases de la marche et de la course. Identifier les forces en jeu. Repérer les erreurs de course.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Phases de la marche</div>
<ul>
<li><strong>Phase d'appui :</strong> un pied est au sol ; le corps avance.</li>
<li><strong>Phase oscillante :</strong> le pied quitte le sol et avance.</li>
</ul>
<p>Dans la marche, il y a toujours un appui au sol (pas de phase de suspension).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Phases de la course</div>
<ul>
<li><strong>Phase d'appui :</strong> un pied au sol.</li>
<li><strong>Phase de suspension :</strong> aucun pied au sol (les deux pieds sont en l'air).</li>
</ul>
<p>La présence d'une phase de suspension distingue la course de la marche.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Forces en jeu</div>
<ul>
<li><strong>Force de réaction du sol :</strong> le sol pousse le corps en retour.</li>
<li><strong>Force de gravité :</strong> attire le corps vers le bas.</li>
<li><strong>Force de propulsion :</strong> produite par les muscles.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Erreurs de course fréquentes</div>
<ul>
<li>Foulée trop courte (manque de propulsion).</li>
<li>Foulée trop longue (freinage à chaque appui).</li>
<li>Bras mal coordonnés.</li>
<li>Regard dirigé vers le sol.</li>
<li>Respiration irrégulière.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite la différence principale entre marche et course.</p>
<p><strong>Ex. 2 :</strong> Observe une course et propose une correction pour un élève qui regarde ses pieds.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> La course comporte une phase de suspension. <strong>2)</strong> Demander à l'élève de fixer un point devant lui, à hauteur du regard.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Marche et course se distinguent par la phase de suspension ; l'analyse des phases aide à corriger la technique.</p></div>
<div class="sources"><strong>Sources :</strong> Références de biomécanique du sport.</div>
    `
},
{

  var synth = window.speechSynthesis || null;
  var HAS_CACHE = !!(window.caches && window.caches.open);
  var NATIVE = false;
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  var LATER = "ecolia_audio_later_" + CFG.code;
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function init() {
    if (document.getElementById("ecolia-audio-btn")) return;
    var btn = document.createElement("button");
    btn.id = "ecolia-audio-btn"; btn.type = "button"; btn.className = "ecolia-off";
    btn.setAttribute("aria-label", "Écouter la leçon"); btn.innerHTML = PLAY;
    var dlBtn = document.createElement("button");
    dlBtn.id = "ecolia-dl-btn"; dlBtn.type = "button"; dlBtn.className = "ecolia-off";
    dlBtn.innerHTML = DL;
    var host = document.querySelector(".header-right");
    if (host) { host.insertBefore(dlBtn, host.firstChild); host.insertBefore(btn, dlBtn); }
    else { btn.className += " ecolia-fixed"; document.body.appendChild(btn); }
    var banner = document.createElement("div");
    banner.id = "ecolia-audio-banner";
    banner.innerHTML = '<span class="eab-txt"></span><span class="eab-act"></span><div class="eab-bar"><i></i></div>';
    var content = document.getElementById("content");
    if (content && content.parentNode) content.parentNode.insertBefore(banner, content);
    else document.body.insertBefore(banner, document.body.firstChild);
    var txtEl = banner.querySelector(".eab-txt"), actEl = banner.querySelector(".eab-act");
    var barEl = banner.querySelector(".eab-bar"), barI = barEl.firstChild;
    var audio = new Audio();
    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }
    function cur() { try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {} return 0; }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];

      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
