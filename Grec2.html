<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours de grec ancien couvre cinq leçons essentielles : l'alphabet et la lecture, les déclinaisons (1re, 2e, 3e), les conjugaisons (présent, imparfait, futur), la syntaxe et la traduction, et la civilisation grecque (cité, démocratie, héritage).</p>

<ul>

<li>Leçon 2 — Morphologie : les déclinaisons (1re, 2e, 3e)</li>

<div class="sources"><strong>Sources :</strong> Programme National de Grec (RDC, référence partielle) ; manuels de grec pour les humanités (RDC) ; ressources pédagogiques RDC (Schoolap, EDUQUAM).</div>

{
    title: "Leçon 1 — Alphabet, lecture et accents",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment lire le grec ancien alors qu'il utilise un alphabet différent du nôtre ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Reconnaître les 24 lettres de l'alphabet grec. Lire des mots simples. Identifier esprits et accents. Prérequis : alphabet grec de 1re année.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Alphabet grec :</strong> 24 lettres (majuscules et minuscules). Exemples : α (alpha) = a ; β (bêta) = b ; γ (gamma) = g ; δ (delta) = d ; ε (epsilon) = e bref ; ζ (zêta) = z ; η (êta) = e long ; θ (thêta) = th ; ι (iota) = i ; κ (kappa) = k ; λ (lambda) = l ; μ (mu) = m ; ν (nu) = n ; ξ (xi) = x ; ο (omicron) = o bref ; π (pi) = p ; ρ (rhô) = r ; σ/ς (sigma) = s ; τ (tau) = t ; υ (upsilon) = u ; φ (phi) = ph ; χ (khi) = kh ; ψ (psi) = ps ; ω (oméga) = o long.</p>
<p><strong>Esprits :</strong> sur une voyelle initiale, l'<strong>esprit doux</strong> (’) indique l'absence d'aspiration ; l'<strong>esprit rude</strong> (῾) indique une aspiration (prononcée comme un h aspiré).</p>
<p><strong>Accents :</strong></p>
<ul>
<li><strong>Aigu</strong> (´) : peut se déplacer selon la déclinaison ou la conjugaison.</li>
<li><strong>Grave</strong> (`) : remplace l'aigu sur la dernière syllabe dans certains contextes.</li>
<li><strong>Circonflexe</strong> (῀) : indique une voyelle longue accentuée ; souvent fixe.</li>
</ul>
<p><strong>Signes de ponctuation :</strong> le point-virgule grec (;) sert de point d'interrogation ; le point en haut (·) sert de point-virgule.</p>
<p><strong>Exemples de mots :</strong> λόγος (parole, raison) ; σοφία (sagesse) ; ἀρετή (vertu) ; δημοκρατία (démocratie).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Esprit :</strong> signe d'aspiration sur une voyelle initiale. <strong>Accent :</strong> marque mélodique sur une voyelle. <strong>Sigma final :</strong> forme ς du sigma en fin de mot.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Apprendre les 24 lettres par cœur. S'entraîner à lire à voix haute. Repérer les esprits et les accents dès la première lecture. Écrire régulièrement les mots grecs pour mémoriser.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Lire « ὁ λόγος » : omicron avec esprit rude = « ho » (le) ; lambda, omicron, gamma, omicron, sigma = « logos ». Ensemble : « ho logos ». Attention : l'esprit rude se prononce comme un « h » aspiré.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Combien de lettres compte l'alphabet grec ? <strong>Ex. 2 :</strong> Quelle est la différence entre esprit doux et esprit rude ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> 24 lettres. <strong>2)</strong> Esprit doux = absence d'aspiration ; esprit rude = aspiration.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Lire le grec, c'est d'abord reconnaître les lettres, puis les esprits et les accents.</p></div>

<div class="sources"><strong>Sources :</strong> Manuels de grec pour les humanités (RDC) ; ressources pédagogiques RDC.</div>
    `

{
    title: "Leçon 2 — Morphologie : les déclinaisons (1re, 2e, 3e)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment savoir si un mot grec est sujet ou complément dans la phrase ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Décliner un nom des trois premières déclinaisons. Identifier la fonction d'un mot par sa terminaison. Accorder l'article. Prérequis : leçon 1 ; 1re déclinaison (1re année).</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>En grec, la <strong>terminaison</strong> (le cas) indique la fonction du mot, non sa place dans la phrase.</p>
<p><strong>Les cinq cas grecs :</strong></p>
<ul>
<li><strong>Nominatif :</strong> sujet, attribut du sujet.</li>
<li><strong>Vocatif :</strong> adresse (apostrophe).</li>
<li><strong>Accusatif :</strong> COD, compléments avec préposition.</li>
<li><strong>Génitif :</strong> complément du nom, partitif.</li>
<li><strong>Datif :</strong> COI, moyen, manière, lieu.</li>
</ul>
<p><strong>1re déclinaison (modèle τιμή, -ῆς, f.) :</strong> nominatif τιμή, génitif τιμῆς, datif τιμῇ, accusatif τιμήν, vocatif τιμή. Pluriel : τιμαί, τιμῶν, τιμαῖς, τιμάς, τιμαί.</p>
<p><strong>2e déclinaison (modèle λόγος, -ου, m.) :</strong> nominatif λόγος, génitif λόγου, datif λόγῳ, accusatif λόγον, vocatif λόγε. Pluriel : λόγοι, λόγων, λόγοις, λόγους, λόγοι.</p>
<p>Le neutre (modèle δῶρον, -ου, n.) : nominatif/accusatif singulier δῶρον, pluriel δῶρα.</p>
<p><strong>3e déclinaison (modèle πατήρ, πατρός, m. ; σῶμα, σώματος, n.) :</strong> le thème varie entre le nominatif et les autres cas ; il faut partir du génitif singulier pour identifier le thème.</p>
<p><strong>Article défini :</strong> ὁ (masc.), ἡ (fém.), τό (neutre) ; il s'accorde en genre, nombre et cas avec le nom.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Cas :</strong> forme du nom qui indique sa fonction. <strong>Article :</strong> mot qui précède le nom et en indique genre, nombre et cas. <strong>Thème :</strong> radical du nom.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Apprendre les tableaux par cœur. Toujours partir du génitif singulier pour identifier la déclinaison et le thème. Faire attention à l'accord de l'article. Analyser la terminaison avant de traduire.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>« ὁ λόγος » = « le mot » (nominatif singulier, article masculin). « τὸν λόγον » = « le mot » (accusatif, COD). « τοῦ λόγου » = « du mot » (génitif). « τῷ λόγῳ » = « au mot » (datif).</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la terminaison du génitif singulier de la 1re déclinaison ? <strong>Ex. 2 :</strong> À quelle déclinaison appartient « σῶμα, σώματος » ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> -ῆς. <strong>2)</strong> 3e déclinaison (neutre).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>En grec, la terminaison commande le sens ; l'article aide à identifier le genre, le nombre et le cas.</p></div>

<div class="sources"><strong>Sources :</strong> Manuels de grec pour les humanités (RDC).</div>
    `
},
{
    title: "Leçon 3 — Conjugaisons : présent, imparfait, futur",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment reconnaître le temps d'un verbe grec et le traduire correctement ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Conjuguer un verbe aux trois temps de l'indicatif actif. Reconnaître l'augment et le suffixe du futur. Traduire les temps. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Modèle λύω (délier) :</strong></p>
<p><strong>Présent de l'indicatif actif :</strong> λύω, λύεις, λύει, λύομεν, λύετε, λύουσι(ν).</p>
<p><strong>Imparfait :</strong> ἔλυον, ἔλυες, ἔλυε(ν), ἐλύομεν, ἐλύετε, ἔλυον. Marque : <strong>augment ἐ-</strong> + radical + terminaisons secondaires.</p>
<p><strong>Futur :</strong> λύσω, λύσεις, λύσει, λύσομεν, λύσετε, λύσουσι(ν). Marque : <strong>suffixe -σ-</strong> + terminaisons primaires.</p>
<p><strong>Traduction :</strong> présent → présent français ; imparfait → imparfait ; futur → futur.</p>
<p><strong>Particularités :</strong> les verbes à voyelle initiale (contraction) font l'augment par allongement de la voyelle. Les verbes contractes (en -αω, -εω, -οω) ont des formes contractées.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Augment :</strong> préfixe ἐ- qui marque les temps du passé. <strong>Suffixe -σ- :</strong> marque du futur. <strong>Terminaisons primaires / secondaires :</strong> terminaisons du présent-futur / du passé.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier le radical. Reconnaître l'augment (passé) ou le -σ- (futur). Repérer la terminaison personnelle. Traduire en respectant le temps.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>« λύω » = je délie (présent) ; « ἔλυον » = je déliais (imparfait) ; « λύσω » = je délierai (futur). Le sens général du radical « λυ- » reste constant ; c'est la terminaison et les marques (augment, σ) qui indiquent le temps.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la marque de l'imparfait grec ? <strong>Ex. 2 :</strong> Conjugue « λύω » au futur.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> L'augment ἐ-. <strong>2)</strong> λύσω, λύσεις, λύσει, λύσομεν, λύσετε, λύσουσι(ν).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'augment est la marque du passé ; le suffixe -σ- est la marque du futur.</p></div>

<div class="sources"><strong>Sources :</strong> Manuels de grec pour les humanités (RDC).</div>
    `
},
{
    title: "Leçon 4 — Syntaxe et traduction",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment traduire une phrase grecque quand on ne connaît pas tous les mots ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Appliquer une méthode de traduction. Analyser les cas et les verbes. Enrichir son vocabulaire. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Méthode de traduction :</strong></p>
<ol>
<li>Repérer le verbe (terminaison).</li>
<li>Identifier les cas des noms et des adjectifs.</li>
<li>Repérer les prépositions et leur cas.</li>
<li>Reconstruire la phrase en français selon l'ordre sujet-verbe-compléments.</li>
<li>Vérifier le sens global.</li>
</ol>
<p><strong>Prépositions fréquentes :</strong></p>
<ul>
<li>ἐν + datif : dans, en.</li>
<li>εἰς + accusatif : vers, dans (mouvement).</li>
<li>ἐκ / ἐξ + génitif : hors de.</li>
<li>πρός + accusatif : vers ; + datif : auprès de.</li>
<li>κατά + accusatif : selon, le long de ; + génitif : contre.</li>
</ul>
<p><strong>Vocabulaire de base :</strong> ἄνθρωπος (être humain) ; ἀνήρ (homme) ; γυνή (femme) ; παῖς (enfant) ; διδάσκαλος (maître) ; μαθητής (élève) ; πόλις (cité) ; οἶκος (maison) ; ἀγορά (place publique) ; λόγος (parole, raison).</p>
<p><strong>Héritage grec dans le français :</strong> philosophie (φιλοσοφία), démocratie (δημοκρατία), géographie (γεωγραφία), politique (πολιτική), théâtre (θέατρον), musée (μουσεῖον).</p>

  var DL = '<svg viewBox="0 0 24 24"><path d="M11 3h2v9.2l3.6-3.6L18 10l-6 6-6-6 1.4-1.4L11 12.2V3zM5 19h14v2H5z"/></svg>';
  var OK = '<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';
  try {
    if (typeof questions !== "undefined" && questions && questions.forEach) {
      questions.forEach(function (q) {
        if (!q.options) q.options = q.opts || q.choices || q.choix || q.reponses || q.propositions || [];
        if (q.text === undefined) q.text = q.question || q.q || q.enonce || q.titre || "";
        if (typeof q.correct === "undefined") {

          else if (typeof q.reponse !== "undefined") q.correct = q.reponse;
        }

    }
  } catch (e) {}
  var synth = window.speechSynthesis || null;
  var HAS_CACHE = !!(window.caches && window.caches.open);
  var NATIVE = false;
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  var LATER = "ecolia_audio_later_" + CFG.code;
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function init() {
    if (document.getElementById("ecolia-audio-btn")) return;
    var btn = document.createElement("button");
    btn.id = "ecolia-audio-btn"; btn.type = "button"; btn.className = "ecolia-off";
    btn.setAttribute("aria-label", "Écouter la leçon"); btn.innerHTML = PLAY;
    var dlBtn = document.createElement("button");
    dlBtn.id = "ecolia-dl-btn"; dlBtn.type = "button"; dlBtn.className = "ecolia-off";
    dlBtn.innerHTML = DL;
    var host = document.querySelector(".header-right");
    if (host) { host.insertBefore(dlBtn, host.firstChild); host.insertBefore(btn, dlBtn); }
    else { btn.className += " ecolia-fixed"; document.body.appendChild(btn); }
    var banner = document.createElement("div");
    banner.id = "ecolia-audio-banner";
    banner.innerHTML = '<span class="eab-txt"></span><span class="eab-act"></span><div class="eab-bar"><i></i></div>';
    var content = document.getElementById("content");
    if (content && content.parentNode) content.parentNode.insertBefore(banner, content);
    else document.body.insertBefore(banner, document.body.firstChild);
    var txtEl = banner.querySelector(".eab-txt"), actEl = banner.querySelector(".eab-act");
    var barEl = banner.querySelector(".eab-bar"), barI = barEl.firstChild;
    var audio = new Audio();
    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }
    function cur() { try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {} return 0; }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {

          var exp = CFG.sizes && CFG.sizes[String(n)];

      }

        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {

            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();

            }

        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);

            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });

    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);

    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }

  else init();
})();
