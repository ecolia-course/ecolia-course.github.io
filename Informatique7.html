<script>
    const slides = [
        {
            title: "Leçon 1 : Qu'est-ce que l'informatique ?",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> Imagine-toi assis devant un ordinateur ou tenant un téléphone portable. Tu appuies sur des touches, tu cliques, et tout à coup une image apparaît, une musique joue, un texte s'affiche. Comment cela est-il possible ? Tout cela, c'est grâce à l'<strong>informatique</strong>.
                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> L'informatique, c'est comme une <strong>immense cuisine</strong>. L'ordinateur est la cuisine. Les données (textes, images, sons) sont les ingrédients. Les logiciels sont les recettes. Et l'information affichée à l'écran est le plat préparé.
                </div>
                <h3>🔍 Observons</h3>
                <p>Le mot « informatique » vient de deux mots : <strong>INFORmation</strong> et auto<strong>MATIQUE</strong>. C'est la science du <strong>traitement automatique de l'information</strong>.</p>
                <div class="definition-box">
                    <strong>📚 Définition (Théorie) :</strong><br>
                    L'<strong>informatique</strong> est la science qui étudie le traitement <strong>automatique</strong> et <strong>rationnel</strong> de l'information à l'aide de machines appelées <strong>ordinateurs</strong>.<br><br>
                    <strong>Les 4 fonctions de base :</strong><br>
                    • <strong>Saisie</strong> (entrée) : clavier, souris, microphone.<br>
                    • <strong>Traitement</strong> : le cerveau de l'ordinateur (processeur) qui calcule et organise.<br>
                    • <strong>Stockage</strong> (mémorisation) : disque dur, clé USB.<br>
                    • <strong>Sortie</strong> (affichage) : écran, imprimante, haut-parleurs.
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> Informatique = traitement automatique de l'information. 4 fonctions : saisir, traiter, stocker, afficher.
                </div>
            `
        },
        {
            title: "Leçon 2 : L'ordinateur – Les parties visibles (matériel)",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> Tu entres dans la salle informatique de ton école. Devant toi, il y a un écran, un clavier avec des lettres et des chiffres, une souris avec deux boutons, et une grande boîte sous la table qui fait un petit bruit de ventilateur. Tout cet ensemble s'appelle un <strong>ordinateur</strong>.
                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> L'ordinateur, c'est comme un <strong>corps humain</strong>. L'écran, c'est le visage qui montre les expressions. Le clavier et la souris, ce sont les mains qui donnent des ordres. L'unité centrale, c'est le cerveau et le cœur qui font tout fonctionner.
                </div>
                <h3>🔍 Observons</h3>
                <p>L'ordinateur est composé de deux grandes parties : le <strong>matériel</strong> (hardware, tout ce qu'on peut toucher) et les <strong>logiciels</strong> (software, ce qu'on ne peut pas toucher). Aujourd'hui, on découvre le matériel.</p>
                <div class="definition-box">
                    <strong>📚 Théorie : Les périphériques</strong><br>
                    <strong>1. L'unité centrale :</strong> le boîtier qui contient le processeur, la mémoire, le disque dur. C'est le cœur de l'ordinateur.<br><br>
                    <strong>2. Périphériques d'entrée</strong> (pour donner des ordres) :<br>
                    • Clavier (pour taper du texte).<br>
                    • Souris (pour pointer, cliquer, déplacer).<br>
                    • Microphone (pour enregistrer la voix).<br><br>
                    <strong>3. Périphériques de sortie</strong> (pour recevoir l'information) :<br>
                    • Écran (moniteur) : affiche les images et le texte.<br>
                    • Imprimante : imprime sur papier.<br>
                    • Haut-parleurs : diffusent le son.<br><br>
                    <strong>4. Périphériques de stockage :</strong> clé USB, disque dur externe.
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> Matériel = ce qu'on touche. Unité centrale (cœur), périphériques d'entrée (clavier, souris), périphériques de sortie (écran, imprimante).
                </div>
            `
        },
        {
            title: "Leçon 3 : Le clavier – Découvrir les touches",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> Tu t'assois devant l'ordinateur. Tu regardes le clavier : il y a des lettres (A, B, C...), des chiffres (1, 2, 3...), et d'autres touches étranges (Entrée, Espace, Ctrl). C'est comme un tableau de commande. Chaque touche est un <strong>ordre</strong> que tu donnes à l'ordinateur.
                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> Le clavier, c'est comme un <strong>piano</strong>. Chaque touche produit une note (une lettre, un chiffre, une action). En appuyant sur les bonnes touches dans le bon ordre, tu joues une mélodie (un texte, un calcul).
                </div>
                <h3>🔍 Observons</h3>
                <p>Le clavier est divisé en <strong>zones</strong> pour se repérer plus facilement.</p>
                <div class="definition-box">
                    <strong>📚 Théorie : Les zones du clavier</strong><br>
                    • <strong>Zone alphanumérique :</strong> lettres (A-Z), chiffres (0-9), et signes de ponctuation.<br>
                    • <strong>Zone numérique</strong> (à droite) : pavé de chiffres pour entrer rapidement des nombres.<br>
                    • <strong>Touches de fonction</strong> (F1 à F12, en haut) : pour des actions spéciales (F1 = aide).<br>
                    • <strong>Touches spéciales :</strong><br>
                    &nbsp;&nbsp;- <strong>Entrée (Enter) :</strong> valider une action, passer à la ligne.<br>
                    &nbsp;&nbsp;- <strong>Espace (barre longue) :</strong> insérer un espace entre les mots.<br>
                    &nbsp;&nbsp;- <strong>Retour arrière (Backspace) :</strong> effacer à gauche du curseur.<br>
                    &nbsp;&nbsp;- <strong>Suppr (Delete) :</strong> effacer à droite du curseur.<br>
                    &nbsp;&nbsp;- <strong>Maj (Shift) :</strong> taper une lettre en majuscule ou accéder au symbole du haut d'une touche.
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> Le clavier = ton outil de commande. Apprends les zones : lettres, chiffres, fonctions. Les touches Entrée, Espace et Majuscule sont très importantes.
                </div>
            `
        },
        {
            title: "Leçon 4 : La souris – Cliquer, pointer, glisser",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> Tu poses ta main sur la souris. Tu la fais glisser sur le tapis, et une petite flèche blanche bouge sur l'écran. C'est le <strong>curseur</strong>. Tu amènes la flèche sur une icône et tu appuies sur le bouton gauche : « clic ! », l'icône s'ouvre. Tu viens de donner un ordre avec la souris.
                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> La souris, c'est comme ta <strong>main invisible</strong> à l'intérieur de l'écran. Quand tu bouges la souris, ta main invisible suit le mouvement. Quand tu cliques, ta main invisible appuie sur un bouton à l'intérieur de l'écran.
                </div>
                <h3>🔍 Observons</h3>
                <p>La souris permet de <strong>pointer, cliquer, double-cliquer, et glisser</strong> des éléments à l'écran.</p>
                <div class="definition-box">
                    <strong>📚 Théorie : Actions de la souris</strong><br>
                    • <strong>Pointer :</strong> déplacer la souris pour amener le curseur sur un élément.<br>
                    • <strong>Clic gauche :</strong> appuyer une fois sur le bouton gauche pour sélectionner.<br>
                    • <strong>Double-clic :</strong> appuyer deux fois rapidement pour ouvrir un fichier ou un logiciel.<br>
                    • <strong>Clic droit :</strong> appuyer une fois sur le bouton droit pour ouvrir un menu contextuel (des options).<br>
                    • <strong>Glisser-déposer :</strong> maintenir le clic gauche enfoncé, déplacer l'objet, relâcher.<br>
                    • <strong>Molette :</strong> roulette entre les deux boutons pour faire défiler la page vers le haut ou le bas.
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> La souris = ta main dans l'écran. Clic gauche = sélectionner. Double-clic = ouvrir. Clic droit = options. Molette = défiler.
                </div>
            `
        },
        {
            title: "Leçon 5 : Le bureau de Windows – L'écran d'accueil",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> Tu allumes l'ordinateur. Après quelques instants, un écran coloré apparaît avec des petites images alignées et une barre en bas. C'est le <strong>bureau</strong>. C'est comme le bureau de ta chambre : tu y poses tes cahiers, tes outils. Ici, tu poses tes <strong>fichiers</strong> et tes <strong>logiciels</strong>.
                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> Le bureau Windows, c'est comme une <strong>grande table de travail</strong>. Les petites images (icônes) sont des dossiers et des outils posés sur la table. La barre en bas (barre des tâches) est le tiroir où tu ranges ce que tu utilises souvent.
                </div>
                <h3>🔍 Observons</h3>
                <p>Le bureau est l'écran principal de Windows. On y trouve :</p>
                <div class="definition-box">
                    <strong>📚 Théorie : Éléments du bureau Windows</strong><br>
                    • <strong>Icônes :</strong> petites images représentant un fichier, un dossier ou un logiciel.<br>
                    &nbsp;&nbsp;- <strong>Poste de travail</strong> (ou « Ce PC ») : pour voir tout ce qui est stocké dans l'ordinateur.<br>
                    &nbsp;&nbsp;- <strong>Corbeille :</strong> poubelle où vont les fichiers supprimés.<br>
                    &nbsp;&nbsp;- <strong>Raccourcis :</strong> icônes avec une petite flèche, qui ouvrent rapidement un logiciel.<br>
                    • <strong>Barre des tâches :</strong> bande en bas de l'écran qui montre les programmes ouverts.<br>
                    &nbsp;&nbsp;- Bouton <strong>Démarrer</strong> (en bas à gauche) : menu principal pour tout lancer.<br>
                    &nbsp;&nbsp;- <strong>Horloge</strong> et notifications (à droite).<br>
                    • <strong>Fond d'écran :</strong> image décorative derrière les icônes.
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> Le bureau = table de travail. Icônes = outils posés. Barre des tâches = tiroir. Bouton Démarrer = menu principal.
                </div>
            `
        },
        {
            title: "Leçon 6 : Les dossiers et les fichiers",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> Ton maître te rend ton cahier de français corrigé. Tu le ranges dans ton cartable. Dans ton cartable, tu as une pochette pour le français, une pour les maths, une pour l'histoire. Sur l'ordinateur, c'est pareil : les <strong>fichiers</strong> (comme tes cahiers) sont rangés dans des <strong>dossiers</strong> (comme tes pochettes).
                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> Imagine une grande <strong>armoire</strong> (le disque dur). Dans l'armoire, il y a des <strong>classeurs</strong> (les dossiers). Dans chaque classeur, il y a des <strong>feuilles</strong> (les fichiers). Chaque feuille a un nom inscrit en haut : c'est le <strong>nom du fichier</strong>.
                </div>
                <h3>🔍 Observons</h3>
                <p>Un fichier contient des données (texte, image, musique). Un dossier sert à organiser les fichiers.</p>
                <div class="definition-box">
                    <strong>📚 Théorie :</strong><br>
                    • <strong>Fichier :</strong> ensemble de données enregistrées sous un <strong>nom</strong> et une <strong>extension</strong>. Exemple : « ma_photo.jpg » (nom = ma_photo, extension = .jpg pour une image).<br>
                    • <strong>Dossier</strong> (ou répertoire) : conteneur qui peut contenir des fichiers et d'autres dossiers. Représenté par une icône jaune en forme de chemise.<br><br>
                    <strong>Extensions courantes :</strong><br>
                    • .docx → document texte (Word).<br>
                    • .jpg ou .png → image.<br>
                    • .mp3 → musique.<br>
                    • .mp4 → vidéo.<br>
                    • .pdf → document protégé.<br><br>
                    <strong>Opérations :</strong> créer un dossier, renommer, copier, déplacer, supprimer.
                </div>
                <div class="summary-box">
                    <strong>📌 Résumé :</strong> Fichier = document enregistré (nom + extension). Dossier = chemise pour ranger les fichiers. Organise bien ton armoire numérique !
                </div>
            `
        },
        {
            title: "Leçon 7 : Initiation au traitement de texte (Microsoft Word)",
            content: `
                <div class="scene-box">
                    🌍 <strong>Situation réelle :</strong> Tu veux écrire une belle lettre pour l'anniversaire de ta maman. Au lieu de prendre un stylo et du papier, tu ouvres <strong>Microsoft Word</strong> sur l'ordinateur. Une page blanche apparaît, comme une feuille dans une machine à écrire magique.
                </div>
                <div class="image-box">
                    🖼️ <strong>Image mentale :</strong> Word, c'est comme un <strong>atelier d'écrivain</strong>. Tu as une feuille blanche au centre. Autour, des outils : pour changer la taille des lettres, les mettre en gras, en couleur, ajouter des images. Tout est à portée de clic.
                </div>
                <h3>🔍 Observons</h3>
                <p>Un traitement de texte permet de saisir, modifier, mettre en forme et imprimer du texte.</p>
                <div class="definition-box">
                    <strong>📚 Théorie : Fonctions de base de Word</strong><br>
                    • <strong>Saisie du texte :</strong> taper les lettres au clavier. Le curseur clignotant indique où le texte va apparaître.<br>
                    • <strong>Sélection :</strong> cliquer-glisser pour surligner une partie du texte (elle devient bleue).<br>
                    • <strong>Mise en forme :</strong><br>
                    &nbsp;&nbsp;- <strong>Gras</strong> (B) : épaissir le texte.<br>
                    &nbsp;&nbsp;- <em>Italique</em> (I) : pencher le texte.<br>

            title: "🏆 QUIZ FINAL – Teste tes connaissances en Informatique !",

                <div id="quizContainer" class="quiz-container">
                    <h3>📝 Questionnaire d'Informatique (7ᵉ année)</h3>
                    <p style="margin-bottom:15px;">Choisis la bonne réponse pour chaque question.</p>
                    <div id="quizQuestions"></div>

    ];

    let currentSlide = 0, isAutoPlaying = false, syncInterval;
    let lastSearchTerm = "", searchResults = [], currentResultIdx = -1;
    const audioPlayer = document.getElementById('audioPlayer');
    const contentDiv = document.getElementById('content');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playBtn = document.getElementById('playBtn');
    const statusDiv = document.getElementById('status');
    const slideCounterSpan = document.getElementById('slideCounter');
    const progressFill = document.getElementById('progressFill');
    const timeDisplay = document.getElementById('timeDisplay');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const searchNav = document.getElementById('searchNav');
    const prevResultBtn = document.getElementById('prevResultBtn');
    const nextResultBtn = document.getElementById('nextResultBtn');
    const resultCounterSpan = document.getElementById('resultCounter');
    const quizNavBtn = document.getElementById('quizNavBtn');

    const timeline = [0, 95, 195, 295, 395, 495, 590, 685, 780, 875, 970, 1070, 1170, 1250];
    const totalDuration = 1320;

    function getTextFromHtml(html) {
        const div = document.createElement('div');
        div.innerHTML = html;
        return div.textContent || div.innerText || "";
    }

    function searchSlides(term) {
        if (!term.trim()) return [];
        const lowerTerm = term.toLowerCase();
        const results = [];
        slides.forEach((slide, idx) => {
            if (slide.title.toLowerCase().includes(lowerTerm) ||
                getTextFromHtml(slide.content).toLowerCase().includes(lowerTerm)) {
                results.push(idx);
            }
        });
        return results;
    }

    function highlightInCurrentSlide(term) {
        if (!term || term.trim() === "") return;
        const slideContentDiv = document.querySelector('.slide-content');
        if (!slideContentDiv) return;
        const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        const walker = document.createTreeWalker(slideContentDiv, NodeFilter.SHOW_TEXT, null, false);
        const textNodes = [];
        while (walker.nextNode()) textNodes.push(walker.currentNode);
        for (let node of textNodes) {
            if (node.nodeValue && regex.test(node.nodeValue)) {
                const span = document.createElement('span');
                span.innerHTML = node.nodeValue.replace(regex, '<span class="highlight">$1</span>');
                node.parentNode.replaceChild(span, node);
            }
        }
    }

    function renderQuiz() {
        const quizDiv = document.getElementById('quizQuestions');
        if (!quizDiv) return;
        const questions = [
            { text: "Que signifie le mot INFORMATIQUE ?", options: ["Information automatique", "Information mathématique", "Internet magique"], correct: 0 },
            { text: "Quel est le périphérique qui affiche le texte et les images ?", options: ["Le clavier", "L'écran", "La souris"], correct: 1 },
            { text: "Quelle touche permet de valider une action ou passer à la ligne ?", options: ["Espace", "Entrée (Enter)", "Ctrl"], correct: 1 },
            { text: "Que fait un double-clic avec la souris ?", options: ["Supprimer un fichier", "Ouvrir un fichier ou un logiciel", "Éteindre l'ordinateur"], correct: 1 },
            { text: "Comment s'appelle la poubelle où vont les fichiers supprimés ?", options: ["Le dossier", "La corbeille", "Le raccourci"], correct: 1 },
            { text: "Quelle est l'extension d'un document texte Word ?", options: [".jpg", ".mp3", ".docx"], correct: 2 },
            { text: "Quel raccourci clavier permet d'enregistrer un document ?", options: ["Ctrl + P", "Ctrl + S", "Ctrl + C"], correct: 1 },
            { text: "Internet est :", options: ["Un logiciel de dessin", "Un réseau mondial d'ordinateurs", "Un jeu vidéo"], correct: 1 },
            { text: "Quel moteur de recherche est le plus connu ?", options: ["Word", "Google", "Scratch"], correct: 1 },
            { text: "Dans Scratch, quel bloc déclenche le programme au début ?", options: ["Le bloc vert 'avancer'", "Le bloc orange 'quand drapeau vert cliqué'", "Le bloc bleu 'tourner'"], correct: 1 }
        ];
        let html = '';
        questions.forEach((q, idx) => {
            html += `<div class="quiz-question"><p>${idx+1}. ${q.text}</p>`;
            q.options.forEach((opt, optIdx) => {
                html += `<label><input type="radio" name="q${idx}" value="${optIdx}"> ${opt}</label>`;
            });
            html += `</div>`;
        });
        quizDiv.innerHTML = html;
        const submitBtn = document.getElementById('submitQuiz');
        if (submitBtn) {
            submitBtn.onclick = () => {
                let score = 0;
                questions.forEach((q, idx) => {
                    const selected = document.querySelector(`input[name="q${idx}"]:checked`);
                    if (selected && parseInt(selected.value) === q.correct) score++;
                });
                const resultDiv = document.getElementById('quizResult');
                const pct = Math.round(score/questions.length*100);
                resultDiv.innerHTML = `<div style="background:#c8e6c9; padding:18px; border-radius:12px;">
                    🎯 <strong>Ton score : ${score} / ${questions.length} (${pct}%)</strong><br>
                    ${score === questions.length ? '🌟 Excellent ! Tu es un vrai génie de l\'informatique !' : score >=7 ? '👍 Bon travail, continue à apprendre !' : '📖 Relis les leçons, l\'informatique c\'est l\'avenir.'}
                </div>`;
            };
        }
    }

    function renderSlide(index, keepHighlight = true) {
        const isQuiz = (index === slides.length - 1);
        contentDiv.innerHTML = `<div class="slide active">
            <h2 class="slide-title">${slides[index].title}</h2>
            <div class="slide-content">${slides[index].content}</div>
        </div>`;
        if (isQuiz) renderQuiz();
        slideCounterSpan.textContent = `${index+1}/${slides.length}`;
        progressFill.style.width = `${((index+1)/slides.length)*100}%`;
        if (!isAutoPlaying) {
            prevBtn.disabled = (index === 0);
            nextBtn.disabled = (index === slides.length-1);
        }
        contentDiv.scrollTop = 0;
        if (keepHighlight && lastSearchTerm && lastSearchTerm.trim() !== "" && !isQuiz) {
            highlightInCurrentSlide(lastSearchTerm);
        }
    }

    function updateResultDisplay() {
        if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
        searchNav.style.display = 'flex';
        resultCounterSpan.innerText = `${currentResultIdx+1}/${searchResults.length}`;
    }

    function goToResult(idx) {
        if (idx < 0 || idx >= searchResults.length) return;
        currentResultIdx = idx;
        currentSlide = searchResults[currentResultIdx];
        renderSlide(currentSlide, true);
        updateResultDisplay();
    }

    function performSearch() {
        const term = searchInput.value.trim();
        if (!term) { alert("Entre un mot à rechercher."); return; }
        if (isAutoPlaying) stopAutoPlay();
        lastSearchTerm = term;
        searchResults = searchSlides(term);
        if (searchResults.length === 0) { alert(`Aucun résultat pour "${term}".`); searchNav.style.display = 'none'; return; }
        currentResultIdx = 0;
        goToResult(0);
    }

    function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
    function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }

    function nextSlide() {
        if (currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); clearSearch(); }
    }
    function prevSlide() {
        if (currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); clearSearch(); }
    }
    function clearSearch() {
        if (lastSearchTerm) { lastSearchTerm = ""; searchResults = []; searchNav.style.display = 'none'; searchInput.value = ""; }
    }

    function updateTimeDisplay() {
        let t = audioPlayer.currentTime;
        let mins = Math.floor(t/60).toString().padStart(2,'0');
        let secs = Math.floor(t%60).toString().padStart(2,'0');
        let tMins = Math.floor(totalDuration/60).toString().padStart(2,'0');
        let tSecs = Math.floor(totalDuration%60).toString().padStart(2,'0');
        timeDisplay.innerText = `${mins}:${secs} / ${tMins}:${tSecs}`;
        if (!isAutoPlaying) progressFill.style.width = `${(t/totalDuration)*100}%`;
    }

    function syncSlideFromTime() {
        if (!isAutoPlaying) return;
        const t = audioPlayer.currentTime;
        for (let i = timeline.length-1; i >= 0; i--) {
            if (t >= timeline[i]) {
                if (i !== currentSlide) { currentSlide = i; renderSlide(currentSlide, false); }
                break;
            }
        }
        updateTimeDisplay();
        if (t >= totalDuration - 1) stopAutoPlay();
    }

    function startAutoPlay() {
        isAutoPlaying = true;
        playBtn.innerText = "⏸ Pause";
        playBtn.classList.add('stop-btn');
        statusDiv.innerText = "🔊 Lecture synchronisée en cours...";
        statusDiv.style.background = "rgba(13,71,161,0.9)";
        prevBtn.disabled = nextBtn.disabled = true;
        clearSearch();
        audioPlayer.play().catch(e => console.log("Lecture bloquée, cliquer sur play"));
        if (syncInterval) clearInterval(syncInterval);
        syncInterval = setInterval(syncSlideFromTime, 300);
    }

    function stopAutoPlay() {
        isAutoPlaying = false;
        playBtn.innerText = "▶ Lecture audio";
        playBtn.classList.remove('stop-btn');
        statusDiv.innerText = "📖 Mode navigation";
        statusDiv.style.background = "rgba(0,0,0,0.8)";
        audioPlayer.pause();
        if (syncInterval) { clearInterval(syncInterval); syncInterval = null; }
        prevBtn.disabled = (currentSlide===0);
        nextBtn.disabled = (currentSlide===slides.length-1);
    }

    function toggleAutoPlay() { isAutoPlaying ? stopAutoPlay() : startAutoPlay(); }
    function goToQuiz() { if (isAutoPlaying) stopAutoPlay(); currentSlide = slides.length-1; renderSlide(currentSlide, false); }

    document.addEventListener('keydown', (e) => {
        if (isAutoPlaying) return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === ' ' && document.activeElement !== searchInput) { e.preventDefault(); toggleAutoPlay(); }
    });

    prevBtn.onclick = prevSlide;
    nextBtn.onclick = nextSlide;
    playBtn.onclick = toggleAutoPlay;
    searchBtn.onclick = performSearch;
    prevResultBtn.onclick = prevResult;
    nextResultBtn.onclick = nextResult;
    quizNavBtn.onclick = goToQuiz;
    audioPlayer.addEventListener('ended', stopAutoPlay);
    audioPlayer.addEventListener('timeupdate', () => { if(!isAutoPlaying) updateTimeDisplay(); });

    renderSlide(0, false);
    updateTimeDisplay();
</script>
