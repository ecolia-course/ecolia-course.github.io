{

<ul>
<li>Leçon 1 — Qu'est-ce que le tourisme ?</li>
<li>Leçon 2 — Les formes de tourisme</li>
<li>Leçon 3 — Les atouts touristiques de la RDC</li>
<li>Leçon 4 — L'accueil et l'information touristique</li>
<li>Leçon 5 — Concevoir un itinéraire</li>
<li>Leçon 6 — Tourisme et développement durable</li>
<li>Leçon 7 — Atelier et évaluation</li>

<div class="sources"><strong>Sources :</strong> Références générales en tourisme ; documentation sur le potentiel touristique de la RDC. Statut du programme spécifique à valider.</div>
    `
},
{
    title: "Leçon 1 — Qu'est-ce que le tourisme ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un déplacement pour le travail n'est-il pas du tourisme ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir le tourisme. Identifier ses acteurs. Comprendre son importance économique et sociale.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>Le <strong>tourisme</strong> est l'ensemble des activités liées au déplacement de personnes hors de leur lieu de résidence habituel, pour une durée limitée, et pour des motifs autres que professionnels rémunérés (loisirs, découverte, culture, repos, santé, pèlerinage).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les acteurs</div>
<ul>
<li><strong>Touristes :</strong> personnes qui voyagent.</li>
<li><strong>Prestataires :</strong> hôtels, restaurants, guides, agences de voyage, transporteurs.</li>
<li><strong>Institutions :</strong> offices de tourisme, ministères, autorités locales.</li>
<li><strong>Communautés d'accueil :</strong> populations des lieux visités.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Importance</div>
<ul>
<li><strong>Économique :</strong> revenus, emplois, devises.</li>
<li><strong>Sociale :</strong> rencontres, échanges culturels.</li>
<li><strong>Culturelle :</strong> valorisation du patrimoine.</li>
<li><strong>Environnementale :</strong> protection des sites (si tourisme durable).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis le tourisme.</p>
<p><strong>Ex. 2 :</strong> Cite trois acteurs du tourisme.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Déplacement hors du lieu de résidence habituelle, pour motif non professionnel rémunéré, pour une durée limitée. <strong>2)</strong> Touristes, prestataires, institutions.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le tourisme est un secteur transversal : il associe touristes, prestataires, institutions et communautés.</p></div>
<div class="sources"><strong>Sources :</strong> Références générales.</div>
    `
},
{
    title: "Leçon 2 — Les formes de tourisme",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un touriste peut-il chercher le calme de la nature ou l'effervescence d'une ville ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les grandes formes de tourisme. Distinguer selon le motif. Relier chaque forme à des exemples.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Selon le motif</div>
<ul>
<li><strong>Tourisme de loisirs :</strong> détente, découverte.</li>
<li><strong>Tourisme culturel :</strong> musées, patrimoine, événements.</li>
<li><strong>Tourisme nature / écotourisme :</strong> parcs, biodiversité.</li>
<li><strong>Tourisme balnéaire :</strong> mer, plages.</li>
<li><strong>Tourisme d'affaires :</strong> congrès, salons (motif professionnel mais sans rémunération sur place).</li>
<li><strong>Tourisme religieux :</strong> pèlerinages.</li>
<li><strong>Tourisme solidaire :</strong> rencontre avec les communautés.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Selon le lieu</div>
<ul>
<li>Tourisme urbain.</li>
<li>Tourisme rural.</li>
<li>Tourisme de montagne.</li>
<li>Tourisme côtier.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois formes de tourisme et un exemple pour chacune.</p>
<p><strong>Ex. 2 :</strong> Distingue tourisme culturel et tourisme nature.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Culturel (musée), nature (parc), balnéaire (plage). <strong>2)</strong> Culturel : patrimoine humain ; nature : biodiversité et paysages.</p>

</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le tourisme prend des formes variées selon le motif et le lieu : chaque forme appelle des services adaptés.</p></div>
<div class="sources"><strong>Sources :</strong> Références générales.</div>
    `
},
{
    title: "Leçon 3 — Les atouts touristiques de la RDC",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi la RDC peut-elle attirer des touristes du monde entier ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les principaux atouts touristiques congolais. Comprendre leur diversité. Situer quelques sites majeurs.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les parcs nationaux</div>
<ul>
<li><strong>Parc national des Virunga :</strong> célèbre pour ses gorilles de montagne et ses volcans.</li>
<li><strong>Parc national de la Garamba :</strong> rhinocéros blancs du Nord, éléphants.</li>
<li><strong>Parc national de Kahuzi-Biega :</strong> gorilles de plaine de l'Est.</li>
<li><strong>Parc national de la Salonga :</strong> forêt équatoriale, faune variée.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les sites naturels</div>
<ul>
<li>Fleuve Congo, chutes (Zongo, Lufira).</li>
<li>Lacs (Tanganyika, Kivu, Albert).</li>
<li>Volcans des Virunga (Nyiragongo, Nyamulagira).</li>
<li>Forêts et biodiversité exceptionnelle.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les sites culturels</div>
<ul>
<li>Patrimoine historique et archéologique.</li>
<li>Musiques, danses, artisanat.</li>
<li>Fêtes traditionnelles et sites de mémoire.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois parcs nationaux et une espèce associée.</p>

<details><summary>Corrigé</summary>
<p><strong>1)</strong> Virunga (gorille de montagne), Garamba (rhinocéros), Kahuzi-Biega (gorille de plaine). <strong>2)</strong> Elle est rare et unique : elle attire des touristes intéressés par la nature.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La RDC dispose d'atouts touristiques majeurs : parcs, biodiversité, paysages et patrimoine culturel.</p></div>
<div class="sources"><strong>Sources :</strong> Références générales.</div>
    `
},
{
    title: "Leçon 4 — L'accueil et l'information touristique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un touriste bien informé profite-t-il mieux de son séjour ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le rôle de l'accueil touristique. Fournir une information fiable. Orienter et conseiller.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — L'accueil touristique</div>
<p>L'accueil touristique regroupe les services qui orientent, informent et facilitent le séjour :</p>
<ul>
<li>bureaux d'information touristique ;</li>
<li>guides et accompagnateurs ;</li>
<li>hôtels et restaurants ;</li>
<li>agences de voyage.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Fournir une information fiable</div>
<ul>
<li>Vérifier les informations avant de les donner.</li>
<li>Préciser les horaires, tarifs, distances, durées.</li>
<li>Rester neutre et objectif.</li>
<li>Orienter vers les services compétents en cas de doute.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Conseiller</div>
<ul>
<li>Adapter les suggestions au profil du touriste (âge, intérêts, budget).</li>
<li>Signaler les risques (sécurité, santé, climat).</li>
<li>Respecter la culture locale.</li>
<li>Proposer des alternatives.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois services d'accueil touristique.</p>
<p><strong>Ex. 2 :</strong> Pourquoi faut-il adapter les conseils au profil du touriste ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Bureaux d'information, guides, agences. <strong>2)</strong> Parce que les attentes et les contraintes varient d'un touriste à l'autre.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'accueil touristique repose sur une information fiable et des conseils adaptés.</p></div>
<div class="sources"><strong>Sources :</strong> Références générales.</div>
    `
},
{
    title: "Leçon 5 — Concevoir un itinéraire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment organiser un séjour de trois jours dans une région touristique ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie — Étapes de conception</div>

<li>Choisir les sites selon les intérêts.</li>

<div class="bloc theorie"><div class="bloc-label">Théorie — Contraintes à prévoir</div>
<ul>
<li>Accessibilité des sites (routes, saisons).</li>
<li>Sécurité.</li>
<li>Budget disponible.</li>
<li>Temps de trajet (souvent sous-estimés).</li>
<li>Ouverture des sites (jours, horaires).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Rédiger l'itinéraire</div>

<li>les activités ;</li>

<li>les hébergements et repas.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les impacts du tourisme. Identifier les principes du tourisme durable. Proposer des actions concrètes.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Impacts positifs</div>
<ul>
<li>Revenus et emplois.</li>
<li>Valorisation du patrimoine.</li>
<li>Financement de la protection (parcs, réserves).</li>
<li>Échanges culturels.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Impacts négatifs</div>
<ul>
<li>Dégradation de l'environnement.</li>
<li>Pression sur les ressources (eau, sols).</li>

<li>Dépendance économique au tourisme.</li>

</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Tourisme durable</div>

      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
