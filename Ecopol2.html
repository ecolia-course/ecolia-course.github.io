    title: "Leçon 1 — Introduction à l'économie politique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi parle-t-on de "science économique" et en quoi est-ce une science sociale ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir l'économie politique. Connaître ses méthodes. Situer les grands courants. Comprendre les défis de l'économie congolaise. Prérequis : notions d'histoire et de société.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Économie politique :</strong> science sociale qui étudie la production, la répartition et la consommation des richesses, ainsi que les choix dans un contexte de rareté.</p>
<p><strong>Méthodes :</strong></p>
<ul>
<li><strong>Déduction :</strong> partir de principes généraux pour aboutir à des cas particuliers.</li>
<li><strong>Induction :</strong> partir de cas particuliers pour aboutir à des principes généraux.</li>
</ul>
<p><strong>Grands courants de la pensée économique :</strong></p>
<ul>
<li><strong>Mercantilistes :</strong> richesse fondée sur l'accumulation de métaux précieux.</li>
<li><strong>Physiocrates :</strong> la terre est la source de la richesse.</li>
<li><strong>Classiques (Smith, Ricardo) :</strong> « main invisible », division du travail.</li>
<li><strong>Marxistes :</strong> analyse critique du capitalisme, lutte des classes.</li>
<li><strong>Néoclassiques :</strong> analyse des choix individuels, équilibre des marchés.</li>
<li><strong>Keynésiens :</strong> rôle de l'État dans la régulation de l'économie.</li>
</ul>
<p><strong>Défis de l'économie congolaise :</strong> dépendance aux matières premières, poids du secteur informel, faible diversification, gouvernance, pauvreté.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Économie politique :</strong> science sociale de l'allocation des ressources rares. <strong>Rareté :</strong> insuffisance des ressources par rapport aux besoins. <strong>Secteur informel :</strong> activités non déclarées et non régulées.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Distinguer économie politique et politique économique. Situer un auteur dans son courant. Relier les concepts au contexte congolais.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>L'économie congolaise dépend fortement des exportations de cuivre et de cobalt. Le secteur informel emploie une grande partie de la population active à Kinshasa. Ces deux caractéristiques illustrent des défis structurels de diversification et de formalisation.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qu'est-ce que l'économie politique ? <strong>Ex. 2 :</strong> Cite deux défis structurels de l'économie congolaise.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Une science sociale qui étudie l'allocation des ressources rares. <strong>2)</strong> Dépendance aux matières premières, poids du secteur informel (autres réponses possibles).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'économie politique est une science sociale qui étudie les choix dans un contexte de rareté.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel « Économie Politique – 2ème Année HP » (Édition 2025).</div>
    `

{
    title: "Leçon 2 — Agents économiques et besoins",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qui fait quoi dans l'économie ? Pourquoi faut-il choisir ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les agents économiques et leurs fonctions. Comprendre la notion de besoin et de rareté. Saisir le coût d'opportunité. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Agents économiques :</strong></p>
<ul>
<li><strong>Ménages :</strong> consomment et fournissent le travail.</li>
<li><strong>Entreprises :</strong> produisent des biens et services.</li>
<li><strong>État :</strong> régule, redistribue, produit des services publics.</li>
<li><strong>Institutions financières :</strong> collectent et prêtent l'épargne.</li>
<li><strong>Reste du monde :</strong> échanges internationaux.</li>
</ul>
<p><strong>Besoins humains :</strong></p>
<ul>
<li><strong>Primaires :</strong> indispensables à la survie (manger, se loger).</li>
<li><strong>Secondaires :</strong> non indispensables (loisirs, confort).</li>
<li><strong>Pyramide de Maslow :</strong> hiérarchie des besoins (physiologiques, sécurité, appartenance, estime, réalisation).</li>
</ul>
<p><strong>Rareté :</strong> les ressources sont limitées alors que les besoins sont illimités.</p>
<p><strong>Coût d'opportunité :</strong> valeur de la meilleure option à laquelle on renonce en choisissant.</p>
<p><strong>Circuit économique :</strong> flux réels et monétaires entre les agents.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Ménage :</strong> unité de consommation. <strong>Bien :</strong> produit matériel. <strong>Service :</strong> prestation immatérielle. <strong>Coût d'opportunité :</strong> valeur du choix non retenu.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier les agents dans une situation concrète. Distinguer besoin primaire et secondaire. Calculer un coût d'opportunité dans une décision simple.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un ménage de Kinshasa doit choisir entre acheter de la nourriture et payer les frais scolaires. S'il choisit la nourriture, le coût d'opportunité est le retard dans la scolarisation ; s'il choisit l'école, le coût d'opportunité est un repas moins copieux.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite deux agents économiques et leur fonction. <strong>Ex. 2 :</strong> Donne un exemple de coût d'opportunité.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Ménages (consommation) ; entreprises (production) (autres réponses possibles). <strong>2)</strong> Choisir d'étudier le soir au lieu de regarder la télévision : le coût d'opportunité est l'émission non regardée.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Chaque choix économique a un coût d'opportunité.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel « Économie Politique – 2ème Année HP » (Édition 2025).</div>
    `

    title: "Leçon 3 — Production et facteurs de production",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment une boulangerie transforme-t-elle la farine en pain ? Quels sont les facteurs mobilisés ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la production. Identifier les quatre facteurs de production. Comprendre la loi des rendements décroissants et les coûts. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Production :</strong> transformation de ressources en biens et services destinés à la consommation ou à la production.</p>
<p><strong>Facteurs de production :</strong></p>
<ul>
<li><strong>Travail :</strong> activité humaine (ouvriers, employés).</li>
<li><strong>Terre :</strong> ressources naturelles (sols, mines, eau).</li>
<li><strong>Capital :</strong> biens durables utilisés pour produire (machines, bâtiments).</li>
<li><strong>Capacité entrepreneuriale :</strong> capacité à organiser et à prendre des risques.</li>
</ul>
<p><strong>Loi des rendements décroissants :</strong> l'ajout d'un facteur (par exemple, plus de travailleurs) sur une quantité fixe d'autres facteurs finit par produire des gains décroissants.</p>
<p><strong>Productivité :</strong> rapport entre la production et les facteurs utilisés.</p>
<p><strong>Coûts :</strong></p>
<ul>
<li><strong>Coûts fixes :</strong> indépendants du volume produit (loyer).</li>
<li><strong>Coûts variables :</strong> dépendent du volume produit (matières premières).</li>
</ul>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Production :</strong> création de biens et services. <strong>Facteurs de production :</strong> travail, terre, capital, capacité entrepreneuriale. <strong>Coût fixe :</strong> coût indépendant du volume. <strong>Coût variable :</strong> coût dépendant du volume.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier les facteurs mobilisés dans un cas concret. Distinguer coûts fixes et variables. Appliquer la loi des rendements décroissants.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une exploitation agricole au Kasaï : au début, l'ajout de travailleurs augmente la production ; au-delà d'un certain nombre, chaque nouveau travailleur produit moins (rendements décroissants). Le loyer du terrain est un coût fixe ; les semences sont un coût variable.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les quatre facteurs de production. <strong>Ex. 2 :</strong> Cite deux coûts fixes d'une boulangerie.</p>

</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La production combine des facteurs ; l'efficacité dépend de leur combinaison.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel « Économie Politique – 2ème Année HP » (Édition 2025).</div>
    `

    title: "Leçon 4 — Échange et marché",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi le prix de la cassave augmente-t-il en période de pénurie ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le marché et la formation des prix. Distinguer les types de marché. Saisir le rôle de la monnaie. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Marché :</strong> lieu (réel ou virtuel) de rencontre entre l'offre et la demande.</p>
<ul>
<li><strong>Offre :</strong> quantité de biens que les vendeurs souhaitent vendre à un prix donné.</li>
<li><strong>Demande :</strong> quantité de biens que les acheteurs souhaitent acheter à un prix donné.</li>
<li><strong>Prix d'équilibre :</strong> prix où l'offre égale la demande.</li>
</ul>
<p><strong>Types de marché :</strong></p>
<ul>
<li><strong>Concurrence :</strong> nombreux vendeurs et acheteurs.</li>
<li><strong>Monopole :</strong> un seul vendeur.</li>
<li><strong>Oligopole :</strong> quelques vendeurs.</li>
</ul>
<p><strong>Monnaie :</strong> intermédiaire des échanges, unité de compte et réserve de valeur.</p>
<p><strong>Commerce international (initiation) :</strong> échanges entre pays, spécialisation, importations et exportations.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Marché :</strong> lieu de rencontre offre/demande. <strong>Prix d'équilibre :</strong> prix où offre = demande. <strong>Monopole :</strong> un seul vendeur. <strong>Monnaie :</strong> intermédiaire des échanges.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier les offreurs et les demandeurs. Repérer le type de marché. Relier prix et rareté. Comprendre le rôle de la monnaie dans l'échange.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Marché de la cassave à Kinshasa : en période de pénurie, l'offre diminue ; les prix montent jusqu'à un nouvel équilibre. Si un seul vendeur contrôle le marché, on parle de monopole (ex. une entreprise unique d'électricité).</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qu'est-ce que l'offre sur un marché ? <strong>Ex. 2 :</strong> Qu'est-ce qu'un monopole ?</p>

de métaux précieux. Physiocrates: la terre est la source de la richesse. Classiques (Smith, Ricardo): « main invisible », division du travail. Marxistes: analyse critique du capitalisme, lutte des classes. Néoclassiques: analyse des choix individuels, équilibre des marchés. Keynésiens: rôle de l'État dans la régulation de l'économie. Défis de l'économie congolaise: dépendance aux matières premières, poids du secteur informel, faible diversification, gouvernance, pauvreté. Définitions. Économie politique: science sociale de l'allocation des ressources rares. Rareté: insuffisance des ressources par rapport aux besoins. Secteur informel: activités non déclarées et non régulées. Méthodes et règles. Distinguer économie politique et politique économique. Situer un auteur dans son courant. Relier les concepts au contexte congolais. Exemple. L'économie congolaise dépend fortement des exportations de cuivre et de cobalt. Le secteur informel emploie une grande partie de la population active à Kinshasa. Ces deux caractéristiques illustrent des défis structurels de diversification et de formalisation. Exercices. Ex. 1: Qu'est-ce que l'économie politique? Ex. 2: Cite deux défis structurels de l'économie congolaise. Corrigé. 1) Une science sociale qui étudie l'allocation des ressources rares. 2) Dépendance aux matières premières, poids du secteur informel (autres réponses possibles). À retenir. L'économie politique est une science sociale qui étudie les choix dans un contexte de rareté."]],"3":[["fr","Leçon 2, Agents économiques et besoins. Situation. « Qui fait quoi dans l'économie? Pourquoi faut-il choisir? ». Objectifs. Identifier les agents économiques et leurs fonctions. Comprendre la notion de besoin et de rareté. Saisir le coût d'opportunité. Prérequis: leçon 1. Théorie. Agents économiques: Ménages: consomment et fournissent le travail. Entreprises: produisent des biens et services. État: régule, redistribue, produit des services publics. Institutions financières: collectent et prêtent l'épargne. Reste du monde: échanges internationaux. Besoins humains: Primaires: indispensables à la survie (manger, se loger). Secondaires: non indispensables (loisirs, confort). Pyramide de Maslow: hiérarchie des besoins (physiologiques, sécurité, appartenance, estime, réalisation). Rareté: les ressources sont limitées alors que les besoins sont illimités. Coût d'opportunité: valeur de la meilleure option à laquelle on renonce en choisissant. Circuit économique: flux réels et monétaires entre les agents. Définitions. Ménage: unité de consommation. Bien: produit matériel. Service: prestation immatérielle. Coût d'opportunité: valeur du choix non retenu. Méthodes et règles. Identifier les agents dans une situation concrète. Distinguer besoin primaire et secondaire. Calculer un coût d'opportunité dans une décision simple. Exemple. Un ménage de Kinshasa doit choisir entre acheter de la nourriture et payer les frais scolaires. S'il choisit la nourriture, le coût d'opportunité est le retard dans la scolarisation; s'il choisit l'école, le coût d'opportunité est un repas moins copieux. Exercices. Ex. 1: Cite deux agents économiques et leur fonction. Ex. 2: Donne un exemple de coût d'opportunité. Corrigé. 1) Ménages (consommation); entreprises (production) (autres réponses possibles). 2) Choisir d'étudier le soir au lieu de regarder la télévision: le coût d'opportunité est l'émission non regardée. À retenir. Chaque choix économique a un coût d'opportunité."]],"4":[["fr","Leçon 3, Production et facteurs de production. Situation. « Comment une boulangerie transforme-t-elle la farine en pain? Quels sont les facteurs mobilisés? ». Objectifs. Définir la production. Identifier les quatre facteurs de production. Comprendre la loi des rendements décroissants et les coûts. Prérequis: leçons 1 et 2. Théorie. Production: transformation de ressources en biens et services destinés à la consommation ou à la production. Facteurs de production: Travail: activité humaine (ouvriers, employés). Terre: ressources naturelles (sols, mines, eau). Capital: biens durables utilisés pour produire (machines, bâtiments). Capacité entrepreneuriale: capacité à organiser et à prendre des risques. Loi des rendements décroissants: l'ajout d'un facteur (par exemple, plus de travailleurs) sur une quantité fixe d'autres facteurs finit par produire des gains décroissants. Productivité: rapport entre la production et les facteurs utilisés. Coûts: Coûts fixes: indépendants du volume produit (loyer). Coûts variables: dépendent du volume produit (matières premières). Définitions. Production: création de biens et services. Facteurs de production: travail, terre, capital, capacité entrepreneuriale. Coût fixe: coût indépendant du volume. Coût variable: coût dépendant du volume. Méthodes et règles. Identifier les facteurs mobilisés dans un cas concret. Distinguer coûts fixes et variables. Appliquer la loi des rendements décroissants. Exemple. Une exploitation agricole au Kasaï: au début, l'ajout de travailleurs augmente la production; au-delà d'un certain nombre, chaque nouveau travailleur produit moins (rendements décroissants). Le loyer du terrain est un coût fixe; les semences sont un coût variable. Exercices. Ex. 1: Cite les quatre facteurs de production. Ex. 2: Cite deux coûts fixes d'une boulangerie. Corrigé. 1) Travail, terre, capital, capacité entrepreneuriale. 2) Loyer et assurance (autres réponses possibles). À retenir. La production combine des facteurs; l'efficacité dépend de leur combinaison."]],"5":[["fr","Leçon 4, Échange et marché. Situation. « Pourquoi le prix de la cassave augmente-t-il en période de pénurie? ». Objectifs. Comprendre le marché et la formation des prix. Distinguer les types de marché. Saisir le rôle de la monnaie. Prérequis: leçons 1 à 3. Théorie. Marché: lieu (réel ou virtuel) de rencontre entre l'offre et la demande. Offre: quantité de biens que les vendeurs souhaitent vendre à un prix donné. Demande: quantité de biens que les acheteurs souhaitent acheter à un prix donné. Prix d'équilibre: prix où l'offre égale la demande. Types de marché: Concurrence: nombreux vendeurs et acheteurs. Monopole: un seul vendeur. Oligopole: quelques vendeurs. Monnaie: intermédiaire des échanges, unité de compte et réserve de valeur. Commerce international (initiation): échanges entre pays, spécialisation, importations et exportations. Définitions. Marché: lieu de rencontre offre ou demande. Prix d'équilibre: prix où offre égale demande. Monopole: un seul vendeur. Monnaie: intermédiaire des échanges. Méthodes et règles. Identifier les offreurs et les demandeurs. Repérer le type de marché. Relier prix et rareté. Comprendre le rôle de la monnaie dans l'échange. Exemple. Marché de la cassave à Kinshasa: en période de pénurie, l'offre diminue; les prix montent jusqu'à un nouvel équilibre. Si un seul vendeur contrôle le marché, on parle de monopole (ex. une entreprise unique d'électricité). Exercices. Ex. 1: Qu'est-ce que l'offre sur un marché? Ex. 2: Qu'est-ce qu'un monopole? Corrigé. 1) La quantité de biens que les vendeurs souhaitent vendre. 2) Un marché avec un seul vendeur. À retenir. Le prix est le résultat de la confrontation entre l'offre et la demande."]],"6":[["fr","Leçon 5, L'économie congolaise et ses défis. Situation. « Pourquoi la R D C est-elle riche en ressources mais confrontée à la pauvreté? ». Objectifs. Comprendre la structure de l'économie congolaise. Identifier ses défis. Connaître les partenaires économiques. Prérequis: leçons 1 à 4. Théorie. Structure de l'économie congolaise: Secteur primaire: mines (cuivre, cobalt, diamant, or), agriculture, forêt. Secteur secondaire: industries peu développées (agroalimentaire, brasseries). Secteur tertiaire: commerce, transports, services; poids du secteur informel. Dépendance aux matières premières: cuivre et cobalt dominent les exportations; l'économie est vulnérable aux variations des cours mondiaux. Partenaires économiques: Chine, Belgique, France, États-Unis, pays voisins. Défis: diversification économique, formalisation du secteur informel, réduction de la pauvreté, gouvernance, infrastructures, énergie. Politiques de développement: diversification, investissement dans l'agriculture, énergie (Inga), éducation, industrialisation. Définitions. Secteur primaire: extraction de ressources naturelles. Secteur informel: activités non déclarées. Diversification: développement de plusieurs secteurs pour réduire la dépendance. Méthodes et règles. Identifier le poids des secteurs. Relier les exportations et les défis. Situer la R D C dans les échanges internationaux. Actualiser les données avec des sources récentes. Exemple. Le cuivre et le cobalt représentent une part majeure des exportations congolaises. L'agriculture emploie une grande partie de la population, mais reste peu productive. Les partenaires économiques (Chine, Belgique, etc.) jouent un rôle clé dans l'économie nationale. Exercices. Ex. 1: Quel secteur domine les exportations congolaises? Ex. 2: Cite deux défis de l'économie congolaise. Corrigé. 1) Le secteur minier (cuivre, cobalt). 2) Diversification et formalisation du secteur informel (autres réponses possibles). À retenir. L'économie congolaise est riche en ressources mais confrontée à des défis structurels majeurs."]],"7":[["fr","Évaluation finale, Économie Politique. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 12 sur 20, tu as réussi."]]}};

    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
</html>
