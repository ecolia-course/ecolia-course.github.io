const slides = [
{

    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours prépare l'EXETAT (4e secondaire). Il comprend 9 leçons, suivies d'un quiz de révision.</p>

},
{
    title: "Leçon 1 — Notions fondamentales d'électricité",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un atelier d'électricité à Kinshasa, un apprenti doit comprendre les grandeurs électriques de base : tension, courant, résistance. Sans elles, impossible de dimensionner un circuit.</p></div>
<h3>1. Les grandeurs électriques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Tension (U)</strong> : différence de potentiel, en volts (V).</li><li><strong>Courant (I)</strong> : débit de charges, en ampères (A).</li><li><strong>Résistance (R)</strong> : opposition au passage du courant, en ohms (Ω).</li><li><strong>Puissance (P)</strong> : P = U × I, en watts (W).</li><li><strong>Énergie (E)</strong> : E = P × t, en wattheures (Wh) ou kilowattheures (kWh).</li></ul></div>
<h3>2. La loi d'Ohm</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Formule</strong> : U = R × I.</li><li><strong>Déductions</strong> : I = U / R ; R = U / I.</li><li><strong>Application</strong> : une résistance de 10 Ω traversée par un courant de 2 A → U = 20 V.</li></ul></div>
<h3>3. Courant continu et alternatif</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Courant continu (DC)</strong> : sens constant, ex. pile, batterie.</li><li><strong>Courant alternatif (AC)</strong> : sens variable, ex. réseau SNEL, 220 V / 50 Hz en RDC.</li><li><strong>Fréquence</strong> : 50 Hz en RDC.</li><li><strong>Valeur efficace</strong> : tension mesurée par le voltmètre AC.</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Lampe 220 V / 100 W</strong> : I = P / U = 100 / 220 ≈ 0,45 A.</li><li><strong>Résistance chauffante 220 V / 1 000 W</strong> : R = U² / P = 48 400 / 1 000 = 48,4 Ω.</li><li><strong>Compteur d'énergie</strong> : 1 kWh = 1 000 Wh.</li></ul><p><a href="https://www.youtube.com/results?search_query=notions+fondamentales+électricité+tension+courant+résistance" target="_blank" rel="noopener">🎥 Recherche : notions d'électricité</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les grandeurs électriques sont : tension (V), courant (A), résistance (Ω), puissance (W), énergie (Wh). La loi d'Ohm U = R × I est fondamentale. En RDC, le réseau est en 220 V / 50 Hz AC.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Électricité Industrielle 4e Technique (manuels-scolaires-rdc.com, 2025).<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, SNEL.</div>
`
},
{
    title: "Leçon 2 — Les circuits électriques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une maison de Kinshasa, plusieurs lampes sont branchées. En série, si une lampe grille, tout s'éteint. En dérivation, chacune fonctionne indépendamment. Comprendre les circuits est essentiel.</p></div>
<h3>1. Circuit série</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : les récepteurs sont branchés l'un après l'autre.</li><li><strong>Intensité</strong> : identique en tout point (I = I1 = I2).</li><li><strong>Tension</strong> : se répartit (U = U1 + U2).</li><li><strong>Résistance équivalente</strong> : Réq = R1 + R2.</li><li><strong>Inconvénient</strong> : si un élément grille, tout s'arrête.</li></ul></div>
<h3>2. Circuit en dérivation (parallèle)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : les récepteurs sont branchés en parallèle.</li><li><strong>Intensité</strong> : se répartit (I = I1 + I2).</li><li><strong>Tension</strong> : identique aux bornes de chaque récepteur (U = U1 = U2).</li><li><strong>Résistance équivalente</strong> : 1/Réq = 1/R1 + 1/R2.</li><li><strong>Avantage</strong> : chaque récepteur est indépendant.</li></ul></div>
<h3>3. Les circuits mixtes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : combinaison de série et de dérivation.</li><li><strong>Méthode</strong> : réduire par étapes en calculant les résistances équivalentes.</li><li><strong>Application</strong> : installations domestiques réelles.</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Série</strong> : 2 résistances de 10 Ω → Réq = 20 Ω.</li><li><strong>Parallèle</strong> : 2 résistances de 10 Ω → Réq = 5 Ω.</li><li><strong>Mixte</strong> : (10 Ω + 10 Ω) en série, puis en parallèle avec 20 Ω → 10 Ω.</li><li><strong>Installation domestique</strong> : les prises sont en parallèle, chacune alimentée en 220 V.</li></ul><p><a href="https://www.youtube.com/results?search_query=circuits+électriques+série+dérivation" target="_blank" rel="noopener">🎥 Recherche : les circuits électriques</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>En série, l'intensité est la même et les tensions s'additionnent. En parallèle, la tension est la même et les intensités s'additionnent. En France, les installations domestiques sont en parallèle.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Électricité Industrielle 4e Technique (2025).</div>
`
},
{
    title: "Leçon 3 — Les appareils de mesure",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un atelier de Lubumbashi, un électricien mesure la tension, l'intensité et la résistance d'un circuit. Il utilise un multimètre. Ces mesures sont essentielles pour diagnostiquer une panne.</p></div>
<h3>1. Le multimètre</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Multimètre</strong> : appareil qui mesure tension, intensité, résistance.</li><li><strong>Voltmètre</strong> : mesure la tension (V).</li><li><strong>Ampèremètre</strong> : mesure l'intensité (A).</li><li><strong>Ohmmètre</strong> : mesure la résistance (Ω).</li><li><strong>Pince ampèremétrique</strong> : mesure l'intensité sans couper le circuit.</li></ul></div>
<h3>2. Le branchement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Voltmètre</strong> : en parallèle (dérivation) avec le récepteur.</li><li><strong>Ampèremètre</strong> : en série dans le circuit.</li><li><strong>Ohmmètre</strong> : sur un circuit hors tension.</li><li><strong>Calibre</strong> : choisir le calibre adapté (AC/DC, valeur).</li><li><strong>Sécurité</strong> : vérifier l'absence de tension avant de mesurer la résistance.</li></ul></div>
<h3>3. Les autres appareils</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Oscilloscope</strong> : visualise les signaux.</li><li><strong>Wattmètre</strong> : mesure la puissance.</li><li><strong>Compteur d'énergie</strong> : mesure la consommation.</li><li><strong>Testeur de continuité</strong> : vérifie un circuit.</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Mesurer une tension</strong> : voltmètre en parallèle, calibre 250 V AC.</li><li><strong>Mesurer une intensité</strong> : ampèremètre en série, calibre 10 A.</li><li><strong>Mesurer une résistance</strong> : ohmmètre, circuit hors tension.</li><li><strong>Diagnostiquer une panne</strong> : vérifier la continuité, la tension, la résistance.</li></ul><p><a href="https://www.youtube.com/results?search_query=appareils+mesure+électrique+multimètre" target="_blank" rel="noopener">🎥 Recherche : les appareils de mesure</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le multimètre regroupe voltmètre, ampèremètre et ohmmètre. Le voltmètre se branche en parallèle, l'ampèremètre en série. L'ohmmètre mesure hors tension. La pince ampèremétrique permet une mesure sans coupure.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Électricité Industrielle 4e Technique (2025).</div>
`
},
{
    title: "Leçon 4 — Les composants électroniques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un atelier de Kisangani, un technicien répare une radio. Il identifie les résistances, condensateurs, diodes, transistors. Chaque composant a un rôle précis dans le circuit.</p></div>
<h3>1. Les composants passifs</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Résistance</strong> : limite le courant. Code couleur : noir (0), brun (1), rouge (2)...</li><li><strong>Condensateur</strong> : stocke l'énergie, en farads (F).</li><li><strong>Bobine (inductance)</strong> : stocke l'énergie magnétique, en henrys (H).</li><li><strong>Transformateur</strong> : modifie la tension alternative.</li></ul></div>
<h3>2. Les composants actifs</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Diode</strong> : laisse passer le courant dans un seul sens.</li><li><strong>Transistor</strong> : amplifie ou commute.</li><li><strong>Thyristor</strong> : interrupteur électronique.</li><li><strong>Circuit intégré</strong> : regroupe plusieurs composants.</li></ul></div>
<h3>3. Les composants de puissance</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Contacteur</strong> : commande un circuit de puissance.</li><li><strong>Disjoncteur</strong> : protège contre les surintensités.</li><li><strong>Fusible</strong> : fond en cas de surintensité.</li><li><strong>Relais thermique</strong> : protège les moteurs.</li><li><strong>Sectionneur</strong> : isole un circuit.</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Résistance</strong> : code couleur rouge-rouge-brun = 220 Ω ± 5 %.</li><li><strong>Diode</strong> : repérer l'anode (A) et la cathode (K).</li><li><strong>Transistor</strong> : NPN ou PNP, base, collecteur, émetteur.</li><li><strong>Disjoncteur</strong> : calibre selon la section des conducteurs.</li></ul><p><a href="https://www.youtube.com/results?search_query=composants+électroniques+résistance+diode+transistor" target="_blank" rel="noopener">🎥 Recherche : les composants électroniques</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les composants passifs (résistance, condensateur, bobine, transformateur) et actifs (diode, transistor) constituent les circuits. Les composants de puissance (contacteur, disjoncteur, fusible, relais) protègent et commandent.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Électricité Industrielle 4e Technique (2025).</div>
`
},
{
    title: "Leçon 5 — Les machines électriques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une usine de Kinshasa, plusieurs moteurs électriques entraînent des machines. Le technicien doit connaître leur fonctionnement, leur démarrage, leur protection.</p></div>
<h3>1. Les moteurs électriques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Moteur à courant continu (DC)</strong> : utilisé en petite puissance.</li><li><strong>Moteur asynchrone (AC)</strong> : le plus répandu en industrie.</li><li><strong>Moteur synchrone</strong> : vitesse constante.</li><li><strong>Moteur monophasé</strong> : pour le domestique.</li><li><strong>Moteur triphasé</strong> : pour l'industrie.</li></ul></div>
<h3>2. Le démarrage des moteurs</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Démarrage direct</strong> : simple, appel de courant élevé.</li><li><strong>Démarrage étoile-triangle</strong> : réduit le courant de démarrage.</li><li><strong>Démarrage par résistance</strong> : progressif.</li><li><strong>Démarrage par variateur</strong> : progressif et contrôlé.</li></ul></div>
<h3>3. La protection des moteurs</h3>

function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });

function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {

        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';

    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }

    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);

    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();

}

function goToResult(idx) {

function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }

<script>
(function () {
  var SITE = "https://ecolia-course.github.io/";
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface", page servie par https://app.local
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function abs(u) { return /^(https?:|data:|blob:)/i.test(u) ? u : (NATIVE ? SITE + u.replace(/^(\.\/|\/)+/, "") : u); }
  function ext(u) { var m = String(u).split("?")[0].match(/\.(jpe?g|png|gif|webp|svg)$/i); return m ? m[1].toLowerCase() : "jpg"; }
  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {
    if (queued[fn]) return;
    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
    if (!queue.length) { running = false; return; }
    if (!navigator.onLine) { running = false; return; }
    var q = queue.shift(), t0 = Date.now();
    try { CoursInterface.download(q[0], q[1]); } catch (e) { return setTimeout(next, 500); }
    (function wait() {
      var ok = false;
      try { ok = !!CoursInterface.exists(q[1]); } catch (e) {}
      if (ok) setTimeout(next, 1500);
      else if (Date.now() - t0 > 40000) next();
      else setTimeout(wait, 700);
    })();
  }
  function exists(fn) { try { return !!CoursInterface.exists(fn); } catch (e) { return false; } }

  function show(img) {                                    // affiche UNE image (appelé à chaque slide affichée)
    if (!table || img.getAttribute("data-ecolia-done")) return;
    var id = img.getAttribute("data-image-id");
    var url = table[id];
    if (typeof url !== "string" || !url.length) { console.warn("ECOLIA : image absente du JSON :", id); return; }
    img.setAttribute("data-ecolia-done", "1");
    if (!NATIVE) { img.onerror = function () { hide(img); }; img.setAttribute("src", url); return; }
    var full = abs(url), fn = "img_" + id + "." + ext(url);
    if (exists(fn)) {                                     // déjà sur l'appareil : lecture locale, sans internet
      img.onerror = function () {                         // fichier incomplet : on le supprime et on utilise le site
        try { CoursInterface["delete"](fn); } catch (e) {}
        queued[fn] = 0;
        img.onerror = function () { hide(img); };
        img.setAttribute("src", full);
      };
      img.setAttribute("src", "https://app.local/cours/" + fn);
    } else {
      img.onerror = function () { hide(img); };
      img.setAttribute("src", full);
      enqueue(full, fn);
    }
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches("img[data-image-id]")) show(root);
    root.querySelectorAll("img[data-image-id]").forEach(show);
  }
  function prefetchAll() {                                // APK : prépare TOUTES les images du cours pour le hors-ligne
    var ids = {};
    try { JSON.stringify(slides).replace(/data-image-id=\\?"([^"\\]+)/g, function (m, id) { ids[id] = 1; }); } catch (e) {}
    Object.keys(ids).forEach(function (id) {
      var url = table[id];
      if (typeof url !== "string" || !url.length) return;
      var fn = "img_" + id + "." + ext(url);
      if (!exists(fn)) enqueue(abs(url), fn);
    });
  }
  function start(tbl) {
    table = tbl;
    scan(document.body);
    new MutationObserver(function (muts) {                // les slides sont écrites à la volée : on traite chaque nouvelle image
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
    if (NATIVE) prefetchAll();
  }

  var JSON_URL = NATIVE ? SITE + "images_ecolia.json" : "images_ecolia.json";
  var KEY = "ecolia_images_json";
  fetch(JSON_URL, NATIVE ? { cache: "no-cache" } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (table) { if (NATIVE) lsSet(KEY, JSON.stringify(table)); start(table); })
    .catch(function (e) {
      var saved = null;
      if (NATIVE) { try { saved = JSON.parse(lsGet(KEY) || "null"); } catch (x) {} }
      if (saved) start(saved);                              // hors ligne dans l'APK : JSON gardé la dernière fois
      else console.warn("ECOLIA : JSON des images indisponible.", e);
    });
