* { margin:0; padding:0; box-sizing:border-box; }

<script>
const COURSE_TITLE = "Éducation physique";
const slides = [
{
    title: "Sommaire général — Éducation physique 8e année",
    content: `
<div class="bloc theorie"><div class="bloc-label">Programme</div>
<p>Ce fichier couvre les 16 leçons d'Éducation physique de la 8e année de l'éducation de base en RDC, organisées en un parcours continu.</p>
<ul>
<li><strong>Objectifs, échauffement, coordination et endurance</strong> : leçons 1 à 4</li>
<li><strong>Vitesse, sauts, lancers, renforcement et souplesse</strong> : leçons 5 à 9</li>
<li><strong>Jeux collectifs et sports avec ballon</strong> : leçons 10 à 12</li>
<li><strong>Athlétisme et gymnastique</strong> : leçons 13 et 14</li>
<li><strong>Hygiène, sécurité et organisation sportive</strong> : leçons 15 et 16</li>
</ul>
<p>L'évaluation finale de 32 questions couvre l'ensemble du programme.</p>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'éducation physique développe la santé, la motricité, la coopération et la discipline. Les activités sont adaptées aux capacités des élèves et aux conditions de pratique.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif d'éducation physique 8e année (MEPST/DIPROMAD). Wikimedia Commons pour les illustrations.</div>
    `
},
{
    title: "Leçon 1 : L'éducation physique et ses objectifs",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une école de Kinshasa, les élèves participent à une séance d'éducation physique. Le professeur explique que cette matière développe le corps, la santé et l'esprit d'équipe. Les élèves découvrent les bénéfices de l'activité physique régulière.</p></div>
<img alt="Anneaux olympiques, symbole du sport et de l'effort physique" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Olympic_rings_without_rims.svg?width=700" data-image-id="EP8_1">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Symbole du sport — Wikimedia Commons : Olympic_rings_without_rims.svg.</p>
<h3>1. Les objectifs de l'éducation physique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>L'éducation physique vise à développer la santé, les capacités motrices (courir, sauter, lancer), la coopération, la discipline et le respect des règles. Elle contribue à l'équilibre physique et mental.</p></div>
<h3>2. Les bénéfices de l'activité physique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Une activité physique régulière renforce le cœur, les muscles et les os, améliore la respiration, réduit le stress et favorise la concentration. Elle aide aussi à prévenir certaines maladies.</p></div>
<h3>3. La sécurité et le respect</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Toute activité physique doit se dérouler dans un espace sécurisé, avec une tenue adaptée et le respect des consignes. Chacun participe selon ses capacités, sans se moquer des autres.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Un élève qui pratique une activité physique régulière améliore son endurance en quelques semaines. Il dort mieux, se concentre davantage en classe et se sent plus énergique. Ces bénéfices se cumulent avec la pratique régulière.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'éducation physique développe la santé, la motricité et la coopération. L'activité physique régulière a des bénéfices physiques et mentaux. La sécurité et le respect sont essentiels.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Organisation mondiale de la santé (OMS). Wikimedia Commons : Olympic_rings_without_rims.svg.</div>
    `
},
{
    title: "Leçon 2 : L'échauffement et le retour au calme",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Avant une séance de sport à Lubumbashi, le professeur demande aux élèves de marcher, puis de mobiliser leurs articulations. En fin de séance, il les guide dans un retour au calme. Les élèves apprennent à préparer et à récupérer.</p></div>
<img alt="Ballon de basketball, support d'activités d'échauffement" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Basketball.png?width=700" data-image-id="EP8_2">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Ballon de basketball — Wikimedia Commons : Basketball.png.</p>
<h3>1. L'échauffement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>L'échauffement prépare le corps à l'effort. Il comprend une mise en train (marche rapide, jogging léger) et des mobilisations articulaires (épaules, hanches, chevilles, genoux). Il augmente la température corporelle et réduit le risque de blessure.</p></div>
<h3>2. La mobilisation articulaire</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>On fait tourner doucement les articulations : épaules, poignets, hanches, genoux, chevilles. Les mouvements sont lents et contrôlés, sans forcer. On termine par quelques accélérations progressives.</p></div>
<h3>3. Le retour au calme</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>En fin de séance, le retour au calme permet au corps de récupérer. On ralentit progressivement, on marche, on respire profondément et on étire doucement les muscles sollicités.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Routine d'échauffement : 2 minutes de marche rapide, 10 rotations d'épaules, 10 rotations de hanches, 10 flexions de genoux, 5 accélérations sur 10 mètres. Routine de retour au calme : 2 minutes de marche lente, respiration profonde, étirements des jambes et des bras.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'échauffement prépare le corps et réduit le risque de blessure. La mobilisation articulaire se fait en douceur. Le retour au calme favorise la récupération.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Basketball.png.</div>
    `
},
{
    title: "Leçon 3 : La posture, l'équilibre et la coordination",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans la cour d'une école de Bukavu, les élèves suivent un parcours moteur : marcher sur une ligne, tenir en équilibre sur un pied, lancer et rattraper un ballon. Ils apprennent à coordonner leurs mouvements.</p></div>
<img alt="Corps humain avec ses parties principales" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Human_body_features-en.svg?width=700" data-image-id="EP8_3">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Corps humain — Wikimedia Commons : Human_body_features-en.svg.</p>
<h3>1. La posture</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Une bonne posture aligne la tête, les épaules, le bassin et les pieds. Elle protège le dos et facilite les mouvements. On la travaille par des exercices simples : se tenir droit, regarder devant soi, relâcher les épaules.</p></div>
<h3>2. L'équilibre</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>L'équilibre est la capacité à maintenir une position stable. On le travaille en tenant sur un pied, en marchant sur une ligne ou en restant immobile les yeux fermés. Ces exercices renforcent les chevilles et la concentration.</p></div>
<h3>3. La coordination</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>La coordination est la capacité à réaliser des mouvements harmonieux avec plusieurs parties du corps. Les exercices de coordination combinent les bras et les jambes, la marche et le lancer, ou la course et le saut.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Parcours moteur : marcher sur une ligne droite (équilibre), faire trois sauts sur un pied (coordination), lancer une balle dans un panier (précision), revenir en courant (endurance). Chaque étape sollicite une capacité différente.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La posture aligne le corps et protège le dos. L'équilibre se travaille par des exercices de stabilité. La coordination combine plusieurs mouvements.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Human_body_features-en.svg.</div>
    `
},
{
    title: "Leçon 4 : L'endurance et l'effort physique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un professeur de Kisangani organise une course autour du terrain. Les élèves alternent marche et course à allure modérée. Ils apprennent à gérer leur souffle et à récupérer après l'effort.</p></div>
<img alt="Ballon de football utilisé lors d'activités d'endurance" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Soccerball.svg?width=700" data-image-id="EP8_4">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Activité d'endurance — Wikimedia Commons : Soccerball.svg.</p>
<h3>1. L'endurance</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>L'endurance est la capacité à maintenir un effort physique sur une longue durée. Elle dépend du cœur, des poumons et des muscles. On la développe par des efforts continus et modérés.</p></div>
<h3>2. La respiration et l'allure</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Pendant l'effort, on respire régulièrement, par le nez et la bouche. On choisit une allure qui permet de parler sans être essoufflé. On ajuste l'allure à ses capacités, sans forcer.</p></div>
<h3>3. La récupération</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Après un effort, on ralentit progressivement. On marche, on respire profondément, on s'étire doucement. La récupération permet au corps de retrouver son état normal et prépare la séance suivante.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Course autour du terrain : 1 minute de marche rapide, puis 1 minute de course légère. On répète cette alternance 5 fois. À la fin, on marche 2 minutes pour récupérer. Cette méthode développe l'endurance sans épuiser l'élève.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'endurance se développe par des efforts continus et modérés. La respiration et l'allure sont adaptées à l'effort. La récupération est indispensable après l'exercice.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Soccerball.svg.</div>
    `
},
{
    title: "Leçon 5 : La vitesse et le temps de réaction",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Sur un terrain de Kinshasa, les élèves s'alignent pour une course courte. Au signal du professeur, ils démarrent le plus vite possible. Ils apprennent à réagir rapidement et à maîtriser leur course.</p></div>
<img alt="Pictogramme d'athlétisme illustrant la course rapide" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Athletics_pictogram.svg?width=700" data-image-id="EP8_5">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Course rapide — Wikimedia Commons : Athletics_pictogram.svg.</p>
<h3>1. Le temps de réaction</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le temps de réaction est le délai entre un signal (coup de sifflet, claquement) et le début du mouvement. On l'améliore par des exercices de départ au signal, dans différentes positions.</p></div>
<h3>2. La course rapide</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>La course rapide se fait sur une courte distance (20 à 40 m). On démarre vite, on court en ligne droite, on regarde devant soi. On ralentit progressivement après l'arrivée.</p></div>
<h3>3. La maîtrise et la sécurité</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>On court sur une surface dégagée et plane. On évite les obstacles. On ne pousse pas les autres. On s'arrête progressivement pour éviter les chutes.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Exercice : les élèves sont alignés derrière une ligne. Au signal, ils courent sur 30 mètres. On compare les temps avec un chronomètre. On répète l'exercice en variant les positions de départ (debout, assis, allongé).</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le temps de réaction se travaille par des départs au signal. La course rapide se fait sur une courte distance. La sécurité et la maîtrise sont essentielles.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Athletics_pictogram.svg.</div>
    `
},
{
    title: "Leçon 6 : Les sauts et la détente",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une zone de réception aménagée à Lubumbashi, les élèves s'entraînent au saut en longueur. Ils apprennent à prendre leur impulsion, à s'envoler et à retomber en équilibre.</p></div>
<img alt="Croix verte, symbole de sécurité et de santé" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Green_cross.svg?width=700" data-image-id="EP8_6">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Sécurité et santé — Wikimedia Commons : Green_cross.svg.</p>
<h3>1. L'impulsion</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>L'impulsion est le moment où l'on pousse sur ses jambes pour s'envoler. On fléchit les genoux, on balance les bras et on pousse fort sur les deux pieds (saut en longueur) ou sur un pied (saut en hauteur).</p></div>
<h3>2. L'envol et la réception</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Pendant l'envol, on garde l'équilibre. À la réception, on fléchit les genoux pour amortir le choc, on garde les pieds écartés à largeur de bassin et on regarde devant soi.</p></div>
<h3>3. La sécurité</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>On saute sur une surface adaptée (sable, tapis, herbe). On vérifie l'absence d'obstacles. On saute un élève à la fois. On ne saute pas sur du béton ou du sol dur.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Saut en longueur : l'élève court sur 10 mètres, prend son impulsion sur un pied, s'envole, retombe sur les deux pieds dans la zone de réception. On mesure la distance entre la ligne d'impulsion et le point de réception.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'impulsion propulse le corps vers l'avant ou le haut. La réception se fait en fléchissant les genoux. La sécurité impose une surface adaptée et l'absence d'obstacles.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Green_cross.svg.</div>
    `
},
{
    title: "Leçon 7 : Les lancers et la précision",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un atelier de précision à Kinshasa, les élèves lancent une balle souple vers une cible. Ils apprennent à doser leur force et à viser avec précision.</p></div>
<img alt="Ballon utilisé pour les exercices de lancer" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Volleyball_(ball).svg?width=700" data-image-id="EP8_7">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Balle de lancer — Wikimedia Commons : Volleyball_(ball).svg.</p>
<h3>1. Le geste de lancer</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le lancer se fait avec tout le corps : on place un pied en avant, on recule le bras, on pivote le buste, puis on projette le bras vers l'avant en visant la cible.</p></div>
<h3>2. Le dosage de la force</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>La force du lancer doit être adaptée à la distance de la cible. Trop fort, le projectile dépasse la cible ; trop faible, il n'atteint pas. L'entraînement permet d'ajuster ce dosage.</p></div>
<h3>3. La sécurité</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>On lance dans une direction dégagée. On ne lance jamais vers une personne. On utilise un matériel souple et léger. On attend le signal avant de récupérer le projectile.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Atelier de précision : une cible est placée à 5 mètres. L'élève lance une balle souple en visant le centre. Après 5 essais, on compte le nombre de tirs réussis. On augmente progressivement la distance.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le lancer mobilise tout le corps. La force est adaptée à la distance. La sécurité impose une direction dégagée et un matériel souple.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Volleyball_(ball).svg.</div>
    `
},
{
    title: "Leçon 8 : Les exercices de renforcement musculaire adaptés",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un circuit moteur à Kinshasa, les élèves réalisent des squats, des gainages et des mouvements des bras. Ils apprennent à renforcer leurs muscles avec leur propre poids.</p></div>
<img alt="Pictogramme de gymnastique illustrant le renforcement musculaire" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Gymnastics_pictogram.svg?width=700" data-image-id="EP8_8">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Renforcement musculaire — Wikimedia Commons : Gymnastics_pictogram.svg.</p>
<h3>1. La force fonctionnelle</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>La force fonctionnelle est la capacité à produire un effort utile dans les gestes de la vie quotidienne. Elle se travaille par des exercices comme les squats, les fentes, les pompes adaptées et le gainage.</p></div>
<h3>2. Le contrôle du mouvement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Chaque exercice doit être exécuté lentement et avec une technique correcte. On contrôle la descente et la montée, on garde le dos droit, on respire régulièrement.</p></div>
<h3>3. La progression</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>On commence par peu de répétitions, puis on augmente progressivement. On respecte les limites de son corps. On fait des pauses entre les séries.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Circuit : 10 squats, 10 secondes de gainage, 10 mouvements de bras. On répète le circuit 3 fois, avec 1 minute de repos entre les séries. On augmente progressivement le nombre de répétitions.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le renforcement musculaire utilise le poids du corps. La technique et le contrôle priment sur la quantité. La progression est lente et respecte les limites de chacun.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Gymnastics_pictogram.svg.</div>
    `
},
{
    title: "Leçon 9 : La souplesse et la mobilité",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>En fin de séance à Bukavu, les élèves effectuent des étirements doux. Ils apprennent à améliorer leur souplesse et leur mobilité articulaire.</p></div>
<img alt="Pictogramme de handball illustrant la mobilité des bras" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Handball_pictogram.svg?width=700" data-image-id="EP8_9">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Mobilité — Wikimedia Commons : Handball_pictogram.svg.</p>
<h3>1. La souplesse</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>La souplesse est l'amplitude des mouvements articulaires. Elle dépend des muscles et des articulations. On l'entretient par des étirements réguliers, doux et sans douleur.</p></div>
<h3>2. La mobilité articulaire</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>La mobilité est la capacité d'une articulation à bouger dans toute son amplitude. On la travaille par des rotations lentes, des cercles avec les bras, des flexions et extensions contrôlées.</p></div>
<h3>3. Les étirements sans douleur</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>On étire un muscle jusqu'à ressentir une légère tension, jamais de douleur. On maintient la position 15 à 30 secondes, on respire et on relâche. On étire les principaux groupes musculaires : jambes, dos, épaules.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Routine de mobilité : 10 rotations d'épaules, 10 cercles de bras, 10 flexions latérales du buste, 10 rotations de chevilles. Routine d'étirements : 20 secondes d'étirement des ischio-jambiers, 20 secondes des mollets, 20 secondes du dos.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La souplesse et la mobilité s'entretiennent par des exercices réguliers. Les étirements sont doux et sans douleur. Ils améliorent la posture et réduisent les tensions.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Handball_pictogram.svg.</div>
    `
},

    title: "Leçon 10 : Les jeux collectifs et la coopération",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans la cour d'une école de Kinshasa, deux équipes s'affrontent dans un jeu collectif. Les élèves apprennent à se faire des passes, à se démarquer et à coopérer pour marquer.</p></div>
<img alt="Terrain de basketball avec ses lignes de jeu" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Basketball_court_with_measurements.svg?width=700" data-image-id="EP8_10">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Terrain de jeu collectif — Wikimedia Commons : Basketball_court_with_measurements.svg.</p>
<h3>1. Les règles communes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Un jeu collectif repose sur des règles connues et acceptées : nombre de joueurs, terrain, durée, façons de marquer. Les règles garantissent l'équité et la sécurité.</p></div>
<h3>2. La coopération</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>La coopération consiste à jouer ensemble pour atteindre un objectif commun. Elle implique la communication, le démarquage, les passes et le soutien entre coéquipiers.</p></div>
<h3>3. L'esprit d'équipe</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>L'esprit d'équipe, c'est respecter ses partenaires et ses adversaires, accepter la défaite et féliciter les autres. On ne se moque pas des erreurs, on encourage.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Jeu de passes : deux équipes de 5 joueurs. Le but est de se faire 10 passes consécutives sans que l'adversaire intercepte le ballon. On tourne les rôles après chaque partie. Le jeu développe la coopération et la communication.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les jeux collectifs reposent sur des règles communes. La coopération et la communication sont essentielles. L'esprit d'équipe repose sur le respect et l'encouragement.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Basketball_court_with_measurements.svg.</div>
    `
},

    title: "Leçon 11 : Le football : règles et gestes fondamentaux",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Sur un terrain adapté de Lubumbashi, les élèves jouent un match de football. Ils apprennent à contrôler le ballon, à faire des passes et à respecter les règles.</p></div>
<img alt="Terrain de football avec ses lignes et zones" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Football_pitch_(soccer)_template.svg?width=700" data-image-id="EP8_11">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Terrain de football — Wikimedia Commons : Football_pitch_(soccer)_template.svg.</p>
<h3>1. Les gestes fondamentaux</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Les gestes de base au football sont : le contrôle du ballon (pied, cuisse, poitrine), la passe (intérieur ou extérieur du pied), la conduite de balle et le tir. On apprend à maîtriser ces gestes avant de jouer.</p></div>
<h3>2. Les règles de base</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Chaque équipe compte 11 joueurs (ou moins en version réduite). On marque un but en faisant passer le ballon entre les poteaux. Le gardien peut utiliser les mains dans sa surface. Les autres joueurs utilisent les pieds, la tête et le corps.</p></div>
<h3>3. Le fair-play</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le fair-play, c'est respecter les règles, l'arbitre et les adversaires. On ne bouscule pas, on ne triche pas, on accepte les décisions. On félicite l'adversaire à la fin du match.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Atelier de passes : deux élèves à 5 mètres l'un de l'autre. L'un passe avec l'intérieur du pied, l'autre contrôle et repasse. On répète 20 fois, puis on change de partenaire. On augmente la distance progressivement.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le football repose sur des gestes techniques (contrôle, passe, tir) et des règles précises. Le fair-play est essentiel. On apprend les gestes avant de jouer un match.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Fédération internationale de football association (FIFA). Wikimedia Commons : Football_pitch_(soccer)_template.svg.</div>
    `
},

    title: "Leçon 12 : Le basketball ou le handball : gestes fondamentaux",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un terrain scolaire de Kinshasa, les élèves s'entraînent au basketball : passes, tirs et déplacements. Ils apprennent les gestes de base de ce sport collectif.</p></div>
<img alt="Terrain de basketball avec ses zones" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Basketball_court_with_measurements.svg?width=700" data-image-id="EP8_12">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Terrain de basketball — Wikimedia Commons : Basketball_court_with_measurements.svg.</p>
<h3>1. La passe</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>La passe se fait à deux mains (passe poitrine) ou à une main. On regarde son partenaire, on pousse le ballon vers lui, on accompagne le geste. La passe doit être précise et rapide.</p></div>
<h3>2. La réception et le déplacement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>À la réception, on tend les mains, on amortit le ballon et on le protège. On se déplace en dribblant (basketball) ou en marchant (handball). On garde la tête levée pour voir le jeu.</p></div>
<h3>3. Le tir</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Au basketball, le tir se fait en poussant le ballon vers le panier, les bras tendus vers le haut. Au handball, le tir se fait en armant le bras et en lançant le ballon vers le but. On vise et on ajuste la force.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Atelier de passes et de tirs : deux élèves se font des passes en courant, puis l'un tire au panier. On répète 10 fois, puis on change de rôle. On corrige la posture et la trajectoire du ballon.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le basketball et le handball reposent sur la passe, la réception, le déplacement et le tir. La précision et la communication sont essentielles. On adapte le sport aux installations disponibles.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Fédération internationale de basketball (FIBA). Fédération internationale de handball (IHF). Wikimedia Commons : Basketball_court_with_measurements.svg.</div>
    `
},

<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Athlétisme — Wikimedia Commons : Athletics_pictogram.svg.</p>
<h3>1. La course</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>La course comprend le sprint (courte distance), la course de fond (longue distance) et le relais. On court dans un couloir, on respecte le signal de départ et on ne gêne pas les autres.</p></div>
<h3>2. Le saut</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le saut comprend le saut en longueur et le saut en hauteur. On prend son impulsion, on s'envole et on retombe dans une zone adaptée. La mesure se fait entre la ligne d'impulsion et le point de réception.</p></div>
<h3>3. Le lancer</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le lancer comprend le lancer du poids, du disque, du javelot et du marteau. On lance dans un secteur délimité, sans danger pour les autres. La mesure se fait depuis le point de chute.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Mini-concours : un atelier de course (30 m), un atelier de saut en longueur (zone de sable) et un atelier de lancer (balle souple). Chaque élève participe aux trois ateliers. On note les performances pour établir un classement.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'athlétisme regroupe la course, le saut et le lancer. Chaque discipline a ses règles et ses mesures. La sécurité est prioritaire lors des lancers.</p></div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un espace sécurisé de Kinshasa, les élèves apprennent des déplacements simples au sol : appuis, roulades adaptées, alignements. Ils développent leur maîtrise corporelle.</p></div>
<img alt="Pictogramme de gymnastique illustrant les appuis au sol" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Gymnastics_pictogram.svg?width=700" data-image-id="EP8_14">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Gymnastique — Wikimedia Commons : Gymnastics_pictogram.svg.</p>
<h3>1. Les appuis</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Les appuis sont les points de contact du corps avec le sol ou un engin. On distingue les appuis sur les mains, les pieds, les genoux. On apprend à passer d'un appui à l'autre avec contrôle.</p></div>
<h3>2. Les roulades adaptées</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>La roulade avant se fait sur un tapis : on part accroupi, on pose les mains devant soi, on bascule la tête en rentrant le menton, on roule sur le dos et on revient debout. On apprend à la faire en sécurité.</p></div>
<h3>3. L'alignement et la maîtrise</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Les figures de gymnastique demandent de l'alignement : le corps reste droit, les articulations sont verrouillées, la respiration est régulière. On contrôle chaque mouvement pour éviter les chutes.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Parcours au sol : marcher sur une ligne, sauter à pieds joints, faire une roulade avant sur un tapis, se relever, finir debout les bras levés. Chaque figure est exécutée en sécurité, avec l'aide de l'enseignant.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La gymnastique développe la maîtrise corporelle. Les appuis et les roulades se travaillent avec contrôle. L'alignement et la sécurité sont essentiels.</p></div>

    title: "Leçon 15 : L'hygiène, l'hydratation et la prévention des blessures",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Avant une séance à Kinshasa, le professeur vérifie l'eau, la tenue et l'espace de jeu. Il explique l'importance de l'hydratation et de la prévention des blessures.</p></div>
<img alt="Croix verte, symbole de la prévention et de la santé" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Green_cross.svg?width=700" data-image-id="EP8_15">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Prévention et santé — Wikimedia Commons : Green_cross.svg.</p>
<h3>1. L'hydratation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Pendant l'effort, le corps perd de l'eau par la sueur. Il faut boire régulièrement avant, pendant et après la séance. L'eau est la meilleure boisson. La déshydratation provoque fatigue, vertiges et baisse de performance.</p></div>
<h3>2. La tenue et l'hygiène</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>On porte une tenue adaptée : vêtements amples, chaussures de sport, pas de bijoux. On se lave après la séance, on change de vêtements. On protège les plaies avec un pansement propre.</p></div>
<h3>3. La prévention des blessures</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>On vérifie l'espace (pas d'obstacles, sol adapté), on s'échauffe, on respecte les consignes, on adapte l'intensité à la chaleur. En cas de blessure, on arrête l'activité et on prévient un adulte.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Avant une séance par temps chaud : vérifier la présence d'eau potable, choisir un espace ombragé, réduire l'intensité. Pendant la séance : boire toutes les 15 minutes. Après la séance : se laver, changer de vêtements, boire de l'eau.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'hydratation est essentielle pendant l'effort. La tenue et l'hygiène protègent la santé. La prévention des blessures repose sur la vérification de l'espace, l'échauffement et le respect des consignes.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Organisation mondiale de la santé (OMS). Wikimedia Commons : Green_cross.svg.</div>
    `

    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);

    // Suivi de la slide affichée (boutons, recherche, quiz : tout passe par currentSlide)
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
