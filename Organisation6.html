    title: "Leçon 1 — L'entreprise : définition, caractéristiques et formes juridiques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À Kinshasa, deux amis veulent créer une petite entreprise de vente de beignets. Ils hésitent : faut-il créer une entreprise individuelle ou une SARL ? Chaque forme a ses avantages et ses obligations. Comprendre la définition et les formes juridiques de l'entreprise est la première étape de tout projet entrepreneurial.</p></div>
<h3>1. Définition et caractéristiques de l'entreprise</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Entreprise</strong> : unité économique autonome combinant des facteurs de production (travail, capital, ressources) pour créer des biens ou des services destinés à la vente sur un marché[reference:0].</li><li><strong>Finalités</strong> : économique (réaliser un profit), sociale (créer des emplois), sociétale (responsabilité sociétale des entreprises, RSE)[reference:1].</li><li><strong>Exemples congolais</strong> : la Gécamines, la SNEL, les PME familiales de Kinshasa.</li><li><strong>Objectif terminal</strong> : l'élève doit être capable de décrire l'entreprise comme un système de fonctions interdépendantes (administrative, commerciale, financière, technique)[reference:2].</li></ul></div>
<h3>2. Classification des entreprises en RDC</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Selon la taille</strong> : Très Petite Entreprise (TPE), Petite et Moyenne Entreprise (PME), Grande Entreprise.</li><li><strong>Selon le secteur</strong> : primaire (agriculture, mines, comme la Gécamines à Lubumbashi), secondaire (industrie, comme la cimenterie de Lukala), tertiaire (services, comme les banques de Kinshasa)[reference:3].</li><li><strong>Selon le statut juridique</strong> : entreprise individuelle, société commerciale, coopérative, entreprise publique.</li></ul></div>
<h3>3. Les formes juridiques selon le droit OHADA</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Établissement</strong> (entreprise individuelle) : une seule personne, responsabilité illimitée.</li><li><strong>SARL</strong> (Société à Responsabilité Limitée) : responsabilité limitée aux apports, capital minimum libre.</li><li><strong>SA</strong> (Société Anonyme) : capital divisé en actions, adaptée aux grandes entreprises.</li><li><strong>Le cadre légal OHADA</strong> régit les structures juridiques des affaires en RDC[reference:4].</li></ul></div>
<h3>4. L'environnement de l'entreprise</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Micro-environnement</strong> : clients, fournisseurs, concurrents, partenaires.</li><li><strong>Macro-environnement</strong> : État, culture, technologie, économie.</li><li><strong>Cas concret</strong> : une boulangerie de Kinshasa dépend de ses fournisseurs de farine, de ses clients, de la DGI (impôts) et de la SNEL (électricité)[reference:5].</li></ul><p><a href="https://www.youtube.com/results?search_query=entreprise+définition+classification+formes+juridiques+OHADA+RDC" target="_blank" rel="noopener">🎥 Recherche : l'entreprise et ses formes (chaînes de cours de gestion)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'entreprise est une unité économique combinant des facteurs de production. Elle se classe par taille, par secteur et par statut juridique. Le droit OHADA distingue l'établissement, la SARL et la SA. L'entreprise interagit avec son micro et macro-environnement.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Organisation des Entreprises, 4e CG (manuels-scolaires-rdc.com, 2025)[reference:6] ; Curriculum de Commerciale et Gestion (MEPST/DIPROMAD, 2023).<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, OHADA, SARL, SA, PME, RSE.</div>
    `
},
{
    title: "Leçon 2 — Les structures organisationnelles et l'organigramme",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Au service de l'organisation des entreprises à Lubumbashi, une élève doit lire l'organigramme d'une banque de la Gombe pour identifier à qui s'adresser. Sans cette compétence, impossible de circuler dans l'entreprise ou de comprendre les flux décisionnels.</p></div>
<h3>1. Principes d'organisation et de hiérarchie</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Division du travail</strong> : spécialisation des tâches pour accroître l'efficacité.</li><li><strong>Unité de commandement</strong> : chaque employé ne reçoit d'ordres que d'un seul chef.</li><li><strong>Éventail de subordination</strong> : nombre de subordonnés qu'un chef peut encadrer efficacement.</li><li><strong>Délégation d'autorité</strong> : transfert d'une partie du pouvoir de décision[reference:7].</li></ul></div>
<h3>2. La structure hiérarchique et fonctionnelle</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Structure hiérarchique (linéaire)</strong> : de type militaire, autorité du supérieur sur tous les subordonnés.</li><li><strong>Structure fonctionnelle</strong> : spécialisation par métier ; autorité du directeur RH sur le personnel de réception, par exemple.</li><li><strong>Dans un grand hôtel</strong> : distinction entre autorité hiérarchique du Directeur Général et autorité fonctionnelle du Directeur RH[reference:8].</li></ul></div>
<h3>3. L'organigramme : lecture et conception</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Organigramme</strong> : représentation graphique de la structure de l'entreprise.</li><li><strong>Types</strong> : hiérarchique, fonctionnel, divisionnel, matriciel.</li><li><strong>Lecture</strong> : identifier les niveaux de responsabilité, les liaisons fonctionnelles, les liens d'autorité.</li><li><strong>Conception</strong> : dessiner un organigramme simple d'une PME congolaise[reference:9].</li></ul></div>
<h3>4. Les structures divisionnelles et matricielles</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Structure divisionnelle</strong> : par produit ou par région géographique.</li><li><strong>Structure matricielle</strong> : croisement de deux lignes d'autorité (fonctionnelle et projet).</li><li><strong>Cas congolais</strong> : les banques nationales disposant d'agences provinciales, comme la Trust Merchant Bank, illustrent la décentralisation des décisions tout en maintenant une cohérence nationale[reference:10].</li></ul><p><a href="https://www.youtube.com/results?search_query=structure+organisationnelle+organigramme+entreprise+hiérarchique" target="_blank" rel="noopener">🎥 Recherche : les structures organisationnelles (chaînes de cours de gestion)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'organisation repose sur la division du travail, l'unité de commandement et la délégation. La structure peut être hiérarchique ou fonctionnelle. L'organigramme est l'outil de lecture et de conception des structures. Les structures divisionnelles et matricielles s'appliquent aux grandes entreprises.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Organisation des Entreprises, 4e CG (manuels-scolaires-rdc.com, 2025)[reference:11] ; Curriculum de Commerciale et Gestion (MEPST/DIPROMAD, 2023).</div>
    `
},
{
    title: "Leçon 3 — Les grandes fonctions de l'entreprise",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une usine de transformation de manioc à Kinshasa, le directeur général fixe les objectifs, les RH gèrent les employés, le service commercial vend la farine, la finance contrôle les flux et la technique assure la production. Cinq fonctions interdépendantes. Si l'une s'arrête, tout l'organisme s'arrête.</p></div>
<h3>1. La fonction administrative et de direction</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Rôle</strong> : fixer les objectifs et contrôler les résultats.</li><li><strong>Management stratégique</strong> : décisions à long terme (implantation, gamme de produits).</li><li><strong>Management opérationnel</strong> : décisions quotidiennes (planning, coordination).</li><li><strong>Circulation de l'information</strong> : les décisions de la Direction Générale redescendent vers la base opérationnelle[reference:12].</li></ul></div>
<h3>2. La fonction ressources humaines (RH)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Recrutement</strong> : recherche et sélection des candidats.</li><li><strong>Gestion de la paie</strong> : rémunération, cotisations sociales.</li><li><strong>Formation</strong> : développement des compétences.</li><li><strong>Gestion des présences et congés</strong>.</li><li><strong>Respect du règlement d'entreprise</strong> : discipline, hygiène et sécurité[reference:13].</li></ul></div>
<h3>3. La fonction commerciale et marketing</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Vente des produits et services</strong>.</li><li><strong>Relation client</strong> : le service d'accueil (front office) est le point d'entrée des prospects.</li><li><strong>Marketing</strong> : étude de marché, stratégie 4P (Produit, Prix, Place, Promotion).</li><li><strong>Lien organique</strong> : l'accueil est le vecteur premier de l'image de marque définie par le marketing[reference:14].</li></ul></div>
<h3>4. Les fonctions financière et technique</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Finance</strong> : gestion des flux monétaires, trésorerie, budget, relations bancaires.</li><li><strong>Technique</strong> : production, maintenance, qualité, approvisionnement.</li><li><strong>Interaction</strong> : l'hôtesse d'accueil oriente les fournisseurs (facturation) ou les techniciens de maintenance vers les services compétents[reference:15].</li></ul><p><a href="https://www.youtube.com/results?search_query=fonctions+entreprise+administrative+RH+commerciale+financière+technique" target="_blank" rel="noopener">🎥 Recherche : les fonctions de l'entreprise (chaînes de cours de gestion)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'entreprise est un système de cinq fonctions interdépendantes : administrative, ressources humaines, commerciale, financière et technique. Chacune a un rôle précis et contribue à la performance globale de l'organisation.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Organisation des Entreprises, 4e CG (manuels-scolaires-rdc.com, 2025)[reference:16] ; Curriculum de Commerciale et Gestion (MEPST/DIPROMAD, 2023).</div>
    `
},
{
    title: "Leçon 4 — La gestion des ressources humaines : recrutement et administration du personnel",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>La SNEL à Kinshasa lance une campagne de recrutement pour cinq postes de techniciens. Le service RH doit définir les postes, publier l'offre, recevoir les dossiers, sélectionner les candidats et les intégrer. Sans ce processus, impossible de recruter les bonnes personnes au bon poste.</p></div>
<h3>1. Le processus de recrutement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition du poste</strong> : missions, compétences requises, profil.</li><li><strong>Publication de l'offre</strong> : affichage interne, presse, médias sociaux, ONEM.</li><li><strong>Réception des candidatures</strong> : lettre de motivation, CV, diplômes.</li><li><strong>Sélection</strong> : présélection sur dossier, tests écrits, entretiens.</li><li><strong>Intégration</strong> : accueil, présentation de l'entreprise, formation d'accueil.</li></ul></div>
<h3>2. Le plan de formation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Objectif</strong> : adapter les compétences des employés aux évolutions du métier.</li><li><strong>Étapes</strong> : identification des besoins, conception, réalisation, évaluation.</li><li><strong>Exemples</strong> : formation à la sécurité minière à Kolwezi, formation à la comptabilité OHADA à Kinshasa.</li><li><strong>Gestion de carrière</strong> : promotions, mobilité interne, reconversion.</li></ul></div>
<h3>3. Sécurité et hygiène au travail</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Obligations de l'employeur</strong> : fournir un environnement de travail sûr.</li><li><strong>Équipements de protection individuelle (EPI)</strong> : casques, gants, chaussures de sécurité.</li><li><strong>Prévention des accidents</strong> : signalisation, formation, inspections.</li><li><strong>Rôle du salarié</strong> : respecter les consignes de sécurité.</li></ul></div>
<h3>4. Les relations avec les partenaires sociaux</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Syndicats</strong> : défense des intérêts des travailleurs.</li><li><strong>Négociation collective</strong> : discussion des salaires, conditions de travail, avantages sociaux.</li><li><strong>Dialogue social</strong> : prévention et résolution des conflits.</li><li><strong>Cas RDC</strong> : la Confédération des Syndicats du Congo négocie avec les employeurs sur le salaire minimum et les conditions de travail[reference:17].</li></ul><p><a href="https://www.youtube.com/results?search_query=gestion+ressources+humaines+recrutement+formation+paie+RDC" target="_blank" rel="noopener">🎥 Recherche : la gestion des ressources humaines (chaînes de cours de gestion)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La GRH gère le recrutement, la formation, la paie, la sécurité et les relations sociales. Le processus de recrutement comprend la définition du poste, la publication, la sélection et l'intégration. Le dialogue social est essentiel pour la paix sociale dans l'entreprise.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Organisation des Entreprises, 4e CG (manuels-scolaires-rdc.com, 2025)[reference:18] ; Curriculum de Commerciale et Gestion (MEPST/DIPROMAD, 2023).</div>
    `
},
{
    title: "Leçon 5 — La gestion commerciale et le marketing",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une entreprise de Kinshasa fabrique des jus naturels à base de fruits locaux. Comment fixer le prix ? Où vendre ? Comment se faire connaître ? Le marketing mix (les 4P) est l'outil qui répond à toutes ces questions.</p></div>
<h3>1. Le marketing mix : les 4P</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Produit (Product)</strong> : qualité, conditionnement, marque, garantie. Exemple local : analyser le conditionnement d'une bière locale (Primus, Skol)[reference:19].</li><li><strong>Prix (Price)</strong> : stratégie de tarification, remises, crédits. Exemple : les micro-tarifs des unités de téléphonie mobile.</li><li><strong>Place (Distribution)</strong> : canaux de distribution, points de vente, logistique. Exemple : le circuit d'approvisionnement du pain à Kinshasa.</li><li><strong>Promotion (Publicité)</strong> : publicité, promotion des ventes, relations publiques, marketing digital[reference:20].</li></ul></div>
<h3>2. L'étude de marché</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : collecte et analyse d'informations sur le marché.</li><li><strong>Offre</strong> : concurrents, produits existants, prix pratiqués.</li><li><strong>Demande</strong> : besoins des consommateurs, pouvoir d'achat, habitudes d'achat.</li><li><strong>Environnement</strong> : réglementation, tendances, technologie.</li><li><strong>Analyse SWOT</strong> : Forces, Faiblesses, Opportunités, Menaces.</li></ul></div>
<h3>3. La politique d'achat et gestion des stocks</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Fonction approvisionnement</strong> : acheter les bonnes quantités, au bon moment, au bon prix.</li><li><strong>Gestion des stocks</strong> : éviter les ruptures et les surstocks.</li><li><strong>Méthode ABC</strong> : classer les articles selon leur importance (A : forte valeur, B : moyenne, C : faible valeur)[reference:21].</li><li><strong>Stock de sécurité</strong> : quantité minimale pour éviter la rupture.</li><li><strong>Taux de rotation</strong> : nombre de fois que le stock est renouvelé dans l'année.</li></ul></div>

<h3>1. Le bilan fonctionnel</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Bilan</strong> : photographie du patrimoine de l'entreprise à une date donnée.</li><li><strong>Actif</strong> : ce que possède l'entreprise (immobilisations, stocks, créances, trésorerie).</li><li><strong>Passif</strong> : ce que doit l'entreprise (capitaux propres, dettes).</li><li><strong>Équilibre</strong> : Total Actif = Total Passif.</li><li><strong>Bilan fonctionnel</strong> : reclassement des postes selon leur fonction (emplois stables, actif circulant, trésorerie)[reference:23].</li></ul></div>
<h3>2. Les grands équilibres financiers</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Fonds de roulement (FR)</strong> : ressources stables − emplois stables. FR positif = marge de sécurité financière[reference:24].</li><li><strong>Besoin en fonds de roulement (BFR)</strong> : actif circulant (hors trésorerie) − passif circulant (hors trésorerie).</li><li><strong>Trésorerie nette (TN)</strong> : FR − BFR. TN positive = trésorerie disponible ; TN négative = tension de trésorerie.</li></ul></div>

        { text:"Quelle est la première étape du processus de recrutement ?", options:["La définition du poste","L'entretien","L'intégration"], correct:0 },
        { text:"Que protège un équipement de protection individuelle (EPI) ?", options:["La santé et la sécurité du travailleur","Le matériel informatique","Les documents confidentiels"], correct:0 },
        { text:"Que signifie le P de « Place » dans le marketing mix ?", options:["Le prix","La distribution","La promotion"], correct:1 },
        { text:"Que signifie le P de « Promotion » dans le marketing mix ?", options:["La publicité et la communication","Le produit","Le prix"], correct:0 },
        { text:"Quelle méthode classe les stocks par importance (A, B, C) ?", options:["La méthode ABC","La méthode FIFO","La méthode LIFO"], correct:0 },
        { text:"Qu'est-ce que le fonds de roulement ?", options:["Ressources stables − emplois stables","Actif circulant − passif circulant","Trésorerie nette"], correct:0 },
        { text:"Comment calcule-t-on la trésorerie nette ?", options:["FR − BFR","FR + BFR","BFR − FR"], correct:0 },
        { text:"Que mesure la capacité d'autofinancement (CAF) ?", options:["La ressource interne dégagée par l'entreprise","Le chiffre d'affaires","Le nombre d'employés"], correct:0 },
        { text:"Quel est l'objectif de l'ergonomie du poste de travail ?", options:["Minimiser la fatigue et maximiser la disponibilité","Augmenter le nombre d'heures","Réduire les salaires"], correct:0 },
        { text:"Que permet un bon classement des documents ?", options:["Retrouver rapidement l'information","Gagner de la place","Éviter les impôts"], correct:0 },
        { text:"Quelle est la première étape d'une négociation commerciale ?", options:["La préparation","L'ouverture","La conclusion"], correct:0 },
        { text:"Quel est le rôle des relations publiques ?", options:["Créer et maintenir une bonne image de l'entreprise","Augmenter les ventes immédiatement","Recruter du personnel"], correct:0 },
        { text:"Que signifie GUCE ?", options:["Guichet Unique de Création d'Entreprise","Groupement des Usines du Congo","Gestion des Unités Commerciales"], correct:0 },
        { text:"Où s'immatricule une entreprise en RDC ?", options:["Au RCCM (Registre du Commerce et du Crédit Mobilier)","À la DGI","À la CNSS"], correct:0 },
        { text:"Quel est l'objectif du travail de fin d'année en Organisation des Entreprises ?", options:["Produire un mini-dossier d'analyse d'une PME locale","Rédiger un roman","Construire un bâtiment"], correct:0 },
        { text:"Quelle est la vision de l'entreprise selon l'approche systémique ?", options:["Un système de fonctions interdépendantes","Une seule fonction","Une association"], correct:0 },
        { text:"Quel est l'intérêt d'étudier le marketing mix dans une entreprise congolaise ?", options:["Comprendre comment valoriser les produits locaux","Importer des produits étrangers","Licencier du personnel"], correct:0 },
        { text:"Quel est le rôle du service RH dans la gestion des présences ?", options:["Suivre les absences et les congés","Fixer les salaires","Recruter les clients"], correct:0 },
        { text:"Qu'est-ce que le dialogue social ?", options:["La négociation entre employeurs et syndicats","Une conversation informelle","Un discours politique"], correct:0 },
        { text:"Quelle est la première étape de la création d'entreprise ?", options:["L'idée de projet","Le financement","L'immatriculation"], correct:0 },
        { text:"Que contient le plan financier d'un projet ?", options:["Investissements et prévisions de recettes et dépenses","Le nom des employés","Le plan de la ville"], correct:0 },
        { text:"Quel est le rôle du service commercial dans une entreprise ?", options:["Vendre les produits et gérer la relation client","Produire les biens","Recruter le personnel"], correct:0 },
        { text:"Quel est l'objectif de la méthode ABC dans la gestion des stocks ?", options:["Classer les articles par importance","Calculer la paie","Mesurer la satisfaction client"], correct:0 },
        { text:"Quelle est la différence entre structure hiérarchique et fonctionnelle ?", options:["La hiérarchique est de type militaire, la fonctionnelle est spécialisée","La hiérarchique est spécialisée, la fonctionnelle est militaire","Aucune différence"], correct:0 },
        { text:"Quel est l'objectif principal de l'Organisation des Entreprises en 4e Commerciale ?", options:["Comprendre l'entreprise comme un système et participer à sa gestion","Créer une entreprise internationale","Remplacer le directeur"], correct:0 }
    ];
    let html = '';
    questions.forEach((q,i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o,k) => { html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>'; });
        html += '</div>';
    });
    document.getElementById('quizQuestions').innerHTML = html;
    document.getElementById('submitQuiz').onclick = () => {
        let score = 0;
        questions.forEach((q,i) => {
            const s = document.querySelector('input[name="q' + i + '"]:checked');
            if (s && parseInt(s.value) === q.correct) score++;
        });
        const pct = Math.round(score/questions.length*100);
        document.getElementById('quizResult').innerHTML = '<div style="background:#cfdff5;padding:16px;border-radius:10px;margin-top:14px;"><strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong><br>' + (score === questions.length ? 'Excellent. Tu maîtrises le programme.' : score >= 24 ? 'Bien. Revoyez les leçons où vous avez échoué.' : 'Relis attentivement les leçons avant l\'examen.') + '</div>';
    };
}
function renderSlide(index, keepHighlight = true) {
    const isQuiz = (index === slides.length - 1);
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    if (isQuiz) renderQuiz();
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm && !isQuiz) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>
</body>
</html>
