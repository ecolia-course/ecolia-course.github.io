{
    title: "Leçon 1 — Diagnostic et prérequis",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Que dois-je maîtriser avant d'apprendre à préparer une leçon ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Faire le point sur les prérequis. Comprendre les compétences visées par le cours. Se préparer aux ateliers et au micro-enseignement.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les prérequis</div>
<p>La didactique suppose une culture générale solide, une maîtrise fonctionnelle du français, des bases en calcul et en raisonnement logique, une aptitude à l'observation et une connaissance minimale de l'histoire et de la géographie de la RDC.</p>
<p>Ces prérequis permettent de comprendre les textes, les programmes, les situations de classe et les contenus à enseigner.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les compétences visées</div>
<ul>
<li>Maîtriser les théories de l'apprentissage appliquées à l'enseignement.</li>
<li>Concevoir des fiches de préparation et des plans de leçons.</li>
<li>Élaborer des grilles d'évaluation formative.</li>
<li>Analyser des situations réelles de classe.</li>
<li>S'initier au micro-enseignement.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Méthodologie du cours</div>
<ul>
<li>Alternance théorie / ateliers.</li>
<li>Productions concrètes (fiches, grilles).</li>
<li>Analyses de cas issus d'écoles congolaises.</li>
<li>Micro-enseignement filmé ou observé par les pairs.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois compétences que tu veux acquérir en didactique et justifie ton choix.</p>

</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La didactique prépare à enseigner avec méthode : elle suppose des prérequis solides et aboutit à des outils concrets.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles Didactique Générale 3e HPR (Édition 2025).</div>
    `

{
    title: "Leçon 2 — Qu'est-ce que la didactique ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« La pédagogie et la didactique sont-elles la même chose ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la didactique. La distinguer de la pédagogie. Comprendre son rôle dans la formation de l'enseignant.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>La <strong>didactique</strong> est la science qui étudie les méthodes et les conditions de transmission des savoirs dans une discipline. Elle examine les contenus, les situations d'enseignement, les processus d'apprentissage et les outils nécessaires.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Didactique et pédagogie</div>
<ul>
<li><strong>Pédagogie :</strong> réflexion générale sur les buts et les principes de l'éducation.</li>
<li><strong>Didactique :</strong> étude des méthodes propres à une discipline et de l'ingénierie de l'enseignement.</li>
</ul>
<p>La pédagogie pose la question du <em>pourquoi</em> et du <em>pour qui</em> ; la didactique pose celle du <em>comment</em>, avec un contenu précis.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Didactique générale et didactique spéciale</div>
<ul>
<li><strong>Didactique générale :</strong> étudie les principes communs à toutes les disciplines (planifier, évaluer, animer).</li>
<li><strong>Didactique spéciale :</strong> étudie les méthodes propres à une discipline (didactique du français, des mathématiques, de l'histoire…).</li>
</ul>
<p>Notre cours couvre la didactique générale avec une ouverture vers la didactique des disciplines.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Distingue pédagogie et didactique en une phrase chacune.</p>
<p><strong>Ex. 2 :</strong> Cite un exemple de didactique spéciale et une question qu'elle se pose.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Pédagogie : réflexion sur les buts de l'éducation ; didactique : étude des méthodes pour enseigner un contenu précis. <strong>2)</strong> Didactique du français : comment enseigner la lecture au début du secondaire ?</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La didactique prolonge la pédagogie en étudiant les méthodes propres à chaque discipline.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles 3e HPR.</div>
    `
},
{
    title: "Leçon 3 — Théories de l'apprentissage appliquées",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Quelle théorie de l'apprentissage éclaire le mieux ma pratique en classe ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer les trois grands courants théoriques. Comprendre leurs applications didactiques. Choisir une approche adaptée à une situation.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Béhaviorisme</div>
<p>Apprentissage = association stimulus-réponse, renforcée par récompense ou punition. En didactique : exercices répétés, feedback immédiat, progression par petites étapes.</p>
<p><strong>Utile pour :</strong> automatismes (calcul, conjugaison, procédures simples).</p>
<p><strong>Limite :</strong> insuffisant pour les apprentissages complexes (compréhension, raisonnement).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Cognitivisme</div>
<p>Apprentissage = traitement de l'information (attention, mémoire, résolution de problèmes). En didactique : structurer les contenus, limiter la surcharge cognitive, organiser les informations, travailler la mémoire.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Socioconstructivisme (Vygotsky)</div>
<p>Apprentissage = construction dans l'interaction sociale. Notions clés :</p>
<ul>
<li><strong>Zone proximale de développement (ZPD) :</strong> ce que l'élève peut faire avec aide, mais pas encore seul.</li>
<li><strong>Étayage :</strong> soutien progressivement retiré.</li>
<li><strong>Médiation :</strong> rôle de l'enseignant et des pairs.</li>
</ul>
<p>En didactique : travail en groupes, tutorat entre pairs, projets, discussions guidées.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Application au contexte congolais</div>
<p>Dans une classe nombreuse, le socioconstructivisme permet d'utiliser les pairs comme ressources. Pour installer un automatisme (tables de multiplication), le béhaviorisme est efficace. Pour organiser un contenu dense, le cognitivisme fournit des outils clairs (schémas, plans, fiches).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Associe chaque situation à une théorie : installer les tables de multiplication ; faire débattre sur un texte ; organiser un plan de leçon en trois étapes.</p>
<p><strong>Ex. 2 :</strong> Explique la notion de zone proximale de développement.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Tables → béhaviorisme ; débat → socioconstructivisme ; plan → cognitivisme. <strong>2)</strong> La ZPD est l'écart entre ce que l'élève sait faire seul et ce qu'il peut faire avec une aide adaptée.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Aucune théorie n'est universelle : chaque situation didactique appelle une approche adaptée, souvent combinée.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles 3e HPR.</div>
    `
},
{
    title: "Leçon 4 — Typologies didactiques (méthodes, techniques, procédés)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment choisir la méthode d'enseignement adaptée à un contenu ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer méthode, technique et procédé. Connaître les grandes méthodes didactiques. Choisir une méthode en fonction du contenu.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Trois niveaux</div>
<ul>
<li><strong>Méthode :</strong> ensemble organisé de démarches visant un apprentissage (méthode expositive, active, différenciée).</li>
<li><strong>Technique :</strong> manière concrète d'appliquer une méthode (exposé, travail de groupe, étude de cas, jeu de rôle).</li>
<li><strong>Procédé :</strong> geste pédagogique précis (poser une question, faire reformuler, utiliser un exemple).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Quelques méthodes</div>
<ul>
<li><strong>Méthode expositive (magistrale) :</strong> le maître expose, l'élève écoute. Utile pour introduire un contenu nouveau, mais insuffisante pour faire apprendre.</li>
<li><strong>Méthode interrogative :</strong> le maître questionne, l'élève répond. Favorise la réflexion.</li>
<li><strong>Méthode active :</strong> l'élève agit, cherche, construit. Favorise l'engagement.</li>
<li><strong>Méthode différenciée :</strong> adapte les contenus et les activités aux besoins des élèves.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Choisir une méthode</div>
<p>Le choix dépend :</p>
<ul>
<li>du contenu (un concept complexe vs un automatisme) ;</li>
<li>du niveau des élèves ;</li>
<li>des effectifs (méthode active en grands groupes : travail en sous-groupes) ;</li>
<li>du temps disponible ;</li>
<li>des ressources matérielles.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Distingue méthode, technique et procédé par un exemple.</p>
<p><strong>Ex. 2 :</strong> Propose une méthode adaptée à l'enseignement de l'accord sujet-verbe en classe de 80 élèves.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Méthode : active ; technique : travail de groupe ; procédé : faire reformuler une règle. <strong>2)</strong> Méthode active combinée à la méthode interrogative : travail en sous-groupes sur des phrases à corriger, puis mise en commun.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Méthode, technique et procédé sont complémentaires : la méthode fixe la démarche, la technique la concrétise, le procédé l'ajuste.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles 3e HPR.</div>
    `
},
{
    title: "Leçon 5 — La situation d'enseignement-apprentissage",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Que se passe-t-il réellement dans une salle de classe ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les composantes de la situation d'enseignement-apprentissage. Comprendre les relations entre elles. Anticiper les obstacles.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les composantes</div>
<ul>
<li><strong>L'élève :</strong> sujet qui apprend, avec ses acquis, sa motivation, son état affectif.</li>
<li><strong>L'enseignant :</strong> médiateur, organisateur, évaluateur.</li>
<li><strong>Le savoir :</strong> contenu à enseigner, structuré par le programme.</li>

<li>Un <strong>verbe d'action</strong> observable (identifier, calculer, rédiger).</li>
<li>Une <strong>condition</strong> (à partir d'un texte, sans aide, en groupe).</li>
<li>Un <strong>critère de réussite</strong> (au moins trois exemples, sans erreur, en dix minutes).</li>

        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
