    content: `
      <div class="bloc cas">
        <div class="bloc-label">Situation de départ</div>
        <p>Dans un atelier de fabrication métallique de Kinshasa, un apprenti se blesse en manipulant une tôle sans gants, parce qu'il n'avait jamais reçu de briefing sécurité. C'est un accident évitable. La sécurité industrielle vise à prévenir ces situations.</p>

      <h3>Qu'est-ce qu'un accident du travail ?</h3>
      <p>Un événement imprévu qui provoque une lésion ou un dommage pendant le travail (ou sur le trajet). Il peut toucher les personnes (blessures, maladies), les biens (matériel, bâtiment), l'environnement.</p>
      <h3>Conséquences</h3>
      <ul>
        <li><strong>Humaines</strong> : blessures, invalidité, décès.</li>

      <p>Plutôt que de réagir après l'accident, la sécurité industrielle vise à <strong>anticiper</strong> : identifier les risques, former les travailleurs, mettre en place des protections, faire respecter les consignes.</p>

        <div class="bloc-label">À retenir</div>

      <ul>
        <li><strong>Coupures</strong> par arêtes vives, lames, outils.</li>
        <li><strong>Écrasement</strong> par pièce en mouvement, presse, machine.</li>

      <h3>Prévention mécanique</h3>
      <ul>
        <li>Protecteurs et carters en place.</li>
        <li>Consignation avant intervention (arrêt + cadenas + vérification).</li>
        <li>Vêtements ajustés, pas de bijoux, cheveux attachés.</li>
        <li>Balisage des zones dangereuses.</li>
      </ul>
      <h3>Risques électriques</h3>
      <ul>
        <li><strong>Contact direct</strong> : toucher une pièce normalement sous tension.</li>
        <li><strong>Contact indirect</strong> : toucher une masse métallique mise accidentellement sous tension.</li>
        <li><strong>Arc électrique</strong> : projection de particules, brûlures.</li>

      <h3>Prévention électrique</h3>
      <ul>
        <li>Consignation (séparer, condamner, vérifier l'absence de tension, mettre à la terre).</li>

        <li>Câbles en bon état, prises protégées.</li>
        <li>Jamais d'intervention sur une installation sous tension non encadrée.</li>
      </ul>
      <div class="bloc resume">
        <div class="bloc-label">À retenir</div>
        <p>Risques mécaniques et électriques sont partout en atelier. La prévention repose sur les protecteurs, la consignation et les EPI.</p>
    `

      <h3>Le triangle du feu</h3>
      <p>Pour qu'un feu existe et se maintienne, il faut <strong>trois</strong> éléments réunis :</p>
      <ol>
        <li><strong>Combustible</strong> : ce qui brûle (bois, papier, essence, gaz).</li>

      </ol>
      <p>Supprimer un des trois coupe le feu. On ajoute parfois le <em>tétraèdre du feu</em> (quatrième côté : réaction en chaîne).</p>
      <h3>Classes de feux</h3>
      <ul>
        <li><strong>Classe A</strong> : feux de solides (bois, papier, tissu).</li>

        <li><strong>Classe C</strong> : feux de gaz (méthane, butane, propane).</li>

        <li><strong>Classe F</strong> (ou K) : feux d'huiles de cuisson.</li>

      <h3>Extincteurs adaptés</h3>

parce qu'il n'avait jamais reçu de briefing sécurité. C'est un accident évitable. La sécurité industrielle vise à prévenir ces situations. Qu'est-ce qu'un accident du travail? Un événement imprévu qui provoque une lésion ou un dommage pendant le travail (ou sur le trajet). Il peut toucher les personnes (blessures, maladies), les biens (matériel, bâtiment), l'environnement. Conséquences. Humaines: blessures, invalidité, décès. Économiques: arrêt de production, réparations, amendes. Sociales: familles, ambiance de travail. Juridiques: responsabilité de l'employeur. La prévention. Plutôt que de réagir après l'accident, la sécurité industrielle vise à anticiper: identifier les risques, former les travailleurs, mettre en place des protections, faire respecter les consignes. À retenir. Un accident a des causes identifiables. La prévention consiste à agir AVANT pour éviter l'accident. C'est l'affaire de tous."]],"3":[["fr","Leçon 2, Risques mécaniques et électriques. Risques mécaniques. Coupures par arêtes vives, lames, outils. Écrasement par pièce en mouvement, presse, machine. Entraînement par pièces en rotation (broche, courroie, mandrin). Projections de copeaux, particules. Chute d'objets (pièces, outils). Prévention mécanique. Protecteurs et carters en place. Consignation avant intervention (arrêt plus cadenas plus vérification). Vêtements ajustés, pas de bijoux, cheveux attachés. Balisage des zones dangereuses. Risques électriques. Contact direct: toucher une pièce normalement sous tension. Contact indirect: toucher une masse métallique mise accidentellement sous tension. Arc électrique: projection de particules, brûlures. Prévention électrique. Consignation (séparer, condamner, vérifier l'absence de tension, mettre à la terre). EPI isolants adaptés, VAT. Câbles en bon état, prises protégées. Jamais d'intervention sur une installation sous tension non encadrée. À retenir. Risques mécaniques et électriques sont partout en atelier. La prévention repose sur les protecteurs, la consignation et les EPI."]],"4":[["fr","Leçon 3, Risques chimiques et FDS. Risques chimiques. Toxicité par inhalation, ingestion ou contact cutané. Corrosivité: brûlures chimiques (acides, bases). Inflammabilité: certains solvants, alcools. Réactivité: mélanges dangereux. Pictogrammes de danger. Image de référence: SI3_IMG03, pictogrammes de danger normalisés. Flammes (produits inflammables). Tête de mort (toxique). Corrosion (brûlure chimique). Point d'exclamation (irritant). Environnement (dangereux pour le milieu aquatique). Fiche de Données de Sécurité (FDS). Document obligatoire pour chaque produit chimique. Sections clés: Identification du produit et du fabricant. Dangers (H-phrases). Premiers secours. Manipulation et stockage. Équipements de protection à utiliser. Élimination des déchets. Bonnes pratiques. Lire la FDS avant toute manipulation. Travailler sous ventilation, porter des gants et lunettes. Ne jamais transvaser sans étiquette claire. À retenir. Les produits chimiques exigent une lecture préalable de la FDS et des pictogrammes. La prévention passe par la ventilation et les EPI."]],"5":[["fr","Leçon 4, Le feu et les extincteurs (1 sur 2). Le triangle du feu. Pour qu'un feu existe et se maintienne, il faut trois éléments réunis: Combustible: ce qui brûle (bois, papier, essence, gaz). Comburant: l'oxygène de l'air. Énergie d'activation: une flamme, une étincelle, une surface chaude. Supprimer un des trois coupe le feu. On ajoute parfois le tétraèdre du feu (quatrième côté: réaction en chaîne). Classes de feux. Classe A: feux de solides (bois, papier, tissu). Classe B: feux de liquides (essence, huile, alcool). Classe C: feux de gaz (méthane, butane, propane). Classe D: feux de métaux (sodium, magnésium). Classe F (ou K): feux d'huiles de cuisson. Extincteurs adaptés. Eau pulvérisée: classes A. Poudre ABC: classes A, B, C. C O2: classes B, feux électriques. Extincteur spécial D: métaux."]],"6":[["fr","Leçon 4, Utilisation d'un extincteur (2 sur 2). Règle P.A.S.S. Pull (tirer la goupille). Aim (viser la base des flammes). Squeeze (presser la poignée). Sweep (balayer de gauche à droite). Précautions. Ne jamais tourner le dos au feu. Se placer entre le feu et la sortie. Vérifier la pression de l'extincteur (manomètre). Extincteur sur roues pour grands feux. Un extincteur vide ne sert plus: le faire recharger. Ce qu'il ne faut pas faire. Éteindre un feu d'huile de cuisson avec de l'eau. Éteindre un feu électrique à l'eau. Ouvrir une porte chaude sans précaution. À retenir. Le triangle du feu explique comment éteindre. Chaque classe de feu a son extincteur. La règle P.A.S.S. structure le geste."]],"7":[["fr","Leçon 5, Les EPI. Les principaux EPI. Image de référence: SI3_IMG01, tableau des EPI et des risques associés. Casque: chutes d'objets, chocs en hauteur. Lunettes ou écran facial: projections, rayonnements. Gants: coupures, brûlures, produits chimiques (adapter le type au risque). Chaussures de sécurité: chutes d'objets, écrasements, glissades. Protections auditives: bruit intense. Masques: poussières, vapeurs, particules. Harnais: travail en hauteur. Limites des EPI. Un EPI ne supprime pas le risque: il le réduit. Il faut d'abord agir sur la source du danger (protecteurs, ventilation, automatisation), puis sur l'organisation (formations, procédures), et seulement ensuite sur l'EPI. Bon usage. Port systématique dans les zones indiquées. Vérification de l'état (gants troués, écran rayé à changer). Formation à l'utilisation. À retenir. Les EPI sont la dernière barrière de protection. Leur choix doit correspondre au risque; leur port doit être systématique."]],"8":[["fr","Leçon 6, Procédures d'urgence et évacuation. En cas d'accident. Protéger: sécuriser la zone, éviter le suraccident. Alerter: appeler les secours internes (chef, infirmier) et externes si nécessaire (pompiers, ambulance). Secourir: premiers gestes, sans se mettre en danger. Mémorisation: P.A.S. (Protéger, Alerter, Secourir). Évacuation. Connaître les issues de secours et les points de rassemblement. Suivre les consignes des responsables d'évacuation. Ne pas revenir en arrière. Fermer les portes sans les verrouiller. Ne pas utiliser l'ascenseur en cas d'incendie. Signaux d'alarme. Alarme sonore continue: évacuation. Alarme intermittente: alerte (vérifier). Signal verbal: suivre les instructions. Formation. Les exercices d'évacuation réguliers permettent de tester les procédures et de former les personnes. À retenir. La procédure P.A.S. et les exercices d'évacuation réguliers sauvent des vies. Chacun doit connaître les issues de secours de son lieu de travail."]],"9":[["fr","Leçon 7, Analyse d'un accident. Modèle de la chaîne des défaillances. Un accident résulte rarement d'une cause unique. C'est l'aboutissement d'une chaîne d'événements et de failles, qui finissent par converger (image du fromage suisse: chaque faille est un trou dans une tranche, et si les trous s'alignent, l'accident survient). Image de référence: SI3_IMG02, schéma de la chaîne des défaillances. Types de causes. Causes techniques: défaillance d'un équipement, pièce usée. Causes humaines: erreur, oubli, non-respect d'une consigne. Causes organisationnelles: absence de formation, procédures inexistantes, planning trop serré. Reconstituer la chaîne. Partir du dommage final (blessure, dégât). Remonter à l'événement déclencheur. Identifier les causes amont (formation, procédure, état du matériel). Proposer des actions préventives. Étude de cas, accident évitable. Un opérateur utilise une meuleuse sans carter, sans lunettes, et l'outil n'a pas été vérifié depuis des mois. Une projection de métal atteint son œil. Chaîne: absence d'entretien (technique) plus non-respect de la consigne (humaine) plus absence de contrôle (organisationnelle). Mesures préventives: vérification régulière des outils, formation, sanctions en cas de non-port des EPI."]],"10":[["fr","Leçon 8, Atelier: évacuation et extincteur. Activités encadrées. Simulation d'évacuation (sortie rapide et ordonnée vers un point de rassemblement). Manipulation d'un extincteur (même périmé): mémorisation de la règle P.A.S.S. Repérage des pictogrammes et panneaux de sécurité dans l'établissement. Lecture et interprétation d'une FDS simplifiée. Consignes. Aucune simulation ne doit provoquer de bousculade ni de panique. La manipulation d'extincteur se fait en extérieur, sous surveillance. Ne jamais diriger un extincteur vers une personne, même avec un extincteur vide. En cas d'absence d'équipement, privilégier la vidéo et les exercices de mémorisation."]],"11":[["fr","Leçon 9, Synthèse. Récapitulatif. La sécurité est l'affaire de tous: direction, encadrement, opérateurs. Les risques sont identifiables: mécanique, électrique, chimique, incendie, chute. Le triangle du feu guide la lutte contre l'incendie. Chaque classe de feu a son extincteur. Les EPI sont la dernière barrière, pas la seule. P.A.S. sauve: Protéger, Alerter, Secourir. Analyser un accident, c'est remonter la chaîne des défaillances et proposer des actions. Ouverture. En 4e année, ces fondamentaux seront approfondis: analyse de risques, audits, gestion de crise, documentation QHSE. La 3e année pose les réflexes qui sauvent."]],"12":[["fr","Sources et références documentaires."]],"13":[["fr","Évaluation finale, Sécurité Industrielle. Répondez aux questions ci-dessous. Une seule réponse est correcte par question."]]}};

          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
