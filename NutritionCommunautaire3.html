<script>
const COURSE_TITLE = "Nutrition Communautaire";
const slides = [
{
    title: "Sommaire — Nutrition Communautaire 3e année",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours initie à la nutrition communautaire : notions de base, problèmes nutritionnels en RDC, acteurs de la nutrition communautaire, diagnostic nutritionnel, sensibilisation et éducation, valorisation des aliments locaux, suivi et évaluation d'une action, atelier projet.</p>
<p><strong>Note de transparence :</strong> le cours s'appuie sur le volet « nutrition communautaire simplifiée » des fiches pédagogiques officielles de Nutrition Générale 3e année, option Nutrition (Édition 2025). Ce volet est attesté, mais il n'existe pas de programme autonome intitulé « Nutrition Communautaire » pour la 3e année ; le découpage proposé ici isole ce volet pour en faire un cours autonome, à valider par l'enseignant. Aucune prescription médicale n'est présentée : l'élève apprend à identifier, sensibiliser, orienter.</p>
<ul>
<li>Leçon 1 — Qu'est-ce que la nutrition communautaire ?</li>
<li>Leçon 2 — Les problèmes nutritionnels en RDC</li>
<li>Leçon 3 — Les acteurs de la nutrition communautaire</li>
<li>Leçon 4 — Le diagnostic nutritionnel communautaire</li>
<li>Leçon 5 — La sensibilisation et l'éducation nutritionnelle</li>
<li>Leçon 6 — Valoriser les aliments locaux</li>
<li>Leçon 7 — Le suivi et l'évaluation d'une action</li>
<li>Leçon 8 — Atelier projet et évaluation</li>
</ul>
<p>Une évaluation finale de 15 questions porte sur les notions clés ; l'essentiel de l'évaluation reste la pratique.</p>
</div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques Nutrition Générale 3e année (Édition 2025) — volet nutrition communautaire simplifiée ; cadre contextuel PRONANUT / NAC (Nutrition à Assise Communautaire, Ministère de la Santé RDC).</div>
    `
},
{
    title: "Leçon 1 — Qu'est-ce que la nutrition communautaire ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi la malnutrition touche-t-elle davantage certaines communautés que d'autres ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la nutrition communautaire. La distinguer de la nutrition individuelle. Situer son rôle dans la santé publique.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>La <strong>nutrition communautaire</strong> est l'ensemble des actions qui visent à améliorer l'état nutritionnel d'une population, en agissant sur son environnement alimentaire, ses pratiques, son accès aux soins et son hygiène. Elle se pratique <em>avec</em> la communauté, non seulement <em>pour</em> elle.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Nutrition communautaire et nutrition individuelle</div>
<ul>
<li><strong>Nutrition individuelle (diététique) :</strong> adapter l'alimentation à une personne (âge, état physiologique, maladie).</li>
<li><strong>Nutrition communautaire :</strong> agir sur un groupe (quartier, village, école) pour améliorer la situation nutritionnelle collective.</li>
</ul>
<p>Les deux approches se complètent : une communauté bien nourrie est composée d'individus bien nourris.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Son rôle</div>
<ul>
<li>Prévenir la malnutrition.</li>
<li>Promouvoir une alimentation équilibrée à base d'aliments locaux.</li>
<li>Sensibiliser aux bonnes pratiques (allaitement, diversification, hygiène).</li>
<li>Orienter vers les structures de santé.</li>
<li>Renforcer la résilience alimentaire.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis la nutrition communautaire.</p>
<p><strong>Ex. 2 :</strong> Distingue nutrition communautaire et nutrition individuelle.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Actions visant l'amélioration nutritionnelle d'une population, avec sa participation. <strong>2)</strong> Individuelle : adapter à une personne ; communautaire : agir sur un groupe.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La nutrition communautaire agit sur l'environnement alimentaire d'un groupe, avec sa participation.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches Nutrition Générale 3e ; cadre PRONANUT / NAC.</div>
    `
},
{
    title: "Leçon 2 — Les problèmes nutritionnels en RDC",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un enfant peut-il être à la fois trop maigre et carencé en plusieurs nutriments ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les grandes formes de malnutrition. Comprendre leurs causes multiples. Situer les carences majeures en RDC.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les formes de malnutrition</div>
<ul>
<li><strong>Malnutrition aiguë :</strong> perte de poids rapide (kwashiorkor, marasme).</li>
<li><strong>Malnutrition chronique :</strong> retard de croissance (petite taille pour l'âge).</li>
<li><strong>Insuffisance pondérale :</strong> poids insuffisant pour l'âge.</li>
<li><strong>Carences en micronutriments :</strong> fer (anémie), vitamine A (vision, immunité), iode (thyroïde, développement).</li>
<li><strong>Surpoids et obésité :</strong> déséquilibre alimentaire, en milieu urbain notamment.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Causes multiples</div>
<ul>
<li><strong>Accès insuffisant</strong> à une alimentation variée et suffisante.</li>
<li><strong>Pauvreté</strong> et pouvoir d'achat limité.</li>
<li><strong>Pratiques alimentaires</strong> inadaptées (sevrage précoce, diversification tardive).</li>
<li><strong>Hygiène</strong> insuffisante (diarrhées à répétition).</li>
<li><strong>Accès aux soins</strong> limité.</li>
<li><strong>Conflits, déplacements,</strong> insécurité.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Distingue malnutrition aiguë et malnutrition chronique.</p>
<p><strong>Ex. 2 :</strong> Cite trois causes possibles de malnutrition.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Aiguë : perte de poids rapide ; chronique : retard de croissance. <strong>2)</strong> Pauvreté, pratiques alimentaires, hygiène.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La malnutrition est multiple dans ses formes et dans ses causes : elle ne se réduit pas au manque de nourriture.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches Nutrition Générale 3e ; cadre PRONANUT.</div>
    `
},
{
    title: "Leçon 3 — Les acteurs de la nutrition communautaire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi les relais communautaires sont-ils un maillon essentiel des programmes de nutrition ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les acteurs. Comprendre le rôle des relais communautaires. Situer les structures de santé.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les acteurs</div>
<ul>
<li><strong>Structures de santé :</strong> centres de santé, hôpitaux, programmes spécialisés.</li>
<li><strong>Relais communautaires :</strong> membres de la communauté formés pour sensibiliser, dépister et orienter.</li>
<li><strong>Autorités locales :</strong> appui à la mobilisation.</li>
<li><strong>Écoles :</strong> éducation nutritionnelle des enfants.</li>
<li><strong>ONG et partenaires :</strong> appui technique et financier.</li>
<li><strong>Familles :</strong> premières actrices de la nutrition de leurs membres.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le rôle des relais</div>
<ul>
<li>Informer et sensibiliser.</li>
<li>Repérer les signes d'alerte (amaigrissement, œdèmes, pâleur).</li>
<li>Orienter vers les centres de santé.</li>
<li>Accompagner les familles dans les bonnes pratiques.</li>
</ul>
<p>Les relais ne posent pas de diagnostic : ils orientent.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois acteurs de la nutrition communautaire.</p>
<p><strong>Ex. 2 :</strong> Cite deux rôles des relais communautaires.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Structures de santé, relais, familles. <strong>2)</strong> Sensibilisation, orientation.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La nutrition communautaire mobilise de nombreux acteurs ; les relais font le lien avec les structures de santé.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches Nutrition Générale 3e ; cadre NAC.</div>
    `
},
{
    title: "Leçon 4 — Le diagnostic nutritionnel communautaire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment savoir quels sont les problèmes nutritionnels prioritaires d'un quartier ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre l'utilité du diagnostic. Identifier les outils. Repérer les groupes vulnérables.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Objectif du diagnostic</div>
<p>Le <strong>diagnostic nutritionnel communautaire</strong> permet de repérer :</p>
<ul>
<li>les problèmes dominants (malnutrition aiguë, anémie, carence en vitamine A, etc.) ;</li>
<li>les groupes les plus touchés ;</li>
<li>les causes locales (pratiques, accès, hygiène) ;</li>
<li>les ressources disponibles.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les outils</div>
<ul>
<li><strong>Entretiens</strong> avec les familles et les acteurs locaux.</li>
<li><strong>Observation</strong> des pratiques (repas, hygiène).</li>
<li><strong>Mesures anthropométriques simples</strong> (poids, taille, périmètre brachial) réalisées avec l'appui du centre de santé.</li>
<li><strong>Analyse des aliments disponibles</strong> localement.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Groupes vulnérables</div>
<ul>
<li>Enfants de moins de 5 ans, surtout de 6 à 24 mois.</li>
<li>Femmes enceintes et allaitantes.</li>
<li>Personnes âgées.</li>
<li>Personnes malades ou immunodéprimées.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois outils du diagnostic communautaire.</p>
<p><strong>Ex. 2 :</strong> Cite trois groupes vulnérables.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Entretiens, observation, mesures anthropométriques. <strong>2)</strong> Enfants <5 ans, femmes enceintes/allaitantes, personnes âgées.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un diagnostic bien conduit identifie les problèmes prioritaires et les groupes à cibler.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches Nutrition Générale 3e.</div>
    `
},
{
    title: "Leçon 5 — La sensibilisation et l'éducation nutritionnelle",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une affiche seule ne suffit-elle pas à changer les pratiques alimentaires ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les principes de l'éducation nutritionnelle. Identifier les messages clés. Concevoir une action adaptée.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Principes</div>
<ul>
<li><strong>Messages simples</strong> et adaptés au public.</li>
<li><strong>Langue locale</strong> comprise par le public.</li>
<li><strong>Participation active</strong> (échanges, démonstrations).</li>
<li><strong>Répétition</strong> (les pratiques changent lentement).</li>
<li><strong>Respect des cultures alimentaires</strong> locales.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Messages clés</div>
<ul>
<li><strong>Allaitement maternel exclusif</strong> jusqu'à 6 mois.</li>
<li><strong>Diversification alimentaire</strong> à partir de 6 mois, avec des aliments locaux variés.</li>
<li><strong>Lavage des mains</strong> au savon avant les repas et après les toilettes.</li>
<li><strong>Utilisation d'eau potable.</strong></li>
<li><strong>Alimentation variée</strong> pour toute la famille.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Canaux de communication</div>
<ul>
<li>Relais communautaires (porte-à-porte, réunions).</li>
<li>Écoles (élèves relais).</li>
<li>Marchés et lieux de rassemblement.</li>
<li>Radios locales.</li>
<li>Centres de santé.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois messages clés de l'éducation nutritionnelle.</p>
<p><strong>Ex. 2 :</strong> Propose un canal adapté pour sensibiliser les mamans d'un quartier.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Allaitement exclusif, diversification à 6 mois, lavage des mains. <strong>2)</strong> Réunions de quartier, relais, radio locale.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une sensibilisation efficace s'appuie sur des messages simples, la langue locale et la participation.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches Nutrition Générale 3e.</div>
    `
},
{
    title: "Leçon 6 — Valoriser les aliments locaux",

  var DL = '<svg viewBox="0 0 24 24"><path d="M11 3h2v9.2l3.6-3.6L18 10l-6 6-6-6 1.4-1.4L11 12.2V3zM5 19h14v2H5z"/></svg>';
  var OK = '<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';
  try {
    if (typeof questions !== "undefined" && questions && questions.forEach) {
      questions.forEach(function (q) {
        if (!q.options) q.options = q.opts || q.choices || q.choix || q.reponses || q.propositions || [];
        if (q.text === undefined) q.text = q.question || q.q || q.enonce || q.titre || "";
        if (typeof q.correct === "undefined") {

          else if (typeof q.reponse !== "undefined") q.correct = q.reponse;
        }

    }
  } catch (e) {}
  var synth = window.speechSynthesis || null;
  var HAS_CACHE = !!(window.caches && window.caches.open);
  var NATIVE = false;
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  var LATER = "ecolia_audio_later_" + CFG.code;
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function init() {
    if (document.getElementById("ecolia-audio-btn")) return;
    var btn = document.createElement("button");
    btn.id = "ecolia-audio-btn"; btn.type = "button"; btn.className = "ecolia-off";
    btn.setAttribute("aria-label", "Écouter la leçon"); btn.innerHTML = PLAY;
    var dlBtn = document.createElement("button");
    dlBtn.id = "ecolia-dl-btn"; dlBtn.type = "button"; dlBtn.className = "ecolia-off";
    dlBtn.innerHTML = DL;
    var host = document.querySelector(".header-right");
    if (host) { host.insertBefore(dlBtn, host.firstChild); host.insertBefore(btn, dlBtn); }
    else { btn.className += " ecolia-fixed"; document.body.appendChild(btn); }
    var banner = document.createElement("div");
    banner.id = "ecolia-audio-banner";
    banner.innerHTML = '<span class="eab-txt"></span><span class="eab-act"></span><div class="eab-bar"><i></i></div>';
    var content = document.getElementById("content");
    if (content && content.parentNode) content.parentNode.insertBefore(banner, content);
    else document.body.insertBefore(banner, document.body.firstChild);
    var txtEl = banner.querySelector(".eab-txt"), actEl = banner.querySelector(".eab-act");
    var barEl = banner.querySelector(".eab-bar"), barI = barEl.firstChild;
    var audio = new Audio();
    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }
    function cur() { try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {} return 0; }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {

          var exp = CFG.sizes && CFG.sizes[String(n)];

      }

        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {

            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();

            }

        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);

            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });

    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);

    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }

  else init();
})();
