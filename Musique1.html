    title: "Leçon 1 — Les paramètres du son et l'écoute musicale",

        <div class="bloc-cas">
            <h3>Situation de départ</h3>

            <p>Tout son peut être décrit par quatre <strong>paramètres</strong> :</p>
            <ul>
                <li><strong>hauteur :</strong> grave ou aigu ;</li>
                <li><strong>durée :</strong> long ou court ;</li>
                <li><strong>intensité :</strong> fort ou faible ;</li>
                <li><strong>timbre :</strong> couleur du son, qui permet de reconnaître la source (voix, instrument).</li>
            </ul>
            <p>Apprendre à écouter est la première étape de la musique. L'<strong>écoute active</strong> consiste à prêter attention à chacun de ces paramètres.</p>

            <figure class="bloc-image" data-image-id="Musique1_L1_01">

                <li><strong>Durée :</strong> longueur du son dans le temps.</li>
                <li><strong>Intensité :</strong> volume du son (fort ou faible).</li>
                <li><strong>Timbre :</strong> couleur du son, liée à sa source.</li>

            <p>Un groupe de danseurs et un batteur jouent ensemble. Comment restent-ils synchronisés ? Qu'est-ce qui structure leur jeu ?</p>

            <p>Le <strong>rythme</strong> est l'organisation des durées. La <strong>pulsation</strong> est le battement régulier de base ; la <strong>mesure</strong> regroupe les pulsations (4/4, 3/4, 2/4). Les figures de notes indiquent la durée relative :</p>
            <ul>
                <li><strong>ronde :</strong> quatre temps ;</li>
                <li><strong>blanche :</strong> deux temps ;</li>
                <li><strong>noire :</strong> un temps ;</li>
                <li><strong>silence :</strong> absence de son pendant une durée.</li>
            </ul>
            <p>Lire un rythme, c'est frapper ou compter ces durées.</p>

            <figure class="bloc-image" data-image-id="Musique1_L2_01">

                <figcaption>Chaque figure de note indique une durée précise.</figcaption>
            </figure>

            <h3>Notions et définitions</h3>
            <ul>
                <li><strong>Pulsation :</strong> battement régulier de base.</li>
                <li><strong>Mesure :</strong> regroupement de pulsations.</li>
                <li><strong>Valeur de note :</strong> durée relative d'une note.</li>
                <li><strong>Ronde :</strong> note qui dure quatre temps.</li>
                <li><strong>Blanche :</strong> note qui dure deux temps.</li>
                <li><strong>Noire :</strong> note qui dure un temps.</li>

        <div class="bloc-cas">
            <h3>Situation de départ</h3>
            <p>Un professeur écrit des signes sur cinq lignes au tableau. Les élèves ne comprennent pas. Que signifient ces lignes et ces points ?</p>

            <p>La <strong>portée</strong> est le support de l'écriture musicale : cinq lignes et quatre interlignes. La <strong>clé de sol</strong> indique la position des notes. Chaque ligne et chaque interligne correspond à une note.</p>
            <p>La <strong>gamme</strong> de do est composée de sept notes : do, ré, mi, fa, sol, la, si. Lire une mélodie, c'est suivre les notes de gauche à droite et reproduire leurs hauteurs.</p>

            <figure class="bloc-image" data-image-id="Musique1_L3_01">
                <div class="image-cadre">[ Image Musique1_L3_01 : portée avec clé de sol et gamme de do ]</div>
                <figcaption>La portée et la clé de sol fixent les hauteurs.</figcaption>
            </figure>

            <h3>Notions et définitions</h3>
            <ul>
                <li><strong>Portée :</strong> ensemble de cinq lignes pour écrire la musique.</li>
                <li><strong>Clé de sol :</strong> signe qui indique la position des notes.</li>

    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');

  var CFG = {"code":"Musique1","base":"audio_files/","available":[1,2,3,4,5,6,7],"count":7,"sizeMo":9,"sizes":{"1":1795392,"2":1245504,"3":1206144,"4":1183296,"5":1024128,"6":1477632,"7":115968},"fallback":{"1":[["fr","Sommaire, Musique et Solfège. Présentation générale du cours. Titre: Musique et Solfège, initiation à la lecture musicale et à la pratique vocale. Niveau ou domaine: 1re année, domaine artistique. Note de positionnement. Un programme national de musique pour l'enseignement secondaire existe (cycle d'orientation), et des fiches d'Éducation Musicale et Théâtrale de 1re année Pédagogie Générale ont été identifiées. Ces fiches ciblent la formation d'enseignants. Ce cours est une initiation adaptée au niveau 1re générale: il se concentre sur les fondamentaux accessibles (rythme, hauteur, lecture de notes, chant) et exclut la formation didactique avancée (transposition, direction de chœur). Objectifs généraux. Comprendre les paramètres du son (hauteur, durée, intensité, timbre). Lire et écrire des rythmes simples. Lire les notes sur une portée. Chanter en groupe. Découvrir le patrimoine musical congolais. Compétences visées. Distinguer les paramètres du son. Frapper un rythme simple. Lire une portée en clé de sol. Reproduire une mélodie simple. Reconnaître des instruments traditionnels congolais. Participer à un chant collectif. Organisation des leçons. Leçon 1: Les paramètres du son et l'écoute musicale. Leçon 2: Le rythme: pulsation, mesure et valeurs de notes. Leçon 3: La hauteur et la portée: lire les notes. Leçon 4: La pratique vocale: chanter ensemble. Leçon 5: Le patrimoine musical congolais: instruments et styles. Évaluation finale: 36 questions à choix multiple. Prérequis: aucun prérequis technique; une oreille attentive et l'envie de pratiquer. Contextualisation R D C. Rumba congolaise, musique traditionnelle (likembé, tam-tam, maracas), chants scolaires et patriotiques, festivals et pratique chorale dans les écoles. Limites documentaires. Le programme national de musique existe mais n'a pas été consulté dans son intégralité. Les fiches de 1re Pédagogie Générale ciblent la formation d'enseignants. L'adaptation au niveau 1re générale est une sélection de contenus accessibles. Plan d'images du cours. Identifiant. Leçon. Contenu visuel. Utilité. Emplacement. Musique1_L1_01. L1. Schéma des quatre paramètres du son. Notions de base. Slide 1, bloc théorie. Musique1_L2_01. L2. Valeurs de notes (ronde, blanche, noire). Rythme. Slide 2, bloc exercice. Musique1_L3_01. L3. Portée avec clé de sol et gamme. Lecture. Slide 3, bloc théorie. Musique1_L4_01. L4. Chorale ou groupe chantant à l'unisson. Pratique vocale. Slide 4, bloc cas. Musique1_L5_01. L5. Instruments traditionnels (likembé, tam-tam, maracas). Patrimoine. Slide 5, bloc théorie. Identifiants stables et cohérents avec le HTML."]],"2":[["fr","Leçon 1, Les paramètres du son et l'écoute musicale. Situation de départ. Dans la cour, on entend un tam-tam au loin, une voix qui chante et un sifflet. Comment décrire ces sons? Sont-ils tous pareils? Objectifs spécifiques. Distinguer les quatre paramètres du son. Exercer son écoute. Identifier des sources sonores de l'environnement. Explication. Tout son peut être décrit par quatre paramètres: hauteur: grave ou aigu; durée: long ou court; intensité: fort ou faible; timbre: couleur du son, qui permet de reconnaître la source (voix, instrument). Apprendre à écouter est la première étape de la musique. L'écoute active consiste à prêter attention à chacun de ces paramètres. [ Image Musique1_L1_01: schéma des quatre paramètres du son ]. Quatre paramètres décrivent tout son. Notions et définitions. Hauteur: caractère grave ou aigu d'un son. Durée: longueur du son dans le temps. Intensité: volume du son (fort ou faible). Timbre: couleur du son, liée à sa source. Écoute active: attention portée aux paramètres du son. Exemples concrets. Voix grave d'un chanteur de rumba. Tam-tam à son grave et puissant. Sifflet aigu et bref. Likembé au timbre caractéristique. Exercice d'application. Écoute trois sons (voix, instrument, bruit). Décris chacun avec les quatre paramètres. Produis un son grave et un son aigu avec ta voix. Corrigé. 1. Réponse libre. 2. On vérifie que l'élève utilise les quatre termes: hauteur, durée, intensité, timbre. 3. On vérifie que le son grave est effectivement plus bas et le son aigu plus haut. À retenir. Les paramètres du son sont les briques de toute musique. L'écoute précède la pratique. Quatre mots suffisent pour décrire un son: hauteur, durée, intensité, timbre. Sources utiles. Programme national de musique (cycle d'orientation), document pédagogique R D C. Fiches d'Éducation Musicale et Théâtrale, 1re Pédagogie Générale (Édition 2025). Limite: ces fiches ciblent la formation d'enseignants; l'adaptation en 1re générale est une simplification."]],"3":[["fr","Leçon 2, Le rythme: pulsation, mesure et valeurs de notes. Situation de départ. Un groupe de danseurs et un batteur jouent ensemble. Comment restent-ils synchronisés? Qu'est-ce qui structure leur jeu? Objectifs spécifiques. Comprendre la pulsation et la mesure. Lire les valeurs de notes de base (ronde, blanche, noire). Frapper un rythme simple. Explication. Le rythme est l'organisation des durées. La pulsation est le battement régulier de base; la mesure regroupe les pulsations (4 sur 4, 3 sur 4, 2 sur 4). Les figures de notes indiquent la durée relative: ronde: quatre temps; blanche: deux temps; noire: un temps; silence: absence de son pendant une durée. Lire un rythme, c'est frapper ou compter ces durées. [ Image Musique1_L2_01: valeurs de notes (ronde, blanche, noire) ]. Chaque figure de note indique une durée précise. Notions et définitions. Pulsation: battement régulier de base. Mesure: regroupement de pulsations. Valeur de note: durée relative d'une note. Ronde: note qui dure quatre temps. Blanche: note qui dure deux temps. Noire: note qui dure un temps. Silence: absence de son pendant une durée. Exemples concrets. Rythmes de tam-tam. Pulsation régulière d'une chanson de rumba. Battements de mains dans un chant scolaire. Exercice d'application. Frapper une pulsation régulière. Lire et frapper une cellule rythmique simple (noire, noire, blanche). Compter les temps d'une mesure à 4 sur 4. Corrigé. 1. On vérifie la régularité du battement. 2. La cellule noire-noire-blanche doit être frappée: un temps, un temps, deux temps. 3. La mesure à 4 sur 4 contient quatre temps. À retenir. Le rythme structure la musique. La lecture des valeurs de notes permet de reproduire un rythme. La pulsation est le battement de base. Sources utiles. Programme national de musique (cycle d'orientation). Manuels de solfège de base. Limite: l'adaptation en 1re est une simplification."]],"4":[["fr","Leçon 3, La hauteur et la portée: lire les notes. Situation de départ. Un professeur écrit des signes sur cinq lignes au tableau. Les élèves ne comprennent pas. Que signifient ces lignes et ces points? Objectifs spécifiques. Comprendre la portée et la clé de sol. Nommer les notes (do, ré, mi, fa, sol, la, si). Lire une mélodie simple. Explication. La portée est le support de l'écriture musicale: cinq lignes et quatre interlignes. La clé de sol indique la position des notes. Chaque ligne et chaque interligne correspond à une note. La gamme de do est composée de sept notes: do, ré, mi, fa, sol, la, si. Lire une mélodie, c'est suivre les notes de gauche à droite et reproduire leurs hauteurs. [ Image Musique1_L3_01: portée avec clé de sol et gamme de do ]. La portée et la clé de sol fixent les hauteurs. Notions et définitions. Portée: ensemble de cinq lignes pour écrire la musique. Clé de sol: signe qui indique la position des notes. Note: son de hauteur déterminée (do à si). Gamme: succession de notes. Mélodie: succession de notes formant une phrase musicale. Exemples concrets. Hymne national (« Debout Congolais ») écrit en notation. Chants scolaires simples. Mélodies traditionnelles transcrites. Exercice d'application. Lire la gamme simple (do-ré-mi-fa-sol-la-si-do). Reconnaître trois notes sur une portée. Chanter une courte mélodie en suivant la partition. Corrigé. 1. On vérifie que l'élève nomme correctement les notes dans l'ordre. 2. On vérifie la position des notes sur la portée. 3. On vérifie que le chant suit approximativement la hauteur des notes écrites. À retenir. La portée et la clé de sol permettent de fixer les hauteurs. Lire la musique s'apprend comme lire un texte. La gamme de do est la base. Sources utiles. Programme E.32 (solfège), préparation EXETAT. Manuels de solfège. Limite: l'adaptation en 1re est une simplification."]],"5":[["fr","Leçon 4, La pratique vocale: chanter ensemble. Situation de départ. Une chorale scolaire chante l'hymne national, mais certaines voix sont trop fortes et d'autres trop faibles. Comment obtenir un son ensemble? Objectifs spécifiques. Échauffer sa voix. Chanter en groupe en respectant la justesse et le rythme. Écouter les autres voix. Explication. Chanter ensemble nécessite d'écouter les autres autant que soi. L'échauffement vocal prépare la voix; la respiration soutient le son; la justesse s'acquiert par l'écoute et la répétition. L'unisson est le fait de chanter la même note ensemble. La nuance désigne l'intensité (fort ou doux). [ Image Musique1_L4_01: chorale ou groupe chantant à l'unisson ]. Chanter ensemble suppose écoute et respiration. Notions et définitions. Échauffement vocal: préparation de la voix. Respiration: soutien du son chanté. Justesse: capacité à chanter la bonne hauteur. Unisson: chant sur la même note. Nuance: intensité du chant (fort ou doux). Exemples concrets. Chorales d'école. Hymne national. Chants de rassemblement. Rumba chantée en groupe. Exercice d'application. Échauffe la voix avec des vocalises simples. Chante une phrase musicale à l'unisson avec la classe. Enregistre (si possible) et écoute le résultat pour ajuster. Corrigé. On vérifie que: l'échauffement est réalisé sans forcer; la phrase est chantée ensemble, avec un son homogène; l'élève sait identifier un passage trop fort ou trop faible. À retenir. La voix est un instrument collectif. L'écoute et la respiration sont essentielles. Chanter ensemble développe la cohésion. Sources utiles. Fiches d'Éducation Musicale et Théâtrale (pratique vocale). Pratiques chorales scolaires en R D C. Limite: l'adaptation en 1re est une simplification."]],"6":[["fr","Leçon 5, Le patrimoine musical congolais: instruments et styles. Situation de départ. Lors d'une fête, on entend du likembé, du tam-tam et de la guitare. À quels styles appartiennent ces sons? Que représentent-ils pour la communauté? Objectifs spécifiques. Identifier des instruments traditionnels congolais. Reconnaître des styles musicaux (rumba, musique traditionnelle). Comprendre la fonction sociale de la musique. Explication. La musique congolaise est riche et variée. Les instruments traditionnels accompagnent la vie sociale. Quelques exemples: likembé: piano à pouces, instrument à lamelles; tam-tam: tambour utilisé pour communiquer ou célébrer; maracas: hochets pour marquer le rythme; balafon: instrument à lames de bois. La rumba congolaise, née dans les villes, est devenue un symbole national. La musique remplit des fonctions sociales: fête, deuil, travail, rite. [ Image Musique1_L5_01: instruments traditionnels (likembé, tam-tam, maracas) ]. Les instruments traditionnels portent une histoire et une fonction. Notions et définitions. Instrument traditionnel: instrument hérité d'une culture (likembé, tam-tam, maracas). Rumba congolaise: style musical urbain, symbole national. Musique traditionnelle: musique liée à la vie d'une communauté. Fonction sociale: rôle de la musique dans la vie collective. Exemples concrets. Likembé utilisé pour accompagner les chants. Tam-tam pour communiquer un événement. Rumba de Kinshasa. Chants de travail et de célébration. Exercice d'application. Associe trois instruments à leur fonction (fête, communication, accompagnement). Écoute un extrait de rumba et un extrait traditionnel. Compare-les en deux phrases. Corrigé. 1. Exemple: tam-tam égale communication; maracas égale accompagnement rythmique; likembé égale accompagnement mélodique. 2. Réponse libre. 3. Comparaison attendue: la rumba est plus urbaine, avec instruments modernes; la musique traditionnelle utilise davantage d'instruments acoustiques locaux. À retenir. La musique est un patrimoine vivant. Elle exprime l'identité et la vie collective. Connaître ses instruments et styles, c'est valoriser sa culture. Sources utiles. Programme national de musique. Documents sur le patrimoine musical congolais (sciences-africa.com). Limite: l'adaptation en 1re est une simplification."]],"7":[["fr","Évaluation finale, Musique et Solfège. Évaluation finale. 36 questions à choix multiple. Une seule réponse est correcte par question. Choisis la réponse qui te semble juste, puis valide."]]}};

        get: function (n) {
          return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); })
            .then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; });
        },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);

    // ====================================================================
    //  Bannière : invitation, confirmations, progression
    // ====================================================================
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer);
      bnMode = mode;
      txtEl.textContent = text;
      actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; }
      else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }

    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }

    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial"
        ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet."
        : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
</html>
