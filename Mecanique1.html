            <h3>Situation de départ</h3>
            <p>Un élève pousse une caisse et un autre la tire. Les deux agissent, mais pas de la même manière. Comment représenter ces actions pour les comparer ?</p>

            <h3>Explication</h3>
            <p>Une <strong>force</strong> est une action mécanique capable de déformer un corps ou de modifier son mouvement. On la représente par un <strong>vecteur</strong> : une flèche dont la longueur est proportionnelle à l'intensité. Ses quatre éléments : point d'application, direction, sens, intensité (en newtons).</p>

                <li><strong>tension :</strong> force dans un câble ;</li>

                <li><strong>Direction :</strong> droite d'action.</li>
                <li><strong>Sens :</strong> orientation sur la droite.</li>

        <div class="bloc-cas">
            <h3>Situation de départ</h3>
            <p>Une barre repose sur un pivot. Un enfant léger s'assoit loin du pivot, un adulte lourd s'assoit près. La barre peut-elle rester équilibrée ?</p>

            </ul>

            <h3>Explication</h3>
            <p>Le <strong>moment</strong> d'une force mesure son effet de rotation autour d'un point. Il dépend de l'intensité de la force et de la distance au pivot (bras de levier) : M = F × d. Un levier est en <strong>équilibre</strong> si la somme des moments qui tendent à le faire tourner dans un sens égale la somme des moments qui tendent à le faire tourner dans l'autre sens.</p>

            <figure class="bloc-image" data-image-id="Mecanique1_L2_01">
                <div class="image-cadre">[ Image Mecanique1_L2_01 : levier avec forces et bras de levier ]</div>
                <figcaption>L'équilibre d'un levier repose sur l'égalité des moments.</figcaption>
            </figure>

            <h3>Notions et définitions</h3>
            <ul>
                <li><strong>Moment d'une force (M) :</strong> en newtons-mètres (N·m).</li>
                <li><strong>Bras de levier (d) :</strong> distance entre pivot et point d'application.</li>
                <li><strong>Levier :</strong> barre rigide qui pivote autour d'un point.</li>
                <li><strong>Équilibre :</strong> somme des moments = 0.</li>
            </ul>

        <div class="bloc-cas">
            <h3>Situation de départ</h3>
            <p>Un camion part de Bukavu et roule vers Uvira. Sa vitesse augmente puis reste constante. Comment décrire ces deux phases de mouvement ?</p>
        </div>

        <div class="bloc-theorie">
            <h3>Objectifs spécifiques</h3>
            <ul>
                <li>Définir la cinématique.</li>
                <li>Distinguer trajectoire, vitesse et accélération.</li>
                <li>Décrire un MRU et un MRUV.</li>
                <li>Utiliser les unités (m, s, m/s, m/s²).</li>
            </ul>

            <h3>Explication</h3>
            <p>La <strong>cinématique</strong> décrit le mouvement sans s'intéresser à ses causes. La <strong>vitesse</strong> est la distance parcourue par unité de temps (v = d/t). L'<strong>accélération</strong> est la variation de vitesse par unité de temps (a = Δv/Δt).</p>
            <ul>
                <li><strong>MRU :</strong> vitesse constante ;</li>
                <li><strong>MRUV :</strong> accélération constante.</li>
            </ul>

            <figure class="bloc-image" data-image-id="Mecanique1_L3_01">
                <div class="image-cadre">[ Image Mecanique1_L3_01 : graphique vitesse-temps (MRU et MRUV) ]</div>
                <figcaption>Le graphique permet de distinguer les types de mouvement.</figcaption>
            </figure>

            <h3>Notions et définitions</h3>
            <ul>
                <li><strong>Cinématique :</strong> description du mouvement.</li>
                <li><strong>Référentiel :</strong> repère par rapport auquel on observe.</li>
                <li><strong>Trajectoire :</strong> ensemble des positions occupées.</li>
                <li><strong>Vitesse :</strong> v = d/t (m/s).</li>
                <li><strong>Accélération :</strong> a = Δv/Δt (m/s²).</li>
                <li><strong>MRU :</strong> mouvement rectiligne uniforme.</li>
                <li><strong>MRUV :</strong> mouvement rectiligne uniformément varié.</li>

  var CFG = {"code":"Mecanique1","base":"audio_files/","available":[1,2,3,4,5,6,7],"count":7,"sizeMo":8,"sizes":{"1":1789440,"2":1282560,"3":1135488,"4":1260480,"5":1096512,"6":1132608,"7":115200},"fallback":{"1":[["fr","Sommaire, Mécanique générale. Présentation générale du cours. Titre: Mécanique générale, initiation aux forces, aux mouvements et à l'équilibre. Niveau ou domaine: 1re année, domaine Technique industriel (option Mécanique automobile). Note de positionnement. Le cours est officiellement inscrit en 1re année, option Mécanique automobile (programme EPST, fiches Édition 2025). Ce cours suit le programme avec une adaptation pédagogique: les calculs vectoriels sont simplifiés, les exemples sont issus de la mécanique automobile et des engins courants en R D C, et les activités pratiques se limitent à des observations et des mesures simples (leviers, poulies, dynamomètres). Objectifs généraux. Comprendre les notions de force, de moment et d'équilibre. Connaître les bases de la cinématique. Appliquer les lois de Newton à des cas simples. Utiliser les unités du Système International. Résoudre un problème mécanique simple. Compétences visées. Représenter une force par un vecteur. Calculer un moment de force. Vérifier l'équilibre d'un solide soumis à deux ou trois forces. Décrire un MRU et un MRUV. Appliquer la relation fondamentale de la dynamique. Convertir des unités. Organisation des leçons. Leçon 1: La force: représentation et effets. Leçon 2: Le moment d'une force et l'équilibre. Leçon 3: La cinématique du point: mouvement rectiligne. Leçon 4: La dynamique du point: les lois de Newton. Leçon 5: Applications: leviers, poulies et transmission de mouvement. Évaluation finale: 36 questions à choix multiple. Prérequis: mathématiques de base (algèbre, géométrie, trigonométrie); notions de physique. Contextualisation R D C. Stabilité des véhicules surchargés à Bukavu; résistance des attelages sur les pistes du Sud-Ubangi; calcul du centre de gravité pour le chargement des camions; entretien des engins et des machines. Limites documentaires. La fiche officielle de 1re année (Mécanique automobile) a été consultée. La répartition annuelle complète n'a pas été lue ligne à ligne. L'adaptation au niveau 12-14 ans est une sélection de notions accessibles. Plan d'images du cours. Identifiant. Leçon. Contenu visuel. Utilité. Emplacement. Mecanique1_L1_01. L1. Représentation vectorielle d'une force. Notions de base. Slide 1, bloc théorie. Mecanique1_L2_01. L2. Levier avec forces et bras de levier. Statique. Slide 2, bloc exercice. Mecanique1_L3_01. L3. Graphique vitesse-temps (MRU et MRUV). Cinématique. Slide 3, bloc théorie. Mecanique1_L4_01. L4. Illustration des trois lois de Newton. Dynamique. Slide 4, bloc résumé. Mecanique1_L5_01. L5. Poulies et engrenages. Mécanismes. Slide 5, bloc exercice. Identifiants stables et cohérents avec le HTML."]],"2":[["fr","Leçon 1, La force: représentation et effets. Situation de départ. Un élève pousse une caisse et un autre la tire. Les deux agissent, mais pas de la même manière. Comment représenter ces actions pour les comparer? Objectifs spécifiques. Définir une force. Représenter une force par un vecteur. Distinguer les types de forces. Explication. Une force est une action mécanique capable de déformer un corps ou de modifier son mouvement. On la représente par un vecteur: une flèche dont la longueur est proportionnelle à l'intensité. Ses quatre éléments: point d'application, direction, sens, intensité (en newtons). poids: P égale m multiplié par g; réaction du support: force exercée par le sol ou une surface; tension: force dans un câble; frottement: force qui s'oppose au mouvement. [ Image Mecanique1_L1_01: représentation vectorielle d'une force ]. Une force est une grandeur vectorielle. Notions et définitions. Force: action mécanique vectorielle. Vecteur: représenté par une flèche. Point d'application: lieu où s'exerce la force. Direction: droite d'action. Sens: orientation sur la droite. Intensité: valeur en newtons. Poids: P égale m multiplié par g (g environ égal à 9,8 N ou kg). Exemples concrets. Poids d'une charge sur un camion. Tension d'un câble de remorquage. Frottement des pneus sur une piste en terre. Exercice d'application. Représente par des flèches le poids et la réaction du sol sur une caisse posée. Mesure une force avec un dynamomètre simple. Indique les quatre éléments d'une force. Corrigé. On vérifie que: le poids est dirigé vers le bas; la réaction du sol vers le haut; les deux flèches ont la même longueur si la caisse est immobile; les quatre éléments sont nommés. À retenir. La force est une grandeur vectorielle. Quatre éléments la caractérisent. Sa représentation permet de comprendre ses effets. Sources utiles. Fiches de Mécanique Générale, 1re année, option Mécanique automobile (Édition 2025). Programme national de mécanique (cycle long). Limite: l'adaptation en 1re est une simplification."]],"3":[["fr","Leçon 2, Le moment d'une force et l'équilibre. Situation de départ. Une barre repose sur un pivot. Un enfant léger s'assoit loin du pivot, un adulte lourd s'assoit près. La barre peut-elle rester équilibrée? Objectifs spécifiques. Définir le moment d'une force. Calculer un moment simple. Vérifier l'équilibre d'un levier. Explication. Le moment d'une force mesure son effet de rotation autour d'un point. Il dépend de l'intensité de la force et de la distance au pivot (bras de levier): M égale F multiplié par d. Un levier est en équilibre si la somme des moments qui tendent à le faire tourner dans un sens égale la somme des moments qui tendent à le faire tourner dans l'autre sens. [ Image Mecanique1_L2_01: levier avec forces et bras de levier ]. L'équilibre d'un levier repose sur l'égalité des moments. Notions et définitions. Moment d'une force (M): en newtons-mètres (N multiplié par m). Bras de levier (d): distance entre pivot et point d'application. Levier: barre rigide qui pivote autour d'un point. Équilibre: somme des moments égale 0. Exemples concrets. Levier utilisé pour soulever une charge. Clé de serrage. Cric de voiture. Balance romaine. Exercice d'application. Calcule le moment d'une force de 50 N appliquée à 0,5 mètres du pivot. Vérifie l'équilibre d'un levier avec deux forces données. Indique ce qui se passe si le bras de levier double. Corrigé. 1. M égale 50 multiplié par 0,5 égale 25 N multiplié par m. 2. F1 multiplié par d1 égale F2 multiplié par d2. 3. Le moment double pour la même force. À retenir. Le moment traduit l'effet de rotation. Il dépend de la force et du bras de levier. L'équilibre exige l'égalité des moments. Sources utiles. Fiches de Mécanique Générale, 1re année (statique, moments). Fiches de RDM (condition d'équilibre). Limite: l'adaptation en 1re est une simplification."]],"4":[["fr","Leçon 3, La cinématique du point: mouvement rectiligne. Situation de départ. Un camion part de Bukavu et roule vers Uvira. Sa vitesse augmente puis reste constante. Comment décrire ces deux phases de mouvement? Objectifs spécifiques. Définir la cinématique. Distinguer trajectoire, vitesse et accélération. Décrire un MRU et un MRUV. Utiliser les unités (m, s, m ou s, m ou s au carré ). Explication. La cinématique décrit le mouvement sans s'intéresser à ses causes. La vitesse est la distance parcourue par unité de temps (v égale d ou t). L'accélération est la variation de vitesse par unité de temps (a égale Δv/Δt). MRU: vitesse constante; MRUV: accélération constante. [ Image Mecanique1_L3_01: graphique vitesse-temps (MRU et MRUV) ]. Le graphique permet de distinguer les types de mouvement. Notions et définitions. Cinématique: description du mouvement. Référentiel: repère par rapport auquel on observe. Trajectoire: ensemble des positions occupées. Vitesse: v égale d ou t (m ou s). Accélération: a égale Δv/Δt (m ou s au carré ). MRU: mouvement rectiligne uniforme. MRUV: mouvement rectiligne uniformément varié. Exemples concrets. Camion sur la route Bukavu-Uvira. Véhicule qui freine. Rotation d'une meule. Exercice d'application. Calcule la vitesse moyenne d'un véhicule qui parcourt 120 kilomètres en 2 heures. Distingue MRU et MRUV sur des graphiques simples. Indique l'unité de l'accélération. Corrigé. 1. v égale 120 sur 2 égale 60 kilomètres par heure. 2. MRU: droite horizontale; MRUV: droite inclinée. 3. m ou s au carré. À retenir. La cinématique décrit les mouvements. Vitesse et accélération sont distinctes. MRU et MRUV ont des graphiques différents. Sources utiles. Fiches de Mécanique Générale, 1re année (cinématique). Programme national de mécanique. Limite: l'adaptation en 1re est une simplification."]],"5":[["fr","Leçon 4, La dynamique du point: les lois de Newton. Situation de départ. Un passager est projeté vers l'avant quand le bus freine brusquement. Pourquoi? Quelle loi de Newton explique ce phénomène? Objectifs spécifiques. Énoncer les trois lois de Newton. Appliquer la deuxième loi à un cas simple. Comprendre l'inertie et l'action-réaction. Explication. Les trois lois de Newton: 1re loi (inertie): un corps reste au repos ou en MRU si les forces se compensent; 2e loi (fondamentale): F égale m multiplié par a; 3e loi (action-réaction): deux corps exercent l'un sur l'autre des forces égales et opposées. [ Image Mecanique1_L4_01: illustration des trois lois de Newton ]. Les lois de Newton relient forces et mouvements. Notions et définitions. Principe d'inertie: 1re loi. Principe fondamental de la dynamique: F égale m multiplié par a. Principe d'action-réaction: 3e loi. Masse: quantité de matière (kg). Accélération: variation de vitesse. Exemples concrets. Freinage d'un bus. Propulsion d'une pirogue à moteur. Recul d'une arme à feu. Exercice d'application. Calcule l'accélération d'un corps de 10 kilogrammes soumis à 50 N. Identifie la loi de Newton dans deux situations. Explique pourquoi un passager est projeté vers l'avant au freinage. Corrigé. 1. a égale F ou m égale 50 sur 10 égale 5 mètres ou s au carré. 2. Identifier selon l'exemple. 3. Par inertie: le corps tend à conserver sa vitesse. À retenir. Les lois de Newton relient forces et mouvements. F égale m multiplié par a est la loi fondamentale. L'inertie explique de nombreux phénomènes quotidiens. Sources utiles. Fiches de Mécanique Générale, 1re année (dynamique). Manuels de physique. Limite: l'adaptation en 1re est une simplification."]],"6":[["fr","Leçon 5, Applications: leviers, poulies et transmission de mouvement. Situation de départ. Un mécanicien utilise une poulie pour soulever un moteur. Pourquoi est-ce plus facile qu'à mains nues? Comment fonctionne une poulie? Objectifs spécifiques. Identifier des mécanismes simples. Comprendre leur fonction. Calculer un rapport de transmission simple. Explication. Les mécanismes simples transforment ou transmettent un mouvement: poulie fixe: change la direction de la force; poulie mobile: divise l'effort par deux; engrenage: transmet le mouvement entre arbres; courroie: transmet entre deux poulies. Le rapport de transmission dépend du nombre de dents ou des diamètres. [ Image Mecanique1_L5_01: poulies et engrenages ]. Les mécanismes simples sont partout dans les machines. Notions et définitions. Levier: inter-appui, inter-résistant, inter-moteur. Poulie fixe: change la direction. Poulie mobile: divise l'effort. Engrenage: roues dentées. Courroie: transmission souple. Rapport de transmission: rapport entre les vitesses. Exemples concrets. Poulie de levage dans un atelier. Courroie de transmission sur une machine. Engrenages d'une boîte de vitesses. Exercice d'application. Calcule le rapport de transmission d'un engrenage de 10 dents entraînant un engrenage de 30 dents. Identifie des mécanismes sur une photo d'atelier. Explique la différence entre poulie fixe et poulie mobile. Corrigé. 1. Rapport égale 30 sur 10 égale 3. 2. Identifier poulies, courroies, engrenages. 3. Fixe: direction; mobile: effort divisé. À retenir. Les mécanismes simples sont à la base de toutes les machines. La poulie transforme ou divise l'effort. Le rapport de transmission se calcule simplement. Sources utiles. Fiches de Mécanique Générale, 1re année (mécanismes). Fiches de Mécanique Automobile. Limite: l'adaptation en 1re est une simplification."]],"7":[["fr","Évaluation finale, Mécanique générale. Évaluation finale. 36 questions à choix multiple. Une seule réponse est correcte par question. Choisis la réponse qui te semble juste, puis valide."]]}};

            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);

    // ====================================================================
    //  Bannière : invitation, confirmations, progression
    // ====================================================================
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer);
      bnMode = mode;
      txtEl.textContent = text;
      actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; }
      else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }

    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }

    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial"
        ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet."
        : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
</html>
