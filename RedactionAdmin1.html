    title: "Leçon 1 — Qu'est-ce que la rédaction administrative ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi l'administration écrit-elle ? Quels sont les documents qu'elle produit ? À qui s'adressent-ils ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la rédaction administrative. Comprendre son rôle. Distinguer ses types. Prérequis : maîtrise du français écrit (grammaire, orthographe, syntaxe).</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>rédaction administrative</strong> est l'ensemble des techniques d'écriture utilisées dans l'administration publique et les organisations pour informer, instruire, décider, rendre compte, communiquer.</p>
<p><strong>Rôle :</strong> elle garantit la traçabilité, la transparence, la continuité et l'efficacité de l'action administrative.</p>
<p><strong>Types d'écrits :</strong> lettres administratives, notes, circulaires, arrêtés, rapports, comptes rendus, procès-verbaux, communiqués, correspondance diplomatique.</p>
<p><strong>Caractères :</strong> clarté, neutralité, précision, concision, courtoisie, respect de la hiérarchie. Elle se distingue de la correspondance commerciale (cours n°45) par son contexte public, son style plus formel, ses règles protocolaires.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Rédaction administrative :</strong> techniques d'écriture administrative. <strong>Administration :</strong> ensemble des services de l'État ou d'une organisation. <strong>Traçabilité :</strong> conservation de la trace écrite. <strong>Neutralité :</strong> absence de jugement personnel. <strong>Hiérarchie :</strong> organisation des responsabilités.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier l'objectif de l'écrit. Adapter le ton et la forme au destinataire. Respecter la hiérarchie et les règles. Conserver une trace écrite.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un ministère envoie une circulaire aux provinces pour rappeler les règles de gestion des écoles : le document est officiel, daté, numéroté, signé. Un chef de service rédige une note pour informer ses collaborateurs d'un changement d'horaire.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis la rédaction administrative.</p>
<p><strong>Ex. 2 :</strong> Cite trois types d'écrits administratifs.</p>

<p><strong>1)</strong> L'ensemble des techniques d'écriture utilisées dans l'administration pour informer, instruire, décider, rendre compte, communiquer.</p>
<p><strong>2)</strong> Lettre, note, circulaire (3 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La rédaction administrative est le langage écrit de l'administration ; elle exige rigueur, neutralité et clarté.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques 2025 ; Cours-de-Gestion.fr.</div>
    `

    title: "Leçon 2 — Le style administratif",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi le style administratif est-il différent du style littéraire ? Quelles sont ses règles ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le style administratif. Connaître ses règles. L'appliquer. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>style administratif</strong> est l'ensemble des règles d'écriture propres à l'administration. Il privilégie la clarté, la neutralité, la précision, la concision.</p>
<p><strong>Caractéristiques :</strong></p>
<ul>
<li><strong>Impersonnel :</strong> éviter le « je », utiliser « nous », « le service », « l'administration ».</li>
<li><strong>Neutre :</strong> pas de jugement, pas d'émotion, pas d'humour.</li>
<li><strong>Précis :</strong> informations exactes, dates, références, chiffres.</li>
<li><strong>Concis :</strong> phrases courtes, pas de redondance.</li>
<li><strong>Formel :</strong> registre courant ou soutenu, formules de politesse codifiées.</li>
</ul>
<p><strong>Erreurs à éviter :</strong> familiarité, abréviations non expliquées, phrases trop longues, jugements personnels, fautes d'orthographe.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Style administratif :</strong> règles d'écriture administratives. <strong>Impersonnel :</strong> sans référence personnelle. <strong>Neutre :</strong> sans jugement. <strong>Formel :</strong> registre soutenu.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Rédiger au présent de vérité générale, ou au futur pour les décisions. Utiliser la voix passive quand nécessaire. Éviter le « je » et les émotions. Relire pour corriger.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Style familier : « On va fermer l'école demain. » Style administratif : « L'école sera fermée le 15 novembre 2025 pour cause de réunion pédagogique. » Style littéraire : « La douce lumière de l'aube inondait la cour de l'école. » Style administratif : « La cour de l'école est éclairée dès l'aube. »</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois caractéristiques du style administratif.</p>
<p><strong>Ex. 2 :</strong> Transforme en style administratif : « On va organiser une réunion. »</p>

</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le style administratif est impersonnel, neutre, précis et formel ; il garantit la qualité de la communication officielle.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques 2025 ; Cours-de-Gestion.fr.</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Quelles sont les parties d'un document administratif ? Dans quel ordre les disposer ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les parties d'un document administratif. Les disposer correctement. Rédiger un document simple. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La plupart des documents administratifs partagent une structure commune :</p>
<ol>
<li><strong>En-tête :</strong> nom de l'organisme, service, adresse, téléphone, courriel, logo.</li>
<li><strong>Références :</strong> numéro d'enregistrement, date, lieu.</li>
<li><strong>Objet :</strong> résumé du contenu.</li>
<li><strong>Destinataire :</strong> nom, fonction, adresse.</li>
<li><strong>Formule d'appel :</strong> « Monsieur le Directeur, », « Madame, », « Excellence, ».</li>
<li><strong>Corps :</strong> exposé des faits, décision ou demande, justification.</li>
<li><strong>Formule de politesse :</strong> formule codifiée.</li>
<li><strong>Signature :</strong> nom, fonction, signature.</li>
<li><strong>Pièces jointes :</strong> liste des documents joints.</li>
<li><strong>Copies :</strong> destinataires pour information.</li>
</ol>
<p><strong>Présentation :</strong> marges régulières, police lisible, aération, alignement, propreté.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>En-tête :</strong> identification de l'organisme. <strong>Références :</strong> numéro et date. <strong>Objet :</strong> résumé. <strong>Destinataire :</strong> personne ou service concerné. <strong>Pièces jointes :</strong> documents joints.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Présenter proprement. Respecter l'ordre des parties. Rédiger l'objet clairement. Signer et dater. Joindre les documents nécessaires.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une lettre administrative comporte en-tête, référence, objet, destinataire, formule d'appel, corps, formule de politesse, signature. Une note administrative comporte en-tête, numéro, destinataires, objet, corps, signature.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois parties d'un document administratif.</p>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La structure des documents administratifs obéit à des règles précises ; sa maîtrise garantit la qualité et la lisibilité.</p></div>

    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment un service administratif écrit-il à un usager, à un autre service, à une autorité ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la lettre administrative. Connaître sa structure. Rédiger une lettre simple. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>lettre administrative</strong> est un écrit officiel adressé par une administration à un usager, à une autre administration, ou à une autorité.</p>
<p><strong>Types :</strong> lettre de demande (solliciter une autorisation, un renseignement, un stage) ; lettre de réponse (répondre à une demande) ; lettre de notification (informer d'une décision) ; lettre de réclamation (signaler un problème).</p>
<p><strong>Structure (rappel) :</strong> en-tête, référence, objet, destinataire, formule d'appel, corps, formule de politesse, signature.</p>
<p><strong>Style :</strong> impersonnel, neutre, précis, formel.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Lettre administrative :</strong> écrit officiel de l'administration. <strong>Notification :</strong> information officielle. <strong>Formule d'appel :</strong> début de la lettre. <strong>Formule de politesse :</strong> fin de la lettre.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier le destinataire et l'objet. Rédiger au style administratif. Respecter la structure. Signer et dater.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Lettre de notification : « Objet : Notification de décision. Monsieur, Nous avons l'honneur de vous informer que votre demande de stage a été acceptée. Le stage débutera le 1er décembre 2025 pour une durée de trois mois. Veuillez vous présenter au service du personnel muni de votre carte d'étudiant. Je vous prie d'agréer, Monsieur, l'expression de mes salutations distinguées. »</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>

      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
