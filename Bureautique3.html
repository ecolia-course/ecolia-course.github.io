pétence professionnelle. Notions essentielles. Fichier: ensemble de données enregistré sous un nom, avec une extension (docx, xlsx, pptx, pdf…). Dossier: conteneur qui regroupe des fichiers. Arborescence: organisation hiérarchique (dossiers, donc sous-dossiers, donc fichiers). Chemin: localisation complète d'un fichier. Bonnes pratiques de nommage. Nom explicite: 2025-03-15_PV_Reunion_Direction.docx. Éviter les accents et caractères spéciaux dans les noms. Utiliser un format de date stable (AAAA-MM-JJ). Créer une arborescence logique (Administration ou Réunions ou Procès-verbaux ou 2025). Sauvegarde. Sauvegarde locale (disque externe, clé USB). Sauvegarde dans le cloud (voir leçon 8). Règle simple: ne jamais dépendre d'un seul support. À retenir. Une bonne gestion des fichiers repose sur une arborescence claire, un nommage explicite et une sauvegarde régulière. Un professionnel doit retrouver tout document en quelques secondes."]],"3":[["fr","Leçon 2, Word: mise en page simple et styles. Interface et repères. Ruban: onglets (Accueil, Insertion, Mise en page, Références, Révision, Affichage). Zone de texte: page blanche où l'on saisit. Règle, ascenseurs, barre d'état. Notions de base. Polices et tailles: choisir des polices lisibles (Arial, Times New Roman, Calibri). Paragraphes: alignements, interlignes, espacement avant ou après. Marges: à définir selon le type de document. Listes à puces et numérotées. Les styles. Un style regroupe un ensemble de mises en forme (police, taille, couleur, espacement) appliquées en un clic. Utiliser des styles (Titre 1, Titre 2, Normal) permet: Une cohérence visuelle automatique. Une table des matières automatique (voir leçon 3). Une modification globale facile (changer le style égale changer tout le document). À retenir. Word n'est pas un simple traitement de texte: bien utilisé avec les styles, il produit des documents professionnels cohérents et modifiables facilement."]],"4":[["fr","Leçon 3, Word: mise en page complexe et révision. Mise en page avancée. Sauts de section: permettent de différencier les en-têtes ou pieds de page (par exemple, page de garde sans numéro, autres pages numérotées). En-têtes et pieds de page: titre du document, numéro de page, logos. Table des matières automatique: générée à partir des styles (Titre 1, 2, 3). Notes de bas de page et légendes. Colonnes: pour certains rapports ou journaux internes. Suivi des modifications et révision. Suivi des modifications: enregistre les ajouts et suppressions pour relecture. Commentaires: annotations en marge. Mode révision: accepter ou refuser les modifications. Comparaison de documents: montre les différences entre deux versions. Sécurité et protection. Protection du document par mot de passe (facultatif, selon les besoins). Vérification finale avant impression ou envoi: orthographe, mise en page, en-têtes, pagination. Image de référence: BU3_IMG01, exemple de rapport structuré avec sommaire automatique. Exercice. Rédiger un rapport structuré (10 pages) avec page de garde, sommaire automatique, en-têtes différenciés, numérotation des pages à partir de la deuxième page. Corrigé. Appliquer des styles (Titre 1, Titre 2) à la structure. Insérer une table des matières automatique (Références, donc Table des matières). Créer un saut de section après la page de garde. Dans la deuxième section, ajouter un en-tête avec le titre du document et un pied de page avec numéro automatique. Vérifier la cohérence du tout. À retenir. Word avancé repose sur les styles, les sauts de section et la table des matières automatique. Le mode révision et les commentaires facilitent le travail collaboratif."]],"5":[["fr","Leçon 4, Excel: tableaux et calculs de base. Interface et vocabulaire. Classeur: fichier Excel (.xlsx). Feuilles: onglets d'un classeur. Cellules: intersections colonne ou ligne (ex. A1, B3). Plages: ensembles de cellules (ex. A1:B10). Formules de base. Addition: égale A1 plus B1. Soustraction: égale A1, B1. Multiplication: égale A1 * B1. Division: égale A1 ou B1. Somme: égale SOMME(A1:A10). Moyenne: égale MOYENNE(A1:A10). Max, Min: égale MAX(A1:A10), égale MIN(A1:A10). Conditionnelle: égale SI(A1 supérieur ou égal à 10;\"Admis\";\"Ajourné\"). Mise en forme. Format des nombres (monnaie, pourcentage, date). Bordures, couleurs de cellules, largeur de colonnes. Figement des volets (ligne ou colonne figée) pour lire de grands tableaux. Exercice. Créer un tableau de dépenses mensuelles d'un service: catégories (fournitures, transport, communication), montants, total. Calculer le total général et la moyenne. Corrigé. Colonne A égale Catégorie, colonne B égale Montant. En bas: égale SOMME(B2:B10) pour le total. égale MOYENNE(B2:B10) pour la moyenne. Mettre en forme avec bordures et format monétaire. À retenir. Excel organise et calcule. La maîtrise des formules de base (SOMME, MOYENNE, SI) couvre 80 pour cent des besoins du secrétariat."]],"6":[["fr","Leçon 5, Excel: analyse de données (initiation). Outils d'analyse. Tri: croissant ou décroissant selon une colonne. Filtres automatiques: afficher uniquement certaines lignes selon un critère. Tableaux croisés dynamiques (TCD): synthétiser de grands tableaux en quelques clics (somme par catégorie, par mois…). Graphiques: histogramme, secteurs, courbes; pour visualiser les tendances. Exemple concret, dépenses d'un service. Saisir les données: Date, Catégorie, Montant. Convertir en tableau structuré (Insertion, donc Tableau). Créer un TCD: Lignes égale Catégorie; Valeurs égale Somme de Montant. Ajouter un graphique: secteurs par catégorie. Bonnes pratiques. Une seule ligne d'en-tête par tableau. Pas de lignes vides dans les données. Une colonne égale une information (pas de mélange date plus catégorie). Vérifier les unités et le format. Exercice. À partir d'un tableau de dépenses de six mois, créer un TCD donnant la somme des dépenses par catégorie, puis un graphique en secteurs. Corrigé. Sélectionner le tableau, insérer un TCD. Placer « Catégorie » en lignes, « Montant » en valeurs (Somme). Insérer un graphique secteurs à partir du TCD. Vérifier que la somme totale du TCD est égale à la somme totale du tableau source. À retenir. Les TCD et les filtres permettent d'analyser rapidement de grandes quantités de données. C'est une compétence très recherchée dans les services administratifs."]],"7":[["fr","Leçon 6, PowerPoint: présentations professionnelles. Principes d'une bonne présentation. Un message par diapositive. Peu de texte (mots-clés plutôt que phrases complètes). Une police lisible (taille supérieur ou égal à 24 pt pour le corps). Des visuels utiles (schémas, images, graphiques) plutôt que décoratifs. Cohérence de couleurs et de polices sur toutes les diapositives. Structure type. Diapositive de titre (titre, auteur, date). Plan de la présentation. Introduction ou contexte. Développement (2 à 5 points clés). Conclusion ou recommandations. Diapositive de remerciements. Outils essentiels. Masque des diapositives (cohérence des mises en page). Transitions et animations discrètes (éviter les effets excessifs). Mode présentateur (notes, minuteur). Export PDF pour diffusion. Conseil. Une bonne présentation se prépare: on écrit d'abord le contenu, puis on le met en forme. Le diaporama soutient l'orateur, il ne le remplace pas. À retenir. PowerPoint sert à soutenir un discours, pas à afficher tout ce qu'on dit. Sobriété, clarté, cohérence sont les maîtres-mots."]],"8":[["fr","Leçon 7, Outlook: messagerie et planning. Messagerie professionnelle. Rédaction: objet clair, message concis, signature professionnelle. Pièces jointes: vérifier la taille, préférer un lien cloud pour les gros fichiers. Dossiers: classer les courriels (À traiter, En cours, Archives). Règles automatiques: trier les messages selon l'expéditeur ou l'objet. Bonnes pratiques d'email. Éviter les majuscules sur tout le message (équivalent d'un cri). Relire avant envoi. Utiliser « Répondre à tous » à bon escient. Ne pas envoyer de données confidentielles sans précaution. Calendrier et planning. Créer des rendez-vous, réunions, invitations. Partager son agenda avec ses collègues. Définir des rappels. Gérer les disponibilités pour fixer une réunion. À retenir. Outlook combine communication (email) et organisation (planning). Un usage professionnel implique rigueur, sobriété et respect des règles de confidentialité."]],"9":[["fr","Leçon 8, Réseaux, cloud et sécurité. Notions de base sur les réseaux. Réseau local (LAN): relie les postes d'un bureau. Internet: réseau mondial. Débit: quantité de données transférées par seconde (Mbps). Câble ou Wi-Fi: deux modes de connexion. Cloud. Stockage de fichiers en ligne (OneDrive, Google Drive, Dropbox). Avantages: accessibilité, partage, sauvegarde. Limites: dépendance à la connexion, confidentialité, coût selon l'espace. Sécurité. Mots de passe robustes: longueur, complexité, gestionnaire de mots de passe. Double authentification quand disponible. Mises à jour du système et des logiciels. Antivirus et prudence face aux pièces jointes suspectes (phishing). Confidentialité: ne pas diffuser les données sensibles sans autorisation. À retenir. Le professionnel du secrétariat travaille en réseau et dans le cloud. La sécurité repose sur des mots de passe solides, des mises à jour, la vigilance et la confidentialité."]],"10":[["fr","Leçon 9, Atelier intégré. Projet intégrateur. Réaliser un dossier complet pour une réunion administrative: Word: note de convocation structurée (styles, en-têtes, sommaire). Excel: tableau de suivi budgétaire du trimestre (formules, TCD, graphique). PowerPoint: présentation de 8 à 10 diapositives pour la réunion. Outlook: invitation aux participants, gestion des réponses. Archivage: arborescence et nommage clairs des fichiers produits. Critères d'évaluation. Qualité des documents produits, cohérence de la mise en page, justesse des calculs, sobriété de la présentation, respect des consignes de nommage et de sauvegarde."]],"11":[["fr","Sources et références documentaires."]],"12":[["fr","Évaluation finale, Bureautique. Répondez aux questions ci-dessous. Une seule réponse est correcte par question."]]}};

    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;

      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {                                   // fichier complet ? (taille exacte connue à la génération)
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;

      }
      return {
        list: function () {
          var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok);

        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {

        del: function (n) {

    function cacheStore() {

    function startDownload() {

        function paint() {

        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
