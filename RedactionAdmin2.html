    title: "Sommaire — Rédaction Administrative",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours de rédaction administrative couvre cinq leçons essentielles : le style administratif, la lettre administrative, la note de service et la note technique, le compte rendu et le procès-verbal, et la déontologie/confidentialité.</p>
<p><strong>Note :</strong> le programme officiel RDC spécifique à la « Rédaction Administrative » pour la 2e année (4e humanités) n'a pas été retrouvé dans un document unique intégral. La progression s'appuie sur le Programme National du Secrétariat (EDIDEPS), le Curriculum national SECRETARIAT-ADMINISTRATION, le Manuel de Correspondance Commerciale et Administrative (1ère année) et les référentiels ENA RDC / ScholarVox. Les modèles devront être validés par rapport aux usages administratifs congolais actuels.</p>
<ul>
<li>Leçon 1 — Le style administratif : caractéristiques et exigences</li>
<li>Leçon 2 — La lettre administrative : structure et formules</li>
<li>Leçon 3 — La note de service et la note technique</li>
<li>Leçon 4 — Le compte rendu et le procès-verbal</li>
<li>Leçon 5 — Déontologie et confidentialité</li>
</ul>
<p>Une évaluation finale de 20 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme National du Secrétariat, Cycle Long (EDIDEPS, RDC) ; Curriculum national des humanités techniques commerciales — SECRETARIAT-ADMINISTRATION (RDC) ; Manuel de Correspondance Commerciale et Administrative Française – 1ère Année Secrétariat (Édition 2025) ; référentiels ENA RDC et ScholarVox sur la rédaction administrative.</div>
    `
},
{
    title: "Leçon 1 — Le style administratif : caractéristiques et exigences",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un texte administratif mal rédigé peut-il bloquer une décision ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir le style administratif. Identifier ses caractéristiques. Le distinguer du style littéraire et du style commercial. Respecter la hiérarchie et le destinataire. Prérequis : maîtrise de la grammaire et de l'orthographe.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Style administratif :</strong> style d'écriture propre à l'administration, visant l'efficacité de l'action administrative.</p>
<p><strong>Caractéristiques :</strong></p>
<ul>
<li><strong>Clarté :</strong> une seule interprétation possible.</li>
<li><strong>Précision :</strong> faits, dates, noms et chiffres exacts.</li>
<li><strong>Concision :</strong> dire l'essentiel en peu de mots.</li>
<li><strong>Objectivité :</strong> pas de jugements personnels.</li>
<li><strong>Neutralité :</strong> pas de prise de position idéologique.</li>
<li><strong>Courtoisie :</strong> respect du destinataire et de la hiérarchie.</li>
</ul>
<p><strong>Différences :</strong> le style littéraire recherche l'effet esthétique ; le style commercial vise la relation client ; le style administratif vise la régularité et la traçabilité de l'action publique.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Style administratif :</strong> style d'efficacité au service de l'action publique. <strong>Concision :</strong> dire l'essentiel en peu de mots. <strong>Neutralité :</strong> absence de prise de position personnelle.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Chasser les formules creuses. Vérifier la précision des faits et des dates. Adapter le ton au destinataire et à la hiérarchie. Relire pour éliminer toute ambiguïté.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Au lieu de « Nous vous prions de bien vouloir trouver ci-joint ce que vous avez demandé », écrire « Vous trouverez ci-joint votre attestation de résidence, demandée le 12 mai. » Le second énoncé est clair, précis et concis.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Citer trois caractéristiques du style administratif. <strong>Ex. 2 :</strong> Réécrire en style administratif : « Faites vite, on est pressés. »</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Clarté, précision, concision (autres réponses possibles). <strong>2)</strong> « Veuillez traiter ce dossier dans les meilleurs délais. »</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le style administratif est un style de service : il doit être compris sans effort par le destinataire.</p></div>

<div class="sources"><strong>Sources :</strong> ENA RDC — « La rédaction administrative » ; référentiels ScholarVox.</div>
    `
},
{
    title: "Leçon 2 — La lettre administrative : structure et formules",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi la date et les références d'une lettre administrative sont-elles essentielles ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les parties de la lettre administrative. Utiliser les formules adaptées. Adapter le ton au destinataire. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Parties de la lettre administrative :</strong></p>
<ol>
<li><strong>En-tête :</strong> identification du service (administration, direction, adresse).</li>
<li><strong>Lieu et date.</strong></li>
<li><strong>Destinataire :</strong> fonction et adresse.</li>
<li><strong>Références :</strong> numéro de dossier, numéro d'enregistrement.</li>
<li><strong>Objet :</strong> formulation brève du sujet.</li>
<li><strong>Formule d'appel :</strong> « Monsieur le Gouverneur, ».</li>
<li><strong>Corps :</strong> exposé des faits, demande.</li>
<li><strong>Formule de courtoisie :</strong> « Je vous prie d'agréer, Monsieur le Gouverneur, l'expression de ma haute considération. »</li>
<li><strong>Signature et fonction.</strong></li>
<li><strong>Pièces jointes.</strong></li>
</ol>
<p><strong>Dispositions :</strong> française (signature à droite) ou administrative (signature au centre).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Formule d'appel :</strong> désignation du destinataire. <strong>Formule de courtoisie :</strong> formule de clôture. <strong>Références :</strong> identifiants administratifs de la lettre.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Respecter l'ordre des parties. Adapter la formule d'appel à la fonction du destinataire. Éviter les formules trop familières. Soigner la présentation.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Lettre du bourgmestre d'une commune de Kinshasa convoquant un agent : en-tête de la commune, références (n° 045/2025), objet (« Convocation à un entretien »), formule d'appel (« Monsieur, »), corps (date, heure, lieu), formule de courtoisie, signature.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Citer les mentions obligatoires d'une lettre administrative. <strong>Ex. 2 :</strong> Pourquoi la date est-elle essentielle ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> En-tête, date, destinataire, objet, formule d'appel, corps, formule de courtoisie, signature. <strong>2)</strong> Parce qu'elle atteste du moment de l'acte et conditionne les délais de recours.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La lettre administrative est un document normé : sa régularité formelle conditionne son efficacité.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel de Correspondance Commerciale et Administrative (1ère année, Édition 2025) ; ENA RDC.</div>
    `
},
{
    title: "Leçon 3 — La note de service et la note technique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Quand faut-il écrire une note plutôt qu'une lettre ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer note de service et note technique. Rédiger chacune selon sa structure. Comprendre leur rôle interne. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Note de service :</strong> communication interne descendante, brève, opérationnelle. Elle informe, rappelle ou prescrit.</p>
<ul>
<li>Objet.</li>
<li>Destinataires (services, agents).</li>
<li>Contenu concis (instructions, rappels).</li>
<li>Date, signature.</li>
</ul>
<p><strong>Note technique :</strong> analyse d'un point précis, éclaire une décision.</p>
<ul>
<li>Objet.</li>
<li>Contexte.</li>
<li>Analyse (avantages, inconvénients, options).</li>
<li>Recommandation.</li>
<li>Signature.</li>
</ul>
<p><strong>Différences :</strong> la note de service prescrit ; la note technique propose.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Note de service :</strong> communication interne qui informe et prescrit. <strong>Note technique :</strong> analyse qui éclaire une décision.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Choisir le bon type de note. Rester concis. Éviter toute opinion dans la note de service. Structurer la note technique pour éclairer la décision.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Le directeur d'une école de Kinshasa rédige une note de service pour modifier l'horaire des récréations. Le chef de service rédige une note technique sur l'achat de nouveaux ordinateurs, avec analyse des options et recommandation.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qu'est-ce qu'une note de service ? <strong>Ex. 2 :</strong> Quelle est la différence avec la note technique ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Une communication interne qui informe et prescrit. <strong>2)</strong> La note technique analyse et propose ; la note de service informe et prescrit.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La note de service informe et prescrit ; la note technique éclaire et propose.</p></div>

<div class="sources"><strong>Sources :</strong> ENA RDC ; référentiels ScholarVox.</div>
    `
},
{
    title: "Leçon 4 — Le compte rendu et le procès-verbal",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un procès-verbal peut-il être produit en justice alors qu'un compte rendu non ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer compte rendu et procès-verbal. Connaître leur structure. Rédiger chacun selon sa fonction. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Compte rendu :</strong> relation objective d'une réunion ou d'un événement. Il informe les absents et sert de mémoire.</p>
<ul>
<li>Identification (date, lieu, participants).</li>
<li>Ordre du jour.</li>
<li>Résumé des discussions.</li>
<li>Décisions prises.</li>
<li>Signature du rédacteur.</li>
</ul>
<p><strong>Procès-verbal :</strong> document juridique constatant des faits ou des décisions. Il engage les parties.</p>
<ul>
<li>Identification (séance, présents, absents).</li>
<li>Ordre du jour.</li>
<li>Décisions.</li>
<li>Signatures (président et secrétaire).</li>
</ul>
<p><strong>Différences :</strong> le compte rendu informe ; le PV fait foi.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Compte rendu :</strong> relation objective. <strong>Procès-verbal :</strong> constat à valeur juridique. <strong>Rédacteur :</strong> auteur du document.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Ne pas introduire de commentaires personnels dans un compte rendu. Inscrire précisément les décisions dans un PV. Faire signer le PV par les responsables.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Le secrétaire d'une réunion de coordination à la mairie de Lubumbashi rédige un compte rendu (information). Le PV de la réunion est signé par le président et le secrétaire (engagement).</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qu'est-ce qu'un compte rendu ? <strong>Ex. 2 :</strong> Pourquoi le PV doit-il être signé ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Une relation objective d'une réunion. <strong>2)</strong> Parce qu'il constate des décisions qui engagent les parties.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le compte rendu informe ; le procès-verbal fait foi.</p></div>

<div class="sources"><strong>Sources :</strong> ENA RDC ; référentiels ScholarVox.</div>
    `
},
{
    title: "Leçon 5 — Déontologie et confidentialité",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Que risque un agent qui divulgue les informations d'un dossier ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le secret professionnel. Identifier les situations à risque. Adopter une posture éthique. Prérequis : leçons 1 à 4.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Secret professionnel :</strong> obligation de ne pas divulguer les informations dont on a connaissance dans l'exercice de ses fonctions.</p>
<p><strong>Confidentialité :</strong> protection des informations personnelles ou sensibles.</p>
<p><strong>Neutralité :</strong> ne pas faire valoir ses opinions personnelles dans l'écrit administratif.</p>

s exacts. Concision: dire l'essentiel en peu de mots. Objectivité: pas de jugements personnels. Neutralité: pas de prise de position idéologique. Courtoisie: respect du destinataire et de la hiérarchie. Différences: le style littéraire recherche l'effet esthétique; le style commercial vise la relation client; le style administratif vise la régularité et la traçabilité de l'action publique. Définitions. Style administratif: style d'efficacité au service de l'action publique. Concision: dire l'essentiel en peu de mots. Neutralité: absence de prise de position personnelle. Méthodes et règles. Chasser les formules creuses. Vérifier la précision des faits et des dates. Adapter le ton au destinataire et à la hiérarchie. Relire pour éliminer toute ambiguïté. Exemple. Au lieu de « Nous vous prions de bien vouloir trouver ci-joint ce que vous avez demandé », écrire « Vous trouverez ci-joint votre attestation de résidence, demandée le 12 mai. » Le second énoncé est clair, précis et concis. Exercices. Ex. 1: Citer trois caractéristiques du style administratif. Ex. 2: Réécrire en style administratif: « Faites vite, on est pressés. ». Corrigé. 1) Clarté, précision, concision (autres réponses possibles). 2) « Veuillez traiter ce dossier dans les meilleurs délais. ». À retenir. Le style administratif est un style de service: il doit être compris sans effort par le destinataire."]],"3":[["fr","Leçon 2, La lettre administrative: structure et formules. Situation. « Pourquoi la date et les références d'une lettre administrative sont-elles essentielles? ». Objectifs. Connaître les parties de la lettre administrative. Utiliser les formules adaptées. Adapter le ton au destinataire. Prérequis: leçon 1. Théorie. Parties de la lettre administrative: En-tête: identification du service (administration, direction, adresse). Lieu et date. Destinataire: fonction et adresse. Références: numéro de dossier, numéro d'enregistrement. Objet: formulation brève du sujet. Formule d'appel: « Monsieur le Gouverneur, ». Corps: exposé des faits, demande. Formule de courtoisie: « Je vous prie d'agréer, Monsieur le Gouverneur, l'expression de ma haute considération. ». Signature et fonction. Pièces jointes. Dispositions: française (signature à droite) ou administrative (signature au centre). Définitions. Formule d'appel: désignation du destinataire. Formule de courtoisie: formule de clôture. Références: identifiants administratifs de la lettre. Méthodes et règles. Respecter l'ordre des parties. Adapter la formule d'appel à la fonction du destinataire. Éviter les formules trop familières. Soigner la présentation. Exemple. Lettre du bourgmestre d'une commune de Kinshasa convoquant un agent: en-tête de la commune, références (n° 045 sur 2025), objet (« Convocation à un entretien »), formule d'appel (« Monsieur, »), corps (date, heure, lieu), formule de courtoisie, signature. Exercices. Ex. 1: Citer les mentions obligatoires d'une lettre administrative. Ex. 2: Pourquoi la date est-elle essentielle? Corrigé. 1) En-tête, date, destinataire, objet, formule d'appel, corps, formule de courtoisie, signature. 2) Parce qu'elle atteste du moment de l'acte et conditionne les délais de recours. À retenir. La lettre administrative est un document normé: sa régularité formelle conditionne son efficacité."]],"4":[["fr","Leçon 3, La note de service et la note technique. Situation. « Quand faut-il écrire une note plutôt qu'une lettre? ». Objectifs. Distinguer note de service et note technique. Rédiger chacune selon sa structure. Comprendre leur rôle interne. Prérequis: leçons 1 et 2. Théorie. Note de service: communication interne descendante, brève, opérationnelle. Elle informe, rappelle ou prescrit. Objet. Destinataires (services, agents). Contenu concis (instructions, rappels). Date, signature. Note technique: analyse d'un point précis, éclaire une décision. Objet. Contexte. Analyse (avantages, inconvénients, options). Recommandation. Signature. Différences: la note de service prescrit; la note technique propose. Définitions. Note de service: communication interne qui informe et prescrit. Note technique: analyse qui éclaire une décision. Méthodes et règles. Choisir le bon type de note. Rester concis. Éviter toute opinion dans la note de service. Structurer la note technique pour éclairer la décision. Exemple. Le directeur d'une école de Kinshasa rédige une note de service pour modifier l'horaire des récréations. Le chef de service rédige une note technique sur l'achat de nouveaux ordinateurs, avec analyse des options et recommandation. Exercices. Ex. 1: Qu'est-ce qu'une note de service? Ex. 2: Quelle est la différence avec la note technique? Corrigé. 1) Une communication interne qui informe et prescrit. 2) La note technique analyse et propose; la note de service informe et prescrit. À retenir. La note de service informe et prescrit; la note technique éclaire et propose."]],"5":[["fr","Leçon 4, Le compte rendu et le procès-verbal. Situation. « Pourquoi un procès-verbal peut-il être produit en justice alors qu'un compte rendu non? ». Objectifs. Distinguer compte rendu et procès-verbal. Connaître leur structure. Rédiger chacun selon sa fonction. Prérequis: leçons 1 à 3. Théorie. Compte rendu: relation objective d'une réunion ou d'un événement. Il informe les absents et sert de mémoire. Identification (date, lieu, participants). Ordre du jour. Résumé des discussions. Décisions prises. Signature du rédacteur. Procès-verbal: document juridique constatant des faits ou des décisions. Il engage les parties. Identification (séance, présents, absents). Ordre du jour. Décisions. Signatures (président et secrétaire). Différences: le compte rendu informe; le PV fait foi. Définitions. Compte rendu: relation objective. Procès-verbal: constat à valeur juridique. Rédacteur: auteur du document. Méthodes et règles. Ne pas introduire de commentaires personnels dans un compte rendu. Inscrire précisément les décisions dans un PV. Faire signer le PV par les responsables. Exemple. Le secrétaire d'une réunion de coordination à la mairie de Lubumbashi rédige un compte rendu (information). Le PV de la réunion est signé par le président et le secrétaire (engagement). Exercices. Ex. 1: Qu'est-ce qu'un compte rendu? Ex. 2: Pourquoi le PV doit-il être signé? Corrigé. 1) Une relation objective d'une réunion. 2) Parce qu'il constate des décisions qui engagent les parties. À retenir. Le compte rendu informe; le procès-verbal fait foi."]],"6":[["fr","Leçon 5, Déontologie et confidentialité. Situation. « Que risque un agent qui divulgue les informations d'un dossier? ». Objectifs. Comprendre le secret professionnel. Identifier les situations à risque. Adopter une posture éthique. Prérequis: leçons 1 à 4. Théorie. Secret professionnel: obligation de ne pas divulguer les informations dont on a connaissance dans l'exercice de ses fonctions. Confidentialité: protection des informations personnelles ou sensibles. Neutralité: ne pas faire valoir ses opinions personnelles dans l'écrit administratif. Responsabilité: l'auteur et le service engagent leur responsabilité en cas de manquement. Sanctions: disciplinaires (avertissement, blâme, suspension) et pénales selon la gravité. Définitions. Secret professionnel: obligation de confidentialité. Neutralité: absence de position personnelle. Responsabilité: obligation de répondre de ses actes. Méthodes et règles. Ne pas partager un document sans autorisation. Protéger les données personnelles. Rédiger sans jugement de valeur. Signaler les pressions ou les demandes inappropriées. Exemple. Un secrétaire qui divulgue les informations médicales d'un agent viole le secret professionnel et s'expose à des sanctions disciplinaires et pénales. Exercices. Ex. 1: Qu'est-ce que le secret professionnel? Ex. 2: Pourquoi la neutralité est-elle importante dans la rédaction administrative? Corrigé. 1) L'obligation de ne pas divulguer les informations connues dans l'exercice de ses fonctions. 2) Parce que l'écrit administratif doit être impartial et servir l'intérêt général. À retenir. La confidentialité n'est pas une option: c'est un devoir professionnel."]],"7":[["fr","Évaluation finale, Rédaction Administrative. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 12 sur 20, tu as réussi."]]}};

      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
