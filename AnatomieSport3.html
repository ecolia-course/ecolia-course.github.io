const slides = [
{
    title: "Sommaire — Anatomie du Sport 3e année",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours présente les grands systèmes du corps humain (osseux, articulaire, musculaire, cardio-respiratoire) et leurs adaptations à l'effort. Il prépare les futurs enseignants d'EPS à comprendre le fonctionnement du corps, à prévenir les blessures et à adapter les exercices aux capacités des élèves.</p>
<p><strong>Note de transparence :</strong> le cadre de l'option Éducation Physique en Humanités Pédagogiques Rénovées est officiel (programme HPR). Le contenu détaillé de l'anatomie du sport pour la 3e année n'a pas été localisé dans les sources consultées. La progression ci-dessous est une proposition alignée sur les besoins de formation d'un futur enseignant d'EPS, à valider par l'enseignant.</p>
<ul>
<li>Leçon 1 — Introduction : anatomie et sport</li>
<li>Leçon 2 — Le système osseux</li>
<li>Leçon 3 — Le système articulaire</li>
<li>Leçon 4 — Le système musculaire</li>
<li>Leçon 5 — Le système cardio-respiratoire</li>
<li>Leçon 6 — Les adaptations à l'effort</li>
<li>Leçon 7 — Prévention des blessures</li>
<li>Leçon 8 — Synthèse et évaluation</li>
</ul>
<p>Une évaluation finale de 15 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme HPR (cadre général EPS) ; fiches pédagogiques Éducation Physique HP (Édition 2025) ; références générales en anatomie fonctionnelle appliquée au sport.</div>
    `
},
{
    title: "Leçon 1 — Introduction : anatomie et sport",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un enseignant d'EPS doit-il connaître l'anatomie ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre l'utilité de l'anatomie pour l'EPS. Situer les grands systèmes du corps. Distinguer anatomie et physiologie.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Pourquoi l'anatomie en EPS</div>
<ul>
<li><strong>Adapter les exercices</strong> aux capacités réelles des élèves.</li>
<li><strong>Prévenir les blessures</strong> en respectant les limites du corps.</li>
<li><strong>Repérer les signaux d'alerte</strong> (douleur, essoufflement anormal).</li>
<li><strong>Expliquer</strong> les consignes techniques (posture, respiration).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les grands systèmes</div>
<ul>
<li><strong>Système osseux :</strong> charpente du corps, protection des organes.</li>
<li><strong>Système articulaire :</strong> mobilité entre les os.</li>
<li><strong>Système musculaire :</strong> production du mouvement.</li>
<li><strong>Système cardio-respiratoire :</strong> apport d'oxygène et de nutriments aux muscles.</li>
<li><strong>Système nerveux :</strong> commande et coordination des mouvements.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Anatomie et physiologie</div>
<ul>
<li><strong>Anatomie :</strong> étude des structures du corps (os, muscles, organes).</li>
<li><strong>Physiologie :</strong> étude du fonctionnement de ces structures.</li>
</ul>
<p>Les deux se complètent : connaître la structure aide à comprendre la fonction.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois raisons pour lesquelles un enseignant d'EPS doit connaître l'anatomie.</p>
<p><strong>Ex. 2 :</strong> Cite les grands systèmes du corps et leur rôle principal.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Adapter les exercices, prévenir les blessures, expliquer les consignes. <strong>2)</strong> Osseux (charpente), articulaire (mobilité), musculaire (mouvement), cardio-respiratoire (oxygénation).</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'anatomie est un outil professionnel : elle permet d'enseigner l'EPS en sécurité et avec efficacité.</p></div>
<div class="sources"><strong>Sources :</strong> Programme HPR ; références générales.</div>
    `
},
{
    title: "Leçon 2 — Le système osseux",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Combien d'os compte le corps humain et à quoi servent-ils ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les grandes fonctions du squelette. Localiser les principaux os. Comprendre le rôle du squelette dans le mouvement.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Fonctions du squelette</div>
<ul>
<li><strong>Support :</strong> maintient la posture.</li>
<li><strong>Protection :</strong> protège les organes vitaux (crâne, cage thoracique, bassin).</li>
<li><strong>Mouvement :</strong> sert de levier aux muscles.</li>
<li><strong>Réserve :</strong> stocke le calcium et d'autres minéraux.</li>
<li><strong>Fabrication du sang :</strong> la moelle osseuse produit les cellules sanguines.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Principaux os</div>
<ul>
<li><strong>Le crâne :</strong> protège le cerveau.</li>
<li><strong>La colonne vertébrale :</strong> soutient le tronc, protège la moelle épinière.</li>
<li><strong>La cage thoracique :</strong> protège cœur et poumons.</li>
<li><strong>Le bassin :</strong> soutient le tronc, relie les membres inférieurs.</li>
<li><strong>Les membres supérieurs :</strong> humérus, radius, ulna, os de la main.</li>
<li><strong>Les membres inférieurs :</strong> fémur, tibia, péroné, os du pied.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Os et mouvement</div>
<p>Dans un mouvement, les os jouent le rôle de leviers : le muscle tire sur l'os, qui pivote autour d'une articulation. Un os long (fémur, humérus) permet des mouvements amples ; un os court (phalanges) permet des mouvements précis.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois fonctions du squelette.</p>
<p><strong>Ex. 2 :</strong> Localise le fémur et le tibia sur un schéma.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Support, protection, mouvement. <strong>2)</strong> Fémur (cuisse), tibia (jambe).</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le squelette soutient, protège et permet le mouvement : c'est la charpente du corps.</p></div>
<div class="sources"><strong>Sources :</strong> Références d'anatomie fonctionnelle.</div>
    `
},
{
    title: "Leçon 3 — Le système articulaire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi le genou peut-il se plier mais pas la tête ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre ce qu'est une articulation. Distinguer les types d'articulations. Identifier les risques articulaires en sport.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — L'articulation</div>
<p>Une <strong>articulation</strong> est la zone de jonction entre deux os. Elle permet la mobilité. Elle comprend : les surfaces osseuses, le cartilage, la capsule articulaire, les ligaments, la synovie (liquide lubrifiant).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Types d'articulations</div>
<ul>
<li><strong>Articulations fixes (sutures) :</strong> os du crâne.</li>
<li><strong>Articulations semi-mobiles :</strong> vertèbres.</li>
<li><strong>Articulations mobiles :</strong> épaule, hanche, genou, coude.</li>
</ul>
<p>Plus l'articulation est mobile, plus elle est exposée aux blessures.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Risques articulaires en sport</div>
<ul>
<li><strong>Entorse :</strong> étirement ou déchirure d'un ligament (cheville, genou).</li>
<li><strong>Luxation :</strong> déplacement des os (épaule).</li>
<li><strong>Cartilage abîmé :</strong> à long terme, usure articulaire.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les trois grands types d'articulations.</p>
<p><strong>Ex. 2 :</strong> Explique pourquoi une entorse de la cheville est fréquente.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Fixes, semi-mobiles, mobiles. <strong>2)</strong> La cheville est très mobile et supporte le poids du corps ; un faux mouvement peut étirer les ligaments.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les articulations rendent le mouvement possible ; leur mobilité expose à des blessures que l'échauffement et la technique préviennent.</p></div>
<div class="sources"><strong>Sources :</strong> Références d'anatomie fonctionnelle.</div>
    `
},
{
    title: "Leçon 4 — Le système musculaire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certains muscles grossissent-ils quand on s'entraîne ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les types de muscles. Localiser les grands groupes musculaires. Comprendre le principe de la contraction.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Trois types de muscles</div>
<ul>
<li><strong>Muscles squelettiques (striés) :</strong> attachés aux os, sous contrôle volontaire.</li>
<li><strong>Muscle cardiaque :</strong> dans le cœur, involontaire.</li>
<li><strong>Muscles lisses :</strong> parois des organes (estomac, intestin, vaisseaux), involontaires.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Grands groupes musculaires</div>
<ul>
<li><strong>Membres supérieurs :</strong> biceps (fléchit le coude), triceps (étend le coude), deltoïde (élève le bras).</li>
<li><strong>Tronc :</strong> abdominaux, dorsaux, pectoraux.</li>
<li><strong>Membres inférieurs :</strong> quadriceps (étend le genou), ischio-jambiers (fléchit le genou), mollet (extension du pied), fessiers.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La contraction musculaire</div>
<p>Un muscle se contracte lorsque des filaments internes glissent les uns sur les autres : le muscle raccourcit et tire sur l'os. On distingue :</p>
<ul>
<li><strong>Contraction concentrique :</strong> le muscle se raccourcit (lever un poids).</li>
<li><strong>Contraction excentrique :</strong> le muscle s'allonge en résistant (descendre un poids lentement).</li>
<li><strong>Contraction isométrique :</strong> le muscle reste de même longueur (gainage).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les trois types de muscles et une caractéristique de chacun.</p>
<p><strong>Ex. 2 :</strong> Identifie les muscles sollicités lors d'un saut vertical (quadriceps, mollets, fessiers).</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Squelettiques (volontaires), cardiaque (involontaire, cœur), lisses (involontaires, organes). <strong>2)</strong> Quadriceps, mollets, fessiers.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les muscles produisent le mouvement : leur connaissance permet d'adapter les exercices et de prévenir les blessures.</p></div>
<div class="sources"><strong>Sources :</strong> Références d'anatomie fonctionnelle.</div>
    `
},
{
    title: "Leçon 5 — Le système cardio-respiratoire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi le cœur bat-il plus vite pendant l'effort ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Décrire la structure du cœur et des poumons. Comprendre la circulation sanguine. Expliquer la réponse à l'effort.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le cœur</div>
<p>Le cœur est un muscle creux à quatre cavités : deux oreillettes et deux ventricules. Il joue le rôle d'une pompe : il propulse le sang dans tout le corps.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La circulation sanguine</div>
<ul>
<li><strong>Petite circulation :</strong> cœur → poumons → cœur (échanges gazeux).</li>
<li><strong>Grande circulation :</strong> cœur → organes → cœur (apport d'oxygène et de nutriments).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La respiration</div>
<p>Les poumons assurent les échanges gazeux : le sang y prend l'oxygène et y rejette le dioxyde de carbone. La fréquence respiratoire augmente pendant l'effort.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Réponse à l'effort</div>
<ul>
<li><strong>Fréquence cardiaque augmente.</strong></li>
<li><strong>Fréquence respiratoire augmente.</strong></li>
<li><strong>Le sang est redirigé</strong> vers les muscles actifs.</li>
<li><strong>La transpiration</strong> apparaît pour réguler la température.</li>
</ul>
<p>L'enseignant d'EPS surveille ces signes pour adapter l'effort et repérer un éventuel essoufflement anormal.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les quatre cavités du cœur.</p>
<p><strong>Ex. 2 :</strong> Mesure ton pouls au repos et après 30 secondes d'effort, et compare.</p>
<details><summary>Corrigé</summary>
