{
    title: "Leçon 1 — L'entreprise commerciale",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qu'est-ce qu'une entreprise commerciale ? Comment fonctionne-t-elle ? Comment gagne-t-elle de l'argent ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir l'entreprise commerciale. Distinguer les types d'entreprises commerciales. Comprendre leur rôle. Prérequis : notions de l'entreprise (cours n°40, leçon 1).</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'<strong>entreprise commerciale</strong> est une unité économique qui achète des biens pour les revendre, sans transformation (ou avec une transformation limitée : conditionnement, emballage, présentation).</p>
<p>Elle se distingue de l'<strong>entreprise industrielle</strong> (qui transforme des matières premières) et de l'<strong>entreprise de services</strong> (qui produit des services).</p>
<p><strong>Types d'entreprises commerciales :</strong></p>
<ul>
<li>Commerce de gros : achat en grande quantité et revente à des détaillants ou à des professionnels.</li>
<li>Commerce de détail : vente directe au consommateur final.</li>
<li>Commerce intégré : maîtrise de toute la chaîne (achat, stockage, distribution).</li>
<li>Commerce indépendant : entreprise unique, non rattachée à un réseau.</li>
<li>Commerce associé : regroupement de commerçants (franchises, coopératives, groupements).</li>
<li>Grande distribution : supermarchés, hypermarchés, chaînes.</li>
</ul>
<p><strong>Rôle :</strong> mettre à disposition des consommateurs les biens dont ils ont besoin, au bon endroit, au bon moment, au bon prix.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Entreprise commerciale :</strong> entreprise qui achète pour revendre. <strong>Commerce de gros :</strong> revente à des professionnels. <strong>Commerce de détail :</strong> vente au consommateur. <strong>Commerce intégré :</strong> chaîne complète maîtrisée. <strong>Grande distribution :</strong> grandes surfaces.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Analyser le type d'entreprise commerciale : circuit, taille, organisation. Comprendre sa fonction : achat, stockage, vente, service. Identifier ses clients : particuliers ou professionnels.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un magasin de quartier qui vend des produits alimentaires est une entreprise de commerce de détail indépendant. Il achète au marché de gros et revend aux habitants. Une chaîne de supermarchés à Kinshasa est une grande distribution : elle achète en gros et vend au détail à un large public.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis l'entreprise commerciale.</p>

<p><strong>1)</strong> Une entreprise qui achète des biens pour les revendre, sans transformation.</p>
<p><strong>2)</strong> Le gros vend à des professionnels ; le détail vend au consommateur final.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'entreprise commerciale est un acteur essentiel de l'économie ; elle met les biens à la disposition des consommateurs.</p></div>

    `

{
    title: "Leçon 2 — Le circuit économique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment l'argent circule-t-il entre les ménages, les entreprises et l'État ? Qui achète à qui ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le circuit économique. Identifier les acteurs et leurs relations. Situer l'entreprise commerciale dans le circuit. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>circuit économique</strong> est la représentation des échanges entre les agents économiques : les ménages, les entreprises, l'État, les banques, l'extérieur.</p>
<p><strong>Relations :</strong></p>
<ul>
<li>Les ménages fournissent du travail et consomment.</li>
<li>Les entreprises produisent et vendent.</li>
<li>L'État prélève des impôts et fournit des services publics.</li>
<li>Les banques financent et collectent l'épargne.</li>
<li>L'extérieur (étranger) échange (importations/exportations).</li>
</ul>
<p><strong>Flux :</strong> flux réels (biens et services), flux monétaires (argent).</p>
<p>L'<strong>entreprise commerciale</strong> se situe entre les producteurs et les consommateurs. Elle achète aux producteurs (ou aux grossistes) et vend aux détaillants ou aux consommateurs.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Circuit économique :</strong> représentation des échanges. <strong>Agent économique :</strong> acteur de l'économie. <strong>Ménage :</strong> consommateur. <strong>Entreprise :</strong> producteur. <strong>État :</strong> régulateur et fournisseur de services. <strong>Banque :</strong> financeur.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier les agents et leurs fonctions. Suivre les flux (réels et monétaires). Situer l'entreprise commerciale dans le circuit. Comprendre les interdépendances.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un ménage achète du pain. Il paie (flux monétaire) et reçoit du pain (flux réel). Le boulanger utilise l'argent pour payer ses fournisseurs et ses salariés, qui consomment à leur tour. L'argent circule. Une entreprise commerciale importe des marchandises de Dubaï : elle paie (sortie d'argent) et reçoit des marchandises (entrée de biens), puis les revend aux détaillants congolais.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois agents économiques.</p>
<p><strong>Ex. 2 :</strong> Où se situe l'entreprise commerciale dans le circuit ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Ménages, entreprises, État (3 au choix).</p>
<p><strong>2)</strong> Entre les producteurs et les consommateurs ; elle achète pour revendre.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le circuit économique montre l'interdépendance des acteurs ; l'entreprise commerciale est un maillon essentiel.</p></div>

<div class="sources"><strong>Sources :</strong> Curriculum Commerciale et Gestion (RDC) ; Manuel Gestion Commerciale (2025).</div>
    `

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qu'est-ce que la fonction commerciale dans une entreprise ? Quelles sont ses missions ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la fonction commerciale. Identifier ses composantes. Comprendre son rôle dans l'entreprise. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>fonction commerciale</strong> est l'ensemble des activités qui permettent à l'entreprise de vendre ses produits et de satisfaire ses clients.</p>
<p><strong>Composantes :</strong></p>
<ul>
<li><strong>L'étude du marché :</strong> connaître les clients, les concurrents, les tendances.</li>
<li><strong>L'approvisionnement :</strong> acheter les biens ou matières nécessaires.</li>
<li><strong>La vente :</strong> vendre les produits, négocier, conclure.</li>
<li><strong>La distribution :</strong> acheminer les produits vers les clients.</li>
<li><strong>Le service client :</strong> accueillir, informer, fidéliser.</li>
<li><strong>La politique commerciale :</strong> fixer les prix, choisir les canaux, communiquer.</li>
</ul>
<p>La fonction commerciale est transversale : elle concerne tous les services de l'entreprise.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Fonction commerciale :</strong> ensemble des activités liées à la vente. <strong>Marché :</strong> ensemble des clients et concurrents. <strong>Approvisionnement :</strong> achat de biens. <strong>Distribution :</strong> acheminement. <strong>Service client :</strong> relation avec le client. <strong>Politique commerciale :</strong> décisions commerciales.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Analyser le marché avant de décider. Coordonner les composantes de la fonction commerciale. Aligner la fonction commerciale sur la stratégie de l'entreprise. Évaluer les résultats (ventes, satisfaction, parts de marché).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une entreprise de distribution de boissons à Kinshasa étudie le marché, s'approvisionne auprès des producteurs, organise la vente aux détaillants, assure la livraison, gère les réclamations : c'est la fonction commerciale. Une boutique de vêtements ajuste sa politique commerciale selon les saisons, les modes, la concurrence.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qu'est-ce que la fonction commerciale ?</p>
<p><strong>Ex. 2 :</strong> Cite trois composantes de la fonction commerciale.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> L'ensemble des activités qui permettent de vendre et de satisfaire les clients.</p>
<p><strong>2)</strong> Étude du marché, approvisionnement, vente (3 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La fonction commerciale est le moteur de la relation entre l'entreprise et ses clients.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel Gestion Commerciale (2025) ; fiches pédagogiques (2025).</div>
    `

    title: "Leçon 4 — L'achat et l'approvisionnement",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment une entreprise choisit-elle ses fournisseurs ? Que doit-elle vérifier avant d'acheter ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre l'approvisionnement. Connaître les étapes de l'achat. Choisir un fournisseur. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'<strong>approvisionnement</strong> est l'ensemble des opérations qui permettent à l'entreprise de se procurer les biens ou services nécessaires à son activité.</p>
<p><strong>Étapes :</strong></p>
<ol>
<li>Expression du besoin : quoi acheter ? en quelle quantité ? quand ?</li>
<li>Recherche des fournisseurs.</li>
<li>Comparaison des offres : prix, qualité, délais, conditions de paiement, service.</li>
<li>Négociation.</li>
<li>Commande.</li>
<li>Réception et contrôle.</li>
<li>Paiement.</li>
</ol>
<p><strong>Critères de choix :</strong> prix, qualité, fiabilité, délais, service, conditions de paiement, proximité.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Approvisionnement :</strong> ensemble des achats. <strong>Fournisseur :</strong> celui qui vend à l'entreprise. <strong>Commande :</strong> demande d'achat. <strong>Réception :</strong> réception des marchandises. <strong>Négociation :</strong> discussion des conditions.</p>

    title: "Leçon 5 — La gestion des stocks",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une entreprise garde-t-elle des marchandises en réserve ? Comment éviter les ruptures et les surplus ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre l'utilité des stocks. Connaître les types de stocks. Gérer un stock simple. Prérequis : leçon 4.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>stock</strong> est l'ensemble des biens disponibles dans l'entreprise, en attente d'utilisation ou de vente.</p>
<p><strong>Types :</strong></p>
<ul>
<li>Stock de marchandises (pour la revente).</li>
<li>Stock de matières premières (pour la production).</li>
<li>Stock de produits finis (prêts à être vendus).</li>
<li>Stock de fournitures (consommables).</li>
</ul>
<p><strong>Fonctions :</strong> assurer la continuité de l'activité, faire face aux variations de la demande, bénéficier de prix avantageux, se protéger des ruptures.</p>
<p><strong>Gestion :</strong> déterminer le stock minimum (seuil d'alerte), le stock maximum, la quantité économique de commande, le stock de sécurité.</p>
<p><strong>Outils :</strong> fiches de stock, inventaires, logiciels.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Stock :</strong> ensemble des biens disponibles. <strong>Stock minimum :</strong> seuil de réapprovisionnement. <strong>Stock de sécurité :</strong> réserve pour les imprévus. <strong>Inventaire :</strong> comptage des stocks. <strong>Rupture de stock :</strong> absence de produit.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Tenir une fiche de stock par produit. Fixer le stock minimum et le stock de sécurité. Réapprovisionner à temps. Faire l'inventaire régulièrement. Éviter les surplus (coûts de stockage) et les ruptures (perte de clients).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une pharmacie de Kinshasa garde un stock de médicaments essentiels. Elle fixe un stock minimum (par exemple, 20 boîtes de paracétamol). Quand le stock atteint ce seuil, elle commande. Un magasin de vêtements fait l'inventaire à la fin de chaque mois et ajuste ses commandes en fonction des ventes.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qu'est-ce qu'un stock ?</p>
<p><strong>Ex. 2 :</strong> Cite trois types de stocks.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> L'ensemble des biens disponibles dans l'entreprise.</p>
<p><strong>2)</strong> Marchandises, matières premières, produits finis (3 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La gestion des stocks évite les ruptures et les surplus ; elle est essentielle à la rentabilité.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel Gestion Commerciale (2025) ; fiches pédagogiques (2025).</div>
    `
},

    title: "Leçon 6 — Les prix et les marges",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment fixer le prix d'un produit ? Comment calculer le bénéfice réalisé sur une vente ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la formation des prix. Calculer une marge. Fixer un prix de vente. Prérequis : leçons 4 et 5.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>prix d'achat</strong> est le prix payé au fournisseur. Il peut inclure des frais (transport, douane, assurance) : c'est le prix d'achat majoré ou coût d'achat.</p>
<p>Le <strong>prix de vente</strong> est le prix payé par le client.</p>
<p>La <strong>marge</strong> est la différence entre le prix de vente et le prix d'achat :</p>
<ul>
<li>Marge brute = Prix de vente − Prix d'achat.</li>
<li>Marge nette = Marge brute − Frais de gestion.</li>
</ul>
<p>Taux de marge = (Marge / Prix d'achat) × 100.</p>
<p>Taux de marque = (Marge / Prix de vente) × 100.</p>
<p>Le prix de vente doit couvrir le prix d'achat, les frais, la marge bénéficiaire, et les taxes (TVA 16 % en RDC).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Prix d'achat :</strong> prix payé au fournisseur. <strong>Prix de vente :</strong> prix payé par le client. <strong>Marge :</strong> différence entre prix de vente et prix d'achat. <strong>Taux de marge :</strong> marge / prix d'achat. <strong>Taux de marque :</strong> marge / prix de vente. <strong>TVA :</strong> taxe sur la valeur ajoutée (16 % en RDC).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Calculer le coût d'achat (prix d'achat + frais). Fixer la marge bénéficiaire souhaitée. Ajouter la TVA si applicable. Vérifier la compétitivité du prix (concurrence). Ajuster selon le marché.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un commerçant achète un téléphone à 100 000 CDF. Il veut une marge de 20 %. Prix de vente hors taxe = 100 000 + (100 000 × 20 %) = 120 000 CDF. Avec TVA 16 % : 120 000 × 1,16 = 139 200 CDF. Une boutique achète un sac à 20 000 CDF et le revend à 30 000 CDF. Marge = 10 000 CDF. Taux de marge = 10 000 / 20 000 = 50 %.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Prix d'achat = 50 000 ; marge = 10 000. Quel est le prix de vente ?</p>
<p><strong>Ex. 2 :</strong> Calcule le taux de marge.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> 60 000 CDF.</p>
<p><strong>2)</strong> 10 000 / 50 000 = 20 %.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La maîtrise des prix et des marges est essentielle à la rentabilité commerciale.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel Gestion Commerciale (2025) ; Code Général des Impôts (RDC).</div>
    `
},

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qu'est-ce qu'une vente ? Comment se déroule-t-elle ? Pourquoi certains vendeurs réussissent mieux que d'autres ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la vente. Connaître les étapes de la vente. Comprendre la relation client. Prérequis : leçons 1 à 6.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>vente</strong> est l'acte par lequel un vendeur transfère un bien ou un service à un acheteur, en échange d'un prix.</p>
<p><strong>Étapes :</strong></p>
<ol>
<li>Accueil du client.</li>
<li>Découverte de ses besoins.</li>
<li>Présentation du produit.</li>
<li>Traitement des objections.</li>
<li>Conclusion de la vente.</li>
<li>Prise de congé et fidélisation.</li>
</ol>
<p><strong>Qualités du vendeur :</strong> écoute, amabilité, connaissance du produit, persuasion, honnêteté. La relation client transforme la vente en relation durable.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Vente :</strong> transfert d'un bien ou d'un service. <strong>Client :</strong> acheteur. <strong>Objection :</strong> hésitation ou refus. <strong>Fidélisation :</strong> conserver le client. <strong>Relation client :</strong> lien entre vendeur et client.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Écouter le client avant de parler. Connaître le produit. Argumenter selon les besoins. Répondre aux objections avec respect. Conclure la vente et fidéliser.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un vendeur de téléphones accueille un client, lui demande ce qu'il cherche, lui montre deux modèles adaptés, répond à ses inquiétudes, conclut la vente, propose une garantie. Le client est satisfait. Un client hésite sur un prix : le vendeur explique la qualité, compare, propose un paiement échelonné. La vente se conclut.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois étapes de la vente.</p>
<p><strong>Ex. 2 :</strong> Pourquoi la relation client est-elle importante ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Accueil, découverte, conclusion (3 au choix).</p>

</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La vente est un art de la relation ; elle exige écoute, argumentation et honnêteté.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel Gestion Commerciale (2025) ; fiches pédagogiques (2025).</div>

    title: "Leçon 8 — Les techniques de vente",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Quelles techniques un vendeur peut-il utiliser pour convaincre un client ? Peut-on tout faire pour vendre ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les techniques de vente. Les appliquer selon le contexte. Éviter les pratiques trompeuses. Prérequis : leçons 6 et 7.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Techniques de vente :</strong></p>
<ul>
<li>Vente en face à face : contact direct.</li>
<li>Vente à distance : téléphone, internet, réseaux sociaux.</li>
<li>Vente en libre-service : le client se sert lui-même.</li>
<li>Vente promotionnelle : promotions, soldes, réductions.</li>
<li>Vente en réunion : présentation à un groupe (réunion Tupperware).</li>
<li>Vente par correspondance : catalogue, e-commerce.</li>
</ul>
<p><strong>Techniques d'argumentation :</strong></p>
<ul>
<li>Argumenter avec des preuves (qualité, prix, garantie).</li>
<li>Traiter les objections (reconnaître, reformuler, répondre).</li>
<li>Proposer un choix limité (deux options, plutôt que trop).</li>
<li>Créer l'urgence (offre limitée), sans être mensonger.</li>
</ul>
<p><strong>Éthique :</strong> ne pas tromper, ne pas faire de fausses promesses, ne pas forcer.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Technique de vente :</strong> méthode utilisée pour vendre. <strong>Vente à distance :</strong> vente à distance. <strong>Promotion :</strong> réduction temporaire. <strong>Objection :</strong> hésitation. <strong>Éthique commerciale :</strong> honnêteté.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Connaître son produit et son marché. Adapter la technique au contexte. Respecter le client. Utiliser l'argumentation honnête. Éviter les techniques trompeuses.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un vendeur sur WhatsApp utilise la vente à distance : il envoie des photos, des descriptions, répond aux questions, fixe un rendez-vous pour la livraison. Un vendeur de cosmétiques organise une réunion Tupperware : il présente les produits à un groupe de femmes, répond aux questions, propose des réductions. La vente est collective et conviviale.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite deux techniques de vente.</p>
<p><strong>Ex. 2 :</strong> Pourquoi faut-il éviter les pratiques trompeuses ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Vente en face à face, vente à distance (2 au choix).</p>

</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les techniques de vente sont variées ; elles doivent toujours respecter le client et la loi.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel Gestion Commerciale (2025) ; fiches pédagogiques (2025).</div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>

<li><strong>Circuit direct :</strong> producteur → consommateur (vente directe, marchés, e-commerce).</li>

<li><strong>Circuit long :</strong> producteur → grossiste → détaillant → consommateur (deux intermédiaires ou plus).</li>

<p><strong>Fonctions :</strong> transport, stockage, fractionnement, présentation, information, service.</p>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La distribution est un maillon essentiel de la chaîne commerciale ; elle doit être choisie avec soin.</p></div>

  var PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
  var DL = '<svg viewBox="0 0 24 24"><path d="M11 3h2v9.2l3.6-3.6L18 10l-6 6-6-6 1.4-1.4L11 12.2V3zM5 19h14v2H5z"/></svg>';
  var OK = '<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';
  try {
    if (typeof questions !== "undefined" && questions && questions.forEach) {
      questions.forEach(function (q) {
        if (!q.options) q.options = q.opts || q.choices || q.choix || q.reponses || q.propositions || [];
        if (q.text === undefined) q.text = q.question || q.q || q.enonce || q.titre || "";

  var synth = window.speechSynthesis || null;
  var HAS_CACHE = !!(window.caches && window.caches.open);
  var NATIVE = false;
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  var LATER = "ecolia_audio_later_" + CFG.code;
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function init() {
    if (document.getElementById("ecolia-audio-btn")) return;
    var btn = document.createElement("button");
    btn.id = "ecolia-audio-btn"; btn.type = "button"; btn.className = "ecolia-off";
    btn.setAttribute("aria-label", "Écouter la leçon"); btn.innerHTML = PLAY;
    var dlBtn = document.createElement("button");
    dlBtn.id = "ecolia-dl-btn"; dlBtn.type = "button"; dlBtn.className = "ecolia-off";
    dlBtn.innerHTML = DL;
    var host = document.querySelector(".header-right");
    if (host) { host.insertBefore(dlBtn, host.firstChild); host.insertBefore(btn, dlBtn); }
    else { btn.className += " ecolia-fixed"; document.body.appendChild(btn); }
    var banner = document.createElement("div");
    banner.id = "ecolia-audio-banner";
    banner.innerHTML = '<span class="eab-txt"></span><span class="eab-act"></span><div class="eab-bar"><i></i></div>';
    var content = document.getElementById("content");
    if (content && content.parentNode) content.parentNode.insertBefore(banner, content);
    else document.body.insertBefore(banner, document.body.firstChild);
    var txtEl = banner.querySelector(".eab-txt"), actEl = banner.querySelector(".eab-act");
    var barEl = banner.querySelector(".eab-bar"), barI = barEl.firstChild;
    var audio = new Audio();
    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }
    function cur() { try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {} return 0; }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }

            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }

        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }

    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);

          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;

        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }

      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }

      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);

        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }

            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));

      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });

      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);

})();
