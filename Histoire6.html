<script>
const COURSE_TITLE = "Histoire · 4e secondaire";
const slides = [
{
    title: "Histoire — 4e secondaire — Sommaire général",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours prépare l'EXETAT (4e secondaire). Il comprend 12 leçons, suivies d'un quiz de révision.</p>
<ul>
<li>Leçon 1 — Les grandes civilisations anciennes</li>
<li>Leçon 2 — La traite négrière atlantique</li>
<li>Leçon 3 — La colonisation de l'Afrique</li>
<li>Leçon 4 — La Première Guerre mondiale (1914-1918)</li>
<li>Leçon 5 — La Deuxième Guerre mondiale (1939-1945)</li>
<li>Leçon 6 — L'indépendance de la RDC (1960)</li>
<li>Leçon 7 — Les autres indépendances africaines</li>
<li>Leçon 8 — La guerre froide (1947-1991)</li>
<li>Leçon 9 — L'Afrique post-indépendance : défis et dictatures</li>
<li>Leçon 10 — La RDC contemporaine (1997-2025)</li>
<li>Leçon 11 — Le monde depuis 1991 : mondialisation</li>
<li>Évaluation finale — Items EXETAT</li>
</ul>
</div>
`
},
{
    title: "Leçon 1 — Les grandes civilisations anciennes",
    content: `
        <div class="bloc cas">
            <div class="bloc-label">Situation</div>
            <p>Tu visites un musée. Devant toi : des hiéroglyphes égyptiens gravés dans la pierre, des statues grecques au corps parfait, des pièces romaines couvertes d'inscriptions latines. Une question te vient : comment ces peuples ont-ils pu, il y a des milliers d'années, construire des pyramides, écrire des lois, inventer la démocratie ?</p>
        </div>

        <h3>1. La Mésopotamie — berceau de l'écriture</h3>
        <div class="bloc theorie">
            <div class="bloc-label">Théorie</div>
            <p>Entre le Tigre et l'Euphrate (l'Irak actuel), vers 3500 av. J.-C., naissent les premières villes : Ur, Uruk, Babylone. Les Sumériens inventent l'<strong>écriture cunéiforme</strong> pour compter les récoltes. C'est la première écriture de l'humanité. Le roi Hammurabi y grave ensuite un code de lois célèbre.</p>
        </div>

        <h3>2. L'Égypte des pharaons</h3>
        <div class="bloc theorie">
            <div class="bloc-label">Théorie</div>
            <p>Le long du Nil, vers 3000 av. J.-C., un royaume puissant se construit. Le <strong>pharaon</strong> est considéré comme un dieu vivant. Les Égyptiens inventent les <strong>hiéroglyphes</strong>, construisent les pyramides de Gizeh, développent la médecine, l'astronomie et l'irrigation.</p>
        </div>

        <h3>3. La Grèce — la naissance de la démocratie</h3>
        <div class="bloc theorie">
            <div class="bloc-label">Théorie</div>
            <p>Vers 800 av. J.-C., les cités grecques (Athènes, Sparte, Corinthe) se développent. Athènes invente la <strong>démocratie</strong> : les citoyens votent les lois. Socrate, Platon, Aristote posent les bases de la <strong>philosophie</strong>. Les Jeux olympiques rassemblent les cités.</p>
        </div>

        <h3>4. Rome — de la cité à l'empire</h3>
        <div class="bloc theorie">
            <div class="bloc-label">Théorie</div>
            <p>Fondée en 753 av. J.-C., Rome devient une république, puis un empire immense (de l'Écosse à l'Égypte). Les Romains inventent le <strong>droit romain</strong>, construisent des routes, des aqueducs, des thermes. Le latin devient la langue de l'Occident.</p>
        </div>

        <h3>5. Les civilisations africaines</h3>
        <div class="bloc theorie">
            <div class="bloc-label">Théorie</div>
            <p>L'Afrique n'est pas en reste. La <strong>Nubie</strong> rivalise avec l'Égypte. Le royaume du <strong>Kongo</strong> développe une organisation politique raffinée. L'empire du <strong>Mali</strong> (Mansa Moussa) est l'un des plus riches du monde au XIVe siècle. Le <strong>Grand Zimbabwe</strong> construit des murailles de pierre impressionnantes.</p>
        </div>

        <div class="bloc resume">
            <div class="bloc-label">À retenir</div>
            <p>Mésopotamie, Égypte, Grèce, Rome et les grandes civilisations africaines ont posé les bases de notre monde : écriture, démocratie, droit, philosophie, urbanisme. Chacune a apporté quelque chose d'essentiel.</p>
        </div>

        <div class="sources">
            <strong>Sources :</strong> Programme national d'histoire RDC (EPST), UNESCO, OpenStax World History (CC BY).
        </div>
    `
},
{
    title: "Leçon 2 — La traite négrière atlantique",
    content: `
        <div class="bloc cas">
            <div class="bloc-label">Situation</div>
            <p>Nous sommes au XVe siècle, sur la côte du royaume Kongo. Des navires portugais accostent. Les capitaines ne viennent pas seulement chercher de l'or et de l'ivoire. Ils viennent chercher des hommes. Des millions d'Africains seront arrachés à leur terre et déportés vers les Amériques. C'est le début de la <strong>traite négrière atlantique</strong>.</p>
        </div>

        <h3>1. Le commerce triangulaire</h3>
        <div class="bloc theorie">
            <div class="bloc-label">Théorie</div>
            <p>Un circuit en trois étapes relie trois continents :</p>
            <ul>
                <li><strong>Europe → Afrique :</strong> armes, tissus, alcool échangés contre des captifs.</li>
                <li><strong>Afrique → Amériques :</strong> traversée de l'Atlantique dans des conditions inhumaines (le « passage du milieu »).</li>
                <li><strong>Amériques → Europe :</strong> sucre, coton, café, tabac produits par les esclaves.</li>
            </ul>
        </div>

        <h3>2. L'ampleur du drame</h3>
        <div class="bloc theorie">
            <div class="bloc-label">Théorie</div>
            <p>Entre le XVe et le XIXe siècle, plus de <strong>12 millions d'Africains</strong> sont déportés. Des millions d'autres meurent pendant la capture ou la traversée. Les régions les plus touchées : Sénégambie, Golfe du Bénin, Angola, Congo.</p>
        </div>

        <h3>3. Le rôle du royaume Kongo</h3>
        <div class="bloc exemple">
            <div class="bloc-label">Exemple</div>
            <p>Le roi Afonso Ier du Kongo écrit au roi du Portugal en 1526 pour dénoncer les ravages de la traite dans son royaume. Mais les pressions économiques sont trop fortes. Le Kongo finit par s'effondrer au XVIIe siècle, miné par les guerres internes et la déportation massive de sa population.</p>
        </div>

        <h3>4. Les conséquences durables</h3>
        <div class="bloc theorie">
            <div class="bloc-label">Théorie</div>
            <p>La traite a dépeuplé des régions entières d'Afrique, désorganisé les sociétés, enrichi l'Europe et bâti l'économie des Amériques. Ses effets se font encore sentir aujourd'hui, notamment dans les inégalités entre continents.</p>
        </div>

        <div class="bloc resume">
            <div class="bloc-label">À retenir</div>
            <p>La traite négrière atlantique a duré quatre siècles et déporté plus de 12 millions d'Africains. C'est l'une des plus grandes tragédies de l'histoire humaine, et son impact modèle encore les relations entre continents.</p>
        </div>

        <div class="sources">
            <strong>Sources :</strong> Programme national d'histoire RDC, UNESCO, Adam Hochschild, <em>Les fantômes du roi Léopold</em>.
        </div>
    `
},
{
    title: "Leçon 3 — La colonisation de l'Afrique",
    content: `
        <div class="bloc cas">
            <div class="bloc-label">Situation</div>
            <p>Novembre 1884. Dans un salon de Berlin, quatorze pays européens sont réunis. Sur une immense carte d'Afrique posée sur la table, des diplomates tracent des lignes droites avec des règles. Aucun Africain n'est présent. En quelques jours, le continent est partagé. C'est la <strong>conférence de Berlin</strong>.</p>
        </div>

        <h3>1. Pourquoi l'Afrique ?</h3>
        <div class="bloc theorie">
            <div class="bloc-label">Théorie</div>
            <p>Trois raisons principales poussent l'Europe à coloniser :</p>
            <ul>
                <li><strong>Économique :</strong> matières premières (caoutchouc, ivoire, cuivre, diamants) et nouveaux marchés.</li>
                <li><strong>Politique :</strong> prestige national, rivalités entre puissances (France, Royaume-Uni, Allemagne, Belgique, Portugal).</li>
                <li><strong>Idéologique :</strong> discours raciste prétendant « civiliser » l'Afrique.</li>
            </ul>
        </div>

        <h3>2. La conférence de Berlin (1884-1885)</h3>
        <div class="bloc theorie">
            <div class="bloc-label">Théorie</div>
            <p>Organisée par Bismarck, elle fixe les règles du partage. Les puissances se reconnaissent mutuellement leurs « droits » sur des territoires. La France prend l'Afrique de l'Ouest et du Nord, le Royaume-Uni l'Est et le Sud, le Portugal l'Angola et le Mozambique, l'Allemagne le Cameroun et la Namibie. Le Congo est attribué au roi <strong>Léopold II de Belgique</strong>.</p>
        </div>

        <h3>3. Le Congo de Léopold II</h3>
        <div class="bloc exemple">
            <div class="bloc-label">Exemple</div>
            <p>De 1885 à 1908, Léopold II règne en propriétaire absolu sur un territoire de 2,3 millions de km². Il exploite le caoutchouc et l'ivoire au prix d'une violence extrême : mains coupées, prises d'otages, villages brûlés. On estime à <strong>10 millions</strong> le nombre de morts. Sous la pression internationale, la Belgique reprend la colonie en 1908.</p>
        </div>

        <h3>4. Les résistances africaines</h3>
        <div class="bloc theorie">
            <div class="bloc-label">Théorie</div>
            <p>L'Afrique n'a pas accepté passivement. Plusieurs figures s'opposent à la colonisation :</p>
            <ul>
                <li><strong>Kimpa Vita</strong> (Congo, 1704) : prophétesse, brûlée vive pour hérésie.</li>
                <li><strong>Samory Touré</strong> (Guinée) : résiste 30 ans à la France.</li>
                <li><strong>Ménélik II</strong> (Éthiopie) : remporte la bataille d'Adoua (1896) et empêche la colonisation italienne.</li>
                <li><strong>Révolte des Batetela</strong> (Congo belge, 1895-1908) : mutineries violentes contre les abus.</li>
            </ul>
        </div>

        <div class="bloc resume">
            <div class="bloc-label">À retenir</div>
            <p>En 1885, les puissances européennes se partagent l'Afrique à Berlin, sans consulter les Africains. Le Congo devient propriété privée de Léopold II, puis colonie belge. Les résistances africaines, nombreuses, seront toutes réprimées.</p>
        </div>

        <div class="sources">
            <strong>Sources :</strong> Programme national d'histoire RDC, UNESCO, Adam Hochschild.
        </div>
    `
},
{
    title: "Leçon 4 — La Première Guerre mondiale (1914-1918)",
    content: `
        <div class="bloc cas">
            <div class="bloc-label">Situation</div>
            <p>28 juin 1914, Sarajevo. L'archiduc François-Ferdinand d'Autriche est assassiné. En quelques semaines, l'Europe entière s'embrase. Ce qui devait être un conflit local devient la première guerre industrielle de l'histoire, impliquant soldats européens et africains mobilisés par leurs métropoles.</p>
        </div>

        <h3>1. Les causes du conflit</h3>
        <div class="bloc theorie">
            <div class="bloc-label">Théorie</div>
            <ul>
                <li><strong>Nationalismes</strong> : rivalités entre France, Allemagne, Autriche-Hongrie, Russie.</li>
                <li><strong>Course aux armements</strong> : chaque pays veut une armée plus forte.</li>
                <li><strong>Rivalités coloniales</strong> : partage de l'Afrique et d'Asie.</li>
                <li><strong>Système d'alliances</strong> : Triple-Entente vs Triple-Alliance.</li>
            </ul>
        </div>

        <h3>2. Une guerre de position</h3>
        <div class="bloc theorie">
            <div class="bloc-label">Théorie</div>
            <p>Après une guerre de mouvement en 1914, le front se fige. Les soldats s'enterrent dans des <strong>tranchées</strong> boueuses, séparées de quelques centaines de mètres. Assauts, mitrailleuses, gaz, chars : la guerre devient industrielle et meurtrière.</p>
        </div>

        <h3>3. La participation africaine</h3>
        <div class="bloc exemple">
            <div class="bloc-label">Exemple</div>
            <p>Plus d'un million de soldats africains sont mobilisés par la France et le Royaume-Uni : tirailleurs sénégalais, congolais, marocains, algériens. Beaucoup combattent en Europe. Après la guerre, leur sacrifice ne sera pas récompensé : la colonisation continue.</p>
        </div>

        <h3>4. Bilan et conséquences</h3>
        <div class="bloc theorie">
            <div class="bloc-label">Théorie</div>
            <p>Bilan : environ <strong>10 millions de militaires morts</strong>, 20 millions de blessés et de civils. Quatre empires s'effondrent : allemand, austro-hongrois, ottoman, russe. Le traité de Versailles (1919) impose à l'Allemagne de lourdes réparations, préparant la revanche de 1939.</p>
        </div>

        <div class="bloc resume">
            <div class="bloc-label">À retenir</div>
            <p>La Première Guerre mondiale (1914-1918) a impliqué le monde entier, y compris l'Afrique. Guerre de tranchées, bilan humain désastreux, effondrement des empires. Ses conséquences préparent directement la Seconde Guerre mondiale.</p>
        </div>

        <div class="sources">
            <strong>Sources :</strong> Programme national d'histoire RDC, OpenStax US History (CC BY).
        </div>
    `
},
{
    title: "Leçon 5 — La Deuxième Guerre mondiale (1939-1945)",
    content: `
        <div class="bloc cas">
            <div class="bloc-label">Situation</div>
            <p>1er septembre 1939. Les chars allemands franchissent la frontière polonaise. Hitler veut dominer l'Europe. Six ans plus tard, 60 millions de morts, un génocide industriel, deux bombes atomiques. Le monde ne s'en relèvera jamais tout à fait.</p>
        </div>

        <h3>1. Les causes</h3>
        <div class="bloc theorie">

const nextBtn = document.getElementById('nextBtn');
const slideCounterSpan = document.getElementById('slideCounter');
const progressFill = document.getElementById('progressFill');
const counterSpan = document.getElementById('counter');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchNav = document.getElementById('searchNav');
const prevResultBtn = document.getElementById('prevResultBtn');
const nextResultBtn = document.getElementById('nextResultBtn');
const resultCounterSpan = document.getElementById('resultCounter');
const pageTitle = document.getElementById('pageTitle');
pageTitle.textContent = "ECOLIA · " + COURSE_TITLE;
document.title = "ECOLIA — " + COURSE_TITLE;
function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';
    slideCounterSpan.textContent = '0/0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>

<script>
(function () {
  var SITE = "https://ecolia-course.github.io/";
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface", page servie par https://app.local
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function abs(u) { return /^(https?:|data:|blob:)/i.test(u) ? u : (NATIVE ? SITE + u.replace(/^(\.\/|\/)+/, "") : u); }
  function ext(u) { var m = String(u).split("?")[0].match(/\.(jpe?g|png|gif|webp|svg)$/i); return m ? m[1].toLowerCase() : "jpg"; }
  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {
    if (queued[fn]) return;
    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
    if (!queue.length) { running = false; return; }
    if (!navigator.onLine) { running = false; return; }
    var q = queue.shift(), t0 = Date.now();
    try { CoursInterface.download(q[0], q[1]); } catch (e) { return setTimeout(next, 500); }
    (function wait() {
      var ok = false;
      try { ok = !!CoursInterface.exists(q[1]); } catch (e) {}
      if (ok) setTimeout(next, 1500);
      else if (Date.now() - t0 > 40000) next();
      else setTimeout(wait, 700);
    })();
  }
  function exists(fn) { try { return !!CoursInterface.exists(fn); } catch (e) { return false; } }

  function show(img) {                                    // affiche UNE image (appelé à chaque slide affichée)
    if (!table || img.getAttribute("data-ecolia-done")) return;
    var id = img.getAttribute("data-image-id");
    var url = table[id];
    if (typeof url !== "string" || !url.length) { console.warn("ECOLIA : image absente du JSON :", id); return; }
    img.setAttribute("data-ecolia-done", "1");
    if (!NATIVE) { img.onerror = function () { hide(img); }; img.setAttribute("src", url); return; }
    var full = abs(url), fn = "img_" + id + "." + ext(url);
    if (exists(fn)) {                                     // déjà sur l'appareil : lecture locale, sans internet
      img.onerror = function () {                         // fichier incomplet : on le supprime et on utilise le site
        try { CoursInterface["delete"](fn); } catch (e) {}
        queued[fn] = 0;
        img.onerror = function () { hide(img); };
        img.setAttribute("src", full);
      };
      img.setAttribute("src", "https://app.local/cours/" + fn);
    } else {
      img.onerror = function () { hide(img); };
      img.setAttribute("src", full);
      enqueue(full, fn);
    }
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches("img[data-image-id]")) show(root);
    root.querySelectorAll("img[data-image-id]").forEach(show);
  }
  function prefetchAll() {                                // APK : prépare TOUTES les images du cours pour le hors-ligne
    var ids = {};
    try { JSON.stringify(slides).replace(/data-image-id=\\?"([^"\\]+)/g, function (m, id) { ids[id] = 1; }); } catch (e) {}
    Object.keys(ids).forEach(function (id) {
      var url = table[id];
      if (typeof url !== "string" || !url.length) return;
      var fn = "img_" + id + "." + ext(url);
      if (!exists(fn)) enqueue(abs(url), fn);
    });
  }
  function start(tbl) {
    table = tbl;
    scan(document.body);
    new MutationObserver(function (muts) {                // les slides sont écrites à la volée : on traite chaque nouvelle image
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
    if (NATIVE) prefetchAll();
  }

  var JSON_URL = NATIVE ? SITE + "images_ecolia.json" : "images_ecolia.json";
  var KEY = "ecolia_images_json";
  fetch(JSON_URL, NATIVE ? { cache: "no-cache" } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (table) { if (NATIVE) lsSet(KEY, JSON.stringify(table)); start(table); })
    .catch(function (e) {
      var saved = null;
      if (NATIVE) { try { saved = JSON.parse(lsGet(KEY) || "null"); } catch (x) {} }
      if (saved) start(saved);                              // hors ligne dans l'APK : JSON gardé la dernière fois
      else console.warn("ECOLIA : JSON des images indisponible.", e);
    });
})();
</script>
