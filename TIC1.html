const COURSE_TITLE = "Informatique et TIC";
const slides = [
{
    title: "Sommaire — Informatique et TIC (1re secondaire)",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours t'apprend à utiliser un ordinateur, à chercher une information sur Internet, à envoyer un courriel et à créer un document. Tu apprendras aussi à te protéger et à agir de manière responsable en ligne. Même sans ordinateur à la maison, tu peux suivre ce cours : les schémas et les activités papier t'aideront à comprendre.</p>
<ul>
<li>Leçon 1 — Qu'est-ce que l'informatique et les TIC ?</li>
<li>Leçon 2 — L'ordinateur et ses composants</li>
<li>Leçon 3 — Les périphériques d'entrée et de sortie</li>
<li>Leçon 4 — Le système d'exploitation et le bureau</li>
<li>Leçon 5 — Fichiers, dossiers et organisation des données</li>
<li>Leçon 6 — Sécurité, santé et bonnes pratiques</li>
<li>Leçon 7 — Internet : notions de base</li>
<li>Leçon 8 — Navigateurs, moteurs de recherche et sites web</li>
<li>Leçon 9 — La messagerie électronique</li>
<li>Leçon 10 — Le traitement de texte (Microsoft Word)</li>
<li>Leçon 11 — Initiation à la programmation</li>
<li>Leçon 12 — Numérique, éthique et métiers de demain</li>
</ul>
<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme national d'Informatique (MEPST/DIPROMAD, 2007), Savoirs Essentiels TIC (2022), Plan National du Numérique « Horizon 2025 ». Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 1 — Qu'est-ce que l'informatique et les TIC ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un téléphone qui calcule, une radio qui diffuse les nouvelles, un ordinateur qui affiche un texte : tous traitent des informations. Qu'est-ce que cela signifie ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir l'informatique et les TIC. Distinguer information, traitement et automatisation. Citer des domaines d'application. Prérequis : aucun.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Informatique :</strong> contraction d'« information » et « automatique ». C'est la science du traitement automatique de l'information à l'aide de machines (ordinateurs, téléphones, tablettes).</p>
<p><strong>TIC (Technologies de l'Information et de la Communication) :</strong> ensemble des technologies qui permettent de produire, stocker, traiter, transmettre et diffuser l'information (ordinateurs, réseaux, Internet, téléphonie mobile, radio, télévision).</p>
<p>L'informatique n'est pas seulement l'ordinateur : elle englobe les programmes, les réseaux, les données et les usages.</p>
</div>
<img src="images/TIC1_1.jpg" alt="Schéma de la chaîne informatique" data-image-id="TIC1_1" onerror="this.style.display='none'">

<h3>3. Méthodes et repères</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Un système informatique comporte trois grandes fonctions : entrer l'information (saisie), traiter l'information (calcul), sortir l'information (affichage, transmission).</p>
<p>Les TIC reposent sur trois piliers : le matériel, les logiciels et les réseaux.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> Dans un cybercafé de Kinshasa, un élève saisit un texte (entrée), l'ordinateur le met en forme (traitement), puis il l'imprime (sortie). C'est une chaîne informatique simple.</p>
</div>
<img src="images/TIC1_16.jpg" alt="Cybercafé à Kinshasa" data-image-id="TIC1_16" onerror="this.style.display='none'">

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'informatique et les TIC traitent l'information de façon automatique ; elles touchent tous les domaines de la vie sociale.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'Informatique (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 2 — L'ordinateur et ses composants",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qu'y a-t-il à l'intérieur d'un ordinateur ? Pourquoi certains ordinateurs sont-ils plus rapides que d'autres ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir un ordinateur. Distinguer matériel et logiciel. Identifier les composants internes essentiels.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un <strong>ordinateur</strong> est un appareil électronique programmable qui traite automatiquement des informations.</p>
<p><strong>Matériel (hardware) :</strong> parties physiques (unité centrale, écran, clavier, carte mère, processeur, mémoire).</p>
<p><strong>Logiciel (software) :</strong> programmes et applications qui donnent des instructions au matériel.</p>
<p><strong>Composants internes :</strong> le processeur (CPU) exécute les calculs ; la mémoire vive (RAM) stocke temporairement les données ; le disque dur (ou SSD) stocke durablement les données.</p>
</div>
<img src="images/TIC1_2.jpg" alt="Intérieur d'un ordinateur de bureau" data-image-id="TIC1_2" onerror="this.style.display='none'">
<img src="images/TIC1_3.jpg" alt="Carte mère d'ordinateur" data-image-id="TIC1_3" onerror="this.style.display='none'">

<h3>3. Méthodes et repères</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Distinguer ce qui se voit (écran, clavier) et ce qui est interne (processeur, RAM, disque dur).</p>
<p>Ne pas confondre mémoire vive (temporaire, perdue à l'extinction) et disque dur (permanent, conservé).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la différence entre matériel et logiciel ?</p>
<p><strong>Corrigé :</strong> Le matériel est l'ensemble des composants physiques ; le logiciel est l'ensemble des programmes.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un ordinateur combine matériel et logiciel ; ses composants internes assurent le traitement de l'information.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'Informatique (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 3 — Les périphériques d'entrée et de sortie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pour écrire un texte, on utilise le clavier. Pour voir le résultat, on utilise l'écran. Comment appelle-t-on ces appareils qui communiquent avec l'ordinateur ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Classer les périphériques. Distinguer entrée, sortie et entrée-sortie. Choisir le périphérique adapté à une tâche.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un <strong>périphérique</strong> est un appareil relié à l'ordinateur pour communiquer avec lui.</p>
<p><strong>Entrée :</strong> ils envoient des informations vers l'ordinateur (clavier, souris, microphone, scanner).</p>
<p><strong>Sortie :</strong> ils restituent les informations traitées (écran, imprimante, haut-parleurs).</p>
<p><strong>Entrée-sortie :</strong> ils font les deux (écran tactile, modem, clé USB).</p>
</div>
<img src="images/TIC1_4.jpg" alt="Clavier, souris, écran et imprimante" data-image-id="TIC1_4" onerror="this.style.display='none'">

<h3>3. Méthodes et procédures</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Classer un périphérique : se demander « dans quel sens circule l'information ? ». De l'utilisateur vers l'ordinateur = entrée ; de l'ordinateur vers l'utilisateur = sortie ; les deux = entrée-sortie.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Classe ces périphériques : clavier, imprimante, écran tactile, souris, haut-parleurs.</p>
<p><strong>Corrigé :</strong> Entrée : clavier, souris ; sortie : imprimante, haut-parleurs ; entrée-sortie : écran tactile.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les périphériques permettent à l'ordinateur de communiquer avec l'extérieur ; les classer aide à choisir le bon outil.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'Informatique (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 4 — Le système d'exploitation et le bureau",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Quand on allume un ordinateur, que se passe-t-il avant qu'on puisse travailler ? Qu'est-ce qui affiche le bureau et les icônes ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir un système d'exploitation. Identifier les éléments du bureau. Utiliser les fonctions de base (démarrer, ouvrir, fermer).</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>système d'exploitation (OS)</strong> est le logiciel principal qui gère le matériel et permet aux autres programmes de fonctionner. Il organise les fichiers, gère la mémoire et les périphériques.</p>
<p>Exemples : Microsoft Windows, Linux, Android, macOS.</p>
<p>Le <strong>bureau</strong> est l'écran principal après le démarrage : il contient les icônes, la barre des tâches, le bouton Démarrer et la zone de notification.</p>
</div>
<img src="images/TIC1_5.jpg" alt="Bureau du système d'exploitation Windows" data-image-id="TIC1_5" onerror="this.style.display='none'">

<h3>3. Méthodes et procédures</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Démarrer un programme : cliquer sur le bouton Démarrer ➔ choisir le programme ➔ cliquer.</p>
<p>Éteindre correctement l'ordinateur : Démarrer ➔ Arrêter (ne pas couper brutalement l'alimentation).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Pourquoi faut-il éteindre correctement l'ordinateur ?</p>
<p><strong>Corrigé :</strong> Pour éviter de perdre des données et d'endommager le système.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le système d'exploitation est le chef d'orchestre de l'ordinateur ; le bureau est l'espace de travail de l'utilisateur.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'Informatique (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 5 — Fichiers, dossiers et organisation des données",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Si tu enregistres tous tes devoirs pêle-mêle sur le bureau, que se passera-t-il ? Comment retrouver un fichier quand on en a beaucoup ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Distinguer fichier et dossier. Comprendre l'arborescence. Créer, renommer, copier, déplacer et supprimer des fichiers.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un <strong>fichier</strong> est un ensemble de données enregistré sous un nom et une extension (ex. : devoir.docx). L'extension indique le type de fichier.</p>
<p>Un <strong>dossier</strong> (ou répertoire) est un conteneur qui regroupe des fichiers et d'autres dossiers.</p>
<p>L'<strong>arborescence</strong> est la structure en forme d'arbre qui organise les dossiers et fichiers.</p>
</div>
<img src="images/TIC1_6.jpg" alt="Arborescence de fichiers et dossiers" data-image-id="TIC1_6" onerror="this.style.display='none'">

<h3>3. Méthodes et procédures</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p><strong>Créer un dossier :</strong> clic droit ➔ Nouveau ➔ Dossier.</p>
<p><strong>Renommer :</strong> clic droit ➔ Renommer.</p>
<p><strong>Copier / Déplacer :</strong> Ctrl+C / Ctrl+X puis Ctrl+V.</p>
<p><strong>Supprimer :</strong> sélectionner ➔ Suppr (corbeille).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Que signifie l'extension .docx ?</p>
<p><strong>Corrigé :</strong> Elle indique un document de traitement de texte (Word).</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Organiser ses fichiers et dossiers est une compétence de base sans laquelle on perd du temps et des données.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'Informatique (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 6 — Sécurité, santé et bonnes pratiques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un élève reçoit un message qui lui annonce qu'il a gagné un téléphone et lui demande son mot de passe. Que doit-il faire ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Identifier les risques numériques. Adopter des gestes de protection. Prévenir les risques pour la santé.</p>

          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
