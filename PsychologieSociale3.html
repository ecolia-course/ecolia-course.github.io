<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours étudie l'individu dans son contexte social : attitudes et préjugés, dynamique des groupes, mécanismes d'influence, relations intergroupes et phénomènes collectifs. Il outille le futur technicien social pour analyser les situations de groupe et intervenir avec justesse.</p>
<p><strong>Note de transparence :</strong> le plan s'appuie sur les fiches pédagogiques officielles de Psychologie Sociale 3e année, option Techniques Sociales (Édition 2025), qui structurent le cours en trois parties : l'individu dans le contexte social, la dynamique des groupes, les relations intergroupes et phénomènes collectifs. L'outil central est le sociogramme. La progression ci-dessous suit cette structure attestée.</p>
<ul>
<li>Leçon 1 — Qu'est-ce que la psychologie sociale ?</li>

<li>Leçon 5 — Structure et dynamique du groupe</li>
<li>Leçon 6 — Rôles, statuts et normes</li>
<li>Leçon 7 — L'influence sociale : conformisme, obéissance</li>
<li>Leçon 8 — Le sociogramme : construction et lecture</li>
<li>Leçon 9 — Relations intergroupes : coopération et conflit</li>
<li>Leçon 10 — Communication de masse : rumeurs et propagande</li>
<li>Leçon 11 — Synthèse et évaluation</li>
</ul>
<p>Une évaluation finale de 18 questions couvre l'ensemble des leçons.</p>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles Psychologie Sociale 3e Techniques Sociales (Édition 2025) ; références générales en psychologie sociale.</div>
    `
},
{
    title: "Leçon 1 — Qu'est-ce que la psychologie sociale ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une personne se comporte-t-elle différemment seule et en groupe ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la psychologie sociale. La distinguer de la sociologie et de la psychologie générale. Situer son objet.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>La <strong>psychologie sociale</strong> étudie la manière dont les pensées, les émotions et les comportements d'un individu sont influencés par la présence réelle, imaginaire ou symbolique d'autres personnes. Elle s'intéresse à l'<strong>influence réciproque</strong> entre l'individu et son contexte social.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Psychologie sociale et sociologie</div>
<ul>
<li><strong>Psychologie sociale :</strong> analyse <em>micro-sociale</em> — l'individu en situation, les petits groupes, les interactions.</li>
<li><strong>Sociologie :</strong> analyse <em>macro-sociale</em> — les structures, les institutions, les classes sociales, les grandes transformations.</li>
</ul>
<p>Les deux disciplines se complètent : la psychologie sociale éclaire les mécanismes individuels qui font fonctionner (ou dysfonctionner) les structures sociales.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Psychologie sociale et psychologie générale</div>
<ul>
<li><strong>Psychologie générale :</strong> étudie les processus intrapsychiques (perception, mémoire, intelligence) indépendamment de la situation sociale.</li>
<li><strong>Psychologie sociale :</strong> étudie ces mêmes processus <em>en situation sociale</em> — comment la présence d'autrui les modifie.</li>
</ul>
<p>Exemple : la psychologie générale étudie la mémoire ; la psychologie sociale étudie la mémoire en groupe (témoignage collectif, fausses reconnaissances collectives).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Distingue psychologie sociale et sociologie.</p>
<p><strong>Ex. 2 :</strong> Classe ces questions selon la discipline : « Comment un groupe prend-il une décision ? » / « Comment évoluent les classes sociales en RDC ? » / « Comment la présence d'autres modifie-t-elle mon jugement ? ».</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Psychologie sociale : micro-sociale ; sociologie : macro-sociale. <strong>2)</strong> Décision de groupe et jugement en présence d'autrui : psychologie sociale ; évolution des classes sociales : sociologie.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La psychologie sociale étudie l'individu en situation sociale ; elle se distingue de la sociologie (macro) et de la psychologie générale (intrapsychique).</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques 3e TS ; références générales.</div>
    `
},
{
    title: "Leçon 2 — L'attitude : composantes et changement",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une personne peut-elle penser une chose, ressentir une autre et agir d'une troisième façon ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir l'attitude. Identifier ses trois composantes. Comprendre les conditions du changement d'attitude.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>Une <strong>attitude</strong> est une prédisposition stable à évaluer un objet (personne, groupe, idée) d'une certaine manière et à agir en conséquence. Elle oriente la perception et le comportement.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les trois composantes</div>
<ul>
<li><strong>Cognitive :</strong> ce que je crois savoir de l'objet (« cette personne est travailleuse »).</li>
<li><strong>Affective :</strong> ce que je ressens à son égard (sympathie, méfiance).</li>
<li><strong>Comportementale :</strong> ma tendance à agir (l'aider, l'éviter).</li>
</ul>
<p>Les trois composantes ne sont pas toujours cohérentes : un écart entre elles produit un malaise (dissonance) qui peut pousser à modifier l'attitude.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le changement d'attitude</div>
<p>Une attitude peut changer sous l'effet de :</p>
<ul>
<li>l'expérience directe ;</li>
<li>la persuasion (message convaincant, source crédible) ;</li>
<li>la pression du groupe ;</li>
<li>une contradiction interne (dissonance).</li>
</ul>
<p>Le changement est plus facile quand la personne est active, concernée et en confiance avec la source du message.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les trois composantes de l'attitude.</p>
<p><strong>Ex. 2 :</strong> Donne un exemple de changement d'attitude par la persuasion.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Cognitive, affective, comportementale. <strong>2)</strong> Une campagne de sensibilisation bien menée peut modifier les croyances et les comportements.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une attitude combine croyances, émotions et tendances à agir ; son changement dépend de plusieurs facteurs.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques 3e TS ; références générales.</div>
    `
},
{
    title: "Leçon 3 — Les préjugés et stéréotypes",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi dit-on parfois du mal d'un groupe entier sans le connaître ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir stéréotype, préjugé et discrimination. Comprendre leurs origines. Identifier les moyens de les combattre.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Trois notions à distinguer</div>
<ul>
<li><strong>Stéréotype :</strong> croyance simplifiée et généralisée sur un groupe (« les X sont… »).</li>
<li><strong>Préjugé :</strong> jugement <em>a priori</em>, souvent affectif, porté sur un groupe ou une personne du fait de son appartenance.</li>
<li><strong>Discrimination :</strong> comportement concret de traitement inégal (refus d'embauche, moquerie, exclusion).</li>
</ul>
<p>Stéréotype (croyance) → Préjugé (jugement) → Discrimination (acte) : ces trois niveaux s'enchaînent souvent.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Origines</div>
<ul>
<li><strong>Socialisation :</strong> transmission familiale et culturelle.</li>
<li><strong>Catégorisation :</strong> tendance naturelle à classer (nous / eux).</li>
<li><strong>Ignorance :</strong> absence de contact avec le groupe concerné.</li>
<li><strong>Conformisme :</strong> adhésion aux préjugés du groupe d'appartenance.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Combattre les préjugés</div>
<ul>
<li>Connaître l'autre par le contact direct.</li>
<li>Éduquer à la pensée critique.</li>
<li>Favoriser la coopération entre groupes.</li>
<li>Sanctionner les discriminations.</li>
<li>Donner la parole aux personnes concernées.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Distingue stéréotype, préjugé et discrimination.</p>
<p><strong>Ex. 2 :</strong> Propose deux moyens de combattre un préjugé dans une école.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Stéréotype : croyance ; préjugé : jugement ; discrimination : acte. <strong>2)</strong> Contact direct, éducation à la critique.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Stéréotypes, préjugés et discriminations s'enchaînent ; on les combat par le contact, l'éducation et la sanction.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques 3e TS ; références générales.</div>
    `
},
{
    title: "Leçon 4 — La perception sociale",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi jugeons-nous une personne sur son apparence avant même de lui parler ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la perception sociale. Identifier les biais les plus courants. Réduire les erreurs de jugement.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>La <strong>perception sociale</strong> est le processus par lequel nous formons un jugement sur une personne ou un groupe à partir d'informations limitées. Elle est rapide, souvent automatique, et dépend des attentes et des stéréotypes.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Biais fréquents</div>
<ul>
<li><strong>Effet de halo :</strong> une qualité positive (ou négative) influence le jugement global.</li>
<li><strong>Première impression :</strong> les premières informations pèsent plus lourd.</li>
<li><strong>Biais de confirmation :</strong> on retient ce qui confirme nos attentes.</li>
<li><strong>Attribution causale :</strong> tendance à attribuer les actes d'autrui à sa personnalité, les nôtres à la situation.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Réduire les biais</div>
<ul>
<li>Prendre le temps d'observer.</li>
<li>Chercher des informations contradictoires.</li>
<li>Distinguer ce que je sais et ce que je suppose.</li>
<li>Se méfier de la première impression.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois biais de perception sociale.</p>
<p><strong>Ex. 2 :</strong> Comment lutter contre l'effet de halo dans le jugement d'un élève ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Effet de halo, première impression, biais de confirmation. <strong>2)</strong> Évaluer séparément chaque compétence et observer plusieurs situations.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La perception sociale est rapide et biaisée ; on la corrige par l'observation, l'examen des faits et l'auto-critique.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques 3e TS.</div>
    `
},
{
    title: "Leçon 5 — Structure et dynamique du groupe",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certains groupes fonctionnent-ils bien et d'autres pas ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre ce qu'est un groupe. Identifier ses phases. Repérer les phénomènes de groupe.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le groupe</div>
<p>Un <strong>groupe</strong> est un ensemble de personnes qui interagissent, partagent des buts, se perçoivent comme membres et sont reconnues comme telles. Il se distingue d'une foule (agrégat sans interaction durable).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les phases</div>
<ul>
<li><strong>Formation :</strong> découverte mutuelle, prudence.</li>
<li><strong>Tempête :</strong> tensions, désaccords, ajustements.</li>
<li><strong>Normes :</strong> règles et rôles se stabilisent.</li>
<li><strong>Performance :</strong> le groupe travaille efficacement.</li>
<li><strong>Dissolution :</strong> fin et bilan.</li>
</ul>
<p>Ces phases sont normales : les traverser fait grandir le groupe.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Phénomènes de groupe</div>
<ul>
<li><strong>Conformisme :</strong> tendance à s'aligner sur la majorité.</li>
<li><strong>Polarisation :</strong> le groupe renforce les positions initiales.</li>
<li><strong>Pensée de groupe :</strong> besoin d'unanimité qui étouffe les critiques.</li>
<li><strong>Paresse sociale :</strong> certains se démobilisent quand le groupe est grand.</li>
</ul>
</div>

        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
