    title: "Leçon 1 — Introduction à l'anatomie et à la physiologie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève infirmier de Kinshasa dissèque un cœur de porc au laboratoire. Il observe les cavités, les valvules, les vaisseaux. Son professeur lui explique que la structure (anatomie) est indissociable de la fonction (physiologie). Comprendre le corps humain est la base de tout soin.</p></div>
<h3>1. Définition et vocabulaire</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Anatomie</strong> : science qui étudie la structure du corps humain (os, muscles, organes).</li><li><strong>Physiologie</strong> : science qui étudie le fonctionnement des organes et systèmes.</li><li><strong>Anatomie topographique</strong> : étude par régions (tête, tronc, membres).</li><li><strong>Anatomie systématique</strong> : étude par systèmes (digestif, respiratoire, circulatoire).</li><li><strong>Position anatomique de référence</strong> : debout, face à l'observateur, bras le long du corps, paumes vers l'avant.</li></ul></div>
<h3>2. Les niveaux d'organisation du corps</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Cellule</strong> : unité de base du vivant.</li><li><strong>Tissu</strong> : ensemble de cellules semblables (épithélial, conjonctif, musculaire, nerveux).</li><li><strong>Organe</strong> : ensemble de tissus accomplissant une fonction (cœur, foie, poumon).</li><li><strong>Système</strong> : ensemble d'organes concourant à une même fonction (digestif, respiratoire).</li><li><strong>Organisme</strong> : ensemble des systèmes formant l'être vivant.</li></ul></div>
<h3>3. Les régions du corps</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Tête</strong> : crâne, face.</li><li><strong>Cou</strong> : relie la tête au tronc.</li><li><strong>Tronc</strong> : thorax, abdomen, bassin.</li><li><strong>Membres supérieurs</strong> : bras, avant-bras, main.</li><li><strong>Membres inférieurs</strong> : cuisse, jambe, pied.</li></ul></div>
<h3>4. Les cavités du corps</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Cavité crânienne</strong> : contient le cerveau.</li><li><strong>Cavité thoracique</strong> : contient le cœur et les poumons.</li><li><strong>Cavité abdominale</strong> : contient l'estomac, le foie, les intestins.</li><li><strong>Cavité pelvienne</strong> : contient la vessie, les organes génitaux.</li><li><strong>Diaphragme</strong> : muscle qui sépare le thorax de l'abdomen.</li><li><strong>Péritoine, plèvre, péricarde</strong> : membranes qui tapissent les cavités.</li></ul><p><a href="https://www.youtube.com/results?search_query=introduction+anatomie+physiologie+niveaux+organisation" target="_blank" rel="noopener">🎥 Recherche : introduction à l'anatomie (chaînes de cours d'anatomie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'anatomie étudie la structure du corps, la physiologie son fonctionnement. Le corps s'organise en niveaux : cellule, tissu, organe, système, organisme. Les principales cavités sont crânienne, thoracique, abdominale et pelvienne.</p></div>
<div class="sources"><strong>Sources :</strong> Programme réformé d'Anatomie-Physiologie, Ministère de la Santé (RDC) ; OpenStax Anatomy & Physiology (CC BY).<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, MSP.</div>
    `

    title: "Leçon 2 — Le système osseux (squelette)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À l'hôpital de Kananga, un accidenté de la route présente une fracture ouverte du fémur. L'infirmière immobilise le membre, le médecin réduit la fracture. Pour comprendre ces gestes, il faut connaître le squelette, ses os et leurs rôles.</p></div>
<h3>1. Rôle du squelette</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Support</strong> : soutient le corps et maintient sa forme.</li><li><strong>Protection</strong> : protège les organes vitaux (crâne → cerveau, cage thoracique → cœur, poumons).</li><li><strong>Mouvement</strong> : les os servent de leviers aux muscles.</li><li><strong>Hématopoïèse</strong> : la moelle osseuse produit les cellules sanguines.</li><li><strong>Réserve de calcium</strong> : les os stockent le calcium et le phosphore.</li></ul></div>
<h3>2. Les os du corps humain</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>206 os</strong> chez l'adulte (nombre variable selon les auteurs).</li><li><strong>Squelette axial</strong> : crâne (8 os), face (14 os), vertèbres (33), côtes (24), sternum, os hyoïde.</li><li><strong>Squelette appendiculaire</strong> : membres supérieurs (64 os), membres inférieurs (62 os), ceintures scapulaire et pelvienne.</li><li><strong>Types d'os</strong> : longs (fémur, humérus), courts (poignet, cheville), plats (crâne, omoplate), irréguliers (vertèbres).</li></ul></div>
<h3>3. Structure d'un os long</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Diaphyse</strong> : corps de l'os, formé d'os compact.</li><li><strong>Épiphyses</strong> : extrémités, formées d'os spongieux.</li><li><strong>Métaphyse</strong> : zone de croissance entre diaphyse et épiphyse.</li><li><strong>Périoste</strong> : membrane qui entoure l'os.</li><li><strong>Moelle osseuse</strong> : rouge (hématopoïèse) ou jaune (réserve graisseuse).</li></ul></div>
<h3>4. Les articulations</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Articulations fixes</strong> : sutures du crâne.</li><li><strong>Articulations semi-mobiles</strong> : vertèbres, côtes.</li><li><strong>Articulations mobiles (diarthroses)</strong> : épaule, coude, hanche, genou. Composées de cartilage, capsule, membrane synoviale, ligaments.</li><li><strong>Types de mouvement</strong> : flexion, extension, abduction, adduction, rotation, circumduction.</li><li><strong>Exemple clinique</strong> : une entorse est un étirement des ligaments ; une luxation est un déplacement des surfaces articulaires.</li></ul><p><a href="https://www.youtube.com/results?search_query=système+osseux+squelette+os+articulations" target="_blank" rel="noopener">🎥 Recherche : le système osseux (chaînes de cours d'anatomie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le squelette compte 206 os. Il assure le support, la protection, le mouvement, l'hématopoïèse et la réserve de calcium. Les os longs ont une diaphyse et deux épiphyses. Les articulations sont fixes, semi-mobiles ou mobiles.</p></div>
<div class="sources"><strong>Sources :</strong> Programme réformé d'Anatomie-Physiologie, Ministère de la Santé (RDC).</div>
    `
},
{
    title: "Leçon 3 — Le système musculaire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un footballeur de Kinshasa ressent une douleur brutale à la cuisse après un sprint : c'est une déchirure musculaire. Pour comprendre cette blessure, il faut connaître les muscles, leurs types et leur fonctionnement.</p></div>
<h3>1. Les types de muscles</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Muscles squelettiques (striés)</strong> : attachés aux os, mouvement volontaire.</li><li><strong>Muscles lisses</strong> : parois des viscères (estomac, intestin, vaisseaux), mouvement involontaire.</li><li><strong>Muscle cardiaque</strong> : strié mais involontaire, propre au cœur.</li><li>Le corps compte environ 600 muscles.</li></ul></div>
<h3>2. Structure d'un muscle squelettique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Ventre</strong> : partie charnue, contractile.</li><li><strong>Tendons</strong> : extrémités fibreuses, attachent le muscle à l'os.</li><li><strong>Origine</strong> : point fixe d'attache (le plus souvent proximal).</li><li><strong>Insertion</strong> : point mobile d'attache (le plus souvent distal).</li><li><strong>Myosine et actine</strong> : protéines contractiles.</li></ul></div>
<h3>3. La contraction musculaire</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Stimulus nerveux</strong> : arrive par le motoneurone.</li><li><strong>Libération de calcium</strong> : par le réticulum sarcoplasmique.</li><li><strong>Glissement des filaments</strong> : la myosine tire l'actine → raccourcissement du muscle.</li><li><strong>Énergie</strong> : ATP (produit par la respiration cellulaire).</li><li><strong>Relâchement</strong> : retour du calcium, retour au repos.</li></ul></div>
<h3>4. Les principales masses musculaires</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Tête et cou</strong> : muscles masticateurs (masséter), muscles du cou (sterno-cléido-mastoïdien).</li><li><strong>Tronc</strong> : pectoraux, abdominaux, dorsaux, intercostaux, diaphragme.</li><li><strong>Membres supérieurs</strong> : deltoïde, biceps, triceps, fléchisseurs et extenseurs des doigts.</li><li><strong>Membres inférieurs</strong> : quadriceps, ischio-jambiers, adducteurs, mollet (triceps sural).</li><li><strong>Pathologies</strong> : claquage, déchirure, crampe, contracture, courbature.</li></ul><p><a href="https://www.youtube.com/results?search_query=système+musculaire+muscles+contraction" target="_blank" rel="noopener">🎥 Recherche : le système musculaire (chaînes de cours d'anatomie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Il existe trois types de muscles : squelettiques (volontaires), lisses (involontaires) et cardiaque. Un muscle squelettique possède un ventre, des tendons, une origine et une insertion. La contraction résulte du glissement de la myosine sur l'actine.</p></div>
<div class="sources"><strong>Sources :</strong> Programme réformé d'Anatomie-Physiologie, Ministère de la Santé (RDC).</div>
    `
},
{
    title: "Leçon 4 — Le système cardiovasculaire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une salle d'urgence à Kinshasa, un patient fait un infarctus du myocarde. L'infirmière prépare les médicaments, surveille le pouls, la tension, l'ECG. Le cœur est un muscle infatigable : 100 000 battements par jour, 5 litres de sang pompés par minute. Le connaître est vital.</p></div>
<h3>1. Le cœur</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Situation</strong> : au centre du thorax, légèrement à gauche.</li><li><strong>4 cavités</strong> : oreillette droite (OD), oreillette gauche (OG), ventricule droit (VD), ventricule gauche (VG).</li><li><strong>Valvules</strong> : tricuspide (entre OD-VD), mitrale (entre OG-VG), sigmoïdes (aortique et pulmonaire).</li><li><strong>Péricarde</strong> : enveloppe qui protège le cœur.</li><li><strong>Poids</strong> : 250-300 g.</li></ul></div>
<h3>2. La circulation sanguine</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Petite circulation (pulmonaire)</strong> : VD → artère pulmonaire → poumons (hématose) → veines pulmonaires → OG.</li><li><strong>Grande circulation (systémique)</strong> : VG → aorte → tout le corps → veines caves → OD.</li><li><strong>Artères</strong> : vaisseaux qui partent du cœur (sang riche en O2 sauf artère pulmonaire).</li><li><strong>Veines</strong> : vaisseaux qui ramènent au cœur (sang pauvre en O2 sauf veines pulmonaires).</li><li><strong>Capillaires</strong> : lieu des échanges avec les tissus.</li></ul></div>
<h3>3. Le cycle cardiaque</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Systole auriculaire</strong> : contraction des oreillettes.</li><li><strong>Systole ventriculaire</strong> : contraction des ventricules → éjection du sang.</li><li><strong>Diastole</strong> : relâchement, remplissage.</li><li><strong>Fréquence normale</strong> : 60-100 battements/minute.</li><li><strong>Débit cardiaque</strong> : FC × volume d'éjection systolique (≈ 5 L/min).</li></ul></div>
<h3>4. Le sang et ses composants</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Plasma</strong> : 55 % (eau, protéines, sels, nutriments).</li><li><strong>Globules rouges (hématies)</strong> : transport de l'oxygène via l'hémoglobine.</li><li><strong>Globules blancs (leucocytes)</strong> : défense immunitaire.</li><li><strong>Plaquettes (thrombocytes)</strong> : coagulation.</li><li><strong>Groupes sanguins ABO</strong> : A, B, AB, O.</li><li><strong>Facteur rhésus</strong> : Rh+ ou Rh−.</li><li><strong>Pression artérielle</strong> : 120/80 mmHg (normale).</li></ul><p><a href="https://www.youtube.com/results?search_query=système+cardiovasculaire+cœur+circulation+sang" target="_blank" rel="noopener">🎥 Recherche : le système cardiovasculaire (chaînes de cours d'anatomie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le cœur possède 4 cavités et 4 valvules. La petite circulation va du cœur aux poumons ; la grande circulation du cœur au reste du corps. Le sang contient plasma, globules rouges, globules blancs et plaquettes. La pression artérielle normale est de 120/80 mmHg.</p></div>
<div class="sources"><strong>Sources :</strong> Programme réformé d'Anatomie-Physiologie, Ministère de la Santé (RDC).</div>
    `

{
    title: "Leçon 5 — Le système respiratoire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À Kinshasa, un enfant est admis aux urgences avec une détresse respiratoire. L'infirmière constate une fréquence de 40 cycles/minute, des sifflements, un tirage. Elle commence immédiatement l'oxygénothérapie. Comprendre le système respiratoire est essentiel pour agir vite.</p></div>
<h3>1. Les voies respiratoires</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Voies supérieures</strong> : nez, bouche, pharynx, larynx.</li><li><strong>Voies inférieures</strong> : trachée, bronches, bronchioles, alvéoles.</li><li><strong>Poumons</strong> : deux poumons (droit : 3 lobes ; gauche : 2 lobes).</li><li><strong>Plèvre</strong> : membrane qui entoure les poumons.</li><li><strong>Diaphragme</strong> : muscle principal de la respiration.</li></ul></div>
<h3>2. La mécanique respiratoire</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Inspiration</strong> : contraction du diaphragme et des muscles intercostaux → augmentation du volume thoracique → entrée d'air.</li><li><strong>Expiration</strong> : relâchement des muscles → diminution du volume thoracique → sortie d'air.</li><li><strong>Fréquence normale</strong> : 12-20 cycles/min (adulte).</li><li><strong>Volume courant</strong> : 500 mL environ.</li><li><strong>Capacité vitale</strong> : 4-5 L.</li></ul></div>
<h3>3. Les échanges gazeux</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Alvéoles</strong> : lieu des échanges gazeux (300 millions d'alvéoles).</li><li><strong>Hématose</strong> : passage de l'O2 de l'air vers le sang, du CO2 du sang vers l'air.</li><li><strong>Diffusion</strong> : selon les gradients de pression partielle.</li><li><strong>Transport de l'O2</strong> : lié à l'hémoglobine (oxyhémoglobine).</li><li><strong>Transport du CO2</strong> : dissous dans le plasma, lié à l'hémoglobine (carbhémoglobine), sous forme de bicarbonates.</li></ul></div>
<h3>4. Pathologies respiratoires fréquentes</h3>

function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');

    }
}

    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>
</body>
</html>
