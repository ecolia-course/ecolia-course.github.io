    title: "Leçon 1 — Introduction à la didactique : concepts et relation avec la pédagogie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une école de Kinshasa, un enseignant stagiaire prépare une leçon sur les fractions. Il se demande : « Comment faire pour que mes élèves comprennent ? » Cette question centrale est celle de la didactique. Mais qu'est-ce que la didactique, et comment se distingue-t-elle de la pédagogie ?</p></div>
<h3>1. Définition et objet de la didactique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Didactique</strong> : science qui étudie les processus d'enseignement-apprentissage en lien avec un contenu de savoir.</li><li><strong>Objet</strong> : la relation entre l'enseignant, l'élève et le savoir.</li><li><strong>Question centrale</strong> : « Comment faire pour que l'élève apprenne ceci ? »</li><li><strong>Transposition didactique</strong> (Yves Chevallard) : processus par lequel un savoir savant devient un savoir enseignable.</li></ul></div>
<h3>2. Distinction entre didactique et pédagogie</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Pédagogie générale</strong> : se focalise sur la relation éducative, l'organisation de la vie de la classe, le développement global de l'élève.</li><li><strong>Question de la pédagogie</strong> : « Comment éduquer cet élève ? »</li><li><strong>Didactique</strong> : se focalise sur le processus d'enseignement-apprentissage en lien avec un contenu précis.</li><li><strong>Question de la didactique</strong> : « Comment faire pour que l'élève apprenne ceci ? »</li><li>La didactique étudie le système entier (triangle didactique), tandis que la pédagogie se concentre davantage sur l'axe Enseignant-Élève.</li></ul></div>
<h3>3. Le triangle didactique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Triangle didactique</strong> (Michel Develay) : trois pôles en interaction.</li><li><strong>L'enseignant</strong> : celui qui organise les situations d'apprentissage.</li><li><strong>L'élève</strong> : celui qui apprend, construit ses connaissances.</li><li><strong>Le savoir</strong> : le contenu à enseigner, transformé en objet d'enseignement.</li><li><strong>Relation didactique</strong> : interactions entre ces trois pôles.</li><li><strong>Contrat didactique</strong> : ensemble des attentes réciproques entre l'enseignant et les élèves.</li></ul></div>
<h3>4. Applications en classe</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Un enseignant de mathématiques à Lubumbashi prépare une leçon sur les pourcentages. Il utilise des exemples concrets : calculer le bénéfice d'un vendeur de maïs au marché. C'est la transposition didactique : le savoir mathématique abstrait devient un savoir enseignable, contextualisé dans la réalité congolaise.</p><p><a href="https://www.youtube.com/results?search_query=didactique+définition+triangle+didactique+transposition" target="_blank" rel="noopener">🎥 Recherche : introduction à la didactique (chaînes de cours de pédagogie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La didactique étudie le processus enseignement-apprentissage d'un contenu précis. Elle se distingue de la pédagogie par son objet et sa question centrale. Le triangle didactique (enseignant-élève-savoir) et la transposition didactique sont des concepts fondamentaux.</p></div>
<div class="sources"><strong>Sources :</strong> Programme National de Didactique Générale, 4e année des Humanités Pédagogiques (MEPST/DIPROMAD, 2025), Fiches pédagogiques officielles (manuels-scolaires-rdc.com).<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, HP, HPR.</div>
    `

{
    title: "Leçon 2 — Les principes didactiques et les lois de l'enseignement",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une classe de 80 élèves à Kinshasa, un enseignant débutant essaie d'enseigner les sciences. Il se demande : « Quels principes dois-je respecter pour que mon enseignement soit efficace ? » Les principes didactiques lui donnent les réponses.</p></div>
<h3>1. Les principes didactiques fondamentaux</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Principe d'activité</strong> : l'élève apprend mieux ce qu'il fait ou découvre par lui-même.</li><li><strong>Principe d'intuition</strong> : toutes les connaissances entrent par les sens. Il faut partir du concret avant l'abstrait.</li><li><strong>Principe d'intérêt</strong> : tout besoin tend à pousser l'individu à le satisfaire. L'enseignant doit susciter l'intérêt.</li><li><strong>Principe de progression</strong> : aller du simple au complexe, du connu à l'inconnu, du particulier au général.</li><li><strong>Principe d'adaptation</strong> : adapter l'enseignement au niveau des élèves, à leur milieu, à leur âge.</li><li><strong>Principe de motivation</strong> : créer le désir d'apprendre avant de commencer.</li></ul></div>
<h3>2. Les lois de l'enseignement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Loi de l'activité</strong> : ce que l'enfant fait ou trouve par lui-même est mieux assimilé.</li><li><strong>Loi de l'intuition</strong> : l'enfant voit le tout avant de voir les parties.</li><li><strong>Loi du besoin</strong> : tout besoin tend à pousser l'individu à le satisfaire.</li><li><strong>Loi du présent</strong> : l'enfant vit dans le présent, il oublie vite le passé et ignore encore le futur.</li><li><strong>Loi de l'adaptation</strong> : l'enseignement doit être adapté à la nature de l'enfant.</li></ul></div>
<h3>3. Les procédés didactiques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Déduction</strong> : application des règles, des lois à des cas particuliers (du général au particulier).</li><li><strong>Induction</strong> : de l'observation des cas particuliers à la règle générale.</li><li><strong>Analyse</strong> : division d'un tout en ses différentes parties.</li><li><strong>Synthèse</strong> : reconstitution du tout décomposé.</li><li><strong>Comparaison</strong> : rapprochement de deux objets ou phénomènes.</li></ul></div>
<h3>4. Applications pédagogiques</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Un enseignant de Kisangani veut enseigner le cycle de l'eau en 4e année primaire. Il commence par une observation concrète : faire chauffer de l'eau et observer la vapeur. C'est le principe d'intuition. Ensuite, il amène les élèves à formuler la règle générale : c'est l'induction.</p><p><a href="https://www.youtube.com/results?search_query=principes+didactiques+lois+enseignement+procédés" target="_blank" rel="noopener">🎥 Recherche : les principes didactiques (chaînes de cours de pédagogie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les principes didactiques (activité, intuition, intérêt, progression, adaptation, motivation) et les lois de l'enseignement guident l'action de l'enseignant. Les procédés (déduction, induction, analyse, synthèse) sont les moyens de les mettre en œuvre.</p></div>
<div class="sources"><strong>Sources :</strong> Programme National de Didactique Générale, 4e année HP (MEPST/DIPROMAD, 2025), Fiches pédagogiques officielles (manuels-scolaires-rdc.com).</div>
    `
},
{
    title: "Leçon 3 — La planification didactique et la fiche de préparation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève-maître de Mbandaka doit préparer sa première leçon. Son tuteur lui dit : « Sans fiche de préparation, tu improvises. Et improviser, c'est échouer. » La planification est l'outil cardinal de l'enseignant.</p></div>
<h3>1. Les documents de planification</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Programme national</strong> : document officiel qui fixe les contenus et les compétences.</li><li><strong>Prévisions des matières</strong> : répartition annuelle et mensuelle des leçons.</li><li><strong>Journal de classe</strong> : registre des leçons effectivement données.</li><li><strong>Fiche de préparation</strong> : scénario détaillé d'une leçon.</li><li><strong>Cahier de textes</strong> : recueil des textes étudiés.</li></ul></div>
<h3>2. La fiche de préparation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>En-tête</strong> : école, classe, effectif, date, matière, durée.</li><li><strong>Sujet</strong> : titre de la leçon.</li><li><strong>Objectifs opérationnels</strong> : formulés avec un verbe d'action, mesurables.</li><li><strong>Matériel didactique</strong> : supports nécessaires.</li><li><strong>Prérequis</strong> : connaissances antérieures nécessaires.</li><li><strong>Déroulement</strong> : étapes de la leçon (activités initiales, principales, de fixation, de contrôle).</li><li><strong>Bibliographie</strong> : sources utilisées.</li></ul></div>
<h3>3. Structure d'une leçon</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Activités initiales</strong> : rappel, motivation, introduction.</li><li><strong>Activités principales</strong> : analyse, synthèse (découverte du savoir).</li><li><strong>Activités de fixation</strong> : exercices, applications.</li><li><strong>Activités de contrôle</strong> : évaluation des acquis.</li><li>Au secondaire, une leçon dure 45 minutes (15 min introduction et application, 30 min pour le reste).</li></ul></div>
<h3>4. Exemple de fiche de préparation</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><strong>Fiche de préparation — Mathématiques 4e année primaire</strong></p><ul><li>École : Institut de Kinshasa ; Classe : 4e ; Effectif : 45.</li><li>Sujet : La multiplication par 10.</li><li>Objectif : À la fin de la leçon, l'élève sera capable de multiplier un nombre par 10.</li><li>Matériel : tableau noir, craies, bâtonnets.</li><li>Prérequis : addition répétée.</li><li>Déroulement : rappel (5 min), découverte (15 min), fixation (15 min), contrôle (10 min).</li></ul><p><a href="https://www.youtube.com/results?search_query=fiche+de+préparation+didactique+planification" target="_blank" rel="noopener">🎥 Recherche : la planification didactique (chaînes de cours de pédagogie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La planification didactique repose sur le programme, les prévisions, le journal de classe et la fiche de préparation. La fiche de préparation est l'outil cardinal de l'enseignant. Elle structure la leçon en activités initiales, principales, de fixation et de contrôle.</p></div>
<div class="sources"><strong>Sources :</strong> Programme National de Didactique Générale, 4e année HP (MEPST/DIPROMAD, 2025), Fiches pédagogiques officielles (manuels-scolaires-rdc.com).</div>
    `
},
{
    title: "Leçon 4 — La formulation des objectifs opérationnels et la taxonomie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un enseignant de Kisangani écrit sur sa fiche : « Objectif : que les élèves comprennent la photosynthèse. » Son inspecteur lui dit : « Comprendre, ce n'est pas mesurable. Reformulez. » La formulation des objectifs opérationnels est une compétence essentielle.</p></div>
<h3>1. Définition et importance des objectifs opérationnels</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Objectif opérationnel</strong> : énoncé précis et mesurable de ce que l'élève sera capable de faire à la fin de la leçon.</li><li><strong>Importance</strong> : clarté de l'enseignement, évaluation facilitée, communication avec les élèves.</li><li><strong>Critères de formulation</strong> : verbe d'action observable, contenu précis, condition de réalisation, critère de réussite.</li></ul></div>
<h3>2. La taxonomie de Bloom</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Niveau 1 — Connaissance</strong> : se rappeler l'information (citer, définir, nommer).</li><li><strong>Niveau 2 — Compréhension</strong> : saisir le sens (expliquer, résumer, reformuler).</li><li><strong>Niveau 3 — Application</strong> : utiliser dans une situation nouvelle (appliquer, résoudre).</li><li><strong>Niveau 4 — Analyse</strong> : décomposer en éléments (analyser, comparer, distinguer).</li><li><strong>Niveau 5 — Synthèse</strong> : créer du nouveau (composer, construire, planifier).</li><li><strong>Niveau 6 — Évaluation</strong> : juger selon des critères (évaluer, critiquer, justifier).</li></ul></div>
<h3>3. Verbes d'action par domaine</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Cognitif</strong> : citer, définir, expliquer, appliquer, analyser, créer, évaluer.</li><li><strong>Affectif</strong> : écouter, participer, apprécier, valoriser, s'engager.</li><li><strong>Psychomoteur</strong> : manipuler, tracer, construire, exécuter, coordonner.</li></ul></div>
<h3>4. Exemples de formulation</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><strong>Mauvais objectif</strong> : « Comprendre les fractions. »</p><p><strong>Bon objectif</strong> : « À la fin de la leçon, l'élève sera capable de représenter une fraction simple (1/2, 1/4) par un dessin, sans erreur. »</p><ul><li>Verbe d'action observable : représenter.</li><li>Contenu : fraction simple.</li><li>Condition : par un dessin.</li><li>Critère : sans erreur.</li></ul><p><a href="https://www.youtube.com/results?search_query=objectifs+opérationnels+taxonomie+Bloom+didactique" target="_blank" rel="noopener">🎥 Recherche : la formulation des objectifs (chaînes de cours de pédagogie)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un objectif opérationnel est précis, mesurable et formulé avec un verbe d'action. La taxonomie de Bloom classe les objectifs en six niveaux, de la connaissance à l'évaluation. Les domaines cognitif, affectif et psychomoteur ont chacun leurs verbes.</p></div>
<div class="sources"><strong>Sources :</strong> Programme National de Didactique Générale, 4e année HP (MEPST/DIPROMAD, 2025), Fiches pédagogiques officielles (manuels-scolaires-rdc.com).</div>
    `

{
    title: "Leçon 5 — Les modes d'enseignement traditionnels",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une école rurale du Kwilu, un enseignant doit faire cours à 80 élèves. Quel mode d'enseignement choisir ? Le mode individuel, simultané ou mutuel ? Chacun a ses avantages et ses limites. L'élève-maître doit savoir les analyser.</p></div>
<h3>1. Le mode individuel</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : chaque élève travaille seul, à son rythme, avec son propre matériel.</li><li><strong>Avantages</strong> : adaptation au rythme de l'élève, autonomie, responsabilité.</li><li><strong>Inconvénients</strong> : coût élevé (un maître par élève), manque de socialisation, isolement.</li><li><strong>Contexte historique</strong> : utilisé dans l'Antiquité et au Moyen Âge, avant l'école de masse.</li></ul></div>
<h3>2. Le mode simultané</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : le maître enseigne à toute la classe en même temps, au même rythme.</li><li><strong>Avantages</strong> : économique, permet d'enseigner à un grand nombre, cohérence du groupe.</li><li><strong>Inconvénients</strong> : ne respecte pas le rythme individuel, élèves passifs, difficultés pour les plus lents.</li><li><strong>Fondateur</strong> : Jean-Baptiste de La Salle (XVIIe siècle).</li><li><strong>Techniques</strong> : interrogation, discipline, gestion du groupe.</li><li>C'est le mode dominant dans les classes pléthoriques congolaises.</li></ul></div>

        { text:"Quelle loi de l'enseignement dit que l'enfant voit le tout avant les parties ?", options:["Loi de l'activité","Loi de l'intuition","Loi du besoin"], correct:1 },
        { text:"Quel procédé va du général au particulier ?", options:["Induction","Déduction","Analyse"], correct:1 },
        { text:"Quel document fixe les contenus et compétences officiels ?", options:["La fiche de préparation","Le programme national","Le journal de classe"], correct:1 },
        { text:"Quelle est la durée d'une leçon au secondaire ?", options:["30 minutes","45 minutes","60 minutes"], correct:1 },
        { text:"Quel niveau taxonomique correspond à « citer » ?", options:["Connaissance","Compréhension","Application"], correct:0 },
        { text:"Quel niveau taxonomique correspond à « résoudre » ?", options:["Connaissance","Application","Synthèse"], correct:1 },
        { text:"Quel mode d'enseignement est le plus économique pour un grand nombre d'élèves ?", options:["Individuel","Simultané","Mutuel"], correct:1 },
        { text:"Qui a fondé le mode simultané ?", options:["Jean-Baptiste de La Salle","Andrew Bell","Roger Cousinet"], correct:0 },
        { text:"Quel mode d'enseignement utilise des moniteurs ?", options:["Individuel","Simultané","Mutuel"], correct:2 },
        { text:"Quel plan d'individualisation utilise le contrat de travail ?", options:["Plan Winnetka","Plan Dalton","Plan Cousinet"], correct:1 },
        { text:"Qui a fondé le plan Dalton ?", options:["Washburne","Parkhurst","Kilpatrick"], correct:1 },
        { text:"Qui a développé le travail libre par groupes ?", options:["Cousinet","Kilpatrick","Dewey"], correct:0 },
        { text:"Qui a développé la méthode des projets ?", options:["Cousinet","Kilpatrick","Freinet"], correct:1 },
        { text:"Quel type d'évaluation se fait au début de l'année ?", options:["Diagnostique","Formative","Sommative"], correct:0 },
        { text:"Quelle qualité d'une évaluation garantit qu'elle mesure bien ce qu'elle doit mesurer ?", options:["Fiabilité","Validité","Objectivité"], correct:1 },
        { text:"Quelle science étudie les examens et la notation ?", options:["La pédagogie","La docimologie","La didactique"], correct:1 },
        { text:"Quel est le rôle de l'enseignant dans le travail de groupe selon Cousinet ?", options:["Exposer","Circuler et réguler","Punir"], correct:1 },
        { text:"Quel principe de Dewey signifie « apprendre en faisant » ?", options:["Learning by doing","Sapere aude","Cogito ergo sum"], correct:0 },
        { text:"Quelle méthode consiste à étudier le milieu environnant ?", options:["La classe promenade","Le cours magistral","L'exposé"], correct:0 },
        { text:"Que doit faire l'enseignant face à une classe pléthorique ?", options:["Utiliser des stratégies actives","Abandonner","Punir les bavards"], correct:0 },
        { text:"Quel est le premier devoir déontologique de l'enseignant ?", options:["La ponctualité","La richesse","La popularité"], correct:0 },
        { text:"Que doit faire l'enseignant face à un élève en difficulté ?", options:["L'ignorer","Le dépister et l'aider","Le punir"], correct:1 },
        { text:"Quel document l'élève-maître doit-il rédiger après son stage ?", options:["Un rapport de stage","Un roman","Une poésie"], correct:0 },
        { text:"Quelle est la différence entre didactique et pédagogie ?", options:["La didactique se concentre sur le contenu, la pédagogie sur la relation éducative","Aucune","La pédagogie est plus récente"], correct:0 },
        { text:"Quel est l'objectif de l'individualisation de l'enseignement ?", options:["Adapter l'enseignement au rythme de l'élève","Standardiser l'enseignement","Réduire le nombre d'élèves"], correct:0 },
        { text:"Que signifie « praticien réflexif » ?", options:["Un enseignant qui analyse sa pratique","Un enseignant qui réfléchit beaucoup","Un enseignant qui lit"], correct:0 }
    ];
    let html = '';
    questions.forEach((q,i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o,k) => { html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>'; });
        html += '</div>';
    });
    document.getElementById('quizQuestions').innerHTML = html;
    document.getElementById('submitQuiz').onclick = () => {
        let score = 0;
        questions.forEach((q,i) => {
            const s = document.querySelector('input[name="q' + i + '"]:checked');
            if (s && parseInt(s.value) === q.correct) score++;
        });
        const pct = Math.round(score/questions.length*100);
        document.getElementById('quizResult').innerHTML = '<div style="background:#fbdcb8;padding:16px;border-radius:10px;margin-top:14px;">' +
            '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong><br>' +
            (score === questions.length ? 'Excellent. Tu maîtrises le programme.' :
             score >= 21 ? 'Bien. Revoyez les leçons où vous avez échoué.' :
             'Relis attentivement les leçons avant l\'examen.') + '</div>';
    };
}
function renderSlide(index, keepHighlight = true) {
    const isQuiz = (index === slides.length - 1);
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    if (isQuiz) renderQuiz();
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm && !isQuiz) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>
</body>
</html>
