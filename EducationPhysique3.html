const slides = [
{
    title: "Sommaire — Éducation Physique et Sportive 3e année",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>L'Éducation Physique et Sportive (EPS) du tronc commun vise le développement harmonieux du corps, l'entretien de la condition physique, l'acquisition de la coordination, de l'équilibre et de la maîtrise de soi, ainsi que l'esprit d'équipe et le fair-play. La sécurité et le bien-être de l'élève sont prioritaires sur la performance.</p>
<p><strong>Note de transparence :</strong> le programme consulté (DIPROMAD, section II.12.2 — 3e et 4e années) fixe les objectifs intermédiaires et les matières (marche et course éducative, assouplissement, renforcement abdominal et dorsal, appuis et suspensions, sauts à cloche-pied, équilibre et agilité, retour au calme). Les sports collectifs et l'athlétisme sont proposés comme prolongement pédagogique cohérent, non comme contenus explicitement listés.</p>
<ul>
<li>Leçon 1 — Évaluation diagnostique et sécurité</li>
<li>Leçon 2 — Marche et course éducative</li>
<li>Leçon 3 — Assouplissement et mobilité articulaire</li>
<li>Leçon 4 — Renforcement abdominal et dorsal</li>
<li>Leçon 5 — Appuis et suspensions</li>
<li>Leçon 6 — Sauts et cloche-pied</li>
<li>Leçon 7 — Équilibre et agilité</li>
<li>Leçon 8 — Retour au calme et récupération</li>
<li>Leçon 9 — Sports collectifs : initiation</li>
<li>Leçon 10 — Athlétisme : course de vitesse et endurance</li>
<li>Leçon 11 — Jeux traditionnels congolais et coordination</li>
<li>Leçon 12 — Évaluation finale et projet sportif</li>
</ul>
<p>Une évaluation finale de 12 questions couvre les connaissances théoriques et la sécurité.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme national d'Éducation Physique et Sportive (DIPROMAD, section II.12.2 — 3e et 4e années du degré moyen) ; documents de sécurité sportive.</div>
    `
},
{
    title: "Leçon 1 — Évaluation diagnostique et sécurité",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Suis-je prêt à pratiquer une activité physique en toute sécurité ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les règles de sécurité. Réaliser des tests simples de condition physique. S'auto-évaluer. Constituer des groupes de travail.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Règles de sécurité</div>
<ul>
<li><strong>Tenue adaptée :</strong> survêtement, chaussures de sport, pas d'objets dangereux (bijoux, stylos dans les poches).</li>
<li><strong>Échauffement obligatoire :</strong> 5 à 10 minutes avant tout effort.</li>
<li><strong>Hydratation :</strong> boire de l'eau avant, pendant et après l'effort.</li>
<li><strong>Respect des consignes :</strong> écouter les explications et respecter les installations.</li>
<li><strong>Signaler toute douleur ou malaise</strong> au professeur immédiatement.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Tests simples</div>
<ul>
<li><strong>Course de 30 m :</strong> mesure la vitesse.</li>
<li><strong>Saut en longueur sans élan :</strong> mesure la détente.</li>
<li><strong>Test de souplesse :</strong> flexion avant du tronc.</li>
<li><strong>Endurance :</strong> course continue de quelques minutes, sans compétition.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Auto-évaluation</div>
<p>Chaque élève note ses résultats dans une fiche personnelle. Cette fiche sera reprise en fin d'année pour mesurer les progrès, pas pour classer les élèves.</p>
<img data-image-id="EP3_IMG04" alt="Grille d'auto-évaluation de la condition physique" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois règles de sécurité à respecter en EPS.</p>
<p><strong>Ex. 2 :</strong> Réalise les tests proposés et note tes résultats sur ta fiche.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Tenue adaptée, échauffement obligatoire, hydratation.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La sécurité passe avant la performance : tenue, échauffement, hydratation, écoute des consignes.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national d'EPS ; documents de sécurité sportive.</div>
    `
},
{
    title: "Leçon 2 — Marche et course éducative",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment courir en groupe de manière coordonnée et sans se heurter ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Marcher et courir en décrivant des figures (cercle, spirale, étoile). Développer la coordination et l'attention. Terminer par un retour au calme.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Échauffement spécifique</div>
<p>Avant de courir, on prépare le corps : marche rapide, petites foulées, rotations des bras et des chevilles. L'échauffement augmente la température corporelle, prépare les muscles et réduit le risque de blessure.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les figures collectives</div>
<ul>
<li><strong>Le cercle :</strong> les élèves tournent en gardant une distance constante.</li>
<li><strong>La spirale :</strong> les élèves dessinent une spirale qui se resserre puis se desserre.</li>
<li><strong>L'étoile :</strong> à partir du centre, chaque élève rejoint une branche de l'étoile puis revient.</li>
</ul>
<img data-image-id="EP3_IMG02" alt="Figures de course (cercle, spirale, étoile)" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Gymnastique scandinave dynamique</div>
<p>Enchaînement de mouvements fluides et continus (bras, tronc, jambes), sans temps d'arrêt, qui associe souplesse et respiration. Elle prépare à la course et développe la coordination générale.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Réalise une course en cercle, puis en spirale, puis en étoile, en gardant un rythme régulier.</p>
<p><strong>Ex. 2 :</strong> Termine par 2 minutes de marche lente et de respiration calme.</p>
<details><summary>Corrigé indicatif</summary>
<p>La réussite se mesure à la fluidité du mouvement, à la régularité du rythme et au respect des distances entre élèves.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Courir ensemble demande coordination, attention et respect de la distance de sécurité.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national d'EPS (DIPROMAD, II.12.2).</div>
    `
},
{
    title: "Leçon 3 — Assouplissement et mobilité articulaire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi faut-il assouplir les articulations ? Comment le faire sans se blesser ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les principes de l'assouplissement. Réaliser des exercices pour les principales articulations. Corriger son propre geste.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Principes de l'assouplissement</div>
<ul>
<li><strong>Lent et progressif :</strong> on étire sans à-coups.</li>
<li><strong>Sans douleur :</strong> la sensation doit être un étirement, pas une souffrance.</li>
<li><strong>Respiration régulière :</strong> ne pas bloquer sa respiration.</li>
<li><strong>Répétition :</strong> plusieurs répétitions douces plutôt qu'un étirement forcé.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Exercices par zone</div>
<ul>
<li><strong>Cou :</strong> flexions et rotations lentes.</li>
<li><strong>Épaules :</strong> cercles avec les bras.</li>
<li><strong>Membres supérieurs :</strong> étirement des triceps, des biceps.</li>
<li><strong>Membres inférieurs :</strong> étirement des quadriceps, des ischio-jambiers, des mollets.</li>
<li><strong>Hanches et dos :</strong> flexions latérales, torsions douces.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Réalise un enchaînement guidé de 6 à 8 étirements couvrant toutes les zones.</p>
<p><strong>Ex. 2 :</strong> En binôme, observe ton camarade et signale deux gestes à corriger.</p>
<details><summary>Corrigé indicatif</summary>
<p>Les corrections portent sur la lenteur du mouvement, le respect de l'amplitude non douloureuse, la respiration continue.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'assouplissement se pratique lentement, progressivement et sans douleur.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national d'EPS ; manuels de préparation physique de base.</div>
    `
},
{
    title: "Leçon 4 — Renforcement abdominal et dorsal",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi renforcer les muscles du tronc ? Comment le faire correctement ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les muscles sollicités. Réaliser des exercices corrects. Éviter les erreurs de posture.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Muscles ciblés</div>
<p>Les <strong>abdominaux</strong> (grand droit, obliques, transverse) stabilisent le tronc. Les <strong>muscles dorsaux</strong> (lombaires, dorsaux larges) soutiennent la colonne vertébrale. Un tronc solide protège le dos et améliore la posture.</p>
<img data-image-id="EP3_IMG01" alt="Schéma des groupes musculaires (abdominaux, dorsaux)" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Exercices de base</div>
<ul>
<li><strong>Crunch :</strong> allongé sur le dos, genoux fléchis, décoller légèrement les épaules.</li>
<li><strong>Relevé de jambes :</strong> allongé, jambes tendues, monter jusqu'à la verticale, redescendre lentement.</li>
<li><strong>Gainage ventral (planche) :</strong> appui sur les avant-bras et les pointes de pieds, corps aligné.</li>
<li><strong>Gainage dorsal :</strong> allongé sur le ventre, décoller légèrement la poitrine et les jambes.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Erreurs à éviter</div>
<ul>
<li>Bloquer la respiration.</li>
<li>Cambrer exagérément le dos.</li>
<li>Aller trop vite sans maîtrise.</li>
<li>Négliger l'échauffement.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Réalise un circuit de trois stations : crunch (10 répétitions), gainage ventral (20 secondes), gainage dorsal (10 répétitions lentes).</p>
<p><strong>Ex. 2 :</strong> Termine par 3 étirements doux du dos.</p>
<details><summary>Corrigé indicatif</summary>
<p>La qualité prime sur la quantité : mouvements lents, respiration continue, dos protégé.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Renforcer abdominaux et dorsaux protège le dos et améliore la posture ; la qualité du geste prime sur la quantité.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national d'EPS ; documents d'éducation physique scolaires.</div>
    `
},
{
    title: "Leçon 5 — Appuis et suspensions",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment utiliser les barres et espaliers sans se blesser ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les règles de sécurité sur les agrès. Réaliser des appuis et suspensions de base. S'entraider entre élèves.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Sécurité et matériel</div>
<ul>
<li>Vérifier l'état du matériel (barres, espaliers, bancs).</li>
<li>Utiliser un tapis sous les agrès.</li>
<li>Ne jamais lâcher brutalement une barre.</li>
<li>Respecter la parade : un camarade se tient prêt à aider.</li>

</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Exercices progressifs</div>
<ul>
<li><strong>Appuis faciaux :</strong> mains au sol, corps gainé, descente et remontée contrôlées (pompes adaptées).</li>
<li><strong>Suspension à la barre :</strong> tenir quelques secondes, bras tendus, corps relâché.</li>
<li><strong>Traction assistée :</strong> avec l'aide d'un camarade ou d'un élastique, tirer le corps vers la barre.</li>
<li><strong>Appuis sur banc :</strong> mains sur un banc, pompes adaptées.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Réalise trois séries progressives d'appuis faciaux adaptés à ton niveau.</p>
<p><strong>Ex. 2 :</strong> En binôme, aide ton camarade à réaliser une traction assistée.</p>
<details><summary>Corrigé indicatif</summary>
<p>La sécurité d'abord : matériel vérifié, tapis, parade, écoute des consignes.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les appuis et suspensions développent la force du haut du corps ; la sécurité et l'entraide sont obligatoires.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national d'EPS ; consignes de sécurité en gymnastique.</div>
    `

    title: "Leçon 6 — Sauts et cloche-pied",

function highlightInCurrentSlide(term) {

    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);

    }

      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
