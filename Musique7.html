<script>
const COURSE_TITLE = "Musique";
const slides = [
{
    title: "Musique 7e année — Sommaire général",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce fichier couvre le programme de musique de la 7e année de l'éducation de base. Il comprend 12 leçons progressives organisées autour de l'écoute, de la voix, du rythme, des instruments, des traditions musicales congolaises et de la création.</p>
<ul>
<li>Leçon 1 — Découverte de la musique</li>
<li>Leçon 2 — Les qualités du son</li>
<li>Leçon 3 — Le rythme et la pulsation</li>
<li>Leçon 4 — Initiation à la notation musicale</li>
<li>Leçon 5 — La voix et le chant</li>
<li>Leçon 6 — Les instruments de musique</li>
<li>Leçon 7 — Musiques et traditions de la RDC</li>
<li>Leçon 8 — La musique, le mouvement et la danse</li>
<li>Leçon 9 — Les nuances et l'expression musicale</li>
<li>Leçon 10 — Les chants et leurs fonctions</li>
<li>Leçon 11 — Création d'une courte séquence musicale</li>
<li>Leçon 12 — Écoute, appréciation et présentation musicale</li>
</ul>
<p>Une évaluation finale de 35 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programmes nationaux du ministère de l'Éducation nationale et Nouvelle Citoyenneté (RDC). Programme éducatif 7e année (volume horaire). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 1 : Découverte de la musique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève traverse le marché de Kinshasa : il entend des vendeurs, des radios, des klaxons, puis un groupe qui joue du tambour. Certains sons sont organisés, d'autres non. Qu'est-ce qui distingue la musique du bruit ?</p></div>
<img alt="Groupe de percussionnistes africains en performance" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_1">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Groupe de percussionnistes africains — Wikimedia Commons : African drummers.jpg.</p>

<h3>1. Qu'est-ce que la musique ?</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La musique est un art qui organise des sons dans le temps selon des règles de hauteur, de durée, d'intensité et de timbre. Elle peut être vocale, instrumentale ou mixte.</p>
<p>Le bruit est un son non organisé, souvent fort et désagréable. Mais certains bruits peuvent devenir musicaux lorsqu'ils sont utilisés de façon rythmique et intentionnelle (tambour, calebasse, mains).</p>
<p>Vocabulaire : son, bruit, musique, rythme, mélodie.</p>
</div>
<img alt="Élèves en activité d'écoute musicale en classe" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_2">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Élèves en activité musicale — Wikimedia Commons : Children singing in school.jpg.</p>

<h3>2. Les fonctions de la musique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La musique remplit plusieurs fonctions dans la vie sociale : elle accompagne les célébrations (mariages, naissances), les deuils, le travail collectif, les cérémonies religieuses, les fêtes nationales. Elle exprime des émotions, transmet des messages et rassemble les communautés.</p>
</div>

<h3>3. Exemple et contre-exemple</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> pendant la récolte, un groupe chante pour se donner du courage et synchroniser ses gestes. La musique a une fonction de travail.</p>
<p><strong>Contre-exemple :</strong> un klaxon de voiture dans les embouteillages n'est pas de la musique : c'est un bruit.</p>
</div>
<img alt="Percussionniste africain jouant du tambour" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_3">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Percussionniste — Wikimedia Commons : Drummer in Africa.jpg.</p>

<h3>4. Exercice d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Classe les sons suivants en « musique » ou « bruit » : (a) un choeur qui chante ; (b) un marteau qui frappe le fer ; (c) un tambour qui accompagne une danse.</p>
<p><strong>Corrigé :</strong> (a) musique ; (b) bruit ; (c) musique.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Croire que toute musique doit comporter des paroles. Confondre la musique avec tout son agréable. Ignorer les musiques sans instruments.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Pendant 3 minutes, écoute les sons autour de toi. Note cinq sons entendus et indique s'ils sont musicaux ou non.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La musique est un art qui organise les sons dans le temps. Elle peut être vocale ou instrumentale. Elle remplit des fonctions sociales variées : célébration, travail, religion, expression. Certains bruits peuvent devenir musicaux lorsqu'ils sont organisés.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de musique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 2 : Les qualités du son",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une école, un élève écoute un tambour, puis une cloche et enfin une voix. Les trois sons sont différents. Comment les décrire avec précision ?</p></div>
<img alt="Diapason utilisé pour accorder les sons" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_4">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Diapason — Wikimedia Commons : Tuning fork.jpg.</p>

<h3>1. Les quatre qualités du son</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un son possède quatre qualités principales :</p>
<ul>
<li><strong>La hauteur</strong> : le son est aigu (élevé) ou grave (bas). Un sifflet produit un son aigu, un tambour un son grave.</li>
<li><strong>L'intensité</strong> : le son est fort ou faible. Elle dépend de la force avec laquelle on joue ou on chante.</li>
<li><strong>La durée</strong> : le son est bref ou prolongé.</li>
<li><strong>Le timbre</strong> : la « couleur » du son, qui permet de distinguer deux sources différentes (un violon et une flûte peuvent jouer la même note mais sonnent différemment).</li>
</ul>
</div>
<img alt="Tambour africain traditionnel" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_5">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Tambour africain — Wikimedia Commons : African drum.jpg.</p>

<h3>2. Exemples et contre-exemples</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple :</strong> la voix d'un homme est généralement plus grave que celle d'un enfant. Un son de cloche est prolongé ; une frappe de tambour peut être brève.</p>
<p><strong>Contre-exemple :</strong> un son fort n'est pas forcément aigu, et un son aigu n'est pas forcément fort. Hauteur et intensité sont deux qualités distinctes.</p>
</div>
<img alt="Cloche d'église, exemple de son prolongé" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_6">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Cloche musicale — Wikimedia Commons : Bell of a church.jpg.</p>

<h3>3. Exercice d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Indique la qualité du son concernée dans chaque cas : (a) une flûte produit un son élevé ; (b) un enfant crie très fort ; (c) on distingue un piano d'une guitare sur la même note.</p>
<p><strong>Corrigé :</strong> (a) hauteur ; (b) intensité ; (c) timbre.</p>
</div>

<h3>4. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Confondre un son aigu avec un son fort. Croire que la hauteur dépend de la force. Ignorer le timbre dans la reconnaissance d'un instrument.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Écoute deux camarades chanter la même note. Compare leur timbre et décris leur différence avec tes mots.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un son possède quatre qualités : hauteur, intensité, durée et timbre. La hauteur distingue aigu et grave ; l'intensité distingue fort et faible ; la durée distingue bref et prolongé ; le timbre identifie la source sonore.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de musique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 3 : Le rythme et la pulsation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Pendant une danse, un groupe frappe régulièrement dans ses mains pour accompagner un tambour. Si les frappes accélèrent, la danse se désorganise. Comment garder une pulsation stable ?</p></div>
<img alt="Mains frappant en rythme" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_7">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Mains frappant en rythme — Wikimedia Commons : Clapping hands.jpg.</p>

<h3>1. La pulsation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La pulsation est le battement régulier qui sert de repère à toute musique. Elle se ressent naturellement en frappant du pied ou en battant des mains à intervalles constants.</p>
<p>Le tempo est la vitesse de la pulsation. Un tempo lent donne une impression calme ; un tempo rapide donne une impression vive.</p>
<p>Vocabulaire : pulsation, tempo, rythme, cellule rythmique, silence.</p>
</div>
<img alt="Métronome mécanique utilisé pour marquer le tempo" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_8">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Métronome mécanique — Wikimedia Commons : Metronome Nikolaus Hohmann.jpg.</p>

<h3>2. Cellules rythmiques simples</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une cellule rythmique est un petit motif de sons et de silences. On peut la représenter en frappant : une frappe forte, deux frappes légères, un silence, une frappe forte.</p>
<p>Reproduire un rythme demande de l'écoute, de la concentration et de la régularité.</p>
</div>
<img alt="Percussionniste africain jouant un djembé" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_9">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Percussionniste — Wikimedia Commons : Djembe drummer.jpg.</p>

<h3>3. Exemple</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Rythme à reproduire :</strong> FORT - faible - faible - FORT - silence.</p>
<p>On compte 4 temps en frappant : 1 (fort), 2 (faible), 3 (faible), 4 (fort). Puis on garde le silence sur le temps suivant.</p>
<p><strong>Observation :</strong> si on accélère au fur et à mesure, on perd la régularité. Il faut garder la même vitesse du début à la fin.</p>
</div>

<h3>4. Exercice d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Frappe dans tes mains une pulsation régulière à 60 battements par minute (1 par seconde) pendant 20 secondes, sans accélérer.</p>
<p><strong>Critère de réussite :</strong> le tempo doit rester constant. Un camarade vérifie avec un chronomètre.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Accélérer progressivement sans s'en rendre compte. Confondre pulsation et rythme. Frapper plus fort au lieu de frapper plus vite.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Invente une cellule rythmique de 4 temps. Présente-la à la classe et fais-la reproduire par tes camarades.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La pulsation est le battement régulier de la musique. Le tempo est sa vitesse. Le rythme est l'organisation des durées. Pour reproduire un rythme, il faut écouter et rester régulier.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de musique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 4 : Initiation à la notation musicale",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un enseignant écrit une courte mélodie au tableau sur une portée. Il demande aux élèves de la lire. Comment déchiffrer une partition simple ?</p></div>
<img alt="Portée musicale avec clé de sol et notes" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_10">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Portée musicale avec clé de sol — Wikimedia Commons : Music staff.svg.</p>

<h3>1. La portée et ses éléments</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La portée est un ensemble de cinq lignes horizontales et de quatre interlignes. On y écrit les notes musicales. La clé de sol placée au début indique la position des notes.</p>
<p>Les notes se placent sur les lignes ou dans les interlignes. Plus une note est haute sur la portée, plus le son est aigu.</p>
<p>Vocabulaire : portée, clé de sol, note, silence, mesure.</p>
</div>
<img alt="Clé de sol, signe placé au début de la portée" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_11">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Clé de sol — Wikimedia Commons : Treble clef.svg.</p>

<h3>2. Notes et silences élémentaires</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Sept noms de notes sont utilisés : do, ré, mi, fa, sol, la, si. Chaque note a une durée : ronde (4 temps), blanche (2 temps), noire (1 temps), croche (1/2 temps).</p>
<p>Les silences correspondent aux moments où l'on ne joue pas mais où le temps continue.</p>
</div>
<img alt="Notes sur les lignes et interlignes de la portée" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_12">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Notes sur la portée — Wikimedia Commons : Musical notes on staff.svg.</p>

<h3>3. Exemple</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Mélodie simple écrite sur la portée (en notation adaptée aux débutants) :</p>
<p>sol - sol - la - sol - do - si (sur des durées égales d'une noire chacune).</p>
<p><strong>Lecture :</strong> on prononce chaque note en respectant la durée, puis on les chante en gardant la pulsation.</p>
</div>

<h3>4. Exercice d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Nomme les éléments suivants : (a) ensemble de cinq lignes ; (b) signe placé au début indiquant la position des notes ; (c) durée d'une note.</p>
<p><strong>Corrigé :</strong> (a) la portée ; (b) la clé de sol ; (c) ronde, blanche, noire ou croche selon le cas.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Confondre la position d'une note avec sa durée. Lire de droite à gauche. Oublier les silences.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Recopie une courte mélodie sur une portée en utilisant des noires. Chante-la ensuite en respectant la pulsation.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La portée comporte cinq lignes et quatre interlignes. La clé de sol indique la position des notes. Les sept notes sont do, ré, mi, fa, sol, la, si. Chaque note a une durée et un silence correspondant.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de musique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 5 : La voix et le chant",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une chorale scolaire prépare un chant pour la fête de l'école. Certains élèves crient au lieu de chanter et se fatiguent vite. Comment bien utiliser sa voix ?</p></div>
<img alt="Chorale scolaire en train de chanter" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_13">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Chorale scolaire — Wikimedia Commons : Choir singing.jpg.</p>

<h3>1. La respiration et la posture</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Pour bien chanter, il faut : se tenir droit, les épaules détendues ; respirer par le nez en gonflant le ventre (respiration abdominale) ; articuler clairement les paroles ; garder un volume modéré sans forcer.</p>
<p>Crier fatigue la voix et peut l'abîmer. Chanter demande un effort doux et progressif.</p>
<p>Vocabulaire : respiration, posture, articulation, justesse, chorale.</p>
</div>
<img alt="Chef de choeur dirigeant un groupe" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_14">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Chef de choeur — Wikimedia Commons : Choir conductor.jpg.</p>

<h3>2. L'échauffement vocal</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Avant de chanter, on échauffe la voix : quelques respirations profondes, des sons doux sur une voyelle (a, o, i), puis des vocalises simples en montant et descendant. L'échauffement protège la voix et améliore la justesse.</p>
</div>

<h3>3. Exemple</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Chant scolaire :</strong> « Debout Congolais » (hymne national) est un chant solennel qui demande une voix posée et un respect collectif.</p>
<p><strong>Démarche :</strong> le chef donne le départ, la classe chante en respectant les phrases, puis termine ensemble. On ne crie pas ; on écoute les autres pour rester synchronisé.</p>
</div>
<img alt="Chorale scolaire en RDC" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_15">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Chorale scolaire — Wikimedia Commons : School choir in Africa.jpg.</p>

<h3>4. Exercice d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Cite trois règles pour bien chanter en groupe.</p>
<p><strong>Corrigé :</strong> Par exemple : se tenir droit, respirer doucement, écouter les autres et ne pas crier.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Crier pour essayer de chanter plus fort. Chanter sans échauffement. Négliger la posture. Ignorer la voix des autres membres du groupe.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Apprends une courte phrase mélodique simple avec la classe. Chantez-la d'abord doucement, puis avec un volume modéré.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Chanter demande une bonne posture, une respiration abdominale et une articulation claire. On ne crie pas pour chanter fort. L'échauffement vocal protège la voix et améliore la justesse.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de musique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 6 : Les instruments de musique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un village, un groupe joue du tambour, du likembe et de la flûte en bambou. Comment classer ces instruments selon leur mode de production du son ?</p></div>
<img alt="Likembe (sanza) traditionnel africain" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_16">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Likembe (sanza) — Wikimedia Commons : Likembe or sanza.jpg.</p>

<h3>1. Les grandes familles d'instruments</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>On classe les instruments en quatre grandes familles :</p>
<ul>
<li><strong>Percussions</strong> : le son est produit par la frappe. Exemples : tambour, djembé, calebasse, maracas, balafon.</li>
<li><strong>Cordes</strong> : le son est produit par la vibration d'une corde. Exemples : guitare, kora, violon, likembe (sanza, dont les lamelles vibrent).</li>
<li><strong>Vents</strong> : le son est produit par l'air soufflé. Exemples : flûte, trompette, sifflet, flûte en bambou.</li>
<li><strong>Claviers</strong> : le son est produit par un mécanisme actionné par des touches. Exemples : piano, orgue, xylophone.</li>
</ul>
</div>
<img alt="Tambour djembé africain" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_17">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Tambour djembé — Wikimedia Commons : Djembe drum.jpg.</p>

<h3>2. Matériaux et fabrication</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les instruments traditionnels sont souvent fabriqués avec des matériaux locaux : bois, peaux d'animaux, calebasses, bambou, métal, graines. Ces matériaux donnent à chaque instrument un timbre particulier.</p>
<p>Le likembe (ou sanza), instrument à lamelles métalliques, est répandu en Afrique centrale, y compris en RDC.</p>
</div>
<img alt="Kora, instrument à cordes traditionnel africain" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_18">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Kora, instrument à cordes — Wikimedia Commons : Kora instrument.jpg.</p>

<h3>3. Exemple</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Classons trois instruments :</p>
<p><strong>Tambour :</strong> percussion, peau tendue frappée avec les mains ou des baguettes.</p>
<p><strong>Likembe :</strong> instrument à lamelles, doigts pinçant les lamelles métalliques.</p>
<p><strong>Flûte en bambou :</strong> instrument à vent, air soufflé dans un tube.</p>
</div>

<h3>4. Exercice d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Associe chaque instrument à sa famille : guitare, trompette, djembé, piano.</p>
<p><strong>Corrigé :</strong> guitare → cordes ; trompette → vents ; djembé → percussions ; piano → claviers (instrument à cordes frappées).</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Classer un instrument uniquement selon son apparence. Confondre un instrument traditionnel et un instrument moderne fabriqué industriellement. Ignorer le mode de production du son.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Choisis trois instruments que tu connais dans ton milieu. Pour chacun, indique sa famille et comment le son est produit.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les instruments se répartissent en quatre familles : percussions, cordes, vents et claviers. Le classement dépend du mode de production du son, pas de l'apparence. Les instruments traditionnels utilisent souvent des matériaux locaux.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de musique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 7 : Musiques et traditions de la RDC",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève de Kinshasa découvre, lors d'une fête scolaire, un chant traditionnel venu du Kasaï, un rythme du Kongo-Central et une danse de l'Est. Comment comprendre cette diversité sans la réduire à une seule tradition ?</p></div>
<img alt="Musiciens traditionnels africains en performance" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_19">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Musiciens traditionnels — Wikimedia Commons : African traditional musicians.jpg.</p>

<h3>1. La diversité musicale congolaise</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La RDC compte plusieurs centaines de cultures, chacune avec ses chants, ses rythmes et ses instruments. On ne peut pas parler d'une seule musique congolaise : il faut dire « les musiques de la RDC ».</p>
<p>Chaque région possède des pratiques musicales liées à son histoire, à sa langue et à ses activités : agriculture, pêche, chasse, célébrations familiales, rites.</p>
</div>
<img alt="Danse culturelle africaine en performance" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_20">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Danse culturelle — Wikimedia Commons : African dance performance.jpg.</p>

<h3>2. Fonctions sociales de la musique traditionnelle</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La musique traditionnelle remplit plusieurs fonctions : accompagner les travaux collectifs, marquer les étapes de la vie (naissance, mariage, deuil), transmettre des récits et des valeurs, célébrer les récoltes, honorer les ancêtres, accueillir des visiteurs.</p>
<p>La transmission se fait souvent oralement, de génération en génération.</p>
</div>
<img alt="Ensemble de tambours traditionnels africains" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_21">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Ensemble de tambours — Wikimedia Commons : African drums ensemble.jpg.</p>

<h3>3. Exemple</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Comparons deux traditions :</p>
<p><strong>Chant de travail :</strong> chanté pendant la récolte pour synchroniser les gestes et donner du courage.</p>
<p><strong>Chant de célébration :</strong> interprété lors d'un mariage, avec tambours et danses.</p>
<p><strong>Observation :</strong> ces deux chants ont des rythmes, des paroles et des contextes différents, mais tous deux rassemblent la communauté.</p>
</div>

<h3>4. Exercice d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Cite deux fonctions sociales de la musique traditionnelle congolaise.</p>
<p><strong>Corrigé :</strong> Par exemple : accompagner le travail collectif ; célébrer un mariage.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Considérer une seule tradition comme représentative de toute la RDC. Se moquer d'une pratique musicale d'une autre région. Confondre musique traditionnelle et musique moderne.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Présente une pratique musicale de ta région ou de ta famille. Explique sa fonction et l'occasion où elle est interprétée.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La RDC possède une grande diversité musicale : il n'y a pas une seule musique congolaise, mais des musiques de la RDC. La musique traditionnelle accompagne le travail, la vie familiale, les rites et les célébrations. Sa transmission est souvent orale.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de musique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 8 : La musique, le mouvement et la danse",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Pendant une fête scolaire, des élèves dansent sur un rythme de tambour. Leurs mouvements suivent la pulsation. Que faut-il faire pour rester coordonné avec la musique ?</p></div>
<img alt="Danse traditionnelle africaine" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_22">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Danse traditionnelle africaine — Wikimedia Commons : African dancers.jpg.</p>

<h3>1. Musique et mouvement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La danse est un mouvement du corps organisé sur une musique. Elle suit la pulsation, le rythme et parfois la mélodie. Le corps devient alors un instrument qui exprime des émotions et des intentions.</p>
<p>La coordination demande de l'écoute et de la régularité. On commence par des mouvements simples avant d'en ajouter.</p>
<p>Vocabulaire : pulsation, coordination, expression corporelle, danse, rythme.</p>
</div>
<img alt="Groupe exécutant une danse collective africaine" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_23">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Danse collective — Wikimedia Commons : Group dance in Africa.jpg.</p>

<h3>2. Créer une séquence de mouvements</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Pour créer une séquence de mouvements : écouter la pulsation ; choisir un mouvement simple par temps ; répéter la séquence plusieurs fois ; ajouter éventuellement un mouvement de bras ou de tête ; garder la synchronisation avec le groupe.</p>
</div>
<img alt="Percussionniste accompagnant une danse traditionnelle" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_24">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Percussion accompagnant une danse — Wikimedia Commons : Drummer accompanying dancers.jpg.</p>

<h3>3. Exemple</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Séquence de 4 temps :</strong> temps 1, frapper du pied droit ; temps 2, frapper des mains ; temps 3, frapper du pied gauche ; temps 4, silence.</p>
<p>Répéter la séquence sur une pulsation régulière. Ajouter ensuite un mouvement de bras sur les temps 2 et 4.</p>
</div>

<h3>4. Exercice d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Crée une séquence de quatre mouvements qui suivent une pulsation régulière.</p>
<p><strong>Critère de réussite :</strong> les mouvements sont synchronisés avec la pulsation. Aucun mouvement n'est trop rapide.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Confondre vitesse des mouvements et intensité sonore. Accélérer en cours de séquence. Ignorer la pulsation.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>En groupe de quatre, créez une séquence de huit mouvements synchronisés sur une pulsation frappée par un camarade.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La danse est un mouvement organisé sur la musique. Elle suit la pulsation et le rythme. La coordination demande de l'écoute et de la régularité. On commence par des mouvements simples avant d'en ajouter.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de musique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 9 : Les nuances et l'expression musicale",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un choeur interprète un refrain. Le chef demande de commencer doucement puis d'augmenter progressivement l'intensité. Comment obtenir cet effet sans crier ?</p></div>
<img alt="Symboles de nuances musicales (piano, forte)" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_25">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Symboles de nuances musicales — Wikimedia Commons : Dynamics music symbols.svg.</p>

<h3>1. Les nuances</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les nuances sont les variations d'intensité d'un son ou d'un passage musical. On distingue :</p>
<ul>
<li><strong>Piano (p)</strong> : doux.</li>
<li><strong>Forte (f)</strong> : fort.</li>
<li><strong>Crescendo</strong> : augmentation progressive du volume.</li>
<li><strong>Decrescendo</strong> : diminution progressive du volume.</li>
</ul>
<p>L'intensité ne doit pas être confondue avec la vitesse : on peut jouer doucement et rapidement, ou fort et lentement.</p>
</div>
<img alt="Partition annotée avec crescendo" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_26">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Partition avec crescendo — Wikimedia Commons : Music score with crescendo.jpg.</p>

<h3>2. L'expression musicale</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'expression musicale va au-delà des notes : elle traduit une intention, une émotion. Un chant interprété avec douceur peut émouvoir ; le même chant joué trop fort peut devenir agressif.</p>
<p>Vocabulaire : nuance, intensité, expression, crescendo, decrescendo.</p>
</div>
<img alt="Musicien interprétant une œuvre musicale" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_27">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Musicien interprétant une œuvre — Wikimedia Commons : Musician performing.jpg.</p>

<h3>3. Exemple</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exercice pratique :</strong> interpréter une phrase musicale courte d'abord piano (doucement), puis en crescendo vers un forte, sans crier.</p>
<p><strong>Observation :</strong> l'effet est obtenu par un contrôle progressif de la respiration et de l'articulation, pas par la force brute.</p>
</div>

<h3>4. Exercice d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Que signifient les notations suivantes : <em>p</em>, <em>f</em>, crescendo ?</p>
<p><strong>Corrigé :</strong> <em>p</em> = piano (doux) ; <em>f</em> = forte (fort) ; crescendo = augmentation progressive.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Croire qu'une interprétation forte est toujours meilleure. Confondre intensité et vitesse. Crier pour obtenir un effet puissant.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Interprète une même phrase musicale en deux versions : d'abord doucement, puis en augmentant progressivement. Compare les deux effets.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les nuances sont les variations d'intensité : piano, forte, crescendo, decrescendo. L'intensité ne doit pas être confondue avec la vitesse. L'expression musicale traduit une intention et une émotion.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de musique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 10 : Les chants et leurs fonctions",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un enseignant fait écouter trois chants : un chant scolaire, un chant de travail et un chant de célébration. Les paroles diffèrent, mais aussi les occasions et les rythmes. Comment les distinguer ?</p></div>
<img alt="Chorale scolaire en performance" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_28">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Chorale scolaire — Wikimedia Commons : School choir performance.jpg.</p>

<h3>1. Types de chants</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>On distingue plusieurs types de chants selon leur fonction :</p>
<ul>
<li><strong>Chants scolaires</strong> : appris à l'école, souvent en rapport avec la nation, la morale ou les saisons.</li>
<li><strong>Chants de travail</strong> : accompagnent les activités collectives (récolte, pêche, construction).</li>
<li><strong>Chants de célébration</strong> : mariages, naissances, fêtes, victoires.</li>
<li><strong>Chants religieux</strong> : liturgiques, spirituels, liés à une communauté de foi.</li>
<li><strong>Chants communautaires</strong> : rassemblent un groupe lors d'événements sociaux.</li>
</ul>
</div>
<img alt="Cérémonie musicale africaine" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_29">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Cérémonie musicale — Wikimedia Commons : Ceremony with music in Africa.jpg.</p>

<h3>2. Fonction et paroles</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les paroles d'un chant indiquent parfois sa fonction, mais pas toujours. Un chant d'amour peut être chanté à l'école ; un chant de travail peut être repris en fête. C'est le contexte d'usage qui détermine la fonction sociale du chant.</p>
<p>Vocabulaire : chant, fonction, contexte, rythme, forme.</p>
</div>
<img alt="Groupe chantant ensemble lors d'une fête" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_30">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Groupe chantant ensemble — Wikimedia Commons : Group singing together.jpg.</p>

<h3>3. Exemple</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Comparons deux chants :</p>
<p><strong>Chant A :</strong> « Debout Congolais » — chant national, solennel, chanté lors des cérémonies officielles.</p>
<p><strong>Chant B :</strong> chant de travail entonné pendant la récolte — rythme régulier, paroles qui encouragent, fonction de synchronisation.</p>
<p><strong>Observation :</strong> les deux chants rassemblent, mais leur occasion et leur rythme diffèrent.</p>
</div>

<h3>4. Exercice d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Cite deux types de chants et donne pour chacun un exemple de contexte.</p>
<p><strong>Corrigé :</strong> Par exemple : chant scolaire (fête de fin d'année) ; chant de travail (récolte collective).</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Confondre le sujet des paroles avec la fonction sociale du chant. Ignorer le contexte. Juger un chant sans connaître son usage.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Choisis un chant que tu connais et explique à quelle occasion il est habituellement interprété. Précise sa fonction.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les chants se distinguent par leur fonction : scolaire, travail, célébration, religieux ou communautaire. Le contexte d'usage détermine la fonction, plus que les paroles seules.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de musique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `
},

    title: "Leçon 11 : Création d'une courte séquence musicale",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une classe veut créer un accompagnement rythmique pour la fête de l'école. Avec les mains et quelques objets non dangereux, comment construire une courte séquence cohérente ?</p></div>
<img alt="Atelier musical avec des élèves" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_31">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Atelier musical avec des élèves — Wikimedia Commons : Music workshop with children.jpg.</p>

<h3>1. Créer une séquence musicale</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Pour créer une séquence musicale simple, il faut :</p>
<ul>
<li>Choisir une pulsation régulière.</li>
<li>Définir un motif rythmique de base (par exemple 4 temps).</li>
<li>Répéter ce motif pour créer une structure.</li>
<li>Ajouter éventuellement un contraste (changement d'intensité ou de timbre).</li>
<li>Répartir les rôles entre les membres du groupe.</li>
</ul>
</div>
<img alt="Instruments de percussion simples" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_32">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Instruments de percussion — Wikimedia Commons : Percussion instruments.jpg.</p>

<h3>2. Organisation du groupe</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un groupe peut se répartir en plusieurs rôles : maintenir la pulsation, jouer le motif principal, ajouter un contre-rythme, marquer les silences. Chacun doit écouter les autres pour rester synchronisé.</p>
<p>Le chef de groupe donne le départ et les changements.</p>
</div>
<img alt="Groupe répétant une création musicale" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_33">

<h3>3. Exemple</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Séquence de 4 temps :</strong></p>
<p>Temps 1 : frapper des mains (fort).</p>
<p>Temps 2 : frapper sur la cuisse (faible).</p>
<p>Temps 3 : frapper sur la cuisse (faible).</p>
<p>Temps 4 : silence.</p>
<p><strong>Structure :</strong> répéter la séquence 4 fois, puis changer de motif (par exemple deux frappes fortes).</p>
</div>

<h3>4. Exercice d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Compose une séquence rythmique de 4 temps. Présente-la à la classe.</p>
<p><strong>Critères de réussite :</strong> régularité de la pulsation, cohérence de la structure, écoute des autres membres du groupe.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>

</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>

</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une séquence musicale repose sur une pulsation, un motif rythmique répété et une structure claire. La coordination entre les membres du groupe est essentielle. On commence simple avant d'ajouter des variations.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de musique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>

    title: "Leçon 12 : Écoute, appréciation et présentation musicale",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Après un concert scolaire, un élève dit : « Ce morceau n'était pas bon. » Son camarade lui rappelle qu'une appréciation doit s'appuyer sur des éléments musicaux précis, pas seulement sur un goût personnel.</p></div>
<img alt="Ensemble musical scolaire en concert" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_34">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Ensemble musical scolaire en concert — Wikimedia Commons : School band performing.jpg.</p>

<h3>1. L'écoute attentive</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Écouter attentivement, c'est repérer des éléments précis : instruments, voix, rythme, pulsation, nuances, forme (répétitions, contrastes). On note ce que l'on entend avant de juger.</p>
</div>
<img alt="Public écoutant un concert" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_35">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Public écoutant un concert — Wikimedia Commons : Audience at a concert.jpg.</p>

<h3>2. Formuler une appréciation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une appréciation respectueuse s'appuie sur deux ou trois éléments musicaux précis. On évite de généraliser un goût personnel. Par exemple : « J'ai apprécié le morceau parce que le tambour et la voix étaient bien synchronisés ; les nuances douces au début m'ont plu. »</p>
<p>On distingue le goût personnel (j'aime / je n'aime pas) et le jugement musical (cette partie est bien exécutée / cette partie manque de précision).</p>
</div>
<img alt="Élèves présentant une interprétation musicale" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="Mus7_36">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Élèves présentant une interprétation — Wikimedia Commons : Students performing music.jpg.</p>

<h3>3. Exemple</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Appréciation correcte :</strong> « Le morceau commence doucement avec la flûte, puis le tambour entre en crescendo. La voix principale est juste. L'ensemble reste bien synchronisé. J'ai préféré le passage final. »</p>
<p><strong>Appréciation incorrecte :</strong> « C'était nul. » (aucun élément précis, jugement subjectif sans justification.)</p>
</div>

<h3>4. Exercice d'application</h3>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Exercice :</strong> Écoute un morceau local, puis rédige une appréciation fondée sur deux éléments musicaux précis.</p>
<p><strong>Critères :</strong> mention d'instruments ou de voix, du rythme, des nuances, ou de la forme.</p>
</div>

<h3>5. Erreurs fréquentes à éviter</h3>
<div class="bloc theorie"><div class="bloc-label">Erreurs</div>
<p>Présenter une préférence personnelle comme un jugement objectif. Juger sans écouter attentivement. Ignorer les éléments musicaux au profit des seules paroles.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Activité pratique</div>
<p>Écoute un morceau de musique congolaise. Rédige trois phrases d'appréciation en citant des éléments musicaux précis.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Écouter attentivement permet de repérer les éléments musicaux. Une appréciation respectueuse s'appuie sur des faits musicaux, pas sur un goût personnel. On distingue le goût personnel du jugement musical.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de musique (MEPST/DIPROMAD). Wikimedia Commons (fiches des images).</div>
    `

function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });

function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}

    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>
