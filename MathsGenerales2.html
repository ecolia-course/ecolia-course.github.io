{
    title: "Leçon 1 — Calcul numérique : puissances, racines et proportionnalité",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment calculer le prix de 3,5 kg de riz, une remise de 15 %, ou une distance sur une carte ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Appliquer les règles de calcul sur les puissances. Simplifier des racines carrées. Résoudre des problèmes de proportionnalité et de pourcentages. Prérequis : opérations sur les réels, fractions.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Règles de calcul sur les puissances :</strong></p>
<ul>
<li>a^m × a^n = a^(m+n)</li>
<li>a^m / a^n = a^(m−n)</li>
<li>(a^m)^n = a^(m×n)</li>
<li>a^0 = 1 (a ≠ 0)</li>
<li>a^(−n) = 1 / a^n</li>
</ul>
<p><strong>Racines carrées :</strong></p>
<ul>
<li>√(a×b) = √a × √b (a, b ≥ 0)</li>
<li>Attention : √(a+b) ≠ √a + √b.</li>
<li>Exemple : √50 = √(25×2) = 5√2.</li>
</ul>
<p><strong>Proportionnalité :</strong> deux grandeurs sont proportionnelles si leurs rapports sont constants.</p>
<ul>
<li><strong>Règle de trois :</strong> si 1 kg coûte 2 500 FC, alors 3,5 kg coûtent 3,5 × 2 500 = 8 750 FC.</li>
<li><strong>Pourcentage :</strong> t % de x = (t/100) × x. Exemple : 15 % de 2 000 = 0,15 × 2 000 = 300.</li>
</ul>
<p><strong>Échelles :</strong> 1/50 000 signifie que 1 cm sur la carte représente 50 000 cm = 500 m = 0,5 km sur le terrain.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Puissance :</strong> écriture aⁿ = a × a × … × a (n fois). <strong>Racine carrée :</strong> nombre positif dont le carré est a. <strong>Proportionnalité :</strong> rapport constant entre deux grandeurs.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Appliquer les règles de calcul une par une. Simplifier les racines en cherchant un carré parfait. Convertir les pourcentages en décimaux. Poser clairement la règle de trois.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>3,5 kg de riz à 2 500 FC/kg : 3,5 × 2 500 = 8 750 FC. Remise de 15 % sur un article de 2 000 FC : 2 000 × 0,15 = 300 FC de remise, soit 1 700 FC à payer. Carte au 1/50 000 : 4 cm sur la carte = 4 × 50 000 cm = 200 000 cm = 2 km.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Simplifier √72. <strong>Ex. 2 :</strong> Calculer 15 % de 2 000 FC.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> √72 = √(36×2) = 6√2. <strong>2)</strong> 0,15 × 2 000 = 300 FC.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La proportionnalité est un outil universel ; les règles de calcul doivent être appliquées avec rigueur.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel « Réussir en Mathématiques – 2ème Année Hum » (LAHA Éditions).</div>
    `
},
{
    title: "Leçon 2 — Équations et inéquations",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un commerçant veut calculer combien de pagnes vendre pour réaliser un bénéfice. Comment poser le problème ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Résoudre une équation du premier degré. Résoudre une équation du second degré. Résoudre une inéquation. Mettre un problème en équation. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Équation du premier degré :</strong> ax + b = 0 → x = −b/a (a ≠ 0).</p>
<p>Exemple : 2x + 3 = 11 → 2x = 8 → x = 4.</p>
<p><strong>Équation du second degré :</strong> ax² + bx + c = 0 (a ≠ 0).</p>
<ul>
<li><strong>Discriminant :</strong> Δ = b² − 4ac.</li>
<li>Si Δ > 0 : deux solutions x = (−b ± √Δ) / 2a.</li>
<li>Si Δ = 0 : une solution double x = −b/2a.</li>
<li>Si Δ < 0 : aucune solution réelle.</li>
</ul>
<p><strong>Produit nul :</strong> un produit est nul si et seulement si l'un de ses facteurs est nul. Utile pour résoudre (x−2)(x+3) = 0.</p>
<p><strong>Inéquations du premier degré :</strong> mêmes règles que les équations, mais attention : multiplier ou diviser par un nombre négatif change le sens de l'inégalité.</p>
<p><strong>Mise en équation :</strong> traduire un problème concret en langage mathématique.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Équation :</strong> égalité contenant une inconnue. <strong>Solution :</strong> valeur qui rend l'égalité vraie. <strong>Inéquation :</strong> inégalité contenant une inconnue. <strong>Discriminant :</strong> Δ = b² − 4ac.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Isoler l'inconnue. Vérifier la solution. Pour le second degré, calculer Δ avant tout. Changer le sens de l'inégalité si on multiplie/divise par un négatif. Traduire un problème étape par étape.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un commerçant achète des pagnes à 5 000 FC l'unité et les revend avec un bénéfice total de 20 000 FC. Combien en a-t-il vendus à 7 500 FC l'unité ? Mise en équation : 7 500x − 5 000x = 20 000 → 2 500x = 20 000 → x = 8. Il a vendu 8 pagnes.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Résoudre 2x + 3 = 11. <strong>Ex. 2 :</strong> Résoudre x² − 5x + 6 = 0.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> x = 4. <strong>2)</strong> Δ = 25 − 24 = 1 ; x = (5 ± 1)/2 → x = 3 ou x = 2.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une équation se résout par étapes ; la solution doit toujours être vérifiée.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel « Réussir en Mathématiques – 2ème Année Hum » (LAHA Éditions).</div>
    `
},
{
    title: "Leçon 3 — Fonctions : linéaire, affine et quadratique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment modéliser le coût d'un abonnement téléphonique en fonction du temps de communication ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la notion de fonction. Distinguer fonction linéaire, affine, quadratique. Lire et tracer des graphiques. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Fonction :</strong> relation qui associe à chaque nombre x une image f(x).</p>
<p><strong>Fonction linéaire :</strong> f(x) = ax. Sa représentation graphique est une droite passant par l'origine (0, 0).</p>
<p><strong>Fonction affine :</strong> f(x) = ax + b. Sa représentation graphique est une droite qui coupe l'axe des ordonnées au point (0, b).</p>
<p><strong>Fonction quadratique :</strong> f(x) = ax² + bx + c. Sa représentation graphique est une parabole.</p>
<p><strong>Vocabulaire :</strong> image (f(x)) et antécédent (x tel que f(x) = y).</p>
<p><strong>Exemple concret :</strong> coût d'un abonnement téléphonique = 1 000 FC de frais fixes + 200 FC par minute. f(x) = 200x + 1 000 où x est le nombre de minutes. C'est une fonction affine.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Fonction linéaire :</strong> f(x) = ax. <strong>Fonction affine :</strong> f(x) = ax + b. <strong>Fonction quadratique :</strong> f(x) = ax² + bx + c. <strong>Parabole :</strong> courbe d'une fonction quadratique.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier le type de fonction par sa formule. Représenter la fonction en calculant quelques points. Lire une image ou un antécédent sur le graphique. Interpréter le coefficient a (pente) et b (ordonnée à l'origine).</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>f(x) = 200x + 1 000. Image de 10 : f(10) = 200 × 10 + 1 000 = 3 000 FC. Antécédent de 3 000 : 200x + 1 000 = 3 000 → 200x = 2 000 → x = 10 minutes.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est l'image de 3 par f(x) = 2x + 1 ? <strong>Ex. 2 :</strong> Quel est le type de la fonction f(x) = 3x ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> f(3) = 2(3) + 1 = 7. <strong>2)</strong> Fonction linéaire.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une fonction linéaire passe par l'origine ; une fonction affine ne passe pas forcément par l'origine ; une fonction quadratique produit une parabole.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel « Réussir en Mathématiques – 2ème Année Hum » (LAHA Éditions).</div>
    `
},
{
    title: "Leçon 4 — Statistique descriptive",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment résumer en quelques chiffres les notes d'une classe ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Organiser des données. Calculer les indicateurs de tendance centrale et de dispersion. Choisir une représentation adaptée. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Vocabulaire :</strong></p>
<ul>
<li><strong>Population :</strong> ensemble étudié (ex. élèves de la classe).</li>
<li><strong>Échantillon :</strong> sous-ensemble de la population.</li>
<li><strong>Caractère :</strong> ce qu'on étudie. Il est <strong>qualitatif</strong> (non numérique) ou <strong>quantitatif</strong> (numérique).</li>
<li><strong>Effectif :</strong> nombre d'individus pour une valeur.</li>
<li><strong>Fréquence :</strong> effectif / effectif total.</li>
</ul>
<p><strong>Représentations graphiques :</strong></p>
<ul>
<li><strong>Diagramme en bâtons :</strong> pour caractère qualitatif ou discret.</li>
<li><strong>Histogramme :</strong> pour caractère quantitatif continu.</li>
<li><strong>Diagramme circulaire :</strong> pour les proportions (camembert).</li>
</ul>
<p><strong>Mesures de tendance centrale :</strong></p>
<ul>
<li><strong>Moyenne :</strong> somme des valeurs / effectif total. Sensible aux valeurs extrêmes.</li>
<li><strong>Médiane :</strong> valeur qui partage l'effectif en deux groupes égaux.</li>
<li><strong>Mode :</strong> valeur la plus fréquente.</li>
</ul>
<p><strong>Mesures de dispersion :</strong></p>
<ul>
<li><strong>Étendue :</strong> valeur maximale − valeur minimale.</li>
<li><strong>Écart-type (initiation) :</strong> dispersion autour de la moyenne.</li>
</ul>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Effectif :</strong> nombre d'individus. <strong>Fréquence :</strong> effectif / effectif total. <strong>Médiane :</strong> valeur centrale. <strong>Étendue :</strong> max − min.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Intérêt simple :</strong> I = C × t × n, où C = capital, t = taux (en décimal), n = durée (en années).</p>

<p><strong>Intérêt composé (initiation) :</strong> à chaque période, les intérêts s'ajoutent au capital. Formule : C_n = C × (1 + t)^n.</p>
<p>Exemple : C = 100 000 FC, t = 10 %, n = 2 ans → C_2 = 100 000 × (1,10)² = 121 000 FC.</p>
<p><strong>Budget :</strong> tableau qui compare les recettes et les dépenses. Solde = recettes − dépenses.</p>
<ul>
<li>Solde positif : excédent (épargne possible).</li>
<li>Solde négatif : déficit (emprunt ou réduction des dépenses).</li>

<p><strong>Pourcentages appliqués :</strong> remise (prix × (1 − t)), taxe (prix × (1 + t)).</p>

tion: racine carrée de (a plus b) différent de racine carrée de a plus racine carrée de b. Exemple: racine carrée de 50 égale racine carrée de (25 multiplié par 2) égale 5 racine carrée de 2. Proportionnalité: deux grandeurs sont proportionnelles si leurs rapports sont constants. Règle de trois: si 1 kilogrammes coûte 2 500 FC, alors 3,5 kilogrammes coûtent 3,5 multiplié par 2 500 égale 8 750 FC. Pourcentage: t pour cent de x égale (t/100) multiplié par x. Exemple: 15 pour cent de 2 000 égale 0,15 multiplié par 2 000 égale 300. Échelles: 1 sur 50 000 signifie que 1 centimètres sur la carte représente 50 000 centimètres égale 500 mètres égale 0,5 kilomètres sur le terrain. Définitions. Puissance: écriture aⁿ égale a multiplié par a multiplié par … multiplié par a (n fois). Racine carrée: nombre positif dont le carré est a. Proportionnalité: rapport constant entre deux grandeurs. Méthodes et règles. Appliquer les règles de calcul une par une. Simplifier les racines en cherchant un carré parfait. Convertir les pourcentages en décimaux. Poser clairement la règle de trois. Exemple. 3,5 kilogrammes de riz à 2 500 FC ou kg: 3,5 multiplié par 2 500 égale 8 750 FC. Remise de 15 pour cent sur un article de 2 000 FC: 2 000 multiplié par 0,15 égale 300 FC de remise, soit 1 700 FC à payer. Carte au 1 sur 50 000: 4 centimètres sur la carte égale 4 multiplié par 50 000 centimètres égale 200 000 centimètres égale 2 kilomètres. Exercices. Ex. 1: Simplifier racine carrée de 72. Ex. 2: Calculer 15 pour cent de 2 000 FC. Corrigé. 1) racine carrée de 72 égale racine carrée de (36 multiplié par 2) égale 6 racine carrée de 2. 2) 0,15 multiplié par 2 000 égale 300 FC. À retenir. La proportionnalité est un outil universel; les règles de calcul doivent être appliquées avec rigueur."]],"3":[["fr","Leçon 2, Équations et inéquations. Situation. « Un commerçant veut calculer combien de pagnes vendre pour réaliser un bénéfice. Comment poser le problème? ». Objectifs. Résoudre une équation du premier degré. Résoudre une équation du second degré. Résoudre une inéquation. Mettre un problème en équation. Prérequis: leçon 1. Théorie. Équation du premier degré: ax plus b égale 0, donc x égale moins b ou a (a différent de 0). Exemple: 2x plus 3 égale 11, donc 2x égale 8, donc x égale 4. Équation du second degré: ax au carré plus bx plus c égale 0 (a différent de 0). Discriminant: Δ égale b au carré moins 4ac. Si Δ supérieur à 0: deux solutions x égale ( moins b ± racine carrée de Δ) ou 2a. Si Δ égale 0: une solution double x égale moins b/2a. Si Δ inférieur à 0: aucune solution réelle. Produit nul: un produit est nul si et seulement si l'un de ses facteurs est nul. Utile pour résoudre (x moins 2)(x plus 3) égale 0. Inéquations du premier degré: mêmes règles que les équations, mais attention: multiplier ou diviser par un nombre négatif change le sens de l'inégalité. Mise en équation: traduire un problème concret en langage mathématique. Définitions. Équation: égalité contenant une inconnue. Solution: valeur qui rend l'égalité vraie. Inéquation: inégalité contenant une inconnue. Discriminant: Δ égale b au carré moins 4ac. Méthodes et règles. Isoler l'inconnue. Vérifier la solution. Pour le second degré, calculer Δ avant tout. Changer le sens de l'inégalité si on multiplie ou divise par un négatif. Traduire un problème étape par étape. Exemple. Un commerçant achète des pagnes à 5 000 FC l'unité et les revend avec un bénéfice total de 20 000 FC. Combien en a-t-il vendus à 7 500 FC l'unité? Mise en équation: 7 500x moins 5 000x égale 20 000, donc 2 500x égale 20 000, donc x égale 8. Il a vendu 8 pagnes. Exercices. Ex. 1: Résoudre 2x plus 3 égale 11. Ex. 2: Résoudre x au carré moins 5x plus 6 égale 0. Corrigé. 1) x égale 4. 2) Δ égale 25 moins 24 égale 1; x égale (5 ± 1)/2, donc x égale 3 ou x égale 2. À retenir. Une équation se résout par étapes; la solution doit toujours être vérifiée."]],"4":[["fr","Leçon 3, Fonctions: linéaire, affine et quadratique. Situation. « Comment modéliser le coût d'un abonnement téléphonique en fonction du temps de communication? ». Objectifs. Comprendre la notion de fonction. Distinguer fonction linéaire, affine, quadratique. Lire et tracer des graphiques. Prérequis: leçons 1 et 2. Théorie. Fonction: relation qui associe à chaque nombre x une image f(x). Fonction linéaire: f(x) égale ax. Sa représentation graphique est une droite passant par l'origine (0, 0). Fonction affine: f(x) égale ax plus b. Sa représentation graphique est une droite qui coupe l'axe des ordonnées au point (0, b). Fonction quadratique: f(x) égale ax au carré plus bx plus c. Sa représentation graphique est une parabole. Vocabulaire: image (f(x)) et antécédent (x tel que f(x) égale y). Exemple concret: coût d'un abonnement téléphonique égale 1 000 FC de frais fixes plus 200 FC par minute. f(x) égale 200x plus 1 000 où x est le nombre de minutes. C'est une fonction affine. Définitions. Fonction linéaire: f(x) égale ax. Fonction affine: f(x) égale ax plus b. Fonction quadratique: f(x) égale ax au carré plus bx plus c. Parabole: courbe d'une fonction quadratique. Méthodes et règles. Identifier le type de fonction par sa formule. Représenter la fonction en calculant quelques points. Lire une image ou un antécédent sur le graphique. Interpréter le coefficient a (pente) et b (ordonnée à l'origine). Exemple. f(x) égale 200x plus 1 000. Image de 10: f(10) égale 200 multiplié par 10 plus 1 000 égale 3 000 FC. Antécédent de 3 000: 200x plus 1 000 égale 3 000, donc 200x égale 2 000, donc x égale 10 minutes. Exercices. Ex. 1: Quelle est l'image de 3 par f(x) égale 2x plus 1? Ex. 2: Quel est le type de la fonction f(x) égale 3x? Corrigé. 1) f(3) égale 2(3) plus 1 égale 7. 2) Fonction linéaire. À retenir. Une fonction linéaire passe par l'origine; une fonction affine ne passe pas forcément par l'origine; une fonction quadratique produit une parabole."]],"5":[["fr","Leçon 4, Statistique descriptive. Situation. « Comment résumer en quelques chiffres les notes d'une classe? ». Objectifs. Organiser des données. Calculer les indicateurs de tendance centrale et de dispersion. Choisir une représentation adaptée. Prérequis: leçons 1 à 3. Théorie. Vocabulaire: Population: ensemble étudié (ex. élèves de la classe). Échantillon: sous-ensemble de la population. Caractère: ce qu'on étudie. Il est qualitatif (non numérique) ou quantitatif (numérique). Effectif: nombre d'individus pour une valeur. Fréquence: effectif ou effectif total. Représentations graphiques: Diagramme en bâtons: pour caractère qualitatif ou discret. Histogramme: pour caractère quantitatif continu. Diagramme circulaire: pour les proportions (camembert). Mesures de tendance centrale: Moyenne: somme des valeurs ou effectif total. Sensible aux valeurs extrêmes. Médiane: valeur qui partage l'effectif en deux groupes égaux. Mode: valeur la plus fréquente. Mesures de dispersion: Étendue: valeur maximale moins valeur minimale. Écart-type (initiation): dispersion autour de la moyenne. Définitions. Effectif: nombre d'individus. Fréquence: effectif ou effectif total. Médiane: valeur centrale. Étendue: max moins min. Méthodes et règles. Organiser les données dans un tableau. Trier les valeurs pour la médiane. Choisir la représentation adaptée au type de caractère. Interpréter avec prudence: la moyenne seule peut être trompeuse. Exemple. Série: 8, 12, 10, 14, 6. Effectif total égale 5. Moyenne égale (8 plus 12 plus 10 plus 14 plus 6) ou 5 égale 50 sur 5 égale 10. Médiane égale 10 (valeur centrale une fois triées: 6, 8, 10, 12, 14). Étendue égale 14 moins 6 égale 8. Mode: pas de valeur unique répétée. Exercices. Ex. 1: Calculer la moyenne de la série: 8, 12, 10, 14, 6. Ex. 2: Quelle mesure est la plus sensible aux valeurs extrêmes? Corrigé. 1) 10. 2) La moyenne. À retenir. Une donnée brute ne dit rien; c'est son organisation et son analyse qui produisent du sens."]],"6":[["fr","Leçon 5, Mathématiques financières et vie quotidienne. Situation. « Comment calculer ce que rapporte une épargne ou combien coûte un crédit? ». Objectifs. Calculer un intérêt simple. Comprendre l'intérêt composé. Gérer un budget. Prérequis: leçons 1 à 4. Théorie. Intérêt simple: I égale C multiplié par t multiplié par n, où C égale capital, t égale taux (en décimal), n égale durée (en années). Exemple: C égale 100 000 FC, t égale 10 pour cent égale 0,10, n égale 2 ans, donc I égale 100 000 multiplié par 0,10 multiplié par 2 égale 20 000 FC. Intérêt composé (initiation): à chaque période, les intérêts s'ajoutent au capital. Formule: C_n égale C multiplié par (1 plus t)^n. Exemple: C égale 100 000 FC, t égale 10 pour cent, n égale 2 ans, donc C_2 égale 100 000 multiplié par (1,10) au carré égale 121 000 FC. Budget: tableau qui compare les recettes et les dépenses. Solde égale recettes moins dépenses. Solde positif: excédent (épargne possible). Solde négatif: déficit (emprunt ou réduction des dépenses). Pourcentages appliqués: remise (prix multiplié par (1 moins t)), taxe (prix multiplié par (1 plus t)). Définitions. Intérêt simple: calculé sur le capital initial. Intérêt composé: calculé sur le capital augmenté des intérêts. Budget: tableau recettes ou dépenses. Solde: recettes moins dépenses. Méthodes et règles. Convertir le taux en décimal. Vérifier l'unité de temps (années, mois). Distinguer intérêt simple et composé. Établir un budget équilibré. Exemple. Un commerçant emprunte 100 000 FC à 10 pour cent par an pendant 2 ans. Intérêt simple: 20 000 FC (rembourse 120 000 FC). Intérêt composé: 21 000 FC (rembourse 121 000 FC). La différence vient de l'ajout des intérêts au capital. Exercices. Ex. 1: Calculer l'intérêt simple pour un capital de 50 000 FC à 8 pour cent pendant 3 ans. Ex. 2: Que représente le solde d'un budget? Corrigé. 1) I égale 50 000 multiplié par 0,08 multiplié par 3 égale 12 000 FC. 2) La différence entre les recettes et les dépenses. À retenir. L'intérêt simple se calcule sur le capital initial; un budget équilibré est un outil de gestion."]],"7":[["fr","Évaluation finale, Mathématiques Générales. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 12 sur 20, tu as réussi."]]}};

      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
