const COURSE_TITLE = "Biochimie Alimentaire";
const slides = [
{
    title: "Sommaire — Biochimie Alimentaire 3e année",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours initie à la biochimie des aliments : glucides, lipides, protéines, vitamines et minéraux, transformations biochimiques (cuisson, fermentation), altérations des aliments, évaluation nutritionnelle simple.</p>
<p><strong>Note de transparence :</strong> aucun programme officiel RDC de biochimie alimentaire pour la 3e année des humanités (option Nutrition) n'a été localisé dans les sources consultées. L'option Nutrition est attestée par les manuels d'Agriculture Générale, d'Enquête Nutritionnelle et de Diététique. Ce cours propose une <strong>initiation</strong> alignée sur ces bases et sur les référentiels supérieurs simplifiés, à valider par l'enseignant.</p>
<ul>
<li>Leçon 1 — Qu'est-ce que la biochimie alimentaire ?</li>
<li>Leçon 2 — Les glucides</li>
<li>Leçon 3 — Les lipides</li>
<li>Leçon 4 — Les protéines</li>
<li>Leçon 5 — Vitamines et minéraux</li>
<li>Leçon 6 — Les transformations biochimiques (cuisson, fermentation)</li>
<li>Leçon 7 — Les altérations des aliments</li>
<li>Leçon 8 — Évaluation nutritionnelle simple</li>
<li>Leçon 9 — Synthèse et évaluation</li>
</ul>
<p>Une évaluation finale de 12 questions porte sur les notions clés.</p>
</div>
<div class="sources"><strong>Sources :</strong> Références générales en biochimie alimentaire ; manuels Nutrition 3e année (Agriculture, Diététique). Statut du programme spécifique à valider.</div>
    `
},
{
    title: "Leçon 1 — Qu'est-ce que la biochimie alimentaire ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un aliment change-t-il de goût, de couleur et de texture quand on le cuit ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la biochimie alimentaire. Comprendre son objet. Situer son intérêt en nutrition.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>La <strong>biochimie alimentaire</strong> étudie la composition chimique des aliments et les transformations qu'ils subissent lors de la préparation, de la conservation et de la digestion. Elle relie la chimie des aliments à la nutrition humaine.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Son intérêt</div>
<ul>
<li>Comprendre la valeur nutritionnelle des aliments.</li>
<li>Préserver les nutriments lors de la préparation.</li>
<li>Éviter les altérations et les intoxications.</li>
<li>Adapter l'alimentation aux besoins.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis la biochimie alimentaire.</p>
<p><strong>Ex. 2 :</strong> Cite trois intérêts de cette discipline.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Étude de la composition et des transformations des aliments. <strong>2)</strong> Valeur nutritionnelle, préparation, prévention.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La biochimie alimentaire relie la chimie des aliments à la nutrition et à la santé.</p></div>
<div class="sources"><strong>Sources :</strong> Références générales.</div>
    `
},
{
    title: "Leçon 2 — Les glucides",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi le pain, le riz et le manioc rassasient-ils rapidement ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir les glucides. Distinguer les grands types. Comprendre leur rôle énergétique.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>Les <strong>glucides</strong> (sucres) sont des molécules composées de carbone, d'hydrogène et d'oxygène. Ils constituent la principale source d'énergie de l'organisme.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les grands types</div>
<ul>
<li><strong>Oses (sucres simples) :</strong> glucose, fructose.</li>
<li><strong>Oligosides :</strong> saccharose (sucre de table), lactose (sucre du lait).</li>
<li><strong>Polyosides :</strong> amidon (réserve des végétaux), glycogène (réserve animale), cellulose (structure des végétaux, fibres).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Sources alimentaires</div>
<p>On trouve les glucides dans : céréales (riz, maïs), tubercules (manioc, patate douce), fruits, légumineuses, sucre.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois types de glucides.</p>
<p><strong>Ex. 2 :</strong> Pourquoi l'amidon est-il une forme de réserve ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Oses, oligosides, polyosides. <strong>2)</strong> Parce que les plantes stockent l'énergie sous forme d'amidon.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les glucides fournissent l'énergie ; ils existent sous forme simple (sucres) et complexe (amidon, fibres).</p></div>
<div class="sources"><strong>Sources :</strong> Références générales.</div>
    `
},
{
    title: "Leçon 3 — Les lipides",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une alimentation très grasse est-elle à la fois indispensable et à surveiller ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir les lipides. Distinguer les grands types. Comprendre leur rôle.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>Les <strong>lipides</strong> (corps gras) sont des molécules insolubles dans l'eau, solubles dans les solvants organiques. Ils fournissent de l'énergie (plus concentrée que les glucides) et participent à la structure des cellules.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les grands types</div>
<ul>
<li><strong>Triglycérides :</strong> huiles (liquides) et graisses (solides).</li>
<li><strong>Phospholipides :</strong> constituants des membranes.</li>
<li><strong>Stérols :</strong> cholestérol (utile à faible dose, à surveiller en excès).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Rôle</div>
<ul>
<li>Réserve d'énergie.</li>
<li>Structure des membranes cellulaires.</li>
<li>Transport des vitamines liposolubles (A, D, E, K).</li>
<li>Protection et isolation.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Distingue huiles et graisses.</p>
<p><strong>Ex. 2 :</strong> Cite deux rôles des lipides.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Huiles : liquides ; graisses : solides. <strong>2)</strong> Réserve d'énergie, structure des membranes.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les lipides sont indispensables à faible dose : ils fournissent de l'énergie et structurent les cellules.</p></div>
<div class="sources"><strong>Sources :</strong> Références générales.</div>
    `
},
{
    title: "Leçon 4 — Les protéines",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un régime uniquement à base de riz peut-il entraîner des carences ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir les protéines. Comprendre leur composition. Distinguer les sources et la qualité.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>Les <strong>protéines</strong> sont de longues chaînes d'<strong>acides aminés</strong> reliés par des liaisons peptidiques. Elles assurent :</p>
<ul>
<li>la structure (muscles, peau, os) ;</li>
<li>les fonctions enzymatiques ;</li>
<li>le transport (hémoglobine) ;</li>
<li>la défense immunitaire.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Sources</div>
<ul>
<li><strong>Animales :</strong> viande, poisson, œufs, lait.</li>
<li><strong>Végétales :</strong> haricots, arachides, soja, céréales.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Qualité</div>
<p>Une protéine est de bonne qualité si elle apporte tous les acides aminés essentiels. L'association d'aliments (céréales + légumineuses, par exemple riz + haricots) améliore la qualité de l'apport protéique.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> De quoi les protéines sont-elles composées ?</p>
<p><strong>Ex. 2 :</strong> Propose une association alimentaire locale apportant des protéines complètes.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Acides aminés. <strong>2)</strong> Riz + haricots, maïs + haricot, manioc + arachides.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les protéines construisent l'organisme ; associer céréales et légumineuses améliore leur qualité.</p></div>
<div class="sources"><strong>Sources :</strong> Références générales.</div>
    `
},
{
    title: "Leçon 5 — Vitamines et minéraux",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi manquer de vitamines peut-il être aussi grave que manquer de nourriture ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le rôle des vitamines et minéraux. Identifier les carences fréquentes. Situer les sources alimentaires.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les vitamines</div>
<p>Les <strong>vitamines</strong> sont des substances indispensables en petite quantité. On distingue :</p>
<ul>
<li><strong>Hydrosolubles :</strong> C, groupe B (excrétées dans les urines, à apporter régulièrement).</li>
<li><strong>Liposolubles :</strong> A, D, E, K (stockées dans le foie et les tissus gras).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les minéraux</div>
<ul>
<li><strong>Calcium :</strong> os, dents.</li>
<li><strong>Fer :</strong> transport de l'oxygène (hémoglobine).</li>
<li><strong>Iode :</strong> thyroïde.</li>
<li><strong>Zinc :</strong> immunité, croissance.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Sources</div>
<p>Fruits et légumes frais (vitamine C), huile de palme rouge et carottes (vitamine A), poisson et produits laitiers (calcium, vitamine D), feuilles vertes et légumineuses (fer).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Distingue vitamines hydrosolubles et liposolubles.</p>
<p><strong>Ex. 2 :</strong> Cite deux sources de fer.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Hydrosolubles : C et B ; liposolubles : A, D, E, K. <strong>2)</strong> Feuilles vertes, légumineuses.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Vitamines et minéraux sont indispensables en petite quantité : leur carence a des conséquences graves.</p></div>
<div class="sources"><strong>Sources :</strong> Références générales.</div>
    `
},
{
    title: "Leçon 6 — Les transformations biochimiques (cuisson, fermentation)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi le manioc est-il fermenté avant consommation dans certaines préparations ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les transformations. Identifier les effets sur les aliments. Relier à la digestibilité.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La cuisson</div>
<ul>
<li><strong>Réactions de Maillard :</strong> brunissement des aliments (pain, viande grillée), apparition d'arômes.</li>
<li><strong>Gélatinisation de l'amidon :</strong> les grains d'amidon absorbent l'eau et gonflent (riz cuit, bouillie).</li>
<li><strong>Coagulation des protéines :</strong> le blanc d'œuf devient solide.</li>
<li><strong>Effets :</strong> améliore la digestibilité, mais peut détruire certaines vitamines.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La fermentation</div>
<p>La <strong>fermentation</strong> utilise des micro-organismes (bactéries, levures) pour transformer les aliments :</p>
<ul>
<li>améliore la conservation ;</li>
<li>développe des arômes ;</li>
<li>peut détoxifier (cas du manioc, dont certaines variétés contiennent des composés amers).</li>
</ul>
<p>Exemple : la fermentation du manioc pour obtenir la chikwangue ou les cossettes.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite deux transformations lors de la cuisson.</p>
<p><strong>Ex. 2 :</strong> Pourquoi le manioc est-il fermenté ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Réactions de Maillard, gélatinisation de l'amidon. <strong>2)</strong> Pour améliorer la conservation, le goût et réduire certains composés.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Cuisson et fermentation modifient les aliments : elles améliorent la digestibilité et la conservation.</p></div>
<div class="sources"><strong>Sources :</strong> Références générales.</div>
    `

    btn.setAttribute("aria-label", "Écouter la leçon"); btn.innerHTML = PLAY;
    var dlBtn = document.createElement("button");
    dlBtn.id = "ecolia-dl-btn"; dlBtn.type = "button"; dlBtn.className = "ecolia-off";
    dlBtn.innerHTML = DL;
    var host = document.querySelector(".header-right");
    if (host) { host.insertBefore(dlBtn, host.firstChild); host.insertBefore(btn, dlBtn); }
    else { btn.className += " ecolia-fixed"; document.body.appendChild(btn); }
    var banner = document.createElement("div");
    banner.id = "ecolia-audio-banner";
    banner.innerHTML = '<span class="eab-txt"></span><span class="eab-act"></span><div class="eab-bar"><i></i></div>';
    var content = document.getElementById("content");
    if (content && content.parentNode) content.parentNode.insertBefore(banner, content);
    else document.body.insertBefore(banner, document.body.firstChild);
    var txtEl = banner.querySelector(".eab-txt"), actEl = banner.querySelector(".eab-act");
    var barEl = banner.querySelector(".eab-bar"), barI = barEl.firstChild;
    var audio = new Audio();
    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }
    function cur() { try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {} return 0; }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
