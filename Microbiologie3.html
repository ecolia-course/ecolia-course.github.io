<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours initie à la microbiologie appliquée aux soins : grands groupes de micro-organismes, cellule bactérienne, virus et champignons, parasites, multiplication microbienne, stérilisation et désinfection, principales infections en RDC, bases de l'immunologie. La dimension clinique et hygiénique est privilégiée.</p>
<p><strong>Note de transparence :</strong> le cours s'appuie sur le manuel officiel de Microbiologie 3e année (Édition 2025), qui développe une forte composante moléculaire, et sur les programmes ITM (ISTM Goma, ISTM Kibombo) qui listent la microbiologie. Le programme spécifique ITM 3e année n'a pas été localisé dans son intégralité. Le plan rééquilibre vers la microbiologie médicale et l'hygiène, en laissant la microbiologie moléculaire à un niveau d'initiation. Aucun protocole de laboratoire ou de stérilisation n'est imposé : les protocoles précis relèvent des établissements et des autorités sanitaires.</p>
<ul>
<li>Leçon 1 — Introduction à la microbiologie</li>
<li>Leçon 2 — La cellule bactérienne</li>
<li>Leçon 3 — Les virus et les champignons</li>
<li>Leçon 4 — Les parasites (notions)</li>
<li>Leçon 5 — Multiplication microbienne et facteurs de croissance</li>
<li>Leçon 6 — Stérilisation et désinfection</li>
<li>Leçon 7 — Les principales infections en RDC</li>
<li>Leçon 8 — Introduction à l'immunologie</li>
<li>Leçon 9 — Synthèse et évaluation</li>
</ul>
<p>Une évaluation finale de 16 questions porte sur les notions clés.</p>
</div>
<div class="sources"><strong>Sources :</strong> Manuel officiel de Microbiologie 3e année (Édition 2025) ; programmes ITM (ISTM Goma, ISTM Kibombo).</div>
    `
},
{
    title: "Leçon 1 — Introduction à la microbiologie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un simple lavage des mains peut-il empêcher une infection ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la microbiologie. Identifier les grands groupes de micro-organismes. Situer son intérêt en soins infirmiers.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>La <strong>microbiologie</strong> est la science qui étudie les êtres vivants invisibles à l'œil nu : bactéries, virus, champignons, parasites. Elle s'intéresse à leur structure, leur multiplication, leur transmission et leur rôle dans la santé et la maladie.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les grands groupes</div>
<ul>
<li><strong>Bactéries :</strong> cellules sans noyau (procaryotes).</li>
<li><strong>Virus :</strong> particules infectieuses sans métabolisme propre.</li>
<li><strong>Champignons :</strong> eucaryotes, parfois microscopiques (levures, moisissures).</li>
<li><strong>Parasites :</strong> protozoaires, vers, parfois visibles (notions).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Utilité</div>
<ul>
<li>Comprendre la transmission des infections.</li>
<li>Appliquer les gestes de prévention (hygiène, asepsie).</li>
<li>Prélever correctement et transmettre au laboratoire.</li>
<li>Éduquer le patient et la famille.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les quatre grands groupes de micro-organismes.</p>
<p><strong>Ex. 2 :</strong> Pourquoi la microbiologie est-elle utile à l'infirmier ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Bactéries, virus, champignons, parasites. <strong>2)</strong> Pour comprendre et prévenir la transmission des infections.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La microbiologie étudie les êtres invisibles ; elle éclaire la prévention des infections.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel Microbiologie 3e ; programmes ITM.</div>
    `
},
{
    title: "Leçon 2 — La cellule bactérienne",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi la paroi bactérienne influence-t-elle le choix d'un antibiotique ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Décrire la morphologie et la structure des bactéries. Comprendre la coloration de Gram. Situer son intérêt clinique.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Morphologie</div>
<ul>
<li><strong>Coques :</strong> forme ronde.</li>
<li><strong>Bacilles :</strong> forme allongée.</li>
<li><strong>Spirilles / spirochètes :</strong> forme hélicoïdale.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Structure</div>
<ul>
<li><strong>Paroi :</strong> enveloppe externe (rôle majeur dans la coloration de Gram).</li>
<li><strong>Membrane cytoplasmique.</strong></li>
<li><strong>Cytoplasme :</strong> ribosomes, inclusions.</li>
<li><strong>ADN circulaire.</strong></li>
<li>Parfois : <strong>capsule, flagelles, pili</strong> (rôle dans la virulence et la mobilité).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La coloration de Gram</div>
<p>La coloration de <strong>Gram</strong> distingue :</p>
<ul>
<li><strong>bactéries à Gram positif</strong> (paroi épaisse, coloration violette) ;</li>
<li><strong>bactéries à Gram négatif</strong> (paroi fine, coloration rose).</li>
</ul>
<p>Ce résultat oriente le choix des traitements, mais la décision relève du médecin. L'infirmier peut être amené à prélever et à transmettre.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois formes bactériennes.</p>
<p><strong>Ex. 2 :</strong> Que distingue la coloration de Gram ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Coques, bacilles, spirilles. <strong>2)</strong> Les bactéries à Gram positif et à Gram négatif.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La structure des bactéries et la coloration de Gram sont utiles au diagnostic et au traitement.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel Microbiologie 3e.</div>
    `
},
{
    title: "Leçon 3 — Les virus et les champignons",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un antibiotique ne guérit-il pas une grippe ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer virus et bactéries. Comprendre la structure des virus. Identifier les grands types de champignons.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les virus</div>
<p>Un <strong>virus</strong> est une particule infectieuse très petite, composée :</p>
<ul>
<li>d'un <strong>matériel génétique</strong> (ADN ou ARN) ;</li>
<li>d'une <strong>capside</strong> protéique ;</li>
<li>parfois d'une <strong>enveloppe</strong>.</li>
</ul>
<p>Il ne se multiplie qu'à l'intérieur d'une cellule hôte. Il est <strong>insensible aux antibiotiques</strong> ; certaines infections virales se préviennent par la vaccination (ex. : rougeole, hépatite B, poliomyélite).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les champignons</div>
<p>Les <strong>champignons</strong> microscopiques (levures et moisissures) peuvent provoquer des infections (mycoses) : peau, ongles, muqueuses. Certains sont commensaux, d'autres pathogènes. Leur traitement repose sur des antifongiques prescrits par le médecin.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Pourquoi les antibiotiques ne tuent-ils pas les virus ?</p>
<p><strong>Ex. 2 :</strong> Cite deux types de champignons microscopiques.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Parce que les virus n'ont pas de métabolisme propre ni de paroi bactérienne ciblable. <strong>2)</strong> Levures, moisissures.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les virus et les champignons se distinguent des bactéries ; leur traitement est spécifique.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel Microbiologie 3e.</div>
    `
},
{
    title: "Leçon 4 — Les parasites (notions)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi les parasites intestinaux sont-ils si fréquents dans certaines communautés ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les grands types de parasites. Comprendre leur transmission. Situer la prévention.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les grands types</div>
<ul>
<li><strong>Protozoaires :</strong> organismes unicellulaires (ex. : amibes, Plasmodium, agent du paludisme).</li>
<li><strong>Vers intestinaux :</strong> vers ronds (ascaris) ou plats.</li>
<li><strong>Parasites externes :</strong> poux, gale, puces.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Transmission</div>
<ul>
<li>Eau et aliments contaminés.</li>
<li>Mains sales.</li>
<li>Piqûres d'insectes (moustique pour le paludisme).</li>
<li>Contact direct (gale, poux).</li>
<li>Sol souillé (vers).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Prévention</div>
<ul>
<li>Lavage des mains.</li>
<li>Eau potable et aliments protégés.</li>
<li>Hygiène corporelle.</li>
<li>Lutte contre les insectes.</li>
<li>Déparasitage selon les recommandations de santé.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois types de parasites.</p>
<p><strong>Ex. 2 :</strong> Cite trois moyens de transmission des parasites.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Protozoaires, vers, parasites externes. <strong>2)</strong> Eau, mains sales, insectes.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les parasites se transmettent par l'eau, les mains, les insectes ; l'hygiène est la première prévention.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel Microbiologie 3e.</div>
    `
},
{
    title: "Leçon 5 — Multiplication microbienne et facteurs de croissance",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un aliment laissé à l'air chaud se gâte-t-il plus vite ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la multiplication. Identifier les facteurs. Situer les applications pratiques.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Multiplication</div>
<p>Les bactéries se multiplient par <strong>division cellulaire</strong> : une cellule donne deux cellules, qui en donnent quatre, etc. Ce phénomène peut être très rapide dans de bonnes conditions, ce qui explique la survenue brutale d'une infection ou d'une intoxication alimentaire.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Facteurs de croissance</div>
<ul>
<li><strong>Nutriments :</strong> eau, sources de carbone et d'azote.</li>
<li><strong>Température :</strong> chaque micro-organisme a une plage favorable.</li>
<li><strong>pH :</strong> acidité ou alcalinité.</li>
<li><strong>Oxygène :</strong> certaines bactéries en ont besoin, d'autres non.</li>
<li><strong>Humidité.</strong></li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Applications pratiques</div>
<ul>
<li>Conservation au froid : ralentit la multiplication.</li>
<li>Cuisson : détruit la majorité des micro-organismes pathogènes.</li>
<li>Séchage, salaison, acidification : limitent la croissance.</li>
<li>Hygiène des mains : réduit la transmission.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois facteurs qui favorisent la multiplication microbienne.</p>
<p><strong>Ex. 2 :</strong> Pourquoi conserver les aliments au froid ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Nutriments, chaleur, humidité. <strong>2)</strong> Pour ralentir la multiplication des micro-organismes.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La multiplication microbienne dépend de plusieurs facteurs ; les maîtriser limite les infections.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel Microbiologie 3e.</div>
    `
},
{
    title: "Leçon 6 — Stérilisation et désinfection",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi ne désinfecte-t-on pas de la même façon un instrument chirurgical et une surface ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer stérilisation, désinfection, antisepsie. Identifier les méthodes. Comprendre les principes de base.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Trois notions</div>
<ul>
<li><strong>Stérilisation :</strong> destruction de tous les micro-organismes, y compris les spores.</li>
<li><strong>Désinfection :</strong> réduction des micro-organismes sur une surface ou un objet inerte.</li>
<li><strong>Antisepsie :</strong> désinfection appliquée sur la peau ou les muqueuses.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Méthodes</div>
