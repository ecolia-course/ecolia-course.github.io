{
    title: "Leçon 1 — Introduction : le nouveau-né normal",

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi le nouveau-né est-il un être fragile qui exige des soins particuliers ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la période néonatale. Comprendre les particularités du nouveau-né. Situer le rôle des soignants.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La période néonatale</div>
<p>La <strong>période néonatale</strong> correspond aux 28 premiers jours de vie. C'est une période de grande vulnérabilité : adaptation à la vie extra-utérine, immaturité des systèmes, dépendance totale aux soins.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Particularités du nouveau-né</div>
<ul>
<li><strong>Thermorégulation :</strong> perte de chaleur rapide, risque d'hypothermie.</li>
<li><strong>Respiration :</strong> immature, risque de détresse.</li>
<li><strong>Immunité :</strong> faible, risque infectieux élevé.</li>
<li><strong>Alimentation :</strong> dépend entièrement du lait (maternel de préférence).</li>
<li><strong>Peau fragile</strong>, cordon ombilical en cours de cicatrisation.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Rôle des soignants</div>
<ul>
<li>Assurer la chaleur, l'hygiène, l'alimentation.</li>
<li>Surveiller l'état général.</li>
<li>Détecter les signes de danger.</li>
<li>Éduquer et soutenir la famille.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la durée de la période néonatale ?</p>
<p><strong>Ex. 2 :</strong> Cite trois particularités du nouveau-né.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> 28 premiers jours. <strong>2)</strong> Thermorégulation difficile, immaturité respiratoire, immunité faible.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le nouveau-né est un être fragile dont la survie dépend de soins adaptés et d'une surveillance attentive.</p></div>
<div class="sources"><strong>Sources :</strong> Programme ISTM Goma ; curriculum UNFPA.</div>
    `

{
    title: "Leçon 2 — L'évaluation à la naissance (Apgar, examen)",

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi évalue-t-on le nouveau-né dès la première minute de vie ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le score d'Apgar. Réaliser un examen rapide. Alerter en cas d'anomalie.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le score d'Apgar</div>
<p>Le <strong>score d'Apgar</strong> évalue 5 critères à la 1re et à la 5e minute de vie :</p>
<ul>
<li><strong>Fréquence cardiaque.</strong></li>
<li><strong>Respiration.</strong></li>
<li><strong>Toncus musculaire.</strong></li>
<li><strong>Réactivité (réflexes).</strong></li>
<li><strong>Couleur de la peau.</strong></li>
</ul>
<p>Chaque critère est noté de 0 à 2, pour un score total de 0 à 10. Un score bas impose une surveillance et, si nécessaire, des gestes de réanimation de base.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — L'examen rapide</div>
<ul>
<li>Poids, taille, périmètre crânien.</li>
<li>Recherche de malformations évidentes.</li>
<li>Aspect général (tonus, cri, coloration).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois critères du score d'Apgar.</p>
<p><strong>Ex. 2 :</strong> À quels moments évalue-t-on l'Apgar ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Fréquence cardiaque, respiration, tonus (3 au choix parmi 5). <strong>2)</strong> À la 1re et à la 5e minute de vie.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le score d'Apgar éclaire la décision : il oriente la surveillance et, si nécessaire, les gestes de base.</p></div>
<div class="sources"><strong>Sources :</strong> Programme ISTM Goma ; curriculum UNFPA (SENN).</div>
    `

    title: "Leçon 3 — Les soins immédiats et la thermorégulation",

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi sèche-t-on immédiatement un nouveau-né à la naissance ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie — Soins immédiats</div>
<ol>
<li><strong>Dégagement des voies aériennes.</strong></li>
<li><strong>Séchage</strong> immédiat avec un linge propre et sec.</li>
<li><strong>Évaluation</strong> rapide (Apgar).</li>
<li><strong>Contact peau à peau</strong> avec la mère.</li>
<li><strong>Mise au sein précoce</strong> si l'état du nouveau-né le permet.</li>
</ol>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Thermorégulation</div>
<p>Le nouveau-né perd rapidement de la chaleur. Il faut :</p>
<ul>
<li>le sécher soigneusement, y compris la tête ;</li>
<li>le couvrir (bonnet, linge) ;</li>
<li>favoriser le peau à peau ;</li>
<li>maintenir une température ambiante adaptée ;</li>
<li>surveiller les signes d'hypothermie (peau froide, léthargie, refus de téter).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois soins immédiats au nouveau-né.</p>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les soins immédiats protègent le nouveau-né et préviennent l'hypothermie.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie — Le colostrum</div>
<p>Le <strong>colostrum</strong> est le premier lait, produit dans les premiers jours. Il est riche en anticorps et en éléments nutritifs : il est particulièrement précieux pour le nouveau-né.</p>

<li>Allaitement à la demande.</li>
<li>Position et prise du sein correctes.</li>

<p><strong>Ex. 2 :</strong> Qu'est-ce que le colostrum ?</p>
<details><summary>Corrigé</summary>

</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'allaitement maternel protège le nouveau-né et soutient la relation mère-enfant.</p></div>
<div class="sources"><strong>Sources :</strong> Curriculum UNFPA (SENN) ; références nutritionnelles.</div>
    `
},

    content: `

    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi la moindre anomalie chez un nouveau-né doit-elle être prise au sérieux ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les signes de danger. Comprendre leur gravité. Orienter sans délai.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Signes de danger</div>

<li><strong>Détresse respiratoire :</strong> geignement, tirage, respiration rapide ou irrégulière.</li>

iers jours de vie. C'est une période de grande vulnérabilité: adaptation à la vie extra-utérine, immaturité des systèmes, dépendance totale aux soins. Théorie, Particularités du nouveau-né. Thermorégulation: perte de chaleur rapide, risque d'hypothermie. Respiration: immature, risque de détresse. Immunité: faible, risque infectieux élevé. Alimentation: dépend entièrement du lait (maternel de préférence). Peau fragile, cordon ombilical en cours de cicatrisation. Théorie, Rôle des soignants. Assurer la chaleur, l'hygiène, l'alimentation. Surveiller l'état général. Détecter les signes de danger. Éduquer et soutenir la famille. Exercices. Ex. 1: Quelle est la durée de la période néonatale? Ex. 2: Cite trois particularités du nouveau-né. Corrigé. 1) 28 premiers jours. 2) Thermorégulation difficile, immaturité respiratoire, immunité faible. À retenir. Le nouveau-né est un être fragile dont la survie dépend de soins adaptés et d'une surveillance attentive."]],"3":[["fr","Leçon 2, L'évaluation à la naissance (Apgar, examen). Situation. « Pourquoi évalue-t-on le nouveau-né dès la première minute de vie? ». Objectifs. Comprendre le score d'Apgar. Réaliser un examen rapide. Alerter en cas d'anomalie. Théorie, Le score d'Apgar. Le score d'Apgar évalue 5 critères à la 1re et à la 5e minute de vie: Fréquence cardiaque. Respiration. Toncus musculaire. Réactivité (réflexes). Couleur de la peau. Chaque critère est noté de 0 à 2, pour un score total de 0 à 10. Un score bas impose une surveillance et, si nécessaire, des gestes de réanimation de base. Théorie, L'examen rapide. Poids, taille, périmètre crânien. Recherche de malformations évidentes. Aspect général (tonus, cri, coloration). Exercices. Ex. 1: Cite trois critères du score d'Apgar. Ex. 2: À quels moments évalue-t-on l'Apgar? Corrigé. 1) Fréquence cardiaque, respiration, tonus (3 au choix parmi 5). 2) À la 1re et à la 5e minute de vie. À retenir. Le score d'Apgar éclaire la décision: il oriente la surveillance et, si nécessaire, les gestes de base."]],"4":[["fr","Leçon 3, Les soins immédiats et la thermorégulation. Situation. « Pourquoi sèche-t-on immédiatement un nouveau-né à la naissance? ». Objectifs. Comprendre les soins immédiats. Prévenir l'hypothermie. Réaliser les gestes essentiels. Théorie, Soins immédiats. Dégagement des voies aériennes. Séchage immédiat avec un linge propre et sec. Évaluation rapide (Apgar). Contact peau à peau avec la mère. Mise au sein précoce si l'état du nouveau-né le permet. Théorie, Thermorégulation. Le nouveau-né perd rapidement de la chaleur. Il faut: le sécher soigneusement, y compris la tête; le couvrir (bonnet, linge); favoriser le peau à peau; maintenir une température ambiante adaptée; surveiller les signes d'hypothermie (peau froide, léthargie, refus de téter). Exercices. Ex. 1: Cite trois soins immédiats au nouveau-né. Ex. 2: Pourquoi faut-il sécher la tête du nouveau-né? Corrigé. 1) Dégagement des voies aériennes, séchage, peau à peau. 2) Pour limiter la perte de chaleur et prévenir l'hypothermie. À retenir. Les soins immédiats protègent le nouveau-né et préviennent l'hypothermie."]],"5":[["fr","Leçon 4, L'allaitement maternel. Situation. « Pourquoi le colostrum est-il un aliment précieux pour le nouveau-né? ». Objectifs. Comprendre les bénéfices de l'allaitement. Connaître les bonnes pratiques. Soutenir la mère. Théorie, Bénéfices. Apport nutritionnel adapté. Anticorps transmis (protection contre les infections). Lien affectif avec la mère. Réduction du risque de certaines maladies de l'enfant et de la mère. Théorie, Le colostrum. Le colostrum est le premier lait, produit dans les premiers jours. Il est riche en anticorps et en éléments nutritifs: il est particulièrement précieux pour le nouveau-né. Théorie, Bonnes pratiques. Mise au sein précoce. Allaitement à la demande. Position et prise du sein correctes. Pas de biberon ni de tétine avant 6 mois (sauf indication). Soutien à la mère (alimentation, hydratation, repos, encouragement). Exercices. Ex. 1: Cite trois bénéfices de l'allaitement maternel. Ex. 2: Qu'est-ce que le colostrum? Corrigé. 1) Apport nutritionnel, anticorps, lien affectif. 2) Le premier lait, riche en anticorps. À retenir. L'allaitement maternel protège le nouveau-né et soutient la relation mère-enfant."]],"6":[["fr","Leçon 5, Les soins du cordon et l'hygiène. Situation. « Pourquoi le cordon ombilical est-il une porte d'entrée pour les infections? ». Objectifs. Comprendre les soins du cordon. Appliquer les règles d'hygiène. Reconnaître les signes d'infection. Théorie, Soins du cordon. Hygiène des mains avant et après. Nettoyage du cordon à chaque change, selon les protocoles locaux. Séchage soigneux. Ne pas couvrir de façon étanche. Ne pas appliquer de produits non recommandés. Théorie, Signes d'infection du cordon. Rougeur qui s'étend autour de l'ombilic. Œdème, chaleur. Pus, mauvaise odeur. Saignement. Fièvre, refus de téter, léthargie. Ces signes imposent une orientation médicale rapide (risque de tétanos néonatal, septicémie). Exercices. Ex. 1: Cite trois gestes de soin du cordon. Ex. 2: Cite deux signes d'infection du cordon. Corrigé. 1) Hygiène des mains, nettoyage, séchage. 2) Rougeur qui s'étend, pus. À retenir. Le cordon est une zone sensible: hygiène rigoureuse et surveillance des signes d'infection."]],"7":[["fr","Leçon 6, Les signes de danger et l'orientation. Situation. « Pourquoi la moindre anomalie chez un nouveau-né doit-elle être prise au sérieux? ». Objectifs. Identifier les signes de danger. Comprendre leur gravité. Orienter sans délai. Théorie, Signes de danger. Détresse respiratoire: geignement, tirage, respiration rapide ou irrégulière. Hypothermie ou fièvre. Ictère précoce ou intense. Refus de téter, léthargie. Convulsions. Vomissements répétés. Signes d'infection (cordon, peau, yeux). Théorie, Conduite à tenir. Réchauffer le nouveau-né si nécessaire. Alerter le médecin. Préparer le transfert si nécessaire. Accompagner et rassurer la famille. Noter les signes et l'heure. Exercices. Ex. 1: Cite trois signes de danger chez le nouveau-né. Ex. 2: Pourquoi noter les signes et l'heure? Corrigé. 1) Détresse respiratoire, ictère, refus de téter. 2) Pour transmettre une information fiable au médecin et suivre l'évolution. À retenir. Tout signe de danger chez le nouveau-né impose une alerte et une orientation rapides."]],"8":[["fr","Leçon 7, La réanimation néonatale de base. Situation. « Pourquoi les premières secondes après la naissance sont-elles décisives si le bébé ne respire pas? ». Objectifs. Comprendre les principes. Connaître les gestes de base. Orienter sans délai. Théorie, Principes. La réanimation néonatale de base vise à rétablir la respiration. Elle repose sur une séquence simple: Réchauffer (séchage, chaleur). Dégager les voies aériennes (position adaptée). Stimuler (frottement doux, stimulation). Ventiler si nécessaire, avec le matériel adapté (masque, ballon), selon les protocoles. Chaque geste doit être fait avec calme et méthode. Théorie, Limites. La réanimation avancée (intubation, médicaments) relève de professionnels formés. L'élève apprend les gestes de base et le rôle de l'orientation urgente. Exercices. Ex. 1: Cite les grandes étapes de la réanimation néonatale de base. Ex. 2: Pourquoi faut-il orienter rapidement si le bébé ne réagit pas? Corrigé. 1) Réchauffer, dégager les voies aériennes, stimuler, ventiler. 2) Pour bénéficier d'une prise en charge spécialisée urgente. À retenir. Les gestes de base sont simples et ordonnés; au-delà, l'orientation rapide est indispensable."]],"9":[["fr","Leçon 8, Atelier pratique et évaluation. Objectifs. Mobiliser les acquis dans des simulations. Réaliser les gestes. S'auto-évaluer. Atelier. Séchage et peau à peau (sur mannequin). Calcul d'un score d'Apgar sur un cas simulé. Soins du cordon. Mise au sein (position, prise). Gestes de base de réanimation néonatale (sur mannequin). Grille d'évaluation. Hygiène: gestes corrects. Technique: précision et ordre. Sécurité: chaleur, surveillance, alerte. Communication: avec la famille. Exercices. Ex. 1: Réalise les ateliers en petits groupes. Ex. 2: Remplis la grille et note deux progrès à faire. Corrigé indicatif. La réussite valorise l'hygiène, la précision et la communication. À retenir. La néonatologie s'apprend par la pratique encadrée et la simulation."]],"10":[["fr","Évaluation finale, Néonatologie 3e année. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 8 points sur 14, tu as réussi. En dessous, revois les leçons indiquées."]]}};

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
</html>
