const slides = [
{
    title: "Sommaire — Éducation physique 1re secondaire",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>L'éducation physique t'apprend à bouger, à te dépenser et à prendre soin de ton corps. Elle t'apprend aussi à jouer avec les autres, à respecter les règles et à prévenir les accidents. Tu peux pratiquer même sans équipement coûteux : un terrain, un ballon, des chaussures adaptées suffisent.</p>
<ul>
<li>Leçon 1 — Pourquoi faire de l'éducation physique ?</li>
<li>Leçon 2 — Le corps à l'effort</li>
<li>Leçon 3 — Échauffement et récupération</li>
<li>Leçon 4 — La course</li>
<li>Leçon 5 — Les sauts</li>
<li>Leçon 6 — Les lancers et la coordination</li>
<li>Leçon 7 — Les jeux collectifs et le football</li>
<li>Leçon 8 — Le basket-ball</li>
<li>Leçon 9 — L'athlétisme</li>
<li>Leçon 10 — Hygiène corporelle et santé</li>
<li>Leçon 11 — Prévention des accidents et premiers gestes</li>
<li>Leçon 12 — Bouger toute la vie : sport et bien-être</li>
</ul>
<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme national d'Éducation Physique (MEPST/DIPROMAD, 2005), OMS. Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 1 — Pourquoi faire de l'éducation physique ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi l'école nous demande-t-elle de faire du sport ? Est-ce seulement pour s'amuser, ou est-ce utile pour la santé et l'apprentissage ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Expliquer l'utilité de l'EPS. Distinguer ses trois domaines. Identifier les bénéfices pour la santé. Prérequis : aucun.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'EPS poursuit trois objectifs complémentaires : le <strong>développement physique</strong> (force, endurance), la <strong>santé</strong> (prévention de la sédentarité) et la <strong>socialisation</strong> (respect, esprit d'équipe).</p>
<p>Le programme officiel distingue trois domaines : l'éducation physique, le sport (compétition, fair-play) et la récréation (jeux, plein air).</p>
<p>L'OMS recommande aux jeunes au moins 60 minutes d'activité physique par jour.</p>
</div>
<img src="images/EducationPhysique1_1.jpg" alt="Enfants jouant au football" data-image-id="EducationPhysique1_1" onerror="this.style.display='none'">
<img src="images/EducationPhysique1_16.jpg" alt="Élèves marchant vers l'école" data-image-id="EducationPhysique1_16" onerror="this.style.display='none'">

<h3>3. Méthodes et repères</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour tirer profit de l'EPS, il faut pratiquer régulièrement, varier les activités et respecter les consignes de sécurité. Marcher pour aller à l'école compte aussi comme activité physique.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'EPS développe le corps, la santé et la vie sociale ; elle ne se limite pas au sport de compétition.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'EPS (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 2 — Le corps à l'effort",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Quand tu cours, ton cœur bat plus vite, tu respires plus fort, tu transpires. Pourquoi ? Que se passe-t-il dans ton corps ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Identifier les grands systèmes du corps. Comprendre leurs réponses à l'effort. Adapter son effort.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Lors d'un effort, quatre systèmes collaborent :</p>
<ul>
<li><strong>Respiratoire :</strong> les poumons absorbent l'oxygène.</li>
<li><strong>Cardiovasculaire :</strong> le cœur accélère pour envoyer le sang aux muscles.</li>
<li><strong>Musculaire :</strong> les muscles se contractent et produisent le mouvement.</li>
<li><strong>Squelettique :</strong> les os soutiennent le corps.</li>
</ul>
<p>L'effort provoque : accélération du rythme cardiaque, augmentation de la respiration, transpiration (régulation de la température).</p>
</div>
<img src="images/EducationPhysique1_2.jpg" alt="Systèmes du corps humain" data-image-id="EducationPhysique1_2" onerror="this.style.display='none'">
<img src="images/EducationPhysique1_3.jpg" alt="Prise du pouls au poignet" data-image-id="EducationPhysique1_3" onerror="this.style.display='none'">

<h3>3. Méthodes et repères</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour mesurer son rythme cardiaque : compter les battements pendant 15 secondes et multiplier par 4.</p>
<p><strong>Signaux d'arrêt :</strong> essoufflement excessif, vertiges, douleurs.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le corps s'adapte à l'effort grâce à la collaboration de plusieurs systèmes ; il faut savoir reconnaître ses limites.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'EPS (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 3 — Échauffement et récupération",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Avant un match ou une course, les joueurs s'échauffent. Après, ils s'étirent. Pourquoi ces deux moments sont-ils importants ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre la nécessité de l'échauffement. Savoir structurer une séance. Pratiquer un retour au calme adapté.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>L'échauffement</strong> prépare le corps : augmentation de la température, accélération du cœur, préparation des muscles. Il réduit le risque de blessure.</p>
<p><strong>La récupération</strong> permet de revenir au calme : ralentissement progressif, étirements, respiration.</p>
</div>
<img src="images/EducationPhysique1_4.jpg" alt="Étirement des jambes" data-image-id="EducationPhysique1_4" onerror="this.style.display='none'">

<h3>3. Techniques et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p><strong>Échauffement (10-15 min) :</strong> trottinement ➔ mobilisation articulaire ➔ étirements dynamiques légers.</p>
<p><strong>Récupération (5-10 min) :</strong> marche lente ➔ étirements statiques (20-30s) ➔ respiration.</p>
<p><strong>Règle absolue :</strong> ne jamais commencer un effort intense sans échauffement.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Échauffement et récupération sont deux temps obligatoires d'une séance d'EPS bien construite.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'EPS (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 4 — La course",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certains courent-ils plus vite et plus longtemps que d'autres ? La course s'apprend-elle ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Maîtriser les bases techniques de la course. Améliorer son endurance et sa vitesse. Respecter la sécurité.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La course de <strong>vitesse</strong> est courte (sprint 50-100 m). La course d'<strong>endurance</strong> est longue.</p>
<p><strong>Technique :</strong> posture droite, regard loin devant, bras qui accompagnent, respiration régulière.</p>
</div>
<img src="images/EducationPhysique1_5.jpg" alt="Coureur en sprint" data-image-id="EducationPhysique1_5" onerror="this.style.display='none'">

<h3>3. Techniques et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p><strong>Vitesse :</strong> départ réactif, poussée forte, bras dynamiques.</p>
<p><strong>Endurance :</strong> allure régulière, ne pas partir trop vite.</p>
<p><strong>Sécurité :</strong> s'échauffer, choisir un terrain plat, boire de l'eau.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La course est l'activité de base de l'athlétisme ; elle se pratique partout et s'améliore par la régularité.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'EPS (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 5 — Les sauts",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Sauter en longueur, sauter en hauteur, sauter à cloche-pied : tous les sauts se ressemblent-ils ? Comment progresser ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Réaliser les principaux types de sauts. Améliorer la coordination et la détente. Respecter la sécurité.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Types de sauts : saut en longueur, saut en hauteur, triple saut, sauts rythmiques.</p>
<p>La <strong>réception</strong> est aussi importante que l'impulsion : elle doit se faire pieds joints, genoux fléchis, bras en avant pour amortir.</p>
</div>
<img src="images/EducationPhysique1_6.jpg" alt="Saut en longueur" data-image-id="EducationPhysique1_6" onerror="this.style.display='none'">

<h3>3. Techniques et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p><strong>Longueur :</strong> course d'élan, impulsion sur un pied, suspension, réception pieds joints.</p>
<p><strong>Sécurité :</strong> sauter sur une surface souple, échauffer les chevilles, vérifier l'absence d'obstacles.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les sauts développent la détente, la coordination et l'équilibre ; la réception est aussi importante que l'impulsion.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'EPS (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 6 — Les lancers et la coordination",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment lancer un ballon loin et avec précision ? Pourquoi certains lancent-ils mieux que d'autres ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Réaliser des lancers simples. Améliorer la coordination. Respecter la sécurité.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les lancers développent la force, la précision et la coordination.</p>
<p><strong>Principes :</strong> prise correcte de l'objet, pieds écartés, rotation du tronc, extension du bras.</p>
</div>
<img src="images/EducationPhysique1_7.jpg" alt="Lancer de balle" data-image-id="EducationPhysique1_7" onerror="this.style.display='none'">

<h3>3. Techniques et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p><strong>Sécurité :</strong> lancer dans une direction dégagée, ne jamais lancer vers une personne, récupérer les objets seulement quand tout le monde a lancé.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les lancers et la coordination se développent par la répétition et le respect des consignes de sécurité.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national d'EPS (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 7 — Les jeux collectifs et le football",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi le football est-il si populaire en RDC ? Qu'apprend-on en jouant en équipe ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre l'intérêt des jeux collectifs. Connaître les règles de base du football. Manifester l'esprit sportif.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Deux équipes (11 joueurs standard), un ballon, deux buts. Le but est de marquer dans le but adverse.</p>
<p>Seul le gardien peut utiliser les mains dans sa surface.</p>
<p><strong>Fair-play :</strong> respecter l'arbitre, les adversaires, accepter la défaite, ne pas tricher.</p>
</div>
<img src="images/EducationPhysique1_8.jpg" alt="Match de football" data-image-id="EducationPhysique1_8" onerror="this.style.display='none'">
<img src="images/EducationPhysique1_9.jpg" alt="Terrain de football" data-image-id="EducationPhysique1_9" onerror="this.style.display='none'">

<h3>3. Techniques et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p><strong>Techniques :</strong> conduite de balle, passe, tir, contrôle, dribble, jeu de tête.</p>

      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
