const slides = [
  {
    title: "Sommaire — Microbiologie Tropicale",
    content: `
      <div class="bloc resume">
        <div class="bloc-label">Bienvenue</div>
        <h3>La microbiologie tropicale : comprendre les invisibles pour mieux soigner</h3>
        <p>La <strong>microbiologie tropicale</strong> étudie les micro-organismes (bactéries, virus, parasites, champignons) et leur rôle dans les maladies infectieuses qui sévissent principalement en zone tropicale. En République Démocratique du Congo, le climat chaud et humide, la présence de vecteurs, l'accès limité à l'eau potable et les conditions d'hygiène favorisent la transmission de nombreuses maladies infectieuses : choléra, fièvre typhoïde, shigellose, méningites, paludisme, tuberculose, VIH, parasitoses intestinales.</p>
        <p>Ce cours s'adresse aux élèves de 4<sup>e</sup> Humanité de la section ITM (Institut Technique Médical), filière Soins Infirmiers. Il prépare le futur infirmier A2 à <strong>comprendre les agents pathogènes</strong>, à <strong>identifier les maladies infectieuses prioritaires</strong>, à <strong>appliquer les mesures de prévention</strong> et à <strong>participer à la surveillance épidémiologique</strong> aux côtés de l'INRB et des zones de santé.</p>
        <p><strong>Important :</strong> ce cours présente les principes et les observations de base. Les actes de laboratoire spécialisés et les diagnostics médicaux relèvent du médecin ou du biologiste. L'infirmier reconnaît, prévient, éduque, notifie et collabore.</p>
      </div>

      <div class="bloc theorie">
        <div class="bloc-label">Objectifs d'apprentissage</div>
        <p>À la fin de ce cours, l'élève doit être capable de :</p>
        <ol>
          <li>Définir les concepts de base de la microbiologie.</li>
          <li>Classer et décrire les principaux agents pathogènes (bactéries, virus, parasites, champignons).</li>
          <li>Expliquer les modes de transmission et les facteurs de risque des maladies infectieuses.</li>
          <li>Identifier les signes cliniques et les méthodes de diagnostic des maladies infectieuses prioritaires en RDC.</li>
          <li>Appliquer les mesures de prévention et de lutte.</li>
          <li>Réaliser des observations microbiologiques simples (coloration de Gram, observation microscopique).</li>
          <li>Participer à la surveillance épidémiologique et à l'éducation sanitaire.</li>
        </ol>
      </div>

      <div class="bloc cas">
        <div class="bloc-label">Grands chapitres du cours</div>
        <ul>
          <li><strong>Chapitre I</strong> — Introduction à la microbiologie tropicale.</li>
          <li><strong>Chapitre II</strong> — Les agents pathogènes : classification et structure.</li>
          <li><strong>Chapitre III</strong> — La pathogénicité et la transmission.</li>
          <li><strong>Chapitre IV</strong> — Les maladies bactériennes épidémiques.</li>
          <li><strong>Chapitre V</strong> — Le paludisme et les parasitoses.</li>
          <li><strong>Chapitre VI</strong> — La tuberculose et le VIH.</li>
          <li><strong>Chapitre VII</strong> — Les techniques de laboratoire.</li>
          <li><strong>Chapitre VIII</strong> — La prévention, la surveillance et l'éducation.</li>
        </ul>
      </div>
    `
  },
  {
    title: "Chapitre I — Pourquoi la microbiologie tropicale ?",
    content: `
      <div class="bloc cas">
        <div class="bloc-label">Situation-problème</div>
        <p>Dans un centre de santé d'Uvira, plusieurs patients arrivent le même jour avec une diarrhée aqueuse profuse, « eau de riz », et des vomissements. Un enfant est déjà très déshydraté. Le lendemain, deux autres cas sont signalés dans le même quartier. Que se passe-t-il ? Comment l'infirmier doit-il réagir ? Quelles mesures prendre pour éviter que l'épidémie ne se propage ?</p>
      </div>

      <div class="bloc theorie">
        <div class="bloc-label">Fondements théoriques</div>
        <h3>Une discipline au cœur de la santé publique</h3>
        <p>La <strong>microbiologie</strong> est la science qui étudie les micro-organismes et leurs interactions avec l'homme et l'environnement. La <strong>microbiologie tropicale</strong> se concentre sur les agents pathogènes dont l'épidémiologie est favorisée par le climat tropical :</p>
        <ul>
          <li><strong>Chaleur et humidité</strong> : favorisent la survie des bactéries dans l'eau et les aliments.</li>
          <li><strong>Vecteurs abondants</strong> : moustiques, mouches, puces, tiques, mouche tsé-tsé.</li>
          <li><strong>Eau et assainissement insuffisants</strong> : transmission féco-orale des maladies diarrhéiques.</li>
          <li><strong>Promiscuité et déplacements de population</strong> : favorisent les épidémies.</li>
        </ul>

        <h3>L'importance pour l'infirmier A2</h3>
        <p>L'infirmier est en première ligne :</p>
        <ul>
          <li>Il <strong>reconnaît</strong> les cas suspects (diarrhée profuse, fièvre, toux persistante, éruption).</li>
          <li>Il <strong>applique</strong> les mesures d'hygiène immédiates.</li>
          <li>Il <strong>éduque</strong> les patients et les familles.</li>
          <li>Il <strong>notifie</strong> les cas suspects aux autorités sanitaires (zones de santé, INRB).</li>
        </ul>

        <h3>Les maladies tropicales négligées</h3>
        <p>Affections qui touchent principalement les populations pauvres des régions tropicales : trypanosomiase, leishmaniose, schistosomiase, filariose, lèpre, ulcère de Buruli, etc. Elles sont souvent négligées par la recherche et les systèmes de santé, malgré leur impact considérable.</p>
      </div>

      <div class="bloc resume">
        <div class="bloc-label">À retenir</div>
        <p>La microbiologie tropicale étudie les agents infectieux en zone chaude et humide. L'infirmier A2 est un acteur clé de la reconnaissance, de la prévention et de la notification des cas. Les maladies tropicales négligées sont une priorité de santé publique.</p>
      </div>
    `
  },
  {
    title: "Chapitre I — Définitions et concepts de base",
    content: `
      <div class="bloc theorie">
        <div class="bloc-label">Fondements théoriques</div>
        <h3>Les mots-clés de la microbiologie</h3>

        <h4>Micro-organisme</h4>
        <p>Être vivant invisible à l'œil nu, observable au microscope. Les principaux groupes sont : bactéries, virus, champignons, protozoaires, helminthes (vers).</p>

        <h4>Pathogène</h4>
        <p>Micro-organisme capable de provoquer une maladie. Certains micro-organismes sont commensaux (ils vivent normalement sur ou dans le corps sans causer de maladie) ; d'autres sont opportunistes (ils provoquent une maladie quand les défenses immunitaires sont affaiblies).</p>

        <h4>Pathogénicité</h4>
        <p>Capacité d'un agent infectieux à provoquer une maladie. C'est un caractère qualitatif.</p>

        <h4>Virulence</h4>
        <p>Degré de gravité de la maladie provoquée. C'est un caractère quantitatif : une souche très virulente provoquera une maladie plus grave qu'une souche peu virulente.</p>

        <h4>Infection</h4>
        <p>Pénétration et multiplication d'un agent pathogène dans l'organisme.</p>

        <h4>Contamination</h4>
        <p>Présence d'un agent pathogène sur une surface, un aliment, un objet, ou dans un milieu. Elle peut ne pas provoquer d'infection.</p>

        <h4>Porteur sain</h4>
        <p>Personne qui héberge un agent pathogène sans manifester de symptômes, mais qui peut le transmettre à d'autres.</p>

        <h4>Immunité</h4>
        <p>Capacité de l'organisme à se défendre contre les infections. Elle peut être innée (barrières naturelles) ou acquise (après une infection ou une vaccination).</p>
      </div>

      <div class="bloc resume">
        <div class="bloc-label">Erreur fréquente</div>
        <p>Confondre <strong>contamination</strong> et <strong>infection</strong> est une erreur fréquente. Un aliment peut être contaminé sans qu'il y ait infection (si l'agent ne se multiplie pas ou si la personne ne le consomme pas). À l'inverse, un porteur sain est infecté sans être malade, mais il peut transmettre l'agent.</p>
      </div>
    `
  },
  {
    title: "Chapitre II — Les bactéries : structure et coloration de Gram",
    content: `
      <div class="bloc theorie">
        <div class="bloc-label">Fondements théoriques</div>
        <h3>Les bactéries</h3>
        <p>Les <strong>bactéries</strong> sont des cellules <strong>procaryotes</strong> : elles n'ont pas de noyau, leur matériel génétique baigne dans le cytoplasme. Ce sont des organismes vivants autonomes qui se multiplient par division binaire.</p>

        <h4>Structure</h4>
        <ul>
          <li><strong>Paroi cellulaire</strong> : enveloppe rigide qui donne la forme (coque, bacille, spirille).</li>
          <li><strong>Membrane cytoplasmique</strong> : contrôle les échanges.</li>
          <li><strong>Cytoplasme</strong> : contient les ribosomes, les enzymes, le matériel génétique.</li>
          <li><strong>Flagelles</strong> : appendices qui permettent la mobilité (facultatifs).</li>
          <li><strong>Pili</strong> : permettent l'adhésion aux cellules hôtes.</li>
          <li><strong>Capsule</strong> : enveloppe protectrice (facultative), favorise l'échappement immunitaire.</li>
          <li><strong>Spores</strong> : formes de résistance (chez certaines bactéries comme <em>Clostridium</em> et <em>Bacillus</em>).</li>
        </ul>

        <h4>La coloration de Gram</h4>
        <p>Technique de laboratoire qui distingue deux grands groupes de bactéries selon la structure de leur paroi :</p>
        <ul>
          <li><strong>Gram-positives</strong> : paroi épaisse (peptidoglycane), retiennent le violet de cristal et apparaissent <strong>violettes</strong> au microscope.</li>
          <li><strong>Gram-négatives</strong> : paroi fine, se décolorent à l'alcool et prennent le rose de la fuchsine ; elles apparaissent <strong>roses</strong>.</li>
        </ul>

        <h4>Pourquoi c'est important ?</h4>
        <p>La coloration de Gram <strong>oriente le diagnostic et le traitement</strong> :</p>
        <ul>
          <li>Un Gram positif (par exemple <em>Streptococcus</em>, <em>Staphylococcus</em>) ne se traite pas de la même façon qu'un Gram négatif (par exemple <em>Vibrio cholerae</em>, <em>Salmonella</em>).</li>
          <li>La forme de la bactérie complète l'information : coques Gram+ en chaînettes = <em>Streptococcus</em> ; bacilles Gram- = entérobactéries.</li>
        </ul>

        <h4>Les grandes formes</h4>
        <ul>
          <li><strong>Coques</strong> : sphériques (streptocoques, staphylocoques).</li>
          <li><strong>Bacilles</strong> : en forme de bâtonnets (E. coli, Salmonella, Vibrio cholerae).</li>
          <li><strong>Spirilles</strong> : en forme de spirale (Tréponème).</li>
          <li><strong>Vibrions</strong> : en forme de virgule (Vibrio cholerae).</li>
        </ul>
      </div>

      <div class="bloc resume">
        <div class="bloc-label">À retenir</div>
        <p>Les bactéries sont des procaryotes. La coloration de Gram distingue Gram-positives (violettes, paroi épaisse) et Gram-négatives (roses, paroi fine). La forme (coque, bacille, spirille, vibrion) complète l'identification. Gram et forme orientent le traitement.</p>
      </div>
    `
  },
  {
    title: "Chapitre II — Les virus, parasites et champignons",
    content: `
      <div class="bloc theorie">
        <div class="bloc-label">Fondements théoriques</div>
        <h3>Les virus</h3>
        <p>Les <strong>virus</strong> sont des agents infectieux <strong>acellulaires</strong>. Ils ne sont pas capables de se multiplier seuls : ils doivent pénétrer dans une cellule hôte et détourner sa machinerie pour se reproduire. Un virus est composé de :</p>
        <ul>
          <li><strong>Un acide nucléique</strong> : ADN ou ARN (jamais les deux).</li>
          <li><strong>Une capside</strong> : enveloppe protéique qui protège l'acide nucléique.</li>
          <li>Parfois une <strong>enveloppe</strong> lipidique.</li>
        </ul>
        <p>Les virus tropicaux importants en RDC :</p>
        <ul>
          <li><strong>Virus du chikungunya</strong> : transmis par <em>Aedes aegypti</em>, épidémie à Matadi en 2019.</li>
          <li><strong>Virus de la dengue</strong> : transmis par <em>Aedes</em>, présent à la frontière angolaise.</li>
          <li><strong>Virus Ebola</strong> : fièvre hémorragique grave, épidémies récurrentes en RDC.</li>
          <li><strong>Virus de la rougeole</strong> : prévention par la vaccination.</li>
          <li><strong>VIH</strong> : infection chronique.</li>
        </ul>

        <h3>Les parasites</h3>
        <p>Les <strong>parasites</strong> sont des organismes eucaryotes qui vivent aux dépens d'un hôte. On distingue :</p>
        <ul>
          <li><strong>Protozoaires</strong> : unicellulaires. Exemples : <em>Plasmodium</em> (paludisme), <em>Entamoeba histolytica</em> (amibiase), <em>Giardia lamblia</em> (giardiase), <em>Trypanosoma</em> (trypanosomiase).</li>
          <li><strong>Helminthes</strong> (vers) : pluricellulaires. Exemples : ascaris, ankylostomes, schistosomes, filaires.</li>
        </ul>

        <h3>Les champignons</h3>
        <p>Les <strong>champignons</strong> sont des eucaryotes. Certains sont responsables de mycoses superficielles (teigne, candidose buccale) ; d'autres de mycoses profondes (aspergillose, cryptococcose), surtout chez les personnes immunodéprimées (VIH).</p>

        <h4>Antibiotiques et virus</h4>
        <p><strong>Les antibiotiques n'agissent que sur les bactéries, pas sur les virus.</strong> Un rhume, une grippe, la rougeole, le VIH ne se traitent pas avec des antibiotiques. Utiliser un antibiotique pour une infection virale est inutile et favorise la résistance.</p>
      </div>

      <div class="bloc resume">
        <div class="bloc-label">Erreur fréquente</div>
        <p>Donner des antibiotiques pour une infection virale est une erreur fréquente et grave. Les antibiotiques ne tuent que les bactéries. En plus d'être inefficaces, ils favorisent la résistance des bactéries présentes dans l'organisme.</p>
      </div>
    `
  },
  {
    title: "Chapitre III — Les modes de transmission",
    content: `
      <div class="bloc theorie">

          <li>Les sporozoïtes gagnent le foie (phase hépatique).</li>
          <li>Puis ils passent dans le sang et infectent les globules rouges (phase sanguine), qui éclatent : fièvre et anémie.</li>

risque des maladies infectieuses. Identifier les signes cliniques et les méthodes de diagnostic des maladies infectieuses prioritaires en R D C. Appliquer les mesures de prévention et de lutte. Réaliser des observations microbiologiques simples (coloration de Gram, observation microscopique). Participer à la surveillance épidémiologique et à l'éducation sanitaire. Grands chapitres du cours. Chapitre I, Introduction à la microbiologie tropicale. Chapitre II, Les agents pathogènes: classification et structure. Chapitre III, La pathogénicité et la transmission. Chapitre IV, Les maladies bactériennes épidémiques. Chapitre V, Le paludisme et les parasitoses. Chapitre VI, La tuberculose et le VIH. Chapitre VII, Les techniques de laboratoire. Chapitre VIII, La prévention, la surveillance et l'éducation."]],"2":[["fr","Chapitre I, Pourquoi la microbiologie tropicale? Situation-problème. Dans un centre de santé d'Uvira, plusieurs patients arrivent le même jour avec une diarrhée aqueuse profuse, « eau de riz », et des vomissements. Un enfant est déjà très déshydraté. Le lendemain, deux autres cas sont signalés dans le même quartier. Que se passe-t-il? Comment l'infirmier doit-il réagir? Quelles mesures prendre pour éviter que l'épidémie ne se propage? Fondements théoriques. Une discipline au cœur de la santé publique. La microbiologie est la science qui étudie les micro-organismes et leurs interactions avec l'homme et l'environnement. La microbiologie tropicale se concentre sur les agents pathogènes dont l'épidémiologie est favorisée par le climat tropical: Chaleur et humidité: favorisent la survie des bactéries dans l'eau et les aliments. Vecteurs abondants: moustiques, mouches, puces, tiques, mouche tsé-tsé. Eau et assainissement insuffisants: transmission féco-orale des maladies diarrhéiques. Promiscuité et déplacements de population: favorisent les épidémies. L'importance pour l'infirmier A2. L'infirmier est en première ligne: Il reconnaît les cas suspects (diarrhée profuse, fièvre, toux persistante, éruption). Il applique les mesures d'hygiène immédiates. Il éduque les patients et les familles. Il notifie les cas suspects aux autorités sanitaires (zones de santé, INRB). Les maladies tropicales négligées. Affections qui touchent principalement les populations pauvres des régions tropicales: trypanosomiase, leishmaniose, schistosomiase, filariose, lèpre, ulcère de Buruli, etc. Elles sont souvent négligées par la recherche et les systèmes de santé, malgré leur impact considérable. À retenir. La microbiologie tropicale étudie les agents infectieux en zone chaude et humide. L'infirmier A2 est un acteur clé de la reconnaissance, de la prévention et de la notification des cas. Les maladies tropicales négligées sont une priorité de santé publique."]],"3":[["fr","Chapitre I, Définitions et concepts de base. Fondements théoriques. Les mots-clés de la microbiologie. Micro-organisme. Être vivant invisible à l'œil nu, observable au microscope. Les principaux groupes sont: bactéries, virus, champignons, protozoaires, helminthes (vers). Pathogène. Micro-organisme capable de provoquer une maladie. Certains micro-organismes sont commensaux (ils vivent normalement sur ou dans le corps sans causer de maladie); d'autres sont opportunistes (ils provoquent une maladie quand les défenses immunitaires sont affaiblies). Pathogénicité. Capacité d'un agent infectieux à provoquer une maladie. C'est un caractère qualitatif. Virulence. Degré de gravité de la maladie provoquée. C'est un caractère quantitatif: une souche très virulente provoquera une maladie plus grave qu'une souche peu virulente. Infection. Pénétration et multiplication d'un agent pathogène dans l'organisme. Contamination. Présence d'un agent pathogène sur une surface, un aliment, un objet, ou dans un milieu. Elle peut ne pas provoquer d'infection. Porteur sain. Personne qui héberge un agent pathogène sans manifester de symptômes, mais qui peut le transmettre à d'autres. Immunité. Capacité de l'organisme à se défendre contre les infections. Elle peut être innée (barrières naturelles) ou acquise (après une infection ou une vaccination). Erreur fréquente. Confondre contamination et infection est une erreur fréquente. Un aliment peut être contaminé sans qu'il y ait infection (si l'agent ne se multiplie pas ou si la personne ne le consomme pas). À l'inverse, un porteur sain est infecté sans être malade, mais il peut transmettre l'agent."]],"4":[["fr","Chapitre II, Les bactéries: structure et coloration de Gram. Fondements théoriques. Les bactéries. Les bactéries sont des cellules procaryotes: elles n'ont pas de noyau, leur matériel génétique baigne dans le cytoplasme. Ce sont des organismes vivants autonomes qui se multiplient par division binaire. Structure. Paroi cellulaire: enveloppe rigide qui donne la forme (coque, bacille, spirille). Membrane cytoplasmique: contrôle les échanges. Cytoplasme: contient les ribosomes, les enzymes, le matériel génétique. Flagelles: appendices qui permettent la mobilité (facultatifs). Pili: permettent l'adhésion aux cellules hôtes. Capsule: enveloppe protectrice (facultative), favorise l'échappement immunitaire. Spores: formes de résistance (chez certaines bactéries comme Clostridium et Bacillus). La coloration de Gram. Technique de laboratoire qui distingue deux grands groupes de bactéries selon la structure de leur paroi: Gram-positives: paroi épaisse (peptidoglycane), retiennent le violet de cristal et apparaissent violettes au microscope. Gram-négatives: paroi fine, se décolorent à l'alcool et prennent le rose de la fuchsine; elles apparaissent roses. Pourquoi c'est important? La coloration de Gram oriente le diagnostic et le traitement: Un Gram positif (par exemple Streptococcus, Staphylococcus) ne se traite pas de la même façon qu'un Gram négatif (par exemple Vibrio cholerae, Salmonella). La forme de la bactérie complète l'information: coques Gram plus en chaînettes égale Streptococcus; bacilles Gram- égale entérobactéries. Les grandes formes. Coques: sphériques (streptocoques, staphylocoques). Bacilles: en forme de bâtonnets (E. coli, Salmonella, Vibrio cholerae). Spirilles: en forme de spirale (Tréponème). Vibrions: en forme de virgule (Vibrio cholerae). À retenir. Les bactéries sont des procaryotes. La coloration de Gram distingue Gram-positives (violettes, paroi épaisse) et Gram-négatives (roses, paroi fine). La forme (coque, bacille, spirille, vibrion) complète l'identification. Gram et forme orientent le traitement."]],"5":[["fr","Chapitre II, Les virus, parasites et champignons. Fondements théoriques. Les virus. Les virus sont des agents infectieux acellulaires. Ils ne sont pas capables de se multiplier seuls: ils doivent pénétrer dans une cellule hôte et détourner sa machinerie pour se reproduire. Un virus est composé de: Un acide nucléique: ADN ou ARN (jamais les deux). Une capside: enveloppe protéique qui protège l'acide nucléique. Parfois une enveloppe lipidique. Les virus tropicaux importants en R D C: Virus du chikungunya: transmis par Aedes aegypti, épidémie à Matadi en 2019. Virus de la dengue: transmis par Aedes, présent à la frontière angolaise. Virus Ebola: fièvre hémorragique grave, épidémies récurrentes en R D C. Virus de la rougeole: prévention par la vaccination. VIH: infection chronique. Les parasites. Les parasites sont des organismes eucaryotes qui vivent aux dépens d'un hôte. On distingue: Protozoaires: unicellulaires. Exemples: Plasmodium (paludisme), Entamoeba histolytica (amibiase), Giardia lamblia (giardiase), Trypanosoma (trypanosomiase). Helminthes (vers): pluricellulaires. Exemples: ascaris, ankylostomes, schistosomes, filaires. Les champignons. Les champignons sont des eucaryotes. Certains sont responsables de mycoses superficielles (teigne, candidose buccale); d'autres de mycoses profondes (aspergillose, cryptococcose), surtout chez les personnes immunodéprimées (VIH). Antibiotiques et virus. Les antibiotiques n'agissent que sur les bactéries, pas sur les virus. Un rhume, une grippe, la rougeole, le VIH ne se traitent pas avec des antibiotiques. Utiliser un antibiotique pour une infection virale est inutile et favorise la résistance. Erreur fréquente. Donner des antibiotiques pour une infection virale est une erreur fréquente et grave. Les antibiotiques ne tuent que les bactéries. En plus d'être inefficaces, ils favorisent la résistance des bactéries présentes dans l'organisme."]],"6":[["fr","Chapitre III, Les modes de transmission. Fondements théoriques. Les grandes voies de transmission. 1. Voie féco-orale. L'agent pathogène est présent dans les selles d'un malade ou d'un porteur sain, contamine l'eau ou les aliments, et est ingéré par une personne saine. C'est la voie des maladies diarrhéiques. Maladies: choléra, fièvre typhoïde, shigellose, amibiase, giardiase, hépatite A, poliomyélite. Mesures: lavage des mains, eau potable, hygiène alimentaire, assainissement des latrines. 2. Voie aérienne. L'agent est projeté par la toux, les éternuements, la parole, sous forme de gouttelettes ou d'aérosols, et inhalé par une personne saine. Maladies: tuberculose, méningites, grippe, rougeole, coqueluche, COVID-19. Mesures: aération des locaux, masques, distanciation, vaccination. 3. Vecteurs. Un être vivant (insecte, acarien) transporte l'agent d'un réservoir à un hôte. Moustiques: paludisme (Anopheles), dengue et chikungunya (Aedes), fièvre jaune (Aedes). Mouche tsé-tsé: trypanosomiase. Puces: peste. Tiques: babésiose, anaplasmose. Mesures: moustiquaires imprégnées, répulsifs, lutte antivectorielle, destruction des gîtes larvaires. 4. Contact direct. Transmission par contact cutané ou muqueux, plaies, rapports sexuels, sang. Maladies: VIH, hépatites B et C, syphilis, gonococcie, herpès, infections cutanées. Mesures: préservatifs, gants, matériel stérile, hygiène. 5. Transmission mère-enfant. Transmission pendant la grossesse, l'accouchement ou l'allaitement. Maladies: VIH, hépatite B, syphilis, toxoplasmose, rubéole. Mesures: dépistage prénatal, ARV (VIH), vaccination, césarienne si nécessaire. À retenir. Cinq voies majeures: féco-orale (diarrhées), aérienne (tuberculose, méningites), vecteurs (paludisme, dengue), contact (VIH, IST), mère-enfant. Chaque voie a ses mesures de prévention spécifiques."]],"7":[["fr","Chapitre III, Les facteurs favorisants en zone tropicale. Fondements théoriques. Pourquoi les maladies infectieuses prolifèrent en zone tropicale. Facteurs climatiques. Chaleur: accélère la multiplication bactérienne dans les aliments. Humidité: favorise la survie des virus et la reproduction des vecteurs. Pluies abondantes: créent des gîtes larvaires, contaminent les sources d'eau. Facteurs environnementaux. Eau non potable: principale source de maladies diarrhéiques. Assainissement insuffisant: latrines absentes ou inadaptées, eaux usées stagnantes. Déchets mal gérés: attirent rongeurs et insectes. Habitat précaire: promiscuité, mauvaise ventilation. Facteurs socio-économiques. Pauvreté: accès limité aux soins, à l'eau potable, à une alimentation équilibrée. Faible niveau d'éducation: moins de connaissances sur l'hygiène. Déplacements de population: réfugiés, déplacés internes, camps surpeuplés. Conflits: détruisent les infrastructures sanitaires. Facteurs individuels. Malnutrition: affaiblit l'immunité. VIH, diabète: immunodépression. Grossesse: vulnérabilité accrue (paludisme, anémie). Âge: enfants et personnes âgées plus vulnérables. Non-vaccination: absence de protection. Conséquences pour l'infirmier. Comprendre ces facteurs permet d'agir sur eux: éduquer, sensibiliser, promouvoir l'hygiène, orienter vers les programmes de vaccination, signaler les situations à risque. Erreur fréquente. Croire que les maladies infectieuses sont inévitables en zone tropicale est une erreur. Elles résultent de facteurs multiples (climat, eau, hygiène, pauvreté), sur lesquels on peut agir par la prévention et l'éducation."]],"8":[["fr","Chapitre IV, Le choléra. Fondements théoriques. Le choléra. Le choléra est une infection intestinale aiguë causée par la bactérie Vibrio cholerae. Il est transmis par l'eau et les aliments contaminés (voie féco-orale). C'est une maladie épidémique redoutable, présente de façon récurrente en R D C (Uvira, Bas-Congo, Katanga, Maniema). Signes cliniques. Diarrhée aqueuse profuse en « eau de riz » (liquide blanchâtre, inodore, sans glaire ni sang). Vomissements en jet, abondants. Déshydratation rapide: soif intense, yeux enfoncés, pli cutané, crampes musculaires, hypotension, oligurie, voire anurie. Évolution possible vers le choc hypovolémique et la mort en quelques heures. Diagnostic. Clinique: tableau de diarrhée aqueuse profuse en contexte épidémique. Laboratoire: examen microscopique des selles (bactéries mobiles en « virgule »), culture sur milieu spécifique, confirmation par l'INRB. Traitement. Réhydratation immédiate: c'est le traitement prioritaire. SRO si possible, sinon réhydratation intraveineuse (Ringer lactate). Antibiotiques: sur prescription, pour réduire la durée de la diarrhée et la transmission. Isolement du patient, désinfection. Surveillance: diurèse, signes vitaux, état de conscience. Prévention. Lavage des mains au savon. Eau potable: bouillie, filtrée ou chlorée. Hygiène alimentaire: aliments bien cuits, lavage des fruits et légumes. Assainissement: latrines, élimination des eaux usées. Vaccination dans certaines situations épidémiques. Rôle de l'infirmier. Reconnaître le tableau de choléra. Réhydrater immédiatement. Isoler les patients. Notifier immédiatement à la zone de santé et à l'INRB. Éduquer la communauté sur l'hygiène et la chloration de l'eau. Erreur fréquente. Retarder la réhydratation pour attendre un résultat de laboratoire est une erreur mortelle. Dans un contexte de diarrhée profuse, la réhydratation se commence immédiatement, avant toute confirmation."]],"9":[["fr","Chapitre IV, La fièvre typhoïde et la shigellose. Fondements théoriques. La fièvre typhoïde. La fièvre typhoïde est causée par Salmonella Typhi, bactérie transmise par l'eau et les aliments contaminés. Des épidémies ont été documentées en R D C (Bwamanda, Wamba, Pawa, Poko, Kwango). Signes cliniques. Fièvre prolongée, en plateau (souvent 39 moins 40 degrés Celsius), avec pouls relativement lent par rapport à la fièvre (dissociation pouls-température). Céphalées, insomnie, fatigue. Douleurs abdominales, troubles du transit (diarrhée ou constipation). Parfois éruption rosée sur le ventre. Complications possibles: perforation intestinale, hémorragie digestive. Diagnostic. Hémoculture: examen de référence (pendant la première semaine). Coproculture: à partir de la deuxième semaine. Sérologie (Widal): utile mais peu spécifique. Traitement. Antibiothérapie adaptée (sur prescription), en tenant compte des résistances. Réhydratation, antipyrétiques, surveillance. Prévention. Eau potable, hygiène alimentaire, lavage des mains. Assainissement des latrines. Vaccination (recommandée dans certaines zones). Dépistage et traitement des porteurs chroniques (notamment chez les manipulateurs d'aliments). La shigellose. La shigellose est une infection intestinale causée par Shigella, bactérie très contagieuse transmise par voie féco-orale. Elle se manifeste par une diarrhée sanglante (dysenterie bacillaire) accompagnée de fièvre et de douleurs abdominales. Elle est surveillée par l'INRB. Traitement et prévention. Réhydratation, antibiothérapie adaptée (sur prescription). Hygiène des mains, eau potable, assainissement. Isolement du patient, désinfection. À retenir. Fièvre typhoïde égale fièvre prolongée plus troubles digestifs, transmise par l'eau ou aliments. Shigellose égale diarrhée sanglante. Les deux se préviennent par l'hygiène et l'assainissement."]],"10":[["fr","Chapitre IV, Les méningites bactériennes et la peste. Fondements théoriques. Les méningites bactériennes. Les méningites bactériennes sont des infections des méninges (enveloppes du cerveau et de la moelle épinière) causées par: Neisseria meningitidis (méningocoque): épidémies dans la ceinture méningitique africaine. Streptococcus pneumoniae (pneumocoque): formes graves, souvent chez l'enfant et la personne âgée. Haemophilus influenzae b: prévention par la vaccination. Signes cliniques. Fièvre élevée brutale. Céphalées intenses. Raideur de la nuque (signe majeur). Vomissements, photophobie (crainte de la lumière). Troubles de la conscience, convulsions. Chez le nourrisson: fontanelle bombée, geignement, hypotonie. Conduite à tenir. Urgence médicale absolue: chaque minute compte. Transfert immédiat vers un hôpital. Antibiothérapie urgente (sur prescription). Isolement respiratoire si méningocoque, chimioprophylaxie des contacts. Notification obligatoire (maladie à déclaration). Prévention. Vaccination contre le méningocoque, le pneumocoque, l'Haemophilus influenzae b. Aération des locaux, éviter la promiscuité. La peste. La peste est une maladie bactérienne causée par Yersinia pestis, transmise par les puces des rongeurs (rats, souris). Elle est surveillée par l'INRB en R D C. Formes cliniques. Peste bubonique: bubons (ganglions gonflés et douloureux), fièvre, prostration. Peste septicémique: envahissement du sang, mortel en quelques jours. Peste pulmonaire: toux, fièvre, détresse respiratoire; transmission interhumaine par voie aérienne, très contagieuse. Conduite à tenir. Urgence absolue: isolement, notification immédiate. Antibiothérapie urgente (sur prescription). Lutte contre les rongeurs et les puces. Port de masque et d'équipement de protection. Erreur fréquente. Négliger une raideur de nuque fébrile est une erreur grave. Une méningite bactérienne non traitée peut être mortelle en moins de 24 heures. Toute suspicion doit être transférée immédiatement."]],"11":[["fr","Chapitre V, Le paludisme. Fondements théoriques. Une endémie parasitaire majeure. Le paludisme est une maladie parasitaire causée par Plasmodium (principalement P. falciparum en R D C), transmise par la piqûre de l'anophèle femelle. La transmission est présente toute l'année en R D C, avec des pics saisonniers en saison des pluies. Cycle simplifié. L'anophèle femelle pique un humain infecté et ingère des gamétocytes. Dans le moustique, les gamètes fusionnent et produisent des sporozoïtes. Le moustique pique un nouvel humain et injecte les sporozoïtes. Les sporozoïtes gagnent le foie (phase hépatique). Puis ils passent dans le sang et infectent les globules rouges (phase sanguine), qui éclatent: fièvre et anémie. Signes cliniques. Fièvre (parfois avec accès cycliques frissons-chaleur-sueurs). Céphalées, courbatures, fatigue. Chez l'enfant: vomissements, convulsions possibles (signe de gravité). Signes de gravité: troubles de conscience, coma, anémie sévère, détresse respiratoire, ictère, oligurie. Diagnostic. Test de Diagnostic Rapide (TDR): rapide, adapté aux zones périphériques. Goutte épaisse ou frottis: identifie l'espèce et quantifie la parasitémie. Traitement. Paludisme simple: Combinaisons Thérapeutiques à base d'Artémisinine (CTA), pendant 3 jours. Paludisme grave: artésunate injectable (1re intention) ou quinine en perfusion, en milieu hospitalier. Prévention. Moustiquaires imprégnées d'insecticide (MILDA): mesure la plus efficace. Élimination des gîtes larvaires. Traitement préventif intermittent (TPI) chez la femme enceinte. Éducation sanitaire. À retenir. Paludisme égale parasite Plasmodium, vecteur Anopheles. Fièvre, anémie, formes graves (paludisme cérébral). Diagnostic par TDR ou goutte épaisse. CTA pour les formes simples; artésunate ou quinine pour les formes graves. MILDA égale prévention principale."]],"12":[["fr","Chapitre V, Les parasitoses intestinales. Fondements théoriques. Amibiase et giardiase. L'amibiase. L'amibiase est causée par Entamoeba histolytica, un protozoaire transmis par voie féco-orale (eau et aliments contaminés). La prévalence en R D C est élevée (jusqu'à 55 pour cent dans certaines études). Signes cliniques: Forme intestinale: diarrhée avec glaires et parfois sang (dysenterie amibienne), douleurs abdominales, flatulences. Forme hépatique: abcès du foie (fièvre, douleur au foie). Traitement: antiparasitaire sur prescription. Réhydratation si nécessaire. La giardiase. La giardiase est causée par Giardia lamblia, protozoaire flagellé, transmis par voie féco-orale. La prévalence en R D C est estimée à environ 6 pour cent. Signes cliniques: Diarrhée chronique, selles graisseuses, malabsorption. Douleurs abdominales, ballonnements. Amaigrissement, fatigue (surtout chez l'enfant). Traitement: antiparasitaire sur prescription. Les helminthes intestinaux. Vers intestinaux (ascaris, ankylostomes, trichocéphales): Transmission par ingestion d'œufs (mains sales, aliments contaminés) ou par pénétration cutanée (ankylostomes, marche pieds nus). Signes: douleurs abdominales, amaigrissement, anémie (ankylostomes), retard de croissance chez l'enfant. Traitement: vermifuge sur prescription. Prévention commune. Lavage des mains. Eau potable. Hygiène alimentaire. Assainissement des latrines. Port de chaussures (prévention ankylostomes). Déparasitage régulier dans les zones endémiques. Erreur fréquente. Confondre les diarrhées parasitaires avec une simple diarrhée virale ou bactérienne, sans demander d'examen parasitologique, conduit à un traitement inadapté et à la chronicisation. Devant une diarrhée persistante, une recherche de parasites est nécessaire."]],"13":[["fr","Chapitre VI, La tuberculose. Fondements théoriques. Une maladie infectieuse majeure. La tuberculose est une maladie infectieuse causée par Mycobacterium tuberculosis (bacille de Koch). Elle touche principalement les poumons, mais peut atteindre d'autres organes (ganglions, os, méninges, reins). Transmission. La tuberculose se transmet par voie aérienne: un patient bacillifère tousse, projette des gouttelettes contenant le bacille, qui sont inhalées par une personne saine. La contagion nécessite un contact prolongé et rapproché. Signes cliniques. Toux persistante supérieur à 2 semaines (parfois avec crachats ou sang). Fièvre modérée, souvent vespérale. Sueurs nocturnes. Amaigrissement, perte d'appétit. Asthénie. Diagnostic. Bacilloscopie (examen microscopique des crachats). GeneXpert (test moléculaire, détecte aussi la résistance à la rifampicine). Radiographie du thorax. Traitement. Phase intensive (2 mois): rifampicine, isoniazide, pyrazinamide, éthambutol. Phase de continuation (4 mois): rifampicine, isoniazide. Observance cruciale: un traitement incomplet favorise l'apparition de résistances (tuberculose MDR ou XDR), surveillées par l'INRB. Prévention. Vaccin BCG à la naissance. Dépistage des contacts. Aération des locaux. Éducation: se couvrir la bouche, ne pas cracher au sol. Rôle de l'infirmier. Reconnaître les signes suspects. Orienter vers le centre de diagnostic. Accompagner le traitement (traitement directement observé, TDO). Surveiller les effets indésirables (hépatotoxicité, troubles oculaires). Sensibiliser à l'observance. À retenir. Tuberculose égale transmission aérienne. Signes: toux supérieur à 2 semaines, sueurs nocturnes, amaigrissement. Diagnostic: bacilloscopie, GeneXpert. Traitement long (6 mois) avec observance stricte. Vaccin BCG, dépistage des contacts."]],"14":[["fr","Chapitre VI, Le VIH ou sida. Fondements théoriques. Une pandémie mondiale. Le VIH (virus de l'immunodéficience humaine) attaque le système immunitaire, en particulier les lymphocytes T C D4. Le sida (syndrome d'immunodéficience acquise) est le stade avancé de l'infection, marqué par l'apparition d'infections opportunistes et de certains cancers. Transmission. Voie sexuelle: rapports non protégés. Voie sanguine: transfusion, échange de seringues, objets tranchants souillés. Voie mère-enfant: grossesse, accouchement, allaitement (sans prévention). Le VIH ne se transmet pas par: poignée de main, câlin, toux, piqûre de moustique, toilettes partagées, vaisselle, nourriture. Phases. Primo-infection: syndrome pseudo-grippal, 2 à 4 semaines après la contamination. Phase asymptomatique: plusieurs années, sans symptômes. Phase symptomatique: infections opportunistes, amaigrissement. Sida: stade final. Infections opportunistes. Tuberculose (première cause de mortalité chez les PVVIH). Candidose buccale ou œsophagienne. Pneumocystose, toxoplasmose cérébrale, cryptococcose. Sarcome de Kaposi, lymphomes. Prévention et prise en charge. Préservatifs masculins et féminins. Dépistage volontaire et confidentiel. Antirétroviraux (ARV): trithérapie, réduction de la charge virale, « U égale U » (Indétectable égale Intransmissible). PTME: prévention de la transmission mère-enfant. Sécurisation des transfusions, matériel stérile. Rôle de l'infirmier. Accompagner le patient sans jugement. Éduquer sur l'observance des ARV. Surveiller les effets indésirables et les infections opportunistes. Lutter contre la stigmatisation et la discrimination. Soutenir psychologiquement. Erreur fréquente. Stigmatiser une personne vivant avec le VIH est une erreur grave. La stigmatisation pousse les patients à cacher leur statut, à fuir les soins et à transmettre le virus sans le savoir. L'infirmier doit adopter une attitude bienveillante et confidentielle."]],"15":[["fr","Chapitre VII, Les techniques de laboratoire. Fondements théoriques. Les outils du diagnostic microbiologique. La coloration de Gram. Technique qui distingue les bactéries Gram-positives (violettes) des Gram-négatives (roses). Elle oriente le diagnostic et le choix thérapeutique. Étapes: Préparation d'un frottis bactérien sur lame. Séchage et fixation. Coloration au violet de cristal (1 minutes). Lugol (mordant, 1 minutes). Décoloration à l'alcool (rapide). Contre-coloration à la fuchsine (30 secondes). Rinçage, séchage, observation au microscope à immersion (grossissement multiplié par 100). L'observation microscopique. Le microscope optique permet d'observer les bactéries, parasites, cellules. Techniques: préparation de lames, mise au point, utilisation de l'huile à immersion pour le grossissement maximal. La culture et l'isolement. Ensemencement sur milieux de culture (géloses spécifiques), isolement des colonies, identification par tests biochimiques et coloration. L'antibiogramme. Test de sensibilité aux antibiotiques. On ensemence la bactérie sur une gélose, on dépose des disques d'antibiotiques, et on observe les zones d'inhibition après incubation. Plus la zone est grande, plus la bactérie est sensible. L'antibiogramme guide le traitement et lutte contre la résistance antimicrobienne. Les techniques spécifiques. Hémoculture: recherche de bactéries dans le sang (fièvre typhoïde, septicémies). Coproculture: recherche de bactéries dans les selles (choléra, shigellose, salmonellose). Examen parasitologique des selles: recherche de parasites (amibiase, giardiase, vers). Goutte épaisse: recherche de Plasmodium. GeneXpert: test moléculaire pour la tuberculose. Règles de sécurité au laboratoire. Asepsie: lavage des mains, gants, matériel stérile. Élimination correcte des déchets biologiques. Étiquetage rigoureux des échantillons. Transport adapté au laboratoire de référence. Erreur fréquente. Manipuler les échantillons sans respecter l'asepsie est une erreur grave: risque de contamination du manipulateur et de faux résultats. Les règles de sécurité au laboratoire doivent être strictement respectées."]],"16":[["fr","Chapitre VIII, La prévention et l'hygiène. Fondements théoriques. Les mesures universelles de prévention. 1. L'hygiène des mains. C'est la mesure la plus efficace pour prévenir les infections. Lavage au savon pendant au moins 20 secondes, ou friction avec une solution hydro-alcoolique. À réaliser: Avant et après chaque soin. Après avoir touché un patient, du matériel, des déchets. Avant de préparer ou de consommer un repas. Après les toilettes. 2. L'eau potable. Eau bouillie pendant 1 minute, refroidie. Eau filtrée (filtre à céramique, filtre à sable). Eau chlorée (eau de Javel à dose contrôlée). Eau en bouteille ou sachet de source agréée. 3. L'hygiène alimentaire. Laver les fruits et légumes à l'eau potable. Bien cuire les viandes, poissons et œufs. Conserver les aliments à l'abri des mouches et des rongeurs. Ne pas mélanger cru et cuit. 4. L'assainissement. Latrines propres et bien situées, loin des sources d'eau. Élimination correcte des déchets ménagers. Évacuation des eaux usées. Élimination des eaux stagnantes (gîtes larvaires). 5. La vaccination. BCG: tuberculose (formes graves de l'enfant). Vaccins du programme élargi: rougeole, fièvre jaune, poliomyélite, DTC-HepB-Hib, pneumocoque, rotavirus. Respect de la chaîne du froid (conservation entre plus 2 et plus 8 degrés Celsius). 6. La lutte antivectorielle. Moustiquaires imprégnées (MILDA). Répulsifs, insecticides. Élimination des gîtes larvaires. Désherbage, assèchement des zones humides autour des habitations. À retenir. Six mesures clés: hygiène des mains, eau potable, hygiène alimentaire, assainissement, vaccination, lutte antivectorielle. Ensemble, elles préviennent la majorité des maladies infectieuses tropicales."]],"17":[["fr","Chapitre VIII, La surveillance épidémiologique et la riposte. Fondements théoriques. La surveillance épidémiologique. La surveillance épidémiologique est la collecte continue, l'analyse et la diffusion des données sur les maladies infectieuses. Elle permet de: Détecter les épidémies précocement. Suivre l'évolution des maladies. Évaluer l'efficacité des interventions. Orienter les politiques de santé. Le rôle de l'INRB. L'Institut National de Recherche Biomédicale (INRB) de Kinshasa coordonne: La surveillance des maladies bactériennes épidémiques (choléra, méningites, shigellose, fièvre typhoïde, peste). La confirmation biologique des épidémies. La surveillance de la résistance antimicrobienne. La recherche biomédicale sur les pathogènes prioritaires. Le rôle de l'infirmier A2. Notifier immédiatement les cas suspects à la zone de santé. Prélever et transmettre les échantillons selon les procédures. Renseigner les fiches de surveillance. Participer aux investigations d'épidémie. Appliquer les mesures de riposte (isolement, désinfection, prophylaxie des contacts). La riposte aux épidémies. Face à une épidémie, la réponse repose sur: Confirmation des cas (clinique plus laboratoire). Isolement des malades. Prise en charge des patients (traitement, réhydratation). Investigation autour des cas (recherche des contacts). Prophylaxie des contacts (vaccination, antibiotiques). Mesures d'hygiène collectives (eau potable, assainissement). Communication des risques à la population. La communication. Une communication claire, transparente et culturellement adaptée est essentielle. La rumeur, la peur et la stigmatisation peuvent entraver la riposte. L'infirmier est un relais d'information fiable dans sa communauté. Erreur fréquente. Attendre la confirmation biologique pour déclarer une épidémie est une erreur. La notification précoce, même en l'absence de confirmation, permet de déclencher la riposte et de sauver des vies."]],"18":[["fr","Chapitre VIII, L'éducation sanitaire et la communication. Fondements théoriques. Éduquer pour prévenir. L'éducation sanitaire est l'une des armes les plus puissantes contre les maladies infectieuses. Elle permet aux populations de comprendre les modes de transmission et d'adopter des comportements protecteurs. Les messages clés. Lavage des mains au savon, plusieurs fois par jour, avant les repas et après les toilettes. Eau potable: bouillir, filtrer ou chlorer. Hygiène alimentaire: laver les fruits et légumes, bien cuire les viandes. Moustiquaire imprégnée chaque nuit pour toute la famille. Vaccination des enfants selon le calendrier. Consulter tôt en cas de fièvre, diarrhée, toux persistante. Terminer les traitements (tuberculose, paludisme, VIH). Ne pas stigmatiser les personnes malades. Les canaux de communication. Causeries dans les centres de santé, écoles, églises, marchés. Radios communautaires (très écoutées en zone rurale). Affiches et images adaptées aux personnes peu alphabétisées. Théâtre participatif, jeux de rôle. Visites à domicile. Réseaux sociaux en milieu urbain. Principes d'une communication efficace. Simplicité: messages courts, un seul message à la fois. Adaptation culturelle: tenir compte des habitudes, des croyances, de la langue. Répétition: un message répété est mieux retenu. Démonstration: montrer concrètement (lavage des mains, préparation du SRO). Participation: écouter, impliquer. Rôle de l'infirmier. L'infirmier est un éducateur de santé. Il ne se contente pas de soigner: il transmet des connaissances, corrige les fausses croyances, encourage les comportements protecteurs et soutient les familles. À retenir. L'éducation sanitaire permet aux populations d'adopter des comportements protecteurs. Messages clés: hygiène des mains, eau potable, moustiquaire, vaccination, consultation précoce. Canaux multiples, adaptation culturelle. L'infirmier est un éducateur."]],"19":[["fr","Synthèse, Comprendre, prévenir, surveiller, agir. Synthèse générale. Les quatre compétences du soignant en microbiologie tropicale. Comprendre les agents pathogènes, leurs modes de transmission et leurs facteurs de risque. Prévenir par l'hygiène, l'assainissement, la vaccination, la lutte antivectorielle. Surveiller en notifiant les cas suspects et en participant à la riposte aux épidémies. Agir en appliquant les gestes de premiers soins (réhydratation, isolement), en éduquant et en orientant. Tableau récapitulatif. Maladie. Agent. Transmission. Prévention clé. Choléra. Vibrio cholerae. Féco-orale. Eau potable, hygiène. Fièvre typhoïde. Salmonella Typhi. Féco-orale. Eau potable, hygiène. Shigellose. Shigella. Féco-orale. Lavage des mains. Méningite. Meningocoque, Pneumocoque. Aérienne. Vaccination, aération. Peste. Yersinia pestis. Puces. Lutte contre rongeurs. Paludisme. Plasmodium. Anopheles. MILDA, gîtes larvaires. Amibiase. Entamoeba histolytica. Féco-orale. Hygiène, eau potable. Giardiase. Giardia lamblia. Féco-orale. Hygiène, eau potable. Tuberculose. M. tuberculosis. Aérienne. BCG, dépistage. VIH. VIH. Sexuelle, sanguine, mère-enfant. Préservatif, dépistage, ARV. Étude de cas (cas pédagogique). « Un infirmier A2 dans un centre de santé d'Uvira reçoit plusieurs patients présentant une diarrhée aqueuse profuse. Il suspecte le choléra, isole les patients, applique les mesures d'hygiène, administre du SRO et alerte immédiatement la zone de santé. Il prélève des échantillons et les envoie à l'INRB pour confirmation. Il sensibilise la communauté sur le lavage des mains et la chloration de l'eau. ». Analyse: la démarche est exemplaire. L'infirmier a reconnu un tableau de choléra, appliqué immédiatement les mesures de prise en charge (réhydratation, isolement, hygiène), notifié les autorités, prélevé et transmis les échantillons pour confirmation, et sensibilisé la communauté. Il a mobilisé toutes les compétences du cours: comprendre, prévenir, surveiller, agir."]],"20":[["fr","Évaluation finale, Microbiologie Tropicale. Consigne. Répondez aux questions ci-dessous en sélectionnant la bonne réponse parmi les quatre propositions. Le QCM couvre l'ensemble du cours. Cliquez ensuite sur « Valider mes réponses » pour obtenir votre score."]]}};

            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);

    // ====================================================================
    //  Bannière : invitation, confirmations, progression
    // ====================================================================
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer);
      bnMode = mode;
      txtEl.textContent = text;
      actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; }
      else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }

    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }

    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial"
        ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet."
        : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
