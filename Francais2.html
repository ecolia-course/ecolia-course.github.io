    title: "Sommaire — Français",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours de français couvre cinq compétences essentielles de la 2e année des humanités : la lecture du récit, les temps du récit, le portrait, les accords grammaticaux et le débat argumenté. Chaque leçon combine théorie, exemples adaptés au contexte congolais et exercices d'application.</p>
<p><strong>Note :</strong> ce cours s'appuie sur le Programme National de Français (2005) et sur les manuels disponibles (Habran, SESAM). La répartition officielle exacte par année n'a pas pu être confirmée sur le document intégral ; certaines références restent à vérifier.</p>
<ul>
<li>Leçon 1 — Le texte narratif : structure et compréhension</li>
<li>Leçon 2 — Les temps du récit : imparfait et passé simple</li>
<li>Leçon 3 — Le portrait : lexique et expression écrite</li>
<li>Leçon 4 — Orthographe : accords dans le GN et le participe passé</li>
<li>Leçon 5 — Expression orale : le débat argumenté</li>
</ul>
<p>Une évaluation finale de 20 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme National de Français (RDC, 2005, référence secondaire) ; Habran, Exercices français 3e et 4e secondaires (1985) ; manuel SESAM 1re &amp; 2e H (CRP Kinshasa) ; étude HAL sur la didactique du français en RDC.</div>
    `
},
{
    title: "Leçon 1 — Le texte narratif : structure et compréhension",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment un conte congolais raconte-t-il une histoire ? Quelles sont les étapes obligées d'un récit ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les cinq étapes du schéma narratif. Distinguer auteur, narrateur et personnage. Situer le cadre spatio-temporel. Prérequis : lecture fluide, connaissance de la phrase simple.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>texte narratif</strong> raconte une histoire, réelle ou fictive. Il s'organise selon un <strong>schéma narratif</strong> en cinq étapes :</p>
<ol>
<li><strong>Situation initiale :</strong> présentation des personnages, du lieu et du temps ; état stable.</li>
<li><strong>Élément déclencheur :</strong> événement qui rompt l'équilibre.</li>
<li><strong>Péripéties :</strong> actions et obstacles qui s'enchaînent.</li>
<li><strong>Dénouement :</strong> résolution du problème.</li>
<li><strong>Situation finale :</strong> nouvel état d'équilibre.</li>
</ol>
<p>Il faut distinguer :</p>
<ul>
<li><strong>L'auteur :</strong> la personne réelle qui écrit le texte.</li>
<li><strong>Le narrateur :</strong> la voix qui raconte dans le texte (personnage ou extérieur).</li>
<li><strong>Le personnage :</strong> celui qui vit l'histoire.</li>
</ul>
<p>Le <strong>cadre spatio-temporel</strong> situe l'action (où ? quand ?).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Schéma narratif :</strong> organisation en cinq étapes du récit. <strong>Narrateur :</strong> instance qui raconte. <strong>Péripétie :</strong> événement qui fait avancer l'action. <strong>Cadre spatio-temporel :</strong> lieu et époque du récit.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Lire le texte en entier, puis repérer chaque étape. Souligner les verbes d'action. Identifier la voix qui raconte. Ne pas confondre l'auteur et le narrateur.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Dans un conte congolais : un chasseur part en forêt (situation initiale), un esprit lui vole son fusil (élément déclencheur), il doit accomplir trois épreuves (péripéties), il réussit grâce à la ruse (dénouement), il revient au village chargé de gibier (situation finale).</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite dans l'ordre les cinq étapes du schéma narratif.</p>
<p><strong>Ex. 2 :</strong> Quelle est la différence entre auteur et narrateur ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Situation initiale, élément déclencheur, péripéties, dénouement, situation finale.</p>
<p><strong>2)</strong> L'auteur est la personne réelle qui écrit ; le narrateur est la voix qui raconte dans le texte.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le schéma narratif est la colonne vertébrale du récit ; savoir le repérer, c'est comprendre comment l'histoire est construite.</p></div>

<div class="sources"><strong>Sources :</strong> Programme National de Français (2005) ; manuel SESAM 1re &amp; 2e H ; étude HAL sur la didactique du français en RDC.</div>
    `
},
{
    title: "Leçon 2 — Les temps du récit : imparfait et passé simple",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi les récits au passé utilisent-ils parfois l'imparfait et parfois le passé simple ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Maîtriser la formation et les emplois de l'imparfait et du passé simple. Distinguer les valeurs aspectuelles (durée/description vs événement ponctuel). Prérequis : leçon 1 ; conjugaisons simples.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>L'imparfait</strong> exprime une action en cours, une description, une habitude. Il forme l'arrière-plan du récit. Terminaisons : -ais, -ais, -ait, -ions, -iez, -aient.</p>
<p><strong>Le passé simple</strong> exprime une action ponctuelle, terminée, de premier plan. Il fait avancer le récit. Terminaisons des verbes en -er (1er groupe) : -ai, -as, -a, -âmes, -âtes, -èrent. Exemple : je parlai, il parla, ils parlèrent.</p>
<p>Terminaisons des verbes en -ir/-re (2e et 3e groupes) : -is, -is, -it, -îmes, -îtes, -irent (finir) ou -us, -us, -ut, -ûmes, -ûtes, -urent (vouloir).</p>
<p><strong>Règle d'emploi :</strong> l'imparfait décrit le décor, l'atmosphère, les actions habituelles ; le passé simple raconte les événements successifs qui font progresser l'histoire.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Imparfait :</strong> temps de l'arrière-plan (description, habitude). <strong>Passé simple :</strong> temps du premier plan (action ponctuelle). <strong>Valeur aspectuelle :</strong> manière dont le verbe présente l'action (durée ou événement).</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Repérer si la phrase décrit ou raconte. Si elle décrit → imparfait. Si elle raconte un événement unique → passé simple. Attention aux terminaisons du passé simple (1re et 3e personnes du singulier en -ai/-a pour les verbes en -er ; -is/-it pour les 2e et 3e groupes).</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>« Kabila traversait le fleuve Congo quand soudain une pirogue apparut. » (exemple fictif à but pédagogique) — « traversait » = décor, action en cours (imparfait) ; « apparut » = événement ponctuel (passé simple).</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Mets au passé simple : « il mange ». <strong>Ex. 2 :</strong> Mets à l'imparfait : « nous chantons ».</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Il mangea. <strong>2)</strong> Nous chantions.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Imparfait = arrière-plan (décor, habitude). Passé simple = premier plan (événements successifs).</p></div>

<div class="sources"><strong>Sources :</strong> Programme National de Français (2005) ; Habran, Exercices français (1985).</div>
    `
},
{
    title: "Leçon 3 — Le portrait : lexique et expression écrite",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment décrire une personne avec précision, sans tomber dans une simple liste d'adjectifs ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Enrichir le lexique du portrait physique et moral. Utiliser les expansions du nom (adjectifs, propositions relatives). Structurer un paragraphe descriptif. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>portrait</strong> est une description d'une personne. Il combine deux dimensions :</p>
<ul>
<li><strong>Le portrait physique :</strong> traits du visage, taille, allure, vêtements.</li>
<li><strong>Le portrait moral :</strong> caractère, comportement, habitudes, valeurs.</li>
</ul>
<p><strong>Lexique utile :</strong> visage (allongé, rond), yeux (vifs, timides), démarche (assurée, hésitante), caractère (généreux, réservé, patient, travailleur).</p>
<p><strong>Expansions du nom :</strong></p>
<ul>
<li><strong>L'adjectif qualificatif :</strong> un artisan <em>habile</em>.</li>
<li><strong>La proposition relative :</strong> un artisan <em>qui sculpte le bois</em>.</li>
<li><strong>Le complément du nom :</strong> un artisan <em>de talent</em>.</li>
</ul>
<p>Un bon portrait progresse <strong>du général au particulier</strong> : silhouette, visage, détails, caractère. Éviter l'accumulation d'adjectifs et les répétitions.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Portrait :</strong> description d'une personne. <strong>Expansion du nom :</strong> élément qui précise le nom (adjectif, relative, complément). <strong>Proposition relative :</strong> sous-phrase introduite par « qui, que, dont, où ».</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Observer. Choisir deux ou trois traits dominants. Varier les expansions du nom. Organiser la description (vue d'ensemble puis détail). Relier physique et moral avec cohérence.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Portrait d'un artisan du marché central de Kinshasa : « C'est un homme d'âge mûr, aux mains larges et calleuses, qui sculpte le bois depuis trente ans. Son visage ridé, toujours souriant, inspire confiance. Patient et minutieux, il ne quitte jamais son établi avant d'avoir terminé son œuvre. »</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Relève les expansions du nom dans la phrase : « Une fillette joyeuse, qui porte un pagne coloré, traverse la rue. »</p>
<p><strong>Ex. 2 :</strong> Rédige un portrait de 10 lignes d'une personne connue de toi, en employant au moins cinq adjectifs et une proposition relative.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> « joyeuse » (adjectif), « qui porte un pagne coloré » (proposition relative), « coloré » (adjectif).</p>
<p><strong>2)</strong> Réponse libre ; vérifier la présence des éléments demandés.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un bon portrait combine observation et interprétation, progresse du général au particulier et utilise des expansions du nom variées.</p></div>

<div class="sources"><strong>Sources :</strong> Programme National de Français (2005) ; manuel SESAM 1re &amp; 2e H.</div>
    `
},
{
    title: "Leçon 4 — Orthographe : accords dans le GN et le participe passé",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi écrit-on "les élèves sont arrivés" mais "ils ont étudié leurs leçons" ? Où se trouve le donneur d'accord ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Maîtriser les accords dans le groupe nominal. Appliquer les règles de base du participe passé avec être et avoir. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Accord dans le groupe nominal (GN) :</strong> le déterminant, le nom et l'adjectif s'accordent en genre et en nombre. Exemple : « <em>une</em> grande maison blanche » → « <em>des</em> grandes maisons blanches ».</p>
<p><strong>Accord du participe passé :</strong></p>
<ul>
<li>Avec <strong>être</strong> : le participe passé s'accorde en genre et en nombre avec le <strong>sujet</strong>. Exemple : « Les élèves sont arrivés tôt. » (masculin pluriel) — « Elles sont parties. » (féminin pluriel).</li>
<li>Avec <strong>avoir</strong> : le participe passé <strong>ne s'accorde pas avec le sujet</strong>. Exemple : « Ils ont étudié leurs leçons. » (pas de -s à « étudié »).</li>
<li><strong>Initiation (règle avancée) :</strong> avec « avoir », le participe passé s'accorde avec le COD <em>antéposé</em> (placé avant le verbe). Exemple : « Les leçons qu'ils ont étudiées » (accord avec « leçons »).</li>
</ul>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Groupe nominal :</strong> ensemble autour d'un nom (déterminant + nom + expansions). <strong>Participe passé :</strong> forme verbale utilisée avec être/avoir. <strong>Donneur d'accord :</strong> mot qui impose le genre et le nombre.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Avant d'écrire, identifier : (1) le donneur d'accord (sujet ou COD), (2) l'auxiliaire utilisé (être ou avoir), (3) la règle applicable. Se relire systématiquement.</p></div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment défendre une opinion avec des arguments solides, sans couper la parole à l'autre ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Formuler une opinion, la justifier avec des arguments et des exemples. Écouter et réfuter respectueusement. Structurer une intervention. Prérequis : leçons 1 à 4.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>débat argumenté</strong> est un échange organisé autour d'une question. Il implique deux ou plusieurs positions.</p>
<p><strong>Structure d'une intervention :</strong></p>
<ol>
<li><strong>Thèse :</strong> opinion que l'on défend.</li>
<li><strong>Argument :</strong> raison qui justifie la thèse.</li>
<li><strong>Exemple :</strong> illustration concrète de l'argument.</li>
<li><strong>Conclusion :</strong> reformulation de la position.</li>
</ol>
<p><strong>Connecteurs logiques :</strong> d'abord, ensuite, enfin, de plus, cependant, en revanche, donc, par conséquent.</p>
<p><strong>Attitudes attendues :</strong> écouter sans couper la parole, répondre à l'argument de l'autre, argumenter sans attaquer la personne, respecter les règles de la politesse.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Thèse :</strong> opinion défendue. <strong>Argument :</strong> raison qui soutient la thèse. <strong>Exemple :</strong> cas concret qui illustre l'argument. <strong>Réfutation :</strong> réponse argumentée à la thèse adverse.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Préparer sa thèse et deux arguments avec exemples. Écouter activement. Prendre des notes. Répondre par un contre-argument, pas par une attaque personnelle. Terminer par une conclusion claire.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Sujet : « Faut-il interdire les téléphones portables à l'école ? » Thèse : oui, à l'école primaire. Argument 1 : ils distraient les élèves. Exemple : les SMS en classe font baisser l'attention. Argument 2 : ils favorisent la tricherie. Exemple : consultation d'Internet pendant les évaluations. Conclusion : interdiction à l'école primaire, encadrement au secondaire.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Classe ces énoncés en « argument » ou « exemple » : (a) « Les téléphones distraient les élèves » ; (b) « En classe, des élèves envoient des SMS pendant le cours ». <strong>Ex. 2 :</strong> Cite trois connecteurs logiques.</p>

<p><strong>1)</strong> (a) argument ; (b) exemple. <strong>2)</strong> D'abord, ensuite, enfin (autres réponses possibles : de plus, cependant, donc).</p>

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function init() {
    if (document.getElementById("ecolia-audio-btn")) return;
    var btn = document.createElement("button");
    btn.id = "ecolia-audio-btn"; btn.type = "button"; btn.className = "ecolia-off";
    btn.setAttribute("aria-label", "Écouter la leçon"); btn.innerHTML = PLAY;
    var dlBtn = document.createElement("button");
    dlBtn.id = "ecolia-dl-btn"; dlBtn.type = "button"; dlBtn.className = "ecolia-off";
    dlBtn.innerHTML = DL;
    var host = document.querySelector(".header-right");
    if (host) { host.insertBefore(dlBtn, host.firstChild); host.insertBefore(btn, dlBtn); }
    else { btn.className += " ecolia-fixed"; document.body.appendChild(btn); }
    var banner = document.createElement("div");
    banner.id = "ecolia-audio-banner";
    banner.innerHTML = '<span class="eab-txt"></span><span class="eab-act"></span><div class="eab-bar"><i></i></div>';
    var content = document.getElementById("content");
    if (content && content.parentNode) content.parentNode.insertBefore(banner, content);
    else document.body.insertBefore(banner, document.body.firstChild);
    var txtEl = banner.querySelector(".eab-txt"), actEl = banner.querySelector(".eab-act");
    var barEl = banner.querySelector(".eab-bar"), barI = barEl.firstChild;
    var audio = new Audio();
    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }
    function cur() { try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {} return 0; }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
