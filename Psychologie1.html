<script>
const COURSE_TITLE = "Psychologie";
const slides = [
{
    title: "Sommaire — Psychologie 1re secondaire",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>La psychologie étudie le comportement et les processus mentaux. Dans ce cours, tu vas découvrir comment nous percevons, apprenons, mémorisons, ressentons et interagissons. Ces connaissances t'aideront à mieux te comprendre et à mieux comprendre les élèves que tu accompagneras. Tu apprendras aussi à observer avec rigueur et respect.</p>
<ul>
<li>Leçon 1 — Qu'est-ce que la psychologie ?</li>
<li>Leçon 2 — Les branches de la psychologie</li>
<li>Leçon 3 — Les méthodes de la psychologie</li>
<li>Leçon 4 — Le système nerveux</li>
<li>Leçon 5 — Le cerveau et le comportement</li>
<li>Leçon 6 — Sensation et perception</li>
<li>Leçon 7 — L'attention et la mémoire</li>
<li>Leçon 8 — L'apprentissage</li>
<li>Leçon 9 — L'intelligence</li>
<li>Leçon 10 — La motivation</li>
<li>Leçon 11 — Les émotions</li>
<li>Leçon 12 — La personnalité et le développement</li>
</ul>
<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques de Psychologie (2025), Programme national de Psychologie (EDIDEPS, 2007). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 1 — Qu'est-ce que la psychologie ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certaines personnes ont-elles peur des araignées ? Pourquoi oublie-t-on ce qu'on a appris ? La psychologie cherche des réponses scientifiques. »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir la psychologie. Distinguer psychologie et sens commun. Comprendre son objet. Prérequis : aucun.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>psychologie</strong> est la science qui étudie le comportement et les processus mentaux : ce que nous faisons (comportement observable) et ce qui se passe dans notre esprit (pensées, émotions, souvenirs, motivations).</p>
<p>Elle se distingue du <strong>sens commun</strong> : elle ne se contente pas d'opinions, elle vérifie par des méthodes rigoureuses.</p>
<p>Elle se distingue de la <strong>philosophie</strong> (questions générales sur l'esprit) et de la <strong>psychanalyse</strong> (approche thérapeutique fondée sur l'inconscient).</p>
<p>Le mot vient du grec <em>psychê</em> (âme, esprit) et <em>logos</em> (science).</p>
</div>
<img src="images/Psychologie1_1.jpg" alt="Cerveau et pensées" data-image-id="Psychologie1_1" onerror="this.style.display='none'">
<img src="images/Psychologie1_14.jpg" alt="Élève observant" data-image-id="Psychologie1_14" onerror="this.style.display='none'">

<h3>3. Méthodes et applications</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>La psychologie utilise des méthodes scientifiques : observation, expérience, enquête, test, étude de cas. Elle vise à comprendre, expliquer, prédire et modifier le comportement.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un enseignant observe qu'un élève est distrait en classe. Le sens commun dit « il est paresseux ». La psychologie cherche des explications : problèmes de sommeil ? difficultés familiales ? trouble de l'attention ?</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis la psychologie en une phrase.</p>
<details><summary>Corrigé</summary>
<p>La psychologie est la science du comportement et des processus mentaux.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La psychologie est une science qui étudie le comportement et l'esprit avec rigueur.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques de Psychologie (2025).</div>
    `
},
{
    title: "Leçon 2 — Les branches de la psychologie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Tous les psychologues font-ils le même travail ? Quelles sont les différentes spécialités ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Identifier les principales branches. Associer chaque branche à son objet. Comprendre leur complémentarité. Prérequis : leçon 1.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<ul>
<li><strong>Psychologie clinique :</strong> troubles mentaux (anxiété, dépression).</li>
<li><strong>Psychologie du développement :</strong> évolution de l'individu (Piaget, Vygotski).</li>
<li><strong>Psychologie sociale :</strong> interactions entre individus et groupes.</li>
<li><strong>Psychologie cognitive :</strong> processus mentaux (perception, mémoire).</li>
<li><strong>Psychologie scolaire :</strong> apprentissage et comportement à l'école.</li>
<li><strong>Psychologie du travail :</strong> comportement au travail.</li>
<li><strong>Neuropsychologie :</strong> liens entre cerveau et comportement.</li>
</ul>
</div>
<img src="images/Psychologie1_2.jpg" alt="Branches de la psychologie" data-image-id="Psychologie1_2" onerror="this.style.display='none'">

<h3>3. Méthodes et applications</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Chaque branche a ses méthodes et ses terrains. Pour un futur enseignant, la psychologie scolaire et la psychologie du développement sont les plus utiles.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un psychologue scolaire aide un élève en difficulté d'apprentissage. Un psychologue du développement étudie comment les enfants apprennent à lire.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois branches de la psychologie.</p>
<details><summary>Corrigé</summary>
<p>Clinique, développement, sociale.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La psychologie se divise en branches complémentaires ; chacune éclaire un aspect du comportement.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques de Psychologie (2025).</div>
    `
},
{
    title: "Leçon 3 — Les méthodes de la psychologie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment un psychologue peut-il étudier le comportement sans se tromper ? Quelles méthodes utilise-t-il ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Connaître les principales méthodes. Distinguer observation, expérience et enquête. Comprendre l'éthique de la recherche. Prérequis : leçons 1 et 2.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Observation :</strong> regarder et noter le comportement, sans intervenir.</p>
<p><strong>Expérience :</strong> manipuler une variable pour observer son effet sur une autre.</p>
<p><strong>Enquête :</strong> questionnaire ou entretien pour recueillir des informations.</p>
<p><strong>Test psychologique :</strong> instrument standardisé qui mesure une aptitude, une personnalité.</p>
<p><strong>Étude de cas :</strong> analyse approfondie d'un individu ou d'un petit groupe.</p>
</div>
<img src="images/Psychologie1_3.jpg" alt="Observation de classe" data-image-id="Psychologie1_3" onerror="this.style.display='none'">

<h3>3. Méthodes et applications</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p><strong>Éthique :</strong> respect du consentement, de l'anonymat, de la dignité ; ne pas nuire. <strong>Rigueur :</strong> choisir la méthode adaptée, vérifier les résultats.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Pour comprendre pourquoi des élèves abandonnent l'école, un psychologue peut observer, interroger, comparer deux écoles, analyser le parcours d'un élève. Chaque méthode apporte un éclairage différent.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois méthodes de la psychologie.</p>
<details><summary>Corrigé</summary>
<p>Observation, expérience, enquête.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La psychologie utilise des méthodes variées et exige une éthique rigoureuse.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques de Psychologie (2025).</div>
    `
},
{
    title: "Leçon 4 — Le système nerveux",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment le cerveau commande-t-il le mouvement de la main ? Comment les informations circulent-elles dans le corps ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Décrire l'organisation du système nerveux. Comprendre le rôle du neurone. Relier système nerveux et comportement. Prérequis : leçons 1 à 3.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>système nerveux</strong> est le réseau qui coordonne les fonctions de l'organisme et permet le comportement.</p>
<ul>
<li><strong>SNC :</strong> cerveau, cervelet, tronc cérébral, moelle épinière.</li>
<li><strong>SNP :</strong> nerfs qui relient le SNC aux organes et aux muscles.</li>
</ul>
<p>Le <strong>neurone</strong> est la cellule de base du système nerveux. Il transmet l'influx nerveux par des synapses.</p>
<p>Le système nerveux reçoit les informations, les intègre, puis commande les réponses.</p>
</div>
<img src="images/Psychologie1_4.jpg" alt="Système nerveux" data-image-id="Psychologie1_4" onerror="this.style.display='none'">

<h3>3. Méthodes et applications</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Le système nerveux fonctionne comme un réseau de communication : réception → intégration → réponse. Il est plastique : il se modifie avec l'expérience.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Quand un élève touche un objet brûlant, les récepteurs de la peau envoient un message à la moelle épinière, qui déclenche un réflexe de retrait, puis le cerveau perçoit la douleur.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelles sont les deux grandes parties du système nerveux ?</p>
<details><summary>Corrigé</summary>
<p>Le SNC (cerveau, moelle épinière) et le SNP (nerfs).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le système nerveux est le support biologique du comportement ; il fonctionne en réseau.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques de Psychologie (2025).</div>
    `
},
{
    title: "Leçon 5 — Le cerveau et le comportement",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment le cerveau contrôle-t-il la parole, la mémoire, les émotions ? Toutes les régions du cerveau ont-elles le même rôle ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Situer les grandes régions du cerveau. Associer chaque région à des fonctions. Comprendre la plasticité cérébrale. Prérequis : leçon 4.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le cerveau est divisé en deux <strong>hémisphères</strong>, reliés par le corps calleux.</p>
<ul>
<li><strong>Lobe frontal :</strong> mouvements volontaires, décision, langage, personnalité.</li>
<li><strong>Lobe pariétal :</strong> sensations tactiles, orientation spatiale.</li>
<li><strong>Lobe temporal :</strong> audition, langage, mémoire.</li>
<li><strong>Lobe occipital :</strong> vision.</li>
<li><strong>Cervelet :</strong> équilibre, coordination.</li>
<li><strong>Tronc cérébral :</strong> fonctions vitales.</li>
</ul>
<p><strong>Plasticité cérébrale :</strong> le cerveau se modifie avec l'expérience et l'apprentissage.</p>
</div>
<img src="images/Psychologie1_5.jpg" alt="Cerveau et lobes" data-image-id="Psychologie1_5" onerror="this.style.display='none'">

<h3>3. Méthodes et applications</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Les fonctions cérébrales sont localisées mais aussi distribuées : plusieurs régions collaborent. Les techniques d'imagerie (IRM, EEG) permettent d'observer le cerveau en action.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève qui apprend à lire mobilise plusieurs régions : la vision (lobe occipital), le langage (lobe temporal), la mémoire, l'attention (lobe frontal).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> À quoi sert le lobe frontal ?</p>
<details><summary>Corrigé</summary>
<p>Mouvements volontaires, décision, langage, personnalité.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le cerveau est l'organe du comportement ; ses régions sont spécialisées mais coopèrent.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques de Psychologie (2025).</div>
    `
},
{
    title: "Leçon 6 — Sensation et perception",
    content: `

            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
