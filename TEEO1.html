<script>
const COURSE_TITLE = "Technique d'expression écrite et orale";
const slides = [
{
    title: "Sommaire — TEEO 1re secondaire",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>La technique d'expression écrite et orale t'apprend à communiquer avec efficacité : parler en public, structurer un texte, argumenter, résumer, prendre des notes, écrire une lettre. Ces compétences te serviront à l'école, dans ta vie personnelle et dans ta vie professionnelle. Tu vas apprendre par la pratique : exercices, simulations, productions écrites et orales.</p>
<ul>
<li>Leçon 1 — Le processus de communication</li>
<li>Leçon 2 — Adapter son message au destinataire</li>
<li>Leçon 3 — Enrichir son vocabulaire</li>
<li>Leçon 4 — La voix et la parole</li>
<li>Leçon 5 — Préparer et présenter un exposé</li>
<li>Leçon 6 — Participer à un débat</li>
<li>Leçon 7 — Structurer un texte</li>
<li>Leçon 8 — Écrire pour informer et raconter</li>
<li>Leçon 9 — Écrire pour argumenter</li>
<li>Leçon 10 — Résumer un document</li>
<li>Leçon 11 — Prendre des notes</li>
<li>Leçon 12 — La lettre et la correspondance</li>
</ul>
<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme national de Français (EDIDEPS, 2005), Savoirs Essentiels 2022, CECRL. Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 1 — Le processus de communication",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une information passe-t-elle parfois mal ? Pourquoi dit-on "il n'a pas compris" alors que le message était clair ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Identifier les éléments de la communication. Comprendre les obstacles. Adapter son message à la situation. Prérequis : aucun.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>communication</strong> est le processus par lequel un émetteur transmet un message à un récepteur, par un canal, dans un contexte donné.</p>
<p><strong>Éléments :</strong> émetteur, message, récepteur, canal (oral, écrit, numérique), code (langue), contexte (lieu, moment, relation), feed-back (réponse).</p>
<p><strong>Obstacles :</strong> bruit, ambiguïté du message, différence de code, préjugés, émotions, non-verbal contradictoire.</p>
<p><strong>Communication verbale, non verbale et paraverbale :</strong> le message passe aussi par les gestes et le ton.</p>
</div>
<img src="images/TEEO1_1.jpg" alt="Schéma de la communication" data-image-id="TEEO1_1" onerror="this.style.display='none'">
<img src="images/TEEO1_2.jpg" alt="Groupe en discussion" data-image-id="TEEO1_2" onerror="this.style.display='none'">

<h3>3. Méthodes et techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour communiquer efficacement : clarifier l'objectif, adapter le message, vérifier la compréhension (feed-back), écouter activement. Éviter les obstacles : choisir le bon moment, le bon canal, le bon registre.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un chef de quartier annonce une mesure à la population. S'il parle dans une langue que certains ne comprennent pas, s'il est interrompu par des bruits, ou s'il utilise un vocabulaire technique, le message passe mal.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les principaux éléments de la communication.</p>
<details><summary>Corrigé</summary>
<p>Émetteur, message, récepteur, canal, code, contexte, feed-back.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La communication est un processus complexe qui exige d'adapter le message et de vérifier la compréhension.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Français (EDIDEPS).</div>
    `
},
{
    title: "Leçon 2 — Adapter son message au destinataire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Parle-t-on de la même façon à son ami, à son professeur, à un chef coutumier ? Pourquoi ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Distinguer les registres de langue. Adapter le registre au destinataire. Adapter le canal et le ton. Prérequis : leçon 1.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Registres de langue :</strong></p>
<ul>
<li><strong>Familier :</strong> usage quotidien, entre proches, abréviations.</li>
<li><strong>Courant :</strong> usage ordinaire, compris par tous, correct.</li>
<li><strong>Soutenu :</strong> usage formel, soigné, pour l'écrit officiel et les situations solennelles.</li>
</ul>
<p>Adapter : le registre, le ton, le canal, le niveau de détail, les exemples. <strong>Règle d'or :</strong> se mettre à la place de l'autre (empathie) et vérifier qu'il a compris.</p>
</div>
<img src="images/TEEO1_3.jpg" alt="Élève et directeur" data-image-id="TEEO1_3" onerror="this.style.display='none'">

<h3>3. Méthodes et techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Choisir le registre selon le destinataire, la situation, l'objectif. Éviter les extrêmes : ni trop familier dans un contexte formel, ni trop soutenu avec des proches. Vérifier la compréhension.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève qui demande une faveur à son camarade utilise le registre familier. Le même élève qui s'adresse à son directeur utilise le registre courant ou soutenu. Le message change selon le destinataire.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les trois registres de langue.</p>
<details><summary>Corrigé</summary>
<p>Familier, courant, soutenu.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La communication efficace passe par l'adaptation du message au destinataire et à la situation.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Français (EDIDEPS).</div>
    `
},
{
    title: "Leçon 3 — Enrichir son vocabulaire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certains élèves répètent-ils toujours les mêmes mots ? Comment enrichir son expression ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre l'importance du lexique. Utiliser les familles de mots et les synonymes. Éviter les répétitions et les impropriétés. Prérequis : leçons 1 et 2.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Lexique :</strong> ensemble des mots d'une langue. <strong>Familles de mots :</strong> mots qui partagent la même racine. <strong>Synonymes :</strong> mots de sens proche. <strong>Antonymes :</strong> mots de sens contraire. <strong>Préfixes et suffixes :</strong> modifient le sens.</p>
<p><strong>Impropriétés :</strong> usage incorrect d'un mot. <strong>Répétitions :</strong> à éviter par synonymes et pronoms.</p>
</div>
<img src="images/TEEO1_4.jpg" alt="Dictionnaire ouvert" data-image-id="TEEO1_4" onerror="this.style.display='none'">

<h3>3. Méthodes et techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Lire régulièrement, noter les mots nouveaux, les réutiliser, chercher synonymes et familles de mots. Pour éviter les répétitions : pronoms, synonymes, périphrases. Consulter un dictionnaire pour vérifier une impropriété.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>« Le marché de Kinshasa est très grand. Ce marché est très grand. » (répétitions). Version enrichie : « Le marché de Kinshasa est immense. Cette vaste étendue commerciale attire une foule nombreuse. »</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Donne trois synonymes de maison.</p>
<details><summary>Corrigé</summary>
<p>Demeure, habitation, résidence.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Enrichir son vocabulaire, c'est mieux communiquer ; synonymes, familles de mots et pronoms évitent les répétitions.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Français (EDIDEPS).</div>
    `
},
{
    title: "Leçon 4 — La voix et la parole",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certains orateurs captivent-ils l'auditoire tandis que d'autres endorment ? Qu'est-ce qui fait la qualité d'une prise de parole ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Travailler la voix, le rythme et le ton. Maîtriser le non-verbal. Gérer le trac. Prérequis : leçons 1 à 3.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Voix :</strong> volume, débit, articulation, intonation.</p>
<p><strong>Rythme :</strong> alterner les pauses, les moments forts et calmes.</p>
<p><strong>Non-verbal :</strong> posture droite, regard, gestes, visage expressif.</p>
<p><strong>Trac :</strong> respiration, préparation, répétition, visualisation positive.</p>
</div>
<img src="images/TEEO1_5.jpg" alt="Orateur face à un public" data-image-id="TEEO1_5" onerror="this.style.display='none'">
<img src="images/TEEO1_6.jpg" alt="Respiration avant de parler" data-image-id="TEEO1_6" onerror="this.style.display='none'">

<h3>3. Méthodes et techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Avant : respirer profondément, s'échauffer la voix, relire ses notes. Pendant : regarder l'auditoire, parler distinctement, marquer les pauses. Après : écouter les retours, noter les points à améliorer.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève timide prépare ses notes, répète à voix haute, respire avant de commencer, regarde ses camarades, parle lentement. Il gère son trac.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois éléments du non-verbal.</p>
<details><summary>Corrigé</summary>
<p>Posture, regard, gestes.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La qualité de la parole dépend de la voix, du rythme, du non-verbal et de la gestion du trac.</p></div>

<div class="sources"><strong>Sources :</strong> Techniques d'expression écrite et orale.</div>
    `
},
{
    title: "Leçon 5 — Préparer et présenter un exposé",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment préparer un exposé en classe ? Que dire en premier ? Comment conclure ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Structurer un exposé. Préparer des notes et des supports. Présenter clairement. Prérequis : leçon 4.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Structure :</strong></p>
<ol>
<li>Introduction : saluer, annoncer le sujet et le plan.</li>
<li>Développement : deux ou trois parties, exemples, transitions.</li>
<li>Conclusion : résumer, ouvrir une perspective, remercier.</li>
</ol>
<p><strong>Préparation :</strong> rechercher, organiser, rédiger des notes (mots-clés), préparer un support (tableau, schéma).</p>
<p><strong>Présentation :</strong> parler sans lire, regarder l'auditoire, gérer le temps, répondre aux questions.</p>
</div>
<img src="images/TEEO1_7.jpg" alt="Élève faisant un exposé" data-image-id="TEEO1_7" onerror="this.style.display='none'">
<img src="images/TEEO1_8.jpg" alt="Plan d'exposé au tableau" data-image-id="TEEO1_8" onerror="this.style.display='none'">

<h3>3. Méthodes et techniques</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Commencer par un plan écrit (2-3 parties). Notes : mots-clés, pas de phrases complètes. Répétition : s'entraîner à voix haute, chronométrer. Support : simple, lisible, utile.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Exposé sur « Les métiers du numérique en RDC » : introduction (présentation du sujet et du plan), développement (métiers, opportunités, formations), conclusion (résumé et perspectives).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les trois parties d'un exposé.</p>
<details><summary>Corrigé</summary>
<p>Introduction, développement, conclusion.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un exposé réussi repose sur une préparation structurée et une présentation vivante.</p></div>

<div class="sources"><strong>Sources :</strong> Techniques d'expression écrite et orale.</div>
    `
},
{

    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
