<div class="sources"><strong>Sources :</strong> Programme éducatif national de Mathématiques (DIPROMAD/MEPST, RDC) ; manuel « Réussir en Mathématiques – 2ème Année Hum » (LAHA Éditions) ; ressources pédagogiques RDC (Schoolap, EDUQUAM).</div>

{
    title: "Leçon 1 — Calcul numérique et proportionnalité",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment calculer rapidement un prix, une remise ou une distance sur une carte ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Appliquer les règles de calcul sur les puissances et les racines. Résoudre des problèmes de proportionnalité et de pourcentages. Prérequis : opérations sur les réels, fractions.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Règles de calcul sur les puissances :</strong></p>
<ul>
<li>a^m × a^n = a^(m+n)</li>
<li>a^m / a^n = a^(m−n)</li>
<li>(a^m)^n = a^(m×n)</li>
<li>a^0 = 1 (a ≠ 0)</li>
<li>a^(−n) = 1 / a^n</li>
</ul>
<p><strong>Racines carrées :</strong></p>
<ul>
<li>√(a×b) = √a × √b (a, b ≥ 0)</li>
<li>Attention : √(a+b) ≠ √a + √b.</li>
<li>Exemple : √50 = √(25×2) = 5√2.</li>
</ul>
<p><strong>Proportionnalité :</strong> deux grandeurs sont proportionnelles si leurs rapports sont constants.</p>
<ul>
<li><strong>Règle de trois :</strong> si 1 kg coûte 2 500 FC, alors 3,5 kg coûtent 3,5 × 2 500 = 8 750 FC.</li>
<li><strong>Pourcentage :</strong> t % de x = (t/100) × x. Exemple : 15 % de 2 000 = 300.</li>
</ul>
<p><strong>Échelles :</strong> 1/50 000 signifie que 1 cm sur la carte représente 50 000 cm = 500 m = 0,5 km sur le terrain.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Puissance :</strong> aⁿ = a × a × … × a (n fois). <strong>Racine carrée :</strong> nombre positif dont le carré est a. <strong>Proportionnalité :</strong> rapport constant entre deux grandeurs.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Appliquer les règles une par une. Simplifier les racines en cherchant un carré parfait. Convertir les pourcentages en décimaux. Poser clairement la règle de trois.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>3,5 kg de riz à 2 500 FC/kg : 8 750 FC. Remise de 15 % sur 2 000 FC : 300 FC de remise, soit 1 700 FC à payer. Carte au 1/50 000 : 4 cm = 2 km sur le terrain.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Simplifier √72. <strong>Ex. 2 :</strong> Calculer 15 % de 2 000 FC.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> √72 = √(36×2) = 6√2. <strong>2)</strong> 0,15 × 2 000 = 300 FC.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La proportionnalité est un outil universel ; les règles de calcul doivent être appliquées avec rigueur.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel « Réussir en Mathématiques – 2ème Année Hum » (LAHA Éditions).</div>
    `
},
{
    title: "Leçon 2 — Calcul littéral et équations",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment résoudre un problème de bénéfice ou de partage en posant une équation ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Développer et factoriser des expressions simples. Résoudre équations et inéquations. Mettre un problème en équation. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Développement et factorisation :</strong></p>
<ul>
<li>Facteur commun : ax + ay = a(x + y).</li>
<li>Identités remarquables : (a+b)² = a² + 2ab + b² ; a² − b² = (a−b)(a+b).</li>
</ul>
<p><strong>Équation du premier degré :</strong> ax + b = 0 → x = −b/a (a ≠ 0). Exemple : 2x + 3 = 11 → x = 4.</p>
<p><strong>Équation du second degré :</strong> ax² + bx + c = 0.</p>
<ul>
<li>Discriminant : Δ = b² − 4ac.</li>
<li>Δ > 0 : deux solutions x = (−b ± √Δ)/2a.</li>
<li>Δ = 0 : une solution double x = −b/2a.</li>
<li>Δ < 0 : aucune solution réelle.</li>
</ul>
<p><strong>Produit nul :</strong> un produit est nul si et seulement si l'un de ses facteurs est nul.</p>
<p><strong>Inéquations du premier degré :</strong> mêmes règles que les équations, mais multiplier/diviser par un nombre négatif change le sens de l'inégalité.</p>
<p><strong>Mise en équation :</strong> traduire un problème concret en langage mathématique.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Équation :</strong> égalité contenant une inconnue. <strong>Solution :</strong> valeur qui rend l'égalité vraie. <strong>Discriminant :</strong> Δ = b² − 4ac.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Isoler l'inconnue. Vérifier la solution. Pour le second degré, calculer Δ. Changer le sens de l'inégalité si on multiplie/divise par un négatif. Traduire un problème étape par étape.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un commerçant achète des pagnes à 5 000 FC et les revend à 7 500 FC avec un bénéfice total de 20 000 FC. Équation : 7 500x − 5 000x = 20 000 → 2 500x = 20 000 → x = 8 pagnes.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Résoudre 2x + 3 = 11. <strong>Ex. 2 :</strong> Résoudre x² − 5x + 6 = 0.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> x = 4. <strong>2)</strong> Δ = 1 ; x = 3 ou x = 2.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une équation se résout par étapes ; la solution doit toujours être vérifiée.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel « Réussir en Mathématiques – 2ème Année Hum » (LAHA Éditions).</div>
    `
},
{
    title: "Leçon 3 — Fonctions linéaires et affines",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment modéliser un abonnement téléphonique ou une facture d'eau ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la notion de fonction. Distinguer fonction linéaire et affine. Lire et tracer des graphiques. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Fonction :</strong> relation qui associe à chaque nombre x une image f(x).</p>
<p><strong>Fonction linéaire :</strong> f(x) = ax. Représentation graphique : droite passant par l'origine (0, 0).</p>
<p><strong>Fonction affine :</strong> f(x) = ax + b. Représentation graphique : droite qui coupe l'axe des ordonnées en (0, b).</p>
<p><strong>Vocabulaire :</strong> image (f(x)) et antécédent (x tel que f(x) = y).</p>
<p><strong>Coefficients :</strong> « a » est le coefficient directeur (pente) ; « b » est l'ordonnée à l'origine.</p>
<p><strong>Exemple concret :</strong> coût = 1 000 FC de frais fixes + 200 FC/minute : f(x) = 200x + 1 000 (fonction affine).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Fonction linéaire :</strong> f(x) = ax. <strong>Fonction affine :</strong> f(x) = ax + b. <strong>Image :</strong> f(x). <strong>Antécédent :</strong> x tel que f(x) = y.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Calculer quelques points pour tracer. Lire une image ou un antécédent sur le graphique. Interpréter a (pente) et b (ordonnée à l'origine).</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>f(x) = 200x + 1 000. Image de 10 : f(10) = 3 000 FC. Antécédent de 3 000 : 200x + 1 000 = 3 000 → x = 10 minutes.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Image de 3 par f(x) = 2x + 1 ? <strong>Ex. 2 :</strong> Type de f(x) = 3x ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> f(3) = 7. <strong>2)</strong> Fonction linéaire.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une fonction linéaire passe par l'origine ; une fonction affine ne passe pas forcément par l'origine.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel « Réussir en Mathématiques – 2ème Année Hum » (LAHA Éditions).</div>
    `
},
{
    title: "Leçon 4 — Statistique descriptive",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment résumer les notes d'une classe en quelques chiffres ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Organiser des données. Calculer les indicateurs de tendance centrale et de dispersion. Choisir une représentation adaptée. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Vocabulaire :</strong></p>
<ul>
<li><strong>Population :</strong> ensemble étudié.</li>
<li><strong>Échantillon :</strong> sous-ensemble de la population.</li>
<li><strong>Caractère :</strong> qualitatif (non numérique) ou quantitatif (numérique).</li>
<li><strong>Effectif :</strong> nombre d'individus pour une valeur.</li>
<li><strong>Fréquence :</strong> effectif / effectif total.</li>
</ul>
<p><strong>Représentations :</strong> diagramme en bâtons (qualitatif ou discret), histogramme (quantitatif continu), diagramme circulaire (proportions).</p>
<p><strong>Mesures de tendance centrale :</strong></p>
<ul>
<li><strong>Moyenne :</strong> somme des valeurs / effectif total (sensible aux valeurs extrêmes).</li>
<li><strong>Médiane :</strong> valeur qui partage l'effectif en deux groupes égaux.</li>
<li><strong>Mode :</strong> valeur la plus fréquente.</li>
</ul>
<p><strong>Mesures de dispersion :</strong> étendue = max − min.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Effectif :</strong> nombre d'individus. <strong>Fréquence :</strong> effectif / effectif total. <strong>Médiane :</strong> valeur centrale. <strong>Étendue :</strong> max − min.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Organiser les données dans un tableau. Trier les valeurs pour la médiane. Choisir la représentation adaptée. Interpréter avec prudence : la moyenne seule peut tromper.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Série : 8, 12, 10, 14, 6. Moyenne = 50/5 = 10. Médiane = 10. Étendue = 14 − 6 = 8.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Calculer la moyenne de la série 8, 12, 10, 14, 6. <strong>Ex. 2 :</strong> Quelle mesure est la plus sensible aux valeurs extrêmes ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> 10. <strong>2)</strong> La moyenne.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une donnée brute ne dit rien ; c'est son organisation et son analyse qui produisent du sens.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel « Réussir en Mathématiques – 2ème Année Hum » (LAHA Éditions).</div>
    `
},

    title: "Leçon 5 — Géométrie et logique",

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Figures de base :</strong> triangles, quadrilatères (carré, rectangle, losange, parallélogramme, trapèze), cercle.</p>
<p><strong>Théorème de Pythagore :</strong> dans un triangle rectangle, hypoténuse² = côté² + côté². Réciproque : si hypoténuse² = somme des carrés des deux autres côtés, le triangle est rectangle.</p>
<p><strong>Aires et périmètres :</strong></p>
<ul>
<li>Rectangle : aire = L × l ; périmètre = 2(L + l).</li>
<li>Triangle : aire = (b × h) / 2.</li>
<li>Cercle : aire = πr² ; périmètre = 2πr.</li>
</ul>
<p><strong>Logique :</strong></p>
<ul>
<li><strong>Proposition :</strong> énoncé vrai ou faux.</li>
<li><strong>Implication :</strong> « si P alors Q ».</li>
<li><strong>Raisonnement déductif :</strong> part des prémisses et aboutit à une conclusion.</li>
</ul>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Hypoténuse :</strong> côté opposé à l'angle droit. <strong>Proposition :</strong> énoncé vrai ou faux. <strong>Implication :</strong> « si P alors Q ».</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Vérifier que le triangle est rectangle avant d'utiliser Pythagore. Identifier clairement l'hypoténuse. Justifier chaque étape du raisonnement.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Terrain rectangulaire de 30 m × 40 m : diagonale = √(30² + 40²) = √2500 = 50 m. Triangle de côtés 3, 4 et 5 : 3² + 4² = 9 + 16 = 25 = 5² → rectangle.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Un triangle de côtés 3, 4 et 5 est-il rectangle ? <strong>Ex. 2 :</strong> Formule de l'aire d'un cercle ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Oui, car 3² + 4² = 5². <strong>2)</strong> Aire = πr².</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La géométrie se démontre ; le raisonnement logique est la base de la rigueur.</p></div>

    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
