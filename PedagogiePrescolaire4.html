{
    title: "Sommaire — Pédagogie Préscolaire",
    content: `
        <div class="bloc resume">
            <div class="bloc-label">Présentation du cours</div>
            <h3>Pédagogie Préscolaire — 4e Humanité (6e HP)</h3>
            <p><strong>Niveau :</strong> 4e Humanité / Terminale, section Pédagogique (option Pédagogie Générale).</p>
            <p><strong>Objectif général :</strong> Former l'élève-maître à l'éducation préscolaire, en lui donnant les connaissances et les compétences nécessaires pour accompagner le développement harmonieux des enfants de 0 à 6 ans.</p>

            <div class="bloc-label">Objectifs spécifiques</div>

                <li>Organiser un environnement sécurisant et stimulant.</li>
                <li>Évaluer les progrès des enfants de manière formative.</li>
                <li>Collaborer avec les familles.</li>
            </ol>
        </div>
        <div class="bloc exemple">
            <div class="bloc-label">Organisation des chapitres</div>
            <ul>
                <li><strong>Chapitre I :</strong> Introduction à la pédagogie préscolaire.</li>
                <li><strong>Chapitre II :</strong> Les grands pédagogues du préscolaire.</li>
                <li><strong>Chapitre III :</strong> Le développement de l'enfant de 0 à 6 ans.</li>
                <li><strong>Chapitre IV :</strong> Les principes de l'éducation préscolaire.</li>
                <li><strong>Chapitre V :</strong> Les domaines d'activités au préscolaire.</li>
                <li><strong>Chapitre VI :</strong> L'organisation de l'espace et du temps.</li>
                <li><strong>Chapitre VII :</strong> L'évaluation au préscolaire.</li>
                <li><strong>Chapitre VIII :</strong> Le partenariat avec les familles et la communauté.</li>
            </ul>
            <p><strong>Prérequis :</strong> Psychologie de l'Enfant ; Pédagogie Générale ; notions de base en didactique.</p>
        </div>
        <div class="sources">
            <p><strong>Sources :</strong> Programme National de Pédagogie (2009) ; Manuel de Psychologie du Développement (4e HP) ; Documents officiels du MEPST sur la petite enfance et le préscolaire ; Références pédagogiques UNESCO/UNICEF.</p>
        </div>
    `
},
{
    title: "Leçon 1 — Qu'est-ce que la pédagogie préscolaire ?",
    content: `
        <div class="bloc cas">
            <div class="bloc-label">Situation de départ</div>
            <p>Dans une école maternelle de Kinshasa, les enfants jouent, chantent, manipulent des objets. Est-ce seulement une garderie ou une véritable éducation ?</p>
        </div>
        <div class="bloc theorie">
            <div class="bloc-label">Fondements théoriques</div>
            <h3>Définition</h3>
            <p>La pédagogie préscolaire est la science et l'art de l'éducation des enfants de 0 à 6 ans, avant l'entrée à l'école primaire. Elle vise le <strong>développement global</strong> de l'enfant (physique, cognitif, langagier, affectif, social) dans un environnement sécurisant et stimulant.</p>
            <h3>Importance</h3>
            <ul>
                <li>Les premières années sont déterminantes pour le développement du cerveau.</li>
                <li>Une éducation préscolaire de qualité favorise la réussite scolaire future.</li>
                <li>Elle réduit les inégalités sociales.</li>
                <li>Elle favorise la socialisation et l'autonomie.</li>
            </ul>
            <h3>Finalités</h3>
            <ul>
                <li>Développer toutes les potentialités de l'enfant.</li>
                <li>Favoriser son autonomie, sa socialisation, sa confiance en soi.</li>
                <li>Préparer l'entrée à l'école primaire.</li>
            </ul>
            <h3>Historique</h3>
            <p>Le préscolaire s'est développé en Europe au XIXe siècle (Froebel, Montessori). En RDC, il reste peu développé, principalement en milieu urbain, mais des efforts sont en cours pour sa généralisation.</p>
        </div>
        <div class="bloc exemple">
            <div class="bloc-label">Exemple concret</div>
            <p>Une classe maternelle bien organisée n'est pas un simple lieu de garde : les enfants y développent le langage, la motricité, la socialisation et l'autonomie à travers des activités structurées.</p>
        </div>
        <div class="bloc resume">
            <div class="bloc-label">À retenir</div>
            <ul>
                <li>Le préscolaire est une véritable éducation, pas une garderie.</li>
                <li>Il vise le développement global de l'enfant.</li>
                <li>Erreur fréquente : scolariser trop tôt le préscolaire en imposant des activités assises.</li>
            </ul>
        </div>
    `
},
{
    title: "Leçon 2 — Froebel et le jardin d'enfants",
    content: `
        <div class="bloc theorie">
            <div class="bloc-label">Fondements théoriques</div>
            <h3>Friedrich Froebel (1782-1852)</h3>
            <p>Pédagogue allemand, Froebel est le fondateur du <strong>Kindergarten</strong> (« jardin d'enfants »). Il voit l'enfant comme une plante à cultiver : l'éducateur est un jardinier qui accompagne son développement.</p>
            <h3>Principes</h3>
            <ul>
                <li>Le <strong>jeu</strong> est l'activité naturelle et éducative par excellence.</li>
                <li>L'enfant apprend par l'activité et l'exploration libre.</li>
                <li>L'éducateur observe, guide et propose, sans imposer.</li>
                <li>L'environnement doit être riche, naturel et sécurisé.</li>
            </ul>
            <h3>Le matériel Froebel : les « dons »</h3>
            <p>Froebel a conçu une série d'objets (boules, cubes, cylindres, bâtonnets, papiers colorés) pour manipuler, construire et représenter. Ces « dons » stimulent la créativité et la compréhension des formes.</p>
            <figure>
                <img data-image-id="pedagogieprescolaire4_img01" alt="Illustration d'un jardin d'enfants Froebel">
                <figcaption>Le jardin d'enfants de Froebel : un espace où l'enfant cultive son développement par le jeu et la manipulation.</figcaption>
            </figure>
        </div>
        <div class="bloc exemple">
            <div class="bloc-label">Exemple concret</div>
            <p>Dans une classe maternelle d'aujourd'hui, les coins de jeux symboliques, les blocs de construction et le matériel de manipulation s'inspirent directement de l'héritage de Froebel.</p>
        </div>
        <div class="bloc resume">
            <div class="bloc-label">À retenir</div>
            <ul>
                <li>Froebel est le père du jardin d'enfants.</li>
                <li>Le jeu est le mode d'apprentissage privilégié du jeune enfant.</li>
                <li>Erreur fréquente : transformer le jardin d'enfants en classe formelle.</li>
            </ul>
        </div>
    `
},
{
    title: "Leçon 3 — Montessori : autonomie et matériel auto-correctif",
    content: `
        <div class="bloc theorie">
            <div class="bloc-label">Fondements théoriques</div>
            <h3>Maria Montessori (1870-1952)</h3>
            <p>Médecin et pédagogue italienne, Montessori a développé une pédagogie centrée sur l'<strong>autonomie</strong> et l'<strong>indépendance</strong> de l'enfant, dans un environnement préparé et respectueux de son rythme.</p>
            <h3>Principes</h3>
            <ul>
                <li><strong>Environnement préparé :</strong> espace ordonné, accessible, adapté à la taille de l'enfant.</li>
                <li><strong>Matériel auto-correctif :</strong> l'enfant peut vérifier lui-même s'il a réussi, sans intervention de l'adulte.</li>
                <li><strong>Respect du rythme :</strong> chacun progresse à son rythme.</li>
                <li><strong>L'adulte est un guide :</strong> il observe, prépare l'environnement, montre, puis se retire.</li>
            </ul>
            <h3>Domaines d'activité</h3>
            <ul>
                <li><strong>Vie pratique :</strong> verser, transvaser, boutonner, laver.</li>
                <li><strong>Sensoriel :</strong> discriminer les couleurs, les formes, les textures, les sons, les odeurs.</li>
                <li><strong>Langage :</strong> vocabulaire, lettres rugueuses.</li>
                <li><strong>Mathématiques :</strong> nombres, quantités, opérations concrètes.</li>
            </ul>
            <figure>
                <img data-image-id="pedagogieprescolaire4_img02" alt="Matériel Montessori">
                <figcaption>Le matériel Montessori : conçu pour être manipulé, il permet à l'enfant de s'auto-corriger.</figcaption>
            </figure>
        </div>
        <div class="bloc exemple">
            <div class="bloc-label">Exemple concret</div>
            <p>Un enfant transvase des graines d'un bol à un autre avec une cuillère. Si les graines tombent, il recommence : c'est lui qui corrige, développant sa concentration et sa motricité fine.</p>
        </div>
        <div class="bloc resume">
            <div class="bloc-label">À retenir</div>
            <ul>
                <li>Montessori met l'accent sur l'autonomie et le respect du rythme.</li>
                <li>Le matériel auto-correctif permet à l'enfant de progresser seul.</li>
                <li>Erreur fréquente : aider l'enfant avant qu'il n'ait essayé par lui-même.</li>
            </ul>
        </div>
    `
},
{
    title: "Leçon 4 — Decroly, Piaget et Vygotsky au préscolaire",
    content: `
        <div class="bloc theorie">
            <div class="bloc-label">Fondements théoriques</div>
            <h3>Ovide Decroly (1871-1932)</h3>
            <p>Médecin et pédagogue belge, Decroly propose la pédagogie des <strong>centres d'intérêt</strong>. L'enfant apprend globalement, à partir de ses intérêts et de son environnement. Il est aussi l'inventeur de la <strong>méthode globale de lecture</strong>.</p>
            <h3>Jean Piaget (1896-1980)</h3>
            <p>Le développement cognitif se fait par <strong>stades</strong>. Au préscolaire : stade <strong>sensori-moteur</strong> (0-2 ans) et stade <strong>préopératoire</strong> (2-7 ans). L'enfant apprend par l'action et la manipulation.</p>
            <h3>Lev Vygotsky (1896-1934)</h3>
            <p>Les interactions sociales et le langage jouent un rôle central dans le développement. La <strong>Zone Proximale de Développement (ZPD)</strong> désigne l'écart entre ce que l'enfant sait faire seul et ce qu'il peut faire avec l'aide d'un adulte ou d'un pair plus compétent. L'adulte <strong>étaye</strong> pour faire progresser l'enfant.</p>
            <h3>Tableau comparatif</h3>
            <table>
                <thead><tr><th>Auteur</th><th>Apport principal</th></tr></thead>
                <tbody>
                    <tr><td>Decroly</td><td>Centres d'intérêt, méthode globale</td></tr>
                    <tr><td>Piaget</td><td>Stades du développement cognitif</td></tr>
                    <tr><td>Vygotsky</td><td>ZPD, rôle des interactions sociales</td></tr>
                </tbody>
            </table>
        </div>
        <div class="bloc exemple">
            <div class="bloc-label">Exemple concret</div>
            <p>Un enfant ne sait pas encore boutonner sa veste seul. Avec l'aide d'un adulte qui montre lentement, il y parvient. C'est la ZPD de Vygotsky en action.</p>
        </div>
        <div class="bloc resume">
            <div class="bloc-label">À retenir</div>
            <ul>
                <li>Decroly : partir des intérêts de l'enfant.</li>
                <li>Piaget : respecter les stades du développement.</li>
                <li>Vygotsky : étayer pour faire progresser dans la ZPD.</li>
            </ul>
        </div>
    `
},
{
    title: "Leçon 5 — Le développement de 0 à 6 ans",
    content: `
        <div class="bloc theorie">
            <div class="bloc-label">Fondements théoriques</div>
            <h3>Développement moteur</h3>
            <ul>
                <li>0-3 mois : tenir la tête, suivre du regard.</li>
                <li>6 mois : s'asseoir avec appui, préhension.</li>
                <li>9-12 mois : tenir debout, premiers pas.</li>
                <li>18 mois : marcher, courir maladroitement.</li>
                <li>3 ans : courir, sauter, grimper.</li>
                <li>4-6 ans : motricité fine (découper, dessiner), coordination.</li>
            </ul>
            <h3>Développement langagier</h3>
            <ul>
                <li>Cris, babillage (0-1 an).</li>
                <li>Premiers mots (12-18 mois).</li>
                <li>Phrases simples (2-3 ans).</li>
                <li>Vocabulaire en expansion, phrases complexes (3-6 ans).</li>
            </ul>
            <h3>Développement cognitif</h3>
            <ul>
                <li>Stade sensori-moteur (0-2 ans) : exploration par les sens et le mouvement.</li>
                <li>Stade préopératoire (2-7 ans) : pensée symbolique (jeu, dessin), égocentrisme, raisonnement intuitif.</li>
            </ul>
            <h3>Développement affectif et social</h3>
            <ul>
                <li>Attachement (Bowlby) : besoin de sécurité affective.</li>
                <li>Socialisation progressive : jeu parallèle, puis coopératif.</li>
                <li>Apprentissage des règles et du partage.</li>
            </ul>
        </div>
        <div class="bloc exemple">
            <div class="bloc-label">Exemple concret</div>
            <p>Un enfant de 4 ans qui parle de son « doudou » comme s'il était vivant illustre la pensée symbolique. Un enfant de 5 ans qui joue à la marchande avec d'autres enfants illustre la socialisation et le jeu coopératif.</p>
        </div>
        <div class="bloc resume">
            <div class="bloc-label">À retenir</div>
            <ul>
                <li>Le développement est global (moteur, cognitif, langagier, affectif, social).</li>

science et l'art de l'éducation des enfants de 0 à 6 ans, avant l'entrée à l'école primaire. Elle vise le développement global de l'enfant (physique, cognitif, langagier, affectif, social) dans un environnement sécurisant et stimulant. Importance. Les premières années sont déterminantes pour le développement du cerveau. Une éducation préscolaire de qualité favorise la réussite scolaire future. Elle réduit les inégalités sociales. Elle favorise la socialisation et l'autonomie. Finalités. Développer toutes les potentialités de l'enfant. Favoriser son autonomie, sa socialisation, sa confiance en soi. Préparer l'entrée à l'école primaire. Historique. Le préscolaire s'est développé en Europe au XIXe siècle (Froebel, Montessori). En R D C, il reste peu développé, principalement en milieu urbain, mais des efforts sont en cours pour sa généralisation. Exemple concret. Une classe maternelle bien organisée n'est pas un simple lieu de garde: les enfants y développent le langage, la motricité, la socialisation et l'autonomie à travers des activités structurées. À retenir. Le préscolaire est une véritable éducation, pas une garderie. Il vise le développement global de l'enfant. Erreur fréquente: scolariser trop tôt le préscolaire en imposant des activités assises."]],"3":[["fr","Leçon 2, Froebel et le jardin d'enfants. Fondements théoriques. Friedrich Froebel (1782-1852). Pédagogue allemand, Froebel est le fondateur du Kindergarten (« jardin d'enfants »). Il voit l'enfant comme une plante à cultiver: l'éducateur est un jardinier qui accompagne son développement. Principes. Le jeu est l'activité naturelle et éducative par excellence. L'enfant apprend par l'activité et l'exploration libre. L'éducateur observe, guide et propose, sans imposer. L'environnement doit être riche, naturel et sécurisé. Le matériel Froebel: les « dons ». Froebel a conçu une série d'objets (boules, cubes, cylindres, bâtonnets, papiers colorés) pour manipuler, construire et représenter. Ces « dons » stimulent la créativité et la compréhension des formes. Le jardin d'enfants de Froebel: un espace où l'enfant cultive son développement par le jeu et la manipulation. Exemple concret. Dans une classe maternelle d'aujourd'hui, les coins de jeux symboliques, les blocs de construction et le matériel de manipulation s'inspirent directement de l'héritage de Froebel. À retenir. Froebel est le père du jardin d'enfants. Le jeu est le mode d'apprentissage privilégié du jeune enfant. Erreur fréquente: transformer le jardin d'enfants en classe formelle."]],"4":[["fr","Leçon 3, Montessori: autonomie et matériel auto-correctif. Fondements théoriques. Maria Montessori (1870-1952). Médecin et pédagogue italienne, Montessori a développé une pédagogie centrée sur l'autonomie et l'indépendance de l'enfant, dans un environnement préparé et respectueux de son rythme. Principes. Environnement préparé: espace ordonné, accessible, adapté à la taille de l'enfant. Matériel auto-correctif: l'enfant peut vérifier lui-même s'il a réussi, sans intervention de l'adulte. Respect du rythme: chacun progresse à son rythme. L'adulte est un guide: il observe, prépare l'environnement, montre, puis se retire. Domaines d'activité. Vie pratique: verser, transvaser, boutonner, laver. Sensoriel: discriminer les couleurs, les formes, les textures, les sons, les odeurs. Langage: vocabulaire, lettres rugueuses. Mathématiques: nombres, quantités, opérations concrètes. Le matériel Montessori: conçu pour être manipulé, il permet à l'enfant de s'auto-corriger. Exemple concret. Un enfant transvase des graines d'un bol à un autre avec une cuillère. Si les graines tombent, il recommence: c'est lui qui corrige, développant sa concentration et sa motricité fine. À retenir. Montessori met l'accent sur l'autonomie et le respect du rythme. Le matériel auto-correctif permet à l'enfant de progresser seul. Erreur fréquente: aider l'enfant avant qu'il n'ait essayé par lui-même."]],"5":[["fr","Leçon 4, Decroly, Piaget et Vygotsky au préscolaire. Fondements théoriques. Ovide Decroly (1871-1932). Médecin et pédagogue belge, Decroly propose la pédagogie des centres d'intérêt. L'enfant apprend globalement, à partir de ses intérêts et de son environnement. Il est aussi l'inventeur de la méthode globale de lecture. Jean Piaget (1896-1980). Le développement cognitif se fait par stades. Au préscolaire: stade sensori-moteur (0-2 ans) et stade préopératoire (2-7 ans). L'enfant apprend par l'action et la manipulation. Lev Vygotsky (1896-1934). Les interactions sociales et le langage jouent un rôle central dans le développement. La Zone Proximale de Développement (ZPD) désigne l'écart entre ce que l'enfant sait faire seul et ce qu'il peut faire avec l'aide d'un adulte ou d'un pair plus compétent. L'adulte étaye pour faire progresser l'enfant. Tableau comparatif. Auteur. Apport principal. Decroly. Centres d'intérêt, méthode globale. Piaget. Stades du développement cognitif. Vygotsky. ZPD, rôle des interactions sociales. Exemple concret. Un enfant ne sait pas encore boutonner sa veste seul. Avec l'aide d'un adulte qui montre lentement, il y parvient. C'est la ZPD de Vygotsky en action. À retenir. Decroly: partir des intérêts de l'enfant. Piaget: respecter les stades du développement. Vygotsky: étayer pour faire progresser dans la ZPD."]],"6":[["fr","Leçon 5, Le développement de 0 à 6 ans. Fondements théoriques. Développement moteur. 0-3 mois: tenir la tête, suivre du regard. 6 mois: s'asseoir avec appui, préhension. 9-12 mois: tenir debout, premiers pas. 18 mois: marcher, courir maladroitement. 3 ans: courir, sauter, grimper. 4-6 ans: motricité fine (découper, dessiner), coordination. Développement langagier. Cris, babillage (0-1 an). Premiers mots (12-18 mois). Phrases simples (2-3 ans). Vocabulaire en expansion, phrases complexes (3-6 ans). Développement cognitif. Stade sensori-moteur (0-2 ans): exploration par les sens et le mouvement. Stade préopératoire (2-7 ans): pensée symbolique (jeu, dessin), égocentrisme, raisonnement intuitif. Développement affectif et social. Attachement (Bowlby): besoin de sécurité affective. Socialisation progressive: jeu parallèle, puis coopératif. Apprentissage des règles et du partage. Exemple concret. Un enfant de 4 ans qui parle de son « doudou » comme s'il était vivant illustre la pensée symbolique. Un enfant de 5 ans qui joue à la marchande avec d'autres enfants illustre la socialisation et le jeu coopératif. À retenir. Le développement est global (moteur, cognitif, langagier, affectif, social). Chaque enfant a son propre rythme. Erreur fréquente: comparer les enfants entre eux et imposer un rythme uniforme."]],"7":[["fr","Leçon 6, Les principes de l'éducation préscolaire. Fondements théoriques. Les principes fondamentaux. Activité: l'enfant apprend en agissant, en manipulant, en explorant. Jeu: le mode d'apprentissage privilégié du jeune enfant (jeu libre, jeu symbolique, jeu de construction). Globalité: l'enfant apprend de manière globale; les activités ne sont pas cloisonnées par discipline. Socialisation: apprendre à vivre avec les autres (partage, respect, coopération, règles). Bienveillance: environnement affectif sécurisant, relations chaleureuses, routines stables. Respect du rythme: chaque enfant se développe à son rythme; différencier sans comparer. Conséquences pédagogiques. Privilégier le mouvement et le jeu, pas les fiches assises. Varier les activités (calmes ou actives, individuelles ou collectives). Observer chaque enfant pour adapter. Créer un climat de confiance. Exemple concret. Une matinée préscolaire bien structurée alterne accueil, regroupement, ateliers, collation, récréation, repos et activités calmes. Les enfants apprennent en jouant et en manipulant. À retenir. Les principes du préscolaire découlent du développement de l'enfant. Le jeu et l'activité sont les moteurs de l'apprentissage. Erreur fréquente: scolariser trop tôt en imposant des activités formelles."]],"8":[["fr","Leçon 7, Le domaine du langage. Fondements théoriques. Objectifs. Comprendre et s'exprimer oralement. Enrichir le vocabulaire. Développer la conscience phonologique (sons de la langue). Préparer l'entrée dans l'écrit (sans le formaliser trop tôt). Activités. Dialogues, conversations guidées. Comptines, chansons, jeux de doigts. Histoires, contes, lecture d'albums. Jeux de rôle. Description d'images. Jeux de vocabulaire. Rôle de l'enseignant. Parler beaucoup et clairement. Écouter l'enfant. Reformuler, enrichir le vocabulaire. Créer des situations de communication réelles. Valoriser les langues nationales (lingala, kikongo, kiswahili, tshiluba). Exemple concret. Une comptine en lingala accompagne le retour au calme. Les enfants répètent, frappent le rythme, apprennent du vocabulaire et développent leur conscience phonologique en s'amusant. À retenir. Le langage se développe par la parole et l'écoute. Les comptines et histoires sont des supports privilégiés. Erreur fréquente: négliger les langues nationales au préscolaire."]],"9":[["fr","Leçon 8, Le domaine de la motricité. Fondements théoriques. Motricité globale. Courir, sauter, grimper, lancer, ramper. Développe la coordination, l'équilibre, l'endurance. Activités: parcours moteurs, jeux de ballon, rondes. Motricité fine. Pincer, transvaser, découper, enfiler, dessiner. Prépare à l'écriture. Activités: transvasement de graines, enfilage de perles, découpage, modelage. Organisation. Espace sécurisé et délimité. Matériel adapté et varié. Progressivité (du simple au complexe). Surveillance constante. Exemple concret. Un parcours moteur simple (bancs à enjamber, cerceaux à traverser, corde à sauter) développe l'équilibre, la coordination et la confiance en soi. Les enfants s'amusent tout en apprenant. À retenir. Motricité globale: grands mouvements. Motricité fine: mouvements précis. Erreur fréquente: sous-estimer l'importance de la motricité fine pour préparer l'écriture."]],"10":[["fr","Leçon 9, Le domaine des mathématiques. Fondements théoriques. Notions à développer. Quantité: beaucoup ou peu, plus ou moins, autant. Nombre: comptine numérique (1, 2, 3…), correspondance terme à terme. Forme: rond, carré, triangle. Grandeur: grand ou petit, long ou court, lourd ou léger. Espace: sur ou sous, devant ou derrière, à côté, dans. Temps: avant ou après, matin ou soir, hier ou demain. Activités. Comptage d'objets concrets. Tri et classification (par couleur, forme, taille). Puzzles, jeux de construction. Jeux de société simples (dés, cases). Comparaison de quantités. Exemple concret. Tri de boutons par couleur, taille et forme: les enfants apprennent à observer, à classer, à nommer. Ce sont les bases des mathématiques, sans avoir l'air d'une leçon. À retenir. Les mathématiques au préscolaire se construisent par la manipulation. Le jeu est le support privilégié. Erreur fréquente: imposer des exercices écrits avant que l'enfant n'ait compris concrètement."]],"11":[["fr","Leçon 10, Découverte du monde, arts et vie pratique. Fondements théoriques. Découverte du monde. Observer la nature (plantes, animaux, saisons). Expériences simples (eau, air, lumière, dissolution). Sorties dans le quartier, au marché, au jardin. Élevage, jardinage. Arts. Arts plastiques: dessin, peinture, modelage, collage. Musique: chants, comptines, jeux de rythme, fabrication d'instruments. Expression corporelle: mime, danse, jeu dramatique. Vie pratique. Autonomie dans les gestes quotidiens: se laver, s'habiller, manger, ranger. Transvasement, boutonnage, laçage, préparation de la collation. Responsabilisation (rôles tournants dans la classe). Exemple concret. Un atelier de jardinage dans la cour de l'école permet aux enfants d'observer la germination, de prendre soin des plantes, de comprendre le cycle de la vie. C'est à la fois sciences, vie pratique et émerveillement. À retenir. Tous les domaines sont essentiels au développement global. La découverte du monde, les arts et la vie pratique complètent les apprentissages académiques. Erreur fréquente: privilégier le langage et les mathématiques au détriment des autres domaines."]],"12":[["fr","Leçon 11, Aménager l'espace préscolaire. Fondements théoriques. Les coins d'activités. Coin regroupement: causerie, lecture, chants. Coin jeux symboliques: cuisine, poupées, déguisements. Coin construction: blocs, briques, puzzles. Coin arts: peinture, dessin, modelage. Coin manipulation: transvasement, laçage, tri. Coin sciences: plantes, objets à observer. Une classe préscolaire organisée en coins d'activités favorise l'autonomie et l'exploration. Caractéristiques d'un bon espace. Sécurisé: pas de coins dangereux, matériel adapté. Accessible: matériel à hauteur d'enfant, rangement identifiable. Évolutif: aménagement qui évolue selon les projets. Stimulant: couleurs, objets variés, affichages. Matériel de récupération: boîtes, bouchons, tissus, objets naturels. Exemple concret. Dans une école de Matete, une classe maternelle aménage des coins avec des palettes, des bouteilles, des tissus récupérés. Les enfants circulent librement entre les activités, sous la surveillance de l'enseignant. À retenir. L'espace préscolaire doit être organisé en coins d'activités. Il doit être sécurisé, accessible et stimulant. Erreur fréquente: organiser un espace trop statique, inadapté au besoin de mouvement."]],"13":[["fr","Leçon 12, Organiser le temps: routines et emploi du temps. Fondements théoriques. Importance des routines. Les routines sécurisent l'enfant. Elles lui permettent d'anticiper, de se repérer dans le temps, de développer son autonomie. Une journée type. Accueil: arrivée, salutations, jeux libres. Regroupement: causerie, comptines, présentation de la journée. Ateliers: activités dirigées par domaine (langage, motricité, mathématiques, arts…). Collation: moment de socialisation et d'hygiène. Récréation: motricité libre, socialisation. Repos: sieste ou temps calme. Activités calmes: histoires, chants, jeux de doigts. Départ: rangement, retour au calme, salutations. Principes d'organisation. Alterner activités calmes et actives. Prévoir des temps de jeu libre. Respecter les besoins physiologiques (faim, repos, mouvement). Garder une certaine souplesse. Exemple concret. Une matinée préscolaire à Kinshasa peut être organisée ainsi: accueil (30 minutes), regroupement (20 minutes), ateliers (45 minutes), collation (15 minutes), récréation (30 minutes), activités calmes (30 minutes), départ. Cette régularité sécurise les enfants. À retenir. Les routines sécurisent et structurent le temps. Un bon emploi du temps alterne les types d'activités. Erreur fréquente: surcharger la journée, sans temps libre."]],"14":[["fr","Leçon 13, L'évaluation au préscolaire. Fondements théoriques. Principes. Formative: elle vise à aider l'enfant à progresser, pas à le classer. Bienveillante: elle valorise les progrès, ne sanctionne pas. Continue: elle s'appuie sur l'observation quotidienne. Globale: elle prend en compte tous les domaines (moteur, langagier, cognitif, social, affectif). Outils. Grilles d'observation. Cahier de progrès. Portfolio (recueil de réalisations). Photos, dessins, productions diverses. Entretiens avec les parents. Communication aux parents. L'évaluation est partagée lors de rencontres régulières. Elle est formulée de manière positive et constructive, en identifiant les acquis et les besoins. Exemple concret. L'enseignant observe qu'un enfant qui ne parlait pas commence à participer aux comptines. Il le note dans son cahier de progrès et en parle aux parents lors de la réunion trimestrielle. À retenir. L'évaluation préscolaire est formative et descriptive. Elle s'appuie sur l'observation continue. Erreur fréquente: utiliser des notes chiffrées ou des évaluations sommatives."]],"15":[["fr","Leçon 14, Le partenariat avec les familles. Fondements théoriques. Pourquoi travailler avec les familles? La famille est le premier milieu éducatif de l'enfant. La collaboration entre l'école et la famille est essentielle pour le développement harmonieux de l'enfant. Formes de partenariat. Réunions de parents. Entretiens individuels. Cahier de liaison. Participation à des activités (fêtes, sorties, ateliers). Communication régulière sur les progrès. Rôle de la communauté. Les ressources locales (artisans, agriculteurs, artistes) peuvent enrichir les activités préscolaires. Les sorties dans le quartier, au marché, au jardin sont des occasions d'apprentissage. Attitude professionnelle. Écouter les familles. Respecter leurs réalités culturelles et sociales. Créer un climat de confiance. Travailler ensemble pour l'enfant. Exemple concret. Une école maternelle organise une matinée portes ouvertes: les parents participent à un atelier de comptines avec leurs enfants. Ce moment renforce le lien école-famille et valorise les apprentissages. À retenir. Les parents sont des partenaires, pas de simples spectateurs. La communication régulière est la clé. Erreur fréquente: ne solliciter les parents qu'en cas de problème."]],"16":[["fr","Leçon 15, Étude de cas: une classe préscolaire à Kinshasa. Situation. Un élève-maître est affecté dans une classe maternelle de 30 enfants de 4 ans à Kinshasa. La salle est petite, le matériel rare, et plusieurs enfants ne parlent pas français à la maison (lingala, kikongo). Analyse et solutions. Défis. Manque de matériel pédagogique. Diversité linguistique. Classe nombreuse et espace réduit. Attentes des parents parfois centrées sur la lecture et l'écriture. Stratégies. Aménager des coins d'activités avec du matériel de récupération (boîtes, bouchons, tissus, objets naturels). Valoriser les langues nationales dans les comptines et les histoires pour faciliter la transition vers le français. Mettre en place des routines stables et des rôles tournants pour responsabiliser les enfants. Communiquer avec les parents sur les objectifs du préscolaire (développement global, pas scolarisation forcée). Observer chaque enfant et consigner ses progrès dans un cahier. Mise en œuvre. L'élève-maître organise des coins d'activités, met en place des routines stables, utilise des comptines en lingala et en français. Il observe chaque enfant, note ses progrès et en parle aux parents lors des réunions. La classe devient un espace d'apprentissage épanouissant, malgré les contraintes. À retenir. Les contraintes matérielles se surmontent par la créativité. La diversité linguistique est une richesse. Erreur fréquente: vouloir scolariser trop vite le préscolaire pour rassurer les parents."]],"17":[["fr","Évaluation finale, Pédagogie Préscolaire. Évaluation finale. 20 questions à choix multiple. Une seule réponse est correcte par question. Choisis la réponse qui te semble juste, puis valide."]]}};

          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);

    // ====================================================================
    //  Bannière : invitation, confirmations, progression
    // ====================================================================
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer);
      bnMode = mode;
      txtEl.textContent = text;
      actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; }
      else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }

    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }

    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial"
        ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet."
        : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
</html>
