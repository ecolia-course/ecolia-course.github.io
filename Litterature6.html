{
    title: "Leçon 1 — Introduction à la littérature négro-africaine",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>En classe de 4e, ton professeur te demande : « Qu'est-ce que la littérature négro-africaine ? » Tu découvres qu'il s'agit de l'ensemble des œuvres écrites par des auteurs noirs d'Afrique et de la diaspora, exprimant leur culture, leurs luttes et leurs rêves.</p></div>
<h3>1. Définition et origines</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Littérature négro-africaine</strong> : ensemble des œuvres littéraires produites par des auteurs noirs africains et de la diaspora.</li><li><strong>Origines</strong> : naissance avec les premiers textes écrits en français par des auteurs noirs (XVIIIe-XIXe siècles).</li><li><strong>Précurseurs</strong> : Olaudah Equiano, Phillis Wheatley, et en Afrique les premiers écrivains coloniaux.</li><li><strong>Essor</strong> : au XXe siècle, avec la négritude et les indépendances.</li></ul></div>
<h3>2. Les grands courants</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Négritude</strong> (1930-1960) : mouvement de revalorisation de la culture noire (Césaire, Senghor, Damas).</li><li><strong>Littérature de témoignage</strong> : dénonciation de la colonisation et des dictatures.</li><li><strong>Littérature engagée</strong> : l'écrivain prend position sur les problèmes sociaux et politiques.</li><li><strong>Littérature de la diaspora</strong> : œuvres des Afro-Américains, Antillais, Afro-Caribéens.</li></ul></div>
<h3>3. Les fonctions de la littérature négro-africaine</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Fonction identitaire</strong> : affirmer la culture et les valeurs africaines.</li><li><strong>Fonction critique</strong> : dénoncer les injustices, la colonisation, les dictatures.</li><li><strong>Fonction esthétique</strong> : créer une beauté littéraire propre à l'Afrique.</li><li><strong>Fonction éducative</strong> : transmettre les savoirs et les traditions.</li></ul><p><a href="https://www.youtube.com/results?search_query=littérature+négro-africaine+introduction+définition" target="_blank" rel="noopener">🎥 Recherche : introduction à la littérature négro-africaine (chaînes de cours de français)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La littérature négro-africaine regroupe les œuvres des auteurs noirs d'Afrique et de la diaspora. Elle est marquée par la négritude, l'engagement et la quête identitaire.</p></div>
<div class="sources"><strong>Sources :</strong> Programme d'enseignement de la littérature négro-africaine au secondaire (Annexe II, core.ac.uk), items EXETAT.</div>
    `

{
    title: "Leçon 2 — La négritude : Césaire, Senghor, Damas",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un poème de Senghor, tu lis : « Femme nue, femme noire / Vêtue de ta couleur qui est vie ». Ton professeur t'explique qu'il s'agit de la négritude. Qui a inventé ce mot ? Qui l'a théorisé ?</p></div>
<h3>1. Définition de la négritude</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Négritude</strong> : mouvement littéraire et politique des années 1930, fondé à Paris par des étudiants noirs.</li><li><strong>Fondateurs</strong> : Aimé Césaire (Martinique), Léopold Sédar Senghor (Sénégal), Léon-Gontran Damas (Guyane).</li><li><strong>Objectif</strong> : revaloriser la culture noire, dénoncer la colonisation, affirmer l'identité africaine.</li><li><strong>Revue</strong> : <em>L'Étudiant noir</em> (1935), puis <em>Présence africaine</em> (1947).</li></ul></div>
<h3>2. Les trois mousquetaires</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Aimé Césaire</strong> (1913-2008) : inventeur du mot « négritude » dans <em>Cahier d'un retour au pays natal</em> (1939).</li><li><strong>Léopold Sédar Senghor</strong> (1906-2001) : chantre de la négritude, poète et homme d'État sénégalais. <em>Chants d'ombre</em> (1945), <em>Éthiopiques</em> (1956).</li><li><strong>Léon-Gontran Damas</strong> (1912-1978) : troisième fondateur, poète guyanais. <em>Pigments</em> (1937).</li></ul></div>
<h3>3. Citations et extraits</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><blockquote style="border-left:3px solid #999; padding-left:14px; margin:16px 0; font-style:italic; color:#555;">"Ma négritude n'est pas une pierre, sa surdité ruée contre la clameur du jour."<br><strong>— Aimé Césaire, Cahier d'un retour au pays natal, 1939</strong></blockquote><blockquote style="border-left:3px solid #999; padding-left:14px; margin:16px 0; font-style:italic; color:#555;">"Femme nue, femme noire / Vêtue de ta couleur qui est vie, de ta forme qui est beauté !"<br><strong>— Léopold Sédar Senghor, Chants d'ombre, 1945</strong></blockquote><p><a href="https://www.youtube.com/results?search_query=négritude+Césaire+Senghor+Damas+poèmes" target="_blank" rel="noopener">🎥 Recherche : la négritude (chaînes de cours de français)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La négritude est un mouvement fondé par Césaire, Senghor et Damas. Césaire a inventé le mot, Senghor l'a rendu célèbre. Elle revalorise la culture noire et dénonce la colonisation.</p></div>
<div class="sources"><strong>Sources :</strong> Programme d'enseignement de la littérature négro-africaine (core.ac.uk), items EXETAT 2023 (Item 235).</div>
    `
},
{
    title: "Leçon 3 — La littérature congolaise : les pionniers",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À la bibliothèque de Kinshasa, tu découvres le premier roman congolais : « Ngando le crocodile » de Paul Lomami-Tshibamba. Ton professeur te demande de citer les pionniers de la littérature congolaise.</p></div>
<h3>1. Les premiers écrivains congolais</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Badibanga</strong> : premier écrivain congolais reconnu, avec <em>L'éléphant qui marche sur des œufs</em> (1931).</li><li><strong>Antoine-Roger Bolamba</strong> (1913-2002) : journaliste, rédacteur en chef de <em>La voix du congolais</em> (1945-1959). Œuvre : <em>Esanzo : chant pour mon pays</em> (1955).</li><li><strong>Paul Lomami-Tshibamba</strong> (1914-1985) : journaliste, auteur de <em>Ngando le crocodile</em> (1948), premier roman congolais.</li></ul></div>
<h3>2. Les facteurs de naissance</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>La revue « La voix du congolais »</strong> (1945) : organe des services gouvernementaux, animé par Bolamba.</li><li><strong>Les concours littéraires</strong> organisés par les Amis de l'Art indigène.</li><li><strong>La maison d'édition « La bibliothèque de l'étoile »</strong>.</li><li><strong>L'influence de la négritude</strong> et de la littérature française.</li></ul></div>
<h3>3. Extrait de Ngando</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><em>Ngando le crocodile</em> (1948) raconte l'histoire d'un jeune homme qui se transforme en crocodile pour se venger. C'est un récit fantastique ancré dans les croyances congolaises.</p><p><a href="https://www.youtube.com/results?search_query=littérature+congolaise+pionniers+Lomami+Tshibamba+Bolamba" target="_blank" rel="noopener">🎥 Recherche : la littérature congolaise (chaînes de cours de français)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les pionniers de la littérature congolaise sont Badibanga, Bolamba et Lomami-Tshibamba. Le premier roman congolais est <em>Ngando le crocodile</em> (1948).</p></div>
<div class="sources"><strong>Sources :</strong> Fiche Schoolap "Les auteurs congolais", items EXETAT 2023 (Item 242).</div>
    `
},
{
    title: "Leçon 4 — Zamenga Batukezanga et la littérature populaire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une librairie de Kinshasa, tu vois un rayon entier consacré à Zamenga Batukezanga. C'est l'écrivain congolais le plus lu. Pourquoi un tel succès ?</p></div>
<h3>1. Biographie</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Zamenga Batukezanga</strong> (1933-2000) : né à Nkobo (Kongo-Central).</li><li>Écrivain congolais le plus lu et le plus connu.</li><li>Style simple, accessible, ancré dans la vie quotidienne.</li><li>Thèmes : sorcellerie, village, ville, traditions, modernité.</li></ul></div>
<h3>2. Œuvres principales</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><em>Les hauts et les bas</em> (1971, récit).</li><li><em>Souvenir du village</em> (1971, récit).</li><li><em>Bandoki</em> (1972, récit).</li><li><em>Carte postale</em> (1974, récit).</li><li><em>Sept frères et une sœur</em> (1975, récit).</li><li><em>Lettre d'Amérique</em> (1982, essai).</li><li><em>Un croco à Luozi</em> (1982, récit).</li><li><em>Chérie Basso</em> (1983, récit).</li><li><em>Mon mari en grève</em> (1986, récit).</li><li><em>Un boy à Pretoria</em> (1989, récit).</li><li><em>Je ne suis pas un sorcier</em> : lutte contre les superstitions.</li></ul></div>
<h3>3. Pourquoi ce succès ?</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li>Langue simple, phrases courtes.</li><li>Sujets proches du peuple : vie au village, problèmes urbains, sorcellerie.</li><li>Personnages réalistes et attachants.</li><li>Message moral et éducatif.</li></ul><p><a href="https://www.youtube.com/results?search_query=Zamenga+Batukezanga+œuvres+littérature+congolaise" target="_blank" rel="noopener">🎥 Recherche : Zamenga Batukezanga (chaînes de cours de français)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Zamenga Batukezanga est l'écrivain congolais le plus lu. Ses œuvres principales : <em>Bandoki</em>, <em>Carte postale</em>, <em>Je ne suis pas un sorcier</em>. Son style simple et ses thèmes populaires expliquent son succès.</p></div>
<div class="sources"><strong>Sources :</strong> Fiche Schoolap "Les auteurs congolais", items EXETAT 2024 (Item 220).</div>

    title: "Leçon 5 — Les autres grands auteurs congolais",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Au-delà de Zamenga, la littérature congolaise compte de nombreux talents : Mudimbe, Sony Labou Tansi, Mwanza Mujila. Chacun a marqué son époque.</p></div>
<h3>1. V.Y. Mudimbe</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Valentin-Yves Mudimbe</strong> (né en 1941) : philosophe, écrivain, professeur.</li><li><em>Entre les eaux</em> (1973) : roman sur le conflit entre foi et raison.</li><li><em>L'Autre Face du royaume</em> (1973) : essai.</li><li>Thèmes : identité, colonialisme, savoir.</li></ul></div>
<h3>2. Sony Labou Tansi</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Sony Labou Tansi</strong> (1947-1995) : dramaturge et romancier.</li><li><em>La vie et demie</em> (1979) : roman satirique sur la dictature.</li><li><em>L'État honteux</em> (1981) : dénonciation du pouvoir.</li><li>Style : baroque, violent, poétique.</li></ul></div>
<h3>3. Fiston Mwanza Mujila</h3>

function highlightInCurrentSlide(term) {

    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');

    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';
    slideCounterSpan.textContent = '0/0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>

<script>
(function () {
  var SITE = "https://ecolia-course.github.io/";
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface", page servie par https://app.local
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function abs(u) { return /^(https?:|data:|blob:)/i.test(u) ? u : (NATIVE ? SITE + u.replace(/^(\.\/|\/)+/, "") : u); }
  function ext(u) { var m = String(u).split("?")[0].match(/\.(jpe?g|png|gif|webp|svg)$/i); return m ? m[1].toLowerCase() : "jpg"; }
  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {
    if (queued[fn]) return;
    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
    if (!queue.length) { running = false; return; }
    if (!navigator.onLine) { running = false; return; }
    var q = queue.shift(), t0 = Date.now();
    try { CoursInterface.download(q[0], q[1]); } catch (e) { return setTimeout(next, 500); }
    (function wait() {
      var ok = false;
      try { ok = !!CoursInterface.exists(q[1]); } catch (e) {}
      if (ok) setTimeout(next, 1500);
      else if (Date.now() - t0 > 40000) next();
      else setTimeout(wait, 700);
    })();
  }
  function exists(fn) { try { return !!CoursInterface.exists(fn); } catch (e) { return false; } }

  function show(img) {                                    // affiche UNE image (appelé à chaque slide affichée)
    if (!table || img.getAttribute("data-ecolia-done")) return;
    var id = img.getAttribute("data-image-id");
    var url = table[id];
    if (typeof url !== "string" || !url.length) { console.warn("ECOLIA : image absente du JSON :", id); return; }
    img.setAttribute("data-ecolia-done", "1");
    if (!NATIVE) { img.onerror = function () { hide(img); }; img.setAttribute("src", url); return; }
    var full = abs(url), fn = "img_" + id + "." + ext(url);
    if (exists(fn)) {                                     // déjà sur l'appareil : lecture locale, sans internet
      img.onerror = function () {                         // fichier incomplet : on le supprime et on utilise le site
        try { CoursInterface["delete"](fn); } catch (e) {}
        queued[fn] = 0;
        img.onerror = function () { hide(img); };
        img.setAttribute("src", full);
      };
      img.setAttribute("src", "https://app.local/cours/" + fn);
    } else {
      img.onerror = function () { hide(img); };
      img.setAttribute("src", full);
      enqueue(full, fn);
    }
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches("img[data-image-id]")) show(root);
    root.querySelectorAll("img[data-image-id]").forEach(show);
  }
  function prefetchAll() {                                // APK : prépare TOUTES les images du cours pour le hors-ligne
    var ids = {};
    try { JSON.stringify(slides).replace(/data-image-id=\\?"([^"\\]+)/g, function (m, id) { ids[id] = 1; }); } catch (e) {}
    Object.keys(ids).forEach(function (id) {
      var url = table[id];
      if (typeof url !== "string" || !url.length) return;
      var fn = "img_" + id + "." + ext(url);
      if (!exists(fn)) enqueue(abs(url), fn);
    });
  }
  function start(tbl) {
    table = tbl;
    scan(document.body);
    new MutationObserver(function (muts) {                // les slides sont écrites à la volée : on traite chaque nouvelle image
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
    if (NATIVE) prefetchAll();
  }

  var JSON_URL = NATIVE ? SITE + "images_ecolia.json" : "images_ecolia.json";
  var KEY = "ecolia_images_json";
  fetch(JSON_URL, NATIVE ? { cache: "no-cache" } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (table) { if (NATIVE) lsSet(KEY, JSON.stringify(table)); start(table); })
    .catch(function (e) {
      var saved = null;
      if (NATIVE) { try { saved = JSON.parse(lsGet(KEY) || "null"); } catch (x) {} }
      if (saved) start(saved);                              // hors ligne dans l'APK : JSON gardé la dernière fois
      else console.warn("ECOLIA : JSON des images indisponible.", e);
    });
})();
</script>
