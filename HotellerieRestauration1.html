    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');

a répartition annuelle complète n'a pas été lue ligne à ligne. L'adaptation au niveau 12-14 ans simplifie les techniques avancées. Plan d'images du cours. Identifiant. Leçon. Contenu visuel. Utilité. Emplacement. HotellerieRestauration1_L1_01. L1. Organigramme de la brigade de salle. Organisation. Slide 1, bloc théorie. HotellerieRestauration1_L2_01. L2. Schéma d'un couvert dressé. Mise en place. Slide 2, bloc exercice. HotellerieRestauration1_L3_01. L3. Service à table (côté droit, présentation). Techniques. Slide 3, bloc théorie. HotellerieRestauration1_L4_01. L4. Affiche hygiène et sécurité en salle. Prévention. Slide 4, bloc théorie. HotellerieRestauration1_L5_01. L5. Plan de buffet de petit-déjeuner. Organisation. Slide 5, bloc exercice. Identifiants stables et cohérents avec le HTML."]],"2":[["fr","Leçon 1, Le restaurant et son organisation: types et brigade. Situation de départ. Un client entre dans un restaurant et attend longtemps sans être orienté. Personne ne semble savoir qui doit l'accueillir. Comment éviter cette situation? Objectifs spécifiques. Distinguer les types de restaurants (traditionnel, buffet, rapide). Identifier les membres de la brigade de salle et leurs rôles. Comprendre la chaîne cuisine-salle. Explication. Un restaurant fonctionne grâce à une organisation précise. La brigade de salle est structurée: maître d'hôtel: coordonne l'ensemble du service; chef de rang: gère une rangée de tables; serveur: sert les clients; commis: aide le serveur et débarrasse. Chacun connaît son rôle, ce qui évite les erreurs et assure un service fluide. La chaîne cuisine-salle repose sur la communication entre les deux équipes. [ Image HotellerieRestauration1_L1_01: organigramme de la brigade de salle ]. Chaque membre de la brigade a une fonction précise. Notions et définitions. Restaurant: lieu où l'on sert des repas. Brigade de salle: équipe qui assure le service. Maître d'hôtel: responsable de la coordination du service. Chef de rang: responsable d'une rangée de tables. Serveur: personne qui sert les clients. Commis: aide du serveur. Interface cuisine-salle: communication entre la cuisine et la salle. Types de service: à table, buffet, rapide. Exemples concrets. Restaurant traditionnel à Kinshasa. Service buffet dans un hôtel de Lubumbashi pour le petit-déjeuner. Paillote sur les bords du fleuve Congo à Matadi. Exercice d'application. Associe cinq rôles de la brigade à leur mission sur un tableau. Identifie trois types de restaurants dans ton environnement. Décris leur service en une phrase. Corrigé. 1. Maître d'hôtel égale coordination; chef de rang égale rangée de tables; serveur égale service; commis égale aide; plongeur égale vaisselle. 2. Réponse variable selon l'environnement. 3. Exemples: restaurant traditionnel égale service à table; buffet égale le client se sert; rapide égale service au comptoir. À retenir. L'organisation est la clé d'un service réussi. Chaque membre de la brigade a un rôle précis. La communication cuisine-salle est essentielle. Sources utiles. Fiches de Technologie de Restaurant, 1re année (organisation, brigade). Fiches de 2e année (compétences). Limite: l'adaptation en 1re est une simplification."]],"3":[["fr","Leçon 2, La mise en place: dresser une table. Situation de départ. Un serveur dresse une table pour un client qui va manger une soupe, un plat de viande et un dessert. Où placer les couverts? Dans quel ordre? Objectifs spécifiques. Réaliser une mise en place simple. Comprendre l'ordre des couverts. Respecter les règles d'hygiène et de présentation. Explication. La mise en place est le premier contact visuel du client avec le restaurant. Elle suit des règles: les couverts sont placés dans l'ordre d'utilisation (de l'extérieur vers l'intérieur); les verres sont à droite de l'assiette; la serviette est pliée, souvent à gauche ou sur l'assiette. Une table bien dressée inspire confiance et confort. [ Image HotellerieRestauration1_L2_01: schéma d'un couvert dressé ]. La mise en place suit un ordre codifié. Notions et définitions. Mise en place: préparation de la table avant le service. Couvert: ensemble des couverts d'une personne. Fourchette: à gauche de l'assiette. Couteau: à droite, lame vers l'assiette. Cuillère: à droite du couteau. Verre: à droite, au-dessus du couteau. Serviette: à gauche ou sur l'assiette. Ordre des couverts: de l'extérieur vers l'intérieur. Exemples concrets. Mise en place pour un petit-déjeuner à l'hôtel. Dressage pour un repas de fête. Adaptation avec du matériel simple. Exercice d'application. Dresse un couvert simple sur une table ou un schéma. Place assiette, fourchette, couteau, cuillère, verre, serviette. Vérifie l'ordre. Corrigé. On vérifie que: la fourchette est à gauche; le couteau et la cuillère à droite; le verre à droite au-dessus du couteau; la serviette à gauche ou sur l'assiette; l'ordre des couverts respecte l'ordre d'utilisation. À retenir. La mise en place est un langage professionnel. Elle montre le professionnalisme de l'établissement. L'ordre des couverts suit l'ordre des plats. Sources utiles. Fiches de Technologie de Restaurant, 1re année (mise en place, matériel). Limite: l'adaptation en 1re est une simplification."]],"4":[["fr","Leçon 3, Les techniques de base du service à table. Situation de départ. Un serveur apporte le plat et le pose n'importe comment devant le client, en passant par-dessus son épaule. Quelles règles n'a-t-il pas respectées? Objectifs spécifiques. Servir un plat à table. Débarrasser correctement. Comprendre le rythme du service. Explication. Le service à table suit des règles: on sert par la droite du client; on présente l'assiette; on annonce le plat; on débarrasse également par la droite, une fois tous les convives terminés. Le rythme (attente, plat, dessert) doit être respecté pour ne pas presser le client. [ Image HotellerieRestauration1_L3_01: service à table, côté droit et présentation ]. Le service suit une chorégraphie précise. Notions et définitions. Service à table: service au client assis. Service à l'assiette: assiette déjà dressée. Service à la française: plat présenté au client. Débarrassage: retrait des assiettes. Côté de service: à droite du client. Rythme du service: enchaînement des plats. Exemples concrets. Service dans un restaurant de Kinshasa. Service buffet: le client se sert, le serveur débarrasse. Service de boissons. Exercice d'application. Simule un service: un élève joue le client, un autre le serveur. Servez et débarrassez une assiette en respectant les règles. Les observateurs corrigent et proposent des améliorations. Corrigé. On vérifie que: le serveur passe à droite; il présente l'assiette; il annonce le plat; il débarrasse après que tous ont terminé. À retenir. Le service est une chorégraphie. Les gestes sont codifiés pour le confort du client. Le rythme respecte le repas. Sources utiles. Fiches de 2e année (techniques de port, débarrassage). Fiches de 1re année (service de base). Limite: l'adaptation en 1re est une simplification."]],"5":[["fr","Leçon 4, Hygiène, sécurité et posture professionnelle. Situation de départ. Un serveur porte un plateau très chargé en courant dans la salle. Quels risques pour lui et pour les clients? Comment faire autrement? Objectifs spécifiques. Appliquer les règles d'hygiène en salle. Identifier les risques (chute, brûlure, allergie). Adopter une posture professionnelle (discrétion, écoute). Explication. L'hygiène et la sécurité sont essentielles: mains propres, tenue soignée, matériel propre; port de charges équilibré, sans courir; posture professionnelle: discrétion (ne pas divulguer les conversations des clients) et écoute (anticiper les besoins). [ Image HotellerieRestauration1_L4_01: affiche hygiène et sécurité en salle ]. Hygiène et sécurité protègent tout le monde. Notions et définitions. Hygiène en salle: propreté du personnel et du matériel. Tenue professionnelle: vêtement adapté et propre. Port de charge: manière de porter un plateau ou un objet. Prévention des risques: éviter chutes, brûlures, chocs. Discrétion: retenue dans les paroles. Secret professionnel: non-divulgation des informations. Exemples concrets. Service dans un hôtel avec des plateaux lourds. Risque de brûlure avec les plats chauds. Importance de la propreté dans un contexte où l'eau peut manquer. Exercice d'application. Liste cinq règles d'hygiène et cinq règles de sécurité en salle. Simule le port d'un plateau (vide ou léger) en respectant l'équilibre et la marche. Indique deux erreurs à éviter. Corrigé. 1. Hygiène: mains propres, tenue propre, matériel propre, cheveux attachés, ongles courts. Sécurité: ne pas courir, porter équilibré, attention aux plats chauds, ranger les objets au sol, prévenir en cas de danger. 2. On vérifie que le plateau est maintenu à plat, sans course. 3. Erreurs: courir, porter trop lourd d'un côté. À retenir. La sécurité et l'hygiène protègent le client et le professionnel. La posture fait partie du service. La discrétion est une obligation. Sources utiles. Fiches de 1re année (hygiène et sécurité). Fiches de 2e année (posture, présentation). Limite: l'adaptation en 1re est une simplification."]],"6":[["fr","Leçon 5, Le service du petit-déjeuner et du buffet. Situation de départ. Dans un hôtel de Lubumbashi, le petit-déjeuner est servi en buffet. Les clients se plaignent que le pain est froid et que les tables ne sont pas débarrassées. Comment améliorer le service? Objectifs spécifiques. Décrire le service du petit-déjeuner (à table et en buffet). Comprendre l'organisation d'un buffet. Gérer le réassort et la propreté du buffet. Explication. Le petit-déjeuner est un moment stratégique: il donne la première impression de l'hôtel. En buffet, l'organisation doit être pensée: disposition logique des plats; réassort régulier; propreté constante; service à table complémentaire (boissons chaudes, débarrassage). [ Image HotellerieRestauration1_L5_01: plan de buffet de petit-déjeuner ]. Un buffet bien organisé améliore le service. Notions et définitions. Petit-déjeuner à table: service au client assis. Buffet: le client se sert lui-même. Réassort: remplissage des plats vides. Vitrine: présentoir pour les plats. Présentation: disposition esthétique des plats. Propreté du buffet: nettoyage régulier. Gestion des flux: organisation des déplacements des clients. Exemples concrets. Buffet de petit-déjeuner dans un hôtel de Lubumbashi. Service à table dans un petit établissement. Adaptation avec des produits locaux. Exercice d'application. Conçois un plan de buffet simple (disposition des plats, flux des clients). Liste les tâches de réassort et de propreté pour une heure de service. Indique deux améliorations possibles. Corrigé. On vérifie que: le plan est cohérent; les tâches sont listées (réassort, nettoyage, débarrassage); les améliorations sont réalistes (réassort plus fréquent, débarrassage régulier). À retenir. Le petit-déjeuner en buffet exige une organisation rigoureuse. La première impression compte. Le réassort et la propreté sont essentiels. Sources utiles. Fiches de Technologie de Restaurant, 2e année (service du petit-déjeuner, buffet). Limite: l'adaptation en 1re est une simplification."]],"7":[["fr","Évaluation finale, Hôtellerie et Service en salle. Évaluation finale. 36 questions à choix multiple. Une seule réponse est correcte par question. Choisis la réponse qui te semble juste, puis valide."]]}};

            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) {
          try { CoursInterface.delete(nameN(n)); } catch (e) {}
          writeOk(readOk().filter(function (x) { return x !== n; }));
          return Promise.resolve();
        }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }   // ancien contenu invalide
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) {
          return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); })
            .then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; });
        },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);

    // ====================================================================
    //  Bannière : invitation, confirmations, progression
    // ====================================================================
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer);
      bnMode = mode;
      txtEl.textContent = text;
      actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; }
      else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }

    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }

    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial"
        ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet."
        : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
