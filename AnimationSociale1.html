    title: "Leçon 1 — Qu'est-ce que l'animation sociale ? L'animateur et sa posture",
    content: `
        <div class="bloc-cas">
            <h3>Situation de départ</h3>
            <p>Dans un quartier de Kinshasa, deux personnes veulent organiser une réunion sur l'assainissement. La première donne des ordres : « Il faut nettoyer ici, ramasser les déchets là, et c'est comme ça, pas autrement. » La seconde écoute, pose des questions, fait parler les habitants et note leurs propositions.</p>
            <p>Laquelle des deux fait vraiment de l'animation sociale ? Pourquoi ?</p>
        </div>

        <div class="bloc-theorie">
            <h3>Objectifs spécifiques</h3>
            <ul>
                <li>Définir l'animation sociale avec ses propres mots.</li>
                <li>Distinguer animateur, décideur et expert.</li>
                <li>Identifier les qualités d'un bon animateur.</li>
            </ul>

            <h3>Explication</h3>
            <p>L'<strong>animation sociale</strong> est un ensemble de méthodes qui visent à <strong>faire participer activement</strong> les individus et les groupes à leur propre développement. L'animateur n'est pas là pour imposer des idées : il crée les conditions qui permettent aux habitants de s'exprimer, de décider et d'agir ensemble.</p>
            <p>Trois rôles doivent être distingués :</p>
            <ul>
                <li><strong>Le décideur :</strong> prend la décision finale (le chef de quartier, le préfet, le responsable d'association).</li>
                <li><strong>L'expert :</strong> apporte une connaissance technique (l'infirmier, l'ingénieur, l'agronome).</li>
                <li><strong>L'animateur :</strong> facilite la parole, structure les échanges, accompagne le groupe. Il ne décide pas à la place du groupe et ne se substitue pas à l'expert.</li>
            </ul>
            <p>La <strong>posture de l'animateur</strong> repose sur quatre attitudes : l'écoute, la neutralité, le respect et la confidentialité. Sans elles, le groupe se tait, se méfie ou se retire.</p>

            <figure class="bloc-image" data-image-id="AnimationSociale1_L1_01">
                <div class="image-cadre">[ Image AnimationSociale1_L1_01 : comparaison animateur facilitateur / décideur autoritaire ]</div>
                <figcaption>L'animateur fait parler ; le décideur tranche. Les deux rôles ne se confondent pas.</figcaption>
            </figure>

            <h3>Notions et définitions</h3>
            <ul>
                <li><strong>Animation sociale :</strong> méthodes qui encouragent la participation active des personnes et des groupes à leur propre développement.</li>
                <li><strong>Animateur :</strong> facilitateur qui crée les conditions de la participation, sans décider à la place du groupe.</li>
                <li><strong>Décideur :</strong> personne ou instance qui prend la décision finale.</li>
                <li><strong>Expert :</strong> personne qui apporte un savoir technique.</li>
                <li><strong>Posture :</strong> attitude stable adoptée dans l'exercice d'un rôle.</li>
                <li><strong>Reformulation :</strong> redire avec ses propres mots ce qu'une personne a exprimé, sans juger.</li>
            </ul>
        </div>

                <li>Lors d'une campagne de vaccination, l'animateur de quartier n'impose pas : il répond aux questions, écoute les craintes, invite les familles à décider.</li>
                <li>Dans une association de femmes, la facilitatrice organise un tour de table pour que chacune exprime son avis sur le projet de l'année.</li>
                <li>Un animateur formé refuse de révéler devant tous ce qu'une personne lui a confié en privé : il respecte la confidentialité.</li>

                <p><strong>3.</strong> Réponse personnelle : écoute, patience, respect, reformulation, non-jugement sont des réponses attendues.</p>

        <div class="bloc-cas">
            <h3>Situation de départ</h3>
            <p>Lors d'une réunion de parents d'élèves, trois personnes seulement prennent la parole ; les autres restent silencieuses. L'animateur veut que tout le monde s'exprime. Que peut-il faire pour donner la parole à chacun ?</p>

        <div class="bloc-theorie">
            <h3>Objectifs spécifiques</h3>
            <ul>
                <li>Décrire trois techniques d'animation simples.</li>
                <li>Expliquer dans quelles situations les utiliser.</li>
                <li>Savoir lancer et réguler une discussion.</li>
            </ul>

            <h3>Explication</h3>
            <p>Chaque technique a un usage particulier. L'animateur choisit celle qui convient au public, au sujet et au temps disponible.</p>
            <ul>
                <li><strong>Tour de table :</strong> chaque personne s'exprime brièvement, à tour de rôle. Utile quand peu de gens parlent ou quand on veut connaître l'avis de chacun rapidement.</li>
                <li><strong>Brainstorming (remue-méninges) :</strong> production libre d'idées, sans censure, pendant un temps court. Utile pour faire émerger des solutions ou des causes à un problème. Les idées sont ensuite triées et discutées.</li>
                <li><strong>Discussion guidée :</strong> échange structuré par des questions de l'animateur. Utile pour approfondir un point précis, comparer des points de vue.</li>
            </ul>
            <p>Pour que ces techniques fonctionnent, l'animateur :</p>
            <ul>
                <li><strong>reformule</strong> ce que les personnes disent, pour vérifier qu'il a compris ;</li>
                <li><strong>relance</strong> les plus silencieux par une question ouverte ;</li>
                <li><strong>équilibre le temps de parole</strong> en limitant ceux qui monopolisent ;</li>
                <li><strong>rappelle les règles</strong> : on écoute, on ne se moque pas, on ne coupe pas la parole.</li>
            </ul>

            <figure class="bloc-image" data-image-id="AnimationSociale1_L2_01">

            <h3>Notions et définitions</h3>

                <li><strong>Tour de table :</strong> technique qui donne la parole à chacun brièvement.</li>
                <li><strong>Brainstorming :</strong> production libre d'idées, sans censure, avant tri collectif.</li>
                <li><strong>Discussion guidée :</strong> échange structuré par des questions.</li>
                <li><strong>Reformulation :</strong> redire avec ses propres mots pour clarifier et montrer qu'on a compris.</li>
                <li><strong>Relance :</strong> question ou invitation qui pousse une personne à préciser ou à s'exprimer.</li>
                <li><strong>Question ouverte :</strong> question qui ne se répond pas par oui ou non (ex. « Comment voyez-vous la situation ? »).</li>

                <li>Une discussion guidée sur les violences basées sur le genre, structurée par des questions préparées à l'avance.</li>
                <li>Un animateur qui reformule : « Si je comprends bien, tu penses que le problème vient surtout du manque de communication ? »</li>

            <p>Dans un village, les habitants constatent : « Les jeunes quittent le village. » Mais pourquoi ? Et quelles sont les conséquences ? Personne n'est d'accord sur les raisons. Comment y voir plus clair, ensemble, sans se disputer ?</p>

            <p>L'<strong>arbre à problème</strong> est un outil participatif qui aide un groupe à analyser une situation en distinguant :</p>

                <li>les <strong>conséquences</strong> (ce qui résulte du problème) → représentées par les <strong>branches</strong>.</li>
            </ul>
            <p>L'outil évite de traiter seulement les symptômes : en reliant causes et conséquences, il aide le groupe à choisir une action qui agit vraiment sur les causes. Il se construit <strong>collectivement</strong> : chacun propose, l'animateur note sans juger, puis le groupe trie et organise.</p>
            <p>Quand le diagnostic est posé, on peut faire un <strong>arbre à solutions</strong> : à chaque cause correspond une action possible ; à chaque conséquence, un effet attendu.</p>

                <div class="image-cadre">[ Image AnimationSociale1_L3_01 : modèle d'arbre à problème avec racines, tronc, branches ]</div>

            </figure>

            <h3>Notions et définitions</h3>

                <li><strong>Conséquence :</strong> ce qui résulte du problème.</li>

                <li><strong>Arbre à solutions :</strong> prolongement de l'arbre à problème, où chaque cause est reliée à une action possible.</li>

                <li><strong>Conflits fonciers</strong> — problème central : des familles s'opposent pour la terre. Causes : absence de titres, héritage disputé, mauvaise délimitation. Conséquences : violences, perte de récoltes, tensions durables.</li>

                <li><strong>Non-jugement :</strong> accueillir la parole sans condamner la personne.</li>
                <li><strong>Inclusion :</strong> veiller à ce que tous puissent participer (femmes, jeunes, personnes en situation de handicap, minorités).</li>

            <p>S'y ajoute le <strong>consentement</strong> : personne ne doit être forcé à participer ni à parler.</p>

er. L'animateur choisit celle qui convient au public, au sujet et au temps disponible. Tour de table: chaque personne s'exprime brièvement, à tour de rôle. Utile quand peu de gens parlent ou quand on veut connaître l'avis de chacun rapidement. Brainstorming (remue-méninges): production libre d'idées, sans censure, pendant un temps court. Utile pour faire émerger des solutions ou des causes à un problème. Les idées sont ensuite triées et discutées. Discussion guidée: échange structuré par des questions de l'animateur. Utile pour approfondir un point précis, comparer des points de vue. Pour que ces techniques fonctionnent, l'animateur: reformule ce que les personnes disent, pour vérifier qu'il a compris; relance les plus silencieux par une question ouverte; équilibre le temps de parole en limitant ceux qui monopolisent; rappelle les règles: on écoute, on ne se moque pas, on ne coupe pas la parole. [ Image AnimationSociale1_L2_01: fiche outil tour de table ou brainstorming avec usages et étapes ]. Chaque technique a son usage: le tour de table garantit la parole, le brainstorming libère les idées. Notions et définitions. Tour de table: technique qui donne la parole à chacun brièvement. Brainstorming: production libre d'idées, sans censure, avant tri collectif. Discussion guidée: échange structuré par des questions. Reformulation: redire avec ses propres mots pour clarifier et montrer qu'on a compris. Relance: question ou invitation qui pousse une personne à préciser ou à s'exprimer. Question ouverte: question qui ne se répond pas par oui ou non (ex. « Comment voyez-vous la situation? »). Exemples concrets. Un tour de table dans une réunion de parents d'élèves pour recueillir les attentes de chacun avant de décider du budget de l'année. Un brainstorming pour trouver des solutions à un problème d'eau dans une parcelle: on laisse d'abord toutes les idées sortir, puis on les classe. Une discussion guidée sur les violences basées sur le genre, structurée par des questions préparées à l'avance. Un animateur qui reformule: « Si je comprends bien, tu penses que le problème vient surtout du manque de communication? ». Exercice d'application. Choisis un thème simple: « Comment améliorer la propreté de l'école? » Lance un tour de table avec cinq camarades (ou fais semblant). Note l'ordre des prises de parole. Joue le rôle de l'animateur: reformule au moins une idée sans la juger. Indique quelle technique tu utiliserais pour (a) faire émerger des idées, (b) approfondir un point précis, (c) donner la parole à un groupe silencieux. Corrigé. 1. On vérifie que le tour de table respecte l'ordre et que chacun a parlé brièvement. 2. La reformulation doit reprendre l'idée sans ajouter de jugement: « Tu proposes de… », « Ce que tu dis, c'est que… ». 3. (a) brainstorming; (b) discussion guidée; (c) tour de table. À retenir. Les techniques d'animation sont des outils au service de la participation. La reformulation et la relance sont au cœur du rôle de l'animateur. Aucune technique ne remplace l'écoute et le respect. Sources utiles. Manuel de Techniques d'Animation, 1re année Techniques Sociales (R D C, 2025). Fiches pédagogiques, Éducation populaire, 2e année Techniques Sociales (manuels-scolaires-rdc.com, 2025). Limite: ces références ont été consultées partiellement; la sélection pédagogique est une adaptation."]],"4":[["fr","Leçon 3, L'arbre à problème: analyser une situation avec la communauté. Situation de départ. Dans un village, les habitants constatent: « Les jeunes quittent le village. » Mais pourquoi? Et quelles sont les conséquences? Personne n'est d'accord sur les raisons. Comment y voir plus clair, ensemble, sans se disputer? Objectifs spécifiques. Expliquer le principe de l'arbre à problème (causes ou problème central ou conséquences). Construire un arbre simple avec un groupe. Utiliser cet outil pour préparer une action. Explication. L'arbre à problème est un outil participatif qui aide un groupe à analyser une situation en distinguant: les causes (ce qui produit le problème), donc représentées par les racines; le problème central (la situation à analyser), donc représenté par le tronc; les conséquences (ce qui résulte du problème), donc représentées par les branches. L'outil évite de traiter seulement les symptômes: en reliant causes et conséquences, il aide le groupe à choisir une action qui agit vraiment sur les causes. Il se construit collectivement: chacun propose, l'animateur note sans juger, puis le groupe trie et organise. Quand le diagnostic est posé, on peut faire un arbre à solutions: à chaque cause correspond une action possible; à chaque conséquence, un effet attendu. [ Image AnimationSociale1_L3_01: modèle d'arbre à problème avec racines, tronc, branches ]. Racines égale causes; tronc égale problème central; branches égale conséquences. Notions et définitions. Arbre à problème: outil participatif qui distingue causes, problème central et conséquences. Cause: ce qui produit le problème. Conséquence: ce qui résulte du problème. Problème central: formulation claire de la situation à analyser. Arbre à solutions: prolongement de l'arbre à problème, où chaque cause est reliée à une action possible. Diagnostic participatif: analyse construite avec les personnes concernées. Exemples concrets. Échec scolaire, problème central: beaucoup d'élèves abandonnent avant la fin du cycle. Causes: manque de manuels, distance de l'école, travail des enfants. Conséquences: abandon, analphabétisme, difficultés d'insertion. Conflits fonciers, problème central: des familles s'opposent pour la terre. Causes: absence de titres, héritage disputé, mauvaise délimitation. Conséquences: violences, perte de récoltes, tensions durables. Déchets dans le quartier, problème central: les déchets s'accumulent et provoquent des maladies. Causes: absence de points de collecte, manque de sensibilisation. Conséquences: maladies, odeurs, dégradation du cadre de vie. Exercice d'application. Choisis avec ta classe un thème local: déchets, eau, sécurité, échec scolaire. Construis un arbre à problème simple: note au moins 3 causes, le problème central et 2 conséquences. Identifie une cause sur laquelle la classe pourrait agir concrètement. Corrigé. Un corrigé modèle est proposé; toute réponse argumentée est acceptée. Exemple (déchets): problème central: « Les déchets s'accumulent dans le quartier et provoquent des maladies. » Causes: absence de points de collecte, manque de sensibilisation, manque de bacs. Conséquences: maladies, mauvaises odeurs. Cause sur laquelle agir: organiser une journée de sensibilisation et installer deux points de collecte. À retenir. L'arbre à problème est un outil de diagnostic participatif. Il relie causes et conséquences pour mieux cibler l'action. Il se construit avec la communauté, pas à sa place. Sources utiles. Fiches REFLECT (arbre à problème), mojaafrica.net. Documents d'Enabel et du RJP-GL sur l'utilisation de l'arbre à conflit. Limite: ces ressources sont des fiches-outils secondaires, non un programme scolaire officiel."]],"5":[["fr","Leçon 4, Techniques participatives avancées: théâtre-forum, cartographie, images. Situation de départ. Dans un village, les habitants n'osent pas parler des conflits devant tout le monde. Les réunions classiques n'avancent pas. L'animateur propose une autre méthode: jouer une courte scène, puis discuter avec les spectateurs. Pourquoi cela peut-il fonctionner? Objectifs spécifiques. Découvrir le théâtre-forum, la cartographie des acteurs et l'usage d'images. Comprendre leur intérêt pour faire parler un groupe. Savoir choisir une technique selon le public et le sujet. Explication. Certaines situations bloquent la parole: peur de parler devant les chefs, pudeur, conflits non dits. Les techniques participatives avancées permettent de dépasser ces blocages. Théâtre-forum: on joue une scène qui présente un problème réel; quand la scène atteint un point de blocage, le public est invité à intervenir, à remplacer un personnage ou à proposer une autre issue. Le problème est mis à distance, mais le groupe reste impliqué. Cartographie des acteurs: on dessine, avec le groupe, une carte des personnes et organisations concernées par un sujet (qui fait quoi, qui décide, qui influence). Cela clarifie rôles, relations et alliances. Boîte à images: supports visuels (dessins, photos) qui lancent la discussion. Particulièrement utile quand certaines personnes lisent peu ou parlent peu. Jeu de rôle: mise en situation courte pour comprendre un point de vue différent du sien. L'animateur choisit la technique en fonction du public (âge, alphabétisation, habitudes), du sujet (sensible ou non) et du temps disponible. [ Image AnimationSociale1_L4_01: scène de théâtre-forum avec public qui intervient ]. Le théâtre-forum met le problème en scène pour permettre au public d'agir sur la situation. Notions et définitions. Théâtre-forum: mise en scène d'un problème où le public intervient pour proposer des solutions. Cartographie des acteurs: représentation des personnes et groupes concernés par un sujet et de leurs relations. Boîte à images: ensemble de supports visuels pour lancer la discussion. Jeu de rôle: mise en situation où chacun joue un personnage. Blocage de parole: situation où un groupe n'ose pas s'exprimer. Exemples concrets. Le théâtre-forum est utilisé par le RJP-GL dans des zones de conflit pour faire parler autrement des tensions entre groupes. Des boîtes à images servent à sensibiliser aux normes néfastes, en laissant les participants réagir aux dessins. Une cartographie des acteurs est construite pour un projet d'eau: on identifie le comité de gestion, la mairie, les bailleurs, les usagers. Un jeu de rôle aide des élèves à comprendre le point de vue d'un nouvel élève rejeté par le groupe. Exercice d'application. Prépare avec deux ou trois camarades une courte saynète de 2 minutes sur un problème de l'école (moqueries, tricherie, bagarre). Joue la scène devant la classe, puis lance un début de théâtre-forum: demandez à un spectateur de remplacer un personnage et de proposer une autre issue. Indique quelle technique tu choisirais pour un groupe qui lit peu, et pourquoi. Corrigé. 1. On vérifie que la scène montre un problème réel, court, compréhensible. 2. On vérifie que l'animateur accueille la proposition du spectateur sans juger, et que la scène est rejouée avec la nouvelle issue. 3. La boîte à images est indiquée: elle ne dépend pas de la lecture, elle facilite la parole et permet à tous de réagir. À retenir. Ces techniques servent la participation, pas le spectacle. L'animateur adapte l'outil au public et au sujet. Quand la parole est bloquée, changer de technique peut débloquer la situation. Sources utiles. Documents du RJP-GL sur le théâtre-forum et la cartographie des acteurs. Rapports d'Enabel et de Mwanamke Kesho sur les boîtes à images. Limite: ces ressources sont issues de projets de terrain, non d'un programme scolaire officiel."]],"6":[["fr","Leçon 5, Éthique et préparation d'une micro-animation. Situation de départ. Un animateur apprend, lors d'une réunion, qu'une famille du quartier est en conflit. Peut-il en parler aux autres pour « trouver une solution »? Que peut-il dire, et que ne doit-il pas dire? Objectifs spécifiques. Énoncer les principes éthiques de l'animation. Préparer une courte séance d'animation (objectif, technique, matériel, durée). Distinguer ce qui peut être dit de ce qui doit rester confidentiel. Explication. L'animateur est dépositaire de paroles sensibles. Son efficacité ne dépend pas seulement de ses techniques: elle dépend aussi de son éthique. Quatre principes éthiques fondamentaux: Respect: traiter chaque personne avec dignité, sans mépris ni moquerie. Confidentialité: ne pas divulguer ce qui est dit en confiance. Non-jugement: accueillir la parole sans condamner la personne. Inclusion: veiller à ce que tous puissent participer (femmes, jeunes, personnes en situation de handicap, minorités). S'y ajoute le consentement: personne ne doit être forcé à participer ni à parler. Une micro-animation (15 à 20 minutes) se prépare avec cinq éléments: un objectif clair: que doivent retenir les participants? une technique adaptée: tour de table, brainstorming, arbre à problème simplifié…. un matériel simple et disponible: papier, craie, fiches, images. une durée réaliste, découpée en étapes. une évaluation simple: qu'est-ce qui a marché? qu'est-ce qui peut être amélioré? [ Image AnimationSociale1_L5_01: fiche de préparation d'une micro-animation ]. Une animation préparée est plus efficace et plus respectueuse des participants. Notions et définitions. Éthique de l'animation: ensemble des principes qui guident l'action de l'animateur. Confidentialité: obligation de ne pas divulguer les informations confiées. Consentement: accord libre d'une personne pour participer. Non-jugement: accueillir la parole sans condamner. Inclusion: fait de veiller à ce que chacun puisse participer. Micro-animation: courte séance d'animation préparée avec objectif, technique, matériel, durée et évaluation. Exemples concrets. Des animateurs formés par Caritas rappellent que la protection des personnes passe avant tout: on ne révèle pas une situation individuelle en public. Dans une cellule d'écoute, ce qui est dit en confiance reste confidentiel. Dans une réunion de quartier, l'animateur veille à ce que les femmes puissent s'exprimer, même quand les hommes parlent plus fort. Un animateur prépare sa séance avec une fiche: objectif, technique, matériel, durée, évaluation. Exercice d'application. Conçois une fiche de préparation d'une animation de 15 minutes sur un thème de ton choix (propreté, alimentation, respect entre élèves). Indique: objectif, technique, matériel, durée, étapes. Identifie deux principes éthiques que tu devras respecter pendant la séance. Corrigé. Un corrigé modèle est proposé; toute fiche argumentée est acceptée. Exemple (thème: respect entre élèves): objectif égale comprendre l'effet des moqueries. Technique égale tour de table plus discussion guidée. Matériel égale craie, tableau, fiches. Durée égale 15 minutes (3 minutes introduction, 7 minutes tour de table, 3 minutes discussion, 2 minutes synthèse). Principes éthiques égale confidentialité (ne pas nommer d'élève), non-jugement. À retenir. L'efficacité d'une animation repose autant sur la technique que sur l'éthique de l'animateur. Confidentialité, non-jugement, respect et inclusion sont non négociables. Une micro-animation préparée est plus utile et plus respectueuse. Sources utiles. Manuel de Techniques d'Animation, 1re année Techniques Sociales (R D C, 2025). Documents de formation Caritas sur l'éthique de l'animateur. Limite: ces références ont été consultées partiellement; l'adaptation au niveau 12-14 ans est une sélection pédagogique."]],"7":[["fr","Évaluation finale, Animation sociale. Évaluation finale. 36 questions à choix multiple. Une seule réponse est correcte par question. Choisis la réponse qui te semble juste, puis valide."]]}};

        put: function (n) {

          return Promise.resolve();
        }

    function cacheStore() {

            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });

    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
