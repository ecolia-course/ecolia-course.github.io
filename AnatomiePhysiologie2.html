<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi la forme d'un organe est-elle liée à sa fonction ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer anatomie et physiologie. Comprendre le principe structure-fonction. Connaître les niveaux d'organisation et le vocabulaire d'orientation. Prérequis : notions de biologie cellulaire et de chimie.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Anatomie :</strong> étude de la structure du corps humain.</p>
<p><strong>Physiologie :</strong> étude du fonctionnement des organes et des systèmes.</p>
<p><strong>Principe structure-fonction :</strong> la forme d'une structure est liée à sa fonction. Exemple : les villosités intestinales augmentent la surface d'absorption.</p>
<p><strong>Niveaux d'organisation (du plus simple au plus complexe) :</strong></p>
<ul>
<li>Chimique (atomes, molécules).</li>
<li>Cellulaire (cellules).</li>
<li>Tissulaire (tissus : épithélial, conjonctif, musculaire, nerveux).</li>
<li>Organique (organes : estomac, cœur).</li>
<li>Systémique (systèmes : digestif, circulatoire).</li>
<li>Organisme entier.</li>
</ul>
<p><strong>Vocabulaire d'orientation :</strong> antérieur/postérieur, supérieur/inférieur, médian/latéral, proximal/distal.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Anatomie :</strong> étude de la structure. <strong>Physiologie :</strong> étude du fonctionnement. <strong>Tissu :</strong> ensemble de cellules similaires.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Tube digestif :</strong> bouche → œsophage → estomac → intestin grêle → gros intestin → rectum/anus.</p>
<p><strong>Organes annexes :</strong> foie (bile), pancréas (enzymes), glandes salivaires (amylase).</p>
<p><strong>Digestion mécanique :</strong> mastication, péristaltisme (contractions du tube digestif), brassage dans l'estomac.</p>
<p><strong>Digestion chimique :</strong> enzymes qui décomposent les aliments :</p>
<ul>
<li><strong>Amylase salivaire :</strong> commence la digestion de l'amidon.</li>
<li><strong>Pepsine (estomac) :</strong> digère les protéines.</li>
<li><strong>Lipase (pancréas) :</strong> digère les lipides.</li>
</ul>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Enzyme :</strong> protéine qui accélère une réaction chimique. <strong>Péristaltisme :</strong> contraction du tube digestif qui fait avancer les aliments. <strong>Bile :</strong> substance produite par le foie qui facilite la digestion des lipides.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>

</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La digestion est à la fois mécanique et chimique ; chaque organe a une fonction précise.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques d'Anatomie et Physiologie Humaines (Édition 2025).</div>

<p><strong>Rôle du gros intestin :</strong> absorption de l'eau et des sels minéraux ; formation des selles.</p>
<p><strong>Lien avec la santé :</strong> une alimentation déséquilibrée peut conduire à la malnutrition ou à l'obésité.</p>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment l'oxygène et les nutriments arrivent-ils jusqu'aux muscles ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le rôle du cœur. Identifier les vaisseaux. Connaître le sang et la circulation. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>

<p><strong>Vaisseaux sanguins :</strong></p>
<ul>
<li><strong>Artères :</strong> transportent le sang du cœur vers les organes.</li>
<li><strong>Veines :</strong> ramènent le sang des organes vers le cœur.</li>
<li><strong>Capillaires :</strong> lieu des échanges entre le sang et les cellules.</li>
</ul>
<p><strong>Sang :</strong> plasma, globules rouges (transport de l'O₂), globules blancs (défense), plaquettes (coagulation).</p>
<p><strong>Circulation :</strong></p>
<ul>
<li><strong>Pulmonaire :</strong> cœur → poumons → cœur.</li>
<li><strong>Systémique :</strong> cœur → organes → cœur.</li>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Voies respiratoires :</strong> nez → pharynx → larynx → trachée → bronches → bronchioles → alvéoles.</p>
<p><strong>Poumons :</strong> organes spongieux contenant les alvéoles.</p>
<p><strong>Alvéoles :</strong> lieu des échanges gazeux entre l'air et le sang.</p>
<p><strong>Mécanique respiratoire :</strong></p>
<ul>
<li><strong>Inspiration :</strong> active (contraction du diaphragme, des muscles intercostaux).</li>
<li><strong>Expiration :</strong> passive au repos.</li>

<p><strong>Lien avec le métabolisme :</strong> l'O₂ permet la production d'énergie à partir des nutriments.</p>
<p><strong>Facteurs influençant :</strong> effort physique, pollution, altitude, tabagisme.</p>

ellulaire (cellules). Tissulaire (tissus: épithélial, conjonctif, musculaire, nerveux). Organique (organes: estomac, cœur). Systémique (systèmes: digestif, circulatoire). Organisme entier. Vocabulaire d'orientation: antérieur ou postérieur, supérieur ou inférieur, médian ou latéral, proximal ou distal. Définitions. Anatomie: étude de la structure. Physiologie: étude du fonctionnement. Tissu: ensemble de cellules similaires. Méthodes et règles. Toujours relier structure et fonction. Utiliser le vocabulaire d'orientation avec précision. Situer un organe dans un niveau d'organisation. Exemple. Les villosités de l'intestin grêle (structure) augmentent la surface d'absorption (fonction): c'est le principe structure-fonction appliqué à la digestion. Exercices. Ex. 1: Quelle est la différence entre anatomie et physiologie? Ex. 2: Citer deux niveaux d'organisation du corps humain. Corrigé. 1) L'anatomie étudie la structure, la physiologie le fonctionnement. 2) Cellulaire et organique (autres réponses possibles). À retenir. La structure et la fonction sont liées: comprendre l'une aide à comprendre l'autre."]],"3":[["fr","Leçon 2, Le système digestif. Situation. « Que devient un morceau de chikwangue après la mastication? ». Objectifs. Identifier les organes du tube digestif. Comprendre la digestion mécanique et chimique. Décrire le rôle des enzymes. Prérequis: leçon 1. Théorie. Tube digestif: bouche, donc œsophage, donc estomac, donc intestin grêle, donc gros intestin, donc rectum ou anus. Organes annexes: foie (bile), pancréas (enzymes), glandes salivaires (amylase). Digestion mécanique: mastication, péristaltisme (contractions du tube digestif), brassage dans l'estomac. Digestion chimique: enzymes qui décomposent les aliments: Amylase salivaire: commence la digestion de l'amidon. Pepsine (estomac): digère les protéines. Lipase (pancréas): digère les lipides. Définitions. Enzyme: protéine qui accélère une réaction chimique. Péristaltisme: contraction du tube digestif qui fait avancer les aliments. Bile: substance produite par le foie qui facilite la digestion des lipides. Méthodes et règles. Distinguer digestion mécanique et chimique. Associer chaque enzyme à son substrat. Situer les organes sur un schéma. Exemple. La digestion de l'amidon commence dans la bouche avec l'amylase salivaire: un morceau de chikwangue (manioc) commence à être décomposé dès la mastication. Exercices. Ex. 1: Quel organe produit la bile? Ex. 2: Citer deux organes du tube digestif. Corrigé. 1) Le foie. 2) L'estomac et l'intestin grêle (autres réponses possibles). À retenir. La digestion est à la fois mécanique et chimique; chaque organe a une fonction précise."]],"4":[["fr","Leçon 3, L'absorption et le devenir des nutriments. Situation. « Où et comment les nutriments passent-ils dans le sang? ». Objectifs. Comprendre l'absorption intestinale. Identifier le rôle du foie. Relier alimentation et santé. Prérequis: leçons 1 et 2. Théorie. Absorption intestinale: passage des nutriments à travers la paroi de l'intestin grêle grâce aux villosités. Devenir des nutriments: Glucides, donc glucose: énergie. Lipides, donc acides gras et glycérol: réserve énergétique, membranes. Protéines, donc acides aminés: construction des tissus. Rôle du foie: stockage du glycogène, détoxification, production de bile. Rôle du gros intestin: absorption de l'eau et des sels minéraux; formation des selles. Lien avec la santé: une alimentation déséquilibrée peut conduire à la malnutrition ou à l'obésité. Définitions. Absorption: passage des nutriments dans le sang. Villosité: repli de la paroi intestinale. Glycogène: réserve de glucose dans le foie. Méthodes et règles. Associer chaque nutriment à son produit de digestion. Comprendre le rôle central du foie. Discuter des conséquences d'une alimentation déséquilibrée. Exemple. La digestion des lipides de l'huile de palme produit des acides gras absorbés par les villosités intestinales et transportés vers le foie. Exercices. Ex. 1: Quel est le rôle des villosités intestinales? Ex. 2: Citer deux rôles du foie. Corrigé. 1) Augmenter la surface d'absorption des nutriments. 2) Stockage du glycogène et détoxification (autres réponses possibles). À retenir. L'absorption est la porte d'entrée des nutriments dans l'organisme; le foie est le carrefour métabolique."]],"5":[["fr","Leçon 4, Le système circulatoire. Situation. « Comment l'oxygène et les nutriments arrivent-ils jusqu'aux muscles? ». Objectifs. Comprendre le rôle du cœur. Identifier les vaisseaux. Connaître le sang et la circulation. Prérequis: leçons 1 à 3. Théorie. Cœur: pompe musculaire à quatre cavités (deux oreillettes, deux ventricules). Vaisseaux sanguins: Artères: transportent le sang du cœur vers les organes. Veines: ramènent le sang des organes vers le cœur. Capillaires: lieu des échanges entre le sang et les cellules. Sang: plasma, globules rouges (transport de l'O2), globules blancs (défense), plaquettes (coagulation). Circulation: Pulmonaire: cœur, donc poumons, donc cœur. Systémique: cœur, donc organes, donc cœur. Fonctions: transport de l'O2, des nutriments, des déchets (C O2), des hormones, des cellules de défense. Définitions. Artère: vaisseau qui part du cœur. Veine: vaisseau qui revient au cœur. Capillaire: vaisseau fin où se font les échanges. Méthodes et règles. Distinguer artère et veine par leur trajet. Situer les cavités cardiaques. Comprendre les échanges capillaires. Exemple. Le sang transporte le glucose issu de la digestion du manioc jusqu'aux muscles pour produire de l'énergie. Exercices. Ex. 1: Quel est le rôle principal du cœur? Ex. 2: Citer deux fonctions du sang. Corrigé. 1) Pomper le sang dans tout l'organisme. 2) Transport de l'O2 et transport des nutriments (autres réponses possibles). À retenir. La circulation relie tous les systèmes: elle apporte et évacue."]],"6":[["fr","Leçon 5, Le système respiratoire. Situation. « Pourquoi respirons-nous plus vite pendant un effort? ». Objectifs. Identifier les organes respiratoires. Comprendre les échanges gazeux. Relier respiration et métabolisme. Prérequis: leçons 1 à 4. Théorie. Voies respiratoires: nez, donc pharynx, donc larynx, donc trachée, donc bronches, donc bronchioles, donc alvéoles. Poumons: organes spongieux contenant les alvéoles. Alvéoles: lieu des échanges gazeux entre l'air et le sang. Mécanique respiratoire: Inspiration: active (contraction du diaphragme, des muscles intercostaux). Expiration: passive au repos. Échanges gazeux: O2 passe dans le sang; C O2 est éliminé. Lien avec le métabolisme: l'O2 permet la production d'énergie à partir des nutriments. Facteurs influençant: effort physique, pollution, altitude, tabagisme. Définitions. Alvéole: petite poche pulmonaire. Diaphragme: muscle qui sépare le thorax de l'abdomen. Hématose: échange des gaz au niveau des alvéoles. Méthodes et règles. Distinguer ventilation (mécanique) et respiration cellulaire (métabolisme). Situer les alvéoles. Relier respiration et production d'énergie. Exemple. Un effort physique intense augmente la fréquence respiratoire pour apporter plus d'oxygène aux muscles et éliminer le C O2 produit. Exercices. Ex. 1: Où se font les échanges gazeux dans les poumons? Ex. 2: Pourquoi respirons-nous plus vite pendant un effort? Corrigé. 1) Au niveau des alvéoles. 2) Pour apporter plus d'O2 aux muscles et éliminer le C O2 produit. À retenir. La respiration apporte l'oxygène et évacue le C O2: elle est indissociable du métabolisme."]],"7":[["fr","Évaluation finale, Anatomie-Physiologie. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 12 sur 20, tu as réussi."]]}};

          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
