{
    title: "Leçon 1 — Fondements de l'activité physique : santé, sécurité, échauffement",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un élève se blesse-t-il pendant un match alors qu'un autre termine sans problème ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les bienfaits de l'activité physique. Appliquer les règles de sécurité. Structurer une séance d'EPS. Prérequis : habiletés motrices de base, notions de sécurité.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Bienfaits de l'activité physique :</strong></p>
<ul>
<li><strong>Cardio-respiratoire :</strong> renforce le cœur, améliore l'endurance.</li>
<li><strong>Musculaire :</strong> développe la force, la souplesse, la coordination.</li>
<li><strong>Mentale :</strong> réduit le stress, améliore la concentration, favorise le sommeil.</li>
<li><strong>Sociale :</strong> développe la coopération, le respect, la confiance en soi.</li>
</ul>
<p><strong>Structure d'une séance :</strong></p>
<ol>
<li><strong>Échauffement</strong> (5 à 10 min) : prépare le corps à l'effort, augmente la température corporelle, réduit le risque de blessure.</li>
<li><strong>Corps de séance</strong> : activité principale.</li>
<li><strong>Retour au calme</strong> : marche lente, étirements, respiration — favorise la récupération.</li>
</ol>
<p><strong>Règles de sécurité :</strong></p>
<ul>
<li>S'hydrater avant, pendant et après l'effort.</li>
<li>Porter une tenue adaptée (chaussures, vêtements).</li>
<li>Respecter les consignes de l'enseignant.</li>
<li>Signaler toute douleur ou malaise.</li>
<li>Vérifier le terrain (obstacles, trous).</li>
</ul>
<p><strong>Erreurs fréquentes :</strong> sauter l'échauffement ; s'hydrater insuffisamment ; ignorer les signaux de fatigue ou de douleur.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Échauffement :</strong> phase préparatoire à l'effort. <strong>Retour au calme :</strong> phase de récupération après l'effort. <strong>Hydratation :</strong> apport d'eau à l'organisme.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Commencer par des mouvements articulaires, puis des courses légères, puis des étirements dynamiques. Adapter l'intensité progressivement. En cas de douleur vive, arrêter et signaler.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève qui s'échauffe correctement avant un match de football au terrain du quartier réduit le risque de claquage. Après l'effort, une marche lente et des étirements aident à récupérer.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les trois phases d'une séance d'EPS. <strong>Ex. 2 :</strong> Cite deux règles de sécurité.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Échauffement, corps de séance, retour au calme. <strong>2)</strong> S'hydrater, porter une tenue adaptée (autres réponses possibles).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Pas de performance sans sécurité ; l'échauffement et le retour au calme sont obligatoires.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques EPS 2e année (Édition 2025) ; Manuel d'EPS 2e année (Édition 2025).</div>
    `
},
{
    title: "Leçon 2 — Course et saut : athlétisme de base",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certains coureurs démarrent-ils mieux que d'autres ? Comment améliorer un saut en longueur ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Maîtriser les techniques de base de la course et du saut. Comprendre les filières énergétiques. Appliquer les règles de sécurité. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Course de vitesse :</strong></p>
<ul>
<li><strong>Départ :</strong> position basse, réactivité au signal.</li>
<li><strong>Foulée :</strong> poussée complète, regard loin devant, bras en opposition.</li>
<li><strong>Finish :</strong> maintenir l'effort jusqu'à la ligne, sans ralentir avant.</li>
<li>Filière énergétique : anaérobie (effort bref et intense).</li>
</ul>
<p><strong>Course d'endurance :</strong></p>
<ul>
<li>Allure régulière, respiration contrôlée (inspirer par le nez, expirer par la bouche).</li>
<li>Filière énergétique : aérobie (effort prolongé).</li>
</ul>
<p><strong>Saut en longueur :</strong></p>
<ol>
<li><strong>Course d'élan :</strong> progressive, de plus en plus rapide.</li>
<li><strong>Impulsion :</strong> appui fort sur la planche ou la zone d'appel, jambe tendue.</li>
<li><strong>Suspension :</strong> corps groupé puis extension.</li>
<li><strong>Réception :</strong> jambes fléchies, pieds joints, réception sur les deux pieds.</li>
</ol>
<p><strong>Règles de sécurité :</strong> vérifier la piste, la fosse de sable, échauffement complet, ne pas sauter sans élan suffisant, réception jambes fléchies.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Foulée :</strong> enjambée du coureur. <strong>Impulsion :</strong> appui fort qui propulse le corps. <strong>Anaérobie :</strong> effort bref et intense sans oxygène. <strong>Aérobie :</strong> effort prolongé avec oxygène.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Travailler la technique avant la vitesse. Alterner efforts brefs et récupération. Mesurer ses performances et les comparer dans le temps. Respecter les consignes de sécurité.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Sur une piste scolaire en terre battue, un élève travaille le départ de course de vitesse (20 m) et la réception du saut en longueur dans une fosse de sable aménagée. Il note ses performances pour suivre ses progrès.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les phases d'un saut en longueur. <strong>Ex. 2 :</strong> Quelle filière énergétique domine la course de vitesse ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Course d'élan, impulsion, suspension, réception. <strong>2)</strong> Anaérobie.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La technique et la régularité priment sur la force brute.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques EPS 2e année ; extrait du programme EPS 3e/4e années.</div>
    `

    title: "Leçon 3 — Sports collectifs : football et basketball",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une équipe talentueuse perd-elle parfois contre une équipe plus modeste ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les règles fondamentales simplifiées. Maîtriser les gestes techniques de base. Comprendre les principes tactiques élémentaires. Développer le fair-play. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Football — règles essentielles (simplifiées) :</strong></p>
<ul>
<li>But marqué lorsque le ballon franchit entièrement la ligne de but.</li>
<li>Hors-jeu : un attaquant est hors-jeu s'il est plus proche du but adverse que le ballon et l'avant-dernier défenseur au moment de la passe.</li>
<li>Sorties de ballon : touche, corner, six mètres.</li>
<li>Fautes : jeu dangereux, tirage de maillot, main (hors gardien dans sa surface).</li>
</ul>
<p><strong>Football — gestes techniques :</strong> passe courte, contrôle, tir, dribble, jeu de tête.</p>
<p><strong>Basketball — règles essentielles :</strong></p>
<ul>
<li>Marquer en faisant entrer le ballon dans le panier.</li>
<li>Marcher : pas plus de deux appuis avec le ballon en main.</li>
<li>Reprise de dribble interdite.</li>
<li>24 secondes pour tirer.</li>
</ul>
<p><strong>Basketball — gestes techniques :</strong> passe (poitrine, rebond), tir en course, dribble, pivot.</p>
<p><strong>Principes tactiques élémentaires :</strong> se démarquer, occuper l'espace, défendre, communiquer, s'appuyer sur le collectif.</p>
<p><strong>Fair-play :</strong> respecter les règles, l'adversaire et l'arbitre ; accepter la défaite ; ne pas se moquer du perdant ; aider un joueur tombé.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Hors-jeu :</strong> position irrégulière d'un attaquant. <strong>Dribble :</strong> action de progresser avec le ballon en le faisant rebondir (basket) ou en le contrôlant (foot). <strong>Fair-play :</strong> esprit sportif, respect des règles et de l'adversaire.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Travailler d'abord les gestes techniques, puis les appliquer en situation de jeu réduit. Privilégier le collectif. Arbitrer soi-même pour comprendre les règles.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>

<details><summary>Corrigé</summary>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le collectif prime sur l'exploit individuel ; le respect des règles est la base du jeu.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques EPS 2e année ; Manuel d'EPS 2e année.</div>

    title: "Leçon 4 — Gymnastique et expression corporelle",

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment apprendre une roulade sans se blesser ? Pourquoi danser en EPS ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Maîtriser les éléments de base de la gymnastique. Comprendre le rôle de la parade. Explorer l'expression rythmique et les danses traditionnelles. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Éléments gymniques de base :</strong></p>
<ul>
<li><strong>Roulade avant :</strong> du dos rond, menton sur la poitrine, appui des mains, enroulement du dos.</li>
<li><strong>Roulade arrière :</strong> poussée des jambes, mains près des oreilles, enroulement du dos.</li>
<li><strong>Équilibre :</strong> positions stables sur un pied, sur les mains (avec aide), gainage.</li>
<li><strong>Étirements et mobilité :</strong> souplesse articulaire.</li>
</ul>
<p><strong>Parade :</strong> geste d'accompagnement d'un camarade pour éviter une chute ou une blessure. La parade est obligatoire pour les nouveaux éléments.</p>
<p><strong>Expression rythmique et danses traditionnelles :</strong> développent la coordination, la créativité, la mémoire gestuelle et valorisent le patrimoine culturel. Les danses congolaises (Équateur, Kasaï, etc.) sont un support pédagogique riche.</p>
<p><strong>Règles de sécurité :</strong> tapis ou nattes superposées, parade systématique, progressivité des apprentissages, échauffement spécifique du dos et de la nuque.</p>
</div>

  var CFG = {"code":"EducationPhysique2","base":"https://ecolia-course.github.io/ecolia-media/audio_files/","available":[1,2,3,4,5,6,7],"count":7,"sizeMo":8,"sizes":{"1":565056,"2":1348608,"3":1267968,"4":1427904,"5":1240320,"6":1289856,"7":99072},"fallback":{"1":[["fr","Sommaire, Éducation Physique et Sportive. Sommaire. Ce cours d'EPS couvre cinq leçons essentielles: la santé et la sécurité, l'athlétisme (course et saut), les sports collectifs, la gymnastique et l'expression corporelle, et enfin les jeux d'opposition et l'inclusion. Note: il n'existe pas de programme officiel unique et intégral pour l'EPS en tronc commun de 2e année des humanités dans les sources consultées. Ce cours articule les compétences confirmées par les fiches pédagogiques et les manuels disponibles (adaptables au tronc commun) ainsi que les extraits de programme des 3e/4e années. Leçon 1, Fondements de l'activité physique: santé, sécurité, échauffement. Leçon 2, Course et saut: athlétisme de base. Leçon 3, Sports collectifs: football et basketball. Leçon 4, Gymnastique et expression corporelle. Leçon 5, Jeux d'opposition et inclusion. Une évaluation finale de 20 questions couvre l'ensemble des leçons."]],"2":[["fr","Leçon 1, Fondements de l'activité physique: santé, sécurité, échauffement. Situation. « Pourquoi un élève se blesse-t-il pendant un match alors qu'un autre termine sans problème? ». Objectifs. Comprendre les bienfaits de l'activité physique. Appliquer les règles de sécurité. Structurer une séance d'EPS. Prérequis: habiletés motrices de base, notions de sécurité. Théorie. Bienfaits de l'activité physique: Cardio-respiratoire: renforce le cœur, améliore l'endurance. Musculaire: développe la force, la souplesse, la coordination. Mentale: réduit le stress, améliore la concentration, favorise le sommeil. Sociale: développe la coopération, le respect, la confiance en soi. Structure d'une séance: Échauffement (5 à 10 minutes): prépare le corps à l'effort, augmente la température corporelle, réduit le risque de blessure. Corps de séance: activité principale. Retour au calme: marche lente, étirements, respiration, favorise la récupération. Règles de sécurité: S'hydrater avant, pendant et après l'effort. Porter une tenue adaptée (chaussures, vêtements). Respecter les consignes de l'enseignant. Signaler toute douleur ou malaise. Vérifier le terrain (obstacles, trous). Erreurs fréquentes: sauter l'échauffement; s'hydrater insuffisamment; ignorer les signaux de fatigue ou de douleur. Définitions. Échauffement: phase préparatoire à l'effort. Retour au calme: phase de récupération après l'effort. Hydratation: apport d'eau à l'organisme. Méthodes et règles. Commencer par des mouvements articulaires, puis des courses légères, puis des étirements dynamiques. Adapter l'intensité progressivement. En cas de douleur vive, arrêter et signaler. Exemple. Un élève qui s'échauffe correctement avant un match de football au terrain du quartier réduit le risque de claquage. Après l'effort, une marche lente et des étirements aident à récupérer. Exercices. Ex. 1: Cite les trois phases d'une séance d'EPS. Ex. 2: Cite deux règles de sécurité. Corrigé. 1) Échauffement, corps de séance, retour au calme. 2) S'hydrater, porter une tenue adaptée (autres réponses possibles). À retenir. Pas de performance sans sécurité; l'échauffement et le retour au calme sont obligatoires."]],"3":[["fr","Leçon 2, Course et saut: athlétisme de base. Situation. « Pourquoi certains coureurs démarrent-ils mieux que d'autres? Comment améliorer un saut en longueur? ». Objectifs. Maîtriser les techniques de base de la course et du saut. Comprendre les filières énergétiques. Appliquer les règles de sécurité. Prérequis: leçon 1. Théorie. Course de vitesse: Départ: position basse, réactivité au signal. Foulée: poussée complète, regard loin devant, bras en opposition. Finish: maintenir l'effort jusqu'à la ligne, sans ralentir avant. Filière énergétique: anaérobie (effort bref et intense). Course d'endurance: Allure régulière, respiration contrôlée (inspirer par le nez, expirer par la bouche). Filière énergétique: aérobie (effort prolongé). Saut en longueur: Course d'élan: progressive, de plus en plus rapide. Impulsion: appui fort sur la planche ou la zone d'appel, jambe tendue. Suspension: corps groupé puis extension. Réception: jambes fléchies, pieds joints, réception sur les deux pieds. Règles de sécurité: vérifier la piste, la fosse de sable, échauffement complet, ne pas sauter sans élan suffisant, réception jambes fléchies. Définitions. Foulée: enjambée du coureur. Impulsion: appui fort qui propulse le corps. Anaérobie: effort bref et intense sans oxygène. Aérobie: effort prolongé avec oxygène. Méthodes et règles. Travailler la technique avant la vitesse. Alterner efforts brefs et récupération. Mesurer ses performances et les comparer dans le temps. Respecter les consignes de sécurité. Exemple. Sur une piste scolaire en terre battue, un élève travaille le départ de course de vitesse (20 mètres) et la réception du saut en longueur dans une fosse de sable aménagée. Il note ses performances pour suivre ses progrès. Exercices. Ex. 1: Cite les phases d'un saut en longueur. Ex. 2: Quelle filière énergétique domine la course de vitesse? Corrigé. 1) Course d'élan, impulsion, suspension, réception. 2) Anaérobie. À retenir. La technique et la régularité priment sur la force brute."]],"4":[["fr","Leçon 3, Sports collectifs: football et basketball. Situation. « Pourquoi une équipe talentueuse perd-elle parfois contre une équipe plus modeste? ». Objectifs. Connaître les règles fondamentales simplifiées. Maîtriser les gestes techniques de base. Comprendre les principes tactiques élémentaires. Développer le fair-play. Prérequis: leçons 1 et 2. Théorie. Football, règles essentielles (simplifiées): But marqué lorsque le ballon franchit entièrement la ligne de but. Hors-jeu: un attaquant est hors-jeu s'il est plus proche du but adverse que le ballon et l'avant-dernier défenseur au moment de la passe. Sorties de ballon: touche, corner, six mètres. Fautes: jeu dangereux, tirage de maillot, main (hors gardien dans sa surface). Football, gestes techniques: passe courte, contrôle, tir, dribble, jeu de tête. Basketball, règles essentielles: Marquer en faisant entrer le ballon dans le panier. Marcher: pas plus de deux appuis avec le ballon en main. Reprise de dribble interdite. 24 secondes pour tirer. Basketball, gestes techniques: passe (poitrine, rebond), tir en course, dribble, pivot. Principes tactiques élémentaires: se démarquer, occuper l'espace, défendre, communiquer, s'appuyer sur le collectif. Fair-play: respecter les règles, l'adversaire et l'arbitre; accepter la défaite; ne pas se moquer du perdant; aider un joueur tombé. Définitions. Hors-jeu: position irrégulière d'un attaquant. Dribble: action de progresser avec le ballon en le faisant rebondir (basket) ou en le contrôlant (foot). Fair-play: esprit sportif, respect des règles et de l'adversaire. Méthodes et règles. Travailler d'abord les gestes techniques, puis les appliquer en situation de jeu réduit. Privilégier le collectif. Arbitrer soi-même pour comprendre les règles. Exemple. Un match à effectif réduit (5 contre 5) sur un terrain de quartier, avec arbitrage par les élèves eux-mêmes, pour apprendre à appliquer les règles et à gérer les conflits. Exercices. Ex. 1: Cite trois gestes techniques du football. Ex. 2: Cite deux comportements de fair-play. Corrigé. 1) Passe, tir, dribble (autres réponses possibles). 2) Respecter l'adversaire, accepter la défaite (autres réponses possibles). À retenir. Le collectif prime sur l'exploit individuel; le respect des règles est la base du jeu."]],"5":[["fr","Leçon 4, Gymnastique et expression corporelle. Situation. « Comment apprendre une roulade sans se blesser? Pourquoi danser en EPS? ». Objectifs. Maîtriser les éléments de base de la gymnastique. Comprendre le rôle de la parade. Explorer l'expression rythmique et les danses traditionnelles. Prérequis: leçons 1 à 3. Théorie. Éléments gymniques de base: Roulade avant: du dos rond, menton sur la poitrine, appui des mains, enroulement du dos. Roulade arrière: poussée des jambes, mains près des oreilles, enroulement du dos. Équilibre: positions stables sur un pied, sur les mains (avec aide), gainage. Étirements et mobilité: souplesse articulaire. Parade: geste d'accompagnement d'un camarade pour éviter une chute ou une blessure. La parade est obligatoire pour les nouveaux éléments. Expression rythmique et danses traditionnelles: développent la coordination, la créativité, la mémoire gestuelle et valorisent le patrimoine culturel. Les danses congolaises (Équateur, Kasaï, etc.) sont un support pédagogique riche. Règles de sécurité: tapis ou nattes superposées, parade systématique, progressivité des apprentissages, échauffement spécifique du dos et de la nuque. Définitions. Parade: geste d'accompagnement pour sécuriser. Équilibre: capacité à maintenir une position stable. Gainage: contraction des muscles profonds pour stabiliser le corps. Méthodes et règles. Progresser étape par étape. Toujours parader un camarade. Ne jamais forcer un étirement. Terminer par un enchaînement fluide de trois éléments. Exemple. Apprendre une roulade avant sur un tapis improvisé (nattes superposées) avec parade d'un camarade, puis intégrer un enchaînement de trois éléments dans une courte chorégraphie inspirée d'une danse de l'Équateur. Exercices. Ex. 1: Quel est le rôle de la parade? Ex. 2: Cite deux règles de sécurité en gymnastique. Corrigé. 1) Sécuriser le camarade et éviter les blessures. 2) Utiliser un tapis, parader systématiquement (autres réponses possibles). À retenir. La sécurité et la progressivité sont les maîtres-mots de la gymnastique."]],"6":[["fr","Leçon 5, Jeux d'opposition et inclusion. Situation. « Comment s'opposer à un adversaire sans lui faire mal? Comment inclure un élève blessé dans un jeu? ». Objectifs. Comprendre les jeux d'opposition. Appliquer les règles de sécurité. Favoriser l'inclusion. Gérer les émotions (victoire ou défaite). Prérequis: leçons 1 à 4. Théorie. Jeux d'opposition: jeux de lutte simplifiés (tirer, pousser, déséquilibrer), tir à la corde, jeux de conquête d'objet. Ils apprennent à: Gérer le contact physique. Respecter l'autre et ses limites. Contrôler ses émotions (colère, peur, joie). Utiliser la technique plutôt que la force brute. Règles de sécurité: binômes de poids et de niveau similaires, surface souple, interdiction des coups, arrêt immédiat au signal, respect strict des consignes. Inclusion: adapter l'activité pour que tous les élèves participent, quel que soit leur niveau, leur sexe, leur condition physique. Exemples: rôle d'arbitre, de stratège, de chronométreur pour un élève blessé; adaptation des règles; mixité dans les équipes. Gestion des émotions: accepter la défaite avec humilité, savourer la victoire avec fair-play, ne pas se moquer du perdant. Définitions. Jeu d'opposition: jeu où deux adversaires ou équipes s'affrontent avec contact contrôlé. Inclusion: adaptation pour que tous participent. Fair-play: respect et loyauté dans le jeu. Méthodes et règles. Former des binômes équilibrés. Rappeler les règles de sécurité avant chaque jeu. Adapter les consignes à chaque élève. Terminer par un débat sur le ressenti et le respect. Exemple. Un tournoi de tir à la corde par équipes mixtes, avec adaptation des règles pour inclure un élève à mobilité réduite (par exemple, en tant que stratège ou arbitre). Exercices. Ex. 1: Cite deux règles de sécurité dans les jeux d'opposition. Ex. 2: Propose une adaptation pour inclure un élève blessé dans un jeu collectif. Corrigé. 1) Binômes de poids similaires, arrêt au signal (autres réponses possibles). 2) Lui confier un rôle d'arbitre, de chronométreur ou de stratège. À retenir. L'opposition est un apprentissage du respect et du contrôle de soi."]],"7":[["fr","Évaluation finale, Éducation Physique et Sportive. Évaluation. Choisis la bonne réponse.           var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
