<li>Leçon 1 — Définition et finalités de l'animation sociale</li>
<li>Leçon 2 — Le rôle et les qualités de l'animateur</li>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une communauté qui reçoit une animation peut-elle agir, alors qu'elle attendait tout de l'extérieur ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir l'animation sociale. Identifier ses finalités. La distinguer de l'assistanat et du divertissement. Prérequis : notions de développement communautaire.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Animation sociale :</strong> ensemble des actions visant à susciter la participation, la prise de parole et l'action collective.</p>
<p><strong>Finalités :</strong></p>
<ul>
<li><strong>Émancipation :</strong> rendre les personnes actrices.</li>
<li><strong>Participation :</strong> faire entendre toutes les voix.</li>
<li><strong>Lien social :</strong> renforcer la solidarité.</li>
<li><strong>Changement :</strong> transformer les situations.</li>
</ul>
<p><strong>Distinction :</strong> l'assistanat fait à la place ; le divertissement occupe ; l'animation fait faire et fait grandir.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Animation sociale :</strong> démarche participative. <strong>Émancipation :</strong> capacité à agir par soi-même. <strong>Assistanat :</strong> aide qui rend dépendant.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Distinguer animation et assistanat. Identifier les finalités dans un exemple. Comprendre le rôle de la participation.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une animatrice d'un centre social à Kinshasa organise un atelier où les mères discutent de la nutrition de leurs enfants et proposent elles-mêmes des solutions adaptées à leur quartier.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qu'est-ce que l'animation sociale ? <strong>Ex. 2 :</strong> Citer deux finalités.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Une démarche qui suscite la participation et l'action collective. <strong>2)</strong> Émancipation et lien social (autres réponses possibles).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Animer, c'est faire émerger la parole et l'action des participants.</p></div>

<div class="sources"><strong>Sources :</strong> Référentiels UNESCO ; ressources pédagogiques RDC.</div>
    `

{
    title: "Leçon 2 — Le rôle et les qualités de l'animateur",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un animateur qui parle plus que les participants n'anime-t-il pas vraiment ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les rôles de l'animateur. Connaître ses qualités. Comprendre ses limites. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Rôles :</strong> facilitateur, médiateur, accompagnateur.</p>
<p><strong>Qualités :</strong></p>
<ul>
<li>Écoute.</li>
<li>Empathie.</li>
<li>Neutralité.</li>
<li>Patience.</li>
<li>Créativité.</li>
</ul>
<p><strong>Limites :</strong> ne pas se substituer aux participants, ne pas juger, ne pas imposer son opinion.</p>
<p><strong>Éthique :</strong> respect, confidentialité, non-jugement.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Facilitateur :</strong> celui qui facilite la parole. <strong>Neutralité :</strong> ne pas prendre parti. <strong>Confidentialité :</strong> ne pas divulguer.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Écouter avant de parler. Ne pas juger. Rester neutre. Respecter la parole de chacun.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Dans un quartier de Lubumbashi, un animateur de jeunes facilite un débat sur l'usage des réseaux sociaux sans imposer son opinion, en veillant à ce que chacun puisse s'exprimer.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelles sont les qualités d'un bon animateur ? <strong>Ex. 2 :</strong> Citer deux limites du rôle de l'animateur.</p>
<details><summary>Corrigé</summary>

</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'animateur facilite, il ne dirige pas.</p></div>

<div class="sources"><strong>Sources :</strong> Référentiels UNESCO.</div>
    `

{
    title: "Leçon 3 — Les techniques d'animation de groupe",

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les techniques. Choisir la technique adaptée. Gérer la parole et le temps. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Techniques :</strong></p>
<ul>
<li><strong>Réunion :</strong> structurer une décision collective.</li>

<li><strong>Jeu de rôle :</strong> simuler une situation.</li>
<li><strong>Brainstorming :</strong> produire des idées.</li>
<li><strong>Petits groupes :</strong> favoriser la participation.</li>

<p><strong>Gestion :</strong> temps, parole, participation de tous.</p>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La technique est un outil au service de l'objectif, pas une fin en soi.</p></div>

<div class="sources"><strong>Sources :</strong> Référentiels UNESCO ; ressources pédagogiques RDC.</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une animation non préparée échoue-t-elle presque toujours ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Élaborer une fiche d'animation. Adapter au public. Préparer le matériel et l'espace. Prérequis : leçons 1 à 3.</p></div>

<script>
(function () {
  var CFG = {"code":"AnimationSociale2","base":"https://ecolia-course.github.io/ecolia-media/audio_files/","available":[1,2,3,4,5,6,7],"count":7,"sizeMo":5,"sizes":{"1":606336,"2":930624,"3":814080,"4":786816,"5":801216,"6":764736,"7":93312},"fallback":{"1":[["fr","Sommaire, Animation Sociale. Sommaire. Ce cours d'animation sociale couvre cinq leçons essentielles: la définition et les finalités de l'animation, le rôle et les qualités de l'animateur, les techniques d'animation de groupe, la conception d'une activité, et l'évaluation d'une animation. Note: le programme officiel R D C spécifique à l'Animation Sociale pour la 2e année des humanités sociales n'a pas été retrouvé dans son intégralité. La progression est une proposition pédagogique fondée sur les principes de l'animation socioculturelle (UNESCO, OIT) et sur les ressources pédagogiques disponibles, adaptée à un niveau de 4e secondaire. Elle doit être validée par un enseignant de la filière sociale avant diffusion. Leçon 1, Définition et finalités de l'animation sociale. Leçon 2, Le rôle et les qualités de l'animateur. Leçon 3, Les techniques d'animation de groupe. Leçon 4, Concevoir une activité d'animation. Leçon 5, Évaluer une activité d'animation. Une évaluation finale de 20 questions couvre l'ensemble des leçons."]],"2":[["fr","Leçon 1, Définition et finalités de l'animation sociale. Situation. « Pourquoi une communauté qui reçoit une animation peut-elle agir, alors qu'elle attendait tout de l'extérieur? ». Objectifs. Définir l'animation sociale. Identifier ses finalités. La distinguer de l'assistanat et du divertissement. Prérequis: notions de développement communautaire. Théorie. Animation sociale: ensemble des actions visant à susciter la participation, la prise de parole et l'action collective. Finalités: Émancipation: rendre les personnes actrices. Participation: faire entendre toutes les voix. Lien social: renforcer la solidarité. Changement: transformer les situations. Distinction: l'assistanat fait à la place; le divertissement occupe; l'animation fait faire et fait grandir. Définitions. Animation sociale: démarche participative. Émancipation: capacité à agir par soi-même. Assistanat: aide qui rend dépendant. Méthodes et règles. Distinguer animation et assistanat. Identifier les finalités dans un exemple. Comprendre le rôle de la participation. Exemple. Une animatrice d'un centre social à Kinshasa organise un atelier où les mères discutent de la nutrition de leurs enfants et proposent elles-mêmes des solutions adaptées à leur quartier. Exercices. Ex. 1: Qu'est-ce que l'animation sociale? Ex. 2: Citer deux finalités. Corrigé. 1) Une démarche qui suscite la participation et l'action collective. 2) Émancipation et lien social (autres réponses possibles). À retenir. Animer, c'est faire émerger la parole et l'action des participants."]],"3":[["fr","Leçon 2, Le rôle et les qualités de l'animateur. Situation. « Pourquoi un animateur qui parle plus que les participants n'anime-t-il pas vraiment? ». Objectifs. Identifier les rôles de l'animateur. Connaître ses qualités. Comprendre ses limites. Prérequis: leçon 1. Théorie. Rôles: facilitateur, médiateur, accompagnateur. Qualités: Écoute. Empathie. Neutralité. Patience. Créativité. Limites: ne pas se substituer aux participants, ne pas juger, ne pas imposer son opinion. Éthique: respect, confidentialité, non-jugement. Définitions. Facilitateur: celui qui facilite la parole. Neutralité: ne pas prendre parti. Confidentialité: ne pas divulguer. Méthodes et règles. Écouter avant de parler. Ne pas juger. Rester neutre. Respecter la parole de chacun. Exemple. Dans un quartier de Lubumbashi, un animateur de jeunes facilite un débat sur l'usage des réseaux sociaux sans imposer son opinion, en veillant à ce que chacun puisse s'exprimer. Exercices. Ex. 1: Quelles sont les qualités d'un bon animateur? Ex. 2: Citer deux limites du rôle de l'animateur. Corrigé. 1) Écoute, empathie, neutralité (autres réponses possibles). 2) Ne pas se substituer aux participants; ne pas juger. À retenir. L'animateur facilite, il ne dirige pas."]],"4":[["fr","Leçon 3, Les techniques d'animation de groupe. Situation. « Pourquoi le choix de la technique dépend-il de l'objectif et du public? ». Objectifs. Connaître les techniques. Choisir la technique adaptée. Gérer la parole et le temps. Prérequis: leçons 1 et 2. Théorie. Techniques: Réunion: structurer une décision collective. Causerie: sensibiliser de manière informelle. Jeu de rôle: simuler une situation. Brainstorming: produire des idées. Petits groupes: favoriser la participation. Gestion: temps, parole, participation de tous. Définitions. Causerie: échange informel structuré. Jeu de rôle: simulation. Brainstorming: production collective d'idées. Méthodes et règles. Choisir la technique selon l'objectif. Préparer. Faire participer tous les membres. Exemple. Dans un centre de santé de Goma, une causerie sur l'hygiène des mains est animée avec des mères, suivie d'un jeu de rôle montrant le lavage correct. Exercices. Ex. 1: Quelles sont les principales techniques? Ex. 2: Pourquoi choisir la technique selon l'objectif? Corrigé. 1) Réunion, causerie, jeu de rôle, brainstorming, petits groupes. 2) Parce que chaque technique sert un but précis. À retenir. La technique est un outil au service de l'objectif, pas une fin en soi."]],"5":[["fr","Leçon 4, Concevoir une activité d'animation. Situation. « Pourquoi une animation non préparée échoue-t-elle presque toujours? ». Objectifs. Élaborer une fiche d'animation. Adapter au public. Préparer le matériel et l'espace. Prérequis: leçons 1 à 3. Théorie. Fiche d'animation: Objectifs. Public. Durée. Matériel. Déroulement. Évaluation. Adaptation: âge, culture, niveau, langue. Espace: disposition, matériel accessible, sécurité. Définitions. Fiche d'animation: document de préparation. Adaptation: ajustement au public. Méthodes et règles. Définir des objectifs clairs. Préparer le matériel. Adapter au public. Prévoir une durée réaliste. Exemple. Une fiche d'animation pour un atelier sur la gestion des déchets dans une école primaire: objectifs, public (élèves de 5e), matériel (affiches, boîtes), déroulement (jeu, discussion, engagement). Exercices. Ex. 1: Que contient une fiche d'animation? Ex. 2: Pourquoi adapter l'animation au public? Corrigé. 1) Objectifs, public, durée, matériel, déroulement, évaluation. 2) Parce que chaque public a des besoins et des attentes spécifiques. À retenir. Une animation réussie se prépare sur une fiche."]],"6":[["fr","Leçon 5, Évaluer une activité d'animation. Situation. « Pourquoi une animation peut-elle être réussie sans que l'on sache pourquoi? ». Objectifs. Connaître les types d'évaluation. Choisir des indicateurs. Ajuster sa pratique. Prérequis: leçons 1 à 4. Théorie. Types d'évaluation: Participative: associer les participants. Formative: pendant l'animation. Finale: après l'animation. Indicateurs: participation, satisfaction, changement de comportement. Techniques: retour verbal, questionnaire simple, observation. Définitions. Évaluation: mesure des résultats. Indicateur: signe mesurable. Ajustement: modification de la pratique. Méthodes et règles. Choisir des indicateurs simples. Écouter le retour des participants. Ajuster sa pratique. Exemple. Après un atelier sur l'hygiène, l'animatrice observe une augmentation du lavage des mains chez les enfants: c'est un indicateur de changement de comportement. Exercices. Ex. 1: Quels sont les types d'évaluation? Ex. 2: Citer deux indicateurs d'une animation réussie. Corrigé. 1) Participative, formative, finale. 2) Participation et satisfaction (autres réponses possibles). À retenir. Évaluer, c'est apprendre pour mieux animer la prochaine fois."]],"7":[["fr","Évaluation finale, Animation Sociale. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 12 sur 20, tu as réussi."]]}};

  var PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  var PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
  var DL = '<svg viewBox="0 0 24 24"><path d="M11 3h2v9.2l3.6-3.6L18 10l-6 6-6-6 1.4-1.4L11 12.2V3zM5 19h14v2H5z"/></svg>';
  var OK = '<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';
  // Réparation du quiz : certains cours stockent les choix sous "opts" (ou autre) au lieu de "options"
  try {
    if (typeof questions !== "undefined" && questions && questions.forEach) {
      questions.forEach(function (q) {
        if (!q.options) q.options = q.opts || q.choices || q.choix || q.reponses || q.propositions || [];
        if (q.text === undefined) q.text = q.question || q.q || q.enonce || q.titre || "";
        if (typeof q.correct === "undefined") {
          if (typeof q.answer !== "undefined") q.correct = q.answer;
          else if (typeof q.reponse !== "undefined") q.correct = q.reponse;
        }
      });
    }
  } catch (e) {}
  var synth = window.speechSynthesis || null;
  var HAS_CACHE = !!(window.caches && window.caches.open);
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface" (fichiers dans le dossier de l'application)
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  var LATER = "ecolia_audio_later_" + CFG.code;
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function init() {
    if (document.getElementById("ecolia-audio-btn")) return;

    // ---------- éléments de l'interface ----------
    var btn = document.createElement("button");
    btn.id = "ecolia-audio-btn"; btn.type = "button"; btn.className = "ecolia-off";
    btn.setAttribute("aria-label", "Écouter la leçon"); btn.innerHTML = PLAY;
    var dlBtn = document.createElement("button");
    dlBtn.id = "ecolia-dl-btn"; dlBtn.type = "button"; dlBtn.className = "ecolia-off";
    dlBtn.innerHTML = DL;
    var host = document.querySelector(".header-right");
    if (host) { host.insertBefore(dlBtn, host.firstChild); host.insertBefore(btn, dlBtn); }   // dans la barre du haut : ne scrolle jamais
    else { btn.className += " ecolia-fixed"; document.body.appendChild(btn); }

    var banner = document.createElement("div");
    banner.id = "ecolia-audio-banner";
    banner.innerHTML = '<span class="eab-txt"></span><span class="eab-act"></span><div class="eab-bar"><i></i></div>';
    var content = document.getElementById("content");
    if (content && content.parentNode) content.parentNode.insertBefore(banner, content);
    else document.body.insertBefore(banner, document.body.firstChild);
    var txtEl = banner.querySelector(".eab-txt"), actEl = banner.querySelector(".eab-act");
    var barEl = banner.querySelector(".eab-bar"), barI = barEl.firstChild;

    var audio = new Audio();            // un seul élément Audio, réutilisé (exigé par les navigateurs mobiles)
    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };   // none | partial | full
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }

    function cur() {
      try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {}
      return 0;
    }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {   // dans l'APK la page est sur https://app.local : une adresse relative doit pointer vers le site
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }

    // ====================================================================
    //  Stockage hors ligne : 2 moteurs, même interface
    //    - APK : fichiers du dossier de l'application (CoursInterface), servis par https://app.local/cours/
    //    - Web : Cache Storage du navigateur (même cache que l'application web)
    // ====================================================================
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {                                   // fichier complet ? (taille exacte connue à la génération)
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () {
          var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok);
        },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) {
          try { CoursInterface.delete(nameN(n)); } catch (e) {}
          writeOk(readOk().filter(function (x) { return x !== n; }));
          return Promise.resolve();
        }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }   // ancien contenu invalide
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) {
          return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); })
            .then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; });
        },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);

    // ====================================================================
    //  Bannière : invitation, confirmations, progression
    // ====================================================================
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer);
      bnMode = mode;
      txtEl.textContent = text;
      actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; }
      else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }

    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }

    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial"
        ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet."
        : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
</html>
