<script>
const COURSE_TITLE = "Français";
const slides = [
{
    title: "Sommaire général — Français 8e année",
    content: `
<div class="bloc theorie"><div class="bloc-label">Programme</div>
<p>Ce fichier couvre les 24 leçons de Français de la 8e année de l'éducation de base en RDC, organisées en un parcours continu.</p>
<ul>
<li><strong>Communication et grammaire</strong> : leçons 1 à 6</li>
<li><strong>Conjugaison et orthographe</strong> : leçons 7 à 12</li>
<li><strong>Vocabulaire et lecture</strong> : leçons 13 à 15</li>
<li><strong>Types de textes et production écrite</strong> : leçons 16 à 24</li>
</ul>
<p>L'évaluation finale de 40 questions couvre l'ensemble du programme.</p>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le programme de français en 8e année développe la maîtrise de la langue orale et écrite, la grammaire, l'orthographe et la production de textes variés.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif de français 8e année (MEPST/DIPROMAD). Wikimedia Commons pour les illustrations.</div>
    `
},
{
    title: "Leçon 1 : Communication et situation d'énonciation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans la cour de l'école à Kinshasa, deux élèves discutent des devoirs à faire. L'un parle, l'autre écoute et répond. Un troisième élève observe la scène et se demande quels sont les éléments de cette communication.</p></div>
<img alt="Schéma de la communication avec émetteur, message et récepteur" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Communication_shannon-weaver2.svg?width=700" data-image-id="Fr8_1">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Schéma de la communication — Wikimedia Commons : Communication_shannon-weaver2.svg.</p>
<h3>1. Les éléments de la communication</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>L'émetteur est celui qui parle ou écrit. Le destinataire est celui qui reçoit le message. Le message est l'information transmise. Le canal est le moyen utilisé (voix, papier, téléphone). Le contexte est la situation dans laquelle l'échange a lieu.</p></div>
<h3>2. L'intention de communication</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>L'émetteur a toujours une intention : informer, convaincre, demander, exprimer un sentiment, donner un ordre. L'intention oriente le choix des mots et du ton.</p></div>
<h3>3. Le circuit de la communication</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>La communication est un circuit : l'émetteur encode un message, le transmet par un canal, le destinataire le décode et peut répondre. Le feedback est la réponse du destinataire.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Deux élèves discutent : l'élève A (émetteur) dit à l'élève B (destinataire) : « Les devoirs de maths sont difficiles. » Le message est cette phrase, le canal est la voix, le contexte est la cour de l'école. B répond : « Je suis d'accord. » C'est le feedback.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Communiquer, c'est transmettre un message à un destinataire par un canal, dans un contexte donné. L'émetteur a une intention et le destinataire peut répondre.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Communication_shannon-weaver2.svg.</div>
    `
},
{
    title: "Leçon 2 : Types et formes de phrases",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un enseignant de Lubumbashi demande à ses élèves de transformer la phrase « Tu viens demain » en question, puis en phrase négative. Les élèves réfléchissent aux différents types et formes de phrases.</p></div>
<img alt="Échange entre deux personnes illustrant différents types de phrases" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Communication_shannon-weaver2.svg?width=700" data-image-id="Fr8_2">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Échange et types de phrases — Wikimedia Commons : Communication_shannon-weaver2.svg.</p>
<h3>1. Les types de phrases</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>La phrase déclarative donne une information : « Tu viens demain. » La phrase interrogative pose une question : « Viens-tu demain ? » La phrase impérative donne un ordre : « Viens demain. » La phrase exclamative exprime un sentiment : « Tu viens demain ! »</p></div>
<h3>2. Les formes de phrases</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>La forme affirmative énonce un fait : « Tu viens demain. » La forme négative le nie : « Tu ne viens pas demain. » La négation encadre le verbe avec « ne… pas », « ne… jamais », « ne… plus ».</p></div>
<h3>3. Ponctuation et type de phrase</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le point termine une déclaration, le point d'interrogation une question, le point d'exclamation une exclamation. L'impératif se termine souvent par un point ou un point d'exclamation.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Phrase de départ : « Tu viens demain. » (déclarative, affirmative). Question : « Viens-tu demain ? » (interrogative, affirmative). Négation : « Tu ne viens pas demain. » (déclarative, négative). Question négative : « Ne viens-tu pas demain ? » (interrogative, négative).</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Il existe quatre types de phrases : déclarative, interrogative, impérative et exclamative. Chaque phrase peut être à la forme affirmative ou négative.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Communication_shannon-weaver2.svg.</div>
    `
},
{
    title: "Leçon 3 : Classes grammaticales des mots",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une élève de Kinshasa doit classer les mots de la phrase « Les jeunes élèves travaillent sérieusement » selon leur classe grammaticale. Elle utilise un tableau des classes de mots pour s'aider.</p></div>
<img alt="Schéma illustrant la diversité des mots dans une phrase" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Communication_shannon-weaver2.svg?width=700" data-image-id="Fr8_3">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Les mots et leur classe — Wikimedia Commons : Communication_shannon-weaver2.svg.</p>
<h3>1. Les classes variables</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le nom désigne un être ou une chose (élèves, école). Le déterminant précède le nom (les, une). L'adjectif qualifie le nom (jeunes). Le pronom remplace le nom (il, elle). Le verbe exprime une action ou un état (travaillent).</p></div>
<h3>2. Les classes invariables</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>L'adverbe modifie le sens d'un verbe ou d'un adjectif (sérieusement). La préposition relie des mots (à, de, pour). La conjonction relie des propositions (et, mais, ou). L'interjection exprime un sentiment (oh, ah).</p></div>
<h3>3. Identifier la classe d'un mot</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>On identifie la classe d'un mot par sa nature, sa forme et sa fonction dans la phrase. Un même mot peut appartenir à des classes différentes selon l'emploi.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Dans « Les jeunes élèves travaillent sérieusement » : « Les » = déterminant, « jeunes » = adjectif, « élèves » = nom, « travaillent » = verbe, « sérieusement » = adverbe.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les mots se classent en neuf classes grammaticales. Cinq sont variables (nom, déterminant, adjectif, pronom, verbe) et quatre sont invariables (adverbe, préposition, conjonction, interjection).</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Communication_shannon-weaver2.svg.</div>
    `
},
{
    title: "Leçon 4 : Fonctions grammaticales",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une classe de Bukavu, un élève analyse la phrase « Amina écrit une lettre à Kinshasa ». Il doit identifier le sujet, le verbe et les compléments pour comprendre la structure de la phrase.</p></div>
<img alt="Schéma d'une phrase avec sujet, verbe et compléments" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Communication_shannon-weaver2.svg?width=700" data-image-id="Fr8_4">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Structure de la phrase — Wikimedia Commons : Communication_shannon-weaver2.svg.</p>
<h3>1. Le sujet et le verbe</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le sujet fait l'action ou est dans l'état exprimé par le verbe. On le trouve en posant la question « Qui est-ce qui ? » ou « Qu'est-ce qui ? ». Le verbe est le noyau de la phrase.</p></div>
<h3>2. Les compléments d'objet</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le complément d'objet direct (COD) répond à la question « qui ? » ou « quoi ? » après le verbe. Le complément d'objet indirect (COI) répond à la question « à qui ? » ou « de quoi ? ».</p></div>
<h3>3. Les compléments circonstanciels</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Les compléments circonstanciels indiquent le lieu, le temps, la manière, le but. Ils peuvent souvent être déplacés ou supprimés.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>« Amina écrit une lettre à Kinshasa. » Sujet : Amina. Verbe : écrit. COD : une lettre. Complément circonstanciel de lieu : à Kinshasa.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les fonctions grammaticales principales sont sujet, verbe, complément d'objet et complément circonstanciel. Chaque fonction a des questions permettant de l'identifier.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Communication_shannon-weaver2.svg.</div>
    `
},
{
    title: "Leçon 5 : Groupe nominal et accords",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève de Kinshasa décrit le bâtiment de son école : « Les grandes maisons blanches ». Il remarque que le déterminant, l'adjectif et le nom s'accordent en genre et en nombre.</p></div>
<img alt="Groupe nominal avec déterminant, adjectif et nom" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Communication_shannon-weaver2.svg?width=700" data-image-id="Fr8_5">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Accord dans le groupe nominal — Wikimedia Commons : Communication_shannon-weaver2.svg.</p>
<h3>1. Le nom noyau</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le nom noyau est le mot principal du groupe nominal. Les autres mots (déterminant, adjectif) gravitent autour de lui et s'accordent avec lui.</p></div>
<h3>2. L'accord en genre et en nombre</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le déterminant et l'adjectif s'accordent en genre (masculin/féminin) et en nombre (singulier/pluriel) avec le nom noyau. « Une grande maison blanche » / « Des grandes maisons blanches ».</p></div>
<h3>3. Le complément du nom</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le complément du nom précise le nom noyau, souvent introduit par « de ». Il ne s'accorde pas avec le nom noyau : « une maison de village » (village reste au singulier).</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>« Les grandes maisons blanches » : nom noyau = maisons (féminin pluriel). Déterminant = les. Adjectifs = grandes, blanches. Tous sont au féminin pluriel pour s'accorder avec le nom noyau.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Dans un groupe nominal, le déterminant et l'adjectif s'accordent en genre et en nombre avec le nom noyau. Le complément du nom ne s'accorde pas.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Communication_shannon-weaver2.svg.</div>
    `
},
{
    title: "Leçon 6 : Pronoms et reprises nominales",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une élève de Lubumbashi écrit : « Patrick prend le livre de Patrick. » Son professeur lui demande de remplacer les répétitions par des pronoms pour améliorer la phrase.</p></div>
<img alt="Représentation des pronoms dans un échange" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Communication_shannon-weaver2.svg?width=700" data-image-id="Fr8_6">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Pronoms et reprises — Wikimedia Commons : Communication_shannon-weaver2.svg.</p>
<h3>1. Les pronoms personnels</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Les pronoms personnels remplacent un nom : je, tu, il, elle, nous, vous, ils, elles. Ils varient selon la personne, le genre et le nombre. « Patrick prend son livre » : « son » est un déterminant possessif qui remplace « de Patrick ».</p></div>
<h3>2. Les pronoms démonstratifs et possessifs</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Les pronoms démonstratifs (celui, celle, ceux, celles) désignent en montrant. Les pronoms possessifs (le mien, le tien, le sien) indiquent la possession.</p></div>
<h3>3. Éviter les répétitions</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>La reprise nominale consiste à remplacer un nom par un pronom ou un groupe nominal équivalent pour éviter les répétitions et fluidifier le texte.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>« Patrick prend le livre de Patrick » devient « Patrick prend son livre ». « Son » remplace « de Patrick ». Autre possibilité : « Il prend son livre. » Le pronom « il » reprend « Patrick ».</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les pronoms remplacent les noms pour éviter les répétitions. Les pronoms personnels, démonstratifs et possessifs ont des emplois différents.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Communication_shannon-weaver2.svg.</div>
    `
},
{
    title: "Leçon 7 : Présent, passé et futur",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève de Kinshasa raconte sa journée d'école. Il utilise le présent pour décrire l'instant, le passé composé pour ce qui s'est déjà passé et le futur simple pour ce qui viendra.</p></div>
<img alt="Frise chronologique illustrant passé, présent et futur" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Communication_shannon-weaver2.svg?width=700" data-image-id="Fr8_7">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Repères temporels — Wikimedia Commons : Communication_shannon-weaver2.svg.</p>
<h3>1. Le présent</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le présent exprime une action en cours, une vérité générale ou une habitude. « Je finis mes devoirs. » Le verbe « finir » se conjugue : je finis, tu finis, il finit, nous finissons, vous finissez, ils finissent.</p></div>
<h3>2. Le passé composé</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le passé composé exprime une action achevée. Il se forme avec l'auxiliaire avoir ou être au présent et le participe passé. « J'ai fini mes devoirs. »</p></div>
<h3>3. Le futur simple</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le futur simple exprime une action à venir. « Je finirai mes devoirs. » Les terminaisons sont : -ai, -as, -a, -ons, -ez, -ont.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Verbe « finir » : Présent = je finis. Passé composé = j'ai fini. Futur simple = je finirai. Ces trois temps situent l'action par rapport au moment où l'on parle.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le présent situe l'action maintenant, le passé composé avant, le futur simple après. Les terminaisons du futur simple sont les mêmes pour tous les verbes.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Communication_shannon-weaver2.svg.</div>
    `
},
{
    title: "Leçon 8 : Modes et formes verbales",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un professeur de Bukavu écrit une consigne au tableau : « Range tes affaires. » Un élève demande pourquoi le verbe n'est pas conjugué comme d'habitude. Le professeur explique le mode impératif.</p></div>
<img alt="Panneau de consignes illustrant le mode impératif" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Communication_shannon-weaver2.svg?width=700" data-image-id="Fr8_8">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Modes verbaux et consignes — Wikimedia Commons : Communication_shannon-weaver2.svg.</p>
<h3>1. L'indicatif</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>L'indicatif est le mode du réel et de la certitude. Il compte plusieurs temps : présent, imparfait, passé composé, futur simple. « Tu ranges tes affaires » est à l'indicatif présent.</p></div>
<h3>2. L'impératif</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>L'impératif exprime un ordre, un conseil ou une défense. Il ne se conjugue qu'à trois personnes (tu, nous, vous) et sans pronom sujet. « Range tes affaires ! »</p></div>
<h3>3. L'infinitif et le subjonctif</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>L'infinitif est la forme non conjuguée du verbe (ranger, finir). Le subjonctif exprime le souhait, le doute ou l'obligation, souvent introduit par « que ». « Il faut que tu ranges tes affaires. »</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Indicatif : « Tu ranges tes affaires. » Impératif : « Range tes affaires ! » Infinitif : « Ranger ses affaires. » Subjonctif : « Il faut que tu ranges tes affaires. » Chaque mode donne une nuance différente à l'action.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'indicatif exprime le réel, l'impératif l'ordre, l'infinitif l'action non située, le subjonctif le souhait ou l'obligation. Le mode modifie le sens du verbe.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Communication_shannon-weaver2.svg.</div>
    `
},
{
    title: "Leçon 9 : Accord du verbe avec le sujet",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève de Kisangani écrit : « Les élèves de la classe arrive. » Son professeur lui fait remarquer que le verbe doit s'accorder avec le sujet « les élèves », qui est au pluriel.</p></div>
<img alt="Lien entre sujet et verbe dans une phrase" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Communication_shannon-weaver2.svg?width=700" data-image-id="Fr8_9">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Accord sujet-verbe — Wikimedia Commons : Communication_shannon-weaver2.svg.</p>
<h3>1. Règle générale</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le verbe s'accorde en personne et en nombre avec son sujet. Un sujet singulier appelle un verbe au singulier ; un sujet pluriel appelle un verbe au pluriel.</p></div>
<h3>2. Sujet éloigné et sujet inversé</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le sujet peut être éloigné du verbe : « Les élèves de la classe arrivent. » Le sujet peut être placé après le verbe : « Arrivent les élèves. » L'accord se fait toujours avec le sujet réel.</p></div>
<h3>3. Sujet multiple</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Lorsque le sujet est composé de plusieurs éléments (sujet multiple), le verbe se met au pluriel : « Le maître et les élèves entrent en classe. »</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>« Les élèves de la classe arrivent. » Le sujet est « les élèves » (3e personne du pluriel), le verbe « arrivent » est au pluriel. Forme correcte : « Les élèves de la classe arrivent. »</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le verbe s'accorde toujours avec son sujet en personne et en nombre. Il faut identifier le sujet réel, même s'il est éloigné ou inversé.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Communication_shannon-weaver2.svg.</div>
    `
},
{
    title: "Leçon 10 : Participes passés et formes composées",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Deux élèves de Lubumbashi comparent leurs phrases : « Elles sont parties » et « Ils ont terminé ». Ils remarquent que le participe passé s'accorde différemment selon l'auxiliaire utilisé.</p></div>
<img alt="Auxiliaires être et avoir dans les formes composées" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Communication_shannon-weaver2.svg?width=700" data-image-id="Fr8_10">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Participe passé et auxiliaires — Wikimedia Commons : Communication_shannon-weaver2.svg.</p>
<h3>1. Accord avec l'auxiliaire être</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le participe passé employé avec l'auxiliaire être s'accorde en genre et en nombre avec le sujet. « Elles sont parties » (féminin pluriel).</p></div>
<h3>2. Accord avec l'auxiliaire avoir</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le participe passé employé avec l'auxiliaire avoir ne s'accorde pas avec le sujet. « Ils ont terminé » (pas d'accord avec « ils »). Il s'accorde avec le COD placé avant le verbe : « Les lettres qu'ils ont écrites. »</p></div>
<h3>3. Formation des temps composés</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Auxiliaire être ou avoir au présent + participe passé = passé composé. Auxiliaire à l'imparfait + participe passé = plus-que-parfait.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>« Elles sont parties » : auxiliaire être, participe passé « parties » s'accorde avec « elles » (féminin pluriel). « Ils ont terminé » : auxiliaire avoir, pas d'accord avec le sujet, « terminé » reste invariable.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Avec être, le participe passé s'accorde avec le sujet. Avec avoir, il ne s'accorde pas avec le sujet, sauf si le COD est placé avant le verbe.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Communication_shannon-weaver2.svg.</div>
    `
},
{
    title: "Leçon 11 : Orthographe grammaticale et homophones",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une classe de Kinshasa révise un texte destiné au tableau d'affichage. Les élèves doivent compléter : « Ils ___ arrivés ___ l'école. » Ils doivent choisir entre « sont/son » et « à/a ».</p></div>
<img alt="Signe de ponctuation illustrant l'orthographe" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Semicolon.svg?width=700" data-image-id="Fr8_11">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Orthographe et homophones — Wikimedia Commons : Semicolon.svg.</p>
<h3>1. Les homophones a / à</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>« a » est le verbe avoir conjugué (il a). « à » est une préposition. Astuce : on peut remplacer « a » par « avait ». « Il a un livre » → « Il avait un livre ». « Il va à l'école » (préposition).</p></div>
<h3>2. Les homophones et / est</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>« et » est une conjonction de coordination (et = et puis). « est » est le verbe être (il est). Astuce : on peut remplacer « est » par « était ».</p></div>
<h3>3. Les homophones son / sont</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>« son » est un déterminant possessif (son livre). « sont » est le verbe être au pluriel (ils sont). Astuce : on peut remplacer « sont » par « étaient ».</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>« Ils sont arrivés à l'école. » « Sont » = verbe être (ils étaient arrivés). « À » = préposition (à l'école). La phrase complétée est correcte.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les homophones se distinguent par leur classe grammaticale et par des astuces de substitution. « a » → « avait », « est » → « était », « sont » → « étaient ».</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Semicolon.svg.</div>
    `
},
{
    title: "Leçon 12 : Ponctuation et discours rapporté",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève de Bukavu doit rapporter une annonce scolaire dans un récit. Il utilise des guillemets et des deux-points pour le discours direct, puis transforme le dialogue en discours indirect.</p></div>
<img alt="Signe de ponctuation utilisé dans le discours rapporté" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Semicolon.svg?width=700" data-image-id="Fr8_12">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Ponctuation et discours rapporté — Wikimedia Commons : Semicolon.svg.</p>
<h3>1. Les signes de ponctuation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>La virgule sépare les éléments d'une énumération ou marque une pause. Le point termine une phrase. Les deux-points introduisent une explication ou un dialogue. Les guillemets encadrent les paroles rapportées.</p></div>
<h3>2. Le discours direct</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le discours direct rapporte les paroles telles qu'elles ont été prononcées. Il est introduit par un verbe de parole suivi de deux-points et de guillemets. « Le directeur a dit : « Les cours reprennent lundi. » »</p></div>
<h3>3. Le discours indirect</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le discours indirect rapporte les paroles en les intégrant dans une proposition subordonnée. Les guillemets et les deux-points disparaissent. « Le directeur a dit que les cours reprenaient lundi. »</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Discours direct : « Le professeur a annoncé : « Il y a un contrôle demain. » » Discours indirect : « Le professeur a annoncé qu'il y avait un contrôle le lendemain. » Les temps et les indicateurs de temps changent.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La ponctuation structure le discours. Le discours direct utilise guillemets et deux-points ; le discours indirect les supprime et modifie les temps et les repères.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Semicolon.svg.</div>
    `
},
{
    title: "Leçon 13 : Vocabulaire : synonymes, antonymes et familles",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève de Kinshasa enrichit sa description d'un paysage. Il cherche des synonymes pour éviter les répétitions, des antonymes pour créer des contrastes et des mots de la même famille pour préciser ses idées.</p></div>
<img alt="Arbre lexical illustrant une famille de mots" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Communication_shannon-weaver2.svg?width=700" data-image-id="Fr8_13">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Famille de mots — Wikimedia Commons : Communication_shannon-weaver2.svg.</p>
<h3>1. Les synonymes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Les synonymes sont des mots de sens proche. « Beau » et « joli » sont synonymes. Ils permettent de varier le vocabulaire et d'éviter les répétitions.</p></div>
<h3>2. Les antonymes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Les antonymes sont des mots de sens contraire. « Grand » et « petit » sont antonymes. Ils créent des oppositions et des contrastes.</p></div>
<h3>3. Les familles de mots</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Une famille de mots regroupe des mots construits autour d'un même radical. Autour de « terre » : terrain, terrien, atterrir, souterrain. Les préfixes et les suffixes modifient le sens.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Famille de « terre » : terrain (surface), terrien (habitant), atterrir (poser au sol), souterrain (sous la terre). Synonymes de « beau » : joli, magnifique, splendide. Antonymes de « grand » : petit, minuscule.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les synonymes rapprochent, les antonymes opposent, les familles de mots regroupent autour d'un radical. Ces relations enrichissent le vocabulaire.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Communication_shannon-weaver2.svg.</div>
    `
},
{
    title: "Leçon 14 : Sens propre, sens figuré et expressions",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève de Lubumbashi lit l'expression « avoir le cœur sur la main ». Il comprend qu'il ne s'agit pas du cœur réel, mais d'une expression imagée qui signifie être généreux.</p></div>
<img alt="Expression imagée illustrée" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Communication_shannon-weaver2.svg?width=700" data-image-id="Fr8_14">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Sens propre et sens figuré — Wikimedia Commons : Communication_shannon-weaver2.svg.</p>
<h3>1. Le sens propre</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le sens propre est le sens premier, concret d'un mot. « Le cœur » désigne l'organe qui pompe le sang. « La main » désigne la partie du corps.</p></div>
<h3>2. Le sens figuré</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le sens figuré est un sens imagé, dérivé du sens propre. « Avoir le cœur sur la main » signifie être généreux. « Il pleut des cordes » signifie qu'il pleut très fort.</p></div>
<h3>3. Les expressions imagées</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Les expressions imagées utilisent des images pour exprimer une idée. Leur sens global ne s'obtient pas en additionnant le sens de chaque mot. Le contexte aide à comprendre le sens figuré.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>« Avoir le cœur sur la main » : au sens propre, cela signifierait avoir un cœur posé sur la main. Au sens figuré, cela signifie être généreux, prêt à aider. L'expression ne doit pas être comprise littéralement.</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le sens propre est concret, le sens figuré est imagé. Les expressions imagées ont un sens global qui dépasse le sens de chaque mot.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Communication_shannon-weaver2.svg.</div>
    `
},
{
    title: "Leçon 15 : Lecture et compréhension d'un récit",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une classe de Kinshasa lit un récit situé dans un village congolais. Les élèves doivent identifier les personnages, le cadre, les événements et le narrateur pour reconstituer l'histoire.</p></div>
<img alt="Schéma des éléments d'un récit" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Communication_shannon-weaver2.svg?width=700" data-image-id="Fr8_15">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Éléments du récit — Wikimedia Commons : Communication_shannon-weaver2.svg.</p>
<h3>1. Les personnages</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Les personnages sont ceux qui vivent l'histoire. Le personnage principal est le héros. Les personnages secondaires gravitent autour de lui.</p></div>
<h3>2. Le cadre et les événements</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le cadre est le lieu et le moment de l'histoire. Les événements sont les actions qui se succèdent. La chronologie est l'ordre dans lequel ils se produisent.</p></div>
<h3>3. Le narrateur</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le narrateur est celui qui raconte l'histoire. Il peut être un personnage (narrateur interne, « je ») ou extérieur à l'histoire (narrateur externe, « il »).</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Dans un récit : personnage principal = Amina ; cadre = un village près de Kisangani, en saison des pluies ; événements = Amina part chercher de l'eau, rencontre un serpent, appelle à l'aide, est secourue ; narrateur = externe (récit à la 3e personne).</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Comprendre un récit, c'est identifier les personnages, le cadre, les événements et le narrateur. La chronologie aide à suivre l'histoire.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Communication_shannon-weaver2.svg.</div>
    `
},
{
    title: "Leçon 16 : Texte descriptif",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève de Kinshasa doit décrire le marché de sa ville en huit à dix phrases. Il observe les couleurs, les bruits, les odeurs et les mouvements des vendeurs et des acheteurs.</p></div>
<img alt="Scène de marché africain animé" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/African_market.jpg?width=700" data-image-id="Fr8_16">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Marché africain — Wikimedia Commons : African_market.jpg.</p>
<h3>1. Le point de vue</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le descripteur choisit un point de vue : il peut décrire de loin, de près, en plongée ou en contre-plongée. L'ordre de la description suit un parcours (de gauche à droite, du haut en bas, du général au détail).</p></div>
<h3>2. Le vocabulaire sensoriel</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Une bonne description mobilise les cinq sens : la vue (couleurs, formes), l'ouïe (bruits, cris), l'odorat (odeurs), le toucher (textures), le goût (saveurs).</p></div>
<h3>3. Les adjectifs et les comparaisons</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Les adjectifs précisent le nom (rouge, bruyant, serré). Les comparaisons (comme, tel que) créent des images. « Les tomates sont rouges comme des braises. »</p></div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Décrire, c'est organiser des observations selon un point de vue et un ordre, en utilisant un vocabulaire sensoriel et des adjectifs précis.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : African_market.jpg.</div>

    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève de Kisangani raconte une journée de déplacement sous une pluie battante. Il structure son récit en cinq étapes : situation initiale, événement perturbateur, actions, dénouement, situation finale.</p></div>
<img alt="Schéma narratif en cinq étapes" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Communication_shannon-weaver2.svg?width=700" data-image-id="Fr8_17">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Schéma narratif — Wikimedia Commons : Communication_shannon-weaver2.svg.</p>
<h3>1. Le schéma narratif</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le récit suit généralement cinq étapes : situation initiale (équilibre), événement perturbateur (rupture), péripéties (actions), dénouement (résolution), situation finale (nouvel équilibre).</p></div>
<h3>2. Les temps du récit</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le récit au passé utilise l'imparfait pour la description et le passé simple (ou le passé composé) pour les actions de premier plan. « Il pleuvait (imparfait) quand il sortit (passé simple). »</p></div>
<h3>3. Les connecteurs temporels</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Les connecteurs (d'abord, ensuite, puis, enfin) organisent la chronologie. Ils guident le lecteur dans le déroulement des événements.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Situation initiale : « Ce matin-là, le ciel était couvert. » Événement perturbateur : « Soudain, une pluie violente s'abattit. » Péripéties : « Il courut, glissa, se releva. » Dénouement : « Un passant lui offrit un parapluie. » Situation finale : « Il arriva à l'école, trempé mais soulagé. »</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le texte narratif suit un schéma en cinq étapes et utilise des temps du passé (imparfait, passé simple) ainsi que des connecteurs temporels.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Communication_shannon-weaver2.svg.</div>
    `

<img alt="Schéma du cycle de l'eau avec évaporation, condensation et précipitation" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Cycle_de_l%27eau.png?width=700" data-image-id="Fr8_18">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Cycle de l'eau — Wikimedia Commons : Cycle_de_l%27eau.png.</p>
<h3>1. Les caractéristiques du texte explicatif</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Le texte explicatif répond à une question, présente des causes et des conséquences, utilise un vocabulaire précis et des connecteurs logiques (parce que, donc, ainsi, c'est pourquoi).</p></div>

<h3>3. L'organisation du paragraphe</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Un paragraphe explicatif commence par une idée principale, la développe avec des explications et des exemples, et se termine par une conclusion ou une conséquence.</p></div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le texte explicatif éclaire un phénomène en montrant ses causes et ses conséquences. Il utilise des connecteurs logiques et un vocabulaire précis.</p></div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève de Kinshasa doit résumer un article documentaire de 150 mots. Il doit repérer les idées principales et éliminer les détails secondaires pour produire un texte plus court et fidèle.</p></div>

<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Résumé et idées principales — Wikimedia Commons : Communication_shannon-weaver2.svg.</p>
<h3>1. Repérer les idées principales</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Chaque paragraphe contient une idée principale. On la trouve en identifiant le mot-clé et la phrase qui l'exprime. Les exemples et les répétitions sont des détails secondaires.</p></div>
<h3>2. Reformuler</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Reformuler consiste à exprimer la même idée avec ses propres mots, sans changer le sens. On utilise des synonymes et on raccourcit les phrases.</p></div>
<h3>3. Fidélité au texte</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Un résumé doit rester fidèle au texte d'origine : il ne doit pas ajouter d'idées personnelles ni déformer le sens. Il conserve l'ordre des idées principales.</p></div>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Texte original : « L'eau est indispensable à la vie. Les plantes ont besoin d'eau pour pousser. Les animaux et les humains en boivent chaque jour. Sans eau, aucun être vivant ne peut survivre. » Résumé : « L'eau est vitale pour tous les êtres vivants. »</p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Résumer, c'est dégager les idées principales et les reformuler avec ses propres mots, sans trahir le sens du texte.</p></div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 8e année (MEPST/DIPROMAD). Wikimedia Commons : Communication_shannon-weaver2.svg.</div>

<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Structure de la lettre — Wikimedia Commons : Communication_shannon-weaver2.svg.</p>
<h3>1. La lettre personnelle</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>La lettre personnelle s'adresse à un proche. Elle utilise des formules familières (« Cher ami », « À bientôt »). La mise en page est simple : lieu et date, salutation, corps, signature.</p></div>
<h3>2. La lettre administrative</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>La lettre administrative s'adresse à une autorité. Elle comporte un en-tête (expéditeur, destinataire), un objet, une formule d'appel (« Monsieur le Directeur »), un corps structuré et une formule de politesse finale.</p></div>
<h3>3. Les formules de politesse</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>La lettre administrative utilise des formules respectueuses : « Je vous prie d'agréer, Monsieur le Directeur, l'expression de mes salutations distinguées. » La lettre personnelle utilise des formules plus simples.</p></div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La lettre personnelle est familière, la lettre administrative est formelle. Toutes deux suivent une structure précise avec des formules adaptées au destinataire.</p></div>

let currentSlide = 0;
let lastSearchTerm = "", searchResults = [], currentResultIdx = -1;
const contentDiv = document.getElementById('content');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const slideCounterSpan = document.getElementById('slideCounter');
const progressFill = document.getElementById('progressFill');
const counterSpan = document.getElementById('counter');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchNav = document.getElementById('searchNav');
const prevResultBtn = document.getElementById('prevResultBtn');
const nextResultBtn = document.getElementById('nextResultBtn');
const resultCounterSpan = document.getElementById('resultCounter');
const pageTitle = document.getElementById('pageTitle');
pageTitle.textContent = "ECOLIA · " + COURSE_TITLE;
document.title = "ECOLIA — " + COURSE_TITLE;
function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';
    slideCounterSpan.textContent = '0/0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>
