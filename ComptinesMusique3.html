const slides = [
{
    title: "Sommaire — Comptines et Musique 3e année",

<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours prépare les futurs éducateurs de maternelle à utiliser la comptine, le chant, la ronde et le jeu rythmique comme outils de développement et de socialisation du jeune enfant. Il s'appuie sur le domaine des activités musicales du Programme National de l'Enseignement Maternel (PNEM, 2021) et sur les manuels d'activités musicales pour la maternelle.</p>
<p><strong>Note de transparence :</strong> les activités musicales figurent dans la première compétence de base du PNEM 2021 et sont documentées par des manuels d'activités musicales pour la maternelle (Édition 2025). Le programme spécifique de 3e année HP pour ce cours n'a pas été localisé ; la progression ci-dessous articule le référentiel officiel et la formation des élèves-maîtres, à valider par l'enseignant.</p>
<ul>
<li>Leçon 1 — L'éveil musical au préscolaire</li>
<li>Leçon 2 — La voix : respiration, articulation, justesse</li>
<li>Leçon 3 — Les comptines et jeux de doigts</li>
<li>Leçon 4 — Les rondes et jeux collectifs</li>
<li>Leçon 5 — Le rythme : percussions corporelles et objets sonores</li>
<li>Leçon 6 — Le patrimoine musical congolais</li>
<li>Leçon 7 — Les chants patriotiques et l'hymne national</li>
<li>Leçon 8 — Concevoir et animer une séance musicale</li>
<li>Leçon 9 — Synthèse et évaluation</li>
</ul>
<p>Une évaluation finale de 12 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme National de l'Enseignement Maternel (SERNAFOR/MEPST, 2021) ; manuels d'activités musicales pour la maternelle (Édition 2025) ; références générales en éducation musicale du jeune enfant.</div>
    `
},
{
    title: "Leçon 1 — L'éveil musical au préscolaire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un enfant de trois ans tape-t-il en rythme dès qu'il entend une chanson ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le rôle de la musique dans le développement. Identifier les formes d'éveil musical. Relier musique et apprentissages.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Rôle de la musique</div>
<p>La musique sollicite plusieurs dimensions du développement :</p>
<ul>
<li><strong>Auditive :</strong> écoute, discrimination des sons, des rythmes, des hauteurs.</li>
<li><strong>Motrice :</strong> frapper, marcher, danser en rythme.</li>
<li><strong>Langagière :</strong> articulation, mémorisation, enrichissement du vocabulaire.</li>
<li><strong>Sociale :</strong> chanter ensemble, écouter les autres, respecter un rythme commun.</li>
<li><strong>Affective :</strong> plaisir, expression des émotions, apaisement.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Formes d'éveil musical</div>
<ul>
<li><strong>Comptines et jeux de doigts.</strong></li>
<li><strong>Chants et berceuses.</strong></li>
<li><strong>Rondes et danses collectives.</strong></li>
<li><strong>Percussions corporelles et objets sonores.</strong></li>
<li><strong>Écoute musicale.</strong></li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Musique et apprentissages</div>
<p>La chanson facilite la mémorisation (alphabet, nombres, jours de la semaine), soutient l'apprentissage de la langue (articulation, intonation) et installe des rituels sécurisants (chanson d'accueil, de rangement).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois dimensions du développement sollicitées par la musique.</p>
<p><strong>Ex. 2 :</strong> Propose une chanson pour un rituel de classe et justifie ton choix.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Auditive, motrice, sociale. <strong>2)</strong> Une chanson courte et répétitive pour le rangement, facile à mémoriser et à reprendre chaque jour.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La musique développe l'écoute, le mouvement, la langue et la socialisation : c'est un outil pédagogique complet.</p></div>
<div class="sources"><strong>Sources :</strong> PNEM 2021 ; manuels d'activités musicales (maternelle, Édition 2025).</div>
    `
},
{
    title: "Leçon 2 — La voix : respiration, articulation, justesse",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un enfant chante-t-il parfois faux ou trop fort ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le fonctionnement de la voix. Travailler la respiration, l'articulation, la justesse. Adapter la voix à la classe.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Respiration</div>
<p>La voix repose sur le souffle. Une respiration calme, abdominale, permet de chanter sans forcer. Avant de chanter, on inspire par le nez, on expire lentement par la bouche.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Articulation</div>
<p>Pour être compris, l'éducateur articule nettement : lèvres, langue, mâchoire travaillent ensemble. Les comptines à consonnes répétées (« trois petites tortues ») entraînent l'articulation.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Justesse</div>
<p>La justesse s'apprend par imitation et répétition. On propose :</p>
<ul>
<li>des chansons à ambitus court (peu d'écart entre notes) ;</li>
<li>des chants lents et clairs ;</li>
<li>des jeux de « répondre à la voix du maître » (écho).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Adapter sa voix</div>
<ul>
<li>Volume modéré, jamais crié.</li>
<li>Chanter à la bonne hauteur pour les enfants (voix de tête).</li>
<li>Éviter de chanter trop fort pour ne pas couvrir les enfants.</li>
<li>Préserver sa propre voix (hydratation, pauses).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois éléments travaillés par la voix chantée.</p>
<p><strong>Ex. 2 :</strong> Propose un court exercice de respiration avant une chanson.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Respiration, articulation, justesse. <strong>2)</strong> Inspirer par le nez sur quatre temps, expirer par la bouche sur quatre temps, trois fois.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Chanter avec les enfants demande une voix calme, articulée et juste : la voix est un instrument à préserver.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels d'activités musicales ; références d'éducation vocale.</div>
    `
},
{
    title: "Leçon 3 — Les comptines et jeux de doigts",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi les enfants aiment-ils tant les comptines à doigts ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les fonctions de la comptine. Distinguer comptine et jeu de doigts. Animer une comptine en classe.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Qu'est-ce qu'une comptine ?</div>
<p>Une <strong>comptine</strong> est un court texte chanté ou récité, souvent rimé et rythmé. Elle remplit plusieurs fonctions :</p>
<ul>
<li><strong>Rythmique :</strong> installe une cadence, soutient l'attention.</li>
<li><strong>Langagière :</strong> articule, enrichit le vocabulaire.</li>
<li><strong>Sociale :</strong> rassemble le groupe, crée un rituel.</li>
<li><strong>Affective :</strong> rassure par la répétition.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les jeux de doigts</div>
<p>Un <strong>jeu de doigts</strong> associe une comptine à des gestes précis des mains et des doigts. Il développe la motricité fine, la coordination et la mémorisation. Exemples traditionnels : « La petite araignée », « Voici ma main ».</p>
<p>Le patrimoine congolais compte également des comptines gestuelles transmises dans les langues locales.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Animer une comptine</div>
<ol>
<li>Présenter la comptine en entier.</li>
<li>La répéter lentement, en articulant.</li>
<li>Associer les gestes, un par un.</li>
<li>Faire répéter les enfants.</li>
<li>Répéter plusieurs fois, à des rythmes différents.</li>
</ol>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois fonctions de la comptine.</p>
<p><strong>Ex. 2 :</strong> Choisis une comptine courte et propose les gestes associés.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Rythmique, langagière, sociale. <strong>2)</strong> Les gestes doivent correspondre aux mots, être simples et reproductibles par un enfant de 3 à 5 ans.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La comptine associe parole, rythme et geste : c'est un outil complet pour le développement du jeune enfant.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels d'activités musicales ; PNEM 2021.</div>
    `
},
{
    title: "Leçon 4 — Les rondes et jeux collectifs",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi les rondes rassemblent-elles les enfants autour d'un même rythme ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le rôle de la ronde. Animer une ronde simple. Adapter les rondes à l'espace disponible.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Qu'est-ce qu'une ronde ?</div>
<p>Une <strong>ronde</strong> est une danse collective en cercle, chantée, où les enfants se tiennent par la main ou se déplacent ensemble. Elle développe la coordination, le sens du groupe, l'écoute du rythme commun.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Rôle pédagogique</div>
<ul>
<li><strong>Social :</strong> apprendre à faire ensemble, à respecter un rythme commun.</li>
<li><strong>Moteur :</strong> coordonner pas, mouvements, arrêts.</li>
<li><strong>Affectif :</strong> plaisir du groupe, sentiment d'appartenance.</li>
<li><strong>Langagier :</strong> chanter ensemble, mémoriser un texte.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Animer une ronde</div>
<ol>
<li>Faire un cercle avec tous les enfants.</li>
<li>Chanter lentement la première fois.</li>
<li>Montrer les gestes (pas, sauts, arrêts).</li>
<li>Répéter plusieurs fois, en variant la vitesse.</li>
<li>Intégrer progressivement des variantes (sens inverse, changements de pas).</li>
</ol>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Adapter à l'espace</div>
<p>Dans une salle étroite ou une cour limitée, on peut :</p>
<ul>
<li>réduire la taille du cercle ;</li>
<li>privilégier les rondes sur place ;</li>
<li>utiliser la cour quand elle est disponible ;</li>
<li>alterner rondes et jeux assis pour éviter la fatigue.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite deux apports pédagogiques de la ronde.</p>
<p><strong>Ex. 2 :</strong> Propose une ronde adaptée à une classe de 30 enfants dans une salle moyenne.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Coopération et coordination. <strong>2)</strong> Une ronde sur place, avec gestes, ne nécessitant pas de grands déplacements.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La ronde unit chant, mouvement et groupe : elle développe la coopération et le plaisir d'être ensemble.</p></div>
<div class="sources"><strong>Sources :</strong> Manuels d'activités musicales ; pratiques d'animation en maternelle.</div>
    `
},
{
    title: "Leçon 5 — Le rythme : percussions corporelles et objets sonores",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment faire de la musique sans instrument coûteux ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la notion de rythme. Utiliser le corps et les objets comme instruments. Concevoir un jeu rythmique.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Notion de rythme</div>
<p>Le <strong>rythme</strong> est l'organisation des sons dans le temps : alternance de temps forts et faibles, de durées longues et courtes. Il se ressent dans le corps (marche, balancement, battement du cœur).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Percussions corporelles</div>
<p>On peut produire des sons rythmiques avec :</p>
<ul>
<li>les mains (frapper, claquer) ;</li>
<li>les pieds (taper, frapper) ;</li>
<li>les cuisses (taper) ;</li>
<li>la bouche (claquer la langue, siffler).</li>
</ul>
<p>Les percussions corporelles sont accessibles à tous, sans matériel.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Objets sonores</div>
<p>On peut transformer des objets du milieu en instruments :</p>
<ul>
<li>bouteilles remplies de graines ou de sable (maracas) ;</li>
<li>boîtes en métal (tambour) ;</li>
