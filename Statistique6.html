{
    title: "Leçon 1 — Introduction à la statistique : définitions et vocabulaire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un marché de Kinshasa, un commerçant veut savoir combien de sacs de riz il vend en moyenne par jour, et si ses ventes varient beaucoup. Pour répondre, il doit collecter des données, les organiser et les analyser. C'est le rôle de la statistique, outil indispensable du gestionnaire.</p></div>
<h3>1. Définition et objet de la statistique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Statistique</strong> : science qui a pour objet la collecte, l'organisation, l'analyse, la présentation et l'interprétation des données.</li><li><strong>Objectif</strong> : décrire un ensemble d'observations (statistique descriptive) et/ou en tirer des conclusions sur une population (statistique inférentielle).</li><li><strong>Statistique descriptive</strong> : résume et décrit les données collectées.</li><li><strong>Statistique inférentielle</strong> : généralise les résultats de l'échantillon à la population.</li></ul></div>
<h3>2. Le vocabulaire de base</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Population</strong> : ensemble de tous les individus ou objets étudiés (ex. tous les élèves d'une école).</li><li><strong>Échantillon</strong> : sous-ensemble de la population (ex. 100 élèves tirés au sort).</li><li><strong>Individu (ou unité statistique)</strong> : élément de la population.</li><li><strong>Caractère (ou variable)</strong> : propriété étudiée (sexe, âge, revenu).</li><li><strong>Modalité</strong> : valeur prise par le caractère (masculin/féminin, 12 ans, 50 000 FC).</li></ul></div>
<h3>3. Types de caractères statistiques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Caractère qualitatif</strong> : non mesurable (sexe, état civil, profession).</li><li><strong>Caractère quantitatif discret</strong> : valeurs isolées (nombre d'enfants, nombre de visites).</li><li><strong>Caractère quantitatif continu</strong> : valeurs dans un intervalle (taille, poids, revenu).</li><li><strong>Séries statistiques</strong> : classement des modalités et de leurs effectifs.</li></ul></div>
<h3>4. Applications en gestion</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Une entreprise de Kinshasa</strong> étudie les ventes mensuelles de ses 50 magasins pour ajuster ses stocks.</li><li><strong>Une banque de Lubumbashi</strong> analyse la répartition de ses clients par âge et par type de compte.</li><li><strong>Une PME de Matadi</strong> mesure la satisfaction de ses 200 clients pour améliorer son service.</li><li><strong>Le gouvernement</strong> utilise les statistiques pour planifier le budget, l'éducation et la santé.</li></ul><p><a href="https://www.youtube.com/results?search_query=introduction+statistique+définition+vocabulaire" target="_blank" rel="noopener">🎥 Recherche : introduction à la statistique (chaînes de cours de statistique)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La statistique collecte, organise, analyse et interprète des données. Population, échantillon, individu, caractère et modalité sont les concepts de base. Un caractère peut être qualitatif, quantitatif discret ou quantitatif continu.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Statistique, 4e CG (manuels-scolaires-rdc.com, 2025) ; Curriculum de Commerciale et Gestion (MEPST/DIPROMAD, 2023).<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT.</div>
    `
},
{
    title: "Leçon 2 — La collecte et l'organisation des données",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une entreprise de Kinshasa veut connaître les habitudes d'achat de ses clients. Elle prépare un questionnaire, le distribue à 200 clients, puis dépouille les réponses. Comment organiser ces données pour qu'elles soient exploitables ? La collecte et l'organisation sont la première étape de toute étude statistique.</p></div>
<h3>1. Les techniques de collecte</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Enquête</strong> : recueil d'informations auprès d'un échantillon (questionnaire, entretien).</li><li><strong>Observation directe</strong> : constat sur le terrain (comptage des clients dans un magasin).</li><li><strong>Source documentaire</strong> : exploitation de registres, fichiers, rapports existants.</li><li><strong>Expérimentation</strong> : mesure de l'effet d'une variable contrôlée.</li></ul></div>
<h3>2. Le questionnaire</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Questions fermées</strong> : réponses préétablies (oui/non, cases à cocher).</li><li><strong>Questions ouvertes</strong> : réponses libres.</li><li><strong>Questions à choix multiple</strong> : plusieurs réponses possibles.</li><li><strong>Pré-test</strong> : essai du questionnaire sur un petit échantillon avant diffusion.</li><li><strong>Anonymat</strong> : garantit la sincérité des réponses.</li></ul></div>
<h3>3. Le dépouillement et le tableau statistique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Dépouillement</strong> : comptage des réponses, saisie des données.</li><li><strong>Tableau statistique</strong> : présentation des modalités et de leurs effectifs.</li><li><strong>Effectif (ni)</strong> : nombre d'individus pour une modalité.</li><li><strong>Effectif total (N)</strong> : somme de tous les effectifs.</li><li><strong>Fréquence (fi)</strong> : fi = ni / N.</li><li><strong>Fréquence en pourcentage</strong> : fi × 100.</li></ul></div>
<h3>4. Exemple complet</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Une enquête auprès de 200 clients d'un magasin de Kinshasa révèle leur satisfaction :</p><ul><li>Très satisfaits : 60 clients → fréquence = 60/200 = 0,30 = 30 %.</li><li>Satisfaits : 90 clients → 45 %.</li><li>Peu satisfaits : 30 clients → 15 %.</li><li>Insatisfaits : 20 clients → 10 %.</li><li>Total : 200 clients → 100 %.</li></ul><p><a href="https://www.youtube.com/results?search_query=collecte+organisation+données+statistiques+enquête" target="_blank" rel="noopener">🎥 Recherche : la collecte des données (chaînes de cours de statistique)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La collecte utilise l'enquête, l'observation, les sources documentaires ou l'expérimentation. Le questionnaire peut comporter des questions fermées, ouvertes ou à choix multiple. Le dépouillement aboutit à un tableau statistique avec effectifs et fréquences.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Statistique, 4e CG (manuels-scolaires-rdc.com, 2025).</div>
    `
},
{
    title: "Leçon 3 — Les tableaux et les graphiques statistiques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une entreprise de Lubumbashi, le directeur demande au stagiaire de présenter les ventes mensuelles sous forme visuelle. Un tableau est utile, mais un graphique est plus parlant. Diagramme en bâtons, histogramme, courbe, camembert : chaque type a sa fonction. Les tableaux et graphiques transforment les chiffres en informations.</p></div>
<h3>1. Les types de tableaux</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Tableau à simple entrée</strong> : une seule variable (ex. répartition par sexe).</li><li><strong>Tableau à double entrée</strong> : deux variables croisées (ex. sexe × niveau d'étude).</li><li><strong>Tableau de fréquences</strong> : effectifs et fréquences.</li><li><strong>Tableau à classes</strong> : regroupement par intervalles pour les caractères continus.</li></ul></div>
<h3>2. Les représentations graphiques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Diagramme en bâtons</strong> : pour les caractères qualitatifs et discrets.</li><li><strong>Histogramme</strong> : pour les caractères continus (classes).</li><li><strong>Polygone des effectifs</strong> : courbe reliant les milieux de classes.</li><li><strong>Diagramme circulaire (camembert)</strong> : pour montrer la part de chaque modalité dans le total.</li><li><strong>Courbe d'évolution</strong> : pour suivre une variable dans le temps.</li><li><strong>Diagramme en boîte</strong> : pour visualiser la dispersion.</li></ul></div>
<h3>3. Le regroupement en classes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Étendue</strong> : différence entre la valeur maximale et la valeur minimale.</li><li><strong>Nombre de classes (k)</strong> : souvent entre 5 et 15 ; une règle empirique utilise k ≈ √N.</li><li><strong>Amplitude de classe (a)</strong> : a = étendue / k.</li><li><strong>Centre de classe</strong> : moyenne des bornes inférieure et supérieure.</li></ul></div>
<h3>4. Exemple concret</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Revenus mensuels (en milliers de FC) de 50 employés d'une entreprise de Kinshasa : étendue de 200 à 900, soit 700.</p><ul><li>Nombre de classes : k ≈ √50 ≈ 7.</li><li>Amplitude : a = 700 / 7 = 100.</li><li>Classes : [200 ; 300[, [300 ; 400[, ..., [800 ; 900[.</li><li>Centre de la 1re classe : (200 + 300) / 2 = 250.</li></ul><p><a href="https://www.youtube.com/results?search_query=tableaux+graphiques+statistiques+histogramme+camembert" target="_blank" rel="noopener">🎥 Recherche : les tableaux et graphiques (chaînes de cours de statistique)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le tableau statistique présente les données brutes. Les graphiques (bâtons, histogramme, camembert, courbe) facilitent la lecture. Le regroupement en classes s'utilise pour les caractères continus. L'amplitude de classe = étendue / nombre de classes.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Statistique, 4e CG (manuels-scolaires-rdc.com, 2025).</div>
    `
},
{
    title: "Leçon 4 — Les mesures de tendance centrale",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À Kinshasa, le directeur d'une entreprise veut connaître le salaire « typique » de ses employés. Certains gagnent peu, d'autres beaucoup. Doit-il utiliser la moyenne, la médiane ou le mode ? Chaque mesure de tendance centrale raconte une partie de l'histoire.</p></div>
<h3>1. La moyenne arithmétique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : somme des valeurs divisée par le nombre d'observations.</li><li><strong>Moyenne simple</strong> : x̄ = (x1 + x2 + ... + xn) / n.</li><li><strong>Moyenne pondérée</strong> : x̄ = Σ (xi × ni) / N.</li><li><strong>Propriété</strong> : sensible aux valeurs extrêmes.</li></ul></div>
<h3>2. La médiane</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : valeur qui partage la série en deux parties égales.</li><li><strong>Calcul</strong> : on range les valeurs par ordre croissant, puis :</li><li>Si n est impair : médiane = valeur de rang (n+1)/2.</li><li>Si n est pair : médiane = moyenne des valeurs de rang n/2 et n/2 + 1.</li><li><strong>Propriété</strong> : peu sensible aux valeurs extrêmes.</li></ul></div>
<h3>3. Le mode</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : valeur ou classe la plus fréquente.</li><li><strong>Série unimodale</strong> : un seul mode.</li><li><strong>Série bimodale ou plurimodale</strong> : plusieurs modes.</li><li><strong>Utilité</strong> : utile pour les caractères qualitatifs.</li></ul></div>
<h3>4. Exemple comparatif</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Salaires mensuels (en milliers de FC) de 7 employés : 100, 120, 150, 150, 200, 250, 800.</p><ul><li><strong>Moyenne</strong> : (100 + 120 + 150 + 150 + 200 + 250 + 800) / 7 = 1 770 / 7 ≈ 253 milliers.</li><li><strong>Médiane</strong> : 4e valeur = 150 milliers.</li><li><strong>Mode</strong> : 150 (apparaît 2 fois).</li><li><strong>Interprétation</strong> : la moyenne est tirée vers le haut par le salaire de 800, tandis que la médiane et le mode reflètent mieux la réalité des employés.</li></ul><p><a href="https://www.youtube.com/results?search_query=moyenne+médiane+mode+tendance+centrale" target="_blank" rel="noopener">🎥 Recherche : les mesures de tendance centrale (chaînes de cours de statistique)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La moyenne arithmétique est la somme des valeurs divisée par l'effectif. La médiane partage la série en deux. Le mode est la valeur la plus fréquente. La moyenne est sensible aux extrêmes, la médiane et le mode le sont moins.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Statistique, 4e CG (manuels-scolaires-rdc.com, 2025).</div>
    `
},
{
    title: "Leçon 5 — Les mesures de dispersion",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Deux entreprises de Kinshasa ont le même salaire moyen : 250 000 FC. Mais dans la première, tous les employés gagnent entre 240 000 et 260 000 FC. Dans la seconde, certains gagnent 100 000 FC et d'autres 500 000 FC. La dispersion est très différente. Les mesures de dispersion révèlent ces inégalités.</p></div>
<h3>1. L'étendue</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : différence entre la valeur maximale et la valeur minimale.</li><li><strong>Formule</strong> : E = xmax − xmin.</li><li><strong>Limite</strong> : ne tient compte que des extrêmes.</li></ul></div>
<h3>2. La variance</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : moyenne des carrés des écarts à la moyenne.</li><li><strong>Formule</strong> : V = Σ ni (xi − x̄)² / N.</li><li><strong>Formule pratique</strong> : V = Σ ni xi² / N − (x̄)².</li><li><strong>Propriété</strong> : exprimée en unités au carré, difficile à interpréter directement.</li></ul></div>
<h3>3. L'écart-type</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : racine carrée de la variance.</li><li><strong>Formule</strong> : σ = √V.</li><li><strong>Utilité</strong> : exprimé dans la même unité que la variable, il est interprétable.</li><li><strong>Interprétation</strong> : plus σ est grand, plus les valeurs sont dispersées.</li></ul></div>
<h3>4. Exemple complet</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Salaires mensuels (en milliers de FC) : 100, 120, 150, 150, 200, 250, 800. Moyenne = 253.</p><ul><li>Étendue = 800 − 100 = 700.</li><li>Variance : Σ(xi − x̄)² = (100−253)² + ... + (800−253)² ≈ 405 429 / 7 ≈ 57 918.</li><li>Écart-type = √57 918 ≈ 240,7 milliers FC.</li><li><strong>Interprétation</strong> : la dispersion est très forte, ce qui confirme l'inégalité des salaires.</li></ul><p><a href="https://www.youtube.com/results?search_query=variance+écart-type+étendue+dispersion" target="_blank" rel="noopener">🎥 Recherche : les mesures de dispersion (chaînes de cours de statistique)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'étendue est la différence entre le maximum et le minimum. La variance est la moyenne des carrés des écarts à la moyenne. L'écart-type est la racine carrée de la variance. Plus l'écart-type est grand, plus les valeurs sont dispersées.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Statistique, 4e CG (manuels-scolaires-rdc.com, 2025).</div>
    `

    title: "Leçon 6 — L'analyse combinatoire : arrangements, permutations, combinaisons",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une entreprise de Kinshasa, 10 candidats postulent pour 3 postes différents (directeur, comptable, commercial). De combien de façons peut-on pourvoir ces postes ? Un autre cas : combien de façons de tirer 3 cartes d'un jeu de 52 ? L'analyse combinatoire répond à ces questions.</p></div>
<h3>1. La factorielle</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Factorielle n</strong> : n! = n × (n−1) × ... × 2 × 1.</li><li><strong>Exemples</strong> : 3! = 6 ; 5! = 120 ; 10! = 3 628 800.</li><li><strong>Convention</strong> : 0! = 1.</li></ul></div>
<h3>2. Les arrangements</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : choix ordonné de k éléments parmi n, sans répétition.</li><li><strong>Formule</strong> : A(n, k) = n! / (n−k)!.</li><li><strong>Exemple</strong> : pourvoir 3 postes parmi 10 candidats : A(10, 3) = 10! / 7! = 720.</li><li><strong>Avec répétition</strong> : n^k (ex. code à 3 chiffres : 10³ = 1 000).</li></ul></div>
<h3>3. Les permutations</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : arrangement où l'on utilise tous les éléments (k = n).</li><li><strong>Formule</strong> : P(n) = n!.</li><li><strong>Exemple</strong> : ranger 4 livres sur une étagère : P(4) = 24 façons.</li><li><strong>Permutations avec éléments identiques</strong> : P = n! / (n1! × n2! × ...).</li></ul></div>
<h3>4. Les combinaisons</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : choix non ordonné de k éléments parmi n.</li><li><strong>Formule</strong> : C(n, k) = n! / [k! × (n−k)!].</li><li><strong>Exemple</strong> : tirer 3 cartes d'un jeu de 52 : C(52, 3) = 22 100.</li><li><strong>Propriété</strong> : C(n, k) = C(n, n−k).</li><li><strong>Triangle de Pascal</strong> : construction des coefficients binomiaux.</li></ul><p><a href="https://www.youtube.com/results?search_query=analyse+combinatoire+arrangements+combinaisons+permutations" target="_blank" rel="noopener">🎥 Recherche : l'analyse combinatoire (chaînes de cours de statistique)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La factorielle n! = n × (n−1) × ... × 1. Les arrangements A(n, k) = n! / (n−k)!. Les permutations P(n) = n!. Les combinaisons C(n, k) = n! / [k! × (n−k)!]. Ces formules sont utilisées pour compter les possibilités en gestion et en probabilités.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Statistique, 4e CG (manuels-scolaires-rdc.com, 2025).</div>
    `
},

    title: "Leçon 7 — Les probabilités : définitions et axiomes",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un assureur de Kinshasa doit estimer le risque qu'un client ait un accident. Une entreprise veut connaître la probabilité qu'une machine tombe en panne. Les probabilités quantifient l'incertitude, outil précieux pour la décision en gestion.</p></div>
<h3>1. Vocabulaire des probabilités</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Expérience aléatoire</strong> : expérience dont le résultat est incertain (lancer de dé, tirage au sort).</li><li><strong>Univers (Ω)</strong> : ensemble de tous les résultats possibles.</li><li><strong>Événement</strong> : partie de l'univers (A, B, ...).</li><li><strong>Événement élémentaire</strong> : un seul résultat.</li><li><strong>Événement certain</strong> : l'univers entier. <strong>Événement impossible</strong> : ensemble vide.</li><li><strong>Événements incompatibles</strong> : A ∩ B = ∅.</li></ul></div>
<h3>2. Axiomes et propriétés</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Probabilité</strong> : nombre P(A) compris entre 0 et 1.</li><li><strong>P(Ω) = 1</strong> et <strong>P(∅) = 0</strong>.</li><li><strong>Équiprobabilité</strong> : si tous les résultats ont la même chance, P(A) = nombre de cas favorables / nombre de cas possibles.</li><li><strong>P(A ∪ B) = P(A) + P(B) − P(A ∩ B)</strong>.</li><li><strong>Événements incompatibles</strong> : P(A ∪ B) = P(A) + P(B).</li><li><strong>Événement contraire</strong> : P(Ā) = 1 − P(A).</li></ul></div>
<h3>3. Probabilités conditionnelles</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : P(A|B) = P(A ∩ B) / P(B), si P(B) > 0.</li><li><strong>Événements indépendants</strong> : P(A ∩ B) = P(A) × P(B).</li><li><strong>Formule des probabilités totales</strong> : P(B) = Σ P(Ai) × P(B|Ai).</li><li><strong>Théorème de Bayes</strong> : P(A|B) = P(B|A) × P(A) / P(B).</li></ul></div>
<h3>4. Exemples en gestion</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Contrôle qualité</strong> : dans un lot de 100 pièces, 5 sont défectueuses. La probabilité de tirer une pièce défectueuse est 5/100 = 0,05.</li><li><strong>Assurance</strong> : la probabilité qu'un client ait un accident dans l'année est 0,02. La prime est calculée en conséquence.</li><li><strong>Gestion des stocks</strong> : la probabilité qu'une demande dépasse le stock prévu est utilisée pour dimensionner le stock de sécurité.</li><li><strong>Markéting</strong> : la probabilité qu'un client réponde à une campagne publicitaire guide le budget marketing.</li></ul><p><a href="https://www.youtube.com/results?search_query=probabilités+définition+axiomes+conditionnelles" target="_blank" rel="noopener">🎥 Recherche : les probabilités (chaînes de cours de statistique)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La probabilité mesure la chance qu'un événement se produise. Elle est comprise entre 0 et 1. P(A ∪ B) = P(A) + P(B) − P(A ∩ B). La probabilité conditionnelle mesure la probabilité d'un événement sachant qu'un autre s'est produit. Les événements indépendants vérifient P(A ∩ B) = P(A) × P(B).</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Statistique, 4e CG (manuels-scolaires-rdc.com, 2025).</div>
    `

    title: "Leçon 8 — Les probabilités conditionnelles et l'indépendance",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une entreprise de Kinshasa, on sait que 60 % des clients sont des hommes et 40 % des femmes. Parmi les hommes, 30 % achètent le produit A ; parmi les femmes, 50 % l'achètent. Quelle est la probabilité qu'un client choisi au hasard achète le produit A ? C'est un problème de probabilités conditionnelles et totales.</p></div>
<h3>1. Rappel des probabilités conditionnelles</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>P(A|B)</strong> : probabilité de A sachant que B est réalisé.</li><li><strong>Formule</strong> : P(A|B) = P(A ∩ B) / P(B).</li><li><strong>Produit</strong> : P(A ∩ B) = P(A|B) × P(B) = P(B|A) × P(A).</li><li><strong>Arbre de probabilités</strong> : représentation graphique des probabilités conditionnelles.</li></ul></div>
<h3>2. La formule des probabilités totales</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Principe</strong> : si (A1, A2, ..., An) forment une partition de l'univers, alors :</li><li><strong>P(B) = Σ P(Ai) × P(B|Ai)</strong>.</li><li><strong>Utilité</strong> : calculer la probabilité d'un événement à partir de plusieurs scénarios.</li><li><strong>Exemple</strong> : probabilité qu'un client achète, selon qu'il soit homme ou femme.</li></ul></div>
<h3>3. L'indépendance</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Deux événements A et B sont indépendants</strong> si P(A ∩ B) = P(A) × P(B).</li><li>Équivalent : P(A|B) = P(A).</li><li><strong>Attention</strong> : incompatibles (A ∩ B = ∅) ≠ indépendants.</li><li><strong>Application</strong> : deux machines qui tombent en panne indépendamment l'une de l'autre.</li></ul></div>
<h3>4. Exemple complet</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Dans une entreprise de Kinshasa :</p><ul><li>P(Homme) = 0,60 ; P(Femme) = 0,40.</li><li>P(Achat | Homme) = 0,30 ; P(Achat | Femme) = 0,50.</li><li>P(Achat) = P(H) × P(Achat|H) + P(F) × P(Achat|F).</li><li>P(Achat) = 0,60 × 0,30 + 0,40 × 0,50 = 0,18 + 0,20 = <strong>0,38</strong>.</li><li>La probabilité qu'un client choisi au hasard achète est de 38 %.</li></ul><p><a href="https://www.youtube.com/results?search_query=probabilités+conditionnelles+indépendance+probabilités+totales" target="_blank" rel="noopener">🎥 Recherche : les probabilités conditionnelles (chaînes de cours de statistique)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>P(A|B) = P(A ∩ B) / P(B). P(A ∩ B) = P(A|B) × P(B). La formule des probabilités totales permet de calculer P(B) à partir d'une partition. Deux événements sont indépendants si P(A ∩ B) = P(A) × P(B). Ne pas confondre incompatibilité et indépendance.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Statistique, 4e CG (manuels-scolaires-rdc.com, 2025).</div>
    `

questions.forEach(function(q) {
    if (!q.text) {
        q.text = q.question || q.q || q.enonce || q.titre || "";
    }
    if (typeof q.correct === 'undefined') {
        if (typeof q.answer !== 'undefined') q.correct = q.answer;
        else if (typeof q.reponse !== 'undefined') q.correct = q.reponse;
    }
});

let currentSlide = 0;
let lastSearchTerm = "", searchResults = [], currentResultIdx = -1;
const contentDiv = document.getElementById('content');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const slideCounterSpan = document.getElementById('slideCounter');
const progressFill = document.getElementById('progressFill');
const counterSpan = document.getElementById('counter');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchNav = document.getElementById('searchNav');
const prevResultBtn = document.getElementById('prevResultBtn');
const nextResultBtn = document.getElementById('nextResultBtn');
const resultCounterSpan = document.getElementById('resultCounter');
const pageTitle = document.getElementById('pageTitle');
pageTitle.textContent = "ECOLIA · " + COURSE_TITLE;
document.title = "ECOLIA — " + COURSE_TITLE;
function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';
    slideCounterSpan.textContent = '0/0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>

<script>
(function () {
  var SITE = "https://ecolia-course.github.io/";
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface", page servie par https://app.local
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function abs(u) { return /^(https?:|data:|blob:)/i.test(u) ? u : (NATIVE ? SITE + u.replace(/^(\.\/|\/)+/, "") : u); }
  function ext(u) { var m = String(u).split("?")[0].match(/\.(jpe?g|png|gif|webp|svg)$/i); return m ? m[1].toLowerCase() : "jpg"; }
  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {
    if (queued[fn]) return;
    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
    if (!queue.length) { running = false; return; }
    if (!navigator.onLine) { running = false; return; }
    var q = queue.shift(), t0 = Date.now();
    try { CoursInterface.download(q[0], q[1]); } catch (e) { return setTimeout(next, 500); }
    (function wait() {
      var ok = false;
      try { ok = !!CoursInterface.exists(q[1]); } catch (e) {}
      if (ok) setTimeout(next, 1500);
      else if (Date.now() - t0 > 40000) next();
      else setTimeout(wait, 700);
    })();
  }
  function exists(fn) { try { return !!CoursInterface.exists(fn); } catch (e) { return false; } }

  function show(img) {                                    // affiche UNE image (appelé à chaque slide affichée)
    if (!table || img.getAttribute("data-ecolia-done")) return;
    var id = img.getAttribute("data-image-id");
    var url = table[id];
    if (typeof url !== "string" || !url.length) { console.warn("ECOLIA : image absente du JSON :", id); return; }
    img.setAttribute("data-ecolia-done", "1");
    if (!NATIVE) { img.onerror = function () { hide(img); }; img.setAttribute("src", url); return; }
    var full = abs(url), fn = "img_" + id + "." + ext(url);
    if (exists(fn)) {                                     // déjà sur l'appareil : lecture locale, sans internet
      img.onerror = function () {                         // fichier incomplet : on le supprime et on utilise le site
        try { CoursInterface["delete"](fn); } catch (e) {}
        queued[fn] = 0;
        img.onerror = function () { hide(img); };
        img.setAttribute("src", full);
      };
      img.setAttribute("src", "https://app.local/cours/" + fn);
    } else {
      img.onerror = function () { hide(img); };
      img.setAttribute("src", full);
      enqueue(full, fn);
    }
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches("img[data-image-id]")) show(root);
    root.querySelectorAll("img[data-image-id]").forEach(show);
  }
  function prefetchAll() {                                // APK : prépare TOUTES les images du cours pour le hors-ligne
    var ids = {};
    try { JSON.stringify(slides).replace(/data-image-id=\\?"([^"\\]+)/g, function (m, id) { ids[id] = 1; }); } catch (e) {}
    Object.keys(ids).forEach(function (id) {
      var url = table[id];
      if (typeof url !== "string" || !url.length) return;
      var fn = "img_" + id + "." + ext(url);
      if (!exists(fn)) enqueue(abs(url), fn);
    });
  }
  function start(tbl) {
    table = tbl;
    scan(document.body);
    new MutationObserver(function (muts) {                // les slides sont écrites à la volée : on traite chaque nouvelle image
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
    if (NATIVE) prefetchAll();
  }

  var JSON_URL = NATIVE ? SITE + "images_ecolia.json" : "images_ecolia.json";
  var KEY = "ecolia_images_json";
  fetch(JSON_URL, NATIVE ? { cache: "no-cache" } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (table) { if (NATIVE) lsSet(KEY, JSON.stringify(table)); start(table); })
    .catch(function (e) {
      var saved = null;
      if (NATIVE) { try { saved = JSON.parse(lsGet(KEY) || "null"); } catch (x) {} }
      if (saved) start(saved);                              // hors ligne dans l'APK : JSON gardé la dernière fois
      else console.warn("ECOLIA : JSON des images indisponible.", e);
    });
})();
</script>
