<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours initie à la pratique théâtrale : corps et voix, improvisation, mime, construction du personnage, jeu d'ensemble, découverte du patrimoine théâtral congolais, appréciation d'un spectacle et création collective. La pratique est au cœur de chaque séance.</p>
<p><strong>Note de transparence :</strong> les arts dramatiques sont une branche des humanités artistiques en RDC, pratiquée en 3e et 4e années (des sketchs y sont travaillés), et le manuel officiel d'Éducation Musicale et Théâtrale pour la 3e année de Pédagogie Générale aborde les arts dramatiques et les spectacles traditionnels (griot, performances masquées). Le programme détaillé spécifique à la 3e année artistique n'a pas été localisé dans les sources consultées. La progression ci-dessous propose une <strong>initiation pratique</strong> alignée sur des référentiels reconnus, à valider par l'enseignant.</p>
<ul>
<li>Leçon 1 — Qu'est-ce que l'art dramatique ?</li>
<li>Leçon 2 — Le corps et la voix : échauffement</li>
<li>Leçon 3 — L'improvisation guidée</li>
<li>Leçon 4 — Le mime et le jeu sans parole</li>
<li>Leçon 5 — Le personnage : construction et jeu</li>
<li>Leçon 6 — Le jeu d'ensemble et l'écoute</li>
<li>Leçon 7 — Le patrimoine théâtral congolais</li>
<li>Leçon 8 — Appréciation d'un spectacle</li>
<li>Leçon 9 — Création collective et présentation</li>
<li>Leçon 10 — Synthèse et évaluation</li>
</ul>
<p>Une évaluation finale de 12 questions porte sur les notions de base ; l'essentiel de l'évaluation reste la pratique.</p>
</div>
<div class="sources"><strong>Sources :</strong> Manuel officiel d'Éducation Musicale et Théâtrale 3e année Pédagogie Générale (Édition 2025) ; référentiels d'art dramatique (compétences créer, interpréter, apprécier) ; attestation de la pratique théâtrale en 3e et 4e humanités en RDC.</div>
    `
},
{
    title: "Leçon 1 — Qu'est-ce que l'art dramatique ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une histoire racontée par un acteur nous touche-t-elle plus qu'un simple récit ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir l'art dramatique. Comprendre ses trois compétences (créer, interpréter, apprécier). Distinguer théâtre et récit.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>L'<strong>art dramatique</strong> est l'art de jouer une action devant un public, avec le corps, la voix et la présence. Il s'appuie sur un texte (ou une improvisation), un espace (scène), des acteurs, et un public.</p>
<p>Le mot vient du grec <em>drama</em> (« action ») : au théâtre, ce qui compte, c'est ce qui <em>se passe</em>, pas seulement ce qui se dit.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Trois compétences</div>
<ul>
<li><strong>Créer :</strong> inventer des situations, des personnages, des séquences dramatiques.</li>
<li><strong>Interpréter :</strong> jouer un rôle en utilisant son corps et sa voix.</li>
<li><strong>Apprécier :</strong> observer une production théâtrale et en parler avec des critères.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Théâtre et récit</div>
<ul>
<li><strong>Récit :</strong> on raconte une histoire ; le narrateur parle.</li>
<li><strong>Théâtre :</strong> on montre une histoire ; les personnages agissent et parlent devant un public.</li>
</ul>
<p>Le théâtre suppose une présence : un corps, une voix, un espace, une relation au spectateur.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les trois compétences de l'art dramatique.</p>
<p><strong>Ex. 2 :</strong> Distingue récit et théâtre.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Créer, interpréter, apprécier. <strong>2)</strong> Récit : raconter ; théâtre : jouer devant un public.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'art dramatique est un art de l'action jouée : il combine création, interprétation et appréciation.</p></div>
<div class="sources"><strong>Sources :</strong> Référentiels d'art dramatique ; manuel officiel 3e PG.</div>
    `
},
{
    title: "Leçon 2 — Le corps et la voix : échauffement",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un acteur s'échauffe-t-il avant de jouer ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le rôle de l'échauffement. Pratiquer un échauffement corporel et vocal. Créer un rituel de début de séance.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Pourquoi s'échauffer</div>
<p>L'échauffement prépare le corps et la voix à jouer :</p>
<ul>
<li>il évite les blessures (voix forcée, muscles tendus) ;</li>
<li>il libère les tensions ;</li>
<li>il favorise la concentration et la disponibilité ;</li>
<li>il installe un climat de confiance dans le groupe.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Échauffement corporel</div>
<ul>
<li><strong>Respiration :</strong> inspirer profondément, expirer lentement.</li>
<li><strong>Relaxation :</strong> relâcher les épaules, la nuque, la mâchoire.</li>
<li><strong>Mobilisation :</strong> articulations (chevilles, genoux, hanches, épaules, nuque).</li>
<li><strong>Étirements doux :</strong> sans forcer.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Échauffement vocal</div>
<ul>
<li><strong>Respiration :</strong> souffle régulier, appui sur le diaphragme.</li>
<li><strong>Résonance :</strong> faire vibrer les voyelles (a, o, i).</li>
<li><strong>Diction :</strong> articuler nettement les consonnes (exercices de virelangues).</li>
<li><strong>Projection :</strong> parler à voix haute sans crier.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Rituel de début</div>
<p>Un rituel fixe et stable aide le groupe à entrer dans la séance :</p>
<ol>
<li>Un cercle de début.</li>
<li>Une courte respiration collective.</li>
<li>Un mot ou un geste partagé.</li>
<li>Annonce du programme de la séance.</li>
</ol>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite deux éléments de l'échauffement corporel et deux de l'échauffement vocal.</p>
<p><strong>Ex. 2 :</strong> Propose un rituel de début pour ta classe.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Corporel : respiration, mobilisation articulaire. Vocal : résonance, diction. <strong>2)</strong> Cercle, respiration, mot partagé, annonce.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'échauffement prépare le corps et la voix ; un rituel fixe installe la confiance et la disponibilité.</p></div>
<div class="sources"><strong>Sources :</strong> Référentiels d'art dramatique.</div>
    `
},
{
    title: "Leçon 3 — L'improvisation guidée",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment jouer une scène sans texte, sans savoir à l'avance ce qui va se passer ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le principe de l'improvisation. Appliquer les règles de base. Jouer à deux sur un thème donné.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition</div>
<p>L'<strong>improvisation</strong> est l'invention d'une scène en temps réel, sans texte préparé, à partir d'un thème, d'un lieu ou d'une contrainte. Elle développe l'écoute, la réactivité et la créativité.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Règles de l'impro</div>
<ul>
<li><strong>Accepter l'offre :</strong> quand un partenaire propose une idée, on la prend comme point de départ. On ne dit pas « non », on dit « oui, et… ».</li>
<li><strong>Écouter :</strong> on réagit à ce que dit et fait l'autre, pas à ce qu'on avait prévu.</li>
<li><strong>Construire ensemble :</strong> on fait avancer l'histoire à deux, pas seul.</li>
<li><strong>Rester dans le cadre :</strong> on respecte le thème, le temps, l'espace.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Improvisation guidée</div>
<p>Le professeur peut donner :</p>
<ul>
<li><strong>un thème :</strong> « une rencontre au marché », « une dispute entre voisins » ;</li>
<li><strong>un lieu :</strong> « à la gare », « dans une cuisine » ;</li>
<li><strong>une contrainte :</strong> « sans se parler », « avec un seul mot ».</li>
</ul>
<p>Les contraintes stimulent l'imagination et évitent les stéréotypes.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois règles de l'improvisation.</p>
<p><strong>Ex. 2 :</strong> Improviser à deux sur le thème « au marché ».</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Accepter l'offre, écouter, construire ensemble. <strong>2)</strong> La scène doit être improvisée sans texte appris.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Improviser, c'est écouter et accepter l'offre de l'autre pour construire une scène ensemble, dans le cadre donné.</p></div>
<div class="sources"><strong>Sources :</strong> Référentiels d'art dramatique.</div>
    `
},
{
    title: "Leçon 4 — Le mime et le jeu sans parole",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment raconter une histoire sans prononcer un seul mot ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le mime. Développer l'expressivité du corps. Jouer une courte scène muette.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le mime</div>
<p>Le <strong>mime</strong> est un jeu sans parole, qui repose sur :</p>
<ul>
<li><strong>le geste :</strong> dessiner l'objet, l'espace, l'action ;</li>
<li><strong>le regard :</strong> orienter l'attention du spectateur ;</li>
<li><strong>le rythme :</strong> varier les vitesses pour créer du sens ;</li>
<li><strong>l'imaginaire :</strong> faire exister un objet absent (une porte, une corde).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Règles du mime</div>
<ul>
<li>Préciser les gestes : la main doit « tenir » un objet imaginaire avec la bonne forme.</li>
<li>Rester dans la logique : si l'on tient un verre, il a un poids et un contenu.</li>
<li>Économiser les gestes : éviter le surplus.</li>
<li>Regarder ce que l'on fait : le regard oriente l'imaginaire du public.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Exercices</div>
<ul>
<li><strong>Mimer un objet :</strong> un téléphone, un peigne, un ballon.</li>
<li><strong>Mimer une action :</strong> se lever, se laver, ouvrir une porte.</li>
<li><strong>Mimer une émotion :</strong> la surprise, la peur, la joie.</li>
<li><strong>Mimer une scène :</strong> deux personnes qui se croisent.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois éléments du mime.</p>
<p><strong>Ex. 2 :</strong> Mime une action simple devant le groupe.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Geste, regard, rythme. <strong>2)</strong> Le mime doit être précis et lisible.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le mime raconte par le geste et le regard : la précision et la logique remplacent la parole.</p></div>
<div class="sources"><strong>Sources :</strong> Référentiels d'art dramatique.</div>
    `
},
{
    title: "Leçon 5 — Le personnage : construction et jeu",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment devient-on quelqu'un d'autre sur scène ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la construction d'un personnage. Identifier ses éléments (physique, voix, motivation). Jouer un personnage simple.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Qu'est-ce qu'un personnage ?</div>
<p>Un <strong>personnage</strong> est une construction de l'acteur : il n'est pas la personne de l'acteur, mais une figure inventée ou reprise d'un texte, avec des traits et une histoire.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Éléments du personnage</div>
<ul>
<li><strong>Physique :</strong> âge, posture, démarche, gestes habituels.</li>
<li><strong>Voix :</strong> timbre, débit, intonation.</li>
<li><strong>Motivation :</strong> ce que le personnage veut, craint, cache.</li>
<li><strong>Relation aux autres :</strong> dominant, dominé, complice, opposant.</li>

    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
