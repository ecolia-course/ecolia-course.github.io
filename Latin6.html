<div class="bloc cas"><div class="bloc-label">Situation</div><p>Au début de l'année, ton professeur de Latin te demande : « Pourquoi étudier une langue qui n'est plus parlée ? » Tu découvres que le latin est la racine de nombreuses langues modernes et la clé de la civilisation romaine.</p></div>
<h3>1. Pourquoi étudier le latin ?</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Élargissement culturel</strong> : connaissance de la civilisation latine, des institutions, des mœurs et de l'art romain.</li><li><strong>Compréhension de la Rome antique</strong> : comment une civilisation originale s'est créée à partir de la rencontre de Rome avec divers peuples.</li><li><strong>Compréhension du monde actuel</strong> : plusieurs civilisations contemporaines restent héritières de la civilisation gréco-latine.</li><li><strong>Raffinement du jugement</strong> : étude thématique des auteurs et de leurs œuvres.</li><li><strong>Fondement des langues romanes</strong> : français, italien, espagnol, portugais, roumain.</li></ul></div>
<h3>2. L'alphabet et la prononciation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Alphabet latin</strong> : 23 lettres (pas de J, U, W à l'origine).</li><li><strong>Prononciation</strong> : le « c » se prononce [k], le « g » se prononce [g], le « v » se prononce [w].</li><li><strong>Diphtongues</strong> : ae [è], oe [è], au [ao], eu [éou].</li><li><strong>Accentuation</strong> : jamais sur la dernière syllabe ; règles de la pénultième.</li></ul></div>
<h3>3. Les cas et les déclinaisons</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>6 cas</strong> : nominatif (sujet), vocatif (apostrophe), accusatif (COD), génitif (complément du nom), datif (COI), ablatif (compléments circonstanciels).</li><li><strong>5 déclinaisons</strong> : selon la terminaison du génitif singulier.</li><li><strong>Rôle des cas</strong> : en latin, la fonction du mot est indiquée par sa terminaison, non par sa position dans la phrase.</li></ul></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div><p><strong>1re conjugaison : amare (aimer)</strong></p><ul><li>amo (j'aime)</li><li>amas (tu aimes)</li><li>amat (il aime)</li><li>amamus (nous aimons)</li><li>amatis (vous aimez)</li><li>amant (ils aiment)</li></ul><p><strong>2e conjugaison : videre (voir)</strong></p><ul><li>video, vides, videt, videmus, videtis, vident</li></ul><p><strong>3e conjugaison : legere (lire)</strong></p><ul><li>lego, legis, legit, legimus, legitis, legunt</li></ul><p><strong>4e conjugaison : audire (entendre)</strong></p><ul><li>audio, audis, audit, audimus, auditis, audiunt</li></ul></div>

    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');

        { text:"Combien de consuls gouvernaient la République romaine ?", options:["1","2","3"], correct:1 },
        { text:"Quelle assemblée contrôlait les finances à Rome ?", options:["Le Sénat","Les comices","Le tribunat"], correct:0 },
        { text:"Qui défendait les intérêts de la plèbe ?", options:["Les consuls","Les tribuns","Les censeurs"], correct:1 },
        { text:"Qu'est-ce que le « cursus honorum » ?", options:["La carrière des honneurs","Le droit romain","La religion romaine"], correct:0 },
        { text:"Quelle est la première codification du droit romain ?", options:["Loi des XII Tables","Code de Justinien","Édit perpétuel"], correct:0 },
        { text:"Quel est le nominatif pluriel de « rosa » ?", options:["rosae","rosas","rosarum"], correct:0 },
        { text:"Quel est l'accusatif singulier de « dominus » ?", options:["dominus","dominum","domini"], correct:1 },
        { text:"Quel est l'ablatif singulier de « rex » ?", options:["rex","regem","rege"], correct:2 },
        { text:"Quel est le nominatif pluriel de « exercitus » ?", options:["exercitus","exercitum","exercituum"], correct:0 },
        { text:"Quel est le génitif pluriel de « res » ?", options:["rerum","rebus","rei"], correct:0 },
        { text:"Quel est le présent de l'indicatif, 3e pers. sg. de « amare » ?", options:["amo","amas","amat"], correct:2 },
        { text:"Quel est le parfait de « videre » ?", options:["vidi","video","visi"], correct:0 },
        { text:"Que signifie « puer » ?", options:["Le père","L'enfant","Le maître"], correct:1 },
        { text:"Que signifie « bellum » ?", options:["La guerre","La beauté","La paix"], correct:0 },
        { text:"Que signifie « res » ?", options:["La chose","Le roi","La loi"], correct:0 }
    ];
    let html = '';
    questions.forEach((q,i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o,k) => { html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>'; });
        html += '</div>';
    });
    document.getElementById('quizQuestions').innerHTML = html;
    document.getElementById('submitQuiz').onclick = () => {
        let score = 0;
        questions.forEach((q,i) => {
            const s = document.querySelector('input[name="q' + i + '"]:checked');
            if (s && parseInt(s.value) === q.correct) score++;
        });
        const pct = Math.round(score/questions.length*100);
        document.getElementById('quizResult').innerHTML = '<div style="background:#d7ccc8;padding:16px;border-radius:10px;margin-top:14px;"><strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong><br>' + (score === questions.length ? 'Excellent. Tu maîtrises le programme.' : score >= 21 ? 'Bien. Revoyez les leçons où vous avez échoué.' : 'Relis attentivement les leçons avant l\'examen.') + '</div>';
    };
}
function renderSlide(index, keepHighlight = true) {
    const isQuiz = (index === slides.length - 1);
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    if (isQuiz) renderQuiz();
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm && !isQuiz) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>
</body>
</html>
