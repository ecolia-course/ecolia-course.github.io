    title: "Leçon 1 — Sécurité, matériel et environnement de travail numérique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi un ordinateur tombe-t-il souvent en panne en RDC ? Comment protéger ses données ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les composants d'un ordinateur. Adopter un branchement sûr. Sauvegarder ses données. Protéger ses informations personnelles. Prérequis : connaissance élémentaire de Windows et des fichiers.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Composants d'un ordinateur :</strong></p>
<ul>
<li><strong>Unité centrale :</strong> « cerveau » de l'ordinateur (processeur, mémoire, disque dur).</li>
<li><strong>Périphériques d'entrée :</strong> clavier, souris, scanner, microphone, webcam.</li>
<li><strong>Périphériques de sortie :</strong> écran, imprimante, haut-parleurs.</li>
<li><strong>Périphériques de stockage :</strong> clé USB, disque externe, carte mémoire.</li>
</ul>
<p><strong>Branchement sécurisé :</strong></p>
<ul>
<li>Vérifier la tension (220 V en RDC) et l'adaptateur.</li>
<li>Utiliser une prise reliée à la terre quand c'est possible.</li>
<li>Utiliser un <strong>onduleur</strong> ou un <strong>régulateur</strong> pour amortir les coupures et les surtensions.</li>
<li>Panneau solaire : alternative utile dans les zones sans électricité stable.</li>
</ul>
<p><strong>Sauvegarde des données :</strong> copier régulièrement ses fichiers sur une clé USB, un disque externe ou un espace en ligne (cloud). Une sauvegarde = au moins deux copies.</p>
<p><strong>Protection des données :</strong></p>
<ul>
<li>Mot de passe fort (majuscules, minuscules, chiffres, symboles).</li>
<li>Ne pas partager ses mots de passe.</li>
<li>Chiffrement des données sensibles.</li>
<li>Verrouiller l'appareil en cas d'absence.</li>
</ul>
<p><strong>Erreurs fréquentes :</strong> brancher sans vérifier la tension ; ne jamais sauvegarder ; utiliser « 1234 » comme mot de passe ; laisser un appareil sans surveillance.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Unité centrale :</strong> boîtier qui contient le processeur et la mémoire. <strong>Périphérique :</strong> appareil connecté à l'ordinateur. <strong>Onduleur :</strong> appareil qui fournit du courant en cas de coupure. <strong>Chiffrement :</strong> transformation des données pour les rendre illisibles sans la clé.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Vérifier la tension avant branchement. Utiliser un régulateur ou un onduleur. Sauvegarder au moins une fois par semaine. Choisir un mot de passe fort et le garder secret.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Dans un foyer de Matete (Kinshasa), un élève branche un panneau solaire usagé pour alimenter un ordinateur d'occasion. Il sauvegarde ses devoirs numériques sur une clé USB et sur un espace en ligne. En cas de coupure de courant, l'onduleur lui laisse le temps d'enregistrer et d'éteindre proprement.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois périphériques d'entrée. <strong>Ex. 2 :</strong> Pourquoi utiliser un onduleur ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Clavier, souris, scanner (autres réponses possibles). <strong>2)</strong> Pour amortir les coupures et les surtensions, et éviter de perdre des données.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La sécurité matérielle et la sauvegarde sont les fondations de tout travail numérique.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel d'Informatique 2e Année des Humanités (Édition 2025) ; Plan de cours TIC 2e année.</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment produire un document propre et une présentation claire pour un exposé ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Créer, mettre en forme et enregistrer un document texte. Insérer images et tableaux. Créer une présentation simple. Prérequis : leçon 1 ; gestion élémentaire des fichiers.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Traitement de texte (Word ou équivalent) :</strong></p>
<ul>
<li>Créer un document : taper le texte, corriger l'orthographe, enregistrer (Ctrl+S).</li>
<li>Mettre en forme : polices, tailles, gras, italique, alignements.</li>
<li>Insérer une image (Insertion → Image).</li>
<li>Insérer un tableau (Insertion → Tableau).</li>
<li>Enregistrer sous un nouveau nom (Fichier → Enregistrer sous).</li>
</ul>
<p><strong>Présentation assistée (PowerPoint ou équivalent) :</strong></p>
<ul>
<li>Créer une diapositive de titre, puis des diapositives de contenu.</li>
<li>Choisir un thème sobre.</li>
<li>Insérer des images, des listes à puces.</li>
<li>Éviter de surcharger les diapositives de texte.</li>
</ul>
<p><strong>Bonnes pratiques :</strong> une idée par diapositive ; 5 à 7 lignes maximum par diapositive ; police lisible ; contraste suffisant ; cohérence visuelle ; relecture orthographique.</p>
<p><strong>Erreurs fréquentes :</strong> abuser des polices et des couleurs ; surcharger les diapositives ; négliger l'orthographe ; oublier d'enregistrer avant fermeture.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Mise en forme :</strong> modification de l'apparence du texte. <strong>Diapositive :</strong> page d'une présentation. <strong>Format :</strong> type de fichier (docx, pptx, pdf).</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Planifier le document avant de taper. Utiliser un style sobre et cohérent. Enregistrer régulièrement. Se relire. Vérifier l'orthographe avant impression ou présentation.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Pour un exposé sur la pollution à Kinshasa : rédiger un rapport de deux pages dans Word (titre, introduction, deux paragraphes, une image, un tableau de chiffres), puis préparer trois diapositives dans PowerPoint (titre, causes, solutions).</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle commande permet d'enregistrer un document sous un nouveau nom ? <strong>Ex. 2 :</strong> Cite deux règles pour une bonne présentation.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Fichier → Enregistrer sous. <strong>2)</strong> Une idée par diapositive ; éviter de surcharger de texte (autres réponses possibles).</p>
</details>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La clarté et la sobriété sont les maîtres-mots de la bureautique.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel TIC 2e Année, Options Scientifiques (Édition 2025) ; Plan de cours TIC 2e année.</div>

    title: "Leçon 3 — Tableur : calculs, formules et graphiques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment calculer automatiquement la moyenne d'une classe, ou le budget mensuel d'une petite entreprise ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Utiliser les formules de base. Comprendre les références relatives et absolues. Créer un graphique simple. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Structure d'un tableur (Excel, LibreOffice Calc) :</strong> colonnes (A, B, C…) et lignes (1, 2, 3…) ; une cellule = intersection d'une colonne et d'une ligne (ex. A1).</p>
<p><strong>Formules de base :</strong> une formule commence toujours par <strong>=</strong>.</p>
<ul>
<li><strong>Somme :</strong> =SOMME(A1:A10) ou =A1+A2+A3.</li>
<li><strong>Moyenne :</strong> =MOYENNE(A1:A10).</li>
<li><strong>Maximum :</strong> =MAX(A1:A10) ; <strong>minimum :</strong> =MIN(A1:A10).</li>
<li><strong>Nombre :</strong> =NB(A1:A10) ou =NBVAL(A1:A10).</li>
<li><strong>Condition :</strong> =SI(A1&gt;=10;"Admis";"Ajourné").</li>
</ul>
<p><strong>Références relatives et absolues :</strong></p>
<ul>
<li><strong>Relative :</strong> A1 — change lorsqu'on copie la formule.</li>
<li><strong>Absolue :</strong> $A$1 — ne change pas lors de la copie.</li>
<li><strong>Mixte :</strong> $A1 ou A$1 — seule la ligne ou la colonne est figée.</li>
</ul>
<p><strong>Graphiques :</strong></p>
<ul>
<li><strong>Histogramme :</strong> compare des catégories.</li>
<li><strong>Courbe :</strong> montre une évolution dans le temps.</li>
<li><strong>Camembert :</strong> montre des répartitions (proportions).</li>
</ul>
<p><strong>Erreurs fréquentes :</strong> oublier le = au début ; confondre référence relative et absolue ; choisir un graphique inadapté aux données.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Cellule :</strong> case du tableur où l'on saisit une donnée. <strong>Formule :</strong> expression de calcul commençant par =. <strong>Référence absolue :</strong> référence figée avec le signe $.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Commencer toute formule par =. Vérifier les cellules sélectionnées. Utiliser les références absolues quand une cellule ne doit pas changer lors de la copie. Choisir le graphique selon le type de données.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Pour calculer la moyenne des notes d'un élève en B2 à B11 : =MOYENNE(B2:B11). Pour calculer la moyenne de la classe : =MOYENNE(B2:B11). Pour appliquer un taux de TVA constant en C1 : =B2*$C$1 (la référence $C$1 ne bouge pas lors de la copie).</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle formule calcule la somme des cellules A1 à A10 ? <strong>Ex. 2 :</strong> Quelle est la différence entre A1 et $A$1 ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> =SOMME(A1:A10). <strong>2)</strong> A1 est une référence relative (change à la copie) ; $A$1 est une référence absolue (ne change pas).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une formule commence toujours par = ; le choix du graphique dépend du type de données.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel TIC 2e Année, Options Scientifiques (Édition 2025) ; Plan de cours TIC 2e année.</div>
    `

    title: "Leçon 4 — Internet, recherche d'information et communication numérique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment vérifier qu'une information trouvée sur Internet est fiable ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Utiliser un navigateur et un moteur de recherche. Évaluer la fiabilité d'une source. Communiquer numériquement de manière responsable. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Navigateur :</strong> logiciel qui permet de consulter des sites web (Chrome, Firefox, Edge). <strong>Moteur de recherche :</strong> service qui trouve des pages correspondant à des mots-clés (Google, Bing, DuckDuckGo).</p>
<p><strong>Évaluer la fiabilité d'une source :</strong></p>
<ul>
<li><strong>Auteur :</strong> qui a écrit ? est-ce un expert, une institution ?</li>
<li><strong>Date :</strong> l'information est-elle récente ?</li>

    title: "Leçon 5 — Initiation à l'algorithmique : boucles, tableaux, fonctions",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment demander à un ordinateur de répéter une tâche, de ranger des données et de réutiliser un calcul ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les boucles, les tableaux et les fonctions. Écrire un pseudo-code simple. Prérequis : notions de logique (condition, instruction).</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Boucle :</strong> structure qui répète une instruction un certain nombre de fois ou jusqu'à une condition.</p>
<ul>
<li><strong>Boucle « Pour » (à comptage) :</strong> répète un nombre connu de fois.</li>
<li><strong>Boucle « Tant que » (conditionnelle) :</strong> répète tant que la condition est vraie.</li>
</ul>
<p><strong>Tableau :</strong> structure de données qui stocke plusieurs valeurs de même type sous un même nom, accessible par des indices.</p>
<p>Exemple : notes[1], notes[2], … notes[10]. Le tableau « notes » stocke 10 notes.</p>
<p><strong>Fonction :</strong> sous-programme qui effectue une tâche précise et peut retourner un résultat. Elle permet de réutiliser le code et de structurer le programme.</p>
<p><strong>Pseudo-code — exemple de boucle :</strong></p>
<pre style="background:#f0f0f0;padding:10px;border-radius:6px;font-family:monospace;font-size:0.9rem;">
Pour i de 1 à 10 Faire
    Écrire(i)
Fin Pour
</pre>
<p><strong>Pseudo-code — exemple avec tableau et fonction :</strong></p>
<pre style="background:#f0f0f0;padding:10px;border-radius:6px;font-family:monospace;font-size:0.9rem;">
Notes ← [12, 15, 9, 18, 14]
Somme ← 0
Pour i de 1 à 5 Faire
    Somme ← Somme + Notes[i]
Fin Pour
Moyenne ← Somme / 5
Écrire(Moyenne)
</pre>
<p><strong>Erreurs fréquentes :</strong> oublier la condition d'arrêt d'une boucle (boucle infinie) ; dépasser les indices d'un tableau ; confondre fonction et procédure.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Boucle :</strong> structure de répétition. <strong>Tableau :</strong> collection indexée de valeurs. <strong>Fonction :</strong> sous-programme réutilisable. <strong>Pseudo-code :</strong> langage simplifié pour décrire un algorithme.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Écrire l'algorithme en pseudo-code avant de programmer. Vérifier la condition d'arrêt des boucles. Vérifier les indices des tableaux (commencent souvent à 1 en pseudo-code, à 0 dans certains langages). Structurer le programme en fonctions.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Algorithme qui affiche les nombres pairs de 2 à 20 :</p>
<pre style="background:#f0f0f0;padding:10px;border-radius:6px;font-family:monospace;font-size:0.9rem;">
Pour i de 2 à 20 Pas 2 Faire
    Écrire(i)
Fin Pour
</pre>
</div>

  var CFG = {"code":"TIC2","base":"https://ecolia-course.github.io/ecolia-media/audio_files/","available":[1,2,3,4,5,6,7],"count":7,"sizeMo":9,"sizes":{"1":657984,"2":1606656,"3":1385856,"4":1642368,"5":1625088,"6":1461696,"7":84096},"fallback":{"1":[["fr","Sommaire, T I C. Sommaire. Ce cours de T I C couvre cinq leçons essentielles: la sécurité et le matériel, la bureautique (traitement de texte et présentation), le tableur, l'Internet et la recherche d'information, et enfin une initiation à l'algorithmique (boucles, tableaux, fonctions). Note: il n'existe pas de programme officiel unique et intégral pour les T I C en 2e année des humanités générales dans les sources consultées. Ce cours articule les orientations confirmées (bureautique, Internet, sécurité) et une initiation à l'algorithmique issue des manuels d'informatique. La part respective de chaque dimension doit être vérifiée avec le programme officiel du MINEPST. Leçon 1, Sécurité, matériel et environnement de travail numérique. Leçon 2, Bureautique: traitement de texte et présentation. Leçon 3, Tableur: calculs, formules et graphiques. Leçon 4, Internet, recherche d'information et communication numérique. Leçon 5, Initiation à l'algorithmique: boucles, tableaux, fonctions. Une évaluation finale de 20 questions couvre l'ensemble des leçons."]],"2":[["fr","Leçon 1, Sécurité, matériel et environnement de travail numérique. Situation. « Pourquoi un ordinateur tombe-t-il souvent en panne en R D C? Comment protéger ses données? ». Objectifs. Identifier les composants d'un ordinateur. Adopter un branchement sûr. Sauvegarder ses données. Protéger ses informations personnelles. Prérequis: connaissance élémentaire de Windows et des fichiers. Théorie. Composants d'un ordinateur: Unité centrale: « cerveau » de l'ordinateur (processeur, mémoire, disque dur). Périphériques d'entrée: clavier, souris, scanner, microphone, webcam. Périphériques de sortie: écran, imprimante, haut-parleurs. Périphériques de stockage: clé USB, disque externe, carte mémoire. Branchement sécurisé: Vérifier la tension (220 V en R D C) et l'adaptateur. Utiliser une prise reliée à la terre quand c'est possible. Utiliser un onduleur ou un régulateur pour amortir les coupures et les surtensions. Panneau solaire: alternative utile dans les zones sans électricité stable. Sauvegarde des données: copier régulièrement ses fichiers sur une clé USB, un disque externe ou un espace en ligne (cloud). Une sauvegarde égale au moins deux copies. Protection des données: Mot de passe fort (majuscules, minuscules, chiffres, symboles). Ne pas partager ses mots de passe. Chiffrement des données sensibles. Verrouiller l'appareil en cas d'absence. Erreurs fréquentes: brancher sans vérifier la tension; ne jamais sauvegarder; utiliser « 1234 » comme mot de passe; laisser un appareil sans surveillance. Définitions. Unité centrale: boîtier qui contient le processeur et la mémoire. Périphérique: appareil connecté à l'ordinateur. Onduleur: appareil qui fournit du courant en cas de coupure. Chiffrement: transformation des données pour les rendre illisibles sans la clé. Méthodes et règles. Vérifier la tension avant branchement. Utiliser un régulateur ou un onduleur. Sauvegarder au moins une fois par semaine. Choisir un mot de passe fort et le garder secret. Exemple. Dans un foyer de Matete (Kinshasa), un élève branche un panneau solaire usagé pour alimenter un ordinateur d'occasion. Il sauvegarde ses devoirs numériques sur une clé USB et sur un espace en ligne. En cas de coupure de courant, l'onduleur lui laisse le temps d'enregistrer et d'éteindre proprement. Exercices. Ex. 1: Cite trois périphériques d'entrée. Ex. 2: Pourquoi utiliser un onduleur? Corrigé. 1) Clavier, souris, scanner (autres réponses possibles). 2) Pour amortir les coupures et les surtensions, et éviter de perdre des données. À retenir. La sécurité matérielle et la sauvegarde sont les fondations de tout travail numérique."]],"3":[["fr","Leçon 2, Bureautique: traitement de texte et présentation. Situation. « Comment produire un document propre et une présentation claire pour un exposé? ». Objectifs. Créer, mettre en forme et enregistrer un document texte. Insérer images et tableaux. Créer une présentation simple. Prérequis: leçon 1; gestion élémentaire des fichiers. Théorie. Traitement de texte (Word ou équivalent): Créer un document: taper le texte, corriger l'orthographe, enregistrer (Ctrl plus S). Mettre en forme: polices, tailles, gras, italique, alignements. Insérer une image (Insertion, donc Image). Insérer un tableau (Insertion, donc Tableau). Enregistrer sous un nouveau nom (Fichier, donc Enregistrer sous). Présentation assistée (PowerPoint ou équivalent): Créer une diapositive de titre, puis des diapositives de contenu. Choisir un thème sobre. Insérer des images, des listes à puces. Éviter de surcharger les diapositives de texte. Bonnes pratiques: une idée par diapositive; 5 à 7 lignes maximum par diapositive; police lisible; contraste suffisant; cohérence visuelle; relecture orthographique. Erreurs fréquentes: abuser des polices et des couleurs; surcharger les diapositives; négliger l'orthographe; oublier d'enregistrer avant fermeture. Définitions. Mise en forme: modification de l'apparence du texte. Diapositive: page d'une présentation. Format: type de fichier (docx, pptx, pdf). Méthodes et règles. Planifier le document avant de taper. Utiliser un style sobre et cohérent. Enregistrer régulièrement. Se relire. Vérifier l'orthographe avant impression ou présentation. Exemple. Pour un exposé sur la pollution à Kinshasa: rédiger un rapport de deux pages dans Word (titre, introduction, deux paragraphes, une image, un tableau de chiffres), puis préparer trois diapositives dans PowerPoint (titre, causes, solutions). Exercices. Ex. 1: Quelle commande permet d'enregistrer un document sous un nouveau nom? Ex. 2: Cite deux règles pour une bonne présentation. Corrigé. 1) Fichier, donc Enregistrer sous. 2) Une idée par diapositive; éviter de surcharger de texte (autres réponses possibles). À retenir. La clarté et la sobriété sont les maîtres-mots de la bureautique."]],"4":[["fr","Leçon 3, Tableur: calculs, formules et graphiques. Situation. « Comment calculer automatiquement la moyenne d'une classe, ou le budget mensuel d'une petite entreprise? ». Objectifs. Utiliser les formules de base. Comprendre les références relatives et absolues. Créer un graphique simple. Prérequis: leçons 1 et 2. Théorie. Structure d'un tableur (Excel, LibreOffice Calc): colonnes (A, B, C…) et lignes (1, 2, 3…); une cellule égale intersection d'une colonne et d'une ligne (ex. A1). Formules de base: une formule commence toujours par égale. Somme: égale SOMME(A1:A10) ou égale A1 plus A2 plus A3. Moyenne: égale MOYENNE(A1:A10). Maximum: égale MAX(A1:A10); minimum: égale MIN(A1:A10). Nombre: égale NB(A1:A10) ou égale NBVAL(A1:A10). Condition: égale SI(A1 supérieur ou égal à 10;\"Admis\";\"Ajourné\"). Références relatives et absolues: Relative: A1, change lorsqu'on copie la formule. Absolue: $A$1, ne change pas lors de la copie. Mixte: $A1 ou A$1, seule la ligne ou la colonne est figée. Graphiques: Histogramme: compare des catégories. Courbe: montre une évolution dans le temps. Camembert: montre des répartitions (proportions). Erreurs fréquentes: oublier le égale au début; confondre référence relative et absolue; choisir un graphique inadapté aux données. Définitions. Cellule: case du tableur où l'on saisit une donnée. Formule: expression de calcul commençant par égale. Référence absolue: référence figée avec le signe $. Méthodes et règles. Commencer toute formule par égale. Vérifier les cellules sélectionnées. Utiliser les références absolues quand une cellule ne doit pas changer lors de la copie. Choisir le graphique selon le type de données. Exemple. Pour calculer la moyenne des notes d'un élève en B2 à B11: égale MOYENNE(B2:B11). Pour calculer la moyenne de la classe: égale MOYENNE(B2:B11). Pour appliquer un taux de TVA constant en C1: égale B2*$C$1 (la référence $C$1 ne bouge pas lors de la copie). Exercices. Ex. 1: Quelle formule calcule la somme des cellules A1 à A10? Ex. 2: Quelle est la différence entre A1 et $A$1? Corrigé. 1) égale SOMME(A1:A10). 2) A1 est une référence relative (change à la copie); $A$1 est une référence absolue (ne change pas). À retenir. Une formule commence toujours par égale; le choix du graphique dépend du type de données."]],"5":[["fr","Leçon 4, Internet, recherche d'information et communication numérique. Situation. « Comment vérifier qu'une information trouvée sur Internet est fiable? ». Objectifs. Utiliser un navigateur et un moteur de recherche. Évaluer la fiabilité d'une source. Communiquer numériquement de manière responsable. Prérequis: leçons 1 à 3. Théorie. Navigateur: logiciel qui permet de consulter des sites web (Chrome, Firefox, Edge). Moteur de recherche: service qui trouve des pages correspondant à des mots-clés (Google, Bing, DuckDuckGo). Évaluer la fiabilité d'une source: Auteur: qui a écrit? est-ce un expert, une institution? Date: l'information est-elle récente? Source: site officiel, institutionnel, universitaire, ou blog anonyme? Objectivité: y a-t-il un intérêt commercial ou politique? Recoupement: la même information est-elle confirmée par d'autres sources fiables? Identité numérique: ensemble des traces laissées en ligne (profils, publications, commentaires). Elle peut être positive ou négative, et reste souvent visible longtemps. Netiquette: règles de politesse et de respect en ligne: ne pas insulter, ne pas diffuser de rumeurs, ne pas partager de données personnelles d'autrui sans consentement. Communication numérique: messagerie électronique, applications de messagerie, visioconférence. Attention à la sécurité des mots de passe, aux pièces jointes suspectes (phishing), aux informations personnelles partagées. Erreurs fréquentes: croire tout ce qui est publié; partager des informations personnelles sans prudence; ouvrir des pièces jointes inconnues; diffuser des rumeurs. Définitions. Navigateur: logiciel de consultation du web. Moteur de recherche: outil de recherche sur le web. Identité numérique: traces laissées en ligne. Netiquette: règles de bonne conduite en ligne. Méthodes et règles. Rechercher avec des mots-clés précis. Comparer au moins deux sources fiables. Vérifier la date et l'auteur. Ne pas partager d'informations personnelles sans nécessité. Respecter les autres en ligne. Exemple. Un élève cherche la population de la R D C en 2024. Il trouve trois sources: un site d'actualité, un blog personnel et la Banque mondiale. Il privilégie la Banque mondiale (source institutionnelle et récente), compare avec une seconde source fiable, et cite ses références dans son travail. Exercices. Ex. 1: Cite trois critères pour évaluer la fiabilité d'un site. Ex. 2: Que signifie « netiquette »? Corrigé. 1) Auteur, date, source institutionnelle (autres réponses possibles). 2) Règles de politesse et de respect à respecter en ligne. À retenir. Une information doit être vérifiée à la source avant d'être utilisée ou partagée."]],"6":[["fr","Leçon 5, Initiation à l'algorithmique: boucles, tableaux, fonctions. Situation. « Comment demander à un ordinateur de répéter une tâche, de ranger des données et de réutiliser un calcul? ». Objectifs. Comprendre les boucles, les tableaux et les fonctions. Écrire un pseudo-code simple. Prérequis: notions de logique (condition, instruction). Théorie. Boucle: structure qui répète une instruction un certain nombre de fois ou jusqu'à une condition. Boucle « Pour » (à comptage): répète un nombre connu de fois. Boucle « Tant que » (conditionnelle): répète tant que la condition est vraie. Tableau: structure de données qui stocke plusieurs valeurs de même type sous un même nom, accessible par des indices. Exemple: notes[1], notes[2], … notes[10]. Le tableau « notes » stocke 10 notes. Fonction: sous-programme qui effectue une tâche précise et peut retourner un résultat. Elle permet de réutiliser le code et de structurer le programme. Pseudo-code, exemple de boucle: Pour i de 1 à 10 Faire. Écrire(i). Fin Pour. Pseudo-code, exemple avec tableau et fonction: Notes ← [12, 15, 9, 18, 14]. Somme ← 0. Pour i de 1 à 5 Faire. Somme ← Somme plus Notes[i]. Fin Pour. Moyenne ← Somme ou 5. Écrire(Moyenne). Erreurs fréquentes: oublier la condition d'arrêt d'une boucle (boucle infinie); dépasser les indices d'un tableau; confondre fonction et procédure. Définitions. Boucle: structure de répétition. Tableau: collection indexée de valeurs. Fonction: sous-programme réutilisable. Pseudo-code: langage simplifié pour décrire un algorithme. Méthodes et règles. Écrire l'algorithme en pseudo-code avant de programmer. Vérifier la condition d'arrêt des boucles. Vérifier les indices des tableaux (commencent souvent à 1 en pseudo-code, à 0 dans certains langages). Structurer le programme en fonctions. Exemple. Algorithme qui affiche les nombres pairs de 2 à 20: Pour i de 2 à 20 Pas 2 Faire. Écrire(i). Fin Pour. Exercices. Ex. 1: Quel est le rôle d'une boucle? Ex. 2: Écris un pseudo-code qui affiche les nombres de 1 à 10. Corrigé. 1) Répéter une instruction plusieurs fois. 2) Pour i de 1 à 10 Faire ou Écrire(i) ou Fin Pour. À retenir. Une boucle répète, un tableau organise, une fonction structure."]],"7":[["fr","Évaluation finale, T I C. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 12 sur 20, tu as réussi."]]}};

      var txt = dl.state === "partial"
        ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet."
        : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
