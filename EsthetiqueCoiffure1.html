    title: "Leçon 1 — Hygiène, sécurité et posture professionnelle",

        <div class="bloc-cas">
            <h3>Situation de départ</h3>
            <p>Dans un salon, une coiffeuse utilise le même peigne pour plusieurs clientes sans le nettoyer. Quels risques cela présente-t-il ? Que devrait-elle faire ?</p>
        </div>

        <div class="bloc-theorie">
            <h3>Objectifs spécifiques</h3>
            <ul>
                <li>Énoncer les règles d'hygiène (mains, matériel, plan de travail).</li>
                <li>Identifier les risques (produits chimiques, allergies).</li>
                <li>Adopter une posture respectueuse.</li>
            </ul>

            <h3>Explication</h3>
            <p>L'<strong>hygiène</strong> protège la cliente et la coiffeuse. Le matériel doit être nettoyé et <strong>désinfecté</strong> entre deux clientes. Les produits doivent être utilisés selon les consignes, et les <strong>produits non contrôlés</strong> évités (risque d'allergie).</p>
            <p>La <strong>posture professionnelle</strong> inclut : écouter la cliente, respecter son <strong>consentement</strong>, garder la <strong>confidentialité</strong> et ne pas juger.</p>

            <figure class="bloc-image" data-image-id="EsthetiqueCoiffure1_L1_01">
                <div class="image-cadre">[ Image EsthetiqueCoiffure1_L1_01 : affiche des règles d'hygiène au salon ]</div>
                <figcaption>L'hygiène protège tout le monde.</figcaption>
            </figure>

            <h3>Notions et définitions</h3>
            <ul>
                <li><strong>Hygiène :</strong> ensemble des gestes qui protègent la santé.</li>
                <li><strong>Désinfection :</strong> nettoyage qui élimine les microbes.</li>
                <li><strong>Produits chimiques :</strong> substances à utiliser avec précaution.</li>
                <li><strong>Allergie :</strong> réaction du corps à un produit.</li>
                <li><strong>Consentement :</strong> accord libre de la cliente.</li>
                <li><strong>Confidentialité :</strong> non-divulgation des informations.</li>
                <li><strong>Posture professionnelle :</strong> attitude respectueuse et adaptée.</li>
            </ul>
        </div>

        <div class="bloc-exemple">

                <li>Réactions allergiques à des produits non contrôlés.</li>
                <li>Importance de laver les mains avant et après.</li>

                <li>Liste cinq règles d'hygiène pour un salon.</li>
                <li>Identifie trois risques liés aux produits chimiques.</li>
                <li>Explique en deux phrases ce qu'est le consentement.</li>
            </ol>
            <details>
                <summary>Corrigé</summary>
                <p><strong>1.</strong> Exemples : laver les mains, nettoyer le matériel entre deux clientes, laver le plan de travail, aérer la pièce, jeter les produits usagés.</p>
                <p><strong>2.</strong> Risques : allergies, brûlures, irritation du cuir chevelu.</p>

        <div class="bloc-cas">
            <h3>Situation de départ</h3>
            <p>Deux clientes ont des cheveux très différents : l'une a les cheveux crépus et secs, l'autre les cheveux raides et gras. Peut-on leur appliquer le même soin ? Pourquoi ?</p>

        <div class="bloc-theorie">
            <h3>Objectifs spécifiques</h3>
            <ul>
                <li>Décrire la structure du cheveu.</li>
                <li>Distinguer les types de cheveux (secs, gras, bouclés, raides).</li>
                <li>Identifier les besoins spécifiques.</li>
            </ul>

            <h3>Explication</h3>
            <p>Chaque cheveu a une structure (racine et tige) et un type. Les cheveux <strong>crépus</strong> sont souvent plus secs et fragiles ; les cheveux <strong>raides</strong> peuvent être plus gras. Connaître le type de cheveu permet d'adapter le soin et d'éviter les erreurs. Le <strong>cuir chevelu</strong> est la peau qui porte les cheveux : il peut être sensible, sec ou gras.</p>

            <figure class="bloc-image" data-image-id="EsthetiqueCoiffure1_L2_01">
                <div class="image-cadre">[ Image EsthetiqueCoiffure1_L2_01 : schéma de la structure du cheveu ]</div>

            </figure>

            <h3>Notions et définitions</h3>
            <ul>
                <li><strong>Structure du cheveu :</strong> racine (sous la peau) et tige (visible).</li>
                <li><strong>Cuir chevelu :</strong> peau qui porte les cheveux.</li>
                <li><strong>Type de cheveu :</strong> sec, gras, bouclé, raide.</li>
                <li><strong>Porosité :</strong> capacité du cheveu à absorber l'eau et les produits.</li>
                <li><strong>Sensibilité :</strong> réaction du cuir chevelu aux produits.</li>
            </ul>
        </div>

        <div class="bloc-exemple">

                <li>Sensibilité du cuir chevelu aux produits forts.</li>
            </ul>
        </div>

            </ol>

                <summary>Corrigé</summary>

        <div class="bloc-cas">
            <h3>Situation de départ</h3>

            </figure>

                <li><strong>Lavage :</strong> nettoyage du cheveu et du cuir chevelu.</li>
                <li><strong>Shampooing :</strong> produit lavant.</li>
                <li><strong>Après-shampooing :</strong> produit démêlant.</li>

    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
