<div class="sources"><strong>Sources :</strong> Programme national de Mathématiques (MEPST/DIPROMAD), manuels scolaires agréés. Wikimedia Commons (fiches des images).</div>

{
    title: "Leçon 1 — Les ensembles de nombres",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Peut-on compter des moutons avec un nombre négatif ? Un élève qui a 500 FC et qui en doit 800 est-il en "moins 300" ? Les mathématiciens ont inventé des ensembles pour organiser ces situations. »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Distinguer les ensembles ℕ, ℤ, 𝔻, ℚ. Utiliser les symboles d'appartenance et d'inclusion. Placer des nombres sur une droite graduée. Prérequis : savoir compter et comparer des entiers.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>ℕ (entiers naturels) :</strong> 0, 1, 2, 3… Ce sont les nombres pour compter.</p>
<p><strong>ℤ (entiers relatifs) :</strong> …, −3, −2, −1, 0, 1, 2, 3… Ils incluent les nombres négatifs (dettes, températures).</p>
<p><strong>𝔻 (nombres décimaux) :</strong> nombres avec un nombre fini de chiffres après la virgule (0,5 ; 3,25 ; −2,7).</p>
<p><strong>ℚ (nombres rationnels) :</strong> nombres sous la forme a/b avec b ≠ 0 (2/3, −5/4, 7 = 7/1).</p>
<p>Relations d'inclusion : ℕ ⊂ ℤ ⊂ 𝔻 ⊂ ℚ.</p>
</div>
<img src="images/Maths1_1.jpg" alt="Droite graduée avec nombres relatifs" data-image-id="Maths1_1" onerror="this.style.display='none'">
<img src="images/Maths1_2.jpg" alt="Diagramme des ensembles ℕ, ℤ, 𝔻, ℚ" data-image-id="Maths1_2" onerror="this.style.display='none'">

<h3>3. Méthodes et exemples</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p><strong>Appartenance :</strong> 5 ∈ ℕ, −3 ∈ ℤ. <strong>Droite graduée :</strong> −3 < −1 < 0 < 2. <strong>Valeur absolue :</strong> |−5| = 5. <strong>Opposé :</strong> l'opposé de −4 est 4.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un commerçant a 5 000 FC et emprunte 8 000 FC. Son solde est −3 000 FC (∈ ℤ, pas ∈ ℕ).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Ranger dans l'ordre croissant : −2 ; 0 ; 3 ; −0,5 ; 1.</p>
<p><strong>Ex. 2 :</strong> Quel est l'opposé de −7 ?</p>
<details><summary>Corrigé</summary>
<p>1) −2 < −0,5 < 0 < 1 < 3.</p>
<p>2) L'opposé de −7 est 7.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les ensembles ℕ, ℤ, 𝔻, ℚ emboîtent les nombres selon leurs propriétés ; la droite graduée permet de les ordonner.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Mathématiques (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 2 — Opérations sur les entiers et les relatifs",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un élève a 3 000 FC, gagne 2 000 FC puis perd 4 000 FC. Comment calculer son solde ? Comment additionner et soustraire des nombres négatifs ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Additionner et soustraire des entiers relatifs. Multiplier et diviser des entiers relatifs. Appliquer les règles des signes.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Addition :</strong> (+5) + (+3) = +8 ; (−4) + (−2) = −6. Si les signes sont différents : (−7) + (+3) = −4.</p>
<p><strong>Soustraction :</strong> soustraire, c'est ajouter l'opposé. (+7) − (−3) = (+7) + (+3) = +10.</p>
<p><strong>Multiplication / Division :</strong> (+)×(+) = + ; (−)×(−) = + ; (+)×(−) = − ; (−)×(+) = −.</p>
</div>
<img src="images/Maths1_3.jpg" alt="Thermomètre avec températures positives et négatives" data-image-id="Maths1_3" onerror="this.style.display='none'">

<h3>3. Méthodes et exemples</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour additionner deux relatifs : si même signe, additionner les valeurs absolues et garder le signe. Si signes contraires, soustraire et garder le signe du plus grand.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève a un solde de −2 000 FC. Il gagne 5 000 FC : (−2 000) + (+5 000) = +3 000 FC.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Calcule : (+9) + (−4) ; (−7) + (−3) ; (−5) − (−8) ; (−4) × (+3).</p>
<details><summary>Corrigé</summary>
<p>1) +5 ; −10 ; +3 ; −12.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les opérations sur les entiers relatifs reposent sur la règle des signes et sur l'usage de l'opposé.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Mathématiques (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 3 — Priorités opératoires et calcul mental",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« 2 + 3 × 4 = ? Certains disent 20, d'autres 14. Qui a raison ? Et pourquoi ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Respecter les priorités (parenthèses, multiplication, addition). Utiliser les propriétés pour calculer mentalement. Vérifier un résultat.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Priorités opératoires :</strong></p>
<ol>
<li>Parenthèses (les plus internes d'abord).</li>
<li>Puissances.</li>
<li>Multiplication et division (gauche à droite).</li>
<li>Addition et soustraction (gauche à droite).</li>
</ol>
<p>2 + 3 × 4 = 2 + 12 = 14. <strong>Distributivité :</strong> 7 × 12 = 7 × 10 + 7 × 2 = 84.</p>
</div>
<img src="images/Maths1_4.jpg" alt="Calcul mental sur une ardoise" data-image-id="Maths1_4" onerror="this.style.display='none'">

<h3>3. Méthodes et exemples</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Calculer 5 + 2 × (8 − 3) : parenthèses (8-3=5) ➔ multiplication (2×5=10) ➔ addition (5+10=15).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>3 cartons de savons à 5 000 FC et un sac à 12 000 FC : 3 × 5 000 + 12 000 = 27 000 FC.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Calcule : 7 + 3 × 6 ; (7 + 3) × 6 ; 20 − 4 × 3.</p>
<details><summary>Corrigé</summary>
<p>1) 25 ; 60 ; 8.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les priorités opératoires garantissent un résultat unique et correct ; le calcul mental s'appuie sur les propriétés des opérations.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Mathématiques (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 4 — Les fractions : sens et représentations",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un père partage un champ entre ses 4 enfants. Quelle part chacun reçoit-il ? Si l'un reçoit 2/4 et l'autre 1/2, ont-ils la même part ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre le sens d'une fraction. Simplifier et comparer des fractions. Reconnaître des fractions égales.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une fraction a/b représente a parts d'un tout partagé en b parts égales (b ≠ 0).</p>
<p><strong>Fractions égales :</strong> on ne change pas la valeur en multipliant ou divisant haut et bas par un même nombre. 2/4 = 1/2.</p>
<p><strong>Simplifier :</strong> diviser par le PGCD. 12/18 = 2/3.</p>
</div>
<img src="images/Maths1_5.jpg" alt="Gâteau partagé en parts égales" data-image-id="Maths1_5" onerror="this.style.display='none'">
<img src="images/Maths1_6.jpg" alt="Mangues sur un étal de marché" data-image-id="Maths1_6" onerror="this.style.display='none'">

<h3>3. Méthodes et exemples</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p><strong>Comparer :</strong> mettre au même dénominateur. 3/4 et 5/6 ➔ 9/12 et 10/12, donc 5/6 > 3/4.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une manne de 30 mangues divisée en 5 tas : 1/5 = 6 mangues. 2/5 = 12 mangues.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Simplifie : 12/18 ; 15/25.</p>
<p><strong>Ex. 2 :</strong> Compare 3/5 et 4/7.</p>
<details><summary>Corrigé</summary>
<p>1) 2/3 ; 3/5.</p>
<p>2) 3/5 = 21/35 ; 4/7 = 20/35 ; donc 3/5 > 4/7.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une fraction représente une part d'un tout ; simplification et comparaison s'appuient sur les fractions égales.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Mathématiques (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 5 — Opérations sur les fractions et les décimaux",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment additionner 1/2 et 1/3 ? Peut-on additionner les numérateurs et les dénominateurs ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Additionner et soustraire des fractions. Multiplier et diviser des fractions. Effectuer des opérations sur les décimaux.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Addition / Soustraction :</strong> il faut le même dénominateur. 1/2 + 1/3 = 3/6 + 2/6 = 5/6.</p>
<p><strong>Multiplication :</strong> on multiplie les numérateurs et les dénominateurs. 2/3 × 4/5 = 8/15.</p>
<p><strong>Division :</strong> multiplier par l'inverse. (2/3) ÷ (4/5) = (2/3) × (5/4) = 10/12 = 5/6.</p>
<p><strong>Décimaux :</strong> aligner les virgules pour l'addition. 0,4 × 0,3 = 0,12.</p>
</div>
<img src="images/Maths1_7.jpg" alt="Addition et multiplication de fractions" data-image-id="Maths1_7" onerror="this.style.display='none'">

<h3>3. Méthodes et exemples</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour l'addition : trouver un dénominateur commun (souvent le PPCM), additionner, puis simplifier.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un client achète 1/2 kg de viande et 1/3 kg de poisson. Total : 1/2 + 1/3 = 5/6 kg.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Calcule : 2/3 + 1/4 ; 3/4 × 2/5.</p>
<details><summary>Corrigé</summary>
<p>1) 11/12 ; 3/10.</p>
</details>
</div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Critères :</strong> par 2 (pair), par 3 (somme des chiffres), par 5 (finit par 0 ou 5).</p>
<p><strong>Nombre premier :</strong> divisible uniquement par 1 et lui-même (2, 3, 5, 7, 11…).</p>
<p><strong>Décomposition :</strong> 36 = 2² × 3² ; 24 = 2³ × 3.</p>
<p><strong>PGCD :</strong> facteurs communs avec les plus petits exposants. PGCD(24,36) = 2² × 3 = 12.</p>
<p><strong>PPCM :</strong> tous les facteurs avec les plus grands exposants. PPCM(24,36) = 2³ × 3² = 72.</p>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>

</div>

            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
