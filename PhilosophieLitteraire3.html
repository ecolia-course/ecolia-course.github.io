    title: "Sommaire — Philosophie Littéraire 3e année",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours de Philosophie Littéraire, propre à l'option Latin-Philosophie, articule trois domaines : l'épistémologie (argumentation), l'éthique et la philosophie politique (axiologie), la métaphysique (ontologie et théodicée). L'articulation avec la littérature est centrale : un texte littéraire peut poser une question philosophique, et la philosophie peut éclairer une œuvre.</p>
<p><strong>Note de transparence :</strong> le cours s'appuie sur le programme national de philosophie (EDIDEPS, 2007) et sur le manuel officiel de Philosophie de 3e année Latin-Philosophie. La répartition annuelle exacte des modules dans les extraits du programme de 2007 n'est pas détaillée ; la progression proposée suit le manuel de référence, à valider avec le programme en vigueur.</p>
<ul>
<li>Leçon 1 — Diagnostic : qu'est-ce que philosopher ?</li>
<li>Leçon 2 — Le langage philosophique et l'argumentation</li>
<li>Leçon 3 — Les fondements de la morale : bien, devoir, liberté</li>
<li>Leçon 4 — La responsabilité et le dilemme moral</li>
<li>Leçon 5 — Philosophie politique : l'État et la justice</li>
<li>Leçon 6 — Modèles politiques occidentaux et systèmes traditionnels congolais</li>
<li>Leçon 7 — Ontologie : l'être et la réalité</li>
<li>Leçon 8 — Théodicée : le problème du mal et l'existence de Dieu</li>
<li>Leçon 9 — La vision bantoue de l'univers</li>
<li>Leçon 10 — Bioéthique et écologie</li>
<li>Leçon 11 — Méthodologie de la dissertation philosophique</li>
<li>Leçon 12 — Synthèse et évaluation</li>
</ul>
<p>Une évaluation finale de 20 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme national de philosophie (EDIDEPS, 2007) ; manuel officiel de Philosophie 3e année Latin-Philosophie (Édition 2025).</div>
    `
},
{
    title: "Leçon 1 — Diagnostic : qu'est-ce que philosopher ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« La philosophie n'est-elle qu'une matière scolaire ? À quoi sert-elle vraiment ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la philosophie et son objet. Identifier ses traits caractéristiques. Distinguer philosophie, opinion, science, religion et art.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition de la philosophie</div>
<p>La <strong>philosophie</strong> est une démarche rationnelle et critique qui interroge les questions les plus générales de l'existence : qu'est-ce que le bien ? Qu'est-ce que la justice ? Qu'est-ce qu'être ? Quel sens donner à la vie ? Elle ne se contente pas de recueillir des opinions : elle examine les raisons, les présupposés, la cohérence des propositions.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les traits du questionnement philosophique</div>
<ul>
<li><strong>Étonnement :</strong> s'étonner de ce qui semble évident.</li>
<li><strong>Problématisation :</strong> transformer une question naïve en problème articulé.</li>
<li><strong>Argumentation :</strong> soutenir une thèse par des raisons, discuter les objections.</li>
<li><strong>Universalité :</strong> prétendre à une validité au-delà des opinions individuelles.</li>
<li><strong>Réflexivité :</strong> examiner ses propres présupposés.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Distinguer philosophie et autres démarches</div>
<ul>
<li><strong>Philosophie / opinion :</strong> l'opinion est reçue sans examen ; la philosophie examine.</li>
<li><strong>Philosophie / science :</strong> la science étudie des objets particuliers avec méthode expérimentale ; la philosophie interroge les conditions et les fins.</li>
<li><strong>Philosophie / religion :</strong> la religion repose sur une révélation ; la philosophie questionne rationnellement, y compris la religion.</li>
<li><strong>Philosophie / art :</strong> l'art crée des formes sensibles ; la philosophie peut réfléchir sur le sens de ces formes (esthétique).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Transforme en question philosophique l'opinion « il faut toujours obéir aux lois ».</p>
<p><strong>Ex. 2 :</strong> Cite deux traits du questionnement philosophique et illustre-les par un exemple.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> « Toute loi mérite-t-elle obéissance, ou existe-t-il des lois injustes auxquelles on peut désobéir ? » <strong>2)</strong> Étonnement : « pourquoi y a-t-il quelque chose plutôt que rien ? » ; argumentation : soutenir que l'obéissance se justifie par le bien commun.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Philosopher, c'est examiner rationnellement les questions les plus générales ; cela suppose étonnement, problématisation et argumentation.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de philosophie (2007) ; manuel 3e Latin-Philosophie.</div>
    `
},
{
    title: "Leçon 2 — Le langage philosophique et l'argumentation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi les philosophes emploient-ils des mots si précis ? Et comment reconnaître un raisonnement solide d'un raisonnement trompeur ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le rôle de la précision terminologique. Distinguer conviction, opinion, croyance, savoir. Analyser la structure d'un argument. Repérer les principaux sophismes.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Précision du langage</div>
<p>Le langage philosophique exige la <strong>précision</strong> : un même mot peut désigner plusieurs choses (« liberté », « nature », « loi »). Définir, c'est donc distinguer les sens d'un terme pour éviter les confusions. La philosophie commence par un travail sur les mots.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Conviction, opinion, croyance, savoir</div>
<ul>
<li><strong>Opinion :</strong> jugement reçu, souvent non examiné, non justifié.</li>
<li><strong>Croyance :</strong> adhésion à une proposition sans preuve démonstrative (croyance religieuse, confiance).</li>
<li><strong>Conviction :</strong> adhésion forte, pouvant être raisonnée ou non.</li>
<li><strong>Savoir :</strong> connaissance justifiée, appuyée sur des raisons ou des preuves.</li>
</ul>
<p>Ces distinctions ne sont pas des hiérarchies morales : une croyance peut être légitime dans son ordre ; mais en philosophie, on demande des <em>raisons</em>.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Structure de l'argument</div>
<p>Un <strong>argument</strong> comporte :</p>
<ol>
<li>Des <strong>prémisses</strong> (propositions de départ, admises ou justifiées).</li>
<li>Une <strong>inférence</strong> (le raisonnement qui relie prémisses et conclusion).</li>
<li>Une <strong>conclusion</strong> (ce qu'on veut établir).</li>
</ol>
<img data-image-id="PL3_IMG01" alt="Schéma de l'argumentation" style="max-width:100%;border-radius:8px;margin:12px 0;">
<p>Un argument peut être <strong>valide</strong> (la conclusion découle des prémisses) et <strong>solide</strong> (les prémisses sont vraies).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Sophismes courants</div>
<ul>
<li><strong>Pétition de principe :</strong> supposer vrai ce qui est à démontrer.</li>
<li><strong>Faux dilemme :</strong> présenter deux options comme seules possibles alors qu'il en existe d'autres.</li>
<li><strong>Homme de paille :</strong> caricaturer la thèse adverse pour mieux la réfuter.</li>
<li><strong>Appel à l'autorité :</strong> invoquer une autorité (ou la majorité) sans argument.</li>
<li><strong>Ad hominem :</strong> attaquer la personne au lieu de discuter son argument.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Application littéraire</div>
<p>Un texte littéraire peut défendre une thèse implicitement : un roman, un poème, une fable peut être lu comme un argument ou une critique des valeurs de son temps. Analyser un texte littéraire philosophiquement, c'est dégager les présupposés, les valeurs défendues ou contestées.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Repère le sophisme dans : « Puisque tout le monde triche un peu, la triche n'est pas vraiment un problème. »</p>
<p><strong>Ex. 2 :</strong> Analyse la structure d'un argument philosophique court (texte fourni par le professeur).</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> C'est un appel à la majorité (ou à la coutume), qui ne prouve rien.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un argument solide repose sur des prémisses justifiées et une inférence valide ; les sophismes trompent par leur forme séduisante.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel 3e Latin-Philosophie ; références générales de logique informelle.</div>
    `
},
{
    title: "Leçon 3 — Les fondements de la morale : bien, devoir, liberté",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment décider ce qui est bien ? Suffit-il de suivre le bonheur, ou faut-il obéir à un devoir ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer les approches téléologique et déontologique. Comprendre la notion de devoir moral. Définir la liberté et ses limites.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Approche téléologique</div>
<p>Une morale <strong>téléologique</strong> (du grec <em>telos</em>, « fin ») évalue l'action par ses conséquences ou sa fin. Exemple : la morale d'Aristote, où le bien est la réalisation de la nature humaine et du bonheur (eudémonisme). Faire le bien, c'est agir en vue d'une fin bonne.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Approche déontologique</div>
<p>Une morale <strong>déontologique</strong> (du grec <em>deon</em>, « devoir ») évalue l'action par le respect de la règle morale, indépendamment des conséquences. Exemple : Kant. La moralité réside dans l'intention d'agir par devoir, par respect pour la loi morale.</p>
<img data-image-id="PL3_IMG02" alt="Tableau comparatif téléologique / déontologique" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Impératif catégorique et hypothétique (Kant)</div>
<ul>
<li><strong>Impératif hypothétique :</strong> commande un moyen en vue d'une fin (« si tu veux réussir, travaille »). Il est conditionnel.</li>
<li><strong>Impératif catégorique :</strong> commande inconditionnellement (« agis de telle sorte que ta maxime puisse être érigée en loi universelle »). Il est le fondement de la moralité.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Liberté, libre arbitre, déterminisme</div>
<ul>
<li><strong>Libre arbitre :</strong> capacité de choisir entre plusieurs possibilités sans être entièrement déterminé.</li>
<li><strong>Déterminisme :</strong> thèse selon laquelle tout événement (y compris l'action humaine) est causé par des événements antérieurs.</li>
<li><strong>Liberté morale :</strong> capacité d'agir selon la raison et la loi morale, indépendamment des penchants.</li>
</ul>
<p>Le débat entre libre arbitre et déterminisme est classique : on peut soutenir un déterminisme compatible avec une certaine forme de liberté (compatibilisme) ou un déterminisme strict.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Débat guidé</div>
<p>« Peut-on être responsable sans être libre ? » — Pistes : la responsabilité suppose-t-elle la liberté ? Que devient la morale si tout est déterminé ?</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Distingue les deux approches dans deux exemples : sauver une vie par devoir, ou parce qu'on espère une récompense.</p>
<p><strong>Ex. 2 :</strong> Explique la différence entre impératif catégorique et impératif hypothétique.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Sauver une vie par devoir = morale déontologique. Sauver par intérêt = calcul utilitaire, non moral au sens kantien. <strong>2)</strong> L'impératif catégorique commande sans condition ; l'impératif hypothétique commande un moyen en vue d'une fin.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La morale peut se fonder sur la fin (téléologie) ou sur le devoir (déontologie) ; la liberté est au cœur de la responsabilité morale.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel 3e Latin-Philosophie ; références classiques (Aristote, Kant) citées indirectement.</div>
    `
},
{
    title: "Leçon 4 — La responsabilité et le dilemme moral",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Que faire quand deux obligations entrent en conflit ? Suis-je responsable de ce que je n'ai pas voulu ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer responsabilité individuelle, collective, historique. Analyser un dilemme moral. Formuler un jugement argumenté.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Trois formes de responsabilité</div>
<ul>
<li><strong>Responsabilité individuelle :</strong> je réponds de mes actes propres.</li>
<li><strong>Responsabilité collective :</strong> je réponds avec d'autres d'un acte commun (décisions d'un groupe, d'une institution).</li>
<li><strong>Responsabilité historique :</strong> une société répond des actes de ses prédécesseurs (esclavage, colonisation, génocides), même si les individus actuels n'en sont pas les auteurs directs. Ce type de responsabilité engage la mémoire, la réparation, la vigilance.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le dilemme moral</div>
<p>Un <strong>dilemme moral</strong> est une situation où deux obligations morales sont en conflit, et où toute action entraîne une transgression. Exemple classique : dire la vérité à un ami ou protéger un innocent par le mensonge. Résoudre un dilemme ne signifie pas toujours trouver une solution parfaite : il s'agit de choisir en argumentant, en pesant les raisons et les conséquences.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Analyser un dilemme</div>
<ol>
<li>Identifier les obligations en présence.</li>
<li>Repérer les valeurs défendues par chacune.</li>
<li>Examiner les conséquences possibles.</li>
<li>Choisir et justifier, en reconnaissant ce qui est sacrifié.</li>
</ol>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Analyse un dilemme moral proposé par le professeur (cas de corruption ou de justice).</p>
<p><strong>Ex. 2 :</strong> Formule ta position et celle de deux de tes camarades, en expliquant ce qui diffère.</p>
<details><summary>Corrigé indicatif</summary>
<p>Un bon raisonnement identifie clairement les obligations et ne confond pas les faits (ce qui est) et les valeurs (ce qui doit être).</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La responsabilité est individuelle, collective et parfois historique ; un dilemme moral se traite par l'argumentation, non par une réponse unique.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel 3e Latin-Philosophie ; références générales d'éthique.</div>
    `
},
{
    title: "Leçon 5 — Philosophie politique : l'État et la justice",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi les hommes ont-ils besoin d'un État ? Qu'est-ce qu'une société juste ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre ce qu'est l'État et ses fonctions. Distinguer les formes de justice. Comprendre les notions de légitimité et de légalité. S'initier aux théories du contrat social.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — L'État</div>
<p>L'<strong>État</strong> est une organisation politique qui exerce la souveraineté sur un territoire et une population. Ses fonctions principales :</p>
<ul>
<li><strong>Assurer la sécurité</strong> (interne et externe).</li>
<li><strong>Rendre la justice.</strong></li>
<li><strong>Produire des biens et des services publics.</strong></li>
<li><strong>Réguler l'économie.</strong></li>
<li><strong>Défendre les droits fondamentaux.</strong></li>
</ul>
<img data-image-id="PL3_IMG03" alt="Schéma des trois pouvoirs de l'État" style="max-width:100%;border-radius:8px;margin:12px 0;">
<p>La séparation des pouvoirs (exécutif, législatif, judiciaire) est un principe hérité de Montesquieu qui limite l'arbitraire.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les formes de justice</div>
<ul>
<li><strong>Justice distributive :</strong> répartition équitable des biens et des charges dans la société (Rawls).</li>
<li><strong>Justice corrective :</strong> rétablissement de l'équilibre après un tort (réparation, sanction).</li>
<li><strong>Justice sociale :</strong> ensemble des mesures visant à corriger les inégalités injustes.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Légitimité et légalité</div>
<ul>
<li><strong>Légalité :</strong> conformité à la loi positive, telle qu'elle est écrite.</li>
<li><strong>Légitimité :</strong> conformité à une norme supérieure (justice, bien commun) ou à la volonté du peuple.</li>
</ul>
<p>Une loi peut être légale sans être légitime (lois injustes de régimes oppressifs) : c'est le point de départ de la désobéissance civile.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Contrat social (initiation)</div>
<ul>
<li><strong>Hobbes :</strong> les hommes, naturellement en guerre, se soumettent à un souverain absolu pour la sécurité.</li>
<li><strong>Locke :</strong> les hommes conservent des droits naturels (vie, liberté, propriété) que l'État doit protéger.</li>
<li><strong>Rousseau :</strong> la souveraineté appartient au peuple ; la loi exprime la volonté générale.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Application</div>
<p>Analyser une situation politique congolaise (gestion d'un service public, accès à la justice) à la lumière des théories de la justice, sans jugement partisan.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les trois formes de justice et un exemple pour chacune.</p>
<p><strong>Ex. 2 :</strong> Explique la différence entre légalité et légitimité.</p>
<details><summary>Corrigé</summary>
<p><strong>2)</strong> La légalité est la conformité à la loi ; la légitimité est la conformité à une norme supérieure (justice, bien commun).</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'État organise la vie commune ; la justice distingue plusieurs formes ; légalité et légitimité ne coïncident pas toujours.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel 3e Latin-Philosophie ; références classiques (Hobbes, Locke, Rousseau, Rawls, Montesquieu) citées indirectement.</div>
    `
},
{
    title: "Leçon 6 — Modèles politiques occidentaux et systèmes traditionnels congolais",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Peut-on comparer la démocratie moderne et les systèmes politiques traditionnels africains ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les grands modèles politiques occidentaux. Décrire les systèmes traditionnels congolais. Comparer leurs logiques sans jugement de valeur simpliste.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les modèles occidentaux</div>
<ul>
<li><strong>Démocratie libérale :</strong> élections, séparation des pouvoirs, droits fondamentaux, État de droit.</li>
<li><strong>République :</strong> souveraineté du peuple, primat de la loi, service public.</li>
<li><strong>État-providence :</strong> intervention de l'État pour corriger les inégalités sociales.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les systèmes politiques traditionnels congolais</div>
<p>Avant la colonisation, plusieurs formes d'organisation politique existaient :</p>
<ul>
<li><strong>Royaumes centralisés</strong> (Kongo, Luba, Lunda, Kuba) avec un roi entouré de conseils, de notables et de dignitaires.</li>
<li><strong>Chefferies</strong> avec un chef assisté d'un conseil des anciens.</li>
<li><strong>Sociétés segmentaires</strong> sans pouvoir centralisé, organisées autour de la famille, du lignage et des sociétés d'initiation.</li>
</ul>
<p>Le pouvoir s'appuie sur la tradition, le consensus, le conseil des anciens, la palabre (discussion publique). La palabre est un mode de résolution des conflits par la parole.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Comparaison</div>
<ul>
<li><strong>Légitimation du pouvoir :</strong> élection (modèle occidental) vs hérédité, ancienneté, consensus (systèmes traditionnels).</li>
<li><strong>Prise de décision :</strong> vote majoritaire vs palabre, recherche du consensus.</li>
<li><strong>Rapport à la loi :</strong> loi écrite et impersonnelle vs coutume, tradition orale.</li>
</ul>
<p>Aucun modèle n'est parfait : les systèmes traditionnels assurent cohésion et transmission ; les démocraties modernes assurent droits individuels et rotation du pouvoir. Des hybridations existent (recours à la palabre dans la justice contemporaine).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite deux différences entre modèle occidental et systèmes traditionnels congolais.</p>
<p><strong>Ex. 2 :</strong> Argumente : « La palabre peut-elle inspirer la justice moderne ? »</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>1)</strong> Légitimation du pouvoir (élection vs hérédité/consensus) ; mode de décision (vote vs palabre).</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les systèmes politiques se comparent sans hiérarchie absolue ; chaque modèle porte des valeurs et des limites qu'on peut analyser rationnellement.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel 3e Latin-Philosophie ; références d'anthropologie politique africaine citées indirectement.</div>
    `
},
{
    title: "Leçon 7 — Ontologie : l'être et la réalité",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qu'est-ce qui existe vraiment ? Pourquoi y a-t-il quelque chose plutôt que rien ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir l'ontologie et son objet. Comprendre les grandes oppositions (être/devenir, substance/accident). Distinguer les questions ontologiques des questions scientifiques.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — L'ontologie</div>
<p>L'<strong>ontologie</strong> est la branche de la métaphysique qui étudie l'<strong>être</strong> en tant qu'être : qu'est-ce qui existe ? Quelles sont les grandes catégories du réel ? Qu'est-ce qui fait qu'une chose <em>est</em> ?</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Être et devenir</div>
<ul>
<li><strong>Parménide :</strong> l'être est un, immobile, éternel ; le changement est illusion des sens.</li>
<li><strong>Héraclite :</strong> tout coule (« on ne se baigne jamais deux fois dans le même fleuve ») ; le devenir est la réalité même.</li>
</ul>
<p>Cette opposition fonde le débat métaphysique sur la permanence et le changement.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Substance et accident (Aristote)</div>
<p>La <strong>substance</strong> est ce qui existe en soi (l'être d'une chose) ; les <strong>accidents</strong> sont les propriétés qui ne peuvent exister sans elle (couleur, taille, lieu). Cette distinction permet de penser ce qui demeure sous les changements.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Initiation prudente à Heidegger</div>
<p>Le philosophe allemand Heidegger nomme <strong>Dasein</strong> (« être-là ») l'existence humaine, qui est la seule à se poser la question de l'être. Cette notion est difficile : à ce niveau, il suffit de retenir que l'existence humaine est comprise comme un <em>questionnement sur l'être</em>, non comme un simple objet parmi d'autres.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Ontologie et science</div>
<p>Les sciences étudient des étants particuliers (atomes, cellules, sociétés) ; l'ontologie interroge ce que signifie <em>être</em> pour ces étants et pour toute chose. Une question ontologique ne peut pas être tranchée par une expérience : elle demande une analyse conceptuelle.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Lien avec la littérature</div>
<p>Un texte littéraire peut poser la question de l'être : la mort, l'absurde, la présence du monde, la solitude. Analyser philosophiquement un poème, c'est dégager la conception de l'existence qu'il porte.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Classe ces questions : « Combien d'électrons dans un atome ? » / « Pourquoi y a-t-il de l'être et non pas rien ? »</p>
<p><strong>Ex. 2 :</strong> Explique la différence entre substance et accident chez Aristote.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> La première est scientifique ; la seconde est ontologique. <strong>2)</strong> La substance existe en soi ; les accidents dépendent d'elle et ne peuvent exister séparément.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'ontologie interroge l'être en tant qu'être ; elle se distingue des sciences particulières qui étudient des étants.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel 3e Latin-Philosophie ; références classiques (Parménide, Héraclite, Aristote, Heidegger) citées indirectement.</div>
    `
},
{
    title: "Leçon 8 — Théodicée : le problème du mal et l'existence de Dieu",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment un Dieu bon peut-il permettre le mal ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer le mal physique et le mal moral. Connaître les grandes réponses classiques. Comprendre les critiques athées. Analyser la question dans les cosmologies bantoues.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les deux formes du mal</div>
<ul>
<li><strong>Mal physique :</strong> souffrance naturelle (maladie, catastrophe naturelle).</li>
<li><strong>Mal moral :</strong> souffrance causée par la volonté humaine (cruauté, injustice, guerre).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les réponses classiques</div>
<ul>
<li><strong>Augustin :</strong> le mal n'est pas une substance, mais une privation du bien ; il vient de l'usage mauvais de la liberté.</li>
<li><strong>Leibniz :</strong> nous vivons dans le « meilleur des mondes possibles » ; le mal est la condition d'un plus grand bien (harmonie universelle). Cette thèse a été vivement critiquée (Voltaire).</li>
</ul>
<img data-image-id="PL3_IMG04" alt="Carte mentale : réponses au problème du mal" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les critiques athées</div>
<ul>
<li><strong>Nietzsche :</strong> critique de la morale chrétienne comme « morale d'esclaves » ; il annonce la « mort de Dieu » et invite à créer de nouvelles valeurs.</li>
<li><strong>Freud :</strong> la religion est une illusion, une projection du désir infantile de protection.</li>
<li><strong>Argument athée classique :</strong> si Dieu est tout-puissant et bon, le mal ne devrait pas exister ; or le mal existe. Certains renoncent à la toute-puissance, d'autres à la bonté, d'autres à l'existence.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Théodicée et pensée africaine</div>
<p>Dans les cosmologies bantoues, le mal n'est pas seulement un problème métaphysique : il est lié à la rupture de l'harmonie entre vivants, ancêtres, esprits et forces de la nature. Le mal est pensé en termes de relations perturbées, et la guérison, en termes de restauration de l'équilibre.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Débat</div>
<p>« Comment concilier l'existence du mal et l'idée d'un Dieu bon ? » — Pistes : réponse de la liberté, réponse de l'harmonie, refus de la question.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Distingue mal physique et mal moral avec deux exemples.</p>
<p><strong>Ex. 2 :</strong> Présente en trois phrases l'argument athée classique.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Mal physique : un tremblement de terre. Mal moral : un génocide. <strong>2)</strong> Si Dieu était tout-puissant et parfaitement bon, il empêcherait le mal ; or le mal existe ; donc Dieu n'est pas tout-puissant, ou n'est pas bon, ou n'existe pas.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La théodicée tente de penser la coexistence du mal et d'un Dieu bon ; les critiques athées contestent la cohérence de cette position.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel 3e Latin-Philosophie ; références classiques (Augustin, Leibniz, Nietzsche, Freud) citées indirectement.</div>
    `
},
{
    title: "Leçon 9 — La vision bantoue de l'univers",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Peut-on parler d'une philosophie africaine ? Et que signifie la « force vitale » dans la pensée bantoue ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la thèse de Tempels sur la philosophie bantoue. Connaître les critiques de l'ethno-philosophie. Analyser la question de l'existence d'une philosophie africaine.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La philosophie bantoue selon Tempels</div>
<p>Le missionnaire et philosophe belge <strong>Placide Tempels</strong>, dans <em>La Philosophie bantoue</em> (1945), propose une lecture systématique de la pensée des peuples bantous. Il soutient que l'être, dans cette pensée, est avant tout <strong>force vitale</strong> : tout ce qui existe est une force, hiérarchisée depuis Dieu jusqu'aux choses, en passant par les ancêtres, les vivants et la nature. La vie morale consiste à renforcer sa force vitale et celle de la communauté.</p>
<p>Cette thèse a eu une influence importante : elle a servi d'argument contre l'idée que les Africains n'auraient pas de philosophie.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les critiques de l'ethno-philosophie</div>
<ul>
<li><strong>Paulin Hountondji :</strong> critique l'« ethno-philosophie » — une prétendue philosophie africaine collective, anonyme, non critique. Pour lui, la philosophie doit être un discours critique, individuel, argumenté, adressé à une communauté de pairs.</li>
<li><strong>Valentin-Yves Mudimbe :</strong> analyse la manière dont l'Occident a « inventé » l'Afrique comme objet de savoir ; il invite à déconstruire les catégories reçues.</li>
</ul>
<p>Ces critiques ne nient pas l'existence de pensées africaines : elles contestent la manière dont on les décrit et les conditions d'un vrai discours philosophique africain.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Débat</div>
<p>« Peut-on parler d'une philosophie africaine ? » — Pistes : les traditions orales contiennent-elles une philosophie implicite ? Faut-il des textes écrits et un discours critique ? Qui définit ce qu'est la philosophie ?</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Résume en trois phrases la thèse de Tempels sur la force vitale.</p>
<p><strong>Ex. 2 :</strong> Explique la critique de Hountondji.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Pour Tempels, l'être bantou est force vitale ; tout existe comme force hiérarchisée ; la morale vise à renforcer cette force. <strong>2)</strong> Hountondji critique une « philosophie africaine » collective et anonyme ; il demande un discours critique et individuel.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La question d'une philosophie africaine est vive : entre reconnaissance des pensées africaines et exigence critique, le débat reste ouvert.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel 3e Latin-Philosophie ; références (Tempels, Hountondji, Mudimbe) citées indirectement.</div>
    `
},
{
    title: "Leçon 10 — Bioéthique et écologie : argumenter sur des enjeux actuels",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Faut-il autoriser la modification génétique des aliments ? L'homme est-il responsable de la nature ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les enjeux de la bioéthique. Analyser des dilemmes écologiques. Formuler un jugement argumenté en mobilisant les théories morales.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La bioéthique</div>
<p>La <strong>bioéthique</strong> étudie les questions morales posées par les progrès de la biologie et de la médecine : procréation médicalement assistée, fin de vie, don d'organes, modification génétique, recherche sur l'embryon. Elle mobilise des principes : respect de l'autonomie du patient, bienfaisance, non-malfaisance, justice.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — L'écologie morale</div>
<p>L'écologie pose la question du rapport de l'homme à la nature. Plusieurs positions :</p>
<ul>
<li><strong>Anthropocentrisme :</strong> la nature a une valeur parce qu'elle sert l'homme.</li>
<li><strong>Biocentrisme :</strong> tous les êtres vivants ont une valeur intrinsèque.</li>
<li><strong>Écocentrisme :</strong> c'est l'écosystème dans son ensemble qui a une valeur.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Argumenter sur un enjeu</div>
<ol>
<li>Identifier les faits (ce qui est en jeu techniquement, scientifiquement).</li>
<li>Identifier les valeurs en présence (liberté, dignité, santé, respect de la nature).</li>
<li>Formuler les arguments de chaque position.</li>
<li>Prendre position en justifiant, sans caricaturer l'adversaire.</li>
</ol>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Analyse un cas de bioéthique proposé par le professeur (par exemple, la fin de vie).</p>
<p><strong>Ex. 2 :</strong> Défends une position écologique en trois arguments.</p>
<details><summary>Corrigé indicatif</summary>
<p>Un bon raisonnement distingue les faits et les valeurs, et propose des arguments plutôt que des slogans.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La bioéthique et l'écologie appliquent les théories morales à des situations concrètes et exigent une argumentation rigoureuse.</p></div>
<div class="sources"><strong>Sources :</strong> Manuel 3e Latin-Philosophie ; références générales de bioéthique et d'éthique environnementale.</div>
    `
},
{
    title: "Leçon 11 — Méthodologie de la dissertation philosophique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment construire une dissertation philosophique solide ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Analyser un sujet. Construire un plan dialectique. Rédiger introduction et conclusion. Développer un argument avec exemple.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Analyser le sujet</div>
<ul>
<li><strong>Mots-clés :</strong> identifier les termes essentiels et leurs sens possibles.</li>
<li><strong>Présupposés :</strong> dégager ce que la question suppose implicitement.</li>
<li><strong>Problématique :</strong> formuler la tension que la question met en jeu.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le plan dialectique</div>
<p>Le plan dialectique organise la réflexion en trois temps :</p>
<ol>
<li><strong>Thèse :</strong> première réponse, avec arguments.</li>
<li><strong>Antithèse :</strong> objection, limite de la thèse, arguments opposés.</li>
<li><strong>Synthèse :</strong> dépassement, position plus fine.</li>
</ol>
<img data-image-id="PL3_IMG05" alt="Plan type de dissertation dialectique" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — L'introduction</div>
<ol>
<li><strong>Accroche :</strong> une phrase qui retient l'attention (citation, exemple, paradoxe).</li>
<li><strong>Problématique :</strong> la question précise posée.</li>

le vraiment? ». Objectifs. Définir la philosophie et son objet. Identifier ses traits caractéristiques. Distinguer philosophie, opinion, science, religion et art. Théorie, Définition de la philosophie. La philosophie est une démarche rationnelle et critique qui interroge les questions les plus générales de l'existence: qu'est-ce que le bien? Qu'est-ce que la justice? Qu'est-ce qu'être? Quel sens donner à la vie? Elle ne se contente pas de recueillir des opinions: elle examine les raisons, les présupposés, la cohérence des propositions. Théorie, Les traits du questionnement philosophique. Étonnement: s'étonner de ce qui semble évident. Problématisation: transformer une question naïve en problème articulé. Argumentation: soutenir une thèse par des raisons, discuter les objections. Universalité: prétendre à une validité au-delà des opinions individuelles. Réflexivité: examiner ses propres présupposés. Théorie, Distinguer philosophie et autres démarches. Philosophie ou opinion: l'opinion est reçue sans examen; la philosophie examine. Philosophie ou science: la science étudie des objets particuliers avec méthode expérimentale; la philosophie interroge les conditions et les fins. Philosophie ou religion: la religion repose sur une révélation; la philosophie questionne rationnellement, y compris la religion. Philosophie ou art: l'art crée des formes sensibles; la philosophie peut réfléchir sur le sens de ces formes (esthétique). Exercices. Ex. 1: Transforme en question philosophique l'opinion « il faut toujours obéir aux lois ». Ex. 2: Cite deux traits du questionnement philosophique et illustre-les par un exemple. Corrigé. 1) « Toute loi mérite-t-elle obéissance, ou existe-t-il des lois injustes auxquelles on peut désobéir? » 2) Étonnement: « pourquoi y a-t-il quelque chose plutôt que rien? »; argumentation: soutenir que l'obéissance se justifie par le bien commun. À retenir. Philosopher, c'est examiner rationnellement les questions les plus générales; cela suppose étonnement, problématisation et argumentation."]],"3":[["fr","Leçon 2, Le langage philosophique et l'argumentation. Situation. « Pourquoi les philosophes emploient-ils des mots si précis? Et comment reconnaître un raisonnement solide d'un raisonnement trompeur? ». Objectifs. Comprendre le rôle de la précision terminologique. Distinguer conviction, opinion, croyance, savoir. Analyser la structure d'un argument. Repérer les principaux sophismes. Théorie, Précision du langage. Le langage philosophique exige la précision: un même mot peut désigner plusieurs choses (« liberté », « nature », « loi »). Définir, c'est donc distinguer les sens d'un terme pour éviter les confusions. La philosophie commence par un travail sur les mots. Théorie, Conviction, opinion, croyance, savoir. Opinion: jugement reçu, souvent non examiné, non justifié. Croyance: adhésion à une proposition sans preuve démonstrative (croyance religieuse, confiance). Conviction: adhésion forte, pouvant être raisonnée ou non. Savoir: connaissance justifiée, appuyée sur des raisons ou des preuves. Ces distinctions ne sont pas des hiérarchies morales: une croyance peut être légitime dans son ordre; mais en philosophie, on demande des raisons. Théorie, Structure de l'argument. Un argument comporte: Des prémisses (propositions de départ, admises ou justifiées). Une inférence (le raisonnement qui relie prémisses et conclusion). Une conclusion (ce qu'on veut établir). Un argument peut être valide (la conclusion découle des prémisses) et solide (les prémisses sont vraies). Théorie, Sophismes courants. Pétition de principe: supposer vrai ce qui est à démontrer. Faux dilemme: présenter deux options comme seules possibles alors qu'il en existe d'autres. Homme de paille: caricaturer la thèse adverse pour mieux la réfuter. Appel à l'autorité: invoquer une autorité (ou la majorité) sans argument. Ad hominem: attaquer la personne au lieu de discuter son argument. Application littéraire. Un texte littéraire peut défendre une thèse implicitement: un roman, un poème, une fable peut être lu comme un argument ou une critique des valeurs de son temps. Analyser un texte littéraire philosophiquement, c'est dégager les présupposés, les valeurs défendues ou contestées. Exercices. Ex. 1: Repère le sophisme dans: « Puisque tout le monde triche un peu, la triche n'est pas vraiment un problème. ». Ex. 2: Analyse la structure d'un argument philosophique court (texte fourni par le professeur). Corrigé. 1) C'est un appel à la majorité (ou à la coutume), qui ne prouve rien. À retenir. Un argument solide repose sur des prémisses justifiées et une inférence valide; les sophismes trompent par leur forme séduisante."]],"4":[["fr","Leçon 3, Les fondements de la morale: bien, devoir, liberté. Situation. « Comment décider ce qui est bien? Suffit-il de suivre le bonheur, ou faut-il obéir à un devoir? ». Objectifs. Distinguer les approches téléologique et déontologique. Comprendre la notion de devoir moral. Définir la liberté et ses limites. Théorie, Approche téléologique. Une morale téléologique (du grec telos, « fin ») évalue l'action par ses conséquences ou sa fin. Exemple: la morale d'Aristote, où le bien est la réalisation de la nature humaine et du bonheur (eudémonisme). Faire le bien, c'est agir en vue d'une fin bonne. Théorie, Approche déontologique. Une morale déontologique (du grec deon, « devoir ») évalue l'action par le respect de la règle morale, indépendamment des conséquences. Exemple: Kant. La moralité réside dans l'intention d'agir par devoir, par respect pour la loi morale. Théorie, Impératif catégorique et hypothétique (Kant). Impératif hypothétique: commande un moyen en vue d'une fin (« si tu veux réussir, travaille »). Il est conditionnel. Impératif catégorique: commande inconditionnellement (« agis de telle sorte que ta maxime puisse être érigée en loi universelle »). Il est le fondement de la moralité. Théorie, Liberté, libre arbitre, déterminisme. Libre arbitre: capacité de choisir entre plusieurs possibilités sans être entièrement déterminé. Déterminisme: thèse selon laquelle tout événement (y compris l'action humaine) est causé par des événements antérieurs. Liberté morale: capacité d'agir selon la raison et la loi morale, indépendamment des penchants. Le débat entre libre arbitre et déterminisme est classique: on peut soutenir un déterminisme compatible avec une certaine forme de liberté (compatibilisme) ou un déterminisme strict. Débat guidé. « Peut-on être responsable sans être libre? », Pistes: la responsabilité suppose-t-elle la liberté? Que devient la morale si tout est déterminé? Exercices. Ex. 1: Distingue les deux approches dans deux exemples: sauver une vie par devoir, ou parce qu'on espère une récompense. Ex. 2: Explique la différence entre impératif catégorique et impératif hypothétique. Corrigé. 1) Sauver une vie par devoir égale morale déontologique. Sauver par intérêt égale calcul utilitaire, non moral au sens kantien. 2) L'impératif catégorique commande sans condition; l'impératif hypothétique commande un moyen en vue d'une fin. À retenir. La morale peut se fonder sur la fin (téléologie) ou sur le devoir (déontologie); la liberté est au cœur de la responsabilité morale."]],"5":[["fr","Leçon 4, La responsabilité et le dilemme moral. Situation. « Que faire quand deux obligations entrent en conflit? Suis-je responsable de ce que je n'ai pas voulu? ». Objectifs. Distinguer responsabilité individuelle, collective, historique. Analyser un dilemme moral. Formuler un jugement argumenté. Théorie, Trois formes de responsabilité. Responsabilité individuelle: je réponds de mes actes propres. Responsabilité collective: je réponds avec d'autres d'un acte commun (décisions d'un groupe, d'une institution). Responsabilité historique: une société répond des actes de ses prédécesseurs (esclavage, colonisation, génocides), même si les individus actuels n'en sont pas les auteurs directs. Ce type de responsabilité engage la mémoire, la réparation, la vigilance. Théorie, Le dilemme moral. Un dilemme moral est une situation où deux obligations morales sont en conflit, et où toute action entraîne une transgression. Exemple classique: dire la vérité à un ami ou protéger un innocent par le mensonge. Résoudre un dilemme ne signifie pas toujours trouver une solution parfaite: il s'agit de choisir en argumentant, en pesant les raisons et les conséquences. Théorie, Analyser un dilemme. Identifier les obligations en présence. Repérer les valeurs défendues par chacune. Examiner les conséquences possibles. Choisir et justifier, en reconnaissant ce qui est sacrifié. Exercices. Ex. 1: Analyse un dilemme moral proposé par le professeur (cas de corruption ou de justice). Ex. 2: Formule ta position et celle de deux de tes camarades, en expliquant ce qui diffère. Corrigé indicatif. Un bon raisonnement identifie clairement les obligations et ne confond pas les faits (ce qui est) et les valeurs (ce qui doit être). À retenir. La responsabilité est individuelle, collective et parfois historique; un dilemme moral se traite par l'argumentation, non par une réponse unique."]],"6":[["fr","Leçon 5, Philosophie politique: l'État et la justice. Situation. « Pourquoi les hommes ont-ils besoin d'un État? Qu'est-ce qu'une société juste? ». Objectifs. Comprendre ce qu'est l'État et ses fonctions. Distinguer les formes de justice. Comprendre les notions de légitimité et de légalité. S'initier aux théories du contrat social. Théorie, L'État. L'État est une organisation politique qui exerce la souveraineté sur un territoire et une population. Ses fonctions principales: Assurer la sécurité (interne et externe). Rendre la justice. Produire des biens et des services publics. Réguler l'économie. Défendre les droits fondamentaux. La séparation des pouvoirs (exécutif, législatif, judiciaire) est un principe hérité de Montesquieu qui limite l'arbitraire. Théorie, Les formes de justice. Justice distributive: répartition équitable des biens et des charges dans la société (Rawls). Justice corrective: rétablissement de l'équilibre après un tort (réparation, sanction). Justice sociale: ensemble des mesures visant à corriger les inégalités injustes. Théorie, Légitimité et légalité. Légalité: conformité à la loi positive, telle qu'elle est écrite. Légitimité: conformité à une norme supérieure (justice, bien commun) ou à la volonté du peuple. Une loi peut être légale sans être légitime (lois injustes de régimes oppressifs): c'est le point de départ de la désobéissance civile. Théorie, Contrat social (initiation). Hobbes: les hommes, naturellement en guerre, se soumettent à un souverain absolu pour la sécurité. Locke: les hommes conservent des droits naturels (vie, liberté, propriété) que l'État doit protéger. Rousseau: la souveraineté appartient au peuple; la loi exprime la volonté générale. Application. Analyser une situation politique congolaise (gestion d'un service public, accès à la justice) à la lumière des théories de la justice, sans jugement partisan. Exercices. Ex. 1: Cite les trois formes de justice et un exemple pour chacune. Ex. 2: Explique la différence entre légalité et légitimité. Corrigé. 2) La légalité est la conformité à la loi; la légitimité est la conformité à une norme supérieure (justice, bien commun). À retenir. L'État organise la vie commune; la justice distingue plusieurs formes; légalité et légitimité ne coïncident pas toujours."]],"7":[["fr","Leçon 6, Modèles politiques occidentaux et systèmes traditionnels congolais. Situation. « Peut-on comparer la démocratie moderne et les systèmes politiques traditionnels africains? ». Objectifs. Comprendre les grands modèles politiques occidentaux. Décrire les systèmes traditionnels congolais. Comparer leurs logiques sans jugement de valeur simpliste. Théorie, Les modèles occidentaux. Démocratie libérale: élections, séparation des pouvoirs, droits fondamentaux, État de droit. République: souveraineté du peuple, primat de la loi, service public. État-providence: intervention de l'État pour corriger les inégalités sociales. Théorie, Les systèmes politiques traditionnels congolais. Avant la colonisation, plusieurs formes d'organisation politique existaient: Royaumes centralisés (Kongo, Luba, Lunda, Kuba) avec un roi entouré de conseils, de notables et de dignitaires. Chefferies avec un chef assisté d'un conseil des anciens. Sociétés segmentaires sans pouvoir centralisé, organisées autour de la famille, du lignage et des sociétés d'initiation. Le pouvoir s'appuie sur la tradition, le consensus, le conseil des anciens, la palabre (discussion publique). La palabre est un mode de résolution des conflits par la parole. Théorie, Comparaison. Légitimation du pouvoir: élection (modèle occidental) vs hérédité, ancienneté, consensus (systèmes traditionnels). Prise de décision: vote majoritaire vs palabre, recherche du consensus. Rapport à la loi: loi écrite et impersonnelle vs coutume, tradition orale. Aucun modèle n'est parfait: les systèmes traditionnels assurent cohésion et transmission; les démocraties modernes assurent droits individuels et rotation du pouvoir. Des hybridations existent (recours à la palabre dans la justice contemporaine). Exercices. Ex. 1: Cite deux différences entre modèle occidental et systèmes traditionnels congolais. Ex. 2: Argumente: « La palabre peut-elle inspirer la justice moderne? ». Corrigé indicatif. 1) Légitimation du pouvoir (élection vs hérédité/consensus); mode de décision (vote vs palabre). À retenir. Les systèmes politiques se comparent sans hiérarchie absolue; chaque modèle porte des valeurs et des limites qu'on peut analyser rationnellement."]],"8":[["fr","Leçon 7, Ontologie: l'être et la réalité. Situation. « Qu'est-ce qui existe vraiment? Pourquoi y a-t-il quelque chose plutôt que rien? ». Objectifs. Définir l'ontologie et son objet. Comprendre les grandes oppositions (être ou devenir, substance ou accident). Distinguer les questions ontologiques des questions scientifiques. Théorie, L'ontologie. L'ontologie est la branche de la métaphysique qui étudie l'être en tant qu'être: qu'est-ce qui existe? Quelles sont les grandes catégories du réel? Qu'est-ce qui fait qu'une chose est? Théorie, Être et devenir. Parménide: l'être est un, immobile, éternel; le changement est illusion des sens. Héraclite: tout coule (« on ne se baigne jamais deux fois dans le même fleuve »); le devenir est la réalité même. Cette opposition fonde le débat métaphysique sur la permanence et le changement. Théorie, Substance et accident (Aristote). La substance est ce qui existe en soi (l'être d'une chose); les accidents sont les propriétés qui ne peuvent exister sans elle (couleur, taille, lieu). Cette distinction permet de penser ce qui demeure sous les changements. Théorie, Initiation prudente à Heidegger. Le philosophe allemand Heidegger nomme Dasein (« être-là ») l'existence humaine, qui est la seule à se poser la question de l'être. Cette notion est difficile: à ce niveau, il suffit de retenir que l'existence humaine est comprise comme un questionnement sur l'être, non comme un simple objet parmi d'autres. Théorie, Ontologie et science. Les sciences étudient des étants particuliers (atomes, cellules, sociétés); l'ontologie interroge ce que signifie être pour ces étants et pour toute chose. Une question ontologique ne peut pas être tranchée par une expérience: elle demande une analyse conceptuelle. Lien avec la littérature. Un texte littéraire peut poser la question de l'être: la mort, l'absurde, la présence du monde, la solitude. Analyser philosophiquement un poème, c'est dégager la conception de l'existence qu'il porte. Exercices. Ex. 1: Classe ces questions: « Combien d'électrons dans un atome? » ou « Pourquoi y a-t-il de l'être et non pas rien? ». Ex. 2: Explique la différence entre substance et accident chez Aristote. Corrigé. 1) La première est scientifique; la seconde est ontologique. 2) La substance existe en soi; les accidents dépendent d'elle et ne peuvent exister séparément. À retenir. L'ontologie interroge l'être en tant qu'être; elle se distingue des sciences particulières qui étudient des étants."]],"9":[["fr","Leçon 8, Théodicée: le problème du mal et l'existence de Dieu. Situation. « Comment un Dieu bon peut-il permettre le mal? ». Objectifs. Distinguer le mal physique et le mal moral. Connaître les grandes réponses classiques. Comprendre les critiques athées. Analyser la question dans les cosmologies bantoues. Théorie, Les deux formes du mal. Mal physique: souffrance naturelle (maladie, catastrophe naturelle). Mal moral: souffrance causée par la volonté humaine (cruauté, injustice, guerre). Théorie, Les réponses classiques. Augustin: le mal n'est pas une substance, mais une privation du bien; il vient de l'usage mauvais de la liberté. Leibniz: nous vivons dans le « meilleur des mondes possibles »; le mal est la condition d'un plus grand bien (harmonie universelle). Cette thèse a été vivement critiquée (Voltaire). Théorie, Les critiques athées. Nietzsche: critique de la morale chrétienne comme « morale d'esclaves »; il annonce la « mort de Dieu » et invite à créer de nouvelles valeurs. Freud: la religion est une illusion, une projection du désir infantile de protection. Argument athée classique: si Dieu est tout-puissant et bon, le mal ne devrait pas exister; or le mal existe. Certains renoncent à la toute-puissance, d'autres à la bonté, d'autres à l'existence. Théorie, Théodicée et pensée africaine. Dans les cosmologies bantoues, le mal n'est pas seulement un problème métaphysique: il est lié à la rupture de l'harmonie entre vivants, ancêtres, esprits et forces de la nature. Le mal est pensé en termes de relations perturbées, et la guérison, en termes de restauration de l'équilibre. Débat. « Comment concilier l'existence du mal et l'idée d'un Dieu bon? », Pistes: réponse de la liberté, réponse de l'harmonie, refus de la question. Exercices. Ex. 1: Distingue mal physique et mal moral avec deux exemples. Ex. 2: Présente en trois phrases l'argument athée classique. Corrigé. 1) Mal physique: un tremblement de terre. Mal moral: un génocide. 2) Si Dieu était tout-puissant et parfaitement bon, il empêcherait le mal; or le mal existe; donc Dieu n'est pas tout-puissant, ou n'est pas bon, ou n'existe pas. À retenir. La théodicée tente de penser la coexistence du mal et d'un Dieu bon; les critiques athées contestent la cohérence de cette position."]],"10":[["fr","Leçon 9, La vision bantoue de l'univers. Situation. « Peut-on parler d'une philosophie africaine? Et que signifie la « force vitale » dans la pensée bantoue? ». Objectifs. Comprendre la thèse de Tempels sur la philosophie bantoue. Connaître les critiques de l'ethno-philosophie. Analyser la question de l'existence d'une philosophie africaine. Théorie, La philosophie bantoue selon Tempels. Le missionnaire et philosophe belge Placide Tempels, dans La Philosophie bantoue (1945), propose une lecture systématique de la pensée des peuples bantous. Il soutient que l'être, dans cette pensée, est avant tout force vitale: tout ce qui existe est une force, hiérarchisée depuis Dieu jusqu'aux choses, en passant par les ancêtres, les vivants et la nature. La vie morale consiste à renforcer sa force vitale et celle de la communauté. Cette thèse a eu une influence importante: elle a servi d'argument contre l'idée que les Africains n'auraient pas de philosophie. Théorie, Les critiques de l'ethno-philosophie. Paulin Hountondji: critique l'« ethno-philosophie », une prétendue philosophie africaine collective, anonyme, non critique. Pour lui, la philosophie doit être un discours critique, individuel, argumenté, adressé à une communauté de pairs. Valentin-Yves Mudimbe: analyse la manière dont l'Occident a « inventé » l'Afrique comme objet de savoir; il invite à déconstruire les catégories reçues. Ces critiques ne nient pas l'existence de pensées africaines: elles contestent la manière dont on les décrit et les conditions d'un vrai discours philosophique africain. Débat. « Peut-on parler d'une philosophie africaine? », Pistes: les traditions orales contiennent-elles une philosophie implicite? Faut-il des textes écrits et un discours critique? Qui définit ce qu'est la philosophie? Exercices. Ex. 1: Résume en trois phrases la thèse de Tempels sur la force vitale. Ex. 2: Explique la critique de Hountondji. Corrigé. 1) Pour Tempels, l'être bantou est force vitale; tout existe comme force hiérarchisée; la morale vise à renforcer cette force. 2) Hountondji critique une « philosophie africaine » collective et anonyme; il demande un discours critique et individuel. À retenir. La question d'une philosophie africaine est vive: entre reconnaissance des pensées africaines et exigence critique, le débat reste ouvert."]],"11":[["fr","Leçon 10, Bioéthique et écologie: argumenter sur des enjeux actuels. Situation. « Faut-il autoriser la modification génétique des aliments? L'homme est-il responsable de la nature? ». Objectifs. Comprendre les enjeux de la bioéthique. Analyser des dilemmes écologiques. Formuler un jugement argumenté en mobilisant les théories morales. Théorie, La bioéthique. La bioéthique étudie les questions morales posées par les progrès de la biologie et de la médecine: procréation médicalement assistée, fin de vie, don d'organes, modification génétique, recherche sur l'embryon. Elle mobilise des principes: respect de l'autonomie du patient, bienfaisance, non-malfaisance, justice. Théorie, L'écologie morale. L'écologie pose la question du rapport de l'homme à la nature. Plusieurs positions: Anthropocentrisme: la nature a une valeur parce qu'elle sert l'homme. Biocentrisme: tous les êtres vivants ont une valeur intrinsèque. Écocentrisme: c'est l'écosystème dans son ensemble qui a une valeur. Théorie, Argumenter sur un enjeu. Identifier les faits (ce qui est en jeu techniquement, scientifiquement). Identifier les valeurs en présence (liberté, dignité, santé, respect de la nature). Formuler les arguments de chaque position. Prendre position en justifiant, sans caricaturer l'adversaire. Exercices. Ex. 1: Analyse un cas de bioéthique proposé par le professeur (par exemple, la fin de vie). Ex. 2: Défends une position écologique en trois arguments. Corrigé indicatif. Un bon raisonnement distingue les faits et les valeurs, et propose des arguments plutôt que des slogans. À retenir. La bioéthique et l'écologie appliquent les théories morales à des situations concrètes et exigent une argumentation rigoureuse."]],"12":[["fr","Leçon 11, Méthodologie de la dissertation philosophique. Situation. « Comment construire une dissertation philosophique solide? ». Objectifs. Analyser un sujet. Construire un plan dialectique. Rédiger introduction et conclusion. Développer un argument avec exemple. Théorie, Analyser le sujet. Mots-clés: identifier les termes essentiels et leurs sens possibles. Présupposés: dégager ce que la question suppose implicitement. Problématique: formuler la tension que la question met en jeu. Théorie, Le plan dialectique. Le plan dialectique organise la réflexion en trois temps: Thèse: première réponse, avec arguments. Antithèse: objection, limite de la thèse, arguments opposés. Synthèse: dépassement, position plus fine. Théorie, L'introduction. Accroche: une phrase qui retient l'attention (citation, exemple, paradoxe). Problématique: la question précise posée. Annonce du plan: les étapes de la réflexion. Théorie, Développer un argument. Un paragraphe argumentatif comprend: Une idée (argument). Une explication (pourquoi cette idée tient). Un exemple (philosophique ou littéraire). Une transition vers la suite. Théorie, La conclusion. Rappeler la démarche suivie. Formuler la réponse finale (nuancée). Ouverture (facultative). Exercice guidé. Sujet: « La littérature peut-elle nous rendre meilleurs? », Construire un plan dialectique, rédiger l'introduction, ébaucher la thèse. À retenir. Une dissertation philosophique s'appuie sur l'analyse du sujet, un plan dialectique et des arguments illustrés d'exemples."]],"13":[["fr","Leçon 12, Synthèse et évaluation. Objectifs. Mobiliser les acquis du cours. Préparer l'évaluation finale. Révision, Notions clés. Argumentation: prémisses, inférence, conclusion; sophismes courants. Éthique: bien, devoir, liberté, responsabilité; téléologie et déontologie. Politique: État, justice, légitimité/légalité, contrat social. Métaphysique: ontologie, être et devenir, substance et accident. Théodicée: mal physique ou moral, réponses classiques, critiques athées. Philosophie africaine: Tempels (force vitale), Hountondji, Mudimbe. Bioéthique et écologie: principes, argumentation. Méthode: dissertation dialectique. Exercices de synthèse. Ex. 1: Analyse un court texte (fourni): thème, thèse, arguments, présupposés. Ex. 2: Rédige une introduction de dissertation sur: « Peut-on être libre dans une société injuste? ». Corrigé indicatif. Une bonne analyse distingue ce qui est affirmé, ce qui est prouvé, ce qui est supposé. L'introduction comporte accroche, problématique, annonce du plan. À retenir. Ce cours a articulé philosophie et littérature: lire, problématiser, argumenter, c'est philosopher dans les textes comme dans la vie."]],"14":[["fr","Évaluation finale, Philosophie Littéraire 3e année. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 12 points sur 20, tu as réussi. En dessous, revois les leçons indiquées."]]}};

      for (var k = 0; k < vs.length; k++) {

        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;

    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;

        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;

      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
