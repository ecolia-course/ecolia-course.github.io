        <h2>Qu'est-ce que la géographie ?</h2>
        <p><strong>Objectifs :</strong> (1) définir la géographie ; (2) distinguer ses grandes branches ; (3) expliquer son utilité.</p>
        <p><strong>Prérequis :</strong> aucun.</p>
        <p><strong>Situation de départ :</strong> « Pourquoi pleut-il plus à Kisangani qu'à Lubumbashi ? Pourquoi les gens s'installent-ils près des fleuves ? La géographie répond à ce type de questions. »</p>

        <h3>Développement</h3>
        <p>La géographie est la <strong>science qui étudie la surface de la Terre</strong>, les phénomènes naturels qui s'y déroulent et les relations entre les sociétés humaines et leur espace.</p>
        <p>Le mot vient du grec : <em>gê</em> (la Terre) et <em>graphein</em> (décrire). Aujourd'hui, la géographie ne se contente pas de décrire : elle explique, compare, cartographie et modélise.</p>
        <p>La géographie relie les <strong>sciences naturelles</strong> (climat, relief, eaux, sols, végétation) et les <strong>sciences humaines</strong> (population, villes, activités économiques).</p>
        <h3>Définitions</h3>
        <ul>
          <li><strong>Géographie physique :</strong> étude des milieux naturels (relief, climat, hydrographie, biogéographie, pédologie).</li>
          <li><strong>Géographie humaine :</strong> étude des populations, des villes, des activités et des territoires.</li>
          <li><strong>Géographie régionale :</strong> étude d'un espace particulier (RDC, Afrique centrale, bassin du Congo).</li>
          <li><strong>Espace géographique :</strong> portion de la surface terrestre organisée et transformée par les sociétés.</li>
        </ul>
        <h3>Méthodes et outils</h3>
        <p>La démarche géographique comporte trois temps : <strong>observer</strong> (terrain, carte, image satellite), <strong>décrire</strong> (vocabulaire précis), <strong>expliquer</strong> (relier plusieurs facteurs).</p>
        <p>Les outils : cartes, globes, atlas, images satellites, SIG, photographies de paysage, statistiques, données de terrain.</p>
        <p>Le géographe utilise une <strong>échelle</strong> (locale, régionale, nationale, continentale, mondiale) et un <strong>point de vue</strong> (physique, humain, économique, environnemental).</p>

        <h2>La Terre dans le système solaire</h2>
        <p><strong>Objectifs :</strong> (1) situer la Terre dans le système solaire ; (2) décrire ses mouvements ; (3) expliquer leurs conséquences (jours, saisons).</p>
        <p><strong>Prérequis :</strong> leçon 1.</p>
        <p><strong>Situation de départ :</strong> « Pourquoi fait-il jour puis nuit ? Pourquoi les jours sont-ils plus longs en été ? »</p>
      </div>
      <div class="bloc theorie">
        <h3>Développement</h3>
        <p>Le système solaire comprend le <strong>Soleil</strong> (étoile centrale) et huit planètes : Mercure, Vénus, la Terre, Mars, Jupiter, Saturne, Uranus, Neptune. Il comprend aussi des planètes naines (Pluton), des satellites, des astéroïdes et des comètes.</p>
        <p>La Terre est la <strong>troisième planète à partir du Soleil</strong>. Elle est la seule planète connue qui abrite la vie (eau liquide, atmosphère, température modérée).</p>
        <p>Deux mouvements principaux : la <strong>rotation</strong> (sur elle-même, en 24 h) et la <strong>révolution</strong> (autour du Soleil, en 365 jours et 6 heures environ).</p>
        <h3>Définitions</h3>
        <ul>
          <li><strong>Système solaire :</strong> ensemble formé par le Soleil et tous les corps qui gravitent autour de lui.</li>
          <li><strong>Rotation :</strong> mouvement de la Terre sur elle-même, axe incliné d'environ 23,5°. Durée : 24 h.</li>
          <li><strong>Révolution :</strong> mouvement de la Terre autour du Soleil, en 365,25 jours environ.</li>
          <li><strong>Équateur :</strong> ligne imaginaire qui partage la Terre en deux hémisphères.</li>
          <li><strong>Solstice et équinoxe :</strong> moments de l'année où les durées du jour et de la nuit sont particulières.</li>
        </ul>
        <h3>Méthodes et repères</h3>
        <p>La rotation explique l'alternance du jour et de la nuit. La révolution, combinée à l'inclinaison de l'axe, explique les saisons.</p>
        <ul>

          <li>Solstices : 21 juin et 21 décembre. Équinoxes : 21 mars et 23 septembre.</li>
          <li>Les saisons ne sont pas les mêmes dans les deux hémisphères.</li>
        </ul>

        <h2>La représentation de la Terre</h2>
        <p><strong>Objectifs :</strong> (1) distinguer globe et carte ; (2) lire les coordonnées géographiques ; (3) utiliser une échelle.</p>
        <p><strong>Prérequis :</strong> leçons 1 et 2.</p>
        <p><strong>Situation de départ :</strong> « Comment peut-on représenter sur une feuille plate une Terre qui est ronde ? Quels sont les outils du géographe pour cela ? »</p>
      </div>
      <div class="bloc theorie">
        <h3>Développement</h3>
        <p>Le <strong>globe terrestre</strong> est la représentation la plus fidèle de la Terre, mais peu pratique (on ne voit qu'une moitié à la fois).</p>
        <p>La <strong>carte</strong> est une représentation plane, conventionnelle et simplifiée de la surface terrestre. Elle déforme nécessairement la réalité.</p>
        <p>L'<strong>atlas</strong> est un recueil de cartes ; la <strong>carte topographique</strong> représente le relief, l'hydrographie, les routes, les localités.</p>
        <h3>Définitions</h3>
        <ul>
          <li><strong>Latitude :</strong> distance angulaire d'un point par rapport à l'équateur (0° à 90° N ou S).</li>
          <li><strong>Longitude :</strong> distance angulaire d'un point par rapport au méridien de Greenwich (0° à 180° E ou O).</li>
          <li><strong>Coordonnées géographiques :</strong> couple (latitude, longitude) qui localise un point.</li>
          <li><strong>Échelle :</strong> rapport entre la distance sur la carte et la distance réelle (ex. : 1/100 000 ; 1 cm = 1 km).</li>
          <li><strong>Légende :</strong> liste des symboles et couleurs utilisés sur la carte.</li>
        </ul>
        <h3>Méthodes et outils</h3>
        <ul>
          <li>Lire les coordonnées : repérer l'équateur et le méridien de Greenwich ; mesurer la latitude (N/S) puis la longitude (E/O).</li>
          <li>Utiliser une échelle : multiplier la distance mesurée par le dénominateur. Ex. : 3 cm au 1/100 000 = 3 × 100 000 cm = 300 000 cm = 3 km.</li>
          <li>Lire une carte : titre → légende → orientation → échelle → contenu.</li>
        </ul>
      </div>
      <div class="bloc exemple">
        <h3>Exemple et application RDC</h3>
        <p><img src="images/Geographie1_3.jpg" alt="Carte politique de l'Afrique" /></p>

        <p><strong>Exemple :</strong> Kinshasa se situe à environ 4° de latitude Sud et 15° de longitude Est. Lubumbashi est à environ 11° Sud et 27° Est.</p>
        <p><strong>Application RDC :</strong> Situe ta ville sur une carte de la RDC et estime sa latitude/longitude approximative.</p>
      </div>
      <div class="bloc cas">
        <h3>Exercices</h3>
        <p><strong>Ex. 1 :</strong> Quelle est la différence entre latitude et longitude ?</p>
        <p><strong>Ex. 2 :</strong> Sur une carte au 1/50 000, 4 cm représentent combien de km sur le terrain ?</p>
        <p><strong>Ex. 3 :</strong> Cite deux éléments à lire en premier sur une carte.</p>
        <details><summary>Corrigé</summary>
          <p>1) La latitude mesure la distance par rapport à l'équateur (N/S) ; la longitude mesure la distance par rapport au méridien de Greenwich (E/O).</p>
          <p>2) 4 × 50 000 = 200 000 cm = 2 km.</p>
          <p>3) Le titre et la légende (ou l'orientation et l'échelle).</p>

title: "Leçon 4 — La lithosphère et le relief",
content: 
      <div class="bloc cas">
        <h2>La lithosphère et le relief</h2>
        <p><strong>Objectifs :</strong> (1) décrire la structure interne de la Terre ; (2) distinguer les grandes formes de relief ; (3) expliquer la formation du relief.</p>
        <p><strong>Prérequis :</strong> leçon 2 (la Terre dans le système solaire).</p>
        <p><strong>Situation de départ :</strong> « Pourquoi y a-t-il des montagnes, des plaines et des volcans ? Que trouve-t-on à l'intérieur de la Terre ? »</p>
      </div>
      <div class="bloc theorie">
        <h3>Développement</h3>
        <p>La Terre est constituée de couches concentriques : le <strong>noyau</strong> (interne et externe), le <strong>manteau</strong>, et la <strong>croûte</strong> (ou écorce terrestre).</p>
        <p>La <strong>lithosphère</strong> est la couche rigide externe (croûte + partie supérieure du manteau), découpée en <strong>plaques tectoniques</strong> qui se déplacent lentement.</p>
        <p>Le <strong>relief</strong> est l'ensemble des irrégularités de la surface terrestre. Il résulte de forces internes (tectonique, volcanisme) et de forces externes (érosion, sédimentation).</p>
        <h3>Définitions</h3>
        <ul>
          <li><strong>Lithosphère :</strong> enveloppe rigide externe de la Terre.</li>
          <li><strong>Plaque tectonique :</strong> fragment de lithosphère en mouvement.</li>
          <li><strong>Relief :</strong> ensemble des formes de la surface (montagnes, plateaux, plaines, dépressions).</li>
          <li><strong>Montagne :</strong> relief élevé, aux pentes fortes, dépassant souvent 500 à 1000 m d'altitude.</li>
          <li><strong>Plaine :</strong> vaste étendue plate de faible altitude.</li>
          <li><strong>Plateau :</strong> surface plane et élevée, aux versants abrupts.</li>
          <li><strong>Volcan :</strong> relief formé par l'arrivée de magma en surface.</li>
        </ul>
        <h3>Méthodes et repères</h3>
        <ul>
          <li>Lire un profil topographique : altitudes, pentes, sommets, vallées.</li>
          <li>Sur une carte topographique, les courbes de niveau indiquent l'altitude ; leur rapprochement signale une pente forte.</li>
          <li>Repères : Everest (8 849 m) ; Kilimandjaro (5 895 m) ; en RDC, mont Stanley (5 109 m, Rwenzori).</li>
        </ul>
      </div>
      <div class="bloc exemple">
        <h3>Exemple et application RDC</h3>
        <p><img src="images/Geographie1_5.jpg" alt="Structure interne de la Terre" /></p>
        <p><img src="images/Geographie1_6.jpg" alt="Le volcan Nyiragongo en éruption" /></p>
        <p><strong>Exemple :</strong> La chaîne des Virunga, à l'est de la RDC, résulte de la tectonique des plaques et du volcanisme du rift africain. Le volcan Nyiragongo est l'un des plus actifs d'Afrique.</p>
        <p><strong>Application RDC :</strong> Cite les grands ensembles de relief de ta région (plaine, plateau, montagne) et relie-les à la carte du relief de la RDC.</p>
      </div>
      <div class="bloc cas">
        <h3>Exercices</h3>
        <p><strong>Ex. 1 :</strong> Cite les trois grandes couches internes de la Terre.</p>
        <p><strong>Ex. 2 :</strong> Qu'est-ce qu'une plaque tectonique ?</p>
        <p><strong>Ex. 3 :</strong> Comment appelle-t-on un relief plat et élevé ?</p>
        <details><summary>Corrigé</summary>
          <p>1) Noyau, manteau, croûte.</p>
          <p>2) Un fragment de la lithosphère qui se déplace sur le manteau.</p>
          <p>3) Un plateau.</p>
        </details>
      </div>
      <div class="bloc resume">
        <h3>Synthèse</h3>
        <p>La Terre est structurée en couches ; le relief résulte de la tectonique et de l'érosion ; la RDC présente une grande variété de reliefs.</p>

title: "Leçon 5 — L'atmosphère et le climat",
content: 
      <div class="bloc cas">
        <h2>L'atmosphère et le climat</h2>
        <p><strong>Objectifs :</strong> (1) décrire la composition de l'atmosphère ; (2) distinguer temps et climat ; (3) reconnaître les grandes zones climatiques.</p>
        <p><strong>Prérequis :</strong> leçon 2 (position de la Terre, saisons).</p>
        <p><strong>Situation de départ :</strong> « Pourquoi fait-il chaud et humide à Kisangani, et plus sec à Lubumbashi ? »</p>
      </div>
      <div class="bloc theorie">
        <h3>Développement</h3>
        <p>L'<strong>atmosphère</strong> est l'enveloppe gazeuse de la Terre : environ 78 % d'azote, 21 % d'oxygène, 1 % d'autres gaz (argon, CO₂, vapeur d'eau).</p>
        <p>Couches : <strong>troposphère</strong> (phénomènes météorologiques), <strong>stratosphère</strong> (couche d'ozone), mésosphère, thermosphère, exosphère.</p>
        <p>Le <strong>temps</strong> est l'état de l'atmosphère à un moment donné et en un lieu donné. Le <strong>climat</strong> est l'ensemble des conditions atmosphériques moyennes sur une longue période (30 ans ou plus).</p>
        <h3>Définitions</h3>
        <ul>
          <li><strong>Météorologie :</strong> science du temps à court terme.</li>
          <li><strong>Climatologie :</strong> science du climat à long terme.</li>
          <li><strong>Précipitations :</strong> eau (pluie, neige, grêle) qui tombe de l'atmosphère.</li>
          <li><strong>Humidité :</strong> quantité de vapeur d'eau dans l'air.</li>
          <li><strong>Zone climatique :</strong> grande région du globe aux caractéristiques climatiques homogènes.</li>
        </ul>
        <h3>Méthodes et repères</h3>
        <p>Les grands facteurs du climat : latitude, altitude, distance à la mer, courants marins, relief, végétation.</p>
        <p>Les grandes zones climatiques : équatoriale, tropicale humide et sèche, désertique, méditerranéenne, tempérée, polaire, de montagne.</p>
        <p>Lire un climatogramme (températures et précipitations mensuelles) pour identifier un climat.</p>
      </div>
      <div class="bloc exemple">
        <h3>Exemple et application RDC</h3>

        <p><strong>Exemple :</strong> La RDC est traversée par l'équateur. Elle possède trois grands types de climats : équatorial (cuvette centrale), tropical humide (Kasaï, Katanga), et de montagne (Kivu).</p>
        <p><strong>Application RDC :</strong> Compare les climats de Kinshasa (tropical humide), de Kisangani (équatorial) et de Goma (de montagne).</p>
      </div>
      <div class="bloc cas">
        <h3>Exercices</h3>
        <p><strong>Ex. 1 :</strong> Quels sont les deux principaux gaz de l'atmosphère ?</p>

        <p><strong>Ex. 3 :</strong> Quel type de climat domine dans la cuvette centrale de la RDC ?</p>
        <details><summary>Corrigé</summary>
          <p>1) Azote (~78 %) et oxygène (~21 %).</p>
          <p>2) Le temps est l'état de l'atmosphère à un moment donné ; le climat est la moyenne sur une longue période.</p>
          <p>3) Le climat équatorial.</p>
        </details>
      </div>
      <div class="bloc resume">
        <h3>Synthèse</h3>
        <p>L'atmosphère protège et conditionne la vie ; temps et climat sont des notions différentes ; la RDC possède plusieurs climats.</p>

      <div class="bloc cas">
        <h2>L'hydrosphère : eaux douces et mers</h2>
        <p><strong>Objectifs :</strong> (1) décrire le cycle de l'eau ; (2) distinguer les types de cours d'eau et de plans d'eau ; (3) comprendre le rôle des océans et des mers.</p>
        <p><strong>Prérequis :</strong> leçon 5 (précipitations, climat).</p>
        <p><strong>Situation de départ :</strong> « D'où vient l'eau du fleuve Congo ? Où va-t-elle ? Pourquoi la mer est-elle salée ? »</p>
      </div>
      <div class="bloc theorie">
        <h3>Développement</h3>
        <p>L'<strong>hydrosphère</strong> est l'ensemble des eaux de la Terre : océans, mers, lacs, fleuves, rivières, eaux souterraines, glaces, vapeur d'eau.</p>
        <p>Environ <strong>97 % de l'eau est salée</strong> (océans et mers) ; 3 % seulement est de l'eau douce, dont une grande partie stockée dans les glaces.</p>
        <p><strong>Cycle de l'eau :</strong> évaporation → condensation (nuages) → précipitations → ruissellement et infiltration → retour aux océans.</p>
        <h3>Définitions</h3>
        <ul>
          <li><strong>Fleuve :</strong> cours d'eau important qui se jette dans une mer, un océan ou un autre fleuve.</li>
          <li><strong>Rivière :</strong> cours d'eau moyen, affluent d'un fleuve.</li>
          <li><strong>Bassin hydrographique :</strong> territoire drainé par un fleuve et ses affluents.</li>
          <li><strong>Lac :</strong> étendue d'eau douce (ou salée) entourée de terres.</li>
          <li><strong>Nappe phréatique :</strong> eau souterraine stockée dans le sol.</li>
        </ul>
        <h3>Méthodes et repères</h3>
        <ul>
          <li>Lire une carte hydrographique : repérer cours d'eau, bassins versants, lacs, exutoire.</li>
          <li>Régime équatorial (crues régulières) ; régime tropical (hautes eaux et basses eaux marquées).</li>
          <li>Nil (6 650 km), Amazone (6 400 km) ; fleuve Congo ≈ 4 700 km, bassin > 3,7 millions de km².</li>
        </ul>
      </div>
      <div class="bloc exemple">
        <h3>Exemple et application RDC</h3>
        <p><img src="images/Geographie1_9.jpg" alt="Schéma du cycle de l'eau" /></p>
        <p><img src="images/Geographie1_10.jpg" alt="Le fleuve Congo" /></p>
        <p><strong>Exemple :</strong> Le fleuve Congo prend sa source dans le sud du Katanga, traverse la cuvette centrale, et se jette dans l'océan Atlantique. Il possède un immense réseau d'affluents (Kasai, Ubangi, Lomami, Aruwimi…). Son débit est le deuxième du monde après l'Amazone.</p>
        <p><strong>Application RDC :</strong> Nomme un cours d'eau de ta région et indique son rôle (pêche, transport, agriculture, eau potable).</p>
      </div>
      <div class="bloc cas">
        <h3>Exercices</h3>
        <p><strong>Ex. 1 :</strong> Quelles sont les grandes étapes du cycle de l'eau ?</p>
        <p><strong>Ex. 2 :</strong> Qu'est-ce qu'un bassin hydrographique ?</p>
        <p><strong>Ex. 3 :</strong> Quel est le principal fleuve de la RDC ?</p>
        <details><summary>Corrigé</summary>
          <p>1) Évaporation, condensation, précipitations, ruissellement/infiltration.</p>
          <p>2) Le territoire drainé par un fleuve et ses affluents.</p>
          <p>3) Le fleuve Congo.</p>
        </details>
      </div>
      <div class="bloc resume">
        <h3>Synthèse</h3>
        <p>L'eau est une ressource vitale inégalement répartie ; le cycle de l'eau relie océans, atmosphère et continents ; la RDC est un pays d'eau, avec le deuxième fleuve du monde par son débit.</p>
      </div>

        <p><strong>Objectifs :</strong> (1) reconnaître les grandes zones de végétation ; (2) décrire la formation et les types de sols ; (3) expliquer le rôle de la végétation et des sols.</p>
        <p><strong>Prérequis :</strong> leçon 5 (climat).</p>

      </div>
      <div class="bloc theorie">
        <h3>Développement</h3>
        <p>La végétation dépend du climat, du sol et de l'action humaine. Elle comprend : forêt équatoriale, savane, steppe, désert, végétation de montagne, mangrove, végétation méditerranéenne.</p>
        <p>La RDC abrite une grande partie de la <strong>deuxième forêt tropicale du monde</strong>, après l'Amazonie : la forêt du bassin du Congo.</p>
        <p>Le <strong>sol</strong> est la couche superficielle meuble de la Terre, formée par l'altération des roches et par l'action des êtres vivants (<strong>humus</strong>).</p>
        <h3>Définitions</h3>
        <ul>
          <li><strong>Forêt équatoriale :</strong> forêt dense, humide, sempervirente, à grande biodiversité.</li>
          <li><strong>Savane :</strong> formation végétale de hautes herbes, parfois parsemée d'arbres.</li>
          <li><strong>Steppe :</strong> végétation basse, adaptée à la sécheresse.</li>
          <li><strong>Humus :</strong> matière organique décomposée qui enrichit le sol.</li>
          <li><strong>Érosion :</strong> usure et transport des sols par l'eau, le vent, etc.</li>
          <li><strong>Pédologie :</strong> science qui étudie les sols.</li>
        </ul>
        <h3>Méthodes et repères</h3>
        <ul>
          <li>Lire une carte de végétation : repérer les grandes formations et les relier aux zones climatiques.</li>
          <li>Reconnaître un sol : texture (sableuse, argileuse, limoneuse), couleur (rouge, noire, brune), richesse en humus.</li>
          <li>La forêt du bassin du Congo couvre environ 200 millions d'hectares ; elle est menacée par la déforestation.</li>

        <p><strong>Application RDC :</strong> Observe la végétation autour de ton école (forêt, savane, cultures) et déduis-en des éléments du climat et du sol.</p>

      <div class="bloc resume">

title: "Leçon 8 — La population mondiale",
content: 
      <div class="bloc cas">
        <h2>La population mondiale</h2>
        <p><strong>Objectifs :</strong> (1) lire une carte de répartition de la population ; (2) comprendre les notions de densité, de croissance et de migration ; (3) expliquer les facteurs de peuplement.</p>
        <p><strong>Prérequis :</strong> leçons 1 et 6.</p>
        <p><strong>Situation de départ :</strong> « Pourquoi certaines régions du monde sont-elles très peuplées et d'autres presque vides ? Où vivent les 8 milliards d'êtres humains ? »</p>
      </div>
      <div class="bloc theorie">
        <h3>Développement</h3>
        <p>La population mondiale dépasse <strong>8 milliards d'habitants</strong> (2024). Elle est inégalement répartie : foyers majeurs en Asie de l'Est et du Sud (Chine, Inde), en Europe, en Amérique du Nord, au Moyen-Orient et dans certaines régions d'Afrique.</p>
        <p>Les facteurs de peuplement : climat, relief, ressources en eau, sols, activités économiques, histoire, sécurité.</p>
        <p>La croissance démographique varie fortement : forte en Afrique subsaharienne, faible en Europe et au Japon.</p>
        <h3>Définitions</h3>
        <ul>
          <li><strong>Densité de population :</strong> nombre d'habitants par km² (habitants ÷ superficie).</li>
          <li><strong>Croissance naturelle :</strong> différence entre natalité et mortalité.</li>
          <li><strong>Migration :</strong> déplacement de populations (émigration et immigration).</li>
          <li><strong>Taux d'urbanisation :</strong> part de la population vivant en ville.</li>
          <li><strong>Population active :</strong> population en âge de travailler et exerçant un emploi.</li>
          <li><strong>Pyramide des âges :</strong> graphique représentant la répartition par âge et par sexe.</li>
        </ul>
        <h3>Méthodes et repères</h3>
        <ul>
          <li>Calculer une densité : population ÷ superficie. Ex. : 10 millions d'habitants sur 100 000 km² = 100 hab/km².</li>
          <li>Lire une pyramide des âges : base large = population jeune ; sommet large = population âgée.</li>
          <li>La population mondiale dépasse 8 milliards ; l'Inde a dépassé la Chine (2023) ; l'Afrique est le continent à la croissance la plus rapide.</li>
        </ul>
      </div>
      <div class="bloc exemple">
        <h3>Exemple et application RDC</h3>
        <p><img src="images/Geographie1_13.jpg" alt="Carte de la densité de population mondiale" /></p>
        <p><strong>Exemple :</strong> La Chine et l'Inde regroupent à elles deux plus du tiers de la population mondiale. En revanche, des pays comme le Canada ou l'Australie ont de très vastes territoires peu peuplés (faible densité).</p>
        <p><strong>Application RDC :</strong> La RDC compte plus de 100 millions d'habitants (estimation 2024), sur 2,345 millions de km², soit une densité moyenne d'environ 43 hab/km². Mais cette moyenne masque de fortes inégalités : Kinshasa concentre une population massive, alors que la cuvette centrale est peu peuplée.</p>
      </div>
      <div class="bloc cas">
        <h3>Exercices</h3>
        <p><strong>Ex. 1 :</strong> Comment calcule-t-on la densité de population ?</p>
        <p><strong>Ex. 2 :</strong> Cite deux facteurs de peuplement.</p>
        <p><strong>Ex. 3 :</strong> Quelle est la population mondiale approximative en 2024 ?</p>
        <details><summary>Corrigé</summary>
          <p>1) Population ÷ superficie.</p>
          <p>2) Climat, relief, eau, ressources, activités, histoire, sécurité (2 au choix).</p>

      </div>

title: "Leçon 9 — La population de la RDC",

      <div class="bloc cas">
        <h2>La population de la RDC</h2>
        <p><strong>Objectifs :</strong> (1) décrire la répartition de la population congolaise ; (2) analyser sa structure (âge, urbanisation) ; (3) comprendre les enjeux démographiques.</p>
        <p><strong>Prérequis :</strong> leçons 8 et 3.</p>
        <p><strong>Situation de départ :</strong> « Où vivent les Congolais ? Pourquoi Kinshasa est-elle une des plus grandes villes d'Afrique ? »</p>
      </div>
      <div class="bloc theorie">
        <h3>Développement</h3>
        <p>La RDC compte plus de <strong>100 millions d'habitants</strong> (estimation 2024, UNDESA). Elle est le pays le plus peuplé d'Afrique centrale et le 4e d'Afrique après le Nigeria, l'Éthiopie et l'Égypte.</p>
        <p>La population est très inégalement répartie : fortes densités dans les zones urbaines (Kinshasa, Lubumbashi, Goma, Bukavu, Kisangani, Mbuji-Mayi), sur les plateaux de l'Est et du Kasaï ; faibles densités dans la cuvette centrale.</p>
        <p>La population est très <strong>jeune</strong> : plus de 60 % a moins de 25 ans.</p>
        <h3>Définitions</h3>
        <ul>
          <li><strong>Accroissement naturel :</strong> natalité − mortalité.</li>
          <li><strong>Transition démographique :</strong> passage d'une forte natalité et mortalité à une faible natalité et mortalité.</li>
          <li><strong>Exode rural :</strong> départ des populations des campagnes vers les villes.</li>
          <li><strong>Mégalopole :</strong> très grande agglomération urbaine.</li>
          <li><strong>Taux de fécondité :</strong> nombre moyen d'enfants par femme.</li>
        </ul>
        <h3>Méthodes et repères</h3>
        <ul>

function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}

      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
