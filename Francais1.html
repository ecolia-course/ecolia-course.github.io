        <h2>Les éléments d'une situation de communication</h2>
        <ul>
          <li><strong>Émetteur :</strong> celui qui envoie le message.</li>
          <li><strong>Récepteur (destinataire) :</strong> celui qui reçoit le message.</li>
          <li><strong>Message :</strong> ce qui est dit ou écrit.</li>
          <li><strong>Canal :</strong> le moyen utilisé (voix, lettre, téléphone, radio).</li>
          <li><strong>Code :</strong> la langue et les signes utilisés pour être compris.</li>
          <li><strong>Contexte :</strong> la situation (lieu, moment, circonstances).</li>
          <li><strong>Intention :</strong> pourquoi on communique (informer, demander, raconter, décrire, convaincre, exprimer un sentiment).</li>
        </ul>
        <p><img src="images/Francais1_2.jpg" alt="Schéma de la communication : émetteur, message, récepteur" /></p>

        <p>Pour analyser une situation de communication, pose-toi ces questions :</p>
        <ol>
          <li><strong>Qui parle ?</strong> (émetteur)</li>
          <li><strong>À qui ?</strong> (récepteur)</li>
          <li><strong>De quoi ?</strong> (message)</li>
          <li><strong>Par quel moyen ?</strong> (canal)</li>
          <li><strong>Pourquoi ?</strong> (intention)</li>

        <h3>Les trois registres de langue</h3>
        <ul>
          <li><strong>Familier :</strong> entre amis, en famille.</li>
          <li><strong>Courant :</strong> usage ordinaire, à l'école.</li>
          <li><strong>Soutenu :</strong> lettres officielles, cérémonies.</li>

        <p><strong>Objectifs :</strong> (1) reconnaître les quatre types de phrases ; (2) construire une phrase affirmative ou négative ; (3) poser une question correctement.</p>
        <p><strong>Prérequis :</strong> savoir reconnaître une phrase (majuscule, point).</p>
        <p><strong>Situation de départ :</strong> Au marché de Goma, on entend : « Combien coûte ce pagne ? », « Quel beau tissu ! », « Approchez ! », « Je n'ai pas d'argent ». Ces phrases disent-elles toutes la même chose, de la même manière ?</p>

{
title: "Leçon 3 — Développement",
content: 
      <div class="bloc theorie">
        <h2>Quatre types, deux formes</h2>
        <p>Une phrase commence par une majuscule et se termine par un point (.), un point d'interrogation (?), un point d'exclamation (!) ou des points de suspension (…).</p>
        <p><strong>Quatre types selon l'intention :</strong></p>
        <ul>
          <li><strong>Déclarative :</strong> informer.</li>
          <li><strong>Interrogative :</strong> questionner.</li>
          <li><strong>Impérative :</strong> ordonner, conseiller.</li>
          <li><strong>Exclamative :</strong> exprimer un sentiment.</li>
        </ul>
        <p><strong>Deux formes :</strong> affirmative et négative.</p>
        <p><img src="images/Francais1_6.jpg" alt="Signes de ponctuation : point, point d'interrogation, point d'exclamation" /></p>
      </div>
    
},
{
title: "Leçon 3 — Définitions",
content: 
      <div class="bloc theorie">
        <h2>Définitions</h2>
        <ul>
          <li><strong>Phrase déclarative :</strong> énonce un fait, se termine par un point.</li>
          <li><strong>Phrase interrogative :</strong> pose une question, se termine par « ? ».</li>
          <li><strong>Phrase impérative :</strong> exprime un ordre, un conseil, une défense ; verbe à l'impératif.</li>
          <li><strong>Phrase exclamative :</strong> exprime la surprise, la joie, la colère ; se termine par « ! ».</li>
          <li><strong>Forme négative :</strong> emploie une négation à deux mots : ne… pas, ne… jamais, ne… plus, ne… rien, ne… personne.</li>
        </ul>
      </div>
    
},
{
title: "Leçon 3 — Méthodes et règles",
content: 
      <div class="bloc theorie">
        <h2>Transformer une phrase</h2>
        <h3>Passer à la forme négative</h3>
        <p>Encadrer le verbe conjugué par « ne » et « pas » : « Il mange » → « Il ne mange pas ». Devant une voyelle, ne → n' : « Il n'aime pas ».</p>
        <h3>Poser une question</h3>
        <ol>
          <li>Ajouter « est-ce que » : « Est-ce que tu viens ? »</li>
          <li>Inverser sujet et verbe, avec un trait d'union : « Viens-tu ? »</li>
          <li>Utiliser un mot interrogatif : qui, que, où, quand, comment, pourquoi, combien.</li>
        </ol>
        <p><strong>Question totale :</strong> réponse oui/non. <strong>Question partielle :</strong> mot interrogatif.</p>
        <p><strong>Attention :</strong> au passé composé, la négation encadre l'auxiliaire : « Il n'a pas mangé ».</p>
      </div>
    
},

title: "Leçon 3 — Exemples expliqués",
content:

          <li>« Mireille ne vend pas de poisson. » → déclarative, négative.</li>
          <li>« Où habite Amani ? » → interrogative (question partielle).</li>
          <li>« Ferme la porte ! » → impérative.</li>
          <li>« Comme ce fleuve est large ! » → exclamative.</li>

        <p><strong>Objectifs :</strong> (1) reconnaître nom commun et nom propre ; (2) identifier genre et nombre ; (3) reconnaître articles, possessifs, démonstratifs ; (4) accorder l'adjectif ; (5) former un groupe nominal.</p>
        <p><strong>Prérequis :</strong> phrase simple (leçon 3).</p>

{
title: "Leçon 4 — Développement",
content: 
      <div class="bloc theorie">
        <h2>Autour du nom</h2>
        <p>Le <strong>nom</strong> désigne une personne, un animal, une chose, une idée. Il a un genre (masculin ou féminin) et un nombre (singulier ou pluriel).</p>
        <p>Le nom est presque toujours précédé d'un <strong>déterminant</strong>, qui indique son genre et son nombre.</p>
        <p>L'<strong>adjectif qualificatif</strong> donne une qualité au nom : il s'accorde avec lui.</p>
        <p><strong>Groupe nominal (GN) :</strong> déterminant + (adjectif) + nom + (adjectif).</p>
      </div>
    
},
{
title: "Leçon 4 — Définitions",
content: 
      <div class="bloc theorie">
        <h2>Définitions</h2>
        <ul>
          <li><strong>Nom commun :</strong> désigne une catégorie (un fleuve, une ville). <strong>Nom propre :</strong> désigne un être ou un lieu précis, avec majuscule (Congo, Kinshasa, Amani).</li>
          <li><strong>Articles définis :</strong> le, la, l', les. <strong>Articles indéfinis :</strong> un, une, des. <strong>Articles partitifs :</strong> du, de la, de l'.</li>
          <li><strong>Déterminants possessifs :</strong> mon, ma, mes, ton, ta, tes, son, sa, ses, notre, nos, votre, vos, leur, leurs.</li>
          <li><strong>Déterminants démonstratifs :</strong> ce, cet, cette, ces.</li>
          <li><strong>Adjectif qualificatif :</strong> mot qui précise le nom. <strong>Épithète :</strong> directement à côté du nom (« une grande maison »). <strong>Attribut :</strong> relié par un verbe d'état (« la maison est grande »).</li>
        </ul>
      </div>
    
},
{
title: "Leçon 4 — Méthodes et règles",
content: 
      <div class="bloc theorie">
        <h2>Reconnaître et accorder</h2>
        <ul>
          <li>Pour trouver le déterminant : je peux mettre « un/une » ou « le/la » devant le mot.</li>
          <li><strong>Ce / cet :</strong> « cet » devant un nom masculin commençant par voyelle ou h muet (cet enfant).</li>
          <li>L'adjectif s'accorde en genre et en nombre avec le nom : « un petit garçon / une petite fille / des petits garçons ».</li>
          <li>Un adjectif peut précéder ou suivre le nom : « une belle ville / une ville calme ».</li>
        </ul>

},

// ---------- LEÇON 5 : CONSTITUANTS DE LA PHRASE SIMPLE ----------
{
title: "Leçon 5 — Les constituants de la phrase simple (ouverture)",
content: 
      <div class="bloc cas">
        <h2>Les constituants de la phrase simple</h2>
        <p><strong>Objectifs :</strong> (1) trouver le verbe et son sujet ; (2) reconnaître COD, COI et compléments circonstanciels ; (3) reconnaître l'attribut du sujet.</p>
        <p><strong>Prérequis :</strong> nom, déterminant, adjectif (leçon 4).</p>
        <p><strong>Situation de départ :</strong> « Amani mange du manioc à midi. » Qui mange ? Que mange-t-il ? Quand ? Chaque réponse correspond à un élément de la phrase.</p>
      </div>
    
},
{
title: "Leçon 5 — Développement",
content: 
      <div class="bloc theorie">
        <h2>Organisation de la phrase simple</h2>
        <p>La phrase simple est organisée autour d'un <strong>verbe conjugué</strong>.</p>
        <p>Autour du verbe :</p>
        <ul>
          <li>le <strong>sujet</strong> (qui fait l'action) ;</li>
          <li>des <strong>compléments</strong> (qui la précisent).</li>
        </ul>
        <p>Certains compléments sont essentiels (COD, COI), d'autres sont facultatifs (circonstanciels).</p>
        <p>Avec un verbe d'état, on trouve un <strong>attribut du sujet</strong>.</p>
      </div>
    
},
{
title: "Leçon 5 — Définitions",
content: 
      <div class="bloc theorie">
        <h2>Définitions</h2>
        <p><img src="images/Francais1_9.jpg" alt="Arbre syntaxique d'une phrase simple" /></p>
        <ul>
          <li><strong>Verbe :</strong> mot qui exprime une action ou un état ; il se conjugue.</li>
          <li><strong>Sujet :</strong> celui qui fait l'action ou qui est dans l'état ; question : « qui est-ce qui ? / qu'est-ce qui ? » + verbe.</li>
          <li><strong>COD (complément d'objet direct) :</strong> complète le verbe sans préposition ; question : « qui ? quoi ? » après le verbe.</li>
          <li><strong>COI (complément d'objet indirect) :</strong> complète le verbe avec une préposition (à, de) ; question : « à qui ? à quoi ? de qui ? de quoi ? ».</li>
          <li><strong>Complément circonstanciel :</strong> indique le lieu (où), le temps (quand), la manière (comment) ; il peut se déplacer ou se supprimer.</li>
          <li><strong>Attribut du sujet :</strong> donne une qualité au sujet après un verbe d'état (être, sembler, paraître, devenir, rester).</li>
        </ul>
      </div>
    
},
{
title: "Leçon 5 — Méthodes et règles",
content: 
      <div class="bloc theorie">
        <h2>Méthode d'analyse</h2>
        <ol>
          <li>Souligner le verbe conjugué.</li>
          <li>Trouver le sujet.</li>
          <li>Poser « qui ? quoi ? » (COD), « à qui ? de quoi ? » (COI).</li>
          <li>Repérer ce qu'on peut supprimer ou déplacer (circonstanciels).</li>
        </ol>
        <p><strong>Test de déplacement :</strong> « À midi, Amani mange du manioc » : « à midi » se déplace, c'est un circonstanciel.</p>
        <p>Un verbe d'état ne reçoit pas de COD : après être, on cherche un attribut.</p>
      </div>
    
},
{
title: "Leçon 5 — Exemples expliqués",
content: 
      <div class="bloc exemple">
        <h2>Exemples</h2>
        <ul>
          <li>« Mireille lit un livre. » : sujet <strong>Mireille</strong>, verbe <strong>lit</strong>, COD <strong>un livre</strong>.</li>
          <li>« Mireille parle à sa mère. » : COI <strong>à sa mère</strong>.</li>
          <li>« Les pêcheurs partent à l'aube. » : circonstanciel de temps <strong>à l'aube</strong>.</li>
          <li>« Mon frère est devenu infirmier. » : attribut du sujet <strong>infirmier</strong>.</li>
          <li>« Au marché, Esther achète du poisson frais. » : circonstanciel de lieu <strong>au marché</strong> ; COD <strong>du poisson frais</strong>.</li>
        </ul>
      </div>
    
},
{
title: "Leçon 5 — Applications RDC et exercices",
content: 
      <div class="bloc cas">
        <h2>Application et exercices</h2>
        <p><strong>Application :</strong> « Le volcan Nyiragongo domine la ville de Goma. » Sujet : le volcan Nyiragongo ; verbe : domine ; COD : la ville de Goma.</p>
        <p><img src="images/Francais1_10.jpg" alt="Le volcan Nyiragongo près de la ville de Goma" /></p>
        <p><strong>Ex. 1 :</strong> Souligne le verbe et trouve le sujet : « Les enfants jouent dans la cour. »</p>
        <p><strong>Ex. 2 :</strong> Trouve le COD : « Chantal prépare le repas. »</p>
        <p><strong>Ex. 3 :</strong> Donne la nature du groupe en italique : « Il arrive <em>demain</em>. » « Papa pense <em>à ses enfants</em>. » « Elle est <em>courageuse</em>. »</p>
        <p><strong>Ex. 4 :</strong> Écris une phrase avec sujet, verbe, COD et un complément de lieu.</p>
        <details><summary>Corrigé</summary>
          <p>1) jouent / les enfants.</p>
          <p>2) le repas.</p>
          <p>3) circonstanciel de temps ; COI ; attribut du sujet.</p>
          <p>4) Exemple : « Patrick lit un livre dans le jardin. »</p>
        </details>
      </div>
    
},
{
title: "Leçon 5 — Synthèse",
content: 
      <div class="bloc resume">
        <h2>Synthèse — Constituants de la phrase</h2>
        <ul>
          <li>Phrase simple = sujet + verbe + compléments.</li>
          <li>COD : sans préposition ; COI : avec à ou de ; circonstanciel : lieu, temps, manière, déplaçable.</li>
          <li>Verbe d'état : attribut du sujet.</li>
        </ul>
      </div>
    
},

        <p><strong>Objectifs :</strong> (1) employer les pronoms sujets ; (2) remplacer un groupe nominal par un pronom (le, la, les, lui, leur) ; (3) éviter les répétitions.</p>

        <p><strong>Situation de départ :</strong> « Amani lit le livre. Amani aime le livre. Amani range le livre. » Que peut-on faire pour alléger ce texte ?</p>

{
title: "Leçon 6 — Développement",
content: 
      <div class="bloc theorie">
        <h2>À quoi servent les pronoms ?</h2>
        <p>Un pronom remplace un nom ou un groupe nominal déjà mentionné.</p>
        <p><strong>Pronoms sujets :</strong> je, tu, il, elle, on, nous, vous, ils, elles.</p>
        <p><strong>Pronoms compléments :</strong> me, te, le, la, les, lui, leur, en, y.</p>
        <p>Les pronoms évitent les répétitions et rendent le texte plus fluide.</p>
      </div>
    
},
{
title: "Leçon 6 — Définitions",
content: 
      <div class="bloc theorie">
        <h2>Définitions</h2>
        <p><img src="images/Francais1_11.jpg" alt="Tableau des pronoms personnels en français" /></p>
        <ul>
          <li><strong>Personne :</strong> 1re (celui qui parle : je, nous) ; 2e (celui à qui on parle : tu, vous) ; 3e (celui dont on parle : il, elle, on, ils, elles).</li>
          <li><strong>COD :</strong> le, la, les (remplacent une personne ou une chose sans préposition).</li>
          <li><strong>COI (personnes) :</strong> lui, leur (remplacent « à + personne »).</li>
          <li><strong>« on » :</strong> pronom indéfini, souvent équivalent de « nous » à l'oral ; il se conjugue comme « il ».</li>
        </ul>
      </div>
    
},
{

// ---------- LEÇON 7 : VERBE, GROUPES, ÊTRE ET AVOIR ----------
{
title: "Leçon 7 — Le verbe, les groupes, être et avoir (ouverture)",
content: 
      <div class="bloc cas">
        <h2>Le verbe, les groupes, être et avoir</h2>
        <p><strong>Objectifs :</strong> (1) reconnaître un verbe et son infinitif ; (2) classer un verbe dans son groupe ; (3) conjuguer être et avoir au présent.</p>
        <p><strong>Prérequis :</strong> sujet, pronoms personnels (leçons 5 et 6).</p>
        <p><strong>Situation de départ :</strong> « Je chante, tu chantes, nous chantons. » Qu'est-ce qui change dans le mot ? Qu'est-ce qui reste ?</p>
      </div>
    
},
{
title: "Leçon 7 — Développement",
content: 
      <div class="bloc theorie">
        <h2>Le verbe change de forme</h2>
        <p>Le verbe est le mot qui change de forme selon la personne, le nombre et le temps.</p>
        <p>Chaque verbe a un <strong>infinitif</strong> (chanter, finir, prendre), qui est son nom dans le dictionnaire.</p>
        <p>Le verbe se compose d'un <strong>radical</strong> (qui porte le sens) et d'une <strong>terminaison</strong> (qui change).</p>
        <p><strong>Temps simples :</strong> une seule forme. <strong>Temps composés :</strong> auxiliaire + participe passé.</p>
      </div>
    
},
{
title: "Leçon 7 — Définitions",
content: 
      <div class="bloc theorie">
        <h2>Définitions et groupes</h2>
        <ul>
          <li><strong>Infinitif :</strong> forme non conjuguée du verbe.</li>
          <li><strong>Radical :</strong> début du verbe (chant-). <strong>Terminaison :</strong> fin (-ons).</li>
          <li><strong>1er groupe :</strong> verbes en -er (chanter, manger), sauf aller.</li>
          <li><strong>2e groupe :</strong> verbes en -ir qui font -issons à la 1re pers. du pluriel (finir, grandir, choisir).</li>
          <li><strong>3e groupe :</strong> tous les autres : aller, verbes en -ir sans -iss- (partir, venir), verbes en -re (prendre, dire, faire), verbes en -oir (voir, pouvoir, vouloir).</li>
          <li><strong>Auxiliaires :</strong> être et avoir.</li>
        </ul>
      </div>
    
},
{
title: "Leçon 7 — Méthodes et règles",
content: 
      <div class="bloc theorie">
        <h2>Classer et conjuguer</h2>
        <h3>Pour classer un verbe</h3>
        <ol>
          <li>Trouver l'infinitif.</li>
          <li>Regarder la terminaison.</li>
          <li>Pour -ir, tester « nous… -issons ».</li>
        </ol>
        <h3>Présent d'ÊTRE</h3>
        <p>je suis, tu es, il/elle/on est, nous sommes, vous êtes, ils/elles sont.</p>
        <h3>Présent d'AVOIR</h3>
        <p>j'ai, tu as, il/elle/on a, nous avons, vous avez, ils/elles ont.</p>
        <p>Ces deux verbes sont irréguliers et servent d'auxiliaires.</p>
      </div>
    
},
{
title: "Leçon 7 — Exemples expliqués",
content: 
      <div class="bloc exemple">
        <h2>Exemples</h2>
        <ul>
          <li>« manger » → 1er groupe.</li>
          <li>« finir » (nous finissons) → 2e groupe.</li>
          <li>« partir » (nous partons) → 3e groupe.</li>
          <li>« prendre » → 3e groupe.</li>
          <li>« aller » → 3e groupe.</li>
        </ul>
        <p>« Nous sommes à Kinshasa. » (être) ; « Ils ont un cahier. » (avoir).</p>
      </div>
    
},
{
title: "Leçon 7 — Applications RDC et exercices",
content: 
      <div class="bloc cas">
        <h2>Application et exercices</h2>
        <p><strong>Application :</strong> « Je suis élève à Kisangani. J'ai un cahier et un stylo. » Identifie être et avoir.</p>
        <p><strong>Ex. 1 :</strong> Classe : jouer, grandir, venir, lire, réussir, aller.</p>
        <p><strong>Ex. 2 :</strong> Complète avec être : « Vous ___ en retard. » « Elles ___ contentes. »</p>
        <p><strong>Ex. 3 :</strong> Complète avec avoir : « Tu ___ raison. » « Nous ___ faim. »</p>
        <details><summary>Corrigé</summary>
          <p>1) 1er : jouer ; 2e : grandir, réussir ; 3e : venir, lire, aller.</p>
          <p>2) êtes, sont.</p>
          <p>3) as, avons.</p>
        </details>
      </div>
    
},
{
title: "Leçon 7 — Synthèse",
content: 
      <div class="bloc resume">
        <h2>Synthèse — Verbe, groupes, être et avoir</h2>
        <ul>
          <li>Verbe = radical + terminaison ; infinitif.</li>
          <li>3 groupes. Aller est du 3e groupe.</li>
          <li>Être et avoir : à connaître par cœur.</li>
        </ul>
      </div>
    
},
// ---------- LEÇON 8 : PRÉSENT DE L'INDICATIF ----------
{
title: "Leçon 8 — Le présent de l'indicatif (ouverture)",
content: 
      <div class="bloc cas">
        <h2>Le présent de l'indicatif</h2>
        <p><strong>Objectifs :</strong> (1) conjuguer les verbes du 1er, 2e et 3e groupe au présent ; (2) connaître quelques verbes irréguliers fréquents ; (3) reconnaître les valeurs du présent.</p>
        <p><strong>Prérequis :</strong> groupes de verbes, être et avoir (leçon 7).</p>
        <p><strong>Situation de départ :</strong> « Maman prépare la chikwangue. » Que fait-elle en ce moment ? Et chaque jour ?</p>
      </div>
    
},
{
title: "Leçon 8 — Développement",
content: 
      <div class="bloc theorie">
        <h2>Les valeurs du présent</h2>
        <ul>
          <li>Une action qui se passe <strong>maintenant</strong> : « Il pleut. »</li>
          <li>Une <strong>habitude</strong> : « Chaque matin, Amani va à l'école. »</li>
          <li>Une <strong>vérité générale</strong> : « Le fleuve Congo traverse plusieurs pays. »</li>
        </ul>
        <p>Les terminaisons dépendent du groupe.</p>
      </div>
    
},
{
title: "Leçon 8 — Définitions",
content: 
      <div class="bloc theorie">
        <h2>Terminaisons du présent</h2>
        <ul>
          <li><strong>1er groupe :</strong> -e, -es, -e, -ons, -ez, -ent (chanter : je chante, tu chantes, il chante, nous chantons, vous chantez, ils chantent).</li>
          <li><strong>2e groupe :</strong> -is, -is, -it, -issons, -issez, -issent (finir : je finis, tu finis, il finit, nous finissons, vous finissez, ils finissent).</li>
          <li><strong>3e groupe :</strong> terminaisons variables (-s, -s, -t, -ons, -ez, -ent).</li>
          <li><strong>Particularités :</strong> verbes en -cer (nous commençons) et en -ger (nous mangeons).</li>
        </ul>
      </div>
    
},
{
title: "Leçon 8 — Méthodes et règles",
content: 
      <div class="bloc theorie">
        <h2>Conjuguer au présent</h2>
        <p><strong>Étapes :</strong> infinitif → groupe → radical → terminaison de la personne.</p>
        <h3>Verbes irréguliers fréquents</h3>
        <ul>
          <li><strong>aller :</strong> je vais, tu vas, il va, nous allons, vous allez, ils vont.</li>
          <li><strong>faire :</strong> je fais, tu fais, il fait, nous faisons, vous faites, ils font.</li>
          <li><strong>dire :</strong> je dis, tu dis, il dit, nous disons, vous dites, ils disent.</li>
          <li><strong>prendre :</strong> je prends, tu prends, il prend, nous prenons, vous prenez, ils prennent.</li>
          <li><strong>venir :</strong> je viens, tu viens, il vient, nous venons, vous venez, ils viennent.</li>
          <li><strong>pouvoir :</strong> je peux, tu peux, il peut, nous pouvons, vous pouvez, ils peuvent.</li>
          <li><strong>vouloir :</strong> je veux, tu veux, il veut, nous voulons, vous voulez, ils veulent.</li>
          <li><strong>voir :</strong> je vois, tu vois, il voit, nous voyons, vous voyez, ils voient.</li>
        </ul>
        <p><strong>Piège :</strong> « ils chantent » (-ent muet) ≠ « nous chantons ».</p>
      </div>
    
},
{
title: "Leçon 8 — Exemples expliqués",
content: 
      <div class="bloc exemple">
        <h2>Exemples</h2>
        <ul>
          <li>« Amani chante » (1er groupe).</li>
          <li>« Les élèves finissent leur devoir » (2e groupe).</li>
          <li>« Nous prenons le bateau. »</li>
          <li>« Vous faites vos devoirs. »</li>
          <li>« Papa va au marché. »</li>
        </ul>
        <p><strong>Valeur :</strong> « Le soleil se lève à l'est » (vérité générale).</p>
      </div>
    
},
{
title: "Leçon 8 — Applications RDC et exercices",
content: 
      <div class="bloc cas">
        <h2>Application et exercices</h2>
        <p><strong>Application :</strong> Texte « Maman prépare la chikwangue : elle épluche le manioc, le lave, le râpe, puis le cuit à la vapeur. »</p>
        <p><img src="images/Francais1_12.jpg" alt="Chikwangue préparée à partir du manioc" /></p>
        <p><strong>Ex. 1 :</strong> Conjugue au présent : « Nous (manger) du poisson. » « Ils (finir) leur travail. » « Tu (faire) tes devoirs. »</p>
        <p><strong>Ex. 2 :</strong> Complète : « Vous (aller) au marché. » « Elle (venir) de Goma. »</p>
        <p><strong>Ex. 3 :</strong> Quelle est la valeur du présent : « Le Congo est un grand pays. »</p>
        <details><summary>Corrigé</summary>
          <p>1) mangeons, finissent, fais.</p>
          <p>2) allez, vient.</p>
          <p>3) vérité générale.</p>
        </details>
      </div>
    
},

title: "Leçon 8 — Synthèse",
content: 
      <div class="bloc resume">
        <h2>Synthèse — Présent de l'indicatif</h2>
        <ul>
          <li>1er groupe : -e, -es, -e, -ons, -ez, -ent. 2e groupe : -is, -is, -it, -issons, -issez, -issent.</li>
          <li>Irréguliers à retenir : aller, faire, dire, prendre, venir, pouvoir, vouloir, voir.</li>
          <li>Valeurs : maintenant, habitude, vérité générale.</li>
        </ul>
      </div>
    
},
// ---------- LEÇON 9 : PASSÉ COMPOSÉ ----------
{
title: "Leçon 9 — Le passé composé (ouverture)",
content: 
      <div class="bloc cas">
        <h2>Le passé composé</h2>
        <p><strong>Objectifs :</strong> (1) former le passé composé ; (2) choisir l'auxiliaire être ou avoir ; (3) accorder le participe passé avec être ; (4) former la négation.</p>
        <p><strong>Prérequis :</strong> être et avoir, présent (leçons 7 et 8).</p>
        <p><strong>Situation de départ :</strong> « Hier, Patrick est arrivé à Matadi. Il a pris le train. » Les actions sont-elles terminées ?</p>
      </div>
    
},
{
title: "Leçon 9 — Développement",
content: 
      <div class="bloc theorie">
        <h2>Un temps composé</h2>
        <p>Le passé composé exprime une action <strong>terminée</strong>, située dans le passé.</p>
        <p>Il est formé de l'<strong>auxiliaire</strong> (avoir ou être, au présent) + le <strong>participe passé</strong> du verbe.</p>
        <p>C'est un temps composé.</p>
      </div>
    
},
{
title: "Leçon 9 — Définitions",
content: 
      <div class="bloc theorie">
        <h2>Participe passé et auxiliaires</h2>
        <ul>
          <li><strong>Participe passé :</strong> 1er groupe -é (chanté) ; 2e groupe -i (fini) ; 3e groupe : -u (venu, vu, voulu, pu), -is (pris, mis), -it (dit, fait), -ert (ouvert).</li>
          <li><strong>Auxiliaire être :</strong> aller, venir, arriver, partir, entrer, sortir, monter, descendre, naître, mourir, rester, tomber, et les verbes pronominaux.</li>
          <li><strong>Auxiliaire avoir :</strong> la plupart des autres verbes.</li>
        </ul>
      </div>
    
},
{
title: "Leçon 9 — Méthodes et règles",
content: 
      <div class="bloc theorie">
        <h2>Former et accorder</h2>
        <ul>
          <li><strong>Formation :</strong> auxiliaire (présent) + participe passé. « J'ai chanté », « il est parti ».</li>
          <li><strong>Accord avec être :</strong> le participe passé s'accorde avec le sujet : « elle est partie », « elles sont parties ».</li>
          <li><strong>Avec avoir :</strong> le participe passé ne s'accorde pas avec le sujet. (Enrichissement facultatif : il s'accorde avec un COD placé avant le verbe : « la leçon que j'ai apprise ».)</li>
          <li><strong>Négation :</strong> on encadre l'auxiliaire : « Je n'ai pas mangé. » « Elle n'est pas venue. »</li>
        </ul>
      </div>
    
},
{
title: "Leçon 9 — Exemples expliqués",
content: 
      <div class="bloc exemple">
        <h2>Exemples</h2>
        <ul>
          <li>« Nous avons mangé du poisson. » (avoir + mangé).</li>
          <li>« Mireille est allée au marché. » (être, accord au féminin).</li>
          <li>« Ils sont arrivés hier. » (être, accord au masculin pluriel).</li>
          <li>« Tu n'as pas fini. » (négation autour de l'auxiliaire).</li>
        </ul>
      </div>
    
},
{
title: "Leçon 9 — Applications RDC et exercices",
content: 
      <div class="bloc cas">
        <h2>Application et exercices</h2>
        <p><strong>Application :</strong> Récit « Hier, Patrick a pris le train à Kinshasa. Il est arrivé à Matadi à midi. »</p>
        <p><img src="images/Francais1_13.jpg" alt="Train de voyageurs sur la ligne Kinshasa-Matadi" /></p>
        <p><strong>Ex. 1 :</strong> Mets au passé composé : « Je (finir) mon devoir. » « Nous (aller) au marché. » « Tu (prendre) le bus. »</p>
        <p><strong>Ex. 2 :</strong> Accorde : « Les filles sont (parti). » « Esther est (arrivé). »</p>
        <p><strong>Ex. 3 :</strong> Négation : « Il a mangé. » → ?</p>
        <details><summary>Corrigé</summary>
          <p>1) j'ai fini, nous sommes allés (allées si féminin), tu as pris.</p>
          <p>2) parties, arrivée.</p>
          <p>3) « Il n'a pas mangé. »</p>
        </details>
      </div>
    
},
{
title: "Leçon 9 — Synthèse",
content: 
      <div class="bloc resume">
        <h2>Synthèse — Passé composé</h2>
        <ul>
          <li>Passé composé = avoir/être au présent + participe passé.</li>
          <li>Avec être : accord avec le sujet.</li>
          <li>Négation : ne… pas autour de l'auxiliaire.</li>
        </ul>
      </div>
    
},
// ---------- LEÇON 10 : IMPARFAIT ----------
{
title: "Leçon 10 — L'imparfait (ouverture)",
content: 
      <div class="bloc cas">
        <h2>L'imparfait</h2>
        <p><strong>Objectifs :</strong> (1) conjuguer à l'imparfait ; (2) reconnaître ses valeurs ; (3) distinguer imparfait et passé composé.</p>
        <p><strong>Prérequis :</strong> présent, passé composé.</p>
        <p><strong>Situation de départ :</strong> « Autrefois, la ville était calme. » À quel passé pense-t-on ? Est-ce une action terminée ou un décor ?</p>
      </div>
    
},
{
title: "Leçon 10 — Développement",
content: 
      <div class="bloc theorie">
        <h2>Les valeurs de l'imparfait</h2>
        <ul>
          <li>Une <strong>description</strong> au passé : « La ville était calme. »</li>
          <li>Une <strong>habitude passée</strong> : « Chaque matin, il allait à l'école. »</li>
          <li>Une <strong>action en cours</strong> dans le passé : « Il pleuvait quand je suis sorti. »</li>
        </ul>
        <p>Il sert de <strong>décor</strong> au récit, tandis que le passé composé donne les événements.</p>
      </div>
    
},
{
title: "Leçon 10 — Définitions",
content: 
      <div class="bloc theorie">
        <h2>Terminaisons de l'imparfait</h2>
        <ul>
          <li>-ais, -ais, -ait, -ions, -iez, -aient.</li>
          <li><strong>Radical :</strong> celui de « nous » au présent, sans -ons (nous chantons → chant-).</li>
          <li><strong>Exception :</strong> être (j'étais).</li>
        </ul>
      </div>
    
},
{
title: "Leçon 10 — Méthodes et règles",
content: 
      <div class="bloc theorie">
        <h2>Former l'imparfait</h2>
        <p>Radical de « nous » au présent + terminaison.</p>
        <ul>
          <li>Verbes en -cer : je commençais (cédille devant a).</li>
          <li>Verbes en -ger : je mangeais (e conservé).</li>
          <li>Verbes en -ier : nous étudiions, vous étudiiez (deux i).</li>
        </ul>
        <p><strong>Être :</strong> j'étais, tu étais, il était, nous étions, vous étiez, ils étaient.</p>
        <p><strong>Avoir :</strong> j'avais, tu avais, il avait, nous avions, vous aviez, ils avaient.</p>
      </div>
    
},
{
title: "Leçon 10 — Exemples expliqués",
content: 
      <div class="bloc exemple">
        <h2>Exemples</h2>
        <ul>
          <li>« Quand j'étais petit, j'allais à pied à l'école. » (habitude, description).</li>
          <li>« Il pleuvait et nous marchions vers le marché. » (action en cours).</li>
          <li><strong>Opposition :</strong> « Il dormait (imparfait) quand le téléphone a sonné (passé composé). »</li>
        </ul>
      </div>
    
},
{
title: "Leçon 10 — Applications RDC et exercices",
content: 
      <div class="bloc cas">
        <h2>Application et exercices</h2>
        <p><strong>Application :</strong> « Autrefois, la ville de Lubumbashi était plus petite. » Décrire une ville au passé.</p>
        <p><img src="images/Francais1_14.jpg" alt="Vue de la ville de Lubumbashi" /></p>
        <p><strong>Ex. 1 :</strong> Conjugue à l'imparfait : « Nous (chanter) », « Vous (finir) », « Ils (avoir) ».</p>
        <p><strong>Ex. 2 :</strong> Remplace par l'imparfait : « Mon grand-père raconte des contes. »</p>
        <p><strong>Ex. 3 :</strong> Imparfait ou passé composé : « Il (pleuvoir) quand nous (arriver). »</p>
        <details><summary>Corrigé</summary>
          <p>1) chantions, finissiez, avaient.</p>
          <p>2) racontait.</p>
          <p>3) pleuvait, sommes arrivés.</p>
        </details>
      </div>
    
},
{
title: "Leçon 10 — Synthèse",
content: 
      <div class="bloc resume">
        <h2>Synthèse — Imparfait</h2>
        <ul>
          <li>Imparfait : -ais, -ais, -ait, -ions, -iez, -aient.</li>
          <li>Valeurs : décrire, habitude passée, action en cours.</li>
          <li>Imparfait = décor ; passé composé = événement.</li>
        </ul>

{
title: "Leçon 12 — Définitions",
content: 
      <div class="bloc theorie">
        <h2>Féminin et pluriel</h2>
        <ul>
          <li><strong>Féminin :</strong> en général + e (ami → amie). Cas fréquents : -er → -ère (boulanger → boulangère) ; -eur → -euse (chanteur → chanteuse) ; -teur → -trice (acteur → actrice) ; -eux → -euse (heureux → heureuse) ; -f → -ve (neuf → neuve) ; doublement de consonne (bon → bonne, gentil → gentille).</li>
          <li><strong>Pluriel :</strong> en général + s ; -s, -x, -z restent invariables (un fils → des fils) ; -eau, -eu, -au → + x (un bateau → des bateaux) ; -al → -aux (un animal → des animaux) ; -ou → + s (un trou → des trous), sept exceptions en -x : bijoux, cailloux, choux, genoux, hiboux, joujoux, poux.</li>
        </ul>
      </div>
    
},
{
title: "Leçon 12 — Méthodes et règles",
content: 
      <div class="bloc theorie">
        <h2>Accord sujet-verbe</h2>
        <ol>
          <li>Trouver le verbe.</li>
          <li>Trouver le sujet avec « qui est-ce qui ? ».</li>
          <li>Accorder le verbe avec le sujet, même si le sujet est loin ou après le verbe.</li>
        </ol>
        <ul>
          <li><strong>Sujet pronom « qui » :</strong> le verbe s'accorde avec l'antécédent (« les élèves qui chantent »).</li>
          <li><strong>Plusieurs sujets :</strong> le verbe se met au pluriel (« Amani et Esther jouent »).</li>
          <li><strong>Astuce :</strong> remplacer le sujet par « il(s) » ou « elle(s) ».</li>
        </ul>
      </div>
    
},

        <p><strong>Objectifs :</strong> (1) distinguer a/à, et/est, on/ont, son/sont, ce/se, ces/ses, ou/où, mais/mes ; (2) ponctuer correctement.</p>

        <p><strong>Situation de départ :</strong> « Il a un cahier » / « Il va à l'école ». « a » et « à » se prononcent pareil. Comment ne pas se tromper ?</p>

title: "Leçon 13 — Développement",
content:

        <p>Les homophones ont le même son mais une orthographe et un sens différents.</p>
        <p><strong>Technique :</strong> je remplace par un autre mot (test de substitution) pour choisir.</p>
        <p>La ponctuation organise le texte : elle sépare, marque la fin, signale le dialogue.</p>
      </div>

{
title: "Leçon 13 — Définitions",
content: 
      <div class="bloc theorie">
        <h2>Tests de substitution et ponctuation</h2>
        <p><img src="images/Francais1_17.jpg" alt="Guillemets français encadrant une citation" /></p>
        <ul>
          <li><strong>a</strong> (verbe avoir) / <strong>à</strong> (préposition) : a → avait.</li>
          <li><strong>et</strong> (conjonction) / <strong>est</strong> (verbe être) : est → était.</li>
          <li><strong>on</strong> / <strong>ont</strong> (verbe avoir) : ont → avaient.</li>
          <li><strong>son</strong> (déterminant) / <strong>sont</strong> (verbe être) : sont → étaient.</li>
          <li><strong>ce</strong> / <strong>se</strong> (pronom réfléchi : il se lave) ; <strong>ces</strong> / <strong>ses</strong> (déterminants) ; <strong>ou</strong> (= ou bien) / <strong>où</strong> (lieu ou temps) ; <strong>mais</strong> (opposition) / <strong>mes</strong> (déterminant).</li>
          <li><strong>Majuscule :</strong> début de phrase, noms propres (Kinshasa, Congo). Point, virgule, point-virgule, deux-points, guillemets, tirets de dialogue.</li>
        </ul>
      </div>
    
},
{
title: "Leçon 13 — Méthodes et règles",
content: 
      <div class="bloc theorie">
        <h2>Choisir le bon homophone</h2>
        <ul>
          <li>« Il a/à ... » → essayer « avait » : « Il avait un cahier » (a). « Ils vont à l'école » : « avaient » impossible (à).</li>
          <li>« Elle est/et » → essayer « était » : « Elle était fatiguée » (est).</li>
          <li><strong>Dialogue :</strong> on ouvre les guillemets « » ou on utilise un tiret à chaque changement de locuteur.</li>
          <li>La virgule sépare les éléments d'une énumération et les compléments mobiles.</li>
        </ul>
      </div>
    
},
{
title: "Leçon 13 — Exemples expliqués",
content:

          <li>« Mireille <strong>et</strong> Esther <strong>sont</strong> amies. » (et = addition ; sont = étaient).</li>
          <li>« <strong>Où</strong> vas-tu ? À Bukavu <strong>ou</strong> à Goma ? » (où = lieu ; ou = ou bien).</li>
          <li>Esther demande : « Veux-tu du manioc ? » Patrick répond : « Oui, merci. »</li>

      </div>

title: "Leçon 13 — Synthèse",

          <li><strong>Champ lexical :</strong> ensemble de mots liés au même thème (école : cahier, élève, classe, maître).</li>

function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';

    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);

<script>
