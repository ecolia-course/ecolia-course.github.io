<script>
const COURSE_TITLE = "Français";

const slides = [
{
    title: "Sommaire — Français 1re secondaire",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours te permet d'apprendre le français pas à pas, sans professeur. Lis, observe, essaie les exercices, vérifie les corrigés.</p>
<p>Le français est la langue officielle de la RDC et la langue d'enseignement : le maîtriser t'aidera dans toutes les matières.</p>
<ul>
<li>Leçon 1 — La communication</li>
<li>Leçon 2 — Lire et comprendre un texte</li>
<li>Leçon 3 — Les types et les formes de phrases</li>
<li>Leçon 4 — Le nom, les déterminants, l'adjectif</li>
<li>Leçon 5 — Les constituants de la phrase simple</li>
<li>Leçon 6 — Les pronoms personnels</li>
<li>Leçon 7 — Le verbe, les groupes, être et avoir</li>
<li>Leçon 8 — Le présent de l'indicatif</li>
<li>Leçon 9 — Le passé composé</li>
<li>Leçon 10 — L'imparfait</li>
<li>Leçon 11 — Le futur simple et l'impératif</li>
<li>Leçon 12 — Les accords</li>
<li>Leçon 13 — Homophones et ponctuation</li>
<li>Leçon 14 — Enrichir son vocabulaire</li>
<li>Leçon 15 — Écrire : description, récit, lettre</li>
<li>Leçon 16 — Parler : l'expression orale</li>
</ul>
<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programmes éducatifs DIPROMAD, Manuel de Français 7ème Année, Eduscol. Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 1 — La communication",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Amani vient d'entrer en 1re secondaire à Lubumbashi. Il envoie un message vocal à sa tante de Kisangani pour lui annoncer la nouvelle. <em>Qui parle ? À qui ? Pour dire quoi ? Avec quel moyen ? En quelle langue ?</em></p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Identifier les éléments d'une situation de communication. Distinguer oral et écrit. Reconnaître trois registres de langue. Adapter son message au destinataire.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Communiquer, c'est transmettre un message à quelqu'un. Chaque jour, nous communiquons à la maison, à l'école, au marché, par téléphone.</p>
<p><strong>Oral et écrit :</strong> L'oral utilise la voix, les gestes, la réponse immédiate. L'écrit (lettre, cahier) laisse une trace durable, est plus soigné et utilise la ponctuation.</p>
<p><strong>Les langues en RDC :</strong> Le français est la langue officielle et d'enseignement. Les quatre langues nationales sont le kikongo, le lingala, le swahili et le tshiluba.</p>
<p><strong>Éléments :</strong> Émetteur (celui qui envoie), Récepteur (celui qui reçoit), Message (ce qui est dit), Canal (le moyen : voix, téléphone), Code (la langue), Contexte (la situation).</p>
</div>
<img src="images/Francais1_1.jpg" alt="Carte des langues parlées en République démocratique du Congo" data-image-id="Francais1_1" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p><strong>Méthode en 5 questions :</strong> Qui parle ? À qui ? De quoi ? Par quel moyen ? Pourquoi ?</p>
<p><strong>Les trois registres :</strong> Familier (entre amis), Courant (usage ordinaire, à l'école), Soutenu (lettres officielles). En classe, on emploie le registre courant.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Exemple 1 :</strong> « Le maître explique la leçon aux élèves. » (Émetteur : le maître ; récepteurs : les élèves ; canal : la voix).</p>
<p><strong>Exemple 2 :</strong> Trois façons de demander un cahier :<br>
- Familier : « File-moi ton cahier ! »<br>
- Courant : « Peux-tu me prêter ton cahier, s'il te plaît ? »<br>
- Soutenu : « Auriez-vous l'obligeance de me prêter votre cahier ? »</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Classe par registre : a) « File-moi ton stylo ! » b) « Peux-tu me prêter ton stylo ? » c) « Auriez-vous un stylo à me prêter ? »</p>
<p><strong>Ex. 2 :</strong> Réécris en registre courant : « Balance-moi la craie ! »</p>
<p><strong>Corrigé :</strong> 1) a) familier, b) courant, c) soutenu. 2) « Peux-tu me passer la craie, s'il te plaît ? »</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une situation de communication comprend : émetteur, récepteur, message, canal, code, contexte. En classe, on utilise le registre courant.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Français (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 2 — Lire et comprendre un texte",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>On te donne un texte sur le fleuve Congo. Comment être sûr de l'avoir vraiment compris, et pas seulement lu ?</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Appliquer une méthode de lecture. Repérer l'idée principale, les personnages, le lieu, le temps. Reconnaître les principaux types de textes.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Lire, c'est comprendre. <strong>Méthode en 4 temps :</strong> 1) Observer (titre, illustrations) ; 2) Lire en entier ; 3) Relire en cherchant les réponses (qui, où, quand, quoi, pourquoi) ; 4) Résumer en deux phrases.</p>
<p>Un <strong>paragraphe</strong> = un groupe de phrases sur une même idée, qui commence par un alinéa.</p>
<p><strong>Types de textes :</strong> Narratif (raconte des événements), Descriptif (fait voir un lieu), Informatif (donne des informations), Injonctif (donne des consignes).</p>
<p><strong>Schéma narratif :</strong> Situation initiale, élément perturbateur, péripéties, dénouement, situation finale.</p>
</div>

<h3>3. Méthodes</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour reconnaître un récit : verbes d'action, personnages, succession d'événements. Pour résumer : retrouver chaque étape du schéma narratif en une phrase.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p><strong>Texte :</strong> « Un matin, Ngoy accompagne son oncle à Kisangani. Soudain, il glisse et perd sa casquette. Un pêcheur la rattrape avec son filet. Ngoy le remercie. »</p>
<p><strong>Schéma narratif :</strong> Situation initiale (la visite) ➔ Élément perturbateur (la casquette tombe) ➔ Péripétie (le pêcheur intervient) ➔ Dénouement (il la rattrape).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quel est le type de texte de l'exemple ?</p>
<p><strong>Corrigé :</strong> Un texte narratif, avec une courte description.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Lire = comprendre. Il faut observer, lire, relire et résumer. Le schéma narratif se compose de 5 étapes.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Français (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 3 — Les types et les formes de phrases",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Au marché de Goma, on entend : « Combien coûte ce pagne ? », « Quel beau tissu ! », « Approchez ! », « Je n'ai pas d'argent ». Ces phrases disent-elles toutes la même chose, de la même manière ?</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Reconnaître les quatre types de phrases. Construire une phrase affirmative ou négative. Poser une question correctement.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>4 types de phrases :</strong></p>
<ul>
<li><strong>Déclarative :</strong> informe, se termine par un point.</li>
<li><strong>Interrogative :</strong> pose une question, se termine par « ? ».</li>
<li><strong>Impérative :</strong> donne un ordre, un conseil (verbe à l'impératif).</li>
<li><strong>Exclamative :</strong> exprime un sentiment, se termine par « ! ».</li>
</ul>
<p><strong>2 formes :</strong> Affirmative / Négative. La négation utilise deux mots : ne… pas, ne… jamais, ne… plus, ne… rien.</p>
</div>

<h3>3. Méthodes</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Passer à la forme négative : encadrer le verbe par « ne » et « pas » (« Il mange » ➔ « Il ne mange pas »).</p>
<p>Poser une question : avec « est-ce que », par inversion (Viens-tu ?), ou avec un mot interrogatif (où, quand, pourquoi).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>« Mireille vend du poisson. » ➔ déclarative, affirmative.<br>
« Où habite Amani ? » ➔ interrogative.<br>
« Ferme la porte ! » ➔ impérative.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Mets à la forme négative : « Patrick aime le manioc. »</p>
<p><strong>Corrigé :</strong> « Patrick n'aime pas le manioc. »</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Quatre types (déclarative, interrogative, impérative, exclamative) et deux formes (affirmative, négative).</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Français (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 4 — Le nom, les déterminants, l'adjectif",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« fleuve », « le grand fleuve », « ce grand fleuve Congo ». À chaque ajout, que change-t-on ? Comment s'appellent ces petits mots ?</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Reconnaître nom commun et nom propre. Identifier genre et nombre. Reconnaître articles, possessifs, démonstratifs. Accorder l'adjectif.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>nom</strong> désigne une personne, un animal, une chose, une idée. Il a un genre (masculin/féminin) et un nombre (singulier/pluriel).</p>
<p>Le <strong>déterminant</strong> précède le nom. Il y a les articles (le, la, les, un, une, des), les possessifs (mon, ton, son, notre...), les démonstratifs (ce, cet, cette, ces).</p>
<p>L'<strong>adjectif qualificatif</strong> donne une qualité au nom. Il s'accorde en genre et en nombre avec lui.</p>
</div>
<img src="images/Francais1_7.jpg" alt="Le fleuve Congo vu de Kinshasa" data-image-id="Francais1_7" onerror="this.style.display='none'">

<h3>3. Méthodes</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour trouver le déterminant : je peux mettre « un/une » devant le mot.</p>
<p>Accord de l'adjectif : « un petit garçon / une petite fille / des petits garçons ».</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Accorde : « une (petit) fille », « des élèves (attentif) », « la ville (beau) ».</p>
<p><strong>Corrigé :</strong> petite, attentifs, belle.</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le groupe nominal (GN) = déterminant + (adjectif) + nom. L'adjectif s'accorde avec le nom.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Français (MEPST/DIPROMAD).</div>
    `
},
{
    title: "Leçon 5 — Les constituants de la phrase simple",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Amani mange du manioc à midi. » Qui mange ? Que mange-t-il ? Quand ? Chaque réponse correspond à un élément de la phrase.</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Trouver le verbe et son sujet. Reconnaître COD, COI et compléments circonstanciels. Reconnaître l'attribut du sujet.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Sujet :</strong> celui qui fait l'action. <strong>Verbe :</strong> action ou état.</p>
<p><strong>COD :</strong> complète le verbe sans préposition (question : qui ? quoi ?).</p>
<p><strong>COI :</strong> complète le verbe avec une préposition à/de (question : à qui ? de quoi ?).</p>
<p><strong>Complément circonstanciel :</strong> indique le lieu, le temps, la manière. Il peut se déplacer ou se supprimer.</p>
<p><strong>Attribut du sujet :</strong> après un verbe d'état (être, devenir, sembler).</p>
</div>

<h3>3. Méthodes</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>

          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
