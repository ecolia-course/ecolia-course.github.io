{

<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours prépare l'EXETAT (4e secondaire). Il comprend 10 leçons, suivies d'un quiz de révision.</p>

`

{
    title: "Leçon 1 — Introduction à la nutrition et à la diététique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un centre de santé à Kinshasa, une mère amène son enfant amaigri, apathique. L'infirmière mesure le périmètre brachial, pèse l'enfant : c'est une malnutrition aiguë. Elle explique à la mère les principes d'une alimentation équilibrée. La nutrition et la diététique sauvent des vies.</p></div>
<h3>1. Définition et concepts</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Nutrition</strong> : science qui étudie les aliments, leurs nutriments et leur rôle dans le fonctionnement de l'organisme.</li><li><strong>Diététique</strong> : application pratique de la nutrition pour adapter l'alimentation à l'état de santé et aux besoins de chaque individu.</li><li><strong>Alimentation</strong> : ensemble des aliments consommés.</li><li><strong>Nutriment</strong> : substance contenue dans l'aliment et utilisable par l'organisme.</li><li><strong>Ration alimentaire</strong> : ensemble des aliments consommés par une personne en 24 heures.</li></ul></div>
<h3>2. Les 7 groupes d'aliments</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Groupe 1</strong> : viandes, poissons, œufs (protéines animales, fer).</li><li><strong>Groupe 2</strong> : lait et produits laitiers (calcium, protéines).</li><li><strong>Groupe 3</strong> : légumineuses, céréales, féculents (glucides, protéines végétales).</li><li><strong>Groupe 4</strong> : légumes et fruits (vitamines, fibres, minéraux).</li><li><strong>Groupe 5</strong> : matières grasses (lipides, vitamines liposolubles).</li><li><strong>Groupe 6</strong> : sucres et produits sucrés (glucides simples).</li><li><strong>Groupe 7</strong> : boissons (eau, jus).</li></ul></div>
<h3>3. Les besoins nutritionnels</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Besoins énergétiques</strong> : exprimés en kilocalories (kcal) ou kilojoules (kJ).</li><li><strong>Adulte moyen</strong> : 2 000 à 2 500 kcal/jour.</li><li><strong>Femme enceinte</strong> : + 300 kcal/jour au 2e et 3e trimestre.</li><li><strong>Enfant</strong> : variable selon l'âge (1 000 à 2 000 kcal/jour).</li><li><strong>Répartition</strong> : glucides 50-55 %, lipides 30-35 %, protéines 12-15 %.</li></ul></div>
<h3>4. Applications</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Équilibre alimentaire</strong> : varier les aliments, respecter les proportions.</li><li><strong>Aliments locaux congolais</strong> : manioc (fufu), riz, maïs, haricots, poisson, huile de palme, feuilles de manioc (pondu), arachides, bananes.</li><li><strong>Rôle du professionnel</strong> : conseiller, éduquer, adapter selon la pathologie.</li></ul><p><a href="https://www.youtube.com/results?search_query=introduction+nutrition+diététique+groupes+aliments" target="_blank" rel="noopener">🎥 Recherche : introduction à la nutrition (chaînes de cours)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La nutrition étudie les aliments et leurs effets sur l'organisme ; la diététique les adapte à chaque individu. Les 7 groupes d'aliments couvrent tous les besoins. La ration alimentaire équilibrée répartit glucides (50-55 %), lipides (30-35 %) et protéines (12-15 %).</p></div>
<div class="sources"><strong>Sources :</strong> Programme réformé de Nutrition-Diététique, Ministère de la Santé (RDC) ; OMS — Nutrition.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, MSP, OMS, kcal.</div>
    `
},
{
    title: "Leçon 2 — Les macronutriments : glucides, lipides, protéines",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À l'hôpital de Lubumbashi, un patient diabétique reçoit une alimentation adaptée : moins de sucres rapides, plus de fibres. Un patient cardiaque reçoit moins de graisses saturées. Un enfant malnutri reçoit plus de protéines. Les macronutriments sont au cœur de la diététique.</p></div>
<h3>1. Les glucides</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Rôle</strong> : source d'énergie principale (1 g = 4 kcal).</li><li><strong>Glucides simples</strong> : sucres rapides (sucre, miel, fruits mûrs). Absorption rapide.</li><li><strong>Glucides complexes</strong> : amidon (riz, manioc, maïs, pomme de terre, pain). Absorption lente.</li><li><strong>Fibres</strong> : non digérées, régulent le transit, préviennent la constipation et le diabète.</li><li><strong>Besoin</strong> : 50 à 55 % de l'apport énergétique total.</li></ul></div>
<h3>2. Les lipides (matières grasses)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Rôle</strong> : réserve d'énergie (1 g = 9 kcal), transport des vitamines liposolubles (A, D, E, K), protection des organes.</li><li><strong>Graisses saturées</strong> : viandes grasses, beurre, huile de palme. À limiter.</li><li><strong>Graisses insaturées</strong> : huiles végétales (olive, tournesol), poissons gras. À privilégier.</li><li><strong>Cholestérol</strong> : présent dans les aliments d'origine animale. Attention aux excès.</li><li><strong>Besoin</strong> : 30 à 35 % de l'apport énergétique total.</li></ul></div>
<h3>3. Les protéines</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Rôle</strong> : construction et réparation des tissus, enzymes, hormones, défenses immunitaires.</li><li><strong>Protéines animales</strong> : viande, poisson, œuf, lait (acides aminés essentiels complets).</li><li><strong>Protéines végétales</strong> : légumineuses (haricots, arachides), céréales. Souvent incomplètes.</li><li><strong>Complémentarité</strong> : céréales + légumineuses (riz + haricots) → protéines complètes.</li><li><strong>Besoin</strong> : 12 à 15 % de l'apport énergétique total (0,8 à 1 g/kg/jour).</li></ul></div>
<h3>4. Applications pratiques</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Repas équilibré congolais</strong> : fufu (glucides) + pondu (légumes) + poisson (protéines) + huile de palme (lipides) + fruit (vitamines).</li><li><strong>Diabétique</strong> : limiter les sucres rapides, privilégier les glucides complexes, augmenter les fibres.</li><li><strong>Cardiaque</strong> : réduire les graisses saturées, privilégier les huiles végétales.</li><li><strong>Enfant malnutri</strong> : bouillie enrichie, lait, arachides, œufs.</li><li><strong>Sportif</strong> : augmenter les glucides complexes (pâtes, riz, igname).</li></ul><p><a href="https://www.youtube.com/results?search_query=macronutriments+glucides+lipides+protéines" target="_blank" rel="noopener">🎥 Recherche : les macronutriments (chaînes de cours)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les glucides apportent l'énergie (50-55 %), les lipides la réserve et le transport des vitamines (30-35 %), les protéines la construction des tissus (12-15 %). La complémentarité céréales + légumineuses donne des protéines complètes. Les besoins varient selon l'état de santé.</p></div>
<div class="sources"><strong>Sources :</strong> Programme réformé de Nutrition-Diététique (RDC) ; OMS.</div>
    `
},
{
    title: "Leçon 3 — Les micronutriments : vitamines et minéraux",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un village du Kasaï, plusieurs enfants présentent une cécité nocturne et une sécheresse oculaire. Le médecin diagnostique une carence en vitamine A. Une campagne de supplémentation est lancée. Les micronutriments, bien qu'en petite quantité, sont vitaux.</p></div>
<h3>1. Les vitamines</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Vitamine A</strong> : vision, peau, immunité. Sources : carottes, foie, huile de palme, feuilles vertes. Carence : cécité nocturne.</li><li><strong>Vitamine B1 (thiamine)</strong> : métabolisme des glucides. Carence : béribéri.</li><li><strong>Vitamine B2 (riboflavine)</strong> : énergie cellulaire. Carence : lésions de la peau et des muqueuses.</li><li><strong>Vitamine B9 (acide folique)</strong> : division cellulaire. Essentielle chez la femme enceinte (prévention des malformations).</li><li><strong>Vitamine B12</strong> : formation des globules rouges. Sources : viande, œufs, produits laitiers.</li><li><strong>Vitamine C</strong> : immunité, absorption du fer, antioxydant. Sources : agrumes, goyave, feuilles vertes. Carence : scorbut.</li><li><strong>Vitamine D</strong> : absorption du calcium, santé osseuse. Sources : soleil, poissons gras, œufs. Carence : rachitisme.</li><li><strong>Vitamine E</strong> : antioxydant. Sources : huiles végétales, noix.</li><li><strong>Vitamine K</strong> : coagulation. Sources : feuilles vertes, légumes.</li></ul></div>
<h3>2. Les minéraux</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Calcium</strong> : os et dents, coagulation. Sources : lait, poissons, feuilles vertes. Carence : rachitisme, ostéoporose.</li><li><strong>Fer</strong> : hémoglobine, transport de l'oxygène. Sources : viande rouge, foie, épinards, légumineuses. Carence : anémie.</li><li><strong>Iode</strong> : thyroïde. Sources : sel iodé, poissons de mer. Carence : goitre, crétinisme.</li><li><strong>Zinc</strong> : immunité, croissance. Sources : viande, huîtres, légumineuses. Carence : retard de croissance.</li><li><strong>Magnésium</strong> : contraction musculaire. Sources : céréales complètes, noix.</li><li><strong>Potassium</strong> : équilibre hydrique. Sources : bananes, pommes de terre.</li><li><strong>Sodium</strong> : équilibre hydrique. Sources : sel. Attention aux excès (hypertension).</li></ul></div>
<h3>3. Les oligo-éléments</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Fer, iode, zinc, cuivre, sélénium, fluor</strong>.</li><li><strong>Rôles</strong> : enzymes, immunité, structure osseuse.</li><li><strong>Carences</strong> : rares mais graves (anémie, hypothyroïdie, retard mental).</li><li><strong>Fluor</strong> : prévention de la carie dentaire.</li></ul></div>
<h3>4. Applications</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Vitamine A</strong> : campagne de supplémentation chez les enfants de 6 à 59 mois en RDC.</li><li><strong>Fer + acide folique</strong> : supplémentation chez la femme enceinte.</li><li><strong>Iode</strong> : iodisation du sel pour prévenir le goitre.</li><li><strong>Vitamine D</strong> : exposition au soleil, consommation de poissons gras.</li><li><strong>Alimentation variée</strong> : fruits, légumes, protéines animales et végétales, céréales complètes.</li></ul><p><a href="https://www.youtube.com/results?search_query=vitamines+minéraux+micronutriments+carences" target="_blank" rel="noopener">🎥 Recherche : les micronutriments (chaînes de cours)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les vitamines et minéraux, bien qu'en petite quantité, sont essentiels. Les carences (vitamine A, fer, iode, vitamine D) causent des maladies graves. La prévention passe par une alimentation variée, la supplémentation ciblée et l'iodisation du sel.</p></div>
<div class="sources"><strong>Sources :</strong> Programme réformé de Nutrition-Diététique (RDC) ; OMS — Micronutriments.</div>
    `
},
{
    title: "Leçon 4 — La malnutrition : formes et prise en charge",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À l'hôpital de Mbuji-Mayi, une fillette de 3 ans présente un œdème des pieds, une peau craquelée, des cheveux décolorés. Le diagnostic tombe : kwashiorkor. Elle est hospitalisée, recevant une alimentation thérapeutique progressive. La malnutrition est un fléau en RDC.</p></div>
<h3>1. Définition et formes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Malnutrition</strong> : déséquilibre entre les besoins de l'organisme et les apports alimentaires.</li><li><strong>Malnutrition aiguë</strong> : amaigrissement rapide, marasme, kwashiorkor.</li><li><strong>Malnutrition chronique</strong> : retard de croissance, petitesse pour l'âge.</li><li><strong>Carences spécifiques</strong> : anémie (fer), goitre (iode), cécité (vitamine A), rachitisme (vitamine D).</li><li><strong>Obésité</strong> : malnutrition par excès.</li></ul></div>
<h3>2. Les formes cliniques majeures</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Marasme</strong> : amaigrissement extrême, perte de graisse et de muscle, sans œdème. Lié à une carence globale.</li><li><strong>Kwashiorkor</strong> : œdème des membres inférieurs, visage bouffi, peau craquelée, cheveux décolorés, apathie. Lié à une carence en protéines.</li><li><strong>Formes mixtes</strong> : marasme-kwashiorkor.</li><li><strong>Retard de croissance</strong> : taille basse pour l'âge, malnutrition chronique.</li></ul></div>
<h3>3. Les causes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Causes immédiates</strong> : apport alimentaire insuffisant, maladies infectieuses (paludisme, diarrhée, tuberculose, VIH).</li><li><strong>Causes sous-jacentes</strong> : insécurité alimentaire, pauvreté, manque d'accès à l'eau potable, mauvaises pratiques d'alimentation.</li><li><strong>Causes fondamentales</strong> : conflits armés, mauvaise gouvernance, changement climatique.</li><li><strong>En RDC</strong> : 40 % des enfants de moins de 5 ans souffrent de malnutrition chronique.</li></ul></div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La malnutrition prend plusieurs formes : marasme, kwashiorkor, retard de croissance, obésité. Les causes sont immédiates, sous-jacentes et fondamentales. La prise en charge repose sur les ATLU, la réhydratation, le traitement des infections et l'éducation des mères.</p></div>

questions.forEach(function(q) {
    if (!q.text) {
        q.text = q.question || q.q || q.enonce || q.titre || "";
    }
    if (typeof q.correct === 'undefined') {
        if (typeof q.answer !== 'undefined') q.correct = q.answer;
        else if (typeof q.reponse !== 'undefined') q.correct = q.reponse;
    }
});

let currentSlide = 0;
let lastSearchTerm = "", searchResults = [], currentResultIdx = -1;
const contentDiv = document.getElementById('content');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const slideCounterSpan = document.getElementById('slideCounter');
const progressFill = document.getElementById('progressFill');
const counterSpan = document.getElementById('counter');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchNav = document.getElementById('searchNav');
const prevResultBtn = document.getElementById('prevResultBtn');
const nextResultBtn = document.getElementById('nextResultBtn');
const resultCounterSpan = document.getElementById('resultCounter');
const pageTitle = document.getElementById('pageTitle');
pageTitle.textContent = "ECOLIA · " + COURSE_TITLE;
document.title = "ECOLIA — " + COURSE_TITLE;
function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';
    slideCounterSpan.textContent = '0/0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>

<script>
(function () {
  var SITE = "https://ecolia-course.github.io/";
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface", page servie par https://app.local
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function abs(u) { return /^(https?:|data:|blob:)/i.test(u) ? u : (NATIVE ? SITE + u.replace(/^(\.\/|\/)+/, "") : u); }
  function ext(u) { var m = String(u).split("?")[0].match(/\.(jpe?g|png|gif|webp|svg)$/i); return m ? m[1].toLowerCase() : "jpg"; }
  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {
    if (queued[fn]) return;
    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
    if (!queue.length) { running = false; return; }
    if (!navigator.onLine) { running = false; return; }
    var q = queue.shift(), t0 = Date.now();
    try { CoursInterface.download(q[0], q[1]); } catch (e) { return setTimeout(next, 500); }
    (function wait() {
      var ok = false;
      try { ok = !!CoursInterface.exists(q[1]); } catch (e) {}
      if (ok) setTimeout(next, 1500);
      else if (Date.now() - t0 > 40000) next();
      else setTimeout(wait, 700);
    })();
  }
  function exists(fn) { try { return !!CoursInterface.exists(fn); } catch (e) { return false; } }

  function show(img) {                                    // affiche UNE image (appelé à chaque slide affichée)
    if (!table || img.getAttribute("data-ecolia-done")) return;
    var id = img.getAttribute("data-image-id");
    var url = table[id];
    if (typeof url !== "string" || !url.length) { console.warn("ECOLIA : image absente du JSON :", id); return; }
    img.setAttribute("data-ecolia-done", "1");
    if (!NATIVE) { img.onerror = function () { hide(img); }; img.setAttribute("src", url); return; }
    var full = abs(url), fn = "img_" + id + "." + ext(url);
    if (exists(fn)) {                                     // déjà sur l'appareil : lecture locale, sans internet
      img.onerror = function () {                         // fichier incomplet : on le supprime et on utilise le site
        try { CoursInterface["delete"](fn); } catch (e) {}
        queued[fn] = 0;
        img.onerror = function () { hide(img); };
        img.setAttribute("src", full);
      };
      img.setAttribute("src", "https://app.local/cours/" + fn);
    } else {
      img.onerror = function () { hide(img); };
      img.setAttribute("src", full);
      enqueue(full, fn);
    }
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches("img[data-image-id]")) show(root);
    root.querySelectorAll("img[data-image-id]").forEach(show);
  }
  function prefetchAll() {                                // APK : prépare TOUTES les images du cours pour le hors-ligne
    var ids = {};
    try { JSON.stringify(slides).replace(/data-image-id=\\?"([^"\\]+)/g, function (m, id) { ids[id] = 1; }); } catch (e) {}
    Object.keys(ids).forEach(function (id) {
      var url = table[id];
      if (typeof url !== "string" || !url.length) return;
      var fn = "img_" + id + "." + ext(url);
      if (!exists(fn)) enqueue(abs(url), fn);
    });
  }
  function start(tbl) {
    table = tbl;
    scan(document.body);
    new MutationObserver(function (muts) {                // les slides sont écrites à la volée : on traite chaque nouvelle image
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
    if (NATIVE) prefetchAll();
  }

  var JSON_URL = NATIVE ? SITE + "images_ecolia.json" : "images_ecolia.json";
  var KEY = "ecolia_images_json";
  fetch(JSON_URL, NATIVE ? { cache: "no-cache" } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (table) { if (NATIVE) lsSet(KEY, JSON.stringify(table)); start(table); })
    .catch(function (e) {
      var saved = null;
      if (NATIVE) { try { saved = JSON.parse(lsGet(KEY) || "null"); } catch (x) {} }
      if (saved) start(saved);                              // hors ligne dans l'APK : JSON gardé la dernière fois
      else console.warn("ECOLIA : JSON des images indisponible.", e);
    });
})();
</script>
