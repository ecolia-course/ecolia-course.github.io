{
    title: "Leçon 1 — Qu'est-ce qu'un chant, une comptine ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi les enfants chantent-ils à l'école maternelle ? Qu'est-ce qu'une comptine ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir le chant et la comptine. Distinguer leurs caractéristiques. Comprendre leur place à la maternelle. Prérequis : notions de pédagogie du préscolaire (cours n°36) et d'activités manuelles et d'éveil (n°38).</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>chant</strong> est une production vocale mélodique, souvent collective. Il peut être accompagné de gestes, de danses, d'instruments.</p>
<p>La <strong>comptine</strong> est un court texte rimé et rythmé, souvent accompagné de gestes (comptines à gestes) ou de jeux (comptines de choix, de balancement). Elle est facile à mémoriser.</p>
<p>Les deux sont inscrits au programme national de la maternelle (activités musicales, activités de langage, éveil artistique). Ils se distinguent par leur forme : le chant est mélodique, la comptine est plus parlée-rythmée. Mais la frontière est parfois floue (chansons-comptines).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Chant :</strong> production vocale mélodique. <strong>Comptine :</strong> court texte rimé et rythmé, souvent gestuel. <strong>Mélodie :</strong> suite de notes. <strong>Rythme :</strong> organisation des durées. <strong>Rime :</strong> sonorité finale répétée.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Partir de l'oralité : le chant et la comptine se transmettent par la voix, l'écoute, la répétition. Associer le geste : le geste aide la mémorisation et le plaisir. Répéter sans lasser : varier les modalités (chuchoter, chanter fort, frapper le rythme, mimer). Respecter le plaisir : ne pas transformer le chant en exercice de performance.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une comptine à gestes comme « Tête, épaules, genoux et pieds » associe la parole, le geste et la mémoire du corps. L'enfant apprend en jouant. Une chanson comme « Frère Jacques » est un chant simple, répétitif, facile à mémoriser, qui peut être chanté en canon.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis la comptine.</p>
<p><strong>Ex. 2 :</strong> Quelle est la différence entre chant et comptine ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Un court texte rimé et rythmé, souvent accompagné de gestes.</p>
<p><strong>2)</strong> Le chant est mélodique ; la comptine est plus parlée-rythmée.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Chant et comptine sont des activités essentielles à la maternelle, à la fois ludiques et formatrices.</p></div>

<div class="sources"><strong>Sources :</strong> PNEM (2008, 2022) ; fiches Chants et comptines (2025).</div>
    `

{
    title: "Leçon 2 — Le rôle du chant et de la comptine dans le développement",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi chante-t-on avec les jeunes enfants ? Qu'est-ce que cela leur apporte ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les apports du chant et de la comptine. Comprendre leur rôle dans le développement global. Les intégrer aux apprentissages. Prérequis : leçon 1 ; notions de psychologie du développement (cours n°35).</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le chant et la comptine contribuent au développement global de l'enfant :</p>
<ul>
<li><strong>Langage :</strong> enrichissement du vocabulaire, articulation, mémoire verbale, conscience phonologique.</li>
<li><strong>Cognitif :</strong> mémoire, attention, compréhension de séquences, de rimes, de structures répétitives.</li>
<li><strong>Affectif :</strong> plaisir, sécurité, expression des émotions, confiance en soi.</li>
<li><strong>Social :</strong> écoute, coopération, participation collective, respect des règles du groupe.</li>
<li><strong>Moteur :</strong> coordination, gestes associés aux paroles, rythme.</li>
<li><strong>Culturel :</strong> transmission du patrimoine, identité, ouverture aux langues.</li>
</ul>
<p>La recherche montre que les enfants qui chantent régulièrement développent de meilleures compétences langagières et une meilleure conscience phonologique, ce qui prépare à la lecture.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Développement global :</strong> ensemble des dimensions de la personne. <strong>Conscience phonologique :</strong> capacité à percevoir les sons de la langue. <strong>Mémoire verbale :</strong> mémoire des mots. <strong>Coopération :</strong> agir ensemble. <strong>Patrimoine :</strong> héritage culturel.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Intégrer le chant dans les routines : chant d'accueil, chant de transition, chant de fin de journée. Choisir des chants adaptés à l'âge : courts, répétitifs, gestuels. Créer un climat de plaisir : pas de performance, mais de la joie. Valoriser la participation de chaque enfant.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>

</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le chant et la comptine développent globalement l'enfant : langage, cognition, affect, social, motricité, culture.</p></div>

<div class="sources"><strong>Sources :</strong> PNEM (2022) ; UNICEF ; UNESCO.</div>

    title: "Leçon 3 — La voix et l'oreille musicale du jeune enfant",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment un enfant apprend-il à chanter juste ? Comment développer son oreille musicale ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître le développement vocal et auditif de l'enfant. Comprendre l'importance de l'écoute. Adapter la voix de l'adulte. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Voix :</strong> le nourrisson produit des sons (cris, gazouillis) ; vers 2-3 ans, il chante des fragments mélodiques ; vers 4-5 ans, il chante des chansons simples, parfois faux, ce qui est normal ; vers 6 ans, il commence à chanter plus juste.</p>
<p><strong>Oreille musicale :</strong> la perception des sons se développe par l'écoute, la discrimination (grave/aigu, fort/doux, rapide/lent), la reproduction.</p>
<p><strong>Rôle de l'adulte :</strong> chanter avec l'enfant, à sa hauteur, sans forcer ; créer un environnement sonore riche ; faire écouter des sons variés. La justesse vient progressivement : ne pas corriger brutalement, chanter ensemble.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Voix :</strong> production sonore. <strong>Oreille musicale :</strong> capacité à percevoir les sons. <strong>Justesse :</strong> capacité à chanter sur la bonne note. <strong>Discrimination auditive :</strong> capacité à distinguer les sons. <strong>Environnement sonore :</strong> ensemble des sons autour de l'enfant.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Chanter avec l'enfant : à l'unisson, à sa hauteur. Ne pas forcer la justesse : elle vient avec le temps. Faire écouter : sons de la nature, instruments, voix. Jouer avec la voix : chuchoter, parler fort, imiter les animaux. Encourager : valoriser la participation, pas la performance.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une éducatrice chante doucement avec un enfant de 3 ans. Elle adapte sa voix à la sienne. L'enfant chante approximativement, mais avec plaisir. Elle ne corrige pas. Peu à peu, il chantera plus juste. Elle fait aussi écouter des sons : un tambour, une cloche, un oiseau. Les enfants ferment les yeux et devinent.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Pourquoi un enfant de 4 ans chante-t-il souvent faux ?</p>
<p><strong>Ex. 2 :</strong> Cite deux jeux pour développer l'écoute.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Parce que son oreille et sa voix se développent progressivement.</p>
<p><strong>2)</strong> Deviner des sons, imiter des voix (2 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La voix et l'oreille se développent avec le temps, par l'écoute, le jeu et le plaisir.</p></div>

<div class="sources"><strong>Sources :</strong> Pédagogies musicales actives ; PNEM (2022).</div>
    `

    title: "Leçon 4 — Les comptines traditionnelles congolaises",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Quelles comptines connaissaient nos grands-parents ? Pourquoi les transmettre ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître le répertoire traditionnel congolais. Comprendre sa valeur culturelle. L'utiliser en classe. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les comptines traditionnelles congolaises existent dans toutes les langues du pays : lingala, kikongo, swahili, tshiluba, et dans les langues locales. Elles sont liées à la vie quotidienne, aux jeux, aux fêtes, aux bercements.</p>
<p><strong>Types :</strong> comptines de jeu (pour choisir un joueur, pour sauter à la corde), comptines de balancement, comptines d'animaux, comptines de moisson, comptines de pluie.</p>
<p><strong>Valeur culturelle :</strong> transmission du patrimoine, identité, lien intergénérationnel, valorisation des langues locales.</p>
<p><strong>Valeur pédagogique :</strong> rythme, mémoire, langage, socialisation, plaisir.</p>

<p>La pulsation est la base du rythme. Les enfants la ressentent d'abord dans leur corps, avant de la comprendre.</p>
<p><strong>Activités :</strong> marcher en rythme, taper des mains, frapper des instruments, dire des comptines rythmées.</p>

<p><strong>Pulsation :</strong> battement régulier. <strong>Rythme :</strong> organisation des durées. <strong>Tempo :</strong> vitesse de la pulsation. <strong>Syncope :</strong> accent déplacé. <strong>Mesure :</strong> groupement de pulsations.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Ressentir la pulsation dans le corps : marcher, taper des pieds, balancer les bras. Utiliser des comptines rythmées : « Un, deux, trois, nous irons au bois ». Varier le tempo : lent, rapide, très rapide. Jouer avec des instruments : frapper en même temps. Observer : l'enfant qui bat la mesure avec son corps.</p>

    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment savoir si un enfant progresse en musique ? Faut-il noter la justesse ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre l'évaluation musicale au préscolaire. Observer les progrès. Valoriser sans juger. Prérequis : leçons 1 à 11.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'évaluation musicale au préscolaire est formative et bienveillante : elle ne juge pas la performance, mais observe la participation, le plaisir, l'engagement, les progrès.</p>
<p><strong>Ce qu'on observe :</strong> participation, mémorisation, rythme, justesse (progressive), plaisir, coopération.</p>
<p><strong>Ce qu'on évite :</strong> classer les enfants, exiger la perfection, corriger brutalement.</p>
<p><strong>Ce qu'on fait :</strong> observer, encourager, nommer les progrès, valoriser les productions, partager avec les familles.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Évaluation formative :</strong> évaluation qui aide à progresser. <strong>Observation :</strong> regard attentif. <strong>Participation :</strong> implication. <strong>Justesse :</strong> capacité à chanter sur la bonne note. <strong>Valorisation :</strong> reconnaissance.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Observer chaque enfant : participe-t-il ? mémorise-t-il ? prend-il plaisir ? Encourager : « Tu chantes bien ! », « Tu as bien suivi le rythme ! ». Ne pas comparer : chaque enfant progresse à son rythme. Partager avec les familles : un petit spectacle, un enregistrement, une vidéo. Créer un climat de confiance.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une éducatrice observe Amara : au début, elle ne chantait pas. Trois mois plus tard, elle chante avec le groupe, sourit, bouge. L'éducatrice note ses progrès, l'encourage, en parle aux parents. À la fin du trimestre, elle organise un petit spectacle de chant pour les familles. Chaque enfant participe selon ses moyens. Tous sont valorisés.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Pourquoi l'évaluation musicale doit-elle être formative ?</p>
<p><strong>Ex. 2 :</strong> Cite trois façons de valoriser les progrès.</p>

<p><strong>2)</strong> Encourager, partager avec les familles, organiser un spectacle (3 au choix).</p>

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function init() {
    if (document.getElementById("ecolia-audio-btn")) return;
    var btn = document.createElement("button");
    btn.id = "ecolia-audio-btn"; btn.type = "button"; btn.className = "ecolia-off";
    btn.setAttribute("aria-label", "Écouter la leçon"); btn.innerHTML = PLAY;
    var dlBtn = document.createElement("button");
    dlBtn.id = "ecolia-dl-btn"; dlBtn.type = "button"; dlBtn.className = "ecolia-off";
    dlBtn.innerHTML = DL;
    var host = document.querySelector(".header-right");
    if (host) { host.insertBefore(dlBtn, host.firstChild); host.insertBefore(btn, dlBtn); }
    else { btn.className += " ecolia-fixed"; document.body.appendChild(btn); }
    var banner = document.createElement("div");
    banner.id = "ecolia-audio-banner";
    banner.innerHTML = '<span class="eab-txt"></span><span class="eab-act"></span><div class="eab-bar"><i></i></div>';
    var content = document.getElementById("content");
    if (content && content.parentNode) content.parentNode.insertBefore(banner, content);
    else document.body.insertBefore(banner, document.body.firstChild);
    var txtEl = banner.querySelector(".eab-txt"), actEl = banner.querySelector(".eab-act");
    var barEl = banner.querySelector(".eab-bar"), barI = barEl.firstChild;
    var audio = new Audio();
    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }
    function cur() { try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {} return 0; }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
