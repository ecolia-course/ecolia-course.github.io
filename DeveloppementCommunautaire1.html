<script>
const COURSE_TITLE = "Développement communautaire";
const slides = [
{
    title: "Sommaire — Développement communautaire",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Le développement communautaire étudie comment une communauté s'organise pour améliorer ses conditions de vie. Ce cours est une initiation adaptée au niveau de 1re année.</p>
<p><strong>Note de positionnement :</strong> le développement communautaire est normalement enseigné en 6e secondaire (programme national de RDC). Ce plan est une initiation fortement adaptée : il se limite aux notions de base (communauté, besoins, participation, projet simple) et exclut les aspects avancés.</p>
<ul>
<li>Leçon 1 — Qu'est-ce qu'une communauté et le développement communautaire ?</li>
<li>Leçon 2 — Identifier les besoins et les priorités de la communauté</li>
<li>Leçon 3 — Les étapes d'un projet communautaire simple</li>
<li>Leçon 4 — Participation et animation communautaire</li>
<li>Leçon 5 — Le développement communautaire en RDC : acteurs et exemples</li>
</ul>
<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Cours complet de développement communautaire (6e secondaire, RDC) ; manuel pour assistants sociaux (MAPENZI) ; formations d'animateurs communautaires (Caritas, Enabel) ; documents de stratégie PNUD.</div>
    `
},
{
    title: "Partie 1 — Communauté et besoins",
    content: `
<div class="bloc theorie"><div class="bloc-label">Partie 1</div>
<p><strong>Objectif de la partie :</strong> définir la communauté et le développement communautaire, identifier les besoins et priorités.</p>
<h3>Leçons de cette partie</h3>
<ul>
<li>Leçon 1 — Qu'est-ce qu'une communauté et le développement communautaire ?</li>
<li>Leçon 2 — Identifier les besoins et les priorités de la communauté</li>
</ul>
</div>
    `
},
{
    title: "Leçon 1 — Qu'est-ce qu'une communauté et le développement communautaire ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Dans un quartier de Goma, les habitants se plaignent du manque d'eau potable. Certains achètent de l'eau en bouteille ; d'autres organisent une réunion pour trouver une solution collective. Quelle différence y a-t-il entre ces deux réactions ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir une communauté. Définir le développement communautaire. Distinguer développement communautaire et développement individuel.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une <strong>communauté</strong> est un groupe de personnes partageant un territoire, des intérêts ou des valeurs.</p>
<p>Le <strong>développement communautaire</strong> est le processus par lequel les membres d'une communauté s'organisent, identifient leurs besoins, mobilisent leurs ressources et entreprennent des actions collectives pour améliorer leurs conditions de vie.</p>
<p>Il repose sur la <strong>participation</strong> des membres, l'<strong>autonomisation</strong> et la <strong>solidarité</strong>. Il ne s'agit pas d'une aide venue de l'extérieur, mais d'un processus où la communauté devient actrice de son propre changement.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Communauté :</strong> groupe partageant territoire ou intérêts. <strong>Développement communautaire :</strong> processus d'action collective. <strong>Participation :</strong> contribution active. <strong>Autonomisation :</strong> capacité à agir par soi-même.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemples RDC</div>
<p>Associations de quartier pour l'assainissement ; coopératives agricoles ; comités de parents d'élèves ; groupes de femmes pour la gestion de l'eau.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la différence entre développement individuel et développement communautaire ?</p>
<p><strong>Ex. 2 :</strong> Citez deux principes du développement communautaire.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> L'individuel concerne une personne ; le communautaire implique une action collective.</p>
<p><strong>2)</strong> Participation, autonomisation (ou solidarité).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une communauté se définit par le partage et l'action collective ; le développement communautaire part des besoins exprimés par la base.</p></div>

<div class="sources"><strong>Sources :</strong> Cours complet de développement communautaire (6e) ; manuel MAPENZI.</div>
    `
},
{
    title: "Leçon 2 — Identifier les besoins et les priorités de la communauté",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Une ONG arrive dans un village et propose de construire un terrain de football. Les habitants, eux, veulent d'abord réparer le puits. Comment éviter ce malentendu ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer besoin, problème et priorité. Expliquer l'importance du diagnostic participatif. Utiliser une méthode simple pour classer les priorités.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un <strong>besoin</strong> (santé, éducation, eau, sécurité) n'est pas toujours ce qu'un intervenant extérieur imagine.</p>
<p>Le <strong>diagnostic participatif</strong> permet à la communauté d'exprimer ses priorités.</p>
<p>On peut classer les besoins selon leur urgence, leur faisabilité et leur impact : c'est la <strong>priorisation</strong>.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Besoin :</strong> nécessité ressentie. <strong>Problème :</strong> difficulté concrète. <strong>Priorité :</strong> besoin classé en premier. <strong>Diagnostic participatif :</strong> analyse collective. <strong>Grille de priorisation :</strong> outil de classement.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemples RDC</div>
<p>Un quartier priorise l'assainissement avant la construction d'un terrain de sport ; un village choisit de réparer la route avant d'acheter des chaises pour l'école.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Pourquoi le diagnostic participatif est-il important ?</p>
<p><strong>Ex. 2 :</strong> Citez deux critères de priorisation.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Parce qu'il permet d'identifier les vrais besoins avec la communauté.</p>
<p><strong>2)</strong> Urgence, faisabilité (ou impact).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le diagnostic participatif évite les projets inutiles ; la priorisation est un choix collectif.</p></div>

<div class="sources"><strong>Sources :</strong> Cours complet de développement communautaire (6e) ; méthodes d'animation communautaire.</div>
    `
},
{
    title: "Partie 2 — Projet et animation",
    content: `
<div class="bloc theorie"><div class="bloc-label">Partie 2</div>
<p><strong>Objectif de la partie :</strong> comprendre les étapes d'un projet communautaire, la participation et l'animation, et les acteurs en RDC.</p>
<h3>Leçons de cette partie</h3>
<ul>
<li>Leçon 3 — Les étapes d'un projet communautaire simple</li>
<li>Leçon 4 — Participation et animation communautaire</li>
<li>Leçon 5 — Le développement communautaire en RDC : acteurs et exemples</li>
</ul>
</div>
    `
},
{
    title: "Leçon 3 — Les étapes d'un projet communautaire simple",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un groupe de jeunes veut créer un jardin communautaire sur un terrain vague. Par où commencer ? Faut-il agir immédiatement ou planifier ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Citer les étapes d'un projet communautaire (sensibilisation, diagnostic, planification, mobilisation, mise en œuvre, suivi). Comprendre l'utilité de chaque étape.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un projet suit un cycle :</p>
<ol>
<li><strong>Sensibilisation :</strong> informer.</li>
<li><strong>Diagnostic :</strong> identifier les besoins.</li>
<li><strong>Planification :</strong> objectifs, activités, ressources.</li>
<li><strong>Mobilisation :</strong> rassembler les moyens.</li>
<li><strong>Mise en œuvre :</strong> réaliser.</li>
<li><strong>Suivi-évaluation :</strong> mesurer et corriger.</li>
</ol>
<p>Sauter une étape expose à l'échec.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Projet communautaire :</strong> action collective planifiée. <strong>Sensibilisation :</strong> information. <strong>Planification :</strong> organisation. <strong>Suivi-évaluation :</strong> mesure des résultats.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemples RDC</div>
<p>Construction d'un point d'eau ; campagne de nettoyage ; création d'une caisse de solidarité ; alphabétisation des adultes.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Citez les étapes d'un projet communautaire.</p>
<p><strong>Ex. 2 :</strong> Pourquoi le suivi-évaluation est-il nécessaire ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Sensibilisation, diagnostic, planification, mobilisation, mise en œuvre, suivi-évaluation.</p>
<p><strong>2)</strong> Pour mesurer les résultats et corriger les erreurs.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un projet communautaire réussi repose sur une préparation méthodique et une participation réelle.</p></div>

<div class="sources"><strong>Sources :</strong> Cours complet de développement communautaire (6e) ; manuels de gestion de projets.</div>
    `
},
{
    title: "Leçon 4 — Participation et animation communautaire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Lors d'une réunion de quartier, seules quelques personnes parlent ; les femmes et les jeunes restent silencieux. Comment faire participer tout le monde ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Expliquer le principe de participation. Découvrir des techniques d'animation simples. Comprendre le rôle de l'animateur.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>participation</strong> n'est pas la simple présence : c'est la contribution active aux décisions et aux actions.</p>
<p>L'<strong>animateur</strong> facilite, il ne décide pas à la place du groupe.</p>
<p><strong>Techniques :</strong> brainstorming, tour de table, discussion de groupe, jeux de rôle, cartographie communautaire.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Participation :</strong> contribution active. <strong>Animation :</strong> conduite d'un groupe. <strong>Brainstorming :</strong> production d'idées. <strong>Cartographie communautaire :</strong> représentation du quartier.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemples RDC</div>
<p>Réunions de quartier dominées par les aînés ; groupes de femmes qui ne prennent pas la parole ; animateurs formés par Caritas ou des ONG locales.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qu'est-ce qu'un animateur communautaire ?</p>
<p><strong>Ex. 2 :</strong> Citez une technique pour faire participer un groupe.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Un facilitateur qui aide le groupe à s'exprimer et à décider.</p>
<p><strong>2)</strong> Tour de table, brainstorming (2 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une animation réussie favorise la participation de tous ; l'animateur est un facilitateur, pas un décideur.</p></div>

<div class="sources"><strong>Sources :</strong> Cours complet de développement communautaire (6e) ; formations d'animateurs (Caritas, PNUD).</div>
    `
},
{
    title: "Leçon 5 — Le développement communautaire en RDC : acteurs et exemples",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Dans un village, une église, une ONG et un comité de jeunes proposent chacun un projet différent pour le même problème d'eau. Comment coordonner les efforts ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les acteurs internes et externes du développement communautaire. Citer des exemples d'initiatives en RDC. Comprendre le rôle des associations et des ONG.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le développement communautaire mobilise plusieurs acteurs.</p>
<ul>
<li><strong>Acteurs internes :</strong> membres, autorités locales, associations.</li>
<li><strong>Acteurs externes :</strong> ONG, églises, État, partenaires techniques et financiers.</li>
</ul>
<p>Les acteurs internes sont les premiers responsables ; les acteurs externes appuient. La <strong>coordination</strong> évite les doublons et renforce l'impact.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Acteurs internes :</strong> membres de la communauté. <strong>Acteurs externes :</strong> partenaires extérieurs. <strong>Coordination :</strong> harmonisation des actions. <strong>Partenariat :</strong> collaboration.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemples RDC</div>
<p>Caritas dans le Sud-Kivu (formation d'animateurs) ; comités de développement locaux ; coopératives agricoles ; projets d'assainissement soutenus par des ONG.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Citez deux acteurs internes et deux acteurs externes.</p>
<p><strong>Ex. 2 :</strong> Pourquoi la coordination est-elle importante ?</p>

      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
