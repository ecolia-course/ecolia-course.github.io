    title: "Leçon 1 — Le métier d'infirmier : rôle, déontologie et cadre légal en RDC",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À l'hôpital général de référence de Kinshasa, une jeune infirmière prend son service. Elle doit accueillir les patients, prendre les constantes, administrer les traitements prescrits et rassurer les familles. Le métier d'infirmier est exigeant : il demande des compétences techniques, une éthique solide et une grande humanité.</p></div>
<h3>1. Définition et rôle de l'infirmier</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Infirmier</strong> : professionnel de santé qui prodigue des soins aux malades, sous prescription médicale ou en application de son rôle propre.</li><li><strong>Rôle propre</strong> : soins d'hygiène, confort, surveillance, éducation du patient, prévention.</li><li><strong>Rôle sur prescription</strong> : administration des médicaments, pansements, injections.</li><li><strong>Rôle relationnel</strong> : écoute, réconfort, information du patient et de la famille.</li><li><strong>Rôle éducatif</strong> : éducation à la santé, prévention des maladies.</li></ul></div>
<h3>2. La déontologie infirmière</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Respect de la vie</strong> : l'infirmier protège la santé et la vie de tout être humain.</li><li><strong>Respect de la personne</strong> : dignité, intimité, religion, opinions.</li><li><strong>Secret professionnel</strong> : ne pas divulguer les informations médicales d'un patient.</li><li><strong>Compétence et formation continue</strong> : actualiser ses connaissances.</li><li><strong>Non-discrimination</strong> : soins égaux pour tous, sans distinction.</li><li><strong>Solidarité professionnelle</strong> : respect envers les collègues et les autres professionnels de santé.</li></ul></div>
<h3>3. Le cadre légal en RDC</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Code de santé publique</strong> : cadre légal des professions de santé en RDC.</li><li><strong>Ordonnance-loi n° 80-025 du 5 mars 1980</strong> : organisation de la médecine en RDC.</li><li><strong>Ordre des infirmiers</strong> : structure professionnelle qui encadre la profession.</li><li><strong>Formation</strong> : diplôme d'État en soins infirmiers (4 ans).</li><li><strong>Structure hiérarchique hospitalière</strong> : médecin-chef, infirmier-chef, infirmier, aides-soignants.</li></ul></div>
<h3>4. Les qualités de l'infirmier</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Compétences techniques</strong> : maîtriser les gestes (injections, pansements, prise de constantes).</li><li><strong>Qualités humaines</strong> : empathie, patience, écoute, calme.</li><li><strong>Rigueur</strong> : respect des protocoles, propreté, hygiène.</li><li><strong>Endurance physique et morale</strong> : travail en horaires décalés, pression.</li><li><strong>Esprit d'équipe</strong> : collaboration avec les médecins et les autres soignants.</li></ul><p><a href="https://www.youtube.com/results?search_query=métier+infirmier+déontologie+RDC+rôle+propre" target="_blank" rel="noopener">🎥 Recherche : le métier d'infirmier (chaînes de cours de soins infirmiers)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'infirmier a un rôle propre, un rôle sur prescription, un rôle relationnel et un rôle éducatif. Sa déontologie repose sur le respect de la vie, le secret professionnel et la compétence. En RDC, le cadre légal est fixé par le Code de santé publique et l'Ordre des infirmiers.</p></div>
<div class="sources"><strong>Sources :</strong> Programme réformé de Soins Infirmiers, Ministère de la Santé (RDC), Fiches pédagogiques officielles 2025.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, MSP.</div>
    `

    title: "Leçon 2 — L'hygiène hospitalière et la prévention des infections",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une salle d'hospitalisation de l'hôpital de Lubumbashi, plusieurs patients présentent des infections nosocomiales. Le comité d'hygiène se réunit : que s'est-il passé ? Une mauvaise hygiène des mains, des pansements mal renouvelés, un matériel mal stérilisé. L'hygiène hospitalière est vitale.</p></div>
<h3>1. Définition et importance</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Hygiène hospitalière</strong> : ensemble des mesures pour prévenir les infections dans les établissements de soins.</li><li><strong>Infection nosocomiale</strong> : infection contractée à l'hôpital, absente à l'admission.</li><li><strong>Importance</strong> : protéger les patients, le personnel et les visiteurs.</li><li><strong>Agents</strong> : bactéries, virus, champignons, parasites.</li></ul></div>
<h3>2. L'hygiène des mains</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Lavage simple</strong> : eau + savon, 30 secondes, friction des mains et avant-bras.</li><li><strong>Friction hydro-alcoolique</strong> : solution hydro-alcoolique, 20-30 secondes, mains sèches.</li><li><strong>Lavage chirurgical</strong> : 5 minutes, pour le bloc opératoire.</li><li><strong>5 indications de l'OMS</strong> : avant contact patient, avant geste aseptique, après risque d'exposition, après contact patient, après contact environnement.</li></ul></div>
<h3>3. La stérilisation et la désinfection</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Stérilisation</strong> : élimination de tous les micro-organismes (autoclave à 121 °C pendant 15-20 min).</li><li><strong>Désinfection</strong> : élimination des germes pathogènes sur un objet.</li><li><strong>Antisepsie</strong> : désinfection de la peau et des muqueuses.</li><li><strong>Nettoyage</strong> : étape préalable à toute désinfection (eau + détergent).</li></ul></div>
<h3>4. Autres mesures d'hygiène</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Port des gants</strong> : pour tout contact avec les liquides biologiques.</li><li><strong>Port du masque</strong> : pour prévenir les infections respiratoires.</li><li><strong>Blouse</strong> : propre, changée régulièrement.</li><li><strong>Gestion des déchets</strong> : tri (DASRI, déchets ménagers, objets piquants).</li><li><strong>Aération des salles</strong> : plusieurs fois par jour.</li><li><strong>Nettoyage des surfaces</strong> : quotidien avec désinfectant.</li><li><strong>Contrôle des visiteurs</strong> : limitation, information sur les mesures d'hygiène.</li></ul><p><a href="https://www.youtube.com/results?search_query=hygiène+hospitalière+lave+des+mains+infection+nosocomiale" target="_blank" rel="noopener">🎥 Recherche : l'hygiène hospitalière (chaînes de cours de soins infirmiers)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'hygiène hospitalière prévient les infections nosocomiales. Le lavage des mains suit les 5 indications de l'OMS. La stérilisation élimine tous les germes ; la désinfection élimine les pathogènes. Les mesures comprennent aussi les gants, le masque, la gestion des déchets et le nettoyage.</p></div>
<div class="sources"><strong>Sources :</strong> Programme réformé de Soins Infirmiers, Ministère de la Santé (RDC) ; OMS — Hygiène des mains.</div>
    `
},
{
    title: "Leçon 3 — La prise des constantes vitales",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un patient arrive aux urgences de l'hôpital de Kisangani. L'infirmière doit immédiatement prendre ses constantes : température, pouls, respiration, tension artérielle. Ces mesures orientent le diagnostic du médecin et guident la prise en charge. Une infirmière ne peut pas se tromper.</p></div>
<h3>1. La température corporelle</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Normale</strong> : 36,5 °C à 37,5 °C.</li><li><strong>Voies de prise</strong> : buccale, axillaire, rectale, tympanique.</li><li><strong>Fièvre</strong> : > 38 °C. <strong>Hyperthermie</strong> : > 40 °C.</li><li><strong>Hypothermie</strong> : < 35 °C.</li></ul></div>
<h3>2. Le pouls</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Normale adulte</strong> : 60 à 100 battements/minute.</li><li><strong>Tachycardie</strong> : > 100 bpm. <strong>Bradycardie</strong> : < 60 bpm.</li><li><strong>Sites</strong> : radial (le plus utilisé), carotidien, fémoral, pédieux.</li><li><strong>Caractéristiques</strong> : fréquence, régularité, amplitude.</li></ul></div>
<h3>3. La respiration</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Normale adulte</strong> : 12 à 20 cycles/minute.</li><li><strong>Polypnée</strong> : > 20 cycles/min. <strong>Bradypnée</strong> : < 12 cycles/min.</li><li><strong>Dyspnée</strong> : difficulté respiratoire. <strong>Apnée</strong> : arrêt respiratoire.</li><li><strong>Observer</strong> : amplitude, régularité, bruits (sifflements, râles).</li></ul></div>
<h3>4. La tension artérielle</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Normale adulte</strong> : 120/80 mmHg.</li><li><strong>Hypertension</strong> : ≥ 140/90 mmHg.</li><li><strong>Hypotension</strong> : < 90/60 mmHg.</li><li><strong>Matériel</strong> : tensiomètre (à mercure, anéroïde, électronique) + stéthoscope.</li></ul></div>
<h3>5. Application pratique</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Un patient arrive avec : température 39,5 °C, pouls 110/min, respiration 24/min, tension 150/95 mmHg. L'infirmière note :</p><ul><li>Fièvre (39,5 °C).</li><li>Tachycardie (110/min).</li><li>Polypnée (24/min).</li><li>Hypertension (150/95).</li><li>Ces signes évoquent une infection associée à une hypertension. L'infirmière alerte immédiatement le médecin.</li></ul><p><a href="https://www.youtube.com/results?search_query=constantes+vitales+température+pouls+tension+artérielle" target="_blank" rel="noopener">🎥 Recherche : la prise des constantes vitales (chaînes de cours de soins infirmiers)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les constantes vitales sont : température (36,5-37,5 °C), pouls (60-100 bpm), respiration (12-20 cycles/min) et tension artérielle (120/80 mmHg). Toute anomalie doit être signalée au médecin. Les mesures sont notées dans le dossier du patient.</p></div>
<div class="sources"><strong>Sources :</strong> Programme réformé de Soins Infirmiers, Ministère de la Santé (RDC).</div>
    `
},
{
    title: "Leçon 4 — L'administration des médicaments",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Au service de pédiatrie de l'hôpital de Matadi, une infirmière doit administrer un sirop à un enfant. Elle vérifie 5 fois : le bon patient, le bon médicament, la bonne dose, la bonne voie, le bon moment. Une erreur peut être fatale. La règle des « 5 B » est fondamentale.</p></div>
<h3>1. La règle des 5 B</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Bon patient</strong> : vérifier l'identité du patient.</li><li><strong>Bon médicament</strong> : vérifier le nom, la date de péremption, l'intégrité de l'emballage.</li><li><strong>Bonne dose</strong> : calculer précisément la dose prescrite.</li><li><strong>Bonne voie</strong> : orale, injectable, rectale, cutanée, respiratoire.</li><li><strong>Bon moment</strong> : respecter les horaires prescrits (matin, midi, soir, coucher).</li></ul></div>
<h3>2. Les voies d'administration</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Voie orale</strong> : comprimés, sirops, gélules. Avantage : simple. Inconvénient : action lente.</li><li><strong>Voie injectable</strong> : intraveineuse (IV), intramusculaire (IM), sous-cutanée (SC), intradermique (ID).</li><li><strong>Voie rectale</strong> : suppositoires, lavements.</li><li><strong>Voie cutanée</strong> : pommades, crèmes, patchs.</li><li><strong>Voie respiratoire</strong> : inhalation, aérosol.</li><li><strong>Voie sublinguale</strong> : sous la langue.</li></ul></div>
<h3>3. Les règles de sécurité</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Vérification de la prescription</strong> : médicale, écrite, datée, signée.</li><li><strong>Hygiène des mains</strong> : avant et après chaque administration.</li><li><strong>Matériel stérile</strong> : pour toute injection.</li><li><strong>Surveillance</strong> : observer la réaction du patient (allergie, effets secondaires).</li><li><strong>Traçabilité</strong> : noter l'heure, la dose et la voie dans le dossier.</li><li><strong>Élimination des déchets</strong> : aiguilles dans le collecteur prévu, jamais dans la poubelle ordinaire.</li></ul></div>
<h3>4. Application pratique</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Un patient doit recevoir 500 mg de paracétamol toutes les 6 heures par voie orale. L'infirmière :</p><ul><li>Vérifie l'identité du patient (bracelet).</li><li>Prend la boîte de paracétamol 500 mg.</li><li>Vérifie la date de péremption.</li><li>Administre le comprimé avec un verre d'eau.</li><li>Note l'heure (8h, 14h, 20h, 2h) dans le dossier.</li><li>Surveille la baisse de la fièvre et l'absence d'allergie.</li></ul><p><a href="https://www.youtube.com/results?search_query=administration+médicaments+5B+voies+injection" target="_blank" rel="noopener">🎥 Recherche : l'administration des médicaments (chaînes de cours de soins infirmiers)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La règle des 5 B (bon patient, bon médicament, bonne dose, bonne voie, bon moment) est le fondement de l'administration des médicaments. Les voies sont multiples : orale, injectable, rectale, cutanée, respiratoire. La traçabilité et la surveillance sont indispensables.</p></div>
<div class="sources"><strong>Sources :</strong> Programme réformé de Soins Infirmiers, Ministère de la Santé (RDC) ; OMS — Bon usage des médicaments.</div>
    `
},
{
    title: "Leçon 5 — Les pansements et la cicatrisation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À l'hôpital de Goma, un patient présente une plaie infectée au pied. L'infirmière doit nettoyer, désinfecter, panser et surveiller la cicatrisation. Sans un pansement correct, la plaie peut s'aggraver et entraîner une septicémie.</p></div>
<h3>1. Les types de plaies</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Plaie aiguë</strong> : récente (coupure, brûlure, morsure).</li><li><strong>Plaie chronique</strong> : évolue depuis longtemps (ulcère, escarre, plaie diabétique).</li><li><strong>Plaie propre</strong> : sans infection, sans corps étranger.</li><li><strong>Plaie contaminée</strong> : présence de germes.</li><li><strong>Plaie infectée</strong> : rougeur, chaleur, douleur, pus.</li></ul></div>
<h3>2. Les phases de la cicatrisation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Phase inflammatoire</strong> (J0-J3) : nettoyage, saignement, arrivée des globules blancs.</li><li><strong>Phase de détersion</strong> (J3-J7) : élimination des tissus morts.</li><li><strong>Phase de bourgeonnement</strong> (J5-J21) : formation du nouveau tissu.</li><li><strong>Phase de maturation</strong> (J21-1 an) : consolidation, formation de la cicatrice.</li></ul></div>
<h3>3. La technique du pansement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>1.</strong> Préparer le matériel : compresses stériles, antiseptique, sérum physiologique, gants stériles, sparadrap.</li><li><strong>2.</strong> Hygiène des mains, port des gants.</li><li><strong>3.</strong> Retirer l'ancien pansement avec précaution.</li><li><strong>4.</strong> Nettoyer la plaie avec du sérum physiologique, du centre vers la périphérie.</li><li><strong>5.</strong> Désinfecter avec un antiseptique (Bétadine, chlorhexidine).</li><li><strong>6.</strong> Appliquer une compresse stérile.</li><li><strong>7.</strong> Fixer avec du sparadrap ou une bande.</li><li><strong>8.</strong> Éliminer les déchets dans le collecteur DASRI.</li><li><strong>9.</strong> Noter dans le dossier : aspect de la plaie, taille, odeur, exsudat.</li></ul></div>
<h3>4. Les signes d'infection</h3>

<h3>2. La réanimation cardio-pulmonaire (RCP)</h3>

        });
        const pct = Math.round(score/questions.length*100);
        document.getElementById('quizResult').innerHTML = '<div style="background:#b2dfdb;padding:16px;border-radius:10px;margin-top:14px;"><strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong><br>' + (score === questions.length ? 'Excellent. Tu maîtrises le programme.' : score >= 21 ? 'Bien. Revoyez les leçons où vous avez échoué.' : 'Relis attentivement les leçons avant l\'examen.') + '</div>';
    };
}
function renderSlide(index, keepHighlight = true) {
    const isQuiz = (index === slides.length - 1);
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    if (isQuiz) renderQuiz();
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm && !isQuiz) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>
</body>
</html>
