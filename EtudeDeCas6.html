<script>
const COURSE_TITLE = "Étude de cas · 4e secondaire";
const slides = [
{
    title: "Étude de cas — 4e secondaire — Sommaire général",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours prépare l'EXETAT (4e secondaire). Il comprend 8 leçons, suivies d'un quiz de révision.</p>
<ul>
<li>Leçon 1 — Introduction à l'étude de cas</li>
<li>Leçon 2 — La méthode du diagnostic social</li>
<li>Leçon 3 — Le plan d'intervention sociale</li>
<li>Leçon 4 — La méthode des cas en travail social</li>
<li>Leçon 5 — Les méthodes participatives : MARP et outils</li>
<li>Leçon 6 — Le suivi-évaluation des actions sociales</li>
<li>Leçon 7 — La rédaction du rapport social</li>
<li>Évaluation finale — Items EXETAT</li>
</ul>
</div>
`
},
{
    title: "Leçon 1 — Introduction à l'étude de cas",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une école de Kinshasa, on te présente le cas d'une famille en difficulté : père alcoolique, mère malade, trois enfants non scolarisés. Ton travail : analyser la situation, proposer un plan d'intervention. C'est l'étude de cas.</p></div>
<h3>1. Définition</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Étude de cas</strong> : méthode d'analyse approfondie d'une situation réelle ou fictive, individuelle ou collective.</li><li><strong>Objectif</strong> : comprendre une situation complexe, identifier les problèmes, proposer des solutions.</li><li><strong>Usage</strong> : formation, recherche, intervention sociale.</li></ul></div>
<h3>2. Les étapes de l'étude de cas</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>1. Présentation du cas</strong> : description de la situation.</li><li><strong>2. Collecte des données</strong> : entretiens, observations, documents.</li><li><strong>3. Analyse</strong> : identification des problèmes, des causes, des conséquences.</li><li><strong>4. Hypothèses</strong> : pistes de compréhension.</li><li><strong>5. Plan d'intervention</strong> : objectifs, actions, partenaires.</li><li><strong>6. Évaluation</strong> : résultats attendus.</li></ul></div>
<h3>3. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><strong>Cas : la famille Mukendi à Kinshasa</strong></p><ul><li><strong>Situation</strong> : père alcoolique, mère malade, 3 enfants non scolarisés.</li><li><strong>Problèmes</strong> : alcoolisme, santé, pauvreté, déscolarisation.</li><li><strong>Analyse</strong> : alcoolisme → violence, pauvreté → déscolarisation.</li><li><strong>Plan</strong> : orientation vers un centre de désintoxication, soins pour la mère, inscription à l'école, aide alimentaire.</li><li><strong>Partenaires</strong> : centre social, école, hôpital, ONG.</li></ul><p><a href="https://www.youtube.com/results?search_query=étude+de+cas+méthode+analyse+travail+social" target="_blank" rel="noopener">🎥 Recherche : l'étude de cas</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'étude de cas analyse en profondeur une situation complexe. Les 6 étapes sont : présentation, collecte, analyse, hypothèses, plan d'intervention, évaluation. Elle est utilisée en formation et en intervention sociale.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national d'Animation Sociale (RDC) ; Fiches pédagogiques 2025.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT.</div>
`
},
{
    title: "Leçon 2 — La méthode du diagnostic social",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une assistante sociale reçoit une famille en difficulté à Kinshasa. Avant de proposer une aide, elle doit comprendre : quelle est la situation ? Quels sont les besoins ? Quelles sont les ressources ? Le diagnostic social est la base de toute intervention.</p></div>
<h3>1. Définition</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Diagnostic social</strong> : analyse globale d'une situation individuelle ou familiale pour identifier les problèmes et les besoins.</li><li><strong>Objectif</strong> : comprendre avant d'agir.</li><li><strong>Principes</strong> : respect, écoute, confidentialité, non-jugement.</li></ul></div>
<h3>2. Les composantes du diagnostic</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Données personnelles</strong> : identité, âge, état civil, santé.</li><li><strong>Situation familiale</strong> : composition, relations, logement.</li><li><strong>Situation économique</strong> : revenus, emploi, dettes.</li><li><strong>Situation sociale</strong> : scolarisation, relations sociales, soutien.</li><li><strong>Problèmes identifiés</strong> : difficultés, besoins prioritaires.</li><li><strong>Ressources</strong> : personnelles, familiales, institutionnelles.</li></ul></div>
<h3>3. Les outils du diagnostic</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Entretien</strong> : écoute active, questionnement.</li><li><strong>Visite à domicile</strong> : observation du cadre de vie.</li><li><strong>Enquête sociale</strong> : recueil de données auprès de l'entourage.</li><li><strong>Documents</strong> : certificats, attestations, dossiers.</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><strong>Diagnostic social de la famille Mukendi</strong></p><ul><li>Personnes : père 45 ans (alcoolique), mère 38 ans (malade), 3 enfants (7, 10, 13 ans).</li><li>Logement : 2 pièces insalubres, quartier populaire.</li><li>Revenus : irréguliers (petit commerce de la mère).</li><li>Problèmes : alcoolisme, maladie, pauvreté, déscolarisation.</li><li>Ressources : voisins solidaires, église, ONG locale.</li><li>Priorités : santé de la mère, scolarisation des enfants, aide au père.</li></ul><p><a href="https://www.youtube.com/results?search_query=diagnostic+social+travail+social+outils" target="_blank" rel="noopener">🎥 Recherche : le diagnostic social</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le diagnostic social analyse une situation pour identifier problèmes et besoins. Il comprend : données personnelles, familiales, économiques, sociales, problèmes et ressources. Les outils : entretien, visite à domicile, enquête, documents.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national d'Animation Sociale (RDC).</div>
`
},
{
    title: "Leçon 3 — Le plan d'intervention sociale",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Après le diagnostic, l'assistante sociale prépare un plan d'intervention pour la famille Mukendi. Elle fixe des objectifs, des actions, des partenaires, un calendrier. Sans plan, l'intervention serait désordonnée.</p></div>
<h3>1. Définition</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Plan d'intervention</strong> : ensemble structuré des actions à mener pour résoudre les problèmes identifiés.</li><li><strong>Objectif</strong> : fixer un cap, mobiliser les ressources, coordonner les partenaires.</li><li><strong>Principes</strong> : participation de la personne, réalisme, progressivité.</li></ul></div>
<h3>2. Les composantes du plan</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Objectifs</strong> : généraux et spécifiques, mesurables.</li><li><strong>Actions</strong> : concrètes, adaptées.</li><li><strong>Responsables</strong> : qui fait quoi.</li><li><strong>Partenaires</strong> : institutions, ONG, famille.</li><li><strong>Calendrier</strong> : étapes et délais.</li><li><strong>Budget</strong> : estimation des coûts.</li><li><strong>Indicateurs</strong> : mesure des résultats.</li></ul></div>
<h3>3. La négociation avec la personne</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Contrat d'aide</strong> : accord entre l'usager et le travailleur social.</li><li><strong>Participation</strong> : la personne est actrice de son plan.</li><li><strong>Réalisme</strong> : objectifs atteignables.</li><li><strong>Réajustement</strong> : le plan peut évoluer.</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><strong>Plan d'intervention famille Mukendi</strong></p><ul><li>Objectif 1 : soigner la mère dans un délai de 1 mois → hôpital, ONG santé.</li><li>Objectif 2 : scolariser les 3 enfants à la rentrée → école, ONG éducation.</li><li>Objectif 3 : accompagner le père vers une prise en charge → centre de désintoxication.</li><li>Objectif 4 : améliorer les revenus → microcrédit, formation.</li><li>Suivi : visite mensuelle, réunion trimestrielle.</li></ul><p><a href="https://www.youtube.com/results?search_query=plan+intervention+sociale+objectifs+actions" target="_blank" rel="noopener">🎥 Recherche : le plan d'intervention sociale</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le plan d'intervention structure les actions à mener. Il comprend : objectifs, actions, responsables, partenaires, calendrier, budget, indicateurs. La personne est actrice de son plan via un contrat d'aide.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national d'Animation Sociale (RDC).</div>
`
},
{
    title: "Leçon 4 — La méthode des cas en travail social",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un centre social de Lubumbashi, une équipe analyse le cas d'un jeune délinquant. Chacun donne son point de vue, l'équipe confronte les hypothèses, propose des pistes. C'est la méthode des cas en travail social.</p></div>
<h3>1. Définition</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Méthode des cas</strong> : démarche d'analyse collective d'une situation.</li><li><strong>Objectif</strong> : comprendre, confronter les points de vue, proposer des solutions.</li><li><strong>Usage</strong> : formation, supervision d'équipe, intervention.</li></ul></div>
<h3>2. Les étapes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>1. Présentation du cas</strong> : exposé des faits par le travailleur social référent.</li><li><strong>2. Questions de clarification</strong> : les participants posent des questions.</li><li><strong>3. Analyse</strong> : identification des problèmes, des causes, des ressources.</li><li><strong>4. Hypothèses</strong> : pistes de compréhension.</li><li><strong>5. Propositions</strong> : actions possibles.</li><li><strong>6. Synthèse</strong> : plan d'action retenu.</li></ul></div>
<h3>3. Les règles de la méthode</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Confidentialité</strong> : anonymat des personnes.</li><li><strong>Écoute</strong> : respect des points de vue.</li><li><strong>Non-jugement</strong> : pas de critique personnelle.</li><li><strong>Objectivité</strong> : faits, pas d'interprétation.</li><li><strong>Synthèse</strong> : décision collégiale.</li></ul></div>
<h3>4. Application</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><strong>Cas d'un jeune délinquant</strong></p><ul><li>Présentation : jeune de 16 ans, vols répétés, famille monoparentale.</li><li>Questions : scolarité ? Amis ? Antécédents ?</li><li>Analyse : absence du père, pauvreté, échec scolaire, influence du groupe.</li><li>Hypothèses : besoin de reconnaissance, manque de repères.</li><li>Propositions : accompagnement éducatif, formation professionnelle, médiation familiale.</li><li>Synthèse : plan d'action pluridisciplinaire.</li></ul><p><a href="https://www.youtube.com/results?search_query=méthode+des+cas+travail+social+analyse" target="_blank" rel="noopener">🎥 Recherche : la méthode des cas</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La méthode des cas analyse collectivement une situation. Les 6 étapes : présentation, questions, analyse, hypothèses, propositions, synthèse. Les règles : confidentialité, écoute, non-jugement, objectivité, synthèse collégiale.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national d'Animation Sociale (RDC).</div>
`
},
{
    title: "Leçon 5 — Les méthodes participatives : MARP et outils",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un village du Kwango, une équipe utilise la MARP (Méthode Active de Recherche et de Planification Participative). Les villageois dessinent la carte du village, classent les problèmes, proposent des solutions. Ces outils rendent la communauté actrice de son développement.</p></div>
<h3>1. La MARP</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>MARP</strong> : méthode active de recherche et de planification participative.</li><li><strong>Objectif</strong> : faire participer la communauté à l'analyse et à la planification.</li><li><strong>Principes</strong> : participation, visualisation, apprentissage mutuel, flexibilité.</li></ul></div>
<h3>2. Les outils de la MARP</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Cartographie participative</strong> : dessin du village.</li><li><strong>Transect</strong> : parcours commenté.</li><li><strong>Calendrier saisonnier</strong> : activités selon les saisons.</li><li><strong>Classement par paires</strong> : hiérarchisation des problèmes.</li><li><strong>Diagramme de Venn</strong> : relations entre acteurs.</li><li><strong>Arbre à problèmes</strong> : causes et conséquences.</li><li><strong>Matrice de préférence</strong> : choix entre options.</li><li><strong>Focus group</strong> : discussion de groupe.</li></ul></div>
<h3>3. Les étapes de la MARP</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Préparation</strong> : informer, obtenir l'accord.</li><li><strong>Collecte</strong> : utilisation des outils.</li><li><strong>Analyse</strong> : synthèse des données.</li><li><strong>Planification</strong> : priorisation des actions.</li><li><strong>Restitution</strong> : présentation à la communauté.</li><li><strong>Mise en œuvre</strong> : réalisation des actions.</li></ul></div>
<h3>4. Application</h3>

<h3>2. Les indicateurs</h3>

<h3>3. Les outils du suivi-évaluation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Fiche de suivi</strong> : enregistrement régulier.</li><li><strong>Rapport d'activités</strong> : synthèse périodique.</li><li><strong>Enquête de satisfaction</strong> : recueil d'avis.</li><li><strong>Réunion de bilan</strong> : analyse collective.</li><li><strong>Tableau de bord</strong> : visualisation des indicateurs.</li></ul></div>

<h3>2. La structure du rapport</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>En-tête</strong> : émetteur, destinataire, date, objet.</li><li><strong>Introduction</strong> : contexte, motif du rapport.</li><li><strong>Présentation de la situation</strong> : données factuelles.</li><li><strong>Analyse</strong> : problèmes, causes, besoins.</li><li><strong>Actions menées</strong> : interventions réalisées.</li><li><strong>Résultats</strong> : effets observés.</li><li><strong>Perspectives</strong> : suites à donner.</li><li><strong>Conclusion</strong> : synthèse.</li><li><strong>Signature</strong>.</li></ul></div>

let currentSlide = 0;

const contentDiv = document.getElementById('content');

pageTitle.textContent = "ECOLIA · " + COURSE_TITLE;

function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';
    slideCounterSpan.textContent = '0/0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>
