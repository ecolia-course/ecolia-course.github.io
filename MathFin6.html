{
    title: "Leçon 1 — Les pourcentages : calcul et applications commerciales",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un magasin de Kinshasa, une chemise coûte 25 000 FC. Le patron accorde une remise de 15 % à un client fidèle, puis applique la TVA de 16 % sur le prix remisé. Combien le client paie-t-il au total ? Les pourcentages sont partout dans le commerce : remises, marges, TVA, intérêts. Leur maîtrise est indispensable.</p></div>
<h3>1. Définition et formules de base</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Pourcentage</strong> : fraction d'un tout exprimée sur 100. Exemple : 15 % = 15/100 = 0,15.</li><li><strong>Calcul d'un pourcentage d'un nombre</strong> : valeur × taux / 100. Exemple : 15 % de 25 000 = 25 000 × 15 / 100 = 3 750 FC.</li><li><strong>Calcul du taux</strong> : (partie / total) × 100. Exemple : 3 750 / 25 000 × 100 = 15 %.</li><li><strong>Calcul du total à partir d'une partie</strong> : partie × 100 / taux. Exemple : 3 750 × 100 / 15 = 25 000 FC.</li></ul></div>
<h3>2. Les réductions successives et cumulées</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Réductions successives</strong> : on les applique l'une après l'autre. Le taux global n'est pas la somme des taux.</li><li><strong>Exemple</strong> : une remise de 10 % suivie d'une remise de 5 % ne donne pas 15 %, mais 14,5 %.</li><li><strong>Calcul</strong> : prix × (1 − 10/100) × (1 − 5/100) = prix × 0,90 × 0,95 = prix × 0,855.</li><li><strong>Réduction cumulée</strong> : plusieurs réductions appliquées au même moment sur le même prix. Exemple : 10 % + 5 % = 15 %.</li></ul></div>
<h3>3. Les augmentations et les variations</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Augmentation</strong> : prix × (1 + taux/100). Exemple : 25 000 × 1,16 = 29 000 FC (TVA 16 %).</li><li><strong>Diminution</strong> : prix × (1 − taux/100). Exemple : 25 000 × 0,85 = 21 250 FC (remise 15 %).</li><li><strong>Variation relative</strong> : (valeur finale − valeur initiale) / valeur initiale × 100.</li><li><strong>Indice base 100</strong> : valeur finale / valeur initiale × 100.</li></ul></div>
<h3>4. Application commerciale complète</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Une chemise coûte 25 000 FC HT.</p><ul><li>Étape 1 : remise fidélité de 15 % = 25 000 × 0,15 = 3 750 FC → prix après remise = 21 250 FC.</li><li>Étape 2 : TVA 16 % sur 21 250 = 3 400 FC → prix TTC = 24 650 FC.</li><li>Le client paie <strong>24 650 FC</strong>.</li></ul><p>Autre exemple : une remise de 10 % suivie d'une remise de 5 % donne un taux global de 1 − (0,90 × 0,95) = 14,5 %, pas 15 %.</p><p><a href="https://www.youtube.com/results?search_query=pourcentages+calcul+commercial+réductions+successives" target="_blank" rel="noopener">🎥 Recherche : les pourcentages en mathématiques financières (chaînes de cours de mathématiques)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un pourcentage est une fraction sur 100. Les réductions successives se multiplient (jamais on ne les additionne). Une augmentation se calcule par × (1 + t/100), une diminution par × (1 − t/100). Les pourcentages servent pour les remises, la TVA, les marges et les intérêts.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Mathématiques Financières, 4e CG (manuels-scolaires-rdc.com, 2025) ; Curriculum de Commerciale et Gestion (MEPST/DIPROMAD, 2023).<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, TVA, HT, TTC.</div>
    `
},
{
    title: "Leçon 2 — Les intérêts simples",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un commerçant de Kinshasa place 500 000 FC à la banque pendant 9 mois à un taux annuel de 8 %. Combien d'intérêts va-t-il percevoir ? À l'échéance, quel capital total aura-t-il ? Le calcul des intérêts simples est la base de toute opération de placement ou d'emprunt à court terme.</p></div>
<h3>1. Définition et formule de base</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Intérêt simple</strong> : intérêt calculé uniquement sur le capital initial, sans réinvestissement.</li><li><strong>Formule</strong> : I = C × t × n / 100, où :</li><li><strong>I</strong> = intérêt ; <strong>C</strong> = capital ; <strong>t</strong> = taux annuel en % ; <strong>n</strong> = durée en années.</li><li>Si la durée est exprimée en mois : n = nombre de mois / 12.</li><li>Si la durée est exprimée en jours : n = nombre de jours / 360 (année commerciale) ou / 365 (année civile).</li></ul></div>
<h3>2. Calcul de la valeur acquise</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Valeur acquise (V)</strong> : V = C + I = C × (1 + t × n / 100).</li><li><strong>Valeur actuelle</strong> : C = V / (1 + t × n / 100).</li><li><strong>Taux moyen</strong> : t = I × 100 / (C × n).</li><li><strong>Durée</strong> : n = I × 100 / (C × t).</li></ul></div>
<h3>3. Les méthodes de calcul des jours</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Année commerciale</strong> : 360 jours, chaque mois compte 30 jours.</li><li><strong>Année civile</strong> : 365 jours (ou 366 les années bissextiles).</li><li><strong>Nombre de jours</strong> : on compte du jour de dépôt (exclu) au jour de retrait (inclus), en général.</li><li><strong>Exemple RDC</strong> : la BCC utilise l'année civile de 365 jours pour ses calculs officiels.</li></ul></div>
<h3>4. Application complète</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Placement de 500 000 FC à 8 % pendant 9 mois.</p><ul><li>Durée en années : n = 9/12 = 0,75 an.</li><li>Intérêt : I = 500 000 × 8 × 0,75 / 100 = <strong>30 000 FC</strong>.</li><li>Valeur acquise : V = 500 000 + 30 000 = <strong>530 000 FC</strong>.</li></ul><p>Autre exemple : placement de 1 000 000 FC à 6 % pendant 90 jours (année commerciale).</p><ul><li>Durée en années : n = 90/360 = 0,25 an.</li><li>Intérêt : I = 1 000 000 × 6 × 0,25 / 100 = <strong>15 000 FC</strong>.</li><li>Valeur acquise : V = 1 015 000 FC.</li></ul><p><a href="https://www.youtube.com/results?search_query=intérêts+simples+calcul+capital+taux+durée" target="_blank" rel="noopener">🎥 Recherche : les intérêts simples (chaînes de cours de mathématiques financières)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Formule : I = C × t × n / 100. La durée doit être exprimée en années (mois/12, jours/360 ou 365). La valeur acquise est V = C + I. L'intérêt simple se calcule uniquement sur le capital initial, sans réinvestissement.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Mathématiques Financières, 4e CG (manuels-scolaires-rdc.com, 2025) ; Banque Centrale du Congo.</div>
    `
},
{
    title: "Leçon 3 — Le calcul des escomptes commerciaux",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un client achète 200 000 FC de marchandises chez un grossiste de Kinshasa. Il paie comptant et obtient un escompte de 3 %. Un autre client paie à 60 jours mais le fournisseur a besoin de liquidités : il présente la traite à la banque qui prélève un escompte. L'escompte commercial est au cœur des transactions.</p></div>
<h3>1. L'escompte commercial (réduction de caisse)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : réduction accordée par un fournisseur à un client qui paie comptant.</li><li><strong>Formule</strong> : escompte = montant × taux / 100.</li><li><strong>Exemple</strong> : 200 000 FC avec 3 % d'escompte → escompte = 6 000 FC, net à payer = 194 000 FC.</li><li><strong>Avantage pour le fournisseur</strong> : encaissement immédiat, trésorerie améliorée.</li><li><strong>Avantage pour le client</strong> : économie sur le prix d'achat.</li></ul></div>
<h3>2. L'escompte d'effets de commerce (escompte bancaire)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : opération par laquelle une banque avance à un client le montant d'un effet non échu, moyennant un intérêt appelé escompte.</li><li><strong>Formule</strong> : escompte = valeur nominale × taux × n / 100, où n est le nombre de jours restant jusqu'à l'échéance.</li><li><strong>Valeur actuelle (ou net escompté)</strong> : valeur nominale − escompte − commissions.</li><li><strong>Commissions</strong> : frais fixes prélevés par la banque.</li><li><strong>Jour de banque</strong> : la banque ajoute souvent 1 ou 2 jours de retard.</li></ul></div>
<h3>3. Comparaison escompte commercial et escompte bancaire</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Escompte commercial</strong> : accordé par le fournisseur au client.</li><li><strong>Escompte bancaire</strong> : accordé par la banque au porteur d'un effet.</li><li><strong>Calcul</strong> : même formule (intérêt simple sur le temps restant).</li><li><strong>Taux</strong> : le taux bancaire est généralement plus élevé.</li></ul></div>
<h3>4. Application bancaire complète</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Une entreprise de Kinshasa présente à sa banque une traite de 500 000 FC à échéance du 30 juin. Nous sommes le 1er juin. Taux d'escompte : 12 % l'an. Commission : 2 000 FC. Jour de banque : 1 jour.</p><ul><li>Jours restants : 30 (du 1er au 30 juin) + 1 jour de banque = 31 jours.</li><li>Escompte = 500 000 × 12 × 31 / 36000 = <strong>5 166,67 FC</strong>.</li><li>Net escompté = 500 000 − 5 166,67 − 2 000 = <strong>492 833,33 FC</strong>.</li></ul><p>L'entreprise reçoit immédiatement 492 833 FC au lieu d'attendre un mois pour 500 000 FC.</p><p><a href="https://www.youtube.com/results?search_query=escompte+commercial+bancaire+calcul+traite" target="_blank" rel="noopener">🎥 Recherche : l'escompte commercial (chaînes de cours de mathématiques financières)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'escompte commercial est une réduction pour paiement comptant. L'escompte bancaire est un intérêt prélevé par la banque sur un effet non échu. Formule : escompte = VN × t × n / 36000. Le net escompté est égal à la valeur nominale moins l'escompte et les commissions.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Mathématiques Financières, 4e CG (manuels-scolaires-rdc.com, 2025) ; Banque Centrale du Congo.</div>
    `
},
{
    title: "Leçon 4 — Les intérêts composés",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une entreprise de Kinshasa place 2 000 000 FC à 10 % par an pendant 5 ans avec capitalisation annuelle des intérêts. Contrairement à l'intérêt simple, les intérêts produisent eux-mêmes des intérêts. Le capital final est plus élevé que dans le cas simple. C'est la magie des intérêts composés.</p></div>
<h3>1. Définition et formule</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Intérêts composés</strong> : les intérêts de chaque période s'ajoutent au capital et produisent à leur tour des intérêts.</li><li><strong>Valeur acquise (Vn)</strong> : Vn = C × (1 + i)<sup>n</sup>.</li><li><strong>C</strong> = capital initial ; <strong>i</strong> = taux d'intérêt par période (en décimal) ; <strong>n</strong> = nombre de périodes.</li><li><strong>Valeur actuelle (C)</strong> : C = Vn / (1 + i)<sup>n</sup>.</li><li><strong>Intérêt total</strong> : I = Vn − C.</li></ul></div>
<h3>2. Comparaison intérêt simple / intérêt composé</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Intérêt simple</strong> : V = C × (1 + n × i). Croissance linéaire.</li><li><strong>Intérêt composé</strong> : V = C × (1 + i)<sup>n</sup>. Croissance exponentielle.</li><li>À court terme, la différence est faible. À long terme, elle devient énorme.</li><li><strong>Exemple</strong> : 1 000 000 FC à 10 % sur 10 ans → simple : 2 000 000 FC ; composé : 2 593 742 FC.</li></ul></div>
<h3>3. Les taux équivalents et proportionnels</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Taux proportionnel</strong> : i<sub>période</sub> = i<sub>annuel</sub> / nombre de périodes. Exemple : 12 % annuel = 1 % mensuel.</li><li><strong>Taux équivalent</strong> : (1 + i<sub>annuel</sub>) = (1 + i<sub>période</sub>)<sup>nombre de périodes</sup>.</li><li><strong>Exemple</strong> : pour 12 % annuel, le taux mensuel équivalent est (1,12)<sup>1/12</sup> − 1 ≈ 0,9489 %.</li></ul></div>
<h3>4. Application complète</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Placement de 2 000 000 FC à 10 % pendant 5 ans.</p><ul><li>V5 = 2 000 000 × (1,10)<sup>5</sup>.</li><li>(1,10)<sup>5</sup> = 1,61051.</li><li>V5 = 2 000 000 × 1,61051 = <strong>3 221 020 FC</strong>.</li><li>Intérêt total = 3 221 020 − 2 000 000 = <strong>1 221 020 FC</strong>.</li></ul><p>Comparaison avec l'intérêt simple : 2 000 000 × (1 + 5 × 0,10) = 3 000 000 FC. Les intérêts composés rapportent 221 020 FC de plus.</p><p><a href="https://www.youtube.com/results?search_query=intérêts+composés+valeur+acquise+valeur+actuelle" target="_blank" rel="noopener">🎥 Recherche : les intérêts composés (chaînes de cours de mathématiques financières)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Formule : Vn = C × (1 + i)<sup>n</sup>. Les intérêts composés génèrent une croissance exponentielle. Le taux doit être exprimé dans la même unité que la période. Les intérêts composés sont utilisés pour les placements longs et les emprunts à long terme.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Mathématiques Financières, 4e CG (manuels-scolaires-rdc.com, 2025).</div>

    title: "Leçon 5 — Les annuités et les emprunts",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une entreprise de Lubumbashi emprunte 10 000 000 FC à la banque pour acheter une machine. Elle rembourse par versements constants de 2 500 000 FC par an pendant 5 ans à un taux de 12 %. Comment calculer le montant de chaque versement ? Les annuités sont la clé des emprunts à long terme.</p></div>
<h3>1. Définition d'une annuité</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Annuité</strong> : versement constant effectué à intervalles réguliers (annuel, semestriel, mensuel).</li><li><strong>Valeur acquise d'une suite d'annuités</strong> : Vn = a × [(1 + i)<sup>n</sup> − 1] / i.</li><li><strong>Valeur actuelle d'une suite d'annuités</strong> : V0 = a × [1 − (1 + i)<sup>−n</sup>] / i.</li><li><strong>a</strong> = montant de l'annuité ; <strong>i</strong> = taux par période ; <strong>n</strong> = nombre de versements.</li></ul></div>
<h3>2. Calcul de l'annuité de remboursement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Données</strong> : capital emprunté C, taux i, durée n.</li><li><strong>Formule</strong> : a = C × i / [1 − (1 + i)<sup>−n</sup>].</li><li><strong>Intérêt total payé</strong> : I = n × a − C.</li><li><strong>Coût de l'emprunt</strong> : les intérêts cumulés + frais éventuels.</li></ul></div>
<h3>3. Le tableau d'amortissement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Amortissement</strong> : remboursement progressif du capital emprunté.</li><li><strong>Intérêt</strong> : calculé sur le capital restant dû à chaque période.</li><li><strong>Annuité</strong> = amortissement + intérêt.</li><li>Au fil du temps, la part de l'amortissement augmente et la part de l'intérêt diminue.</li></ul></div>
<h3>4. Application complète</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Emprunt de 10 000 000 FC à 12 % sur 5 ans, remboursable par annuités constantes.</p><ul><li>a = 10 000 000 × 0,12 / [1 − (1,12)<sup>−5</sup>].</li><li>(1,12)<sup>−5</sup> = 0,5674.</li><li>a = 1 200 000 / 0,4326 = <strong>2 773 907 FC par an</strong>.</li><li>Total remboursé = 2 773 907 × 5 = 13 869 535 FC.</li><li>Intérêt total = 13 869 535 − 10 000 000 = <strong>3 869 535 FC</strong>.</li></ul><p><a href="https://www.youtube.com/results?search_query=annuités+emprunts+amortissement+calcul" target="_blank" rel="noopener">🎥 Recherche : les annuités et les emprunts (chaînes de cours de mathématiques financières)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les annuités sont des versements constants à intervalles réguliers. Formule de la valeur acquise : Vn = a × [(1 + i)<sup>n</sup> − 1] / i. Formule de l'annuité d'emprunt : a = C × i / [1 − (1 + i)<sup>−n</sup>]. Le tableau d'amortissement décompose chaque versement en intérêt et en amortissement.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Mathématiques Financières, 4e CG (manuels-scolaires-rdc.com, 2025).</div>
    `

    title: "Leçon 6 — La répartition proportionnelle",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Trois associés de Kinshasa ont investi respectivement 5 000 000 FC, 3 000 000 FC et 2 000 000 FC dans une entreprise. À la fin de l'année, le bénéfice de 4 000 000 FC doit être réparti proportionnellement aux apports. Comment calculer la part de chacun ? La répartition proportionnelle est un outil de gestion essentiel.</p></div>
<h3>1. La répartition proportionnelle simple</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : partage d'une somme en fonction de coefficients donnés (apports, nombres, poids).</li><li><strong>Méthode</strong> : on additionne les coefficients, puis on calcule la part de chacun selon la formule : part = somme × coefficient / total des coefficients.</li><li><strong>Exemple</strong> : bénéfice de 4 000 000 FC à partager entre trois associés ayant apporté 5M, 3M, 2M (total 10M).</li><li>Part du 1er : 4 000 000 × 5/10 = 2 000 000 FC.</li><li>Part du 2e : 4 000 000 × 3/10 = 1 200 000 FC.</li><li>Part du 3e : 4 000 000 × 2/10 = 800 000 FC.</li></ul></div>
<h3>2. La répartition proportionnelle inverse</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : partage d'une somme en proportion inverse de coefficients donnés.</li><li><strong>Usage</strong> : répartition des bénéfices en fonction du temps de travail ou du risque encouru (le moins risqué reçoit plus).</li><li><strong>Méthode</strong> : on utilise les inverses des coefficients (1/a, 1/b, 1/c), puis on applique la règle de proportionnalité simple.</li></ul></div>
<h3>3. Application à la comptabilité des sociétés</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Répartition des bénéfices</strong> : entre les associés selon leurs apports.</li><li><strong>Répartition des charges indirectes</strong> : en comptabilité analytique, selon les clés de répartition (nombre d'heures, chiffre d'affaires, effectifs).</li><li><strong>Répartition des dividendes</strong> : en fonction du nombre d'actions détenues.</li></ul></div>
<h3>4. Application complète</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Répartition de 6 000 000 FC de charges communes entre trois services selon leur chiffre d'affaires respectif : 60 M, 30 M, 30 M. Total = 120 M.</p><ul><li>Service 1 : 6 000 000 × 60/120 = 3 000 000 FC.</li><li>Service 2 : 6 000 000 × 30/120 = 1 500 000 FC.</li><li>Service 3 : 6 000 000 × 30/120 = 1 500 000 FC.</li></ul><p><a href="https://www.youtube.com/results?search_query=répartition+proportionnelle+inverse+bénéfices" target="_blank" rel="noopener">🎥 Recherche : la répartition proportionnelle (chaînes de cours de mathématiques financières)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La répartition proportionnelle simple partage une somme selon des coefficients donnés. La répartition inverse utilise les inverses des coefficients. Ces techniques servent à partager les bénéfices entre associés et à répartir les charges entre services.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Mathématiques Financières, 4e CG (manuels-scolaires-rdc.com, 2025).</div>
    `

    title: "Leçon 7 — La règle de trois et les partages inégaux",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un ouvrier de Kinshasa gagne 120 000 FC pour 5 jours de travail. Combien gagnera-t-il pour 12 jours ? Un autre achète 3 m de tissu pour 45 000 FC. Combien coûtera 7 m ? La règle de trois résout ces problèmes de proportionnalité du quotidien.</p></div>
<h3>1. La règle de trois simple</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : méthode pour trouver une quatrième valeur proportionnelle à partir de trois valeurs connues.</li><li><strong>Formule</strong> : si a correspond à b, alors c correspond à x = (c × b) / a.</li><li><strong>Proportionnalité directe</strong> : quand une quantité augmente, l'autre augmente aussi.</li><li><strong>Exemple</strong> : 5 jours → 120 000 FC ; 12 jours → x = (12 × 120 000) / 5 = 288 000 FC.</li></ul></div>
<h3>2. La proportionnalité inverse</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : quand une quantité augmente, l'autre diminue.</li><li><strong>Exemple</strong> : si 5 ouvriers construisent un mur en 12 jours, combien de jours faudra-t-il à 8 ouvriers ?</li><li>x = (5 × 12) / 8 = 7,5 jours.</li><li><strong>Application</strong> : partage du travail, calcul du temps de production.</li></ul></div>
<h3>3. Les partages inégaux</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Principe</strong> : répartir une somme entre plusieurs personnes selon des critères différents (âge, ancienneté, rendement).</li><li><strong>Méthode</strong> : on calcule d'abord la part totale selon les critères (proportionnalité), puis on ajuste si nécessaire.</li><li><strong>Exemple</strong> : partage d'une prime de 1 000 000 FC entre trois employés selon leur ancienneté (2 ans, 3 ans, 5 ans, total 10).</li><li>Part du 1er : 1 000 000 × 2/10 = 200 000 FC.</li><li>Part du 2e : 1 000 000 × 3/10 = 300 000 FC.</li><li>Part du 3e : 1 000 000 × 5/10 = 500 000 FC.</li></ul></div>
<h3>4. Application commerciale</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Une entreprise de Lubumbashi doit livrer 500 tonnes de ciment en 5 jours avec 10 camions. Combien de camions faut-il pour livrer 800 tonnes en 4 jours ?</p><ul><li>Méthode : on calcule le nombre de tonnes par camion par jour.</li><li>10 camions × 5 jours = 50 camions-jours pour 500 tonnes → 10 tonnes/camion-jour.</li><li>Pour 800 tonnes en 4 jours : 800 / (4 × 10) = 20 camions.</li></ul><p><a href="https://www.youtube.com/results?search_query=règle+de+trois+partages+inégaux+proportionnalité" target="_blank" rel="noopener">🎥 Recherche : la règle de trois (chaînes de cours de mathématiques financières)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La règle de trois simple s'applique aux proportions directes ou inverses. Le partage inégal répartit une somme selon des critères multiples. Ces méthodes sont indispensables pour résoudre les problèmes commerciaux quotidiens.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Mathématiques Financières, 4e CG (manuels-scolaires-rdc.com, 2025).</div>
    `

    title: "Leçon 8 — La conversion des devises (FC et devises étrangères)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un importateur de Kinshasa achète des marchandises en dollars américains. Il doit calculer combien de francs congolais il doit mobiliser. À l'aéroport de Ndjili, un voyageur veut convertir ses euros en FC. Le taux de change est une réalité quotidienne du commerce congolais.</p></div>
<h3>1. Définition du taux de change</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Taux de change</strong> : prix d'une devise exprimé dans une autre devise.</li><li><strong>Devise</strong> : monnaie étrangère (USD, EUR, GBP, ZAR, CNY).</li><li><strong>Cours acheteur</strong> : prix auquel la banque achète une devise.</li><li><strong>Cours vendeur</strong> : prix auquel la banque vend une devise.</li><li><strong>Marge de change</strong> : différence entre les deux cours (rémunération de la banque ou du bureau de change).</li></ul></div>
<h3>2. La conversion simple</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>FC = montant en devise × taux de change</strong>.</li><li><strong>Devise = montant en FC / taux de change</strong>.</li><li><strong>Exemple</strong> : taux USD/FC = 2 800 FC. Pour convertir 100 USD en FC : 100 × 2 800 = 280 000 FC.</li><li>Pour convertir 560 000 FC en USD : 560 000 / 2 800 = 200 USD.</li></ul></div>
<h3>3. Les conversions croisées</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Conversion croisée</strong> : passage d'une devise à une autre sans passer par le FC.</li><li><strong>Exemple</strong> : convertir 100 EUR en USD. Si EUR/FC = 3 200 FC et USD/FC = 2 800 FC, alors EUR/USD = 3 200 / 2 800 = 1,1429. Donc 100 EUR = 114,29 USD.</li><li><strong>Utilisation</strong> : commerce international, voyages.</li></ul></div>
<h3>4. Application commerciale complète</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Un importateur doit payer une facture de 50 000 USD à un fournisseur chinois. Le cours vendeur de la banque est de 2 850 FC par USD, plus une commission de 0,5 %.</p><ul><li>Montant en FC : 50 000 × 2 850 = <strong>142 500 000 FC</strong>.</li><li>Commission : 142 500 000 × 0,5/100 = 712 500 FC.</li><li>Total à débourser : 142 500 000 + 712 500 = <strong>143 212 500 FC</strong>.</li></ul><p>Autre exemple : un exportateur de café de Bukavu reçoit 20 000 EUR. Le cours acheteur de la banque est de 3 150 FC par EUR.</p><ul><li>Montant en FC : 20 000 × 3 150 = <strong>63 000 000 FC</strong>.</li></ul><p><a href="https://www.youtube.com/results?search_query=conversion+devises+FC+USD+EUR+taux+change" target="_blank" rel="noopener">🎥 Recherche : la conversion des devises (chaînes de cours de mathématiques financières)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le taux de change est le prix d'une devise dans une autre. FC = devise × taux ; devise = FC / taux. Les banques appliquent un cours acheteur et un cours vendeur, avec une marge. Les conversions croisées permettent de passer d'une devise à l'autre. Les commissions bancaires s'ajoutent aux opérations de change.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Mathématiques Financières, 4e CG (manuels-scolaires-rdc.com, 2025) ; Banque Centrale du Congo — Cours de change.</div>

    title: "Leçon 9 — Les applications commerciales : prix d'achat, prix de revient et marge",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un commerçant de Kinshasa achète un carton de savon à 80 000 FC. Il paie 5 000 FC de transport et 3 000 FC de manutention. Il revend le carton à 110 000 FC. Quel est son bénéfice ? Quelle est sa marge en pourcentage ? Ces calculs sont quotidiens dans le commerce congolais.</p></div>
<h3>1. Prix d'achat et prix de revient</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Prix d'achat (PA)</strong> : prix payé au fournisseur.</li><li><strong>Frais accessoires</strong> : transport, douane, manutention, assurance.</li><li><strong>Prix de revient (PR)</strong> : PA + frais accessoires.</li><li><strong>Exemple</strong> : PA = 80 000 FC + 5 000 (transport) + 3 000 (manutention) = <strong>88 000 FC</strong>.</li></ul></div>
<h3>2. Prix de vente et marge</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Prix de vente (PV)</strong> : prix auquel le commerçant vend au client.</li><li><strong>Marge bénéficiaire (MB)</strong> : PV − PR.</li><li><strong>Taux de marge</strong> : (MB / PR) × 100.</li><li><strong>Taux de marque</strong> : (MB / PV) × 100.</li><li><strong>Exemple</strong> : PV = 110 000 FC ; PR = 88 000 FC ; MB = 22 000 FC ; taux de marge = 25 % ; taux de marque = 20 %.</li></ul></div>
<h3>3. Calcul du prix de vente à partir du taux de marge</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>PV = PR × (1 + taux de marge / 100)</strong>.</li><li><strong>PV = PR / (1 − taux de marque / 100)</strong>.</li><li><strong>Exemple</strong> : PR = 88 000 FC, taux de marge souhaité = 30 % → PV = 88 000 × 1,30 = <strong>114 400 FC</strong>.</li></ul></div>
<h3>4. Application complète avec TVA</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p>Une entreprise achète un lot de marchandises à 500 000 FC HT. Frais de transport : 25 000 FC. Elle veut réaliser une marge de 25 % sur le prix de revient et appliquer la TVA de 16 %.</p><ul><li>Prix de revient = 500 000 + 25 000 = 525 000 FC.</li><li>Prix de vente HT = 525 000 × 1,25 = 656 250 FC.</li><li>TVA = 656 250 × 0,16 = 105 000 FC.</li><li>Prix de vente TTC = 656 250 + 105 000 = <strong>761 250 FC</strong>.</li></ul><p><a href="https://www.youtube.com/results?search_query=prix+revient+marge+bénéfice+commercial+calcul" target="_blank" rel="noopener">🎥 Recherche : prix de revient et marge (chaînes de cours de mathématiques financières)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Prix de revient = prix d'achat + frais accessoires. Marge = prix de vente − prix de revient. Taux de marge = (marge / PR) × 100. Taux de marque = (marge / PV) × 100. Le prix de vente peut se calculer à partir du prix de revient et du taux de marge.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Mathématiques Financières, 4e CG (manuels-scolaires-rdc.com, 2025).</div>

    title: "Leçon 10 — Les mathématiques financières au service de la gestion d'entreprise en RDC",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À Kinshasa, une PME veut acheter une nouvelle machine. Elle hésite entre un emprunt bancaire à 12 % et un crédit-fournisseur à 8 % payable en 6 mois. Le comptable utilise les mathématiques financières pour comparer les coûts et recommander la meilleure option. Sans ces outils, la décision serait un coup de dés.</p></div>
<h3>1. Les décisions d'investissement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Investissement</strong> : acquisition d'un bien durable pour produire des richesses futures.</li><li><strong>Critères</strong> : délai de récupération, valeur actuelle nette (VAN), taux de rentabilité interne (TRI).</li><li><strong>VAN</strong> : somme des flux de trésorerie futurs actualisés − investissement initial.</li><li>Si VAN > 0, le projet est rentable ; si VAN < 0, il ne l'est pas.</li></ul></div>
<h3>2. Le choix des financements</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Autofinancement</strong> : utiliser ses propres ressources, pas de coût financier.</li><li><strong>Emprunt bancaire</strong> : coût = intérêts + commissions.</li><li><strong>Crédit-fournisseur</strong> : délai de paiement accordé par le fournisseur, souvent avec escompte pour paiement comptant.</li><li><strong>Crédit-bail (leasing)</strong> : location avec option d'achat.</li><li><strong>Comparaison</strong> : le taux effectif global (TEG) permet de comparer les financements.</li></ul></div>
<h3>3. Le budget de trésorerie</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Budget de trésorerie</strong> : prévision des encaissements et décaissements sur une période.</li><li><strong>Objectif</strong> : anticiper les tensions de trésorerie et les besoins de financement.</li><li><strong>Outils</strong> : plan de trésorerie mensuel, tableau des échéances.</li><li><strong>En RDC</strong> : les PME utilisent souvent des cahiers manuscrits faute de logiciels, mais la logique reste la même.</li></ul></div>
<h3>4. Exemples d'application en RDC</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Un commerçant de Kinshasa</strong> : doit-il acheter comptant avec 5 % d'escompte ou à 60 jours au prix plein ? L'escompte de 5 % sur 60 jours correspond à un taux annuel de (5/95) × (360/60) ≈ 31,6 %. Mieux vaut payer comptant si on a la trésorerie.</li><li><strong>Une PME de Lubumbashi</strong> : investir 20 000 000 FC dans une machine qui rapportera 5 000 000 FC par an pendant 5 ans. Taux d'actualisation 12 %. VAN = 5 000 000 × [1 − (1,12)<sup>−5</sup>] / 0,12 − 20 000 000 ≈ −1 976 000 FC. VAN négative → projet non rentable à ce taux.</li><li><strong>Un agriculteur du Kwilu</strong> : emprunter 500 000 FC à 10 % pour acheter des semences. Rendement attendu : 800 000 FC. Le projet est rentable.</li></ul><p><a href="https://www.youtube.com/results?search_query=mathématiques+financières+gestion+entreprise+RDC+investissement" target="_blank" rel="noopener">🎥 Recherche : les mathématiques financières en gestion (chaînes de cours de mathématiques financières)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les mathématiques financières aident à décider : investir ou non, emprunter ou pas, payer comptant ou à crédit. La VAN, le TRI et le TEG sont les outils clés. Le budget de trésorerie anticipe les besoins de financement. En RDC, ces outils s'appliquent aux PME comme aux grandes entreprises.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Mathématiques Financières, 4e CG (manuels-scolaires-rdc.com, 2025) ; Banque Centrale du Congo.</div>

        <p style="margin-bottom:18px;color:#12437a;font-size:0.95rem;">Cette évaluation regroupe des items de type EXETAT. Fais l'exercice dans les conditions du concours : sans notes, en une seule fois.</p>

    }

let currentSlide = 0;
let lastSearchTerm = "", searchResults = [], currentResultIdx = -1;
const contentDiv = document.getElementById('content');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const slideCounterSpan = document.getElementById('slideCounter');
const progressFill = document.getElementById('progressFill');
const counterSpan = document.getElementById('counter');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchNav = document.getElementById('searchNav');
const prevResultBtn = document.getElementById('prevResultBtn');
const nextResultBtn = document.getElementById('nextResultBtn');
const resultCounterSpan = document.getElementById('resultCounter');
const pageTitle = document.getElementById('pageTitle');
pageTitle.textContent = "ECOLIA · " + COURSE_TITLE;
document.title = "ECOLIA — " + COURSE_TITLE;
function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';
    slideCounterSpan.textContent = '0/0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>

<script>
(function () {
  var SITE = "https://ecolia-course.github.io/";
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface", page servie par https://app.local
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function abs(u) { return /^(https?:|data:|blob:)/i.test(u) ? u : (NATIVE ? SITE + u.replace(/^(\.\/|\/)+/, "") : u); }
  function ext(u) { var m = String(u).split("?")[0].match(/\.(jpe?g|png|gif|webp|svg)$/i); return m ? m[1].toLowerCase() : "jpg"; }
  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {
    if (queued[fn]) return;
    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
    if (!queue.length) { running = false; return; }
    if (!navigator.onLine) { running = false; return; }
    var q = queue.shift(), t0 = Date.now();
    try { CoursInterface.download(q[0], q[1]); } catch (e) { return setTimeout(next, 500); }
    (function wait() {
      var ok = false;
      try { ok = !!CoursInterface.exists(q[1]); } catch (e) {}
      if (ok) setTimeout(next, 1500);
      else if (Date.now() - t0 > 40000) next();
      else setTimeout(wait, 700);
    })();
  }
  function exists(fn) { try { return !!CoursInterface.exists(fn); } catch (e) { return false; } }

  function show(img) {                                    // affiche UNE image (appelé à chaque slide affichée)
    if (!table || img.getAttribute("data-ecolia-done")) return;
    var id = img.getAttribute("data-image-id");
    var url = table[id];
    if (typeof url !== "string" || !url.length) { console.warn("ECOLIA : image absente du JSON :", id); return; }
    img.setAttribute("data-ecolia-done", "1");
    if (!NATIVE) { img.onerror = function () { hide(img); }; img.setAttribute("src", url); return; }
    var full = abs(url), fn = "img_" + id + "." + ext(url);
    if (exists(fn)) {                                     // déjà sur l'appareil : lecture locale, sans internet
      img.onerror = function () {                         // fichier incomplet : on le supprime et on utilise le site
        try { CoursInterface["delete"](fn); } catch (e) {}
        queued[fn] = 0;
        img.onerror = function () { hide(img); };
        img.setAttribute("src", full);
      };
      img.setAttribute("src", "https://app.local/cours/" + fn);
    } else {
      img.onerror = function () { hide(img); };
      img.setAttribute("src", full);
      enqueue(full, fn);
    }
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches("img[data-image-id]")) show(root);
    root.querySelectorAll("img[data-image-id]").forEach(show);
  }
  function prefetchAll() {                                // APK : prépare TOUTES les images du cours pour le hors-ligne
    var ids = {};
    try { JSON.stringify(slides).replace(/data-image-id=\\?"([^"\\]+)/g, function (m, id) { ids[id] = 1; }); } catch (e) {}
    Object.keys(ids).forEach(function (id) {
      var url = table[id];
      if (typeof url !== "string" || !url.length) return;
      var fn = "img_" + id + "." + ext(url);
      if (!exists(fn)) enqueue(abs(url), fn);
    });
  }
  function start(tbl) {
    table = tbl;
    scan(document.body);
    new MutationObserver(function (muts) {                // les slides sont écrites à la volée : on traite chaque nouvelle image
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
    if (NATIVE) prefetchAll();
  }

  var JSON_URL = NATIVE ? SITE + "images_ecolia.json" : "images_ecolia.json";
  var KEY = "ecolia_images_json";
  fetch(JSON_URL, NATIVE ? { cache: "no-cache" } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (table) { if (NATIVE) lsSet(KEY, JSON.stringify(table)); start(table); })
    .catch(function (e) {
      var saved = null;
      if (NATIVE) { try { saved = JSON.parse(lsGet(KEY) || "null"); } catch (x) {} }
      if (saved) start(saved);                              // hors ligne dans l'APK : JSON gardé la dernière fois
      else console.warn("ECOLIA : JSON des images indisponible.", e);
    });
})();
</script>
