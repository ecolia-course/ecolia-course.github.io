<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ECO - Tronc Commun</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(160deg, #1a3a2a 0%, #0d1f14 100%); color: #e8f5e9; min-height: 100vh; }
        .app-container { max-width: 500px; min-height: 100vh; margin: 0 auto; background: rgba(13, 31, 20, 0.95); }
        .header { padding: 15px 20px; background: rgba(26, 58, 42, 0.98); display: flex; align-items: center; gap: 15px; border-bottom: 2px solid #4caf50; }
        .back-btn { background: rgba(76, 175, 80, 0.2); border: none; color: #a5d6a7; padding: 8px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; }
        .main-content { padding: 15px; }
        .classe-hero { text-align: center; padding: 10px 0 20px; }
        .classe-hero h1 { color: #ffd54f; font-size: 1.6rem; }
        .courses-list { display: flex; flex-direction: column; gap: 10px; }
        .course-card { background: rgba(76, 175, 80, 0.06); border: 1px solid rgba(76, 175, 80, 0.2); border-left: 4px solid #4caf50; border-radius: 10px; padding: 14px 15px; text-decoration: none; color: #e8f5e9; display: flex; align-items: center; gap: 12px; }
        .course-emoji { font-size: 1.8rem; }
        .course-info h3 { color: #c8e6c9; font-size: 0.95rem; }
        .badge-row { display: flex; gap: 6px; margin-top: 4px; }
        .badge { font-size: 0.65rem; padding: 2px 7px; border-radius: 6px; }
        .badge-audio { background: rgba(255, 213, 79, 0.2); color: #ffd54f; }
        .badge-quiz { background: rgba(33, 150, 243, 0.2); color: #64b5f6; }
        .redirect-msg { text-align: center; padding: 50px 20px; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <a href="index.html" class="back-btn">← Retour</a>
        <h3 id="classeTitre">7ᵉ année</h3>
    </div>
    <div id="content">
        <div class="redirect-msg">⏳ Vérification de la connexion...</div>
    </div>
</div>

<script type="module">
    import { auth, onAuthStateChanged } from "./firebase-init.js";

    const params = new URLSearchParams(window.location.search);
    const classe = params.get('classe') || '7e';
    document.getElementById('classeTitre').innerText = classe === '7e' ? '7ᵉ année' : '8ᵉ année';

    const matieres = {
        '7e': [
            { nom: 'Mathématiques', emoji: '📐', matiere: 'math-7e' },
            { nom: 'Français', emoji: '📝', matiere: 'francais-7e' },
            { nom: 'SVT', emoji: '🌿', matiere: 'svt-7e' },
            { nom: 'Physique', emoji: '⚡', matiere: 'physique-7e' },
            { nom: 'Histoire-Géo', emoji: '🌍', matiere: 'histgeo-7e' },
            { nom: 'Anglais', emoji: '🇬🇧', matiere: 'anglais-7e' }
        ],
        '8e': [
            { nom: 'Mathématiques', emoji: '📐', matiere: 'math-8e' },
            { nom: 'Français', emoji: '📝', matiere: 'francais-8e' },
            { nom: 'SVT', emoji: '🌿', matiere: 'svt-8e' },
            { nom: 'Physique', emoji: '⚡', matiere: 'physique-8e' },
            { nom: 'Chimie', emoji: '🧪', matiere: 'chimie-8e' },
            { nom: 'Anglais', emoji: '🇬🇧', matiere: 'anglais-8e' }
        ]
    };

    onAuthStateChanged(auth, (user) => {
        const container = document.getElementById('content');
        if (!user) {
            container.innerHTML = `<div class="redirect-msg">🔐 Veuillez vous <a href="index.html" style="color:#4caf50">connecter</a> pour accéder aux cours.</div>`;
            return;
        }
        const courses = matieres[classe];
        container.innerHTML = `
            <div class="main-content">
                <div class="classe-hero"><h1>${classe === '7e' ? '7ᵉ année' : '8ᵉ année'}</h1></div>
                <div class="courses-list">
                    ${courses.map(m => `
                        <a href="cours.html?matiere=${m.matiere}&classe=${classe}" class="course-card">
                            <div class="course-emoji">${m.emoji}</div>
                            <div class="course-info">
                                <h3>${m.nom}</h3>
                                <div class="badge-row">
                                    <span class="badge badge-audio">🎧 Audio</span>
                                    <span class="badge badge-quiz">📝 Quiz</span>
                                </div>
                            </div>
                        </a>
                    `).join('')}
                </div>
            </div>
        `;
    });
</script>
</body>
</html>
