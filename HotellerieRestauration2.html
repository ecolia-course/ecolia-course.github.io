<p><strong>Zone de danger :</strong> intervalle 4 °C – 60 °C où les bactéries se multiplient le plus vite.</p>

is. Brigade de salle: maître d'hôtel, chef de rang, serveur, commis de salle. Circuit des marchandises: réception, donc stockage, donc préparation, donc service. Marche en avant: séparation des zones propres et sales, du cru et du cuit, pour éviter les contaminations croisées. Définitions. Brigade: équipe organisée. Maître d'hôtel: responsable de la salle. Marche en avant: circulation sans retour en arrière. Méthodes et règles. Identifier les rôles sur un organigramme. Tracer le circuit d'une denrée. Vérifier la séparation des zones. Exemple. Dans un hôtel d'affaires à Kinshasa, la brigade de cuisine reçoit les marchandises à l'entrée de service, les stocke en chambre froide, puis les prépare dans la zone froide avant cuisson. Exercices. Ex. 1: Quels sont les rôles de la brigade de salle? Ex. 2: Pourquoi la marche en avant est-elle essentielle? Corrigé. 1) Maître d'hôtel, chef de rang, serveur, commis de salle. 2) Elle évite les contaminations croisées. À retenir. L'organisation et la séparation des zones sont la base de la sécurité alimentaire."]],"3":[["fr","Leçon 2, Hygiène et sécurité alimentaire: HACCP et chaîne du froid. Situation. « Pourquoi un plat laissé à température ambiante peut-il rendre malade? ». Objectifs. Comprendre les principes HACCP. Connaître la chaîne du froid. Identifier la zone de danger. Appliquer les règles d'hygiène. Prérequis: leçon 1. Théorie. HACCP: méthode d'analyse des dangers et de maîtrise des points critiques. Chaîne du froid: maintien des aliments à basse température, sans rupture. Zone de danger: intervalle 4 degrés Celsius moins 60 degrés Celsius où les bactéries se multiplient le plus vite. Règles: hygiène des mains, séparation cru ou cuit, cuisson suffisante, nettoyage des surfaces, gestion des déchets. Définitions. HACCP: système de sécurité alimentaire. Chaîne du froid: continuité du froid. Toxi-infection: maladie due à un aliment contaminé. Méthodes et règles. Contrôler les températures. Séparer cru et cuit. Se laver les mains. Nettoyer après chaque préparation. Exemple. Un restaurant de Lubumbashi qui laisse des aliments à température ambiante pendant le service risque une multiplication bactérienne rapide; le maintien au froid ou au chaud est obligatoire. Exercices. Ex. 1: Quelle est la zone de danger pour les bactéries? Ex. 2: Citer deux principes HACCP. Corrigé. 1) 4 degrés Celsius à 60 degrés Celsius. 2) Séparation cru ou cuit et cuisson suffisante (autres réponses possibles). À retenir. La sécurité alimentaire se joue sur des détails: température, propreté et séparation."]],"4":[["fr","Leçon 3, Les techniques de service en salle. Situation. « Pourquoi le côté par lequel on sert le client a-t-il une importance? ». Objectifs. Connaître la mise en place. Distinguer les styles de service. Prendre une commande. Respecter les préséances. Prérequis: leçons 1 et 2. Théorie. Mise en place: nappage, couverts, verres, disposition du couvert. Styles de service: à la française (présenté en salle), à l'anglaise (servi à l'assiette depuis un plat), à l'assiette (dressé en cuisine). Prise de commande: claire, ordonnée, suggestive. Préséance: servir par la gauche, débarrasser par la droite. Définitions. Mise en place: préparation de la table. Style de service: manière de servir. Préséance: règle de côté de service. Méthodes et règles. Vérifier la mise en place. Servir par la gauche. Débarrasser par la droite. Prendre la commande avec attention. Exemple. Dans un restaurant de Kinshasa, le serveur dépose l'assiette par la gauche du client et débarrasse par la droite, en annonçant le plat. Exercices. Ex. 1: De quel côté dépose-t-on l'assiette au client? Ex. 2: Citer deux éléments de la mise en place. Corrigé. 1) Par la gauche. 2) Nappage et couverts (autres réponses possibles). À retenir. Le service est une chorégraphie: chaque geste a sa place."]],"5":[["fr","Leçon 4, Les produits, mets et boissons. Situation. « Pourquoi un serveur qui ne connaît pas les cuissons ne peut-il pas conseiller le client? ». Objectifs. Classer les aliments. Connaître les modes de cuisson. Identifier les sauces mères. Proposer des accords mets-boissons. Prérequis: leçons 1 à 3. Théorie. Classification: protéines, glucides, lipides, vitamines et minéraux. Modes de cuisson: braiser, poêler, rôtir, pocher. Sauces mères: béchamel, velouté, espagnole. Boissons: eaux, vins, bières, boissons sans alcool; accords mets-vins (simples). Définitions. Sauce mère: sauce de base servant à en préparer d'autres. Braiser: cuisson à couvert avec liquide. Rôtir: cuisson à chaleur sèche. Méthodes et règles. Associer mets et cuisson. Connaître les sauces mères. Proposer un accord simple. Exemple. Un serveur qui sait que le poisson de fleuve s'accorde avec un vin blanc sec peut conseiller le client de manière pertinente. Exercices. Ex. 1: Quelles sont les sauces mères de base? Ex. 2: Proposer un accord mets-boisson pour un poulet rôti. Corrigé. 1) Béchamel, velouté, espagnole. 2) Poulet rôti et vin blanc sec (autres réponses possibles). À retenir. Connaître les produits, c'est pouvoir conseiller avec crédibilité."]],"6":[["fr","Leçon 5, Posture professionnelle et situations difficiles. Situation. « Pourquoi le professionnalisme d'un serveur se mesure-t-il pendant le coup de feu? ». Objectifs. Adopter une posture professionnelle. Gérer les réclamations. Coordonner avec l'équipe. Gérer le stress. Prérequis: leçons 1 à 4. Théorie. Posture: tenue soignée, hygiène, communication respectueuse. Réclamations: écoute, excuse, solution, alerte si nécessaire. Coup de feu: forte affluence; coordination et priorisation. Communication d'équipe: annonces claires, information de la cuisine en cas de retard. Définitions. Coup de feu: pic d'activité. Réclamation: plainte du client. Coordination: travail synchronisé. Méthodes et règles. Rester calme. Écouter. Informer. Coordonner. Exemple. Pendant un coup de feu dans un restaurant de Goma, le chef de rang coordonne les serveurs, gère l'attente des clients et alerte la cuisine en cas de retard. Exercices. Ex. 1: Quels sont les éléments de la posture professionnelle? Ex. 2: Proposer une réaction face à un client qui attend depuis 20 minutes. Corrigé. 1) Tenue, hygiène, communication (autres réponses possibles). 2) S'excuser, informer, proposer une solution. À retenir. Le professionnalisme se mesure dans les moments difficiles."]],"7":[["fr","Évaluation finale, Hôtellerie-Restauration. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 12 sur 20, tu as réussi."]]}};
  var CACHE = "ecolia-cours-v1";                       // même cache que l'application

    function cur() {

    // ====================================================================
    //  Stockage hors ligne : 2 moteurs, même interface

    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {                                   // fichier complet ? (taille exacte connue à la génération)
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () {

        },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) {

          writeOk(readOk().filter(function (x) { return x !== n; }));
          return Promise.resolve();
        }

    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {

            .then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; });
        },
        put: function (n) {

    function askDownload(fromInvite) {

    function startDownload() {

    // ====================================================================

    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;

    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours

    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
