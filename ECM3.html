const slides = [
{
    title: "Sommaire — Éducation Civique et Morale 3e année",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Le cours d'Éducation Civique et Morale (ECM) forme le futur citoyen à vivre dans la société congolaise. Il porte sur trois dimensions : le <strong>civisme</strong> (connaissance des institutions et des symboles de l'État), la <strong>morale</strong> (vertus et anti-valeurs) et le <strong>patriotisme</strong> (engagement envers la nation).</p>
<p><strong>Note de transparence :</strong> le programme national d'ECM (DIPROMAD) est structuré par deux compétences de base (CB1 : exprimer son civisme par des actes concrets ; CB2 : faire preuve de vertus, de valeurs morales, sociales et patriotiques). Les leçons ci-dessous sont une progression alignée sur ces compétences.</p>
<ul>
<li>Leçon 1 — Citoyenneté et nation</li>
<li>Leçon 2 — Droits et devoirs du citoyen</li>
<li>Leçon 3 — Devoirs envers les parents, les autorités et les personnes vulnérables</li>
<li>Leçon 4 — La Constitution et la loi fondamentale</li>
<li>Leçon 5 — Les emblèmes de la RDC</li>
<li>Leçon 6 — Le patriotisme et le profil du patriote</li>
<li>Leçon 7 — Les vertus sociales et morales</li>
<li>Leçon 8 — Les anti-valeurs à bannir</li>
<li>Leçon 9 — La culture de la paix</li>
<li>Leçon 10 — Le civisme fiscal et le bien commun</li>
<li>Leçon 11 — La protection de l'environnement comme devoir civique</li>
<li>Leçon 12 — Synthèse et évaluation</li>
</ul>
<p>Une évaluation finale de 15 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme national d'Éducation Civique et Morale (DIPROMAD / MEPSP, mis en ligne sur edu-nc.gouv.cd) ; Constitution de la RDC ; manuel ECM 3e année (RDC).</div>
    `
},
{
    title: "Leçon 1 — Citoyenneté et nation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qu'est-ce qu'être citoyen congolais ? Quels sont les symboles de la nation ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir citoyen, nationalité, nation, État. Reconnaître les symboles de la nation. Identifier les responsabilités du citoyen.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définitions</div>
<ul>
<li><strong>Le citoyen :</strong> membre d'un État, titulaire de droits et de devoirs définis par la loi.</li>
<li><strong>La nationalité :</strong> lien juridique entre un individu et un État.</li>
<li><strong>La nation :</strong> communauté d'hommes et de femmes partageant un territoire, une histoire et une volonté de vivre ensemble.</li>
<li><strong>L'État :</strong> organisation politique d'un territoire, dotée d'institutions, d'un gouvernement et de lois.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les symboles de la nation</div>
<ul>
<li>Le <strong>drapeau</strong>.</li>
<li>Les <strong>armoiries</strong>.</li>
<li>L'<strong>hymne national</strong> (le « Debout Congolais »).</li>
<li>La <strong>devise</strong> nationale.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Droits et responsabilités</div>
<p>Le citoyen a des droits (liberté d'expression, d'association, d'éducation, de santé, de circulation…) et des responsabilités (respecter la loi, payer l'impôt, protéger les biens publics, participer à la vie de la cité, défendre la patrie). Droits et responsabilités sont indissociables.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Distingue, dans la liste suivante, actes de civisme et d'incivisme : respecter la file, jeter les déchets dans la rue, aider une personne âgée, salir un mur public.</p>
<p><strong>Ex. 2 :</strong> Cite trois symboles de la nation congolaise.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Civisme : respecter la file, aider une personne âgée. Incivisme : jeter les déchets dans la rue, salir un mur public.</p>
<p><strong>2)</strong> Drapeau, armoiries, hymne national.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le citoyen est membre d'un État avec des droits et des devoirs ; les symboles de la nation incarnent son unité.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national d'ECM ; Constitution de la RDC.</div>
    `
},
{
    title: "Leçon 2 — Droits et devoirs du citoyen",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi les droits sont-ils accompagnés de devoirs ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les droits fondamentaux. Reconnaître les devoirs correspondants. Comprendre la réciprocité droits / devoirs.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les droits fondamentaux</div>
<p>La Constitution de la RDC et la Déclaration universelle des droits de l'homme reconnaissent notamment : le droit à la vie, à la dignité, à la liberté d'expression, à l'éducation, à la santé, à un procès équitable, à la liberté de culte, à l'égalité devant la loi, à la protection de la famille.</p>
<img data-image-id="EC3_IMG02" alt="Extrait de la Constitution (articles sur les droits et devoirs)" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les devoirs correspondants</div>
<p>À chaque droit correspond un devoir. Le droit à l'éducation implique le devoir d'étudier ; le droit à la liberté d'expression implique le devoir de respecter autrui ; le droit à la protection de l'État implique le devoir de respecter les lois et de payer l'impôt.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le principe de réciprocité</div>
<p>La vie en société repose sur un équilibre : si je réclame mes droits, je dois respecter ceux des autres et assumer mes devoirs. Un droit exercé sans responsabilité devient un abus.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Associe chaque droit à un devoir correspondant : droit à l'éducation, droit à la santé, droit à la propriété.</p>
<p><strong>Ex. 2 :</strong> Étudie un conflit de voisinage et propose une résolution respectueuse des droits de chacun.</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>1)</strong> Éducation → étudier sérieusement ; santé → prendre soin de soi et respecter les consignes sanitaires ; propriété → respecter la propriété d'autrui.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les droits sont indissociables des devoirs : la société fonctionne sur la réciprocité.</p></div>
<div class="sources"><strong>Sources :</strong> Constitution de la RDC ; Déclaration universelle des droits de l'homme ; programme national d'ECM.</div>
    `
},
{
    title: "Leçon 3 — Devoirs envers les parents, les autorités et les personnes vulnérables",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment se comporter avec ses parents, avec l'autorité, avec les personnes handicapées ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les devoirs envers les parents et les personnes âgées. Reconnaître l'autorité légitime. Respecter les personnes vivant avec handicap.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Respect des parents et des personnes âgées</div>
<p>Le respect des parents et des personnes âgées est un devoir moral et civique. Il se manifeste par l'obéissance raisonnable, l'écoute, l'aide, les soins, la considération. Ce respect n'exclut pas le dialogue, mais il suppose la reconnaissance de l'expérience et de l'autorité éducative.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Respect de l'autorité</div>
<p>L'autorité légitime (enseignants, chefs, agents publics, forces de l'ordre) exerce une mission au service du bien commun. La respecter, c'est reconnaître sa fonction, pas nécessairement être d'accord avec la personne qui l'exerce. Le respect de l'autorité va de pair avec le droit de contester pacifiquement et légalement une décision injuste.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Respect des personnes vivant avec handicap</div>
<p>La Constitution de la RDC (article 52) prévoit la protection et la promotion des droits des personnes vivant avec handicap. Ce respect se traduit par : l'accessibilité des lieux, la non-discrimination, la solidarité, l'inclusion scolaire et professionnelle.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Rédige avec ta classe une courte charte de respect (5 à 6 engagements) applicable à la classe.</p>
<p><strong>Ex. 2 :</strong> Cite trois gestes concrets de respect envers une personne handicapée dans ton école.</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>2)</strong> Céder le passage, aider à porter des charges, ne pas se moquer, adapter les activités sportives.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le respect des parents, de l'autorité et des personnes vulnérables est un devoir civique et moral.</p></div>
<div class="sources"><strong>Sources :</strong> Constitution de la RDC (art. 52) ; programme national d'ECM.</div>
    `
},
{
    title: "Leçon 4 — La Constitution et la loi fondamentale",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi dit-on que la Constitution est la 'loi suprême' du pays ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la Constitution et son importance. Comprendre sa structure générale. Identifier quelques articles relatifs aux droits de l'enfant.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Définition et importance</div>
<p>La <strong>Constitution</strong> est le texte fondamental qui organise l'État : elle définit les institutions, répartit les pouvoirs, énonce les droits fondamentaux et fixe les règles de la vie commune. Toutes les autres lois doivent être conformes à la Constitution : c'est la <strong>loi suprême</strong>.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Structure générale (initiation)</div>
<p>La Constitution congolaise comprend : un préambule, des dispositions générales, les droits et devoirs, l'organisation des pouvoirs (exécutif, législatif, judiciaire), les institutions d'appui à la démocratie, les provinces, la révision constitutionnelle et les dispositions finales.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Droits de l'enfant</div>
<p>La Constitution garantit notamment la protection de l'enfant, le droit à l'éducation, à la santé, à la protection contre les mauvais traitements, au nom et à la nationalité. Ces droits doivent être connus pour être respectés.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Recherche un article de la Constitution relatif à l'éducation et explique-le en une phrase.</p>
<p><strong>Ex. 2 :</strong> Explique pourquoi une loi qui contredirait la Constitution ne peut pas être appliquée.</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>2)</strong> La Constitution est au sommet de la hiérarchie des normes ; toute loi contraire est nulle (contrôle de constitutionnalité).</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La Constitution est la norme suprême ; elle organise l'État et protège les droits fondamentaux.</p></div>
<div class="sources"><strong>Sources :</strong> Constitution de la RDC ; programme national d'ECM.</div>
    `
},
{
    title: "Leçon 5 — Les emblèmes de la RDC",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Que signifient les couleurs du drapeau, les armoiries, les paroles de l'hymne ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les emblèmes de la RDC. Expliquer leur signification. Chanter correctement l'hymne national et comprendre son sens.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Le drapeau</div>
<p>Le drapeau de la RDC est composé de bandes et symboles aux couleurs emblématiques de la nation : le bleu ciel (paix), le jaune (or, richesse du pays), le rouge (sang des martyrs). L'étoile symbolise l'unité et l'avenir.</p>
<img data-image-id="EC3_IMG01" alt="Drapeau et armoiries de la RDC" style="max-width:100%;border-radius:8px;margin:12px 0;">
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les armoiries</div>
<p>Les armoiries comportent plusieurs éléments symboliques : une tête de léopard (force, courage), des flèches (protection), une lance, une pelle (travail, agriculture), une étoile, une devise. Elles représentent l'identité et les valeurs de la nation.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — L'hymne national</div>
<p>L'hymne national de la RDC est le « Debout Congolais ». Il évoque la dignité, la liberté, l'unité, le travail et la fidélité à la patrie. Le chanter correctement, debout, dans le respect, fait partie des devoirs civiques.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Décris le drapeau de la RDC et explique la signification d'au moins deux de ses couleurs.</p>
<p><strong>Ex. 2 :</strong> Chante l'hymne national et explique en une phrase son message principal.</p>
<details><summary>Corrigé indicatif</summary>
<p><strong>1)</strong> Bleu ciel = paix ; jaune = richesse ; rouge = sang des martyrs. L'étoile symbolise l'unité.</p>
</details>

    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}

    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }

function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;

renderSlide(0, false);

      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
