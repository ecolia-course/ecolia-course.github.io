ses; essais sur éprouvettes en acier. Limites documentaires. Les fiches de RDM (3e-4e années) et de Métrologie (4e année) ont été consultées. Aucune fiche de 1re année spécifique à la Métrologie et RDM n'a été identifiée. L'adaptation au niveau 12-14 ans est une simplification volontaire. Plan d'images du cours. Identifiant. Leçon. Contenu visuel. Utilité. Emplacement. Metrologie1_L1_01. L1. Tableau de conversion des unités. Métrologie. Slide 1, bloc théorie. Metrologie1_L2_01. L2. Lecture d'un pied à coulisse. Instruments. Slide 2, bloc exercice. Metrologie1_L3_01. L3. Exemple de cote tolérancée. Tolérances. Slide 3, bloc théorie. Metrologie1_L4_01. L4. Schéma traction ou compression. RDM. Slide 4, bloc résumé. Metrologie1_L5_01. L5. Courbe de traction simplifiée. Essai de traction. Slide 5, bloc exercice. Identifiants stables et cohérents avec le HTML."]],"2":[["fr","Leçon 1, La métrologie: mesurer avec précision. Situation de départ. Un mécanicien doit remplacer une pièce, mais il ne connaît pas ses dimensions exactes. Comment faire pour mesurer avec précision? Objectifs spécifiques. Définir la métrologie. Distinguer mesure directe et indirecte. Convertir les unités. Comprendre l'importance de la précision. Explication. La métrologie est la science de la mesure. Elle garantit que les pièces fabriquées sont interchangeables. On mesure directement avec un instrument (pied à coulisse) ou indirectement par calcul. Les unités de longueur sont le mètre et ses sous-multiples (mm, cm). La précision dépend de l'instrument et de la méthode. [ Image Metrologie1_L1_01: tableau de conversion des unités ]. La métrologie est la base du contrôle qualité. Notions et définitions. Métrologie: science de la mesure. Mesurage: action de mesurer. Mesure directe: avec un instrument. Mesure indirecte: par calcul. Précision: finesse de la mesure. Incertitude: marge d'erreur. Étalonnage: vérification de l'instrument. Exemples concrets. Mesure d'un arbre de transmission. Contrôle d'une pièce de rechange. Mesure d'un diamètre de tuyau. Exercice d'application. Mesure la longueur et le diamètre d'une pièce avec une règle et un pied à coulisse. Compare les résultats. Convertis 25 millimètres en cm et en m. Corrigé. 1. On vérifie la mesure avec les deux instruments. 2. Le pied à coulisse donne une valeur plus précise. 3. 25 millimètres égale 2,5 centimètres égale 0,025 mètres. À retenir. La métrologie garantit la qualité. Mesure directe et indirecte sont complémentaires. La précision est essentielle en industrie. Sources utiles. Fiches de Technologies de Fabrication et Métrologie, 4e année. Cours de métrologie de l'ISTA (R D C). Limite: l'adaptation en 1re est une simplification."]],"3":[["fr","Leçon 2, Les instruments de mesure dimensionnelle. Situation de départ. Deux instruments sont posés sur l'établi: un pied à coulisse et un micromètre. Lequel utiliser pour mesurer un diamètre extérieur avec une grande précision? Objectifs spécifiques. Identifier les principaux instruments. Lire une mesure sur un pied à coulisse. Comprendre le rôle de chaque instrument. Explication. Les instruments de mesure dimensionnelle: pied à coulisse: mesure extérieures, intérieures et profondeurs; précision 0,05 ou 0,02 millimètres; micromètre: mesure des épaisseurs et diamètres; précision 0,01 millimètres; comparateur: contrôle les écarts par rapport à une référence; cales étalons: références de longueur. [ Image Metrologie1_L2_01: lecture d'un pied à coulisse ]. Chaque instrument a un usage spécifique. Notions et définitions. Pied à coulisse: instrument à mâchoires et vernier. Micromètre: instrument à vis calibrée. Comparateur: appareil à aiguille. Cales étalons: blocs de référence. Vernier: réglette mobile graduée. Lecture: interprétation d'une mesure. Exemples concrets. Contrôle d'une cote sur une pièce usinée. Mesure d'un vilebrequin. Vérification d'un alésage. Exercice d'application. Lis une mesure sur un pied à coulisse (exercice sur schéma ou instrument réel). Identifie l'instrument adapté à trois situations. Indique la précision d'un pied à coulisse au 1 sur 50. Corrigé. 1. On vérifie la lecture. 2. Exemples: alésage égale pied à coulisse; épaisseur égale micromètre; écart égale comparateur. 3. 0,02 millimètres. À retenir. La maîtrise des instruments est essentielle. Chaque instrument a un usage et une précision. La lecture doit être précise. Sources utiles. Fiches de Métrologie, 4e année. Cours de l'ISTA. Limite: l'adaptation en 1re est une simplification."]],"4":[["fr","Leçon 3, Tolérances et ajustements: l'interchangeabilité. Situation de départ. Un arbre doit s'insérer dans un alésage. Si l'arbre est trop gros, il ne rentre pas; trop petit, il flotte. Comment définir les dimensions acceptables? Objectifs spécifiques. Comprendre la notion de tolérance. Lire une cote tolérancée. Distinguer ajustement avec jeu et ajustement serré. Explication. Une cote tolérancée définit une plage de dimensions acceptables (par exemple, 20 ± 0,1 millimètres). La tolérance est la différence entre les écarts supérieur et inférieur. Un ajustement avec jeu permet le mouvement; un ajustement serré assure la fixation. Le respect des tolérances garantit l'interchangeabilité. [ Image Metrologie1_L3_01: exemple de cote tolérancée ]. Les tolérances sont le langage de la précision industrielle. Notions et définitions. Tolérance: plage de dimensions acceptables. Cote nominale: dimension de référence. Écart supérieur ou inférieur: limites de la plage. Ajustement: assemblage de deux pièces. Jeu: espace entre deux pièces. Serrage: contact forcé. Interchangeabilité: remplacement sans ajustement. Exemples concrets. Pièces de rechange importées et fabriquées localement. Assemblage d'un roulement sur un arbre. Contrôle d'une pièce de pompe. Exercice d'application. Lis une cote tolérancée et calcule la tolérance. Détermine si une pièce mesurée est conforme. Indique une différence entre ajustement avec jeu et serré. Corrigé. 1. Tolérance égale écart supérieur moins écart inférieur. 2. La mesure doit être dans la plage. 3. Avec jeu: mouvement possible; serré: fixation. À retenir. Les tolérances garantissent la précision. Les ajustements définissent le type de contact. L'interchangeabilité repose sur le respect des tolérances. Sources utiles. Fiches de Métrologie, 4e année (normes ISO). Fiches de RDM. Limite: l'adaptation en 1re est une simplification."]],"5":[["fr","Leçon 4, La RDM: contraintes et déformations. Situation de départ. Un câble soulève une charge. Pourquoi choisit-on un câble plus gros pour une charge plus lourde? Comment savoir s'il résistera? Objectifs spécifiques. Définir la RDM. Distinguer traction et compression. Calculer une contrainte simple. Comprendre la loi de Hooke. Explication. La RDM étudie la résistance et la déformation des solides. En traction, la pièce est étirée; en compression, elle est écrasée. La contrainte est l'effort par unité de surface: σ égale F ou S. La loi de Hooke relie contrainte et déformation dans le domaine élastique: σ égale E multiplié par ε. [ Image Metrologie1_L4_01: schéma traction ou compression ]. La RDM permet de dimensionner les pièces. Notions et définitions. RDM: Résistance des Matériaux. Contrainte (σ): en MPa. Effort normal (N): en newtons. Section (S): en mm au carré. Déformation (ε): ΔL ou L0. Loi de Hooke: σ égale E multiplié par ε. Module d'Young (E): rigidité du matériau. Limite d'élasticité: contrainte au-delà de laquelle la déformation devient permanente. Exemples concrets. Câble de levage. Pilier de bâtiment en compression. Essieu de camion en flexion (notion qualitative). Exercice d'application. Calcule la contrainte dans un câble de section 10 millimètres carrés soumis à un effort de 500 N. Identifie si la pièce est en traction ou en compression. Indique l'unité de la contrainte. Corrigé. 1. σ égale 500 sur 10 égale 50 N ou mm au carré égale 50 MPa. 2. Selon l'effort (traction ou compression). 3. Le MPa (ou N ou mm au carré ). À retenir. La RDM dimensionne les pièces. La contrainte dépend de l'effort et de la section. La loi de Hooke s'applique dans le domaine élastique. Sources utiles. Fiches de RDM, 3e-4e années. Manuel de RDM pour les humanités techniques (R D C). Limite: l'adaptation en 1re est une simplification."]],"6":[["fr","Leçon 5, L'essai de traction et la sécurité des structures. Situation de départ. Une éprouvette d'acier est tirée jusqu'à la rupture. La courbe obtenue montre plusieurs zones. Que signifient-elles pour le dimensionnement des pièces? Objectifs spécifiques. Décrire un essai de traction simple. Interpréter la courbe contrainte-déformation. Comprendre le coefficient de sécurité. Explication. L'essai de traction consiste à étirer une éprouvette jusqu'à la rupture. La courbe montre: une zone élastique (déformation réversible); une limite d'élasticité; une zone plastique (déformation permanente); la rupture. Le coefficient de sécurité est le rapport entre la résistance du matériau et la contrainte appliquée. [ Image Metrologie1_L5_01: courbe de traction simplifiée ]. L'essai de traction révèle le comportement du matériau. Notions et définitions. Essai de traction: essai mécanique. Éprouvette: échantillon de matériau. Courbe σ-ε: contrainte-déformation. Limite d'élasticité: frontière entre élastique et plastique. Résistance à la rupture: contrainte maximale. Coefficient de sécurité: marge de sécurité. Fatigue: usure due aux efforts répétés. Exemples concrets. Rupture de châssis sur les pistes du Kasaï. Calcul des ressorts à lames pour véhicules lourds. Surcharge des camions et coefficient de sécurité. Exercice d'application. Lis une courbe de traction simplifiée et identifie les zones. Explique pourquoi le coefficient de sécurité est important pour les camions surchargés. Indique un risque lié à la fatigue. Corrigé. 1. Identifier zone élastique, limite, zone plastique, rupture. 2. Le coefficient tient compte des incertitudes et des surcharges. 3. Rupture soudaine après usure. À retenir. L'essai de traction et le coefficient de sécurité sont essentiels. La rupture peut être évitée par un bon dimensionnement. La fatigue est un risque à long terme. Sources utiles. Fiches de RDM (essai de traction, coefficient de sécurité). Manuel de RDM. Limite: l'adaptation en 1re est une simplification."]],"7":[["fr","Évaluation finale, Métrologie et RDM. Évaluation finale. 36 questions à choix multiple. Une seule réponse est correcte par question. Choisis la réponse qui te semble juste, puis valide."]]}};

        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);

    // ====================================================================
    //  Bannière : invitation, confirmations, progression
    // ====================================================================
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer);
      bnMode = mode;
      txtEl.textContent = text;
      actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; }
      else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }

    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }

    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial"
        ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet."
        : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
</html>
