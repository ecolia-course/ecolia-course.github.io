  {
    title: "Sommaire — Grec ancien (4e Humanité, option Latin-Grec)",

      <div class="bloc resume">
        <div class="bloc-label">Présentation du cours</div>
        <h3>Lire, comprendre et traduire les textes grecs anciens</h3>
        <p>Le grec ancien est la langue de culture de l'option Latin-Grec. En 4<sup>e</sup> Humanité, il ne s'agit plus seulement d'apprendre des formes : il s'agit de lire des textes, de les comprendre, de les traduire et de les situer dans leur contexte historique et littéraire. Ce cours consolide la morphologie, approfondit la syntaxe, initie à la méthode de traduction et ouvre sur la civilisation grecque et l'héritage culturel qui nous est parvenu.</p>
      </div>

        <div class="bloc-label">Objectifs d'apprentissage</div>
        <h3>À la fin de ce cours, vous serez capable de :</h3>

          <li>Maîtriser l'alphabet, les esprits et les accents.</li>

          <li>Identifier les fonctions des cas et l'emploi des prépositions.</li>
          <li>Reconnaître et traduire les principales propositions subordonnées.</li>
          <li>Traduire un texte grec adapté avec méthode et rigueur.</li>
          <li>Situer les textes dans leur contexte historique, littéraire et culturel.</li>
          <li>Relier le grec ancien au français par l'étymologie et la comparaison.</li>
        </ul>
      </div>

      <div class="bloc theorie">
        <div class="bloc-label">Plan du cours</div>
        <h3>Six chapitres progressifs</h3>
        <ol>
          <li>Révision et consolidation morphologique</li>
          <li>Syntaxe de la phrase simple</li>
          <li>Syntaxe de la phrase complexe</li>
          <li>Traduction et commentaire de textes</li>
          <li>Littérature et civilisation grecques</li>

      <div class="bloc theorie">
        <div class="bloc-label">Statut et enjeux</div>
        <p>Le grec ancien est une matière phare de l'option Latin-Grec. Il est évalué à l'Examen d'État (coefficient 5). Au-delà de l'épreuve, il forme à la rigueur grammaticale, à l'analyse fine des textes et à la compréhension de l'héritage culturel grec dont la RDC a hérité par l'intermédiaire du français.</p>
      </div>
    `
  },
  {
    title: "Chapitre 1 — Pourquoi étudier le grec ancien en 4e Humanité ?",
    content: `
      <div class="bloc cas">
        <div class="bloc-label">Situation-problème</div>
        <h3>« Le grec, à quoi ça sert ? »</h3>
        <p>Un élève demande : « Pourquoi apprendre une langue que plus personne ne parle ? » La question est légitime. Mais savez-vous que les mots <em>démocratie</em>, <em>philosophie</em>, <em>biologie</em>, <em>économie</em>, <em>politique</em>, <em>théâtre</em>, <em>musique</em>, <em>école</em> viennent tous du grec ancien ? Que les débats sur la citoyenneté et la justice ont été pensés pour la première fois en grec ? Étudier le grec, c'est comprendre d'où viennent nos mots et nos idées.</p>
      </div>

      <div class="bloc theorie">
        <div class="bloc-label">Fondements théoriques</div>
        <h3>Quatre raisons d'étudier le grec ancien</h3>
        <ul>
          <li><strong>Comprendre le français</strong> : une grande partie du vocabulaire savant français vient du grec. Connaître le grec, c'est enrichir son français et mieux comprendre les mots scientifiques, médicaux, politiques et philosophiques.</li>
          <li><strong>Former l'esprit</strong> : la grammaire grecque, précise et structurée, forme à la rigueur et à la logique.</li>
          <li><strong>Accéder à la culture classique</strong> : les textes d'Homère, de Platon, de Démosthène, de Xénophon sont au fondement de la pensée occidentale.</li>
          <li><strong>Éclairer le présent</strong> : la démocratie athénienne, la citoyenneté, l'éloquence politique, la justice sont encore des sujets d'actualité en RDC et dans le monde.</li>
        </ul>
      </div>

      <div class="bloc resume">
        <div class="bloc-label">À retenir</div>
        <p>Le grec ancien n'est pas une langue morte : c'est une langue-source. Sa connaissance éclaire le français, forme l'esprit et relie le monde moderne à l'une de ses racines les plus profondes.</p>
      </div>
    `

  {
    title: "Chapitre 1 — L'alphabet grec",
    content: `
      <div class="bloc theorie">
        <div class="bloc-label">Fondements théoriques</div>
        <h3>24 lettres à maîtriser</h3>
        <p>L'alphabet grec compte <strong>24 lettres</strong>. Chacune existe en majuscule et en minuscule, et possède un nom. Il faut le connaître parfaitement, car il est la base de toute lecture.</p>

        <table>
          <thead>
            <tr>
              <th>Lettre</th>
              <th>Majuscule</th>
              <th>Minuscule</th>
              <th>Nom</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>1</td><td>Α</td><td>α</td><td>alpha</td></tr>
            <tr><td>2</td><td>Β</td><td>β</td><td>bêta</td></tr>
            <tr><td>3</td><td>Γ</td><td>γ</td><td>gamma</td></tr>
            <tr><td>4</td><td>Δ</td><td>δ</td><td>delta</td></tr>
            <tr><td>5</td><td>Ε</td><td>ε</td><td>epsilon</td></tr>
            <tr><td>6</td><td>Ζ</td><td>ζ</td><td>zêta</td></tr>
            <tr><td>7</td><td>Η</td><td>η</td><td>êta</td></tr>
            <tr><td>8</td><td>Θ</td><td>θ</td><td>thêta</td></tr>
            <tr><td>9</td><td>Ι</td><td>ι</td><td>iota</td></tr>
            <tr><td>10</td><td>Κ</td><td>κ</td><td>kappa</td></tr>
            <tr><td>11</td><td>Λ</td><td>λ</td><td>lambda</td></tr>
            <tr><td>12</td><td>Μ</td><td>μ</td><td>mu</td></tr>
          </tbody>
        </table>

        <p>Les douze dernières lettres sont : <em>nu</em> (Ν ν), <em>xi</em> (Ξ ξ), <em>omicron</em> (Ο ο), <em>pi</em> (Π π), <em>rhô</em> (Ρ ρ), <em>sigma</em> (Σ σ/ς), <em>tau</em> (Τ τ), <em>upsilon</em> (Υ υ), <em>phi</em> (Φ φ), <em>khi</em> (Χ χ), <em>psi</em> (Ψ ψ), <em>oméga</em> (Ω ω).</p>
      </div>

      <div class="bloc theorie">
        <div class="bloc-label">Voyelles et diphtongues</div>
        <h3>Un système à deux longueurs</h3>
        <p>Les voyelles grecques peuvent être <strong>brèves</strong> ou <strong>longues</strong> :</p>
        <ul>
          <li><strong>ε, ο</strong> : toujours brèves.</li>
          <li><strong>η, ω</strong> : toujours longues.</li>
          <li><strong>α, ι, υ</strong> : brèves ou longues selon les mots.</li>
        </ul>
        <p>Les <strong>diphtongues</strong> sont des combinaisons de deux voyelles prononcées en une seule émission de voix : <em>αι, ει, οι, υι, αυ, ευ, ου, ηυ, ωυ</em>.</p>
      </div>

      <figure>

        <figcaption>L'alphabet grec : les 24 lettres à connaître.</figcaption>
      </figure>
    `

  {
    title: "Chapitre 1 — Esprits et accents",
    content: `
      <div class="bloc theorie">
        <div class="bloc-label">Fondements théoriques</div>
        <h3>Deux signes à ne jamais oublier</h3>
        <p>Le grec ancien utilise deux types de signes diacritiques : les <strong>esprits</strong> et les <strong>accents</strong>. Leur oubli est l'erreur la plus fréquente des débutants, et elle peut changer la prononciation, voire le sens du mot.</p>

        <h4>Les esprits</h4>
        <p>Les esprits se placent sur la <strong>voyelle initiale</strong> d'un mot (ou sur le ρ initial) :</p>
        <ul>
          <li><strong>Esprit doux</strong> (ʼ) : aucun souffle. Exemple : <em>ἄνθρωπος</em> (l'homme).</li>
          <li><strong>Esprit rude</strong> (ʼ) : souffle aspiré (comme un « h »). Exemple : <em>ἡμέρα</em> (le jour).</li>
        </ul>
        <p>L'esprit rude se traduit souvent en français par un « h » : <em>ἡμέρα</em> → « héméra » (jour), <em>ἵππος</em> → « hippos » (cheval).</p>

        <h4>Les accents</h4>
        <ul>
          <li><strong>Accent aigu</strong> (´) : peut se placer sur l'une des trois dernières syllabes.</li>
          <li><strong>Accent grave</strong> (ˋ) : remplace l'aigu sur la dernière syllabe dans certains cas (devant un mot suivant).</li>
          <li><strong>Accent circonflexe</strong> (ˆ) : ne peut se placer que sur une syllabe longue.</li>
        </ul>
      </div>

      <div class="bloc exemple">
        <div class="bloc-label">Application</div>

        <p>Écrire correctement : <em>ανθρωπος</em> (homme), <em>θεος</em> (dieu), <em>ψυχη</em> (âme).</p>
        <ul>
          <li><em>ἄνθρωπος</em> : esprit doux sur l'α initial + accent aigu.</li>
          <li><em>θεός</em> : esprit doux sur l'ε + accent aigu.</li>
          <li><em>ψυχή</em> : esprit doux sur l'υ + accent aigu final.</li>
        </ul>
      </div>

      <div class="bloc resume">
        <div class="bloc-label">Erreur fréquente</div>
        <p>Omettre l'esprit rude sur les mots qui commencent par une voyelle aspirée. C'est une faute qui dénature le mot et entraîne des erreurs de traduction.</p>
      </div>
    `

  {
    title: "Chapitre 1 — Les trois déclinaisons",
    content: `
      <div class="bloc theorie">
        <div class="bloc-label">Fondements théoriques</div>
        <h3>Un système organisé</h3>
        <p>Les noms, adjectifs et pronoms grecs se répartissent en <strong>trois déclinaisons</strong>, selon leur thème et leur terminaison. Chaque déclinaison comporte cinq cas au singulier et cinq cas au pluriel : nominatif, vocatif, accusatif, génitif, datif.</p>

        <h4>Première déclinaison (thème en -α/η)</h4>
        <p>Modèle : <em>ἡμέρα, -ας, ἡ</em> (le jour).</p>
        <table>
          <thead>
            <tr><th>Cas</th><th>Singulier</th><th>Pluriel</th></tr>
          </thead>
          <tbody>
            <tr><td>Nominatif</td><td>ἡμέρα</td><td>ἡμέραι</td></tr>
            <tr><td>Vocatif</td><td>ἡμέρα</td><td>ἡμέραι</td></tr>
            <tr><td>Accusatif</td><td>ἡμέραν</td><td>ἡμέρας</td></tr>
            <tr><td>Génitif</td><td>ἡμέρας</td><td>ἡμερῶν</td></tr>
            <tr><td>Datif</td><td>ἡμέρᾳ</td><td>ἡμέραις</td></tr>
          </tbody>
        </table>

        <h4>Deuxième déclinaison (thème en -ο)</h4>
        <p>Modèle : <em>λόγος, -ου, ὁ</em> (la parole, le discours).</p>
        <table>
          <thead>
            <tr><th>Cas</th><th>Singulier</th><th>Pluriel</th></tr>
          </thead>
          <tbody>
            <tr><td>Nominatif</td><td>λόγος</td><td>λόγοι</td></tr>
            <tr><td>Vocatif</td><td>λόγε</td><td>λόγοι</td></tr>
            <tr><td>Accusatif</td><td>λόγον</td><td>λόγους</td></tr>
            <tr><td>Génitif</td><td>λόγου</td><td>λόγων</td></tr>
            <tr><td>Datif</td><td>λόγῳ</td><td>λόγοις</td></tr>
          </tbody>
        </table>
      </div>

      <div class="bloc theorie">
        <div class="bloc-label">Troisième déclinaison</div>
        <h3>Thèmes consonantiques et vocaliques</h3>
        <p>La 3<sup>e</sup> déclinaison regroupe les thèmes consonantiques et vocaliques. Elle est plus complexe et s'apprend surtout par les génitifs singuliers.</p>
        <ul>
          <li><em>φύλαξ, φύλακος, ὁ</em> (le garde) : thème consonantique en -κ.</li>
          <li><em>πόλις, πόλεως, ἡ</em> (la cité) : thème vocalique en -ι.</li>
          <li><em>ἄστυ, ἄστεως, τό</em> (la ville) : thème en -υ.</li>
        </ul>
        <p>Terminaisons caractéristiques de la 3<sup>e</sup> déclinaison :</p>
        <table>
          <thead>
            <tr><th>Cas</th><th>Singulier</th><th>Pluriel</th></tr>
          </thead>
          <tbody>
            <tr><td>Nominatif</td><td>-ς ou - (allongé)</td><td>-ες / -α</td></tr>
            <tr><td>Génitif</td><td>-ος / -ως / -εως</td><td>-ων</td></tr>

        <div class="bloc-label">Fondements théoriques</div>
        <h3>Rapporter les paroles d'autrui</h3>
        <p>Le <strong>discours indirect</strong> consiste à rapporter les paroles ou les pensées de quelqu'un sans les citer directement. En grec, il utilise principalement l'<strong>infinitif</strong>, éventuellement introduit par <em>ὅτι</em> ou <em>ὡς</em>.</p>

        <h4>Trois constructions principales</h4>
        <ul>
          <li><strong>Infinitif seul</strong> : <em>Λέγει τὸν παῖδα νοσεῖν.</em> → « Il dit que l'enfant est malade. »</li>
          <li><strong>ὅτι / ὡς + indicatif</strong> : <em>Λέγει ὅτι ὁ παῖς νοσεῖ.</em> → « Il dit que l'enfant est malade. »</li>
          <li><strong>ὅτι / ὡς + optatif</strong> (après un verbe au passé) : <em>Εἶπεν ὅτι ὁ παῖς νοσοίη.</em> → « Il dit que l'enfant était malade. »</li>
        </ul>

        <h4>Concordance des temps et des modes</h4>
        <p>Après un verbe principal au <strong>présent</strong>, on garde les modes et temps du discours direct.</p>
        <p>Après un verbe principal au <strong>passé</strong>, on peut passer :</p>
        <ul>
          <li>De l'indicatif à l'<strong>optatif</strong> (optatif oblique).</li>
          <li>Du subjonctif à l'<strong>optatif</strong>.</li>
        </ul>
      </div>

Latin-Grec. Il est évalué à l'Examen d'État (coefficient 5). Au-delà de l'épreuve, il forme à la rigueur grammaticale, à l'analyse fine des textes et à la compréhension de l'héritage culturel grec dont la R D C a hérité par l'intermédiaire du français."]],"2":[["fr","Chapitre 1, Pourquoi étudier le grec ancien en 4e Humanité? Situation-problème. « Le grec, à quoi ça sert? ». Un élève demande: « Pourquoi apprendre une langue que plus personne ne parle? » La question est légitime. Mais savez-vous que les mots démocratie, philosophie, biologie, économie, politique, théâtre, musique, école viennent tous du grec ancien? Que les débats sur la citoyenneté et la justice ont été pensés pour la première fois en grec? Étudier le grec, c'est comprendre d'où viennent nos mots et nos idées. Fondements théoriques. Quatre raisons d'étudier le grec ancien. Comprendre le français: une grande partie du vocabulaire savant français vient du grec. Connaître le grec, c'est enrichir son français et mieux comprendre les mots scientifiques, médicaux, politiques et philosophiques. Former l'esprit: la grammaire grecque, précise et structurée, forme à la rigueur et à la logique. Accéder à la culture classique: les textes d'Homère, de Platon, de Démosthène, de Xénophon sont au fondement de la pensée occidentale. Éclairer le présent: la démocratie athénienne, la citoyenneté, l'éloquence politique, la justice sont encore des sujets d'actualité en R D C et dans le monde. À retenir. Le grec ancien n'est pas une langue morte: c'est une langue-source. Sa connaissance éclaire le français, forme l'esprit et relie le monde moderne à l'une de ses racines les plus profondes."]],"3":[["fr","Chapitre 1, L'alphabet grec. Fondements théoriques. 24 lettres à maîtriser. L'alphabet grec compte 24 lettres. Chacune existe en majuscule et en minuscule, et possède un nom. Il faut le connaître parfaitement, car il est la base de toute lecture. Lettre. Majuscule. Minuscule. Nom. 1. Α. α. alpha. 2. Β. β. bêta. 3. Γ. γ. gamma. 4. Δ. δ. delta. 5. Ε. ε. epsilon. 6. Ζ. ζ. zêta. 7. Η. η. êta. 8. Θ. θ. thêta. 9. Ι. ι. iota. 10. Κ. κ. kappa. 11. Λ. λ. lambda. 12. Μ. μ. mu. Les douze dernières lettres sont: nu (Ν ν), xi (Ξ ξ), omicron (Ο ο), pi (Π pi ), rhô (Ρ ρ), sigma (Σ σ/ς), tau (Τ τ), upsilon (Υ υ), phi (Φ φ), khi (Χ χ), psi (Ψ ψ), oméga (Ω ω). Voyelles et diphtongues. Un système à deux longueurs. Les voyelles grecques peuvent être brèves ou longues: ε, ο: toujours brèves. η, ω: toujours longues. α, ι, υ: brèves ou longues selon les mots. Les diphtongues sont des combinaisons de deux voyelles prononcées en une seule émission de voix: αι, ει, οι, υι, αυ, ευ, ου, ηυ, ωυ. L'alphabet grec: les 24 lettres à connaître."]],"4":[["fr","Chapitre 1, Esprits et accents. Fondements théoriques. Deux signes à ne jamais oublier. Le grec ancien utilise deux types de signes diacritiques: les esprits et les accents. Leur oubli est l'erreur la plus fréquente des débutants, et elle peut changer la prononciation, voire le sens du mot. Les esprits. Les esprits se placent sur la voyelle initiale d'un mot (ou sur le ρ initial): Esprit doux (ʼ): aucun souffle. Exemple: ἄνθρω pi ος (l'homme). Esprit rude (ʼ): souffle aspiré (comme un « h »). Exemple: ἡμέρα (le jour). L'esprit rude se traduit souvent en français par un « h »: ἡμέρα, donc « héméra » (jour), ἵ pi pi ος, donc « hippos » (cheval). Les accents. Accent aigu (´): peut se placer sur l'une des trois dernières syllabes. Accent grave (ˋ): remplace l'aigu sur la dernière syllabe dans certains cas (devant un mot suivant). Accent circonflexe (ˆ): ne peut se placer que sur une syllabe longue. Application. Placer esprit et accent. Écrire correctement: ανθρω pi ος (homme), θεος (dieu), ψυχη (âme). ἄνθρω pi ος: esprit doux sur l'α initial plus accent aigu. θεός: esprit doux sur l'ε plus accent aigu. ψυχή: esprit doux sur l'υ plus accent aigu final. Erreur fréquente. Omettre l'esprit rude sur les mots qui commencent par une voyelle aspirée. C'est une faute qui dénature le mot et entraîne des erreurs de traduction."]],"5":[["fr","Chapitre 1, Les trois déclinaisons. Fondements théoriques. Un système organisé. Les noms, adjectifs et pronoms grecs se répartissent en trois déclinaisons, selon leur thème et leur terminaison. Chaque déclinaison comporte cinq cas au singulier et cinq cas au pluriel: nominatif, vocatif, accusatif, génitif, datif. Première déclinaison (thème en -α/η). Modèle: ἡμέρα, -ας, ἡ (le jour). Cas. Singulier. Pluriel. Nominatif. ἡμέρα. ἡμέραι. Vocatif. ἡμέρα. ἡμέραι. Accusatif. ἡμέραν. ἡμέρας. Génitif. ἡμέρας. ἡμερῶν. Datif. ἡμέρᾳ. ἡμέραις. Deuxième déclinaison (thème en -ο). Modèle: λόγος, -ου, ὁ (la parole, le discours). Cas. Singulier. Pluriel. Nominatif. λόγος. λόγοι. Vocatif. λόγε. λόγοι. Accusatif. λόγον. λόγους. Génitif. λόγου. λόγων. Datif. λόγῳ. λόγοις. Troisième déclinaison. Thèmes consonantiques et vocaliques. La 3e déclinaison regroupe les thèmes consonantiques et vocaliques. Elle est plus complexe et s'apprend surtout par les génitifs singuliers. φύλαξ, φύλακος, ὁ (le garde): thème consonantique en -κ. pi όλις, pi όλεως, ἡ (la cité): thème vocalique en -ι. ἄστυ, ἄστεως, τό (la ville): thème en -υ. Terminaisons caractéristiques de la 3e déclinaison: Cas. Singulier. Pluriel. Nominatif. -ς ou, (allongé). -ες ou -α. Génitif. -ος ou -ως ou -εως. -ων. Datif. -ι. -σι(ν). Accusatif. -α ou -ν. -ας ou -α. Vocatif. souvent égale nominatif. égale nominatif. À retenir. La 1re déclinaison est surtout féminine; la 2e surtout masculine ou neutre; la 3e regroupe les thèmes consonantiques et les thèmes en -ι, -υ, -ευ. Retenir le génitif singulier est la clé pour décliner correctement."]],"6":[["fr","Chapitre 1, Le verbe grec: temps et modes. Fondements théoriques. Un système aspectuel. Le verbe grec distingue trois notions: le temps (présent, passé, futur), l'aspect (ponctuel, duratif, accompli) et le mode (indicatif, subjonctif, optatif, impératif, infinitif, participe). Cette triple dimension est ce qui rend la traduction si précise… et si délicate. Les temps principaux. Présent: action en cours ou habitude. Exemple: λύω (je délie). Imparfait: action passée en cours ou répétée. Exemple: ἔλυον (je déliais). Futur: action future. Exemple: λύσω (je délierai). Aoriste: action ponctuelle, sans idée de durée (souvent traduit par un passé simple). Exemple: ἔλυσα (je déliai). Parfait: action achevée dont le résultat dure encore (aspect accompli). Exemple: λέλυκα (j'ai délié, et le résultat demeure). Voix et modes. Trois voix, six modes. Trois voix: Active: le sujet agit. λύω (je délie). Moyenne: le sujet agit pour lui-même ou sur lui-même. λύομαι (je délie pour moi, je me délie). Passive: le sujet subit l'action. λύομαι (je suis délié). Six modes: Indicatif: énoncé d'un fait (temps réels). Subjonctif: volonté, éventualité, dans les propositions subordonnées. Optatif: souhait, éventualité, dans le discours indirect. Impératif: ordre. Infinitif: forme nominale du verbe (complétives, discours indirect). Participe: forme adjectivale du verbe (génitif absolu, propositions participiales). Application. Conjuguer λύω au présent de l'indicatif. Personne. Actif. Passif. 1re sg. λύω. λύομαι. 2e sg. λύεις. λύῃ. 3e sg. λύει. λύεται. 1re pl. λύομεν. λυόμεθα. 2e pl. λύετε. λύεσθε. 3e pl. λύουσι(ν). λύονται. Erreur fréquente. Confondre l'aoriste (action ponctuelle) et le parfait (action achevée dont le résultat dure). « Il mourut » (aoriste) n'est pas équivalent à « il est mort » (parfait, avec effet présent)."]],"7":[["fr","Chapitre 1, La voix moyenne et passive. Fondements théoriques. Une voix, deux fonctions. En grec, la voix moyenne et la voix passive partagent les mêmes terminaisons (celles de la voix moyenne). Le contexte permet de distinguer leur valeur. Voix moyenne. Le sujet agit pour lui-même, sur lui-même ou avec un intérêt personnel. Traduction possible: « je délie pour moi », « je me délie », « je fais délier (par un autre, pour moi) ». Voix passive. Le sujet subit l'action. Traduction: « je suis délié ». En grec, le complément d'agent se met au génitif avec ὑ pi ό. Application. Distinguer le moyen du passif. Comparez: Ὁ pi αῖς λούεται., donc « L'enfant se lave » (moyen: il se lave lui-même). Ὁ pi αῖς ὑ pi ὸ τῆς μητρὸς λούεται., donc « L'enfant est lavé par sa mère » (passif: complément d'agent ὑ pi ὸ τῆς μητρός au génitif). Le même verbe, à la même forme, peut donc avoir deux sens. C'est le contexte et la présence (ou non) d'un complément d'agent qui tranchent. À retenir. Moyen: le sujet agit pour ou sur lui-même. Passif: le sujet subit l'action; complément d'agent au génitif avec ὑ pi ό. Les terminaisons sont identiques: c'est le contexte qui décide."]],"8":[["fr","Chapitre 1, Verbes contractes et verbe εἰμί. Les verbes contractes. -άω, -έω, -όω. Certains verbes grecs ont un thème terminé par une voyelle (α, ε, ο) qui se contracte avec la voyelle de la terminaison. On les appelle des verbes contractes. Trois modèles: τιμάω (honorer), donc τιμῶ, τιμᾷς, τιμᾷ... pi οιέω (faire), donc pi οιῶ, pi οιεῖς, pi οιεῖ... δηλόω (montrer), donc δηλῶ, δηλοῖς, δηλοῖ... La contraction suit des règles précises (par exemple: α plus ε, donc α; ε plus ε, donc ει; ο plus ε, donc ου). Ces règles s'apprennent progressivement avec les tableaux de conjugaison. Le verbe εἰμί. Le verbe être. Le verbe εἰμί (être) est irrégulier et très fréquent. Il est souvent employé comme copule, et parfois avec le datif pour exprimer la possession. Personne. Présent. Imparfait. Futur. 1re sg. εἰμί. ἦν ou ἦ. ἔσομαι. 2e sg. εἶ. ἦσθα. ἔσῃ. 3e sg. ἐστί(ν). ἦν. ἔσται. 1re pl. ἐσμέν. ἦμεν. ἐσόμεθα. 2e pl. ἐστέ. ἦτε. ἔσεσθε. 3e pl. εἰσί(ν). ἦσαν. ἔσονται. Emploi du datif avec εἰμί. Le datif avec εἰμί exprime la possession: Ἔστι μοι βιβλίον, donc « J'ai un livre » (littéralement: « Il y a à moi un livre »). C'est une tournure très fréquente."]],"9":[["fr","Chapitre 2, Les cas et leurs fonctions. Fondements théoriques. Cinq cas, cinq fonctions principales. Le grec ancien utilise cinq cas: nominatif, vocatif, accusatif, génitif, datif. Chacun remplit une ou plusieurs fonctions. Cas. Fonctions principales. Nominatif. Sujet, attribut du sujet. Vocatif. Apostrophe (interpellation). Accusatif. Complément d'objet direct, complément de lieu avec préposition, durée, mesure. Génitif. Complément du nom, partitif, de temps, de prix; complément d'agent avec ὑ pi ό. Datif. Complément d'objet indirect, moyen, manière, lieu, temps, possession avec εἰμί. Contrairement au latin, le grec ne possède pas d'ablatif. Les fonctions exprimées en latin par l'ablatif le sont en grec par le génitif ou le datif, selon le contexte. Les cas grecs et leurs fonctions principales. Application. Analyser une phrase simple. Ὁ στρατιώτης ἐν τῇ μάχῃ ἀ pi έθανεν. Ὁ στρατιώτης: nominatif singulier, sujet de ἀ pi έθανεν, donc « le soldat ». ἐν τῇ μάχῃ: datif singulier avec la préposition ἐν (lieu où), donc « dans la bataille ». ἀ pi έθανεν: verbe à l'aoriste, 3e personne du singulier, voix active, donc « mourut ». Traduction: « Le soldat mourut dans la bataille. »."]],"10":[["fr","Chapitre 2, Les prépositions. Fondements théoriques. Trois régimes de prépositions. En grec, les prépositions se construisent avec un cas précis: l'accusatif, le génitif ou le datif. Certaines acceptent plusieurs cas avec des sens différents. Prépositions avec l'accusatif. εἰς: vers, dans (mouvement). pi ρός: vers, auprès de. κατά: selon, le long de, contre. μετά: après (avec l'accusatif). pi αρά: auprès de (avec mouvement), chez. ὑ pi έρ: au-dessus de, pour, en faveur de. διά: à cause de (avec l'accusatif). Prépositions avec le génitif. ἀ pi ό: loin de. ἐκ ou ἐξ: hors de. pi ρό: devant, avant. pi ερί: autour de, au sujet de. ὑ pi ό: sous; complément d'agent (sens passif). διά: à travers, par (avec le génitif). Prépositions avec le datif. ἐν: dans, parmi (lieu où). σύν: avec (accompagnement). ἐ pi ί: sur, au moment de. pi αρά: auprès de, chez (sans mouvement). ὑ pi ό: sous (lieu où, avec le datif). μετά: avec (accompagnement, avec le datif). Erreur fréquente. Traduire mécaniquement εἰς τὴν pi όλιν et ἐν τῇ pi όλει par « dans la ville ». Le premier exprime le mouvement vers (« vers la ville »); le second exprime le lieu où (« dans la ville »). La différence est essentielle."]],"11":[["fr","Chapitre 2, L'accord en grec. Fondements théoriques. Trois règles d'accord. L'accord est une règle fondamentale en grec, comme en français. 1. Sujet-verbe. Le verbe s'accorde en personne et en nombre avec son sujet. Exemple: Ὁ ἀνὴρ λέγει (l'homme parle); Οἱ ἄνδρες λέγουσι (les hommes parlent). 2. Adjectif-nom. L'adjectif s'accorde en genre, nombre et cas avec le nom qu'il qualifie. C'est vrai aussi pour les adjectifs de la 3e déclinaison, qui peuvent suivre un nom de la 1re ou de la 2e déclinaison. 3. Pronoms. Les pronoms personnels, relatifs et démonstratifs suivent les mêmes règles d'accord que les adjectifs. Application. Repérer les accords. Ἡ καλὴ pi όλις μεγάλη ἐστίν. Ἡ καλὴ pi όλις: καλή s'accorde avec pi όλις (féminin, singulier, nominatif). μεγάλη: attribut du sujet, s'accorde avec pi όλις. ἐστίν: 3e personne du singulier (verbe εἰμί), s'accorde avec pi όλις. Traduction: « La belle cité est grande. ». À retenir. Pas de traduction possible sans repérer les accords. Un adjectif mal accordé change le sens du groupe nominal et peut entraîner une erreur d'analyse."]],"12":[["fr","Chapitre 3, Les propositions relatives. Fondements théoriques. Introduites par ὅς, ἥ, ὅ. La proposition relative est une proposition subordonnée qui complète un nom (l'antécédent) en le qualifiant. Elle est introduite par le pronom relatif ὅς, ἥ, ὅ (« qui, que, dont »), qui s'accorde en genre et en nombre avec l'antécédent, mais prend son cas de sa fonction dans la relative. Exemple simple. Ὁ ἀνὴρ ὃν ὁρῶ σοφός ἐστιν., donc « L'homme que je vois est sage. ». ὅν: masculin singulier (accord avec ἀνήρ), à l'accusatif (COD de ὁρῶ). Optatif dans les relatives au discours indirect. Dans le discours indirect, une relative peut passer à l'optatif (mode du discours rapporté), surtout après un verbe principal au passé. C'est une particularité du grec classique. Erreur fréquente. Traduire le relatif grec comme s'il suivait toujours l'antécédent immédiatement. En grec, le relatif peut être éloigné de son antécédent. Il faut toujours vérifier l'antécédent avant de traduire."]],"13":[["fr","Chapitre 3, Complétives et circonstancielles. Les complétives. Complétives de fait et de volonté. Les complétives sont des propositions subordonnées qui complètent un verbe (verbe de parole, de pensée, de volonté). Complétives de fait. Introduites par ὅτι ou ὡς, suivies de l'indicatif (ou de l'optatif au discours indirect). Elles énoncent un fait. Exemple: Λέγει ὅτι ὁ pi αῖς νοσεῖ., donc « Il dit que l'enfant est malade. ». Complétives de volonté. Introduites par ἵνα, ὅ pi ως, μή, suivies du subjonctif (ou de l'optatif dans un contexte passé). Elles expriment un ordre, un souhait, un but. Exemple: Κελεύει ἵνα οἱ στρατιῶται μάχωνται., donc « Il ordonne que les soldats combattent. ». Complétives infinitives. Très fréquentes: le verbe principal est suivi d'un infinitif dont le sujet se met à l'accusatif. Exemple: Νομίζω τοὺς pi ολίτας ἀγαθοὺς εἶναι., donc « Je crois que les citoyens sont bons. ». Les circonstancielles. Les principales conjonctions. Type. Conjonctions. Mode. Temps. ἐ pi εί, ὅτε, ὡς. Indicatif (ou optatif au discours indirect). Cause. ὅτι, διότι, ἐ pi εί. Indicatif. But. ἵνα, ὡς, ὅ pi ως. Subjonctif (ou optatif). Conséquence. ὥστε. Infinitif ou indicatif. Concession. καί pi ερ, εἰ καί. Participe ou indicatif. Condition. εἰ, ἐάν. Indicatif, subjonctif ou optatif. À retenir. La conjonction et le mode donnent ensemble le sens de la subordonnée. ἵνα plus subjonctif égale but ou volonté. ὅτι plus indicatif égale fait. εἰ plus indicatif égale condition réelle; εἰ plus optatif égale condition éventuelle."]],"14":[["fr","Chapitre 3, Le génitif absolu. Fondements théoriques. Un groupe autonome en génitif. Le génitif absolu est un groupe nominal au génitif, accompagné d'un participe, qui exprime une circonstance (temps, cause, condition, concession) sans être grammaticalement lié au reste de la phrase. Formation. Un nom ou pronom au génitif. Un participe (présent, aoriste ou parfait), accordé en genre, nombre et cas (génitif) avec ce nom. Traduction. Le génitif absolu se traduit en français par une proposition subordonnée circonstancielle (temps, cause, condition, concession) ou par un groupe participial. Application. Traduire un génitif absolu. Τούτων λεχθέντων, οἱ στρατιῶται ἀνεχώρησαν. Τούτων λεχθέντων: génitif absolu (pronom démonstratif plus participe aoriste passif). οἱ στρατιῶται ἀνεχώρησαν: proposition principale. Traduction: « Ces choses ayant été dites, les soldats se retirèrent. » Ou: « Après que ces choses eurent été dites, les soldats se retirèrent. ». Autre exemple: Τῆς pi όλεως ἁλισκομένης, οἱ pi ολῖται ἔφυγον., donc « La ville étant prise, les citoyens s'enfuirent. ». Erreur fréquente. Traduire le génitif absolu comme s'il dépendait grammaticalement d'un autre mot de la phrase. Le génitif absolu est autonome: il exprime une circonstance indépendante. Il faut le traduire comme une proposition subordonnée."]],"15":[["fr","Chapitre 3, Le discours indirect. Fondements théoriques. Rapporter les paroles d'autrui. Le discours indirect consiste à rapporter les paroles ou les pensées de quelqu'un sans les citer directement. En grec, il utilise principalement l'infinitif, éventuellement introduit par ὅτι ou ὡς. Trois constructions principales. Infinitif seul: Λέγει τὸν pi αῖδα νοσεῖν., donc « Il dit que l'enfant est malade. ». ὅτι ou ὡς plus indicatif: Λέγει ὅτι ὁ pi αῖς νοσεῖ., donc « Il dit que l'enfant est malade. ». ὅτι ou ὡς plus optatif (après un verbe au passé): Εἶ pi εν ὅτι ὁ pi αῖς νοσοίη., donc « Il dit que l'enfant était malade. ». Concordance des temps et des modes. Après un verbe principal au présent, on garde les modes et temps du discours direct. Après un verbe principal au passé, on peut passer: De l'indicatif à l'optatif (optatif oblique). Du subjonctif à l'optatif. Pronoms réfléchis. Attention aux références. Dans le discours indirect, les pronoms changent souvent de référent. Le pronom réfléchi ἑαυτόν renvoie au sujet du verbe principal. Il faut être attentif pour traduire correctement. À retenir. Le discours indirect grec repose sur l'infinitif et sur l'opposition indicatif ou optatif selon le temps du verbe principal. Cette construction est fréquente chez Xénophon, Thucydide et Platon."]],"16":[["fr","Chapitre 4, Méthode de traduction. Méthode en six étapes. Une démarche rigoureuse. Traduire un texte grec ne s'improvise pas. Suivez toujours la même démarche: Lire le texte entier à haute voix, même sans tout comprendre. Repérer les groupes et les pauses. Repérer les verbes: temps, mode, voix, personne. C'est autour d'eux que s'organise la phrase. Analyser les groupes nominaux: cas, genre, nombre, fonction. Repérer les prépositions. Identifier les propositions: principale, subordonnées, génitif absolu, discours indirect. Traduire phrase par phrase, en respectant le sens et le style du texte. Relire et améliorer la fluidité de la traduction française. Application guidée. Traduire un court extrait. Texte: Ὁ Κῦρος pi αῖς ὢν ἐφιλομαθεῖν. (Xénophon, Cyropédie). Ὁ Κῦρος: nominatif, sujet, donc « Cyrus ». pi αῖς ὤν: participe présent de εἰμί, nominatif masculin singulier, en apposition au sujet, donc « étant enfant ». ἐφιλομαθεῖν: infinitif présent de φιλομαθέω (aimer apprendre), complément du verbe principal sous-entendu, donc « aimait apprendre ». Traduction: « Cyrus, étant enfant, aimait apprendre. ». Conseil. Ne jamais traduire mot à mot. Une traduction doit être fidèle au sens, mais aussi lisible en français. Le mot à mot produit souvent des contresens."]],"17":[["fr","Chapitre 4, Xénophon et l'art du récit. Fondements théoriques. Un historien et mémorialiste. Xénophon (vers 430-354 av. J.-C.) est un historien, philosophe et chef militaire athénien. Disciple de Socrate, il a écrit: L'Anabase: récit de l'expédition des Dix-Mille en Perse. La Cyropédie: biographie romancée de Cyrus le Grand, sur l'éducation et le leadership. Les Helléniques: suite de l'histoire grecque. Le Banquet, l'Apologie de Socrate, les Mémorables. Extrait type de la Cyropédie. Dans la Cyropédie, Xénophon décrit l'éducation du jeune Cyrus: endurance, maîtrise de soi, sens de la justice, goût de l'apprentissage. Ce texte est un classique de la réflexion sur le leadership. À retenir. Xénophon est un auteur idéal pour la 4e année: son style est clair, ses phrases souvent simples, ses récits vivants. C'est un bon passeur vers les auteurs plus difficiles."]],"18":[["fr","Chapitre 4, Lucien et le roman grec. Lucien de Samosate. Satire et fantastique. Lucien (vers 125-192 apr. J.-C.) est un rhéteur et satiriste grec d'origine syrienne. Son Histoire vraie est un récit fantastique et satirique: voyage sur la Lune, rencontres avec des êtres étranges, parodie des récits de voyage. Ce texte est souvent considéré comme l'ancêtre du roman de science-fiction. Intérêt pédagogique. Un grec accessible et vivant. Un humour et une ironie qui plaisent aux élèves. Une réflexion sur la vérité et le mensonge. Le roman grec. Longus et Xénophon d'Éphèse. Le roman grec est un genre tardif (Ier-IIIe siècle apr. J.-C.) qui raconte des amours contrariées, des voyages, des reconnaissances. Deux auteurs figurent au programme de terminale: Longus, Daphnis et Chloé: roman pastoral, amours de deux bergers, célébration de la nature et de l'amour. Xénophon d'Éphèse, Éphésiaques: roman d'aventures, séparations, périls, fidélité conjugale. Papyrus grec: un texte antique à déchiffrer."]],"19":[["fr","Chapitre 5, La démocratie athénienne. Fondements théoriques. Une invention politique. Athènes, au Ve siècle av. J.-C., invente la démocratie (du grec δῆμος, « peuple », et κράτος, « pouvoir »). Ce régime, limité aux citoyens hommes libres, repose sur trois institutions principales. Les trois institutions. L'ecclésia (assemblée du peuple): tous les citoyens y participent. Elle vote les lois, décide de la guerre et de la paix, élit certains magistrats. La boulè (conseil des Cinq-Cents): prépare les décisions de l'ecclésia. Ses membres sont tirés au sort pour un an. L'héliée (tribunal populaire): composée de jurés tirés au sort, elle juge les affaires civiles et criminelles. Les limites de la démocratie athénienne. Les femmes, les esclaves et les métèques (étrangers) sont exclus de la citoyenneté. Les citoyens ne représentent qu'une minorité de la population. Le tirage au sort, la participation directe et l'ostracisme sont des traits spécifiques. Les institutions de la démocratie athénienne. Héritage. La démocratie athénienne est l'une des sources de nos régimes modernes. Elle inspire encore les débats sur la citoyenneté, la participation, la justice et la liberté. Étudier ses institutions, c'est comprendre d'où viennent nos propres institutions."]],"20":[["fr","Chapitre 5, La vie quotidienne en Grèce. Fondements théoriques. Quatre aspects essentiels. Connaître la vie quotidienne des Grecs permet de mieux comprendre les textes. La famille et l'éducation. Le père est le chef de famille (οἶκος). L'éducation des garçons comporte la lecture, l'écriture, la musique et la gymnastique. Les filles reçoivent une éducation centrée sur la maison et le tissage. À Athènes, les garçons de bonne famille poursuivent leur formation auprès d'un maître (philosophe ou rhéteur). L'habitat. La maison grecque s'organise autour d'une cour intérieure. Les pièces principales sont le gynécée (appartement des femmes) et l'andron (salle des banquets). Le banquet (symposion). Le symposion est un banquet entre hommes: on boit, on mange, on chante, on discute de philosophie et de politique. C'est un lieu essentiel de la vie sociale et culturelle. Les jeux et les fêtes. Les Jeux olympiques, les Panathénées, les Dionysies sont des événements majeurs de la vie civique et religieuse. Ils mêlent sport, religion, théâtre et concours poétiques. À retenir. La vie quotidienne est le miroir d'une civilisation. Comprendre comment les Grecs vivaient, mangeaient, s'éduquaient et se divertissaient permet d'interpréter finement les textes littéraires."]],"21":[["fr","Chapitre 6, L'héritage grec en R D C. Fondements théoriques. Un héritage vivant. L'héritage grec est présent partout dans notre vie quotidienne et dans nos institutions. Dans le vocabulaire politique. Démocratie (δῆμος plus κράτος). Politique ( pi όλις, « cité »). Économie (οἶκος plus νόμος, « loi de la maison »). Justice, citoyen, débat, rhétorique. Dans le vocabulaire scientifique. Biologie (βίος plus λόγος). Géographie, géométrie, physique. Philosophie (φιλοσοφία, « amour de la sagesse »). Théâtre, musique, chorale. Dans la pensée et la culture. La philosophie grecque (Socrate, Platon, Aristote) est au fondement de la pensée rationnelle enseignée dans les humanités. Le théâtre grec (tragédie, comédie) nourrit encore notre littérature. Les Jeux olympiques modernes s'inspirent directement des concours grecs antiques. Cas pédagogique. Un élève de Kananga prépare un discours. Un élève de l'option Latin-Grec prépare un discours pour le club de débat sur la participation citoyenne. Il s'inspire de la structure des Philippiques de Démosthène: exorde, narration, argumentation, péroraison. Il mobilise aussi le vocabulaire grec de la citoyenneté. Son discours, bien construit, impressionne le jury. Le grec lui a fourni un modèle et un vocabulaire."]],"22":[["fr","Chapitre 6, Grec et français: étymologie et comparaison. Étymologie. Des familles de mots. Le grec ancien est l'une des principales sources du vocabulaire savant français. Connaître quelques racines grecques permet de comprendre des centaines de mots. Racine grecque. Sens. Exemples français. δῆμος (dêmos). peuple. démocratie, démographie, épidémie. λόγος (logos). parole, raison. logique, biologie, dialogue, monologue. pi όλις (polis). cité. politique, police, métropole. ψυχή (psychê). âme. psychologie, psychiatrie. βίος (bios). vie. biologie, biographie, antibiotique. γράφω (graphô). écrire. graphie, biographie, photographie. φιλέω (phileô). aimer. philosophie, philanthrope, bibliophile. Comparaison syntaxique. Grec et français. Quelques différences à retenir: Absence d'ablatif en grec: les fonctions exprimées en latin par l'ablatif le sont par le génitif ou le datif. Article défini: le grec possède un article défini (ὁ, ἡ, τό), ce qui n'est pas le cas du latin. Ordre des mots: plus libre qu'en français, mais souvent ordonné autour du verbe. Emploi de la voix moyenne, inexistante en français et en latin. Optatif: mode disparu en français moderne. À retenir. L'étude du grec enrichit le français. Reconnaître les racines grecques permet de comprendre le sens des mots savants, d'enrichir son expression et de mieux analyser les textes."]],"23":[["fr","Synthèse, Lire, traduire, comprendre. Synthèse générale. Les points clés du cours de Grec ancien. Alphabet: 24 lettres, voyelles brèves ou longues, diphtongues. Esprits et accents: esprit doux ou rude sur la voyelle initiale; accent aigu, grave ou circonflexe. Trois déclinaisons: thème en -α/η, en -ο, consonantiques et vocaliques. Verbe grec: temps (présent, imparfait, futur, aoriste, parfait), voix (active, moyenne, passive), modes (indicatif, subjonctif, optatif, impératif, infinitif, participe). Verbes contractes (-άω, -έω, -όω) et verbe εἰμί. Cas et fonctions: nominatif (sujet), vocatif (apostrophe), accusatif (COD, lieu avec mouvement), génitif (complément du nom, agent avec ὑ pi ό), datif (COI, moyen, lieu où, possession avec εἰμί). Prépositions: trois régimes (accusatif, génitif, datif). Propositions subordonnées: relatives (ὅς, ἥ, ὅ), complétives (ὅτι, ἵνα, ὡς), circonstancielles (ἐ pi εί, εἰ, ὥστε...). Génitif absolu: nom plus participe au génitif, exprimant une circonstance. Discours indirect: infinitif, ὅτι/ὡς plus indicatif ou optatif. Méthode de traduction: lire, repérer les verbes, analyser les groupes, identifier les propositions, traduire, relire. Auteurs: Xénophon (récit, histoire), Lucien (satire, fantastique), Longus et Xénophon d'Éphèse (roman). Civilisation: démocratie athénienne (ecclésia, boulè, héliée), vie quotidienne, jeux, héritage. Étymologie: le grec nourrit le français savant (démocratie, philosophie, biologie...). Message final. Une langue de culture pour aujourd'hui. Le grec ancien n'est pas une langue morte: c'est une langue-source. Sa connaissance éclaire le français, forme l'esprit, relie le monde moderne à l'une de ses racines les plus profondes, et prépare à l'Examen d'État comme aux études supérieures de lettres, de philosophie, de droit ou de sciences politiques. L'élève qui maîtrise le grec ancien a acquis un outil de rigueur et de culture qui le servira toute sa vie."]],"24":[["fr","Préparation à l'Examen d'État. Types d'épreuves. Trois exercices classiques. L'épreuve de grec ancien à l'Examen d'État comporte généralement trois types d'exercices. 1. La version. Traduire un texte grec en français. C'est l'épreuve reine. Elle évalue votre capacité à analyser les formes, à comprendre la syntaxe et à rendre le sens avec élégance. Lire d'abord le texte en entier. Repérer les verbes et leurs sujets. Analyser les cas et les prépositions. Traduire phrase par phrase, puis relire l'ensemble. 2. Le thème. Traduire une phrase ou un court texte français en grec. Cet exercice évalue la maîtrise des déclinaisons, des conjugaisons et de la syntaxe. Identifier la fonction de chaque mot avant de choisir son cas. Repérer les verbes et leur temps. Respecter l'ordre habituel de la phrase grecque. 3. Le commentaire. Analyser un texte grec: genre littéraire, contexte historique, procédés stylistiques, valeurs grecques (arétè, sophrosynè, dikè). Conseils pratiques. Réviser régulièrement les tableaux de déclinaison et de conjugaison. Apprendre par cœur le vocabulaire de base (au moins 300 mots fréquents). S'entraîner à la version sur des textes courts et variés. Lire les textes d'auteurs en traduction pour connaître les contextes. Travailler la rigueur grammaticale en français, car une bonne traduction exige une bonne maîtrise du français."]],"25":[["fr","Évaluation finale, Grec ancien. Consignes. Répondez aux questions suivantes en choisissant la seule bonne réponse parmi les quatre propositions. Chaque question est indépendante et porte sur les notions développées dans le cours. Prenez le temps de relire les chapitres en cas de doute."]]}};

        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }   // ancien contenu invalide
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) {
          return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); })
            .then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; });
        },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);

    // ====================================================================
    //  Bannière : invitation, confirmations, progression
    // ====================================================================
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer);
      bnMode = mode;
      txtEl.textContent = text;
      actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; }
      else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }

    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }

    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial"
        ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet."
        : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
</html>
