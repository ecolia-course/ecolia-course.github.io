    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>La biologie t'apprend à comprendre la vie : la cellule, la reproduction, les relations entre les êtres vivants et leur milieu. Dans ce cours, tu vas observer, schématiser et expliquer des phénomènes qui concernent ton corps et ton environnement. Tu n'as pas besoin d'un microscope pour commencer : les schémas et les observations à l'œil nu suffisent.</p>
<ul>
<li>Leçon 1 — La découverte de la cellule et la théorie cellulaire</li>
<li>Leçon 2 — La cellule animale et la cellule végétale</li>
<li>Leçon 3 — Les organites cellulaires et leurs fonctions</li>
<li>Leçon 4 — Le cycle cellulaire</li>
<li>Leçon 5 — La mitose</li>
<li>Leçon 6 — Les appareils reproducteurs</li>
<li>Leçon 7 — Les hormones sexuelles et la puberté</li>
<li>Leçon 8 — Fécondation, grossesse et hygiène</li>
<li>Leçon 9 — Les facteurs écologiques</li>
<li>Leçon 10 — Les relations entre êtres vivants</li>
<li>Leçon 11 — Les écosystèmes de la RDC</li>
<li>Leçon 12 — Biodiversité et protection de l'environnement</li>
</ul>
<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme national de Biologie (DIPROMAD, 2021), Fiches pédagogiques 2025. Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 1 — La découverte de la cellule et la théorie cellulaire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Tous les êtres vivants — arbre, poisson, être humain — sont faits de cellules. Mais qui a découvert la cellule pour la première fois ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Raconter la découverte de la cellule. Énoncer les trois principes de la théorie cellulaire. Comprendre que tous les êtres vivants sont constitués de cellules. Prérequis : aucun.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>En 1665, Robert Hooke observe au microscope une fine coupe de liège et voit de petites loges qu'il appelle <em>cellulae</em>. C'est la première observation de cellules.</p>
<p>Au XIXe siècle, Schleiden (1838) et Schwann (1839) montrent que les plantes et les animaux sont constitués de cellules. Virchow (1855) complète : « Toute cellule provient d'une cellule. »</p>
<p><strong>Théorie cellulaire (3 principes) :</strong></p>
<ol>
<li>Tous les êtres vivants sont constitués d'une ou plusieurs cellules.</li>
<li>La cellule est l'unité structurale et fonctionnelle de la vie.</li>
<li>Toute cellule provient d'une cellule préexistante par division.</li>
</ol>
</div>
<img src="images/Biologie1_1.jpg" alt="Microscope optique" data-image-id="Biologie1_1" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour observer des cellules : utiliser un microscope ou une loupe, préparer une lame mince. Pour représenter une cellule : dessiner au crayon, légender, indiquer le grossissement.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une feuille d'hibiscus contient des cellules observables au microscope. Sans microscope, on peut comprendre la structure cellulaire à partir de schémas.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les trois principes de la théorie cellulaire.</p>
<details><summary>Corrigé</summary>
<p>1) Tous les êtres vivants sont constitués de cellules ; 2) la cellule est l'unité structurale et fonctionnelle de la vie ; 3) toute cellule provient d'une cellule préexistante.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La cellule est l'unité de base du vivant ; la théorie cellulaire fondée au XIXe siècle reste le socle de la biologie.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Biologie (DIPROMAD).</div>
    `
},
{
    title: "Leçon 2 — La cellule animale et la cellule végétale",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Une cellule de feuille et une cellule de peau se ressemblent-elles ? Qu'est-ce qui les distingue ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Décrire les principales parties d'une cellule. Distinguer la cellule animale de la cellule végétale. Schématiser les deux types de cellules.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les deux types de cellules sont eucaryotes : elles possèdent un noyau.</p>
<p><strong>Cellule animale :</strong> membrane plasmique, cytoplasme, noyau, mitochondries. Pas de paroi, pas de chloroplastes.</p>
<p><strong>Cellule végétale :</strong> paroi cellulosique, chloroplastes (pour la photosynthèse), grande vacuole centrale.</p>
</div>
<img src="images/Biologie1_2.jpg" alt="Cellule animale avec organites" data-image-id="Biologie1_2" onerror="this.style.display='none'">
<img src="images/Biologie1_3.jpg" alt="Cellule végétale avec paroi et chloroplastes" data-image-id="Biologie1_3" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Schématiser une cellule : dessiner la forme, placer le noyau, le cytoplasme, la membrane, puis les organites spécifiques. Comparer les deux cellules dans un tableau.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une cellule de feuille de manioc possède une paroi et des chloroplastes. Une cellule de la peau humaine a une membrane souple et de petites vacuoles.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite deux éléments présents dans la cellule végétale et absents dans la cellule animale.</p>
<details><summary>Corrigé</summary>
<p>La paroi cellulosique et les chloroplastes.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les cellules animale et végétale partagent une organisation commune mais diffèrent par la paroi, les chloroplastes et la vacuole.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Biologie (DIPROMAD).</div>
    `
},
{
    title: "Leçon 3 — Les organites cellulaires et leurs fonctions",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Dans une usine, chaque atelier a un rôle. Dans une cellule, chaque organite a aussi un rôle. Lesquels ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Identifier les principaux organites. Associer chaque organite à sa fonction. Comprendre la cellule comme une usine intégrée.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<ul>
<li><strong>Noyau :</strong> contient l'ADN, dirige l'activité cellulaire.</li>
<li><strong>Mitochondrie :</strong> produit l'énergie.</li>
<li><strong>Chloroplaste (végétale) :</strong> réalise la photosynthèse.</li>
<li><strong>Ribosome :</strong> fabrique les protéines.</li>
<li><strong>Membrane plasmique :</strong> contrôle les échanges.</li>
</ul>
</div>
<img src="images/Biologie1_5.jpg" alt="Mitochondrie" data-image-id="Biologie1_5" onerror="this.style.display='none'">
<img src="images/Biologie1_6.jpg" alt="Chloroplaste" data-image-id="Biologie1_6" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Associer chaque organite à une image (centrale électrique = mitochondrie, cuisinière = chloroplaste, bibliothèque = noyau).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une cellule musculaire contient beaucoup de mitochondries car elle a besoin de beaucoup d'énergie.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Associe chaque organite à sa fonction : noyau, mitochondrie, ribosome.</p>
<details><summary>Corrigé</summary>
<p>Noyau ➔ information génétique ; mitochondrie ➔ énergie ; ribosome ➔ protéines.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La cellule fonctionne comme une usine intégrée où chaque organite remplit une fonction spécialisée.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Biologie (DIPROMAD).</div>
    `
},
{
    title: "Leçon 4 — Le cycle cellulaire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Une cellule ne se divise pas n'importe quand. Comment sait-elle quand se diviser ? Que fait-elle entre deux divisions ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir le cycle cellulaire. Distinguer l'interphase et la mitose. Comprendre la régulation du cycle.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>cycle cellulaire</strong> est la suite d'événements entre la formation d'une cellule et sa division.</p>
<ul>
<li><strong>Interphase (la plus longue) :</strong> la cellule grandit, copie son ADN et se prépare à la division.</li>
<li><strong>Phase M (mitose) :</strong> division du noyau et du cytoplasme, aboutissant à deux cellules filles.</li>
</ul>
</div>
<img src="images/Biologie1_7.jpg" alt="Cycle cellulaire" data-image-id="Biologie1_7" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Représenter le cycle cellulaire par un cercle divisé en interphase (majoritaire) et phase M (courte).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Dans la peau humaine, les cellules se divisent régulièrement pour remplacer les cellules mortes.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelles sont les deux grandes phases du cycle cellulaire ?</p>
<details><summary>Corrigé</summary>
<p>L'interphase et la phase M (mitose).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le cycle cellulaire est une suite ordonnée d'événements qui permet à une cellule de grandir, de copier son ADN et de se diviser.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Biologie (DIPROMAD).</div>
    `
},
{
    title: "Leçon 5 — La mitose",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Une cellule mère donne deux cellules filles identiques. Comment cela se passe-t-il étape par étape ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Décrire les étapes de la mitose. Comprendre son rôle dans la croissance et la réparation. Distinguer mitose et méiose (introduction).</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>mitose</strong> est la division qui produit deux cellules filles identiques à la cellule mère.</p>
<p><strong>4 phases :</strong></p>
<ol>
<li><strong>Prophase :</strong> les chromosomes se condensent.</li>
<li><strong>Métaphase :</strong> les chromosomes s'alignent sur la plaque équatoriale.</li>
<li><strong>Anaphase :</strong> les chromatides se séparent.</li>
<li><strong>Télophase :</strong> les noyaux se reforment, la cellule se divise.</li>
</ol>
</div>
<img src="images/Biologie1_8.jpg" alt="Les étapes de la mitose" data-image-id="Biologie1_8" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Schématiser les quatre phases en montrant la condensation, l'alignement, la séparation et la formation des deux noyaux.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Quand une personne se coupe, les cellules de la peau se divisent par mitose pour refermer la plaie.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les quatre phases de la mitose dans l'ordre.</p>
<details><summary>Corrigé</summary>
<p>Prophase, métaphase, anaphase, télophase.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La mitose est une division conservatrice qui assure la croissance, le renouvellement et la réparation des tissus.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Biologie (DIPROMAD).</div>
    `
},
{
    title: "Leçon 6 — Les appareils reproducteurs",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment l'être humain peut-il transmettre la vie ? Quels organes interviennent dans la reproduction ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Identifier les organes de l'appareil reproducteur masculin et féminin. Comprendre leurs fonctions. Adopter un vocabulaire scientifique et respectueux.</p>
</div>

    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
