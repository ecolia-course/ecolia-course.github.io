const COURSE_TITLE = "Chimie pharmaceutique";
const slides = [
{
    title: "Sommaire — Chimie pharmaceutique",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>La chimie pharmaceutique étudie la molécule médicamenteuse : sa structure, ses propriétés et sa préparation. Ce cours est une initiation adaptée au niveau de 1re année.</p>
<p><strong>Note de positionnement :</strong> la chimie pharmaceutique est normalement enseignée en 2e année (voire à l'université). Ce plan est une initiation adaptée ; il ne couvre pas la synthèse organique avancée ni l'analyse instrumentale.</p>
<ul>
<li>Leçon 1 — Qu'est-ce que la chimie pharmaceutique ?</li>
<li>Leçon 2 — Principe actif et excipients</li>
<li>Leçon 3 — Structure chimique et activité : notions de base</li>
<li>Leçon 4 — Grandes familles chimiques de médicaments (exemples)</li>
<li>Leçon 5 — Sources des principes actifs : synthèse et pharmacopée</li>
</ul>
<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme national de chimie (RDC, 2005/2009) pour le socle chimique ; référentiels ISTM (niveau supérieur) ; ouvrages de chimie pharmaceutique (Wehrlé, Le Hir) ; OMS (qualité des médicaments).</div>
    `
},
{
    title: "Partie 1 — Fondements et composants",
    content: `
<div class="bloc theorie"><div class="bloc-label">Partie 1</div>
<p><strong>Objectif de la partie :</strong> définir la chimie pharmaceutique, distinguer principe actif et excipient, comprendre la relation structure-activité.</p>
<h3>Leçons de cette partie</h3>
<ul>
<li>Leçon 1 — Qu'est-ce que la chimie pharmaceutique ?</li>
<li>Leçon 2 — Principe actif et excipients</li>
<li>Leçon 3 — Structure chimique et activité : notions de base</li>
</ul>
</div>
    `
},
{
    title: "Leçon 1 — Qu'est-ce que la chimie pharmaceutique ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Dans une pharmacie de quartier, un client demande un médicament pour la fièvre. Le pharmacien propose deux boîtes dont les principes actifs sont différents. Pourquoi deux médicaments peuvent-ils avoir le même effet affiché mais des compositions chimiques distinctes ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la chimie pharmaceutique. La situer dans la chaîne du médicament. Distinguer chimie pharmaceutique et pharmacologie.</p></div>

<div class="bloc theorie"><div class="bloc-label">Développement</div>
<p>La <strong>chimie pharmaceutique</strong> (ou chimie médicinale) est la discipline qui étudie les molécules utilisées comme médicaments : leur structure, leurs propriétés, leur préparation et leur relation avec l'activité thérapeutique.</p>
<p>Un <strong>médicament</strong> = principe actif + excipients. La chimie pharmaceutique relie la chimie et la pharmacologie. Elle intervient dans la conception, la synthèse, la purification et le contrôle des molécules. Elle ne se confond pas avec la pharmacologie, qui étudie les effets sur l'organisme, ni avec la galénique, qui met en forme.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Chimie pharmaceutique :</strong> science de la molécule médicamenteuse. <strong>Médicament :</strong> principe actif + excipients. <strong>Pharmacologie :</strong> étude des effets sur l'organisme.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemples RDC</div>
<p>Le paracétamol (antalgique) et l'artéméther (antipaludéen) sont des molécules chimiquement différentes ; la quinine, issue d'un arbre, a longtemps été produite localement.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> En quoi la chimie pharmaceutique diffère-t-elle de la pharmacologie ?</p>
<p><strong>Ex. 2 :</strong> Citez deux étapes où la chimie intervient.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> La chimie pharmaceutique étudie la molécule ; la pharmacologie étudie ses effets sur l'organisme.</p>
<p><strong>2)</strong> Conception, synthèse, purification, contrôle (2 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La chimie pharmaceutique est la science de la molécule médicamenteuse ; elle précède la mise en forme et l'usage clinique.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de chimie (RDC) ; référentiels ISTM.</div>
    `
},
{
    title: "Leçon 2 — Principe actif et excipients",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Sur une boîte de comprimés, on lit : principe actif : 500 mg ; excipients : amidon, lactose, stéarate de magnésium. Un élève demande pourquoi ne pas avaler seulement le principe actif. »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer principe actif et excipient. Expliquer le rôle des excipients. Identifier les composants sur une notice simplifiée.</p></div>

<div class="bloc theorie"><div class="bloc-label">Développement</div>
<p>Le <strong>principe actif</strong> est la substance responsable de l'effet thérapeutique. Les <strong>excipients</strong> sont des substances auxiliaires : liant, diluant, désagrégeant, lubrifiant, arôme, conservateur.</p>
<p>Ils ne sont pas « inactifs » : ils peuvent influencer la libération du principe actif. La qualité des deux composants est essentielle.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Principe actif :</strong> molécule active. <strong>Excipient :</strong> substance auxiliaire. <strong>Dosage :</strong> quantité de principe actif.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemples RDC</div>
<p>Comprimés de paracétamol (principe actif + amidon) ; sirop (principe actif + sucre + eau purifiée + conservateur) ; pommade (principe actif + vaseline).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la différence entre principe actif et excipient ?</p>
<p><strong>Ex. 2 :</strong> Donnez deux rôles d'un excipient.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Le principe actif a l'effet thérapeutique ; l'excipient est auxiliaire.</p>
<p><strong>2)</strong> Faciliter la fabrication ; conserver le médicament ; améliorer le goût (2 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un médicament est un ensemble : principe actif + excipients. Les deux doivent être de qualité.</p></div>

<div class="sources"><strong>Sources :</strong> Ouvrages de chimie pharmaceutique ; programme national de chimie.</div>
    `
},
{
    title: "Leçon 3 — Structure chimique et activité : notions de base",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Deux médicaments très proches par leur formule sont vendus dans deux pharmacies ; l'un est plus efficace que l'autre selon les témoignages. Peut-on expliquer cela par la structure chimique ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre que la structure d'une molécule influence son activité. Reconnaître quelques groupes fonctionnels simples. Expliquer pourquoi de petites modifications peuvent changer l'effet.</p></div>

<div class="bloc theorie"><div class="bloc-label">Développement</div>
<p>L'activité d'un médicament dépend de sa forme tridimensionnelle et des groupes chimiques qu'il porte.</p>
<p>Une petite modification (ajout d'un groupe, changement de position) peut modifier la fixation sur la cible et donc l'effet. C'est le principe de la conception de nouveaux médicaments.</p>
<p><strong>Groupes fonctionnels :</strong> alcool, acide carboxylique, amine, etc. <strong>Relation structure-activité (SAR) :</strong> lien entre structure et effet.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Structure :</strong> arrangement des atomes. <strong>Groupe fonctionnel :</strong> ensemble d'atomes avec propriétés propres. <strong>Analogue structural :</strong> molécule proche. <strong>SAR :</strong> relation structure-activité.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemples RDC</div>
<p>La quinine et ses dérivés ; les différents sels d'un même principe actif ; les antipaludéens de synthèse.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Pourquoi deux molécules proches peuvent-elles avoir des effets différents ?</p>
<p><strong>Ex. 2 :</strong> Qu'est-ce qu'un groupe fonctionnel ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Parce que la structure influence la fixation sur la cible.</p>
<p><strong>2)</strong> Un ensemble d'atomes qui donne des propriétés chimiques.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La structure n'est pas un détail : elle détermine l'interaction avec la cible et donc l'activité.</p></div>

<div class="sources"><strong>Sources :</strong> Cours universitaires de chimie pharmaceutique ; notions de chimie organique.</div>
    `
},
{
    title: "Partie 2 — Familles et sources",
    content: `
<div class="bloc theorie"><div class="bloc-label">Partie 2</div>
<p><strong>Objectif de la partie :</strong> connaître les grandes familles chimiques et comprendre l'origine des principes actifs (synthèse et pharmacopée).</p>
<h3>Leçons de cette partie</h3>
<ul>
<li>Leçon 4 — Grandes familles chimiques de médicaments (exemples)</li>
<li>Leçon 5 — Sources des principes actifs : synthèse et pharmacopée</li>
</ul>
</div>
    `
},
{
    title: "Leçon 4 — Grandes familles chimiques de médicaments (exemples)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Dans une campagne de sensibilisation, on présente trois médicaments : un comprimé blanc, une gélule et un sirop. Comment savoir à quelle famille chimique ils appartiennent sans les goûter ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Citer quelques grandes familles (antalgiques, antipaludéens, antibiotiques). Associer une famille à un exemple de molécule. Comprendre que la famille chimique ne détermine pas à elle seule l'usage.</p></div>

<div class="bloc theorie"><div class="bloc-label">Développement</div>
<p>Les molécules sont regroupées par analogies de structure et/ou d'activité. Une même famille chimique peut avoir des usages variés ; un même usage peut mobiliser des familles différentes.</p>
<p><strong>Familles et classes :</strong></p>
<ul>
<li><strong>Antalgiques :</strong> paracétamol.</li>
<li><strong>Antipaludéens :</strong> artéméther, artésunate.</li>
<li><strong>Antibiotiques :</strong> amoxicilline.</li>
<li><strong>Anti-inflammatoires :</strong> aspirine.</li>
</ul>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Famille chimique :</strong> groupe de molécules de structure proche. <strong>Classe thérapeutique :</strong> groupe d'usage. <strong>Antalgique :</strong> contre la douleur.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemples RDC</div>
<p>Paracétamol (antalgique) ; artéméther / artésunate (antipaludéens) ; amoxicilline (antibiotique) ; acide acétylsalicylique (aspirine). Toujours dans un cadre descriptif, sans conseil de traitement.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Le paracétamol appartient à quelle grande famille d'usage ?</p>
<p><strong>Ex. 2 :</strong> Un antibiotique est-il efficace contre un virus ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Antalgique.</p>
<p><strong>2)</strong> Non, il agit sur les bactéries.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les familles chimiques structurent la connaissance des médicaments ; elles ne remplacent pas l'évaluation clinique.</p></div>

<div class="sources"><strong>Sources :</strong> Sources universitaires de chimie pharmaceutique ; OMS.</div>
    `
},
{
    title: "Leçon 5 — Sources des principes actifs : synthèse et pharmacopée",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un tradipraticien prépare une décoction à partir d'une écorce ; un pharmacien vend un comprimé contenant une molécule de synthèse. Les deux prétendent soigner la même maladie. Comment comparer ces deux approches sur le plan chimique ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer principe actif d'origine naturelle et de synthèse. Citer des exemples congolais de plantes médicinales. Expliquer l'importance du contrôle qualité.</p></div>

<div class="bloc theorie"><div class="bloc-label">Développement</div>
<p>De nombreuses molécules viennent des plantes (quinine, morphine, artémisinine). La chimie permet d'isoler, de purifier, de modifier et de produire en quantité contrôlée.</p>
<p>La <strong>pharmacopée traditionnelle</strong> reste une source importante, mais elle nécessite des études de qualité et de sécurité. La <strong>contrefaçon</strong> est un danger majeur en RDC.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Pharmacopée :</strong> savoirs sur les médicaments. <strong>Hémisynthèse :</strong> modification d'une molécule naturelle. <strong>Synthèse totale :</strong> fabrication chimique complète. <strong>Standardisation :</strong> teneur régulière. <strong>Contrefaçon :</strong> faux médicament.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemples RDC</div>
<p>Rauvolfia (réserpine), Cinchona (quinine), Artemisia (artémisinine) ; plantes utilisées localement contre le paludisme ou la fièvre ; importance des tests de qualité des médicaments vendus sur les marchés.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Citez une molécule issue d'une plante.</p>

    function cur() { try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {} return 0; }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
