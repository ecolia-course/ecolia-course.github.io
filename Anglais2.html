const slides = [
{
    title: "Sommaire — Anglais",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours d'anglais couvre cinq compétences essentielles de la 2e année des humanités : parler de sa routine, lire des textes narratifs courts, raconter au passé, enrichir son vocabulaire du quotidien et rédiger un paragraphe structuré. Objectif de vocabulaire actif : environ 1 000 mots.</p>
<p><strong>Note :</strong> ce cours s'appuie sur le Programme National d'Anglais (EDIDEPS 2007) et sur les manuels disponibles. La répartition officielle exacte des unités pour la 4e année (2e anglais) n'a pas été confirmée sur le document intégral.</p>
<ul>
<li>Lesson 1 — Talking about daily routines (present simple vs present continuous)</li>
<li>Lesson 2 — Reading comprehension (short narrative texts)</li>
<li>Lesson 3 — Grammar: the past simple</li>
<li>Lesson 4 — Vocabulary: food, health and the market</li>
<li>Lesson 5 — Writing: a short paragraph about myself</li>
</ul>
<p>Une évaluation finale de 20 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme National d'Anglais EDIDEPS 2007 (RDC) ; manuel « Enjoy English Book 3 » (Jonas Mualaba Citala, LAHA Éditions) ; manuel English Book Level 2 Secondaire (RDC).</div>
    `
},
{
    title: "Lesson 1 — Talking about daily routines (present simple vs present continuous)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« How do you talk about what you do every day versus what you are doing right now? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Utiliser le present simple et le present continuous. Placer correctement les adverbes de fréquence. Distinguer action habituelle et action en cours. Prérequis : structures de base de la 1re année.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Present simple</strong> → habitudes, vérités générales, routines.</p>
<ul>
<li>Forme affirmative : sujet + base verbale (+ s à la 3e pers. sing.). Ex. : <em>I walk. He walks.</em></li>
<li>Forme négative : sujet + do/does not + base verbale. Ex. : <em>She does not walk.</em></li>
<li>Forme interrogative : Do/Does + sujet + base verbale. Ex. : <em>Does he walk to school?</em></li>
<li>Adverbes de fréquence : always, usually, often, sometimes, rarely, never.</li>
</ul>
<p><strong>Present continuous</strong> → action en train de se passer maintenant.</p>
<ul>
<li>Forme : sujet + be (am/is/are) + verbe-ing. Ex. : <em>They are playing.</em></li>
<li>Marqueurs : now, at the moment, right now, today.</li>
</ul>
<p>Règle simple : <strong>adverbe de fréquence → present simple ; « now / at the moment » → present continuous</strong>.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Routine :</strong> habitude quotidienne. <strong>Present continuous :</strong> action en cours. <strong>Adverbe de fréquence :</strong> always, often, sometimes…</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Repérer le marqueur de temps. S'il y a « every day / usually / always » → present simple. S'il y a « now / at the moment / today » → present continuous. Vérifier le -s à la 3e personne.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>« Every morning, Kofi walks to school. Today, he is taking a moto because it is raining. » — « walks » = habitude (present simple) ; « is taking / is raining » = action en cours (present continuous).</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Complète : « She ___ (go) to school every day. » <strong>Ex. 2 :</strong> Complète : « Look! They ___ (play) football now. »</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> goes. <strong>2)</strong> are playing.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Présent simple = habitude ; présent continu = maintenant. Attention au -s à la 3e personne.</p></div>

<div class="sources"><strong>Sources :</strong> Programme National d'Anglais EDIDEPS 2007 ; manuel « Enjoy English Book 3 ».</div>
    `
},
{
    title: "Lesson 2 — Reading comprehension (short narrative texts)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« How can I understand an English text without translating every word? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Développer les stratégies de lecture. Identifier personnages, lieu et événements. Deviner le sens des mots en contexte. Prérequis : lesson 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Deux stratégies essentielles :</p>
<ul>
<li><strong>Skimming :</strong> lire rapidement pour saisir le sens global (titre, premier paragraphe, mots répétés).</li>
<li><strong>Scanning :</strong> chercher une information précise (un nom, un chiffre, une date).</li>
</ul>
<p><strong>Méthode :</strong> lire d'abord pour le sens général, puis chercher les détails demandés. Ne pas bloquer sur un mot inconnu : utiliser le contexte, les mots voisins, la logique de la phrase.</p>
<p><strong>Repérage :</strong> personnages (Who?), lieu (Where?), événements (What happened?), ordre chronologique (First / Then / Finally).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Skimming :</strong> lecture rapide pour le sens global. <strong>Scanning :</strong> recherche d'une information précise. <strong>Contexte :</strong> environnement du mot qui aide à en deviner le sens.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Lire le titre et le premier paragraphe. Repérer les noms propres (personnages, lieux). Chercher les verbes d'action. Ne pas traduire mot à mot. Relire les questions avant de chercher les détails.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>« Mary goes to the market. She buys cassava and fish. » — Skimming : Mary achète de la nourriture au marché. Scanning pour « What does Mary buy? » → cassava and fish. Le contexte aide à comprendre « cassava » même si on ne le connaît pas encore.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle stratégie utiliser pour trouver une date précise dans un texte ? <strong>Ex. 2 :</strong> Faut-il traduire chaque mot pour comprendre un texte ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Scanning. <strong>2)</strong> Non : le contexte suffit pour le sens global.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le contexte aide à deviner le sens d'un mot ; ne pas bloquer sur un mot inconnu.</p></div>

<div class="sources"><strong>Sources :</strong> Programme National d'Anglais EDIDEPS 2007 ; manuel English Book Level 2 Secondaire.</div>
    `
},
{
    title: "Lesson 3 — Grammar: the past simple",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« How do you tell a story about last weekend in English? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Former le past simple (verbes réguliers et irréguliers). Utiliser les formes négatives et interrogatives. Employer les marqueurs temporels du passé. Prérequis : lessons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Past simple</strong> : action terminée dans le passé.</p>
<ul>
<li><strong>Verbes réguliers :</strong> base + -ed. Ex. : <em>walk → walked, study → studied, play → played.</em></li>
<li><strong>Verbes irréguliers courants :</strong> <em>go → went, see → saw, buy → bought, eat → ate, have → had, do → did, be → was/were.</em></li>
<li><strong>Négation :</strong> sujet + did not (didn't) + base verbale. Ex. : <em>She didn't go.</em></li>
<li><strong>Interrogation :</strong> Did + sujet + base verbale. Ex. : <em>Did you see him?</em></li>
<li><strong>Marqueurs :</strong> yesterday, last week, last year, in 2020, two days ago.</li>
</ul>
<p><strong>Erreur fréquente :</strong> utiliser « did » avec un verbe déjà au passé (« did went » au lieu de « went »). Avec « did », le verbe reste à la base verbale.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Past simple :</strong> temps du passé terminé. <strong>Verbe irrégulier :</strong> verbe dont la forme passée ne suit pas la règle -ed. <strong>Marqueur temporel :</strong> mot qui indique quand (yesterday, last week…).</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier le verbe. Vérifier s'il est régulier ou irrégulier. S'il est précédé de did/didn't, laisser la base verbale. Se relire : pas de « did went ».</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>« Last year, we visited the National Museum in Kinshasa. We saw old masks and learned about our history. » — « visited » et « learned » (réguliers), « saw » (irrégulier).</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Mets au past simple : « I go to school. » <strong>Ex. 2 :</strong> Complète : « She ___ (not / study) yesterday. »</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> I went to school. <strong>2)</strong> She didn't study yesterday.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Did + base verbale pour les questions et négations ; jamais « did went ».</p></div>

<div class="sources"><strong>Sources :</strong> Programme National d'Anglais EDIDEPS 2007 ; manuel « Enjoy English Book 3 ».</div>
    `
},
{
    title: "Lesson 4 — Vocabulary: food, health and the market",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« How do you buy food at the market or describe a health problem in English? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Acquérir le lexique de l'alimentation, de la santé et du marché. Utiliser ces mots dans des situations concrètes. Prérequis : lessons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Food :</strong> cassava (manioc), plantain (banane plantain), beans (haricots), fish (poisson), rice (riz), oil (huile), fruit (fruit), vegetables (légumes).</p>
<p><strong>Health :</strong> headache (mal de tête), fever (fièvre), cough (toux), stomach ache (mal de ventre), medicine (médicament), doctor (médecin), hospital (hôpital).</p>
<p><strong>Market :</strong> price (prix), cheap (bon marché), expensive (cher), buy (acheter), sell (vendre), how much (combien), money (argent).</p>
<p><strong>Phrases utiles :</strong> « How much is this cassava? — It's 500 francs. — That's cheap! » — « I have a headache. — You should take medicine. »</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Cheap :</strong> bon marché. <strong>Expensive :</strong> cher. <strong>Symptoms :</strong> signes d'une maladie (headache, fever…).</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Associer chaque mot à une image ou à une situation concrète. Répéter à voix haute. Utiliser les mots nouveaux dans de courtes phrases (jeu de rôle).</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Dialogue au marché : « How much is this cassava? — It's 500 francs. — That's cheap! I'll take three. » À la maison : « I have a fever. — You should take medicine and rest. »</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Traduis « cheap » et « expensive ». <strong>Ex. 2 :</strong> Que dit-on quand on a mal à la tête ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Cheap = bon marché ; expensive = cher. <strong>2)</strong> « I have a headache. »</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Associer chaque mot à une image ou à une situation concrète : c'est ainsi qu'on mémorise durablement.</p></div>

<div class="sources"><strong>Sources :</strong> Programme National d'Anglais EDIDEPS 2007 ; manuel English Book Level 2 Secondaire.</div>
    `
},
{
    title: "Lesson 5 — Writing: a short paragraph about myself",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« How do you introduce yourself in a clear, well-organized English paragraph? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Structurer un paragraphe. Utiliser des connecteurs simples. Écrire des phrases courtes et correctes. Prérequis : lessons 1 à 4.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Un paragraphe cohérent</strong> développe une idée principale. Il comprend :</p>
<ol>
<li><strong>Topic sentence :</strong> phrase qui annonce l'idée principale.</li>
<li><strong>Supporting sentences :</strong> phrases qui développent l'idée.</li>
<li><strong>Concluding sentence :</strong> phrase de conclusion.</li>
</ol>
<p><strong>Connecteurs simples :</strong> and, but, because, also, then.</p>
<p><strong>Conseils :</strong> une idée par phrase ; phrases courtes mais correctes ; ponctuation ; éviter la répétition de « I » en variant les sujets.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Topic sentence :</strong> phrase qui annonce l'idée principale. <strong>Paragraphe :</strong> groupe de phrases autour d'une idée. <strong>Connecteur :</strong> mot qui relie deux idées.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

 see him? Marqueurs: yesterday, last week, last year, in 2020, two days ago."],["fr","Erreur fréquente: utiliser « did » avec un verbe déjà au passé (« did went » au lieu de « went »). Avec « did », le verbe reste à la base verbale. Définitions. Past simple: temps du passé terminé. Verbe irrégulier: verbe dont la forme passée ne suit pas la règle -ed. Marqueur temporel: mot qui indique quand (yesterday, last week…). Méthodes et règles. Identifier le verbe. Vérifier s'il est régulier ou irrégulier. S'il est précédé de did ou didn't, laisser la base verbale. Se relire: pas de « did went »."],["en","Exemple. « Last year, we visited the National Museum in Kinshasa. We saw old masks and learned about our history. »."],["fr","« visited » et « learned » (réguliers), « saw » (irrégulier)."],["en","Exercices. Ex. 1: Mets au past simple: « I go to school. » Ex. 2: Complète: « She ___ (not or study) yesterday. »."],["fr","Corrigé."],["en","1) I went to school. 2) She didn't study yesterday."],["fr","À retenir. Did plus base verbale pour les questions et négations; jamais « did went »."]],"5":[["en","Lesson 4. Vocabulary: food, health and the market. Situation. « How do you buy food at the market or describe a health problem in English? ». Objectifs."],["fr","Acquérir le lexique de l'alimentation, de la santé et du marché. Utiliser ces mots dans des situations concrètes. Prérequis: lessons 1 à 3."],["en","Theory."],["fr","Food: cassava (manioc), plantain (banane plantain), beans (haricots), fish (poisson), rice (riz), oil (huile), fruit (fruit), vegetables (légumes). Health: headache (mal de tête), fever (fièvre), cough (toux), stomach ache (mal de ventre), medicine (médicament), doctor (médecin), hospital (hôpital)."],["en","Market: price (prix), cheap (bon marché), expensive (cher), buy (acheter), sell (vendre), how much (combien), money (argent). Phrases utiles: « How much is this cassava?"],["fr","It's 500 francs."],["en","That's cheap!"],["fr","»."],["en","« I have a headache. You should take medicine."],["fr","». Définitions. Cheap: bon marché."],["en","Expensive: cher. Symptoms: signes d'une maladie (headache, fever…)."],["fr","Méthodes et règles. Associer chaque mot à une image ou à une situation concrète. Répéter à voix haute. Utiliser les mots nouveaux dans de courtes phrases (jeu de rôle)."],["en","Exemple. Dialogue au marché: « How much is this cassava?"],["fr","It's 500 francs."],["en","That's cheap!"],["fr","I'll take three."],["en","» À la maison: « I have a fever. You should take medicine and rest."],["fr","»."],["en","Exercices. Ex."],["fr","1: Traduis « cheap » et « expensive »."],["en","Ex."],["fr","2: Que dit-on quand on a mal à la tête? Corrigé. 1) Cheap égale bon marché; expensive égale cher."],["en","2) « I have a headache. »."],["fr","À retenir. Associer chaque mot à une image ou à une situation concrète: c'est ainsi qu'on mémorise durablement."]],"6":[["en","Lesson 5. Writing: a short paragraph about myself. Situation. « How do you introduce yourself in a clear, well-organized English paragraph? ». Objectifs."],["fr","Structurer un paragraphe. Utiliser des connecteurs simples. Écrire des phrases courtes et correctes. Prérequis: lessons 1 à 4."],["en","Theory."],["fr","Un paragraphe cohérent développe une idée principale. Il comprend: Topic sentence: phrase qui annonce l'idée principale. Supporting sentences: phrases qui développent l'idée. Concluding sentence: phrase de conclusion."],["en","Connecteurs simples: and, but, because, also, then."],["fr","Conseils: une idée par phrase; phrases courtes mais correctes; ponctuation; éviter la répétition de « I » en variant les sujets. Définitions. Topic sentence: phrase qui annonce l'idée principale. Paragraphe: groupe de phrases autour d'une idée. Connecteur: mot qui relie deux idées. Méthodes et règles. Choisir l'idée principale. Écrire la topic sentence. Ajouter 4 à 6 phrases (nom, âge, lieu, école, loisirs, rêve). Terminer par une conclusion. Se relire pour la ponctuation et les majuscules."],["en","Exemple. « My name is Amina. I live in Lubumbashi with my family. I am fifteen years old and I study at Mwangaza School. I like playing football because it is fun and it keeps me healthy. I also enjoy reading stories. My dream is to become a nurse and help my community. ». Exercices. Ex."],["fr","1: Rédige un paragraphe de 8 à 10 phrases sur toi-même."],["en","Ex."],["fr","2: Souligne la topic sentence de ton paragraphe. Corrigé. 1) Réponse libre; vérifier la structure (topic sentence plus développement plus conclusion), la ponctuation et la correction grammaticale. 2) Réponse libre. À retenir. Une idée par phrase; un paragraphe égale une idée principale annoncée par la topic sentence."]],"7":[["en","Final evaluation."],["fr","Anglais. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 12 sur 20, tu as réussi."]]}};

    function pickVoice(lang) {

    function hardSplit(text, max) {

      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
</html>
