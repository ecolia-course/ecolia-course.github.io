    title: "Leçon 1 — Qu'est-ce que la dactylographie et la bureautique ?",

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certains secrétaires tapent-ils très vite ? Que fait-on avec un ordinateur au bureau ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la dactylographie et la bureautique. Distinguer leurs domaines. Comprendre leur utilité. Prérequis : aucun.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>dactylographie</strong> est l'art de taper à la machine (ou à l'ordinateur) avec rapidité et précision, en utilisant les dix doigts sans regarder le clavier (frappe à l'aveugle).</p>
<p>La <strong>bureautique</strong> est l'ensemble des logiciels et outils informatiques utilisés au bureau : traitement de texte, tableur, présentation, messagerie, gestion de fichiers.</p>
<p><strong>Utilité :</strong> rédiger des documents, faire des calculs, préparer des présentations, gérer des données, communiquer. Dans le secrétariat et l'administration, ces compétences sont indispensables. <strong>Qualités :</strong> rapidité, précision, organisation, rigueur, sécurité.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Dactylographie :</strong> art de taper à l'aveugle. <strong>Bureautique :</strong> logiciels de bureau. <strong>Frappe à l'aveugle :</strong> taper sans regarder le clavier. <strong>Traitement de texte :</strong> logiciel de rédaction. <strong>Tableur :</strong> logiciel de calcul.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>S'entraîner régulièrement. Respecter la posture. Utiliser les dix doigts. Sauvegarder régulièrement.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un secrétaire qui tape à 50 mots par minute, sans faute, est beaucoup plus efficace qu'un débutant qui tape à 15 mots par minute en regardant ses doigts. Une entreprise qui utilise un tableur pour calculer ses ventes gagne du temps et évite les erreurs.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis la dactylographie.</p>
<p><strong>Ex. 2 :</strong> Cite trois logiciels de bureautique.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> L'art de taper à l'aveugle avec rapidité et précision.</p>
<p><strong>2)</strong> Traitement de texte, tableur, présentation (3 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La dactylographie et la bureautique sont les outils de base du travail administratif moderne.</p></div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Quelles sont les différentes parties du clavier ? À quoi servent les touches Ctrl, Alt, Maj, Entrée ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les zones du clavier. Connaître les touches principales. Utiliser les raccourcis. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le clavier comporte plusieurs zones :</p>
<ul>
<li><strong>Zone alphabétique :</strong> lettres, la plus utilisée.</li>
<li><strong>Zone numérique (pavé numérique) :</strong> chiffres, opérations.</li>
<li><strong>Touches de fonction (F1 à F12) :</strong> raccourcis.</li>
<li><strong>Touches de contrôle :</strong> Ctrl, Alt, Maj (Shift), Verr Maj (Caps Lock), Tab, Entrée, Retour arrière, Suppr, Échap.</li>
<li><strong>Touches de direction :</strong> flèches.</li>
</ul>
<p><strong>Touches importantes :</strong> Entrée (valider, aller à la ligne) ; Retour arrière (effacer à gauche) ; Suppr (effacer à droite) ; Maj (majuscule temporaire) ; Verr Maj (majuscules permanentes) ; Ctrl, Alt (raccourcis).</p>
<p><strong>Raccourcis essentiels :</strong> Ctrl+C (copier), Ctrl+V (coller), Ctrl+X (couper), Ctrl+Z (annuler), Ctrl+S (enregistrer), Ctrl+P (imprimer), Ctrl+A (tout sélectionner).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Clavier :</strong> périphérique de saisie. <strong>Touche de fonction :</strong> F1 à F12. <strong>Maj :</strong> touche de majuscule. <strong>Raccourci :</strong> combinaison de touches. <strong>Pavé numérique :</strong> zone de chiffres.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi certains secrétaires ont-ils mal au dos ou aux poignets ? Comment travailler sans se fatiguer ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre l'importance de la posture. Adopter une bonne position. Prévenir les risques. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'<strong>ergonomie</strong> est l'adaptation du poste de travail à l'être humain pour préserver la santé et améliorer le confort.</p>
<p><strong>Bonne posture :</strong> dos droit, appuyé contre le dossier ; pieds à plat au sol ; écran à hauteur des yeux, à environ 50-70 cm ; coudes à angle droit, poignets dans le prolongement des avant-bras ; clavier et souris à portée de main.</p>
<p><strong>Prévention :</strong> pauses régulières (toutes les 45-60 minutes), exercices d'étirement, éclairage adapté, aération. <strong>Risques :</strong> maux de dos, tendinites, fatigue oculaire, syndrome du canal carpien.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Ergonomie :</strong> adaptation du poste de travail. <strong>Posture :</strong> position du corps. <strong>Tendinite :</strong> inflammation d'un tendon. <strong>Fatigue oculaire :</strong> fatigue des yeux. <strong>Pause :</strong> moment de repos.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Installer correctement le poste. Adapter la hauteur de la chaise et de l'écran. Faire des pauses. S'étirer régulièrement.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève qui travaille courbé sur son clavier, pendant deux heures sans pause, finit par avoir mal au dos et aux yeux. Un autre, bien installé, avec des pauses, travaille plus longtemps et plus efficacement.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois règles de bonne posture.</p>
<p><strong>Ex. 2 :</strong> Pourquoi faire des pauses ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Dos droit, pieds au sol, écran à hauteur des yeux (3 au choix).</p>
<p><strong>2)</strong> Pour prévenir la fatigue et les troubles musculo-squelettiques.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Une bonne posture et des pauses régulières préservent la santé et améliorent la productivité.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques 2025 ; normes d'ergonomie.</div>
    `

    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment taper sans regarder ses doigts ? Quels doigts utilisent quelles touches ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les doigtés. Maîtriser la rangée de base. Taper sans regarder. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La frappe à l'aveugle repose sur l'attribution de chaque touche à un doigt précis : c'est le <strong>doigté</strong>.</p>
<p><strong>Rangée de base (position de repos) :</strong> les doigts reposent sur les touches Q S D F (main gauche) et J K L M (main droite). Les index sont sur F et J (repères tactiles).</p>
<p><strong>Principe :</strong> les doigts reviennent toujours à la rangée de base après chaque frappe. Chaque doigt est responsable de plusieurs touches (rangée du haut, rangée du bas, touches voisines).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Doigté :</strong> attribution d'une touche à un doigt. <strong>Rangée de base :</strong> position de repos. <strong>Repères tactiles :</strong> petites marques sur F et J. <strong>Frappe à l'aveugle :</strong> sans regarder.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Positionner les doigts sur la rangée de base. Revenir à la position de repos. Ne pas regarder le clavier. S'entraîner régulièrement.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>

<p><strong>2)</strong> Q S D F / J K L M.</p>

</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Combien de mots par minute tape un bon secrétaire ? Comment progresser ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La vitesse de frappe se mesure en <strong>mots par minute</strong> (MPM) ou en <strong>caractères par minute</strong> (CPM).</p>
<p><strong>Niveaux :</strong></p>
<ul>
<li>Débutant : 15-25 MPM.</li>
<li>Intermédiaire : 30-40 MPM.</li>
<li>Professionnel : 50-70 MPM.</li>
<li>Expert : 80 MPM et plus.</li>
</ul>
<p><strong>Facteurs d'amélioration :</strong> régularité, doigtés corrects, frappe à l'aveugle, concentration, posture. <strong>Méthodes :</strong> exercices quotidiens, chronométrage, progression, répétition, texte varié.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>MPM :</strong> mots par minute. <strong>CPM :</strong> caractères par minute. <strong>Vitesse :</strong> rapidité de frappe. <strong>Précision :</strong> absence d'erreurs.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>S'entraîner chaque jour. Mesurer sa vitesse. Corriger les erreurs. Ne pas sacrifier la précision à la vitesse.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un débutant tape 20 MPM avec 5 fautes par paragraphe. Un secrétaire expérimenté tape 60 MPM avec 0 faute. La précision compte autant que la vitesse.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Comment mesure-t-on la vitesse ?</p>
<p><strong>Ex. 2 :</strong> Quel est le niveau professionnel ?</p>

</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La vitesse s'améliore par l'entraînement régulier et la maîtrise des doigtés.</p></div>

<div class="sources"><strong>Sources :</strong> Méthodes de dactylographie ; fiches pédagogiques 2025.</div>

<p><strong>Sources d'erreurs :</strong> doigtés incorrects, précipitation, manque de concentration, position inconfortable.</p>

</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
