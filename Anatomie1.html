    title: "Leçon 1 — Qu'est-ce que l'anatomie et la physiologie ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment le corps est-il construit ? Comment fonctionne-t-il ? Pourquoi le cœur bat-il ? Pourquoi respirons-nous ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir l'anatomie et la physiologie. Distinguer leurs objets. Comprendre leur complémentarité. Prérequis : notions de biologie cellulaire (cours n°13).</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'<strong>anatomie</strong> est la science qui étudie la structure du corps humain : les organes, leur forme, leur position, leurs relations. Elle répond à la question « comment c'est fait ? ».</p>
<p>La <strong>physiologie</strong> est la science qui étudie le fonctionnement du corps humain : le rôle des organes, les mécanismes de la vie. Elle répond à la question « comment ça marche ? ».</p>
<p>Les deux sciences sont complémentaires : on ne peut pas comprendre le fonctionnement d'un organe sans connaître sa structure, et inversement. Par exemple, la structure du cœur (4 cavités, valvules) explique son fonctionnement de pompe.</p>
<p>L'anatomie et la physiologie sont indispensables à l'infirmier : pour comprendre les maladies, réaliser les soins, surveiller les patients, éduquer à la santé.</p>
<p><strong>Niveaux d'organisation :</strong> atomes → molécules → cellules → tissus → organes → systèmes → organisme.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Anatomie :</strong> science de la structure du corps. <strong>Physiologie :</strong> science du fonctionnement du corps. <strong>Organe :</strong> ensemble de tissus qui remplissent une fonction. <strong>Système :</strong> ensemble d'organes qui collaborent à une fonction. <strong>Tissu :</strong> ensemble de cellules de même type.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Observer les schémas anatomiques. Dessiner les organes pour mieux les mémoriser. Relier la structure à la fonction. Utiliser des analogies concrètes (tuyauterie pour les vaisseaux, filtre pour le rein).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>L'estomac a une structure de poche musculeuse (anatomie). Sa fonction est de brasser et de digérer les aliments (physiologie) : la paroi musculaire permet les contractions. Les alvéoles pulmonaires ont une paroi très fine (anatomie), ce qui permet les échanges gazeux (physiologie).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la différence entre anatomie et physiologie ?</p>
<p><strong>Ex. 2 :</strong> Cite les niveaux d'organisation du corps.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> L'anatomie étudie la structure, la physiologie étudie le fonctionnement.</p>
<p><strong>2)</strong> Atomes, molécules, cellules, tissus, organes, systèmes, organisme.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'anatomie et la physiologie sont deux sciences complémentaires qui expliquent comment le corps est construit et comment il fonctionne.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques 2025 ; Dufey (1983).</div>
    `

{
    title: "Leçon 2 — L'organisation générale du corps humain",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Où se trouvent le cœur, les poumons, l'estomac, le foie ? Comment le corps est-il organisé ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les grandes régions du corps. Connaître les cavités. Situer les organes dans les cavités. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le corps humain est organisé en régions :</p>
<ul>
<li>Tête : crâne, face.</li>
<li>Cou : relie la tête au tronc.</li>
<li>Tronc : thorax, abdomen, bassin.</li>
<li>Membres supérieurs : bras, avant-bras, main.</li>
<li>Membres inférieurs : cuisse, jambe, pied.</li>
</ul>
<p><strong>Cavités :</strong> cavité crânienne (cerveau) ; cavité rachidienne (moelle épinière) ; cavité thoracique (cœur, poumons) ; cavité abdominale (estomac, foie, intestins, reins) ; cavité pelvienne (vessie, organes reproducteurs).</p>
<p>Les organes sont protégés par les os (crâne, cage thoracique, bassin) et par les muscles. <strong>Terminologie :</strong> antérieur/postérieur, supérieur/inférieur, médial/latéral, proximal/distal.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Région :</strong> grande partie du corps. <strong>Cavité :</strong> espace interne contenant des organes. <strong>Thorax :</strong> cage thoracique. <strong>Abdomen :</strong> ventre. <strong>Antérieur :</strong> devant. <strong>Postérieur :</strong> derrière.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Situer chaque organe dans sa région et sa cavité. Utiliser les termes anatomiques précis. Représenter le corps par un schéma légendé.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Le cœur est dans la cavité thoracique, derrière le sternum, entre les deux poumons. L'estomac est dans la cavité abdominale, à gauche. Le foie est à droite, sous les côtes.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Dans quelle cavité se trouve le cœur ?</p>
<p><strong>Ex. 2 :</strong> Cite trois régions du corps.</p>

</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'organisation du corps en régions et en cavités permet de situer les organes et de comprendre leur protection.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques 2025 ; Dufey (1983).</div>

    title: "Leçon 3 — Le système squelettique",

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi avons-nous des os ? Combien en avons-nous ? À quoi servent-ils ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les fonctions du squelette. Identifier les types d'os. Comprendre la structure de l'os. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>système squelettique</strong> est l'ensemble des os du corps : 206 os chez l'adulte.</p>
<p><strong>Fonctions :</strong> soutien (maintient le corps debout) ; protection (crâne → cerveau, cage thoracique → cœur et poumons, bassin → vessie et organes reproducteurs) ; mouvement (leviers aux muscles) ; stockage (calcium, phosphore) ; production (moelle osseuse → cellules sanguines).</p>
<p><strong>Types d'os :</strong> os longs (fémur, humérus) ; os courts (poignet, cheville) ; os plats (crâne, sternum, omoplates) ; os irréguliers (vertèbres).</p>
<p><strong>Structure :</strong> périoste (enveloppe), os compact (dur), os spongieux (léger), moelle osseuse (production du sang). <strong>Articulations :</strong> jonctions entre os (fixes, semi-mobiles, mobiles).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Os :</strong> organe dur du squelette. <strong>Articulation :</strong> jonction entre deux os. <strong>Moelle osseuse :</strong> tissu qui produit les cellules sanguines. <strong>Cartilage :</strong> tissu souple qui protège les articulations.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier les os sur un schéma. Classer les os par type. Relier la structure à la fonction.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Le fémur est un os long, le plus solide du corps. Il soutient le poids du corps et sert de levier pour la marche. Le crâne est un ensemble d'os plats soudés qui protègent le cerveau.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Combien d'os compte le squelette adulte ?</p>
<p><strong>Ex. 2 :</strong> Cite trois fonctions du squelette.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> 206 os.</p>
<p><strong>2)</strong> Soutien, protection, mouvement (3 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le squelette soutient, protège, permet le mouvement et produit les cellules sanguines.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques 2025 ; Dufey (1983).</div>
    `

    title: "Leçon 4 — Le système musculaire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment bougeons-nous ? Pourquoi certains muscles sont-ils volontaires et d'autres non ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les types de muscles. Comprendre la contraction musculaire. Identifier les principaux muscles. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>système musculaire</strong> est l'ensemble des muscles du corps : environ 600 muscles squelettiques, représentant 40 à 45 % de la masse corporelle.</p>
<p><strong>Types :</strong> muscles striés squelettiques (attachés aux os, mouvements volontaires : marche, parole) ; muscle lisse (organes internes : estomac, intestin, vaisseaux, mouvements involontaires) ; muscle cardiaque (forme le cœur, mouvements involontaires et rythmés).</p>
<p><strong>Contraction :</strong> le muscle se raccourcit et se gonfle, tirant sur l'os auquel il est attaché par un tendon. La contraction nécessite de l'énergie (ATP) et du calcium.</p>
<p><strong>Muscles principaux :</strong> biceps, triceps, quadriceps, abdominaux, pectoraux, deltoïdes, muscles du visage.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Muscle :</strong> tissu qui se contracte pour produire un mouvement. <strong>Tendon :</strong> tissu qui attache le muscle à l'os. <strong>Contraction :</strong> raccourcissement du muscle. <strong>ATP :</strong> molécule d'énergie.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier les muscles sur un schéma. Distinguer les types de muscles. Relier la contraction au mouvement.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Le biceps se contracte pour plier le coude. Le triceps se contracte pour tendre le bras. Les muscles de l'estomac se contractent pour brasser les aliments, sans que nous en ayons conscience.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite les trois types de muscles.</p>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>système nerveux</strong> est l'ensemble des organes qui permettent la relation et la communication entre l'homme et son milieu.</p>
<p><strong>Deux grandes parties :</strong> système nerveux central (SNC) : cerveau et moelle épinière (contrôle et coordination) ; système nerveux périphérique (SNP) : tous les nerfs du corps (transport des messages).</p>

<p><strong>Fonctions :</strong> réception des informations (sens), analyse, réponse (mouvement, sécrétion).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Système nerveux :</strong> réseau de communication du corps. <strong>Neurone :</strong> cellule nerveuse. <strong>Influx nerveux :</strong> message électrique. <strong>Cerveau :</strong> centre de contrôle. <strong>Moelle épinière :</strong> conduit des messages.</p>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Quand on touche un objet chaud, les récepteurs de la peau envoient un message par les nerfs sensitifs à la moelle épinière, puis au cerveau. Le cerveau commande le retrait de la main par les nerfs moteurs.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>

<p><strong>Ex. 2 :</strong> Qu'est-ce qu'un neurone ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Système nerveux central et système nerveux périphérique.</p>
<p><strong>2)</strong> La cellule du système nerveux qui transmet l'influx nerveux.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le système nerveux reçoit, analyse et commande les réponses du corps.</p></div>

    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment le sang circule-t-il dans le corps ? Pourquoi le cœur bat-il ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les organes du système cardiovasculaire. Comprendre le cycle cardiaque. Distinguer les types de vaisseaux. Prérequis : leçons 1 à 6.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>système cardiovasculaire</strong> comprend le cœur, les vaisseaux sanguins et le sang.</p>
<p>Le <strong>cœur</strong> est une pompe située dans le thorax. Il possède 4 cavités : oreillette droite, oreillette gauche, ventricule droit, ventricule gauche. <strong>Cycle cardiaque :</strong> le cœur se contracte 70 à 80 fois par minute ; le cycle comprend la systole (contraction) et la diastole (relâchement) et dure environ 0,8 seconde. Chaque contraction du ventricule gauche envoie 60 à 100 ml de sang dans l'aorte, soit 4 à 7 litres par minute.</p>
<p><strong>Vaisseaux :</strong> artères (sang du cœur vers les organes) ; veines (sang des organes vers le cœur) ; capillaires (échanges).</p>
<p><strong>Circulation :</strong> grande circulation (cœur → organes → cœur) et petite circulation (cœur → poumons → cœur). <strong>Tension artérielle :</strong> pression du sang dans les artères ; <strong>pouls :</strong> battement perçu dans les artères.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Cœur :</strong> pompe musculaire. <strong>Artère :</strong> vaisseau qui part du cœur. <strong>Veine :</strong> vaisseau qui revient au cœur. <strong>Systole :</strong> contraction. <strong>Diastole :</strong> relâchement. <strong>Tension artérielle :</strong> pression du sang.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier les cavités du cœur. Comprendre le trajet du sang. Mesurer le pouls et la tension.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Le sang pauvre en oxygène arrive à l'oreillette droite, passe au ventricule droit, est envoyé aux poumons (petite circulation), revient riche en oxygène à l'oreillette gauche, passe au ventricule gauche, est envoyé dans l'aorte et aux organes (grande circulation).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Combien de cavités a le cœur ?</p>
<p><strong>Ex. 2 :</strong> Quelle est la différence entre artère et veine ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> 4 (2 oreillettes, 2 ventricules).</p>
<p><strong>2)</strong> L'artère part du cœur, la veine y revient.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le système cardiovasculaire assure la circulation du sang, qui transporte l'oxygène et les nutriments vers les organes.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques 2025 ; Schoolap (cœur).</div>

    title: "Leçon 8 — Le système respiratoire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment l'air arrive-t-il aux poumons ? Que se passe-t-il quand on respire ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les organes du système respiratoire. Comprendre les échanges gazeux. Distinguer inspiration et expiration. Prérequis : leçons 1 à 7.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>système respiratoire</strong> apporte l'oxygène au corps et élimine le dioxyde de carbone.</p>
<p><strong>Organes :</strong> voies respiratoires (nez, pharynx, larynx, trachée, bronches, bronchioles) ; poumons (organes spongieux contenant les alvéoles, où se font les échanges gazeux).</p>
<p><strong>Inspiration :</strong> l'air entre dans les poumons. Les muscles intercostaux et le diaphragme se contractent, la cage thoracique s'agrandit, la pression diminue, l'air entre. <strong>Expiration :</strong> l'air sort. Les muscles se relâchent, la cage thoracique se rétrécit, la pression augmente, l'air sort.</p>
<p><strong>Échanges gazeux :</strong> dans les alvéoles, l'oxygène passe dans le sang et le dioxyde de carbone passe du sang à l'air. <strong>Fréquence respiratoire :</strong> 12 à 20 cycles par minute chez l'adulte.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Respiration :</strong> échange gazeux. <strong>Alvéole :</strong> petit sac pulmonaire. <strong>Inspiration :</strong> entrée d'air. <strong>Expiration :</strong> sortie d'air. <strong>Diaphragme :</strong> muscle sous les poumons.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier les organes respiratoires. Comprendre le mécanisme de la respiration. Mesurer la fréquence respiratoire.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Quand on inspire, le diaphragme s'abaisse et les côtes se soulèvent, ce qui agrandit la cage thoracique. L'air entre dans les poumons et arrive aux alvéoles, où l'oxygène passe dans le sang.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quel est le rôle du système respiratoire ?</p>
<p><strong>Ex. 2 :</strong> Où se font les échanges gazeux ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Apporter l'oxygène et éliminer le dioxyde de carbone.</p>
<p><strong>2)</strong> Dans les alvéoles pulmonaires.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le système respiratoire assure les échanges gazeux entre l'air et le sang.</p></div>

<div class="sources"><strong>Sources :</strong> Fiches pédagogiques 2025 ; Dufey (1983).</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment se reproduit l'être humain ? Comment les systèmes du corps collaborent-ils ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les organes reproducteurs. Comprendre leurs fonctions. Saisir l'intégration des systèmes. Prérequis : leçons 1 à 11.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>système reproducteur</strong> permet la reproduction de l'espèce.</p>

<li><strong>Appareil reproducteur féminin :</strong> ovaires (production des ovules), trompes de Fallope, utérus, vagin, vulve.</li>
</ul>

    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }
    function cur() { try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {} return 0; }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
