        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');

ours 88); biologie animale; sensibilisation à la sécurité. Contextualisation R D C. Pêche au fleuve Congo, aux lacs Kivu, Tanganyika, Albert; techniques Wagenia (pêche dans les rapides); fumage du poisson; pirogues et petites embarcations; sécurité sur l'eau. Limites documentaires. Le curriculum officiel de la filière existe, mais son contenu détaillé pour la 1re n'a pas été consulté. Les techniques de capture et de conservation sont documentées par la FAO et des sources congolaises. L'adaptation au niveau 12-14 ans est une sélection prudente. Plan d'images du cours. Identifiant. Leçon. Contenu visuel. Utilité. Emplacement. PecheNavigation1_L1_01. L1. Zones de pêche en R D C (fleuve, lacs). Contexte. Slide 1, bloc cas. PecheNavigation1_L2_01. L2. Engins de pêche artisanale (filet, nasse, ligne). Techniques. Slide 2, bloc théorie. PecheNavigation1_L3_01. L3. Étapes du fumage du poisson. Conservation. Slide 3, bloc exercice. PecheNavigation1_L4_01. L4. Affiche sécurité aquatique (gilet, surcharge). Prévention. Slide 4, bloc résumé. PecheNavigation1_L5_01. L5. Schéma d'une pirogue et des repères de navigation. Navigation. Slide 5, bloc théorie. Identifiants stables et cohérents avec le HTML."]],"2":[["fr","Leçon 1, La pêche en R D C: ressources, acteurs et importance. Situation de départ. Dans un village au bord du fleuve, les pêcheurs rapportent de moins en moins de poissons. Pourtant, la demande augmente. Comment expliquer cette situation? Quelles solutions envisager? Objectifs spécifiques. Définir la pêche et la pisciculture. Identifier les principales ressources halieutiques de la R D C. Expliquer l'importance économique et alimentaire de la pêche. Explication. La R D C dispose d'un réseau hydrographique immense (fleuve Congo, lacs, rivières) et d'une production halieutique importante. La pêche artisanale domine, mais elle fait face à la surpêche, à la pollution et au manque d'équipements. La pisciculture est une alternative à développer. pêche: capture d'organismes aquatiques; pisciculture: élevage de poissons; ressources halieutiques: poissons et autres organismes aquatiques; surpêche: capture excessive qui épuise la ressource; sécurité alimentaire: accès à une nourriture suffisante. [ Image PecheNavigation1_L1_01: zones de pêche en R D C (fleuve, lacs) ]. La R D C dispose d'un réseau hydrographique majeur. Notions et définitions. Pêche: activité de capture des organismes aquatiques. Pisciculture: élevage de poissons. Ressources halieutiques: ressources vivantes des milieux aquatiques. Surpêche: prélèvement excessif. Pêche artisanale: pêche à petite échelle avec engins simples. Pêche industrielle: pêche à grande échelle avec navires. Exemples concrets. Pêche au fleuve Congo. Pêche au lac Kivu. Pisciculture en étangs. Techniques Wagenia dans les rapides. Exercice d'application. Liste trois ressources halieutiques de ta région. Cite deux menaces. Propose une solution pour améliorer la production locale. Corrigé. 1. Réponse variable: poissons, crevettes, mollusques. 2. Surpêche, pollution. 3. Exemple: développer la pisciculture, respecter les mailles réglementaires. À retenir. La pêche est un pilier alimentaire et économique. Elle doit être gérée durablement. La pisciculture est une alternative. Sources utiles. Curriculum Pêche et Navigation (BSF, 2018). Documents FAO sur la politique de pêche en R D C. Limite: l'adaptation en 1re est une simplification."]],"3":[["fr","Leçon 2, Les techniques de capture artisanales. Situation de départ. Un pêcheur utilise un filet à petites mailles. Un autre utilise une nasse. Lesquels capturent plus de poissons? Pourquoi le filet à petites mailles est-il critiqué? Objectifs spécifiques. Identifier les principaux engins de pêche artisanale. Comprendre leur fonctionnement et leur usage. Associer un engin à un milieu. Explication. Les techniques artisanales sont variées: filets (maillants, sennes); nasses (à écopage, à entonnoir); lignes et hameçons; barrages. Chaque engin a un usage spécifique. Les filets à mailles trop petites capturent les juvéniles et menacent la ressource: une maille minimale est nécessaire pour la durabilité. [ Image PecheNavigation1_L2_01: engins de pêche artisanale (filet, nasse, ligne) ]. Chaque engin a un usage adapté au milieu. Notions et définitions. Engin de pêche: outil utilisé pour capturer le poisson. Filet maillant: filet où le poisson se prend par les ouïes. Senne: grand filet encerclant. Nasse: piège en forme de panier. Ligne et hameçon: fil avec crochet. Barrage: obstacle qui retient le poisson. Maille réglementaire: taille minimale des mailles. Exemples concrets. Filet dormant dans le fleuve. Nasses pour les silures. Pêche à la ligne pour les poissons de surface. Barrages dans les marigots. Exercice d'application. Associe cinq engins à leur usage et à un milieu. Explique pourquoi la maille réglementaire est importante. Indique un engin adapté à la pêche en marigot. Corrigé. 1. Filet maillant égale fleuve; nasse égale marigot; ligne égale lac; senne égale lac; barrage égale rivière. 2. Elle permet aux juvéniles de s'échapper et protège la ressource. 3. La nasse ou le barrage. À retenir. Les techniques artisanales sont accessibles. Elles doivent respecter la ressource. La maille réglementaire protège les juvéniles. Sources utiles. FAO (techniques de pêche). Sources congolaises sur la pêche coutumière. Curriculum BSF. Limite: l'adaptation en 1re est une simplification."]],"4":[["fr","Leçon 3, La conservation du poisson: fumage, salage, séchage. Situation de départ. Après une bonne pêche, une partie du poisson pourrit avant d'être vendue. Comment éviter ces pertes? Objectifs spécifiques. Comprendre pourquoi le poisson se dégrade rapidement. Connaître les méthodes de conservation artisanale. Appliquer une méthode simple. Explication. Le poisson est très périssable. La conservation artisanale repose sur: fumage; salage; séchage. Ces méthodes réduisent l'humidité et empêchent le développement des micro-organismes. Le fumage est très répandu en R D C. Une bonne conservation évite les pertes et augmente les revenus. [ Image PecheNavigation1_L3_01: étapes du fumage du poisson ]. La conservation évite les pertes après la pêche. Notions et définitions. Altération: dégradation de l'aliment. Fumage: conservation par la fumée. Salage: conservation par le sel. Séchage: élimination de l'eau. Fermentation: transformation par micro-organismes. Chaîne du froid: conservation au froid. Exemples concrets. Fumage du poisson mboto à Kisangani. Salage et séchage. Vente de poisson fumé sur les marchés. Exercice d'application. Décris les étapes du fumage artisanal. Propose une méthode de conservation pour une petite pêche. Indique deux avantages de la conservation. Corrigé. 1. Préparation du poisson, disposition sur claies, feu doux, durée suffisante. 2. Exemple: fumage ou salage. 3. Éviter les pertes, augmenter les revenus. À retenir. La conservation est la clé de la rentabilité. Fumage, salage et séchage sont accessibles. Elle améliore la sécurité alimentaire. Sources utiles. FAO (conservation du poisson). Fiches de Technologie Agricole. Limite: l'adaptation en 1re est une simplification."]],"5":[["fr","Leçon 4, Sécurité en milieu aquatique. Situation de départ. Deux pêcheurs partent sans gilet de sauvetage sur une pirogue surchargée. Le temps se gâte. Quels sont les risques? Comment les éviter? Objectifs spécifiques. Identifier les risques liés à la pêche et à la navigation. Appliquer les règles de sécurité de base. Connaître les gestes de premiers secours. Explication. La pêche et la navigation comportent des risques: noyade, blessures, intempéries. Règles de base: porter un gilet de sauvetage; ne pas surcharger l'embarcation; vérifier la météo; connaître les gestes de premiers secours. La prévention sauve des vies. [ Image PecheNavigation1_L4_01: affiche sécurité aquatique (gilet, surcharge) ]. La sécurité est une responsabilité individuelle et collective. Notions et définitions. Sécurité aquatique: prévention des accidents en milieu aquatique. Gilet de sauvetage: équipement qui maintient à la surface. Surcharge: trop de poids sur une embarcation. Intempérie: mauvais temps. Premiers secours: gestes d'urgence. Noyade: asphyxie par submersion. Exemples concrets. Naufrages de pirogues sur le fleuve. Pêcheurs emportés par les rapides. Importance des gilets. Exercice d'application. Liste cinq règles de sécurité pour une sortie de pêche. Simule l'appel aux secours. Indique ce qu'il faut faire en cas de chute à l'eau. Corrigé. 1. Gilet, météo, non-surcharge, eau potable, prévenir un proche. 2. Rester calme, appeler, indiquer le lieu. 3. Rester calme, se laisser flotter, rejoindre la berge. À retenir. La sécurité est la première compétence. La prévention sauve des vies. Chacun est responsable. Sources utiles. Documents de sécurité en pêche (FAO, OIT). Curriculum BSF. Limite: l'adaptation en 1re est une simplification."]],"6":[["fr","Leçon 5, Initiation à la navigation: embarcations et repères. Situation de départ. Un jeune pêcheur veut naviguer seul sur le fleuve mais ne connaît pas les courants ni les repères. Que doit-il apprendre avant de partir? Objectifs spécifiques. Identifier les types d'embarcations. Comprendre les éléments de base de la navigation. Connaître les repères sur l'eau. Explication. Naviguer, ce n'est pas seulement ramer: il faut comprendre les courants, reconnaître les repères et maîtriser l'embarcation. Les pirogues et petites barques sont courantes en R D C. pirogue: embarcation traditionnelle; barque à moteur: embarcation motorisée; gouvernail: organe de direction; rame: outil de propulsion; courant: mouvement de l'eau; balise: repère sur l'eau. [ Image PecheNavigation1_L5_01: schéma d'une pirogue et des repères de navigation ]. La navigation exige observation et prudence. Notions et définitions. Embarcation: petit bateau. Pirogue: embarcation traditionnelle. Barque: embarcation plus grande. Moteur hors-bord: moteur extérieur. Gouvernail: dispositif de direction. Rame: outil de propulsion. Courant: mouvement de l'eau. Balise: signal de repérage. Exemples concrets. Pirogues sur le fleuve Congo. Barques à moteur sur le lac Kivu. Navigation de nuit. Exercice d'application. Identifie les parties d'une pirogue sur un schéma. Explique l'effet d'un courant sur la navigation. Cite deux règles de navigation. Corrigé. 1. Proue, poupe, gouvernail, rames. 2. Le courant peut dévier l'embarcation; il faut l'anticiper. 3. Vérifier la météo, ne pas surcharger. À retenir. La navigation exige observation, prudence et connaissance de l'embarcation. Les courants influencent la trajectoire. Les repères aident à se situer. Sources utiles. Curriculum BSF. Documents de navigation fluviale en R D C. Limite: l'adaptation en 1re est une simplification."]],"7":[["fr","Évaluation finale, Pêche et Navigation. Évaluation finale. 36 questions à choix multiple. Une seule réponse est correcte par question. Choisis la réponse qui te semble juste, puis valide."]]}};

          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }   // ancien contenu invalide
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) {
          return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); })
            .then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; });
        },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);

    // ====================================================================
    //  Bannière : invitation, confirmations, progression
    // ====================================================================
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer);
      bnMode = mode;
      txtEl.textContent = text;
      actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; }
      else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }

    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }

    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial"
        ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet."
        : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
