<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>La biochimie clinique étudie les substances chimiques du corps pour diagnostiquer et suivre les maladies. Dans ce cours, tu vas apprendre à connaître les paramètres du sang et des urines (glycémie, cholestérol, créatinine, transaminases), à comprendre les techniques de dosage et à interpréter les résultats. Ces connaissances sont indispensables au technicien de laboratoire pour aider au diagnostic du diabète, de l'insuffisance rénale, des maladies du foie et du cœur.</p>

{
    title: "Leçon 1 — Qu'est-ce que la biochimie clinique ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi analyse-t-on le sang et les urines ? Que peut-on découvrir sur la santé d'une personne ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la biochimie clinique. Distinguer ses domaines. Comprendre son importance pour le technicien de laboratoire. Prérequis : notions de biologie cellulaire (cours n°13) et de physiologie (cours n°52).</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>biochimie clinique</strong> est la branche de la biologie médicale qui étudie les substances chimiques présentes dans les liquides biologiques (sang, urines, liquide céphalo-rachidien, etc.) pour : diagnostiquer les maladies (diabète, insuffisance rénale, hépatites, maladies cardiovasculaires) ; suivre l'évolution des maladies et l'efficacité des traitements ; dépister les facteurs de risque.</p>
<p>Elle comprend l'étude des : <strong>glucides</strong> (glycémie) ; <strong>lipides</strong> (cholestérol, triglycérides) ; <strong>protéines</strong> (albumine, protéines totales) ; <strong>enzymes</strong> (transaminases, phosphatases alcalines) ; <strong>électrolytes</strong> (sodium, potassium, chlore, calcium) ; <strong>substances azotées</strong> (urée, créatinine, acide urique).</p>
<p>Pour le technicien de laboratoire, la biochimie clinique est essentielle : il réalise les dosages, vérifie la qualité des résultats, participe au diagnostic et à la surveillance des traitements. En RDC, les maladies métaboliques (diabète, insuffisance rénale) augmentent, alors que les maladies infectieuses restent dominantes.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Biochimie clinique :</strong> science des substances chimiques dans les liquides biologiques. <strong>Glycémie :</strong> taux de sucre dans le sang. <strong>Cholestérol :</strong> lipide sanguin. <strong>Créatinine :</strong> déchet du métabolisme musculaire. <strong>Transaminases :</strong> enzymes du foie.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Distinguer les domaines de la biochimie clinique. Relier la biochimie clinique à la pratique du laboratoire.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un patient consulte pour une fatigue intense. Le technicien réalise un bilan : la glycémie est élevée, la créatinine aussi. Le médecin suspecte un diabète et une insuffisance rénale.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis la biochimie clinique.</p>
<p><strong>Ex. 2 :</strong> Cite trois paramètres biochimiques.</p>

<p><strong>1)</strong> La science qui étudie les substances chimiques des liquides biologiques pour le diagnostic et le suivi des maladies.</p>
<p><strong>2)</strong> Glycémie, cholestérol, créatinine (3 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La biochimie clinique est la science des marqueurs biologiques ; elle est indispensable au diagnostic.</p></div>

<div class="sources"><strong>Sources :</strong> Programme ISTM/Goma ; référentiels de biochimie clinique.</div>

{
    title: "Leçon 2 — Les biomolécules et le métabolisme",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« De quoi est fait notre corps ? Que deviennent les aliments dans l'organisme ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les grandes biomolécules. Comprendre leur rôle. Situer leur intérêt en biochimie clinique. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les <strong>biomolécules</strong> sont les molécules qui constituent les êtres vivants :</p>
<ul>
<li><strong>Glucides</strong> (sucres) : source d'énergie (glucose).</li>
<li><strong>Lipides</strong> (graisses) : réserve d'énergie, constituants des membranes (cholestérol, triglycérides).</li>
<li><strong>Protéines</strong> : structure, enzymes, transport (albumine, hémoglobine).</li>
<li><strong>Acides nucléiques</strong> : information génétique (ADN, ARN).</li>
<li><strong>Minéraux</strong> : électrolytes, oligo-éléments.</li>
</ul>
<p>Le <strong>métabolisme</strong> est l'ensemble des réactions chimiques qui se produisent dans l'organisme : <strong>catabolisme</strong> (dégradation des molécules, production d'énergie) ; <strong>anabolisme</strong> (synthèse des molécules, consommation d'énergie).</p>
<p>Les principaux organes du métabolisme sont le foie, le rein, le muscle, le tissu adipeux. La biochimie clinique mesure les produits du métabolisme (glucose, urée, créatinine, acides gras) pour évaluer le fonctionnement des organes.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Biomolécule :</strong> molécule du vivant. <strong>Métabolisme :</strong> ensemble des réactions chimiques. <strong>Catabolisme :</strong> dégradation. <strong>Anabolisme :</strong> synthèse.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier les grandes biomolécules. Comprendre leur rôle. Relier les biomolécules aux paramètres biochimiques.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Le glucose est la principale source d'énergie. Sa concentration dans le sang (glycémie) est régulée par l'insuline. Un dysfonctionnement entraîne un diabète.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois biomolécules.</p>
<p><strong>Ex. 2 :</strong> Qu'est-ce que le métabolisme ?</p>
<details><summary>Corrigé</summary>

</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les biomolécules sont les briques du vivant ; leur métabolisme est au cœur de la biochimie clinique.</p></div>

<div class="sources"><strong>Sources :</strong> Référentiels de biochimie ; programme ISTM/Goma.</div>
    `
},

    title: "Leçon 3 — Le milieu intérieur et l'homéostasie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi le taux de sucre reste-t-il stable dans le sang d'une personne en bonne santé ? Comment le corps régule-t-il son équilibre interne ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir le milieu intérieur. Comprendre l'homéostasie. Relier déséquilibre et maladie. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>milieu intérieur</strong> est l'ensemble des liquides qui baignent les cellules (plasma, liquide interstitiel). Sa composition doit rester stable pour permettre le bon fonctionnement des cellules.</p>
<p>L'<strong>homéostasie</strong> est la capacité de l'organisme à maintenir un équilibre interne stable : température, pH, glycémie, concentration en électrolytes, pression artérielle, hydratation. <strong>Régulation :</strong> par le système nerveux et le système endocrinien (hormones : insuline, aldostérone, ADH).</p>
<p>La maladie survient lorsque l'homéostasie est rompue : hyperglycémie (diabète), hyperkaliémie (insuffisance rénale), acidose, déshydratation. Le rôle du technicien est de mesurer les paramètres de l'homéostasie (glycémie, ionogramme, créatinine) et de signaler les anomalies.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Milieu intérieur :</strong> liquides qui baignent les cellules. <strong>Homéostasie :</strong> équilibre interne. <strong>Hyperglycémie :</strong> sucre élevé. <strong>Hyperkaliémie :</strong> potassium élevé.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Comprendre les mécanismes de régulation. Relier les paramètres à l'homéostasie. Signaler les anomalies.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une glycémie à 4 g/L traduit une rupture de l'homéostasie : c'est une hyperglycémie sévère, signe de diabète décompensé. Le technicien signale immédiatement le résultat.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qu'est-ce que l'homéostasie ?</p>
<p><strong>Ex. 2 :</strong> Cite trois paramètres de l'homéostasie.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> La capacité du corps à maintenir un équilibre interne stable.</p>
<p><strong>2)</strong> Glycémie, température, ionogramme (3 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le milieu intérieur et l'homéostasie sont la base de la santé ; la biochimie clinique les mesure.</p></div>

<div class="sources"><strong>Sources :</strong> Référentiels de physiologie ; programme ISTM/Goma.</div>

    title: "Leçon 4 — La glycémie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qu'est-ce que la glycémie ? Pourquoi le taux de sucre doit-il rester stable ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la glycémie. Connaître les valeurs normales. Comprendre le diabète. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>glycémie</strong> est le taux de glucose dans le sang. <strong>Valeurs normales :</strong> 0,7 à 1,1 g/L à jeun (soit environ 4 à 6 mmol/L).</p>
<p><strong>Régulation :</strong> par l'insuline (hypoglycémiante) et le glucagon (hyperglycémiant), hormones du pancréas.</p>
<p><strong>Anomalies :</strong></p>
<ul>
<li><strong>Hyperglycémie :</strong> glycémie élevée, signe de diabète (à jeun supérieure ou égale à 1,26 g/L à deux reprises).</li>
<li><strong>Hypoglycémie :</strong> glycémie basse (inférieure à 0,5 g/L), danger.</li>
</ul>
<p><strong>Diabète :</strong> maladie chronique liée à un défaut d'insuline. Type 1 (insulino-dépendant), type 2 (résistance à l'insuline), gestationnel. <strong>Diagnostic :</strong> glycémie à jeun, glycémie aléatoire, HbA1c (hémoglobine glyquée), test d'hyperglycémie provoquée.</p>
<p>En RDC, la prévalence du diabète à Kinshasa est de 15,5 % chez les plus de 15 ans.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Glycémie :</strong> taux de sucre dans le sang. <strong>Insuline :</strong> hormone qui fait baisser la glycémie. <strong>HbA1c :</strong> reflet de la glycémie sur 3 mois. <strong>Hyperglycémie :</strong> glycémie élevée.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Doser la glycémie (à jeun, aléatoire). Interpréter les résultats. Signaler les valeurs critiques.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un patient a une glycémie à jeun de 1,8 g/L, confirmée à 1,5 g/L. Le diagnostic de diabète est posé. Le technicien a contribué au diagnostic.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la valeur normale de la glycémie à jeun ?</p>
<p><strong>Ex. 2 :</strong> Quelle hormone fait baisser la glycémie ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> 0,7 à 1,1 g/L.</p>
<p><strong>2)</strong> L'insuline.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La glycémie est un paramètre clé ; son dosage permet de diagnostiquer et de suivre le diabète.</p></div>

<div class="sources"><strong>Sources :</strong> OMS ; programme ISTM/Goma ; données RDC.</div>
    `
},
{
    title: "Leçon 5 — Le bilan lipidique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qu'est-ce que le cholestérol ? Pourquoi un taux élevé est-il dangereux ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir le bilan lipidique. Connaître les paramètres. Comprendre le risque cardiovasculaire. Prérequis : leçons 1 à 4.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>bilan lipidique</strong> mesure les lipides du sang :</p>
<ul>
<li><strong>Cholestérol total.</strong></li>
<li><strong>HDL-cholestérol</strong> (« bon cholestérol », protecteur).</li>
<li><strong>LDL-cholestérol</strong> (« mauvais cholestérol », favorise l'athérosclérose).</li>
<li><strong>Triglycérides.</strong></li>
</ul>
<p><strong>Valeurs normales (ordre de grandeur) :</strong> cholestérol total inférieur à 2 g/L ; LDL inférieur à 1,6 g/L ; HDL supérieur à 0,4 g/L (homme), supérieur à 0,5 g/L (femme) ; triglycérides inférieurs à 1,5 g/L.</p>
<p><strong>Risque cardiovasculaire :</strong> un LDL élevé favorise l'athérosclérose (dépôt de plaque sur les artères), qui peut entraîner infarctus et AVC. <strong>Facteurs de risque :</strong> alimentation riche en graisses saturées, sédentarité, tabac, obésité, diabète. <strong>Prévention :</strong> alimentation équilibrée, activité physique, arrêt du tabac.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Cholestérol :</strong> lipide du sang. <strong>HDL :</strong> bon cholestérol. <strong>LDL :</strong> mauvais cholestérol. <strong>Triglycérides :</strong> graisses de réserve. <strong>Athérosclérose :</strong> dépôt de plaque sur les artères.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Doser les lipides. Interpréter les résultats. Évaluer le risque.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un patient a un LDL à 2,5 g/L et un HDL à 0,3 g/L. Son risque cardiovasculaire est élevé. Le médecin prescrit un régime et un traitement.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quel est le « mauvais cholestérol » ?</p>
<p><strong>Ex. 2 :</strong> Cite trois facteurs de risque d'athérosclérose.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Le LDL.</p>
<p><strong>2)</strong> Alimentation riche en graisses, sédentarité, tabac (3 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le bilan lipidique évalue le risque cardiovasculaire ; le technicien participe au dépistage.</p></div>

<div class="sources"><strong>Sources :</strong> OMS ; programme ISTM/Goma.</div>
    `
},
{
    title: "Leçon 6 — Le bilan rénal",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment savoir si les reins fonctionnent bien ? Quels paramètres mesure-t-on ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir le bilan rénal. Connaître les paramètres. Comprendre l'insuffisance rénale. Prérequis : leçons 1 à 5.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>bilan rénal</strong> évalue la fonction des reins par le dosage de :</p>
<ul>
<li><strong>Créatinine :</strong> déchet du métabolisme musculaire, éliminé par les reins. Valeurs normales : 7-13 mg/L (homme), 6-11 mg/L (femme).</li>
<li><strong>Urée :</strong> déchet du métabolisme des protéines. Valeurs normales : 0,15-0,45 g/L.</li>
<li><strong>Clairance de la créatinine :</strong> estimation du débit de filtration glomérulaire (DFG).</li>
<li><strong>Acide urique :</strong> déchet des purines (goutte).</li>
</ul>
<p><strong>Insuffisance rénale :</strong> diminution de la fonction rénale (DFG inférieur à 60 mL/min/1,73 m²). Causes : hypertension, diabète, infections, médicaments. <strong>Conséquences :</strong> accumulation de déchets (urée, créatinine), troubles hydro-électrolytiques, anémie, acidose.</p>
<p>En RDC, l'insuffisance rénale est fréquente (complication de l'HTA et du diabète). L'accès à la dialyse est limité.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Créatinine :</strong> déchet musculaire. <strong>Urée :</strong> déchet protéique. <strong>Clairance :</strong> capacité d'épuration. <strong>DFG :</strong> débit de filtration glomérulaire. <strong>Insuffisance rénale :</strong> diminution de la fonction rénale.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Doser la créatinine et l'urée. Calculer la clairance. Interpréter les résultats.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un patient diabétique a une créatinine à 25 mg/L (élevée). Sa clairance est abaissée. Le diagnostic d'insuffisance rénale chronique est posé.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quel est le principal déchet dosé dans le bilan rénal ?</p>
<p><strong>Ex. 2 :</strong> Qu'est-ce que la clairance ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> La créatinine (ou l'urée).</p>
<p><strong>2)</strong> La capacité des reins à épurer le sang.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le bilan rénal évalue la fonction des reins ; il est essentiel pour détecter l'insuffisance rénale.</p></div>

<div class="sources"><strong>Sources :</strong> OMS ; programme ISTM/Goma.</div>
    `
},

{
    title: "Leçon 7 — Le bilan hépatique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment savoir si le foie fonctionne bien ? Quels paramètres mesure-t-on ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir le bilan hépatique. Connaître les paramètres. Comprendre les atteintes du foie. Prérequis : leçons 1 à 6.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>bilan hépatique</strong> évalue la fonction et l'intégrité du foie par le dosage de :</p>
<ul>
<li><strong>Transaminases :</strong> ALAT (SGPT) et ASAT (SGOT), enzymes libérées lors de la destruction des cellules hépatiques. Valeurs normales : inférieures à 40 UI/L.</li>
<li><strong>Bilirubine :</strong> pigment jaune issu de la dégradation de l'hémoglobine. Une bilirubine élevée provoque un ictère (jaunisse).</li>
<li><strong>Gamma-GT :</strong> enzyme liée aux voies biliaires et à l'alcool.</li>
<li><strong>Phosphatases alcalines :</strong> enzymes des voies biliaires et des os.</li>
<li><strong>Albumine :</strong> protéine produite par le foie ; diminue en cas d'insuffisance hépatique.</li>
</ul>
<p><strong>Atteintes du foie :</strong> hépatites virales (A, B, C, E), stéatose (foie gras), cirrhose, cancer. <strong>Facteurs de risque :</strong> alcool, virus, obésité, médicaments, toxiques. En RDC, les hépatites virales sont fréquentes, et l'alcoolisme est un facteur important.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Transaminases :</strong> enzymes du foie. <strong>Bilirubine :</strong> pigment biliaire. <strong>Ictère :</strong> jaunisse. <strong>Albumine :</strong> protéine hépatique.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Doser les paramètres. Interpréter les résultats. Orienter le patient.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un patient présente un ictère. Le bilan hépatique montre des transaminases à 300 UI/L et une bilirubine à 40 mg/L. Le diagnostic d'hépatite est évoqué.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle enzyme est dosée en priorité pour explorer le foie ?</p>
<p><strong>Ex. 2 :</strong> Qu'est-ce que l'ictère ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Les transaminases.</p>
<p><strong>2)</strong> Un jaunissement de la peau et des yeux.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le bilan hépatique est un outil clé pour détecter les atteintes du foie.</p></div>

<div class="sources"><strong>Sources :</strong> OMS ; programme ISTM/Goma.</div>
    `
},
{
    title: "Leçon 8 — L'ionogramme et les électrolytes",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qu'est-ce qu'un ionogramme ? Pourquoi le sodium et le potassium sont-ils importants ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir l'ionogramme. Connaître les principaux électrolytes. Comprendre les déséquilibres. Prérequis : leçons 1 à 7.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'<strong>ionogramme</strong> mesure les électrolytes du sang (et parfois des urines) : sodium (Na⁺), potassium (K⁺), chlore (Cl⁻), bicarbonates (HCO₃⁻), calcium (Ca²⁺), magnésium (Mg²⁺).</p>
<p><strong>Rôles :</strong> équilibre hydrique, transmission nerveuse, contraction musculaire, équilibre acido-basique.</p>
<p><strong>Principaux déséquilibres :</strong></p>
<ul>
<li><strong>Hyponatrémie</strong> (Na bas) : déshydratation, confusion.</li>
<li><strong>Hypernatrémie</strong> (Na élevé) : déshydratation sévère.</li>
<li><strong>Hypokaliémie</strong> (K bas) : faiblesse musculaire, troubles cardiaques.</li>
<li><strong>Hyperkaliémie</strong> (K élevé) : risque d'arrêt cardiaque (insuffisance rénale).</li>
<li><strong>Troubles acido-basiques :</strong> acidose, alcalose.</li>
</ul>
<p>En RDC, les déshydratations (diarrhées, choléra) sont fréquentes. L'ionogramme guide la réhydratation. Le rôle du technicien est de doser et de signaler les valeurs critiques.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Ionogramme :</strong> dosage des électrolytes. <strong>Électrolyte :</strong> substance chargée (ion). <strong>Hyponatrémie :</strong> sodium bas. <strong>Hyperkaliémie :</strong> potassium élevé.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Doser les électrolytes. Interpréter les résultats. Signaler les valeurs critiques.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un patient présente une hyperkaliémie à 6,5 mmol/L. C'est une urgence : risque d'arrêt cardiaque. Le technicien alerte immédiatement le médecin.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois électrolytes.</p>
<p><strong>Ex. 2 :</strong> Quelle est la conséquence d'une hyperkaliémie ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Sodium, potassium, chlore (3 au choix).</p>
<p><strong>2)</strong> Un risque d'arrêt cardiaque.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'ionogramme évalue l'équilibre hydro-électrolytique ; ses anomalies peuvent être vitales.</p></div>

<div class="sources"><strong>Sources :</strong> OMS ; programme ISTM/Goma.</div>
    `
},

{
    title: "Leçon 9 — La spectrophotométrie et l'enzymologie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment le laboratoire mesure-t-il un taux de glucose ou de cholestérol ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la spectrophotométrie. Comprendre l'enzymologie. Connaître leurs applications. Prérequis : leçons 1 à 8.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>spectrophotométrie</strong> est une technique qui mesure l'absorption de la lumière par une solution colorée. Plus la concentration est élevée, plus l'absorption est forte. On utilise un spectrophotomètre.</p>
<p><strong>Principe :</strong> une réaction chimique colore la solution proportionnellement à la concentration de la substance à doser. <strong>Applications :</strong> dosage du glucose, du cholestérol, de la créatinine, de l'hémoglobine.</p>
<p>L'<strong>enzymologie</strong> est l'étude des enzymes et de leur activité. Dans le bilan hépatique, on dose les transaminases par leur activité enzymatique. <strong>Applications :</strong> transaminases, phosphatases alcalines, gamma-GT, amylase, lipase.</p>
<p><strong>Contrôle :</strong> calibrage, blanc, contrôle qualité. Le rôle du technicien est de maîtriser la technique, calibrer, interpréter.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Spectrophotométrie :</strong> mesure de l'absorption de la lumière. <strong>Enzymologie :</strong> étude des enzymes. <strong>Calibrage :</strong> étalonnage. <strong>Blanc :</strong> référence.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Préparer les réactifs. Calibrer l'appareil. Lire les résultats. Interpréter.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un technicien dose la glycémie par spectrophotométrie : après réaction, la solution devient rose. L'absorbance lue est convertie en concentration (1,2 g/L).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qu'est-ce que la spectrophotométrie ?</p>
<p><strong>Ex. 2 :</strong> Cite deux applications.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> La mesure de l'absorption de la lumière par une solution pour doser une substance.</p>
<p><strong>2)</strong> Dosage de la glycémie, dosage du cholestérol (2 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La spectrophotométrie et l'enzymologie sont les techniques de base de la biochimie clinique.</p></div>

<div class="sources"><strong>Sources :</strong> Référentiels de biochimie ; programme ISTM/Goma.</div>
    `
},
{
    title: "Leçon 10 — Le contrôle qualité au laboratoire",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment être sûr qu'un résultat de laboratoire est fiable ? Que faire si l'appareil donne des résultats incohérents ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le contrôle qualité. Connaître ses étapes. Assurer la fiabilité des résultats. Prérequis : leçons 1 à 9.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>contrôle qualité</strong> est l'ensemble des procédures qui garantissent la fiabilité des résultats d'analyse.</p>
<p><strong>Étapes :</strong></p>
<ol>
<li><strong>Pré-analytique :</strong> prélèvement correct, transport, conservation.</li>
<li><strong>Analytique :</strong> calibrage, contrôle interne (sérums de contrôle), maintenance.</li>
<li><strong>Post-analytique :</strong> vérification des résultats, transmission.</li>
</ol>
<p><strong>Contrôle interne :</strong> analyse de sérums de contrôle de valeur connue pour vérifier la justesse et la précision. <strong>Contrôle externe :</strong> comparaison des résultats avec d'autres laboratoires (évaluation externe de la qualité, EEQ).</p>
<p><strong>Non-conformités :</strong> identifier, corriger, enregistrer. Le rôle du technicien est d'appliquer les procédures, documenter, alerter en cas d'anomalie.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Contrôle qualité :</strong> vérification de la fiabilité. <strong>Sérum de contrôle :</strong> échantillon de valeur connue. <strong>EEQ :</strong> évaluation externe de la qualité. <strong>Non-conformité :</strong> écart par rapport à la procédure.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Calibrer régulièrement. Utiliser des contrôles. Enregistrer les résultats. Corriger les anomalies.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un technicien analyse un sérum de contrôle dont la glycémie attendue est de 1 g/L. Il obtient 1,2 g/L. L'écart est trop important : il recalibre l'appareil et refait l'analyse.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qu'est-ce que le contrôle qualité ?</p>
<p><strong>Ex. 2 :</strong> Pourquoi utiliser des sérums de contrôle ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> L'ensemble des procédures qui garantissent la fiabilité des résultats.</p>
<p><strong>2)</strong> Pour vérifier la justesse et la précision des analyses.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le contrôle qualité est indispensable à la fiabilité des résultats ; le technicien en est garant.</p></div>

<div class="sources"><strong>Sources :</strong> Référentiels de qualité ; programme ISTM/Goma.</div>
    `
},

{
    title: "Leçon 11 — Applications cliniques des bilans",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment le médecin utilise-t-il les résultats du laboratoire pour diagnostiquer une maladie ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Relier les bilans aux maladies. Interpréter des situations. Orienter. Prérequis : leçons 1 à 10.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les bilans biochimiques permettent de diagnostiquer et de suivre de nombreuses maladies :</p>
<ul>
<li><strong>Diabète :</strong> glycémie à jeun supérieure ou égale à 1,26 g/L à deux reprises, HbA1c supérieure ou égale à 6,5 %.</li>
<li><strong>Insuffisance rénale :</strong> créatinine élevée, clairance abaissée (DFG inférieur à 60).</li>
<li><strong>Athérosclérose :</strong> LDL élevé, HDL bas.</li>
<li><strong>Hépatites :</strong> transaminases élevées, bilirubine élevée.</li>
<li><strong>Troubles hydro-électrolytiques :</strong> ionogramme perturbé.</li>
<li><strong>Maladies osseuses :</strong> calcium, phosphore, phosphatases alcalines.</li>
</ul>
<p><strong>Interprétation :</strong> comparer aux valeurs de référence, tenir compte de l'âge, du sexe, du contexte clinique. Le rôle du technicien est de fournir des résultats fiables et d'alerter le clinicien en cas de valeurs critiques.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>

  var OK = '<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';
  try {
    if (typeof questions !== "undefined" && questions && questions.forEach) {
      questions.forEach(function (q) {
        if (!q.options) q.options = q.opts || q.choices || q.choix || q.reponses || q.propositions || [];
        if (q.text === undefined) q.text = q.question || q.q || q.enonce || q.titre || "";
        if (typeof q.correct === "undefined") {
          if (typeof q.answer !== "undefined") q.correct = q.answer;
          else if (typeof q.reponse !== "undefined") q.correct = q.reponse;
        }
      });
    }
  } catch (e) {}
  var synth = window.speechSynthesis || null;
  var HAS_CACHE = !!(window.caches && window.caches.open);
  var NATIVE = false;
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  var LATER = "ecolia_audio_later_" + CFG.code;
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function init() {
    if (document.getElementById("ecolia-audio-btn")) return;
    var btn = document.createElement("button");
    btn.id = "ecolia-audio-btn"; btn.type = "button"; btn.className = "ecolia-off";
    btn.setAttribute("aria-label", "Écouter la leçon"); btn.innerHTML = PLAY;
    var dlBtn = document.createElement("button");
    dlBtn.id = "ecolia-dl-btn"; dlBtn.type = "button"; dlBtn.className = "ecolia-off";
    dlBtn.innerHTML = DL;
    var host = document.querySelector(".header-right");
    if (host) { host.insertBefore(dlBtn, host.firstChild); host.insertBefore(btn, dlBtn); }
    else { btn.className += " ecolia-fixed"; document.body.appendChild(btn); }
    var banner = document.createElement("div");
    banner.id = "ecolia-audio-banner";
    banner.innerHTML = '<span class="eab-txt"></span><span class="eab-act"></span><div class="eab-bar"><i></i></div>';
    var content = document.getElementById("content");
    if (content && content.parentNode) content.parentNode.insertBefore(banner, content);
    else document.body.insertBefore(banner, document.body.firstChild);
    var txtEl = banner.querySelector(".eab-txt"), actEl = banner.querySelector(".eab-act");
    var barEl = banner.querySelector(".eab-bar"), barI = barEl.firstChild;
    var audio = new Audio();
    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }
    function cur() { try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {} return 0; }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];

      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();

              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();

            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);

    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
