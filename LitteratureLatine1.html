<li>Leçon 12 — Littérature latine et culture congolaise</li>

<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme national de Latin (EDIDEPS, 2007), Manuel de Latin 1ère année (2025). Wikimedia Commons (fiches des images).</div>

},
{
    title: "Leçon 1 — Définition et histoire de la littérature latine",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qu'est-ce que la littérature latine ? Quand est-elle née ? A-t-elle évolué au cours du temps ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir la littérature latine. Situer ses grandes périodes. Comprendre son importance. Prérequis : aucun.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>littérature latine</strong> est l'ensemble des œuvres écrites en latin, principalement pendant l'Antiquité romaine (IIIe siècle av. J.-C. – Ve siècle apr. J.-C.).</p>
<p>Elle naît au IIIe siècle av. J.-C., sous l'influence de la littérature grecque. Elle connaît son apogée au Ier siècle av. J.-C. (Cicéron, César, Virgile, Horace) et au Ier siècle apr. J.-C. (Ovide, Tite-Live).</p>
<p>Elle se poursuit avec les auteurs chrétiens et les écrivains de l'Afrique romaine (Apulée), puis se transforme au Moyen Âge et à la Renaissance.</p>
</div>
<img src="images/LitteratureLatine1_1.jpg" alt="Manuscrit latin médiéval" data-image-id="LitteratureLatine1_1" onerror="this.style.display='none'">
<img src="images/LitteratureLatine1_2.jpg" alt="Chronologie de la littérature latine" data-image-id="LitteratureLatine1_2" onerror="this.style.display='none'">

<h3>3. Méthodes et repères</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour situer une œuvre : identifier l'auteur, la date approximative, le genre, le contexte. Retenir les grandes périodes : naissance, apogée, littérature impériale, littérature chrétienne.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>L'Énéide de Virgile raconte les origines légendaires de Rome. Comme les mythes d'origine des royaumes congolais, elle fonde l'identité d'un peuple.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis la littérature latine en une phrase.</p>
<details><summary>Corrigé</summary>
<p>La littérature latine est l'ensemble des œuvres écrites en latin pendant l'Antiquité romaine.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La littérature latine est une littérature riche et diverse, qui s'étend sur plusieurs siècles et a marqué la culture occidentale.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Latin (EDIDEPS).</div>
    `
},
{
    title: "Leçon 2 — Les langues et les publics de la littérature latine",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Tous les Romains parlaient-ils le même latin ? Pour qui les auteurs écrivaient-ils ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Distinguer latin classique et latin vulgaire. Comprendre le public de la littérature latine. Situer la place de l'oralité.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>latin classique</strong> est la langue littéraire, écrite, raffinée, utilisée par les auteurs. Le <strong>latin vulgaire</strong> est la langue parlée par le peuple, qui évoluera vers les langues romanes.</p>
<p>La littérature latine est d'abord <strong>orale</strong> : les textes étaient lus à voix haute, déclamés, chantés. Le public est restreint (une élite cultivée, des mécènes), mais certains genres (théâtre, discours) touchent un public plus large.</p>
</div>
<img src="images/LitteratureLatine1_3.jpg" alt="Rouleau de papyrus" data-image-id="LitteratureLatine1_3" onerror="this.style.display='none'">

<h3>3. Méthodes et repères</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Se rappeler que le texte était destiné à être lu à voix haute. Tenir compte du rythme, des sonorités, de la rhétorique. Comparer avec l'oralité africaine.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Les discours de Cicéron étaient conçus pour être entendus. De même, dans la culture congolaise, les palabres et les discours de chef sont des formes d'oralité qui jouent un rôle social et politique.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la différence entre latin classique et latin vulgaire ?</p>
<details><summary>Corrigé</summary>
<p>Le latin classique est la langue littéraire écrite ; le latin vulgaire est la langue parlée par le peuple.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La littérature latine est une littérature d'oralité et d'élite, qui reflète les tensions entre langue savante et langue populaire.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Latin (EDIDEPS).</div>
    `
},
{
    title: "Leçon 3 — Les grands genres littéraires latins",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Quels sont les grands genres de la littérature latine ? Comment les reconnaître ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Identifier les principaux genres. Associer chaque genre à ses caractéristiques. Comprendre leur importance.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les principaux genres de la littérature latine sont :</p>
<ul>
<li><strong>L'épopée :</strong> long poème narratif (Virgile, Énéide).</li>
<li><strong>Le théâtre :</strong> comédie (Plaute, Térence) et tragédie (Sénèque).</li>
<li><strong>La poésie lyrique :</strong> poèmes personnels (Catulle, Horace, Ovide).</li>
<li><strong>L'histoire :</strong> récits du passé (César, Salluste, Tite-Live).</li>
<li><strong>L'éloquence :</strong> discours politiques ou judiciaires (Cicéron).</li>
<li><strong>Le roman :</strong> récit long (Apulée, Métamorphoses).</li>
<li><strong>La satire :</strong> critique moqueuse (Horace, Juvénal).</li>
</ul>
</div>
<img src="images/LitteratureLatine1_4.jpg" alt="Les genres littéraires latins" data-image-id="LitteratureLatine1_4" onerror="this.style.display='none'">

<h3>3. Méthodes et repères</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour identifier un genre : se demander « quel est le but du texte ? raconter ? émouvoir ? convaincre ? critiquer ? ». Comparer avec les genres modernes.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>L'Énéide est une épopée, les discours de Cicéron relèvent de l'éloquence, les comédies de Plaute sont du théâtre comique.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quel est le genre de l'Énéide ?</p>
<details><summary>Corrigé</summary>
<p>L'épopée.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La littérature latine se déploie en de nombreux genres, qui ont influencé les littératures modernes.</p></div>

<div class="sources"><strong>Sources :</strong> Programme national de Latin (EDIDEPS).</div>
    `
},
{
    title: "Leçon 4 — L'épopée : Virgile et l'Énéide",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi Virgile a-t-il écrit l'Énéide ? Quel est le lien entre cette épopée et la fondation de Rome ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Définir l'épopée. Connaître Virgile et son œuvre. Comprendre le sens de l'Énéide.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Virgile</strong> (70-19 av. J.-C.) a écrit les <em>Bucoliques</em>, les <em>Géorgiques</em> et l'<em>Énéide</em>.</p>
<p>L'<strong>Énéide</strong> est une épopée en 12 chants racontant les voyages d'Énée, un héros troyen qui, après la chute de Troie, part fonder une nouvelle cité en Italie (future Rome).</p>
<p>Elle a une fonction politique : donner à Rome un récit fondateur et célébrer la grandeur d'Auguste. Thèmes : destin, piété (pietas), guerre, amour, fondation.</p>
</div>
<img src="images/LitteratureLatine1_5.jpg" alt="Buste de Virgile" data-image-id="LitteratureLatine1_5" onerror="this.style.display='none'">
<img src="images/LitteratureLatine1_6.jpg" alt="Énée portant son père Anchise" data-image-id="LitteratureLatine1_6" onerror="this.style.display='none'">

<h3>3. Méthodes et analyse de texte</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Repérer le contexte, les personnages, les thèmes, les procédés poétiques. L'Énéide se lit à plusieurs niveaux : aventure, célébration de Rome, méditation sur le destin.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Énée fuit Troie en portant son père et tenant son fils par la main. Cette image illustre la <em>pietas</em> (devoir envers la famille et les dieux).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quel est le sujet de l'Énéide ?</p>
<details><summary>Corrigé</summary>
<p>Les voyages et les combats d'Énée, jusqu'à la fondation de Rome.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'Énéide est l'épopée nationale de Rome, qui mêle mythologie, histoire et politique.</p></div>

<div class="sources"><strong>Sources :</strong> Virgile, L'Énéide.</div>
    `
},
{
    title: "Leçon 5 — Le théâtre : Plaute, Térence et Sénèque",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi les Romains allaient-ils au théâtre ? Quelles étaient les pièces les plus populaires ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Distinguer comédie et tragédie. Connaître les principaux auteurs dramatiques. Comprendre le rôle social du théâtre à Rome.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le théâtre latin est né au IIIe siècle av. J.-C. Il comprend deux grands genres :</p>
<ul>
<li><strong>La comédie :</strong> pièces humoristiques avec des personnages types (Plaute, Térence).</li>
<li><strong>La tragédie :</strong> pièces graves inspirées des mythes grecs (Sénèque).</li>
</ul>
<p>Le théâtre est un lieu social : il rassemble le peuple, critique les mœurs, fait rire et réfléchir.</p>
</div>
<img src="images/LitteratureLatine1_7.jpg" alt="Masque de théâtre romain" data-image-id="LitteratureLatine1_7" onerror="this.style.display='none'">

<h3>3. Méthodes et analyse de texte</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Pour lire une comédie : repérer les personnages types, les quiproquos, la satire sociale. Pour une tragédie : repérer le conflit, le destin, la violence.</p>

      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
