{
    title: "Leçon 1 — Introduction et examen gynécologique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une femme hésite-t-elle parfois à consulter pour un problème gynécologique ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre l'examen gynécologique. Respecter la pudeur et le consentement. Situer le rôle de la sage-femme.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — L'examen gynécologique</div>
<p>L'examen gynécologique comprend :</p>
<ul>
<li><strong>l'interrogatoire :</strong> antécédents, cycle, douleurs, symptômes ;</li>
<li><strong>l'inspection</strong> des organes génitaux externes ;</li>
<li><strong>le toucher vaginal</strong> (principes) ;</li>
<li><strong>l'examen au speculum</strong> (principes).</li>
</ul>
<p>Ces gestes sont réalisés par un professionnel formé, avec le consentement de la femme, dans un cadre respectueux.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Respect et consentement</div>
<ul>
<li>Expliquer chaque geste avant de le faire.</li>
<li>Préserver la pudeur (paravent, intimité).</li>
<li>Recueillir le consentement.</li>
<li>Être attentif à la douleur et aux réactions de la femme.</li>
<li>Respecter le secret professionnel.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Rôle de la sage-femme</div>
<p>La sage-femme accueille, écoute, observe, oriente. Elle ne pose pas de diagnostic médical et ne prescrit pas de traitement : elle prépare, assiste, transmet et oriente.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois composantes de l'examen gynécologique.</p>
<p><strong>Ex. 2 :</strong> Pourquoi le consentement est-il indispensable ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Interrogatoire, inspection, toucher vaginal (ou speculum). <strong>2)</strong> Pour respecter la dignité et l'autonomie de la femme.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'examen gynécologique repose sur le respect, l'explication et le consentement.</p></div>
<div class="sources"><strong>Sources :</strong> Cours Gynécologie 3e, Institut Ukarimu.</div>
    `
},
{
    title: "Leçon 2 — Sexualité et violence sexuelle",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une victime de violence sexuelle a-t-elle besoin d'un accueil particulier ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les violences sexuelles. Adopter une posture d'accueil. Orienter vers les structures adaptées.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les violences sexuelles</div>
<p>Les violences sexuelles prennent plusieurs formes : agression, harcèlement, exploitation, mariage forcé, mutilations génitales. Elles touchent gravement la santé physique et psychologique.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Accueillir une victime</div>
<ul>
<li><strong>Croire la personne</strong> et ne pas la juger.</li>
<li><strong>Écouter</strong> sans interrompre.</li>
<li><strong>Assurer la confidentialité.</strong></li>
<li><strong>Ne pas imposer d'examen non urgent.</strong></li>
<li><strong>Orienter</strong> vers une structure adaptée (médicale, psychologique, juridique).</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Orientation</div>
<p>La prise en charge d'une victime dépasse le rôle de la sage-femme seule : elle associe le médical (soins, prévention des infections, contraception d'urgence selon les protocoles), le psychologique et le juridique. La sage-femme oriente et accompagne.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois attitudes d'accueil d'une victime.</p>
<p><strong>Ex. 2 :</strong> Pourquoi orienter vers une structure adaptée ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Croire, écouter, ne pas juger. <strong>2)</strong> Parce que la prise en charge associe plusieurs dimensions (médicale, psychologique, juridique).</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'accueil d'une victime repose sur l'écoute, la confidentialité et l'orientation.</p></div>
<div class="sources"><strong>Sources :</strong> Cours Gynécologie 3e, Institut Ukarimu.</div>
    `
},
{
    title: "Leçon 3 — Leucorrhées et infections génitales",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une perte vaginale inhabituelle doit-elle conduire à consulter ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les leucorrhées. Identifier les signes d'infection. Orienter vers la consultation.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les leucorrhées</div>
<p>Les <strong>leucorrhées</strong> sont des pertes vaginales. Elles peuvent être normales (claires, inodores, peu abondantes) ou pathologiques (colorées, malodorantes, abondantes, associées à des démangeaisons ou douleurs).</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Signes d'infection</div>
<ul>
<li>Pertes jaunes, verdâtres, grisâtres.</li>
<li>Odeur désagréable.</li>
<li>Démangeaisons, brûlures.</li>
<li>Douleurs pelviennes.</li>
<li>Saignements anormaux.</li>
<li>Fièvre associée.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Conduite</div>
<p>Face à une leucorrhée pathologique :</p>
<ol>
<li>Écouter et interroger avec respect.</li>
<li>Orienter vers la consultation médicale.</li>
<li>Ne pas prescrire de traitement (le diagnostic microbiologique et la prescription relèvent du médecin).</li>
<li>Conseiller l'hygiène et informer sur la prévention.</li>
</ol>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Distingue leucorrhées normales et pathologiques.</p>
<p><strong>Ex. 2 :</strong> Cite trois signes d'infection génitale.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Normales : claires, inodores, peu abondantes ; pathologiques : colorées, malodorantes, avec symptômes. <strong>2)</strong> Pertes colorées, odeur, démangeaisons.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Toute leucorrhée inhabituelle doit conduire à une consultation : la sage-femme informe et oriente.</p></div>
<div class="sources"><strong>Sources :</strong> Cours Gynécologie 3e.</div>
    `
},
{
    title: "Leçon 4 — Les MST et les salpingites",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une MST mal soignée peut-elle entraîner une stérilité ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les MST. Identifier les complications. Situer la prévention.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les MST</div>
<p>Les <strong>maladies sexuellement transmissibles (MST)</strong> se transmettent lors de rapports sexuels non protégés. Exemples : syphilis, gonococcie, chlamydiose, VIH, hépatite B.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — La salpingite</div>
<p>La <strong>salpingite</strong> est une infection des trompes de Fallope, souvent due à une MST non traitée. Elle peut :</p>
<ul>
<li>provoquer des douleurs pelviennes ;</li>
<li>entraîner une stérilité par obstruction des trompes ;</li>
<li>favoriser une grossesse extra-utérine ;</li>
<li>évoluer vers une infection généralisée.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Prévention</div>
<ul>
<li>Utilisation correcte du préservatif.</li>
<li>Dépistage et traitement précoces.</li>
<li>Traitement du partenaire.</li>
<li>Éducation à la santé sexuelle.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite deux complications possibles d'une MST non traitée.</p>
<p><strong>Ex. 2 :</strong> Pourquoi traiter aussi le partenaire ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Salpingite, stérilité (ou grossesse extra-utérine). <strong>2)</strong> Pour éviter la recontamination et la propagation.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les MST non traitées exposent à la salpingite et à la stérilité : prévention et dépistage précoces sont essentiels.</p></div>
<div class="sources"><strong>Sources :</strong> Cours Gynécologie 3e.</div>
    `
},
{
    title: "Leçon 5 — La contraception",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi n'existe-t-il pas une méthode contraceptive idéale pour toutes les femmes ? »</p></div>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Identifier les méthodes. Comprendre leurs principes. Adapter le conseil au contexte.</p></div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Les méthodes</div>
<ul>
<li><strong>Méthodes hormonales :</strong> pilule, injectable, implant.</li>
<li><strong>Méthodes barrières :</strong> préservatif masculin, féminin.</li>
<li><strong>Dispositifs intra-utérins (DIU).</strong></li>
<li><strong>Méthodes naturelles :</strong> observation du cycle (moins fiables).</li>
<li><strong>Contraception d'urgence :</strong> après un rapport non protégé, selon les directives.</li>
<li><strong>Stérilisation :</strong> méthode définitive.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Conseil</div>
<p>Le conseil contraceptif tient compte :</p>
<ul>
<li>de l'état de santé de la femme ;</li>
<li>de ses préférences et de son mode de vie ;</li>
<li>de l'efficacité et des effets possibles ;</li>
<li>de la protection contre les MST (préservatif) ;</li>
<li>des ressources disponibles.</li>
</ul>
</div>
<div class="bloc theorie"><div class="bloc-label">Théorie — Rôle de la sage-femme</div>
<p>Informer, conseiller, orienter vers la prescription médicale pour les méthodes qui en nécessitent. Respecter le choix libre et éclairé de la femme.</p>
</div>
<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois méthodes contraceptives.</p>
<p><strong>Ex. 2 :</strong> Pourquoi associer conseil contraceptif et prévention des MST ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Pilule, préservatif, DIU. <strong>2)</strong> Parce que la contraception ne protège pas contre les MST, sauf le préservatif.</p>
</details>
</div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le conseil contraceptif est individualisé et respecte le choix de la femme.</p></div>
<div class="sources"><strong>Sources :</strong> Cours Gynécologie 3e ; directives nationales.</div>
    `
},
{
    title: "Leçon 6 — La stérilité du couple (initiation)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi parle-t-on de stérilité du couple et non de la femme seule ? »</p></div>
