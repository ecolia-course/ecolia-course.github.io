{
    title: "Leçon 1 — Pourquoi apprendre le portugais ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un commerçant congolais veut vendre ses marchandises en Angola. Un étudiant veut poursuivre ses études au Brésil. Quel avantage ont-ils à parler portugais ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Comprendre l'intérêt du portugais en RDC. Situer les pays lusophones. Distinguer portugais européen et portugais brésilien. Prérequis : aucun.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>portugais</strong> est une langue romane, issue du latin, comme le français. Il est parlé par plus de 260 millions de locuteurs dans le monde.</p>
<p><strong>Pays lusophones :</strong> Portugal, Brésil, Angola, Mozambique, Cap-Vert, Guinée-Bissau, São Tomé-et-Príncipe, Timor oriental. L'Angola est voisin de la RDC.</p>
<p><strong>Pourquoi l'apprendre ?</strong> Commerce avec l'Angola et les pays lusophones, études au Brésil ou au Portugal, culture (samba, kizomba, semba), ouverture internationale.</p>
<p><strong>Portugais européen et portugais brésilien :</strong> différences de prononciation et de vocabulaire, mais grammaire globalement commune.</p>
</div>
<img src="images/LangueVivante1_1.jpg" alt="Carte des pays lusophones" data-image-id="LangueVivante1_1" onerror="this.style.display='none'">

<h3>3. Méthodes et repères</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Situer sur une carte : Portugal, Brésil, Angola, Mozambique, Cap-Vert, Guinée-Bissau, São Tomé-et-Príncipe, Timor oriental. Comparer le portugais et le français : beaucoup de mots se ressemblent (escola / école, família / famille, água / eau).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un commerçant de Kinshasa se rend à Luanda pour vendre du café. S'il parle portugais, il peut négocier directement, comprendre les prix, éviter les intermédiaires.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois pays lusophones.</p>
<details><summary>Corrigé</summary>
<p>Portugal, Brésil, Angola (3 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le portugais est une langue mondiale et utile pour la RDC ; c'est une langue romane proche du français.</p></div>

<div class="sources"><strong>Sources :</strong> CECRL niveau A1, Programme national de langues vivantes (EDIDEPS).</div>
    `

    title: "Leçon 2 — L'alphabet, la prononciation et l'accentuation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment prononce-t-on Olá, obrigado, Brasil ? Le portugais se prononce-t-il comme le français ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Connaître l'alphabet portugais. Prononcer les lettres et les groupes de lettres. Placer l'accent tonique.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'alphabet portugais compte <strong>23 lettres</strong> (sans K, W, Y en usage traditionnel, mais ces lettres sont aujourd'hui admises pour les noms propres).</p>
<p><strong>Prononciation (approximative, portugais européen) :</strong></p>
<ul>
<li>A = [a] ; E = [é] ou [è] ; I = [i] ; O = [o] ou [ou] ; U = [ou].</li>
<li>C = [k] devant a, o, u ; [s] devant e, i (cinco = [sinkou]).</li>
<li>G = [g] devant a, o, u ; [j] devant e, i (gente = [jénte]).</li>
<li>H = muet (hotel = [otèl]).</li>
<li>ÃO = diphtongue nasale, proche de [ãou] (não = [nãou]).</li>
</ul>
<p><strong>Accentuation :</strong> les accents écrits (á, é, í, ó, ú, ã, õ) indiquent la voyelle tonique et la prononciation. L'accent peut changer le sens (avô = grand-père / avó = grand-mère).</p>
</div>
<img src="images/LangueVivante1_2.jpg" alt="Alphabet portugais" data-image-id="LangueVivante1_2" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Lire à voix haute, syllabe par syllabe, en respectant les accents. Comparer avec le français : certains sons sont proches, d'autres différents (nasales, r roulé). Ne pas confondre avô (grand-père) et avó (grand-mère).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Olá se prononce [olá] ; obrigado [obrigadou] ; Brasil [brazil] ; Angola [angola]. Não [nãou] est une nasale.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Comment prononce-t-on não ?</p>
<details><summary>Corrigé</summary>
<p>[nãou] (nasale).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La prononciation portugaise s'apprend par la pratique ; les accents changent la prononciation et parfois le sens.</p></div>

<div class="sources"><strong>Sources :</strong> Manuels de portugais A1.</div>
    `
},
{
    title: "Leçon 3 — Saluer et se présenter",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment dit-on bonjour, comment tu t'appelles, je m'appelle Amani en portugais ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Saluer selon le moment de la journée. Dire son nom, son âge, son pays. Demander ces informations.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Salutations :</strong></p>
<ul>
<li>Olá! = Bonjour / Salut.</li>
<li>Bom dia! = Bonjour (matin).</li>
<li>Boa tarde! = Bon après-midi.</li>
<li>Boa noite! = Bonsoir / Bonne nuit.</li>
<li>Adeus! = Au revoir. Até logo! = À bientôt.</li>
</ul>
<p><strong>Se présenter :</strong></p>
<ul>
<li>Como te chamas? = Comment tu t'appelles ?</li>
<li>Chamo-me Amani. = Je m'appelle Amani.</li>
<li>Tenho doze anos. = J'ai douze ans.</li>
<li>Sou congolês / congolesa. = Je suis congolais / congolaise.</li>
<li>Sou de Kinshasa. = Je suis de Kinshasa.</li>
</ul>
</div>
<img src="images/LangueVivante1_3.jpg" alt="Poignée de main, salutation" data-image-id="LangueVivante1_3" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>
<div class="bloc theorie"><div class="bloc-label">Méthode</div>
<p>Utiliser bom dia le matin, boa tarde l'après-midi, boa noite le soir. Dire tenho ... anos pour l'âge. Distinguer le registre formel (o senhor, a senhora) et informel (tu). En portugais, on utilise você (Brésil) ou tu (Portugal, Angola).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Amani : « Olá! Bom dia! » — Grace : « Olá! Bom dia! » — Amani : « Como te chamas? » — Grace : « Chamo-me Grace. E tu? » — Amani : « Chamo-me Amani. Tenho treze anos. »</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Comment dit-on bonjour le matin ?</p>
<details><summary>Corrigé</summary>
<p>Bom dia!</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les salutations et la présentation sont les premières compétences de communication.</p></div>

<div class="sources"><strong>Sources :</strong> Manuels de portugais A1.</div>
    `
},
{
    title: "Leçon 4 — Les nombres, l'heure et la date",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment compter en portugais ? Comment dire il est 8 heures ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Compter de 0 à 100. Dire l'heure. Dire la date.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Nombres :</strong> 0 zero ; 1 um ; 2 dois ; 3 três ; 4 quatro ; 5 cinco ; 6 seis ; 7 sete ; 8 oito ; 9 nove ; 10 dez ; 11 onze ; 12 doze ; 13 treze ; 15 quinze ; 20 vinte ; 21 vinte e um ; 30 trinta ; 40 quarenta ; 50 cinquenta ; 100 cem.</p>
<p><strong>Heure :</strong> Que horas são? — É uma hora. — São duas horas. — São oito e meia (8 h 30). — São cinco para as três (3 h moins 5).</p>
<p><strong>Date :</strong> Hoje é segunda-feira. — É o primeiro de junho.</p>
</div>
<img src="images/LangueVivante1_4.jpg" alt="Horloge analogique" data-image-id="LangueVivante1_4" onerror="this.style.display='none'">
<img src="images/LangueVivante1_5.jpg" alt="Calendrier" data-image-id="LangueVivante1_5" onerror="this.style.display='none'">

<h3>3. Méthodes et règles</h3>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les nombres, l'heure et la date sont indispensables à la vie quotidienne.</p></div>

<div class="sources"><strong>Sources :</strong> Manuels de portugais A1.</div>

    title: "Leçon 5 — Les articles et le genre des noms",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi dit-on o livro (le livre) mais a casa (la maison) ? Comment savoir si un nom est masculin ou féminin ? »</p></div>

<h3>1. Objectifs</h3>
<div class="bloc theorie"><div class="bloc-label">Objectifs</div>
<p>Distinguer les articles définis et indéfinis. Reconnaître le genre des noms. Accorder les articles.</p>
</div>

<h3>2. Contenu</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Articles définis :</strong> o (m. sing.), a (f. sing.), os (m. plur.), as (f. plur.).</p>
<p><strong>Articles indéfinis :</strong> um (m.), uma (f.).</p>
<p><strong>Genre :</strong> généralement, -o = masculin (livro, gato), -a = féminin (casa, mesa). Exceptions : o dia, a mão, o mapa.</p>
<p><strong>Pluriel :</strong> +s (voyelle) ou +es (consonne) : livro → livros ; professor → professores.</p>
</div>

          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
