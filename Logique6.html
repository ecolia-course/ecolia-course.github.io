{
    title: "Leçon 1 — Introduction à la logique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève dit : « Tous les Congolais aiment le foufou ; Jean aime le foufou ; donc Jean est Congolais. » Son camarade répond : « Ton raisonnement est faux. » Comment le prouver ? La logique donne les outils pour juger un raisonnement.</p></div>
<h3>1. Définition et objet</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Logique</strong> (du grec <em>logos</em> : raison, discours) : science des <strong>lois formelles de la pensée correcte</strong>.</li><li><strong>Objet</strong> : les <strong>concepts</strong>, les <strong>jugements</strong> et les <strong>raisonnements</strong>.</li><li><strong>Logique formelle</strong> : étudie la <strong>forme</strong> du raisonnement, indépendamment du contenu ; <strong>logique matérielle</strong> : étudie la <strong>vérité</strong> du contenu.</li><li><strong>Validité</strong> (forme correcte) ≠ <strong>vérité</strong> (accord avec le réel).</li></ul></div>
<h3>2. Histoire de la logique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><figure style="margin:14px 0;"><img alt="Buste d'Aristote, père de la logique" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Log6_1"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">Buste d'Aristote, père de la logique (Wikimedia Commons)</figcaption></figure><figure style="margin:14px 0;"><img alt="George Boole, fondateur de la logique algébrique" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Log6_2"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">George Boole, fondateur de la logique algébrique (Wikimedia Commons)</figcaption></figure><ul><li><strong>Aristote</strong> (384-322 av. J.-C.) : fondateur ; son <strong>Organon</strong> réunit <em>Catégories</em>, <em>De l'interprétation</em>, <em>Premiers Analytiques</em>, <em>Seconds Analytiques</em>, <em>Topiques</em>, <em>Réfutations sophistiques</em>.</li><li><strong>Stoïciens</strong> (Chrysippe) : logique des propositions.</li><li><strong>Moyen Âge</strong> : Boèce, Abélard, Pierre d'Espagne.</li><li><strong>Port-Royal</strong> : <em>La Logique ou l'art de penser</em> (Arnauld et Nicole, 1662).</li><li><strong>Leibniz</strong> (1646-1716) : rêve d'un calcul logique.</li><li><strong>Boole</strong> (1815-1864) : algèbre de la logique (1854) ; <strong>Frege</strong> (1879) ; <strong>Russell</strong> et <strong>Whitehead</strong> (<em>Principia Mathematica</em>, 1910-1913) ; <strong>Gödel</strong> (1931) ; <strong>Turing</strong> (1936).</li></ul></div>
<h3>3. Les quatre grands principes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Identité</strong> : A est A.</li><li><strong>Non-contradiction</strong> : une chose ne peut pas être et ne pas être en même temps et sous le même rapport.</li><li><strong>Tiers exclu</strong> : ou bien A, ou bien non-A ; pas de troisième possibilité.</li><li><strong>Raison suffisante</strong> (Leibniz) : rien n'arrive sans raison.</li></ul></div>
<h3>4. Utilité</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Penser et argumenter correctement ; fondement des mathématiques, de l'<strong>informatique</strong> (circuits logiques, programmation), du <strong>droit</strong>, du <strong>débat</strong> et de la philosophie.</p><p><a href="https://www.youtube.com/results?search_query=introduction+à+la+logique+Aristote" target="_blank" rel="noopener">🎥 Recherche : introduction à la logique (TV5Monde / France 24)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La logique étudie les lois de la pensée correcte. Fondée par Aristote, elle repose sur quatre principes : identité, non-contradiction, tiers exclu, raison suffisante. Un raisonnement peut être valide sans être vrai.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de philosophie RDC (EPST), chapitre Logique ; manuels de logique du secondaire, Aristote, Leibniz, Boole.<br><strong>Sigles et abréviations :</strong> **EPST** : Enseignement primaire, secondaire et technique ; **EXETAT** : Examen d'État ; **av. J.-C.** : avant Jésus-Christ ; **S, P, M** : petit terme, grand terme, moyen terme.</div>
    `
},
{
    title: "Leçon 2 — Les termes et les concepts",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Le mot « animal » désigne un chien, un oiseau, un poisson. Le mot « chien » désigne moins d'êtres mais en dit davantage. Cette relation entre ce qu'un mot signifie et ce qu'il désigne est la clé de la logique des concepts.</p></div>
<h3>1. Les trois opérations de l'esprit</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Appréhension</strong> : former un <strong>concept</strong> (idée).</li><li><strong>Jugement</strong> : affirmer ou nier (<strong>proposition</strong>).</li><li><strong>Raisonnement</strong> : déduire une proposition à partir d'autres.</li><li><strong>Terme</strong> : mot ou groupe de mots exprimant un concept.</li></ul></div>
<h3>2. Compréhension et extension</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Compréhension</strong> : ensemble des <strong>caractères</strong> du concept (animal : être vivant, sensible, mobile).</li><li><strong>Extension</strong> : ensemble des <strong>êtres</strong> auxquels il s'applique (tous les animaux).</li><li><strong>Loi de proportion inverse</strong> : plus la compréhension augmente, plus l'extension diminue (animal → chien).</li><li><strong>Terme</strong> : <strong>singulier</strong> (Kinshasa), <strong>particulier</strong> (quelques élèves), <strong>universel</strong> (tous les hommes), <strong>collectif</strong> (une armée).</li><li><strong>Univoque</strong> (un seul sens), <strong>équivoque</strong> (plusieurs sens sans rapport), <strong>analogue</strong> (plusieurs sens liés).</li></ul></div>
<h3>3. Relations entre concepts</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Identité</strong> : synonymes ; <strong>subordination</strong> : genre/espèce (animal → chien) ; <strong>coordination</strong> : même niveau (chien, chat).</li><li><strong>Opposition</strong> : <strong>contraires</strong> (grand/petit), <strong>contradictoires</strong> (blanc/non-blanc), <strong>corrélatifs</strong> (père/fils), <strong>privatifs</strong> (vue/cécité).</li></ul></div>
<h3>4. Prédicables et catégories</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><figure style="margin:14px 0;"><img alt="Diagramme de Venn illustrant les relations entre ensembles et concepts" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Log6_3"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">Diagramme de Venn illustrant les relations entre ensembles et concepts (Wikimedia Commons)</figcaption></figure><ul><li><strong>Cinq prédicables de Porphyre</strong> : <strong>genre</strong>, <strong>espèce</strong>, <strong>différence spécifique</strong>, <strong>propre</strong>, <strong>accident</strong>.</li><li><strong>Dix catégories d'Aristote</strong> : substance, quantité, qualité, relation, lieu, temps, situation, possession (avoir), action, passion.</li></ul><p><a href="https://www.youtube.com/results?search_query=concept+compréhension+extension+logique" target="_blank" rel="noopener">🎥 Recherche : compréhension et extension (TV5Monde / France 24)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Un concept a une compréhension (ses caractères) et une extension (les êtres qu'il désigne) ; elles varient en sens inverse. Les concepts entretiennent des relations : identité, subordination, coordination, opposition.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de philosophie RDC (EPST), chapitre Logique ; manuels de logique du secondaire, Aristote, Porphyre.<br><strong>Sigles et abréviations :</strong> **EPST** : Enseignement primaire, secondaire et technique ; **EXETAT** : Examen d'État ; **av. J.-C.** : avant Jésus-Christ ; **S, P, M** : petit terme, grand terme, moyen terme.</div>
    `
},
{
    title: "Leçon 3 — Les propositions et le carré logique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Tous les élèves sont présents. » « Aucun élève n'est absent. » Les deux phrases disent-elles la même chose ? La logique des propositions permet de le savoir.</p></div>
<h3>1. La proposition</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Proposition</strong> (jugement exprimé) : énoncé qui affirme ou nie un attribut d'un sujet ; elle est <strong>vraie</strong> ou <strong>fausse</strong>.</li><li><strong>Structure</strong> : <strong>sujet</strong> (S), <strong>copule</strong> (est), <strong>prédicat</strong> (P).</li><li><strong>Qualité</strong> : affirmative ou négative ; <strong>quantité</strong> : universelle ou particulière.</li></ul></div>
<h3>2. Les quatre types : A, E, I, O</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:0.85rem;margin:10px 0;"><tr><th style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Type</th><th style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Forme</th><th style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Nom</th><th style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Exemple</th></tr><tr><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">A</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Tout S est P</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Universelle affirmative</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Tout homme est mortel</td></tr><tr><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">E</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Aucun S n'est P</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Universelle négative</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Aucun homme n'est parfait</td></tr><tr><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">I</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Quelque S est P</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Particulière affirmative</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Quelque homme est sage</td></tr><tr><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">O</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Quelque S n'est pas P</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Particulière négative</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Quelque homme n'est pas sage</td></tr></table></div><strong>Moyen mnémotechnique</strong> : A et I viennent de <em>AffIrmo</em>, E et O de <em>nEgO</em>.<ul><li><strong>Distribution</strong> : A : S distribué ; E : S et P distribués ; I : aucun ; O : P distribué.</li></ul></div>
<h3>3. Le carré logique (opposition des propositions)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><figure style="margin:14px 0;"><img alt="Carré logique d'Aristote représenté par des diagrammes d'ensembles" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Log6_4"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">Carré logique d'Aristote représenté par des diagrammes d'ensembles (Wikimedia Commons)</figcaption></figure><ul><li><strong>Contraires</strong> (A–E) : jamais vraies ensemble, mais peuvent être fausses ensemble.</li><li><strong>Subcontraires</strong> (I–O) : jamais fausses ensemble, mais peuvent être vraies ensemble.</li><li><strong>Contradictoires</strong> (A–O et E–I) : l'une est vraie, l'autre fausse ; toujours.</li><li><strong>Subalternes</strong> (A–I et E–O) : si A est vraie, I est vraie ; si I est fausse, A est fausse.</li></ul></div>
<h3>4. La conversion</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><p>Inverser S et P : <strong>E</strong> et <strong>I</strong> se convertissent simplement ; <strong>A</strong> se convertit <strong>par accident</strong> (« Tout homme est mortel » → « Quelque mortel est homme ») ; <strong>O</strong> ne se convertit pas.</p><p><a href="https://www.youtube.com/results?search_query=carré+logique+propositions+A+E+I+O" target="_blank" rel="noopener">🎥 Recherche : carré logique (TV5Monde / France 24)</a></p></div>

<h3>2. Déduction, induction, analogie</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Déduction</strong> : du <strong>général au particulier</strong> ; conclusion <strong>nécessaire</strong> (« Tous les hommes sont mortels ; Socrate est un homme ; donc Socrate est mortel »).</li><li><strong>Induction</strong> : du <strong>particulier au général</strong> ; conclusion <strong>probable</strong> (méthode de <strong>Bacon</strong> et <strong>Mill</strong>) ; <strong>complète</strong> (tous les cas) ou <strong>incomplète</strong> (quelques cas).</li><li><strong>Analogie</strong> : de <strong>particulier à particulier</strong>, par ressemblance (« la Terre est habitée, Mars lui ressemble, donc... ») ; conclusion probable.</li><li><strong>Abduction</strong> (Peirce) : trouver la meilleure explication.</li></ul></div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Tous les mammifères allaitent leurs petits ; la baleine est un mammifère ; donc la baleine allaite ses petits. » Voilà un syllogisme, l'outil central de la logique d'Aristote.</p></div>
<h3>1. Définition et structure</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Syllogisme</strong> : raisonnement déductif composé de <strong>trois propositions</strong> : <strong>majeure</strong>, <strong>mineure</strong>, <strong>conclusion</strong>.</li><li><strong>Trois termes</strong> : <strong>grand terme</strong> (<strong>P</strong>, prédicat de la conclusion), <strong>petit terme</strong> (<strong>S</strong>, sujet de la conclusion), <strong>moyen terme</strong> (<strong>M</strong>, présent dans les deux prémisses, absent de la conclusion).</li><li><strong>Exemple</strong> : Tous les hommes (M) sont mortels (P) ; Socrate (S) est un homme (M) ; donc Socrate (S) est mortel (P).</li></ul></div>
<h3>2. Les huit règles</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><strong>Règles des termes</strong><ul><li>1) Il y a <strong>trois termes</strong> seulement.</li><li>2) Le <strong>moyen terme</strong> n'entre pas dans la conclusion.</li><li>3) Aucun terme n'a plus d'<strong>extension</strong> dans la conclusion que dans les prémisses.</li><li>4) Le moyen terme doit être <strong>universel</strong> (distribué) au moins une fois.</li></ul><strong>Règles des propositions</strong><ul><li>5) De <strong>deux prémisses négatives</strong>, rien ne suit.</li><li>6) De <strong>deux prémisses affirmatives</strong>, on ne peut conclure à une négative.</li><li>7) La conclusion suit la <strong>partie la plus faible</strong> (négative ou particulière).</li><li>8) De <strong>deux prémisses particulières</strong>, rien ne suit.</li></ul></div>
<h3>3. Les figures</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><figure style="margin:14px 0;"><img alt="Aristote, inventeur du syllogisme" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Log6_6"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">Aristote, inventeur du syllogisme (Wikimedia Commons)</figcaption></figure><div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:0.85rem;margin:10px 0;"><tr><th style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Figure</th><th style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Majeure</th><th style="border:1px solid #bbb;padding:5px 8px;text-align:center;">Mineure</th></tr><tr><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">1re</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">M – P</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">S – M</td></tr><tr><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">2e</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">P – M</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">S – M</td></tr><tr><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">3e</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">M – P</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">M – S</td></tr><tr><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">4e</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">P – M</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">M – S</td></tr></table></div>La <strong>figure</strong> dépend de la <strong>place du moyen terme</strong> dans les prémisses.</div>

ext-align:center;">V</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">F</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">V</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">V</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">F</td></tr><tr><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">F</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">F</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">V</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">F</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">F</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">V</td><td style="border:1px solid #bbb;padding:5px 8px;text-align:center;">V</td></tr></table></div>- <strong>Conjonction</strong> : vraie seulement si les deux sont vraies.<ul><li><strong>Disjonction</strong> : fausse seulement si les deux sont fausses.</li><li><strong>Implication</strong> : fausse seulement si p est vraie et q fausse.</li></ul></div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève dit : « Un tabouret, c'est un truc pour s'asseoir. » Son professeur : « Peux-tu le définir précisément ? » Définir, c'est dire exactement ce qu'est une chose.</p></div>
<h3>1. La définition</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition nominale</strong> : sens du mot ; <strong>réelle</strong> : essence de la chose.</li><li><strong>Par genre prochain et différence spécifique</strong> : « L'homme est un animal (genre) raisonnable (différence) ».</li><li><strong>Autres</strong> : par énumération, par exemples, par opposition, génétique, opératoire.</li><li><strong>Règles</strong> : convertible avec le défini, plus claire que lui, sans cercle, positive, brève.</li></ul></div>
<h3>2. La division</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Division logique</strong> : partage de l'<strong>extension</strong> d'un genre en espèces.</li><li><strong>Règles</strong> : un seul <strong>principe</strong> de division ; <strong>complète</strong> ; <strong>exclusive</strong> (parties qui ne se chevauchent pas) ; <strong>graduelle</strong>.</li><li><strong>Partition</strong> : division d'un tout concret en parties (une voiture : moteur, châssis...).</li></ul></div>
<h3>3. La classification</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><figure style="margin:14px 0;"><img alt="Diagramme de Venn : genres et espèces comme ensembles emboîtés" style="max-width:100%; border-radius:10px;" onerror="this.parentNode.style.display='none'" data-image-id="Log6_9"><figcaption style="font-size:0.78rem;color:#666;margin-top:4px;">Diagramme de Venn : genres et espèces comme ensembles emboîtés (Wikimedia Commons)</figcaption></figure><ul><li><strong>Classification</strong> : organiser les êtres en genres et espèces <strong>hiérarchisés</strong>.</li><li><strong>Naturelle</strong> (selon les caractères essentiels : <strong>Linné</strong>) ou <strong>artificielle</strong> (selon un critère commode).</li><li><strong>Arbre de Porphyre</strong> : substance → corps → corps animé → animal → animal raisonnable → homme.</li></ul><p><a href="https://www.youtube.com/results?search_query=définition+division+classification+logique" target="_blank" rel="noopener">🎥 Recherche : définition et classification (TV5Monde / France 24)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Définir, c'est donner le genre prochain et la différence spécifique. Diviser, c'est partager l'extension d'un genre selon un principe unique. Classer, c'est ordonner en genres et espèces.</p></div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un procès, l'avocat présente des témoins, des documents, des raisonnements. Il veut convaincre le juge. Toute discussion sérieuse suit la même logique : une thèse, des arguments, des preuves.</p></div>
<h3>1. L'argumentation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Argumenter</strong> : défendre une <strong>thèse</strong> par des raisons pour <strong>convaincre</strong> (par la raison) ou <strong>persuader</strong> (par l'émotion).</li><li><strong>Aristote (<em>Rhétorique</em>)</strong> : trois moyens : <strong>ethos</strong> (crédibilité), <strong>pathos</strong> (émotion), <strong>logos</strong> (raisonnement).</li><li><strong>Perelman</strong> (<em>Traité de l'argumentation</em>, 1958) : nouvelle rhétorique.</li><li><strong>Structure</strong> : thèse, arguments, exemples, objections, réfutation, conclusion.</li></ul></div>
<h3>2. La preuve et la démonstration</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Preuve</strong> : ce qui établit la vérité (expérience, témoignage, document, calcul).</li><li><strong>Démonstration</strong> : preuve rigoureuse par déduction à partir d'<strong>axiomes</strong> (mathématiques, <strong>Euclide</strong>, <em>Éléments</em>, vers 300 av. J.-C.).</li><li><strong>Vocabulaire</strong> : <strong>axiome</strong>, <strong>postulat</strong>, <strong>théorème</strong>, <strong>lemme</strong>, <strong>corollaire</strong>, <strong>hypothèse</strong>.</li></ul></div>
<h3>3. Réfuter et débattre</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Réfuter</strong> : montrer qu'une thèse est fausse ou mal fondée (<strong>contre-exemple</strong>, <strong>absurde</strong>, <strong>contradiction</strong>).</li><li><strong>Bon débat</strong> : définir les termes, écouter, rester courtois, accepter la preuve.</li><li><strong>Pièges</strong> : sophismes ; <strong>loyauté</strong> : respecter la pensée de l'adversaire.</li></ul><p><a href="https://www.youtube.com/results?search_query=argumentation+démonstration+preuve+logique" target="_blank" rel="noopener">🎥 Recherche : l'argumentation (TV5Monde / France 24)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Argumenter, c'est défendre une thèse par des raisons. La démonstration est la forme la plus rigoureuse de preuve. Un bon débat respecte la logique et l'adversaire.</p></div>

function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';
    slideCounterSpan.textContent = '0/0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;

    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
