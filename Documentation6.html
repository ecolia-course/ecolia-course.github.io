    title: "Leçon 1 — Introduction à la documentation commerciale",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une entreprise de Kinshasa, le service commercial reçoit une commande d'un client de Lubumbashi. Du bon de commande jusqu'au paiement, en passant par la facture, le bon de livraison et la lettre de voiture, une dizaine de documents sont échangés. Sans leur maîtrise, les opérations commerciales deviennent chaotiques. La documentation commerciale est la colonne vertébrale de toute transaction.</p></div>
<h3>1. Définition et rôle</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Documentation commerciale</strong> : ensemble des documents écrits qui accompagnent et matérialisent les opérations commerciales d'une entreprise.</li><li><strong>Rôle juridique</strong> : preuve des transactions, base des litiges, obligations fiscales et comptables.</li><li><strong>Rôle économique</strong> : traçabilité des biens et services, gestion des flux, information des partenaires.</li><li><strong>Rôle administratif</strong> : classement, archivage, contrôle interne.</li></ul></div>
<h3>2. Les grandes familles de documents</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Documents relatifs à la commande</strong> : bon de commande, accusé de réception, lettre de commande.</li><li><strong>Documents relatifs à la livraison</strong> : bon de livraison, bordereau d'expédition, lettre de voiture.</li><li><strong>Documents relatifs à la facturation</strong> : facture, note de débit, note de crédit, avoir.</li><li><strong>Documents relatifs au paiement</strong> : lettre de change, billet à ordre, chèque, reçu.</li><li><strong>Documents relatifs au transport</strong> : lettre de voiture, connaissement, LTA.</li><li><strong>Documents douaniers</strong> : déclaration en détail, certificat d'origine.</li></ul></div>
<h3>3. Le circuit commercial type</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>1.</strong> Le client passe une <strong>commande</strong> (bon de commande).</li><li><strong>2.</strong> Le fournisseur <strong>confirme</strong> (accusé de réception).</li><li><strong>3.</strong> Il prépare la <strong>livraison</strong> (bon de livraison).</li><li><strong>4.</strong> Le transporteur achemine la marchandise (lettre de voiture, connaissement).</li><li><strong>5.</strong> Le fournisseur émet la <strong>facture</strong>.</li><li><strong>6.</strong> Le client paie (chèque, virement, effet).</li><li><strong>7.</strong> Le fournisseur délivre un <strong>reçu</strong> ou une <strong>quittance</strong>.</li></ul></div>
<h3>4. Applications en RDC</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Commerce de Kinshasa</strong> : un grossiste en produits alimentaires utilise le bon de commande, le bon de livraison et la facture pour approvisionner les détaillants.</li><li><strong>Import-export à Matadi</strong> : les documents douaniers (déclaration en détail, certificat d'origine) accompagnent les marchandises à l'entrée et à la sortie du territoire.</li><li><strong>Transport fluvial Kinshasa-Kisangani</strong> : la lettre de voiture fluviale et le connaissement fluvial encadrent les expéditions.</li></ul><p><a href="https://www.youtube.com/results?search_query=documentation+commerciale+documents+circuit+commercial" target="_blank" rel="noopener">🎥 Recherche : la documentation commerciale (chaînes de cours de gestion)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La documentation commerciale regroupe l'ensemble des documents qui matérialisent les opérations commerciales. Elle joue un rôle juridique, économique et administratif. Le circuit type comprend : commande, confirmation, livraison, transport, facturation, paiement, reçu.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Documentation Commerciale, 4e CG (manuels-scolaires-rdc.com, 2025) ; Curriculum de Commerciale et Gestion (MEPST/DIPROMAD, 2023).<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, LTA.</div>
    `
},
{
    title: "Leçon 2 — Les documents relatifs à la commande",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À Kinshasa, un client appelle une entreprise pour commander 50 cartons de biscuits. Avant la livraison, tout doit être formalisé par écrit : c'est le bon de commande. Sans ce document, aucune réclamation n'est possible. Il est la preuve de la volonté d'achat.</p></div>
<h3>1. Le bon de commande</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : document par lequel le client exprime sa volonté d'acheter des biens ou services dans des conditions déterminées.</li><li><strong>Mentions obligatoires</strong> : date, coordonnées du client et du fournisseur, désignation des produits, quantités, prix, délai de livraison, conditions de paiement.</li><li><strong>Valeur juridique</strong> : preuve de la commande, il engage les deux parties.</li><li><strong>Numérotation</strong> : chaque bon de commande porte un numéro unique pour la traçabilité.</li></ul></div>
<h3>2. La lettre de commande</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : version épistolaire du bon de commande, utilisée pour des commandes complexes ou personnalisées.</li><li><strong>Structure</strong> : en-tête, objet, référence, corps (désignation, quantité, prix), formule de politesse, signature.</li><li><strong>Avantage</strong> : permet d'expliquer les besoins spécifiques et les conditions particulières.</li></ul></div>
<h3>3. L'accusé de réception de la commande</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : document par lequel le fournisseur confirme au client la réception et l'acceptation de la commande.</li><li><strong>Mentions</strong> : numéro du bon de commande, date de réception, quantités confirmées, prix, délai de livraison.</li><li><strong>Utilité</strong> : informe le client que sa commande est prise en compte, permet d'éviter les malentendus.</li><li><strong>Variante</strong> : avis de réception, accusé de commande.</li></ul></div>
<h3>4. Exemples concrets</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Bon de commande n°2025-0125</strong> du 15 mars 2025. Client : Sarl Kanyinda, 123 avenue de la Paix, Kinshasa. Fournisseur : Sucrière de Kwilu-Ngongo. Objet : 50 cartons de biscuits × 25 000 FC = 1 250 000 FC. Livraison sous 7 jours. Paiement à 30 jours.</li><li><strong>Accusé de réception</strong> du 16 mars 2025 : « Nous confirmons votre commande n°2025-0125 pour 50 cartons de biscuits. Livraison prévue le 22 mars 2025. »</li><li><strong>Lettre de commande</strong> : utilisée par un particulier qui commande un meuble sur mesure à un menuisier de Lubumbashi, avec des dimensions précises et un délai de fabrication.</li></ul><p><a href="https://www.youtube.com/results?search_query=bon+de+commande+accusé+réception+lettre+commande" target="_blank" rel="noopener">🎥 Recherche : les documents de commande (chaînes de cours de gestion)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le bon de commande est le document par lequel le client exprime sa volonté d'acheter. La lettre de commande est sa forme épistolaire. L'accusé de réception confirme la commande. Tous portent des mentions obligatoires pour éviter les litiges.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Documentation Commerciale, 4e CG (manuels-scolaires-rdc.com, 2025).</div>
    `
},
{
    title: "Leçon 3 — Les documents relatifs à la livraison",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Une entreprise de Kinshasa expédie 200 sacs de farine à un client de Matadi. Avant de partir, le magasinier prépare un bon de livraison en trois exemplaires : l'un pour le client, l'un pour le transporteur, l'un pour la comptabilité. Sans ce document, impossible de prouver que la marchandise a quitté le magasin.</p></div>
<h3>1. Le bon de livraison</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : document qui accompagne la marchandise livrée et atteste la conformité de la livraison avec la commande.</li><li><strong>Mentions obligatoires</strong> : numéro, date, référence de la commande, désignation des produits, quantités livrées, signatures (livreur, réceptionnaire).</li><li><strong>Nombre d'exemplaires</strong> : généralement en 3 ou 4 exemplaires (client, fournisseur, comptabilité, transporteur).</li><li><strong>Valeur juridique</strong> : preuve de la livraison, base de la facturation.</li></ul></div>
<h3>2. Le bordereau d'expédition</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : document interne qui liste les marchandises expédiées.</li><li><strong>Utilité</strong> : contrôle interne des sorties de stock, préparation de la facturation.</li><li><strong>Mentions</strong> : numéro, date, destination, liste des articles, quantités, poids, valeur.</li></ul></div>
<h3>3. La lettre de voiture</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : document de transport qui matérialise le contrat entre l'expéditeur et le transporteur.</li><li><strong>Mentions</strong> : coordonnées de l'expéditeur, du destinataire, du transporteur, lieu de chargement, lieu de déchargement, nature de la marchandise, poids, frais de transport.</li><li><strong>Fonctions</strong> : preuve du contrat de transport, document d'accompagnement, justificatif comptable.</li><li><strong>Transport routier</strong> : lettre de voiture routière.</li><li><strong>Transport fluvial</strong> : lettre de voiture fluviale (utilisée sur le fleuve Congo).</li></ul></div>
<h3>4. Le connaissement maritime</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Définition</strong> : document de transport maritime émis par le transporteur (compagnie maritime).</li><li><strong>Mentions</strong> : coordonnées des parties, navire, port de chargement, port de destination, description de la marchandise, poids, nombre de colis, fret.</li><li><strong>Fonctions</strong> : reçu de la marchandise, contrat de transport, titre de propriété.</li><li><strong>Connaissement au port de Matadi</strong> : document clé pour le dédouanement des marchandises importées.</li><li><strong>LTA (Lettre de Transport Aérien)</strong> : document équivalent pour le transport aérien (aéroport de Ndjili).</li></ul><p><a href="https://www.youtube.com/results?search_query=bon+livraison+lettre+voiture+connaissement+maritime" target="_blank" rel="noopener">🎥 Recherche : les documents de livraison (chaînes de cours de gestion)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le bon de livraison atteste la livraison au client. Le bordereau d'expédition liste les marchandises sorties du magasin. La lettre de voiture matérialise le contrat de transport. Le connaissement maritime est le titre de propriété de la marchandise sur mer. La LTA est son équivalent aérien.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Documentation Commerciale, 4e CG (manuels-scolaires-rdc.com, 2025) ; Curriculum de Commerciale et Gestion (MEPST/DIPROMAD, 2023).</div>
    `
},
{
    title: "Leçon 4 — La facture et les documents de facturation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Après avoir livré 50 cartons de biscuits au client Kanyinda, l'entreprise de Kinshasa émet une facture. Celle-ci doit comporter la TVA, la remise commerciale, l'escompte de caisse et le net à payer. Une facture mal rédigée entraîne des litiges et des redressements fiscaux. Sa maîtrise est essentielle.</p></div>
<h3>1. La facture : définition et mentions obligatoires</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Facture</strong> : document commercial qui récapitule les biens vendus ou les services rendus, avec leur prix, et réclame le paiement.</li><li><strong>Mentions obligatoires</strong> : nom et coordonnées du vendeur et de l'acheteur, NIF, date, numéro, désignation, quantités, prix unitaires, taux de TVA, total HT, TVA, TTC.</li><li><strong>Valeur juridique</strong> : preuve de la vente, base de la comptabilité, pièce justificative.</li><li><strong>Numérotation continue</strong> : obligatoire, sans trou ni doublon.</li><li><strong>Facture normalisée</strong> : émise par les entreprises assujetties à la TVA via une machine certifiée DGI.</li></ul></div>
<h3>2. Les réductions commerciales et financières</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Remise</strong> : réduction accordée sur le prix de vente (client fidèle, grosse quantité).</li><li><strong>Rabais</strong> : réduction pour un défaut de qualité ou un retard.</li><li><strong>Ristourne</strong> : réduction périodique calculée sur le chiffre d'affaires annuel.</li><li><strong>Escompte</strong> : réduction accordée pour paiement comptant.</li><li><strong>Port</strong> : frais de transport facturés au client (port dû, port payé, port forfaitaire).</li></ul></div>
<h3>3. Le calcul sur facture</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>1.</strong> Calculer le montant brut (quantité × prix unitaire).</li><li><strong>2.</strong> Déduire la remise, le rabais, la ristourne (réductions commerciales).</li><li><strong>3.</strong> Obtenir le net commercial.</li><li><strong>4.</strong> Ajouter les frais de port, emballages, etc.</li><li><strong>5.</strong> Déduire l'escompte de caisse (réduction financière).</li><li><strong>6.</strong> Obtenir le net financier.</li><li><strong>7.</strong> Ajouter la TVA (16 %).</li><li><strong>8.</strong> Obtenir le net à payer TTC.</li></ul></div>
<h3>4. Exemple de calcul complet</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><p><strong>Facture n°2025-045</strong></p><ul><li>50 cartons de biscuits × 25 000 FC = 1 250 000 FC (brut).</li><li>Remise 5 % = 62 500 FC → net commercial = 1 187 500 FC.</li><li>Escompte 2 % = 23 750 FC → net financier = 1 163 750 FC.</li><li>TVA 16 % = 186 200 FC.</li><li><strong>Net à payer TTC</strong> = 1 349 950 FC.</li></ul><p><a href="https://www.youtube.com/results?search_query=facture+mentions+obligatoires+calcul+remise+escompte+TVA" target="_blank" rel="noopener">🎥 Recherche : la facture et son calcul (chaînes de cours de gestion)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La facture récapitule les biens vendus et réclame le paiement. Elle porte des mentions obligatoires (NIF, TVA, numérotation). Les réductions commerciales (remise, rabais, ristourne) et financières (escompte) se déduisent successivement. Le calcul aboutit au net à payer TTC.</p></div>
<div class="sources"><strong>Sources :</strong> Fiches pédagogiques officielles — Documentation Commerciale, 4e CG (manuels-scolaires-rdc.com, 2025) ; DGI — Facture normalisée (dgi.gouv.cd).</div>
    `
},
{
    title: "Leçon 5 — Les notes de débit et de crédit (avoirs)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un client de Goma reçoit 50 cartons de biscuits, mais 5 sont avariés. Il réclame un avoir. Le fournisseur émet une note de crédit pour corriger la facture initiale. Ces documents correctifs sont essentiels pour rectifier les erreurs et ajuster les comptes.</p></div>
<h3>1. La note de débit</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : document par lequel le fournisseur augmente le montant dû par le client (ou le client augmente la somme due au fournisseur).</li><li><strong>Causes</strong> : oubli de facturation, erreur de prix, frais supplémentaires (port, emballage), intérêts de retard.</li><li><strong>Effet comptable</strong> : augmentation de la créance du fournisseur ou de la dette du client.</li><li><strong>Mentions</strong> : référence de la facture initiale, motif, montant, TVA.</li></ul></div>
<h3>2. La note de crédit (avoir)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : document par lequel le fournisseur réduit le montant dû par le client (ou le client réduit la somme due au fournisseur).</li><li><strong>Causes</strong> : retour de marchandises, erreur de facturation, remise oubliée, marchandises non conformes.</li><li><strong>Effet comptable</strong> : réduction de la créance du fournisseur ou de la dette du client.</li><li><strong>Forme</strong> : souvent de couleur rouge pour la distinguer visuellement.</li><li><strong>Terme synonyme</strong> : avoir.</li></ul></div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La note de débit augmente le montant dû par le client. La note de crédit (avoir) le diminue. Elles corrigent les erreurs, les retours de marchandises ou les oublis. Le calcul de l'avoir suit la même logique que celui de la facture (remise, TVA).</p></div>

<h3>1. La lettre de change (traite)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : écrit par lequel le <strong>tireur</strong> (créancier) donne ordre au <strong>tiré</strong> (débiteur) de payer une somme à une échéance déterminée au <strong>bénéficiaire</strong>.</li><li><strong>Trois parties</strong> : tireur (celui qui émet), tiré (celui qui doit payer), bénéficiaire (celui qui reçoit).</li><li><strong>Mentions obligatoires</strong> : date, lieu, somme, échéance, noms des parties, signature du tireur.</li><li><strong>Acceptation</strong> : le tiré signe la traite, s'engageant à payer à échéance.</li><li><strong>Endossement</strong> : le bénéficiaire peut transférer la traite à un tiers en la signant au dos.</li></ul></div>
<h3>2. Le billet à ordre</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : écrit par lequel le <strong>souscripteur</strong> (débiteur) s'engage à payer une somme au <strong>bénéficiaire</strong> (créancier) à une échéance déterminée.</li><li><strong>Deux parties seulement</strong> : souscripteur et bénéficiaire.</li><li><strong>Différence avec la traite</strong> : dans la traite, c'est le créancier qui émet ; dans le billet à ordre, c'est le débiteur.</li><li><strong>Usage</strong> : très utilisé dans le commerce de gros.</li></ul></div>
<h3>3. Le chèque</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : ordre de paiement donné par le <strong>tireur</strong> à sa banque de payer une somme au <strong>bénéficiaire</strong>.</li><li><strong>Mentions</strong> : numéro, date, lieu, montant en chiffres et en lettres, nom du bénéficiaire, signature.</li><li><strong>Types</strong> : chèque barré (non encaissable en espèces), chèque visé (garanti par la banque), chèque certifié.</li><li><strong>Délai de validité</strong> : 1 an à compter de la date d'émission (OHADA).</li><li><strong>Sanctions</strong> : chèque sans provision, opposition abusive, falsification.</li></ul></div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les effets de commerce sont des titres négociables qui garantissent les transactions à crédit. La lettre de change implique trois parties (tireur, tiré, bénéficiaire). Le billet à ordre n'en implique que deux. Le chèque est un ordre de paiement donné à la banque. Les moyens modernes (Mobile Money) se développent en RDC.</p></div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le commerce international exige une documentation rigoureuse : déclaration en détail, facture commerciale, liste de colisage, certificat d'origine, connaissement. Les Incoterms définissent les obligations des parties. Le crédit documentaire sécurise les transactions internationales. Les ports de Matadi et les postes frontaliers de Kasumbalesa sont les points d'entrée clés de la RDC.</p></div>

        </div>
        <div class="quiz-container" id="quizContainer">
            <h3 style="color:#0d2b4f;margin-bottom:16px;font-size:1.1rem;">Partie 1 — Questions</h3>
            <div id="quizQuestions"></div>
            <button id="submitQuiz" class="quiz-btn-submit">Valider mes réponses</button>
            <div id="quizResult" class="quiz-result"></div>
        </div>
    `
}
];

let currentSlide = 0;
let lastSearchTerm = "", searchResults = [], currentResultIdx = -1;
const contentDiv = document.getElementById('content');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const slideCounterSpan = document.getElementById('slideCounter');
const progressFill = document.getElementById('progressFill');
const counterSpan = document.getElementById('counter');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchNav = document.getElementById('searchNav');
const prevResultBtn = document.getElementById('prevResultBtn');
const nextResultBtn = document.getElementById('nextResultBtn');
const resultCounterSpan = document.getElementById('resultCounter');

function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim()) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderQuiz() {
    const questions = [
        { text:"Quel document exprime la volonté d'achat du client ?", options:["Le bon de commande","La facture","Le bon de livraison"], correct:0 },
        { text:"Quel document confirme au client que sa commande est prise en compte ?", options:["L'accusé de réception","La facture","Le bordereau d'expédition"], correct:0 },
        { text:"Quel document accompagne la marchandise livrée au client ?", options:["Le bon de livraison","La facture","Le bon de commande"], correct:0 },
        { text:"Quel document liste les marchandises expédiées en interne ?", options:["Le bordereau d'expédition","La facture","Le connaissement"], correct:0 },
        { text:"Quel document matérialise le contrat de transport routier ?", options:["La lettre de voiture","La facture","Le bon de livraison"], correct:0 },
        { text:"Quel document est un titre de propriété de la marchandise sur mer ?", options:["Le connaissement maritime","La lettre de voiture","La facture"], correct:0 },
        { text:"Quel est l'équivalent aérien du connaissement maritime ?", options:["La LTA","Le bon de commande","La facture"], correct:0 },
        { text:"Que récapitule la facture ?", options:["Les biens vendus et leur prix","Les stocks","La paie"], correct:0 },
        { text:"Quelle mention obligatoire doit figurer sur une facture ?", options:["Le NIF","Le numéro de sécurité sociale","Le diplôme"], correct:0 },
        { text:"Quel est le taux normal de la TVA en RDC ?", options:["16 %","18 %","20 %"], correct:0 },
        { text:"Quelle réduction est accordée pour paiement comptant ?", options:["L'escompte","La remise","Le rabais"], correct:0 },
        { text:"Quelle réduction est accordée pour un défaut de qualité ?", options:["Le rabais","La remise","La ristourne"], correct:0 },
        { text:"Quelle réduction est calculée sur le chiffre d'affaires annuel ?", options:["La ristourne","La remise","L'escompte"], correct:0 },
        { text:"Que fait une note de débit ?", options:["Elle augmente le montant dû par le client","Elle le diminue","Elle l'annule"], correct:0 },
        { text:"Que fait une note de crédit ?", options:["Elle diminue le montant dû par le client","Elle l'augmente","Elle l'annule"], correct:0 },
        { text:"Quel est l'autre nom de la note de crédit ?", options:["Avoir","Débit","Quittance"], correct:0 },
        { text:"Quelles sont les trois parties d'une lettre de change ?", options:["Tireur, tiré, bénéficiaire","Vendeur, acheteur, banque","Client, fournisseur, transporteur"], correct:0 },
        { text:"Qui émet une lettre de change ?", options:["Le créancier","Le débiteur","La banque"], correct:0 },
        { text:"Qui émet un billet à ordre ?", options:["Le débiteur","Le créancier","La banque"], correct:0 },
        { text:"Quelle est la durée de validité d'un chèque ?", options:["1 an","6 mois","3 mois"], correct:0 },
        { text:"Quel est le principal document déposé à la DGDA pour le dédouanement ?", options:["La déclaration en détail","La facture commerciale","Le certificat d'origine"], correct:0 },
        { text:"Que signifie CIF en Incoterms ?", options:["Cost, Insurance, Freight","Cost, Interest, Free","Cash, Insurance, Freight"], correct:0 },
        { text:"Quel Incoterm signifie que la marchandise est disponible à l'usine ?", options:["EXW","FOB","CIF"], correct:0 },
        { text:"Quel document atteste le pays de fabrication ?", options:["Le certificat d'origine","Le certificat phytosanitaire","La facture commerciale"], correct:0 },
        { text:"Quel est le principal port maritime de la RDC ?", options:["Matadi","Boma","Banana"], correct:0 },
        { text:"Quel poste frontalier relie la RDC à la Zambie ?", options:["Kasumbalesa","Goma","Bunia"], correct:0 },
        { text:"Quel est le plus long corridor fluvial de la RDC ?", options:["Kinshasa-Kisangani","Kinshasa-Matadi","Lubumbashi-Kasumbalesa"], correct:0 },
        { text:"Combien de temps dure le trajet fluvial Kinshasa-Kisangani ?", options:["7 à 15 jours","1 à 2 jours","1 mois"], correct:0 },
        { text:"Quelle est la durée légale de conservation des documents commerciaux ?", options:["10 ans","5 ans","2 ans"], correct:0 },
        { text:"Quel type de classement utilise les noms de clients ?", options:["Alphabétique","Numérique","Chronologique"], correct:0 },
        { text:"Quel type de classement utilise les dates ?", options:["Chronologique","Alphabétique","Thématique"], correct:0 },
        { text:"Que signifie GED ?", options:["Gestion Électronique des Documents","Gestion des Entreprises Dématérialisées","Groupe d'Experts Documentaires"], correct:0 },
        { text:"Quel organisme délivre la facture normalisée en RDC ?", options:["La DGI","La DGDA","La DGRAD"], correct:0 },
        { text:"Quel système informatique utilise la DGDA pour le dédouanement ?", options:["SYDONIA","E-tax","GUCE"], correct:0 },
        { text:"Quelle plateforme permet la création d'entreprise en ligne en RDC ?", options:["Le GUCE","SYDONIA","E-tax"], correct:0 }
    ];
    let html = '';
    questions.forEach((q,i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o,k) => { html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>'; });
        html += '</div>';
    });
    document.getElementById('quizQuestions').innerHTML = html;
    document.getElementById('submitQuiz').onclick = () => {
        let score = 0;
        questions.forEach((q,i) => {
            const s = document.querySelector('input[name="q' + i + '"]:checked');
            if (s && parseInt(s.value) === q.correct) score++;
        });
        const pct = Math.round(score/questions.length*100);
        document.getElementById('quizResult').innerHTML = '<div style="background:#cfdff5;padding:16px;border-radius:10px;margin-top:14px;"><strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong><br>' + (score === questions.length ? 'Excellent. Tu maîtrises le programme.' : score >= 24 ? 'Bien. Revoyez les leçons où vous avez échoué.' : 'Relis attentivement les leçons avant l\'examen.') + '</div>';
    };
}
function renderSlide(index, keepHighlight = true) {
    const isQuiz = (index === slides.length - 1);
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    if (isQuiz) renderQuiz();
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm && !isQuiz) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>
</body>
</html>
