    title: "Leçon 1 — L'entreprise et la comptabilité",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi une entreprise doit-elle tenir des comptes ? Que se passerait-il si elle ne notait rien ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir l'entreprise et ses fonctions. Définir la comptabilité et son objet. Comprendre le rôle de la comptabilité dans l'entreprise. Prérequis : notions de calcul arithmétique et de logique.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'<strong>entreprise</strong> est une unité économique qui produit des biens ou des services pour les vendre, en combinant des moyens humains, matériels et financiers. Elle peut être classée selon son secteur (primaire, secondaire, tertiaire), sa taille (micro, petite, moyenne, grande) ou son statut juridique (publique, privée, paraétatique).</p>
<p><strong>Fonctions internes :</strong> technique, commerciale, financière, sécurité, administrative et comptable.</p>
<p>La <strong>comptabilité générale</strong> est une technique d'enregistrement et de communication d'informations financières. Son objet est de fournir une image fidèle du patrimoine, de la situation financière et du résultat de l'entreprise à une date donnée.</p>
<p>Elle sert à : informer (dirigeants, associés, banques, État), contrôler (gestion), prouver (obligations légales), décider (pilotage).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Entreprise :</strong> unité économique de production de biens ou de services. <strong>Comptabilité générale :</strong> technique d'enregistrement et de communication d'informations financières. <strong>Patrimoine :</strong> ensemble des biens et des dettes. <strong>Image fidèle :</strong> représentation sincère de la situation financière. <strong>Fonction comptable :</strong> fonction qui enregistre et traite l'information financière.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>La comptabilité est obligatoire pour la plupart des entreprises (droit OHADA, Code des impôts). Elle doit être régulière, sincère et fidèle. Elle repose sur des pièces justificatives (factures, reçus). Elle est tenue chronologiquement (journal) et classée (grand-livre).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une coopérative agricole à Kananga vend du manioc. Elle enregistre ses ventes, ses achats, ses salaires, ses impôts. La comptabilité lui permet de savoir si elle gagne ou perd de l'argent. Un petit commerce d'électronique à Lubumbashi achète des téléphones et les revend : la comptabilité enregistre les entrées et les sorties, calcule la marge, prépare les déclarations fiscales.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis la comptabilité générale.</p>
<p><strong>Ex. 2 :</strong> Cite trois fonctions de l'entreprise.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Une technique d'enregistrement et de communication d'informations financières, visant à donner une image fidèle du patrimoine et du résultat.</p>
<p><strong>2)</strong> Technique, commerciale, financière (3 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La comptabilité est le système d'information central de l'entreprise ; elle enregistre, informe et prouve.</p></div>

<div class="sources"><strong>Sources :</strong> Curriculum Commerciale et Gestion (RDC) ; Manuel Comptabilité Générale Niveau 1 (2025) ; SYSCOHADA révisé.</div>
    `

{
    title: "Leçon 2 — Les principes comptables fondamentaux",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi les entreprises doivent-elles suivre les mêmes règles comptables ? Que se passerait-il si chacune faisait à sa manière ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les principes du SYSCOHADA. Comprendre leur rôle. Les appliquer à des situations simples. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>SYSCOHADA révisé</strong> (Acte uniforme du 26 janvier 2017, applicable au 1er janvier 2018) fixe les principes comptables fondamentaux que toute entreprise doit respecter :</p>
<ol>
<li><strong>Prudence :</strong> ne pas surévaluer les actifs ni les produits, ni sous-évaluer les dettes et les charges.</li>
<li><strong>Permanence des méthodes :</strong> garder les mêmes méthodes d'un exercice à l'autre.</li>
<li><strong>Correspondance bilan de clôture / bilan d'ouverture :</strong> le bilan de clôture d'un exercice devient le bilan d'ouverture du suivant.</li>
<li><strong>Coût historique :</strong> enregistrer les biens à leur coût d'acquisition.</li>
<li><strong>Continuité d'exploitation :</strong> présumer que l'entreprise continuera son activité.</li>
<li><strong>Spécialisation des exercices :</strong> rattacher charges et produits à l'exercice concerné.</li>
<li><strong>Intangibilité du bilan d'ouverture :</strong> ne pas le modifier.</li>
<li><strong>Non-compensation :</strong> ne pas compenser charges et produits, ni actifs et passifs.</li>
</ol>
<p>Ces principes garantissent la fiabilité, la comparabilité et la transparence de l'information financière.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Principe comptable :</strong> règle de base. <strong>Prudence :</strong> ne pas surestimer les gains ni sous-estimer les pertes. <strong>Permanence des méthodes :</strong> stabilité des méthodes. <strong>Coût historique :</strong> valeur d'acquisition. <strong>Continuité d'exploitation :</strong> poursuite de l'activité. <strong>Spécialisation :</strong> rattachement à l'exercice.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Appliquer les principes à chaque enregistrement. Vérifier la cohérence des états financiers. Documenter les méthodes utilisées (annexe). Ne pas déroger sans justification.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une entreprise achète un terrain 10 millions CDF. Elle l'enregistre à 10 millions (coût historique), même si sa valeur de marché est de 15 millions. La prudence interdit d'anticiper un gain non réalisé. Une entreprise qui change de méthode d'amortissement sans justification viole le principe de permanence des méthodes : l'information financière devient non comparable.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite trois principes comptables fondamentaux.</p>
<p><strong>Ex. 2 :</strong> Que signifie le principe de prudence ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Prudence, permanence des méthodes, coût historique (3 au choix).</p>
<p><strong>2)</strong> Ne pas surévaluer les actifs et les produits, ni sous-évaluer les dettes et les charges.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les principes comptables garantissent la qualité de l'information financière ; ils sont la base du SYSCOHADA.</p></div>

<div class="sources"><strong>Sources :</strong> SYSCOHADA révisé (OHADA) ; Manuel Comptabilité Générale Niveau 1 (2025).</div>
    `
},

    title: "Leçon 3 — Les flux économiques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Quand une entreprise achète une marchandise, que se passe-t-il ? Qu'est-ce qui entre ? Qu'est-ce qui sort ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir un flux économique. Distinguer les types de flux. Analyser une opération en termes de flux. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un <strong>flux économique</strong> est un mouvement de valeur entre l'entreprise et son environnement, ou à l'intérieur de l'entreprise.</p>
<p><strong>Types :</strong></p>
<ul>
<li><strong>Flux réels :</strong> mouvements de biens ou de services (achat, vente, prestation).</li>
<li><strong>Flux monétaires (financiers) :</strong> mouvements d'argent (paiement, encaissement, emprunt, remboursement).</li>
<li><strong>Flux internes :</strong> mouvements internes (transfert de stock, production).</li>
<li><strong>Flux externes :</strong> mouvements avec l'extérieur (clients, fournisseurs, banques, État).</li>
</ul>
<p>Chaque opération est analysée selon une double perspective : l'<strong>emploi</strong> (destination de la valeur) et la <strong>ressource</strong> (origine de la valeur). Emploi : ce que l'entreprise utilise. Ressource : ce que l'entreprise obtient.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Flux économique :</strong> mouvement de valeur. <strong>Flux réel :</strong> mouvement de biens ou de services. <strong>Flux monétaire :</strong> mouvement d'argent. <strong>Emploi :</strong> destination de la valeur. <strong>Ressource :</strong> origine de la valeur.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier l'opération (achat, vente, paiement). Classer le flux (réel ou monétaire, interne ou externe). Déterminer l'emploi et la ressource. Traduire dans le compte (débit/crédit).</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une entreprise achète 100 sacs de ciment à 50 000 CDF. Flux réel : entrée de ciment (emploi = achat). Flux monétaire : sortie d'argent (ressource = caisse ou dette fournisseur). Une entreprise vend des téléphones à crédit. Flux réel : sortie de téléphones (ressource = vente). Flux monétaire : entrée future d'argent (emploi = créance client).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Qu'est-ce qu'un flux réel ?</p>
<p><strong>Ex. 2 :</strong> Dans un achat de marchandises à crédit, quel est l'emploi ? quelle est la ressource ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Un mouvement de biens ou de services.</p>
<p><strong>2)</strong> Emploi = achat de marchandises ; ressource = dette fournisseur.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'analyse des flux (emploi/ressource) est la première étape de tout enregistrement comptable.</p></div>

<div class="sources"><strong>Sources :</strong> Manuel Comptabilité Générale Niveau 1 (2025) ; fiches pédagogiques (2025).</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment enregistrer les mouvements d'une entreprise ? Où noter ce qui entre et ce qui sort ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir un compte. Connaître sa structure. Utiliser le compte en T. Prérequis : leçon 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>

<ul>
<li>Les comptes d'<strong>actif</strong> augmentent au débit et diminuent au crédit.</li>
<li>Les comptes de <strong>passif</strong> augmentent au crédit et diminuent au débit.</li>
<li>Les comptes de <strong>charges</strong> augmentent au débit.</li>
<li>Les comptes de <strong>produits</strong> augmentent au crédit.</li>
</ul>
<p>Le <strong>solde</strong> d'un compte est la différence entre le total du débit et le total du crédit.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>

</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Ouvrir un compte pour chaque élément (caisse, banque, clients, fournisseurs). Inscrire les mouvements au débit ou au crédit selon la nature du compte. Calculer le solde régulièrement. Vérifier la cohérence.</p>

    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi chaque opération est-elle enregistrée deux fois ? Pourquoi le total du débit doit-il être égal au total du crédit ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le principe. L'appliquer à des opérations simples. Vérifier l'équilibre débit/crédit. Prérequis : leçons 3 et 4.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le <strong>principe de la partie double</strong> est le fondement de la comptabilité : tout mouvement inscrit au débit d'un ou plusieurs comptes doit avoir une contrepartie d'un montant égal au crédit d'un ou plusieurs autres comptes.</p>
<p><strong>Règle :</strong> Total Débits = Total Crédits pour chaque opération et pour l'ensemble des opérations.</p>
<p><strong>Conséquence :</strong> la comptabilité est équilibrée ; toute erreur se traduit par un déséquilibre.</p>
<p><strong>Application :</strong> pour chaque opération, identifier les comptes concernés, le compte à débiter, le compte à créditer et le montant.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Partie double :</strong> principe d'enregistrement symétrique. <strong>Contrepartie :</strong> enregistrement opposé. <strong>Équilibre :</strong> égalité débit/crédit. <strong>Écriture comptable :</strong> enregistrement d'une opération.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Analyser l'opération (emploi/ressource). Identifier les comptes. Débiter le compte d'emploi (ou d'actif qui augmente, ou de charge). Créditer le compte de ressource (ou de passif qui augmente, ou de produit). Vérifier l'égalité débit/crédit.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Achat de marchandises à crédit pour 100 000 CDF : débit compte Achats de marchandises (charge) 100 000 ; crédit compte Fournisseurs (passif) 100 000. Total débits = 100 000 ; total crédits = 100 000. Équilibré.</p>
<p>Vente de marchandises au comptant pour 150 000 CDF : débit compte Caisse (actif) 150 000 ; crédit compte Ventes de marchandises (produit) 150 000.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Énonce le principe de la partie double.</p>
<p><strong>Ex. 2 :</strong> Passe l'écriture d'un achat de fournitures à crédit de 50 000 CDF.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Tout mouvement au débit doit avoir une contrepartie égale au crédit.</p>
<p><strong>2)</strong> Débit Fournitures 50 000 ; crédit Fournisseurs 50 000.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La partie double garantit l'équilibre et la fiabilité de la comptabilité.</p></div>

<div class="sources"><strong>Sources :</strong> SYSCOHADA révisé ; Manuel Comptabilité Générale Niveau 1 (2025).</div>
    `
},

  var PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
  var DL = '<svg viewBox="0 0 24 24"><path d="M11 3h2v9.2l3.6-3.6L18 10l-6 6-6-6 1.4-1.4L11 12.2V3zM5 19h14v2H5z"/></svg>';
  var OK = '<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';
  try {
    if (typeof questions !== "undefined" && questions && questions.forEach) {
      questions.forEach(function (q) {
        if (!q.options) q.options = q.opts || q.choices || q.choix || q.reponses || q.propositions || [];
        if (q.text === undefined) q.text = q.question || q.q || q.enonce || q.titre || "";

  var synth = window.speechSynthesis || null;
  var HAS_CACHE = !!(window.caches && window.caches.open);
  var NATIVE = false;
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  var LATER = "ecolia_audio_later_" + CFG.code;
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function init() {
    if (document.getElementById("ecolia-audio-btn")) return;
    var btn = document.createElement("button");
    btn.id = "ecolia-audio-btn"; btn.type = "button"; btn.className = "ecolia-off";
    btn.setAttribute("aria-label", "Écouter la leçon"); btn.innerHTML = PLAY;
    var dlBtn = document.createElement("button");
    dlBtn.id = "ecolia-dl-btn"; dlBtn.type = "button"; dlBtn.className = "ecolia-off";
    dlBtn.innerHTML = DL;
    var host = document.querySelector(".header-right");
    if (host) { host.insertBefore(dlBtn, host.firstChild); host.insertBefore(btn, dlBtn); }
    else { btn.className += " ecolia-fixed"; document.body.appendChild(btn); }
    var banner = document.createElement("div");
    banner.id = "ecolia-audio-banner";
    banner.innerHTML = '<span class="eab-txt"></span><span class="eab-act"></span><div class="eab-bar"><i></i></div>';
    var content = document.getElementById("content");
    if (content && content.parentNode) content.parentNode.insertBefore(banner, content);
    else document.body.insertBefore(banner, document.body.firstChild);
    var txtEl = banner.querySelector(".eab-txt"), actEl = banner.querySelector(".eab-act");
    var barEl = banner.querySelector(".eab-bar"), barI = barEl.firstChild;
    var audio = new Audio();
    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }
    function cur() { try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {} return 0; }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }

            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }

        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }

    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);

          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;

        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }

      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }

      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);

        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }

            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));

      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });

      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);

})();
