<div class="bloc cas"><div class="bloc-label">Situation</div><p>Ton professeur de grec écrit au tableau : « ἄνθρωπος » (anthrôpos). Tu reconnais des lettres étranges. Avant de traduire, il faut apprendre l'alphabet grec. C'est la première étape de tout helléniste.</p></div>
<h3>1. L'alphabet grec</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>24 lettres</strong> : 7 voyelles (α, ε, η, ι, ο, υ, ω) et 17 consonnes.</li><li><strong>Alpha</strong> (Α, α) = a ; <strong>Bêta</strong> (Β, β) = b ; <strong>Gamma</strong> (Γ, γ) = g ; <strong>Delta</strong> (Δ, δ) = d ; <strong>Epsilon</strong> (Ε, ε) = é bref ; <strong>Zêta</strong> (Ζ, ζ) = dz ; <strong>Êta</strong> (Η, η) = é long ; <strong>Thêta</strong> (Θ, θ) = th ; <strong>Iôta</strong> (Ι, ι) = i ; <strong>Kappa</strong> (Κ, κ) = k ; <strong>Lambda</strong> (Λ, λ) = l ; <strong>Mu</strong> (Μ, μ) = m ; <strong>Nu</strong> (Ν, ν) = n ; <strong>Xi</strong> (Ξ, ξ) = x ; <strong>Omicron</strong> (Ο, ο) = o bref ; <strong>Pi</strong> (Π, π) = p ; <strong>Rhô</strong> (Ρ, ρ) = r ; <strong>Sigma</strong> (Σ, σ/ς) = s ; <strong>Tau</strong> (Τ, τ) = t ; <strong>Upsilon</strong> (Υ, υ) = u ; <strong>Phi</strong> (Φ, φ) = ph ; <strong>Khi</strong> (Χ, χ) = kh ; <strong>Psi</strong> (Ψ, ψ) = ps ; <strong>Oméga</strong> (Ω, ω) = ô long.</li></ul></div>
<h3>2. Les esprits et les accents</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Esprit rude</strong> (῾) : se prononce comme un « h » aspiré (ἁ = ha).</li><li><strong>Esprit doux</strong> (᾿) : ne se prononce pas (ἀ = a).</li><li><strong>Accent aigu</strong> (´) : sur la dernière, l'avant-dernière ou l'antépénultième syllabe.</li><li><strong>Accent grave</strong> (`) : remplace l'aigu sur la dernière syllabe dans certains cas.</li><li><strong>Accent circonflexe</strong> (῀) : sur une syllabe longue.</li><li>Tout mot commençant par une voyelle porte un esprit.</li></ul></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Nominatif</strong> : ὁ (m.), ἡ (f.), τό (n.).</li><li><strong>Génitif</strong> : τοῦ, τῆς, τοῦ.</li><li><strong>Datif</strong> : τῷ, τῇ, τῷ.</li><li><strong>Accusatif</strong> : τόν, τήν, τό.</li><li>L'article s'accorde en genre, nombre et cas avec le nom qu'il détermine.</li></ul></div>

<h3>1. Le présent de l'indicatif</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>λύω</strong> (je délie)</li><li><strong>λύεις</strong> (tu délies)</li><li><strong>λύει</strong> (il/elle délie)</li><li><strong>λύομεν</strong> (nous déliions)</li><li><strong>λύετε</strong> (vous déliez)</li><li><strong>λύουσι(ν)</strong> (ils/elles délient)</li></ul></div>
<h3>2. Les temps principaux</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Imparfait</strong> : ἔλυον (je déliions) — augment ἐ- + radical.</li><li><strong>Futur</strong> : λύσω (je délierai) — suffixe -σ-.</li><li><strong>Aoriste</strong> : ἔλυσα (je déliai) — augment + -σ-.</li><li><strong>Parfait</strong> : λέλυκα (j'ai délié) — redoublement.</li><li><strong>Parfait passif</strong> : λέλυμαι (j'ai été délié).</li></ul></div>

    title: "Leçon 5 — Les textes homériques : l'Iliade et l'Odyssée",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Tu lis le début de l'Iliade : « Μῆνιν ἄειδε, θεά, Πηληϊάδεω Ἀχιλῆος » (« Chante, déesse, la colère d'Achille »). Homère est le premier grand poète grec. Son influence est immense.</p></div>
<h3>1. Homère et les épopées</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Homère</strong> (VIIIe siècle av. J.-C.) : poète légendaire, auteur de l'<em>Iliade</em> et de l'<em>Odyssée</em>.</li><li><strong>Iliade</strong> : récit de la colère d'Achille pendant la guerre de Troie.</li><li><strong>Odyssée</strong> : récit du retour d'Ulysse après la guerre de Troie.</li><li><strong>Langue homérique</strong> : dialecte ionien mêlé d'éolien, avec des formes archaïques.</li><li><strong>Vers</strong> : hexamètre dactylique.</li></ul></div>
<h3>2. Les thèmes homériques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Colère et vengeance</strong> (Iliade) : la colère d'Achille contre Agamemnon.</li><li><strong>Ruse et intelligence</strong> (Odyssée) : Ulysse, l'homme aux mille ruses.</li><li><strong>Honneur et gloire</strong> : la <em>timê</em> et la <em>kleos</em>.</li><li><strong>Destin et liberté</strong> : les dieux et le <em>moira</em>.</li><li><strong>Hospitalité</strong> (<em>xenia</em>) : accueil de l'étranger.</li></ul></div>
<h3>3. Extrait et traduction</h3>

let currentSlide = 0;
let lastSearchTerm = "", searchResults = [], currentResultIdx = -1;
const contentDiv = document.getElementById('content');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const slideCounterSpan = document.getElementById('slideCounter');
const progressFill = document.getElementById('progressFill');
const counterSpan = document.getElementById('counter');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchNav = document.getElementById('searchNav');
const prevResultBtn = document.getElementById('prevResultBtn');
const nextResultBtn = document.getElementById('nextResultBtn');
const resultCounterSpan = document.getElementById('resultCounter');

function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim()) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderQuiz() {
    const questions = [
        { text:"Combien de lettres compte l'alphabet grec ?", options:["20","24","26"], correct:1 },

        { text:"Quel est le génitif singulier de la 1re déclinaison ?", options:["-ας/-ης","-ου","-ος"], correct:0 },
        { text:"Quel est le génitif singulier de la 2e déclinaison ?", options:["-ας/-ης","-ου","-ος"], correct:1 },

        { text:"Quel est le sujet de l'Odyssée ?", options:["La colère d'Achille","Le retour d'Ulysse","La guerre de Troie"], correct:1 },
        { text:"Qui a écrit l'« Apologie de Socrate » ?", options:["Platon","Aristote","Sophocle"], correct:0 },
        { text:"Qui a écrit la « Métaphysique » ?", options:["Platon","Aristote","Socrate"], correct:1 },
        { text:"Qui a écrit « Œdipe roi » ?", options:["Eschyle","Sophocle","Euripide"], correct:1 },
        { text:"Qui a écrit « Médée » ?", options:["Eschyle","Sophocle","Euripide"], correct:2 },
        { text:"Qui est le « père de l'histoire » ?", options:["Hérodote","Thucydide","Homère"], correct:0 },
        { text:"Qui a écrit l'« Histoire de la guerre du Péloponnèse » ?", options:["Hérodote","Thucydide","Xénophon"], correct:1 },
        { text:"Que signifie « philosophia » ?", options:["Amour de la sagesse","Science","Art"], correct:0 },
        { text:"Que signifie « logos » ?", options:["Parole, raison","Guerre","Paix"], correct:0 },
        { text:"Que signifie « sophia » ?", options:["Sagesse","Beauté","Force"], correct:0 },
        { text:"Que signifie « polis » ?", options:["Cité","Maison","Champ"], correct:0 },
        { text:"Quel est le cas du sujet en grec ?", options:["Nominatif","Génitif","Accusatif"], correct:0 },
        { text:"Quel est le cas du COD en grec ?", options:["Nominatif","Génitif","Accusatif"], correct:2 },
        { text:"Que marque l'augment ἐ- ?", options:["Un temps passé","Un futur","Un participe"], correct:0 },
        { text:"Que marque le redoublement au parfait ?", options:["L'action accomplie","Le futur","L'impératif"], correct:0 },
        { text:"Quel est le rôle du chœur dans la tragédie ?", options:["Commenter l'action","Jouer le héros","Diriger la cité"], correct:0 },
        { text:"Qu'est-ce que la « catharsis » ?", options:["La purgation des passions","La colère","Le destin"], correct:0 }
    ];
    let html = '';
    questions.forEach((q,i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o,k) => { html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>'; });
        html += '</div>';
    });
    document.getElementById('quizQuestions').innerHTML = html;
    document.getElementById('submitQuiz').onclick = () => {
        let score = 0;
        questions.forEach((q,i) => {
            const s = document.querySelector('input[name="q' + i + '"]:checked');
            if (s && parseInt(s.value) === q.correct) score++;
        });
        const pct = Math.round(score/questions.length*100);
        document.getElementById('quizResult').innerHTML = '<div style="background:#cfdff5;padding:16px;border-radius:10px;margin-top:14px;"><strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong><br>' + (score === questions.length ? 'Excellent. Tu maîtrises le programme.' : score >= 21 ? 'Bien. Revoyez les leçons où vous avez échoué.' : 'Relis attentivement les leçons avant l\'examen.') + '</div>';
    };
}
function renderSlide(index, keepHighlight = true) {
    const isQuiz = (index === slides.length - 1);
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    if (isQuiz) renderQuiz();
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm && !isQuiz) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>
