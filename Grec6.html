{
    title: "Leçon 1 — Introduction au grec ancien : alphabet et prononciation",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Ton professeur de grec écrit au tableau : « ἄνθρωπος » (anthrôpos). Tu reconnais des lettres étranges. Avant de traduire, il faut apprendre l'alphabet grec. C'est la première étape de tout helléniste.</p></div>
<h3>1. L'alphabet grec</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>24 lettres</strong> : 7 voyelles (α, ε, η, ι, ο, υ, ω) et 17 consonnes.</li><li><strong>Alpha</strong> (Α, α) = a ; <strong>Bêta</strong> (Β, β) = b ; <strong>Gamma</strong> (Γ, γ) = g ; <strong>Delta</strong> (Δ, δ) = d ; <strong>Epsilon</strong> (Ε, ε) = é bref ; <strong>Zêta</strong> (Ζ, ζ) = dz ; <strong>Êta</strong> (Η, η) = é long ; <strong>Thêta</strong> (Θ, θ) = th ; <strong>Iôta</strong> (Ι, ι) = i ; <strong>Kappa</strong> (Κ, κ) = k ; <strong>Lambda</strong> (Λ, λ) = l ; <strong>Mu</strong> (Μ, μ) = m ; <strong>Nu</strong> (Ν, ν) = n ; <strong>Xi</strong> (Ξ, ξ) = x ; <strong>Omicron</strong> (Ο, ο) = o bref ; <strong>Pi</strong> (Π, π) = p ; <strong>Rhô</strong> (Ρ, ρ) = r ; <strong>Sigma</strong> (Σ, σ/ς) = s ; <strong>Tau</strong> (Τ, τ) = t ; <strong>Upsilon</strong> (Υ, υ) = u ; <strong>Phi</strong> (Φ, φ) = ph ; <strong>Khi</strong> (Χ, χ) = kh ; <strong>Psi</strong> (Ψ, ψ) = ps ; <strong>Oméga</strong> (Ω, ω) = ô long.</li></ul></div>
<h3>2. Les esprits et les accents</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Esprit rude</strong> (῾) : se prononce comme un « h » aspiré (ἁ = ha).</li><li><strong>Esprit doux</strong> (᾿) : ne se prononce pas (ἀ = a).</li><li><strong>Accent aigu</strong> (´) : sur la dernière, l'avant-dernière ou l'antépénultième syllabe.</li><li><strong>Accent grave</strong> (&#96;) : remplace l'aigu sur la dernière syllabe dans certains cas.</li><li><strong>Accent circonflexe</strong> (῀) : sur une syllabe longue.</li><li>Tout mot commençant par une voyelle porte un esprit.</li></ul></div>
<h3>3. Exercice de lecture</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li>ἄνθρωπος → <em>anthrôpos</em> = l'homme</li><li>λόγος → <em>logos</em> = parole, raison</li><li>σοφία → <em>sophia</em> = sagesse</li><li>φιλοσοφία → <em>philosophia</em> = amour de la sagesse</li></ul><p><a href="https://www.youtube.com/results?search_query=alphabet+grec+ancien+prononciation+esprits+accents" target="_blank" rel="noopener">🎥 Recherche : alphabet grec (chaînes de cours de grec)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'alphabet grec compte 24 lettres (7 voyelles, 17 consonnes). Les esprits et les accents marquent la prononciation. Lire le grec est la première étape avant la traduction.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de Grec ancien, 6e année L.-G. (RDC) ; « Méthode de grec ancien » (univrdc).<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, L.-G. (Latin-Grec).</div>
    `
},
{
    title: "Leçon 2 — Les déclinaisons grecques : l'article et la 1re déclinaison",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Tu lis un texte de Platon : « ὁ ἄνθρωπος » (ho anthrôpos). Tu remarques que l'article change selon la fonction. C'est la déclinaison. En grec, l'article joue un rôle essentiel.</p></div>
<h3>1. L'article défini grec</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Nominatif</strong> : ὁ (m.), ἡ (f.), τό (n.).</li><li><strong>Génitif</strong> : τοῦ, τῆς, τοῦ.</li><li><strong>Datif</strong> : τῷ, τῇ, τῷ.</li><li><strong>Accusatif</strong> : τόν, τήν, τό.</li><li>L'article s'accorde en genre, nombre et cas avec le nom qu'il détermine.</li></ul></div>
<h3>2. La 1re déclinaison (noms en -α et -η)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Féminins en -α</strong> (après ρ, ε, ι) : χώρα, χώρας (la contrée).</li><li><strong>Féminins en -η</strong> : τιμή, τιμῆς (l'honneur).</li><li><strong>Masculins en -ας/-ης</strong> : πολίτης, πολίτου (le citoyen).</li><li>Le génitif singulier est en <strong>-ας</strong> ou <strong>-ης</strong> ; le datif en <strong>-ᾳ</strong> ou <strong>-ῃ</strong>.</li></ul></div>
<h3>3. Tableau de la 1re déclinaison</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><table style="width:100%;border-collapse:collapse;margin:10px 0;"><tr style="background:#cfdff5;"><th style="padding:6px;border:1px solid #a9c3e8;">Cas</th><th style="padding:6px;border:1px solid #a9c3e8;">Singulier</th><th style="padding:6px;border:1px solid #a9c3e8;">Pluriel</th></tr><tr><td style="padding:6px;border:1px solid #a9c3e8;">Nominatif</td><td style="padding:6px;border:1px solid #a9c3e8;">τιμή</td><td style="padding:6px;border:1px solid #a9c3e8;">τιμαί</td></tr><tr><td style="padding:6px;border:1px solid #a9c3e8;">Génitif</td><td style="padding:6px;border:1px solid #a9c3e8;">τιμῆς</td><td style="padding:6px;border:1px solid #a9c3e8;">τιμῶν</td></tr><tr><td style="padding:6px;border:1px solid #a9c3e8;">Datif</td><td style="padding:6px;border:1px solid #a9c3e8;">τιμῇ</td><td style="padding:6px;border:1px solid #a9c3e8;">τιμαῖς</td></tr><tr><td style="padding:6px;border:1px solid #a9c3e8;">Accusatif</td><td style="padding:6px;border:1px solid #a9c3e8;">τιμήν</td><td style="padding:6px;border:1px solid #a9c3e8;">τιμάς</td></tr><tr><td style="padding:6px;border:1px solid #a9c3e8;">Vocatif</td><td style="padding:6px;border:1px solid #a9c3e8;">τιμή</td><td style="padding:6px;border:1px solid #a9c3e8;">τιμαί</td></tr></table><p><a href="https://www.youtube.com/results?search_query=première+déclinaison+grecque+article+défini" target="_blank" rel="noopener">🎥 Recherche : la 1re déclinaison grecque (chaînes de cours de grec)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'article grec s'accorde avec le nom. La 1re déclinaison regroupe les noms en -α et -η, surtout féminins, et quelques masculins en -ης/-ας.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de Grec ancien, 6e année L.-G. (RDC).</div>
    `

{
    title: "Leçon 3 — Les 2e et 3e déclinaisons grecques",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un texte d'Homère, tu trouves « λόγος », « δῶρον », « ἀνήρ ». Trois noms, deux déclinaisons différentes. La 2e et la 3e déclinaison sont les plus riches du grec.</p></div>
<h3>1. La 2e déclinaison (noms en -ος et -ον)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Masculins et féminins en -ος</strong> : λόγος, λόγου (la parole).</li><li><strong>Neutres en -ον</strong> : δῶρον, δώρου (le cadeau).</li><li>Génitif singulier en <strong>-ου</strong>.</li><li>Nominatif pluriel neutre en <strong>-α</strong>.</li></ul></div>
<h3>2. La 3e déclinaison (noms consonantiques)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li>Noms <strong>à thème consonantique</strong> : ἀνήρ, ἀνδρός (l'homme) ; σῶμα, σώματος (le corps).</li><li>Noms <strong>à thème en -ι</strong> : πόλις, πόλεως (la cité).</li><li>Noms <strong>à thème en -υ</strong> : πῆχυς, πήχεως (la coudée).</li><li>Génitif singulier en <strong>-ος</strong>.</li><li>L'accusatif singulier est en <strong>-α</strong> ou <strong>-ν</strong>.</li></ul></div>
<h3>3. Tableau de la 2e déclinaison</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><table style="width:100%;border-collapse:collapse;margin:10px 0;"><tr style="background:#cfdff5;"><th style="padding:6px;border:1px solid #a9c3e8;">Cas</th><th style="padding:6px;border:1px solid #a9c3e8;">λόγος</th><th style="padding:6px;border:1px solid #a9c3e8;">δῶρον</th></tr><tr><td style="padding:6px;border:1px solid #a9c3e8;">Nominatif</td><td style="padding:6px;border:1px solid #a9c3e8;">λόγος</td><td style="padding:6px;border:1px solid #a9c3e8;">δῶρον</td></tr><tr><td style="padding:6px;border:1px solid #a9c3e8;">Génitif</td><td style="padding:6px;border:1px solid #a9c3e8;">λόγου</td><td style="padding:6px;border:1px solid #a9c3e8;">δώρου</td></tr><tr><td style="padding:6px;border:1px solid #a9c3e8;">Datif</td><td style="padding:6px;border:1px solid #a9c3e8;">λόγῳ</td><td style="padding:6px;border:1px solid #a9c3e8;">δώρῳ</td></tr><tr><td style="padding:6px;border:1px solid #a9c3e8;">Accusatif</td><td style="padding:6px;border:1px solid #a9c3e8;">λόγον</td><td style="padding:6px;border:1px solid #a9c3e8;">δῶρον</td></tr><tr><td style="padding:6px;border:1px solid #a9c3e8;">Pluriel</td><td style="padding:6px;border:1px solid #a9c3e8;">λόγοι</td><td style="padding:6px;border:1px solid #a9c3e8;">δῶρα</td></tr></table><p><a href="https://www.youtube.com/results?search_query=deuxième+troisième+déclinaison+grecque" target="_blank" rel="noopener">🎥 Recherche : les 2e et 3e déclinaisons grecques (chaînes de cours de grec)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>2e déclinaison : noms en -ος (masc.) et -ον (neutre), génitif en -ου. 3e déclinaison : noms consonantiques, génitif en -ος. C'est la déclinaison la plus diverse.</p></div>
<div class="sources"><strong>Sources :</strong> Programme national de Grec ancien, 6e année L.-G. (RDC).</div>
    `

{
    title: "Leçon 4 — La conjugaison grecque : le verbe λύω",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Tu traduis un texte de l'Évangile : « λύω » (je délie). Ton professeur te demande de conjuguer ce verbe au présent, à l'imparfait, au futur et à l'aoriste. C'est le modèle des verbes en -ω.</p></div>
<h3>1. Le présent de l'indicatif</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>λύω</strong> (je délie)</li><li><strong>λύεις</strong> (tu délies)</li><li><strong>λύει</strong> (il/elle délie)</li><li><strong>λύομεν</strong> (nous déliions)</li><li><strong>λύετε</strong> (vous déliez)</li><li><strong>λύουσι(ν)</strong> (ils/elles délient)</li></ul></div>
<h3>2. Les temps principaux</h3>

    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>

<script>
(function () {
  var SITE = "https://ecolia-course.github.io/";
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface", page servie par https://app.local
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function abs(u) { return /^(https?:|data:|blob:)/i.test(u) ? u : (NATIVE ? SITE + u.replace(/^(\.\/|\/)+/, "") : u); }
  function ext(u) { var m = String(u).split("?")[0].match(/\.(jpe?g|png|gif|webp|svg)$/i); return m ? m[1].toLowerCase() : "jpg"; }
  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {
    if (queued[fn]) return;
    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
    if (!queue.length) { running = false; return; }
    if (!navigator.onLine) { running = false; return; }
    var q = queue.shift(), t0 = Date.now();
    try { CoursInterface.download(q[0], q[1]); } catch (e) { return setTimeout(next, 500); }
    (function wait() {
      var ok = false;
      try { ok = !!CoursInterface.exists(q[1]); } catch (e) {}
      if (ok) setTimeout(next, 1500);
      else if (Date.now() - t0 > 40000) next();
      else setTimeout(wait, 700);
    })();
  }
  function exists(fn) { try { return !!CoursInterface.exists(fn); } catch (e) { return false; } }

  function show(img) {                                    // affiche UNE image (appelé à chaque slide affichée)
    if (!table || img.getAttribute("data-ecolia-done")) return;
    var id = img.getAttribute("data-image-id");
    var url = table[id];
    if (typeof url !== "string" || !url.length) { console.warn("ECOLIA : image absente du JSON :", id); return; }
    img.setAttribute("data-ecolia-done", "1");
    if (!NATIVE) { img.onerror = function () { hide(img); }; img.setAttribute("src", url); return; }
    var full = abs(url), fn = "img_" + id + "." + ext(url);
    if (exists(fn)) {                                     // déjà sur l'appareil : lecture locale, sans internet
      img.onerror = function () {                         // fichier incomplet : on le supprime et on utilise le site
        try { CoursInterface["delete"](fn); } catch (e) {}
        queued[fn] = 0;
        img.onerror = function () { hide(img); };
        img.setAttribute("src", full);
      };
      img.setAttribute("src", "https://app.local/cours/" + fn);
    } else {
      img.onerror = function () { hide(img); };
      img.setAttribute("src", full);
      enqueue(full, fn);
    }
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches("img[data-image-id]")) show(root);
    root.querySelectorAll("img[data-image-id]").forEach(show);
  }
  function prefetchAll() {                                // APK : prépare TOUTES les images du cours pour le hors-ligne
    var ids = {};
    try { JSON.stringify(slides).replace(/data-image-id=\\?"([^"\\]+)/g, function (m, id) { ids[id] = 1; }); } catch (e) {}
    Object.keys(ids).forEach(function (id) {
      var url = table[id];
      if (typeof url !== "string" || !url.length) return;
      var fn = "img_" + id + "." + ext(url);
      if (!exists(fn)) enqueue(abs(url), fn);
    });
  }
  function start(tbl) {
    table = tbl;
    scan(document.body);
    new MutationObserver(function (muts) {                // les slides sont écrites à la volée : on traite chaque nouvelle image
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
    if (NATIVE) prefetchAll();
  }

  var JSON_URL = NATIVE ? SITE + "images_ecolia.json" : "images_ecolia.json";
  var KEY = "ecolia_images_json";
  fetch(JSON_URL, NATIVE ? { cache: "no-cache" } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (table) { if (NATIVE) lsSet(KEY, JSON.stringify(table)); start(table); })
    .catch(function (e) {
      var saved = null;
      if (NATIVE) { try { saved = JSON.parse(lsGet(KEY) || "null"); } catch (x) {} }
      if (saved) start(saved);                              // hors ligne dans l'APK : JSON gardé la dernière fois
      else console.warn("ECOLIA : JSON des images indisponible.", e);
    });
})();
</script>
