<li>Esthétique (émouvoir, plaire).</li>
<li>Rituelle (religieuse, spirituelle).</li>
<li>Sociale (affirmer une identité, transmettre).</li>
<li>Politique (dénoncer, célébrer).</li>
<li>Communicative (transmettre un message).</li>

<p><strong>Art et artisanat :</strong> la frontière est culturelle et historique.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

relle et historique. Définitions. Art: création humaine porteuse de sens. Relativité culturelle: critères variables du beau. Ethnocentrisme: juger une culture avec les critères d'une autre. Méthodes et règles. Identifier les fonctions d'une œuvre. Éviter l'ethnocentrisme. Situer l'œuvre dans son contexte. Exemple. Un masque Songye n'est pas seulement une sculpture: il a une fonction rituelle et sociale dans sa communauté d'origine. Exercices. Ex. 1: Quelles sont les fonctions de l'art? Ex. 2: Pourquoi faut-il éviter l'ethnocentrisme en art? Corrigé. 1) Esthétique, rituelle, sociale, politique, communicative (autres réponses possibles). 2) Pour respecter les cultures et leurs critères propres. À retenir. L'art est pluriel: ses formes et ses fonctions varient selon les cultures."]],"3":[["fr","Leçon 2, Grandes périodes de l'histoire de l'art mondial. Situation. « Pourquoi la Renaissance est-elle considérée comme un tournant dans l'histoire de l'art? ». Objectifs. Connaître les grandes périodes. Identifier leurs caractéristiques. Situer l'art africain dans l'histoire mondiale. Prérequis: leçon 1. Théorie. Périodes: Préhistoire: art rupestre. Antiquité: Égypte, Grèce, Rome. Moyen Âge: art roman, gothique. Renaissance: perspective, humanisme (XVe-XVIe s.). Art moderne: XIXe-XXe s. (impressionnisme, cubisme, surréalisme). Art contemporain: depuis 1945. Art africain: présent dans toutes les périodes, mais souvent absent des frises classiques. Définitions. Perspective: illusion de profondeur. Humanisme: courant centré sur l'homme. Art contemporain: art actuel (post-1945). Méthodes et règles. Associer une œuvre à sa période. Connaître deux caractéristiques par période. Ne pas réduire l'histoire de l'art à l'Europe. Exemple. L'art rupestre est présent en Afrique, notamment dans le Sahara et en Afrique australe, mais aussi dans certaines régions de la R D C. Exercices. Ex. 1: Quelle période a vu naître la perspective? Ex. 2: Citer deux périodes de l'histoire de l'art. Corrigé. 1) La Renaissance. 2) Antiquité et Renaissance (autres réponses possibles). À retenir. L'histoire de l'art mondial est plurielle: elle inclut l'Afrique."]],"4":[["fr","Leçon 3, Arts traditionnels congolais. Situation. « Pourquoi les textiles en raphia Kuba sont-ils considérés comme des chefs-d'œuvre? ». Objectifs. Connaître les aires culturelles. Identifier les styles et les matériaux. Comprendre les fonctions des objets. Prérequis: leçons 1 et 2. Théorie. Aires culturelles: Kongo, Kuba, Luba, Songye, Lega, Pende. Styles: masques (Songye, Pende), statuettes (Luba, Lega), textiles (Kuba). Matériaux: bois, raphia, ivoire, perles. Fonctions: rituelle, pouvoir, mémoire. Définitions. Raphia: fibre végétale utilisée pour les textiles Kuba. Masque: objet rituel, sculpture. Statuette: figure sculptée. Méthodes et règles. Associer un objet à son aire culturelle. Comprendre sa fonction. Situer l'objet dans son contexte. Exemple. Les textiles en raphia du royaume Kuba (« velours du Kasaï ») sont mondialement reconnus pour leur complexité technique. Exercices. Ex. 1: Quelles sont les grandes aires culturelles artistiques de la R D C? Ex. 2: Citer deux matériaux utilisés dans les arts congolais. Corrigé. 1) Kongo, Kuba, Luba, Songye, Lega, Pende. 2) Bois et raphia (autres réponses possibles). À retenir. Les arts congolais sont divers, complexes et porteurs de sens."]],"5":[["fr","Leçon 4, Art congolais moderne et contemporain. Situation. « Pourquoi Chéri Samba est-il reconnu internationalement? ». Objectifs. Comprendre l'art congolais moderne. Identifier les artistes majeurs. Comprendre le lien traditions ou modernité. Prérequis: leçons 1 à 3. Théorie. Peinture populaire: émerge à Kinshasa dans les années 1970-1980 (Chéri Samba, Moke). Écoles d'art: Académie des Beaux-Arts de Kinshasa, ateliers de Lubumbashi. Thèmes: société, politique, traditions, vie quotidienne. Reconnaissance internationale: expositions, foires, collections. Définitions. Peinture populaire: style congolais à la frontière de la BD. Art contemporain congolais: art actuel de la R D C. Méthodes et règles. Identifier un artiste et son style. Situer une œuvre dans son contexte. Comprendre le message. Exemple. Chéri Samba est un peintre congolais de renommée internationale, connu pour ses œuvres à la frontière de la peinture et de la bande dessinée. Exercices. Ex. 1: Qui est Chéri Samba? Ex. 2: Citer deux thèmes de l'art congolais contemporain. Corrigé. 1) Un peintre congolais de renommée internationale. 2) Société et politique (autres réponses possibles). À retenir. L'art congolais est vivant et s'inscrit dans la modernité."]],"6":[["fr","Leçon 5, Analyser une œuvre d'art. Situation. « Pourquoi faut-il décrire avant d'interpréter une œuvre d'art? ». Objectifs. Appliquer une méthode d'analyse. Distinguer description et interprétation. Argumenter une critique. Prérequis: leçons 1 à 4. Théorie. Étapes d'analyse: Identification: auteur, titre, date, matériaux. Description: ce que l'on voit (formes, couleurs). Analyse formelle: composition, technique. Contexte: époque, culture, fonction. Interprétation: signification, message. Critique: argumentée et respectueuse. Définitions. Description: observation objective. Interprétation: explication du sens. Critique: jugement argumenté. Méthodes et règles. Décrire avant d'interpréter. Situer dans le contexte. Argumenter ses impressions. Exemple. Analyser un masque Songye: description (forme, matériaux), contexte (rituel), interprétation (symbolisme). Exercices. Ex. 1: Quelles sont les étapes de l'analyse d'une œuvre? Ex. 2: Pourquoi la critique doit-elle être argumentée? Corrigé. 1) Identification, description, analyse formelle, contexte, interprétation. 2) Pour être crédible et respectueuse. À retenir. Analyser une œuvre, c'est comprendre comment elle fonctionne et ce qu'elle signifie."]],"7":[["fr","Évaluation finale, Histoire de l'Art. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 12 sur 20, tu as réussi."]]}};

    function nativeStore() {

      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }

      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }

        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {

        list: function () {

        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();

              });

            setTimeout(poll, 800);

        del: function (n) {

        }

    function cacheStore() {

        list: function () {

    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;

    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================

    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;

      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }

    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
