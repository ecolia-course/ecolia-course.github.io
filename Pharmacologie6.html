<div class="bloc theorie"><div class="bloc-label">Sommaire</div>

{
    title: "Leçon 1 — Introduction à la pharmacologie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>À l'hôpital de Kinshasa, un patient reçoit un antibiotique pour une infection. Très vite, il présente une réaction allergique. L'infirmière doit agir : arrêt du produit, appel du médecin, surveillance. Comprendre la pharmacologie permet de prévenir ces accidents et d'administrer les médicaments en toute sécurité.</p></div>
<h3>1. Définition et objet</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Pharmacologie</strong> : science qui étudie les médicaments, leur origine, leur composition, leurs effets, leur devenir dans l'organisme et leur usage thérapeutique.</li><li><strong>Médicament</strong> : substance ou composition présentée comme possédant des propriétés curatives ou préventives à l'égard des maladies humaines ou animales.</li><li><strong>Pharmacognosie</strong> : étude des substances naturelles médicinales.</li><li><strong>Pharmacocinétique</strong> : devenir du médicament dans l'organisme (ADME).</li><li><strong>Pharmacodynamie</strong> : effets du médicament sur l'organisme.</li></ul></div>
<h3>2. Origine des médicaments</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Naturelle</strong> : plantes (quinquina → quinine), animaux, minéraux.</li><li><strong>Synthèse chimique</strong> : la majorité des médicaments modernes.</li><li><strong>Biotechnologique</strong> : insuline humaine, hormones de croissance, vaccins recombinants.</li><li><strong>Semi-synthétique</strong> : dérivés de substances naturelles modifiées.</li></ul></div>
<h3>3. Les formes galéniques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Formes orales</strong> : comprimés, gélules, sirops, suspensions, poudres.</li><li><strong>Formes injectables</strong> : ampoules, flacons, seringues préremplies.</li><li><strong>Formes rectales</strong> : suppositoires, lavements.</li><li><strong>Formes topiques</strong> : pommades, crèmes, gels, patchs.</li><li><strong>Formes inhalées</strong> : aérosols, sprays.</li><li><strong>Formes oculaires et auriculaires</strong> : collyres, gouttes.</li></ul></div>
<h3>4. Classification des médicaments</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Selon l'usage</strong> : antibiotiques, antalgiques, anti-inflammatoires, antihypertenseurs.</li><li><strong>Selon la prescription</strong> : liste I (prescription obligatoire), liste II (prescription possible), hors liste.</li><li><strong>Stupéfiants</strong> : morphine, codéine (réglementation stricte).</li><li><strong>Génériques</strong> : copie d'un médicament original, moins cher.</li><li><strong>Médicaments essentiels</strong> : liste OMS des médicaments indispensables à la santé publique.</li></ul><p><a href="https://www.youtube.com/results?search_query=introduction+pharmacologie+médicament+formes+galéniques" target="_blank" rel="noopener">🎥 Recherche : introduction à la pharmacologie (chaînes de cours)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La pharmacologie étudie les médicaments, leur origine, leurs effets et leur devenir dans l'organisme. Les médicaments ont une origine naturelle, synthétique ou biotechnologique. Ils existent en de multiples formes galéniques. La classification repose sur l'usage, la prescription et la réglementation.</p></div>
<div class="sources"><strong>Sources :</strong> Programme réformé de Pharmacologie, Ministère de la Santé (RDC) ; OMS — Liste des médicaments essentiels.<br><strong>Sigles :</strong> MEPST, DIPROMAD, EXETAT, MSP, OMS, ADME.</div>
    `
},
{
    title: "Leçon 2 — La pharmacocinétique : devenir du médicament",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un patient de Kinshasa prend un comprimé de paracétamol. Combien de temps faut-il pour qu'il fasse effet ? Combien de temps reste-t-il dans l'organisme ? Comment est-il éliminé ? Ces questions relèvent de la pharmacocinétique.</p></div>
<h3>1. Les 4 étapes de la pharmacocinétique (ADME)</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>A - Absorption</strong> : passage du médicament dans la circulation sanguine.</li><li><strong>D - Distribution</strong> : diffusion dans les tissus et organes.</li><li><strong>M - Métabolisme (biotransformation)</strong> : transformation du médicament, principalement dans le foie.</li><li><strong>E - Élimination</strong> : élimination par les reins, la bile, les poumons, la sueur, le lait maternel.</li></ul></div>
<h3>2. L'absorption</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Voie orale</strong> : absorption dans l'intestin grêle, effet de premier passage hépatique.</li><li><strong>Voie injectable IV</strong> : absorption immédiate (biodisponibilité 100 %).</li><li><strong>Voie IM</strong> : absorption rapide mais variable.</li><li><strong>Voie SC</strong> : absorption plus lente.</li><li><strong>Facteurs</strong> : forme galénique, alimentation, pH gastrique, motricité intestinale.</li></ul></div>
<h3>3. La distribution et le métabolisme</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Distribution</strong> : le médicament se lie aux protéines plasmatiques (albumine) et diffuse dans les tissus.</li><li><strong>Volume de distribution</strong> : volume apparent dans lequel le médicament se répartit.</li><li><strong>Barrières</strong> : hémato-encéphalique, placentaire (attention chez la femme enceinte).</li><li><strong>Métabolisme hépatique</strong> : phase I (oxydation, réduction) et phase II (conjugaison).</li><li><strong>Cytochrome P450</strong> : principale famille d'enzymes hépatiques.</li></ul></div>
<h3>4. L'élimination et la demi-vie</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Élimination rénale</strong> : filtration glomérulaire, sécrétion tubulaire, réabsorption.</li><li><strong>Élimination biliaire</strong> : pour certains médicaments (rifampicine).</li><li><strong>Demi-vie (t½)</strong> : temps nécessaire pour que la concentration plasmatique diminue de moitié.</li><li><strong>Exemple</strong> : paracétamol (t½ = 2 h), amoxicilline (t½ = 1 h), digoxine (t½ = 36 h).</li><li><strong>Répétition des doses</strong> : on répète la dose après 4 à 5 demi-vies pour atteindre l'équilibre.</li><li><strong>Insuffisances</strong> : insuffisance rénale ou hépatique nécessite une adaptation posologique.</li></ul><p><a href="https://www.youtube.com/results?search_query=pharmacocinétique+ADME+absorption+métabolisme+élimination" target="_blank" rel="noopener">🎥 Recherche : la pharmacocinétique (chaînes de cours)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La pharmacocinétique comprend 4 étapes : absorption, distribution, métabolisme, élimination (ADME). La biodisponibilité dépend de la voie d'administration. Le foie métabolise les médicaments, les reins les éliminent. La demi-vie guide la fréquence d'administration.</p></div>
<div class="sources"><strong>Sources :</strong> Programme réformé de Pharmacologie (RDC) ; OMS — Bon usage des médicaments.</div>
    `
},
{
    title: "Leçon 3 — La pharmacodynamie et les interactions médicamenteuses",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un patient hypertendu prend simultanément un antihypertenseur et un anti-inflammatoire. Sa tension remonte. Le médecin explique : les deux médicaments interagissent. Comprendre la pharmacodynamie et les interactions évite ces problèmes.</p></div>
<h3>1. Le mécanisme d'action</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Pharmacodynamie</strong> : étude des effets du médicament sur l'organisme.</li><li><strong>Récepteurs</strong> : cibles moléculaires des médicaments (protéines membranaires, enzymes, canaux ioniques).</li><li><strong>Agoniste</strong> : molécule qui active le récepteur.</li><li><strong>Antagoniste</strong> : molécule qui bloque le récepteur.</li><li><strong>Effet thérapeutique</strong> : effet recherché.</li><li><strong>Effet indésirable</strong> : effet non désiré (effets secondaires, toxiques).</li></ul></div>
<h3>2. La relation dose-effet</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Dose minimale efficace</strong> : seuil en dessous duquel le médicament est inefficace.</li><li><strong>Dose maximale tolérée</strong> : seuil au-dessus duquel apparaissent des effets toxiques.</li><li><strong>Marge thérapeutique</strong> : intervalle entre dose efficace et dose toxique.</li><li><strong>Index thérapeutique</strong> : rapport dose toxique / dose efficace.</li><li><strong>Exemple</strong> : la digoxine a une marge thérapeutique étroite (risque de toxicité).</li></ul></div>
<h3>3. Les interactions médicamenteuses</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Définition</strong> : modification de l'effet d'un médicament par un autre.</li><li><strong>Synergie</strong> : les effets s'additionnent (ex. paracétamol + codéine).</li><li><strong>Antagonisme</strong> : un médicament diminue l'effet de l'autre (ex. antihypertenseur + AINS).</li><li><strong>Interactions pharmacocinétiques</strong> : modification de l'absorption, du métabolisme ou de l'élimination.</li><li><strong>Interactions pharmacodynamiques</strong> : modification de l'effet au niveau des récepteurs.</li><li><strong>Exemple clinique</strong> : la rifampicine diminue l'efficacité des contraceptifs oraux.</li></ul></div>
<h3>4. Les effets indésirables</h3>
<div class="bloc exemple"><div class="bloc-label">Exemple</div><ul><li><strong>Effets secondaires</strong> : prévisibles, liés au mécanisme d'action (somnolence des antihistaminiques).</li><li><strong>Effets toxiques</strong> : liés à un surdosage (toxicité hépatique du paracétamol).</li><li><strong>Allergies</strong> : réactions immunologiques (éruption, choc anaphylactique).</li><li><strong>Effets à long terme</strong> : résistance aux antibiotiques, dépendance.</li><li><strong>Pharmacovigilance</strong> : surveillance des effets indésirables après commercialisation.</li><li><strong>Déclaration</strong> : tout effet grave doit être signalé au centre de pharmacovigilance.</li></ul><p><a href="https://www.youtube.com/results?search_query=pharmacodynamie+interactions+médicamenteuses+effets+indésirables" target="_blank" rel="noopener">🎥 Recherche : la pharmacodynamie (chaînes de cours)</a></p></div>
<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La pharmacodynamie étudie les effets des médicaments via les récepteurs (agonistes, antagonistes). La marge thérapeutique est l'intervalle entre dose efficace et toxique. Les interactions peuvent être synergiques ou antagonistes. La pharmacovigilance surveille les effets indésirables.</p></div>
<div class="sources"><strong>Sources :</strong> Programme réformé de Pharmacologie (RDC) ; OMS — Pharmacovigilance.</div>
    `
},
{
    title: "Leçon 4 — Les antibiotiques et l'antibiothérapie",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un patient de Kinshasa est traité par un antibiotique pour une infection urinaire. Après 3 jours, il se sent mieux et arrête son traitement. Quelques jours plus tard, l'infection revient, plus résistante. L'antibiothérapie doit être respectée jusqu'au bout. Voici pourquoi.</p></div>
<h3>1. Définition et classification des antibiotiques</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Antibiotique</strong> : substance qui détruit les bactéries (bactéricide) ou empêche leur multiplication (bactériostatique).</li><li><strong>Familles</strong> : bêta-lactamines (pénicillines, céphalosporines), aminosides, macrolides, tétracyclines, quinolones, sulfamides.</li><li><strong>Spectre</strong> : étroit (une espèce), large (plusieurs espèces).</li><li><strong>Origine</strong> : naturelle (pénicilline de Penicillium), semi-synthétique, synthétique.</li></ul></div>
<h3>2. Mécanismes d'action</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Inhibition de la synthèse de la paroi</strong> : pénicillines, céphalosporines.</li><li><strong>Inhibition de la synthèse des protéines</strong> : aminosides, macrolides, tétracyclines.</li><li><strong>Inhibition de la synthèse des acides nucléiques</strong> : quinolones, rifampicine.</li><li><strong>Inhibition du métabolisme des folates</strong> : sulfamides.</li><li><strong>Action sur la membrane cytoplasmique</strong> : polymyxines.</li></ul></div>
<h3>3. Règles de l'antibiothérapie</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div><ul><li><strong>Prescription médicale obligatoire</strong>.</li><li><strong>Antibiogramme</strong> : test de sensibilité des bactéries.</li><li><strong>Respect de la dose et de la durée</strong> : ne jamais arrêter trop tôt.</li><li><strong>Antibiothérapie probabiliste</strong> : début avant résultat de l'antibiogramme.</li><li><strong>Antibiothérapie ciblée</strong> : après identification du germe.</li><li><strong>Association</strong> : parfois nécessaire (tuberculose).</li></ul></div>
<h3>4. La résistance aux antibiotiques</h3>

    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';
    slideCounterSpan.textContent = '0/0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
</script>

<script>
(function () {
  var SITE = "https://ecolia-course.github.io/";
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface", page servie par https://app.local
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function abs(u) { return /^(https?:|data:|blob:)/i.test(u) ? u : (NATIVE ? SITE + u.replace(/^(\.\/|\/)+/, "") : u); }
  function ext(u) { var m = String(u).split("?")[0].match(/\.(jpe?g|png|gif|webp|svg)$/i); return m ? m[1].toLowerCase() : "jpg"; }
  function hide(img) { img.onerror = null; img.style.display = "none"; }

  var table = null, queue = [], queued = {}, running = false;

  function enqueue(full, fn) {
    if (queued[fn]) return;
    queued[fn] = 1; queue.push([full, fn]);
    if (!running) { running = true; setTimeout(next, 2500); }
  }
  function next() {                                       // téléchargement discret, une image à la fois
    if (!queue.length) { running = false; return; }
    if (!navigator.onLine) { running = false; return; }
    var q = queue.shift(), t0 = Date.now();
    try { CoursInterface.download(q[0], q[1]); } catch (e) { return setTimeout(next, 500); }
    (function wait() {
      var ok = false;
      try { ok = !!CoursInterface.exists(q[1]); } catch (e) {}
      if (ok) setTimeout(next, 1500);
      else if (Date.now() - t0 > 40000) next();
      else setTimeout(wait, 700);
    })();
  }
  function exists(fn) { try { return !!CoursInterface.exists(fn); } catch (e) { return false; } }

  function show(img) {                                    // affiche UNE image (appelé à chaque slide affichée)
    if (!table || img.getAttribute("data-ecolia-done")) return;
    var id = img.getAttribute("data-image-id");
    var url = table[id];
    if (typeof url !== "string" || !url.length) { console.warn("ECOLIA : image absente du JSON :", id); return; }
    img.setAttribute("data-ecolia-done", "1");
    if (!NATIVE) { img.onerror = function () { hide(img); }; img.setAttribute("src", url); return; }
    var full = abs(url), fn = "img_" + id + "." + ext(url);
    if (exists(fn)) {                                     // déjà sur l'appareil : lecture locale, sans internet
      img.onerror = function () {                         // fichier incomplet : on le supprime et on utilise le site
        try { CoursInterface["delete"](fn); } catch (e) {}
        queued[fn] = 0;
        img.onerror = function () { hide(img); };
        img.setAttribute("src", full);
      };
      img.setAttribute("src", "https://app.local/cours/" + fn);
    } else {
      img.onerror = function () { hide(img); };
      img.setAttribute("src", full);
      enqueue(full, fn);
    }
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches("img[data-image-id]")) show(root);
    root.querySelectorAll("img[data-image-id]").forEach(show);
  }
  function prefetchAll() {                                // APK : prépare TOUTES les images du cours pour le hors-ligne
    var ids = {};
    try { JSON.stringify(slides).replace(/data-image-id=\\?"([^"\\]+)/g, function (m, id) { ids[id] = 1; }); } catch (e) {}
    Object.keys(ids).forEach(function (id) {
      var url = table[id];
      if (typeof url !== "string" || !url.length) return;
      var fn = "img_" + id + "." + ext(url);
      if (!exists(fn)) enqueue(abs(url), fn);
    });
  }
  function start(tbl) {
    table = tbl;
    scan(document.body);
    new MutationObserver(function (muts) {                // les slides sont écrites à la volée : on traite chaque nouvelle image
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
    if (NATIVE) prefetchAll();
  }

  var JSON_URL = NATIVE ? SITE + "images_ecolia.json" : "images_ecolia.json";
  var KEY = "ecolia_images_json";
  fetch(JSON_URL, NATIVE ? { cache: "no-cache" } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (table) { if (NATIVE) lsSet(KEY, JSON.stringify(table)); start(table); })
    .catch(function (e) {
      var saved = null;
      if (NATIVE) { try { saved = JSON.parse(lsGet(KEY) || "null"); } catch (x) {} }
      if (saved) start(saved);                              // hors ligne dans l'APK : JSON gardé la dernière fois
      else console.warn("ECOLIA : JSON des images indisponible.", e);
    });
})();
</script>
