            </div>

            </div>
            <div class="sources">
                <strong>Sources :</strong> Programme national de géographie RDC, FMI.
            </div>
        `
    },
    {
        title: "Leçon 11 : Le développement et ses inégalités",
        content: `
            <div class="scene-box">
                🌍 <strong>Situation réelle :</strong> Un enfant en Suisse a accès à l'eau potable, aux soins, à Internet. Un enfant au Sahel doit marcher 5 km pour chercher de l'eau. Le monde est très <strong>inégal</strong>.
            </div>
            <div class="image-box">
                🖼️ <strong>Image mentale :</strong> Imagine une échelle de richesse. En haut, les pays riches (IDH élevé). Au milieu, les pays émergents. En bas, les pays pauvres (IDH faible). La RDC est encore dans le bas.
            </div>
            <div class="definition-box">
                <strong>📚 Théorie :</strong><br>
                • <strong>IDH (Indice de Développement Humain) :</strong> mesure la santé, l'éducation et le niveau de vie.<br>
                • <strong>PIB :</strong> richesse produite par un pays.<br>
                • <strong>Nord/Sud :</strong> opposition entre pays développés (Nord) et en développement (Sud).<br>
                • <strong>Causes des inégalités :</strong> histoire (colonisation), guerres, mauvaise gouvernance, dette, climat.
            </div>
            <div class="summary-box">
                <strong>📌 Résumé :</strong> Le monde est inégal. IDH et PIB mesurent le développement. RDC a un fort potentiel mais fait face à de nombreux défis.
            </div>
            <div class="sources">
                <strong>Sources :</strong> Programme national de géographie RDC, PNUD.
            </div>
        `
    },
    {
        title: "🏆 QUIZ FINAL — Teste tes connaissances !",
        content: `
            <div id="quizContainer" class="quiz-container">
                <h3>📝 Questionnaire de géographie (6ᵉ secondaire)</h3>
                <p style="margin-bottom:15px;">Choisis la bonne réponse pour chaque question.</p>
                <div id="quizQuestions"></div>
                <button id="submitQuiz" class="quiz-btn-submit">✅ Valider mes réponses</button>
                <div id="quizResult" class="quiz-result"></div>
            </div>
        `
    }
];

let currentSlide = 0;
let lastSearchTerm = "", searchResults = [], currentResultIdx = -1;
const contentDiv = document.getElementById('content');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const slideCounterSpan = document.getElementById('slideCounter');
const progressFill = document.getElementById('progressFill');
const timeDisplay = document.getElementById('timeDisplay');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchNav = document.getElementById('searchNav');
const prevResultBtn = document.getElementById('prevResultBtn');
const nextResultBtn = document.getElementById('nextResultBtn');
const resultCounterSpan = document.getElementById('resultCounter');
const quizNavBtn = document.getElementById('quizNavBtn');

function getTextFromHtml(html) {
    const div = document.createElement('div');
    div.innerHTML = html;
    return div.textContent || '';
}

function searchSlides(term) {
    if (!term.trim()) return [];
    const lower = term.toLowerCase();
    const results = [];
    slides.forEach((s, idx) => {
        if (s.title.toLowerCase().includes(lower) || getTextFromHtml(s.content).toLowerCase().includes(lower)) results.push(idx);
    });
    return results;
}

function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let node of nodes) {
        if (node.nodeValue && regex.test(node.nodeValue)) {
            const span = document.createElement('span');
            span.innerHTML = node.nodeValue.replace(regex, '<span class="highlight">$1</span>');
            node.parentNode.replaceChild(span, node);
        }
    }
}

function renderQuiz() {
    const quizDiv = document.getElementById('quizQuestions');
    if (!quizDiv) return;
    const questions = [
        { text:"Quelle est la position de la Terre dans le système solaire ?", options:["1ʳᵉ","3ᵉ","5ᵉ"], correct:1 },
        { text:"Quel mouvement de la Terre crée le jour et la nuit ?", options:["La révolution","La rotation","La translation"], correct:1 },
        { text:"Quel est le méridien de référence ?", options:["L'Équateur","Greenwich","Le Capricorne"], correct:1 },
        { text:"Quel pays est le 2ᵉ plus grand d'Afrique ?", options:["Algérie","RDC","Soudan"], correct:1 },
        { text:"Quel est le plus haut sommet de la RDC ?", options:["Kilimandjaro","Ruwenzori","Virunga"], correct:1 },
        { text:"Quel fleuve traverse la RDC ?", options:["Le Nil","Le Niger","Le Congo"], correct:2 },
        { text:"Quel est le principal minerai exporté par la RDC ?", options:["Or","Cobalt","Diamant"], correct:1 },
        { text:"Combien de pays voisins a la RDC ?", options:["5","7","9"], correct:2 },
        { text:"Combien de langues nationales a la RDC ?", options:["2","4","6"], correct:1 },
        { text:"Quel est le plus long fleuve d'Afrique ?", options:["Congo","Nil","Niger"], correct:1 }
    ];
    let html = '';
    questions.forEach((q,idx) => {
        html += `<div class="quiz-question"><p>${idx+1}. ${q.text}</p>`;
        q.options.forEach((o,i) => { html += `<label><input type="radio" name="q${idx}" value="${i}"> ${o}</label>`; });
        html += `</div>`;
    });
    quizDiv.innerHTML = html;
    document.getElementById('submitQuiz').onclick = () => {
        let score = 0;
        questions.forEach((q,idx) => {
            const s = document.querySelector(`input[name="q${idx}"]:checked`);
            if (s && parseInt(s.value) === q.correct) score++;
        });
        const pct = Math.round(score/questions.length*100);
        document.getElementById('quizResult').innerHTML =
            `<div style="background:#c8e6c9; padding:18px; border-radius:12px;">
            🎯 <strong>Score : ${score}/${questions.length} (${pct}%)</strong><br>
            ${score === questions.length ? '🌟 Excellent !' : score >= 7 ? '👍 Bon travail !' : '📖 Relis les leçons.'}
            </div>`;
    };
}

function renderSlide(index, keepHighlight = true) {
    const isQuiz = (index === slides.length - 1);
    contentDiv.innerHTML = `<div class="slide active">
        <h2 class="slide-title">${slides[index].title}</h2>
        <div class="slide-content">${slides[index].content}</div>
    </div>`;
    if (isQuiz) renderQuiz();
    slideCounterSpan.textContent = `${index+1}/${slides.length}`;
    progressFill.style.width = `${((index+1)/slides.length)*100}%`;
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    timeDisplay.textContent = `Leçon ${index+1} / ${slides.length}`;
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm && !isQuiz) highlightInCurrentSlide(lastSearchTerm);
}

function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = `${currentResultIdx+1}/${searchResults.length}`;
}

function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}

function performSearch() {
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}

function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }

function nextSlide() { if (currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }

prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
quizNavBtn.onclick = () => { currentSlide = slides.length-1; renderSlide(currentSlide, false); };
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') performSearch(); });

renderSlide(0, false);
</script>
</body>
</html>
