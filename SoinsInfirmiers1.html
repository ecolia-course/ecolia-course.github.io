    title: "Leçon 1 — Qu'est-ce que les soins infirmiers ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Qui soigne les malades à l'hôpital ? Que fait un infirmier ? Pourquoi dit-on que les soins infirmiers sont une profession ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir les soins infirmiers. Connaître leur histoire. Comprendre leur rôle dans le système de santé. Prérequis : aucun.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les <strong>soins infirmiers</strong> sont l'ensemble des actes et des attitudes qui visent à prendre soin d'une personne, malade ou bien portante, pour l'aider à satisfaire ses besoins fondamentaux, à recouvrer la santé ou à vivre dignement jusqu'à la fin de sa vie.</p>
<p>Virginia Henderson (1897-1996), infirmière américaine, a donné la définition la plus célèbre : « La fonction unique de l'infirmière est d'assister l'individu, malade ou bien portant, dans l'accomplissement des activités qui contribuent à sa santé ou à sa guérison (ou à une mort paisible) et qu'il accomplirait sans aide s'il en avait la force, la volonté ou les connaissances ».</p>
<p>Florence Nightingale (1820-1910) est considérée comme la pionnière des soins infirmiers modernes : elle a formé les premières infirmières professionnelles, réorganisé les hôpitaux militaires pendant la guerre de Crimée et écrit <em>Notes on Nursing</em> (1859).</p>
<p>Les soins infirmiers sont une profession : ils exigent une formation, une déontologie, une responsabilité, une autonomie dans le rôle propre. En RDC, les infirmiers constituent souvent le premier, et parfois le seul, point de contact entre la population et le système de santé.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Soins infirmiers :</strong> ensemble des actes et attitudes pour prendre soin d'une personne. <strong>Infirmier :</strong> professionnel de santé qui dispense des soins. <strong>Profession :</strong> activité exercée selon une formation et une déontologie. <strong>Autonomie :</strong> capacité à décider et à agir dans son domaine de compétence.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier les besoins de la personne. Assister la personne sans faire à sa place. Respecter la dignité et l'autonomie. Collaborer avec l'équipe de soins.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un infirmier aide une personne âgée à se lever, à se laver, à manger, tout en l'encourageant à faire ce qu'elle peut faire seule. Il ne remplace pas la personne : il l'assiste. Une infirmière en maternité aide une jeune mère à allaiter son bébé, lui montre les gestes, la rassure.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Définis les soins infirmiers.</p>
<p><strong>Ex. 2 :</strong> Qui est la pionnière des soins infirmiers modernes ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> L'ensemble des actes et attitudes qui visent à prendre soin d'une personne, malade ou bien portante, pour l'aider à satisfaire ses besoins.</p>
<p><strong>2)</strong> Florence Nightingale.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les soins infirmiers sont une profession de soin, d'assistance et de relation, fondée sur la science et l'humanité.</p></div>

<div class="sources"><strong>Sources :</strong> Fiche descriptive 2023 ; Virginia Henderson ; Florence Nightingale.</div>
    `

{
    title: "Leçon 2 — Le rôle propre et le rôle délégué",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un infirmier peut-il faire tout ce qu'il veut ? Doit-il toujours attendre une prescription médicale ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer les deux rôles. Comprendre leurs contours. Appliquer la distinction. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'infirmier exerce deux types de rôles :</p>
<ul>
<li><strong>Le rôle propre (ou rôle autonome) :</strong> l'ensemble des soins liés aux fonctions d'entretien et de continuité de la vie, visant à compenser partiellement ou totalement un manque ou une diminution d'autonomie d'une personne. L'infirmier décide lui-même de ces soins, les organise et les évalue. Exemples : hygiène, confort, prévention d'escarres, surveillance des constantes, éducation à la santé, relation d'aide.</li>
<li><strong>Le rôle délégué (ou rôle prescrit) :</strong> les actes accomplis sur prescription médicale. L'infirmier exécute l'ordonnance, surveille les effets, alerte en cas de problème. Exemples : administration de médicaments, prélèvements, pansements sur prescription, injections.</li>
</ul>
<p><strong>Distinction fondamentale :</strong> le rôle propre relève de l'initiative et de la responsabilité de l'infirmier ; le rôle délégué relève de la prescription médicale et s'exerce sous la responsabilité du médecin. Les deux rôles se complètent dans la prise en soins globale de la personne.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Rôle propre :</strong> soins décidés par l'infirmier. <strong>Rôle délégué :</strong> soins sur prescription médicale. <strong>Prescription :</strong> ordre médical. <strong>Autonomie :</strong> capacité de décision. <strong>Responsabilité :</strong> obligation de répondre de ses actes.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier si l'acte relève du rôle propre ou délégué. Respecter les compétences et les limites. Collaborer avec le médecin. Alerter en cas d'anomalie.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>L'infirmier qui aide un patient à se laver exerce son rôle propre : il décide de l'aide, l'organise, l'évalue. L'infirmier qui administre un antibiotique sur prescription exerce son rôle délégué : il suit l'ordonnance, surveille les effets. L'infirmier qui constate une fièvre alerte le médecin : c'est son rôle propre de surveillance.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la différence entre rôle propre et rôle délégué ?</p>

<p><strong>1)</strong> Le rôle propre est décidé par l'infirmier ; le rôle délégué s'exerce sur prescription médicale.</p>
<p><strong>2)</strong> Aider à se laver : rôle propre. Administrer un médicament : rôle délégué.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La distinction entre rôle propre et rôle délégué structure l'exercice infirmier et garantit la sécurité des soins.</p></div>

<div class="sources"><strong>Sources :</strong> Fiche descriptive 2023 ; programme ISTAM 2025-2026.</div>
    `

    title: "Leçon 3 — Les 14 besoins fondamentaux de Virginia Henderson",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Quels sont les besoins d'un être humain ? Comment l'infirmier peut-il les identifier pour aider la personne ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les 14 besoins. Comprendre leur utilité. Les appliquer à l'analyse d'une situation. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Virginia Henderson a identifié <strong>14 besoins fondamentaux</strong> qui caractérisent tout être humain, malade ou bien portant :</p>
<ol>
<li>Respirer.</li>
<li>Boire et manger.</li>
<li>Éliminer (urines, selles, sueurs).</li>
<li>Se mouvoir et maintenir une bonne posture.</li>
<li>Dormir et se reposer.</li>
<li>S'habiller et se dévêtir.</li>
<li>Maintenir la température du corps dans les limites normales.</li>
<li>Être propre et protéger ses téguments (peau, muqueuses).</li>
<li>Éviter les dangers (sécurité physique, psychologique, environnementale).</li>
<li>Communiquer avec les autres (exprimer ses émotions, ses besoins).</li>
<li>Pratiquer sa religion (ou ses convictions).</li>
<li>Travailler et se réaliser (occuper un rôle valorisant).</li>
<li>Se récréer (se divertir, se détendre).</li>
<li>Apprendre (comprendre, s'informer, se développer).</li>
</ol>
<p>Pour chaque besoin, l'infirmier évalue si la personne est <strong>indépendante</strong> (elle satisfait seule son besoin) ou <strong>dépendante</strong> (elle a besoin d'aide). L'écart entre la situation et la satisfaction du besoin définit le problème de soins.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Besoin fondamental :</strong> nécessité vitale pour tout être humain. <strong>Indépendance :</strong> capacité à satisfaire seul ses besoins. <strong>Dépendance :</strong> besoin d'aide pour satisfaire un besoin. <strong>Problème de soins :</strong> écart entre la situation et le besoin satisfait.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Évaluer chaque besoin. Identifier les dépendances. Prioriser les besoins vitaux (respirer, boire et manger, éliminer). Planifier les aides.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un patient alité ne peut pas se mouvoir seul (besoin 4), ne peut pas se laver seul (besoin 8), ne peut pas s'alimenter seul (besoin 2). L'infirmier identifie ces dépendances et planifie les aides. Un patient anxieux a besoin de communiquer (besoin 10) et d'être rassuré (besoin 9, sécurité psychologique).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Cite cinq besoins fondamentaux.</p>
<p><strong>Ex. 2 :</strong> Qu'est-ce qu'un problème de soins ?</p>

<p><strong>1)</strong> Respirer, boire et manger, éliminer, se mouvoir, dormir (5 au choix).</p>
<p><strong>2)</strong> L'écart entre la situation d'une personne et la satisfaction d'un besoin.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les 14 besoins de Henderson sont la grille de lecture de l'infirmier pour évaluer l'autonomie et planifier les soins.</p></div>

<div class="sources"><strong>Sources :</strong> Virginia Henderson ; programme ISTAM 2025-2026.</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment l'infirmier organise-t-il ses soins ? Au hasard ? Ou selon une méthode ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les cinq étapes. Comprendre leur enchaînement. Appliquer la démarche. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>

</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>

</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le recueil de données est la base de toute démarche de soins ; il exige écoute, observation et rigueur.</p></div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>

</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

<p>L'<strong>hygiène des mains</strong> est le geste le plus efficace pour prévenir les infections associées aux soins (IAS), c'est-à-dire les infections contractées à l'hôpital.</p>

<p>Les IAS sont une cause majeure de morbidité et de mortalité ; en RDC, elles constituent un défi majeur. <strong>Précautions :</strong> mains sans bijoux, ongles courts, sans vernis, avant-bras dégagés.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Hygiène des mains :</strong> geste de prévention. <strong>FHA :</strong> friction hydro-alcoolique. <strong>IAS :</strong> infection associée aux soins. <strong>Asepsie :</strong> absence de micro-organismes. <strong>Précaution standard :</strong> mesures de base.</p>

  var CFG = {"code":"SoinsInfirmiers1","base":"audio_files/","available":[],"count":0,"sizeMo":0,"sizes":{},"fallback":{}};
  var CACHE = "ecolia-cours-v1";
  var PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  var PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
  var DL = '<svg viewBox="0 0 24 24"><path d="M11 3h2v9.2l3.6-3.6L18 10l-6 6-6-6 1.4-1.4L11 12.2V3zM5 19h14v2H5z"/></svg>';
  var OK = '<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';
  try {
    if (typeof questions !== "undefined" && questions && questions.forEach) {
      questions.forEach(function (q) {
        if (!q.options) q.options = q.opts || q.choices || q.choix || q.reponses || q.propositions || [];
        if (q.text === undefined) q.text = q.question || q.q || q.enonce || q.titre || "";
        if (typeof q.correct === "undefined") {
          if (typeof q.answer !== "undefined") q.correct = q.answer;
          else if (typeof q.reponse !== "undefined") q.correct = q.reponse;
        }
      });
    }
  } catch (e) {}
  var synth = window.speechSynthesis || null;
  var HAS_CACHE = !!(window.caches && window.caches.open);
  var NATIVE = false;
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  var LATER = "ecolia_audio_later_" + CFG.code;
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function init() {
    if (document.getElementById("ecolia-audio-btn")) return;
    var btn = document.createElement("button");
    btn.id = "ecolia-audio-btn"; btn.type = "button"; btn.className = "ecolia-off";
    btn.setAttribute("aria-label", "Écouter la leçon"); btn.innerHTML = PLAY;
    var dlBtn = document.createElement("button");
    dlBtn.id = "ecolia-dl-btn"; dlBtn.type = "button"; dlBtn.className = "ecolia-off";
    dlBtn.innerHTML = DL;
    var host = document.querySelector(".header-right");
    if (host) { host.insertBefore(dlBtn, host.firstChild); host.insertBefore(btn, dlBtn); }
    else { btn.className += " ecolia-fixed"; document.body.appendChild(btn); }
    var banner = document.createElement("div");
    banner.id = "ecolia-audio-banner";
    banner.innerHTML = '<span class="eab-txt"></span><span class="eab-act"></span><div class="eab-bar"><i></i></div>';
    var content = document.getElementById("content");
    if (content && content.parentNode) content.parentNode.insertBefore(banner, content);
    else document.body.insertBefore(banner, document.body.firstChild);
    var txtEl = banner.querySelector(".eab-txt"), actEl = banner.querySelector(".eab-act");
    var barEl = banner.querySelector(".eab-bar"), barI = barEl.firstChild;
    var audio = new Audio();
    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }
    function cur() { try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {} return 0; }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
