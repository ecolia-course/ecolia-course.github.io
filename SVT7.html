@keyframes fadeSlide { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

.exemple .bloc-label { color:#b71c1c; }
.resume { background:#e1f5fe; border:2px solid #0277bd; }
.resume .bloc-label { color:#01579b; }
.sources { background:#f5f5f5; padding:12px 16px; border-radius:10px; margin-top:26px; font-size:0.82rem; color:#666; border-left:3px solid #999; line-height:1.6; }
.bloc ul, .bloc ol { margin-left:22px; margin-top:8px; }

.quiz-container { padding:22px; background:var(--bg); border-radius:16px; }

.nav-btn { background:white; color:var(--p4); border:1px solid #ccc; padding:8px 14px; border-radius:8px; font-size:0.82rem; cursor:pointer; font-weight:500; }
.nav-btn:disabled { opacity:0.35; cursor:not-allowed; }
.counter { font-size:0.78rem; color:#666; }
.content::-webkit-scrollbar { width:6px; }
.content::-webkit-scrollbar-track { background:var(--soft); }
.content::-webkit-scrollbar-thumb { background:var(--p5); border-radius:3px; }
@media (max-width:600px) { body { padding:0; } .container { border-radius:0; max-height:100vh; } .content { padding:20px 18px; } .slide-title { font-size:1.25rem; } .search-box input { width:90px; } .header h1 { font-size:0.85rem; } }

<script>
const COURSE_TITLE = "Sciences de la Vie et de la Terre";
const slides = [
{
    title: "SVT 7e année — Sommaire général",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce fichier couvre le programme de Sciences de la Vie et de la Terre de la 7e année de l'éducation de base. Il comprend 12 leçons organisées autour de l'observation scientifique, de la cellule, des végétaux, du corps humain, des animaux, des milieux de vie et de l'environnement.</p>
<ul>
<li>Leçon 1 — Le microscope et l'observation scientifique</li>
<li>Leçon 2 — La cellule, unité de base du vivant</li>
<li>Leçon 3 — Les niveaux d'organisation du vivant</li>
<li>Leçon 4 — Les végétaux : racine, tige et feuille</li>
<li>Leçon 5 — La fleur et la reproduction des plantes à fleurs</li>
<li>Leçon 6 — Les fruits et les graines</li>
<li>Leçon 7 — Le squelette humain</li>
<li>Leçon 8 — Les muscles et le mouvement</li>
<li>Leçon 9 — La classification des animaux</li>
<li>Leçon 10 — Les milieux de vie et l'adaptation des êtres vivants</li>
<li>Leçon 11 — L'environnement et la pollution</li>
<li>Leçon 12 — Démarche scientifique et synthèse des SVT</li>
</ul>
<p>Une évaluation finale de 40 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Programme éducatif 7e année de SVT (MEPST, 2018). Guide d'accompagnement du programme national.</div>
    `
},
{
    title: "Leçon 1 : Le microscope et l'observation scientifique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>En classe de 7e année à Kinshasa, l'enseignant apporte un microscope. Les élèves se demandent comment observer ce qui est trop petit pour être vu à l'oeil nu. Le microscope permet d'agrandir l'image d'un objet et d'en révéler les détails.</p></div>
<img alt="Microscope optique utilisé pour observer des structures invisibles à l'oeil nu" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_1">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Microscope optique — Wikimedia Commons : Optical Microscope.png (CC BY-SA 3.0).</p>

<h3>1. Rôle du microscope</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le microscope optique sert à observer des objets très petits : cellules, micro-organismes, fines structures. Il produit une image agrandie grâce à un système de lentilles. Le grossissement total est le produit du grossissement de l'oculaire par celui de l'objectif.</p>
<p>Exemple : un oculaire ×10 et un objectif ×40 donnent un grossissement total de 400 fois.</p>
</div>

<h3>2. Pièces principales du microscope</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un microscope optique comporte : l'oculaire (par lequel on regarde), les objectifs (qui agrandissent), la platine (sur laquelle on pose la préparation), la lame et la lamelle, les vis de mise au point, la source de lumière ou le miroir, et le support ou pied.</p>
</div>
<img alt="Le microscope permet d'étudier l'organisation des cellules" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_2">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Le microscope permet d'étudier l'organisation des cellules — Wikimedia Commons : Plantcell.svg (CC BY-SA 3.0).</p>

<h3>3. Préparation microscopique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une préparation microscopique se fait en plusieurs étapes : déposer une petite goutte d'eau sur la lame, y placer l'échantillon fin, recouvrir avec la lamelle en évitant les bulles d'air, puis placer la lame sur la platine du microscope.</p>
</div>

<h3>4. Règles de manipulation et d'entretien</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>On porte le microscope à deux mains. On commence toujours l'observation avec le plus faible grossissement. On utilise les vis de mise au point avec douceur. On nettoie les lentilles avec un papier spécial. On range le microscope après usage et on le couvre pour le protéger de la poussière.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève observe une préparation de cellule végétale. Avec un oculaire ×10 et un objectif ×10, il obtient un grossissement total de 10 × 10 = 100 fois. Il décrit ce qu'il voit : une paroi rigide, un contenu verdâtre, une forme régulière. Il réalise ensuite un dessin scientifique légendé, en respectant les proportions observées.</p>
<img alt="Un schéma de cellule aide à représenter et légender une observation" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_3">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Un schéma de cellule aide à représenter et légender une observation — Wikimedia Commons : Plant cell structure.png (domaine public).</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le microscope optique agrandit les objets trop petits pour l'oeil nu. Son grossissement total est le produit de l'oculaire par l'objectif. On l'utilise avec soin et on commence toujours par le plus faible grossissement.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif 7e année de SVT (MEPST, 2018). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 2 : La cellule, unité de base du vivant",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève observe au microscope une fine pellicule prélevée sur une feuille d'oignon. Il découvre un ensemble de petites unités juxtaposées, séparées par des cloisons. Ce sont des cellules végétales.</p></div>
<img alt="La cellule végétale possède des structures caractéristiques" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_4">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">La cellule végétale possède des structures caractéristiques — Wikimedia Commons : Plant cell structure.png (domaine public).</p>

<h3>1. Les constituants de la cellule</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La cellule est la plus petite unité vivante. Elle comprend : la membrane qui délimite la cellule, le cytoplasme où se déroulent de nombreuses activités, et le noyau qui contient l'information héréditaire. La cellule végétale possède en plus une paroi rigide et souvent des chloroplastes verts.</p>
</div>
<img alt="Les principales parties d'une cellule végétale sont représentées sur ce schéma" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_5">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Les principales parties d'une cellule végétale — Wikimedia Commons : Plantcell.svg (CC BY-SA 3.0).</p>

<h3>2. Cellule animale et cellule végétale</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La cellule animale possède une membrane souple et pas de paroi rigide. La cellule végétale possède une paroi rigide, souvent des chloroplastes verts et une grande vacuole. Les deux possèdent un noyau, un cytoplasme et une membrane.</p>
<p>Il existe aussi des cellules sans noyau, comme les bactéries : elles sont dites procaryotes. Les cellules à noyau sont dites eucaryotes.</p>
</div>

<h3>3. Observation et description</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Pour décrire une cellule, on note sa forme, sa taille approximative, la présence d'une paroi, la couleur du cytoplasme, la position du noyau. On réalise un dessin scientifique légendé avec un trait pour chaque élément identifié.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève observe au microscope des cellules d'élodée (plante aquatique). Il distingue des rectangles allongés, verts, séparés par des cloisons. Il note la présence de petits grains verts (chloroplastes) et d'un noyau plus clair. Il en déduit qu'il s'agit de cellules végétales.</p>
<img alt="Le schéma en français facilite l'identification des structures cellulaires" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_6">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Schéma en français d'une cellule végétale — Wikimedia Commons : Simple diagram of plant cell (fr).svg (CC BY 4.0).</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La cellule est l'unité de base du vivant. Elle possède une membrane, un cytoplasme et un noyau. La cellule végétale se distingue par sa paroi rigide. Certaines cellules, comme celles des bactéries, n'ont pas de noyau.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif 7e année de SVT (MEPST, 2018). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 3 : Les niveaux d'organisation du vivant",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une feuille d'hibiscus, on observe des cellules. Ces cellules forment un tissu. Plusieurs tissus forment la feuille, qui est un organe. La feuille appartient à un ensemble plus vaste : la plante entière. Comment passer du plus petit au plus grand ?</p></div>
<img alt="La cellule constitue un niveau élémentaire d'organisation du vivant" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_7">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">La cellule constitue un niveau élémentaire d'organisation du vivant — Wikimedia Commons : Simple diagram of plant cell (fr).svg (CC BY 4.0).</p>

<h3>1. Les niveaux d'organisation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le vivant s'organise en niveaux emboîtés : cellule, tissu, organe, appareil ou système, organisme. Chaque niveau est constitué du niveau inférieur.</p>
<ul>
<li><strong>Cellule</strong> : unité de base.</li>
<li><strong>Tissu</strong> : ensemble de cellules de même type assurant une fonction.</li>
<li><strong>Organe</strong> : ensemble de tissus organisés pour une ou plusieurs fonctions.</li>
<li><strong>Appareil ou système</strong> : ensemble d'organes qui collaborent.</li>
<li><strong>Organisme</strong> : ensemble complet formant un être vivant.</li>
</ul>
</div>
<img alt="L'observation des cellules aide à comprendre la formation des tissus" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_8">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">L'observation des cellules aide à comprendre la formation des tissus — Wikimedia Commons : Plantcell.svg (CC BY-SA 3.0).</p>

<h3>2. Structure et fonction</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>À chaque niveau, la structure est liée à une fonction. Un tissu conducteur transporte la sève. Un organe comme la feuille réalise la photosynthèse. Un organe comme le coeur assure la circulation. La forme et l'organisation d'un élément du vivant correspondent à son rôle.</p>
</div>

<h3>3. Du plus petit au plus grand</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>On peut classer des exemples du plus petit au plus grand : cellule musculaire, tissu musculaire, muscle, appareil locomoteur, être humain. Ce classement montre l'emboîtement progressif des niveaux.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Classons les éléments suivants du plus petit au plus grand : muscle, cellule musculaire, être humain, tissu musculaire, appareil locomoteur.</p>
<p><strong>Ordre correct :</strong> cellule musculaire, tissu musculaire, muscle, appareil locomoteur, être humain.</p>
<img alt="Une cellule s'inscrit dans une organisation biologique plus vaste" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_9">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Une cellule s'inscrit dans une organisation biologique plus vaste — Wikimedia Commons : Plant cell structure.png (domaine public).</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le vivant s'organise de la cellule à l'organisme en passant par le tissu, l'organe et l'appareil. À chaque niveau, la structure correspond à une ou plusieurs fonctions.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif 7e année de SVT (MEPST, 2018). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 4 : Les végétaux : racine, tige et feuille",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans la cour de l'école, un élève observe un bananier, un palmier et une plante herbacée. Il cherche à identifier les organes qui composent chaque plante et à comprendre à quoi ils servent.</p></div>
<img alt="L'hibiscus est une plante dont on peut observer les différentes parties" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_10">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">L'hibiscus est une plante dont on peut observer les différentes parties — Wikimedia Commons : Hibiscus.jpg (domaine public).</p>

<h3>1. L'appareil végétatif</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'appareil végétatif d'une plante supérieure comprend la racine, la tige et les feuilles. Ces trois organes assurent la nutrition, la croissance et le maintien de la plante. Ils sont souvent désignés comme les organes végétatifs, par opposition aux organes reproducteurs (fleur, fruit, graine).</p>
</div>
<img alt="L'observation d'une plante permet de distinguer ses organes végétatifs" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_11">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">L'observation d'une plante permet de distinguer ses organes végétatifs — Wikimedia Commons : Plant Hibiscus.jpg (CC0).</p>

<h3>2. La racine</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La racine fixe la plante au sol et absorbe l'eau et les sels minéraux. Il existe des racines pivotantes (une racine principale), des racines fasciculées (plusieurs racines fines) et des racines adventives. Certaines racines stockent des réserves, comme la carotte ou le manioc.</p>
</div>

<h3>3. La tige</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La tige soutient les feuilles et les fleurs. Elle conduit la sève brute des racines vers les feuilles et la sève élaborée des feuilles vers les autres organes. Elle peut être herbacée (souple, verte) ou ligneuse (dure, comme celle des arbres).</p>
</div>

<h3>4. La feuille</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La feuille est l'organe principal de la photosynthèse. Elle capte la lumière grâce à la chlorophylle. Elle présente un limbe, un pétiole et parfois des nervures. Sa forme varie selon les espèces : simple, composée, en aiguille, en éventail.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Comparons trois plantes de l'environnement congolais :</p>
<p><strong>Bananier :</strong> tige souterraine (bulbe), grandes feuilles, racines fasciculées.</p>
<p><strong>Palmier :</strong> stipe (tige ligneuse), feuilles en éventail, racines adventives.</p>
<p><strong>Plante herbacée (tomate) :</strong> tige verte, feuilles composées, racine pivotante.</p>
<p><strong>Observation :</strong> la forme des organes varie selon l'espèce et le milieu.</p>
<p><em>(image à vérifier — rechercher sur Wikimedia Commons : bananier, palmier, plante herbacée)</em></p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'appareil végétatif comprend la racine, la tige et la feuille. La racine fixe et absorbe, la tige soutient et conduit, la feuille réalise la photosynthèse. Leur forme varie selon les espèces.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif 7e année de SVT (MEPST, 2018). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 5 : La fleur et la reproduction des plantes à fleurs",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un jardin de Kinshasa, une fleur d'hibiscus s'ouvre au petit matin. Un insecte se pose sur ses pétales rouges, puis repart. Quel rôle joue cet insecte dans la vie de la plante ?</p></div>
<img alt="Une fleur d'hibiscus fournit un support concret pour l'observation" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_12">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Fleur d'hibiscus — Wikimedia Commons : Hibiscus Flower image.jpg (CC0).</p>

<h3>1. Les pièces florales</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une fleur complète comporte : le calice (ensemble des sépales, souvent verts), la corolle (ensemble des pétales, souvent colorés), les étamines (organes mâles produisant le pollen) et le pistil (organe femelle contenant l'ovaire, les ovules et le stigmate).</p>
</div>
<img alt="L'observation rapprochée permet d'étudier les pièces florales" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_13">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">L'observation rapprochée permet d'étudier les pièces florales — Wikimedia Commons : Red hibiscus flower.jpg (domaine public).</p>

<h3>2. Rôle de la fleur</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La fleur est l'organe de la reproduction sexuée des plantes à fleurs. Les étamines produisent le pollen (gamètes mâles). Le pistil contient les ovules (gamètes femelles). La rencontre des gamètes mâles et femelles conduit à la formation d'une graine et d'un fruit.</p>
</div>

<h3>3. La pollinisation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La pollinisation est le transport du pollen depuis les étamines jusqu'au stigmate. Elle peut être assurée par le vent, l'eau, les insectes, les oiseaux ou d'autres animaux. Les fleurs pollinisées par les insectes sont souvent colorées, parfumées et produisent du nectar.</p>
<p>La pollinisation n'est pas encore la fécondation : elle la précède.</p>
</div>

<h3>4. Rôle des agents pollinisateurs</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les insectes (abeilles, papillons, coléoptères) transportent le pollen d'une fleur à une autre. Les oiseaux comme le colibri, certains chauves-souris et le vent jouent aussi un rôle. La disparition des pollinisateurs menace la reproduction de nombreuses plantes.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Une abeille visite une fleur d'hibiscus. En cherchant du nectar, elle se couvre de pollen. En allant vers une autre fleur, elle dépose ce pollen sur le stigmate. La pollinisation a lieu.</p>
<p>Si le pollen atteint l'ovule, la fécondation peut se produire, puis la fleur se transforme et donne un fruit contenant des graines.</p>
<p><em>(image à vérifier — rechercher sur Wikimedia Commons : abeille butinant une fleur)</em></p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La fleur est l'organe reproducteur des plantes à fleurs. La pollinisation transporte le pollen vers le stigmate, souvent grâce aux insectes. Elle précède la fécondation qui donnera la graine et le fruit.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif 7e année de SVT (MEPST, 2018). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 6 : Les fruits et les graines",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Après la floraison d'un manguier dans une cour de Kinshasa, les fleurs tombent et de petits fruits verts apparaissent. À l'intérieur du fruit mûr, on trouve une graine. Comment le fruit et la graine se forment-ils ?</p></div>
<p><em>(image à vérifier — rechercher sur Wikimedia Commons : mangue coupée montrant la graine)</em></p>

<h3>1. Formation du fruit</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Après la fécondation, l'ovaire de la fleur se développe et devient le fruit. Les ovules fécondés deviennent des graines. Le fruit protège les graines et participe souvent à leur dispersion.</p>
</div>
<p><em>(image à vérifier — rechercher sur Wikimedia Commons : graines en germination dans un pot)</em></p>

<h3>2. Diversité des fruits</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Il existe plusieurs types de fruits : fruits charnus (mangue, papaye, tomate), fruits secs (arachide, haricot), fruits à noyau (avocat, safou), fruits multiples (ananas). Cette diversité correspond à des modes de dispersion adaptés.</p>
</div>

<h3>3. La graine</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La graine contient un embryon (future plante), des réserves nutritives et un tégument protecteur. Lorsque les conditions sont favorables, l'embryon se développe et la graine germe.</p>
</div>

<h3>4. Dispersion et germination</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La dispersion peut se faire par le vent (anémochorie), par l'eau (hydrochorie), par les animaux (zoochorie) ou par la plante elle-même. La germination nécessite de l'eau, une température adaptée et de l'air. La lumière n'est pas toujours nécessaire.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Expérience encadrée de germination :</p>
<p><strong>Matériel :</strong> trois pots, du coton, des graines de haricot, de l'eau.</p>
<p><strong>Étapes :</strong> placer des graines dans chaque pot. Pot 1 : coton humide, à l'air, à température ambiante. Pot 2 : coton sec, à l'air. Pot 3 : coton humide, sans air (dans un sac fermé).</p>
<p><strong>Observation attendue :</strong> seules les graines du pot 1 germent. Cela montre que la germination nécessite eau, air et température adaptée.</p>
<p><em>(image à vérifier — rechercher sur Wikimedia Commons : germination d'une graine en plusieurs étapes)</em></p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le fruit provient de l'ovaire après la fécondation et protège les graines. La graine contient un embryon et des réserves. Pour germer, elle a besoin d'eau, d'air et d'une température adaptée.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif 7e année de SVT (MEPST, 2018). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 7 : Le squelette humain",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève touche son avant-bras et sent un os dur sous la peau. Il se demande comment le corps tient debout, comment les organes sont protégés et comment le corps peut bouger.</p></div>
<img alt="Le squelette soutient le corps et protège certains organes" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_14">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Le squelette soutient le corps et protège certains organes — Wikimedia Commons : Human-Skeleton.jpg (CC0).</p>

<h3>1. Rôle du squelette</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le squelette humain assure trois fonctions principales : le soutien du corps (charpente), la protection des organes vitaux (crâne, cage thoracique, colonne vertébrale) et l'appui pour les muscles qui produisent le mouvement.</p>
</div>
<img alt="Une représentation du squelette permet de localiser les principaux os" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_15">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Représentation du squelette humain de face — Wikimedia Commons : Human skeleton front is.svg (domaine public).</p>

<h3>2. Principaux os</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Le squelette comporte environ 206 os chez l'adulte. On distingue : les os du crâne (frontal, pariétaux, occipital), la colonne vertébrale (constituée de vertèbres), la cage thoracique (côtes et sternum), les os des membres supérieurs (humérus, radius, ulna) et des membres inférieurs (fémur, tibia, péroné).</p>
</div>

<h3>3. Organisation du squelette</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>On regroupe les os en trois ensembles : le squelette de la tête, le squelette du tronc (colonne, côtes, sternum) et le squelette des membres. Les os sont reliés entre eux par des articulations (fixes, semi-mobiles ou mobiles).</p>
</div>

<h3>4. Posture et hygiène</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une bonne posture protège la colonne vertébrale. Il faut éviter de porter des charges trop lourdes d'un seul côté, se tenir droit en marchant et en s'asseyant, et pratiquer une activité physique régulière. Une alimentation riche en calcium et en vitamine D favorise la solidité des os.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un élève identifie les principaux os sur un schéma :</p>
<p><strong>Crâne</strong> : protège le cerveau. <strong>Colonne vertébrale</strong> : soutient le tronc et protège la moelle épinière. <strong>Cage thoracique</strong> : protège le coeur et les poumons. <strong>Fémur</strong> : os le plus long du corps, soutient la cuisse. <strong>Humérus</strong> : os du bras.</p>
<img alt="Le squelette présente une organisation qui contribue au maintien du corps" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_16">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Le squelette présente une organisation qui contribue au maintien du corps — Wikimedia Commons : Human skeleton.jpg (domaine public).</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le squelette soutient le corps, protège les organes vitaux et sert d'appui aux muscles. Il comprend environ 206 os organisés en squelette de la tête, du tronc et des membres.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif 7e année de SVT (MEPST, 2018). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 8 : Les muscles et le mouvement",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève plie puis tend son bras. Il sent son biceps se contracter puis se relâcher. Comment les muscles, les os et les articulations permettent-ils le mouvement ?</p></div>
<p><em>(image à vérifier — rechercher sur Wikimedia Commons : muscles du bras humain)</em></p>

<h3>1. Les muscles</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les muscles sont des organes contractiles capables de se raccourcir et de se relâcher. On distingue les muscles striés squelettiques (liés aux os), les muscles lisses (dans les organes internes) et le muscle cardiaque. Les muscles striés squelettiques sont commandés par le système nerveux.</p>
</div>
<p><em>(image à vérifier — rechercher sur Wikimedia Commons : schéma d'un muscle squelettique)</em></p>

<h3>2. Tendons et articulations</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les tendons sont des structures résistantes qui relient le muscle à l'os. Les articulations relient les os entre eux. Les articulations mobiles (genou, coude, épaule) permettent le mouvement.</p>
<p>Attention à ne pas confondre : le muscle produit la force, le tendon transmet cette force à l'os, l'articulation permet la rotation ou le pivotement.</p>
</div>

<h3>3. Les muscles antagonistes</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les muscles travaillent par paires antagonistes. Pour plier le bras, le biceps se contracte tandis que le triceps se relâche. Pour tendre le bras, c'est l'inverse. Un muscle ne peut que se contracter : c'est l'action opposée d'un autre muscle qui ramène le segment dans l'autre position.</p>
</div>

<h3>4. Hygiène musculaire</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Pour garder des muscles sains : pratiquer une activité physique régulière, s'échauffer avant l'effort, s'étirer après, boire suffisamment d'eau, éviter les efforts violents sans préparation. Une alimentation équilibrée en protéines et en énergie est nécessaire.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Observation du mouvement du bras :</p>
<p><strong>Flexion :</strong> le biceps se contracte et se raccourcit, il tire sur le radius par le tendon. L'avant-bras se rapproche du bras. Le triceps se relâche.</p>
<p><strong>Extension :</strong> le triceps se contracte, tire sur l'ulna et ramène l'avant-bras en position tendue. Le biceps se relâche.</p>
<p><strong>Conclusion :</strong> le mouvement résulte de l'action coordonnée de deux muscles antagonistes agissant sur les os via les tendons, autour de l'articulation du coude.</p>
<p><em>(image à vérifier — rechercher sur Wikimedia Commons : schéma du biceps et du triceps)</em></p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les muscles produisent le mouvement en se contractant. Ils sont reliés aux os par les tendons. Les articulations permettent la mobilité. Les muscles fonctionnent par paires antagonistes.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif 7e année de SVT (MEPST, 2018). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 9 : La classification des animaux",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans la cour d'une école de Mbandaka, un élève observe un papillon, un crapaud, un poisson et un poulet. Il cherche à classer ces animaux selon leurs caractères communs.</p></div>
<img alt="La diversité animale permet de comparer des caractères communs et différents" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_17">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">La diversité animale permet de comparer des caractères communs et différents — Wikimedia Commons : Animal diversity.jpg (CC BY-SA 4.0).</p>

<h3>1. Critères d'observation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Pour classer les animaux, on observe plusieurs critères : présence ou absence de colonne vertébrale, mode de déplacement, milieu de vie, mode de respiration, mode de reproduction, présence de poils, de plumes ou d'écailles.</p>
</div>
<p><em>(image à vérifier — rechercher sur Wikimedia Commons : vertébrés et invertébrés comparés)</em></p>

<h3>2. Vertébrés et invertébrés</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les vertébrés possèdent une colonne vertébrale. Ils se répartissent en cinq groupes : poissons, batraciens, reptiles, oiseaux et mammifères. Les invertébrés n'ont pas de colonne vertébrale : insectes, mollusques, vers, crustacés, araignées.</p>
</div>

<h3>3. Les cinq groupes de vertébrés</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<ul>
<li><strong>Poissons</strong> : peau couverte d'écailles, respiration branchiale, vie aquatique.</li>
<li><strong>Batraciens</strong> : peau nue et humide, respiration pulmonaire et cutanée, vie aquatique et terrestre (crapaud, grenouille).</li>
<li><strong>Reptiles</strong> : peau couverte d'écailles, respiration pulmonaire, vie terrestre (lézard, serpent, tortue).</li>
<li><strong>Oiseaux</strong> : plumes, bec, respiration pulmonaire, ovipares (poule, pigeon).</li>
<li><strong>Mammifères</strong> : poils, mamelles, respiration pulmonaire, vivipares (chèvre, homme, chauve-souris).</li>
</ul>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Classons quatre animaux :</p>
<p><strong>Papillon</strong> : invertébré, insecte, six pattes, ailes.</p>
<p><strong>Crapaud</strong> : vertébré, batracien, peau nue et humide.</p>
<p><strong>Poisson</strong> : vertébré, poisson, écailles, branchies.</p>
<p><strong>Poulet</strong> : vertébré, oiseau, plumes, bec.</p>
<p><em>(image à vérifier — rechercher sur Wikimedia Commons : animaux de la faune africaine)</em></p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La classification des animaux repose sur des caractères observables. Les vertébrés se répartissent en cinq groupes : poissons, batraciens, reptiles, oiseaux et mammifères. Les invertébrés n'ont pas de colonne vertébrale.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif 7e année de SVT (MEPST, 2018). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 10 : Les milieux de vie et l'adaptation des êtres vivants",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans une mare près de l'école, des têtards nagent. À quelques mètres, dans un jardin, des criquets sautent. Comment ces êtres vivants sont-ils adaptés à leur milieu ?</p></div>
<p><em>(image à vérifier — rechercher sur Wikimedia Commons : milieu aquatique avec végétation)</em></p>

<h3>1. Les milieux de vie</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>On distingue trois grands types de milieux : aquatique (eau douce, mer), terrestre (forêt, savane, désert) et aérien (fréquenté par les oiseaux et de nombreux insectes). Chaque milieu présente des conditions particulières (température, lumière, humidité).</p>
</div>
<p><em>(image à vérifier — rechercher sur Wikimedia Commons : forêt tropicale dense)</em></p>

<h3>2. Habitat et besoins</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'habitat est le lieu où vit un organisme. Tout être vivant a besoin de nourriture, d'eau, d'air et d'un abri. Ces besoins sont satisfaits différemment selon les milieux.</p>
</div>

<h3>3. Adaptation des êtres vivants</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Une adaptation est un caractère qui favorise la survie et la reproduction dans un milieu donné. Exemples : les branchies des poissons pour respirer dans l'eau ; les nageoires pour se déplacer ; les feuilles réduites des plantes du désert ; la fourrure des mammifères des régions froides.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Comparons trois êtres vivants de milieux différents :</p>
<p><strong>Poisson (milieu aquatique)</strong> : corps fuselé, nageoires, branchies.</p>
<p><strong>Boa (milieu forestier)</strong> : corps allongé, écailles, respiration pulmonaire, camouflage.</p>
<p><strong>Cactus (milieu aride)</strong> : feuilles transformées en épines, tige charnue stockant l'eau.</p>
<img alt="Les espèces présentent des caractéristiques adaptées à leurs milieux de vie" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_18">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Les espèces présentent des caractéristiques adaptées à leurs milieux de vie — Wikimedia Commons : Animal diversity.jpg (CC BY-SA 4.0).</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Chaque être vivant vit dans un milieu qui lui convient et possède des caractères adaptés à ce milieu : branchies, nageoires, poils, écailles, feuilles réduites. L'adaptation favorise la survie et la reproduction.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif 7e année de SVT (MEPST, 2018). Wikimedia Commons (fiches des images).</div>
    `
},
{
    title: "Leçon 11 : L'environnement et la pollution",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Dans un quartier de Kinshasa, des déchets plastiques s'accumulent au bord d'une rivière. Une odeur désagréable s'en dégage. Les habitants se plaignent. Quelles sont les sources de cette pollution et comment la prévenir ?</p></div>
<p><em>(image à vérifier — rechercher sur Wikimedia Commons : déchets plastiques au bord d'une rivière)</em></p>

<h3>1. L'environnement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'environnement comprend l'eau, l'air, le sol et tous les êtres vivants qui y habitent. Sa qualité est essentielle pour la santé humaine et l'équilibre des écosystèmes.</p>
</div>
<p><em>(image à vérifier — rechercher sur Wikimedia Commons : pollution du sol par des déchets)</em></p>

<h3>2. Sources de pollution</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Pollution de l'eau :</strong> rejets domestiques, déchets plastiques, produits chimiques agricoles.</p>
<p><strong>Pollution de l'air :</strong> fumées des usines et des véhicules, brûlage des déchets, poussières.</p>
<p><strong>Pollution du sol :</strong> déchets non biodégradables, pesticides, huiles usagées.</p>
<p>Une pollution peut être invisible (gaz, produits chimiques dissous), c'est pourquoi une simple apparence ne suffit pas à l'évaluer.</p>
</div>

<h3>3. Effets sur les êtres vivants</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La pollution provoque des maladies (diarrhées, infections respiratoires, intoxications), la mort de poissons et de plantes aquatiques, la dégradation des sols et la perte de biodiversité. Les enfants et les personnes âgées sont particulièrement vulnérables.</p>
</div>

<h3>4. Prévention et assainissement</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Pour protéger l'environnement : jeter les déchets dans des poubelles, trier les déchets, enterrer ou composter les déchets organiques, recycler le plastique, éviter de brûler les ordures à l'air libre, protéger les sources d'eau. L'assainissement collectif et la sensibilisation complètent ces gestes individuels.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Situation : des déchets abandonnés au bord d'une rivière.</p>
<p><strong>Source :</strong> rejets domestiques et déchets plastiques non collectés.</p>
<p><strong>Milieu touché :</strong> eau de la rivière et sol riverain.</p>
<p><strong>Conséquences possibles :</strong> pollution de l'eau, maladies hydriques, mort de poissons, odeurs.</p>
<p><strong>Mesures préventives :</strong> installer des bacs à déchets, organiser des journées de salubrité, sensibiliser les habitants, éviter le rejet direct dans la rivière.</p>
<p><em>(image à vérifier — rechercher sur Wikimedia Commons : campagne de salubrité et gestion des déchets)</em></p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La pollution touche l'eau, l'air et le sol. Elle a des effets graves sur la santé et les écosystèmes. La prévention repose sur des gestes simples et une gestion organisée des déchets.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif 7e année de SVT (MEPST, 2018). Wikimedia Commons (fiches des images).</div>

    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>Un élève observe une plante qui pousse près d'une fenêtre et une autre placée dans un coin sombre. Il se demande si la lumière influence la croissance. Comment vérifier cela par une démarche scientifique ?</p></div>
<img alt="Une observation scientifique repose sur une méthode et un matériel adaptés" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_19">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Une observation scientifique repose sur une méthode et un matériel adaptés — Wikimedia Commons : Optical Microscope.png (CC BY-SA 3.0).</p>

<h3>1. Les étapes de la démarche scientifique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La démarche scientifique suit plusieurs étapes : observation d'un phénomène, formulation d'une question, proposition d'une hypothèse, expérience contrôlée, relevé des résultats, interprétation et conclusion. Une seule variable doit être testée à la fois ; les autres conditions restent constantes.</p>
</div>

<h3>2. Observation et interprétation</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Observer consiste à décrire ce que l'on constate sans interpréter. Interpréter consiste à expliquer ces observations à l'aide des connaissances. Il ne faut pas mélanger les deux : une même observation peut donner lieu à plusieurs interprétations possibles tant que les résultats ne sont pas confirmés.</p>
</div>
<img alt="L'observation d'une plante permet de relever des caractères et de formuler des questions" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_20">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">L'observation d'une plante permet de relever des caractères et de formuler des questions — Wikimedia Commons : Plant Hibiscus.jpg (CC0).</p>

<h3>3. Dessin scientifique</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Un dessin scientifique doit être réalisé au crayon, avec des traits nets, sans coloriage excessif. Il doit comporter un titre, un grossissement (si réalisé au microscope), une échelle ou des proportions, et des légendes reliées par des traits horizontaux.</p>
</div>

<h3>4. Synthèse des notions</h3>
<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les SVT de 7e année relient plusieurs notions : la cellule comme unité du vivant, l'organisation en niveaux, les fonctions des organes végétaux et animaux, la classification, les milieux de vie et la protection de l'environnement. La démarche scientifique relie ces notions par l'observation et l'expérimentation.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Fiche d'observation d'une plante :</p>
<p><strong>Question :</strong> la lumière est-elle nécessaire à la croissance de cette plante ?</p>
<p><strong>Hypothèse :</strong> une plante placée à la lumière pousse plus vite qu'une plante placée à l'obscurité.</p>
<p><strong>Expérience :</strong> deux plants identiques placés dans des conditions égales sauf l'éclairement. Mesures toutes les semaines.</p>
<p><strong>Résultats attendus :</strong> le plant éclairé grandit davantage.</p>
<p><strong>Conclusion :</strong> la lumière favorise la croissance de cette plante dans les conditions testées.</p>
<img alt="Comparer des organismes permet de mobiliser plusieurs notions des SVT" style="max-width:100%; border-radius:10px; margin:14px 0;" onerror="this.style.display='none'" data-image-id="SVT7_21">
<p style="font-size:0.75rem;color:#666;margin-top:-8px;">Comparer des organismes permet de mobiliser plusieurs notions des SVT — Wikimedia Commons : Animal diversity.jpg (CC BY-SA 4.0).</p>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La démarche scientifique enchaîne observation, question, hypothèse, expérience, résultats et conclusion. Observer et interpréter sont deux étapes distinctes. Le dessin scientifique complète l'observation.</p></div>

<div class="sources"><strong>Sources :</strong> Programme éducatif 7e année de SVT (MEPST, 2018). Wikimedia Commons (fiches des images).</div>

function getTextFromHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function searchSlides(term) {
    if (!term.trim() || slides.length === 0) return [];
    const l = term.toLowerCase();
    const r = [];
    slides.forEach((s, i) => { if (s.title.toLowerCase().includes(l) || getTextFromHtml(s.content).toLowerCase().includes(l)) r.push(i); });
    return r;
}
function highlightInCurrentSlide(term) {
    if (!term) return;
    const sc = document.querySelector('.slide-content');
    if (!sc) return;
    const regex = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", 'gi');
    const walker = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (let n of nodes) {
        if (n.nodeValue && regex.test(n.nodeValue)) {
            const sp = document.createElement('span');
            sp.innerHTML = n.nodeValue.replace(regex, '<span style="background:#fff59d;padding:1px 3px;border-radius:2px;">$1</span>');
            n.parentNode.replaceChild(sp, n);
        }
    }
}
function renderEmptyState() {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">·</div><span class="tag">Bientôt disponible</span><h2>' + COURSE_TITLE + '</h2><p>Ce cours est en préparation. Le contenu sera ajouté prochainement.</p></div>';
    slideCounterSpan.textContent = '0/0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    counterSpan.textContent = '—';
}

function renderQuiz() {
    const qc = document.getElementById('quizQuestions');
    if (!qc) return;
    if (typeof questions === 'undefined' || questions.length === 0) {
        qc.innerHTML = '<p style="color:#666;font-style:italic;">Quiz bientot disponible.</p>';
        return;
    }
    let html = '';
    questions.forEach((q, i) => {
        html += '<div class="quiz-question"><p>' + (i+1) + '. ' + q.text + '</p>';
        q.options.forEach((o, k) => {
            html += '<label><input type="radio" name="q' + i + '" value="' + k + '"> ' + o + '</label>';
        });
        html += '</div>';
    });
    qc.innerHTML = html;
    const submitBtn = document.getElementById('submitQuiz');
    if (submitBtn) {
        submitBtn.onclick = () => {
            let score = 0;
            questions.forEach((q, i) => {
                const s = document.querySelector('input[name="q' + i + '"]:checked');
                if (s && parseInt(s.value) === q.correct) score++;
            });
            const pct = Math.round(score/questions.length*100);
            document.getElementById('quizResult').innerHTML =
                '<div style="background:var(--bg2);padding:16px;border-radius:10px;margin-top:14px;">' +
                '<strong>Score : ' + score + '/' + questions.length + ' (' + pct + '%)</strong></div>';
        };
    }
}

function renderSlide(index, keepHighlight) {
    if (keepHighlight === undefined) keepHighlight = true;
    if (slides.length === 0) { renderEmptyState(); return; }
    contentDiv.innerHTML = '<div class="slide active"><h2 class="slide-title">' + slides[index].title + '</h2><div class="slide-content">' + slides[index].content + '</div></div>';
    slideCounterSpan.textContent = (index+1) + '/' + slides.length;
    progressFill.style.width = ((index+1)/slides.length*100) + '%';
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length-1);
    counterSpan.textContent = 'Leçon ' + (index+1) + ' / ' + slides.length;
    if (index === slides.length - 1) renderQuiz();
    contentDiv.scrollTop = 0;
    if (keepHighlight && lastSearchTerm) highlightInCurrentSlide(lastSearchTerm);
}
function updateResultDisplay() {
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    searchNav.style.display = 'flex';
    resultCounterSpan.textContent = (currentResultIdx+1) + '/' + searchResults.length;
}
function goToResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    currentResultIdx = idx;
    currentSlide = searchResults[currentResultIdx];
    renderSlide(currentSlide, true);
    updateResultDisplay();
}
function performSearch() {
    if (slides.length === 0) return;
    const term = searchInput.value.trim();
    if (!term) return;
    lastSearchTerm = term;
    searchResults = searchSlides(term);
    if (searchResults.length === 0) { searchNav.style.display = 'none'; return; }
    currentResultIdx = 0;
    goToResult(0);
}
function nextResult() { if (searchResults.length) goToResult((currentResultIdx+1) % searchResults.length); }
function prevResult() { if (searchResults.length) goToResult((currentResultIdx-1+searchResults.length) % searchResults.length); }
function nextSlide() { if (slides.length && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide, true); } }
function prevSlide() { if (slides.length && currentSlide > 0) { currentSlide--; renderSlide(currentSlide, true); } }
prevBtn.onclick = prevSlide;
nextBtn.onclick = nextSlide;
searchBtn.onclick = performSearch;
prevResultBtn.onclick = prevResult;
nextResultBtn.onclick = nextResult;
searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') performSearch(); });
renderSlide(0, false);
