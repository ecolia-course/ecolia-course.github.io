    title: "Leçon 1 — Qu'est-ce que la néonatologie ?",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Que se passe-t-il après la naissance ? Pourquoi les premiers jours sont-ils si importants pour la survie du bébé ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la néonatologie. Distinguer les périodes de la vie. Comprendre son importance pour l'accoucheuse. Prérequis : notions d'obstétrique (cours n°57) et d'anatomie (cours n°58).</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>La <strong>néonatologie</strong> est la branche de la médecine qui étudie la santé du nouveau-né, de la naissance à 28 jours.</p>
<p>On distingue : <strong>période néonatale précoce</strong> (naissance à 7 jours : période la plus à risque) ; <strong>période néonatale tardive</strong> (7 à 28 jours).</p>
<p>La <strong>mortalité néonatale</strong> est le nombre de décès d'enfants de moins de 28 jours pour 1 000 naissances vivantes. En RDC, elle reste élevée (environ 27 à 30 décès pour 1 000 naissances).</p>
<p><strong>Principales causes :</strong> prématurité, asphyxie à la naissance, infections, hypothermie. Pour l'accoucheuse, la néonatologie est indispensable : elle prodigue les soins essentiels, surveille le bébé, détecte les signes d'alerte, éduque les parents.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Néonatologie :</strong> science de la santé du nouveau-né. <strong>Nouveau-né :</strong> enfant de 0 à 28 jours. <strong>Période néonatale :</strong> de la naissance à 28 jours. <strong>Mortalité néonatale :</strong> décès dans les 28 premiers jours.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Distinguer les périodes néonatales. Comprendre les causes de mortalité. Relier la néonatologie à la pratique.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un bébé né à 36 semaines (prématuré) est plus fragile qu'un bébé né à terme. Il risque l'hypothermie, l'infection, la détresse respiratoire. L'accoucheuse le surveille attentivement.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>

<p><strong>2)</strong> Prématurité, asphyxie, infections (3 au choix).</p>
</details>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La néonatologie est la science des premiers jours ; elle est cruciale pour la survie du nouveau-né.</p></div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Avant la naissance, le bébé vit dans l'eau. À la naissance, il doit respirer, se nourrir, se réchauffer. Comment s'adapte-t-il ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre les grandes adaptations. Identifier les organes concernés. Comprendre les risques. Prérequis : leçon 1 ; notions de physiologie (cours n°52).</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>À la naissance, le nouveau-né passe de la vie intra-utérine à la vie extra-utérine. Il doit s'adapter :</p>
<ul>
<li><strong>Respiration :</strong> les poumons se remplissent d'air, les alvéoles se déplient. Le premier cri marque le début de la respiration autonome.</li>
<li><strong>Circulation :</strong> le sang se redistribue, le canal artériel et le foramen ovale se ferment.</li>
<li><strong>Thermorégulation :</strong> le bébé perd rapidement de la chaleur ; il doit être séché et réchauffé.</li>
<li><strong>Alimentation :</strong> il passe de l'alimentation placentaire à l'allaitement.</li>
<li><strong>Élimination :</strong> les premières urines et le méconium apparaissent dans les premières 24 heures.</li>
</ul>
<p><strong>Risques :</strong> asphyxie, hypothermie, hypoglycémie, infection, ictère. Le rôle de l'accoucheuse est de surveiller les signes d'adaptation, sécher, réchauffer, allaiter, surveiller.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>

</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment savoir si un bébé va bien à la naissance ? Quels signes observer ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre l'évaluation. Connaître l'Apgar simplifié. Savoir réagir. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>L'évaluation du nouveau-né à la naissance permet d'apprécier sa vitalité et d'identifier les risques. Le <strong>score d'Apgar</strong> est utilisé à 1 minute et 5 minutes. Il évalue 5 critères, notés de 0 à 2 :</p>
<ul>
<li><strong>Apparence</strong> (couleur de la peau).</li>
<li><strong>Pouls</strong> (fréquence cardiaque).</li>
<li><strong>Grimace</strong> (réactivité aux stimulations).</li>
<li><strong>Activité</strong> (tonus musculaire).</li>
<li><strong>Respiration</strong> (effort respiratoire).</li>
</ul>
<p><strong>Interprétation :</strong> 7 à 10 = bon ; 4 à 6 = modéré ; 0 à 3 = détresse sévère.</p>
<p><strong>Conduite à tenir :</strong> stimuler, sécher, réchauffer, mettre en peau à peau, réanimer si nécessaire, orienter. En 1re année, l'élève comprend le principe de l'évaluation, sans pratiquer le score.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>

</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

    title: "Leçon 4 — Les soins essentiels à la naissance",

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Que fait-on juste après la naissance ? Pourquoi est-ce si important ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les soins essentiels. Comprendre leur importance. Les appliquer. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p>Les <strong>soins essentiels à la naissance</strong> sont les gestes simples qui sauvent des vies :</p>
<ol>
<li><strong>Séchage :</strong> sécher immédiatement le bébé avec un linge propre et sec.</li>
<li><strong>Peau à peau :</strong> placer le bébé nu contre la poitrine de sa mère, couvert, pour le réchauffer.</li>
<li><strong>Clampage retardé du cordon :</strong> clamper le cordon après 1 à 3 minutes, pour favoriser le transfert de sang.</li>
<li><strong>Allaitement précoce :</strong> mettre le bébé au sein dans la première heure.</li>
<li><strong>Surveillance :</strong> observer la respiration, la couleur, le tonus.</li>
</ol>
<p>Ces gestes réduisent la mortalité néonatale et favorisent l'attachement. Le rôle de l'accoucheuse est de les appliquer, surveiller, éduquer les parents.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Séchage :</strong> geste pour éviter l'hypothermie. <strong>Peau à peau :</strong> contact direct avec la mère. <strong>Clampage :</strong> pose d'une pince sur le cordon. <strong>Allaitement précoce :</strong> mise au sein dans l'heure.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Sécher rapidement. Mettre en peau à peau. Clamper le cordon. Allaiter précocement.</p>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>

<p>Le nouveau-né perd rapidement de la chaleur car sa surface corporelle est grande par rapport à son poids et ses mécanismes de régulation sont immatures.</p>
<p>L'<strong>hypothermie</strong> (température inférieure à 36,5 °C) est une cause fréquente de complications (infection, détresse respiratoire, décès).</p>
<p><strong>Prévention :</strong> sécher immédiatement après la naissance ; peau à peau avec la mère ; bonnet, couverture, vêtements chauds ; éviter les courants d'air, les bains prolongés ; mesurer la température régulièrement.</p>
<p>Le rôle de l'accoucheuse est d'appliquer les gestes, surveiller, éduquer les parents.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Thermorégulation :</strong> régulation de la température. <strong>Hypothermie :</strong> température basse. <strong>Peau à peau :</strong> méthode de réchauffement. <strong>Bonnet :</strong> protection de la tête.</p>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La prévention de l'hypothermie est simple et vitale ; le peau à peau en est le pilier.</p></div>

t-ce que la néonatologie? Situation. « Que se passe-t-il après la naissance? Pourquoi les premiers jours sont-ils si importants pour la survie du bébé? ». Objectifs. Définir la néonatologie. Distinguer les périodes de la vie. Comprendre son importance pour l'accoucheuse. Prérequis: notions d'obstétrique (cours n°57) et d'anatomie (cours n°58). Théorie. La néonatologie est la branche de la médecine qui étudie la santé du nouveau-né, de la naissance à 28 jours. On distingue: période néonatale précoce (naissance à 7 jours: période la plus à risque); période néonatale tardive (7 à 28 jours). La mortalité néonatale est le nombre de décès d'enfants de moins de 28 jours pour 1 000 naissances vivantes. En R D C, elle reste élevée (environ 27 à 30 décès pour 1 000 naissances). Principales causes: prématurité, asphyxie à la naissance, infections, hypothermie. Pour l'accoucheuse, la néonatologie est indispensable: elle prodigue les soins essentiels, surveille le bébé, détecte les signes d'alerte, éduque les parents. Définitions. Néonatologie: science de la santé du nouveau-né. Nouveau-né: enfant de 0 à 28 jours. Période néonatale: de la naissance à 28 jours. Mortalité néonatale: décès dans les 28 premiers jours. Méthodes et règles. Distinguer les périodes néonatales. Comprendre les causes de mortalité. Relier la néonatologie à la pratique. Exemple. Un bébé né à 36 semaines (prématuré) est plus fragile qu'un bébé né à terme. Il risque l'hypothermie, l'infection, la détresse respiratoire. L'accoucheuse le surveille attentivement. Exercices. Ex. 1: Définis la néonatologie. Ex. 2: Cite trois causes de mortalité néonatale. Corrigé. 1) La branche de la médecine qui étudie la santé du nouveau-né, de 0 à 28 jours. 2) Prématurité, asphyxie, infections (3 au choix). À retenir. La néonatologie est la science des premiers jours; elle est cruciale pour la survie du nouveau-né."]],"4":[["fr","Leçon 2, L'adaptation du nouveau-né à la vie extra-utérine. Situation. « Avant la naissance, le bébé vit dans l'eau. À la naissance, il doit respirer, se nourrir, se réchauffer. Comment s'adapte-t-il? ». Objectifs. Comprendre les grandes adaptations. Identifier les organes concernés. Comprendre les risques. Prérequis: leçon 1; notions de physiologie (cours n°52). Théorie. À la naissance, le nouveau-né passe de la vie intra-utérine à la vie extra-utérine. Il doit s'adapter: Respiration: les poumons se remplissent d'air, les alvéoles se déplient. Le premier cri marque le début de la respiration autonome. Circulation: le sang se redistribue, le canal artériel et le foramen ovale se ferment. Thermorégulation: le bébé perd rapidement de la chaleur; il doit être séché et réchauffé. Alimentation: il passe de l'alimentation placentaire à l'allaitement. Élimination: les premières urines et le méconium apparaissent dans les premières 24 heures. Risques: asphyxie, hypothermie, hypoglycémie, infection, ictère. Le rôle de l'accoucheuse est de surveiller les signes d'adaptation, sécher, réchauffer, allaiter, surveiller. Définitions. Adaptation: passage à la vie extra-utérine. Méconium: premières selles. Asphyxie: manque d'oxygène. Hypothermie: baisse de la température. Méthodes et règles. Comprendre les adaptations. Surveiller les signes. Agir rapidement en cas d'anomalie. Exemple. Un bébé qui ne crie pas à la naissance est en asphyxie. L'accoucheuse le stimule, le sèche, le réchauffe et le met en peau à peau. Si nécessaire, elle commence la réanimation. Exercices. Ex. 1: Cite trois adaptations du nouveau-né. Ex. 2: Qu'est-ce que le méconium? Corrigé. 1) Respiration, thermorégulation, alimentation (3 au choix). 2) Les premières selles du nouveau-né. À retenir. Le nouveau-né doit s'adapter rapidement; l'accoucheuse accompagne cette transition."]],"5":[["fr","Leçon 3, L'évaluation du nouveau-né à la naissance. Situation. « Comment savoir si un bébé va bien à la naissance? Quels signes observer? ». Objectifs. Comprendre l'évaluation. Connaître l'Apgar simplifié. Savoir réagir. Prérequis: leçons 1 et 2. Théorie. L'évaluation du nouveau-né à la naissance permet d'apprécier sa vitalité et d'identifier les risques. Le score d'Apgar est utilisé à 1 minute et 5 minutes. Il évalue 5 critères, notés de 0 à 2: Apparence (couleur de la peau). Pouls (fréquence cardiaque). Grimace (réactivité aux stimulations). Activité (tonus musculaire). Respiration (effort respiratoire). Interprétation: 7 à 10 égale bon; 4 à 6 égale modéré; 0 à 3 égale détresse sévère. Conduite à tenir: stimuler, sécher, réchauffer, mettre en peau à peau, réanimer si nécessaire, orienter. En 1re année, l'élève comprend le principe de l'évaluation, sans pratiquer le score. Définitions. Apgar: score de vitalité. Asphyxie: manque d'oxygène. Détresse: état grave. Stimulation: geste pour déclencher la respiration. Méthodes et règles. Observer les cinq critères. Interpréter le score. Agir rapidement. Exemple. Un bébé né avec un Apgar de 3 à 1 minute nécessite une réanimation immédiate. L'accoucheuse alerte, stimule, réchauffe. Exercices. Ex. 1: Cite les cinq critères de l'Apgar. Ex. 2: Que signifie un Apgar de 3 à 1 minute? Corrigé. 1) Apparence, pouls, grimace, activité, respiration. 2) Une détresse sévère nécessitant une réanimation. À retenir. L'évaluation à la naissance permet d'agir vite et de sauver des vies."]],"6":[["fr","Partie 2, Les soins immédiats. Partie 2. Objectif de la partie: comprendre les soins essentiels à la naissance et les soins du cordon. Leçons de cette partie. Leçon 4, Les soins essentiels à la naissance. Leçon 5, Les soins du cordon."]],"7":[["fr","Leçon 4, Les soins essentiels à la naissance. Situation. « Que fait-on juste après la naissance? Pourquoi est-ce si important? ». Objectifs. Connaître les soins essentiels. Comprendre leur importance. Les appliquer. Prérequis: leçons 1 à 3. Théorie. Les soins essentiels à la naissance sont les gestes simples qui sauvent des vies: Séchage: sécher immédiatement le bébé avec un linge propre et sec. Peau à peau: placer le bébé nu contre la poitrine de sa mère, couvert, pour le réchauffer. Clampage retardé du cordon: clamper le cordon après 1 à 3 minutes, pour favoriser le transfert de sang. Allaitement précoce: mettre le bébé au sein dans la première heure. Surveillance: observer la respiration, la couleur, le tonus. Ces gestes réduisent la mortalité néonatale et favorisent l'attachement. Le rôle de l'accoucheuse est de les appliquer, surveiller, éduquer les parents. Définitions. Séchage: geste pour éviter l'hypothermie. Peau à peau: contact direct avec la mère. Clampage: pose d'une pince sur le cordon. Allaitement précoce: mise au sein dans l'heure. Méthodes et règles. Sécher rapidement. Mettre en peau à peau. Clamper le cordon. Allaiter précocement. Exemple. Un bébé est né, il est mouillé et a froid. L'accoucheuse le sèche, le pose en peau à peau, clampe le cordon après 2 minutes et aide la mère à l'allaiter. Exercices. Ex. 1: Cite trois soins essentiels à la naissance. Ex. 2: Pourquoi clamper le cordon après 1 à 3 minutes? Corrigé. 1) Séchage, peau à peau, allaitement précoce (3 au choix). 2) Pour favoriser le transfert de sang. À retenir. Les soins essentiels sont simples, peu coûteux et sauvent des vies."]],"8":[["fr","Leçon 5, Les soins du cordon. Situation. « Comment prendre soin du cordon ombilical? Que faire pour éviter les infections? ». Objectifs. Comprendre les soins du cordon. Connaître les recommandations. Prévenir les infections. Prérequis: leçons 1 à 4. Théorie. Le cordon ombilical relie le bébé au placenta. Après la naissance, il est clampé et coupé. Il sèche et tombe en 5 à 15 jours. Soins recommandés: Cordon à sec: laver à l'eau propre et au savon, sécher soigneusement, laisser à l'air. Ne rien appliquer (ni huile, ni cendre, ni produits traditionnels): cela favorise les infections. Éviter de couvrir le cordon avec la couche (replier la couche). Surveiller les signes d'infection: rougeur, gonflement, pus, odeur, fièvre. Le rôle de l'accoucheuse est de montrer les gestes, éduquer les parents et détecter les infections. Définitions. Cordon ombilical: lien entre le bébé et le placenta. Cordon à sec: soin sans application. Infection: invasion par des microbes. Omphalite: infection du cordon. Méthodes et règles. Nettoyer et sécher. Ne rien appliquer. Surveiller l'infection. Éduquer les parents. Exemple. Une mère applique de la cendre sur le cordon de son bébé. L'accoucheuse lui explique que cela augmente le risque d'infection. Elle lui montre comment laver et sécher le cordon. Exercices. Ex. 1: Qu'est-ce que le soin du cordon à sec? Ex. 2: Cite trois signes d'infection du cordon. Corrigé. 1) Laver et sécher le cordon sans rien appliquer. 2) Rougeur, pus, odeur (3 au choix). À retenir. Les soins du cordon à sec préviennent les infections; l'accoucheuse éduque les parents."]],"9":[["fr","Partie 3, Allaitement et thermorégulation. Partie 3. Objectif de la partie: comprendre l'allaitement, la thermorégulation et la surveillance des premiers jours. Leçons de cette partie. Leçon 6, L'allaitement du nouveau-né. Leçon 7, La thermorégulation et la prévention de l'hypothermie. Leçon 8, La surveillance des premiers jours."]],"10":[["fr","Leçon 6, L'allaitement du nouveau-né. Situation. « Pourquoi l'allaitement est-il si important pour le bébé? Comment aider la mère à allaiter? ». Objectifs. Comprendre l'importance de l'allaitement. Connaître les bonnes pratiques. Conseiller la mère. Prérequis: leçons 1 à 5; notions de nutrition (cours n°57). Théorie. L'allaitement maternel est l'alimentation idéale du nouveau-né. Il est recommandé exclusivement jusqu'à 6 mois, puis poursuivi avec la diversification. Avantages: apport de tous les nutriments, protection contre les infections (colostrum riche en anticorps), développement du lien mère-enfant, prévention de l'hypothermie, économique. Bonnes pratiques: allaitement précoce dans la première heure; allaitement à la demande (jour et nuit); position et prise du sein correctes; éviter le biberon et la tétine avant 6 mois. Le rôle de l'accoucheuse est d'aider à la mise au sein, montrer les positions, conseiller, soutenir. Définitions. Allaitement maternel: alimentation au sein. Colostrum: premier lait. Allaitement exclusif: lait maternel uniquement. Mise au sein: début de l'allaitement. Méthodes et règles. Aider la mise au sein. Conseiller l'allaitement à la demande. Soutenir la mère. Exemple. Une jeune mère a du mal à allaiter. L'accoucheuse l'aide à bien positionner le bébé, à vérifier la prise du sein et la rassure. L'allaitement devient plus facile. Exercices. Ex. 1: Jusqu'à quel âge l'allaitement exclusif est-il recommandé? Ex. 2: Cite trois avantages de l'allaitement. Corrigé. 1) 6 mois. 2) Protection contre les infections, nutrition, lien mère-enfant (3 au choix). À retenir. L'allaitement maternel est le meilleur départ pour le nouveau-né; l'accoucheuse l'accompagne."]],"11":[["fr","Leçon 7, La thermorégulation et la prévention de l'hypothermie. Situation. « Pourquoi un bébé a-t-il froid si vite? Comment le protéger? ». Objectifs. Comprendre la thermorégulation. Identifier les risques. Prévenir l'hypothermie. Prérequis: leçons 1 à 6. Théorie. Le nouveau-né perd rapidement de la chaleur car sa surface corporelle est grande par rapport à son poids et ses mécanismes de régulation sont immatures. L'hypothermie (température inférieure à 36,5 degrés Celsius) est une cause fréquente de complications (infection, détresse respiratoire, décès). Prévention: sécher immédiatement après la naissance; peau à peau avec la mère; bonnet, couverture, vêtements chauds; éviter les courants d'air, les bains prolongés; mesurer la température régulièrement. Le rôle de l'accoucheuse est d'appliquer les gestes, surveiller, éduquer les parents. Définitions. Thermorégulation: régulation de la température. Hypothermie: température basse. Peau à peau: méthode de réchauffement. Bonnet: protection de la tête. Méthodes et règles. Sécher et réchauffer. Mettre en peau à peau. Couvrir la tête. Surveiller la température. Exemple. Un bébé né dans une salle froide est mouillé. L'accoucheuse le sèche, le met en peau à peau, lui met un bonnet et le couvre. Sa température reste normale. Exercices. Ex. 1: Qu'est-ce que l'hypothermie? Ex. 2: Cite trois mesures de prévention. Corrigé. 1) Une température corporelle basse. 2) Séchage, peau à peau, bonnet (3 au choix). À retenir. La prévention de l'hypothermie est simple et vitale; le peau à peau en est le pilier."]],"12":[["fr","Leçon 8, La surveillance des premiers jours. Situation. « Que faut-il surveiller chez un nouveau-né dans les premiers jours? ». Objectifs. Comprendre la surveillance. Connaître les paramètres. Détecter les anomalies. Prérequis: leçons 1 à 7. Théorie. La surveillance du nouveau-né dans les premiers jours porte sur: Respiration: fréquence, régularité, signes de détresse (tirage, geignement). Cœur: fréquence cardiaque. Température: mesure régulière. Couleur: rose, pâle, bleutée, jaune (ictère). Tonus: mouvements, réactivité. Alimentation: succion, prise du sein. Élimination: urines, méconium, selles. Cordon: aspect, signes d'infection. Poids: perte initiale (normale jusqu'à 10 pour cent ), puis reprise. Le rôle de l'accoucheuse est de surveiller, noter, alerter, orienter. Définitions. Surveillance: observation régulière. Ictère: jaunissement de la peau. Détresse respiratoire: difficulté à respirer. Tonus: état des muscles. Méthodes et règles. Observer chaque paramètre. Noter les observations. Alerter en cas d'anomalie. Exemple. Un bébé de 2 jours présente un ictère (peau jaune). L'accoucheuse le note, surveille l'alimentation et oriente si l'ictère s'aggrave. Exercices. Ex. 1: Cite trois paramètres à surveiller. Ex. 2: Qu'est-ce que l'ictère? Corrigé. 1) Respiration, température, couleur (3 au choix). 2) Un jaunissement de la peau. À retenir. La surveillance des premiers jours est essentielle pour détecter et traiter les anomalies."]],"13":[["fr","Partie 4, Surveillance et prévention. Partie 4. Objectif de la partie: comprendre les signes d'alerte, la prévention des infections, les soins particuliers. Leçons de cette partie. Leçon 9, Les signes d'alerte chez le nouveau-né. Leçon 10, La prévention des infections. Leçon 11, Les soins particuliers (prématuré, faible poids)."]],"14":[["fr","Leçon 9, Les signes d'alerte chez le nouveau-né. Situation. « Quels signes doivent faire consulter en urgence? Comment reconnaître un bébé en danger? ». Objectifs. Identifier les signes d'alerte. Comprendre leur signification. Savoir réagir. Prérequis: leçons 1 à 8. Théorie. Les signes d'alerte chez le nouveau-né sont: Respiratoires: détresse, geignement, tirage, apnée, cyanose. Cardiaques: tachycardie, bradycardie. Neurologiques: convulsions, hypotonie, hypertonie, cri aigu. Digestifs: refus de téter, vomissements, diarrhée, ballonnement. Cutanés: ictère précoce ou intense, pâleur, cyanose, éruption. Généraux: fièvre, hypothermie, léthargie, perte de poids excessive. Conduite à tenir: reconnaître, alerter, orienter en urgence vers une structure adaptée. Le rôle de l'accoucheuse est d'éduquer les parents à reconnaître ces signes. Définitions. Signe d'alerte: signe de danger. Apnée: arrêt de la respiration. Cyanose: coloration bleutée. Léthargie: somnolence anormale. Méthodes et règles. Reconnaître les signes. Alerter rapidement. Orienter en urgence. Exemple. Un bébé refuse de téter, est somnolent et a de la fièvre. L'accoucheuse reconnaît un signe d'alerte, alerte et oriente vers l'hôpital. Exercices. Ex. 1: Cite trois signes d'alerte. Ex. 2: Que faire face à un signe d'alerte? Corrigé. 1) Détresse respiratoire, fièvre, refus de téter (3 au choix). 2) Alerter et orienter en urgence. À retenir. Reconnaître les signes d'alerte permet d'agir vite et de sauver des vies."]],"15":[["fr","Leçon 10, La prévention des infections. Situation. « Pourquoi les nouveau-nés sont-ils fragiles face aux infections? Comment les protéger? ». Objectifs. Comprendre les risques d'infection. Connaître les mesures de prévention. Appliquer les gestes. Prérequis: leçons 1 à 9; notions d'hygiène (cours n°53). Théorie. Le nouveau-né a un système immunitaire immature: il est très vulnérable aux infections. Sources d'infection: mains sales, matériel contaminé, cordon mal soigné, environnement. Mesures de prévention: Hygiène des mains (les 5 indications). Soins du cordon à sec. Allaitement maternel (protection immunitaire). Environnement propre. Éviter les visites inutiles, les baisers, les personnes malades. Vaccination selon le calendrier. Le rôle de l'accoucheuse est d'appliquer, éduquer, surveiller. Définitions. Infection: invasion par des microbes. Immunité: défense de l'organisme. Hygiène: propreté. Vaccination: prévention. Méthodes et règles. Laver les mains. Soigner le cordon. Allaiter. Éduquer les parents. Exemple. Une mère reçoit des visiteurs malades. L'accoucheuse lui explique qu'il faut limiter les visites, se laver les mains avant de toucher le bébé et éviter les baisers. Exercices. Ex. 1: Pourquoi le nouveau-né est-il fragile face aux infections? Ex. 2: Cite trois mesures de prévention. Corrigé. 1) Son système immunitaire est immature. 2) Hygiène des mains, cordon à sec, allaitement (3 au choix). À retenir. La prévention des infections repose sur des gestes simples et l'éducation des parents."]],"16":[["fr","Leçon 11, Les soins particuliers (prématuré, faible poids). Situation. « Qu'est-ce qu'un bébé prématuré? Pourquoi a-t-il besoin de soins particuliers? ». Objectifs. Comprendre la prématurité. Connaître les soins particuliers. Orienter. Prérequis: leçons 1 à 10. Théorie. Un prématuré est un bébé né avant 37 semaines d'aménorrhée. Un faible poids de naissance est un poids inférieur à 2 500 grammes. Risques: hypothermie, détresse respiratoire, infections, ictère, difficultés alimentaires, retard de développement. Soins particuliers: Méthode kangourou (peau à peau prolongé). Allaitement (lait maternel ou lait de banque si disponible). Surveillance rapprochée. Environnement chaud et propre. Orientation vers une structure adaptée (néonatologie). Le rôle de l'accoucheuse est de reconnaître, stabiliser (chaleur, alimentation) et orienter. Définitions. Prématuré: né avant 37 SA. Faible poids: moins de 2 500 grammes. Méthode kangourou: peau à peau prolongé. Néonatologie: service spécialisé. Méthodes et règles. Reconnaître la prématurité. Réchauffer (kangourou). Nourrir. Orienter. Exemple. Un bébé né à 34 semaines pèse 1 800 grammes. L'accoucheuse le met en peau à peau, l'allaite si possible et l'oriente vers une unité de néonatologie. Exercices. Ex. 1: Qu'est-ce qu'un prématuré? Ex. 2: Cite trois soins particuliers. Corrigé. 1) Un bébé né avant 37 semaines. 2) Peau à peau, allaitement, orientation (3 au choix). À retenir. Les prématurés nécessitent des soins particuliers; l'accoucheuse reconnaît, stabilise et oriente."]],"17":[["fr","Partie 5, Rôle professionnel. Partie 5. Objectif de la partie: éducation des parents et rôle de l'accoucheuse. Leçon de cette partie. Leçon 12, Éducation des parents et rôle de l'accoucheuse."]],"18":[["fr","Leçon 12, Éducation des parents et rôle de l'accoucheuse. Situation. « Comment aider les parents à prendre soin de leur bébé à la maison? Quels conseils donner? ». Objectifs. Comprendre le rôle éducatif. Connaître les messages clés. Adopter une posture professionnelle. Prérequis: leçons 1 à 11. Théorie. L'éducation des parents est essentielle pour la survie et le développement du nouveau-né. Messages clés: Allaitement: exclusif jusqu'à 6 mois, à la demande. Chaleur: peau à peau, bonnet, vêtements chauds. Hygiène: mains, cordon à sec, environnement propre. Signes d'alerte: savoir les reconnaître et consulter. Vaccination: respecter le calendrier. Visites: limiter les visites, éviter les personnes malades. Le rôle de l'accoucheuse est d'informer, conseiller, soutenir, orienter, respecter la déontologie (respect, confidentialité, non-jugement, compétence). Définitions. Éducation des parents: information et conseil. Message clé: conseil essentiel. Déontologie: règles professionnelles. Vaccination: prévention. Méthodes et règles. Informer avec des mots simples. Conseiller sans juger. Soutenir. Orienter. Exemple. Avant la sortie de la maternité, l'accoucheuse explique à la mère comment allaiter, garder le bébé au chaud, soigner le cordon, reconnaître les signes d'alerte et où consulter. Exercices. Ex. 1: Cite trois messages clés pour les parents. Ex. 2: Cite trois règles de déontologie. Corrigé. 1) Allaitement, chaleur, hygiène (3 au choix). 2) Respect, confidentialité, non-jugement (3 au choix). À retenir. L'éducation des parents est un pilier de la survie du nouveau-né; l'accoucheuse en est l'actrice principale."]],"19":[["fr","Évaluation finale, Néonatologie et soins du nouveau-né. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 25 points, tu as réussi. En dessous, revois les leçons indiquées."]]}};

  try {
    if (typeof questions !== "undefined" && questions && questions.forEach) {
      questions.forEach(function (q) {
        if (!q.options) q.options = q.opts || q.choices || q.choix || q.reponses || q.propositions || [];
        if (q.text === undefined) q.text = q.question || q.q || q.enonce || q.titre || "";
        if (typeof q.correct === "undefined") {
          if (typeof q.answer !== "undefined") q.correct = q.answer;
          else if (typeof q.reponse !== "undefined") q.correct = q.reponse;
        }
      });
    }
  } catch (e) {}
  var synth = window.speechSynthesis || null;
  var HAS_CACHE = !!(window.caches && window.caches.open);
  var NATIVE = false;           // APK ECOLIA : pont Java "CoursInterface" (fichiers dans le dossier de l'application)
  try { NATIVE = !!(window.CoursInterface && typeof CoursInterface.exists === "function" && typeof CoursInterface.download === "function" && location.origin === "https://app.local"); } catch (e) {}
  var LATER = "ecolia_audio_later_" + CFG.code;
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function init() {
    if (document.getElementById("ecolia-audio-btn")) return;

    // ---------- éléments de l'interface ----------
    var btn = document.createElement("button");
    btn.id = "ecolia-audio-btn"; btn.type = "button"; btn.className = "ecolia-off";
    btn.setAttribute("aria-label", "Écouter la leçon"); btn.innerHTML = PLAY;
    var dlBtn = document.createElement("button");
    dlBtn.id = "ecolia-dl-btn"; dlBtn.type = "button"; dlBtn.className = "ecolia-off";
    dlBtn.innerHTML = DL;
    var host = document.querySelector(".header-right");
    if (host) { host.insertBefore(dlBtn, host.firstChild); host.insertBefore(btn, dlBtn); }   // dans la barre du haut : ne scrolle jamais
    else { btn.className += " ecolia-fixed"; document.body.appendChild(btn); }

    var banner = document.createElement("div");
    banner.id = "ecolia-audio-banner";
    banner.innerHTML = '<span class="eab-txt"></span><span class="eab-act"></span><div class="eab-bar"><i></i></div>';
    var content = document.getElementById("content");
    if (content && content.parentNode) content.parentNode.insertBefore(banner, content);
    else document.body.insertBefore(banner, document.body.firstChild);
    var txtEl = banner.querySelector(".eab-txt"), actEl = banner.querySelector(".eab-act");
    var barEl = banner.querySelector(".eab-bar"), barI = barEl.firstChild;

    var audio = new Audio();            // un seul élément Audio, réutilisé (exigé par les navigateurs mobiles)
    audio.preload = "auto";
    var st = { idx: -1, auto: false, advancing: false, mode: null, speaking: false, token: 0, chunks: [], ci: 0, blobUrl: null, playTok: 0 };
    var dl = { state: "none", cached: 0, busy: false, cancel: false };   // none | partial | full
    var bnMode = null, hideTimer = null;
    if (synth && synth.getVoices) { try { synth.getVoices(); } catch (e) {} }

    function cur() {
      try { if (typeof currentSlide === "number") return currentSlide; } catch (e) {}
      return 0;
    }
    function hasMp3(i) { return CFG.available.indexOf(i + 1) !== -1; }
    function fb(i) { return CFG.fallback && CFG.fallback[String(i + 1)]; }
    function hasAudio(i) { return hasMp3(i) || (!!synth && !!fb(i)); }
    function urlN(n) {   // dans l'APK la page est sur https://app.local : une adresse relative doit pointer vers le site
      var b = CFG.base;
      if (NATIVE && !/^https?:/i.test(b)) b = "https://ecolia-course.github.io/" + b.replace(/^(\.\.\/|\.\/)+/, "");
      return new URL(b + nameN(n), location.href).href;
    }
    function setIcon(playing) { btn.innerHTML = playing ? PAUSE : PLAY; }
    function isPlaying() { return st.mode === "mp3" ? !audio.paused : (st.mode === "tts" && st.speaking); }
    function mo() { return "≈ " + CFG.sizeMo + " Mo"; }
    function nameN(n) { return "audio_" + CFG.code + "_" + n + ".mp3"; }

    // ====================================================================
    //  Stockage hors ligne : 2 moteurs, même interface
    //    - APK : fichiers du dossier de l'application (CoursInterface), servis par https://app.local/cours/
    //    - Web : Cache Storage du navigateur (même cache que l'application web)
    // ====================================================================
    function nativeStore() {
      var okKey = "ecolia_audio_ok_" + CFG.code;
      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {                                   // fichier complet ? (taille exacte connue à la génération)
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () {
          var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok);
        },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) {
          try { CoursInterface.delete(nameN(n)); } catch (e) {}
          writeOk(readOk().filter(function (x) { return x !== n; }));
          return Promise.resolve();
        }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }   // ancien contenu invalide
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) {
          return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); })
            .then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; });
        },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);

    // ====================================================================
    //  Bannière : invitation, confirmations, progression
    // ====================================================================
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer);
      bnMode = mode;
      txtEl.textContent = text;
      actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; }
      else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }

    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }

    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial"
        ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet."
        : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner },
        { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }

    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") {                  // met à jour sans recréer les boutons (sinon un appui peut être perdu)
            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
</body>
</html>
