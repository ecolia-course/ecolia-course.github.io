const COURSE_TITLE = "Technologie pharmaceutique (Galénique)";
const slides = [
{
    title: "Sommaire — Technologie pharmaceutique (Galénique)",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>La galénique étudie la mise en forme du médicament : comprimés, sirops, pommades, suppositoires, injectables. Ce cours est une initiation adaptée au niveau de 1re année.</p>
<p><strong>Note de positionnement :</strong> la galénique est normalement enseignée en 2e année (ou à l'université). Ce plan est une initiation adaptée, centrée sur la reconnaissance et la compréhension des formes, sans fabrication industrielle.</p>
<ul>
<li>Leçon 1 — Définition et rôle de la galénique</li>
<li>Leçon 2 — Formes solides : comprimés, gélules, poudres</li>
<li>Leçon 3 — Formes liquides : sirops, solutions, suspensions</li>
<li>Leçon 4 — Formes semi-solides et autres : pommades, suppositoires, injectables</li>
<li>Leçon 5 — Étapes de fabrication et contrôle de qualité (initiation)</li>
</ul>
<p>Une évaluation finale de 36 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> Ouvrages de pharmacie galénique (Wehrlé, Le Hir, Memvanga) ; programme ISTM/Goma ; fiches vétérinaires (formes médicamenteuses) ; OMS (injections sûres).</div>
    `
},
{
    title: "Partie 1 — Formes médicamenteuses",
    content: `
<div class="bloc theorie"><div class="bloc-label">Partie 1</div>
<p><strong>Objectif de la partie :</strong> comprendre le rôle de la galénique et reconnaître les principales formes médicamenteuses.</p>
<h3>Leçons de cette partie</h3>
<ul>
<li>Leçon 1 — Définition et rôle de la galénique</li>
<li>Leçon 2 — Formes solides : comprimés, gélules, poudres</li>
<li>Leçon 3 — Formes liquides : sirops, solutions, suspensions</li>
</ul>
</div>
    `
},
{
    title: "Leçon 1 — Définition et rôle de la galénique",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un enfant a de la fièvre. Le pharmacien propose un sirop ; l'adulte préfère un comprimé. Le principe actif est le même. Pourquoi deux formes différentes ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir la galénique. Expliquer pourquoi un principe actif doit être mis en forme. Distinguer forme et principe actif.</p></div>

<div class="bloc theorie"><div class="bloc-label">Développement</div>
<p>La <strong>galénique</strong> est l'art et la science de préparer, conserver et présenter les médicaments sous une forme adaptée. La <strong>forme médicamenteuse</strong> est la présentation du médicament (comprimé, sirop, pommade…).</p>
<p>Le principe actif seul est rarement administrable tel quel : il faut le doser, le stabiliser, le rendre acceptable au goût, le protéger, faciliter son absorption. La forme dépend de l'âge, de la voie d'administration, de la stabilité et de l'usage.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Galénique :</strong> science de la mise en forme. <strong>Forme médicamenteuse :</strong> présentation. <strong>Voie d'administration :</strong> chemin du médicament.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemples RDC</div>
<p>Sirop pour enfants, comprimés pour adultes, injectables au centre de santé, pommades pour la peau.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Pourquoi ne pas avaler le principe actif en poudre ?</p>
<p><strong>Ex. 2 :</strong> Citez deux formes adaptées à un enfant.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Parce qu'il peut être instable, mauvais au goût, ou mal absorbé.</p>
<p><strong>2)</strong> Sirop, suspension (2 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La forme n'est pas accessoire : elle conditionne l'usage, l'acceptabilité et l'efficacité.</p></div>

<div class="sources"><strong>Sources :</strong> Ouvrages de pharmacie galénique ; références ISTM.</div>
    `
},
{
    title: "Leçon 2 — Formes solides : comprimés, gélules, poudres",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Dans une boîte, on trouve des comprimés, des gélules et un sachet de poudre. Tous se prennent par la bouche. Quelles sont les différences ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Décrire les principales formes solides. Expliquer leur intérêt et leurs limites. Comprendre le rôle des excipients dans la fabrication.</p></div>

<div class="bloc theorie"><div class="bloc-label">Développement</div>
<p><strong>Comprimé :</strong> obtenu par compression. Peut être sécable, effervescent ou enrobé. <strong>Gélule :</strong> enveloppe contenant une poudre. <strong>Poudre :</strong> à dissoudre ou à avaler.</p>
<p>Les formes solides sont pratiques, stables et faciles à doser. La poudre est utile pour les doses pédiatriques ou les préparations extemporanées.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Comprimé :</strong> forme solide par compression. <strong>Gélule :</strong> enveloppe et contenu. <strong>Enrobage :</strong> couche protectrice. <strong>Poudre :</strong> particules solides.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemples RDC</div>
<p>Comprimés de paracétamol, gélules d'antibiotiques, sachets de sels de réhydratation.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la différence entre un comprimé et une gélule ?</p>
<p><strong>Ex. 2 :</strong> Pourquoi enrobe-t-on certains comprimés ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Le comprimé est comprimé ; la gélule est une enveloppe contenant une poudre.</p>
<p><strong>2)</strong> Pour protéger le principe actif ou masquer le goût.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les formes solides dominent l'usage courant ; leur fabrication repose sur des excipients et des étapes contrôlées.</p></div>

<div class="sources"><strong>Sources :</strong> Ouvrages de galénique ; fiches vétérinaires.</div>
    `
},
{
    title: "Leçon 3 — Formes liquides : sirops, solutions, suspensions",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un sirop laissé ouvert pendant une semaine devient trouble et dégage une odeur. Que s'est-il passé ? Peut-on encore l'utiliser ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Distinguer solution, suspension et sirop. Expliquer l'intérêt des formes liquides. Connaître les règles de conservation.</p></div>

<div class="bloc theorie"><div class="bloc-label">Développement</div>
<p><strong>Solution :</strong> principe actif dissous. <strong>Suspension :</strong> particules dispersées. <strong>Sirop :</strong> solution sucrée. <strong>Émulsion :</strong> mélange de deux liquides non miscibles.</p>
<p>Les formes liquides sont faciles à avaler et à doser, surtout pour les enfants. Elles sont moins stables que les solides : flacon fermé, à l'abri de la lumière, respect de la date. Une suspension doit être agitée avant usage.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Solution :</strong> mélange homogène. <strong>Suspension :</strong> particules en suspension. <strong>Sirop :</strong> solution sucrée. <strong>Conservateur :</strong> substance de conservation.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemples RDC</div>
<p>Sirops contre la toux, suspensions d'antibiotiques pour enfants, solutions de réhydratation.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Pourquoi agite-t-on une suspension avant usage ?</p>
<p><strong>Ex. 2 :</strong> Citez deux règles de conservation d'un sirop.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Parce que les particules se déposent au fond.</p>
<p><strong>2)</strong> Flacon fermé, à l'abri de la lumière (2 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Les formes liquides sont adaptées mais fragiles ; leur conservation est une responsabilité partagée.</p></div>

<div class="sources"><strong>Sources :</strong> Ouvrages de galénique ; notices simplifiées.</div>
    `
},
{
    title: "Partie 2 — Autres formes, fabrication et contrôle",
    content: `
<div class="bloc theorie"><div class="bloc-label">Partie 2</div>
<p><strong>Objectif de la partie :</strong> découvrir les formes semi-solides, stériles, et comprendre les étapes de fabrication et de contrôle.</p>
<h3>Leçons de cette partie</h3>
<ul>
<li>Leçon 4 — Formes semi-solides et autres : pommades, suppositoires, injectables</li>
<li>Leçon 5 — Étapes de fabrication et contrôle de qualité (initiation)</li>
</ul>
</div>
    `
},
{
    title: "Leçon 4 — Formes semi-solides et autres : pommades, suppositoires, injectables",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« À l'hôpital, une infirmière prépare une injection ; à la maison, une mère applique une pommade sur une plaie. Les deux traitements sont-ils interchangeables ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Décrire les formes semi-solides et les formes stériles. Associer une forme à une voie d'administration. Connaître les précautions d'usage.</p></div>

<div class="bloc theorie"><div class="bloc-label">Développement</div>
<p><strong>Pommade, crème, gel :</strong> appliqués sur la peau ou les muqueuses. <strong>Suppositoire :</strong> introduit par voie rectale. <strong>Injectable :</strong> voie parentérale, doit être stérile, administré par un professionnel.</p>
<p>Chaque forme correspond à une voie et à des règles spécifiques. Les formes injectables ne doivent jamais être préparées à la maison.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Pommade :</strong> préparation grasse. <strong>Crème :</strong> émulsion. <strong>Suppositoire :</strong> forme rectale. <strong>Injectable :</strong> forme parentérale. <strong>Stérile :</strong> sans micro-organismes viables.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemples RDC</div>
<p>Pommades antibiotiques, suppositoires contre la fièvre chez l'enfant, injectables administrés en centre de santé.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quelle est la différence entre une pommade et un suppositoire ?</p>
<p><strong>Ex. 2 :</strong> Pourquoi un injectable doit-il être stérile ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> La pommade s'applique sur la peau ; le suppositoire s'introduit par voie rectale.</p>
<p><strong>2)</strong> Pour éviter les infections graves.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La voie d'administration détermine la forme et les précautions ; les formes injectables exigent une compétence professionnelle.</p></div>

<div class="sources"><strong>Sources :</strong> Ouvrages de galénique ; OMS (injections sûres).</div>
    `
},
{
    title: "Leçon 5 — Étapes de fabrication et contrôle de qualité (initiation)",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Deux lots de comprimés du même médicament sont vendus : l'un est blanc, l'autre légèrement jauni. Le pharmacien refuse le second lot. Pourquoi ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Citer les grandes étapes de la fabrication d'un médicament. Expliquer pourquoi le contrôle est nécessaire. Identifier les risques liés à une mauvaise conservation.</p></div>

<div class="bloc theorie"><div class="bloc-label">Développement</div>
<p><strong>Étapes :</strong> pesée, mélange, granulation (notion), compression, conditionnement, contrôle qualité, stabilité, date de péremption.</p>
<p>La fabrication suit des étapes ordonnées et contrôlées. Le contrôle vérifie l'aspect, le dosage, la pureté et la stabilité. Un changement de couleur peut signaler une dégradation. La chaîne du froid et l'humidité sont des ennemis fréquents en RDC.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Pesée :</strong> mesure des quantités. <strong>Mélange :</strong> homogénéisation. <strong>Compression :</strong> formation du comprimé. <strong>Conditionnement :</strong> emballage. <strong>Péremption :</strong> limite d'usage.</p>
</div>

<div class="bloc exemple"><div class="bloc-label">Exemples RDC</div>
<p>Comprimés jaunis par l'humidité ; sirops exposés au soleil ; importance du conditionnement étanche.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Pourquoi un comprimé jauni est-il suspect ?</p>
<p><strong>Ex. 2 :</strong> Citez deux étapes de fabrication.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Parce qu'il peut être dégradé.</p>
<p><strong>2)</strong> Pesée, mélange, compression, conditionnement (2 au choix).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La qualité ne se limite pas au principe actif : elle dépend de toute la chaîne, du fabricant au patient.</p></div>

<div class="sources"><strong>Sources :</strong> Ouvrages de galénique ; OMS (bonnes pratiques de fabrication, notion générale).</div>
    `
},
{
    title: "Évaluation finale — Technologie pharmaceutique (Galénique)",

      function readOk() { try { return JSON.parse(lsGet(okKey) || "[]"); } catch (e) { return []; } }
      function writeOk(a) { lsSet(okKey, JSON.stringify(a)); }
      function exists(n) { try { return !!CoursInterface.exists(nameN(n)); } catch (e) { return false; } }
      function local(n) { return location.origin + "/cours/" + nameN(n); }
      function verify(n) {
        return fetch(local(n), { cache: "no-store" }).then(function (r) { return r.blob(); }).then(function (b) {
          var exp = CFG.sizes && CFG.sizes[String(n)];
          return (b.size > 2000 && (!exp || b.size === exp)) ? b : null;
        }).catch(function () { return null; });
      }
      return {
        list: function () { var ok = readOk().filter(exists); writeOk(ok); return Promise.resolve(ok); },
        get: function (n) { return exists(n) ? verify(n) : Promise.resolve(null); },
        put: function (n) {
          return new Promise(function (res, rej) {
            try { CoursInterface.download(urlN(n), nameN(n)); } catch (e) { return rej(e); }
            var t0 = Date.now();
            function next() { if (Date.now() - t0 > 120000) rej(new Error("délai dépassé")); else setTimeout(poll, 800); }
            function poll() {
              if (!exists(n)) return next();
              verify(n).then(function (b) {
                if (!b) return next();
                var ok = readOk(); if (ok.indexOf(n) < 0) ok.push(n); writeOk(ok); res();
              });
            }
            setTimeout(poll, 800);
          });
        },
        del: function (n) { try { CoursInterface.delete(nameN(n)); } catch (e) {} writeOk(readOk().filter(function (x) { return x !== n; })); return Promise.resolve(); }
      };
    }
    function cacheStore() {
      return {
        list: function () {
          return caches.open(CACHE).then(function (c) {
            return Promise.all(CFG.available.map(function (n) {
              return c.match(urlN(n)).then(function (r) {
                if (!r) return 0;
                if ((r.headers.get("content-type") || "").indexOf("audio") !== 0) { c.delete(urlN(n)); return 0; }
                return n;
              });
            }));
          }).then(function (a) { return a.filter(Boolean); });
        },
        get: function (n) { return caches.open(CACHE).then(function (c) { return c.match(urlN(n)); }).then(function (r) { return r ? r.blob() : null; }).then(function (b) { return b && b.size > 2000 ? b : null; }); },
        put: function (n) {
          var u = urlN(n);
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok || r.status !== 200) throw new Error("HTTP " + r.status);
            return r.blob();
          }).then(function (b) {
            if (b.size < 2000 || (b.type && b.type.indexOf("audio") !== 0 && b.type.indexOf("octet") < 0)) throw new Error("fichier invalide");
            return caches.open(CACHE).then(function (c) { return c.put(u, new Response(b, { headers: { "Content-Type": "audio/mpeg" } })); });
          });
        },
        del: function (n) { return caches.open(CACHE).then(function (c) { return c.delete(urlN(n)); }); }
      };
    }
    var store = NATIVE ? nativeStore() : (HAS_CACHE ? cacheStore() : null);
    function showBanner(mode, text, buttons, pct) {
      clearTimeout(hideTimer); bnMode = mode; txtEl.textContent = text; actEl.innerHTML = "";
      (buttons || []).forEach(function (b) {
        var e = document.createElement("button");
        e.type = "button"; e.textContent = b.label; if (b.pri) e.className = "pri";
        e.addEventListener("click", function (ev) { ev.stopPropagation(); b.fn(); });
        actEl.appendChild(e);
      });
      if (typeof pct === "number") { barEl.style.display = "block"; barI.style.width = pct + "%"; } else barEl.style.display = "none";
      banner.classList.add("on");
    }
    function hideBanner() { clearTimeout(hideTimer); bnMode = null; banner.classList.remove("on"); }
    function flash(text) { showBanner("info", text, []); hideTimer = setTimeout(hideBanner, 4000); }
    function refreshUI() {
      var show = !!store && CFG.available.length > 0;
      dlBtn.classList.toggle("ecolia-off", !show);
      dlBtn.classList.toggle("ecolia-full", dl.state === "full");
      dlBtn.innerHTML = dl.state === "full" ? OK : DL;
      dlBtn.setAttribute("aria-label", dl.state === "full" ? "Audios téléchargés : supprimer" : "Télécharger les audios");
      dlBtn.title = dlBtn.getAttribute("aria-label");
    }
    function refreshCacheState(done) {
      if (!store) { dl.state = "none"; refreshUI(); if (done) done(); return; }
      store.list().then(function (ok) {
        dl.cached = ok.length;
        dl.state = dl.cached === 0 ? "none" : (dl.cached >= CFG.available.length ? "full" : "partial");
      }).catch(function () { dl.state = "none"; }).then(function () { refreshUI(); if (done) done(); });
    }
    function askDownload(fromInvite) {
      var left = CFG.available.length - dl.cached;
      var txt = dl.state === "partial" ? "Il reste " + left + " audio(s) à télécharger pour écouter ce cours sans internet." : "🔊 Télécharger les audios de ce cours (" + mo() + ") pour les écouter sans internet ? Wi-Fi recommandé.";
      showBanner(fromInvite ? "invite" : "confirm", txt, [
        { label: fromInvite ? "Plus tard" : "Annuler", fn: function () { if (fromInvite) lsSet(LATER, "1"); hideBanner(); } },
        { label: "Télécharger", pri: true, fn: startDownload }
      ]);
    }
    function askDelete() {
      showBanner("confirm", "Supprimer les audios téléchargés de ce cours (" + mo() + ") ? Vous pourrez toujours les écouter en ligne.", [
        { label: "Annuler", fn: hideBanner }, { label: "Supprimer", pri: true, fn: doDelete }
      ]);
    }
    function startDownload() {
      if (dl.busy || !store) return;
      dl.busy = true; dl.cancel = false;
      var total = CFG.available.length, done = 0, quota = false, fails = 0, todo = [];
      store.list().then(function (have) {
        CFG.available.forEach(function (n) { if (have.indexOf(n) < 0) todo.push(n); });
        done = total - todo.length;
        function paint() {
          var msg = "Téléchargement des audios : " + done + " / " + total;
          if (bnMode === "progress") { txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%"; }
          else { showBanner("progress", msg, [{ label: "Annuler", fn: function () { dl.cancel = true; } }], Math.round(done / total * 100)); }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez." : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER); refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }
    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);
      else speakFrom(tk);
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }
        if (store && dl.state !== "none") {
          store.get(i + 1).then(function (b) {
            if (tok !== st.playTok) return;
            if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
            else startAudio(u, tok);
          }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);
      } else if (!playVoice()) {
        st.auto = false;
      }
    }
    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false; st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll(); audio.removeAttribute("data-src"); freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);
      else st.auto = false;
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () { if (st.mode === "mp3" && playVoice()) return; setIcon(false); st.auto = false; });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
