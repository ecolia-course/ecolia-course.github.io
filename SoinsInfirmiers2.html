{
    title: "Sommaire — Soins Infirmiers",
    content: `
<div class="bloc theorie"><div class="bloc-label">Sommaire</div>
<p>Ce cours de soins infirmiers couvre cinq leçons essentielles : les concepts fondamentaux (santé, maladie, soin, nursing), la démarche de soins, les besoins fondamentaux, les soins de base et l'hygiène hospitalière, et l'éthique et la relation de soin.</p>
<p><strong>Note :</strong> la progression s'appuie sur le programme révisé « Cours de Soins Infirmiers Généraux » (RDC, 2005) et sur le protocole d'amélioration de la qualité des soins infirmiers de l'Ordre des Infirmiers RDC. Le programme officiel détaillé pour la seule 2e année des humanités techniques (soins infirmiers) n'a pas été consulté ; les protocoles doivent être vérifiés auprès des directives actualisées du Ministère de la Santé RDC et de l'OMS.</p>
<ul>
<li>Leçon 1 — Concepts fondamentaux : santé, maladie, soin et nursing</li>
<li>Leçon 2 — La démarche de soins</li>
<li>Leçon 3 — Les besoins fondamentaux de la personne</li>
<li>Leçon 4 — Soins de base et hygiène hospitalière</li>
<li>Leçon 5 — Éthique et relation de soin</li>
</ul>
<p>Une évaluation finale de 20 questions couvre l'ensemble des leçons.</p>
</div>
<div class="sources"><strong>Sources :</strong> « Cours de Soins Infirmiers Généraux » (programme révisé, RDC, 2005) ; « Protocole d'amélioration de la qualité des soins infirmiers » (Ordre des Infirmiers RDC) ; « Guide clinique pour l'élaboration de plans thérapeutiques infirmiers en santé mentale » (RDC).</div>
    `
},
{
    title: "Leçon 1 — Concepts fondamentaux",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Le soin infirmier se limite-t-il au geste technique ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Définir santé, maladie, soin et nursing. Distinguer les aspects du nursing. Comprendre le rôle global de l'infirmier. Prérequis : notions de biologie humaine.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Santé (OMS) :</strong> état de complet bien-être physique, mental et social, et non simplement l'absence de maladie.</p>
<p><strong>Maladie :</strong> altération de l'état de santé.</p>
<p><strong>Soin :</strong> ensemble des actes visant à maintenir ou restaurer la santé, à soulager la douleur, à accompagner.</p>
<p><strong>Nursing :</strong> pratique professionnelle qui comprend trois aspects :</p>
<ul>
<li><strong>Préventif :</strong> prévenir les maladies (vaccination, hygiène).</li>
<li><strong>Éducatif :</strong> informer et éduquer le patient et sa famille.</li>
<li><strong>Curatif :</strong> traiter les maladies (pansements, injections).</li>
</ul>
<p><strong>Rôle de l'infirmier :</strong> professionnel de santé qui accompagne la personne dans toutes ses dimensions (physique, psychologique, sociale, spirituelle).</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Santé :</strong> bien-être global. <strong>Nursing :</strong> pratique de soin globale. <strong>Prévention :</strong> ensemble des mesures pour éviter la maladie.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Adopter une vision globale du patient. Ne pas réduire le soin à l'acte technique. Intégrer la prévention et l'éducation à chaque contact.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Dans un centre de santé de Kinshasa, l'infirmier qui explique à une mère l'importance de la vaccination fait de l'éducation sanitaire (aspect éducatif du nursing).</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quels sont les trois aspects du nursing ? <strong>Ex. 2 :</strong> Que signifie « santé » selon l'OMS ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Préventif, éducatif, curatif. <strong>2)</strong> Un état de complet bien-être physique, mental et social.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le soin infirmier est global : il englobe la prévention, l'éducation et le curatif.</p></div>

<div class="sources"><strong>Sources :</strong> Cours de Soins Infirmiers Généraux (RDC, 2005).</div>
    `
},
{
    title: "Leçon 2 — La démarche de soins",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi l'infirmier ne peut-il pas improviser ses soins ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les étapes de la démarche. Comprendre le diagnostic infirmier. Structurer les soins. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Démarche de soins :</strong> méthode scientifique qui structure l'action infirmière en cinq étapes :</p>
<ol>
<li><strong>Collecte de données :</strong> observer, interroger, examiner.</li>
<li><strong>Identification des problèmes :</strong> poser un diagnostic infirmier.</li>
<li><strong>Planification :</strong> fixer les objectifs et les interventions.</li>
<li><strong>Exécution :</strong> réaliser les soins.</li>
<li><strong>Évaluation :</strong> vérifier les résultats.</li>
</ol>
<p><strong>Diagnostic infirmier :</strong> identification des problèmes de santé que l'infirmier peut traiter (douleur, risque d'infection, etc.).</p>
<p><strong>Dossier de soins :</strong> document qui trace la démarche et assure la continuité.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Démarche de soins :</strong> méthode structurée. <strong>Diagnostic infirmier :</strong> problème identifié par l'infirmier. <strong>Continuité des soins :</strong> cohérence entre les intervenants.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Ne pas sauter d'étape. Adapter les soins aux données recueillies. Évaluer après chaque intervention. Tracer les soins.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Face à un patient fiévreux, l'infirmier collecte les données (température, fréquence cardiaque), identifie le problème (hyperthermie), planifie les soins (antipyrétique, hydratation), exécute et évalue.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Citer les cinq étapes de la démarche de soins. <strong>Ex. 2 :</strong> Pourquoi la traçabilité est-elle importante ?</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Collecte, diagnostic, planification, exécution, évaluation. <strong>2)</strong> Pour assurer la continuité et permettre le contrôle de qualité.</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La démarche de soins est la colonne vertébrale de la pratique infirmière.</p></div>

<div class="sources"><strong>Sources :</strong> Cours de Soins Infirmiers Généraux (RDC, 2005).</div>
    `
},
{
    title: "Leçon 3 — Les besoins fondamentaux",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi l'infirmier ne fait-il pas tout à la place du patient ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre la classification de Henderson et la pyramide de Maslow. Identifier les facteurs qui modifient les besoins. Aider sans substituer. Prérequis : leçons 1 et 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Besoins fondamentaux :</strong> exigences essentielles pour vivre et se développer.</p>
<p><strong>Classification de Virginia Henderson (14 besoins) :</strong> respirer, boire et manger, éliminer, se mouvoir, dormir, se vêtir, maintenir la température, hygiène, éviter les dangers, communiquer, pratiquer sa religion, travailler, se recréer, apprendre.</p>
<p><strong>Pyramide de Maslow :</strong> hiérarchie des besoins (physiologiques, sécurité, appartenance, estime, réalisation de soi).</p>
<p><strong>Facteurs qui modifient les besoins :</strong> âge, état physique, pathologie, contexte social et culturel.</p>
<p><strong>Dépendance / indépendance :</strong> l'objectif est de restaurer l'indépendance, pas de substituer.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Besoin fondamental :</strong> exigence essentielle. <strong>Dépendance :</strong> incapacité à satisfaire seul un besoin. <strong>Indépendance :</strong> capacité à satisfaire soi-même ses besoins.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Identifier les besoins non satisfaits. Proposer une aide adaptée. Encourager l'autonomie. Ne pas faire à la place du patient ce qu'il peut faire seul.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Un patient hospitalisé à Lubumbashi ne peut pas se nourrir seul : l'infirmier l'aide à satisfaire son besoin de boire et manger, tout en respectant son autonomie.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Combien de besoins Henderson identifie-t-il ? <strong>Ex. 2 :</strong> Citer deux facteurs qui modifient les besoins.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> 14 besoins. <strong>2)</strong> L'âge et la pathologie (autres réponses possibles).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'infirmier ne se substitue pas à la personne : il l'aide à retrouver son indépendance.</p></div>

<div class="sources"><strong>Sources :</strong> Cours de Soins Infirmiers Généraux (RDC, 2005).</div>
    `
},
{
    title: "Leçon 4 — Soins de base et hygiène hospitalière",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi le lavage des mains est-il le premier geste de soin ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre l'asepsie. Réaliser les soins de base. Prévenir les infections. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Hygiène des mains :</strong> geste prioritaire, avant et après chaque soin ; friction hydro-alcoolique ou lavage à l'eau et au savon.</p>
<p><strong>Asepsie :</strong> absence de micro-organismes pathogènes. <strong>Antisepsie :</strong> destruction des micro-organismes sur une surface vivante.</p>
<p><strong>Soins de confort :</strong> toilette, changement de position, réfection du lit.</p>
<p><strong>Prévention des escarres :</strong> changements de position réguliers, surveillance de la peau, matelas adapté.</p>
<p><strong>Gestion des déchets :</strong> tri (ordures ménagères, déchets contaminés, objets piquants/tranchants).</p>
<p><strong>Infections nosocomiales :</strong> infections contractées à l'hôpital ; prévention par l'hygiène.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Asepsie :</strong> absence de germes. <strong>Antisepsie :</strong> désinfection sur tissu vivant. <strong>Escarre :</strong> lésion cutanée due à une pression prolongée.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Lavage des mains systématique. Changes réguliers. Mobilisation adaptée. Tri rigoureux des déchets.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Le lavage des mains avant et après chaque soin dans un hôpital de Kinshasa réduit la transmission des infections.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Quel est le geste d'hygiène prioritaire ? <strong>Ex. 2 :</strong> Citer deux mesures de prévention des escarres.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> L'hygiène des mains. <strong>2)</strong> Changements de position et surveillance de la peau (autres réponses possibles).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'hygiène est le premier soin : elle protège le patient et le soignant.</p></div>

<div class="sources"><strong>Sources :</strong> Cours de Soins Infirmiers Généraux (RDC, 2005) ; directives OMS sur l'hygiène des mains.</div>
    `
},
{
    title: "Leçon 5 — Éthique et relation de soin",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Un soignant peut-il divulguer l'état de santé d'un patient ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre le secret professionnel. Respecter l'autonomie du patient. Accompagner la fin de vie. Prérequis : leçons 1 à 4.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Secret professionnel :</strong> obligation de ne pas divulguer les informations relatives à la santé d'un patient.</p>
<p><strong>Consentement :</strong> accord libre et éclairé du patient avant tout soin.</p>
<p><strong>Respect de la dignité :</strong> traiter le patient comme une personne, pas comme un objet de soin.</p>
<p><strong>Relation d'aide :</strong> écoute, empathie, soutien.</p>
<p><strong>Fin de vie :</strong> accompagnement de la personne et de sa famille, soulagement de la douleur, respect des croyances.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>

onnées recueillies. Évaluer après chaque intervention. Tracer les soins. Exemple. Face à un patient fiévreux, l'infirmier collecte les données (température, fréquence cardiaque), identifie le problème (hyperthermie), planifie les soins (antipyrétique, hydratation), exécute et évalue. Exercices. Ex. 1: Citer les cinq étapes de la démarche de soins. Ex. 2: Pourquoi la traçabilité est-elle importante? Corrigé. 1) Collecte, diagnostic, planification, exécution, évaluation. 2) Pour assurer la continuité et permettre le contrôle de qualité. À retenir. La démarche de soins est la colonne vertébrale de la pratique infirmière."]],"4":[["fr","Leçon 3, Les besoins fondamentaux. Situation. « Pourquoi l'infirmier ne fait-il pas tout à la place du patient? ». Objectifs. Comprendre la classification de Henderson et la pyramide de Maslow. Identifier les facteurs qui modifient les besoins. Aider sans substituer. Prérequis: leçons 1 et 2. Théorie. Besoins fondamentaux: exigences essentielles pour vivre et se développer. Classification de Virginia Henderson (14 besoins): respirer, boire et manger, éliminer, se mouvoir, dormir, se vêtir, maintenir la température, hygiène, éviter les dangers, communiquer, pratiquer sa religion, travailler, se recréer, apprendre. Pyramide de Maslow: hiérarchie des besoins (physiologiques, sécurité, appartenance, estime, réalisation de soi). Facteurs qui modifient les besoins: âge, état physique, pathologie, contexte social et culturel. Dépendance ou indépendance: l'objectif est de restaurer l'indépendance, pas de substituer. Définitions. Besoin fondamental: exigence essentielle. Dépendance: incapacité à satisfaire seul un besoin. Indépendance: capacité à satisfaire soi-même ses besoins. Méthodes et règles. Identifier les besoins non satisfaits. Proposer une aide adaptée. Encourager l'autonomie. Ne pas faire à la place du patient ce qu'il peut faire seul. Exemple. Un patient hospitalisé à Lubumbashi ne peut pas se nourrir seul: l'infirmier l'aide à satisfaire son besoin de boire et manger, tout en respectant son autonomie. Exercices. Ex. 1: Combien de besoins Henderson identifie-t-il? Ex. 2: Citer deux facteurs qui modifient les besoins. Corrigé. 1) 14 besoins. 2) L'âge et la pathologie (autres réponses possibles). À retenir. L'infirmier ne se substitue pas à la personne: il l'aide à retrouver son indépendance."]],"5":[["fr","Leçon 4, Soins de base et hygiène hospitalière. Situation. « Pourquoi le lavage des mains est-il le premier geste de soin? ». Objectifs. Comprendre l'asepsie. Réaliser les soins de base. Prévenir les infections. Prérequis: leçons 1 à 3. Théorie. Hygiène des mains: geste prioritaire, avant et après chaque soin; friction hydro-alcoolique ou lavage à l'eau et au savon. Asepsie: absence de micro-organismes pathogènes. Antisepsie: destruction des micro-organismes sur une surface vivante. Soins de confort: toilette, changement de position, réfection du lit. Prévention des escarres: changements de position réguliers, surveillance de la peau, matelas adapté. Gestion des déchets: tri (ordures ménagères, déchets contaminés, objets piquants ou tranchants). Infections nosocomiales: infections contractées à l'hôpital; prévention par l'hygiène. Définitions. Asepsie: absence de germes. Antisepsie: désinfection sur tissu vivant. Escarre: lésion cutanée due à une pression prolongée. Méthodes et règles. Lavage des mains systématique. Changes réguliers. Mobilisation adaptée. Tri rigoureux des déchets. Exemple. Le lavage des mains avant et après chaque soin dans un hôpital de Kinshasa réduit la transmission des infections. Exercices. Ex. 1: Quel est le geste d'hygiène prioritaire? Ex. 2: Citer deux mesures de prévention des escarres. Corrigé. 1) L'hygiène des mains. 2) Changements de position et surveillance de la peau (autres réponses possibles). À retenir. L'hygiène est le premier soin: elle protège le patient et le soignant."]],"6":[["fr","Leçon 5, Éthique et relation de soin. Situation. « Un soignant peut-il divulguer l'état de santé d'un patient? ». Objectifs. Comprendre le secret professionnel. Respecter l'autonomie du patient. Accompagner la fin de vie. Prérequis: leçons 1 à 4. Théorie. Secret professionnel: obligation de ne pas divulguer les informations relatives à la santé d'un patient. Consentement: accord libre et éclairé du patient avant tout soin. Respect de la dignité: traiter le patient comme une personne, pas comme un objet de soin. Relation d'aide: écoute, empathie, soutien. Fin de vie: accompagnement de la personne et de sa famille, soulagement de la douleur, respect des croyances. Définitions. Secret professionnel: confidentialité des informations. Consentement: accord libre et éclairé. Empathie: capacité à comprendre les émotions de l'autre. Méthodes et règles. Ne pas divulguer les informations de santé. Obtenir le consentement. Écouter sans juger. Respecter les croyances et la dignité. Exemple. Un infirmier qui garde le secret sur l'état de santé d'un patient et qui l'écoute sans jugement respecte la déontologie professionnelle. Exercices. Ex. 1: Qu'est-ce que le secret professionnel? Ex. 2: Pourquoi le consentement est-il nécessaire? Corrigé. 1) L'obligation de ne pas divulguer les informations de santé. 2) Parce que le patient a le droit de décider de ce qui le concerne. À retenir. Le soin technique n'a de sens que dans une relation respectueuse de la personne."]],"7":[["fr","Évaluation finale, Soins Infirmiers. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 12 sur 20, tu as réussi."]]}};

        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
