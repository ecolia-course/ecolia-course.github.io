    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« L'éducation existe-t-elle avant l'école ? Comment les sociétés transmettaient-elles leur culture ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre l'éducation comme phénomène social universel. Distinguer éducation informelle et formelle. Connaître l'origine du mot « pédagogie ». Prérequis : notions de chronologie historique.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Éducation :</strong> phénomène social universel, présent dans toutes les sociétés humaines. Elle transmet les savoirs, les valeurs et les comportements de génération en génération.</p>
<p><strong>Deux formes :</strong></p>
<ul>
<li><strong>Éducation informelle :</strong> se fait dans la famille et la communauté, par imprégnation, imitation, contes, proverbes, initiation.</li>
<li><strong>Éducation formelle :</strong> se fait dans une institution spécialisée (l'école), avec un programme, des horaires et des enseignants.</li>
</ul>
<p><strong>Étymologie :</strong> « pédagogie » vient du grec <em>paidagōgia</em>. Le <em>paidagōgos</em> était, dans l'Antiquité grecque, un esclave chargé de conduire l'enfant à l'école et de veiller sur lui. Le sens a évolué vers « art d'élever et d'instruire les enfants ».</p>
<p><strong>Éducation traditionnelle africaine :</strong> orale, communautaire, fonctionnelle (on apprend en faisant), liée à la vie du groupe et à ses valeurs.</p>
<p><strong>Pourquoi l'école est-elle apparue ?</strong> Avec la complexification des sociétés (écriture, droit, religion, techniques), la transmission familiale ne suffisait plus : il fallait des institutions spécialisées.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Éducation informelle :</strong> transmission dans la vie quotidienne. <strong>Éducation formelle :</strong> transmission institutionnalisée. <strong>Pédagogue :</strong> à l'origine, esclave conduisant l'enfant ; aujourd'hui, professionnel de l'éducation.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Ne pas confondre éducation et scolarisation. Reconnaître la valeur éducative des traditions orales. Situer l'école dans une histoire longue de l'éducation.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>
<p>Dans les sociétés traditionnelles congolaises, l'éducation se transmettait par l'initiation, les contes, les proverbes et l'apprentissage des métiers au sein de la famille et du village. On apprenait en participant à la vie du groupe.</p></div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>
<p><strong>Ex. 1 :</strong> Que signifie étymologiquement « pédagogie » ? <strong>Ex. 2 :</strong> Citer deux formes d'éducation traditionnelle en Afrique.</p>
<details><summary>Corrigé</summary>
<p><strong>1)</strong> Conduite de l'enfant (du grec <em>paidagōgia</em>). <strong>2)</strong> L'initiation et les contes (autres réponses possibles : proverbes, apprentissage des métiers).</p>
</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>L'éducation précède l'école ; la pédagogie est née de la nécessité de conduire l'enfant vers le savoir.</p></div>

<div class="sources"><strong>Sources :</strong> Cours d'Histoire de la Pédagogie (ISP Kinshasa, 2022-2023) ; Cijika Kayombo, « Histoire de la pédagogie » (2020).</div>
    `

    title: "Leçon 2 — L'éducation dans l'Antiquité",

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi dit-on que la paideia grecque est l'ancêtre de notre idéal éducatif ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre l'idéal éducatif grec (paideia). Comparer Athènes et Sparte. Connaître l'éducation romaine. Prérequis : leçon 1.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Paideia :</strong> idéal grec de formation globale de l'homme et du citoyen. Elle combine éducation physique, musicale, intellectuelle et morale.</p>
<p><strong>Deux modèles grecs :</strong></p>
<ul>
<li><strong>Athènes :</strong> éducation équilibrée, formation du citoyen, développement de la raison, de la parole et de la culture.</li>
<li><strong>Sparte :</strong> éducation militaire, discipline, endurance, formation du soldat.</li>
</ul>
<p><strong>Le pédagogue à Athènes :</strong> esclave chargé de conduire l'enfant à l'école et de surveiller sa conduite. À ne pas confondre avec le maître.</p>
<p><strong>Éducation romaine :</strong> hérite de la Grèce et y ajoute le droit, la rhétorique et la langue latine. L'école romaine forme l'orateur et le citoyen romain.</p>
<p><strong>Héritage :</strong> l'idée d'une formation globale, civique et culturelle de la personne est un héritage de l'Antiquité.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>Paideia :</strong> idéal grec de formation. <strong>Citoyen :</strong> membre de la cité, avec droits et devoirs. <strong>Rhétorique :</strong> art de bien parler.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>

</details>
</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>La paideia grecque est l'ancêtre de l'idéal de formation globale et citoyenne.</p></div>

<div class="sources"><strong>Sources :</strong> Cours d'Histoire de la Pédagogie (ISP Kinshasa, 2022-2023).</div>

<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Comment l'Église a-t-elle façonné l'école ? Pourquoi la Renaissance marque-t-elle un tournant ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Comprendre l'éducation médiévale (Église, écoles monastiques, universités). Découvrir la pédagogie de la Renaissance (humanisme). Prérequis : leçon 2.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Moyen Âge :</strong> l'éducation est dominée par l'Église.</p>
<ul>
<li><strong>Écoles monastiques :</strong> forment les moines (lecture, écriture, chant, Écriture sainte).</li>
<li><strong>Écoles cathédrales :</strong> forment le clergé séculier.</li>
<li><strong>Universitas :</strong> naissance des universités (Bologne, Paris, Oxford) aux XIIe-XIIIe siècles.</li>
</ul>
<p><strong>Trivium et quadrivium :</strong> les sept arts libéraux. Trivium : grammaire, rhétorique, dialectique. Quadrivium : arithmétique, géométrie, musique, astronomie.</p>
<p><strong>Pédagogie chrétienne :</strong> transmission de la foi, mémorisation, catéchisme.</p>
<p><strong>Renaissance (XVe-XVIe s.) :</strong> l'humanisme replace l'homme au centre de l'éducation. Retour aux textes anciens (grecs et latins). Pédagogues : Érasme (« éducation libérale »), Montaigne (critique du bourrage de crâne, éloge de l'expérience), Rabelais.</p>
<p><strong>Héritage :</strong> l'introduction de l'école moderne en Afrique par les missionnaires est un héritage direct de la pédagogie chrétienne.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>
<p><strong>École monastique :</strong> école liée à un monastère. <strong>Trivium :</strong> grammaire, rhétorique, dialectique. <strong>Humanisme :</strong> mouvement centré sur l'homme et les textes anciens.</p></div>

<div class="bloc theorie"><div class="bloc-label">Méthodes et règles</div>
<p>Comparer le programme médiéval (trivium) et le programme humaniste. Situer la Renaissance dans l'histoire des idées éducatives.</p></div>

<div class="bloc exemple"><div class="bloc-label">Exemple</div>

<div class="bloc theorie"><div class="bloc-label">Exercices</div>

<div class="bloc resume"><div class="bloc-label">À retenir</div><p>Le Moyen Âge a institutionnalisé l'école ; la Renaissance a réintroduit l'idée d'une éducation pour l'homme.</p></div>

<div class="sources"><strong>Sources :</strong> Cours d'Histoire de la Pédagogie (ISP Kinshasa, 2022-2023).</div>

{
    title: "Leçon 4 — Les grands pédagogues modernes",
    content: `
<div class="bloc cas"><div class="bloc-label">Situation</div><p>« Pourquoi Comenius, Rousseau, Freinet et Montessori ont-ils transformé l'école ? »</p></div>

<div class="bloc theorie"><div class="bloc-label">Objectifs</div><p>Connaître les grands pédagogues modernes et leurs apports. Situer leurs idées dans l'histoire. Proposer des adaptations au contexte RDC. Prérequis : leçons 1 à 3.</p></div>

<div class="bloc theorie"><div class="bloc-label">Théorie</div>
<p><strong>Comenius (1592-1670) :</strong> père de la pédagogie moderne. Œuvre : <em>Didactica Magna</em>. Idées : « enseigner tout à tous », intuition sensible, progression du concret à l'abstrait.</p>
<p><strong>Rousseau (1712-1778) :</strong> <em>Émile ou De l'éducation</em>. Éducation naturelle, respect de la spécificité de l'enfant, éducation négative (laisser l'enfant se développer).</p>
<p><strong>Pestalozzi (1746-1827) :</strong> éducation par le cœur, la tête et la main. Valorisation de l'expérience et de l'observation.</p>
<p><strong>Decroly (1871-1932) :</strong> centres d'intérêt, méthode globale de lecture.</p>
<p><strong>Montessori (1870-1952) :</strong> matériel sensoriel, autonomie de l'enfant, respect de son rythme.</p>
<p><strong>Freinet (1896-1966) :</strong> imprimerie à l'école, texte libre, coopération, tâtonnement expérimental.</p>
<p><strong>Point commun :</strong> tous placent l'élève au centre de l'apprentissage et insistent sur son activité.</p>
</div>

<div class="bloc theorie"><div class="bloc-label">Définitions</div>

  var CFG = {"code":"HistoirePedagogie2","base":"https://ecolia-course.github.io/ecolia-media/audio_files/","available":[1,2,3,4,5,6,7],"count":7,"sizeMo":8,"sizes":{"1":597312,"2":1447104,"3":1171200,"4":1322880,"5":1401792,"6":1365696,"7":94272},"fallback":{"1":[["fr","Sommaire, Histoire de la Pédagogie. Sommaire. Ce cours d'histoire de la pédagogie couvre cinq leçons essentielles: les origines de l'éducation, l'éducation dans l'Antiquité (Grèce et Rome), l'éducation au Moyen Âge et à la Renaissance, les grands pédagogues modernes, et l'éducation en R D C de la période coloniale à aujourd'hui. Note: le programme officiel R D C spécifique à l'Histoire de la Pédagogie pour la 2e année HP n'a pas été retrouvé dans son intégralité. La progression s'appuie sur le cours d'Histoire de la Pédagogie de l'ISP Catholique de Kinshasa (2022-2023, adapté au niveau secondaire) et sur l'ouvrage de Cijika Kayombo (2020) sur la pédagogie traditionnelle africaine. Leçon 1, Origines et débuts de l'éducation. Leçon 2, L'éducation dans l'Antiquité. Leçon 3, L'éducation au Moyen Âge et à la Renaissance. Leçon 4, Les grands pédagogues modernes. Leçon 5, L'éducation en R D C. Une évaluation finale de 20 questions couvre l'ensemble des leçons."]],"2":[["fr","Leçon 1, Origines et débuts de l'éducation. Situation. « L'éducation existe-t-elle avant l'école? Comment les sociétés transmettaient-elles leur culture? ». Objectifs. Comprendre l'éducation comme phénomène social universel. Distinguer éducation informelle et formelle. Connaître l'origine du mot « pédagogie ». Prérequis: notions de chronologie historique. Théorie. Éducation: phénomène social universel, présent dans toutes les sociétés humaines. Elle transmet les savoirs, les valeurs et les comportements de génération en génération. Deux formes: Éducation informelle: se fait dans la famille et la communauté, par imprégnation, imitation, contes, proverbes, initiation. Éducation formelle: se fait dans une institution spécialisée (l'école), avec un programme, des horaires et des enseignants. Étymologie: « pédagogie » vient du grec paidagōgia. Le paidagōgos était, dans l'Antiquité grecque, un esclave chargé de conduire l'enfant à l'école et de veiller sur lui. Le sens a évolué vers « art d'élever et d'instruire les enfants ». Éducation traditionnelle africaine: orale, communautaire, fonctionnelle (on apprend en faisant), liée à la vie du groupe et à ses valeurs. Pourquoi l'école est-elle apparue? Avec la complexification des sociétés (écriture, droit, religion, techniques), la transmission familiale ne suffisait plus: il fallait des institutions spécialisées. Définitions. Éducation informelle: transmission dans la vie quotidienne. Éducation formelle: transmission institutionnalisée. Pédagogue: à l'origine, esclave conduisant l'enfant; aujourd'hui, professionnel de l'éducation. Méthodes et règles. Ne pas confondre éducation et scolarisation. Reconnaître la valeur éducative des traditions orales. Situer l'école dans une histoire longue de l'éducation. Exemple. Dans les sociétés traditionnelles congolaises, l'éducation se transmettait par l'initiation, les contes, les proverbes et l'apprentissage des métiers au sein de la famille et du village. On apprenait en participant à la vie du groupe. Exercices. Ex. 1: Que signifie étymologiquement « pédagogie »? Ex. 2: Citer deux formes d'éducation traditionnelle en Afrique. Corrigé. 1) Conduite de l'enfant (du grec paidagōgia). 2) L'initiation et les contes (autres réponses possibles: proverbes, apprentissage des métiers). À retenir. L'éducation précède l'école; la pédagogie est née de la nécessité de conduire l'enfant vers le savoir."]],"3":[["fr","Leçon 2, L'éducation dans l'Antiquité. Situation. « Pourquoi dit-on que la paideia grecque est l'ancêtre de notre idéal éducatif? ». Objectifs. Comprendre l'idéal éducatif grec (paideia). Comparer Athènes et Sparte. Connaître l'éducation romaine. Prérequis: leçon 1. Théorie. Paideia: idéal grec de formation globale de l'homme et du citoyen. Elle combine éducation physique, musicale, intellectuelle et morale. Deux modèles grecs: Athènes: éducation équilibrée, formation du citoyen, développement de la raison, de la parole et de la culture. Sparte: éducation militaire, discipline, endurance, formation du soldat. Le pédagogue à Athènes: esclave chargé de conduire l'enfant à l'école et de surveiller sa conduite. À ne pas confondre avec le maître. Éducation romaine: hérite de la Grèce et y ajoute le droit, la rhétorique et la langue latine. L'école romaine forme l'orateur et le citoyen romain. Héritage: l'idée d'une formation globale, civique et culturelle de la personne est un héritage de l'Antiquité. Définitions. Paideia: idéal grec de formation. Citoyen: membre de la cité, avec droits et devoirs. Rhétorique: art de bien parler. Méthodes et règles. Comparer Athènes et Sparte dans un tableau. Situer l'idéal de la paideia par rapport aux objectifs de l'école congolaise actuelle. Exemple. L'idéal de la paideia grecque (former un homme équilibré et un citoyen responsable) rejoint l'ambition de l'école congolaise de former un citoyen utile à la société. Mais le contexte et les moyens diffèrent profondément. Exercices. Ex. 1: Qu'est-ce que la paideia? Ex. 2: Citer deux différences entre l'éducation athénienne et spartiate. Corrigé. 1) L'idéal grec de formation globale de l'homme et du citoyen. 2) Athènes: équilibrée et civique; Sparte: militaire et disciplinaire (autres réponses possibles). À retenir. La paideia grecque est l'ancêtre de l'idéal de formation globale et citoyenne."]],"4":[["fr","Leçon 3, L'éducation au Moyen Âge et à la Renaissance. Situation. « Comment l'Église a-t-elle façonné l'école? Pourquoi la Renaissance marque-t-elle un tournant? ». Objectifs. Comprendre l'éducation médiévale (Église, écoles monastiques, universités). Découvrir la pédagogie de la Renaissance (humanisme). Prérequis: leçon 2. Théorie. Moyen Âge: l'éducation est dominée par l'Église. Écoles monastiques: forment les moines (lecture, écriture, chant, Écriture sainte). Écoles cathédrales: forment le clergé séculier. Universitas: naissance des universités (Bologne, Paris, Oxford) aux XIIe-XIIIe siècles. Trivium et quadrivium: les sept arts libéraux. Trivium: grammaire, rhétorique, dialectique. Quadrivium: arithmétique, géométrie, musique, astronomie. Pédagogie chrétienne: transmission de la foi, mémorisation, catéchisme. Renaissance (XVe-XVIe s.): l'humanisme replace l'homme au centre de l'éducation. Retour aux textes anciens (grecs et latins). Pédagogues: Érasme (« éducation libérale »), Montaigne (critique du bourrage de crâne, éloge de l'expérience), Rabelais. Héritage: l'introduction de l'école moderne en Afrique par les missionnaires est un héritage direct de la pédagogie chrétienne. Définitions. École monastique: école liée à un monastère. Trivium: grammaire, rhétorique, dialectique. Humanisme: mouvement centré sur l'homme et les textes anciens. Méthodes et règles. Comparer le programme médiéval (trivium) et le programme humaniste. Situer la Renaissance dans l'histoire des idées éducatives. Exemple. Érasme et Montaigne sont des pédagogues de la Renaissance: Érasme défend une éducation libérale et chrétienne; Montaigne critique la mémorisation mécanique et valorise l'expérience et le jugement. Exercices. Ex. 1: Qu'est-ce que le trivium? Ex. 2: Citer deux apports de la Renaissance à la pédagogie. Corrigé. 1) Grammaire, rhétorique, dialectique. 2) Retour aux textes anciens et valorisation de l'expérience (autres réponses possibles). À retenir. Le Moyen Âge a institutionnalisé l'école; la Renaissance a réintroduit l'idée d'une éducation pour l'homme."]],"5":[["fr","Leçon 4, Les grands pédagogues modernes. Situation. « Pourquoi Comenius, Rousseau, Freinet et Montessori ont-ils transformé l'école? ». Objectifs. Connaître les grands pédagogues modernes et leurs apports. Situer leurs idées dans l'histoire. Proposer des adaptations au contexte R D C. Prérequis: leçons 1 à 3. Théorie. Comenius (1592-1670): père de la pédagogie moderne. Œuvre: Didactica Magna. Idées: « enseigner tout à tous », intuition sensible, progression du concret à l'abstrait. Rousseau (1712-1778): Émile ou De l'éducation. Éducation naturelle, respect de la spécificité de l'enfant, éducation négative (laisser l'enfant se développer). Pestalozzi (1746-1827): éducation par le cœur, la tête et la main. Valorisation de l'expérience et de l'observation. Decroly (1871-1932): centres d'intérêt, méthode globale de lecture. Montessori (1870-1952): matériel sensoriel, autonomie de l'enfant, respect de son rythme. Freinet (1896-1966): imprimerie à l'école, texte libre, coopération, tâtonnement expérimental. Point commun: tous placent l'élève au centre de l'apprentissage et insistent sur son activité. Définitions. Pédagogie active: approche où l'élève est acteur. Éducation naturelle: respect du développement spontané de l'enfant. Matériel sensoriel: objets concrets pour apprendre. Méthodes et règles. Associer chaque pédagogue à une idée principale. Proposer des adaptations réalistes au contexte congolais (matériaux locaux, effectifs élevés). Exemple. La pédagogie Freinet (texte libre, coopération) peut être adaptée en R D C avec des moyens simples: un cahier de vie de classe, des exposés, des travaux de groupe. La pédagogie Montessori avec du matériel local (bâtonnets, perles, cartons) pour les apprentissages numériques. Exercices. Ex. 1: Qui a écrit Émile ou De l'éducation? Ex. 2: Citer deux apports de Freinet. Corrigé. 1) Rousseau. 2) Le texte libre et l'imprimerie à l'école (autres réponses possibles: la coopération). À retenir. Les pédagogues modernes ont en commun de placer l'élève au centre de l'apprentissage."]],"6":[["fr","Leçon 5, L'éducation en R D C: de la période coloniale à aujourd'hui. Situation. « Pourquoi l'école congolaise porte-t-elle encore les traces de son histoire coloniale? ». Objectifs. Comprendre la politique scolaire coloniale. Connaître les réformes post-indépendance. Identifier les défis actuels. Valoriser l'héritage de la pédagogie traditionnelle. Prérequis: leçons 1 à 4. Théorie. Période coloniale: introduction de l'école moderne par les missions chrétiennes (catholiques et protestantes). Écoles inégalitaires: Écoles pour « évolués » (formation d'auxiliaires de l'administration). Accent sur la lecture, l'écriture, le calcul et le catéchisme. Marginalisation de la culture locale. Après l'indépendance (1960): « congolisation » de l'enseignement, nationalisation, réformes successives (1961, 1986). Loi-cadre n° 86 sur 005 du 22 septembre 1986: texte structurant de l'enseignement national. Défis actuels: accès, qualité, équité, financement, formation des enseignants, gratuité de l'enseignement primaire, classes pléthoriques. Pédagogie traditionnelle africaine: ressource éducative à valoriser (oralité, communautarisme, lien avec la vie). Définitions. Congolisation: remplacement des cadres étrangers par des Congolais. Loi-cadre: texte fondamental qui structure un secteur. Gratuité: politique qui supprime les frais scolaires à charge des familles. Méthodes et règles. Construire une frise chronologique. Situer la loi-cadre de 1986 dans cette frise. Relier les défis actuels à l'héritage historique. Exemple. La loi-cadre de 1986 a tenté d'unifier et de démocratiser l'enseignement. Aujourd'hui, la politique de gratuité de l'enseignement primaire s'inscrit dans la continuité de cette ambition d'équité. Exercices. Ex. 1: Quel a été le rôle des missions dans l'école coloniale? Ex. 2: Citer deux défis actuels de l'école congolaise. Corrigé. 1) Elles ont introduit et géré l'école moderne. 2) Qualité et équité (autres réponses possibles: financement, gratuité, formation). À retenir. L'école congolaise est un héritage historique à comprendre pour mieux la transformer."]],"7":[["fr","Évaluation finale, Histoire de la Pédagogie. Évaluation. Choisis la bonne réponse. 1 point par bonne réponse. À partir de 12 sur 20, tu as réussi."]]}};

            txtEl.textContent = msg; barI.style.width = Math.round(done / total * 100) + "%";
          } else {
            showBanner("progress", msg, [
              { label: "Annuler", fn: function () { dl.cancel = true; } }
            ], Math.round(done / total * 100));
          }
        }
        paint();
        function worker() {
          if (dl.cancel || quota || !todo.length) return Promise.resolve();
          var n = todo.shift();
          return store.put(n).then(function () { done++; paint(); }).catch(function (e) {
            if (e && (e.name === "QuotaExceededError" || /quota/i.test(String(e.message)))) quota = true;
            fails++;
          }).then(worker);
        }
        return Promise.all([worker(), worker()]);
      }).catch(function () { fails++; }).then(function () {
        dl.busy = false;
        refreshCacheState(function () {
          if (dl.state === "full") flash("✓ Audios téléchargés : le cours se lit maintenant sans internet.");
          else if (dl.cancel) flash("Téléchargement interrompu (" + dl.cached + " / " + total + "). Vous pourrez reprendre plus tard.");
          else showBanner("error", quota ? "Espace insuffisant sur l'appareil. Libérez de la place puis réessayez."
            : "Certains audios n'ont pas pu être téléchargés (connexion ?).", [
            { label: "Fermer", fn: hideBanner }, { label: "Réessayer", pri: true, fn: startDownload }
          ]);
        });
      });
    }
    function doDelete() {
      if (!store) return;
      Promise.all(CFG.available.map(function (n) { return store.del(n); })).catch(function () {}).then(function () {
        lsDel(LATER);
        refreshCacheState(function () { flash("Audios supprimés de cet appareil."); });
      });
    }

    dlBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (dl.busy) return;
      if (dl.state === "full") askDelete(); else askDownload(false);
    });

    // ====================================================================
    //  Voix intégrée au téléphone (hors ligne, sans limite)
    // ====================================================================
    function pickVoice(lang) {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) {}
      var pre = lang === "en" ? "en" : "fr", best = null;
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if ((v.lang || "").toLowerCase().indexOf(pre) !== 0) continue;
        if (!best || (v.localService && !best.localService)) best = v;
      }
      return best;
    }
    function hardSplit(text, max) {
      var out = [];
      while (text.length > max) {
        var cut = text.lastIndexOf(" ", max);
        if (cut < 40) cut = max;
        out.push(text.slice(0, cut)); text = text.slice(cut).replace(/^\s+/, "");
      }
      if (text) out.push(text);
      return out;
    }
    function buildChunks(segs) {                  // morceaux courts : évite l'arrêt des longs textes sur Chrome
      var out = [];
      segs.forEach(function (s) {
        var cur2 = "", parts = s[1].match(/[^.!?;:]+[.!?;:]*\s*/g) || [s[1]];
        parts.forEach(function (p) {
          if (cur2 && (cur2 + p).length > 160) { out.push({ lang: s[0], text: cur2.trim() }); cur2 = p; }
          else cur2 += p;
        });
        if (cur2.trim()) out.push({ lang: s[0], text: cur2.trim() });
      });
      var res = [];
      out.forEach(function (c) { hardSplit(c.text, 190).forEach(function (t) { res.push({ lang: c.lang, text: t }); }); });
      return res;
    }
    function speakFrom(tk) {
      if (tk !== st.token) return;
      if (st.ci >= st.chunks.length) {
        st.speaking = false; st.mode = null; st.ci = 0; setIcon(false);
        if (st.auto) goNext();
        return;
      }
      var c = st.chunks[st.ci];
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = c.lang === "en" ? "en-US" : "fr-FR";
      var v = pickVoice(c.lang);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.95;
      u.onend = function () { if (tk !== st.token) return; st.ci++; speakFrom(tk); };
      u.onerror = function () { if (tk !== st.token) return; st.speaking = false; setIcon(false); st.auto = false; };
      synth.speak(u);
    }
    function startTts(from) {
      st.token++;
      var tk = st.token;
      st.mode = "tts"; st.speaking = true; st.ci = from || 0; setIcon(true);
      var busy = false;
      try { busy = synth.speaking || synth.pending; synth.cancel(); } catch (e) {}
      if (busy) setTimeout(function () { speakFrom(tk); }, 120);   // laisse cancel() se terminer
      else speakFrom(tk);                                          // sinon tout de suite (exigé par iOS)
    }
    function playVoice() {
      if (!(synth && fb(st.idx))) { st.auto = false; return false; }
      if (!st.chunks.length) st.chunks = buildChunks(fb(st.idx));
      startTts(st.ci);
      return true;
    }

    // ====================================================================
    //  Lecture
    // ====================================================================
    function freeBlob() { if (st.blobUrl) { try { URL.revokeObjectURL(st.blobUrl); } catch (e) {} st.blobUrl = null; } }
    function stopAll() {
      st.playTok++;
      try { audio.pause(); audio.currentTime = 0; } catch (e) {}
      st.token++;
      try { if (synth) synth.cancel(); } catch (e) {}
      st.speaking = false; st.mode = null; st.chunks = []; st.ci = 0;
      setIcon(false);
    }
    function pauseNow() {
      if (st.mode === "mp3") audio.pause();
      else if (st.mode === "tts") {
        st.token++;
        try { synth.cancel(); } catch (e) {}
        st.speaking = false; setIcon(false);      // st.ci conservé : la reprise repart de la phrase en cours
      }
    }
    function startAudio(src, tok) {
      if (tok !== st.playTok) return;
      if (audio.getAttribute("data-src") !== src) { audio.setAttribute("data-src", src); audio.src = src; }
      var p = audio.play();
      if (p && p.catch) p.catch(function (err) {
        console.warn("ECOLIA audio :", err);
        if (tok !== st.playTok) return;
        if (!(err && err.name === "NotAllowedError") && playVoice()) return;   // lecture impossible : voix du téléphone
        setIcon(false); st.auto = false;
      });
    }
    function playCurrent() {
      var i = st.idx;
      if (hasMp3(i)) {
        var tok = ++st.playTok, u = urlN(i + 1);
        st.mode = "mp3";
        if (!navigator.onLine && dl.state === "none") { st.mode = null; if (playVoice()) return; }   // hors ligne et non téléchargé
        if (store && dl.state !== "none") {                     // téléchargé : lecture locale, sans réseau
          store.get(i + 1)
            .then(function (b) {
              if (tok !== st.playTok) return;
              if (b) { freeBlob(); st.blobUrl = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })); startAudio(st.blobUrl, tok); }
              else startAudio(u, tok);
            }).catch(function () { startAudio(u, tok); });
        } else startAudio(u, tok);                              // sinon lecture en ligne (appel immédiat, exigé par iOS)
      } else if (!playVoice()) {
        st.auto = false;
      }
    }

    function onSlideChange(i) {
      var wasAdvancing = st.advancing;
      st.advancing = false;
      st.idx = i;
      btn.classList.toggle("ecolia-off", !hasAudio(i));
      stopAll();
      audio.removeAttribute("data-src");
      freeBlob();
      if (bnMode === "invite" && i !== 0) hideBanner();       // l'invitation n'apparaît qu'à la première slide
      if (wasAdvancing && st.auto) setTimeout(playCurrent, 500);   // enchaînement automatique
      else st.auto = false;                                         // changement manuel : on coupe tout
    }
    function goNext() {
      if (st.idx + 1 >= CFG.count) { st.auto = false; return; }
      st.advancing = true;
      if (typeof nextSlide === "function") nextSlide();
      else { var nb = document.getElementById("nextBtn"); if (nb) nb.click(); }
      setTimeout(function () { st.advancing = false; }, 4000);
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var i = cur();
      if (i !== st.idx) onSlideChange(i);
      if (isPlaying()) { st.auto = false; pauseNow(); }
      else { st.auto = true; playCurrent(); }
    });
    audio.addEventListener("play", function () { setIcon(true); });
    audio.addEventListener("pause", function () { if (st.mode === "mp3") setIcon(false); });
    audio.addEventListener("error", function () {
      if (st.mode === "mp3" && playVoice()) return;            // fichier introuvable / hors ligne : voix du téléphone
      setIcon(false); st.auto = false;
    });
    audio.addEventListener("ended", function () { setIcon(false); if (st.auto) goNext(); });
    window.addEventListener("pagehide", function () { stopAll(); freeBlob(); });

    // ---------- démarrage ----------
    refreshCacheState(function () {
      if (store && CFG.available.length && dl.state !== "full" && navigator.onLine && cur() === 0 && !lsGet(LATER)) askDownload(true);
    });
    st.idx = -1;
    setInterval(function () { var i = cur(); if (i !== st.idx) onSlideChange(i); }, 250);   // suit la slide affichée
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<!-- ECOLIA_AUDIO_PLAYER_END -->
